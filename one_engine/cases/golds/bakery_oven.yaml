# Gold "bakery_oven": the bakery with an owned oven already one year into its life, nine years,
# at two tax rates (cases/reference/golds/bakery_oven.yaml).
#
# Every amount is a gold input by name, or a formula over gold inputs (generator `gold`).
#   * the oven cost oven_cost, has a life of oven_life and is oven_elapsed years old: it is carried
#     in at its book value and depreciated straight-line over the years it has left;
#   * flour, bakers, rent and gas are paid in cash; no working capital;
#   * tax at tax_rate, paid within the year; the gold's "_hi" rows are the variant `hi`, at
#     tax_rate_hi.
gold: bakery_oven
entity: bakery
plant: gas_month
variants:
  hi: {values: {rate: tax_rate_hi}}
case:
  case: gold-bakery-oven
  periods: 9
  phases: [fund, operate, close, tax, settle]
  currency: XOF
  floors: {}
  generators:
    gold:
      kind: formulas
      periods: 9
      inputs: gold
      values:
        loaves: loaves_per_day * operating_days
        bakers_annual: bakers * baker_wage_month * months
        rent_annual: rent_month * months
        gas_annual: gas_month * months
        oven_book_value: oven_cost - (oven_cost - residual_value) * oven_elapsed / oven_life
        oven_life_left: oven_life - oven_elapsed
        rate: tax_rate
  opening:
    bakery:
      fixed_assets: {nature: asset, value: {generator: gold, output: oven_book_value}}
      cwip: {nature: asset, value: 0}           # nothing is bought: the register's source stays empty
      equity: {nature: equity, value: balancing}
  contracts:
    bread:
      type: offtake
      parties: {seller: bakery}
      terms: {volume: {generator: gold, output: loaves}, price: {generator: gold, output: price_per_loaf},
              payment_days: 0, days_per_year: {generator: gold, output: operating_days}, periods_per_year: 1, end: 8}
    flour:
      type: operating_cost
      parties: {payer: bakery}
      terms: {annual: 0, unit_rate: {generator: gold, output: flour_cost_per_loaf},
              volume: {generator: gold, output: loaves}, index: 1, periods_per_year: 1, start: 0, end: 8,
              vat_rate: 0, vat_refund_lag: 0, payment_days: 0, days_per_year: {generator: gold, output: operating_days}}
    bakers:
      type: operating_cost
      parties: {payer: bakery}
      terms: {annual: {generator: gold, output: bakers_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 8, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: operating_days}}
    rent:
      type: operating_cost
      parties: {payer: bakery}
      terms: {annual: {generator: gold, output: rent_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 8, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: operating_days}}
    gas:
      type: operating_cost
      parties: {payer: bakery}
      terms: {annual: {generator: gold, output: gas_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 8, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: operating_days}}
  rulebooks:
    assets:
      kind: asset_register
      entity: bakery
      phase: close
      from: cwip
      to: fixed_assets
      expense: depreciation
      disposal: disposal_loss
      in_service: 0
      dispose_at: 8
      life_periods: {generator: gold, output: oven_life_left}
      first_charge: in_service
    tax:
      kind: income_tax
      entity: bakery
      phase: tax
      expense: tax_expense
      payable: tax_payable
      rate: {generator: gold, output: rate}
      carry_forward_periods: null
      scheme:
        bread.revenue: taxable
        flour.expense: taxable
        bakers.expense: taxable
        rent.expense: taxable
        gas.expense: taxable
        depreciation: taxable
        disposal_loss: taxable
        tax_expense: non_deductible
    pay_tax:
      kind: settle
      entity: bakery
      cash: cash
      phase: settle
      accounts: [tax_payable]
  schemes:
    pnl:
      bread.revenue: revenue
      flour.expense: flour
      bakers.expense: labour
      rent.expense: rent
      gas.expense: gas
      depreciation: depreciation
      disposal_loss: depreciation
      tax_expense: tax
    cash_flow:
      bread.receivable: operating
      flour.payable: operating
      bakers.payable: operating
      rent.payable: operating
      gas.payable: operating
      vat_receivable: operating
      tax_payable: operating
      cwip: investing
  cuts:
    revenue: {kind: pnl, entity: bakery, scheme: pnl, include: [revenue]}
    flour: {kind: pnl, entity: bakery, scheme: pnl, include: [flour]}
    labour: {kind: pnl, entity: bakery, scheme: pnl, include: [labour]}
    rent: {kind: pnl, entity: bakery, scheme: pnl, include: [rent]}
    gas: {kind: pnl, entity: bakery, scheme: pnl, include: [gas]}
    ebitda: {kind: pnl, entity: bakery, scheme: pnl, include: [revenue, flour, labour, rent, gas]}
    depreciation: {kind: pnl, entity: bakery, scheme: pnl, include: [depreciation]}
    ebit: {kind: pnl, entity: bakery, scheme: pnl, include: [revenue, flour, labour, rent, gas, depreciation]}
    tax: {kind: pnl, entity: bakery, scheme: pnl, include: [tax]}
    nopat: {kind: pnl, entity: bakery, scheme: pnl, include: [revenue, flour, labour, rent, gas, depreciation, tax]}
    cfi: {entity: bakery, account: cash, scheme: cash_flow, include: [investing]}
    fcff: {entity: bakery, account: cash, scheme: cash_flow, include: [operating, investing]}
  measures: {}
trace:
  loaves_produced: {driver: gold.loaves}
  revenue: {cut: revenue}
  flour_cost: {cut: flour, sign: -1}
  labor_cost: {cut: labour, sign: -1}
  rent_cost: {cut: rent, sign: -1}
  gas_cost: {cut: gas, sign: -1}
  ebitda: {cut: ebitda}
  depreciation: {cut: depreciation, sign: -1}
  ebit: {cut: ebit}
  tax: {cut: tax, sign: -1}
  nopat: {cut: nopat}
  dna_addback: {cut: depreciation, sign: -1}
  nwc: {balance: bread.receivable - flour.payable - bakers.payable - rent.payable - gas.payable}
  delta_nwc: {change: bread.receivable - flour.payable - bakers.payable - rent.payable - gas.payable}
  capex: {cut: cfi, sign: -1}
  fcff: {cut: fcff}
  oven_nbv_open: {opening: fixed_assets}
  oven_nbv_close: {balance: fixed_assets}
  tax_hi: {variant: hi, cut: tax, sign: -1}
  nopat_hi_tax: {variant: hi, cut: nopat}
  fcff_hi_tax: {variant: hi, cut: fcff}

# esco deal "nyserda_green_bonds_2020a": NYSERDA's Residential Solar and Energy Efficiency Financing Green Revenue
# Bonds, Series 2020A, USD 16,690,000 delivered 14 Oct 2020, backed by the Loan Payments of 2,259 Program Loans (Official
# Statement dated 1 Oct 2020; cases/reference/esco/ontology/miniature/cases/nyserda_green_bonds_2020a-lod0.yaml; answer
# key cases/reference/esco/tests/test_lod0_numbers.py).
#
# The books are the Series 2020A trust estate's (the Authority pledges and assigns the Loan Payments to the Trustee).
# Every amount is a number of the case by name (generator `src`), in USD:
#   * periods are bond years: 0 is the Date of Issuance, 1 the first bond year (to 1 Oct 2021). The case holds the
#     issue and the first year only: the redemptions after it depend on Excess Revenues the OS does not print;
#   * the pledged pool comes in on the opening balance sheet at its Cutoff Date principal, by loan type
#     (on_bill_recovery__balance_usd, smart_energy__balance_usd), against the Authority's interest in the trust
#     estate (the balancing amount). Each type earns its weighted average coupon (__wa_coupon_pct) on its balance,
#     a full year in period 1 (a deposit_account at that rate: the return is added to the pool, nothing collected);
#   * the ten bonds are ten loans (nine serial, one term), each drawn at its par (series_i__par_usd) times the price
#     (price_pct_of_par) at issue, interest at its coupon (series_i__coupon_pct) on the opening balance, a full year
#     in period 1 (the first coupon period's stub from 14 Oct 2020 is not modelled: the figures read the rate), and
#     principal bullet at its maturity (the bond year of series_i__maturity__year); paid as due;
#   * the proceeds go to the Loan Fund, which reimburses the Authority's GJGNY revolving fund
#     (loan_fund_reimbursement_of_gjgny_revolving_fund, taken out of the Authority's interest), to the Reserve
#     Fund, held at its requirement (requirement percent of the bonds outstanding; the USD 50,000 floor is text,
#     not an input, and does not bind at issue), and to the Costs of Issuance Fund (costs_of_issuance_fund_approx).
#     The underwriting fee is not booked: the OS does not say whether it sits inside the costs of issuance. No tax.
# The figures:
#   * ny20.sources_and_uses: the three uses of the proceeds, from the books (cash out at issue);
#   * ny20.serial_sum, ny20.serial_field_matches_rows: the nine serial bonds outstanding at issue (the second
#     figure is the serial_par_usd field, an input; the books derive it from the nine rows, the other inputs);
#   * ny20.issue_total: all ten bonds outstanding at issue;
#   * ny20.reserve_2pct_of_par: the Reserve Fund at issue;
#   * ny20.clean_up_threshold: the bonds at issue times the clean-up share (threshold_pct_of_original percent);
#   * ny20.overcollateralisation_pct: the pool and the Reserve Fund at issue, from the books, over the bonds issued
#     (the sum of the rows, a generator value: `per` divides by one only), as a percent;
#   * ny20.bond_weighted_coupon_pct: the bonds' interest in the first bond year, from the books, over the bonds
#     issued, as a percent;
#   * ny20.pool_weighted_coupon_pct: the pool's interest in the first year, from the books, over the pool
#     principal (portfolio_principal_usd), as a percent. The answer key weights the coupon table's rows, whose
#     rates are their keys ('3.49'), not inputs; the books weight the two loan types' printed averages, which give
#     the same 4.64;
#   * ny20.coupon_table_total: the pool principal at the Cutoff Date, from the books (the two loan types' balances;
#     every table of the pool sums to it, the case file's pool_balance_ties).
esco: nyserda_green_bonds_2020a
entity: trust_estate
plant: series_9__par_usd
case:
  case: esco-nyserda-green-bonds
  periods: 2
  phases: [accrue, pay, hold]
  currency: USD
  floors: {}
  generators:
    src:
      kind: formulas
      periods: 2
      inputs: esco
      values:
        first_year: {each_period: (t == 1) * 1}
        draw_0: {each_period: series_0__par_usd * price_pct_of_par / 100 * (t == 0)}
        rate_0: series_0__coupon_pct / 100
        maturity_0: series_0__maturity__year - date_of_issuance__year
        draw_1: {each_period: series_1__par_usd * price_pct_of_par / 100 * (t == 0)}
        rate_1: series_1__coupon_pct / 100
        maturity_1: series_1__maturity__year - date_of_issuance__year
        draw_2: {each_period: series_2__par_usd * price_pct_of_par / 100 * (t == 0)}
        rate_2: series_2__coupon_pct / 100
        maturity_2: series_2__maturity__year - date_of_issuance__year
        draw_3: {each_period: series_3__par_usd * price_pct_of_par / 100 * (t == 0)}
        rate_3: series_3__coupon_pct / 100
        maturity_3: series_3__maturity__year - date_of_issuance__year
        draw_4: {each_period: series_4__par_usd * price_pct_of_par / 100 * (t == 0)}
        rate_4: series_4__coupon_pct / 100
        maturity_4: series_4__maturity__year - date_of_issuance__year
        draw_5: {each_period: series_5__par_usd * price_pct_of_par / 100 * (t == 0)}
        rate_5: series_5__coupon_pct / 100
        maturity_5: series_5__maturity__year - date_of_issuance__year
        draw_6: {each_period: series_6__par_usd * price_pct_of_par / 100 * (t == 0)}
        rate_6: series_6__coupon_pct / 100
        maturity_6: series_6__maturity__year - date_of_issuance__year
        draw_7: {each_period: series_7__par_usd * price_pct_of_par / 100 * (t == 0)}
        rate_7: series_7__coupon_pct / 100
        maturity_7: series_7__maturity__year - date_of_issuance__year
        draw_8: {each_period: series_8__par_usd * price_pct_of_par / 100 * (t == 0)}
        rate_8: series_8__coupon_pct / 100
        maturity_8: series_8__maturity__year - date_of_issuance__year
        draw_9: {each_period: series_9__par_usd * price_pct_of_par / 100 * (t == 0)}
        rate_9: series_9__coupon_pct / 100
        maturity_9: series_9__maturity__year - date_of_issuance__year
        bonds_par: series_0__par_usd + series_1__par_usd + series_2__par_usd + series_3__par_usd + series_4__par_usd + series_5__par_usd + series_6__par_usd + series_7__par_usd + series_8__par_usd + series_9__par_usd
        reserve_target: requirement / 100 * bonds_par
        clean_up_share: threshold_pct_of_original / 100
        on_bill_rate: on_bill_recovery__wa_coupon_pct / 100
        smart_energy_rate: smart_energy__wa_coupon_pct / 100

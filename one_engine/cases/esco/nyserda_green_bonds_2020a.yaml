    trust_estate:
      cash: {nature: asset, value: 0}
      on_bill_pool: {nature: asset, value: {generator: src, output: on_bill_recovery__balance_usd}}
      smart_energy_pool: {nature: asset, value: {generator: src, output: smart_energy__balance_usd}}

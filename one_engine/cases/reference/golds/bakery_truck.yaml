checks:
  # ---- conservation ----
  - trace.van_bv_closing[t] == trace.van_bv_opening[t] - trace.depreciation[t]
  - trace.van_bv_opening[t] == trace.van_bv_closing[t-1] for t >= 1
  - trace.van_bv_opening[first] == van_purchase_cost - van_years_elapsed * trace.depreciation[first]
  - trace.accumulated_depreciation[t] == trace.accumulated_depreciation[t-1] + trace.depreciation[t] for t >= 1
  - trace.accumulated_depreciation[first] == (van_years_elapsed + 1) * trace.depreciation[first]
  - trace.accumulated_depreciation[t] + trace.van_bv_closing[t] == van_purchase_cost
  - trace.accumulated_depreciation[last] == van_purchase_cost
  - trace.van_bv_closing[last] == van_purchase_cost - van_useful_life_years * trace.depreciation[last]
  - trace.nwc[t] == trace.nwc_opening[t] + trace.delta_nwc[t]
  - trace.nwc_opening[t] == trace.nwc[t-1] for t >= 1
  - trace.cumulative_fcff[t] == trace.cumulative_fcff[t-1] + trace.fcff[t]
  - cumsum(trace.fcff) == trace.cumulative_fcff
  - trace.van_cum_incr_ebitda_since_purchase[t] == trace.van_cum_incr_ebitda_since_purchase[t-1] + trace.van_incremental_ebitda[t] for t >= 1
  - trace.van_cum_incr_ebitda_since_purchase[first] == (van_years_elapsed + 1) * trace.van_incremental_ebitda[first]
  - trace.loaves_produced[t] == trace.loaves_counter[t] + trace.loaves_delivered[t]

  # ---- definition (the ladder) ----
  - trace.revenue == trace.revenue_counter + trace.revenue_delivery
  - trace.gross_margin == trace.revenue - trace.flour_cost
  - trace.van_cash_opex == trace.van_driver + trace.van_fuel + trace.van_maintenance
  - trace.total_cash_opex == trace.flour_cost + trace.baker_wages + trace.rent + trace.van_cash_opex
  - trace.ebitda == trace.revenue - trace.total_cash_opex
  - trace.ebitda == trace.gross_margin - trace.baker_wages - trace.rent - trace.van_cash_opex
  - trace.ebit == trace.ebitda - trace.depreciation
  - trace.tax == trace.ebit * tax_rate
  - trace.nopat == trace.ebit - trace.tax
  - trace.nopat == trace.ebit * (1 - tax_rate)
  - trace.nwc == trace.nwc_inventory + trace.nwc_receivables - trace.nwc_payables
  - trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc
  - trace.cfi == 0 - trace.capex
  - trace.fcff == trace.cfo + trace.cfi
  - trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex
  - trace.fcff == trace.ebitda - trace.tax - trace.delta_nwc - trace.capex
  - trace.nopat_untaxed == trace.ebit
  - trace.fcff_untaxed == trace.nopat_untaxed + trace.depreciation - trace.delta_nwc - trace.capex
  - trace.fcff_untaxed == trace.ebitda
  - trace.fcff_untaxed == trace.fcff + trace.tax
  - trace.van_incremental_ebitda == trace.van_incremental_revenue - trace.van_incremental_cash_opex
  - trace.van_incremental_ebit == trace.van_incremental_ebitda - trace.depreciation

  # ---- driver-bridge ----
  - grid.periods == van_useful_life_years - van_years_elapsed
  - grid.periods == horizon_years
  - trace.loaves_produced == loaves_per_day * days_per_year
  - trace.loaves_delivered == trace.loaves_produced * delivery_share
  - trace.loaves_counter == trace.loaves_produced * counter_share
  - counter_share + delivery_share == 1
  - trace.revenue_counter == trace.loaves_counter * counter_price
  - trace.revenue_delivery == trace.loaves_delivered * delivery_price
  - trace.flour_cost == trace.loaves_produced * flour_cost_per_loaf
  - trace.baker_wages == baker_count * baker_wage_per_month * months_per_year
  - trace.rent == rent_per_month * months_per_year
  - trace.van_driver == van_driver_cost_per_year
  - trace.van_fuel == van_fuel_cost_per_year
  - trace.van_maintenance == van_maintenance_cost_per_year
  - trace.depreciation == (van_purchase_cost - van_residual_value) / van_useful_life_years
  - trace.nwc_inventory == trace.flour_cost * flour_inventory_days / days_per_year
  - trace.nwc_receivables == trace.revenue_delivery * delivery_receivable_days / days_per_year
  - trace.nwc_payables == trace.flour_cost * flour_payable_days / days_per_year
  - trace.capex == replacement_capex_in_horizon
  - trace.revenue_counter_only_counterfactual == trace.loaves_produced * counter_price
  - trace.van_incremental_revenue == trace.revenue - trace.revenue_counter_only_counterfactual
  - trace.van_incremental_revenue == trace.loaves_delivered * (delivery_price - counter_price)
  - trace.van_incremental_cash_opex == trace.van_cash_opex

  # ---- non-negativity / sign and bound invariants ----
  - trace.van_bv_opening[t] >= 0
  - trace.van_bv_closing[t] >= 0
  - trace.van_bv_closing[last] == 0
  - trace.van_bv_opening[t] <= van_purchase_cost
  - trace.accumulated_depreciation[t] <= van_purchase_cost
  - trace.nwc_inventory[t] >= 0
  - trace.nwc_receivables[t] >= 0
  - trace.nwc_payables[t] >= 0
  - trace.tax[t] >= 0
  - trace.ebitda[t] > 0
  - trace.ebit[t] > 0
  - trace.nopat[t] > 0
  - trace.fcff[t] > 0
  - min(trace.fcff) >= 0
  - trace.fcff[t] <= trace.fcff_untaxed[t]
  - trace.cumulative_fcff[last] >= trace.fcff[first]
  - trace.van_incremental_ebitda[t] > 0
  - trace.van_incremental_ebit[t] > 0
  - trace.van_cum_incr_ebitda_since_purchase[last] >= van_purchase_cost
  - trace.van_cum_incr_ebitda_since_purchase[first] < van_purchase_cost
  - trace.revenue[t] > trace.revenue_counter_only_counterfactual[t]

notes:
  - |
    HEADLINE. The bakery as described throws off a flat 6,863,839 XOF of unlevered free cash flow
    a year for the five remaining years of the van's life, on revenue of 52,012,500 and EBITDA of
    8,437,500. The flatness is not a modelling shortcut — the founder describes one production
    rate, two fixed prices, a settled channel mix and four cost lines, with no growth, seasonality
    or price path anywhere. Imposing a growth rate would be inventing an input he did not give.
  - |
    THE MATERIAL FINDING IS THE VAN, NOT THE FCFF. The delivery channel earns 70 XOF more per loaf
    on 91,250 loaves and costs 4,200,000 a year to run, leaving incremental EBITDA of 2,187,500
    against annual depreciation of 2,142,857 — an incremental EBIT of about 45,000 XOF a year on a
    15,000,000 asset. Over the van's full seven-year life the undiscounted incremental cash barely
    exceeds its purchase price (see trace.van_cum_incr_ebitda_since_purchase, checked against
    van_purchase_cost). Directionally, once any positive cost of capital is applied the decision as
    described does not recover its outlay. This matters most for the decision the founder will face
    in year eight — whether to replace the van — and it is the first thing to put to him.
  - |
    TAX IS THE LARGEST NON-STATED INPUT. He says nothing about tax. I applied a 25 percent statutory
    corporate rate on EBIT, the harmonised WAEMU rate, and materialised the nil-tax case as
    trace.fcff_untaxed rather than describing it, so both ends of the range are checked arithmetic
    rather than prose. A small bakery of this size in most OHADA jurisdictions might in practice sit
    under a simplified or turnover-based regime rather than the standard CIT; that would need to be
    established before the number is used for anything binding.
  - |
    WORKING CAPITAL — LEVEL ASSUMED, CHANGE DEDUCED. Stock days, receivable days and payable days
    are all analyst priors and are flagged ASSUMED. But because every operating driver is flat and
    the delivery channel has already been running two years, net working capital is constant and
    the change is zero in every period. The assumed levels therefore set a balance-sheet number
    (35,000 XOF) and contribute nothing to FCFF. The one moment they would have mattered — the
    working-capital step-up when credit sales to shops and cafés began — falls two years before the
    grid opens.
  - |
    IFRS 16 FRICTION, EXPLICITLY NOT TAKEN. Rent of 800,000 a month is treated as an operating
    expense. If the lease runs beyond twelve months and the practical expedient in IFRS 16.6 is not
    available, the premises would be recognised as a right-of-use asset with a matching lease
    liability; rent would leave EBITDA and reappear as depreciation plus interest, and lease
    payments would become financing rather than operating flows. That treatment raises unlevered
    FCFF and simultaneously adds a debt-like claim against it, so it must be applied consistently on
    both sides of any valuation. Direction only — no figure asserted. Note also that a bakery in an
    OHADA jurisdiction reports under SYSCOHADA révisé rather than full IFRS; the mechanics used here
    are common to both.
  - |
    THE OWNER'S OWN LABOUR IS UNPRICED. "Je travaille tous les jours" — he works every day, seven
    days a week, and no salary for himself appears among the costs. EBITDA and therefore FCFF are
    stated before any charge for the proprietor's labour. Any comparison of this business against an
    alternative in which he would be paid must deduct a market wage for a full-time manager working
    365 days a year. Direction of effect: FCFF as computed is overstated relative to a fully-costed
    operation.
  - |
    THE COST BASE IS ALMOST CERTAINLY INCOMPLETE, AND THIS IS THE BIGGEST RISK TO THE NUMBER. Flour
    is the only ingredient he names. Real bread also consumes yeast, salt, water and — critically —
    oven fuel or electricity, which for a 500-loaf daily bake is a substantial line. He also names no
    electricity for the shop, no water, no packaging, no market or trading licence, no social
    contributions on the two bakers' wages, and no insurance on the van (which is typically
    compulsory for a commercial vehicle). Every one of these would reduce EBITDA. The 8,437,500
    EBITDA should be read as an upper bound on the true operating margin until these are elicited.
  - |
    NO BAKING EQUIPMENT APPEARS ON THE BALANCE SHEET. A bakery producing 500 loaves a day owns an
    oven, a mixer, proving equipment and shelving, none of which he mentions. The model therefore
    carries the van as the only depreciable asset and zero maintenance capex. If equipment exists —
    it must — both depreciation and replacement capex are understated, and FCFF with it.
  - |
    THE DRIVER'S PAY IS ANOMALOUS AND WAS TAKEN AS STATED. He quotes the driver at 600,000 per year,
    i.e. 50,000 a month, against 100,000 a month for each baker. A full-time delivery driver earning
    half a baker's wage is possible (part-time, family member, or a per-round arrangement) but is
    worth confirming. If the figure is actually monthly, van costs would be materially higher and the
    van's incremental EBIT would turn negative. This is a mis-transcription risk, not a modelling
    choice; I took his words literally because he explicitly said "par an" for all three van lines.
  - |
    ZERO WASTE ASSUMED FOR A PERISHABLE DAILY PRODUCT. He gives one production number and describes
    it as fully split between counter and delivery. Bread that does not sell on the day is a total
    loss, and any real staling or return rate reduces revenue without reducing flour cost. Directional
    effect: revenue as modelled is an upper bound.
  - |
    THE CURRENT COUNTER PRICE IS DEDUCED, NOT STATED. He gives 250 in the past tense. I read it as
    still current on the strength of his own contrastive construction — "le pain livré je le vends
    trois cent vingt" marks 320 as the exception, which presupposes the rule. If the counter price
    has in fact moved since, revenue and every line below it shift accordingly. This is the highest-
    leverage single question to put back to him, because it multiplies 91,250 loaves.
  - |
    HORIZON CHOICE AND WHAT IS DELIBERATELY EXCLUDED. Five periods, ending exactly when the van's
    carrying amount reaches nil. No terminal value and no continuing value is computed, because
    valuing beyond year five requires a van replacement price the founder never gave, plus a discount
    rate that is not derivable from anything he said. Directionally, extending the horizon past year
    five would require replacement capex in the year the new van is bought, depressing FCFF sharply
    in that single year relative to the flat profile shown here.
  - |
    CURRENCY IS INFERRED FROM CONTEXT, NOT STATED. He says "francs" without qualification. I have
    labelled the model XOF (CFA franc BCEAO) on the strength of the West African framing and the
    magnitudes involved. XAF (CFA franc BEAC) is numerically identical for every calculation here, so
    nothing in the arithmetic turns on the choice; only the tax-regime prior would change.
  - |
    DEFERRED / TO ELICIT, in priority order: (1) is 250 still the counter price; (2) oven fuel or
    electricity cost, and all other ingredients beyond flour; (3) what baking equipment is owned, at
    what age and what remaining life; (4) the applicable tax regime and effective rate; (5) whether
    the driver's 600,000 is truly annual; (6) actual payment terms from the shops and cafés and from
    the flour supplier; (7) unsold-bread rate; (8) van insurance and licence fees; (9) whether the van
    was bought outright or on credit, which is irrelevant to this unlevered figure but decisive for
    equity cash flow; (10) the lease term on the premises, for the IFRS 16 question.

notes:
  findings:
    - "FCFF profile: -510,000,000 at construction (t=0); then a flat 34,092,940.8/yr through year 14 while the 100% investment deduction and its loss carryforward fully shelter income (zero cash tax); year 15 steps to 33,674,707.2 as the loss bank is exhausted; years 16-19 settle at 23,865,058.56/yr (full 30% cash tax); year 20 is 59,565,058.56, carrying the 51,000,000 salvage net of its 15,300,000 balancing-charge tax."
    - "The 100% investment deduction creates a 475,907,059.2 tax loss in year 1, absorbed over years 2-15 (partial in year 15). No corporate tax is paid until year 15 (period index 14)."
    - "Book depreciation cancels in the unlevered FCFF build, so FCFF is invariant to the depreciable-base choice; the book ladder is shown for completeness and IAS-16 compliance only."
  judgment_calls:
    - "Book depreciable base = cost less residual (IAS 16.53), residual = the stated 10% salvage -> 22,950,000/yr and zero book gain on disposal. Alternative policy of depreciating the full 510,000,000 to zero and booking a 51,000,000 disposal gain at exit changes the accounting ladder only; FCFF is unchanged."
    - "Salvage taxed as a balancing charge at 30% because TWDV = 0 after the 100% investment deduction and proceeds (51,000,000) are below allowances granted (510,000,000), so no capital-gains-tax treatment. Incremental year-20 tax from salvage = 15,300,000."
    - "Separate construction period t=0 (capex only); operation, book depreciation and the investment deduction all begin at t=1 per 'first year of operation'."
    - "Loss carryforward uncapped ('carried forward until it is absorbed'), following the operator. CURRENT-LAW CORRECTION 2026-07-25 (physical audit): Kenya's loss carryforward was indefinite only from 1 Jan 2022 to 30 Jun 2025. The Finance Act 2025 reinstated a FIVE-YEAR cap (extendable on application to the Cabinet Secretary), effective 1 Jul 2025 — i.e. before this gold's date. The trace faithfully models the operator's stated 'carried forward until absorbed' premise, so the numbers stand as an indefinite-carryforward oracle, but that premise is NOT current law. Under a 5-year cap much of the front-loaded relief is forfeited and cash tax starts far earlier (materially lower FCFF). The loss-expiry mechanism is a SPAWN sibling, not an edit here."
  deferrals_elicited:
    - "ELICITED — Kenya Power payment/collection terms (DSO) and any PPA receivables build. Kenya Power has a documented history of settlement delays; if, say, 30-90 days of receivables were modelled, a working-capital outflow would appear in year 1 and reverse at exit. Held at zero here (dnwc row) pending data; materialise as a scenario column once terms are known rather than asserting a number now."
    - "ELICITED — annual PV output degradation (not stated). Output is held flat at 409,968 MWh; real plants typically lose output year on year, which would taper revenue. Left flat per the operator's own 'about 410,000 MWh a year'."
    - "ELICITED — VAT/withholding, insurance, and any deemed opex escalation; none stated, none modelled. Opex held flat at 1% of capex."
    - "No merchant tail after year 20: the operator exits at PPA end with salvage, so the horizon stops at t=20."
    - "No discount rate supplied; deliverable is the asset-side FCFF stream (unlevered), not a present value."

  corrections: >
    2026-07-26 — PROVENANCE CORRECTION at canonicalization (metadata only, no number changed).
    All four arise golds were generated blind and independently and each emitted the same
    id `arise-kenya-solar-fcff` — a 4-way primary-key collision only visible once the siblings
    were promoted into one library. Id disambiguated to arise-kenya-solar-fcff-ida. Filenames, titles, inputs,
    passage, trace, fcff and checks are untouched.

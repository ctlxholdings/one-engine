id: arise-kenya-solar-fcff-ida
title: "Arise Kenya — 234 MW grid-connected solar PPA portfolio: unlevered free cash flow (FCFF via NOPAT), cash tax on the 100% investment-deduction base"
currency: USD
grid:
  periods: 21
  freq: annual
utterance:
  fr: ""
  en: |
    We are Arise Kenya — six grid-connected solar plants totalling 234 megawatts AC in the Rift Valley. We have a 20-year USD-denominated PPA with Kenya Power at 9.56 US cents per kilowatt-hour; the plants run at a 20 percent capacity factor, about 410,000 megawatt-hours a year. Construction cost 510 million US dollars. In our financial accounts we depreciate the plant straight-line over the 20-year PPA life. For tax, though, Kenya grants an investment deduction of 100 percent of the plant cost in the first year of operation — the entire 510 million is deducted against taxable income in year one, and any unused loss is carried forward until it is absorbed. Operating cost is 1 percent of capex a year. Corporate tax is 30 percent. At year 20 the PPA ends and we expect a salvage of 10 percent of the original cost.


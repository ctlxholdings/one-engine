  - "trace.fcff[t] == trace.nopat[t] + trace.book_dep[t] - trace.dnwc[t] - trace.capex[t] + trace.salvage[t]"
  - "trace.fcff[t] == trace.revenue[t] - trace.opex[t] - trace.cash_tax[t] - trace.dnwc[t] - trace.capex[t] + trace.salvage[t]"

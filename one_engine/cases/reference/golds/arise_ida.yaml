passage: |
  UNIT AND STRUCTURE
  Currency USD (the PPA is USD-denominated, so no FX bridge is needed). Horizon = one construction period (t=0) plus the 20 operating years of the PPA (t=1..20) = 21 annual periods; the operator exits at PPA end, so no merchant tail is modelled.

  STAGE 1 — ENERGY (business's own quantity, MWh)
  Two operator statements pin production: 234 MW_AC at a 20% capacity factor.
    Energy = capacity x annual hours x capacity factor = 234 x 8760 x 0.20 = 409,968 MWh/yr.
  This reproduces the operator's "about 410,000 MWh a year" (difference 32 MWh, rounding). Output is held flat across the 20 years (no degradation stated — see notes). t=0 produces nothing.

  STAGE 2 — REVENUE
  Tariff 9.56 US c/kWh = 95.60 USD/MWh (x1000 kWh/MWh, /100 c/USD). USD PPA, no escalation stated -> flat.
    Revenue = 409,968 MWh x 95.60 USD/MWh = 39,192,940.8 USD/yr for t=1..20; 0 at t=0.

  STAGE 3 — OPERATING COST
  Opex = 1% of capex per year = 0.01 x 510,000,000 = 5,100,000 USD/yr for t=1..20; 0 at t=0.
    EBITDA = Revenue - Opex = 39,192,940.8 - 5,100,000 = 34,092,940.8 USD/yr (t=1..20).

  STAGE 4 — BOOK DEPRECIATION LADDER (accounting only; IAS 16)
  IAS 16.53 depreciates cost LESS residual value. The operator expects a 10% salvage at year 20, which is exactly the IAS 16 residual (value obtainable from an asset already at end-of-life condition). So residual = 51,000,000 and the depreciable amount = 510,000,000 - 51,000,000 = 459,000,000.
    Book depreciation = 459,000,000 / 20 = 22,950,000 USD/yr (t=1..20).
    EBIT = EBITDA - book dep = 34,092,940.8 - 22,950,000 = 11,142,940.8 USD/yr (t=1..20).
  Net book value rolls 510,000,000 down by 22,950,000 a year to 51,000,000 at end of year 20 = the salvage price, so the book gain on disposal is 51,000,000 - 51,000,000 = 0 (no disposal gain in EBIT).
  NOTE: under the unlevered build FCFF cancels book depreciation (it enters NOPAT as a charge and is added back as D&A), so the choice of depreciable base does NOT change FCFF; it only fixes the accounting ladder.

  STAGE 5 — TAX BASE (cash tax computed on taxable income after CAPITAL ALLOWANCES, not book dep)
  Kenya grants a 100% investment deduction on the plant in the first year of operation: capital allowance = 510,000,000 at t=1, zero thereafter. Book depreciation is NOT a tax deduction; it is replaced by the capital allowance.
  Tax-written-down value (TWDV) rolls 510,000,000 (t=0) -> 0 (t=1 onward).
  Taxable income before loss offset:
    t=1: 39,192,940.8 - 5,100,000 - 510,000,000 = -475,907,059.2  (a tax loss)
    t=2..19: 39,192,940.8 - 5,100,000 - 0 = 34,092,940.8
    t=20: 34,092,940.8 + balancing charge 51,000,000 = 85,092,940.8
  Balancing charge at t=20: the asset was fully written off for tax (TWDV = 0), so the 51,000,000 disposal proceeds are a balancing charge, fully taxable at 30% (proceeds 51,000,000 < allowances granted 510,000,000, so no capital-gains treatment).

  STAGE 6 — LOSS CARRYFORWARD (operator: "carried forward until it is absorbed" — no time cap)
  Loss bank after t=1 = 475,907,059.2. Each subsequent operating year offsets 34,092,940.8 of income against the bank:
    end t=2  441,814,118.4 | t=3 407,721,177.6 | t=4 373,628,236.8 | t=5 339,535,296.0
    end t=6  305,442,355.2 | t=7 271,349,414.4 | t=8 237,256,473.6 | t=9 203,163,532.8
    end t=10 169,070,592.0 | t=11 134,977,651.2 | t=12 100,884,710.4 | t=13 66,791,769.6
    end t=14 32,698,828.8
  Year 15: income 34,092,940.8 exceeds the remaining bank 32,698,828.8; the bank is fully absorbed (-> 0) and taxable income after offset = 34,092,940.8 - 32,698,828.8 = 1,394,112.0.
  Cash tax = 30% x taxable-after-offset:
    t=1..14: 0            (loss shelters income)
    t=15: 0.30 x 1,394,112.0 = 418,233.6
    t=16..19: 0.30 x 34,092,940.8 = 10,227,882.24
    t=20: 0.30 x 85,092,940.8 = 25,527,882.24   (of which 15,300,000 = 30% x 51,000,000 is the salvage balancing-charge tax)
  Conservation: total taxable-after-offset over life = total pre-offset = 222,858,816.0 (the loss is fully used, none wasted); total cash tax = 30% x 222,858,816.0 = 66,857,644.8.

  STAGE 7 — NOPAT = EBIT - CASH TAX
    t=1..14: 11,142,940.8 - 0 = 11,142,940.8
    t=15: 11,142,940.8 - 418,233.6 = 10,724,707.2
    t=16..19: 11,142,940.8 - 10,227,882.24 = 915,058.56
    t=20: 11,142,940.8 - 25,527,882.24 = -14,384,941.44  (EBIT excludes the 51,000,000 salvage, which enters FCFF as a separate proceeds line; the salvage's tax sits in cash tax)

  STAGE 8 — WORKING CAPITAL
  No receivables/payables/inventory data given; electricity cannot be inventoried and the single-offtaker PPA nets monthly. dNWC set to 0 for all periods (flagged; Kenya Power collection terms elicited in notes).

  STAGE 9 — FCFF = NOPAT + D&A - dNWC - capex + salvage
    t=0: 0 + 0 - 0 - 510,000,000 + 0 = -510,000,000
    t=1..14: 11,142,940.8 + 22,950,000 = 34,092,940.8
    t=15: 10,724,707.2 + 22,950,000 = 33,674,707.2
    t=16..19: 915,058.56 + 22,950,000 = 23,865,058.56
    t=20: -14,384,941.44 + 22,950,000 + 51,000,000 = 59,565,058.56
  Cross-check by the direct cash identity FCFF = Revenue - Opex - CashTax - dNWC - capex + salvage (book D&A cancels): every period agrees. Undiscounted lifetime FCFF = 156,001,171.2 (no discount rate is given; this is the asset-side cash stream, not a valuation).


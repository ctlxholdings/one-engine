id: arise-kenya-solar-234mw-fcff
title: "Arise Kenya — 234 MW AC Rift Valley solar portfolio: unlevered FCFF (NOPAT build) over the construction year plus the 20-year PPA"
currency: USD
grid:
  periods: 21
  freq: annual

utterance:
  en: >-
    We are Arise Kenya — six grid-connected solar plants totalling 234 megawatts AC in the Rift
    Valley. We have a 20-year USD-denominated PPA with Kenya Power at 9.56 US cents per
    kilowatt-hour; the plants run at a 20 percent capacity factor, about 410,000 megawatt-hours a
    year. Construction cost 510 million US dollars. In our financial accounts we depreciate the
    plant straight-line over the 20-year PPA life. For tax, Kenya grants an investment deduction of
    100 percent of the plant cost in the first year of operation — the whole 510 million comes off
    taxable income in year one. But our tax advisers flagged something after the 2025 Finance Act -
    a tax loss can only be carried forward five years now. Whatever we have not used up by the end
    of the fifth year after the loss arises, we simply lose — it does not roll on any further.
    Operating cost is 1 percent of capex a year. Corporate tax is 30 percent. At year 20 the PPA
    ends and we expect a salvage of 10 percent of the original cost.
  fr: >-
    Nous sommes Arise Kenya — six centrales solaires raccordées au réseau totalisant 234 mégawatts
    AC dans la Vallée du Rift. Nous avons un contrat d achat d électricité (PPA) de 20 ans libellé
    en dollars américains avec Kenya Power à 9,56 cents US le kilowattheure ; les centrales
    fonctionnent avec un facteur de charge de 20 pour cent, soit environ 410 000 mégawattheures par
    an. La construction a coûté 510 millions de dollars américains. Dans nos comptes financiers,
    nous amortissons la centrale de façon linéaire sur la durée de 20 ans du PPA. Sur le plan
    fiscal, le Kenya accorde une déduction pour investissement de 100 pour cent du coût de la
    centrale la première année d exploitation — les 510 millions entiers viennent en déduction du
    résultat imposable l année un. Mais nos conseillers fiscaux ont signalé un point après la loi de
    finances 2025 - un déficit fiscal ne peut désormais être reporté que sur cinq ans. Ce que nous n
    avons pas absorbé à la fin de la cinquième année suivant l année de survenance du déficit, nous
    le perdons purement et simplement — il ne se reporte pas au-delà. Les coûts d exploitation
    représentent 1 pour cent du capex par an. L impôt sur les sociétés est de 30 pour cent. À l
    année 20, le PPA prend fin et nous anticipons une valeur résiduelle de 10 pour cent du coût d
    origine.


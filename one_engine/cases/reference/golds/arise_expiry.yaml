notes:

  reconciliation_of_the_energy_figure: >-
    234 MW AC x 8,760 h x 20 percent = 409,968 MWh, against the founder's stated about 410,000 MWh.
    The two agree to within a rounding, which confirms the capacity factor is quoted on AC nameplate
    and is already net of availability, curtailment and soiling. I model the derived figure so the
    driver bridge reproduces exactly; nothing of substance turns on the difference.

  why_the_statutory_rate_shortcut_is_wrong_here: >-
    NOPAT is struck as EBIT less actual unlevered cash tax, not as EBIT x (1 - 30 percent). The
    founder's tax facts exist precisely because the cash tax base diverges from book EBIT for the
    entire asset life - a 100 percent first-year deduction, then no capital allowances at all for
    nineteen years. Applying the statutory rate to EBIT would misstate every period. Because the
    build is unlevered there is no interest in the tax computation, so no interest tax-shield
    adjustment arises.

  the_dominant_finding: >-
    The 2025 Finance Act five-year cap is the defining economic fact of this asset. A 100 percent
    deduction equal to roughly fifteen years of EBITDA is granted in a single year, and the law then
    allows only the year of the loss plus five further years in which to absorb it. Most of the
    deduction is therefore forfeited, and the forfeited tax shield is materialised in
    trace.tax_shield_forgone so it can be inspected rather than asserted in prose. Everything after
    operating year 6 is fully taxed.

  book_versus_tax_depreciation_friction: >-
    The founder describes full-cost straight-line book depreciation over the PPA life while also
    expecting a 10 percent residual; IAS 16 would net the residual out of the depreciable amount. I
    kept the founder's description and carried the residual as an investing disposal. This is a
    presentation choice only - FCFF adds D&A straight back and cash tax runs off the tax base, so
    depreciation cancels exactly out of every FCFF period. The book choice does move EBIT, NOPAT and
    the gain on disposal, which is why NOPAT is negative in the taxpaying years.

  deferred_tax: >-
    A large deferred tax liability arises at t=1 and unwinds across the life as book depreciation
    runs off against a nil tax base. It is non-cash and plays no part in FCFF; it is deliberately
    not traced.

  balancing_charge_is_outside_the_tax_base_rows: >-
    BOUND 2026-07-26 (physical audit; structural limitation made explicit, no FCFF number changed).
    A Kenyan balancing charge is ADDED TO TRADING PROFITS. This gold does not route it that way: the
    trace states taxable_income_pre_relief and taxable_income at the final period EXCLUDING the
    salvage proceeds, and computes salvage_tax on a separate track via
    salvage_tax == tax_rate * (salvage_gross - twdv[t-1]). Total tax for the period is nevertheless
    correct, and FCFF is correct, but ONLY BECAUSE THE LOSS POOL IS ALREADY DEAD BY THEN. As
    specified, this structure would tax salvage in full even against a LIVE loss pool -- which is
    exactly the state that arises under the transitional relief flagged in the note below. Worse,
    the error is currently invisible: the check
    sum(loss_used) == loss_carryforward_years * taxable_income_pre_relief[last] passes only because
    taxable_income_pre_relief[last] is understated by the omitted charge, so a second defect is
    cancelling the first. Two defects cancelling is worse than one defect visible, which is why it
    is named here rather than left to be rediscovered. NOT repaired in place: correcting it moves
    the terminal tax base, the tax row, NOPAT and the capex_net presentation together and would mean
    hand-editing a coupled block of a generated gold, which the library forbids. Flagged as the
    first item to adjudicate when this gold is compared against the engine (objective 1) -- an
    engine that puts the balancing charge INSIDE the tax base is more correct than this gold's
    presentation, and that disagreement is a finding, not a gold failure.

  transitional_relief_not_elicited: >-
    BOUND 2026-07-26 (physical audit). This gold models the loss-expiry rule exactly as the founder
    states it, which is correct: the operative fact is what his advisers told him. But it never asks
    the one question that decides whether the rule bites. Kenyan law provides an exception under
    which a sufficiently large investor whose deficit was ascertained before the cap took effect may
    carry it forward until extinguished; a project of this size clears the investment threshold by a
    wide margin, so the only gating fact is WHEN the loss was ascertained -- which turns on the
    commissioning date, a date the utterance never gives and which appears in no input and no
    elicitation question here. Direction only: if the deficit predates the cutoff, the pool is
    absorbed rather than forfeited and lifetime cash is materially higher, which would hollow out
    this gold's self-declared dominant finding. ELICIT, and it is the first question to put: on what
    date were the plants commissioned and in which year of income was the deficit ascertained? A
    discretionary extension mechanism also exists and is likewise unmentioned.

  salvage_tax_treatment: >-
    With the plant written down to nil tax value, the salvage proceeds are a balancing charge fully
    chargeable at 30 percent, and the loss pool is long extinguished so it cannot shelter them. The
    founder did not raise disposal tax. If advisers confirm the proceeds escape charge, terminal
    FCFF would be higher; the direction is unambiguous and the amount is visible as its own trace
    row, trace.salvage_tax.

  working_capital_is_the_weakest_input: >-
    No PPA settlement terms were given. The DSO and DPO priors are flagged ASSUMED and drive a
    one-off build at first operation and a one-off release at termination, netting to nil over the
    life. A longer receivable lag would deepen the year-one trough and enlarge the terminal release;
    it does not change lifetime cash. If Kenya Power settlement were chronically delayed rather than
    steady-state, the correct treatment would be a growing receivable rather than a constant one,
    and that would change lifetime cash - a question worth putting to the founder.

  loss_window_reading: >-
    I read the loss as arising in operating year 1 and relievable in operating years 2 through 6 -
    five utilisation years - with the residue dying at the close of year 6, following the founder's
    own phrase about the fifth year after the loss arises. A stricter reading, in which relief ends
    with operating year 5, would give one fewer sheltered year and lower cash flow. The reading is
    tied to an explicit input, loss_carryforward_years, and is asserted in checks, so it can be
    re-run under either interpretation.

  entity_structure: >-
    I model one taxpayer holding all six plants with simultaneous commissioning. If the plants sit
    in six separate SPVs but are commissioned together and are proportionally identical, the loss
    arithmetic is linear and the aggregate is unchanged - Kenya has no group relief, but there is
    nothing to pool. Staggered commissioning dates would break that equivalence, because each SPV
    would start its own five-year clock. This is worth confirming.

  items_deliberately_excluded_for_want_of_evidence: >-
    Module degradation, deemed-generation or take-or-pay provisions, capacity payments, curtailment
    compensation, decommissioning provisions, land lease escalation, insurance step-ups, mid-life
    inverter replacement capex, withholding tax, VAT and any construction-period interest or fees
    inside the 510 million. Each was unmentioned. Several of them - degradation and inverter
    replacement in particular - would reduce cash flow if present, and none of them would increase
    it; the model as built should therefore be read as an upper bound on the operating profile.

  unit_frictions_kept_rather_than_forced: >-
    There is no cost of goods sold, no inventory and no production batch in this business - the only
    stock is the plant itself, and the operating cost is a ratio to capital cost rather than a cost
    per MWh. I kept the sector's own quantities (MW AC, capacity factor, MWh, USD per MWh, percent
    of capex) and did not manufacture a unit-cost line that the business does not have.

  return_character: >-
    At USD 2,179 per kW installed against a tariff that yields under 7 percent of cost after O&M,
    twenty years of contracted revenue taxed at 30 percent for fourteen of them and with most of the
    investment deduction forfeited returns little more than the original outlay undiscounted. The
    asset is close to value-neutral on an unlevered basis before any cost of capital is applied.
    That conclusion follows directly from the fcff array and needs no separate scenario.

passage: |
  0. FRAMING, UNITS AND GRID

  The asset is six utility-scale PV plants operated as a single revenue system under one 20-year
  USD PPA. The natural quantities in this sector are installed AC capacity (MW AC), capacity factor
  (dimensionless), delivered energy (MWh per year) and a tariff in USD per MWh. I keep those and do
  not force a units-times-unit-price-minus-unit-cost manufacturing template onto the business. Two
  frictions with generic line items are worth naming up front. First, there is no cost of goods
  sold and no inventory: sunlight is free, electricity delivered under a PPA is not stored, and
  there is no batch or production cycle - the only stock in the business is the plant itself.
  Second, the founder's operating cost is a ratio to capital cost, not a cost per MWh; I keep it as
  a ratio and quote the per-MWh figure only as a plausibility read.

  Grid: 21 annual periods, t = 0 through t = 20 on a 0-based index. t = 0 is the construction year -
  capital spend, no generation, no tax. t = 1 through t = 20 are PPA operating years 1 through 20.
  The 20-year PPA, the 20-year book life and the tax history all run over t = 1..20; the salvage
  falls at t = 20. Including the construction period makes the capex term in FCFF = NOPAT + D&A -
  dNWC - capex meaningful and makes the model a complete asset-side statement rather than an
  operating-phase extract. The founder gave no drawdown profile, so the entire 510 million sits at
  t = 0 (flagged ASSUMED).

  1. ENERGY AND REVENUE

  Nameplate capacity is 234 MW AC. A year contains 8,760 hours (DEFAULTED, 365 x 24 - the standard
  denominator behind a capacity factor). Energy at 100 percent capacity factor would be
  234 x 8,760 = 2,049,840 MWh. At the stated 20 percent capacity factor:

      2,049,840 x 0.20 = 409,968 MWh per operating year.

  The founder's "about 410,000 MWh a year" reconciles to this within 32 MWh, or 0.008 percent. That
  agreement is itself informative: it confirms the 20 percent is quoted on the AC nameplate and is
  already net of availability, curtailment and soiling, so no further derate is applied. I model
  409,968 MWh rather than the rounded 410,000 so that the energy figure is exactly reproducible
  from its three physical drivers.

  Tariff: 9.56 US cents per kWh. Converting, 9.56 cents x 1,000 kWh per MWh = 9,560 cents = USD
  95.60 per MWh. The PPA is USD-denominated and quoted as a single fixed number, so I hold it flat
  in nominal USD across all 20 years; no indexation was described.

      Revenue per operating year = 409,968 MWh x 95.60 USD/MWh = USD 39,192,940.80.

  This is constant for t = 1..20. Revenue is recognised as energy is delivered and metered, which
  under IFRS 15 is the correct over-time pattern for a metered offtake contract. Total contracted
  revenue over the PPA is 20 x 39,192,940.80 = USD 783,858,816.00.

  Module degradation is not modelled: the founder gave one flat capacity factor and one flat annual
  energy figure, which entails a level output profile. Real PV degrades, so this is flagged and the
  elicitation question is recorded.

  2. OPERATING COST AND EBITDA

  Operating cost is 1 percent of capex per year:

      0.01 x 510,000,000 = USD 5,100,000 per operating year.

  Note that this is constant by construction, not by assumption: capex is a fixed historic number,
  so a fixed percentage of it is a fixed amount. No escalation assumption is needed or made. Per
  unit of energy this is 5,100,000 / 409,968 = USD 12.44 per MWh, which is a normal all-in O&M,
  insurance, land and administration load for a portfolio of this size - a sanity read only, not an
  input.

      EBITDA per operating year = 39,192,940.80 - 5,100,000 = USD 34,092,940.80.

  EBITDA is zero at t = 0.

  3. BOOK DEPRECIATION AND EBIT

  Straight line over the 20-year PPA life:

      510,000,000 / 20 = USD 25,500,000 per year, t = 1..20.

  Net book value rolls from 510,000,000 at t = 0 down by 25,500,000 a year to exactly zero at
  t = 20.

  Friction worth naming: IAS 16.53 defines the depreciable amount as cost less residual value, and
  this founder expects a residual of 10 percent. Taken literally - "we depreciate the plant
  straight-line over the 20-year PPA life" - I depreciate the full cost and treat the 10 percent
  recovery as a disposal in investing rather than as an unamortised residual. This matters for the
  presentation of EBIT and for a book gain on disposal, but it is exactly neutral to FCFF, because
  FCFF adds D&A straight back and the cash tax below is computed on the tax base rather than the
  book base. I therefore do not force the two conventions to agree.

      EBIT per operating year = 34,092,940.80 - 25,500,000 = USD 8,592,940.80.

  4. THE TAX BASE - INVESTMENT DEDUCTION

  For tax, book depreciation is added back and capital allowances are substituted. The founder
  states a 100 percent investment deduction claimed in the first year of operation, so:

      Tax depreciation = 510,000,000 at t = 1, and zero in every other period.

  The tax written-down value of the plant therefore runs 510,000,000 at t = 0 and nil from t = 1
  onward. There are no further capital allowances for the remaining nineteen operating years - this
  is the mechanical driver of everything that follows.

  Taxable income before loss relief = EBITDA - tax depreciation:

      t = 0 :                     0 -           0 =              0
      t = 1 :        34,092,940.80 - 510,000,000 = -475,907,059.20
      t = 2..20 :    34,092,940.80 -           0 =  34,092,940.80  each

  Observe that operating year 1 absorbs 34,092,940.80 of the deduction against its own income
  before any loss is created. The loss arising in operating year 1 is therefore 475,907,059.20, not
  the full 510 million.

  5. THE FIVE-YEAR CARRY-FORWARD CAP

  Reading the founder's rule literally: the loss arises in operating year 1 (t = 1); it may be
  carried forward five years; whatever is unused at the end of the fifth year after the loss arises
  is lost. The fifth year after operating year 1 is operating year 6 (t = 6). Relief is therefore
  available in operating years 2, 3, 4, 5 and 6 - five utilisation years - and the residue dies at
  the close of t = 6. There is no restriction on the percentage of a year's profit that may be
  sheltered, so each relief year is sheltered in full.

  Loss pool roll-forward (opening + created - used - expired = closing):

      t = 1 : 0             + 475,907,059.20 -             0 -              0 = 475,907,059.20
      t = 2 : 475,907,059.20 +            0 - 34,092,940.80 -              0 = 441,814,118.40
      t = 3 : 441,814,118.40 +            0 - 34,092,940.80 -              0 = 407,721,177.60
      t = 4 : 407,721,177.60 +            0 - 34,092,940.80 -              0 = 373,628,236.80
      t = 5 : 373,628,236.80 +            0 - 34,092,940.80 -              0 = 339,535,296.00
      t = 6 : 339,535,296.00 +            0 - 34,092,940.80 - 305,442,355.20 =              0
      t = 7..20 : nil throughout.

  Relief actually taken = 5 x 34,092,940.80 = USD 170,464,704.00.
  Loss forfeited at the close of operating year 6 = USD 305,442,355.20.
  Created = used + expired: 170,464,704.00 + 305,442,355.20 = 475,907,059.20. The pool conserves.

  Counting the 34,092,940.80 absorbed inside operating year 1 itself, only 204,557,644.80 of the
  510,000,000 deduction is ever used - 40.11 percent. The forfeited 305,442,355.20 destroys
  0.30 x 305,442,355.20 = USD 91,632,706.56 of tax shield outright. That forfeiture is by a wide
  margin the largest single economic consequence in this business, and it is a direct product of the
  mismatch between a one-shot 100 percent deduction and an asset whose annual EBITDA is only about
  6.7 percent of its cost: the deduction is roughly fifteen years of EBITDA compressed into one
  year, and the law now allows only six years in which to absorb it.

  6. CASH TAX AND NOPAT

  Taxable income after relief:

      t = 0..6  : 0
      t = 7..20 : 34,092,940.80

      Cash tax = 0.30 x 34,092,940.80 = USD 10,227,882.24 per year, t = 7..20 (fourteen years).

  Because this is an unlevered build there is no interest in the tax computation, so this cash tax
  is already the unlevered tax - no interest tax-shield adjustment is required or permitted.

  I deliberately do not use the shortcut NOPAT = EBIT x (1 - 30%). That shortcut is wrong here: the
  whole point of the founder's tax facts is that the cash tax base diverges violently from book EBIT
  for the entire asset life. NOPAT is therefore struck as EBIT less the actual unlevered cash tax:

      t = 0      : 0             - 0             =             0
      t = 1..6   : 8,592,940.80  - 0             =  8,592,940.80  each (six years)
      t = 7..20  : 8,592,940.80  - 10,227,882.24 = -1,634,941.44  each (fourteen years)

  NOPAT turns negative from operating year 7 because tax is being levied on EBITDA - all capital
  allowances are exhausted - while book EBIT is struck after 25,500,000 of depreciation that no
  longer has any tax counterpart. The accounts carry a large deferred tax liability created at
  t = 1 and unwinding across the life; it is a non-cash accrual and correctly plays no part in
  FCFF.

  7. WORKING CAPITAL

  Kenya Power is the sole counterparty. The only working-capital items are trade receivables on
  monthly energy invoices and trade payables on O&M. There is no inventory stage, as set out in
  section 0. No payment terms were stated - this is the largest un-elicited item in the model, and
  I flag the priors explicitly: 60 days sales outstanding on revenue, 30 days payable on operating
  cost, on a 360-day year.

      Accounts receivable = 39,192,940.80 x 60 / 360 = USD 6,532,156.80
      Accounts payable    =  5,100,000.00 x 30 / 360 = USD   425,000.00
      Net working capital = 6,532,156.80 - 425,000.00 = USD 6,107,156.80

  Both balances are flat for t = 1..19 because revenue and opex are flat. At t = 20 the PPA ends,
  final invoices settle and the balance releases to nil - consistent with taking salvage in the same
  period; the business is being wound down as an operating asset at that date.

      dNWC:  t = 0 :             0
             t = 1 : +6,107,156.80  (build)
             t = 2..19 :          0
             t = 20: -6,107,156.80  (release)

  The cumulative sum of dNWC equals the NWC balance in every period, and nets to zero over the life.

  8. CAPEX AND SALVAGE

  Capex is 510,000,000 at t = 0 and nil thereafter. No maintenance or replacement capex is modelled:
  the founder describes the 1 percent as operating cost and mentions no lifecycle spend. This is
  flagged - a mid-life inverter replacement would normally sit outside an O&M ratio.

  Salvage at t = 20 = 0.10 x 510,000,000 = USD 51,000,000.

  Tax on disposal. The plant's tax written-down value is nil, because 100 percent of cost was
  deducted at t = 1. Under Kenyan capital-allowance mechanics, proceeds in excess of written-down
  value are a balancing charge chargeable to tax in the year of disposal. The whole 51,000,000 is
  therefore taxable: 0.30 x 51,000,000 = USD 15,300,000, leaving net disposal proceeds of USD
  35,700,000. The loss pool is long extinguished by then and cannot shelter it. The founder did not
  address disposal tax; this is flagged ASSUMED and is the question I would put to their advisers.

  Net capital line, so that the headline FCFF formula can be applied literally:

      capex_net = capex - salvage_gross + salvage_tax
      t = 0 : 510,000,000 ;  t = 1..19 : 0 ;  t = 20 : 0 - 51,000,000 + 15,300,000 = -35,700,000

  9. FCFF PER PERIOD

  FCFF = NOPAT + D&A - dNWC - capex_net.

      t = 0  :             0 +          0 -            0 - 510,000,000 = -510,000,000.00
      t = 1  :  8,592,940.80 + 25,500,000 - 6,107,156.80 -           0 =   27,985,784.00
      t = 2  :  8,592,940.80 + 25,500,000 -            0 -           0 =   34,092,940.80
      t = 3  :  same                                                   =   34,092,940.80
      t = 4  :  same                                                   =   34,092,940.80
      t = 5  :  same                                                   =   34,092,940.80
      t = 6  :  same                                                   =   34,092,940.80
      t = 7  : -1,634,941.44 + 25,500,000 -            0 -           0 =   23,865,058.56
      t = 8..19 : same each (thirteen periods in total, t = 7 through t = 19)
      t = 20 : -1,634,941.44 + 25,500,000 + 6,107,156.80 + 35,700,000  =   65,672,215.36

  Read as a shape: a single 510 million outflow; a first operating year depressed by the working
  capital build; five fully tax-sheltered years at the EBITDA line, which are the best years the
  asset ever has; then thirteen years at 23.87 million as the tax bill of 10.23 million a year
  arrives permanently; and a terminal year lifted by the working-capital release and the
  after-balancing-charge salvage.

  10. CROSS-FOOT

  Undiscounted cumulative FCFF
    = -510,000,000.00 + 27,985,784.00 + (5 x 34,092,940.80) + (13 x 23,865,058.56) + 65,672,215.36
    = -510,000,000.00 + 27,985,784.00 + 170,464,704.00 + 310,245,761.28 + 65,672,215.36
    = USD 64,368,464.64.

  The same figure must fall out of the sources-and-uses identity, and does:
    revenue 783,858,816.00
    - opex 102,000,000.00
    - operating cash tax 143,190,351.36  (14 x 10,227,882.24)
    - balancing-charge tax 15,300,000.00
    - capex 510,000,000.00
    + salvage 51,000,000.00
    - closing NWC 0
    = USD 64,368,464.64.

  Working capital nets to nil across the life because it is built once and released once. That
  identity is asserted mechanically in checks and is the single strongest guard on the whole
  derivation.

  11. WHAT THE NUMBERS SAY

  Capital intensity is 510,000,000 / 234,000 kW = USD 2,179 per kW installed. Gross revenue yield on
  cost is 39,192,940.80 / 510,000,000 = 7.68 percent, falling to 6.68 percent after O&M. Twenty
  years of that, taxed at 30 percent for fourteen of them and with three fifths of the investment
  deduction forfeited, returns the original outlay and very little more on an undiscounted basis.
  The unlevered asset, as described, is close to value-neutral before any cost of capital is
  applied. The two levers that dominate this are visible directly in the trace: the forfeited loss
  and the level of capital cost per kW.


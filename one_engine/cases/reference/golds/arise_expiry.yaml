checks:

  # --- conservation -------------------------------------------------------
  - "trace.loss_pool[t] == trace.loss_pool[t-1] + trace.loss_created[t] - trace.loss_used[t] - trace.loss_expired[t]"
  - "sum(trace.loss_created) == sum(trace.loss_used) + sum(trace.loss_expired)"
  - "trace.loss_used[t] <= trace.loss_pool[t-1]"
  - "trace.nbv[t] == trace.nbv[t-1] + trace.capex[t] - trace.depreciation[t]"
  - "trace.twdv[t] == trace.twdv[t-1] + trace.capex[t] - trace.tax_depreciation[t]"
  - "sum(trace.depreciation) + trace.nbv[last] == sum(trace.capex)"
  - "sum(trace.tax_depreciation) + trace.twdv[last] == sum(trace.capex)"
  - "trace.nwc[t] == trace.ar[t] - trace.ap[t]"
  - "trace.delta_nwc[t] == trace.nwc[t] - trace.nwc[t-1]"
  - "cumsum(trace.delta_nwc) == trace.nwc"
  - "sum(trace.delta_nwc) == trace.nwc[last]"
  - "trace.nwc[last] == 0"
  - "trace.nbv[last] == 0"
  - "trace.twdv[last] == 0"
  - "trace.loss_pool[last] == 0"
  - "sum(trace.fcff) == sum(trace.revenue) - sum(trace.opex) - sum(trace.tax_operating) - sum(trace.salvage_tax) - sum(trace.capex) + sum(trace.salvage_gross) - trace.nwc[last]"

  # --- definition ---------------------------------------------------------
  - "trace.ebitda[t] == trace.revenue[t] - trace.opex[t]"
  - "trace.ebit[t] == trace.ebitda[t] - trace.depreciation[t]"
  - "trace.taxable_income_pre_relief[t] == trace.ebitda[t] - trace.tax_depreciation[t]"
  - "trace.taxable_income[t] == trace.taxable_income_pre_relief[t] + trace.loss_created[t] - trace.loss_used[t]"
  - "trace.tax_operating[t] == tax_rate * trace.taxable_income[t]"
  - "trace.nopat[t] == trace.ebit[t] - trace.tax_operating[t]"
  - "trace.tax_shield_forgone[t] == tax_rate * trace.loss_expired[t]"
  - "trace.capex_net[t] == trace.capex[t] - trace.salvage_gross[t] + trace.salvage_tax[t]"
  - "trace.cfo[t] == trace.nopat[t] + trace.depreciation[t] - trace.delta_nwc[t]"
  - "trace.cfi[t] == 0 - trace.capex_net[t]"
  - "trace.fcff[t] == trace.cfo[t] + trace.cfi[t]"
  - "trace.fcff[t] == trace.nopat[t] + trace.depreciation[t] - trace.delta_nwc[t] - trace.capex_net[t]"
  - "grid.periods == construction_years + ppa_term_years"

  # --- driver bridge ------------------------------------------------------
  - "trace.generation_mwh[t] == capacity_mw_ac * hours_per_year * capacity_factor for t >= idx_ops_start"
  - "trace.generation_mwh[t] == 0 for t < idx_ops_start"
  - "trace.revenue[t] == tariff_usd_per_mwh * trace.generation_mwh[t]"
  - "trace.opex[t] == opex_pct_of_capex * capex_total for t >= idx_ops_start"
  - "trace.opex[t] == 0 for t < idx_ops_start"
  - "trace.depreciation[t] == capex_total / book_life_years for t >= idx_ops_start"
  - "trace.tax_depreciation[t] == 0 for t >= idx_ops_start + 1"
  - "sum(trace.tax_depreciation) == investment_deduction_rate * capex_total"
  - "sum(trace.loss_created) == investment_deduction_rate * capex_total - trace.ebitda[last]"
  - "sum(trace.loss_used) == loss_carryforward_years * trace.taxable_income_pre_relief[last]"
  - "trace.loss_expired[t] == 0 for t < idx_loss_expiry"
  - "trace.loss_pool[t] == 0 for t >= idx_first_tax_year"
  - "trace.tax_operating[t] == 0 for t < idx_first_tax_year"
  - "trace.ar[t] == trace.revenue[t] * dso_days / days_per_year for t < idx_final"
  - "trace.ap[t] == trace.opex[t] * dpo_days / days_per_year for t < idx_final"
  - "trace.ar[last] == 0"
  - "trace.ap[last] == 0"
  - "sum(trace.capex) == capex_total"
  - "trace.capex[t] == 0 for t >= idx_ops_start"
  - "trace.capex[first] == capex_total"
  - "sum(trace.salvage_gross) == salvage_pct * capex_total"
  - "trace.salvage_gross[t] == 0 for t < idx_final"
  - "trace.salvage_gross[last] == salvage_pct * capex_total"
  - "trace.salvage_tax[t] == tax_rate * (trace.salvage_gross[t] - trace.twdv[t-1]) for t >= idx_final"
  - "trace.salvage_tax[t] == 0 for t < idx_final"

  # --- non-negativity -----------------------------------------------------

  fiscal_year:    [2026, 2027, 2028, 2029, 2030]
  price:          [250, 260, 270, 280, 290]
  volume_annual:  [182500, 182500, 182500, 182500, 182500]
  revenue:        [45625000, 47450000, 49275000, 51100000, 52925000]
  flour_cost:     [27375000, 27375000, 27375000, 27375000, 27375000]
  wages:          [2400000, 2400000, 2400000, 2400000, 2400000]
  rent:           [9600000, 9600000, 9600000, 9600000, 9600000]
  opex_total:     [39375000, 39375000, 39375000, 39375000, 39375000]

checks:
  - trace.volume_annual[t] == loaves_per_day * days_per_year
  - trace.volume_annual[t] == trace.volume_annual[first]
  - trace.price[first] == price_y0
  - trace.price[t] - trace.price[t-1] == price_increment for t >= 1
  - trace.price[last] == price_y0 + price_increment * (grid.periods - 1)
  - trace.revenue[t] == trace.volume_annual[t] * trace.price[t]
  - trace.revenue[t] - trace.revenue[t-1] == loaves_per_day * days_per_year * price_increment for t >= 1
  - trace.flour_cost[t] == flour_cost_per_loaf * trace.volume_annual[t]
  - trace.flour_cost[t] == trace.flour_cost[first]
  - trace.wages[t] == bakers_count * baker_wage_month * months_per_year
  - trace.wages[t] == trace.wages[first]
  - trace.rent[t] == rent_month * months_per_year
  - trace.rent[t] == trace.rent[first]
  - trace.opex_total[t] == trace.flour_cost[t] + trace.wages[t] + trace.rent[t]
  - trace.opex_total[t] == trace.opex_total[first]
  - trace.ebitda[t] == trace.revenue[t] - trace.opex_total[t]
  - trace.ebitda[t] - trace.ebitda[t-1] == loaves_per_day * days_per_year * price_increment for t >= 1
  - trace.ebitda[t] >= 0
  - trace.dep[t] == 0
  - trace.ebit[t] == trace.ebitda[t] - trace.dep[t]
  - trace.nopat[t] == trace.ebit[t] * (1 - tax_rate)
  - trace.inventory[t] == trace.flour_cost[t] * inventory_days / days_per_year
  - trace.inventory[t] == trace.inventory[first]
  - trace.ar[t] == 0
  - trace.ap[t] == trace.flour_cost[t] * payable_days / days_per_year
  - trace.ap[t] == trace.ap[first]
  - trace.nwc[t] == trace.inventory[t] + trace.ar[t] - trace.ap[t]
  - trace.nwc[t] == trace.nwc[first]
  - trace.delta_nwc[t] == 0
  - trace.delta_nwc[t] == trace.nwc[t] - trace.nwc[t-1] for t >= 1
  - trace.capex[t] == 0
  - trace.fcff[t] == trace.nopat[t] + trace.dep[t] - trace.delta_nwc[t] - trace.capex[t]
  - trace.fcff[t] == trace.nopat[t]
  - trace.fcff[t] >= 0
  - sum(trace.fcff) == sum(trace.nopat)
  - trace.dep_oven[t] == oven_cost / oven_life
  - trace.capex_oven[t] == oven_cost for t < 1
  - trace.capex_oven[t] == 0 for t >= 1
  - trace.oven_bv[t] == trace.oven_bv[t-1] + trace.capex_oven[t] - trace.dep_oven[t]
  - trace.oven_bv[t] >= 0
  - trace.oven_bv[last] == oven_cost - sum(trace.dep_oven)
  - trace.ebit_oven[t] == trace.ebitda[t] - trace.dep_oven[t]
  - trace.nopat_oven[t] == trace.ebit_oven[t] * (1 - tax_rate)
  - trace.fcff_oven[t] == trace.nopat_oven[t] + trace.dep_oven[t] - trace.delta_nwc[t] - trace.capex_oven[t]
  - trace.fcff_oven[t] - trace.fcff[t] == oven_cost / oven_life * tax_rate for t >= 1

notes:
  - "PRIMARY ANSWER is the base FCFF array (stated-facts only): [4,687,500; 6,056,250; 7,425,000; 8,793,750; 10,162,500] XOF, summing 37,125,000 over 5 yrs. It equals NOPAT because the founder supplied no asset, so D&A=capex=0, and dNWC=0 (flat, cash business)."
  - "MARGIN-EXPANSION ASYMMETRY (key judgment call): the founder says price rises ~10/yr while 'mes coûts ne bougent presque pas'. Taken literally this expands EBITDA from 6.25M to 13.55M in 5 yrs. Faithful to his words but optimistic: flour and rent almost certainly creep with the same inflation that lets him raise price ('la vie augmente'). Holding real costs flat while prices rise likely overstates later-year FCFF. To stress this properly, elicit input-cost inflation and add it as a checked column."
  - "OVEN / CAPEX is the single biggest structural gap. A bakery needs an oven (domain knowledge) but no cost, age, or life was stated -> magnitude unanchored. Materialised as the flagged ASSUMED oven scenario (dep_oven/capex_oven/oven_bv/fcff_oven), not as prose. In no-capex years fcff_oven exceeds base by exactly the depreciation tax shield (250,000). ELICIT: oven cost, current age, remaining life, and expected replacement/maintenance capex."
  - "TAX: no regime stated. Base uses ASSUMED 25% (representative OHADA/UEMOA corporate IS). Directionally, a higher rate lowers FCFF proportionally on EBIT; a small-enterprise simplified/turnover-based regime could differ materially. ELICIT the actual regime and rate; if it must be flexed, add a tax-scenario column."
  - "OMITTED REAL COSTS (founder's stated cost set only): oven energy/fuel & electricity (material for a bakery), yeast/salt/improvers, water, packaging, licences/patente, maintenance. All unstated -> excluded here, which biases margin UP. ELICIT and add as opex lines."
  - "OWNER'S LABOUR: he 'works every day' but draws no stated wage. Unlevered FCFF as built imputes none. A replacement-cost owner wage would reduce FCFF; flagged as a judgment call, ELICIT whether to impute."
  - "VOLUME held flat (volume_growth=0), supported by 'les clients suivent' and no stated capacity change. 500/day may be a single-oven capacity ceiling rather than a demand ceiling — ELICIT whether output is demand- or capacity-constrained; capacity expansion would change both volume and capex."
  - "'à peu près dix francs' treated as EXACTLY +10/yr, ARITHMETIC (linear), not compound; hence no geometric-growth ratio check — the constant absolute increment (price[t]-price[t-1]==10) is asserted instead."
  - "WORKING CAPITAL levels (inventory 15d, payables 30d) are ASSUMED but IMMATERIAL to FCFF because only dNWC enters and it is zero (flat drivers, cash sales, AR=0). Going-concern convention applied: no initial NWC build charged at t0."
  - "CURRENCY: 'francs' in a francophone-African context taken as CFA franc; XOF (BCEAO) assumed over XAF (BEAC). Magnitudes are identical under either; label only. ELICIT the country/currency."
  - "HORIZON of 5 yrs is a DEFAULTED sensible small-business explicit period; the linear price ramp and flat-cost assumption grow fragile beyond it."

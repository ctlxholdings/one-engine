id: fcff-bakery-boulangerie-daily-500
title: "Unlevered FCFF (via NOPAT) for an owner-operated daily-production bakery in a francophone African market"
currency: XOF
grid:
  periods: 5
  freq: annual
utterance:
  fr: |
    Moi je tiens une boulangerie. Je fais cinq cents pains par jour. La farine me coûte cent cinquante francs par pain. Je paie deux boulangers à cent mille par mois chacun, et le loyer du local est à huit cent mille par mois. Je travaille tous les jours. Le pain, cette année je le vends deux cent cinquante francs pièce, mais chaque année je monte le prix d'à peu près dix francs — la vie augmente, et les clients suivent. Mes coûts à moi, la farine, les salaires, le loyer, ça ne bouge presque pas d'une année sur l'autre.
  en: |
    I run a bakery. I make five hundred loaves a day. Flour costs me one hundred fifty francs per loaf. I pay two bakers a hundred thousand a month each, and the shop rent is eight hundred thousand a month. I work every day. This year I sell the bread at two hundred fifty francs each, but every year I raise the price by about ten francs — the cost of living goes up and the customers follow. My own costs — flour, wages, rent — barely move from one year to the next.


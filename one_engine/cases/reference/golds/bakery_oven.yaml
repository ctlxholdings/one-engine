checks:
  - "grid.periods == oven_life - oven_elapsed"
  - "grid.periods == horizon"
  - "trace.loaves_produced[t] == loaves_per_day * operating_days"
  - "trace.revenue[t] == trace.loaves_produced[t] * price_per_loaf"
  - "trace.flour_cost[t] == trace.loaves_produced[t] * flour_cost_per_loaf"
  - "trace.labor_cost[t] == bakers * baker_wage_month * months"
  - "trace.rent_cost[t] == rent_month * months"
  - "trace.gas_cost[t] == gas_month * months"
  - "trace.ebitda[t] == trace.revenue[t] - trace.flour_cost[t] - trace.labor_cost[t] - trace.rent_cost[t] - trace.gas_cost[t]"
  - "trace.depreciation[t] == (oven_cost - residual_value) / oven_life"
  - "trace.ebit[t] == trace.ebitda[t] - trace.depreciation[t]"
  - "trace.tax[t] == trace.ebit[t] * tax_rate"
  - "trace.nopat[t] == trace.ebit[t] - trace.tax[t]"
  - "trace.dna_addback[t] == trace.depreciation[t]"
  - "trace.delta_nwc[t] == trace.nwc[t] - trace.nwc[t-1]"
  - "trace.capex[t] == 0"
  - "trace.fcff[t] == trace.nopat[t] + trace.dna_addback[t] - trace.delta_nwc[t] - trace.capex[t]"
  - "fcff[t] == trace.fcff[t]"
  - "trace.oven_nbv_close[t] == trace.oven_nbv_open[t] - trace.depreciation[t]"
  - "trace.oven_nbv_open[t] == trace.oven_nbv_close[t-1] for t >= 1"
  - "trace.oven_nbv_open[first] == oven_cost - (oven_cost - residual_value) / oven_life * oven_elapsed"
  - "trace.oven_nbv_close[last] == residual_value"
  - "sum(trace.depreciation) == trace.oven_nbv_open[first] - residual_value"
  - "trace.ebit[t] >= 0"
  - "trace.nopat[t] >= 0"
  - "trace.nwc[t] >= 0"
  - "trace.oven_nbv_close[t] >= 0"
  - "trace.fcff[t] >= 0"
  - "trace.revenue[t] == trace.revenue[first]"
  - "trace.fcff[t] == trace.fcff[first]"
  - "sum(trace.fcff) == trace.fcff[first] * grid.periods"
  - "trace.tax_hi[t] == trace.ebit[t] * tax_rate_hi"
  - "trace.nopat_hi_tax[t] == trace.ebit[t] - trace.tax_hi[t]"
  - "trace.fcff_hi_tax[t] == trace.nopat_hi_tax[t] + trace.dna_addback[t] - trace.delta_nwc[t] - trace.capex[t]"
  - "trace.fcff_hi_tax[t] <= trace.fcff[t]"

notes:
  - "Provenance grade of the result: everything down to EBIT (45,625,000 revenue, 41,775,000 cash opex, 3,850,000 EBITDA, 600,000 depreciation, 3,250,000 EBIT) is INFERRED — built purely from STATED inputs plus named DEFAULTED conventions (365-day year, 12 months, straight-line depreciation, nil residual, rent expensed not IFRS-16-capitalised). NOPAT and FCFF are ASSUMED-grade: the single substantive unstated prior is the tax rate."
  - "Tax is the dominant lever and is ASSUMED, not knowable from the utterance. Base 25% -> FCFF 3,037,500/yr; the materialised 30% scenario (trace.fcff_hi_tax) gives 2,875,000/yr. A micro sole-proprietorship in the CFA zone would more likely fall under a presumptive / synthetic tax regime (impôt synthétique) or personal income-tax schedule rather than standard corporate income tax — this could move the effective rate substantially in either direction. ELICIT the country and applicable regime."
  - "Currency: the founder says only 'francs'. Coded as XOF (West African CFA franc) but it could be XAF (Central African CFA franc); the two share parity to the euro but differ by country/tax regime. ELICIT the country to pin currency and tax."
  - "Horizon choice: I model the 9 REMAINING years of oven life, forward from the valuation date, because the FCFF asked for is the cash the asset base generates going forward. The 6,000,000 purchase is a prior-year sunk outflow and is deliberately outside the horizon; consequently the D&A add-back appears with zero matching capex and forward FCFF (3,037,500) sits above NOPAT (2,437,500) by the full 600,000 depreciation. This is correct but flattering — a full oven-cycle view would include either the past 6,000,000 or a ~6,000,000 replacement at year 10. ELICIT whether a like-for-like replacement is intended."
  - "Working capital: treated as nil-level and zero-change. Bread is cash retail (no A/R). No flour-inventory days or supplier-credit terms were stated, so the NWC level is indeterminate — but with flat volumes/prices the CHANGE is zero regardless, so ΔNWC = 0 does not depend on the level. If flour is bought on supplier credit, there would be a one-off favourable WC release on entry (not modelled). ELICIT inventory-holding and payable terms."
  - "Owner's labour is not expensed: he works every day but draws no stated wage, so under accrual accounting only actual cash costs are recognised. Economically his time is a real opportunity cost; charging a market bakery-manager wage would reduce EBIT and NOPAT. Left as a memo because any figure would be ASSUMED. ELICIT any owner salary or regular drawings."
  - "No growth or inflation is modelled (nominal lines held flat) — a DEFAULTED hold-flat convention given nothing was stated. CFA-zone inflation is real: over 9 years it would lift nominal revenue and all input costs. Direction of FCFF impact is qualitatively ambiguous — margin holds only if the loaf price is repriced in step with flour and gas; if flour outpaces price, the 100/loaf gross margin compresses. Not quantified here (no data)."
  - "Maintenance: the oven lasts ten years 'si on l'entretient bien' — routine maintenance/servicing is implied but no amount was stated. If material and recurring it belongs in cash opex (lowering EBITDA/FCFF) or, if it extends life, in capex. Omitted as unquantified. ELICIT an annual maintenance figure."
  - "The historical rental of the neighbour's oven is pre-horizon and no longer a cost; correctly excluded."
  - "Unlevered = levered here: the oven was bought cash, so there is no debt and no interest expense; NOPAT/FCFF need no financing adjustment."

id: bakery-woodfired-oven-fcff-11y
title: "Wood-fired village bakery — unlevered free cash flow to the firm over the oven's remaining life"
currency: XOF
grid:
  periods: 11
  freq: annual

utterance:
  fr: >-
    Je tiens une boulangerie. Je fais cinq cents pains par jour, vendus deux cent cinquante francs
    pièce. La farine me revient à cent cinquante francs le pain. Je paie deux boulangers cent mille
    francs par mois chacun. Le loyer de la boutique, c'est huit cent mille par mois. Je travaille
    tous les jours. Le four est à moi — je l'ai fait construire il y a quatre ans, un vrai four à
    bois, et il m'a coûté trois millions deux cent mille francs. Le maçon qui construit ces fours
    dit qu'il tient quinze ans si on l'entretient. L'entretenir, ce n'est pas gratuit : chaque année
    à la fin des pluies il vient refaire la sole et reprendre le mortier, et ça me coûte cent
    quatre-vingt mille francs. Et le bois — je brûle à peu près huit cents francs de bois par jour
    pour le garder chaud.
  en: >-
    I run a bakery. I make five hundred loaves a day, sold at two hundred fifty francs each. Flour
    costs me one hundred fifty francs per loaf. I pay two bakers a hundred thousand a month each.
    The shop rent is eight hundred thousand a month. I work every day. The oven is mine — I had it
    built four years ago, a proper wood-fired one, and it cost me three million two hundred thousand
    francs. The mason who builds those ovens says it will go fifteen years if you look after it.
    Looking after it is not free: every year at the end of the rains he comes and relines the hearth
    and redoes the mortar, and that runs me a hundred and eighty thousand francs. And the wood — I
    burn about eight hundred francs of wood a day to keep it hot.


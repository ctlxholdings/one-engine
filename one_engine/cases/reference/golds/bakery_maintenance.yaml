    date: "2026-07-25"

passage: |
  0. FRAME AND GRID

  The currency is the CFA franc; the founder simply says 'francs'. I write it XOF. Nothing in the
  derivation depends on which of the two CFA francs it is.

  This is not a project appraisal. The bakery has been trading for at least four years — the oven
  was built four years ago and is in service — so what I am valuing is the forward cash generation
  of an existing asset base. There is therefore no day-zero capital outlay in the grid; the outlay
  happened four years before t=0 and is sunk.

  Periodicity: annual. Every economic event the founder names has an annual rhythm or shorter — he
  bakes daily, pays wages and rent monthly, and receives the mason once a year 'at the end of the
  rains'. The single long-dated item, the oven, is quoted in years. An annual grid is the coarsest
  grid that loses no stated structure, and it is the grid on which depreciation and tax are actually
  assessed.

  Horizon: eleven periods. The mason gives the oven fifteen years; four have been consumed; eleven
  remain. I close the grid there. That choice is deliberate and it buys two things: the model ends
  with the only durable asset exactly written down to nil, so no terminal book value has to be
  disposed of; and no replacement price for a new oven has to be invented inside the grid, because
  the replacement decision falls in period twelve. Period t=0 is the coming twelve months, which is
  the oven's fifth year of service; period t=10 is the oven's fifteenth and last.

  1. THE NATURAL OPERATING UNIT — THE BAKING DAY

  The founder's own quantities are the loaf and the day. He does not think in tonnes of flour or in
  batches; he thinks 'five hundred loaves a day'. I keep that. The bridge from his units to the
  annual grid is a single operating driver: the baking day.

  He says 'I work every day'. That is an unusually strong statement and it entails no rest day, no
  market-day closure, no annual leave. Combined with the calendar convention of a 365-day year:

      days operated per period = 365

  Leap days are not modelled; the effect is one day in four years and is immaterial against every
  other uncertainty in the picture.

  Annual loaf volume follows directly:

      loaves sold per period = 500 loaves/day x 365 days = 182,500 loaves

  A note on the step from production to sales. The founder says 'I make five hundred loaves a day,
  sold at two hundred fifty francs each'. The participle 'sold' attaches to the five hundred; he is
  describing one flow of loaves, not two. I therefore take output equal to sales, with no stale
  returns and no waste. This is the founder's own framing rather than a prior I supplied, but it is
  worth a question: whether he ever ends a day with unsold bread, and whether volume swings with
  Ramadan, harvest or school terms. Nothing in the utterance supports seasonality, so volume is flat
  at 182,500 loaves in each of the eleven periods.

  2. REVENUE

      revenue = 250 XOF/loaf x 182,500 loaves = 45,625,000 XOF per period

  Both the price and the volume are stated and neither is given any growth, escalation or inflation
  path. I hold both flat in nominal terms across all eleven periods, because inventing an escalator
  would be supplying information the founder did not give. Revenue is recognised at the point of
  sale over the counter (IFRS 15: control of the loaf passes to the customer when handed over), which
  for a cash bakery coincides with cash receipt.

  3. THE COST STACK, IN THE FOUNDER'S OWN CATEGORIES

  He gives four cash costs and one durable asset. I keep his categories rather than folding them
  into a generic COGS/SG&A split, because the split that matters operationally here is
  per-loaf / per-day / per-month / per-year, and that is exactly how he stated them.

  (a) Flour — a per-loaf cost. 'Flour costs me one hundred fifty francs per loaf.' This is already
  a unit cost, so no yield or extraction-rate calculation is needed; the founder has done that
  conversion himself.

      flour cost = 150 XOF/loaf x 182,500 loaves = 27,375,000 XOF per period

  The gross margin over flour is 250 - 150 = 100 XOF per loaf, i.e. 18,250,000 XOF per period. That
  100 francs per loaf is the entire fund out of which wood, wages, rent, the mason and the oven's
  own consumption must be paid.

  (b) Wood — a per-day cost, not a per-loaf cost. This distinction is real and I preserve it. He
  says he burns wood 'to keep it hot': a masonry oven is fired to bring the thermal mass up and then
  held, so the fuel is a function of firing days, not of how many loaves pass through. On his stated
  volumes the two are indistinguishable, but the causal structure matters if volumes ever change.

      wood cost = 800 XOF/day x 365 days = 292,000 XOF per period

  (c) Bakers — a per-month cost, two heads.

      labour cost = 2 bakers x 100,000 XOF/month x 12 months = 2,400,000 XOF per period

  The founder's own labour is not in here. He works every day and names no wage for himself. Under
  IFRS no expense is recognised where no transaction occurs, so EBIT carries no owner wage. The
  consequence is recorded in the notes.

  (d) Shop rent — a per-month cost.

      rent cost = 800,000 XOF/month x 12 months = 9,600,000 XOF per period

  There is an IFRS friction here that I flag rather than paper over. IFRS 16 would ordinarily
  require a right-of-use asset and a lease liability for the shop. But nothing in the utterance
  establishes an enforceable term beyond a month — he says only that the rent 'is eight hundred
  thousand a month' — so the short-term-lease recognition exemption (IFRS 16.5-6) applies and the
  rent goes straight to profit or loss as an operating expense. That is also the treatment that
  keeps the unlevered cash flow honest for a month-to-month informal tenancy.

  (e) The mason's annual reline — a per-year cost. 'Every year at the end of the rains he comes and
  relines the hearth and redoes the mortar, and that runs me a hundred and eighty thousand francs.'

      maintenance cost = 180,000 XOF per period

  This is the most interesting accounting judgment in the whole business, so I will set it out.
  IAS 16.12 expenses the costs of day-to-day servicing — repairs and maintenance — as incurred.
  IAS 16.13 instead capitalises the cost of replacing a part of an item of property, plant and
  equipment when that part is consumed on its own cycle, derecognising the carrying amount of the
  part replaced. A relined hearth genuinely looks like the second: it is a physical component with
  its own service cycle. The reason the choice does not matter here is that the cycle is exactly one
  year, equal to the reporting period. Capitalising 180,000 at the start of a period and depreciating
  it fully within that same period produces identical EBIT (180,000 of depreciation displaces 180,000
  of opex) and identical free cash flow (the +D&A add-back of 180,000 is exactly cancelled by
  180,000 of capex). The two treatments are arithmetically indistinguishable in both NOPAT and FCFF.
  I therefore expense it, which is the simpler presentation, and record the equivalence.

  What is NOT immaterial is the link the founder himself draws: fifteen years holds 'if you look
  after it', and looking after it costs 180,000 a year. The maintenance line and the fifteen-year
  life are one package, not two independent assumptions. They must be varied together or not at all.

  Total cash operating expense per period:

      flour        27,375,000
      wood            292,000
      bakers        2,400,000
      rent          9,600,000
      maintenance     180,000
      -----------------------
      cash opex    39,847,000

  EBITDA:

      EBITDA = 45,625,000 - 39,847,000 = 5,778,000 XOF per period

  That is a 12.67% EBITDA margin, and it recurs unchanged in all eleven periods because every driver
  behind it is flat.

  4. THE OVEN — CAPITALISATION, ELAPSED LIFE, AND THE DEPRECIATION SCHEDULE

  The oven is a self-constructed item of property, plant and equipment: 'I had it built'. Under
  IAS 16.22 its cost is the cost of construction, which the founder states as 3,200,000 XOF. That is
  the gross carrying amount and it does not change over the horizon — no additions, no disposals,
  no revaluation.

  Useful life is stated at fifteen years by the tradesman who builds these ovens; that is a
  competent-source estimate and I adopt it. Residual value is not stated. A fixed masonry oven is
  knocked down in place at end of life and its bricks are not worth the labour of recovering them,
  so I set residual to nil — a prior I supplied, flagged as such.

  Straight-line is the right pattern, not merely the lazy one: the oven is fired to the same duty
  every single day of its life, so the consumption of its economic benefits is even (IAS 16.60).

      annual depreciation = (3,200,000 - 0) / 15 = 213,333.33 XOF per year

  The oven is not new. Four years of that charge have already run:

      accumulated depreciation at start of t=0 = 4 x 213,333.33 = 853,333.33
      net book value at start of t=0           = 3,200,000 - 853,333.33 = 2,346,666.67

  This opening state is what makes the depreciation schedule non-trivial, and it is where a careless
  engine goes wrong: starting the clock at t=0 would leave the oven half-written-down at the end of
  the grid. The roll-forward per period, oven service-year in brackets:

      t=0  (yr 5)  open 2,346,666.67  - 213,333.33  = close 2,133,333.33   accum 1,066,666.67
      t=1  (yr 6)  open 2,133,333.33  - 213,333.33  = close 1,920,000.00   accum 1,280,000.00
      t=2  (yr 7)  open 1,920,000.00  - 213,333.33  = close 1,706,666.67   accum 1,493,333.33
      t=3  (yr 8)  open 1,706,666.67  - 213,333.33  = close 1,493,333.33   accum 1,706,666.67
      t=4  (yr 9)  open 1,493,333.33  - 213,333.33  = close 1,280,000.00   accum 1,920,000.00
      t=5  (yr 10) open 1,280,000.00  - 213,333.33  = close 1,066,666.67   accum 2,133,333.33
      t=6  (yr 11) open 1,066,666.67  - 213,333.33  = close   853,333.33   accum 2,346,666.67
      t=7  (yr 12) open   853,333.33  - 213,333.33  = close   640,000.00   accum 2,560,000.00
      t=8  (yr 13) open   640,000.00  - 213,333.33  = close   426,666.67   accum 2,773,333.33
      t=9  (yr 14) open   426,666.67  - 213,333.33  = close   213,333.33   accum 2,986,666.67
      t=10 (yr 15) open   213,333.33  - 213,333.33  = close         0.00   accum 3,200,000.00

  The horizon is validated by its own terminal state: accumulated depreciation lands exactly on the
  3,200,000 construction cost, net book value lands exactly on nil, and the sum of the eleven
  depreciation charges equals the 2,346,666.67 of net book value standing at t=0. Nothing is left
  stranded on the balance sheet at the end of the grid.

  I keep the reline in the final period. The mason comes at the end of the rains, roughly
  three-quarters of the way through the year, and that reline is what carries the oven through to
  the end of its fifteenth year; skipping it would not leave the year's output intact.

  5. EBIT, TAX AND NOPAT

      EBIT = EBITDA - depreciation = 5,778,000 - 213,333.33 = 5,564,666.67 XOF per period

  Tax. Nothing is stated. This is a genuine gap and the question I would put first is which regime
  he files under, because at roughly 45.6m of turnover a bakery in a CFA-zone jurisdiction may well
  sit under a synthetic or presumptive regime — a lump sum or a turnover levy — rather than the
  corporate rate on profit. Lacking that, I apply the modal statutory corporate income tax rate of
  the zone, 30%, to EBIT. That is the correct unlevered construction: the tax charged in an FCFF
  build is the tax the business would bear with no debt, so it is computed on EBIT and not on any
  post-interest figure.

      tax on EBIT = 0.30 x 5,564,666.67 = 1,669,400.00
      NOPAT       = 5,564,666.67 - 1,669,400.00 = 3,895,266.67 XOF per period

  6. WORKING CAPITAL

  The founder says nothing about stock, credit given or credit taken, so all three are priors I
  supply and flag.

  Receivables: nil. Bread over a counter is a cash trade; control and cash pass at the same instant.
  Inventory: one week of flour, the standard holding for a bakery that buys sacks from a wholesaler
  rather than taking daily delivery.

      inventory = 7 days x (150 XOF/loaf x 500 loaves/day) = 7 x 75,000 = 525,000 XOF

  Payables: nil, on the prior that a small bakery without a credit line pays the flour man on
  collection.

      NWC = 525,000 + 0 - 0 = 525,000 XOF, in every period

  Now the point that actually matters for the cash flow. This business has flat volumes, flat prices
  and flat input costs across all eleven periods, so its working capital requirement never moves.
  The 525,000 was tied up years ago, in the ordinary course of a business that has been trading for
  four years; it is part of the opening balance sheet, not a forward investment. Consequently:

      change in NWC = 0 in every period, t=0 through t=10

  The FCFF stream over this horizon is therefore insensitive to the level of the working capital
  priors. Only the opening tie-up depends on them, and that is already sunk. This is a finding, not
  a convenience: it says the answer to 'how much flour do you keep?' cannot change the forward
  unlevered cash flow of a flat business, only the amount of capital already standing in it.

  7. CAPITAL EXPENDITURE

  Zero in every period. The oven, the sole durable asset the founder names, is already built and
  paid for; its replacement falls at the boundary of the grid and therefore in period twelve, which
  the horizon deliberately excludes. The annual reline is expensed, per section 3(e), and would in
  any case wash out against its own add-back if capitalised. No other capital item is mentioned, and
  I have recorded the question that would test that.

  8. FREE CASH FLOW TO THE FIRM

      FCFF = NOPAT + D&A - change in NWC - capex
           = 3,895,266.67 + 213,333.33 - 0 - 0
           = 4,108,600.00 XOF per period

  Cross-check by the short route, which must agree by construction:

      FCFF = EBITDA - cash tax on EBIT - change in NWC - capex
           = 5,778,000 - 1,669,400 - 0 - 0
           = 4,108,600.00  ✓

  And by the statement route:

      CFO = NOPAT + D&A - change in NWC = 4,108,600.00
      CFI = -capex                      =         0.00
      FCFF = CFO + CFI                  = 4,108,600.00  ✓

  Every period is numerically identical, and this is not laziness but the direct consequence of the
  founder's own description: he gives no growth, no price path, no escalation, no seasonality, and
  no step in the cost base, and the depreciation charge runs unbroken from the oven's fifth year to
  its fifteenth. The only quantities that move across the grid are the two stock accounts — the
  oven's accumulated depreciation and its net book value — and those move by exactly the same
  213,333.33 each year.

  Over the eleven-period horizon the bakery throws off 45,194,600 XOF of unlevered free cash flow,
  against an oven that cost 3,200,000 to build. No discounting is applied: the brief asks for the
  cash flow stream on the asset side, and nothing in the utterance identifies a cost of capital.

  9. WHAT THE NUMBER IS AND IS NOT

  It is the cash the assets of this bakery generate, before any financing and before any distribution
  to the founder, over the remaining life of the oven, on the founder's stated prices, volumes and
  costs. It is not the return to the founder's capital alone, because it is earned partly by his own
  unpaid daily labour, which carries no expense line. And it is not a complete cost picture: yeast,
  salt, water, packaging, the trading licence and any electricity are absent from what he told me,
  so this is the top of the range rather than the middle of it.


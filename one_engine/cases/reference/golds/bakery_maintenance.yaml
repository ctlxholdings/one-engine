    date: "2026-07-25"

  oven_life_years:
    value: 15
    unit: years
    prov: STATED
    source: "utterance span 'it will go fifteen years if you look after it' — total useful life from commissioning, conditional on the maintenance the founder confirms he performs"
    date: "2026-07-25"

  oven_age_years:
    value: 4
    unit: years
    prov: STATED
    source: "utterance span 'I had it built four years ago'"
    date: "2026-07-25"

  oven_remaining_life_years:
    value: 11
    unit: years
    prov: INFERRED
    source: "oven_life_years - oven_age_years = 15 - 4 = 11; deductive, no new information"
    date: "2026-07-25"

  days_per_year:
    value: 365
    unit: days/year
    prov: ASSUMED
    source: "PRIOR — 365 baking days. The calendar year (365, leap days ignored) is a DEFAULTED convention, but the number of BAKING days is not entailed by the utterance and carries an unstated premise about the oven's availability, so the input as a whole is ASSUMED. 'Je travaille tous les jours' / 'I work every day' is a statement about the FOUNDER's working pattern, not the oven's: he can work every day — buying flour, keeping accounts, supervising the mason — while the oven is cold. Two STATED facts collide here and this input resolves the collision silently in favour of one: the founder also states that every year 'il vient refaire la sole et reprendre le mortier' / the mason relines the hearth and redoes the mortar. A relined hearth cannot be taken to baking temperature until the fresh mortar and refractory have been re-cured over a graduated series of sub-baking-temperature fires, so some baking days are lost every year to the very maintenance this gold is built to isolate. The premise supplied here — that the reline costs money but no baking days — is a prior, not a deduction. ELICITED, and the first question to put: how many days is the oven out of service when the mason relines it, and do you bake at all during the re-cure? Direction only: any downtime lowers volume and therefore revenue and FCFF, while wood, rent and wages are unaffected."
    date: "2026-07-25"
    correction: "2026-07-26 — PROVENANCE CORRECTED after physical audit (tag only; no number changed). Was DEFAULTED, with source claiming the utterance 'entails zero closure days'. That is an over-claimed entailment smuggling an unstated world-assumption under a stronger label — a CORRECT-class defect per FEEDBACK_TRIAGE.md, the same class as grain's zero-shrinkage tag, and repaired the same way: re-tag and name the premise, do not invent a downtime figure the founder never gave. The 365 stands as the author's disclosed prior; what was wrong was calling it a deduction. Maintenance-downtime is queued as a SPAWN sibling."


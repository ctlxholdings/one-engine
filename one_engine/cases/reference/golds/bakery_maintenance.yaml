checks:
  - "grid.periods == oven_life_years - oven_age_years"
  - "grid.periods == oven_remaining_life_years"
  - "trace.oven_year[first] == oven_age_years + 1"
  - "trace.oven_year[t] == trace.oven_year[t-1] + 1 for t >= 1"
  - "trace.oven_year[last] == oven_life_years"
  - "trace.days_operated[t] == days_per_year"
  - "trace.loaves_sold[t] == loaves_per_day * trace.days_operated[t]"
  - "trace.loaves_sold[t] >= 0"
  - "trace.revenue[t] == price_per_loaf * trace.loaves_sold[t]"
  - "trace.flour_cost[t] == flour_cost_per_loaf * trace.loaves_sold[t]"
  - "trace.wood_cost[t] == wood_cost_per_day * trace.days_operated[t]"
  - "trace.labour_cost[t] == n_bakers * baker_wage_monthly * months_per_year"
  - "trace.rent_cost[t] == rent_monthly * months_per_year"
  - "trace.maintenance_cost[t] == reline_cost_annual"
  - "sum(trace.maintenance_cost) == reline_cost_annual * grid.periods"
  - "trace.cash_opex[t] == trace.flour_cost[t] + trace.wood_cost[t] + trace.labour_cost[t] + trace.rent_cost[t] + trace.maintenance_cost[t]"
  - "trace.ebitda[t] == trace.revenue[t] - trace.cash_opex[t]"
  - "trace.oven_gross[t] == oven_cost"
  - "trace.capex[t] == capex_in_horizon"
  - "trace.depreciation[t] == (oven_cost - oven_residual_value) / oven_life_years"
  - "trace.accum_dep[first] == accum_dep_opening + trace.depreciation[first]"
  - "trace.accum_dep[t] == trace.accum_dep[t-1] + trace.depreciation[t] for t >= 1"
  - "trace.accum_dep[t] <= oven_cost"
  - "trace.accum_dep[last] == oven_cost"
  - "trace.oven_nbv[first] == oven_nbv_opening - trace.depreciation[first] + trace.capex[first]"
  - "trace.oven_nbv[t] == trace.oven_nbv[t-1] - trace.depreciation[t] + trace.capex[t] for t >= 1"
  - "trace.oven_nbv[t] == trace.oven_gross[t] - trace.accum_dep[t]"
  - "trace.oven_nbv[t] >= 0"
  - "trace.oven_nbv[last] == oven_residual_value"
  - "oven_nbv_opening == oven_cost - accum_dep_opening"
  - "sum(trace.depreciation) == oven_nbv_opening - oven_residual_value"
  - "trace.ebit[t] == trace.ebitda[t] - trace.depreciation[t]"
  - "trace.ebitda[t] >= trace.ebit[t]"
  - "trace.tax_on_ebit[t] == tax_rate * trace.ebit[t]"
  - "trace.nopat[t] == trace.ebit[t] - trace.tax_on_ebit[t]"
  - "trace.inventory[t] == flour_days_on_hand * flour_cost_per_loaf * loaves_per_day"
  - "trace.receivables[t] == receivables_days * price_per_loaf * loaves_per_day"
  - "trace.payables[t] == payables_days * flour_cost_per_loaf * loaves_per_day"
  - "trace.inventory[t] >= 0"
  - "trace.nwc[t] == trace.inventory[t] + trace.receivables[t] - trace.payables[t]"
  - "trace.nwc[t] >= 0"
  - "trace.nwc[first] == nwc_opening_balance + trace.delta_nwc[first]"
  - "trace.nwc[t] == trace.nwc[t-1] + trace.delta_nwc[t] for t >= 1"
  - "cumsum(trace.delta_nwc) == trace.nwc - nwc_opening_balance"
  - "trace.cfo[t] == trace.nopat[t] + trace.depreciation[t] - trace.delta_nwc[t]"
  - "trace.cfi[t] == 0 - trace.capex[t]"
  - "trace.fcff[t] == trace.cfo[t] + trace.cfi[t]"
  - "trace.fcff[t] == trace.nopat[t] + trace.depreciation[t] - trace.delta_nwc[t] - trace.capex[t]"
  - "trace.fcff[t] == trace.ebitda[t] - trace.tax_on_ebit[t] - trace.delta_nwc[t] - trace.capex[t]"

    source: "oven_cost - accum_dep_opening = 3200000 - 853333.3333333333; inherits the ASSUMED residual, hence ASSUMED by propagation"
    date: "2026-07-25"

  tax_rate:
    value: 0.30
    unit: fraction
    prov: ASSUMED
    source: "domain prior — modal statutory corporate income tax rate across the CFA-franc zone (rates in the band 25%-35%). ELICITED question not yet put to the founder: 'are you taxed under the régime réel at the corporate rate, or under a synthetic/presumptive regime, and what did you actually pay last year?'"
    date: "2026-07-25"

  flour_days_on_hand:
    value: 7
    unit: days
    prov: ASSUMED
    source: "domain prior — a one-week flour purchasing cycle is the standard holding for a small bakery buying sacks from a wholesaler rather than taking daily delivery. ELICITED question not yet put to the founder: 'how often do you buy flour, and how many sacks do you keep in the store?'"
    date: "2026-07-25"

  receivables_days:
    value: 0
    unit: days
    prov: ASSUMED
    source: "domain prior — counter-trade bread retail is settled in cash at the point of sale; no trade receivable arises. ELICITED question not yet put to the founder: 'does anyone take bread on account — a school, a canteen, a hotel?'"
    date: "2026-07-25"

  payables_days:
    value: 0
    unit: days
    prov: ASSUMED
    source: "domain prior — a small bakery without a formal credit line pays the flour wholesaler on collection. ELICITED question not yet put to the founder: 'do you pay the flour man on the spot or at the end of the month?'"
    date: "2026-07-25"

  nwc_opening_balance:
    value: 525000
    unit: XOF
    prov: ASSUMED
    source: "flour_days_on_hand * flour_cost_per_loaf * loaves_per_day = 7 * 150 * 500; the business is four years old so this stock already exists at t=0. ASSUMED by propagation from flour_days_on_hand"
    date: "2026-07-25"

  capex_in_horizon:

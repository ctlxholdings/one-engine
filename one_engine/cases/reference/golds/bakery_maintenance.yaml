notes:

  - >-
    HORIZON. Eleven annual periods, set equal to the oven's remaining useful life. The grid closes
    with the sole durable asset written down exactly to nil, which means no terminal book value has
    to be disposed of and no replacement price for a new oven has to be invented inside the model.
    Extending past period eleven would require an ASSUMED replacement cost, which the utterance does
    not supply — that is deferred, with the elicitation question 'if you had to build that oven
    again today, what would the mason charge?'

  - >-
    THE RELINE — IAS 16.12 VERSUS IAS 16.13. I expense the annual 180,000 as day-to-day servicing
    (IAS 16.12). The competing reading — that the hearth lining is a replaced component to be
    capitalised and derecognised under IAS 16.13 — is defensible on the physics, but it makes no
    arithmetic difference here because the replacement cycle is exactly one reporting period:
    capitalising and fully depreciating within the same year displaces an identical amount of opex
    in EBIT, and the resulting D&A add-back is exactly cancelled by the resulting capex in FCFF. The
    friction is noted rather than resolved, because it would matter immediately if the mason's cycle
    were ever other than annual.

  - >-
    MAINTENANCE AND LIFE ARE ONE PACKAGE. The fifteen-year life is stated conditionally — 'if you
    look after it' — and the 180,000 a year is the price of that condition. They are not two
    independent assumptions and must never be flexed independently. Dropping the maintenance line
    would shorten the life, shorten the horizon, and raise the depreciation rate simultaneously.

  - >-
    RENT AND IFRS 16. Expensed in full under the short-term-lease recognition exemption, because
    nothing in the utterance establishes an enforceable lease term beyond one month. ELICITED: is
    there a written lease, and for how long? If a multi-year lease exists, the rent leaves operating
    expense and reappears as right-of-use depreciation plus lease interest — which would raise
    EBITDA and move part of the outflow below the unlevered line, changing the composition of the
    answer even where it does not change the underlying cash.

  - >-
    UNPAID OWNER LABOUR. The founder works every day and draws no stated salary. IFRS recognises no
    expense absent a transaction, so EBIT and hence FCFF carry no charge for his time. The
    consequence is directional and should be stated plainly to any reader of the number: the FCFF
    computed here is the return to the assets plus the founder's uncompensated labour, so the return
    to capital standing alone is lower than the figure shown. ELICITED: what would he have to pay a
    manager to do what he does?

  - >-
    COST COMPLETENESS. Yeast, salt, water, packaging, the trading licence or patente, any
    electricity, transport of flour, and spoilage are all absent from the utterance. A bakery
    incurs at least some of these. The cost base as stated is therefore probably incomplete and the
    FCFF derived from it should be read as the upper end of the range rather than the centre.
    BOUND 2026-07-26 (physical audit; disclosure completed, no number changed). This list omitted the
    single largest omitted STATUTORY cost: EMPLOYER SOCIAL CONTRIBUTIONS on the two bakers. Payroll is
    carried at the stated cash wage with nothing on top, but a declared employee in a CFA-zone
    jurisdiction carries employer-side pension, family-benefit, work-accident and payroll-levy
    contributions above the wage. Whether they apply here is genuinely conditional — an informal
    village bakery very likely does not declare its bakers, and "je paie deux boulangers cent mille
    francs par mois chacun" plausibly describes total cash out — so no charge is taken. The defect
    corrected here is not the omission but the disclosure gap: a note enumerating eight missing costs
    silently passed over the one that would exceed most of them combined. Direction only: if the
    bakers are declared, labour cost rises and FCFF falls, and it falls further under a
    turnover-based tax regime, where the extra cost is not deductible against the levy.
    Note also that under a presumptive regime such as a contribution globale unique the patente
    listed above is subsumed into the levy rather than being a separate missing cost — so the two
    disclosures are conditional on regime and not simultaneously true.

  - >-
    TAX REGIME. The 30% on EBIT is a supplied prior — the modal CFA-zone statutory corporate rate —
    not something the founder said. At roughly forty-six million of annual turnover this business may
    well sit under a synthetic or presumptive regime, where the charge would be a lump sum or a levy
    on turnover rather than a percentage of profit, and would not respond to the depreciation
    shield at all. This is the single input most likely to be wrong and the first question I would
    put. A minimum-tax floor of the impôt-minimum-forfaitaire type is not modelled; the business is
    profitable throughout, so such a floor would not be expected to bind.
    BOUND 2026-07-26 (physical audit; reasoning corrected, no number changed). Three repairs to the
    argument above, none of which moves the trace. (a) The threshold test was ANSWERABLE from stated
    inputs and should not have been left at "may well": annual turnover is derived in §2 from STATED
    quantities alone, and a turnover of that size falls inside the presumptive band in the major
    WAEMU jurisdictions — Senegal's contribution globale unique (goods, ceiling 50,000,000) and Côte
    d'Ivoire's taxe d'État de l'entreprenant (band 5,000,001–50,000,000). Which one applies is NOT
    determinable, because the utterance names no country; that ambiguity is why no rate is changed
    here. (b) The wrong tax HEAD is applied before the rate is even reached: "je tiens une
    boulangerie" describes an entreprise individuelle, and a CORPORATE income tax rate is not the
    right instrument for a sole trader in any of these jurisdictions. (c) The minimum-tax argument is
    a non sequitur — profitability is not what makes a turnover-based floor bind or not bind; a floor
    binds when tax computed on profit falls below it, which happens to profitable thin-margin
    businesses routinely, and some jurisdictions set the floor as a lump sum that is invisible to a
    profitability test altogether. Retained as generated per the library rule that an honestly
    disclosed ASSUMED value is not a defect; logged as evidence in docs/CAPTURE_FINDINGS.md
    Finding 1, whose whole subject is this systematic default.

  - >-
    VAT. Basic foodstuffs including bread are commonly exempt or zero-rated in CFA-zone VAT regimes.
    I have taken the stated 250 and 150 as the actual cash amounts received and paid, which is the
    right treatment under exemption. If the business were registered and bread standard-rated, both
    revenue and flour would need restating net of tax and the arithmetic would have to be redone
    from the top.

  - >-
    WORKING CAPITAL IS INERT HERE — CONDITIONAL ON THE HORIZON BEING A TRUNCATION, NOT A WIND-UP.
    Flat volumes, flat prices and flat input costs mean the working capital requirement never moves
    across the grid, so the change in net working capital is zero in every period and the FCFF stream
    is insensitive to the level of the inventory, receivable and payable priors. Only the opening
    tie-up — already sunk, four years into trading — depends on them. The three priors are still
    flagged and their elicitation questions recorded, because they matter for the opening balance
    sheet and would matter immediately if volumes ever changed.
    BOUND 2026-07-26 (physical audit; scope of the claim narrowed, no number changed). As first
    written this said "AND THAT IS A FINDING", asserting unconditionally that the level of the
    working-capital priors cannot change the forward cash flow. That is true only under a
    going-concern TRUNCATION reading, in which the grid stops but the bakery does not. It is false
    under the WIND-UP reading that §0 leans on to justify the horizon ("the model ends with the only
    durable asset exactly written down to nil"): if the business genuinely ceases at t=10 the flour
    stock is realised and the terminal period carries a working-capital release, at which point the
    answer does depend on flour_days_on_hand. The trace is built on the truncation reading, which is
    the economically right one for a bakery whose oven would simply be rebuilt — but the horizon
    justification and the cash flows were drawn from two different readings, and the claim was stated
    with a confidence only one of them supports. Numbers stand; the over-claim is withdrawn.

  - >-
    NO GROWTH AND NO INFLATION. Nothing in the utterance supports a price path, a volume path, a
    wage escalator or a rent review, so everything is held flat in nominal terms. Directionally, if
    nominal inflation is positive and the founder cannot pass it through to a socially sensitive
    bread price, the real cash flow declines across the horizon and the flour and wage lines
    compress the hundred-franc gross margin per loaf. ELICITED: has the loaf price moved in the last
    four years, and has the landlord raised the rent?

  - >-
    VOLUME EQUALS PRODUCTION. All five hundred loaves are taken to sell every day, which follows the
    founder's own phrasing rather than a supplied prior, but no waste, no stale returns and no
    seasonality (Ramadan, harvest, school terms) are modelled. Directionally, any unsold bread
    reduces revenue without reducing flour, wood or labour, so it bites the margin twice as hard as
    it bites the top line.

  - >-
    CALENDAR. 365 days flat in every period; leap days are not modelled. 'I work every day' is taken
    at face value as zero closure days, which is a strong statement and worth confirming.

  - >-
    CURRENCY. Taken as the CFA franc, written XOF. The derivation is unit-agnostic and nothing
    depends on which of the two CFA francs applies. ELICITED: which country is this?

  - >-
    NO DISCOUNTING AND NO VALUATION. The brief asks for the asset-side cash flow stream, and nothing
    in the utterance identifies a cost of capital, a capital structure or a required return, so no
    WACC is derivable and none is applied. Turning this stream into an enterprise value is deferred
    and would require inputs the founder has not given.

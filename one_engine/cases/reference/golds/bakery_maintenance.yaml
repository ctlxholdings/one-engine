  reline_cost_annual:
    value: 180000
    unit: XOF/year
    prov: STATED
    source: "utterance span 'every year at the end of the rains he comes and relines the hearth and redoes the mortar, and that runs me a hundred and eighty thousand francs' — 'every year' fixes both the amount and the annual frequency"
    date: "2026-07-25"


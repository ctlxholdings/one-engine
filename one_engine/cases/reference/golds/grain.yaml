checks:
  # --- conservation ---
  - "trace.inventory[t] == trace.inventory[t-1] + trace.inventory_added[t] - trace.inventory_removed[t]"
  - "cumsum(trace.delta_nwc) == trace.nwc"
  - "trace.nwc == trace.inventory"
  - "trace.inventory[last] == 0"
  - "sum(trace.delta_nwc) == 0"
  - "sum(trace.inventory_added) == sum(trace.inventory_removed)"
  - "trace.inventory_removed == trace.cogs"
  - "sum(trace.fcff) == sum(trace.nopat)"
  # --- definition (the ladder) ---
  - "trace.ebitda == trace.revenue - trace.cogs - trace.opex"
  - "trace.ebit == trace.ebitda - trace.da"
  - "trace.tax == tax_rate * trace.ebit"
  - "trace.nopat == trace.ebit - trace.tax"
  - "trace.cfo == trace.nopat + trace.da - trace.delta_nwc"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.fcff == trace.nopat + trace.da - trace.delta_nwc - trace.capex"
  # --- driver-bridge ---
  - "trace.revenue == sale_price * trace.sales_bags"
  - "trace.cogs == landed_unit_cost * trace.sales_bags"
  - "trace.inventory_added == landed_unit_cost * trace.purchase_bags"
  - "trace.opex == rent_monthly"
  - "landed_unit_cost == purchase_price + transport_unit"
  - "sum(trace.purchase_bags) == purchase_qty"
  - "sum(trace.sales_bags) == purchase_qty"
  - "sum(trace.revenue) == sale_price * purchase_qty"
  - "sum(trace.cogs) == landed_unit_cost * purchase_qty"
  - "trace.da == 0"
  - "trace.capex == 0"
  # --- non-negativity ---
  - "trace.inventory[t] >= 0"
  - "trace.revenue[t] >= 0"
  - "trace.cogs[t] >= 0"
  - "trace.opex[t] >= 0"
  - "trace.nwc[t] >= 0"

notes: |
  HEADLINE. One campaign generates unlevered FCFF ≈ 507,500 XOF after a 30%
  assumed profit tax (725,000 pre-tax). Working capital peaks at 2,915,000 XOF
  sunk Nov→May; the trade is a ~28× turn of a small margin on a large seasonal
  cash sink. Return on the cash cycle ≈ 725,000 / 2,915,000 = 24.9% pre-tax over
  ~9 months of holding — the arbitrage that motivates the whole business.

  MOST MATERIAL JUDGMENT CALLS (each would move FCFF):
  1) TAX REGIME — the single biggest uncertainty. I applied Mali's 30% Impôt sur
     les Sociétés as an ASSUMED corporate rate for a clean NOPAT build. But a lone
     trader with 4.0M XOF turnover almost certainly sits under the Impôt Synthétique
     (a fixed presumptive levy, not profit-based, and far smaller in absolute XOF
     than 217,500). If so, FCFF is close to the 725,000 pre-tax figure less a
     fixed lump sum. ELICIT the regime; I surfaced pre-tax numbers so either can be
     dropped in without rebuilding.
  2) RENT MONTHS — base case charges 12 months (continuous lease of "mon magasin").
     If the warehouse is only held during the campaign (Nov→Aug, 10 months), annual
     rent = 300,000, EBIT = 785,000, NOPAT = 549,500, and the two idle-month
     −21,000 carries (Sep/Oct) disappear — FCFF ≈ +42,000 higher post-tax.
  3) SALES SPLIT — even 200/3 per month. Monthly split does not change annual FCFF,
     only the intra-year timing (and thus any NPV/IRR). Per-month selling volume is
     exactly 200/3 bags; the monetary arrays equal that fraction × unit prices.
     Displayed decimals are rounded to 2 dp, so run checks with a small tolerance
     (≤ 1 XOF); they hold exactly under the 200/3 fraction.

  ACCOUNTING TREATMENTS MADE EXPLICIT (frictions with the natural description):
  - Transport (75/bag) is FREIGHT-IN → capitalised into landed inventory cost
    (IAS 2.11), released through COGS, NOT a standalone opex line. The founder
    names it separately, but accounting folds it into the bag's cost.
  - Rent is a PERIOD cost, NOT inventoriable (IAS 2.16(b): storage excluded absent
    a further production stage). This is why holding cost never enters COGS.
  - No owned assets ⇒ D&A = 0 and capex = 0. The "warehouse" appears only as rent.
    The FCFF = NOPAT + D&A − ΔNWC − capex build therefore collapses to
    NOPAT − ΔNWC; the model is essentially a margin engine wrapped around one
    inventory roll-forward.
  - Cash basis (AR = AP = 0) ⇒ NWC = inventory. If the founder buys on supplier
    credit or sells on credit, add AP/AR: supplier credit in Nov would sharply cut
    the peak cash sink and lift IRR; buyer credit in Jun–Aug would push the cash-in
    later than the revenue recognition shown here.

  DATA-QUALITY / PLAUSIBILITY FLAGS (used as stated, but noted):
  - Transport at 75 XOF/bag (~€0.11) is implausibly low for moving a ~100 kg sack
    from rural production zones to Bamako (real freight is often several hundred to
    a few thousand XOF/bag). Possibly a mis-statement, a per-bag-per-km rate, or an
    aggregation the founder handles differently. I used 75 verbatim; it is
    immaterial anyway (15,000 of a 2.9M cost base, ~0.5%). Would ELICIT to confirm.
  - Zero storage loss: 6–9 months of on-floor sorghum storage typically loses
    3–10% to insects/moisture without treatment. The founder states all 200 bags
    are sold, so I took loss = 0; a realistic 5% loss (10 bags) would cut revenue
    by 200,000 and pre-tax FCFF proportionally.

  ECONOMIC (non-cash) CAVEATS not in the FCFF:
  - Owner's labour is uncompensated ("je travaille seul"); the 507,500 is a return
    to BOTH his capital and his own time. An economic-profit view would deduct an
    imputed wage/opportunity cost, materially shrinking true surplus.
  - Price risk is entirely borne by the trader: the 20,000 lean-season price is
    STATED as a point estimate. Soudure prices are volatile; a poor spread year
    (e.g. 17,000) turns the trade barely profitable, and this single-scenario model
    shows none of that distribution.
  - This is one campaign. In steady state it repeats every 12 months; the per-cycle
    507,500 is the reusable annual FCFF, and Sep/Oct (t=10,11) is the idle bridge
    to the next November purchase.

  DEFERRED / WOULD-ELICIT: (a) tax regime and any fixed patente/licence fees;
  (b) whether rent is 10- or 12-month; (c) supplier/buyer credit terms; (d) true
  transport cost and any market/loading fees; (e) realistic storage shrinkage;
  (f) financing (if he borrows to fund the November buy, that is a levered overlay
  below this unlevered FCFF and does not change it).

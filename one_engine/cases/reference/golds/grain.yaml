passage: |
  BUSINESS MODEL (from the founder's own words). This is not a manufacturer — it
  is a seasonal STORAGE-ARBITRAGE trade. The founder buys sorghum cheap at harvest
  glut (November), warehouses it through the dry months, and sells dear in the
  "soudure" (lean season, June–August) when granaries are empty and prices peak.
  The entire enterprise IS a working-capital cycle: cash is sunk into grain in
  November and released as the grain is sold down June–August. There is no
  production, no owned plant, no payroll. So the FCFF build is dominated by (i) the
  gross trading margin and (ii) the inventory roll-forward; depreciation, capex and
  labour are all zero.

  NATURAL QUANTITIES. The founder's unit is the sac (bag) and the unit of time is
  the month. One campaign = 200 bags, one buy event (November), one sell window
  (June, July, August). I index months t=0…11 = Nov, Dec, Jan, Feb, Mar, Apr, May,
  Jun, Jul, Aug, Sep, Oct — a self-contained annual cycle that repeats.

  STEP 1 — LANDED UNIT COST (IAS 2 cost of purchase). The 200 bags cost 14,500 XOF
  each at the farm-gate/harvest market, plus 75 XOF/bag transport from the
  production zones into the Bamako warehouse. Under IAS 2.11 freight-in to bring
  inventory to its present location and condition is capitalised into the cost of
  inventory, not expensed. Landed unit cost = 14,500 + 75 = 14,575 XOF/bag.
  Total inventory laid down in November = 200 × 14,575 = 2,915,000 XOF. This whole
  amount is a cash outflow in November (cash-basis assumption; no supplier credit).

  STEP 2 — STORAGE IS A PERIOD COST, NOT INVENTORIABLE. IAS 2.16(b) excludes
  storage costs from the cost of inventory (there is no further production stage
  for a trader). So the 30,000 XOF/month warehouse rent is operating expense,
  expensed as incurred. I run it for all 12 months (continuous lease; see input
  rent_months and the campaign-only alternative in notes). Annual rent = 12 ×
  30,000 = 360,000.

  STEP 3 — REVENUE (recognised on sale, IAS 15/IFRS 15 — control passes to buyer).
  The founder sells all 200 bags at 20,000 XOF over June–August, evenly ⇒ 200/3 =
  66.667 bags/month for t=7,8,9. Monthly revenue = 20,000 × 66.667 = 1,333,333.33;
  three months ⇒ 4,000,000 total. No revenue in any other month.

  STEP 4 — COGS (matched to revenue). COGS releases inventory at the 14,575 landed
  cost as bags are sold: 14,575 × 66.667 = 971,666.67/month for t=7,8,9; zero
  elsewhere. Annual COGS = 200 × 14,575 = 2,915,000. Gross margin per bag =
  20,000 − 14,575 = 5,425 (27.1% on price; 37.2% on cost). Annual gross profit =
  200 × 5,425 = 1,085,000.

  STEP 5 — THE P&L LADDER (accrual), per month.
    EBITDA[t] = revenue[t] − COGS[t] − rent[t].
      • Non-selling months (t=0..6, 10, 11): 0 − 0 − 30,000 = −30,000.
      • Selling months (t=7,8,9): 1,333,333.33 − 971,666.67 − 30,000 = 331,666.67.
    D&A[t] = 0 (no owned assets) ⇒ EBIT[t] = EBITDA[t].
    Annual EBIT = 3×331,666.67 − 9×30,000 = 995,000 − 270,000 = 725,000.
    Tax[t] = 30% × EBIT[t] (symmetric; loss months carry an intra-year shield, i.e.
      the campaign is one taxable entity and the rent losses offset the selling
      profits within the year). Selling months: 99,500; other months: −9,000.
    NOPAT[t] = EBIT[t] − Tax[t] = 0.70 × EBIT[t].
      • Selling months: 232,166.67; other months: −21,000.
      Annual NOPAT = 0.70 × 725,000 = 507,500.

  STEP 6 — WORKING-CAPITAL ROLL-FORWARD. With cash settlement, NWC = inventory
  (AR = AP = 0). Inventory stock (at landed cost):
    added[t]   : 2,915,000 in November (t=0), else 0.
    removed[t] : = COGS[t] (971,666.67 in Jun/Jul/Aug), else 0.
    inventory[t] = inventory[t−1] + added[t] − removed[t]:
      t0..t6 = 2,915,000 ; t7 = 1,943,333.33 ; t8 = 971,666.67 ; t9..t11 = 0.
    NWC[t] = inventory[t]. ΔNWC[t] = NWC[t] − NWC[t−1]:
      t0 = +2,915,000 ; t7,t8,t9 = −971,666.67 each ; all other months = 0.
    Over the full cycle ΔNWC nets to zero — the November cash sink is fully
    released by the August sell-out (inventory ends at 0). This is the signature of
    a pure trading cycle.

  STEP 7 — UNLEVERED FCFF = NOPAT + D&A − ΔNWC − capex (D&A = capex = 0).
    Equivalently CFO = NOPAT + D&A − ΔNWC and CFI = −capex, FCFF = CFO + CFI.
      • November (t=0): −21,000 − 2,915,000 = −2,936,000. (Cash is sunk into grain;
        the −21,000 is the after-tax November rent carry.)
      • Dec–May (t=1..6) and Sep–Oct (t=10,11): −21,000 each (after-tax rent carry,
        no trading activity).
      • Jun/Jul/Aug (t=7,8,9): 232,166.67 − (−971,666.67) = 1,203,833.33 each
        (after-tax selling margin plus the inventory release).
    Sum over the year = −2,936,000 − 6×21,000 + 3×1,203,833.33 − 2×21,000
                      = −2,936,000 − 126,000 + 3,611,500 − 42,000 = 507,500.
    So one campaign throws off 507,500 XOF of unlevered free cash flow after a
    30% profit tax (725,000 pre-tax). The J-curve is stark: ≈ −2.94M sunk in
    November, recovered plus margin across the three lean-season months.

  RECONCILIATION (direct cash, pre-tax, sanity check independent of the ladder):
    − purchase 2,900,000 − transport 15,000 − rent 360,000 + sales 4,000,000
    = +725,000 pre-tax = EBIT. Applying 30% ⇒ 507,500. Matches the NOPAT build.


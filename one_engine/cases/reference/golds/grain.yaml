id: sorghum_trader_bamako_fcff
title: >-
  Unlevered FCFF (NOPAT build) — Bamako sorghum storage-arbitrage trader,
  one annual campaign at monthly frequency
currency: XOF          # West African CFA franc (FCFA); Bamako, Mali is in the WAEMU zone
grid:
  periods: 12          # one full annual cycle, Nov (t=0) … Oct (t=11)
  freq: monthly

utterance:
  fr: |
    Moi je suis commerçant, je fais le sorgho à Bamako. À la récolte, en novembre,
    j'achète deux cents sacs à quatorze mille cinq cents le sac. Je stocke dans mon
    magasin à Bamako. Je paie le magasin trente mille par mois. Je vends pendant la
    soudure, entre juin et août, à vingt mille le sac. Les deux cents sacs, je les
    écoule en trois mois. Le transport depuis les zones de production, c'est
    soixante-quinze francs par sac. Je travaille seul.
  en: |
    I'm a trader, I deal in sorghum in Bamako. At harvest, in November, I buy two
    hundred bags at fourteen thousand five hundred a bag. I store them in my
    warehouse in Bamako — thirty thousand a month rent. I sell during the lean
    season, June to August, at twenty thousand a bag. The two hundred bags I sell
    off over three months. Transport from the production zones is seventy-five
    francs a bag. I work alone.


    authority: 'Direction generale des impots du Mali, ''Les types d''entreprises et les regimes d''imposition'' - https://www.dgi.gouv.ml/les-types-dentreprises-et-les-regimes/ ; Code general des impots, regime de l''impot synthetique (Titre III, art. 70 et s.)'

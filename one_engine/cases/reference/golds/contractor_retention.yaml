    source: '"Je fais dans les vingt forages par an quand tout va bien." CARRIED BUT NOT USED IN THE DERIVATION: it is arithmetically incompatible with his own wip_max_concurrent and cycle_months (see passage, capacity closure, and the ELICITED throughput_boreholes_per_normal_month that replaces it).'
    date: '2026-07-27'
  rate_granite_m_per_day:
    value: 20
    unit: 'metres per rig-day in granite'
    prov: 'INFERRED'
    source: '"si on tombe sur le granit c''est deux fois moins vite" applied to the stated 40 m/day: 40 / 2. No new information.'
    date: '2026-07-27'
  good_ground_share:
    value: 0.75
    unit: 'fraction of boreholes in good ground'
    prov: 'INFERRED'
    source: 'Complement of granite_share: 1 - 0.25. Ground is either good or granite in the founder''s own dichotomy.'
    date: '2026-07-27'
  retention_recovery_prob:
    value: 0.9
    unit: 'fraction of retention eventually recovered'
    prov: 'INFERRED'
    source: 'Complement of retention_loss_prob: 1 - 0.10, from "je le recupere presque toujours ... une fois sur dix je ne le revois jamais".'
    date: '2026-07-27'
  situations_per_borehole:
    value: 2
    unit: 'situations (interim statements) per borehole'
    prov: 'INFERRED'
    source: '"je presente des situations" is plural over a two-month contract; the minimum plural consistent with a 2-month cycle billed monthly is 2 - one at the end of execution month 1, one at reception.'
    date: '2026-07-27'
  situation_pct_each:
    value: 0.35
    unit: 'fraction of contract value per situation, gross'
    prov: 'INFERRED'
    source: '(1 - advance_pct) / situations_per_borehole = 0.70 / 2. Equivalently: each situation certifies 50% of the works and recovers half the 30% advance (50% - 15% = 35%), which is exactly the pro-rata advance recovery required by art. 105.3 of the Code des marches publics.'
    date: '2026-07-27'
  situation_payment_lag_months:
    value: 3
    unit: 'months from filing a situation to cash'
    prov: 'INFERRED'
    source: '"il faut compter deux a trois mois avec l''administration" - the upper (later, conservative) end of the stated 2-3 month span. No prior from outside the utterance enters.'
    date: '2026-07-27'
  days_per_borehole_expected:
    value: 2.1875
    unit: 'rig-days of drilling per borehole'
    prov: 'INFERRED'
    source: 'granite_share * depth_avg_m / rate_granite_m_per_day + good_ground_share * depth_avg_m / rate_good_ground_m_per_day = 0.25*3.5 + 0.75*1.75.'
    date: '2026-07-27'
  gross_monthly_payroll_xof:
    value: 730000
    unit: 'XOF per month'
    prov: 'INFERRED'
    source: 'labourers_count * labourer_monthly_wage_xof + foreman_monthly_wage_xof = 4*120000 + 250000.'
    date: '2026-07-27'
  hivernage_months_in_horizon:
    value: 9
    unit: 'months'
    prov: 'INFERRED'
    source: 'hivernage_months_per_year * 3 years = 3 * 3, the horizon being 36 months starting in January.'
    date: '2026-07-27'
  annual_turnover_estimate_xof:
    value: 76800000

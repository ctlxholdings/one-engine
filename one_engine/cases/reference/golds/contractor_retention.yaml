notes:
  - |
    FINDING - THE OUTPUT CLAIM DOES NOT FIT THE PLANT. The founder makes three quantitative statements
    about capacity: two boreholes in progress at once, two months from start to reception, twenty
    boreholes a year. Any two of them determine the third, and the third contradicts them. Two in
    progress on a two-month cycle is one delivery per workable month; twenty a year needs more than four
    in progress at once. The derivation runs the pair that describes the plant and reports the conflict
    rather than splitting the difference. This is not a rounding and it is not absorbed anywhere in the
    arithmetic - it is the top-ranked question in `inputs`, and every revenue, cost and cash line below
    scales with its answer.
  - |
    FINDING - THE FOUNDER'S OWN EXPLANATION OF HIS CONSTRAINT IS WRONG. He says he can only run two at
    once "parce que je n'ai qu'une seule foreuse". The rig consumes 2.1875 days per borehole against
    roughly eighteen usable days in a normal month; it runs at 12% utilisation over the horizon. The rig
    is not the constraint. What he has one of, that actually binds, is a CREW - four labourers and a
    foreman are one team, and one team can be on one site. This matters commercially: buying a second
    rig would not raise output, and hiring a second crew might.
  - |
    FINDING - THE PRICE PROMISES A CHATEAU D'EAU THAT THE COST LIST DOES NOT CONTAIN. The 8,000,000
    explicitly covers "le sondage, le tubage, la pompe, le chateau d'eau". The 2,800,000 enumerates
    tubage PVC, crepine, gravier, ciment, pompe immergee and panneaux solaires - a tank and an elevated
    structure appear nowhere in it. Carried at zero, the omitting choice, so the gap stays visible.
    Direction if the founder confirms it is extra: margin and FCFF fall.
  - |
    FINDING - NO DRILLING CONSUMABLES ANYWHERE IN THE COST STACK. Bits, rods and the down-the-hole
    hammer are consumed on every borehole and consumed fastest in granite, which he says he meets one
    time in four. The materials list contains none of them and the 1,200,000 truck line is described as
    covering the camion, not the drill string. Carried at zero and elicited. Direction: down.
  - |
    FINDING - NO DRY HOLES. The utterance contains no failed borehole at all. Published work on West
    African crystalline basement puts productive-borehole rates around seventy percent, with failure
    rates in the same rock elsewhere running considerably worse; the granite the founder describes is
    exactly the setting in which holes come up dry. A dry hole consumes diesel, consumables and crew
    days and earns nothing unless the contract is priced per metre. Carried at zero, elicited, and wired
    so that a non-zero answer immediately adds cost without adding revenue. Direction: down.
  - |
    FINDING - THE TRUCK BUDGET WILL NOT COVER THE GROUND THE OPERATION HAS TO COVER. Working the stated
    1,200,000 a year backwards through the ONAP Bamako gasoil price and an ordinary consumption for a
    loaded rig carrier gives an annual distance that allows about one site round trip per borehole and
    nothing else - no return to install the pump and panels, no return for the reception, no run for a
    spare part. For a business working "a Bamako et dans les villages autour" that does not close, and
    it closes worse the more boreholes are done. Either the figure is understated, or fuel is a smaller
    share of it than modelled, or the villages are much nearer than the phrase implies; the elicited
    inputs are written to separate the three. Direction if the budget is understated: down.
  - |
    WORLD-FACT AGAINST BELIEF - THE ADVANCE. The founder states he receives thirty percent at start.
    Art. 105.1 of the Code des marches publics caps total advances at TWENTY percent of the initial
    amount for travaux (thirty percent is the cap for fournitures et autres services). Both objects are
    recorded separately in `inputs`: what he believes about his own contracts is a fact about his
    business; what the decree says is a fact about the world. Two reconciliations would remove the
    conflict without either being wrong - his boreholes may be let as fournitures rather than travaux,
    and NGO contracts are not public contracts and fall outside the Code entirely. The base case runs
    his stated thirty percent, because his direct experience of cash received is the better evidence of
    what he actually gets; if the cap binds, cash moves later in every contract.
  - |
    WORLD-FACT AGAINST BELIEF - THE PAYMENT DELAY. Art. 108.3 requires the contracting authority to pay
    acomptes and the solde within sixty days, and art. 108.6 opens an entitlement to interets moratoires
    "sans autre formalite et de plein droit" the day after that period expires, at not less than the
    BCEAO discount rate plus one point. The founder describes two to THREE months as normal and claims
    no such interest. He is therefore financing the administration's overrun himself and has a statutory
    claim he is not exercising. Not modelled - a claim never made is worth nothing - but it is a real
    asset of the business that a reader should know exists.
  - |
    WORLD-FACT NOT MENTIONED - THE ADVANCE GUARANTEE. Art. 105.3 makes a caution or first-demand bank
    guarantee for the FULL amount of the advance a condition of receiving it. The founder mentions no
    bank, no caution and no cost for one. If he does post guarantees, the commission is a real expense
    and any cash collateral the bank blocks is a further working-capital lock-up not modelled here.
    Carried at zero and elicited. Direction: down, on both profit and free cash.
  - |
    CORROBORATION - THE RETENTION. Art. 95.2 uses the founder's own words and, more usefully, his own
    BASE: the withholding may not exceed five percent "du montant des paiements". That settles a real
    modelling question - the retention bites on the mobilisation advance as well as on the situations -
    which changes the dates on which the money is withheld even though it does not change the total. The
    one-month statutory refund window after the guarantee period (art. 95.3) also confirms that twelve
    months is a floor, not the expected date, which is why the chasing lag is elicited rather than set
    to zero.
  - |
    JUDGMENT CALL - THE QUOTED EIGHT MILLION IS TREATED AS HORS TAXES. The reason is coherence rather
    than evidence: the 2,800,000 materials figure is unambiguously a purchase cost, and pairing a TTC
    price with HT costs would misstate the margin. This is NOT the conservative choice, and it is ranked
    high in the question list for that reason. If the eight million is what the mairie actually
    transfers, every revenue-driven line in the model falls.
  - |
    JUDGMENT CALL - ALL CLIENTS ARE PUT ON THE COUNCIL/NGO CALENDAR. The founder describes those terms
    in detail ("ca se passe toujours pareil") and says nothing about how the "quelques particuliers
    riches" pay. Rather than invent private terms, every borehole is run on the slowest terms described,
    which is conservative for cash. public_client_share is wired to the retention withheld; the
    administrative payment lag is applied to all contracts as a stated simplification, and that is the
    one place where the simplification is visible rather than conservative.
  - |
    SIMPLIFICATION - TWO SITUATIONS PER BOREHOLE, AT THE END OF EACH EXECUTION MONTH. The founder says
    "des situations", plural, over a two-month contract; two monthly certificates is the minimum plural
    consistent with that. The 35%/35% split is not invented: it is what falls out of art. 105.3, where
    the advance is recovered pro rata by deduction from the acomptes (50% of works less 15% of advance
    recovery). A different number of situations changes the cash PROFILE inside a contract but not the
    totals, and it changes the structure of the trace rather than the value of an input, so it is
    recorded here rather than as a wired question.
  - |
    SIMPLIFICATION - REVENUE IS SPREAD 50/50 ACROSS THE TWO EXECUTION MONTHS while diesel is expensed
    entirely in the drilling month and materials half in each. That is deliberate: costs are expensed as
    incurred and the drilling genuinely happens in month one, whereas the time-based input measure for
    revenue is the only measure the utterance supports. The friction is real and it is the reason
    contract_liability is materialised as its own row instead of being netted into receivables.
  - |
    FRICTION - THE MINIMUM TAX IS AN ANNUAL TEST SHOWN MONTHLY. trace.tax_imf carries the monthly
    pro-rata of the impot minimum forfaitaire and the greater of the two branches is asserted at horizon
    level rather than period level, because the profit tax exceeds the minimum by an order of magnitude
    in every year. If the cost omissions above are confirmed and the margin falls far enough, the
    minimum could become the binding branch, and at that point the monthly presentation would need
    replacing with an annual one.
  - |
    FRICTION - THE ACCOUNTING FRAMEWORK IS AUDCIF, NOT IFRS. Mali applies the OHADA Acte uniforme
    (SYSCOHADA revise). For a two-month works contract with progress certificates the treatment used
    here - recognition a l'avancement, amortissement lineaire, a contract liability for the unearned
    advance - is materially identical under both, so the substitution is safe; it is recorded because it
    is the applicable framework and a reader in Bamako will use its vocabulary.
  - |
    DEFERRED - NO GROWTH, AND WHY. The three modelled years are identical. Nothing in the utterance
    describes a pipeline, a tender won, a second crew or a price change, and a growth path invented here
    would be the analyst's forecast wearing the founder's clothes. The consequence is that the horizon's
    value lies in the WITHIN-YEAR shape - the seasonal working-capital swing and the retention tail -
    rather than in the trajectory.
  - |
    DEFERRED - NO RIG OVERHAUL. The founder describes no major maintenance on the drilling assembly, and
    the 1,200,000 line is described as the camion. A rig of this age will need at least a compressor or
    mud-pump rebuild inside a ten-year life. Not modelled, because there is nothing in the utterance to
    size it from and it is his own operation to answer for; noted so that its absence is not mistaken
    for its non-existence. Direction if it exists: down.
  - |
    OBSERVATION FOR THE READER - THE SEASONAL CASH PATTERN RUNS BACKWARDS FROM INTUITION. The hivernage
    is the worst operating quarter and the best cash quarter, because collections on pre-rains work keep
    arriving while nothing is being bought; the cash trough is in October and November, when two
    contracts restart and materials are paid for months before the corresponding situations are settled.
    Anyone sizing a working-capital facility for this business off annual figures would size it for the
    wrong month.

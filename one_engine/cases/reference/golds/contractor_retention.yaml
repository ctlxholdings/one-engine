  accounting_framework:
    value: 'AUDCIF (SYSCOHADA revise)'
    unit: 'framework label'
    prov: 'SOURCED'
    source: 'The applicable accounting framework in Mali is the OHADA AUDCIF, not IAS/IFRS. Its treatment of long-term contracts (methode a l''avancement), of amortissement lineaire and of client receivables is the one applied here and is materially identical to IFRS 15 for a two-month works contract.'
    authority: 'OHADA, Acte uniforme relatif au droit comptable et a l''information financiere (AUDCIF) / SYSCOHADA revise, adopte le 26 janvier 2017, en vigueur au 1er janvier 2018 - https://www.ohada.org'
    verified: '2026-07-27'
    fact_id: 'ML-V25-01'
  statutory_advance_cap_travaux:
    value: 0.2
    unit: 'fraction of the initial contract amount'
    prov: 'SOURCED'
    source: 'WORLD-FACT THAT DIVERGES FROM THE FOUNDER. The total of advances granted under a public contract may not exceed twenty percent of the initial amount for TRAVAUX and prestations intellectuelles (thirty percent for fournitures et autres services). The founder states he receives thirty percent from mairies. Both objects are recorded: what he believes about his own contracts, and what the rule says. Reconciliations that would remove the conflict: his contracts may be let as fournitures rather than travaux; and NGO contracts are not public contracts and are outside the Code entirely.'
    authority: 'Republique du Mali, Decret n 2015-0604/P-RM du 25 septembre 2015 portant Code des marches publics et des delegations de service public, art. 105.1 (Journal officiel de la Republique du Mali, 02 octobre 2015) - https://sgg-mali.ml/codes/mali-code-2015-marches-publics.pdf'
    verified: '2026-07-27'
  statutory_retention_cap:
    value: 0.05
    unit: 'fraction of each payment'
    prov: 'SOURCED'
    source: 'CORROBORATES THE FOUNDER EXACTLY, including the base. "La part des paiements retenue par l''autorite contractante ne peut etre superieure a cinq pour cent (5%) du montant des paiements." The base is the amount of the PAYMENTS, not the contract value, which settles the modelling question of whether the retention also bites on the advance: it does.'
    authority: 'Decret n 2015-0604/P-RM, art. 95.2 - https://sgg-mali.ml/codes/mali-code-2015-marches-publics.pdf'
    verified: '2026-07-27'
  statutory_retention_refund_window_months:
    value: 1
    unit: 'months after expiry of the delai de garantie'
    prov: 'SOURCED'
    source: 'The retention is restored, provided the holder has met its guarantee-period obligations, within one month following the expiry of the delai de garantie or at the reception definitive. So the legal earliest date is reception + 12 + 1 months; the founder''s chasing time sits on top of that. This is why retention_release_extra_lag_months is elicited rather than set to zero.'
    authority: 'Decret n 2015-0604/P-RM, art. 95.3 - https://sgg-mali.ml/codes/mali-code-2015-marches-publics.pdf'
    verified: '2026-07-27'
  statutory_payment_deadline_days:
    value: 60
    unit: 'days'
    prov: 'SOURCED'
    source: 'WORLD-FACT THAT DIVERGES FROM THE FOUNDER. The contracting authority must pay acomptes and the solde within a period that may not exceed sixty days; exceeding it opens, of right and without formality, an entitlement to interets moratoires at a rate no lower than the BCEAO discount rate plus one point (art. 108.6). The founder describes two to THREE months and claims no such interest.'
    authority: 'Decret n 2015-0604/P-RM, art. 108.3 and art. 108.6 - https://sgg-mali.ml/codes/mali-code-2015-marches-publics.pdf'
    verified: '2026-07-27'
  statutory_advance_guarantee_requirement:
    value: 1
    unit: 'fraction of the advance that must be guaranteed'
    prov: 'SOURCED'
    source: '"Les avances doivent etre garanties a concurrence de la totalite de leur montant" - a caution or first-demand bank guarantee for the FULL amount of the advance is a legal condition of receiving it, and it is released only as the advance is repaid (art. 97.1). The founder mentions no bank guarantee and no cost for one; this is the basis of the ELICITED advance_guarantee_fee_rate.'
    authority: 'Decret n 2015-0604/P-RM, art. 105.3 and art. 97.1 - https://sgg-mali.ml/codes/mali-code-2015-marches-publics.pdf'
    verified: '2026-07-27'
  borehole_success_rate_benchmark:
    value: 0.7
    unit: 'fraction of boreholes that are productive'
    prov: 'SOURCED'
    source: 'Regional order of magnitude for drilling in West African crystalline basement: about 70% of boreholes are productive in the crystalline bedrock aquifers of eastern Cote d''Ivoire; published failure rates in Nigerian crystalline rocks run 32% to 60%. Used ONLY to set the plausible span of the ELICITED dry_hole_rate - it is not a fact about this founder''s holes.'
    authority: 'Kouassi et al., specific-capacity study of crystalline bedrock aquifers, N''Zi / Iffou / Moronou, eastern Cote d''Ivoire, Groundwater for Sustainable Development (ScienceDirect S2352801X19300141); Borehole failures in crystalline rocks of South-Western Nigeria, GeoJournal (doi 10.1007/BF00813135)'
    verified: '2026-07-27'
  throughput_boreholes_per_normal_month:
    value: 1
    unit: 'boreholes started per workable month'
    prov: 'ELICITED'
    source: 'BASE CASE = the capacity-consistent figure, which is the conservative one. Little''s Law on the founder''s OWN two statements - at most two boreholes in progress at once, two months from start to reception - gives throughput = 2 / 2 = 1.0 per workable month, i.e. 9.6 per year after the hivernage stoppage. His separate claim of twenty per year needs 2.0833 starts per workable month (20 / 9.6 workable-month-equivalents), which by the same identity needs 4.1667 boreholes in progress at once, against a stated maximum of two. The two statements cannot both be true and the utterance gives no way to choose, so the derivation runs the one that fits the plant he describes.'
    question: 'When you say you can run two at a time, do you mean two sites with the rig and the crew actually on them, or two contracts open including the ones just sitting waiting for the reception paperwork - and how many boreholes did you actually hand over in the last twelve months?'
    range: {low: 1, high: 2.0833333333}
    materiality: 'high'
  hivernage_activity_factor:
    value: 0.2
    unit: 'fraction of normal activity during July-September'
    prov: 'ELICITED'
    source: '"je ne travaille presque pas" is a qualitative near-stoppage; 0.20 reads "almost not at all" as one workable month''s output spread over the three, which is the lower, more conservative end of what "presque pas" can mean without meaning zero.'
    question: 'In July, August and September last year, how many boreholes did you start and how many did you hand over?'
    range: {low: 0, high: 0.5}
    materiality: 'medium'
  price_ht_divisor:
    value: 1
    unit: 'divisor applied to the quoted price to reach revenue HT'
    prov: 'ELICITED'
    source: 'BASE CASE = 1.0, i.e. the quoted eight million is taken as HORS TAXES. Reason: his 2,800,000 materials figure is unambiguously a purchase cost and mixing a TTC price with HT costs would be incoherent; and a material part of his book is NGO work, frequently exonerated from TVA. This is NOT the conservative choice - if the eight million is TTC, revenue HT falls by 15.3% and every line below it moves - which is why the question is ranked high.'
    question: 'When you quote eight million for a complete borehole, is that the figure before TVA or the figure the mairie actually transfers - does the TVA sit on top of the eight million or inside it?'
    range: {low: 1, high: 1.18}
    materiality: 'high'
  chateau_deau_extra_cost_per_borehole_xof:
    value: 0
    unit: 'XOF per borehole'
    prov: 'ELICITED'
    source: 'BASE CASE = 0, the OMITTING choice: the founder''s 2,800,000 is an explicitly enumerated list - tubage PVC, crepine, gravier, ciment, pompe immergee, panneaux solaires - and that list contains no tank and no tower, while the eight-million price explicitly promises "le chateau d''eau". Carrying zero keeps the omission visible instead of burying an invented figure inside the materials cost. If the tower is genuinely extra, it is the single largest missing cost in this model.'
    question: 'Does the two million eight hundred thousand include the tank and the metal or masonry tower of the chateau d''eau, or do you buy those on top - and if on top, what do they cost you?'
    range: {low: 0, high: 2000000}
    materiality: 'high'
  dry_hole_rate:
    value: 0
    unit: 'additional holes drilled per borehole delivered'
    prov: 'ELICITED'
    source: 'BASE CASE = 0, the OMITTING choice: the founder never mentions a dry hole, and his twenty-a-year almost certainly counts delivered, paid boreholes. But drilling in the crystalline basement around Bamako fails materially often (see borehole_success_rate_benchmark) and granite - which he says he meets one time in four - is exactly where it fails. A dry hole burns diesel, bits and crew days and earns nothing unless the contract pays per metre.'
    question: 'Out of your last twenty holes, how many came up dry or below the yield the contract required - and when that happens, does the client still pay you, or do you carry it?'
    range: {low: 0, high: 0.43}
    materiality: 'high'
  advance_lag_months:
    value: 0
    unit: 'months from signature to the advance landing'
    prov: 'ELICITED'
    source: 'BASE CASE = 0, taken from the stated PURPOSE of the advance - "pour que je puisse acheter le materiel" - which only works if it arrives before he buys. This is the optimistic end; the same administration that takes two to three months on a situation is unlikely to be instant on an advance, and the advance is also legally conditional on his posting a full-value bank guarantee first.'
    question: 'On your last mairie contract, how many weeks passed between signing and the thirty percent actually landing in your account?'
    range: {low: 0, high: 3}
    materiality: 'medium'
  retention_release_extra_lag_months:
    value: 3
    unit: 'months of chasing beyond the legal release date'
    prov: 'ELICITED'
    source: 'BASE CASE = 3, the conservative choice, applying the same administrative delay he reports on ordinary situations to the retention claim, which he says has to be chased ("il faut relancer"). Note the law already adds one month beyond the guarantee period (art. 95.3), so 12 + 3 in this model straddles the legal 12 + 1.'
    question: 'Once the guarantee year is up, how long does it usually take from your first relance until the five percent is actually in the account?'
    range: {low: 0, high: 12}
    materiality: 'medium'
  drill_consumables_per_borehole_xof:
    value: 0
    unit: 'XOF per borehole'
    prov: 'ELICITED'
    source: 'BASE CASE = 0, the OMITTING choice, on the same reasoning as the chateau d''eau: the enumerated materials list contains no bits, no drill rods, no hammer and no mud/foam additive, and these are consumed on every hole - fastest in the granite he meets one time in four.'
    question: 'What do you spend on drill bits, rods and the hammer in a year, and how many holes does a bit last you in granite?'
    range: {low: 0, high: 400000}
    materiality: 'medium'
  public_client_share:
    value: 1
    unit: 'fraction of boreholes on mairie/NGO payment terms'
    prov: 'ELICITED'
    source: 'BASE CASE = 1.0, the conservative choice for cash: every borehole is put on the council/NGO calendar - advance, situations, five percent retention held for a year - because those terms are the only ones the founder describes ("Avec les mairies et les ONG ca se passe toujours pareil") and they are the slowest. Wired to the retention withheld; the payment lag is applied to all contracts as a stated simplification.'
    question: 'Of the boreholes you handed over last year, how many were for a mairie or an NGO - and the wealthy individuals, do they pay you cash on completion, or in stages with a retention too?'
    range: {low: 0.6, high: 1}
    materiality: 'medium'
  rig_useful_life_years:
    value: 10
    unit: 'years of total working life'
    prov: 'ELICITED'
    source: 'BASE CASE = 10 years total, of which three are gone, giving a book value of 28,000,000 at t=0 and no replacement inside the horizon. Affects FCFF only through the tax shield on depreciation, since D&A is added back.'
    question: 'How many more years do you expect to get out of the foreuse before it needs a full rebuild or replacing - and has it had a major overhaul yet?'
    range: {low: 8, high: 15}
    materiality: 'medium'
  rig_availability:
    value: 0.7
    unit: 'fraction of working days the rig can actually run'
    prov: 'ELICITED'
    source: 'BASE CASE = 0.70, allowing for breakdowns, servicing, fuel and spare-part supply, and crew absence. Used only in the capacity envelope, where the claimed output fits with roughly eight times the slack, so the exact figure changes nothing in the cash flow.'
    question: 'In a normal month, how many days is the foreuse standing idle because of a breakdown, a service or a missing part?'
    range: {low: 0.5, high: 0.9}
    materiality: 'low'
  workers_declared_share:
    value: 1
    unit: 'fraction of gross payroll actually declared to INPS'
    prov: 'ELICITED'
    source: 'BASE CASE = 1.0, the conservative choice: all five staff are treated as declared and the full employer charge is borne. Informal crews are common in this trade, so the true figure may be lower and the cost with it.'
    question: 'Are the four ouvriers and the chef de chantier declared to the INPS, and do you pay the employer charges on all five?'
    range: {low: 0, high: 1}
    materiality: 'low'
  advance_guarantee_fee_rate:
    value: 0
    unit: 'fraction of the advance, per contract'
    prov: 'ELICITED'
    source: 'BASE CASE = 0, the OMITTING choice: the founder mentions no bank guarantee, although art. 105.3 of the Code makes a full-value guarantee a condition of the advance. If he does post one, its commission is a real cost and any cash collateral is a further working-capital lock-up not modelled here.'
    question: 'To get the thirty percent, does the bank issue a caution for you - what does the bank charge, and does it block any of your money as collateral?'
    range: {low: 0, high: 0.03}
    materiality: 'low'
  site_material_loss_rate:
    value: 0
    unit: 'fraction of the material stock lost per month'
    prov: 'ELICITED'
    source: 'BASE CASE = 0, and the reason is a reading of his own words rather than silence: "tout ca me REVIENT a deux millions huit cent mille par forage" is a delivered as-consumed cost per borehole, so whatever casing he breaks, cement he lets set and gravel he loses is already inside the 2,800,000. Adding a loss rate on top would double-count it. The stock and the rate are carried explicitly, and the rate acts on the stock at risk at the start of the month, not on a flat monthly charge.'
    question: 'Does the two million eight hundred thousand cover what you actually install, or what you buy - do you ever have to re-buy casing or cement because it broke, set hard or walked off site?'
    range: {low: 0, high: 0.05}
    materiality: 'low'
  truck_fuel_share:
    value: 0.6
    unit: 'fraction of truck_annual_cost_xof that is fuel'
    prov: 'ELICITED'
    source: 'BASE CASE = 0.60 fuel / 0.40 servicing. Used only to test the stated 1,200,000 truck budget against the distance the operation must physically cover.'
    question: 'Of the million two a year on the camion, roughly how much is diesel at the pump and how much is the garage?'
    range: {low: 0.4, high: 0.8}
    materiality: 'low'
  truck_consumption_l_per_100km:
    value: 35
    unit: 'litres per 100 km'
    prov: 'ELICITED'
    source: 'BASE CASE = 35 l/100 km for a loaded rig-carrier truck on laterite tracks. Used only in the same distance test.'
    question: 'How much diesel does the camion drink on a run out to a village and back - and how far is a typical site from your yard?'
    range: {low: 25, high: 55}
    materiality: 'low'
  legal_form:
    value: 'entreprise individuelle'
    unit: 'legal form'
    prov: 'ELICITED'
    source: 'BASE CASE = entreprise individuelle, from the founder speaking throughout in the first person singular about assets he owns ("la foreuse je l''ai achetee"). STRUCTURAL, NOT NUMERIC: it changes which tax the profit bears (BIC in his own hands versus IS in a company''s) and whether his own remuneration is an expense or a distribution, rather than moving a value - and the common rate is 30% either way, so it is unwired by construction.'
    question: 'Is the business registered as an entreprise individuelle in your own name, or as a SARL - and do you draw a salary from it?'
    range: {low: 'entreprise individuelle', high: 'SARL'}
    materiality: 'low'
passage: |
  0. WHAT IS BEING BUILT, AND IN WHOSE UNITS
  ------------------------------------------
  The business is a borehole-drilling contractor. Its natural quantity is not a tonne or a litre but
  THE BOREHOLE: one delivered unit comprising the sondage, the tubage, the pompe and the chateau
  d'eau, sold at about 8,000,000 XOF. Everything below is expressed per borehole, per rig-day, per
  metre and per month, and only converted into accounting line items at the last step. Two natural
  descriptions do not map cleanly onto standard line items and are kept as they are, with the friction
  noted: (i) the "situation" is neither an invoice nor a revenue event - it is a certificate of work
  done that triggers a payment which is itself partly a repayment of an earlier advance; (ii) the
  retenue de garantie is not a receivable in the ordinary sense - it is money already earned, already
  certified, and deliberately not paid, with a one-in-ten chance of never being paid at all.

  1. PHYSICAL CLOSURE (c): DOES THE CLAIMED OUTPUT FIT THE PLANT DESCRIBED?
  ------------------------------------------------------------------------
  Capacities, each in its own units.

  THE RIG. Stated: 40 m/day in good ground; half that, 20 m/day, in granite; granite one borehole in
  four; average depth 70 m. Drilling time per borehole is therefore 70/40 = 1.75 rig-days in good
  ground and 70/20 = 3.50 rig-days in granite, and the expected time is
    0.75 x 1.75 + 0.25 x 3.50 = 1.3125 + 0.8750 = 2.1875 rig-days per borehole.
  Availability: a working month is taken at 26 days (six-day week) and the rig at 70% availability for
  breakdowns, servicing, spare-part supply and crew absence, giving 26 x 0.70 = 18.2 usable rig-days
  in a normal month. One borehole a month consumes 2.1875 of them. THE RIG IS AT 12.0% UTILISATION
  OVER THE WHOLE HORIZON (63.0 rig-days used against 524.16 available). It is nowhere near being the
  constraint, and it would not be the constraint even at twice the modelled output.

  THE CREW. Four labourers and one foreman is ONE crew, not two. One crew and one rig can be
  physically present on one site at a time. This - not the rig - is what actually limits concurrency.
  The founder attributes the limit to the rig ("parce que je n'ai qu'une seule foreuse"); the numbers
  above say the rig has roughly eight times the slack needed, so the true binding resource is the crew
  and the single mobilisation unit it travels with. This is recorded as a finding, not absorbed.

  THE THROUGHPUT IDENTITY. Two of the founder's statements are quantitative and independent: at most
  TWO boreholes in progress at once, and TWO months from start to reception. For any stable operation,
  work-in-progress = throughput x flow time (Little's Law, an identity, not a model). Hence
    throughput = 2 boreholes / 2 months = 1.0 borehole started (and one handed over) per workable month.
  With the stated stoppage - July, August and September at a fraction f of normal activity - the year
  delivers 9 x 1.0 + 3 x f boreholes. At the base f = 0.20 that is 9.6 boreholes a year.
  His third statement, "dans les vingt forages par an", requires 20 / 9.6 = 2.0833 starts per workable
  month, and therefore, by the same identity, 2.0833 x 2 = 4.1667 boreholes in progress simultaneously
  - against a stated maximum of two. THE THREE STATEMENTS CANNOT ALL BE TRUE. The derivation runs the
  pair that describes the plant (2 in progress, 2-month cycle), which is also the conservative pair,
  and carries the twenty-a-year claim as an unused input and as the single highest-ranked question.
  The most likely reconciliation, and the one the question is written to test, is that "deux en meme
  temps" counts only sites the crew is physically on, while the two-month figure includes weeks of
  waiting for the reception committee during which the site occupies no resource at all.

  FIT CHECK ON THE CLAIMED OUTPUT, in the trace: trace.wip_active[t] <= wip_max_concurrent binds at
  exactly 2.000 in every one of the nine workable months of each year, and trace.rig_days_used[t] <=
  trace.rig_days_available[t] clears with a factor of eight. The operation described is capacity-tight
  on crew and capacity-loose on plant.

  2. PHYSICAL CLOSURE (a): EVERY TRANSFORMATION, AND WHAT EACH RATIO IS NET OF
  ---------------------------------------------------------------------------
  GROUND INTO HOLE. 70 metres of formation per borehole are destroyed, not transformed: 100% leaves as
  cuttings and drilling return at the surface, 0% becomes saleable product, 0% becomes a by-product.
  There is no recoverable fraction and none is claimed. Over the horizon this is 28.8 boreholes x 70 m
  = 2,016.0 metres (trace.metres_drilled, asserted against trace.holes_drilled x depth_avg_m).

  MATERIALS INTO INSTALLED BOREHOLE. The founder's 2,800,000 covers tubage PVC, crepine, gravier,
  ciment, pompe immergee, panneaux solaires. WHAT THIS RATIO IS NET OF: he says "tout ca me REVIENT a
  deux millions huit cent mille par forage" - what it costs him per delivered borehole, not what he
  carries through the gate. Offcuts of casing, broken screen, cement that sets in the bag and gravel
  that is spilled or walks off a village site are therefore ALREADY INSIDE the 2,800,000. That is why
  site_material_loss_rate is carried explicitly and set to zero: adding a wastage rate on top of an
  as-consumed cost would double-count it. The rate and the stock it acts on are both in the trace so
  that a different answer from the founder changes a number rather than a paragraph.
  WHAT THE RATIO DOES NOT COVER, and this is the finding: the enumerated list contains NO TANK AND NO
  TOWER, while the 8,000,000 price explicitly promises "le chateau d'eau"; and it contains NO BITS,
  NO RODS AND NO HAMMER, which are consumed on every hole and fastest in the granite he meets one
  time in four. Both are carried as separate inputs at zero - the omitting choice, so the hole in the
  cost stack stays visible - and both are elicited.

  BOREHOLE STARTED INTO BOREHOLE DELIVERED. Base case: 1 start -> 1 delivery, 0 dry holes. This is the
  founder's own framing and it is almost certainly the most optimistic statement in the model: drilling
  in the crystalline basement around Bamako fails materially often, and granite is exactly where it
  fails. dry_hole_rate is carried at zero and wired into trace.holes_drilled, so a non-zero answer
  immediately adds diesel, consumables and crew time without adding revenue.

  DIESEL INTO METRES. 300 L per borehole is 300/70 = 4.2857 L per metre and 300/2.1875 = 137.14 L per
  rig-day. 100% is burned; nothing is recovered. Sanity: a deck engine plus compressor on a
  truck-mounted rig draws on the order of 15-25 L/h under load, so 137 L is roughly six to nine hours
  of drilling - one working day. The transformation closes and the implied rate is physically ordinary.

  CONTRACT VALUE INTO CASH - the transformation that actually drives this business. Per borehole of
  8,000,000, with 30% advance, two situations of 35% each, 5% withheld from every payment, and one
  retention in ten never recovered:
    advance, net of retention      0.30 x 0.95 = 0.2850  ->  2,280,000 XOF
    situation 1, net of retention  0.35 x 0.95 = 0.3325  ->  2,660,000 XOF
    situation 2, net of retention  0.35 x 0.95 = 0.3325  ->  2,660,000 XOF
    retention recovered            0.05 x 0.90 = 0.0450  ->    360,000 XOF
    retention lost for good        0.05 x 0.10 = 0.0050  ->     40,000 XOF
    ---------------------------------------------------------------------
    total                                        1.0000  ->  8,000,000 XOF
  The five fractions SUM TO ONE: nothing is hidden in a net figure. Note what the founder's own "cinq
  pour cent" is net of: it is 5% of each PAYMENT, not 5% of the contract, which the Code des marches
  publics confirms in the same words (art. 95.2, "cinq pour cent du montant des paiements"), and it
  therefore bites on the mobilisation advance as well as on the situations. Over one contract the two
  readings coincide at 5% of 8,000,000 = 400,000, but they place the withholding at different dates,
  and dates are the whole point here.

  3. PHYSICAL CLOSURE (b): EVERY STOCK DECLARES ITS LOSS, INCLUDING THE ZEROS
  --------------------------------------------------------------------------
  MATERIALS ON SITE. Bought in the month a contract starts (funded by the advance, exactly as the
  founder says), consumed half in that month and half in the second, so the stock stands at 1,400,000
  at each normal month end - about one month of exposure on an open village site. Loss rate: 0.0000
  per month, declared not silent, because the founder's cost ratio is already an as-consumed figure
  (see section 2). The rate acts on trace.inventory[t-1], the quantity actually at risk at the start of
  the month, NOT as a flat monthly charge - so if the founder answers with a non-zero rate, the charge
  automatically falls as the stock drains rather than continuing to bite on material that is no longer
  there.

  DIESEL. Stock 0, and the reason is not silence: he buys 300 L per borehole for a job that burns it
  inside about two rig-days. There is no tank and no carry-over, so there is no evaporation, no
  pilferage from storage and no loss rate to declare beyond zero.

  FINISHED GOODS. Stock 0 necessarily: a borehole is built in the ground on the client's land and
  cannot be held.

  WORK IN PROGRESS. 1.000 borehole at each normal month end (trace.wip_end), 2.000 live at some point
  during each normal month (trace.wip_active). Loss: 0 - no started borehole is abandoned in the base
  case, which is the dry_hole_rate = 0 assumption stated above and flagged there.

  RETENTION HELD. This is a stock and it leaks at the founder's own rate: 10% of every retention
  settled is written off (trace.retention_written_off), 90% comes in as cash. The balance runs between
  4,060,000 and 4,460,000 across the horizon - roughly eleven boreholes' worth of retention
  outstanding at any moment, because a borehole's 400,000 sits with the client for sixteen months
  while only about ten months' worth is being released.

  ORDINARY RECEIVABLES. Loss rate 0, declared: the founder reports no bad debt on situations
  themselves - "je le recupere presque toujours" is said of the retention only, and mairies and NGOs
  pay late rather than not at all. If he is wrong about that the model is optimistic, and the shape of
  the error would be a second write-off line parallel to the retention one.

  4. PHYSICAL CLOSURE (d): CUMULATIVE QUANTITIES TESTED AGAINST THE WORLD
  ----------------------------------------------------------------------
  METRES. 2,016.0 m over 36 months, i.e. 672 m per year. Projected over the rig's full assumed working
  life that is of the order of 6,720 m. For a truck-mounted rotary/DTH rig that is a very small
  lifetime footage: the machine will not be worn out by metres. The consequence for the accounting is
  substantive rather than cosmetic - the ten-year life is a CALENDAR and obsolescence life, not a
  consumption life, so straight-line time depreciation is the right convention here and a
  units-of-production charge would be wrong.

  RIG-DAYS. 63.0 used over 36 months against 524.16 available: 12.0%. Even trebled it fits.

  TRUCK DISTANCE - and here a per-period figure that looks reasonable becomes an annual figure that is
  not. The founder's 1,200,000 a year "tout compris" for the camion, at the base split of 60% fuel,
  buys 720,000 XOF of gasoil a year; at the ONAP Bamako price of 940 XOF/l that is about 766 litres;
  at 35 l/100 km for a loaded rig carrier on laterite that is 2,188 km A YEAR (trace.truck_km_implied,
  182.37 km a month). Spread over 9.6 boreholes that is 228 km per borehole: ONE round trip of about
  114 km and nothing else - no second trip to install the pump and the panels, no third trip for the
  reception, no trip to fetch a spare. For an operation working "a Bamako et dans les villages autour"
  that does not close, and it closes worse in direct proportion if the founder's twenty-a-year is
  right. Reported as a finding: either the truck budget is understated, or fuel is a much smaller
  share of it than assumed, or the sites are far closer than "les villages autour" implies. The
  elicited inputs are written to separate those three.

  5. THE OPERATING SCHEDULE
  -------------------------
  season_factor[t] = 1 in the nine workable months, 0.20 in July, August and September.
  starts[t] = throughput x season_factor[t] = 1.000 or 0.200.
  handovers[t] = starts[t-1]: a borehole started in month t is executed across months t and t+1 and
  handed over at the end of month t+1.
  wip_end[t] = wip_end[t-1] + starts[t] - handovers[t]; wip_active[t] = wip_end[t] + handovers[t].
  Annual starts = 9 x 1.000 + 3 x 0.200 = 9.600, and sum(season_factor) over the horizon = 28.800.
  Opening: the pre-horizon schedule is the same, so wip_end at t=-1 is 1.000 and handovers[0] = 1.000.

  6. REVENUE RECOGNITION, PER PERIOD
  ----------------------------------
  Control transfers over time (works on the client's land, paid for as they progress), so revenue is
  recognised a l'avancement with a time-based input measure - the utterance gives a duration but no
  within-contract cost profile, so time is the only defensible measure and the friction is noted.
  Each borehole therefore books 50% of 8,000,000 in each of its two execution months:
    revenue[t] = 0.5 x 8,000,000 x (starts[t] + handovers[t]).
  Normal month: 0.5 x 8,000,000 x (1.000 + 1.000) = 8,000,000.
  Deep hivernage month (t=7): 0.5 x 8,000,000 x (0.200 + 0.200) = 1,600,000.
  Shoulder month (t=6, July, following a normal June): 0.5 x 8,000,000 x (0.200 + 1.000) = 4,800,000.
  Annual revenue = 9.600 x 8,000,000 = 76,800,000.

  BILLING is not revenue and is tracked separately:
    billed_advance[t]    = 0.30 x 8,000,000 x starts[t]                       (2,400,000 in a normal month)
    billed_situations[t] = 0.35 x 8,000,000 x (starts[t] + handovers[t])      (5,600,000 in a normal month)
  Cumulative billing per borehole reaches 0.65 of contract value by the end of execution month 1
  against 0.50 of revenue earned, so 0.15 x 8,000,000 = 1,200,000 per live cohort sits as a CONTRACT
  LIABILITY (avance recue non encore imputee) and unwinds to zero at reception. That is
  trace.contract_liability, 1,200,000 in a normal month, and it is a liability inside net working
  capital, not a receivable.

  7. THE CASH CALENDAR OF ONE CONTRACT
  ------------------------------------
  For a borehole started in month s (reception at the end of month s+1):
    month s      advance 2,400,000 billed and paid; 5% (120,000) withheld; CASH 2,280,000
    month s+3    situation 1 (filed end of month s, paid three months later): 2,800,000 gross,
                 140,000 withheld; CASH 2,660,000
    month s+4    situation 2 (filed at reception, end of month s+1): 2,800,000 gross, 140,000
                 withheld; CASH 2,660,000
    month s+16   retention falls due: 12 months of guarantee after reception at s+1, plus 3 months of
                 chasing. 400,000 settles: CASH 360,000, WRITTEN OFF 40,000.
  Weighted average collection date, in months from mobilisation:
    (0 x 2,280,000 + 3 x 2,660,000 + 4 x 2,660,000 + 16 x 360,000) / 7,960,000 = 24,380,000 / 7,960,000
    = 3.06 months.
  The retention is only 5% of the contract but it sits out sixteen months, so it carries more than a
  sixth of the whole collection lag on its own. The last 4.5% of the money arrives fourteen months
  after the last 33.25%.

  Aggregated across cohorts, in a normal month:
    advance_settled_gross     = 0.30 x 8,000,000 x starts[t]                        = 2,400,000
    situations_settled_gross  = 0.35 x 8,000,000 x (starts[t-3] + starts[t-4])      = 5,600,000
    settled_gross_total                                                             = 8,000,000
    retention_withheld        = 0.05 x 8,000,000                                    =   400,000
    cash_from_settlements                                                           = 7,600,000
    retention_settled         = 0.05 x 8,000,000 x starts[t-16]                     = 0 to 400,000
    retention_released_cash   = 0.90 x retention_settled ; written_off = 0.10 x it
    cash_in_total             = cash_from_settlements + retention_released_cash
  At t=3, for example, cash_in_total = 7,960,000 - a full 8,000,000 contract's worth of cash arriving
  in one month, of which 360,000 is retention released on a borehole started sixteen months earlier.

  8. COST BUILD, PER MONTH
  ------------------------
  materials_consumed[t] = 0.5 x 2,800,000 x (starts[t] + handovers[t])   -> 2,800,000 normal month
  materials_loss[t]     = 0.0000 x inventory[t-1]                        ->         0
  cost_diesel[t]        = holes_drilled[t] x 300 L x 940 XOF/l           ->   282,000 normal month
  cost_payroll_gross[t] = 4 x 120,000 + 250,000                          ->   730,000 every month
  cost_payroll_charges  = 730,000 x 0.224 x 1.00                         ->   163,520 every month
  cost_truck[t]         = 1,200,000 / 12                                 ->   100,000 every month
  cost_guarantee_fees   = 0.00 x billed_advance[t]                       ->         0
  retention_written_off = 0.10 x retention_settled[t]                    ->  0 to 40,000
  The two payroll lines and the truck line do not stop in the hivernage: the crew is described as paid
  "par mois" and the truck still has to be insured and serviced, so the seasonal stoppage removes
  revenue and materials but not fixed cost. That is the entire reason the operation loses money in
  August at the operating line.
  Normal month (t=0): opex_total = 2,800,000 + 0 + 282,000 + 730,000 + 163,520 + 100,000 + 0 + 8,000
  = 4,083,520, and EBITDA = 8,000,000 - 4,083,520 = 3,916,480.
  Deep hivernage (t=7): opex_total = 560,000 + 56,400 + 730,000 + 163,520 + 100,000 + 40,000
  = 1,649,920, and EBITDA = 1,600,000 - 1,649,920 = -49,920. The month is loss-making before
  depreciation.

  9. DEPRECIATION
  ---------------
  Rig 40,000,000, bought three years before t=0, ten-year working life, straight line, nil residual.
  Monthly charge = 40,000,000 / (10 x 12) = 333,333.333333 XOF. Opening net book value at t=0 =
  40,000,000 x (1 - 3/10) = 28,000,000, falling to 16,000,000 at t=35. No capital expenditure occurs
  inside the horizon: the horizon was chosen to end four years short of the replacement decision, and
  the truck line carries the upkeep as expense. capex[t] = 0 for all t, and book_value[t] >= 0 is
  asserted.

  10. TAX
  -------
  REGIME ADJUDICATION. Annual turnover HT is 9.6 x 8,000,000 = 76,800,000. That is above the
  50,000,000 ceiling of the impot synthetique and far above the 30,000,000 the DGI applies to
  non-trading individual operators, so THE IMPOT SYNTHETIQUE DOES NOT APPLY to this business and the
  regime du benefice reel does. The conclusion survives the capacity question: on the founder's own
  claimed twenty boreholes the turnover would be 160,000,000, still in the reel.
  CHARGE. Profits bear 30% - the common rate, identical whether the profit is taxed as BIC in the hands
  of an entrepreneur individuel or as IS in a company, so the unresolved legal-form question does not
  move this rate. tax_total[t] = 0.30 x ebit[t], and negative months offset positive ones within the
  tax year, which is legitimate because the annual result is strongly positive.
  MINIMUM. The impot minimum forfaitaire is 1% of turnover HT with a floor of 763,500 XOF a year from
  50,000,000 of turnover. Carried as trace.tax_imf = max(0.01 x revenue[t], 763,500/12) and asserted:
  the annual minimum is 894,500 against a profit tax of 9,271,968, so the IS branch binds in every
  year of the horizon by an order of magnitude and the minimum never becomes the payable. The friction
  is noted: the minimum is an annual test and is shown here monthly.
  Normal month: ebit = 3,916,480 - 333,333.333333 = 3,583,146.666667; tax = 1,074,944.00;
  nopat = 2,508,202.666667.
  Deep hivernage: ebit = -49,920 - 333,333.333333 = -383,253.333333; tax = -114,976.00 (a within-year
  shield); nopat = -268,277.333333.

  11. NET WORKING CAPITAL
  -----------------------
  nwc[t] = amounts_receivable[t] + retention_held[t] + inventory[t] - contract_liability[t].
  Opening levels at t=-1, computed by extending the same seasonal schedule backwards and injected at
  t=0 through explicit opening rows: receivables 14,560,000; retention 4,252,000; contract liability
  1,200,000; inventory 1,400,000; net 19,012,000.
  In a normal month the levels are receivables 16,800,000 (three months of situations at 5,600,000),
  retention about 4,460,000, inventory 1,400,000, contract liability 1,200,000: net 21,460,000, which
  is 28% of a year's turnover locked up. The seasonal swing is large and runs the OPPOSITE way to
  intuition: net working capital DRAINS through the rains, because collections on pre-hivernage work
  keep arriving while no new material is bought and no new situation is filed, and it RELOADS in
  October and November when work restarts. Over each full year the movement nets to zero, which is
  what a steady-state operation with no growth must produce, and cumsum(delta_nwc) is asserted against
  nwc minus its opening level.

  12. THE FCFF LADDER, PER PERIOD
  -------------------------------
    ebitda  = revenue - opex_total
    ebit    = ebitda - depreciation
    nopat   = ebit - tax_total
    cfo     = nopat + depreciation - delta_nwc
    cfi     = -capex   (zero throughout)
    fcff    = cfo + cfi
  Worked, t=0 (January, normal month, but the first reload month after the December run-rate):
    8,000,000 - 4,083,520 = 3,916,480; - 333,333.333333 = 3,583,146.666667; - 1,074,944.00
    = 2,508,202.666667; + 333,333.333333 - 2,448,000 = 393,536.00 = FCFF.
  Worked, t=3 (April, steady normal month): FCFF = 2,819,136.00.
  Worked, t=7 (August, deep hivernage): nopat -268,277.333333 + depreciation 333,333.333333
    - delta_nwc (-4,576,000) = 4,641,056.00 = FCFF. The worst operating month is the best cash month.
  Worked, t=10 (November, the restart): FCFF = -1,734,464.00, the trough of the year - the operation
  is buying materials for two restarted contracts and has not yet been paid for anything done since
  June.

  13. ANNUAL AND HORIZON TOTALS
  -----------------------------
  Each of the three years is identical, because nothing in the utterance implies growth and the
  seasonal pattern repeats:
    revenue           76,800,000.00
    opex_total        41,893,440.00
    EBITDA            34,906,560.00
    depreciation       4,000,000.00
    EBIT              30,906,560.00     (40.24% of revenue)
    tax at 30%         9,271,968.00
    NOPAT             21,634,592.00
    + D&A              4,000,000.00
    - delta NWC                0.00
    - capex                    0.00
    FCFF              25,634,592.00
  Horizon FCFF (36 months) = 76,903,776.00 XOF. Over the horizon 230,400,000 of revenue is recognised
  and 229,248,000 is collected; the 1,152,000 difference is exactly the retention written off
  (28.8 boreholes x 40,000), and net working capital ends where it started.

  14. THE NUMBER THIS DERIVATION MOST WANTS CHALLENGED
  ----------------------------------------------------
  A 40.24% EBIT margin on public works is not a normal outcome in a competitive tender market, and it
  is the single loudest signal that the cost stack is incomplete rather than that the business is
  extraordinarily profitable. The three candidate holes are all identified above and all carried at
  zero with a question attached: the chateau d'eau that the price promises and the materials list does
  not contain; the drilling consumables that no drilling operation goes without; and the dry holes
  that the crystalline basement around Bamako produces. A fourth is structural: the founder takes no
  salary in this model, which is correct for unlevered FCFF if he is an entrepreneur individuel (his
  drawings are a distribution, not a cost) and understates cost if the business is a SARL that should
  be paying a gerant. Any of these moves the margin down, none of them moves it up, and the direction
  of the error is therefore known even though its size is not.

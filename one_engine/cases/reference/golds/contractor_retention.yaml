    authority: 'Republique du Mali, Code general des impots; Direction generale des impots du Mali, ''Les types d''entreprises et les regimes d''imposition'' - https://www.dgi.gouv.ml/les-types-dentreprises-et-les-regimes/'
    verified: '2026-07-27'

    authority: 'Direction generale des impots du Mali - https://www.dgi.gouv.ml/les-types-dentreprises-et-les-regimes/ ; Code general des impots du Mali'
    verified: '2026-07-27'
    fact_id: 'ML-V25-09 / ML-TAX-03'

    unit: 'month label'
    prov: 'DEFAULTED'
    source: 't=0 is set to January so that the three hivernage stoppages (July-September) fall wholly inside the horizon at t=6,7,8 / 18,19,20 / 30,31,32 and each modelled year is a complete seasonal cycle.'
    date: '2026-07-27'
  capex_in_horizon_xof:

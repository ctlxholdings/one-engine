    date: '2026-07-27'
  opening_balance_convention:
    value: 'steady state'
    unit: 'convention'
    prov: 'DEFAULTED'
    source: 'Going-concern convention: the business is three years old and running, so the pre-horizon months are taken to have run on the same seasonal schedule as the horizon. Opening receivables, retention, contract liability, inventory and work-in-progress are computed from that extended schedule rather than set to zero, which would fabricate a cold start the business does not have.'
    date: '2026-07-27'
  period_zero_month:

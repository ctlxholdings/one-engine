    date: '2026-07-27'
  tax_regime:
    value: 'regime du benefice reel'
    unit: 'regime label'
    prov: 'INFERRED'
    source: 'annual_turnover_estimate_xof (76,800,000 HT) exceeds regime_threshold_xof (50,000,000) - and a fortiori the 30,000,000 ceiling the DGI applies to non-trading individual operators - so the impot synthetique is NOT available to this business and the impot minimum forfaitaire and the 30% profit tax apply. Even on the founder''s own claimed 20 boreholes/year (160,000,000) the same conclusion holds, so the adjudication is robust to the capacity question.'
    date: '2026-07-27'
  revenue_recognition_basis:
    value: 'over time, time-based input measure'
    unit: 'convention'
    prov: 'DEFAULTED'
    source: 'IFRS 15 / AUDCIF methode a l''avancement: control of the borehole transfers over time (the works are on the client''s land and the client pays for progress). The utterance gives a duration but no within-contract cost profile, so the input measure is time: 50% of contract revenue in each of the two execution months.'
    date: '2026-07-27'
  working_days_per_month:
    value: 26
    unit: 'days per month'
    prov: 'DEFAULTED'
    source: 'Six-day working week, the standard construction convention in Bamako; 26 calendar working days per month, 312 per year.'
    date: '2026-07-27'
  payroll_months_per_year:
    value: 12
    unit: 'months'

    prov: 'STATED'
    source: '"Le tubage PVC, la crepine, le gravier, le ciment, la pompe immergee et les panneaux solaires, tout ca me revient a deux millions huit cent mille par forage." An as-consumed delivered cost, i.e. already net of the site wastage he actually experiences (see checks on materials_loss).'

contract: "v2.6"
id: 'ml_bamako_borehole_contractor_retention_v1'
title: 'Forages d''eau, Bamako et villages environnants - unlevered FCFF (NOPAT build) over 36 monthly periods, with the marche public payment calendar and the 5 percent retenue de garantie modelled explicitly'
currency: 'XOF'
grid:
  periods: 36
  freq: 'monthly'
  why: |
    MONTHLY, because every single mechanism this founder describes is monthly or sub-annual and all
    four of them net to nothing on an annual grid: a two-month build cycle, a two-to-three month
    administrative payment lag, a five percent retention held twelve months past handover, and a
    three-month seasonal stoppage. An annual view would show a business with 76.8m of turnover and
    essentially zero working-capital movement, and would make the retention - which is the whole
    question here - structurally invisible. The monthly view shows instead that the cash trough is not
    in the rainy season at all but in October and November, when the operation restarts and reloads
    working capital while the situations filed before the rains have not yet been paid.

    THIRTY-SIX PERIODS, for three reasons that a reader can disagree with. First, one contract's cash
    cycle runs sixteen months from mobilisation to retention release (two months of works, three months
    of administration on the last situation, twelve months of guarantee, three months of chasing), so
    any horizon shorter than about seventeen months cannot follow a single cohort from start to final
    settlement and cannot show the retention balance both filling and draining; thirty-six lets two full
    cohorts complete inside the window. Second, the seasonality is annual and the hivernage is a third
    of the operating question, so the horizon must be a whole number of years, and three gives three
    complete stoppages rather than one that could be mistaken for a one-off. Third, thirty-six months
    stops well inside the rig's remaining working life - three years of ten are gone at t=0, so the
    horizon ends with four years of book life still to run - which means the model never has to forecast
    a rig replacement, the single largest thing about this business that the founder has not said and
    could not be asked to say three years ahead. Past roughly three years the mairie and NGO contract
    pipeline is not forecastable from anything in the utterance, and a longer horizon would be
    arithmetic rather than analysis.

    t=0 IS SET TO JANUARY so the three hivernage stoppages fall wholly inside the horizon at t=6,7,8 /
    18,19,20 / 30,31,32 and each modelled year is a complete seasonal cycle. The business is three years
    old and running, so t=0 opens with a loaded pipeline, not a cold start: opening work-in-progress,
    receivables, retention and inventory are computed by extending the same seasonal schedule backwards,
    and are injected at t=0 through explicit opening rows so that every roll-forward remains checkable.
utterance:
  fr: |
    Je fais des forages d'eau a Bamako et dans les villages autour. Mes clients c'est surtout des
    mairies, des ONG, quelques particuliers riches. Un forage complet - le sondage, le tubage, la
    pompe, le chateau d'eau - c'est autour de huit millions.

    Avec les mairies et les ONG ca se passe toujours pareil. Je signe le marche, ils me versent trente
    pour cent au demarrage pour que je puisse acheter le materiel. Apres, a mesure que j'avance, je
    presente des situations et ils paient - mais ils gardent cinq pour cent de chaque paiement jusqu'a
    un an apres la reception, au cas ou la pompe tombe en panne. Ce cinq pour cent, je le recupere
    presque toujours, mais il faut relancer, et une fois sur dix disons je ne le revois jamais. Et
    meme les situations normales, entre le moment ou je depose et le moment ou je suis paye, il faut
    compter deux a trois mois avec l'administration.

    Un forage prend en gros deux mois entre le debut et la reception. Je peux en mener deux en meme
    temps, pas plus, parce que je n'ai qu'une seule foreuse. La foreuse je l'ai achetee quarante
    millions il y a trois ans, montee sur un camion. Elle fore a peu pres quarante metres par jour
    dans le bon terrain, mais si on tombe sur le granit c'est deux fois moins vite, et ca arrive une
    fois sur quatre. Un forage descend en moyenne a soixante-dix metres.

    Le gasoil pour la foreuse c'est trois cents litres par forage. Le tubage PVC, la crepine, le
    gravier, le ciment, la pompe immergee et les panneaux solaires, tout ca me revient a deux millions
    huit cent mille par forage. J'ai quatre ouvriers a cent vingt mille par mois et un chef de chantier
    a deux cent cinquante mille. Le camion consomme et il faut l'entretenir, disons un million deux
    cent mille par an tout compris.

    Je fais dans les vingt forages par an quand tout va bien. Mais pendant l'hivernage, juillet a
    septembre, les pistes sont impraticables et je ne travaille presque pas.
  en: |
    I drill water boreholes in Bamako and the villages around it. My clients are mainly town councils,
    NGOs, a few wealthy individuals. A complete borehole - the drilling, the casing, the pump, the
    water tower - runs about eight million.

    With the councils and the NGOs it always goes the same way. I sign the contract, they pay me thirty
    percent up front so I can buy the materials. Then as I progress I submit statements of work and
    they pay - but they hold back five percent of every payment until a year after handover, in case
    the pump breaks down. That five percent I almost always get back, but you have to chase it, and
    say one time in ten I never see it again. And even the normal statements, between when I file and
    when I'm paid, you have to count two to three months with the administration.

    A borehole takes roughly two months from start to handover. I can run two at once, no more,
    because I only have one rig. I bought the rig for forty million three years ago, mounted on a
    truck. It drills about forty metres a day in good ground, but if we hit granite it's half that
    speed, and that happens one time in four. A borehole goes down seventy metres on average.

    Diesel for the rig is three hundred litres per borehole. PVC casing, screen, gravel pack, cement,
    the submersible pump and the solar panels - all that comes to two million eight hundred thousand
    per borehole. I have four labourers at a hundred and twenty thousand a month and a site foreman at
    two hundred and fifty thousand. The truck burns fuel and needs servicing, say one million two
    hundred thousand a year all in.

    I do around twenty boreholes a year when things go well. But during the rains, July to September,
    the tracks are impassable and I barely work at all.

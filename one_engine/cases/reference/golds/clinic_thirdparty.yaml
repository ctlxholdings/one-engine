  that tail:

      weighted months outstanding = 3.617647 + 0.085 x 2   = 3.787647 months
      claims receivable = 82 742 400 x 3.787647 / 12       = 26 116 584 XOF

  Expressed as days: 115.2 days on claims, or 58.8 days of days-sales-outstanding measured
  against total turnover, because four patients in ten pay at the counter and dilute it.

  C6. Working capital, and the one honest thing this model must say about it.

      inventory                                            =  7 116 884.210526
      claims receivable                                    = 26 116 584.000000
      trade payables (no supplier credit described)        =          0
      net working capital                                  = 33 233 468.210526 XOF

  Now the point. This laboratory has been running four years at this rate. Its claims book and
  its reagent stock are already on its balance sheet at t=0; they were built years ago. A flat
  operation does not build them again. So over the five forecast years:

      delta NWC = 0 in every period.

  That is not the third-party cycle being ignored - it is the third-party cycle being placed
  correctly. Its cost to this business is NOT a flow in the forecast. It is (i) a stock of
  33.2 million XOF of capital permanently trapped in stock and unpaid claims, which is 20.5% of
  a year's turnover and more than the written-down value of both analysers combined, and which
  the owner has funded and will never get back while the business operates; and (ii) the
  3 516 552 a year of denials that die, which IS a flow and IS in the numbers below. Smuggling
  the receivable into FCFF as if it were a recurring outflow would double-count the first
  against the second. The stock is where the pain is, and a stock belongs on a balance sheet.
  Because the opening balances are my construction and not his statement, both are put back to
  him as questions - and if his real claims book is materially above the steady-state level,
  which the publicly reported CMU arrears make quite possible, then period t=0 carries a
  working-capital charge this base case shows as nil.


  ======================================================================================
  A. WHAT THE OPERATION PHYSICALLY IS, BEFORE ANY MONEY
  ======================================================================================

  A1. Operating days and output.
  The founder gives a rate, not a total: eighty analyses a day, six days out of seven. On a
  52-week year that is 6 x 52 = 312 nominal operating days. I deduct nothing for public
  holidays in the base case, because he deducted nothing - that is the omitting choice and it
  is flagged as a question, since Cote d'Ivoire has roughly a dozen jours feries and most fall
  Monday to Saturday. So:

      operating days   = 6 x 52 - 0                     = 312 days/year
      billable acts    = 80 x 312                       = 24 960 acts/year

  A2. Three different quantities are hiding inside the word "analyse", and they must be kept
  apart or the capacity tests below test the wrong thing.
    - the BILLABLE ACT, which is what is priced at 6 500 and costed at 2 200;
    - the MACHINE DETERMINATION, which is what an analyser rated at sixty samples an hour
      actually processes. These are not the same: a bilan lipidique is one priced line but
      three or four analyte determinations, while a pregnancy test or a malaria rapid test is
      one priced line and zero analyser determinations;
    - the PATIENT VISIT, which is what phlebotomy and reception time attaches to. One patient
      commonly leaves with a numeration, a glycemie and a lipid panel - three lines, one draw.
  The founder never gives either ratio. I carry both as questions to him and run the base case
  at 1.6 determinations per act and 1.6 acts per patient:

      machine determinations = 24 960 x 1.6            = 39 936 /year   (128/operating day)
      patient visits         = 24 960 / 1.6            = 15 600 /year   (50/operating day)

  Neither ratio touches revenue or cost - both of those are priced per billable act. They exist
  only so that the capacity claims below are tested against the quantity that actually loads
  the machine and the quantity that actually loads the person.

  A3. Does the claimed output fit the plant? (physical closure rule c)
  Two analysers, each rated 60 samples/hour, so 120 determinations/hour combined. Nothing runs
  100% of the time, so I allow 10% of scheduled hours for the servicing the maintenance contract
  implies, for calibration and QC runs, for reagent-pack changes, for breakdowns and for grid
  interruptions - an availability factor of 0.90 on an 8-hour day.

      required analyser hours = 39 936 / 120           = 332.8 h/year
                              = 332.8 / 312            = 1.0667 h per operating day
      available analyser hours per day = 8 x 0.90      = 7.2 h
      annual capacity          = 2 x 60 x 8 x 0.90 x 312 = 269 568 determinations/year
      utilisation              = 39 936 / 269 568      = 14.8%

  The claimed output fits inside the described plant with a factor of nearly seven to spare.
  The founder's own «je ne tourne pas a plein» understates it considerably: on these numbers the
  analysers stand idle for six hours of every eight-hour day. That is a finding about the
  business - a large fixed asset carrying a small variable load - and it is what makes the
  margin below possible.

  A4. Does the claimed output fit the PEOPLE? (physical closure rule c, continued)
  This is where the operation is actually tight, and the answer is the opposite of A3.
  Statutory paid leave in Cote d'Ivoire is 2.2 working days per month of service, i.e. 26.4
  days a year; I add 5 days of unplanned absence. So of 312 operating days each technician is
  on the bench for 312 - 31.4 = 280.6, an availability of 0.899359.

      technician minutes required
          = 15 600 patients x 6 min  (registration, draw, labelling)      =  93 600
          + 39 936 determinations x 3 min (spin, load, QC, release)       = 119 808
                                                                    total = 213 408 min/year

      technician minutes available
          = 2 techs x 8 h x 60 min x 312 days x 0.899359                  = 269 376 min/year

      utilisation = 213 408 / 269 376 = 79.2%

  It fits - but at 79%, and with two people. The binding constraint on this laboratory is not
  the analysers, it is the technicians, and there is no cover: when one is on his 26.4 days of
  leave the other is being asked to do work that on these figures needs 1.6 people. The
  biologist is a second single point of failure, since results cannot lawfully be released
  without a qualified biologist's validation. Neither of these is a number in the model; both
  are the operational reality behind the number.

  A5. Does the power budget fit the plant? (physical closure rule c and d)
  The founder gives ONE figure - 800 000 XOF a year - and says expressly that it covers both
  «le groupe electrogene et le courant». So the test is: what does the described plant draw,
  what does that cost at the published CIE professional tariff, and what is left for the diesel?

      cold chain      2 fridges x 1.5 kWh/day x 365 days               = 1 095.00 kWh
      air condition.  2 units x 1.1 kW x 8 h x 312 days                = 5 491.20 kWh
      analysers       0.6 kW x 332.8 run hours                         =   199.68 kWh
      everything else 4 kWh/day x 312 days                             = 1 248.00 kWh
                                                                 total = 8 033.88 kWh/year

      at 66.84 + 12.03 = 78.87 XOF/kWh all in     8 033.88 x 78.87     =  633 632.12 XOF
      residual for the generator                  800 000 - 633 632.12 =  166 367.88 XOF
      gasoil at 700 XOF/litre, set burning 2.5 l/h -> 1 750 XOF/hour
      generator hours the budget affords          166 367.88 / 1 750   =  95.07 hours/year

  So the stated 800 000 buys roughly 95 hours of generator running a year - about 1.1% of the
  hours in a year - and leaves nothing at all for servicing the set. For an operator whose own
  words are «on ne peut pas se permettre une coupure avec les reactifs au frigo», that is thin.
  I do not correct his figure: 800 000 is what he says he spends and it stays in the model. What
  I report is what it buys, and the question of whether his real generator running fits inside
  it is asked of him directly. Note also the sensitivity of the whole calculation to one prior:
  if the analyser room is in fact conditioned 24 hours rather than 8, the air-conditioning line
  roughly triples and the budget cannot cover the grid load at all.

  A6. Lifetime duty against what the asset can deliver (physical closure rule d)
  Both analysers are four years old at t=0 and reach age nine at the end of the horizon.

      analyser hours per year, combined                                 =   332.8
      cumulative combined hours by end of horizon    (4 + 5) x 332.8    = 2 995.2
      cumulative determinations by end of horizon    (4 + 5) x 39 936   = 359 424
      design-life allowance, 2 machines x 20 000 h                      = 40 000 h

  At age nine these machines will have run about 3 000 hours between them, roughly 7.5% of a
  conservative design-life allowance. The conclusion matters for the horizon: these instruments
  will NOT be retired for wear. They will be retired for platform obsolescence - manufacturer
  software support cycles run three to five years, and a laboratory is locked to its analyser's
  proprietary reagent packs, so the replacement decision is made by the supplier's product
  roadmap, not by the machine's condition. A per-year duty figure that looks light is not
  evidence that the asset will last; it is evidence that the replacement date is not an
  engineering question at all.

  ======================================================================================
  B. TRANSFORMATION 1 - REAGENT PURCHASED INTO REAGENT USED, AND WHAT LEAVES AS LOSS
  ======================================================================================

  B1. The founder hands over a ratio and it must be said what it is net of.
  He says the reagents and consumables «me coute deux mille deux cents par analyse», and then
  SEPARATELY that of the reagents «il y en a toujours a peu pres cinq pour cent que je jette».
  The 5% is stated as a fraction of what he BUYS, not of what he uses. Read that way the two
  statements are additive: 2 200 is what one analysis consumes, and the binned reagent is a
  further cost on top. That is the conservative reading and the base case. The other reading -
  that 2 200 is simply his reagent invoices divided by his test count, and therefore already
  carries the waste - cannot be excluded from his words, so it is a question to him.

  B2. The 5% cannot be applied to the whole 2 200.
  What expires is the cold-chain reagent. Tubes, needles and gloves carry multi-year shelf lives
  and are not what he is throwing away - his own sentence attaches the expiry to «les reactifs».
  So the 2 200 must be split. Base case: 70% reagent, 30% consumables.

      reagent per act      2 200 x 0.70                       = 1 540 XOF
      consumable per act   2 200 x 0.30                       =   660 XOF

  B3. The balance, which must SUM and not merely have a ratio hanging off it.
  Let P be reagent purchased. 5% of P is binned; 95% of P reaches a patient. What reaches a
  patient is 1 540 x 24 960 = 38 438 400. Therefore:

      reagent consumed   = 1 540 x 24 960                    = 38 438 400.000000 XOF
      reagent purchased  = 38 438 400 / 0.95                 = 40 461 473.684211 XOF
      reagent expired    = 40 461 473.684211 x 0.05          =  2 023 073.684211 XOF
      CLOSURE            38 438 400 + 2 023 073.684211       = 40 461 473.684211  OK

      consumables consumed  = 660 x 24 960                   = 16 473 600 XOF
      consumables expired   =                                =          0 XOF
      consumables purchased =                                = 16 473 600 XOF
      CLOSURE            16 473 600 + 0                      = 16 473 600         OK

  The zero on the consumables line is written, not omitted. Sterile disposables carry three-to-
  five-year shelf lives against a three-month holding, the founder attributes all of his binning
  to reagents, and breakage of tubes and needles is inside the 2 200 he already pays. Zero, and
  the reason for zero.

  B4. Total input cost, and the effective cost per act.

      reagents and consumables expense
        = 38 438 400 + 16 473 600 + 2 023 073.684211        = 56 935 073.684211 XOF/year
      effective input cost per act = 56 935 073.684211 / 24 960 = 2 281.052632 XOF
      contribution per act = 6 500 - 2 281.052632           =  4 218.947368 XOF

  The expiry adds 81.05 XOF to every act, i.e. 3.7% on the input cost. Over the five-year
  horizon the laboratory bins 10 115 368.42 XOF of reagent - more than a third of what both
  analysers cost when new. That is what a three-month batch and a five per cent expiry rate
  costs when it is written down instead of waved at.

  B5. What the stock is, and where its loss rate correctly acts (physical closure rule b).
  The founder buys three months ahead because the supplier delivers by lot. A revolving batch
  drains from full to empty over the cycle, so the capital tied up is the AVERAGE of the batch,
  not its peak:

      average inventory = (40 461 473.684211 + 16 473 600) x 3 / 2 / 12
                        = 56 935 073.684211 x 0.125         = 7 116 884.210526 XOF

  And on the placement of the loss rate, which is the point rule (b) exists to force: the 5% is
  correctly stated on PURCHASES, not on the stock. The quantity actually at risk of expiring is
  the undrawn balance of the batch, which falls linearly from a full batch to nothing over three
  months; the average at-risk balance is therefore half a batch and the average residence is 1.5
  months. Expressing the loss as a fraction of what is bought already integrates over that
  draining profile. Charging 5% per period against the PEAK stock, which is the natural error,
  would overstate the loss roughly twofold. Stated on the at-risk balance, the founder's figure
  implies about 0.05 / 1.5 = 3.33% per month of average residence.

  The one friction I keep rather than force away: on an annual grid the batch cycle repeats
  exactly four times, so a true year-end balance would be either a full batch or nothing
  depending on where the delivery falls. The average is the right measure of capital employed
  over a period and it is what I carry; the year-end snapshot is not modelled and I say so.

  ======================================================================================
  C. TRANSFORMATION 2 - AN INVOICE INTO CASH, WHICH IS THIS BUSINESS'S REAL SUBJECT
  ======================================================================================

  C1. Gross billings.

      gross billings = 6 500 x 24 960                       = 162 240 000 XOF/year

  C2. Splitting the billing three ways: counter cash, CMU claim, private claim.
  Four in ten pay cash at the counter. Six in ten are insured, and the founder names three payer
  families - the CMU, the mutuals, and the corporate schemes - but never weights them. I split
  the insured half and half between the CMU and everything private. That is a maximum-entropy
  choice, not a conservative one, and it is a question to him.
  Of a CMU patient's bill, the scheme bears 70% and the patient bears a 30% ticket moderateur at
  the counter - that is not the founder's number, it is the statutory coverage rate of the
  Regime General de Base and it is the fact about the world that his «ou juste un ticket
  moderateur» is gesturing at. For the private schemes the base case reads his «ne paient rien
  au comptoir» literally: tiers payant integral, the whole invoice goes on the claim.

      cash clients          162 240 000 x 0.40              =  64 896 000  -> counter
      insured, total        162 240 000 x 0.60              =  97 344 000
        of which CMU        97 344 000 x 0.50               =  48 672 000
             billed to CNAM 48 672 000 x 0.70               =  34 070 400  -> claim
             ticket moder.  48 672 000 x 0.30               =  14 601 600  -> counter
        of which private    97 344 000 x 0.50               =  48 672 000
             billed         48 672 000 x 1.00               =  48 672 000  -> claim
             counter        48 672 000 x 0.00               =           0

      total billed to schemes  34 070 400 + 48 672 000      =  82 742 400
      total counter cash       64 896 000 + 14 601 600      =  79 497 600
      CLOSURE                  82 742 400 + 79 497 600      = 162 240 000  OK

  Note what the ticket moderateur does: it moves 14.6 million a year out of the slow channel and
  into the till. Half the insured patients are CMU, but the CMU is only 41.2% of what actually
  goes on a claim, because 30% of every CMU bill never becomes a claim at all.

  C3. The denial loop, which must also sum.
  Of what is claimed, 8.5% comes back refused (midpoint of his «huit ou neuf»). Note the base:

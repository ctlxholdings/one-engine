    authority: "Compagnie Ivoirienne d'Electricite (CIE), tarifs d'electricite entreprise - heures pleines 66,84 FCFA/kWh hors taxes plus 12,03 FCFA de taxes (heures de pointe 103,42 + 18,62; heures creuses 48,02 + 8,64). https://www.cie.ci/entreprise/tarifs-electricite"

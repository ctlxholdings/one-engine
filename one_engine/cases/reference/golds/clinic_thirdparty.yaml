contract: "v2.6"
id: ci_cocody_medical_analysis_lab_thirdparty_fcff
title: "Laboratoire d'analyses medicales, Cocody (Abidjan) - unlevered FCFF over five annual periods"
currency: XOF

grid:
  periods: 5
  freq: annual
  why: >
    Three things fix the horizon and the period length, and each of them is a choice a reader can
    disagree with.

    (1) WHY ANNUAL, not monthly or quarterly. The operation the founder describes has no season and
    no cycle at the level of output: eighty analyses a day, six days out of seven, every week. A
    monthly grid would therefore add no information about the OPERATION - only about phasing. What
    it would subtract is the tax line. The regime that governs this business (regime des
    microentreprises) is defined on a band of ANNUAL turnover TTC and is levied as a rate on annual
    turnover; the alternative regime (reel simplifie, BIC plus impot minimum forfaitaire) is defined
    on annual profit with an annual floor and cap. Below a year those quantities do not exist. The
    patente, the maintenance contract, the electricity budget and the statutory leave entitlement
    are likewise annual quantities. An annual grid is the shortest period on which the tax line -
    the single largest deduction after reagents and labour - is a defined object rather than an
    allocation.
    The price of that choice is real and I state it: the founder's two natural sub-annual cycles -
    a three-month reagent purchase batch and a three-to-five-month payer settlement lag - are
    resolved in this model as LEVELS (average inventory, receivable balance) rather than as
    intra-year movements. Both are materialised as trace rows and asserted in checks, so the level
    is visible and re-checkable even though the phasing is not modelled.

    (2) WHY FIVE PERIODS AND NOT MORE. The only durable assets described are the two analysers,
    bought (on the founder's words, expressly for the haematology unit) four years ago, written down
    here over ten years at the rate Ivorian practice admits for gros materiel et outillage. Five
    annual periods carry them from age four to age nine - to the last period in which their
    depreciation is a fact derived from the founder's own words rather than from a replacement
    machine, a replacement price and a replacement date that this utterance contains nothing about.
    The horizon deliberately stops one year short of the point at which I would have to invent the
    single largest capital number in the model. That the replacement falls just outside the window
    is a finding, not a convenience, and it is carried in `notes`.

    (3) WHY FIVE PERIODS AND NOT FEWER. Sixty per cent of this lab's revenue is settled by third
    parties, and the largest of them (the CMU, through the CNAM) is a public scheme whose reference
    tariffs, reimbursement rate and payment behaviour are policy variables. Providers were publicly
    claiming multi-billion-XOF arrears against the scheme as recently as April 2026. Five years is
    about as far as one can carry today's tariff and today's payment lag before the answer stops
    being a forecast of this business and becomes a forecast of Ivorian health policy. Past that
    point the question is not answerable from this utterance at any period length.

utterance:
  fr: |
    J'ai un laboratoire d'analyses medicales a Cocody, a Abidjan. On fait les analyses courantes :
    numeration, glycemie, serologies, tests de grossesse, bilans lipidiques, et le paludisme
    evidemment.

    Il y a deux sortes de clients. Ceux qui viennent et paient tout de suite en especes, a peu pres
    quatre sur dix. Et les six autres sur dix, ce sont des assures - la CMU, les mutuelles, les
    assurances des grandes entreprises. Ceux-la ne paient rien au comptoir, ou juste un ticket
    moderateur. Je facture l'organisme, et la il faut attendre. Les mutuelles privees c'est trois
    mois, la CMU c'est quatre a cinq mois, parfois plus. Et sur ce que je facture, il y a toujours une
    partie qu'ils refusent - un code qui ne va pas, une prescription mal remplie, un assure qui
    n'etait plus a jour. Je dirais que sur cent francs factures j'en perds huit ou neuf comme ca.
    Quand c'est refuse je peux refaire le dossier, et j'en recupere peut-etre la moitie, mais ca prend
    encore deux mois.

    On fait a peu pres quatre-vingts analyses par jour, six jours sur sept. Le prix moyen d'une
    analyse c'est six mille cinq cents. Les reactifs et les consommables - tubes, aiguilles, gants -
    ca me coute deux mille deux cents par analyse. Les reactifs, il faut les garder au froid et ils
    ont une date de peremption : j'achete pour trois mois d'avance parce que le fournisseur ne livre
    que par lots, et il y en a toujours a peu pres cinq pour cent que je jette parce que la date est
    passee avant que je les utilise.

    J'ai deux techniciens de laboratoire a deux cent cinquante mille par mois, un biologiste a sept
    cent mille, une secretaire a cent cinquante mille, et une femme de menage a quatre-vingt mille.
    L'automate d'hematologie m'a coute douze millions il y a quatre ans, et l'automate de biochimie
    dix-huit millions. Chacun peut traiter soixante echantillons a l'heure mais je ne tourne pas a
    plein. Le contrat de maintenance des deux automates c'est deux millions par an. Le loyer c'est
    cinq cent mille par mois, le groupe electrogene et le courant huit cent mille par an - on ne peut
    pas se permettre une coupure avec les reactifs au frigo.
  en: |
    I have a medical analysis laboratory in Cocody, Abidjan. We do the routine tests: blood counts,
    blood sugar, serology, pregnancy tests, lipid panels, and malaria of course.

    There are two kinds of clients. The ones who come in and pay cash on the spot, about four out of
    ten. And the other six out of ten are insured - the CMU, the mutuals, the big companies'
    insurance schemes. Those pay nothing at the counter, or just a small co-payment. I bill the
    scheme, and then you wait. Private mutuals are three months, the CMU is four to five months,
    sometimes more. And out of what I bill, there's always a part they refuse - a code that doesn't
    match, a badly filled prescription, a member who was no longer up to date. I'd say for every
    hundred francs billed I lose eight or nine that way. When it's refused I can redo the file and I
    get maybe half of it back, but that takes another two months.

    We do about eighty tests a day, six days out of seven. The average price of a test is six
    thousand five hundred. Reagents and consumables - tubes, needles, gloves - cost me two thousand
    two hundred per test. The reagents have to be kept cold and they have an expiry date: I buy three
    months ahead because the supplier only delivers in batches, and there's always about five percent
    I throw away because the date passed before I used them.

    I have two lab technicians at two hundred and fifty thousand a month, a biologist at seven
    hundred thousand, a secretary at a hundred and fifty thousand, and a cleaner at eighty thousand.
    The haematology analyser cost me twelve million four years ago, and the biochemistry analyser
    eighteen million. Each can process sixty samples an hour but I don't run at full capacity. The
    maintenance contract on the two analysers is two million a year. Rent is five hundred thousand a
    month, the generator and electricity eight hundred thousand a year - we can't afford an outage
    with the reagents in the fridge.

inputs:

  # ---------------------------------------------------------------- calendar conventions
  months_per_year:
    value: 12
    unit: months/year
    prov: DEFAULTED
    source: "Calendar convention. Every monthly figure the founder gives (salaries, rent) is annualised at twelve."
    date: "2026-07-27"
  weeks_per_year:
    value: 52
    unit: weeks/year
    prov: DEFAULTED
    source: "Calendar convention: the 52-week commercial year. Using 365/7 = 52.142857 would give 312.857 operating days; the 52-week year is the convention that reproduces the founder's own arithmetic of a six-day week."
    date: "2026-07-27"
  days_per_calendar_year:
    value: 365
    unit: days/year
    prov: DEFAULTED
    source: "Calendar convention; used only for the 24/7 cold-chain electrical load and for expressing days-sales-outstanding."
    date: "2026-07-27"

  # ---------------------------------------------------------------- volume and price
  tests_per_day:
    value: 80
    unit: billable analyses/day
    prov: STATED
    source: "«On fait a peu pres quatre-vingts analyses par jour» / «We do about eighty tests a day»."
    date: "2026-07-27"
  days_per_week:
    value: 6
    unit: operating days/week
    prov: STATED
    source: "«six jours sur sept» / «six days out of seven»."
    date: "2026-07-27"
  holiday_closure_days:
    value: 0
    unit: days/year
    prov: ELICITED
    source: "Base case takes the founder's own arithmetic at face value - six days every week of the year, no closure. This is the OMITTING choice: it adds nothing he did not say. Cote d'Ivoire has roughly a dozen jours feries, most of which fall Monday-Saturday, so the true figure is almost certainly above zero and the base case therefore overstates volume."
    question: "Apart from Sundays, how many days in a year is the laboratory actually shut - public holidays, the Aid, Christmas, stock-take, anything?"
    range: {low: 0, high: 14}
    materiality: medium
    date: "2026-07-27"
  price_per_test:
    value: 6500
    unit: XOF per billable analysis
    prov: STATED
    source: "«Le prix moyen d'une analyse c'est six mille cinq cents» / «The average price of a test is six thousand five hundred». Taken as the average price of an analysis across ALL clients, cash and insured alike."
    date: "2026-07-27"

  # ---------------------------------------------------------------- physical: acts, samples, determinations
  determinations_per_billable_act:
    value: 1.6
    unit: machine determinations per billable analysis
    prov: ELICITED
    source: "A billable act and a machine determination are not the same object and the founder's list makes the gap explicit: a «bilan lipidique» is one priced act but three to four analyte determinations on the biochemistry analyser, while a pregnancy test or a malaria RDT is one act and zero analyser determinations. 1.6 is the base case. This ratio does not touch revenue or cost - both are priced per BILLABLE ACT - it exists solely so the analyser capacity claim can be tested against the right quantity."
    question: "When you say eighty analyses a day, are you counting priced acts on the invoice, or individual results off the machines? For a bilan lipidique, is that one line or four?"
    range: {low: 1.0, high: 3.0}
    materiality: low
    date: "2026-07-27"
  billable_acts_per_patient:
    value: 1.6
    unit: billable analyses per patient visit
    prov: ELICITED
    source: "Needed to convert acts into patients, because phlebotomy, registration and result release are per-PATIENT work whereas bench work is per-determination. The founder never states patient counts. 1.6 acts per patient is the base case."
    question: "How many patients actually come through the door on a normal day - and how many priced lines does a typical one leave with?"
    range: {low: 1.0, high: 3.0}
    materiality: medium
    date: "2026-07-27"

  # ---------------------------------------------------------------- payer mix and the third-party cycle
  cash_client_share:
    value: 0.40
    unit: fraction of billable analyses
    prov: STATED
    source: "«Ceux qui viennent et paient tout de suite en especes, a peu pres quatre sur dix» / «about four out of ten»."
    date: "2026-07-27"
  insured_client_share:
    value: 0.60
    unit: fraction of billable analyses
    prov: STATED
    source: "«Et les six autres sur dix, ce sont des assures» / «the other six out of ten are insured»."
    date: "2026-07-27"
  cmu_share_of_insured:
    value: 0.50
    unit: fraction of insured analyses
    prov: ELICITED
    source: "The founder names three payer families - «la CMU, les mutuelles, les assurances des grandes entreprises» - and gives a different lag for the CMU than for the private schemes, but never weights them. An even split between the CMU and everything private is the only weighting his words support; it is a maximum-entropy choice, not a conservative one, and I flag it as such. It moves the receivable level and the co-payment split, not the annual FCFF."
    question: "Out of ten insured patients, how many are CMU cards and how many are a private mutual or a company scheme?"
    range: {low: 0.20, high: 0.80}
    materiality: medium
    date: "2026-07-27"
  cmu_coverage_rate:
    value: 0.70
    unit: fraction of the tarif de reference borne by the scheme
    prov: SOURCED
    source: "Fixes how much of a CMU patient's bill goes on the claim and how much is collected at the counter as ticket moderateur. The founder says only «ne paient rien au comptoir, ou juste un ticket moderateur» - he does not give the rate; the rate is a fact about the world, and it is 30% to the insured / 70% to the scheme under the Regime General de Base."
    authority: "Republique de Cote d'Ivoire, Portail officiel du Gouvernement, «Couverture maladie universelle (CMU) : les assures paieront 30% du montant des tarifs des actes couverts» - https://www.gouv.ci/actualite/couverture-maladie-universelle-cmu-les-assures-paieront-30-du-montant-des-tarifs-des-actes-couverts-2483 ; corroborated by CNAM / DG-CMU public information on the Regime General de Base (couverture 70%, ticket moderateur 30%)."
    verified: "2026-07-27"
  private_coverage_rate:
    value: 1.00
    unit: fraction of the invoice borne by the scheme
    prov: ELICITED
    source: "Base case reads «Ceux-la ne paient rien au comptoir» literally for the private mutuals and corporate schemes - tiers payant integral, nothing collected at the counter, the whole invoice goes on the claim. This is the CONSERVATIVE reading: it puts the maximum amount into the slow, deniable, third-party channel and the minimum into immediate cash."
    question: "For a patient on a private mutual or a company scheme, do you take anything at all at the counter, or does the whole invoice go to the scheme?"
    range: {low: 0.70, high: 1.00}
    materiality: medium
    date: "2026-07-27"
  private_delay_months:
    value: 3
    unit: months from invoice to cash
    prov: STATED
    source: "«Les mutuelles privees c'est trois mois» / «Private mutuals are three months». Applied here to the private mutuals and the corporate schemes together; the founder gives no separate figure for the corporate insurers."
    date: "2026-07-27"
  cmu_delay_months:
    value: 4.5
    unit: months from invoice to cash
    prov: ELICITED
    source: "«la CMU c'est quatre a cinq mois, parfois plus» - the base case takes the midpoint of the stated bracket, 4.5. The «parfois plus» means the midpoint of the bracket is NOT the midpoint of the distribution, and health providers in Cote d'Ivoire were publicly claiming several billion XOF of CMU arrears in April 2026, so the true mean is likely above 4.5. The founder holds the answer: it is on his own ageing."
    question: "Taking last year's CMU claims one by one, what was the average number of months between sending the file and the money landing - and what was the worst one?"
    range: {low: 4.0, high: 7.0}
    materiality: medium
    date: "2026-07-27"
  cmu_share_of_scheme_billings:
    value: 0.4117647058823529
    unit: fraction of amounts claimed from schemes
    prov: INFERRED
    source: "cmu_share_of_insured x cmu_coverage_rate / (cmu_share_of_insured x cmu_coverage_rate + (1 - cmu_share_of_insured) x private_coverage_rate) = 0.35 / 0.85 = 7/17. The CMU is half of insured PATIENTS but only 41.2% of what is actually CLAIMED, because 30% of every CMU bill is taken at the counter as ticket moderateur and never becomes a claim. This is the weight the collection lag must be averaged on - averaging on patients rather than on claimed francs would overstate the lag."
    date: "2026-07-27"
  rejection_rate_on_scheme_billings:
    value: 0.085
    unit: fraction of amounts billed to schemes
    prov: ELICITED
    source: "«sur ce que je facture ... sur cent francs factures j'en perds huit ou neuf comme ca». Base case takes the midpoint of the stated 8-9% bracket. The base of the ratio is what he BILLS TO A SCHEME, not total turnover: the sentence sits inside the insured-clients paragraph and a cash client is never «facture» to anybody. The founder holds the exact figure - it is the sum of his rejection notices over the amounts he claimed."
    question: "Of the francs you claimed from the schemes last year, exactly how many were refused - and is that eight-or-nine per cent measured against what you claimed, or against everything you invoiced including the cash clients?"
    range: {low: 0.08, high: 0.09}
    materiality: medium
    date: "2026-07-27"
  redo_recovery_share:
    value: 0.50
    unit: fraction of rejected claims recovered on resubmission
    prov: STATED
    source: "«j'en recupere peut-etre la moitie» / «I get maybe half of it back»."
    date: "2026-07-27"
  redo_extra_delay_months:
    value: 2
    unit: additional months before a resubmitted claim settles
    prov: STATED
    source: "«mais ca prend encore deux mois» / «but that takes another two months»."
    date: "2026-07-27"

  # ---------------------------------------------------------------- reagents and consumables
  reagent_consumable_cost_per_test:
    value: 2200
    unit: XOF per billable analysis
    prov: STATED
    source: "«Les reactifs et les consommables - tubes, aiguilles, gants - ca me coute deux mille deux cents par analyse». Treated as the cost of the input CONSUMED BY one analysis, i.e. net of the reagent that never reaches a patient - see reagent_cost_is_net_of_expiry_waste."
    date: "2026-07-27"
  reagent_cost_is_net_of_expiry_waste:
    value: 1
    unit: flag, 1 = the 2200 is technical consumption and the 5% binned is additional
    prov: ELICITED
    source: "The utterance puts the 2200 and the 5% in two separate sentences, and the 5% is stated as a fraction of what he BUYS («il y en a toujours a peu pres cinq pour cent que je jette»), not of what he uses. Read that way the two are additive and the true input cost is 2200 plus the expiry charge - the CONSERVATIVE reading. The alternative, that 2200 is simply his reagent invoices divided by his test count and therefore already carries the waste, cannot be excluded from the words alone. Value 1 selects the additive reading; value 0 would make expiry a re-labelling of cost already inside the 2200."
    question: "The two thousand two hundred a test - is that the cost of what actually goes into one test, or is it your total reagent and consumable bill divided by the number of tests? In other words, does it already include the five per cent you throw away?"
    range: {low: 0, high: 1}
    materiality: medium
    date: "2026-07-27"
  reagent_share_of_input_cost:
    value: 0.70
    unit: fraction of the 2200 that is expiry-dated cold-chain reagent
    prov: ELICITED
    source: "The founder attributes the binning to the REACTIFS specifically - «Les reactifs, il faut les garder au froid et ils ont une date de peremption». Tubes, needles and gloves carry multi-year shelf lives and are not what expires. So the 5% cannot be applied to the whole 2200; it applies to the reagent slice of it. 0.70 is the base case for that slice."
    question: "Of the two thousand two hundred a test, roughly how much is the cold-chain reagent itself and how much is the tubes, needles and gloves?"
    range: {low: 0.50, high: 0.85}
    materiality: low
    date: "2026-07-27"
  reagent_expiry_waste_rate:
    value: 0.05
    unit: fraction of reagent PURCHASED that is discarded expired
    prov: STATED
    source: "«il y en a toujours a peu pres cinq pour cent que je jette parce que la date est passee avant que je les utilise». Note the base: it is a fraction of what is bought, which is the correct base - see the stock-loss discussion in `passage`."
    date: "2026-07-27"
  purchase_cover_months:
    value: 3
    unit: months of consumption held per delivery lot
    prov: STATED
    source: "«j'achete pour trois mois d'avance parce que le fournisseur ne livre que par lots». Applied to consumables as well as reagents: the founder describes one supplier delivering by lot, so tubes, needles and gloves arrive on the same rhythm. That extension is inferential and is flagged in `notes`."
    date: "2026-07-27"
  supplier_payment_days:
    value: 0
    unit: days of credit taken from the reagent supplier
    prov: ELICITED
    source: "The founder describes no supplier credit anywhere. Base case is nil credit - payment on delivery - which is the OMITTING choice and also the conservative one for working capital: it maximises the capital the lab has tied up. Any real credit reduces net working capital one-for-one."
    question: "When the three-month lot arrives, do you pay for it there and then, or does the supplier give you thirty or sixty days?"
    range: {low: 0, high: 60}
    materiality: medium
    date: "2026-07-27"

  # ---------------------------------------------------------------- opening balance sheet
  opening_inventory_balance:
    value: 7116884.2105263158
    unit: XOF
    prov: ELICITED
    source: "Set equal to the steady-state average stock the model computes, on the premise that a laboratory four years into a flat operation already carries its normal stock. That premise is mine, not the founder's, so the question stays attached. If his actual opening stock differs, period t=0 carries a working-capital movement that this base case shows as nil."
    question: "On the first day of the year, what was sitting in the reagent fridge and the consumables store, at what it cost you?"
    range: {low: 3000000, high: 15000000}
    materiality: medium
    date: "2026-07-27"
  opening_receivable_balance:
    value: 26116584
    unit: XOF
    prov: ELICITED
    source: "Set equal to the steady-state claims balance the model computes, on the same four-years-of-flat-operation premise. This is the single largest number on this lab's balance sheet and the founder can read it straight off his ageing; if it is materially higher than the steady-state level - which the reported CMU arrears make quite possible - the lab has been financing a growing claims book out of its own cash and period t=0 carries a charge this base case shows as nil."
    question: "On the first day of the year, how much had you claimed from the CMU, the mutuals and the company schemes that had not yet been paid?"
    range: {low: 15000000, high: 45000000}
    materiality: medium
    date: "2026-07-27"
  opening_payable_balance:
    value: 0
    unit: XOF
    prov: INFERRED
    source: "Follows from supplier_payment_days = 0: no credit taken means no trade payable outstanding."
    date: "2026-07-27"
  opening_nwc_balance:
    value: 33233468.2105263158
    unit: XOF
    prov: INFERRED
    source: "opening_inventory_balance + opening_receivable_balance - opening_payable_balance = 7116884.2105263158 + 26116584 - 0."
    date: "2026-07-27"

  # ---------------------------------------------------------------- payroll
  technician_count:
    value: 2
    unit: persons
    prov: STATED
    source: "«J'ai deux techniciens de laboratoire»."
    date: "2026-07-27"
  technician_salary_monthly:
    value: 250000
    unit: XOF/month gross per person
    prov: STATED
    source: "«deux techniciens de laboratoire a deux cent cinquante mille par mois»."
    date: "2026-07-27"
  biologist_salary_monthly:
    value: 700000
    unit: XOF/month gross
    prov: STATED
    source: "«un biologiste a sept cent mille»."
    date: "2026-07-27"
  secretary_salary_monthly:
    value: 150000
    unit: XOF/month gross
    prov: STATED
    source: "«une secretaire a cent cinquante mille»."
    date: "2026-07-27"
  cleaner_salary_monthly:
    value: 80000
    unit: XOF/month gross
    prov: STATED
    source: "«une femme de menage a quatre-vingt mille»."
    date: "2026-07-27"
  headcount:
    value: 5
    unit: persons
    prov: INFERRED
    source: "Two technicians + one biologist + one secretary + one cleaner. Used only for the per-head capped social-security bases."
    date: "2026-07-27"
  founder_remuneration_annual:
    value: 0
    unit: XOF/year gross
    prov: ELICITED
    source: "The founder lists five salaries and his own is not among them. Base case takes him at his word and charges nothing - the OMITTING choice - which is why the margin this model reports is as high as it is. He employs a biologist, so he is not necessarily the technical director; but somebody runs this business and the utterance does not say what that costs. Left at zero the model measures the cash the ASSET throws off before any owner reward, which is the correct unlevered convention only if he genuinely draws nothing."
    question: "Do you take a salary or a gerant's remuneration out of the laboratory, and how much a month?"
    range: {low: 0, high: 12000000}
    materiality: high
    date: "2026-07-27"
  overtime_premium_uplift:
    value: 0
    unit: fraction uplift on gross payroll
    prov: ELICITED
    source: "A six-day week at eight hours is 48 hours, against a legal duration of 40 in Cote d'Ivoire; hours 41-46 carry a 15% premium and hours from the 47th a 50% premium. If the stated salaries are basic pay for a 40-hour week, the true payroll is above what the founder quoted. Base case is zero uplift - the founder's figures taken as all-in, the OMITTING choice. The upper end of the range is what a full 48-hour week at statutory premiums would add."
    question: "The two hundred and fifty thousand a technician - is that everything he takes home in a normal month, overtime included, or is it basic pay before the Saturday hours?"
    range: {low: 0, high: 0.25}
    materiality: medium
    date: "2026-07-27"
  legal_weekly_hours:
    value: 40
    unit: hours/week
    prov: SOURCED
    source: "Establishes that a six-day, eight-hour operation runs eight hours a week beyond the legal duration, which is what makes overtime_premium_uplift a live question rather than a hypothetical."
    authority: "Cote d'Ivoire, loi n. 2015-532 du 20 juillet 2015 portant Code du travail - duree legale hebdomadaire 40 heures (48 heures pour le secteur agricole); heures supplementaires majorees de 15% de la 41e a la 46e heure et de 50% a partir de la 47e. Restated at https://wageindicator.org/fr-ci/travail-en-cote-d-ivoire/droit-du-travail/remuneration-et-temps-de-travail/"
    verified: "2026-07-27"
  smig_monthly:
    value: 75000
    unit: XOF/month
    prov: SOURCED
    source: "Compliance floor for the lowest-paid post described (the cleaner at 80 000)."
    authority: "Cote d'Ivoire, decret n. 2022-986 du 21 decembre 2022 relevant le SMIG de 60 000 a 75 000 FCFA avec effet au 1er janvier 2023; still in force. Annex fact CI-V25-09 / CI-TAX-09."
    verified: "2026-07-27"
  cnps_pension_rate_employer:
    value: 0.077
    unit: fraction of gross remuneration
    prov: SOURCED
    source: "Employer pension contribution. The monthly ceiling of 3 375 000 XOF (45x SMIG) is not reached by any post here - the highest is the biologist at 700 000 - so the rate applies to the whole of gross payroll."
    authority: "CLEISS, «Le regime ivoirien de securite sociale - les cotisations», situation au 1er janvier 2025: retraite 7,70% employeur, plafond mensuel 3 375 000 XOF. https://www.cleiss.fr/docs/cotisations/cotedivoire.html . Annex facts CI-V25-10, CI-V25-15, CI-V25-32."
    verified: "2026-07-27"
  cnps_family_rate_employer:
    value: 0.05
    unit: fraction of the capped base
    prov: SOURCED
    source: "Prestations familiales, employer only, on the capped base."
    authority: "CLEISS, «Les cotisations en Cote d'Ivoire», au 1er janvier 2025: prestations familiales 5% employeur, plafond 70 000 XOF/mois. https://www.cleiss.fr/docs/cotisations/cotedivoire.html . Annex fact CI-V25-11."
    verified: "2026-07-27"
  cnps_maternity_rate_employer:
    value: 0.0075
    unit: fraction of the capped base
    prov: SOURCED
    source: "Maternite, employer only, on the capped base."
    authority: "CLEISS, «Les cotisations en Cote d'Ivoire», au 1er janvier 2025: maternite 0,75% employeur, plafond 70 000 XOF/mois. https://www.cleiss.fr/docs/cotisations/cotedivoire.html . Annex fact CI-V25-12."
    verified: "2026-07-27"
  cnps_at_mp_rate_employer:
    value: 0.03
    unit: fraction of the capped base
    prov: ELICITED
    source: "Accidents du travail et maladies professionnelles is a BAND, 2% to 5%, and the class applying to a given establishment is set by CNPS for that establishment - it is on the founder's own declarations. A medical analysis laboratory carries biological-hazard and sharps exposure, so it is unlikely to sit at the bottom of the band. Base case is the mid-band 3%. The charge is small because the base is capped at 70 000 XOF per head per month."
    question: "What accident-du-travail rate does the CNPS apply to the laboratory on your declarations - two per cent, or higher?"
    range: {low: 0.02, high: 0.05}
    materiality: low
    date: "2026-07-27"
  cnps_capped_base_monthly:
    value: 70000
    unit: XOF/month/person
    prov: SOURCED
    source: "Ceiling on the base for prestations familiales, maternite and accidents du travail. Every post here is above the ceiling, so the base is the ceiling for all five."
    authority: "CLEISS, «Les cotisations en Cote d'Ivoire»: plafond mensuel 70 000 XOF pour prestations familiales, maternite et accidents du travail. https://www.cleiss.fr/docs/cotisations/cotedivoire.html . Annex facts CI-V25-14, CI-V25-31."
    verified: "2026-07-27"
  employer_payroll_levy_rate:
    value: 0.044
    unit: fraction of gross remuneration
    prov: SOURCED
    source: "The employer-side payroll levy bundle for local employees: contribution employeur a l'impot sur les traitements et salaires 2,8%, plus taxe d'apprentissage 0,4% and taxe a la formation professionnelle continue 1,2% collected for the FDFP - 4,4% in total. These are NOT extinguished by the regime des microentreprises, which is expressly libératoire «a l'exclusion de l'impot sur les traitements, salaires ... aussi bien a la charge des salaries que de l'employeur»."
    authority: "PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Other taxes, «Payroll taxes: 2.8% ... for local employees, 12% for expatriate employees», last reviewed 11 March 2026, https://taxsummaries.pwc.com/ivory-coast/corporate/other-taxes ; FDFP taxe d'apprentissage 0,4% and TFPC 1,2% per annex fact CI-TAX-08. Annex fact CI-V25-35 carries the same 0.044 bundled value."
    verified: "2026-07-27"
  statutory_leave_days_per_year:
    value: 26.4
    unit: working days/year/person
    prov: SOURCED
    source: "2,2 jours ouvrables per month of effective service x 12. Used to derive the fraction of the year each technician is actually on the bench."
    authority: "Cote d'Ivoire, loi n. 2015-532 du 20 juillet 2015 portant Code du travail, art. 25.1 - conge paye a raison de 2,2 jours ouvrables par mois de service effectif (26,4 jours par an). Restated at https://wageindicator.org/fr-ci/travail-en-cote-d-ivoire/droit-du-travail/conge-annuel-et-vacances/"
    verified: "2026-07-27"
  sick_absence_days_per_year:
    value: 5
    unit: working days/year/person
    prov: ELICITED
    source: "Unplanned absence on top of statutory leave. Base case 5 days per person-year. The founder holds this from his own attendance."
    question: "Beyond their leave, roughly how many days a year does a technician miss for illness or family?"
    range: {low: 0, high: 20}
    materiality: low
    date: "2026-07-27"

  # ---------------------------------------------------------------- plant
  analyser_count:
    value: 2
    unit: machines
    prov: STATED
    source: "«L'automate d'hematologie ... et l'automate de biochimie»."
    date: "2026-07-27"
  haem_analyser_cost:
    value: 12000000
    unit: XOF
    prov: STATED
    source: "«L'automate d'hematologie m'a coute douze millions il y a quatre ans»."
    date: "2026-07-27"
  biochem_analyser_cost:
    value: 18000000
    unit: XOF
    prov: STATED
    source: "«et l'automate de biochimie dix-huit millions»."
    date: "2026-07-27"
  haem_analyser_age_at_t0_years:
    value: 4
    unit: years
    prov: STATED
    source: "«il y a quatre ans» attaches grammatically to the haematology analyser."
    date: "2026-07-27"
  biochem_analyser_age_at_t0_years:
    value: 4
    unit: years
    prov: ELICITED
    source: "«L'automate d'hematologie m'a coute douze millions IL Y A QUATRE ANS, et l'automate de biochimie dix-huit millions» - the date is stated only for the haematology unit. The elision most naturally carries it to the second machine and the base case does so, but the sentence does not compel it. This moves when the larger of the two assets falls out of depreciation and when its replacement lands, which is the reason the horizon stops where it does."
    question: "The biochemistry analyser - did that come in at the same time as the haematology one, or later?"
    range: {low: 1, high: 8}
    materiality: medium
    date: "2026-07-27"
  analyser_rated_throughput_per_hour:
    value: 60
    unit: samples/hour per machine
    prov: STATED
    source: "«Chacun peut traiter soixante echantillons a l'heure mais je ne tourne pas a plein»."
    date: "2026-07-27"
  depreciation_rate:
    value: 0.10
    unit: fraction of cost per year, straight line
    prov: SOURCED
    source: "Straight-line at 10%, i.e. a ten-year book life with no residual, being the rate Ivorian practice admits for gros materiel et outillage - the class an automated bench analyser costing 12 to 18 million XOF falls into (light tooling sits at 20%). It is also consistent with the published economic life of a clinical analyser: well-maintained routine analysers run ten years or more, but manufacturer software support cycles of three to five years make them functionally obsolete before they wear out."
    authority: "Taux d'amortissement admis par le CGI en Cote d'Ivoire - gros materiel et outillage 10%, petit materiel et outillage 20%; NOTIS Consulting, «Les taux des amortissements (selon le CGI en RCI)», https://notis-consulting.net/sites/default/files/Documents/Les_taux_des_amortissements.pdf . Economic-life cross-check: De Gruyter, Clin Chem Lab Med, «Observing an analyzer's operational life cycle», https://www.degruyter.com/document/doi/10.1515/cclm-2018-0725/html"
    verified: "2026-07-27"
  analyser_design_life_hours:
    value: 20000
    unit: run hours per machine
    prov: ASSUMED
    source: "A prior, and I could not source a published figure: manufacturers specify service life for clinical analysers in YEARS and in support cycles, not in run hours, so no authority states this. 20 000 hours per machine is the order of magnitude for a benchtop instrument rated for continuous routine operation. It is used only for the lifetime-duty test in checks; the test passes by an order of magnitude, so the conclusion is insensitive to the figure."
    date: "2026-07-27"
  opening_hours_per_day:
    value: 8
    unit: hours/operating day
    prov: ELICITED
    source: "The founder gives days but never hours. Eight hours is the base case. It is the denominator of every capacity test in this model - analyser utilisation, technician minutes, and the air-conditioning load - so it is worth one question."
    question: "What time does the laboratory open and what time does the last patient leave, on a normal day?"
    range: {low: 6, high: 12}
    materiality: medium
    date: "2026-07-27"
  plant_availability_factor:
    value: 0.90
    unit: fraction of opening hours the analysers are actually fit to run
    prov: ASSUMED
    source: "A prior. Nothing runs 100% of the time: scheduled servicing under the maintenance contract, calibration and QC runs, reagent-pack changes, breakdowns and grid interruptions. 10% of scheduled time is a standard operating allowance for an instrument under contract. No published Ivorian or manufacturer figure could be sourced, and the founder could not state a figure for a counterfactual he has never measured."
    date: "2026-07-27"
  phlebotomy_minutes_per_patient:
    value: 6
    unit: technician minutes per patient
    prov: ELICITED
    source: "Registration, identification, venepuncture, labelling and the patient's own turnaround. Base case 6 minutes, which is the middle of routine practice. Together with technician_minutes_per_determination this decides whether two technicians can carry the stated output - and on the base case they are the BINDING constraint, so both figures matter."
    question: "From the moment a patient sits down for the draw to the moment the tube is labelled and in the rack, how long does your technician spend?"
    range: {low: 4, high: 10}
    materiality: medium
    date: "2026-07-27"
  technician_minutes_per_determination:
    value: 3
    unit: technician minutes per machine determination
    prov: ELICITED
    source: "Centrifugation, aliquoting, loading, QC review, transcription and result release, per determination on an automated platform. Base case 3 minutes."
    question: "Once the tubes are in the rack, how much of your technicians' time does each result actually take - spinning, loading, checking the QC and getting it onto the report?"
    range: {low: 1.5, high: 5}
    materiality: medium
    date: "2026-07-27"

  # ---------------------------------------------------------------- premises, power, maintenance
  rent_monthly:

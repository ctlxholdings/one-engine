  # ---------------------------------------------------------------- tax
  tax_regime:
    value: 1
    unit: flag, 1 = regime des microentreprises, 0 = regime du reel simplifie
    prov: ELICITED
    source: "STRUCTURAL - this answer changes the FORM of the tax computation, not a value inside it, so it is wired into `checks` only through the band test that establishes it. The founder never states his legal form or his regime. His annual turnover of 162 240 000 XOF TTC sits inside the microentreprise band (50 000 001 - 200 000 000), and Ivorian sources describe that band as applying «quelque soit la nature de l'activite exercee», so the regime des microentreprises is the base case: a levy on TURNOVER, libératoire of the profits tax, the patente and VAT. If he is instead filing under the reel simplifie - by option, or because his adviser treats a laboratory directed by a biologist as a non-commercial activity - the tax becomes BIC at 25% on PROFIT, subject to the impot minimum forfaitaire, plus the patente and the taxe speciale d'equipement, and the answer changes materially. Where a founder's belief about the rule that governs him and the rule itself differ, they are two different objects; this input records that I have established the second only conditionally. The flag multiplies the levy line in `checks`, so setting it to 0 zeroes the tax rather than substituting the reel simplifie computation - deliberately: the substitute is a DIFFERENT computation (BIC on profit, plus IMF, plus patente, plus TSE), not a rescaling of this one, and the check should fail loudly rather than produce a plausible wrong number."
    question: "Under which regime do you file - the impot des microentreprises on turnover, or the reel simplifie with the impot BIC on your profit? And is the laboratory a personne physique or a societe?"
    range: {low: "reel simplifie - BIC 25% on profit + IMF + patente + TSE", high: "regime des microentreprises - levy on turnover, libératoire"}
    materiality: high
    date: "2026-07-27"
  microenterprise_standard_rate:
    value: 0.07
    unit: fraction of annual turnover TTC
    prov: SOURCED
    source: "The rate applying to a non-CGA microenterprise. NOTE A TENSION WITH THE CACHED ANNEX: annex row CI-TAX-04 (verified 2026-07-26) uses 6% x 200 000 000 = 12 000 000 as the microenterprise reference ceiling inside the IMF variable-floor rule. Two independent Ivorian sources current for 2025-2026 give the microenterprise rate as 7% (5% for CGA members), not 6%/4%. I prefer what I could verify and use 7%, and I flag the divergence rather than silently reconciling it - a cached rate carried past its date is worse than no cache. Note also that CI-TAX-04's 6% figure is a reference computation inside a DIFFERENT rule and need not track the current microenterprise rate at all."
    authority: "Cote d'Ivoire, Code general des impots, regime des microentreprises (articles 71 bis et suivants): «il est fait application du taux de 7% au chiffre d'affaires annuel TTC», reduit a 5% pour les adherents d'un centre de gestion agree. Profession Juriste, «Les regimes d'imposition en Cote d'Ivoire: le regime des microentreprises», https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-le-regime-des-microentreprises/ ; corroborated by GED BERED, «Regimes Fiscaux en Cote d'Ivoire 2026», https://www.gedbered.com/blog/regimes-fiscaux-2026-impot-entreprise.html"
    verified: "2026-07-27"
  microenterprise_cga_rate:
    value: 0.05
    unit: fraction of annual turnover TTC
    prov: SOURCED
    source: "The reduced rate for a microenterprise that has joined a centre de gestion agree, or whose accounts are kept by an expert-comptable agree under convention with the DGI."
    authority: "Same instrument and sources as microenterprise_standard_rate: CGI, regime des microentreprises - taux reduit a 5% pour les adherents des CGA. https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-le-regime-des-microentreprises/"
    verified: "2026-07-27"
  cga_member_flag:
    value: 0
    unit: flag, 1 = member of a centre de gestion agree, 0 = not
    prov: ELICITED
    source: "Base case is NOT a member, which selects the 7% rate - the CONSERVATIVE choice, since membership would cut the levy by two points of turnover. The founder says nothing about a CGA and nothing about an accountant. On a turnover of 162 240 000 XOF the two points are worth more than the entire annual maintenance contract on both analysers, which is why this small administrative fact ranks high."
    question: "Are you a member of a centre de gestion agree - or are your accounts kept by an expert-comptable agree who has a convention with the DGI?"
    range: {low: 0, high: 1}
    materiality: high
    date: "2026-07-27"
  microenterprise_tax_rate:
    value: 0.07
    unit: fraction of annual turnover TTC
    prov: INFERRED
    source: "microenterprise_cga_rate x cga_member_flag + microenterprise_standard_rate x (1 - cga_member_flag) = 0.05 x 0 + 0.07 x 1."
    date: "2026-07-27"
  microenterprise_band_low:
    value: 50000001
    unit: XOF of annual turnover TTC
    prov: SOURCED
    source: "Lower bound of the band. Below it the taxpayer falls into the regime de l'entreprenant."
    authority: "Cote d'Ivoire CGI, regimes d'imposition: microentreprises de 50 000 001 a 200 000 000 XOF TTC; reel simplifie de 200 000 001 a 500 000 000; reel normal au-dela. Annex facts CI-TAX-05, CI-V25-49; Ivoire-Juriste, «Guide complet des regimes d'imposition en Cote d'Ivoire», https://blog.ivoire-juriste.com/2025/10/guide-complet-des-regimes-dimposition-en-cote-divoire-choisir-le-statut-adapte-a-votre-entreprise.html"
    verified: "2026-07-27"
  microenterprise_band_high:
    value: 200000000
    unit: XOF of annual turnover TTC
    prov: SOURCED
    source: "Upper bound of the band. Above it the taxpayer moves to the regime du reel simplifie and the tax becomes BIC on profit plus the IMF, the patente and the TSE. This lab is at 81.1% of the ceiling, so the band is a live constraint on its growth, not background."
    authority: "Same instrument and sources as microenterprise_band_low. Annex facts CI-TAX-05, CI-V25-49."
    verified: "2026-07-27"
  medical_services_vat_status:
    value: 0
    unit: fraction, output VAT rate on medical analyses
    prov: SOURCED
    source: "Medical care supplied by approved health professionals is exempt from Ivorian VAT, and an exempt operator cannot recover input VAT. Two independent routes reach the same modelling consequence and the model is robust to which applies: (i) the medical exemption means no output VAT and irrecoverable input VAT; (ii) the regime des microentreprises is itself libératoire of VAT and treats the taxpayer as a final consumer. Either way the 6 500 charged is the whole consideration, the 2 200 paid is the whole cost including any VAT borne, and turnover HT equals turnover TTC at 162 240 000."
    authority: "Cote d'Ivoire CGI, exonerations de TVA - «consultations et soins medicaux dispenses par des professionnels de sante agrees»; standard rate 18% (annex fact CI-V25-39 / CI-TAX-10). GED BERED, «TVA Cote d'Ivoire 2026: guide pratique complet pour les PME», https://www.gedbered.com/blog/tva-cote-ivoire-2026-guide-pme.html , which also states «Une entreprise dont l'activite est exoneree de TVA ne peut pas recuperer la TVA payee sur ses achats». Confidence on the precise CGI article is lower than on the substance; flagged in `notes`."
    verified: "2026-07-27"


  «facture» to anybody. So the rate applies to the 82 742 400 claimed, not to the 162 240 000
  invoiced. Of what is refused, half is recovered by redoing the file, two months later; the
  other half is gone.

      claimed                                              = 82 742 400
      refused first pass        82 742 400 x 0.085         =  7 033 104
        recovered on redo       7 033 104 x 0.50           =  3 516 552   (2 months later)
        written off             7 033 104 x 0.50           =  3 516 552   (never)
      clean first pass          82 742 400 - 7 033 104     = 75 709 296
      cash ultimately collected 75 709 296 + 3 516 552     = 79 225 848
      CLOSURE   75 709 296 + 3 516 552 + 3 516 552         = 82 742 400   OK

  The permanent leakage is 3 516 552 a year: 4.25% of what is claimed, 2.17% of total turnover,

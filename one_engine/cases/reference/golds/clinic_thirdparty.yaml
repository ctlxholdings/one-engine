      CMU share of claims     34 070 400 / 82 742 400      = 0.411765  (= 7/17)
      private share of claims 48 672 000 / 82 742 400      = 0.588235  (= 10/17)
      clean-claim weighted lag = 3 x 0.588235 + 4.5 x 0.411765 = 3.617647 months

  Refused claims sit two months longer before they either settle or die, and while they sit they

      less reagents and consumables (incl. expiry)         =  56 935 073.684211
      less labour incl. employer charges                   =  19 603 860.000000
      less rent, maintenance, power, other                 =   8 800 000.000000
      total operating expense                              =  85 338 933.684211
      EBITDA                                               =  73 384 514.315789   (45.2% of turnover)
      less depreciation                                    =   3 000 000.000000
      EBIT                                                 =  70 384 514.315789   (43.4% of turnover)

  E2. Tax - and here the sector's natural description does not map onto a rate on profit, so I
  keep the natural description.
  Turnover of 162 240 000 XOF sits inside the microenterprise band, 50 000 001 to 200 000 000
  TTC. Medical analyses are VAT-exempt and the microenterprise regime is in any case libératoire
  of VAT, so turnover TTC equals turnover HT and there is no VAT layer to strip. The tax due is
  a levy on TURNOVER at 7% (5% had he joined a centre de gestion agree, which he does not say he
  has), and it is libératoire of the profits tax, the patente and VAT alike - so there is NO
  patente line, NO taxe speciale d'equipement line and NO impot minimum forfaitaire line in this
  model. Only the payroll levies survive it, and they are already in D1.

      tax charge  = 162 240 000 x 0.07                     =  11 356 800 XOF/year
      NOPAT       = 70 384 514.315789 - 11 356 800         =  59 027 714.315789 XOF/year

  The friction, stated rather than smoothed: this is a NOPAT whose tax line is not a rate times
  EBIT. The implied effective rate on EBIT is 11 356 800 / 70 384 514.32 = 16.1% - well under the
  25% BIC rate a profitable Ivorian company would otherwise pay - but that 16.1% is an OUTPUT of
  the model, not an input to it, and it moves inversely with profitability. Two consequences a
  reader should hold onto. First, there is no depreciation tax shield in this business: an extra
  franc of depreciation reduces EBIT and does not reduce tax by one centime. Second, the band
  ceiling is a live constraint - at 162 240 000 the lab is at 81.1% of the 200 000 000 ceiling,
  so roughly 23% of volume growth away from being pushed into the reel simplifie, where tax
  becomes BIC on profit plus the impot minimum forfaitaire plus the patente plus the TSE. That
  is a step change in the tax FORM, not a change in a rate.
  One question I flag and do not resolve: the levy base is «le chiffre d'affaires annuel TTC». I
  take that as gross invoiced turnover of 162 240 000, which is the conservative reading. Whether
  the 3 516 552 of claims that are refused outright and never collected may be excluded from the
  base is a matter for the DGI, not for arithmetic.

  E3. To FCFF.

      NOPAT                                                =  59 027 714.315789
      plus depreciation                                    =   3 000 000.000000
      less increase in net working capital                 =           0.000000
      less capital expenditure                             =           0.000000
      FCFF                                                 =  62 027 714.315789 XOF/period

  identically in each of the five periods, and 310 138 571.578947 XOF over the horizon. Note the
  decomposition the checks assert: cash from operations is 62 027 714.315789 and cash from
  investing is nil, and their sum is FCFF - which is only true here because the horizon was drawn
  to stop before the analysers must be replaced.

  E4. What the reader should not do with this number.
  FCFF is 38.2% of turnover. That is high for a clinical laboratory and the model says plainly
  where the height comes from, in descending order: (i) nothing at all is charged for the costs
  the founder did not mention, nor for his own time; (ii) the tax is capped at 7% of turnover by
  a regime that does not look at profit; (iii) the fixed asset is a large machine carrying a
  small load, so depreciation is only 1.8% of turnover; and (iv) the operation is flat, so the
  third-party cycle - the thing this business is actually about - shows up as trapped capital on
  the balance sheet rather than as a charge in the flow. Take those in order and the first two
  are questions, not findings. This number is what the asset generates BEFORE the owner is paid
  and before the costs he omitted are paid; it is not what he takes home.

checks:

  # ---- driver bridge: physical volume ----------------------------------------
  - "trace.operating_days == days_per_week * weeks_per_year - holiday_closure_days"
  - "trace.tests == tests_per_day * trace.operating_days"
  - "trace.determinations == trace.tests * determinations_per_billable_act"
  - "trace.patients == trace.tests / billable_acts_per_patient"
  - "trace.gross_billings == price_per_test * trace.tests"

  # ---- physical closure (c): every rate fits the thing that produces it -------
  - "trace.analyser_run_hours == trace.determinations / (analyser_rated_throughput_per_hour * analyser_count)"
  - "trace.analyser_run_hours_per_operating_day == trace.analyser_run_hours / trace.operating_days"
  - "trace.analyser_capacity_determinations == analyser_count * analyser_rated_throughput_per_hour * opening_hours_per_day * plant_availability_factor * trace.operating_days"
  - "trace.determinations <= trace.analyser_capacity_determinations"
  - "trace.analyser_run_hours_per_operating_day <= opening_hours_per_day * plant_availability_factor"
  - "trace.technician_minutes_required == trace.patients * phlebotomy_minutes_per_patient + trace.determinations * technician_minutes_per_determination"
  - "trace.technician_minutes_available == technician_count * opening_hours_per_day * 60 * trace.operating_days * (1 - (statutory_leave_days_per_year + sick_absence_days_per_year) / (days_per_week * weeks_per_year))"
  - "trace.technician_minutes_required <= trace.technician_minutes_available"
  - "cleaner_salary_monthly >= smig_monthly"

  # ---- physical closure (c): power ---------------------------------------------
  - "trace.grid_kwh == fridge_count * fridge_kwh_per_day * days_per_calendar_year + ac_unit_count * ac_kw * ac_hours_per_operating_day * trace.operating_days + analyser_kw * trace.analyser_run_hours + misc_kwh_per_operating_day * trace.operating_days"
  - "trace.grid_electricity_cost == trace.grid_kwh * electricity_tariff_ttc"
  - "trace.generator_budget_residual == power_annual - trace.grid_electricity_cost"
  - "trace.generator_budget_residual >= 0"
  - "trace.generator_hours_affordable == trace.generator_budget_residual / (gasoil_price_per_litre * genset_fuel_litres_per_hour)"
  - "trace.generator_hours_affordable >= generator_run_hours_per_year"

  # ---- physical closure (d): cumulative quantities against the world ------------
  - "trace.cumulative_analyser_hours_since_installation == trace.analyser_run_hours * haem_analyser_age_at_t0_years + cumsum(trace.analyser_run_hours)"
  - "trace.cumulative_analyser_hours_since_installation[last] <= analyser_count * analyser_design_life_hours"
  - "haem_analyser_age_at_t0_years + grid.periods <= 1 / depreciation_rate"
  - "biochem_analyser_age_at_t0_years + grid.periods <= 1 / depreciation_rate"
  - "sum(trace.reagent_expired) == reagent_expiry_waste_rate * sum(trace.reagent_purchased)"

  # ---- conservation: transformation 1, reagent and consumable mass balance -----
  - "trace.reagent_consumed == trace.tests * reagent_consumable_cost_per_test * reagent_share_of_input_cost * reagent_cost_is_net_of_expiry_waste"
  - "trace.consumable_consumed == trace.tests * reagent_consumable_cost_per_test * (1 - reagent_share_of_input_cost)"
  - "trace.reagent_expired == trace.reagent_purchased * reagent_expiry_waste_rate"
  - "trace.reagent_purchased == trace.reagent_consumed + trace.reagent_expired"
  - "trace.consumable_purchased == trace.consumable_consumed + trace.consumable_expired"
  - "trace.consumable_expired == 0"
  - "trace.inventory_close == trace.inventory_open + trace.reagent_purchased + trace.consumable_purchased - trace.reagent_consumed - trace.consumable_consumed - trace.reagent_expired - trace.consumable_expired"
  - "trace.inventory_open[t] == trace.inventory_close[t-1] for t >= 1"
  - "trace.inventory_open[first] == opening_inventory_balance"
  - "trace.inventory_close == (trace.reagent_purchased + trace.consumable_purchased) * purchase_cover_months / 2 / months_per_year"
  - "trace.inventory_close >= 0"

  # ---- conservation: transformation 2, invoice into cash -----------------------
  - "trace.billed_to_schemes == trace.gross_billings * insured_client_share * (cmu_share_of_insured * cmu_coverage_rate + (1 - cmu_share_of_insured) * private_coverage_rate)"
  - "trace.counter_cash_collected == trace.gross_billings * (cash_client_share + insured_client_share * (cmu_share_of_insured * (1 - cmu_coverage_rate) + (1 - cmu_share_of_insured) * (1 - private_coverage_rate)))"
  - "trace.gross_billings == trace.counter_cash_collected + trace.billed_to_schemes"
  - "trace.scheme_claims_rejected == trace.billed_to_schemes * rejection_rate_on_scheme_billings"
  - "trace.scheme_claims_recovered_on_redo == trace.scheme_claims_rejected * redo_recovery_share"
  - "trace.scheme_claims_rejected == trace.scheme_claims_recovered_on_redo + trace.scheme_claims_written_off"
  - "trace.scheme_cash_collected == trace.billed_to_schemes - trace.scheme_claims_written_off"
  - "trace.gross_billings == trace.counter_cash_collected + trace.scheme_cash_collected + trace.scheme_claims_written_off"
  - "trace.scheme_claims_written_off >= 0"
  - "trace.ar_close == trace.ar_open + trace.billed_to_schemes - trace.scheme_cash_collected - trace.scheme_claims_written_off"
  - "trace.ar_open[t] == trace.ar_close[t-1] for t >= 1"
  - "trace.ar_open[first] == opening_receivable_balance"
  - "trace.ar_close >= 0"
  - "cmu_share_of_scheme_billings == cmu_share_of_insured * cmu_coverage_rate / (cmu_share_of_insured * cmu_coverage_rate + (1 - cmu_share_of_insured) * private_coverage_rate)"
  - "trace.ar_close == trace.billed_to_schemes * (private_delay_months * (1 - cmu_share_of_scheme_billings) + cmu_delay_months * cmu_share_of_scheme_billings + rejection_rate_on_scheme_billings * redo_extra_delay_months) / months_per_year"

  # ---- conservation: working capital -------------------------------------------
  - "trace.ap_close == (trace.reagent_purchased + trace.consumable_purchased) * supplier_payment_days / days_per_calendar_year"
  - "trace.nwc_close == trace.inventory_close + trace.ar_close - trace.ap_close"
  - "trace.nwc_close == trace.nwc_open + trace.delta_nwc"
  - "trace.nwc_open[t] == trace.nwc_close[t-1] for t >= 1"
  - "trace.nwc_open[first] == opening_nwc_balance"
  - "opening_nwc_balance == opening_inventory_balance + opening_receivable_balance - opening_payable_balance"
  - "sum(trace.delta_nwc) == trace.nwc_close[last] - opening_nwc_balance"

  # ---- conservation: fixed assets -----------------------------------------------
  - "trace.depreciation == (haem_analyser_cost + biochem_analyser_cost) * depreciation_rate"
  - "trace.capex == other_equipment_annual_capex"
  - "trace.nbv_close == trace.nbv_open - trace.depreciation + trace.capex"
  - "trace.nbv_open[t] == trace.nbv_close[t-1] for t >= 1"
  - "trace.nbv_open[first] == haem_analyser_cost * (1 - depreciation_rate * haem_analyser_age_at_t0_years) + biochem_analyser_cost * (1 - depreciation_rate * biochem_analyser_age_at_t0_years)"
  - "trace.nbv_close >= 0"

  # ---- driver bridge: costs -------------------------------------------------------
  - "trace.gross_payroll == (technician_count * technician_salary_monthly + biologist_salary_monthly + secretary_salary_monthly + cleaner_salary_monthly) * months_per_year * (1 + overtime_premium_uplift) + founder_remuneration_annual"
  - "trace.cnps_capped_base == headcount * cnps_capped_base_monthly * months_per_year"
  - "trace.cnps_charges == trace.gross_payroll * cnps_pension_rate_employer + trace.cnps_capped_base * (cnps_family_rate_employer + cnps_maternity_rate_employer + cnps_at_mp_rate_employer)"
  - "trace.payroll_levies == trace.gross_payroll * employer_payroll_levy_rate"
  - "trace.labour_expense == trace.gross_payroll + trace.cnps_charges + trace.payroll_levies"
  - "trace.reagents_and_consumables_expense == trace.reagent_consumed + trace.consumable_consumed + trace.reagent_expired"
  - "trace.fixed_other_expense == rent_monthly * months_per_year + maintenance_contract_annual + power_annual + other_unstated_opex_annual"

  # ---- definition: the ladder -------------------------------------------------------
  - "trace.net_revenue == trace.gross_billings - trace.scheme_claims_written_off"
  - "trace.total_opex == trace.reagents_and_consumables_expense + trace.labour_expense + trace.fixed_other_expense"
  - "trace.ebitda == trace.net_revenue - trace.total_opex"
  - "trace.ebit == trace.ebitda - trace.depreciation"
  - "trace.tax_charge == tax_regime * trace.gross_billings * microenterprise_tax_rate"
  - "microenterprise_tax_rate == microenterprise_cga_rate * cga_member_flag + microenterprise_standard_rate * (1 - cga_member_flag)"
  - "trace.nopat == trace.ebit - trace.tax_charge"
  - "trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex"

  # ---- structural: the regime that produces the tax formula -----------------------
  - "sum(trace.gross_billings) / grid.periods >= microenterprise_band_low"
  - "sum(trace.gross_billings) / grid.periods <= microenterprise_band_high"
  - "trace.gross_billings * medical_services_vat_status == 0"

notes:

  - id: N01
    title: "The headline number is what the asset generates before the owner is paid and before the costs he did not mention are paid"
    text: >
      FCFF of 62.0 million XOF a year on turnover of 162.2 million is 38.2%, and EBITDA of 45.2%
      is above what a routine clinical laboratory would normally show. The model is transparent
      about why and the reader should not treat the height as a finding about the business's
      quality. In descending order of size: nothing is charged for waste disposal, professional
      indemnity insurance, external quality assessment, water, telecoms, the laboratory
      information system, accountancy, the licence, or prescriber referral arrangements, because
      the utterance mentions none of them; nothing is charged for the founder's own time; the tax
      is capped at 7% of turnover by a regime that never looks at profit; and depreciation is only
      1.8% of turnover because a large machine is carrying a small load. The first two of those
      are ELICITED questions with a base value of zero, ranked first and second. Until they are
      answered this figure is an upper bound, not an estimate.

  - id: N02
    title: "The third-party cycle is a stock, not a flow, and putting it in the flow would be the error"
    text: >
      This business's defining feature is that 51% of its turnover leaves the building as a claim
      and comes back months later, minus 8.5% refused. But the laboratory is four years old and
      flat, so its claims book and its reagent stock were built years ago and are not built again
      inside the forecast. The change in net working capital is therefore nil in every period, and
      the cycle's cost appears in two other places instead: 33.2 million XOF of capital permanently
      trapped (20.5% of a year's turnover, and more than the written-down value of both analysers),
      which is a balance-sheet fact; and 3.5 million XOF a year of denials that die, which is a
      flow and is in the numbers. Charging the receivable to FCFF as if it were a recurring outflow
      would count the same economics twice. The trapped capital is nonetheless the reason this
      business would struggle to fund growth from its own cash, and the reason its owner feels poor
      on a 38% cash margin. Note also that financing that stock is a FINANCING cost and is
      correctly absent from an unlevered FCFF - which means an unlevered number systematically
      understates how uncomfortable this business is to run.

  - id: N03
    title: "The technicians are the binding constraint, not the analysers - the opposite of what the utterance emphasises"
    text: >
      The founder volunteers that the analysers can each do sixty samples an hour and that he does
      not run at full capacity. On the base case they run at 14.8% of available capacity - about one
      hour a day out of eight. The people are where the operation is tight: two technicians at 79.2%
      of their available minutes after statutory leave, with no cover when one is away and none of
      the 26.4 statutory leave days each backfilled. The biologist is a second single point of
      failure, since results cannot lawfully be released without a qualified biologist's validation.
      This is a finding about the business's fragility that no financial line item can carry, and it
      is sensitive to two ELICITED inputs (phlebotomy minutes and bench minutes per determination).

  - id: N04
    title: "The stated power budget is at the edge of what the described plant needs"
    text: >
      800 000 XOF a year is stated to cover both the grid supply and the standby generator. At the
      published CIE professional tariff, the modelled load of the plant he describes - 24/7 cold
      chain, air-conditioned analyser room, the analysers themselves, general lab load - consumes
      roughly four-fifths of it, leaving enough diesel for about 95 generator hours a year and
      nothing for servicing the set. That is thin for an operator who says an outage with the
      reagents in the fridge is unaffordable. His figure stays in the model unaltered; the finding
      is what it buys. The whole calculation rests on an ASSUMED load model that I have set out
      line by line so a reader can disagree with any of it - and it is highly sensitive to one
      line: if the analyser room is conditioned 24 hours rather than 8, the budget cannot cover
      the grid load at all and the physical-adequacy check fails.

  - id: N05
    title: "A six-day week is eight hours a week beyond the legal duration"
    text: >
      Six days at eight hours is 48 hours against a legal weekly duration of 40 in Cote d'Ivoire.
      If the quoted salaries are basic pay, statutory overtime premiums apply to hours 41-46 and
      again from the 47th, and the true payroll is above what the founder stated. The base case
      adds nothing, on his words; the uplift is carried as an input with the question attached so
      that a different answer produces a different number rather than a different paragraph. The
      direction is unambiguous: any answer other than "it is all-in" raises labour cost and lowers
      FCFF.

  - id: N06
    title: "The tax regime is a structural question and the cached annex rate is stale"
    text: >
      Two things here are worth a reader's attention. First, the regime itself: the founder never
      states his legal form or his filing regime, and the difference between the microenterprise
      levy on turnover and the reel simplifie (BIC on profit, plus the impot minimum forfaitaire,
      plus the patente, plus the taxe speciale d'equipement) changes the FORM of the tax line, not
      a number inside it. His turnover puts him in the microenterprise band and that is the base
      case, but it is a conditional establishment, not a fact I have from him. Second, the rate: the
      cached fact annex implies 6% (via the microenterprise reference ceiling in the IMF variable-
      floor rule, CI-TAX-04, verified 2026-07-26), while two independent Ivorian sources current for
      2025-2026 state the microenterprise rate as 7%, reduced to 5% for members of a centre de
      gestion agree. I have used 7% because that is what I could verify, and I flag the divergence
      rather than reconcile it silently. Note that CI-TAX-04's 6% sits inside a different rule and
      need not track the microenterprise rate at all - so the two may not actually conflict.

  - id: N07
    title: "There is no depreciation tax shield in this business, and the band ceiling is close"
    text: >
      Because the levy falls on turnover, an extra franc of depreciation reduces EBIT and reduces
      tax by nothing. That has two consequences worth naming. An omitted capex-and-depreciation
      pair (see the unstated generator, fridges, centrifuge and IT) moves FCFF by the capex alone,
      with no offsetting shield - so the zero in other_equipment_annual_capex is a straightforward
      overstatement of FCFF by whatever the true figure is. And the 200 000 000 XOF band ceiling is
      a live constraint: this laboratory is at 81.1% of it, so it is not far in volume terms from a
      step change in how it is taxed, at which point the deductibility of every cost line - and the
      value of the depreciation shield - switches on.

  - id: N08
    title: "The replacement of both analysers falls just outside the horizon, deliberately"
    text: >
      At a ten-year book life the analysers reach age nine at the end of period five, with
      3 000 000 XOF of net book value left and no capex in the window. This was the reason for
      choosing five periods: it is the last period whose capital charge derives from what the
      founder said rather than from a replacement machine, a replacement price and a replacement
      date the utterance is silent on. A reader who wants a sixth period must supply all three.
      Note also the lifetime-duty result: at roughly 3 000 combined run hours by age nine, these
      instruments will be retired for platform obsolescence and reagent lock-in, not for wear - so
      the replacement date is set by the supplier's product roadmap, which is precisely the kind
      of fact this utterance cannot contain.

  - id: N09
    title: "Revenue recognition friction, kept rather than forced"
    text: >
      Under IFRS 15 the expected denials are variable consideration and should reduce revenue
      rather than sit below the line as a bad-debt charge. The founder describes it the other way -
      billing a hundred and losing eight or nine - and I show both lines so either presentation is
      readable. Nothing downstream of EBIT turns on the choice. What may turn on it is the tax
      base, since the levy is on «le chiffre d'affaires annuel TTC»: I use gross invoiced turnover
      of 162 240 000, the conservative reading, and note that whether outright-refused claims may
      be excluded is a question for the DGI rather than for arithmetic.

  - id: N10
    title: "Three simplifications I made and one confidence I do not have"
    text: >
      (i) The three-month purchase cover is stated by the founder for reagents; I extend it to
      consumables on the ground that he describes one supplier delivering by lot. If tubes and
      gloves are bought separately and more often, inventory is overstated. (ii) On an annual grid
      the reagent batch cycle repeats exactly four times, so a true year-end inventory balance would
      be either a full batch or nothing; I carry the cycle AVERAGE, which is the right measure of
      capital employed over a period but is not a snapshot. (iii) The 6 500 average price is applied
      uniformly across cash, CMU and private patients. If the CMU reimburses on a tarif de reference
      below the laboratory's own list price - which the founder's complaint about codes that do not
      match rather hints at - then the realised price on 30% of his volume is lower than modelled
      and revenue is overstated. And the confidence I do not have: the VAT exemption for medical
      analyses in Cote d'Ivoire is well supported in substance but I could not verify the precise
      CGI article number against the official text, only against secondary Ivorian sources. It
      happens not to matter for the arithmetic, because the microenterprise regime is itself
      libératoire of VAT, so both routes give the same answer - but the reader should know the
      article citation is the weakest verification in this document.

  - id: N11
    title: "Which three questions to ask if he will only answer three"
    text: >
      Ranked by how far the answer moves the number, relative to the others: (1) what else he
      actually pays for in a year, beyond reagents, wages, rent, maintenance and power; (2) whether
      and how much he pays himself; (3) whether he is a member of a centre de gestion agree, which
      is worth two points of turnover - more than the entire annual maintenance contract on both
      analysers - for a piece of paper. The structural regime question ranks alongside these but
      changes the shape of the tax computation rather than a value inside it, which is why it is
      wired into `checks` only through the band test that establishes it. The payer-mix and
      collection-lag questions, which look like the heart of this case, rank MEDIUM and not high -
      because in a flat operation they move the trapped capital and the balance sheet, not the
      annual free cash flow. That inversion is itself worth reporting to the founder.

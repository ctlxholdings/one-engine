    source: "The founder names only the two analysers, yet the operation he describes necessarily contains a generator, refrigerators, a centrifuge, a microscope, furniture and IT - none costed and none depreciated. Base case charges nil replacement capital - the OMITTING choice. Note that under this lab's tax regime the levy falls on TURNOVER, so an omitted capex-and-depreciation pair shifts FCFF by the capex alone with no offsetting tax shield."
    question: "Other than the two analysers, what equipment have you had to buy or replace in the last few years - the generator, the fridges, the centrifuge, computers - and what did it cost?"

  other_unstated_opex_annual:
    value: 0
    unit: XOF/year
    prov: ELICITED
    source: "A real medical analysis laboratory in Abidjan pays for things this utterance does not mention: infectious clinical-waste collection (DASRI), professional indemnity insurance, external quality assessment scheme subscriptions and internal QC material, water, telephone and internet, a laboratory information system, accountancy and any CGA subscription, the operating licence, bank charges, and in this market frequently a referral arrangement with prescribing doctors. Base case charges NOTHING for any of it - the OMITTING choice - so that every franc in this model is traceable to something the founder said. This is the single largest reason the margin below looks high for the sector, and it is why this question ranks first."
    question: "Apart from reagents, wages, rent, the maintenance contract and the electricity - what else do you actually write cheques for in a year? Waste collection, insurance, the quality-control scheme, the accountant, the internet, the licence?"

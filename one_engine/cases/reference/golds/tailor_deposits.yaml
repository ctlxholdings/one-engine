notes: |
  FINDINGS

  1. Revenue is flat; cash is violently seasonal. This is the headline. Because the shop is
     capacity-bound in all 24 months, deliveries — and therefore revenue — do not move at all, while
     orders swing from 11.72 to 44.54 in a month. The entire seasonal signal lands in the deposit
     book and therefore in working capital: FCFF is negative in four of the 24 months (both Januaries
     and both Februaries) and roughly eleven times the normal month in each December. A reader who
     looked only at an annual view of this business would see none of this and would size its working
     line wrong. This is the reason for the monthly grid.

  2. The December order surge does not fit the plant, and the founder already knew. Asked for 44.54
     garments against 23.92 starts, the shop cannot comply. It queues instead: the implied wait
     reaches 9.9 weeks at end-December against the six weeks he quotes as normal. He flagged this
     himself — « parfois plus quand il y a beaucoup de commandes » — and the model reproduces the
     magnitude rather than absorbing the shortfall into a fudged December capacity. Whether he
     instead works Sundays and takes on apprentices in December is dec_capacity_uplift, and it is
     asked.

  3. Twenty-six working days a month is a six-day week with no holidays. 26 x 12 = 312 = 52 x 6
     exactly. Côte d'Ivoire has 14 statutory holidays. The founder's day-count is a nominal opening
     pattern, not attendance, and I have not quietly kept it: attendance_availability = 0.92 is an
     explicit, questioned input and every quantity in the model scales off it.

  4. The shop runs a 48-hour week against a 40-hour legal norm. 26 days x 8 hours. That is eight
     overtime hours a week, permanently, which would carry majorations under the Code du travail if
     the seamstresses are on contracts. Neither the majorations nor employer social contributions are
     in the base case, and both turn on the same question, which is why that question is ranked high.

  5. The regime call is where a wrong answer would have hidden perfectly. At 12.47 m XOF of annual
     turnover this is a taxe d'État de l'entreprenant taxpayer, and the TEE is libératoire: no BIC,
     no patente, no VAT — and, decisively, no impôt minimum forfaitaire. The IMF's 3 000 000 XOF
     floor is a RNI/RSI charge. Had I put this workshop in the réel simplifié by reflex, the model
     would have carried a minimum tax two and a half times its annual EBITDA and every internal check
     in this document would still have passed.

  6. A turnover tax makes depreciation cash-neutral and the burden heavy. The TEE takes 5% of
     revenue, which is 58% of EBIT here — more than double the 25% headline BIC rate — and it grants
     no shield on the 9 583 a month of depreciation, which is deducted and added straight back. The
     ten-year life I defaulted to therefore changes the P&L and not one franc of FCFF.

  7. The machines will need replacing before their accounting life ends. At 574.08 fleet hours a
     month, each of the four heads reaches about 6 889 hours by the end of the horizon, four years
     from purchase — inside a 10 000-hour prior, which is why capex is legitimately zero here. Run
     the same intensity to the ten-year depreciation life and each machine is asked for roughly
     17 200 hours, which a 200 000 XOF semi-industrial head does not give. The finding is that the
     accounting life overstates the economic replacement cycle, direction only: any horizon long
     enough to contain the replacement will carry capex this one does not.

  8. The business is a wage, not an asset. The founder draws 1 440 000 XOF a year; unlevered free
     cash flow is 505 329 XOF a year. Almost all the value produced here is his own labour. The
     producing_workers question is the first one to ask for exactly this reason: if he is himself one
     of four producing pairs of hands, the residual is even more his wage than the base case says.

  9. Customers finance the workshop. Working capital is negative in every period, between 94 000 and
     622 000 XOF, against plant with a net book value falling from 910 417 to 690 000. The deposit is
     not just a discipline device against no-shows; it is this business's funding.

  SIMPLIFICATIONS AND JUDGMENT CALLS

  - Owner compensation. The 120 000 « je me sers » is a draw, not contractually a salary. I expense
    it, on the standard normalisation that an asset-side cash flow must be struck after the cost of
    the labour required to run the asset, and a buyer would have to hire a cutter-manager. The
    friction is recorded rather than hidden: a strict reading would treat it as a distribution and
    report FCFF 1 440 000 a year higher against a business that then has no manager.
  - Framework. The task specifies IAS/IFRS; the framework actually applicable in OHADA is SYSCOHADA
    révisé. On these facts they agree — point-in-time recognition at collection, contract liability
    for the deposit, conversion costs in work in progress — so nothing turns on it.
  - Unit friction. The commercial unit at Adjamé is the 6-yard pagne, about 5.4864 m, not 6 m. I have
    kept the founder's « six mètres » because he stated it, but if he means a 6-yard piece the offcut
    fraction is 9.1% and not 8.3%, and the fabric-price-per-metre derivation shifts with it. Kept as
    a friction rather than corrected, because correcting it would be substituting my unit for his.
  - Tax timing. The TEE is accrued and treated as settled within the month it arises. The real
    payment calendar (monthly declaration and payment in arrears) would shift a month of tax by one
    period and would not change the total.
  - Constant inventory. Fabric cover is held at exactly two months and work in progress at exactly
    three garments, so both are flat and contribute nothing to the change in working capital. If he
    buys lumpily on market trips — which « quand c'est là » suggests — the monthly cash line
    sawtooths around the same total.
  - Finished-goods stock is zero, declared not omitted. Uncollected garments are written to nil on
    completion under IAS 2.9: cut to one person's measurements, no alternative use.
  - Trade receivables and trade payables are zero, declared not omitted, on the stated collection
    terms and on cash purchase at a market stall.

  DEFERRED — a structural question I did not model

  In Abidjan a large share of bespoke work is « façon »: the customer brings her own pagne and pays
  only for the making-up. The founder's « ça me revient à seize mille par tenue » implies he buys the
  cloth on every job, so the base case has no façon business at all. I did not carry this as an input
  because it would require a second price line (a façon tariff) and a second materials path, i.e. it
  changes the structure of the model rather than a value in it, and a base of zero with an unmodelled
  second price would have been a question that moves nothing. It is nevertheless a real question and
  it belongs in the interview alongside the ranked ones: « Est-ce qu'il y a des clientes qui
  apportent leur propre pagne et qui paient seulement la façon ? Sur dix tenues, combien ? » If the
  answer is materially above zero, both the revenue per garment and the materials per garment in this
  model are wrong in offsetting directions and the mix has to be split.

  Two smaller items also deferred, both low: transport and market-day costs for the Adjamé trips
  (never mentioned, certainly non-zero, small), and the rent trajectory (held flat at 150 000 for 24
  months with no escalation described).

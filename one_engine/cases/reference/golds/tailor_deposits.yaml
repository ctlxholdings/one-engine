checks:
  # ---- conservation: the order book
  - "trace.backlog[t] == trace.backlog_opening[t] + trace.orders[t] - trace.completions[t]"
  - "trace.backlog_opening[t] == trace.backlog[t-1] for t >= 1"
  - "trace.backlog_opening[first] == opening_backlog_outfits"
  - "cumsum(trace.orders) == cumsum(trace.completions) + trace.backlog - opening_backlog_outfits"
  # ---- conservation: the garment transformation
  - "trace.starts[t] == trace.completions[t] + trace.remakes[t]"
  - "trace.completions[t] == trace.collected[t] + trace.uncollected[t]"
  # ---- conservation: the fabric balance
  - "trace.fabric_consumed_m[t] == trace.fabric_into_garments_m[t] + trace.offcuts_m[t]"
  - "trace.fabric_stock_m[t] == trace.fabric_stock_opening_m[t] + trace.fabric_purchased_m[t] - trace.fabric_consumed_m[t] - trace.fabric_shrinkage_m[t]"
  - "trace.fabric_stock_opening_m[t] == trace.fabric_stock_m[t-1] for t >= 1"
  - "trace.fabric_stock_opening_m[first] == opening_fabric_stock_m"
  - "cumsum(trace.fabric_purchased_m) == cumsum(trace.fabric_consumed_m) + cumsum(trace.fabric_shrinkage_m) + trace.fabric_stock_m - opening_fabric_stock_m"
  # ---- conservation: plant
  - "trace.accumulated_depreciation[t] == trace.accumulated_depreciation[t-1] + trace.depreciation[t] for t >= 1"
  - "trace.accumulated_depreciation[first] == accumulated_depreciation_opening + trace.depreciation[first]"
  # ---- conservation: deposits and working capital
  - "trace.delta_deferred_revenue[t] == trace.deferred_revenue[t] - trace.deferred_revenue[t-1] for t >= 1"
  - "trace.delta_deferred_revenue[first] == trace.deferred_revenue[first] - opening_deferred_revenue"
  - "trace.nwc_opening[t] == trace.nwc[t-1] for t >= 1"
  - "trace.nwc_opening[first] == opening_nwc"
  - "trace.delta_nwc[t] == trace.nwc[t] - trace.nwc_opening[t]"
  - "cumsum(trace.delta_nwc) == trace.nwc - opening_nwc"

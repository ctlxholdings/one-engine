  - "trace.revenue[t] == trace.revenue_collected[t] + trace.revenue_forfeited_deposits[t] + trace.offcut_revenue[t]"
  - "trace.opex_total[t] == trace.materials_expense[t] + trace.shrinkage_expense[t] + trace.seamstress_wages[t] + trace.employer_social_charges[t] + trace.founder_compensation[t] + trace.rent[t] + trace.electricity[t] + trace.maintenance[t]"
  - "trace.ebitda[t] == trace.revenue[t] - trace.opex_total[t]"
  - "trace.ebit[t] == trace.ebitda[t] - trace.depreciation[t]"
  - "trace.nopat[t] == trace.ebit[t] - trace.tax_tee[t]"
  - "trace.fcff[t] == trace.nopat[t] + trace.depreciation[t] - trace.delta_nwc[t] - trace.capex[t]"

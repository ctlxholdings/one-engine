  cassava_cost:  [25000000, 25000000, 25000000, 25000000, 25000000]
  wood_cost:     [3000000, 3000000, 3000000, 3000000, 3000000]
  opex_other:    [0, 0, 0, 0, 0]
  ebitda:        [7000000, 7000000, 7000000, 7000000, 7000000]
  dna:           [300000, 300000, 300000, 300000, 300000]
  ebit:          [6700000, 6700000, 6700000, 6700000, 6700000]
  tax:           [1400000, 1400000, 1400000, 1400000, 1400000]
  nopat:         [5300000, 5300000, 5300000, 5300000, 5300000]
  capex:         [300000, 300000, 300000, 300000, 300000]
  inv_cassava:   [208333.3333333333, 208333.3333333333, 208333.3333333333, 208333.3333333333, 208333.3333333333]
  inv_fg:        [155555.5555555556, 155555.5555555556, 155555.5555555556, 155555.5555555556, 155555.5555555556]
  ar:            [680555.5555555556, 680555.5555555556, 680555.5555555556, 680555.5555555556, 680555.5555555556]
  ap:            [347222.2222222222, 347222.2222222222, 347222.2222222222, 347222.2222222222, 347222.2222222222]
  nwc:           [697222.2222222223, 697222.2222222223, 697222.2222222223, 697222.2222222223, 697222.2222222223]
  delta_nwc:     [697222.2222222223, 0, 0, 0, 0]
  cfo:           [4902777.777777778, 5600000, 5600000, 5600000, 5600000]

passage: |
  UNIT OF ACCOUNT AND NATURAL QUANTITY
  The business's natural production unit is the demi-bâchée — one delivered tonne of
  cassava steamed and processed into attiéké. Every operating figure is built from this
  batch, then annualised. All amounts are in XOF (FCFA).

  STEP 1 — OPERATING VOLUMES (STATED → INFERRED)
  The founder runs 4 demi-bâchées per week over 50 operating weeks (two weeks off):
      batches/year = 4 × 50 = 200 demi-bâchées.
  Each demi-bâchée yields 500 kg of attiéké:
      attiéké/year = 200 × 500 = 100,000 kg (= 100 tonnes).
  Sanity check on the physical yield: 500 kg attiéké from 1,000 kg cassava = 50% mass
  conversion — squarely within the realistic 40–60% band for attiéké. The build is
  physically coherent.

  STEP 2 — REVENUE (INFERRED)
  Wholesale price is 350 XOF/kg:
      revenue = 100,000 kg × 350 = 35,000,000 XOF/year.
  Equivalently, revenue per batch = 500 × 350 = 175,000 XOF; × 200 = 35,000,000. ✓

  STEP 3 — DIRECT (STATED) COSTS
  Cassava at 125,000/demi-bâchée and wood at 15,000/demi-bâchée:
      cassava cost = 200 × 125,000 = 25,000,000 XOF/year.
      wood cost    = 200 × 15,000  =  3,000,000 XOF/year.
  Direct cost per batch = 125,000 + 15,000 = 140,000; contribution per batch =
  175,000 − 140,000 = 35,000 XOF (20% of batch revenue). Over 200 batches:
      gross contribution = 35,000,000 − 25,000,000 − 3,000,000 = 7,000,000 XOF/year.

  STEP 4 — OTHER OVERHEAD (ELICITED → base ZERO, flagged)
  No overhead was stated. Water (soaking/washing), packaging/sacks, out-transport and
  rent are real for such a unit but unquantified. Base case sets opex_other = 0, so the
  reported margin/FCFF is an UPPER bound; each 1,000,000 of true overhead lowers steady
  FCFF by 1,000,000. (See notes for the elicitation questions.)

  STEP 5 — LABOUR / THE TEN WOMEN (central judgment)
  No wage is stated. Diagnostic: gross contribution before any labour is 7,000,000/yr for
  10 women = 700,000/woman/yr ≈ 58,333/woman/month — BELOW the Ivorian SMIG (~75,000/mo).
  A going concern cannot pay contractual wages exceeding its gross margin; the surplus
  itself sits below minimum wage per head. The economically consistent reading is that
  the ten women are profit-sharing artisan owner-operators, not waged employees. In an
  asset-side (unlevered, pre-financing, pre-distribution) FCFF, owner-operator draws are
  distributions to equity, NOT operating expenses. Base case therefore carries NO wage
  line; the residual FCFF is what these owner-operators (and any capital) share. This is
  the single largest modelling judgment — if the women were in fact waged, opex would
  rise and FCFF could fall to or below zero (see notes).

  STEP 6 — DEPRECIATION (ASSUMED base, IAS 16 straight-line)
  Durable kit assumed at 1,500,000 gross, 5-year life:
      D&A = 1,500,000 / 5 = 300,000 XOF/year.
  EBITDA = 35,000,000 − 25,000,000 − 3,000,000 − 0 = 7,000,000.
  EBIT   = EBITDA − D&A = 7,000,000 − 300,000 = 6,700,000 XOF/year.

  STEP 7 — TAX and NOPAT (ASSUMED regime; friction noted)
  A 35M-turnover unit falls in Côte d'Ivoire's régime de l'entreprenant (band 5M–50M); its
  Taxe d'État de l'Entreprenant (TEE) for commerce is 4% of TURNOVER (not a rate on EBIT).
  The régime des microentreprises (6%) begins only at 50M turnover:
      tax = 0.04 × 35,000,000 = 1,400,000 XOF/year.
  FRICTION: this presumptive tax is turnover-based, so it does not equal t×EBIT and D&A
  gives no tax shield. To preserve the FCFF identity I define NOPAT as EBIT less the
  actual cash operating tax:
      NOPAT = EBIT − tax = 6,700,000 − 1,400,000 = 5,300,000 XOF/year.
  (Effective tax on EBIT = 1,400,000 / 6,700,000 = 20.9%.)

  STEP 8 — WORKING CAPITAL (ASSUMED day-counts, 360-day basis)
  Perishability keeps WC small. Levels (days/360 × annual flow):
      raw cassava inventory   = 3/360 × 25,000,000 = 208,333.33
      finished attiéké invty  = 2/360 × (25,000,000+3,000,000) = 2/360 × 28,000,000 = 155,555.56
      receivables (revenue)   = 7/360 × 35,000,000 = 680,555.56
      payables (cassava)      = 5/360 × 25,000,000 = 347,222.22   (wood is cash)
      NWC = 208,333.33 + 155,555.56 + 680,555.56 − 347,222.22 = 697,222.22 XOF (≈2% of revenue).
  Modelling convention: operating working capital is funded at the START of the horizon,
  so the full 697,222.22 is invested in period t=0 (ΔNWC[0] = +697,222.22) and, with flat
  volumes, ΔNWC = 0 in every later period. NWC then holds constant at 697,222.22.

  STEP 9 — CAPEX
  Steady-state sustaining capex = depreciation = 300,000 XOF/year (equipment base held
  constant; the pre-existing kit is not re-bought — only maintained).

  STEP 10 — FCFF = NOPAT + D&A − ΔNWC − capex
  Cash-flow blocks:
      CFO = NOPAT + D&A − ΔNWC ;   CFI = −capex ;   FCFF = CFO + CFI.
  Period t=0 (WC funded):
      CFO = 5,300,000 + 300,000 − 697,222.22 = 4,902,777.78 ; CFI = −300,000
      FCFF[0] = 4,902,777.78 − 300,000 = 4,602,777.78 XOF.
  Periods t=1..4 (steady state, ΔNWC = 0; D&A and capex cancel):
      CFO = 5,300,000 + 300,000 − 0 = 5,600,000 ; CFI = −300,000
      FCFF = 5,600,000 − 300,000 = 5,300,000 XOF.
  Steady-state asset-side FCFF ≈ 5.30M XOF/year; period 0 lower by the 0.697M one-off
  working-capital investment. Per owner-operator (÷10) that is ≈ 530,000/woman/year
  (≈ 44,200/month) — the thin economics typical of informal artisanal food processing.


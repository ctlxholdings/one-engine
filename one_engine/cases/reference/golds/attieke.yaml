id: golds_attieke_abobo_abidjan_fcff
title: "Atelier d'attiéké — Abobo, Abidjan (Côte d'Ivoire) — Unlevered FCFF via NOPAT"
currency: XOF            # West African CFA franc (FCFA); Côte d'Ivoire
grid:
  periods: 5            # t = 0..4
  freq: annual          # no growth stated → flat nominal steady state

utterance:
  fr: |
    Moi je suis gérante d'un atelier d'attiéké à Abobo, Abidjan. On est dix femmes.
    On achète le manioc à la demi-bâchée, une tonne, à cent vingt-cinq mille. Avec une
    demi-bâchée, on produit cinq cents kilos d'attiéké. On fait quatre demi-bâchées par
    semaine. On cuit au bois, le bois nous coûte quinze mille par demi-bâchée. On vend en
    gros à trois cent cinquante francs le kilo. On tourne cinquante semaines par an, deux
    semaines de pause.
  en: |
    I run an attiéké workshop in Abobo, Abidjan. We're ten women. We buy cassava by the
    demi-bâchée — one tonne — at a hundred twenty-five thousand. From one demi-bâchée we
    produce five hundred kilos of attiéké. We do four demi-bâchées a week. We steam with
    wood — wood costs us fifteen thousand per demi-bâchée. We sell wholesale at three
    hundred fifty francs per kilo. We operate fifty weeks a year, two weeks off.


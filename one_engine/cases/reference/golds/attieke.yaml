fcff: [4602777.777777778, 5300000, 5300000, 5300000, 5300000]

checks:
  # --- driver-bridge (each line rebuilt from its inputs) ---
  - trace.demi_bachees == batches_per_week * operating_weeks
  - trace.attieke_kg == yield_per_batch * trace.demi_bachees
  - trace.revenue == price_attieke * trace.attieke_kg
  - trace.cassava_cost == cassava_price * trace.demi_bachees
  - trace.wood_cost == wood_price * trace.demi_bachees
  - trace.dna == equipment_gross / equipment_life
  - trace.tax == tax_rate * trace.revenue
  - trace.inv_cassava == cassava_inv_days / wc_day_basis * trace.cassava_cost
  - trace.inv_fg == fg_inv_days / wc_day_basis * (trace.cassava_cost + trace.wood_cost)
  - trace.ar == ar_days / wc_day_basis * trace.revenue
  - trace.ap == ap_days / wc_day_basis * trace.cassava_cost
  # --- definition (the NOPAT→FCFF ladder) ---
  - trace.ebitda == trace.revenue - trace.cassava_cost - trace.wood_cost - trace.opex_other
  - trace.ebit == trace.ebitda - trace.dna
  - trace.ebit == trace.revenue - trace.cassava_cost - trace.wood_cost - trace.opex_other - trace.dna
  - trace.nopat == trace.ebit - trace.tax
  - trace.cfo == trace.nopat + trace.dna - trace.delta_nwc
  - trace.cfi == 0 - trace.capex
  - trace.fcff == trace.cfo + trace.cfi
  - trace.fcff == trace.nopat + trace.dna - trace.delta_nwc - trace.capex
  - fcff == trace.fcff
  - trace.capex == trace.dna
  # --- conservation (working-capital stock roll-forward) ---
  - trace.nwc == trace.inv_cassava + trace.inv_fg + trace.ar - trace.ap
  - trace.delta_nwc[t] == trace.nwc[t] - trace.nwc[t-1]
  - cumsum(trace.delta_nwc) == trace.nwc
  # --- non-negativity ---
  - trace.inv_cassava[t] >= 0
  - trace.inv_fg[t] >= 0
  - trace.ar[t] >= 0
  - trace.ap[t] >= 0
  - trace.nwc[t] >= 0
  - trace.ebitda[t] >= 0
  - trace.nopat[t] >= 0
  - trace.fcff[t] >= 0

notes:
  headline: >
    Steady-state unlevered FCFF ≈ 5,300,000 XOF/year (period 0 = 4,602,778 after the
    one-off 697,222 working-capital investment). Revenue 35.0M, direct costs 28.0M,
    gross contribution 7.0M, presumptive TEE tax 1.4M.

  corrections: >
    2026-07-24 — CORRECTED after physical audit. The gold taxed at 6% on the false premise
    that "35M sits in the micro band". Per DGI thresholds the régime des microentreprises
    runs 50M–200M; a 35M turnover falls in the régime de l'entreprenant (5M–50M), TEE 4%
    for commerce. Rate 0.06 → 0.04; tax 2,100,000 → 1,400,000; steady FCFF 4,600,000 →
    5,300,000. A wrong-but-internally-consistent parameter: the check tax == rate × revenue
    passed either way, so only a fact-checking audit could catch it. Sensitivities below
    restated qualitatively per contract v2.3.

  central_judgment_labour: >
    The ten women are treated as profit-sharing owner-operators, NOT waged staff, because
    the gross contribution before labour (7.0M/yr ≈ 58,333/woman/month) is below the
    Ivorian SMIG (~75,000/month): a going concern cannot pay wages exceeding its margin.
    Asset-side FCFF excludes owner draws. THE key sensitivity — if they were waged at,
    say, SMIG (10 × 75,000 × 12 = 9.0M/yr), operating cash would turn negative. ELICIT:
    are the women employees or members, and what do they actually draw?

  elicitation_deferred:
    - "Overhead (base = 0): water, packaging/sacks, out-transport, workshop rent, tool consumables. Each reduces FCFF one-for-one; base FCFF is an UPPER bound."
    - "Is the 125,000 cassava price delivered (transport included) or ex-farm? Base assumes delivered — no separate in-transport line."
    - "Equipment actually owned and its value/replacement cycle (base 1.5M gross, 5-yr SL, capex = D&A)."
    - "Tax registration/regime actually used (base: microenterprise 6% of turnover; many such units are informal/untaxed)."
    - "Credit and inventory terms (base: cassava-in 3d, FG 2d, AR 7d, AP 5d on a 360-day year)."
    - "Wood supply terms — assumed cash (no payable)."

  frictions:
    - "Presumptive tax is turnover-based, so it is NOT t×EBIT and D&A carries no tax shield; NOPAT defined as EBIT − actual cash tax to keep the FCFF identity intact (effective 31.3% of EBIT)."
    - "Natural unit is the demi-bâchée (1 delivered tonne). Finished-goods inventory is valued at production cost (cassava + wood) — attiéké is not sold from stock at price, so no unrealised margin sits in inventory."

  simplifications:
    - "No growth or inflation stated → flat nominal steady state; FCFF is an annuity. Under inflation the real value erodes; a competent extension would index price and input costs."
    - "Equipment treated as a pre-existing sunk asset (going concern) with sustaining capex = D&A, so D&A and capex net to zero in FCFF for t≥1; only the working-capital investment differentiates period 0."
    - "One-off cash to establish this workshop from zero (NOT part of FCFF generated) ≈ 1,500,000 equipment + 697,222 working capital = 2,197,222 XOF."

  sensitivities:   # qualitative only — per contract v2.3, quantified what-ifs must be checked scenarios, not prose
    - "Tax regime is the largest single lever: a profit-based corporate IS, the 6% micro band (from 50M turnover), CGA membership (halves TEE), or outright informality each move FCFF materially. Direction only; quantify by re-running the regime as a checked scenario."
    - "Unstated overhead (water, sacks, transport, rent) reduces steady FCFF one-for-one — the base (opex_other = 0) is an UPPER bound."
    - "Sale price and cassava price are the dominant operating levers; both scale directly with the 200-batch volume."
    - "Costing the ten women at a market wage would turn operating cash negative — see central_judgment_labour."

  valuation_note: >
    Task scope is FCFF only — no discount rate applied. If capitalised, a flat ~4.6M/yr
    perpetuity would need a country/informal-sector risk-adjusted WACC (materially high
    for an unlevered Ivorian microenterprise), which was neither stated nor requested.

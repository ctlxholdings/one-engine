contract: "v2.6"
id: momo_agent_adjame_abidjan
title: "Mobile-money agency kiosk with an airtime counter, grand marche d'Adjame, Abidjan - unlevered asset-side FCFF over 36 monthly periods"
currency: XOF

grid:
  periods: 36
  freq: monthly
  why: >-
    MONTHLY, because every fixed cost the founder names is a monthly object (rent 90,000/month,
    assistant 80,000/month) and the airtime leg is quoted to me as a monthly outturn
    (1,200,000/month); the transfer leg is quoted as a daily rate on a normal day, so the month is
    the shortest period over which the two legs can be put on the same footing. An annual grid would
    also smear the only lumpy thing in the business - the replacement of a 138,000 phone set and a
    162,000 generator - into an average that hides when the cash actually leaves. A daily grid would
    be false precision - he cannot tell me a per-day rent and I cannot tell him a per-day tax.

    36 PERIODS (3 years) for three reasons, in descending force. (1) The commission rate is the
    single largest driver of this business and it is not his to set - it is a schedule the operator
    revises unilaterally, and sector reporting for Cote d'Ivoire records operators re-cutting agent
    commissions around the cocoa campaign. Three years is already past the edge of what anyone can
    assert about a 0.8% that another party writes. (2) Three years is exactly one full replacement
    cycle of the longest-lived asset in the business - the handsets at 24 months, the generator at
    27 months of running - so the horizon closes on a complete asset cycle instead of cutting one in
    half, and the model is forced to pay for its own renewal rather than assume it away.
    (3) The emplacement is the business ("c'est l'emplacement qui fait tout") and it is held on no
    stated lease; Adjame market tenure is precarious. A horizon that outran the visible tenure would
    be modelling a location, not a business.

    t=0 IS INCEPTION, not today. This is a deliberate choice and it changes the answer: the entire
    asset base of this business is working capital - 1,600,000 of dual float, 1,000,000 of operator
    deposits, an airtime stock - against 300,000 of equipment. An asset-side FCFF that started after
    the float was already sunk would report a capital-free money machine and would be worthless.
    Starting at inception is the only way the capital that actually runs this business appears as
    capital. Consequence: there is NO terminal value and NO recovery of the two 500,000 operator
    deposits at t=35, because the founder is assumed to still be trading; the deposits come back
    only on cessation, and cessation is not modelled.

utterance:
  fr: >-
    Je tiens un kiosque de transfert d'argent au grand marche d'Adjame, a Abidjan. Je travaille avec
    deux operateurs, et j'ai aussi une petite boutique de credit telephonique a cote, mais
    l'essentiel c'est le transfert. Il faut comprendre comment ca marche. J'ai deux caisses en meme
    temps : mon argent liquide dans le tiroir, et mon solde electronique sur le telephone. Quand un
    client vient deposer de l'argent, il me donne du liquide et j'envoie de l'electronique - donc
    mon liquide monte et mon electronique baisse. Quand un client vient retirer, c'est l'inverse :
    je lui donne du liquide et je recois de l'electronique. Le probleme c'est qu'a Adjame les gens
    retirent beaucoup plus qu'ils ne deposent, parce que c'est un marche, les commercants viennent
    chercher leur argent. Donc mon liquide se vide et mon electronique se remplit. Deux ou trois
    fois par jour je dois aller au super-agent reequilibrer: je lui rends de l'electronique et il me
    redonne du liquide, et ca me coute quelque chose a chaque fois, plus le taxi et le risque de
    porter l'argent. Pour tenir la journee il me faut a peu pres huit cent mille en caisse le matin
    et autant en electronique. Sur une journee normale je fais dans les cent quatre-vingts
    operations, les trois quarts des retraits, et le montant moyen d'une operation c'est vingt-cinq
    mille. L'operateur me paie une commission sur chaque operation, ca tourne autour de zero virgule
    huit pour cent du montant, un peu plus sur les petits montants et un peu moins sur les gros. Le
    reequilibrage chez le super-agent me coute dans les deux mille par voyage, taxi compris, et je
    le fais deux fois et demie par jour en moyenne. La boutique de credit telephonique, j'achete le
    credit avec une remise de cinq pour cent et je le revends au prix affiche. J'en ecoule environ
    un million deux cent mille par mois. Le kiosque me coute quatre-vingt-dix mille de loyer par
    mois - c'est cher parce que c'est l'emplacement qui fait tout, il faut etre sur le passage. J'ai
    un aide a quatre-vingt mille par mois qui tient le kiosque quand je vais reequilibrer. Les deux
    telephones et le petit groupe pour le courant, disons trois cent mille au depart. Il faut aussi
    que je laisse un depot de garantie de cinq cent mille chez chaque operateur, que je recupere
    seulement si j'arrete. Il y a des jours ou je ferme a midi parce que je n'ai plus de liquide et
    que le super-agent est a sec lui aussi. Ces jours-la je perds la moitie de la journee.
  en: >-
    I run a money-transfer kiosk at the big Adjame market in Abidjan. I work with two operators, and
    I also have a small phone-credit shop next to it, but the main thing is the transfer business.
    You have to understand how it works. I have two tills at the same time: my cash in the drawer,
    and my electronic balance on the phone. When a customer comes to deposit money, they give me
    cash and I send electronic - so my cash goes up and my electronic goes down. When a customer
    comes to withdraw, it's the reverse: I give them cash and I receive electronic. The problem is
    that at Adjame people withdraw far more than they deposit, because it's a market, the traders
    come to collect their money. So my cash empties and my electronic fills up. Two or three times a
    day I have to go to the super-agent to rebalance: I give him electronic and he gives me back
    cash, and it costs me something every time, plus the taxi and the risk of carrying the money. To
    get through the day I need about eight hundred thousand in the till in the morning and as much
    again in electronic. On a normal day I do around a hundred and eighty transactions, three
    quarters of them withdrawals, and the average transaction amount is twenty-five thousand. The
    operator pays me a commission on each transaction, it works out around zero point eight percent
    of the amount, a bit more on small amounts and a bit less on large ones. Rebalancing at the
    super-agent costs me about two thousand a trip, taxi included, and I do it two and a half times
    a day on average. The phone-credit shop: I buy the credit at a five percent discount and resell
    it at the displayed price. I move about one million two hundred thousand a month of it. The
    kiosk costs me ninety thousand a month in rent - it's expensive because location is everything,
    you have to be on the footfall. I have an assistant at eighty thousand a month who holds the
    kiosk when I go to rebalance. The two phones and the small generator for power, say three
    hundred thousand at the start. I also have to leave a security deposit of five hundred thousand
    with each operator, which I only get back if I stop. There are days when I close at midday
    because I'm out of cash and the super-agent is dry too. On those days I lose half the day.

inputs:

  # ---- STATED: the founder's own numbers, taken as facts about his operation ----

  txn_per_normal_day:
    value: 180
    unit: transactions per full trading day
    prov: STATED
    source: "\"Sur une journee normale je fais dans les cent quatre-vingts operations\" - note the qualifier: this is the NORMAL-day rate, not an average across all days, so it must be scaled by effective (full-day-equivalent) days, not by calendar days."
    date: "2026-07-27"

  withdrawal_share:
    value: 0.75
    unit: fraction of transaction count and of transaction value
    prov: STATED
    source: "\"les trois quarts des retraits\". Applied to value as well as to count, which is only valid if withdrawals and deposits have the same average ticket - see notes, friction_ticket_mix."
    date: "2026-07-27"

  avg_ticket:
    value: 25000
    unit: XOF per transaction
    prov: STATED
    source: "\"le montant moyen d'une operation c'est vingt-cinq mille\". An arithmetic mean over a distribution, used against a band-structured commission tariff - see notes, friction_ticket_mix."
    date: "2026-07-27"

  commission_rate:
    value: 0.008
    unit: fraction of transaction value, blended across deposits and withdrawals
    prov: STATED
    source: "\"une commission sur chaque operation, ca tourne autour de zero virgule huit pour cent du montant, un peu plus sur les petits montants et un peu moins sur les gros\". WHAT THE RATIO IS NET OF: it is already net of the operator's tariff-band structure AT HIS OBSERVED TICKET DISTRIBUTION, and net of any difference between the cash-in and cash-out legs, which in most mobile-money markets pay the agent differently. It is therefore not a rate that survives a change in his mix."
    date: "2026-07-27"

  rebalance_cost_per_trip:
    value: 2000
    unit: XOF per round trip to the super-agent
    prov: STATED
    source: "\"Le reequilibrage chez le super-agent me coute dans les deux mille par voyage, taxi compris\". WHAT IT IS NET OF: taxi is inside it; the super-agent's own fee is inside it; the third cost he names in the same breath - \"le risque de porter l'argent\" - is explicitly OUTSIDE it and is carried separately as shrinkage."
    date: "2026-07-27"

  trips_per_day:
    value: 2.5
    unit: round trips to the super-agent per full trading day
    prov: STATED
    source: "\"je le fais deux fois et demie par jour en moyenne\", corroborated by \"Deux ou trois fois par jour\"."
    date: "2026-07-27"

  opening_till_cash:
    value: 800000
    unit: XOF held as physical cash at the start of a trading day
    prov: STATED
    source: "\"il me faut a peu pres huit cent mille en caisse le matin\"."
    date: "2026-07-27"

  opening_efloat:
    value: 800000
    unit: XOF held as electronic value at the start of a trading day
    prov: STATED
    source: "\"et autant en electronique\" - i.e. the same 800,000 again."
    date: "2026-07-27"

  airtime_sales_monthly:
    value: 1200000
    unit: XOF of airtime face value sold per month
    prov: STATED
    source: "\"J'en ecoule environ un million deux cent mille par mois\". Read as face value SOLD, not as cash spent buying; the alternative reading moves the margin by one twentieth of itself and is dominated by every other question here. Note this is an OBSERVED MONTHLY OUTTURN, so unlike the transfer leg it already contains his midday closures and must NOT be scaled by effective days a second time."
    date: "2026-07-27"

  airtime_discount:
    value: 0.05
    unit: fraction off face value at which airtime is purchased
    prov: STATED
    source: "\"j'achete le credit avec une remise de cinq pour cent et je le revends au prix affiche\"."
    date: "2026-07-27"

  rent_monthly:
    value: 90000
    unit: XOF per month
    prov: STATED
    source: "\"Le kiosque me coute quatre-vingt-dix mille de loyer par mois\"."
    date: "2026-07-27"

  assistant_wage_monthly:
    value: 80000
    unit: XOF gross per month, one employee
    prov: STATED
    source: "\"J'ai un aide a quatre-vingt mille par mois\"."
    date: "2026-07-27"

  initial_kit_capex:
    value: 300000
    unit: XOF, two handsets plus one small generator
    prov: STATED
    source: "\"Les deux telephones et le petit groupe pour le courant, disons trois cent mille au depart\". The word \"disons\" marks it as his own rounding."
    date: "2026-07-27"

  deposit_per_operator:
    value: 500000
    unit: XOF security deposit lodged with each operator
    prov: STATED
    source: "\"un depot de garantie de cinq cent mille chez chaque operateur, que je recupere seulement si j'arrete\"."
    date: "2026-07-27"

  operator_count:
    value: 2
    unit: operators
    prov: STATED
    source: "\"Je travaille avec deux operateurs\"."
    date: "2026-07-27"

  phone_count:
    value: 2
    unit: handsets in service
    prov: STATED
    source: "\"Les deux telephones\" - one per operator, consistent with two operator agreements."
    date: "2026-07-27"

  short_day_fraction_lost:
    value: 0.5
    unit: fraction of a trading day lost on a midday-closure day
    prov: STATED
    source: "\"Ces jours-la je perds la moitie de la journee\"."
    date: "2026-07-27"

  # ---- INFERRED: entailed by his words, no new information ----

  deposit_share:
    value: 0.25
    unit: fraction of transaction count and of transaction value
    prov: INFERRED
    source: "1 - withdrawal_share. He describes exactly two transaction types (\"deposer\" and \"retirer\") and puts three quarters in one of them; there is no third bucket in his account, so the complement is the deposit share."
    date: "2026-07-27"

  staff_count:
    value: 2
    unit: persons on the site
    prov: INFERRED
    source: "Himself plus \"un aide ... qui tient le kiosque quand je vais reequilibrer\". Two persons, exactly."
    date: "2026-07-27"

  service_points:
    value: 1
    unit: simultaneous service positions at the counter
    prov: INFERRED
    source: "\"un kiosque\" (singular), and the assistant is described as SUBSTITUTING for him during his absences (\"qui tient le kiosque quand je vais reequilibrer\"), not as opening a second serving line. One counter is therefore the entailed capacity, and it is the tighter reading."
    date: "2026-07-27"

  formally_registered:
    value: 1
    unit: boolean flag, 1 = holds a commercial and tax registration
    prov: INFERRED
    source: "Two operators each hold a 500,000 security deposit from him under a named agency relationship that pays him commission. A mobile-money agency contract in the WAEMU is a KYC-bearing contract with a licensed e-money issuer; it is not available to an unregistered natural person. His own account of two such contracts therefore entails a formal registration, which is what makes a statutory regime applicable at all rather than a hypothetical."
    date: "2026-07-27"

  # ---- SOURCED: facts about the world, looked up ----

  tee_rate_services:
    value: 0.05
    unit: fraction of annual turnover TTC
    prov: SOURCED
    source: "The taxe d'Etat de l'entreprenant is levied at 5% for prestations de services and 4% for commerce/negoce, on turnover TTC, payable monthly at one twelfth of the annual charge. 5% applied to the whole base here because the founder himself designates the principal activity - \"l'essentiel c'est le transfert\", a service - and a single-activity assessment at the higher of the two rates is the tighter reading. fact_id CI-TAX-06 / CI-V25-08 / CI-V25-43."
    authority: "Cote d'Ivoire, Code general des impots, arts. 72 et suivants (regime de l'entreprenant), art. 77 (taux), introduced by the annexe fiscale a la loi de finances n. 2020-972 du 23 decembre 2020; DGI, formulaire DECLARATION DE LA TAXE D'ETAT DE L'ENTREPRENANT, https://dgi.gouv.ci/assets/documents/imprimes/DECLARATION_DE_LA_TAXE_DETAT_DENTREPRENANT.pdf ; restated at https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-la-taxe-detat-de-lentreprenant/"
    verified: "2026-07-27"

  tee_band_low:
    value: 5000001
    unit: XOF of annual turnover TTC, lower bound of the entreprenant band
    prov: SOURCED
    source: "Below this the taxpayer falls to the taxe communale de l'entreprenant instead of the taxe d'Etat. fact_id CI-TAX-05 / CI-V25-05."
    authority: "Cote d'Ivoire CGI art. 73, annexe fiscale 2021 (loi n. 2020-972 du 23 decembre 2020, art. 33); https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-la-taxe-detat-de-lentreprenant/"
    verified: "2026-07-27"

  tee_band_high:
    value: 50000000
    unit: XOF of annual turnover TTC, upper bound of the entreprenant band
    prov: SOURCED
    source: "Above this the taxpayer moves to the regime des microentreprises and the substitution for the profits tax, the patente and the TVA ends. fact_id CI-TAX-05 / CI-V25-06 / CI-V25-42."
    authority: "Cote d'Ivoire CGI art. 73; DGI, Regimes d'imposition; https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-la-taxe-detat-de-lentreprenant/"
    verified: "2026-07-27"

  tee_substitutes_for_profits_tax:
    value: 1
    unit: boolean flag, 1 = the TEE stands in place of the BIC, the patente and the TVA
    prov: SOURCED
    source: "\"Cette taxe se substitue a la patente, a l'impot sur les benefices et a la TVA\". This is why no BIC line, no patente line and no VAT line appears anywhere in this model, and why the IMF cannot apply - the IMF is expressly a RNI/RSI instrument. fact_id CI-TAX-06 / CI-V25-41."
    authority: "Cote d'Ivoire CGI arts. 72 et suivants; https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-la-taxe-detat-de-lentreprenant/"
    verified: "2026-07-27"

  bic_rate_not_applied:
    value: 0.25
    unit: fraction of taxable profit, recorded for the record and NOT applied
    prov: SOURCED
    source: "The general BIC/IS rate, 25% for personnes physiques and morales alike. Recorded so that a reader can see what the TEE substitutes FOR, and see that it is a substitution and not a credit. Not used in any trace row. fact_id CI-TAX-01 / CI-V25-45."
    authority: "Cote d'Ivoire CGI art. 64; DGI, Le systeme fiscal ivoirien; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income, https://taxsummaries.pwc.com/ivory-coast/corporate/taxes-on-corporate-income"
    verified: "2026-07-27"

  imf_floor_not_applied:
    value: 3000000
    unit: XOF per year, recorded for the record and NOT applied
    prov: SOURCED
    source: "The impot minimum forfaitaire floor. It bites only under RNI and RSI, so it does not reach an entreprenant. Recorded because it is the cliff on the far side of tee_band_high and it is far larger than this business's whole tax bill. Not used in any trace row. fact_id CI-TAX-02 / CI-TAX-03 / CI-V25-18."
    authority: "DGI; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income (minimum tax 0.5% of turnover, floor XOF 3,000,000, ceiling XOF 35,000,000), https://taxsummaries.pwc.com/ivory-coast/corporate/taxes-on-corporate-income"
    verified: "2026-07-27"

  smig_monthly:
    value: 75000
    unit: XOF per month
    prov: SOURCED
    source: "The statutory minimum wage, used to test the 80,000 he pays his assistant. fact_id CI-TAX-09 / CI-V25-09."
    authority: "Cote d'Ivoire, decret n. 2022-986 du 21 decembre 2022, SMIG raised from 60,000 to 75,000 FCFA with effect 1 January 2023, still in force in 2026."
    verified: "2026-07-27"

  cnps_pension_rate_employer:
    value: 0.077
    unit: fraction of gross monthly salary, employer share, ceiling 3,375,000/month
    prov: SOURCED
    source: "Uncapped at this wage level - 80,000 is far below the 3,375,000 pension ceiling, so the full 7.70% applies to the whole 80,000. fact_id CI-V25-10 / CI-V25-32."
    authority: "CLEISS, Les cotisations en Cote d'Ivoire, rates in force 1 January 2025, https://www.cleiss.fr/docs/cotisations/cotedivoire.html"
    verified: "2026-07-27"

  cnps_family_rate_employer:
    value: 0.05
    unit: fraction of the capped monthly base, employer only
    prov: SOURCED
    source: "Prestations familiales. fact_id CI-V25-11."
    authority: "CLEISS, Les cotisations en Cote d'Ivoire, https://www.cleiss.fr/docs/cotisations/cotedivoire.html"
    verified: "2026-07-27"

  cnps_maternity_rate_employer:
    value: 0.0075
    unit: fraction of the capped monthly base, employer only
    prov: SOURCED
    source: "Maternite. fact_id CI-V25-12."
    authority: "CLEISS, Les cotisations en Cote d'Ivoire, https://www.cleiss.fr/docs/cotisations/cotedivoire.html"
    verified: "2026-07-27"

  cnps_at_rate_employer:
    value: 0.02
    unit: fraction of the capped monthly base, employer only
    prov: SOURCED
    source: "Accidents du travail et maladies professionnelles, banded 2% to 5% by sector risk class. The bottom of the band is taken: a commercial kiosk with no machinery, no vehicle of its own and no lifting is the lowest-risk class available. fact_id CI-V25-13 / CI-V25-33."
    authority: "CLEISS, Les cotisations en Cote d'Ivoire, https://www.cleiss.fr/docs/cotisations/cotedivoire.html"
    verified: "2026-07-27"

  cnps_ceiling_monthly:
    value: 70000
    unit: XOF per worker per month, ceiling for prestations familiales, maternite and AT/MP
    prov: SOURCED
    source: "BINDS HERE: the assistant's 80,000 is above the 70,000 ceiling, so the family, maternity and AT/MP legs are computed on 70,000 and not on 80,000. This is why the all-in employer load lands at 18.88% of the wage rather than at the 20.4% a naive uncapped calculation would give. fact_id CI-V25-14 / CI-V25-31."
    authority: "CLEISS, Les cotisations en Cote d'Ivoire, https://www.cleiss.fr/docs/cotisations/cotedivoire.html"
    verified: "2026-07-27"

  employer_payroll_tax_rate:
    value: 0.044
    unit: fraction of gross payroll, employer share
    prov: SOURCED
    source: "Composite of the 2.8% contribution a la charge de l'employeur on local employees and the 1.6% FDFP levies (taxe d'apprentissage 0.4% plus formation professionnelle continue 1.2%). RECONCILIATION OF AN ANNEX ROW THAT LOOKS INCONSISTENT: annex row CI-V25-35 carries the value 0.044 while quoting an authority that says 2.8%. It is not stale - 2.8 + 1.6 = 4.4 - but the row as written does not show its second component. Recorded here with both components named so the arithmetic is checkable. fact_id CI-V25-35 + CI-TAX-08."
    authority: "PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Other taxes (payroll taxes 2.8% of total taxable remuneration for local employees), https://taxsummaries.pwc.com/ivory-coast/corporate/other-taxes ; FDFP, taxe d'apprentissage 0.4% and formation continue 1.2%."
    verified: "2026-07-27"

  fuel_price_xof_per_l:
    value: 875
    unit: XOF per litre of super sans plomb at the pump
    prov: SOURCED
    source: "The administered pump price. Set at 875 on 1 May 2026 (up 55 from 820) and held unchanged for June 2026. It is administered monthly, so it is a fact with a date rather than a trend."
    authority: "Ministere des Mines, du Petrole et de l'Energie, Cote d'Ivoire, monthly structure des prix. Reported: Financial Afrik, 'Carburants en Cote d'Ivoire: le litre de Super bondit a 875 FCFA', 4 May 2026, https://www.financialafrik.com/2026/05/04/carburants-en-cote-divoire-le-litre-de-super-bondit-a-875-fcfa/ ; APAnews, 'RCI: les prix du carburant restent inchanges en juin', https://fr.apanews.net/cote-divoire/rci-les-prix-du-carburant-restent-inchanges-en-juin/"
    verified: "2026-07-27"

  genset_life_hours_band_low:
    value: 1000
    unit: running hours
    prov: SOURCED
    source: "Bottom of the published service-life band for small AIR-COOLED portable gensets, which is the class the founder's \"petit groupe\" belongs to. The band runs roughly 1,000 to 4,000 hours for small units. Used to bound the assumed point value below, and to make the point that a cheap air-cooled unit at this duty is a consumable, not an asset."
    authority: "SlashGear, 'What's The Average Lifespan Of A Generator Engine?', https://www.slashgear.com/2172062/average-lifespan-of-generator-engine/ ; True Gear, 'How Many Hours Do Small Generators Last?', https://truegear.com.au/blogs/generators/how-many-hours-do-small-generators-last"
    verified: "2026-07-27"

  genset_life_hours_band_high:
    value: 4000
    unit: running hours
    prov: SOURCED
    source: "Top of the same published band, for a well-maintained small unit."
    authority: "SlashGear, https://www.slashgear.com/2172062/average-lifespan-of-generator-engine/ ; True Gear, https://truegear.com.au/blogs/generators/how-many-hours-do-small-generators-last"
    verified: "2026-07-27"

  merchant_commission_band_low:
    value: 0.005
    unit: fraction of transaction value
    prov: SOURCED
    source: "Independent corroboration that the founder's 0.8% sits inside the observed commission band for mobile money in Cote d'Ivoire (roughly 0.5% to 1.5%). Not used in any trace row - it is a plausibility check on a STATED figure, not a substitute for it."
    authority: "MFW4A (Making Finance Work for Africa), 'Price wars and agent motivation in rural areas of Cote d'Ivoire', https://www.mfw4a.org/blog/price-wars-and-agent-motivation-rural-areas-cote-divoire"
    verified: "2026-07-27"

  merchant_commission_band_high:
    value: 0.015
    unit: fraction of transaction value
    prov: SOURCED
    source: "Upper end of the same observed band. Same non-use as above."
    authority: "MFW4A, https://www.mfw4a.org/blog/price-wars-and-agent-motivation-rural-areas-cote-divoire"
    verified: "2026-07-27"

  vat_standard_rate_not_applied:
    value: 0.18
    unit: fraction
    prov: SOURCED
    source: "The standard VAT rate, recorded and NOT applied. Under the TEE he neither charges VAT nor recovers input VAT, so the airtime he buys carries irrecoverable VAT inside its price and every figure in this model is VAT-inclusive as he experiences it - which is exactly the base the TEE taxes. fact_id CI-TAX-10 / CI-V25-39."
    authority: "Cote d'Ivoire CGI; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Other taxes, https://taxsummaries.pwc.com/ivory-coast/corporate/other-taxes"
    verified: "2026-07-27"

  # ---- ELICITED: he holds these answers; I do not. Working value stated, question kept attached. ----

  days_open_per_month:
    value: 26
    unit: trading days per month on which the kiosk opens at all
    prov: ELICITED
    question: "How many days a week do you open the kiosk, and in a normal month how many days do you not open at all - Sundays, funerals, illness, holidays, everything?"
    range: {low: 22, high: 30}
    materiality: high
    source: "Working value 26 = a six-day week (52 x 6 / 12). He never states a rest day; a market kiosk plausibly runs seven days, and equally plausibly loses days to family obligations. 26 is the middle reading and it is the LOWER of the two readings his silence permits, so it is the one that does not flatter the answer. This scalar multiplies the whole transfer leg."
    date: "2026-07-27"

  short_days_per_month:
    value: 3
    unit: days per month closed at midday for want of cash
    prov: ELICITED
    question: "In a normal month, how many days do you have to shut at midday because you have run out of cash and the super-agent is dry too?"
    range: {low: 1, high: 8}
    materiality: high
    source: "He names the failure mode but not its frequency - \"Il y a des jours ou je ferme a midi\". Working value 3/month: 'il y a des jours' marks it as recurrent but not the norm, which puts it above 1 and well below the 8+ that would make it the norm. This is the single most answerable question in the list and it scales every transfer-leg number below."
    date: "2026-07-27"

  seasonal_index:
    value: 1.0
    unit: multiplier on the normal-day transaction rate, per month
    prov: ELICITED
    question: "Which months of the year do you do noticeably more than a hundred and eighty transactions a day, and which months noticeably fewer?"
    range: {low: "flat all year", high: "strongly peaked - December and the school rentree well above, the lean season well below"}
    materiality: medium
    source: "Working value flat (1.00 in every month) because he describes his operation with no seasonal language at all. This is an OMISSION, not a finding: a market agency serving traders in Abidjan would ordinarily peak with the December remittance season and the September rentree. Running flat is the choice that invents nothing; it is not the choice that is likely to be right."
    date: "2026-07-27"

  commission_net_factor:
    value: 1.0
    unit: fraction of the headline 0.8% that actually reaches him
    prov: ELICITED
    question: "Does the whole zero point eight percent land in your electronic balance, or does the operator take something off it before crediting you?"
    range: {low: 0.90, high: 1.00}
    materiality: medium
    source: "Working value 1.00 - he says the operator PAYS him the 0.8%, which reads as a net receipt, and taking anything off it would be putting a deduction into his mouth. Kept as a question because operators in the region do apply withholdings to agent commission and he would know from his statement."
    date: "2026-07-27"

  commission_receivable_months:
    value: 1
    unit: months of transfer commission outstanding at any time
    prov: ELICITED
    question: "When does the operator's commission actually reach you - is it credited to your electronic balance with each transaction as you do it, or paid over at the end of the month?"
    range: {low: 0, high: 1}
    materiality: medium
    source: "Working value 1 month (monthly in arrears), which is the choice that puts MORE capital into the business and so does not flatter the answer. If it is credited in real time it is already inside the 800,000 electronic float and this receivable disappears. One-off effect at t=0; it moves the shape of the FCFF profile, not its run rate."
    date: "2026-07-27"

  airtime_stock_days:
    value: 5
    unit: days of airtime cost of sales held as stock
    prov: ELICITED
    question: "How much phone credit do you keep loaded in your dealer account at any one time - how many days of selling does it cover?"
    range: {low: 1, high: 15}
    materiality: low
    source: "Working value 5 days: he restocks from a distributor in a market where distributors are close at hand, which argues for a short cover, but he pays cash for stock and so has a reason not to hold much. Small relative to the float and the deposits."
    date: "2026-07-27"

  shrinkage_rate:
    value: 0.0001
    unit: fraction of total value handled, lost per period
    prov: ELICITED
    question: "Over the last twelve months, how much money did you lose altogether - till coming up short at close, notes that turned out to be false, sends that went to the wrong number, anything taken off you on the way to or from the super-agent - and how many separate times did it happen?"
    range: {low: 0.00, high: 0.001}
    materiality: medium
    source: "He names this cost himself and leaves it unpriced - \"le risque de porter l'argent\", explicitly OUTSIDE the 2,000 a trip. Working value 0.01% of value handled, which on this operation is roughly one lost carry every four and a half years plus small till differences. That is the low end of plausible for a man moving 900,000 in cash through Adjame twice a day and it is deliberately so: I would rather be told I am too low than invent a robbery he has not had. APPLIED TO THE FLOW, NOT THE STOCK: the loss channel here is money passing through his hands, not money sitting still - the till turns over about 2.8 times a day, so a rate on the 800,000 balance would understate it by nearly an order of magnitude."
    date: "2026-07-27"

  genset_hours_per_day:
    value: 3
    unit: running hours per full trading day
    prov: ELICITED
    question: "Is the kiosk wired to CIE mains, or does the generator supply everything - and on a normal day, how many hours does it actually run?"
    range: {low: 1, high: 11}
    materiality: high
    source: "Working value 3 h/day, the delestage-backup reading. THE INFERENCE FOR CHOOSING IT: he lists rent, the assistant and the rebalancing trips as his costs and never mentions fuel. If the generator were the sole power source of an eleven-hour operation, fuel would be his third-largest cost line and he would have said so. Its absence from his cost list is evidence about its run time. This one answer drives BOTH an operating cost he has not counted AND the replacement cadence of the machine."
    date: "2026-07-27"

  minutes_per_rebalance_trip:
    value: 50
    unit: minutes, door to door including the queue at the super-agent
    prov: ELICITED
    question: "From the moment you leave the kiosk to the moment you are back behind the counter, how long does one trip to the super-agent take you?"
    range: {low: 25, high: 120}
    materiality: low
    source: "Working value 50 minutes for a short intra-Adjame taxi hop plus a queue. Enters only the capacity test, not the cost - the cost of the trip is his stated 2,000."
    date: "2026-07-27"

  trading_hours_per_day:
    value: 11
    unit: hours from opening to closing on a full day
    prov: ELICITED
    question: "What time do you open the kiosk in the morning and what time do you shut it on a normal day?"
    range: {low: 8, high: 14}
    materiality: medium
    source: "Working value 11 hours, i.e. roughly 07h00 to 18h00, a market-hours day. Sets the denominator of the capacity tests and of the finding about how long the opening till actually lasts."
    date: "2026-07-27"

  phone_set_cost:
    value: 138000
    unit: XOF for the pair of handsets
    prov: ELICITED
    question: "Of the three hundred thousand you spent at the start, how much was the two phones and how much was the generator?"
    range: {low: 100000, high: 200000}
    materiality: low
    source: "Working split 138,000 phones (69,000 each) and 162,000 generator, summing exactly to his stated 300,000. Both halves sit inside their Abidjan retail ranges - a basic smartphone at 60,000 to 80,000, a small genset at 150,000 to 200,000. Chosen at values that make the depreciation cadence land on whole months, so the arithmetic is exact rather than repeating."
    date: "2026-07-27"

  genset_cost:
    value: 162000
    unit: XOF for the small generator
    prov: ELICITED
    question: "Of the three hundred thousand you spent at the start, how much was the generator on its own?"
    range: {low: 100000, high: 200000}
    materiality: low
    source: "Complement of phone_set_cost within his stated 300,000. See phone_set_cost."
    date: "2026-07-27"

  phone_life_months:
    value: 24
    unit: months before a handset pair is replaced
    prov: ELICITED
    question: "How often do you have to replace one of the two phones, and why - does it break, get stolen, or just stop working?"
    range: {low: 12, high: 48}
    materiality: low
    source: "Working value 24 months. He treats the 300,000 as a one-off (\"au depart\"), which is the thing being tested here: at 4,410 transactions a month across two handsets, each handset carries 52,920 transactions before it is retired, and 24 months is already the optimistic end of that duty cycle. His silence about replacement is exactly why this is asked."
    date: "2026-07-27"

  assistant_cnps_declared_flag:
    value: 1
    unit: boolean, 1 = declared to CNPS with employer contributions paid
    prov: ELICITED
    question: "Is your assistant declared to the CNPS, and do you pay contributions on top of the eighty thousand, or is the eighty thousand the whole of what he costs you?"
    range: {low: 0, high: 1}
    materiality: medium
    source: "Working value 1 (declared, contributions charged). Chosen for CONSISTENCY, not for realism: I have already placed him inside a statutory tax regime on the strength of his two operator agency contracts, and it is not coherent to have a man formal enough to pay the taxe d'Etat and informal enough to owe nothing to the CNPS. It is also the higher-cost of the two readings. If the answer is 0 his current cash cost is lower and he instead carries an arrears exposure this model does not size."
    date: "2026-07-27"

  rent_escalation_monthly:
    value: 0.0
    unit: fraction, month-on-month increase in the kiosk rent
    prov: ELICITED
    question: "Is the ninety thousand fixed for the next three years, or does the landlord put it up - and when did he last raise it?"
    range: {low: 0.0, high: 0.005}
    materiality: medium
    source: "Working value zero, consistent with the constant-XOF convention used throughout. He calls the location the whole business (\"c'est l'emplacement qui fait tout\"), which is precisely the situation in which a landlord has pricing power over him, so a flat rent over three years is a choice and not a fact."
    date: "2026-07-27"

  rebalance_fee_is_flat:
    value: 1
    unit: boolean, 1 = the super-agent charges per trip, 0 = a percentage of the amount rebalanced
    prov: ELICITED
    question: "Does the super-agent charge you the same thing whatever you take out, or does he take a percentage of the amount?"
    range: {low: 0, high: 1}
    materiality: medium
    source: "Working value 1 (flat per trip), which is how he states it - \"dans les deux mille par voyage\". STRUCTURAL, NOT A VALUE: a percentage basis would make the largest controllable cost in the business scale with volume rather than with trip count, which changes the operating leverage of the whole model rather than any single number in it. Flagged here rather than wired into a check for that reason."
    date: "2026-07-27"

  # ---- ASSUMED: priors nobody in this business could have supplied ----

  genset_burn_l_per_h:
    value: 0.5
    unit: litres of petrol per running hour
    prov: ASSUMED
    source: "Bounded by, but not readable off, the sourced benchmark that portable petrol generators consume on the order of 0.4 L per kWh and that a 1 kVA unit burns around 0.3 L/h at full load. The founder cannot state this and the published figures are load-referenced, whereas a small carburetted genset held at a fixed 3,000 rpm burns close to a constant rate regardless of how little it is asked to carry - two phones on charge and a lamp is a tiny load on even the smallest unit. 0.5 L/h is set at the near-constant no-load-to-light-load rate rather than at the load-scaled figure, which is the higher and therefore the non-flattering choice. FLAGGED."
    date: "2026-07-27"

  genset_life_hours:
    value: 1984.5
    unit: running hours before the unit is replaced
    prov: ASSUMED
    source: "A point value inside the SOURCED 1,000 to 4,000 hour band for small air-cooled portable gensets (see genset_life_hours_band_low/high). Set at 1,984.5 h, which is the value that makes the replacement land on a whole 27-month boundary at the modelled 73.5 running hours a month, so the depreciation arithmetic is exact rather than repeating. Sits just under the round 2,000 h that is the conventional mid-band figure for this class. FLAGGED: nobody in this business holds this number, and the band it comes from is four-fold wide."
    date: "2026-07-27"

  genset_life_months:
    value: 27
    unit: months
    prov: INFERRED
    source: "genset_life_hours / (genset_hours_per_day x effective_days_per_month) = 1984.5 / 73.5 = 27 exactly. Carried as its own input only so that the depreciation driver-bridge check has a clean scalar to point at."
    date: "2026-07-27"

  phone_life_txns:
    value: 52920
    unit: transactions carried by one handset before replacement
    prov: INFERRED
    source: "txn_count per month / phone_count x phone_life_months = 4410 / 2 x 24 = 52,920. Not an independent assumption - it is the cumulative consequence of phone_life_months, materialised so that rule (d) can be asserted rather than described."
    date: "2026-07-27"

  genset_maint_pct_of_fuel:
    value: 0.20
    unit: fraction of the fuel bill, covering lubricants, filters and servicing
    prov: ASSUMED
    source: "A standard small-genset operating convention: consumables and servicing on a small carburetted unit run in the region of a fifth of the fuel bill, driven by the roughly 50-hour oil-change interval these engines require. Neither the founder nor any published source I could reach states it for this class. FLAGGED. Small in absolute terms; carried so that the generator is not shown running for three years on fuel alone."
    date: "2026-07-27"

  minutes_per_txn:
    value: 2
    unit: minutes of counter time per transaction, end to end
    prov: ASSUMED
    source: "Covers greeting, taking the number, entering the amount, the PIN, the confirmation, counting the notes and the ledger entry. I searched for a published agent-level service-time benchmark and found none - the GSMA agent literature reports customer WAITING times, not per-transaction handling times, which is a different quantity. FLAGGED. Enters only the capacity test."
    date: "2026-07-27"

  owner_wage_monthly:
    value: 0
    unit: XOF per month charged for the founder's own labour
    prov: DEFAULTED
    source: "Rule named: a sole trader (personne physique, entreprenant) has no separate legal personality and cannot be his own employee; his drawings are an appropriation of profit, not an expense, and they are not deductible. FCFF is therefore struck BEFORE any return to his own labour, and that residual is what he lives on. Carried as an explicit zero row rather than as silence - see notes, finding_owner_labour."
    date: "2026-07-27"

  airtime_stock_loss_rate:
    value: 0.0
    unit: fraction of opening airtime stock lost per period
    prov: DEFAULTED
    source: "Rule named: a stock declares its loss even when the loss is zero. It is zero here, and here is why - the airtime stock is an electronic balance in a dealer account, so it has no physical deterioration channel (no moisture, no vermin, no breakage), no expiry for the dealer as distinct from the end subscriber, and no pilferage channel that is not already inside shrinkage_rate. The one real channel, a top-up sent to a mistyped number, is carried inside shrinkage_rate and not double-counted here."
    date: "2026-07-27"

  payables_days:
    value: 0
    unit: days of purchases outstanding to suppliers
    prov: DEFAULTED
    source: "Rule named: assert the absence rather than pass over it. Airtime is bought for cash against a prepaid dealer balance; the super-agent is settled at the moment of the swap; rent and wages are current. There is no trade creditor in his account of the business and none is inferable, so payables are set to zero explicitly. NOTE THE ONE THING HIS SILENCE MAY HIDE: a market kiosk is normally let against an avance of several months' rent, which he does not mention and which is not modelled - see notes, omission_rent_advance."
    date: "2026-07-27"

  inflation_convention:
    value: 0.0
    unit: fraction per period applied to prices and costs
    prov: DEFAULTED
    source: "Rule named: constant-currency (real, base-date) presentation. Every figure is in XOF of July 2026 and no price or cost is escalated. Consequence a reader must carry: this FCFF stream is a REAL stream and must be discounted at a real rate, not a nominal one."
    date: "2026-07-27"

passage: |
  ==================================================================================================
  0. WHAT KIND OF BUSINESS THIS IS, AND WHAT THE REVENUE OBJECT ACTUALLY IS
  ==================================================================================================

  Before a single number: this business has two legs that are accounted for differently, and getting
  that wrong is a bigger error than anything downstream.

  THE TRANSFER LEG. He never owns the money that passes across his counter. A customer's 25,000 is
  the customer's, then the operator's e-money system's; he is a mandataire holding it for an instant.
  He does not control the transfer service before it reaches the customer - the licensed operator
  provides it - so under IFRS 15's control test he is an AGENT, and his revenue is the commission,
  not the flow. The distinction is not cosmetic. Over the 36 periods modelled here the flow across
  his counter totals 3,969,000,000 XOF. His revenue from it totals 31,752,000. If anyone ever put the
  flow on his turnover line - and the tax regime is decided by turnover - he would be pushed clean
  through three statutory bands. So: transfer revenue = commission only.

  THE AIRTIME LEG. Different animal. He BUYS the credit ("j'achete le credit avec une remise de cinq
  pour cent"), pays for it, holds it in a dealer balance at his own risk, and resells it. He takes
  title and he bears inventory risk. He has no pricing discretion (he sells "au prix affiche"), which
  cuts the other way, but the primary IFRS 15 test is control of the specified good, and the
  specified good here is the airtime voucher he purchased, not the telecom service the operator will
  ultimately render. He controls that. Presentation is therefore GROSS: revenue 1,200,000/month, cost
  of sales 1,140,000/month. And for the tax base the point is not even arguable - an achat-revente is
  assessed on the selling price, full stop.

  So: revenue = transfer commission (net) + airtime sales (gross). Two different presentations in one
  P&L, each for a stated reason. That is the friction and I am not smoothing it.

  ==================================================================================================
  1. THE OPERATING GRID - HOW MANY DAYS ARE THERE, REALLY
  ==================================================================================================

  He gives me a NORMAL-DAY rate for the transfer leg (180 operations) and a MONTHLY OUTTURN for the
  airtime leg (1,200,000). These are not the same kind of number and they must not be scaled the same
  way. The 180 is a rate on a good day and needs converting into an expected month. The 1,200,000 is
  an observed month and already contains every midday closure he has had.

  Building the month for the transfer leg:
      days the kiosk opens at all              = 26        [ELICITED]
      of which shut at midday for want of cash =  3        [ELICITED]
      fraction of the day lost on those days   =  0.5      [STATED - "je perds la moitie de la journee"]
      full-day equivalents per month           = 26 - 0.5 x 3 = 24.50

  Every transfer-leg quantity below is per month and rides on that 24.50.

  ==================================================================================================
  2. VOLUME AND THE TWO-TILL MASS BALANCE  (physical closure, rules (a) and (b))
  ==================================================================================================

  2.1 Transactions and value

      transactions per month  = 180 x 24.50 x 1.00 (seasonal index) = 4,410
      value per month         = 4,410 x 25,000                      = 110,250,000
      withdrawals (75%)       = 0.75 x 110,250,000                  =  82,687,500
      deposits    (25%)       = 0.25 x 110,250,000                  =  27,562,500
      the split closes: 82,687,500 + 27,562,500 = 110,250,000. Two buckets, no third, sums to one.

  2.2 The transformation, and what it is net of

  The "transformation" in this business is not fruit into juice; it is CASH INTO ELECTRONIC AND BACK.
  It has to close on both sides of the counter, and it does:

      CASH TILL, one month
        opening balances carried into the day, 800,000 x 24.50 days ... (see 2.4, this is a stock)
        + cash received from depositors                              +  27,562,500
        - cash paid out to withdrawers                               -  82,687,500
        = net drain on the drawer                                    -  55,125,000
        + cash brought back from the super-agent                     +  55,125,000
        = net movement                                                          0
        so the drawer closes each day where it opened, at 800,000.

      ELECTRONIC TILL, one month - the exact mirror
        + e-value received from withdrawers                          +  82,687,500
        - e-value sent to depositors                                 -  27,562,500
        - e-value handed to the super-agent                          -  55,125,000
        = net movement                                                          0
        closes at 800,000.

  Nothing is lost in the transformation itself - money is conserved by construction, which is
  precisely why the loss channel has to be stated separately rather than assumed into the ratio (2.5).

  2.3 The rebalancing trip - a number he did not give me, entailed by three he did

  He tells me the drain (via volume and mix) and he tells me the trip count. The amount per trip is
  then forced:

      cash he must fetch per month  = 55,125,000
      trips per month               = 2.5 x 24.50 = 61.25
      cash carried per trip         = 55,125,000 / 61.25 = 900,000 XOF

  This is the first thing his own account did not tell him. He carries 900,000 XOF in a taxi through
  Adjame, 61 times a month - MORE, on each single trip, than the entire 800,000 he opens the drawer
  with. It also prices his rebalancing: 2,000 on a 900,000 carry is 0.222% of the value moved.

  2.4 What the opening till actually buys him  (rule (c) - the rate must fit the thing)

  He says "pour tenir la journee il me faut a peu pres huit cent mille en caisse le matin" - to get
  through the day I need about eight hundred thousand. Test it against the drain his own volumes
  imply:

      net drain on a full day       = 55,125,000 / 24.50 = 2,250,000 XOF
      drain per trading hour        = 2,250,000 / 11     =   204,545.45 XOF/h
      hours the opening till lasts  = 800,000 / 204,545.45 = 3.91 hours

  THE OPENING TILL COVERS 3.91 HOURS OF AN 11-HOUR DAY - 36% of it. The 800,000 is not a day's float;
  it is a morning's float. He cannot "tenir la journee" on it and never could. What gets him through
  the day is the super-agent, and this is exactly why "il y a des jours ou je ferme a midi parce que
  je n'ai plus de liquide et que le super-agent est a sec lui aussi" is not bad luck but the
  structural design of the operation: his entire trading day past mid-morning is a dependency on a
  third party's liquidity. This is a finding about the business, reported as one, and asserted in
  checks (till_hours_of_cover) rather than left in prose where nothing can test it.

  2.5 Every stock declares its loss

      CASH IN THE DRAWER (800,000). Leaks: shortfalls at close, counterfeit notes, and the road. He
      names the road himself - "le risque de porter l'argent" - and puts it explicitly OUTSIDE the
      2,000 a trip. THE RATE ACTS ON THE FLOW, NOT THE BALANCE: the drawer turns over about 2.8 times
      a day, and it is money passing through his hands that goes missing, not money sitting still. So
      the charge is 0.0001 x (110,250,000 transacted + 55,125,000 rebalanced) = 0.0001 x 165,375,000
      = 16,537.50 per month. [ELICITED - he knows what he lost last year; I do not.]

      ELECTRONIC BALANCE (800,000). Leaks: sends to a mistyped number, failed reversals. Carried
      inside the same 0.0001 and not counted twice.

      AIRTIME STOCK (219,230.77 at cost). Loss = ZERO, and here is why rather than silence: it is an
      electronic dealer balance. No moisture, no vermin, no breakage, no expiry running against the
      dealer as distinct from the subscriber. Its one genuine channel - a top-up sent to the wrong
      number - is inside shrinkage above. Zero is asserted as a row, not omitted.

      OPERATOR DEPOSITS (1,000,000). Loss = ZERO in the base case, but the channel is named: these
      come back only "si j'arrete", and only if the agency ends clean and the operator is solvent. A
      terminated agency with a disputed balance forfeits them. No probability is applied because none
      can be sourced and he cannot supply one either.

      EQUIPMENT (300,000). Loss = depreciation, at section 6.

  ==================================================================================================
  3. CAPACITY - DOES THE CLAIMED OUTPUT FIT INSIDE THE PLANT?  (rule (c))
  ==================================================================================================

  3.1 The counter

      counter time needed  = 4,410 transactions x 2 min          =  8,820 min/month
      counter time available = 1 position x 11 h x 60 x 26 days  = 17,160 min/month
      utilisation = 51.4%. IT FITS, with room.

  3.2 The people

      person-time needed  = 8,820 (counter) + 61.25 trips x 50 min (3,062.50 travel) = 11,882.50 min
      person-time available = 2 persons x 11 h x 60 x 26 days                        = 34,320 min
      utilisation = 34.6%. IT FITS, comfortably. Note WHY the assistant exists: not to add throughput
      but to keep the kiosk open across the 3,062.50 minutes a month the principal is in a taxi. Two
      people, one serving line.

  3.3 What actually binds

  Neither of the above. THE BINDING CAPACITY IN THIS BUSINESS IS CASH, and it is not on his premises.
  He has 51% counter headroom and 65% labour headroom, and he still shuts at midday - because the
  constraint is 3.91 hours of till (2.4) against an 11-hour day, relieved only by a super-agent who
  is himself sometimes dry. Any plan to grow this kiosk that adds counters or staff addresses a
  constraint that is not binding.

  3.4 The generator, and availability

      load: two handsets on charge and a lamp - well under 100 W against even the smallest "petit
      groupe". Rated output is not the constraint; running hours are.
      running hours = 3 h/day x 24.50 days = 73.50 h/month  [3 h/day ELICITED]
      nothing runs 100%: this run rate is itself the delestage-backup reading, i.e. it already
      assumes the machine is idle whenever CIE is up.

  3.5 The taxi and the carry

  900,000 XOF is about 90 notes of 10,000 - trivial to carry physically, which is exactly the problem:
  nothing about the load makes it conspicuous or slow, and nothing about it makes it safe.

  ==================================================================================================
  4. REVENUE - one month
  ==================================================================================================

      transfer commission = 110,250,000 x 0.008 x 1.00 (net factor) =   882,000
      airtime sales, gross                                          = 1,200,000
      REVENUE                                                       = 2,082,000

      airtime cost of sales = 1,200,000 x (1 - 0.05)                = 1,140,000
      airtime margin                                                =    60,000
      GROSS PROFIT = 2,082,000 - 1,140,000                          =   942,000

  Note the shape of this business: the airtime counter is 58% of the turnover line and 6.4% of the
  gross profit. He is right that "l'essentiel c'est le transfert" - but the reason the airtime leg
  matters at all is that it puts 14,400,000 a year onto the turnover on which he is taxed while
  contributing 720,000 of margin. It is the single most tax-inefficient line in the business, and
  that only becomes visible once the regime is settled (section 7).

  ==================================================================================================
  5. OPERATING COSTS - one month
  ==================================================================================================

      rebalancing   61.25 trips x 2,000                             =  122,500
      rent          stated                                          =   90,000
      assistant, gross                                              =   80,000
      employer social charges (section 5.1)                         =   15,105
      generator fuel (section 5.2)                                  =   32,156.25
      generator lubricants and servicing, 20% of fuel               =    6,431.25
      shrinkage, 0.0001 x 165,375,000 (section 2.5)                 =   16,537.50
      founder's own labour (section 5.3)                            =        0
      TOTAL OPERATING COSTS                                         =  362,730.00

      EBITDA = 942,000 - 362,730 = 579,270.00 per month

  5.1 The assistant, and a rule he may not know governs him

  He pays 80,000. First test it against the law: SMIG is 75,000/month, so his wage clears the
  statutory floor by 6.67%. It is legal. Second, the part he does not mention:

      pension            7.70% x 80,000 (below the 3,375,000 ceiling)          =  6,160
      family allowances  5.00% x 70,000 (CAPPED - his wage is above the cap)   =  3,500
      maternity          0.75% x 70,000 (capped)                               =    525
      work injury        2.00% x 70,000 (capped, lowest risk class)            =  1,400
      employer payroll levies 4.40% x 80,000 (2.8% employer contribution + 1.6% FDFP) = 3,520
      TOTAL EMPLOYER LOAD                                                      = 15,105
      = 18.88% of the wage. Note that the 70,000 monthly ceiling BINDS on three of the five legs -
      an uncapped calculation would have produced 20.4% and been wrong.

  Two objects here, and they are different. What he believes: an assistant costs him 80,000. What
  the rule says: an employer owes 95,105. Whether he pays it is a fact about his business that only
  he can state, and the question is on the list. I run the base case with the charge in, because I
  have already put him inside a statutory tax regime and it would be incoherent to have him formal
  for the tax and invisible to the CNPS.

  5.2 The cost he never counted

  He lists rent, the assistant and the rebalancing trips. He does not list fuel. But he owns a
  generator and it burns petrol:

      73.50 running hours x 0.5 L/h x 875 XOF/L = 36.75 L x 875 = 32,156.25 XOF/month

  That is a third of what he pays his assistant, and it is not in his account of his own costs. It is
  also the single most sensitive line to an unanswered question: at the sole-power reading of his
  kiosk rather than the backup reading, the run hours are nearly four times this.

  5.3 The founder's own labour

  Charged at zero, deliberately and with a rule behind it, not by oversight. He is a personne
  physique; a sole trader has no separate legal personality and cannot be his own employee. His
  drawings are an appropriation of profit, not a deductible expense - which is also the tax answer.
  The consequence for the reader is stated plainly: the FCFF below is struck BEFORE any return to
  the roughly 11 hours a day the founder himself puts in, and that residual is what he lives on. A
  reader comparing this kiosk to a business run by hired management must deduct a replacement
  manager's wage; the direction is unambiguous and the magnitude is not mine to invent.

  ==================================================================================================
  6. DEPRECIATION AND THE REPLACEMENT CADENCE  (rule (d) - the cumulative test)
  ==================================================================================================

  His 300,000 is "au depart" - a one-off, in his telling. Over three years it is not, and the test
  that shows it is a cumulative one.

  6.1 Splitting the 300,000  [ELICITED]

      two handsets  =  138,000 (69,000 each)
      one generator =  162,000
      sum           =  300,000  - exactly his stated figure, split at market-plausible values.

  6.2 The generator, depreciated on the thing that consumes it

      IAS 16.62 permits units-of-production where consumption is usage-driven, and here it plainly is
      - this machine dies of hours, not of birthdays.
      assumed life 1,984.5 running hours, inside the sourced 1,000-4,000 h band for small air-cooled
      portable units, and just under the conventional 2,000 h mid-band figure.
      at 73.50 h/month that is 27 months exactly.
      depreciation = 162,000 / 27 = 6,000 XOF/month
      REPLACEMENT at the start of period index 27 (month 28), 162,000 of capex.

      CUMULATIVE TEST: 73.50 h x 36 months = 2,646 running hours over the horizon. Two units bought,
      each good for 1,984.5 h, gives 3,969 h of capacity. 2,646 fits inside 3,969. It also shows that
      a SINGLE unit could not have carried the horizon - 2,646 > 1,984.5 - which is the whole point:
      his "au depart" 300,000 is a recurring cost wearing a one-off's clothes.
      Fuel over the horizon: 1,323 litres.

  6.3 The handsets, depreciated on time, tested on duty

      assumed life 24 months, straight line.
      depreciation = 138,000 / 24 = 5,750 XOF/month
      REPLACEMENT at the start of period index 24 (month 25), 138,000 of capex.

      CUMULATIVE TEST: 4,410 transactions a month across 2 handsets is 2,205 per handset per month;
      over 24 months, 52,920 TRANSACTIONS ON ONE HANDSET before it is retired. At roughly 40 key
      presses per transaction that is over two million presses on a device living outdoors in a dusty
      market. 24 months is the optimistic end of that duty cycle, not the safe end, and the model
      says so rather than absorbing it.

      Over the full horizon: 158,760 transactions, 79,380 per handset position, against 105,840 of
      handset capacity purchased. Fits.

      TOTAL DEPRECIATION = 5,750 + 6,000 = 11,750 XOF/month, constant.
      EBIT = 579,270.00 - 11,750 = 567,520.00 XOF/month.

  ==================================================================================================
  7. TAX - establishing the regime before computing anything
  ==================================================================================================

  7.1 Is he inside a statutory regime at all?

  Yes, and it follows from his own words rather than from an assumption. Two licensed operators each
  hold a 500,000 deposit from him under an agency contract that pays him commission. A mobile-money
  agency agreement with an e-money issuer in the WAEMU is a KYC-bearing contract; it is not on offer
  to an unregistered natural person. His two contracts entail his registration.

  7.2 What is his turnover?

      transfer commission  10,584,000/year   (net - he is an agent on this leg, section 0)
      airtime sales        14,400,000/year   (gross - achat-revente, section 0)
      CA TTC               24,984,000/year

  And the band question is ROBUST to the presentation argument, which is worth knowing: even on the
  strictest net-net reading of both legs the turnover would be 11,304,000, and even that is inside
  the same band. The regime conclusion does not depend on the judgment call.

  7.3 Which regime

      taxe communale de l'entreprenant   below 5,000,001 TTC
      TAXE D'ETAT DE L'ENTREPRENANT      5,000,001 to 50,000,000 TTC   <-- 24,984,000 lands here
      microentreprise                    50,000,001 to 200,000,000
      reel simplifie                     200,000,001 to 500,000,000
      reel normal                        above 500,000,001

  7.4 What that means, and what it means it is NOT

  The taxe d'Etat de l'entreprenant "se substitue a la patente, a l'impot sur les benefices et a la
  TVA". Three consequences, each of which removes a line other analysts would have put in:

      NO BIC at 25% on profit. The 25% is recorded in the inputs and applied nowhere.
      NO PATENTE - neither the droit sur le chiffre d'affaires nor the droit sur la valeur locative
        on his 90,000-a-month kiosk.
      NO VAT charged and NONE RECOVERED - so the 18% inside the airtime he buys is irrecoverable and
        already sits inside the 1,140,000 cost of sales. Every figure in this model is TTC as he
        experiences it, which is exactly the base the TEE taxes. No VAT line is missing; there is
        none to have.
      AND NO IMF. The impot minimum forfaitaire - 0.5% of turnover, floor 3,000,000 a year - reaches
        only RNI and RSI taxpayers. Its floor alone is more than twice this business's actual tax
        bill. It does not touch him.

      Rate: 5% for prestations de services, 4% for commerce/negoce. He designates his own principal
      activity - "l'essentiel c'est le transfert" - which is a service, so a single-activity
      assessment at 5% is taken across the whole base. A split assessment would be lower; the
      direction is stated and the number is not, because I have not verified that the DGI splits.

      TAX = 0.05 x 2,082,000 = 104,100 XOF/month (the TEE is payable monthly at one twelfth of the
      annual charge, so the monthly grid matches the statutory rhythm exactly).

  7.5 Two structural facts that fall out of this

  FIRST: because the tax base is TURNOVER, depreciation carries NO TAX SHIELD in this business. The
  11,750 a month of depreciation reduces EBIT and reduces nothing in the tax line. Capex here is not
  tax-advantaged in any degree, and any analysis that assumed a shield would be wrong by construction.

  SECOND: his turnover of 24,984,000 sits at almost exactly HALF the 50,000,000 ceiling of the band.
  There is a cliff on the other side of it - crossing into the microentreprise regime restores the
  profits tax, restores the patente, brings him into VAT, and eventually exposes him to an IMF whose
  FLOOR is several times his current whole tax bill. The airtime counter is what walks him toward
  that edge: it is 58% of his turnover and 6.4% of his gross profit. Growth in this business is not
  smooth, and the un-smooth part is not on the revenue side.

      NOPAT = EBIT - tax = 567,520.00 - 104,100 = 463,420.00 XOF/month.
      Effective rate on EBIT: 18.34%.

  ==================================================================================================
  8. INVESTED CAPITAL - where the money in this business actually is
  ==================================================================================================

  8.1 Working capital, end of every period from t=0

      cash float in the drawer                                     =   800,000.00
      electronic float on the handsets                             =   800,000.00
      airtime stock, 5 days of cost: 5 x 1,140,000 / 26            =   219,230.77
      commission receivable from the operators, 1 month            =   882,000.00
      security deposits, 2 operators x 500,000                     = 1,000,000.00
      trade payables                                               =         0.00
      NET WORKING CAPITAL                                          = 3,701,230.77

  8.2 A friction I am not smoothing

  The two 500,000 deposits are not working capital in a balance-sheet sense - they are non-current
  financial assets that unwind only on cessation. They are carried inside NWC here for one reason:
  the brief's build is FCFF = NOPAT + D&A - dNWC - capex, and a required operating asset that is
  neither NWC nor PP&E has nowhere else to go without adding a fourth term. Putting them in NWC keeps
  the identity exact and keeps them visible. What a reader must carry: 27% of this business's invested
  capital is money that comes back only if he stops, which is a very different thing from money that
  turns over.

  8.3 Where the capital is

      net working capital     3,701,230.77   (92.5%)
      equipment, gross          300,000.00   ( 7.5%)
      TOTAL INVESTED AT t=0   4,001,230.77

  This business is not equipment with some working capital attached. It is working capital with two
  phones attached. That is the single most important structural fact about it and it is why the
  horizon had to start at inception.

  8.4 The path of dNWC

  Volumes are flat by construction (no growth is stated, no seasonality is stated, no inflation is
  applied), so the whole working-capital build lands at t=0 and dNWC is zero in every period
  thereafter: dNWC = [3,701,230.77, 0, 0, ... , 0].

  ==================================================================================================
  9. THE FCFF BUILD
  ==================================================================================================

  9.1 The steady-state month (every period except t=0, t=24 and t=27)

      revenue                                                      = 2,082,000.00
      cost of sales (airtime)                                      = 1,140,000.00
      gross profit                                                 =   942,000.00
      operating costs                                              =   362,730.00
      EBITDA                                                       =   579,270.00
      depreciation                                                 =    11,750.00
      EBIT                                                         =   567,520.00
      taxe d'Etat de l'entreprenant                                =   104,100.00
      NOPAT                                                        =   463,420.00
      + depreciation                                               =    11,750.00
      - change in net working capital                              =         0.00
      - capital expenditure                                        =         0.00
      FCFF                                                         =   475,170.00

  9.2 Period t=0 (month 1)

      NOPAT + D&A                                                  =   475,170.00
      - dNWC (the entire float, deposits, stock and receivable)     = 3,701,230.77
      - capex (two handsets 138,000 + generator 162,000)           =   300,000.00
      FCFF                                                         = (3,526,060.77)

  9.3 Period t=24 (month 25) - handset replacement

      475,170.00 - 138,000 = 337,170.00

  9.4 Period t=27 (month 28) - generator replacement

      475,170.00 - 162,000 = 313,170.00

  9.5 The horizon

      cumulative FCFF, 36 periods                                  = 12,804,889.23
      the stream turns cumulatively positive during period index 8 (month 9) - eight months to repay
      the whole float, the deposits, the stock and the equipment.
      residual net book value at t=35: handsets 69,000 + generator 108,000 = 177,000, which ties to
      600,000 of capex less 423,000 of accumulated depreciation.
      NOT recovered at the horizon and deliberately so: the 3,701,230.77 of working capital, including
      the two 500,000 deposits. He is assumed to still be trading. There is no terminal value.

  9.6 The cumulative quantities, tested against the world  (rule (d))

      transaction value across the counter       3,969,000,000 XOF
      cash physically carried in taxis           1,984,500,000 XOF in 2,205 separate trips
      transactions handled                             158,760, i.e. 79,380 per handset position
      generator running hours                            2,646 against 3,969 h of machine purchased
      petrol burned                                      1,323 litres

  The second line is the one that should stop a reader. Nearly two billion XOF of physical cash moved
  through a market in Abidjan by taxi over three years, against which the model carries 2,000 a trip
  of stated cost and 198,450 a year of assumed loss. That assumed loss is 0.01% of the value carried.
  Whether it is anywhere near right is the question I most want him to answer, and it is the reason
  the shrinkage line is in the model at all rather than being netted into silence.


  # ---------- CONSERVATION ----------
  # The cash till and the electronic till are the two halves of one transformation; each must close
  # on its own, and the closure is what makes the 900,000-a-trip carry a derived fact rather than a
  # guess. These fail immediately if the withdrawal/deposit split, the drain or the trip count move.
  - "trace.till_cash_close[t] == trace.till_cash_open[t] + trace.cash_in_deposits[t] + trace.cash_in_rebalance[t] - trace.cash_out_withdrawals[t]"
  - "trace.efloat_close[t] == trace.efloat_open[t] + trace.efloat_in_withdrawals[t] - trace.efloat_out_deposits[t] - trace.efloat_out_rebalance[t]"
  - "trace.withdrawal_value[t] + trace.deposit_value[t] == trace.txn_value[t]"
  - "trace.net_cash_drain[t] == trace.withdrawal_value[t] - trace.deposit_value[t]"
  - "trace.rebalance_value[t] == trace.net_cash_drain[t]"
  - "trace.cash_in_deposits[t] == trace.deposit_value[t]"
  - "trace.cash_out_withdrawals[t] == trace.withdrawal_value[t]"
  - "trace.cash_in_rebalance[t] == trace.rebalance_value[t]"
  - "trace.efloat_in_withdrawals[t] == trace.withdrawal_value[t]"
  - "trace.efloat_out_deposits[t] == trace.deposit_value[t]"
  - "trace.efloat_out_rebalance[t] == trace.rebalance_value[t]"
  - "trace.value_handled[t] == trace.txn_value[t] + trace.rebalance_value[t]"
  - "sum(trace.rebalance_value) == sum(trace.net_cash_drain)"
  # Airtime stock roll-forward. The loss row is zero and is asserted as zero rather than omitted.
  - "trace.airtime_stock_close[t] == trace.airtime_stock_close[t-1] + trace.airtime_purchases[t] - trace.airtime_cogs[t] - trace.airtime_stock_loss[t]"
  - "trace.airtime_stock_loss[t] == airtime_stock_loss_rate * trace.airtime_stock_close[t-1]"
  # Equipment roll-forwards.
  - "trace.nbv_phones[t] == trace.nbv_phones[t-1] + trace.capex_phones[t] - trace.dep_phones[t]"
  - "trace.nbv_genset[t] == trace.nbv_genset[t-1] + trace.capex_genset[t] - trace.dep_genset[t]"
  - "trace.nbv_total[last] == sum(trace.capex) - sum(trace.dep_total)"
  # Rule (d) counters: hours on the generator in service, transactions on a handset in service.
  # Each accumulates and is knocked back to zero by its own replacement flag.
  - "trace.genset_unit_hours[t] == trace.genset_unit_hours[t-1] + trace.genset_hours[t] - genset_life_hours * trace.genset_replacement[t]"
  - "trace.phone_unit_txns[t] == trace.phone_unit_txns[t-1] + trace.txn_count[t] / phone_count - phone_life_txns * trace.phone_replacement[t]"
  # Working capital and the cash stream.
  - "cumsum(trace.delta_nwc) == trace.nwc"
  - "cumsum(trace.fcff) == trace.cum_fcff"

  # ---------- DEFINITION ----------
  - "trace.revenue[t] == trace.momo_commission[t] + trace.airtime_sales[t]"
  - "trace.gross_profit[t] == trace.revenue[t] - trace.airtime_cogs[t]"
  - "trace.airtime_margin[t] == trace.airtime_sales[t] - trace.airtime_cogs[t]"
  - "trace.opex_total[t] == trace.opex_rebalancing[t] + trace.opex_rent[t] + trace.opex_wages_gross[t] + trace.opex_social_charges[t] + trace.opex_fuel[t] + trace.opex_genset_maintenance[t] + trace.opex_shrinkage[t] + trace.opex_owner_wage[t]"
  - "trace.ebitda[t] == trace.gross_profit[t] - trace.opex_total[t]"
  - "trace.dep_total[t] == trace.dep_phones[t] + trace.dep_genset[t]"
  - "trace.ebit[t] == trace.ebitda[t] - trace.dep_total[t]"
  - "trace.nopat[t] == trace.ebit[t] - trace.tee_tax[t]"
  - "trace.capex[t] == trace.capex_phones[t] + trace.capex_genset[t]"
  - "trace.nbv_total[t] == trace.nbv_phones[t] + trace.nbv_genset[t]"
  - "trace.nwc[t] == trace.nwc_till_cash[t] + trace.nwc_efloat[t] + trace.nwc_airtime_stock[t] + trace.nwc_commission_receivable[t] + trace.nwc_operator_deposits[t] - trace.nwc_payables[t]"
  - "trace.cfo[t] == trace.nopat[t] + trace.dep_total[t] - trace.delta_nwc[t]"
  - "trace.cfi[t] == 0 - trace.capex[t]"
  - "trace.fcff[t] == trace.cfo[t] + trace.cfi[t]"

  # ---------- DRIVER-BRIDGE ----------
  # Every computed line traced back to the input it rides on, so that a different answer to any
  # elicited question produces a different number rather than a different narrative.
  - "trace.days_open[t] == days_open_per_month"
  - "trace.short_days[t] == short_days_per_month"
  - "trace.seasonal_index[t] == seasonal_index"
  - "trace.effective_days[t] == days_open_per_month - short_day_fraction_lost * short_days_per_month"
  - "trace.txn_count[t] == txn_per_normal_day * trace.effective_days[t] * trace.seasonal_index[t]"
  - "trace.txn_value[t] == trace.txn_count[t] * avg_ticket"
  - "trace.withdrawal_value[t] == withdrawal_share * trace.txn_value[t]"
  - "trace.deposit_value[t] == deposit_share * trace.txn_value[t]"
  - "trace.momo_commission[t] == trace.txn_value[t] * commission_rate * commission_net_factor"
  - "trace.rebalance_trips[t] == trips_per_day * trace.effective_days[t]"
  - "trace.cash_per_trip[t] * trace.rebalance_trips[t] == trace.rebalance_value[t]"
  - "trace.opex_rebalancing[t] == trace.rebalance_trips[t] * rebalance_cost_per_trip"
  - "trace.till_cash_open[t] == opening_till_cash"
  - "trace.efloat_open[t] == opening_efloat"
  - "trace.airtime_sales[t] == airtime_sales_monthly"
  - "trace.airtime_cogs[t] == trace.airtime_sales[t] * (1 - airtime_discount)"
  - "trace.airtime_stock_close[t] == airtime_stock_days * trace.airtime_cogs[t] / days_open_per_month"
  - "trace.opex_wages_gross[t] == assistant_wage_monthly"
  - "trace.opex_social_charges[t] == assistant_cnps_declared_flag * (cnps_pension_rate_employer * assistant_wage_monthly + (cnps_family_rate_employer + cnps_maternity_rate_employer + cnps_at_rate_employer) * cnps_ceiling_monthly + employer_payroll_tax_rate * assistant_wage_monthly)"
  - "trace.opex_rent[first] == rent_monthly"
  - "trace.opex_rent[t] == trace.opex_rent[t-1] * (1 + rent_escalation_monthly) for t >= 1"
  - "trace.opex_owner_wage[t] == owner_wage_monthly"
  - "trace.genset_hours[t] == genset_hours_per_day * trace.effective_days[t]"
  - "trace.fuel_litres[t] == trace.genset_hours[t] * genset_burn_l_per_h"
  - "trace.opex_fuel[t] == trace.fuel_litres[t] * fuel_price_xof_per_l"
  - "trace.opex_genset_maintenance[t] == genset_maint_pct_of_fuel * trace.opex_fuel[t]"
  - "trace.opex_shrinkage[t] == shrinkage_rate * trace.value_handled[t]"
  - "trace.dep_phones[t] == phone_set_cost / phone_life_months"
  - "trace.dep_genset[t] == genset_cost / genset_life_months"
  - "trace.capex_phones[t] == phone_set_cost * trace.phone_purchase[t]"
  - "trace.capex_genset[t] == genset_cost * trace.genset_purchase[t]"
  - "trace.tee_tax[t] == tee_rate_services * trace.revenue[t]"
  - "trace.nwc_till_cash[t] == opening_till_cash"
  - "trace.nwc_efloat[t] == opening_efloat"
  - "trace.nwc_airtime_stock[t] == trace.airtime_stock_close[t]"
  - "trace.nwc_commission_receivable[t] == commission_receivable_months * trace.momo_commission[t]"
  - "trace.nwc_operator_deposits[t] == operator_count * deposit_per_operator"
  - "trace.nwc_payables[t] == payables_days"
  - "trace.service_minutes[t] == trace.txn_count[t] * minutes_per_txn"
  - "trace.travel_minutes[t] == trace.rebalance_trips[t] * minutes_per_rebalance_trip"
  - "trace.counter_minutes_available[t] == service_points * trading_hours_per_day * 60 * days_open_per_month"
  - "trace.staffed_minutes[t] == staff_count * trading_hours_per_day * 60 * days_open_per_month"
  - "trace.till_hours_of_cover[t] * trace.net_cash_drain[t] == trace.till_cash_open[t] * trading_hours_per_day * trace.effective_days[t]"

  # ---------- PHYSICAL CLOSURE, ASSERTED (rules c and d) ----------
  # The claimed output must fit inside the plant described, and the cumulative totals must fit inside
  # what the assets bought can actually deliver. Each of these can fail on a different operation.
  - "trace.service_minutes[t] <= trace.counter_minutes_available[t]"
  - "trace.service_minutes[t] + trace.travel_minutes[t] <= trace.staffed_minutes[t]"
  # The finding of section 2.4, as an assertion: the morning till does NOT cover the trading day.
  - "max(trace.till_hours_of_cover) < trading_hours_per_day"
  # He carries more per trip than he opens the drawer with.
  - "trace.cash_per_trip[t] > trace.till_cash_open[t]"
  # No unit is worked past its life, and total hours/transactions fit inside capacity purchased.
  - "max(trace.genset_unit_hours) <= genset_life_hours"
  - "max(trace.phone_unit_txns) <= phone_life_txns"
  - "sum(trace.genset_hours) <= genset_life_hours * sum(trace.genset_purchase)"
  - "sum(trace.txn_count) / phone_count <= phone_life_txns * sum(trace.phone_purchase)"
  # And a single unit could NOT have carried the horizon - which is why replacement capex exists.
  - "sum(trace.genset_hours) > genset_life_hours"
  - "sum(trace.fuel_litres) == sum(trace.genset_hours) * genset_burn_l_per_h"

  # ---------- NON-NEGATIVITY ----------
  - "trace.nbv_phones[t] >= 0"
  - "trace.nbv_genset[t] >= 0"
  - "trace.nbv_total[t] >= 0"
  - "trace.airtime_stock_close[t] >= 0"
  - "trace.till_cash_close[t] >= 0"
  - "trace.efloat_close[t] >= 0"
  - "trace.genset_unit_hours[t] >= 0"
  - "trace.phone_unit_txns[t] >= 0"
  - "trace.nwc[t] >= 0"
  - "trace.ebitda[t] >= 0"
  - "trace.nopat[t] >= 0"

  # ---------- STATUTORY ELIGIBILITY ----------
  # The regime is a conclusion, not an assumption, so the band it rests on is asserted. If turnover
  # left the band the whole tax treatment below would be the wrong instrument, not a wrong number.
  - "sum(trace.revenue) * 12 / grid.periods <= tee_band_high"
  - "sum(trace.revenue) * 12 / grid.periods >= tee_band_low"
  - "assistant_wage_monthly >= smig_monthly"

notes:

  finding_opening_till_is_a_morning_not_a_day: >-
    His central operational claim - "pour tenir la journee il me faut a peu pres huit cent mille en
    caisse le matin" - does not survive his own volumes. The 800,000 covers 3.91 hours of an 11-hour
    trading day at the net drain his transaction mix implies. It is a morning's float described as a
    day's float. This is not a rounding and I have not absorbed it: it is asserted in checks
    (max(trace.till_hours_of_cover) < trading_hours_per_day), and it reframes the midday closures he
    describes as bad days into the ordinary consequence of the design. Everything past mid-morning
    is a dependency on a third party's cash position.

  finding_the_binding_constraint_is_not_on_his_premises: >-
    The kiosk runs at 51% counter utilisation and 35% labour utilisation. There is no throughput
    problem. The constraint is liquidity, and the relieving asset - the super-agent - is not his.
    Consequence for anyone thinking about this business: capital spent on counters, staff or a
    second location addresses a constraint that is not binding, while capital spent on float or on a
    second liquidity source addresses the one that is.

  finding_the_carry_is_the_uncosted_exposure: >-
    The derivation forces a figure the founder never states: 900,000 XOF carried per trip, 61 trips a
    month, 1,984,500,000 XOF of physical cash moved by taxi over the horizon. He names this risk
    himself and places it explicitly outside the 2,000 a trip. The model carries 0.01% of value
    handled against it, which is a deliberately low working value attached to a live question. The
    gap between what is carried and what is charged is the largest unquantified exposure in this
    business, and it is a frequency-severity question only he can answer.

  finding_two_presentations_in_one_p_and_l: >-
    The transfer leg is presented NET (commission only - he is a mandataire and never owns the funds)
    and the airtime leg GROSS (achat-revente - he takes title and bears inventory risk). This is a
    friction between two legs of one business and it is kept rather than smoothed. It matters because
    the tax base is turnover: gross presentation of the airtime puts 14,400,000 a year onto a
    turnover line for 720,000 of margin. On a strict net-net reading of both legs the annual turnover
    would be lower and so would the tax; the direction is stated and the figure is not, because the
    tax base for an achat-revente is the selling price and that part is not arguable.

  finding_depreciation_carries_no_tax_shield: >-
    Because the taxe d'Etat de l'entreprenant is assessed on turnover and substitutes for the profits
    tax, depreciation reduces EBIT and reduces the tax line by nothing at all. Capex in this business
    is entirely un-sheltered. Any appraisal that carried a depreciation tax shield across from a
    profits-tax regime would be wrong by construction, not by degree.

  finding_the_band_ceiling_is_a_cliff: >-
    Annual turnover of 24,984,000 sits at roughly half the 50,000,000 ceiling of the entreprenant
    band. Crossing it does not raise a rate - it changes the instrument: the profits tax returns, the
    patente returns, VAT registration begins, and the impot minimum forfaitaire becomes reachable
    with a floor several times this business's entire current tax charge. The airtime counter is what
    walks him toward that edge, being the majority of turnover and a small minority of margin. Growth
    here is discontinuous and the discontinuity is on the tax side, not the revenue side.

  finding_the_one_off_that_is_not_one_off: >-
    He describes the 300,000 of equipment as "au depart". Over 36 periods it is not: the generator
    needs 2,646 running hours against a unit life of roughly 1,984.5, and the handsets carry 52,920
    transactions each before retirement. The horizon was chosen partly to force this - a shorter one
    would have let a recurring cost pass as a one-off.

  finding_capital_is_working_capital: >-
    92.5% of the capital that runs this business is working capital and only 7.5% is equipment. Of
    that working capital, 27% is the two operator deposits, which unwind only on cessation. The
    business repays its whole invested capital in eight months and then earns on an asset base it
    cannot easily release. This is the profile that makes an asset-side FCFF for a mobile-money
    agency meaningless unless it starts at inception, which is why the grid does.

  finding_owner_labour_is_outside_this_number: >-
    No charge is taken for the founder's own labour, on a rule and not by oversight: a personne
    physique has no separate legal personality, cannot be his own employee, and his drawings are an
    appropriation rather than a deductible expense. The row exists in the trace at zero so the
    convention is visible and testable. What a reader must carry: this FCFF is struck before any
    return to roughly eleven hours a day of the founder's own work, and comparing it to a
    professionally managed operation requires deducting a replacement manager - direction certain,
    magnitude not mine to supply.

  friction_ticket_mix: >-
    Three related simplifications, each stated rather than hidden. (i) The 75/25 split is applied to
    VALUE as well as to COUNT, which is only exact if withdrawals and deposits carry the same average
    ticket; at a market where traders collect large sums and depositors are smaller, withdrawals are
    more likely to be the larger ticket, which would raise the drain and the trip count. (ii) The
    25,000 average is an arithmetic mean applied against a tariff that is explicitly band-structured
    ("un peu plus sur les petits montants et un peu moins sur les gros"); the 0.8% is only valid at
    his observed distribution and does not survive a change in mix. (iii) The 0.8% is applied
    uniformly to both legs, whereas most operators pay cash-in and cash-out differently; his blended
    figure absorbs that and cannot be decomposed from his words.

  friction_operator_deposits_inside_nwc: >-
    The two 500,000 security deposits are non-current financial assets, not working capital. They are
    carried inside NWC solely so that the FCFF identity NOPAT + D&A - dNWC - capex holds exactly
    without a fourth investing term. They are materialised as their own trace row so a reader can lift
    them out. They do not unwind at the horizon because cessation is not modelled.

  friction_short_day_is_measured_in_hours_not_transactions: >-
    A midday closure is modelled as losing half a day's transactions, following his own words ("je
    perds la moitie de la journee"). Direction of the likely error: the reason he closes is that
    demand has drained his till, so the lost half is unlikely to be the quiet half. The effective-day
    count is therefore, if anything, generous.

  simplification_constant_currency: >-
    No inflation, no growth, no seasonality. Each is an absence in the utterance, not a finding: he
    describes no trend, no season and no price movement, and inventing any of them would be putting
    numbers in his mouth. Consequence a reader must carry: this is a REAL stream in XOF of July 2026
    and must be discounted at a real rate. Rent escalation is carried as an explicit zero input with
    a question attached rather than as silence.

  omission_rent_advance: >-
    Market kiosks in Abidjan are commonly let against an avance of several months' rent plus a
    caution. He mentions neither, and none is modelled. If one exists it is additional working
    capital at t=0 that this model does not carry, and it would deepen the opening outflow. Flagged
    rather than assumed because the amount is his to state and I have no basis for a figure.

  omission_no_terminal_value: >-
    No terminal value, no float release, no deposit recovery, no equipment disposal proceeds at t=35.
    The founder is assumed to still be trading. A reader wanting an enterprise value must add a
    terminal treatment, and should note that the deposits and the float are the recoverable part of
    what would come back on cessation while the equipment at 177,000 of residual book value is not
    meaningfully realisable second-hand.

  annex_row_reconciled: >-
    Annex row CI-V25-35 carries the value 0.044 while citing an authority that states 2.8%. It is not
    stale: 2.8% (contribution a la charge de l'employeur on local employees) plus 1.6% (FDFP - taxe
    d'apprentissage 0.4% and formation professionnelle continue 1.2%, per CI-TAX-08) equals 4.4%. The
    row is used at 0.044 with both components named in the input record so the arithmetic is
    checkable rather than taken on trust.

  annex_rows_not_applicable: >-
    Large parts of the verified-fact annex govern a different business and are deliberately not used:
    everything on cashew (CI-SEC-01 to 06, CI-V25-36 to 38), mango (CI-SEC-07), bakery flour and
    bread (CI-V25-01 to 04), rice VAT (CI-V25-50), and the entire investment code apparatus
    (CI-INV-01 to 06, CI-V25-22 to 29) - a market kiosk in Abidjan is not in a category-1 activity,
    is not in Zone B, and is nowhere near the 50,000,000 SME agrement threshold on a 300,000 capex.
    Recorded so that their absence reads as a determination rather than an oversight.

  what_would_change_the_answer_most: >-
    Ranked, and this is the interview if he will only answer three questions. (1) How many days a
    month do you shut at midday, and how many days a month do you open at all - these two together
    scale the entire transfer leg and nothing else in the list comes close. (2) Does the generator
    supply everything or only cover the delestage, and how many hours does it run - it is the only
    operating cost in the model that he did not know he had, and it drives the replacement cadence as
    well as the fuel. (3) What did you actually lose last year - the model charges 0.01% against
    nearly two billion XOF of cash carried, and that is the number I trust least in the document.

notes:

  headline: >-
    The business is solvent at the operating line today and stops being so inside the
    forecast horizon, entirely because of one unhedged exposure. Nothing about the
    bakery's operations changes across the five years: same 500 loaves, same 365 days,
    same two bakers, same rent, same 250-franc price. The whole trajectory is the
    exchange rate acting on a fixed annual obligation of 45,625 US dollars.

  structural_short_dollar_position: >-
    Because flour is quoted per loaf in dollars and volume is flat, the business owes a
    constant 45,625 USD a year. It has no dollar revenue, no pricing power (the price is
    stated as rigid), and no hedge. Every franc of dollar appreciation therefore passes
    straight to EBITDA at a rate of 45,625 francs per franc, and the stated 10-franc
    annual crawl produces the observed 456,250 annual EBITDA decline exactly. The
    breakeven rate, 736.99 francs to the dollar, is a hard arithmetic property of the
    stated price, volume and fixed-cost block, not a forecast.

  the_second_fx_channel: >-
    Working capital carries the same exposure a second time. The 37,500-franc annual
    increase in net working capital is not growth investment — volume and inventory days
    are constant — it is the revaluation of an unchanged physical flour buffer into a
    weaker currency. Analysts routinely miss this in import-dependent businesses and
    label it growth capital.

  friction_natural_units_vs_line_items:
    - "Flour is quoted per loaf in dollars, not per kilogram or per sack. I kept his unit, because it is how his supplier actually contracts with him and it makes flour a clean variable cost per unit. The cost of keeping it is that I cannot see the purchase lot size, so the inventory-days assumption has no observable anchor — it is the softest number in the model."
    - "There is no capital asset anywhere in the utterance, so EBITDA equals EBIT and the FCFF build's D&A and capex terms are structurally empty. That is a faithful rendering of what he said and an implausible rendering of a bakery."
    - "The founder's mental accounts are daily (loaves) and monthly (wages, rent). He has no annual account, no balance sheet and no concept of working capital. The annual grid and the NWC roll-forward are analyst constructs imposed on his description, not translations of it."
    - "Rent is treated as an operating expense, not a lease liability with a right-of-use asset, because no lease term is stated and none can be inferred. Under a full IFRS 16 treatment the shape of the cash flow would not change but the EBITDA and D&A split would."

  what_would_move_the_answer_most:
    - "The oven. A bakery making 500 loaves a day has substantial fixed equipment that he did not mention, and by his own dating it is around ten years old. Direction: any replacement inside the horizon reduces FCFF, both through capex and, thereafter, through depreciation and the tax shield on it. Not quantified here because nothing in the utterance supports a cost or a life."
    - "Landed cost. The 0.25 USD is the supplier's invoice. Imported flour in this region attracts freight, customs duty, community levies and clearing charges. Direction: true flour cost per loaf is higher than modelled, EBITDA is lower in every period, and the breakeven crossing arrives earlier. The base case is therefore an upper bound on FCFF."
    - "Tax regime. The 25% rate is a regional prior with no support in the utterance. Direction: if the bakery is on a small-taxpayer forfait or is effectively outside the tax net, near-term FCFF is higher; if it is on the real regime with turnover-based minimum tax, the loss year still attracts a charge and FCFF is lower. The materialised scenario column shows the loss-carryforward mechanics that apply either way."
    - "Waste. Loaves made is not loaves sold. Direction: any stale or unsold bread reduces revenue while leaving flour cost unchanged, so it lowers gross margin per loaf sold and brings the crossing forward."
    - "Supplier credit. Payables are set to zero. Direction: any credit granted by the supplier reduces net working capital and improves FCFF, but it also lengthens the founder's dollar exposure — he would then be short dollars on a payable balance as well as on the flow, adding transaction FX losses that this model does not carry."

  currency_identification_caveat: >-
    The founder says only francs. The magnitudes — 250 for a loaf, 600 to 700 to the
    dollar — identify the CFA franc rather than any other African franc. I have used XOF.
    A genuine friction follows: the CFA franc is pegged to the euro at a fixed parity,
    so its dollar rate is not a crawling peg at all but the mechanical inverse of
    EUR/USD, which does not drift smoothly in one direction. The founder is describing
    the trend he has lived through, and it is a real trend, but its continuation is a
    market view, not a monetary arrangement. I have taken his linear path at face value
    as the deterministic base case, and flag that its persistence is the single least
    reliable input in the model.

  owner_compensation: >-
    The base FCFF is stated before any compensation to the founder for working every day.
    That is correct for an asset-side unlevered cash flow — it measures what the business
    throws off, not what the owner earns — but it means the base numbers are not a wage
    the founder is receiving on top. The materialised owner-charged columns show the same
    business with his labour priced at the wage he pays his own bakers.

  deferred:
    - "No terminal value is computed. On the stated path the operating profit is negative in the final period and the trend is monotone, so a going-concern perpetuity would be meaningless and a liquidation value cannot be estimated without knowing what assets exist."
    - "No discounting. FCFF is presented undiscounted; a cost of capital for a franc-denominated business with an unhedged dollar cost base is a separate exercise requiring inputs not present in the utterance."
    - "No response function. The model deliberately holds the founder passive. In reality he would raise the price, shrink volume, substitute local flour or renegotiate rent well before period 4. Modelling that requires knowing which of those levers he actually has, which is the first thing to ask him."

id: bakery-xof-usd-flour-fcff-v1
title: >-
  Owner-operated daily bakery — unlevered FCFF (via NOPAT) under a franc-fixed bread
  price and a dollar-invoiced flour cost with a crawling FX rate
currency: XOF
grid:
  periods: 5
  freq: annual
  period_0_definition: "the twelve months beginning today (the date of the utterance); period t begins t years from today"

utterance:
  fr: |
    Moi je tiens une boulangerie. Je fais cinq cents pains par jour, vendus à deux cent
    cinquante francs pièce. Je paie deux boulangers à cent mille par mois chacun, et le
    loyer du local est à huit cent mille par mois. Je travaille tous les jours. Ma farine,
    je ne l'achète pas ici — je l'importe, et le fournisseur me facture en dollars :
    vingt-cinq cents de dollar pour la farine d'un pain. Quand j'ai commencé le dollar
    était à six cents francs. Aujourd'hui il est à sept cents, et chaque année il monte
    d'une dizaine de francs. Le pain lui, je le vends toujours en francs, et le prix ne
    bouge pas.
  en: |
    I run a bakery. I make five hundred loaves a day, sold at two hundred fifty francs
    each. I pay two bakers a hundred thousand a month each, and the shop rent is eight
    hundred thousand a month. I work every day. My flour I don't buy here — I import it,
    and the supplier invoices me in dollars: twenty-five US cents of flour per loaf. When
    I started the dollar was at six hundred francs. Today it's at seven hundred, and every
    year it climbs about ten francs. The bread itself I always sell in francs, and the
    price doesn't move.

inputs:

  loaves_per_day:
    value: 500
    unit: loaves/day
    prov: STATED
    source: "Je fais cinq cents pains par jour / I make five hundred loaves a day"
    date: "2026-07-24"

  price_per_loaf:
    value: 250
    unit: XOF/loaf
    prov: STATED
    source: "vendus à deux cent cinquante francs pièce; and held flat by le prix ne bouge pas (the price doesn't move)"
    date: "2026-07-24"

  n_bakers:
    value: 2
    unit: employees
    prov: STATED
    source: "Je paie deux boulangers / I pay two bakers"
    date: "2026-07-24"

  baker_wage_monthly:
    value: 100000
    unit: XOF/month/baker
    prov: STATED
    source: "deux boulangers à cent mille par mois chacun / a hundred thousand a month each"
    date: "2026-07-24"

  rent_monthly:
    value: 800000
    unit: XOF/month
    prov: STATED
    source: "le loyer du local est à huit cent mille par mois / the shop rent is eight hundred thousand a month"
    date: "2026-07-24"

  flour_usd_per_loaf:
    value: 0.25
    unit: USD/loaf
    prov: STATED
    source: "le fournisseur me facture en dollars : vingt-cinq cents de dollar pour la farine d'un pain"
    date: "2026-07-24"

  fx_today:
    value: 700
    unit: XOF/USD
    prov: STATED
    source: "Aujourd'hui il est à sept cents / Today it's at seven hundred"
    date: "2026-07-24"

  fx_at_inception:
    value: 600
    unit: XOF/USD
    prov: STATED
    source: "Quand j'ai commencé le dollar était à six cents francs. Used only to date the business and to show historical margin erosion; not used in the forward path."
    date: "2026-07-24"

  fx_drift_annual:
    value: 10
    unit: XOF/USD per year
    prov: STATED
    source: "chaque année il monte d'une dizaine de francs. Une dizaine is approximate; the point estimate of exactly 10 is DEFAULTED (take the round number the speaker used, no distribution asserted)."
    date: "2026-07-24"

  days_per_year:
    value: 365
    unit: days/year
    prov: INFERRED
    source: "Je travaille tous les jours (I work every day) entails no closure days, so operating days = calendar days = 365. Leap years ignored (DEFAULTED convention)."
    date: "2026-07-24"

  months_per_year:
    value: 12
    unit: months/year
    prov: DEFAULTED
    source: "Calendar convention, to annualise the monthly wage and rent quotes."
    date: "2026-07-24"

  business_age_years:
    value: 10
    unit: years
    prov: INFERRED
    source: "Solve fx_at_inception + fx_drift_annual * n = fx_today, i.e. 600 + 10n = 700, n = 10. Deductively entailed by the three stated FX facts taken together."
    date: "2026-07-24"

  loss_onset_period:
    value: 4
    unit: period index
    prov: INFERRED
    source: "First period index t at which EBIT < 0 on the asserted FX path, obtained by comparing trace.fx to trace.fx_breakeven. Used only to mask the tax and NOL checks; it is a consequence of the derivation, not a free input."
    date: "2026-07-24"

  loss_onset_period_owner_charged:
    value: 2
    unit: period index
    prov: INFERRED
    source: "Same construction as loss_onset_period, applied to the owner-wage-charged scenario."
    date: "2026-07-24"

  tax_rate:
    value: 0.25
    unit: fraction
    prov: ASSUMED
    source: "FLAGGED ASSUMPTION. No tax is mentioned anywhere in the utterance. 25% is a regional prior for corporate income tax on a small formal enterprise in a CFA-franc jurisdiction (statutory rates in the zone cluster in the 25-33% band). Real exposure depends on whether the bakery is on the real regime or a small-taxpayer synthetic/forfait regime, which is ELICITED below."
    date: "2026-07-24"

  flour_inventory_days:
    value: 30
    unit: days of flour cost
    prov: ASSUMED
    source: "FLAGGED ASSUMPTION. The founder states only that the flour is imported (je l'importe), which entails a lead time and therefore a buffer stock, but he gives no quantity, shipment size or frequency. 30 days is a one-replenishment-cycle prior for an imported dry staple. It is the sole driver of net working capital in this model."
    date: "2026-07-24"

  receivable_days:
    value: 0
    unit: days of revenue
    prov: ASSUMED
    source: "FLAGGED ASSUMPTION. Counter sale of bread to walk-in customers is a cash trade; no credit customers are mentioned. Zero trade receivables."
    date: "2026-07-24"

  payable_days:
    value: 0
    unit: days of flour cost
    prov: DEFAULTED
    source: "No supplier credit terms are stated. Me facture (invoices me) describes the currency of invoicing, not a payment delay. Defaulted to zero supplier credit, which is the conservative choice; the actual term is ELICITED below."
    date: "2026-07-24"

  opening_nwc:
    value: 2625000
    unit: XOF
    prov: INFERRED
    source: "The business is already trading today (it started ~10 years ago), so the flour buffer already exists at t=0. Opening stock = flour_inventory_days/days_per_year * flour_usd_per_loaf * loaves_per_day * days_per_year * fx_today = (30/365) * 0.25 * 500 * 365 * 700 = 2,625,000. Conditional on flour_inventory_days, which is ASSUMED."
    date: "2026-07-24"

  capex_per_year:
    value: 0
    unit: XOF/year
    prov: DEFAULTED
    source: "No asset purchase, no equipment, no oven and no vehicle appears anywhere in the utterance; the only premises cost is rent, which is an operating charge, not a capitalised lease here. Silence is defaulted to zero rather than filled with an invented asset. See ELICITED items oven_replacement_cost and oven_remaining_life."
    date: "2026-07-24"

  depreciation_per_year:
    value: 0
    unit: XOF/year
    prov: DEFAULTED
    source: "No depreciable asset is stated, so there is no depreciable base. Consistency note: any oven bought at inception would now be about business_age_years = 10 years old and therefore at or beyond a standard 10-year useful life, i.e. already fully written down — so zero current-year depreciation is coherent with the business's own history even if an oven exists."
    date: "2026-07-24"

  owner_wage_monthly:
    value: 100000
    unit: XOF/month
    prov: ASSUMED
    source: "FLAGGED ASSUMPTION, used only in the materialised owner-charged scenario columns, never in the base FCFF. The founder states Je travaille tous les jours but pays himself nothing in the accounts he describes. The opportunity cost of his labour is anchored on the wage he himself pays for the same skill in the same shop (cent mille par mois), i.e. one additional baker-equivalent."
    date: "2026-07-24"

  horizon_years:
    value: 5
    unit: years
    prov: DEFAULTED
    source: "Horizon chosen so that the grid spans the point at which the franc-fixed price stops covering dollar-indexed flour plus fixed costs. Beyond that crossing the business as described is not a going concern without a decision the founder has not made, so extrapolating further would model a different business."
    date: "2026-07-24"

  # ---- open questions: values not derivable from the utterance ----

  oven_replacement_cost:
    value: null
    unit: XOF
    prov: ELICITED
    source: "QUESTION: what did the oven, mixer and proofing equipment cost, and when? A bakery producing 500 loaves a day cannot operate without a deck or rotary oven, yet no asset is mentioned. Base case carries zero capex and zero D&A; if an oven exists and must be replaced inside the horizon, both capex and depreciation become non-zero."
    date: "2026-07-24"

  oven_remaining_life:
    value: null
    unit: years
    prov: ELICITED
    source: "QUESTION: how many years of service are left in the current oven? Determines whether replacement capex falls inside or outside this horizon."
    date: "2026-07-24"

  landed_cost_uplift:
    value: null
    unit: fraction of supplier invoice
    prov: ELICITED
    source: "QUESTION: on top of the supplier's 0.25 USD invoice, what do freight, insurance, customs duty, statistical/community levies and clearing add per loaf? The utterance prices the supplier invoice only (le fournisseur me facture). Base case treats the invoice as the full landed flour cost, which is the lower bound."
    date: "2026-07-24"

  supplier_payment_days:
    value: null
    unit: days
    prov: ELICITED
    source: "QUESTION: does the supplier grant credit, or is it cash against documents / letter of credit / prepayment? Drives trade payables, which are set to zero in the base case."
    date: "2026-07-24"

  waste_rate:
    value: null
    unit: fraction of loaves produced
    prov: ELICITED
    source: "QUESTION: of the 500 loaves made each day, how many go unsold or stale? Je fais cinq cents pains is a production statement; vendus à 250 francs is a price statement. The base case equates loaves made with loaves sold."
    date: "2026-07-24"

  tax_regime:
    value: null
    unit: categorical
    prov: ELICITED
    source: "QUESTION: is the bakery on the real corporate income tax regime, a small-taxpayer synthetic tax, or effectively informal? Determines whether tax_rate applies to profit at all, and whether tax losses carry forward."
    date: "2026-07-24"

passage: |
  ============================================================================
  0. WHAT KIND OF BUSINESS THIS IS
  ============================================================================
  Stripped of its sector clothing, this is a fixed-price, fixed-quantity retail
  producer with one dominant variable input priced in a foreign currency, and a
  fixed cost block priced in the domestic currency. The founder has told us
  everything needed to build the operating account, and he has told us the one
  thing that actually determines the shape of the forecast: the selling price is
  nominally rigid in francs ("le prix ne bouge pas") while the main input is
  contractually indexed to the dollar ("le fournisseur me facture en dollars"),
  and the dollar is on a steady upward crawl against the franc.

  So the business carries a structural short dollar position that it cannot hedge
  through pricing. Everything below is the arithmetic of that position.

  A dating check, because it disciplines everything else. He started when the
  dollar was 600, it is 700 today, and it climbs about 10 a year. Therefore
  600 + 10n = 700, n = 10: he has been trading about ten years. Ten years ago the
  flour in a loaf cost 0.25 x 600 = 150 francs and left him 250 - 150 = 100 francs
  of gross margin per loaf. Today the same flour costs 0.25 x 700 = 175 francs and
  leaves 75. He has already lost a quarter of his gross margin per loaf, without
  changing a single operating decision, purely through the exchange rate. That is
  the historical run-up to the forecast, not part of it.

  ============================================================================
  1. THE OPERATING GRID, IN HIS OWN QUANTITIES
  ============================================================================
  His natural units are the loaf and the day; the wage and the rent are quoted by
  the month; the flour is quoted in dollars per loaf. I roll everything up to an
  annual grid and keep the loaf as the unit of account for margin.

  "Je travaille tous les jours" — every day — means there are no closure days, so
  operating days = calendar days = 365 (leap days ignored).

    loaves per year = 500 loaves/day x 365 days = 182,500 loaves

  This is constant across all five periods: nothing in the utterance says volume
  grows, shrinks, or is capacity-constrained differently over time.

  ============================================================================
  2. THE EXCHANGE-RATE PATH
  ============================================================================
  Today's spot is 700 and the crawl is +10 per year. I apply the start-of-period
  spot to the whole of that period (a step convention — named, so it can be
  argued with; a mid-period average would be about 5 francs higher in each year
  and would make flour marginally dearer).

    period index t   0     1     2     3     4
    FX (XOF/USD)    700   710   720   730   740

  ============================================================================
  3. REVENUE
  ============================================================================
  Revenue recognises at the point of sale of each loaf (IFRS 15: performance
  obligation satisfied on handover; cash retail, so no financing component and no
  variable consideration). Price is 250 francs and does not move, by his own
  statement, in any period.

    revenue = 250 XOF/loaf x 182,500 loaves = 45,625,000 XOF per year

  Identical in all five periods: 45,625,000. This flatness is not an assumption
  I imported — it is the single most emphatic thing he said.

  ============================================================================
  4. THE FLOUR — THE ONLY VARIABLE COST
  ============================================================================
  He does not quote flour in kilos or in sacks. He quotes it in dollars per loaf.
  I keep his unit; the friction this creates is noted below.

    flour in dollars = 0.25 USD/loaf x 182,500 loaves = 45,625 USD per year

  That 45,625 USD is the whole story of this business. It is a fixed annual
  foreign-currency obligation, and every 1 franc of dollar appreciation costs him
  45,625 francs of EBITDA. The stated 10-franc-a-year crawl therefore costs him
  exactly 456,250 francs of EBITDA every year, forever, with no offset.

  Translating at each period's rate (IAS 21: transactions translated at the rate
  at the date of transaction; here, the step-convention period rate):

    t=0:  45,625 x 700 = 31,937,500
    t=1:  45,625 x 710 = 32,393,750
    t=2:  45,625 x 720 = 32,850,000
    t=3:  45,625 x 730 = 33,306,250
    t=4:  45,625 x 740 = 33,762,500

  Each year is exactly 456,250 francs dearer than the last, as predicted.

  Per loaf, the same thing in his own unit:

    flour per loaf (XOF)      175.0   177.5   180.0   182.5   185.0
    gross margin per loaf     75.0    72.5    70.0    67.5    65.0

  ============================================================================
  5. THE FIXED COST BLOCK
  ============================================================================
  Two bakers at 100,000 a month:  2 x 100,000 x 12 = 2,400,000 per year.
  Rent:                                800,000 x 12 = 9,600,000 per year.
  Total fixed cash operating cost:                   12,000,000 per year.

  Both are franc-denominated and neither is stated to escalate, so both are held
  flat. Note the asymmetry this creates and which he lives inside: 100% of his
  cost inflation arrives through one line (flour), and none of it through the
  lines he can see and negotiate.

  Expressed against his volume, the fixed block absorbs
  12,000,000 / 182,500 = 65.75 francs of gross margin per loaf, every loaf.
  Compare that number to the gross margin row above and the whole forecast is
  already visible: 75 falls to 65 while the hurdle sits at 65.75.

  ============================================================================
  6. EBITDA
  ============================================================================
    EBITDA = revenue - flour - fixed costs

    t=0:  45,625,000 - 31,937,500 - 12,000,000 =  1,687,500
    t=1:  45,625,000 - 32,393,750 - 12,000,000 =  1,231,250
    t=2:  45,625,000 - 32,850,000 - 12,000,000 =    775,000
    t=3:  45,625,000 - 33,306,250 - 12,000,000 =    318,750
    t=4:  45,625,000 - 33,762,500 - 12,000,000 =   -137,500

  Cross-check via the per-loaf route, t=0: 75.0 x 182,500 = 13,687,500, less
  12,000,000 = 1,687,500. Agrees.

  The decline is exactly 456,250 per year — the FX crawl, nothing else.

  THE CROSSING. Solve for the rate at which EBITDA is exactly zero:

    price x volume - fixed = flour_usd x volume x FX*
    45,625,000 - 12,000,000 = 45,625 x FX*
    FX* = 33,625,000 / 45,625 = 269,000 / 365 = 736.986301... XOF/USD

  Years from today at 10 francs a year: (736.986301... - 700) / 10 = 1350/365 =
  3.6986... years. Under a continuous crawl he goes cash-negative at the
  operating line about three years and eight months from today; under the
  step convention used in the trace, that shows up as period 4 being the first
  loss-making year. Both statements are the same fact.

  ============================================================================
  7. DEPRECIATION AND CAPEX
  ============================================================================
  He names no asset. The premises are rented, so they are an operating charge and
  not a right-of-use asset I can size (no lease term is given). No oven, mixer,
  proofer, vehicle or fitting is mentioned, and I will not invent one and then
  depreciate my own invention.

  So depreciation = 0 and capex = 0 in every period, and net PP&E stays at zero:
  EBIT = EBITDA throughout. This is flagged as DEFAULTED-from-silence, and it is
  the largest single hole in the picture — see notes. It is at least internally
  coherent with his own history: an oven bought at inception would now be about
  ten years old and therefore at or past the end of a conventional useful life,
  i.e. carrying essentially no remaining book value and no current depreciation
  charge. What that same fact implies about a looming replacement is a question,
  not a number, and it is left as an elicitation.

  ============================================================================
  8. TAX
  ============================================================================
  Nothing is stated. I apply a 25% corporate income tax on operating profit —
  flagged ASSUMED, a regional prior, not something he told me — and I apply it
  the way a standalone company with no other income actually pays it: tax on
  positive profit only, with losses carried forward rather than refunded. There
  is no group to surrender a loss to, so a symmetric negative tax charge in the
  loss year would be fictitious cash.

    t=0:  1,687,500 x 0.25 =  421,875     NOL carried forward:       0
    t=1:  1,231,250 x 0.25 =  307,812.5   NOL carried forward:       0
    t=2:    775,000 x 0.25 =  193,750     NOL carried forward:       0
    t=3:    318,750 x 0.25 =   79,687.5   NOL carried forward:       0
    t=4:   loss, tax = 0                  NOL carried forward: 137,500

  NOPAT = EBIT - tax:

    t=0:  1,687,500 -   421,875   =  1,265,625
    t=1:  1,231,250 -   307,812.5 =    923,437.5
    t=2:    775,000 -   193,750   =    581,250
    t=3:    318,750 -    79,687.5 =    239,062.5
    t=4:   -137,500 -         0   =   -137,500

  ============================================================================
  9. WORKING CAPITAL
  ============================================================================
  He has no working-capital concept at all — he thinks in loaves a day and francs
  a month. But he told me one thing that forces working capital into existence:
  the flour is imported. An import has a lead time, and a lead time is a stock.

  Receivables: bread is sold over the counter for cash, so zero.
  Payables: no credit terms stated, so zero (conservative, and elicited).
  Inventory: 30 days of flour cost — a one-replenishment-cycle prior, FLAGGED.

    NWC = flour inventory = (30/365) x flour cost in francs

  Because flour cost in francs is 45,625 x FX, this collapses neatly to
  (30/365) x 45,625 x FX = 3,750 x FX:

    t=0:  3,750 x 700 = 2,625,000
    t=1:  3,750 x 710 = 2,662,500
    t=2:  3,750 x 720 = 2,700,000
    t=3:  3,750 x 730 = 2,737,500
    t=4:  3,750 x 740 = 2,775,000

  The opening balance matters. This is a ten-year-old going concern, not a
  start-up: the flour buffer already sits in his store today, financed long ago.
  So the opening stock at the start of period 0 is 3,750 x 700 = 2,625,000, and
  period 0 requires no fresh investment. Thereafter:

    delta NWC:  t=0: 0    t=1: 37,500   t=2: 37,500   t=3: 37,500   t=4: 37,500

  Note what this is. It is not growth. Volume is flat, days are flat, and he is
  buying exactly the same flour. The 37,500 a year is pure revaluation: the same
  physical buffer costs more francs each year. It is a second, quieter channel
  through which the depreciating franc drains cash, on top of the P&L channel —
  and it is exactly 3,750 x 10 per year.

  ============================================================================
  10. FREE CASH FLOW TO THE FIRM
  ============================================================================
    FCFF = NOPAT + D&A - delta NWC - capex

    t=0:  1,265,625   + 0 -      0 - 0 =  1,265,625
    t=1:    923,437.5 + 0 - 37,500 - 0 =    885,937.5
    t=2:    581,250   + 0 - 37,500 - 0 =    543,750
    t=3:    239,062.5 + 0 - 37,500 - 0 =    201,562.5
    t=4:   -137,500   + 0 - 37,500 - 0 =   -175,000

  Cumulative over the five years: 2,721,875 francs.

  Read that against the scale of the business. He turns over 45.6 million francs
  a year and he generates, across five whole years, about 2.7 million francs of
  asset-side free cash — roughly 1.2% of a single year's revenue per year. He is
  running a 182,500-loaf-a-year operation on a margin so thin that a 40-franc
  move in the exchange rate erases it entirely. And the fifth year is already
  negative.

  ============================================================================
  11. WHAT HIS OWN LABOUR COSTS (materialised scenario)
  ============================================================================
  "Je travaille tous les jours." He works every day and pays himself nothing in
  the accounts he described. The base FCFF above is therefore a pre-owner-
  compensation figure, and it flatters him. I charge his labour at the wage he
  himself pays for the same skill in the same shop — 100,000 a month, i.e. one
  additional baker-equivalent, 1,200,000 a year. This is not an invented number;
  it is his own observed price for the work.

    EBIT with owner charged:
    t=0:  1,687,500 - 1,200,000 =    487,500
    t=1:  1,231,250 - 1,200,000 =     31,250
    t=2:    775,000 - 1,200,000 =   -425,000
    t=3:    318,750 - 1,200,000 =   -881,250
    t=4:   -137,500 - 1,200,000 = -1,337,500

    Tax (25% on positive profit, losses carried forward):
    t=0: 121,875    t=1: 7,812.5    t=2-4: 0
    Loss carryforward balance: 0, 0, 425,000, 1,306,250, 2,643,750

    NOPAT: 365,625; 23,437.5; -425,000; -881,250; -1,337,500
    FCFF = NOPAT - delta NWC:
    t=0: 365,625    t=1: -14,062.5    t=2: -462,500
    t=3: -918,750   t=4: -1,375,000

  On this reading the business stops covering its full economic cost of labour
  within two years, not four. The base case is the answer to "what does the asset
  throw off"; this scenario is the answer to "is the owner better off than his
  own employees", and it is the more honest question.


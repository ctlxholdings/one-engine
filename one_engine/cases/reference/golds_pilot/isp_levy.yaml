notes:
  - "HORIZON. Six annual periods, set by the remaining life of the installed network (8-year replacement cycle stated by the founder, less the 2 years already elapsed). This is the window over which the existing asset earns, and it terminates at the re-investment point the founder himself names. The original 90 000 000 outlay is sunk and correctly absent from FCFF inside the horizon."

  - "REPLACEMENT CAPEX AT t=5 — JUDGMENT CALL. The founder states the swap happens (« on le change au bout de huit ans »), so I place a like-for-like 90 000 000 outlay at the end of the final period. The friction is that the replacement's benefit falls almost entirely outside the horizon. To keep both readings visible without asserting an unverified figure, the operating flow of that period is materialised separately as trace.cfo[last]; the headline trace.fcff[last] is that figure net of the replacement. Anyone who prefers to stop at the re-investment point should read trace.cfo, which is checked."

  - "ASSET LIFE, 8 YEARS BLANKET vs COMPONENT REALITY — REVIEWED, NOT CHANGED (F-228, physics audit isp_levy__physics__2026-08-03.md). asset_useful_life_years (8) is STATED, in the founder's own words about his own observed replacement practice (« ce genre de matériel on le change au bout de huit ans »), and it sets grid.periods entirely. SEC-V26-26 (spec/FACT_BASE.md, in-date 2026-07-27) gives outdoor Sahel radio plant life as 3-5 years and PoE injectors/PSUs as 2-4 years, well short of 8 — but that benchmark is for the OUTDOOR-RADIO share alone, and the 90 000 000 capex is an undecomposed bundle of antennas (outdoor, squarely inside the benchmark), fibre (likely long-lived, outside it) and routers (mixed indoor/outdoor). The founder never gave a cost split across those three, and inventing one to move a sub-cycle replacement inside the horizon would be a fabricated allocation, not a repair. I therefore RETAIN the STATED 8-year figure and the horizon it sets — his own replacement-cash-flow behaviour is the strongest evidence available of what he actually does, composition unknown — and record the risk instead: if the outdoor share needs replacement on a 3-5 year cycle, a real interim capex/PoE event plausibly lands inside this six-year horizon at least once before the single terminal 90 000 000 this file carries at t=5, which would front-load FCFF-down relative to the current all-at-t=5 profile. ELICIT: what does the 8-year figure actually cover — a full antenna/fibre/router refresh, or do you already do component-level swaps (PoE injectors, radios) informally in between that this file's flat opex lines do not capture?"

  - "LARGEST UNVERIFIED INPUT. The regulatory fee RATE. The founder describes the levy, its base and its deductibility with precision but never states the percentage. Everything downstream of trace.regulatory_fee moves with it. This is the first question to put to him, together with the exact statutory base (turnover gross, or net of interconnection and taxes)."

  - "MATERIALITY RANKING — CORRECTED 2026-08-04 (F-226, physics audit isp_levy__physics__2026-08-03.md). This file's own top-tier list of most-material unverified items (regulatory fee rate above; VAT status and replacement-horizon placement below) omitted bandwidth_capacity_ceiling_subscribers, even though the audit's independent derivation makes it plausibly ALREADY BINDING at today's 1,200 subscribers (trace.bandwidth_utilization[0] = 2.28x the central working ceiling) and unbounded in downside, since no upgrade-tier cost exists anywhere in the file to apply if the pipe steps. It belongs alongside the regulatory fee rate at the top of this ranking, not off it — this correction is recorded rather than silently fixed, per this file's own house convention (see the regulatory-fee-rate correction in section F of the passage)."

  - "TAX BASE IN AN UNLEVERED BUILD. Corporate tax is computed on EBIT, not on the founder's actual taxable profit, because FCFF is by construction indifferent to financing. If the network was debt-financed his filed tax bill is lower than the figure in trace.corporate_tax; the difference is the interest tax shield and belongs to the equity-side, not the asset-side, build. He mentions no borrowing."

  - "MINIMUM TAX. Mali applies a minimum corporate tax assessed on turnover, which binds when a company is loss-making or barely profitable. EBIT is comfortably positive in every modelled period, so the minimum regime does not bind here and is not modelled. It would need to be reinstated in any downside case."

  - "VAT / TVA — DEFERRED. The founder frames his fiscal burden as exactly two stacked levies and never mentions TVA. I have therefore treated the 15 000 XOF as revenue accruing to the operator. If TVA is in fact embedded in the retail price, revenue and every line below it would be lower; input TVA on the wholesale bandwidth would partly offset at the margin. This is an ELICITED input, not a modelling choice I am comfortable making silently."

  - "CAPACITY CEILING — QUANTIFIED, STILL UNCOSTED (F-226, repaired 2026-08-04). « Quel que soit le nombre d'abonnés » is taken as stated, so bandwidth cost is flat across a 75% increase in the subscriber base. bandwidth_capacity_ceiling_subscribers now carries a working value (560 subscribers, derived from SEC-V26-25 and shown in the input's own source) instead of an unbounded null, and trace.bandwidth_utilization / trace.bandwidth_headroom_subscribers make the relationship to trace.subs_average a checked, load-bearing quantity every period: utilization 2.28x at t=0 rising to 3.62x at t=5, headroom -715 at t=0 widening to -1465 at t=5 (already negative at t=0, on the central estimate). What remains genuinely undone, because no source in this file prices it: the COST of exceeding the ceiling. If an upgrade tier is triggered, EBITDA and FCFF are lower from that period on, by an amount this file cannot bound without inventing a tariff the founder was never asked for. Still the model's most fragile physical assumption; now it is a visible, load-bearing input rather than a silent one."

  - "GROWTH CAPEX / FOOTPRINT — DEFERRED (F-227, physics audit isp_levy__physics__2026-08-03.md). The only cost tied to the 900 net-add subscribers is the CPE/drop connection fee, which is complete only if every new subscriber is in-fill within a building the network already reaches. subscriber_growth_within_existing_footprint records that assumption explicitly (it was previously implicit and unflagged). If growth in fact extends into new streets or sectors, new antenna/backhaul capacity would be needed — the same physical resource bandwidth_capacity_ceiling_subscribers already shows may be tight — and both EBITDA and FCFF would be lower than modelled. No FACT_BASE benchmark exists for Bamako quartier household penetration to size this, so it is disclosed rather than costed."

  - "TECHNICIAN HEADCOUNT — DEFERRED, NOW TRACED (F-230, repaired 2026-08-04). Held at the stated 6 while the base grows from 1 200 to 2 100 (opening-to-final-closing span: 200 to 350 subscribers per technician). trace.subscribers_per_technician now carries this ratio on the same average (billing) base as revenue, checked every period: 212.5 at t=0 widening to 337.5 at t=5. The ratio is now visible and load-bearing (the input feeds a checked trace row); whether it should also feed a hiring rule and additional wage cost is not modelled, because no hiring rule was stated and no staffing-ratio benchmark exists in FACT_BASE to bound one. If service levels force hiring, cash opex rises and FCFF falls."

  - "CONNECTION COST — SUPPLIED, NOT STATED. 30 000 XOF per new subscriber, expensed rather than capitalised on a low-value threshold policy. This is the one cost line I have added to the founder's enumeration, on the physical ground that 900 new households cannot be connected for nothing given the fibre stops at the buildings. It is flagged ASSUMED throughout. Omitting it would overstate FCFF; capitalising it instead would shift its timing but not its economics materially."

  - "CHURN. The founder states a NET gain of 150. Gross connections must be at least that. Connection cost is applied to net adds only, which understates it if churn is non-zero, and the revenue base is unaffected either way since net adds are what he stated."

  - "RECEIVABLES CONVENTION. A 30-day post-paid receivable is a supplied prior. If the operation is in fact prepaid — common for small quartier ISPs — receivables collapse and deferred revenue appears instead, turning working capital from a use of cash into a source. The direction of the error is therefore known even though its size is not, and this is a question worth asking before the model is used for anything."

  - "FEE BASE FRICTION. The founder says the regulator takes a percentage of « tout ce que j'encaisse » (what he collects) while calling the base his « chiffre d'affaires ». Under a 30-day receivable on a growing book these differ: collections lag accrued turnover. The model assesses the fee on accrued turnover, consistent with how such levies are declared; a strictly collections-based assessment would be marginally smaller. Recorded rather than resolved."

  - "NOMINAL TERMS, NO ESCALATION. Tariff, wages, premises, generator and the wholesale forfait are all frozen at the stated levels. In an environment with positive inflation this flatters real margins on the cost side and erodes them on the price side; the two do not cancel, since the cost base is 100% exposed and the tariff is 100% frozen. Direction only — no escalation case is modelled."

  - "SITE COST vs GENSET FUEL REALITY — REVIEWED, NOT CHANGED (F-229, physics audit isp_levy__physics__2026-08-03.md). site_monthly_cost (800 000 XOF/month, « le local et le groupe électrogène me font huit cent mille par mois tout compris ») is STATED directly by the founder as an all-in figure. SEC-V26-27 (spec/FACT_BASE.md, in-date 2026-07-27) gives 5-10 kVA genset fuel burn under 12h/day of West African load-shedding as 540-1 080 L/month, which at plausible regional diesel prices (~700-850 XOF/L) is roughly 380 000-920 000 XOF/month in FUEL ALONE — a band the stated 800 000 sits at the low end of or inside, before rent or maintenance. I do NOT silently raise the stated figure: the founder gave it directly and in the same breath as the network capex he priced accurately elsewhere, and the benchmark's 12h/day assumes SEVERE load-shedding, which is not established for his specific site — he reports no outage complaints. Retained as STATED. Flagged instead: if his actual load-shedding runs anywhere near the severe end of the documented range, this line plausibly understates true cost, leaving little or nothing for rent and maintenance once fuel is covered. ELICIT: how many hours per day does the site lose grid power, and does the 800 000 XOF include fuel, or is fuel billed and reimbursed separately?"

  - "ASSET DISPOSAL. Nil residual value assumed, so the retirement at t=5 produces neither disposal proceeds nor a book gain or loss and has no tax consequence. If the old antennas have scrap or resale value, FCFF at t=5 would be higher."

  - "NOT MODELLED, NOT MENTIONED. Licence renewal or spectrum fees, universal-service contributions, bad debt and disconnection losses, and any subscriber installation fee charged to the customer. Also FIELD-TECHNICIAN TRANSPORT (F-231, physics audit isp_levy__physics__2026-08-03.md): six technicians visiting subscriber premises for installs and fault calls need transport, most plausibly a motorcycle, and neither site_monthly_cost (explicitly scoped by the founder to « le local et le groupe électrogène » — premises and generator only) nor connection_cost_per_new_subscriber (CPE plus in-building drop, a one-time cost at connection, not a recurring visit cost) covers it. I do not add a costed line for it: unlike connection_cost_per_new_subscriber, which prices a single well-defined physical item (one CPE, one drop), transport cost depends on visit frequency and distance per technician, neither stated by the founder nor available from any FACT_BASE benchmark for ISP field-service routing in a Bamako quartier — SEC-V26-17/18 bound motorcycle life and fuel economy but not trip volume, so a cost line here would be an invented usage pattern dressed as a sourced number. Direction: FCFF is overstated by this omission, materiality low relative to the 9 600 000/year site line (per the audit's own assessment). None of these appear in the founder's account; each would need to be elicited before this model is relied on."

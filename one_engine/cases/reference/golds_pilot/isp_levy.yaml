    source: "The founder states « je paie encore l'impôt sur les sociétés sur le bénéfice qui reste » but not the rate. Prior — Mali's standard corporate income tax (impôt sur les sociétés) rate is 30%. ELICIT: what IS rate do you actually file at, and are you under any reduced or start-up regime?"

id: bamako_neighbourhood_isp_unlevered_fcff
title: "Quartier ISP, Bamako — unlevered FCFF (NOPAT build) over the remaining life of the installed network"
currency: XOF
grid:
  periods: 6
  freq: annual

utterance:
  fr: |
    Je suis fournisseur d'accès internet à Bamako — un petit opérateur de quartier. J'ai monté le
    réseau il y a deux ans : les antennes, la fibre jusqu'aux immeubles, les routeurs, ça m'a coûté
    quatre-vingt-dix millions au total, et ce genre de matériel on le change au bout de huit ans.
    J'ai aujourd'hui mille deux cents abonnés qui paient chacun quinze mille francs par mois, et
    j'en gagne à peu près cent cinquante de plus chaque année. La bande passante que j'achète en
    gros au grossiste national me coûte trois millions cinq cent mille par mois, quel que soit le
    nombre d'abonnés — c'est un forfait de capacité. J'ai six techniciens à cent vingt mille par
    mois, le local et le groupe électrogène me font huit cent mille par mois tout compris.
    Maintenant, la particularité de mon métier : le régulateur des télécoms prélève chaque année une
    redevance de régulation sur mon chiffre d'affaires — un pourcentage de tout ce que j'encaisse,
    que je sois bénéficiaire ou pas. Ça, c'est une charge que je peux déduire. Et après l'avoir
    payée, je paie encore l'impôt sur les sociétés sur le bénéfice qui reste. Donc j'ai deux
    prélèvements empilés : un sur le chiffre d'affaires, un sur le bénéfice.
  en: |
    I am an internet service provider in Bamako — a small neighbourhood operator. I built the network
    two years ago: the antennas, the fibre up to the buildings, the routers; it cost me ninety million
    in total, and that kind of equipment gets replaced after eight years. Today I have one thousand
    two hundred subscribers each paying fifteen thousand francs a month, and I gain roughly one
    hundred and fifty more every year. The bandwidth I buy wholesale from the national wholesaler
    costs me three million five hundred thousand a month, whatever the number of subscribers — it is
    a capacity package. I have six technicians at one hundred and twenty thousand a month, and the
    premises plus the generator come to eight hundred thousand a month all-in. Now, the peculiarity
    of my trade: the telecoms regulator levies every year a regulatory fee on my turnover — a
    percentage of everything I collect, whether I am profitable or not. That is a charge I can
    deduct. And after paying it, I still pay corporate income tax on the profit that remains. So I
    have two stacked levies: one on turnover, one on profit.


  bandwidth_capacity_ceiling_subscribers:
    value: 560
    unit: subscribers
    prov: ASSUMED
    source: "REPAIRED 2026-08-04 (F-226, physics audit isp_levy__physics__2026-08-03.md). Was tagged ASSUMED_UNBOUNDED with value null -- not one of the six channels spec/GENERATION_PROMPT.md defines (STATED/INFERRED/SOURCED/ELICITED/ASSUMED/DEFAULTED), and a null value breaks rule (c) of that same contract: 'Give the input a working value so the arithmetic runs, and keep the question attached to it.' The null also made the input structurally unable to enter any check -- the E7 dead-lever failure mode, invisible to the machine gate only because the invented tag routed around it instead of ELICITED. Working value derived transparently from SEC-V26-25 (spec/FACT_BASE.md, in-date 2026-07-27): 3,500,000 XOF/month / 655.957 XOF-per-EUR =~ 5,337 EUR/month =~ USD 5,800/month. At SEC-V26-25's USD 50-200/Mbps/month wholesale-IP band that buys roughly 29-116 Mbps, central ~56 Mbps. At SEC-V26-25's 50-150 kbps/subscriber busy-hour demand band, a 56 Mbps pipe supports 56,000/150 =~ 373 to 56,000/50 =~ 1,120 subscribers; taking the demand band's own midpoint (100 kbps/sub) gives the working central estimate of 560 subscribers used here. Crossing both bands end to end spans roughly 193 to 2,320 subscribers -- genuinely wide, which is exactly why this stays ASSUMED (a world prior bounded by a benchmark) rather than SOURCED (a looked-up fact) or a false-precision ELICITED point value. The founder still holds the real answer. QUESTION: how many Mbit/s does your forfait give you, and at how many subscribers do you have to buy the next tier?"
    date: "2026-08-04"

  tariff_vat_status:
    value: unknown
    unit: n/a
    prov: ASSUMED_VAT_EXCLUSIVE
    source: "The founder frames his tax burden as exactly two stacked levies and never mentions TVA. QUESTION: is the 15000 francs the subscriber pays the amount you keep, or is TVA embedded in it and remitted onward?"
    date: "2026-07-25"

  subscriber_growth_within_existing_footprint:
    value: true
    unit: n/a
    prov: ASSUMED
    source: "ADDED 2026-08-04 (F-227, physics audit isp_levy__physics__2026-08-03.md). The model prices only a CPE router and in-building drop for each of the 900 net-add subscribers (connection_cost_per_new_subscriber), which is the correct and complete cost ONLY if every new subscriber is in-fill within a building the network already reaches (« la fibre jusqu'aux immeubles » is stated for the CURRENT footprint, not for wherever growth happens to land). Growing the base 75% is not guaranteed to stay inside that footprint -- new streets or sectors would need new antenna/backhaul capacity, entangled with the same physical resource bandwidth_capacity_ceiling_subscribers already flags as tight (F-226). No FACT_BASE benchmark exists for Bamako quartier household penetration to independently derive a growth-capex figure, so this is recorded as a named, flagged structural assumption -- categorical, changes what the model would need to add if false, not a number any check can bind -- rather than an invented capex line. QUESTION: are the 900 new households you expect to connect inside buildings/streets your network already serves, or does reaching some of them require new antenna sectors or backhaul outside the current footprint?"
    date: "2026-08-04"

passage: |
  ================================================================================
  A. WHAT KIND OF BUSINESS THIS IS, IN ITS OWN NATURAL QUANTITIES
  ================================================================================

  This is a fixed-capacity reseller, not a manufacturer. The natural unit of production is the
  SUBSCRIBER-MONTH: one connected household served for one month, sold at a flat 15 000 XOF. There
  is no bill of materials, no batch, no yield loss. The physical plant — antennas, fibre to the
  buildings, routers — is a single indivisible block bought once and consumed by the passage of
  time, and the principal input (wholesale bandwidth) is bought as a lump: « c'est un forfait de
  capacité », three and a half million a month « quel que soit le nombre d'abonnés ».

  That single fact governs the whole economics. The marginal cost of one more subscriber-month is,
  on the founder's own description, zero at the network level. Every incremental subscriber-month
  drops 15 000 XOF of revenue against no incremental bandwidth, no incremental technician and no
  incremental premises cost — only the regulator takes his slice of it, and then the tax authority
  takes a slice of what is left. The operating leverage is therefore extreme, and the whole
  derivation below is really the arithmetic of a growing numerator over a frozen denominator.

  The only genuinely per-subscriber cost I can see in the physics of the operation is the one the
  founder does not cost: connecting a new household. The fibre already reaches the buildings
  (« la fibre jusqu'aux immeubles »), so a new subscriber inside an already-lit building needs a CPE
  router and a drop from the riser. He adds 150 households a year and cannot do that for nothing. I
  carry this as a flagged ASSUMED cost of 30 000 XOF per new connection, expensed in the year of
  connection under a low-value capitalisation threshold. I flag it loudly rather than omit it,
  because a model in which 900 new households are connected at literally zero cost is not a model of
  this business.

  ================================================================================
  B. HORIZON AND GRID
  ================================================================================

  The founder gives me the two dates I need. The network was built two years ago
  (« J'ai monté le réseau il y a deux ans ») and this class of equipment is replaced after eight
  (« on le change au bout de huit ans »). Remaining life = 8 − 2 = 6 years. That is the natural
  horizon: it is exactly the period over which the installed asset earns, and it terminates at the
  moment the founder himself identifies as the re-investment point.

  Grid: 6 annual periods, t = 0 (the next twelve months, the network's third year) through t = 5
  (the network's eighth year). All flows are annual; the founder's monthly figures are annualised at
  12 months per year.

  The 90 000 000 XOF already spent two years ago is SUNK. It is not an FCFF outflow inside this
  horizon. What it leaves behind is a depreciation shield and a net book value, both of which run
  out precisely at t = 5.

  ================================================================================
  C. THE SUBSCRIBER ENGINE
  ================================================================================

  Opening base 1 200; net adds 150 a year, flat. I roll the base forward and, because the adds
  accrue continuously through the year rather than all on 1 January, I bill on the AVERAGE base
  (mid-period convention, the standard treatment for an evenly-spread subscription cohort). The
  half-add is exactly 75 subscribers, so no rounding is introduced.

    t=0:  opening 1 200  + 150 = closing 1 350  → average (1 200 + 1 350)/2 = 1 275
    t=1:  opening 1 350  + 150 = closing 1 500  → average (1 350 + 1 500)/2 = 1 425
    t=2:  opening 1 500  + 150 = closing 1 650  → average (1 500 + 1 650)/2 = 1 575
    t=3:  opening 1 650  + 150 = closing 1 800  → average (1 650 + 1 800)/2 = 1 725
    t=4:  opening 1 800  + 150 = closing 1 950  → average (1 800 + 1 950)/2 = 1 875
    t=5:  opening 1 950  + 150 = closing 2 100  → average (1 950 + 2 100)/2 = 2 025

  Production in the business's own unit — subscriber-months = average base x 12:

    t=0: 1 275 x 12 = 15 300      t=3: 1 725 x 12 = 20 700
    t=1: 1 425 x 12 = 17 100      t=4: 1 875 x 12 = 22 500
    t=2: 1 575 x 12 = 18 900      t=5: 2 025 x 12 = 24 300

  Over the six years the base grows 75%, from 1 200 to 2 100. Conservation: the 900 subscribers added
  (6 x 150) are exactly the difference between the closing 2 100 and the opening 1 200.

  ================================================================================
  D. REVENUE (IFRS 15 — SERVICE RENDERED OVER TIME)
  ================================================================================

  Internet access is a service transferred over time; revenue is recognised as each month of access is
  delivered. Revenue = subscriber-months x 15 000.

    t=0: 15 300 x 15 000 = 229 500 000
    t=1: 17 100 x 15 000 = 256 500 000
    t=2: 18 900 x 15 000 = 283 500 000
    t=3: 20 700 x 15 000 = 310 500 000
    t=4: 22 500 x 15 000 = 337 500 000
    t=5: 24 300 x 15 000 = 364 500 000

  ================================================================================
  E. THE COST ENGINE
  ================================================================================

  Three of the four cost lines are stated outright and are, on the founder's own testimony,
  independent of volume. I annualise each:

    Wholesale bandwidth   3 500 000 x 12 = 42 000 000 per year, every year
    Technicians           6 x 120 000 x 12 = 720 000 x 12 = 8 640 000 per year, every year
    Premises + generator  800 000 x 12 = 9 600 000 per year, every year   ("tout compris")
    Connections [ASSUMED] 150 x 30 000 = 4 500 000 per year, every year

    Total cash operating cost = 42 000 000 + 8 640 000 + 9 600 000 + 4 500 000 = 64 740 000 per year.

  Because net adds are constant at 150 a year, even the connection line is constant, so the entire
  cash cost base is a flat 64 740 000 across all six periods while revenue rises by 27 000 000 a year.

  The unit economics that follow are the whole story of this business. The bandwidth forfait spread
  over subscriber-months costs 42 000 000 / 15 300 ≈ 2 745 XOF per subscriber-month in the first
  period, and only 42 000 000 / 24 300 ≈ 1 728 by the last — a 37% dilution bought purely by filling
  the same pipe. Against a 15 000 XOF price, the incremental subscriber-month carries no incremental
  network cost at all; only the 1% regulatory slice and, at one remove, corporate tax.

  ================================================================================
  F. THE TWO STACKED LEVIES — THE PECULIARITY OF THE TRADE
  ================================================================================

  The founder is precise about the structure and I model it exactly as he describes it:
  « deux prélèvements empilés : un sur le chiffre d'affaires, un sur le bénéfice », with the first
  deductible against the second (« c'est une charge que je peux déduire. Et après l'avoir payée, je
  paie encore l'impôt sur les sociétés sur le bénéfice qui reste »).

  LEVY 1 — regulatory fee, on turnover, payable « que je sois bénéficiaire ou pas ». It is an
  operating charge, not a tax on income, so under IAS 12 it sits ABOVE the tax line, inside EBITDA.
  Rate ASSUMED at 1% (see inputs). CORRECTED 2026-07-26 (physical audit): this previously called the
  fee rate "the single largest unverified number in the model". That ranking is false. Independently
  verified, the 1% is CORRECT -- the Malian regulator's redevance de regulation is assessed at 1% of
  operator turnover -- and its leverage on the answer is small relative to at least three other
  unverified items in this file: whether the 15,000 retail price is quoted inclusive of VAT, whether
  the replacement outlay belongs inside the horizon at all, and the corporate tax rate. Flagging
  should track materiality; here it was close to inversely proportional to it.

    t=0: 1% x 229 500 000 = 2 295 000      t=3: 1% x 310 500 000 = 3 105 000
    t=1: 1% x 256 500 000 = 2 565 000      t=4: 1% x 337 500 000 = 3 375 000
    t=2: 1% x 283 500 000 = 2 835 000      t=5: 1% x 364 500 000 = 3 645 000

  EBITDA = revenue − cash operating cost − regulatory fee:

    t=0: 229 500 000 − 64 740 000 − 2 295 000 = 162 465 000
    t=1: 256 500 000 − 64 740 000 − 2 565 000 = 189 195 000
    t=2: 283 500 000 − 64 740 000 − 2 835 000 = 215 925 000
    t=3: 310 500 000 − 64 740 000 − 3 105 000 = 242 655 000
    t=4: 337 500 000 − 64 740 000 − 3 375 000 = 269 385 000
    t=5: 364 500 000 − 64 740 000 − 3 645 000 = 296 115 000

  LEVY 2 — corporate income tax on the profit that remains. In an unlevered build the tax base is
  EBIT (no interest by construction), so:

    EBIT = EBITDA − depreciation (11 250 000, derived in section G):

    t=0: 162 465 000 − 11 250 000 = 151 215 000
    t=1: 189 195 000 − 11 250 000 = 177 945 000
    t=2: 215 925 000 − 11 250 000 = 204 675 000
    t=3: 242 655 000 − 11 250 000 = 231 405 000
    t=4: 269 385 000 − 11 250 000 = 258 135 000
    t=5: 296 115 000 − 11 250 000 = 284 865 000

    Corporate tax at 30% of EBIT:

    t=0: 0.30 x 151 215 000 = 45 364 500
    t=1: 0.30 x 177 945 000 = 53 383 500
    t=2: 0.30 x 204 675 000 = 61 402 500
    t=3: 0.30 x 231 405 000 = 69 421 500
    t=4: 0.30 x 258 135 000 = 77 440 500
    t=5: 0.30 x 284 865 000 = 85 459 500

    NOPAT = EBIT − tax = 0.70 x EBIT:

    t=0: 105 850 500      t=3: 161 983 500
    t=1: 124 561 500      t=4: 180 694 500
    t=2: 143 272 500      t=5: 199 405 500

  The stacking is visible in the total-levy line (regulatory fee + corporate tax): 47 659 500 at
  t=0 rising to 89 104 500 at t=5. Note the mechanism the founder half-describes: because the
  regulatory fee is deductible, one franc of fee costs him only 0.70 of a franc net of the tax
  shield. And because the fee sits on turnover rather than profit, it is the one charge that would
  still bite in a bad year — the model never tests that case, since EBIT is positive throughout, but
  the structural asymmetry is real and is what makes his description ("whether I am profitable or
  not") worth preserving.

  ================================================================================
  G. DEPRECIATION AND THE PPE ROLL-FORWARD
  ================================================================================

  Cost 90 000 000, useful life 8 years, nil residual, straight-line:
    annual depreciation = 90 000 000 / 8 = 11 250 000.

  Two years are already consumed, so entering t=0:
    gross cost 90 000 000; accumulated depreciation 2 x 11 250 000 = 22 500 000; NBV 67 500 000.

  Roll-forward (gross, accumulated, net):

    t=0: accum 22 500 000 + 11 250 000 = 33 750 000  → NBV 90 000 000 − 33 750 000 = 56 250 000
    t=1: accum 33 750 000 + 11 250 000 = 45 000 000  → NBV 45 000 000
    t=2: accum 45 000 000 + 11 250 000 = 56 250 000  → NBV 33 750 000
    t=3: accum 56 250 000 + 11 250 000 = 67 500 000  → NBV 22 500 000
    t=4: accum 67 500 000 + 11 250 000 = 78 750 000  → NBV 11 250 000
    t=5: accum 78 750 000 + 11 250 000 = 90 000 000 before the swap → NBV 0 before the swap

  At the end of t=5 the equipment reaches eight years and is replaced. I derecognise the old block —
  gross 90 000 000 out, accumulated depreciation 90 000 000 out, NBV nil, therefore no disposal gain
  or loss and no tax effect — and recognise the replacement at 90 000 000. Because it enters at the
  very end of the period it carries no depreciation charge in t=5.

    t=5 gross:      90 000 000 + 90 000 000 (addition) − 90 000 000 (retirement) = 90 000 000
    t=5 accum dep:  78 750 000 + 11 250 000 (charge)   − 90 000 000 (retired)    = 0
    t=5 NBV:        90 000 000 − 0 = 90 000 000

  Conservation: total depreciation charged across the horizon is 6 x 11 250 000 = 67 500 000, which
  is exactly the opening NBV. The asset is fully consumed by the horizon, by construction.

  ================================================================================
  H. WORKING CAPITAL
  ================================================================================

  Two items, both ASSUMED as to timing since the founder states none.

  RECEIVABLES. Monthly post-paid billing with roughly one month outstanding. I hold the balance at
  one month of the CLOSING run-rate (closing subscribers x 15 000), which is the correct measure of
  the last month billed and not yet collected:

    opening (before t=0): 1 200 x 15 000 = 18 000 000
    t=0: 1 350 x 15 000 = 20 250 000      t=3: 1 800 x 15 000 = 27 000 000
    t=1: 1 500 x 15 000 = 22 500 000      t=4: 1 950 x 15 000 = 29 250 000
    t=2: 1 650 x 15 000 = 24 750 000      t=5: 2 100 x 15 000 = 31 500 000

  PAYABLES. One month of the wholesale bandwidth forfait, settled on ~30-day terms: 3 500 000, and
  because the forfait is flat this balance never moves. Technicians and the premises are paid as
  incurred; the regulatory fee and corporate tax are modelled as settled within the year assessed, so
  neither carries a payable.

    NWC = receivables − payables:
    opening: 18 000 000 − 3 500 000 = 14 500 000
    t=0: 20 250 000 − 3 500 000 = 16 750 000     t=3: 27 000 000 − 3 500 000 = 23 500 000
    t=1: 22 500 000 − 3 500 000 = 19 000 000     t=4: 29 250 000 − 3 500 000 = 25 750 000
    t=2: 24 750 000 − 3 500 000 = 21 250 000     t=5: 31 500 000 − 3 500 000 = 28 000 000

    ΔNWC: 16 750 000 − 14 500 000 = 2 250 000 at t=0, and +2 250 000 in every subsequent period —
    exactly 150 new subscribers x 15 000 of one month's billing. Growth absorbs 2 250 000 a year of
    cash, a trivial 1% of revenue. This is a working-capital-light business: the customer pays
    monthly and the only real supplier bills monthly.

  ================================================================================
  I. THE UNLEVERED BUILD, PERIOD BY PERIOD
  ================================================================================

    FCFF = NOPAT + D&A − ΔNWC − capex

  Capex is zero in t=0..t=4 (the network is already built and paid for) and 90 000 000 at t=5 when
  the eight-year cycle closes.

    t=0:  105 850 500 + 11 250 000 − 2 250 000 − 0          = 114 850 500
    t=1:  124 561 500 + 11 250 000 − 2 250 000 − 0          = 133 561 500
    t=2:  143 272 500 + 11 250 000 − 2 250 000 − 0          = 152 272 500
    t=3:  161 983 500 + 11 250 000 − 2 250 000 − 0          = 170 983 500
    t=4:  180 694 500 + 11 250 000 − 2 250 000 − 0          = 189 694 500
    t=5:  199 405 500 + 11 250 000 − 2 250 000 − 90 000 000 = 118 405 500

  Cumulative unlevered cash generated over the six remaining years of the installed network:
  879 768 000 XOF.

  Read as an operating cash flow statement, the same numbers split as CFO (NOPAT + D&A − ΔNWC) and
  CFI (−capex). CFO rises monotonically from 114 850 500 to 208 405 500 — a 3.6% compound rise in
  subscribers translating into a 12.6% compound rise in operating cash flow, which is the fixed-cost
  leverage of a capacity forfait doing its work. The entire dip in the headline FCFF at t=5 is the
  replacement outlay: the operating engine does not weaken, it re-invests.

  ================================================================================
  J. FRICTIONS I AM NOT FORCING INTO THE TEMPLATE
  ================================================================================

  1. The fee base. The founder says the regulator takes « un pourcentage de tout ce que j'encaisse » —
     of what he COLLECTS — while also calling the base « mon chiffre d'affaires ». With a 30-day
     receivable and a growing book these are not the same number: collections lag accrued turnover.
     I model the fee on accrued turnover, which is what regulatory practice actually assesses, and I
     record the friction rather than paper over it. A strictly collections-based fee would be
     marginally smaller than the one modelled.

  2. The forfait's ceiling. « Quel que soit le nombre d'abonnés » is true of a capacity package only
     up to the capacity. Growing the base 75% on an unchanged pipe is the model's most fragile
     physical assumption. REPAIRED 2026-08-04 (F-226): it is no longer taken at face value with an
     unbounded input -- bandwidth_capacity_ceiling_subscribers now carries a working value derived
     from SEC-V26-25, and trace.bandwidth_utilization makes the ratio to the average subscriber base
     a checked quantity (2.28x at t=0, 3.62x at t=5 on the central estimate). What is still missing is
     the COST of exceeding the ceiling, which no source in this file prices -- see notes.

  3. The replacement outlay at t=5. The founder says the swap happens; the benefit of the new network
     accrues almost entirely outside this horizon. I keep it inside because it is a real asset-side
     cash flow occurring within the modelled window, and I materialise the same period's operating
     flow separately (trace.cfo) so the two effects can be read apart. See notes for a related,
     unresolved question (F-228): whether the blanket 8-year figure hides an earlier component-level
     replacement cycle for the outdoor share of the same capex bundle.

  4. Growth footprint. The only cost tied to the 900 net-add subscribers is the CPE/drop connection
     fee, which assumes every new subscriber is in-fill within a building already reached
     (subscriber_growth_within_existing_footprint, ADDED 2026-08-04, F-227). If growth in fact extends
     into new streets or sectors, new antenna/backhaul capacity would be needed; no benchmark exists to
     size this, so it is disclosed rather than costed.


contract: "v2.6"
id: sorgho_bamako_soudure_2026_27
title: "Sorghum carry trade, Bamako (Mali) - one harvest-to-soudure campaign, unlevered FCFF"
currency: XOF

grid:
  periods: 12
  freq: monthly
  why: |
    HORIZON - one campaign, November 2026 (t=0) to October 2027 (t=11).
    This business is not a continuous operation; it is a single annual carry. The founder does one
    thing per year: he converts cash into 20 tonnes of grain at harvest, holds it through the dry
    season, and converts it back into cash during the soudure. The campaign begins when the harvest
    arrives (November) and is operationally complete when the store is empty (end of August). I run
    to October because that is the last month before the NEXT harvest arrives and the next campaign
    begins - it is the point at which the store returns to the state it was in at t=0, so the
    horizon closes on itself and no terminal value is smuggled in.
    I do NOT extend to a second campaign. The entire margin of this business is a price SPREAD
    (14,500 in, 20,000 out). Nobody - not the founder, not me - can state next year's spread; Sahel
    cereal spreads are driven by the rainy season that has not happened yet. Extending the horizon
    would mean inventing the answer, so the horizon stops where the question stops being answerable.

    FREQUENCY - monthly, and the physics forces it.
    (i) The dominant loss is a storage loss, and a storage loss acts on the quantity ACTUALLY AT
        RISK. The stock is at risk in full for seven months, then drains over three. A quarterly or
        annual grid would charge loss against a stock that is no longer there and would overstate
        the tail - exactly the error the physical-closure rules are written to catch. On this grid
        the campaign loses 564.108766 kg of dry matter, materially less than a flat twelve-month
        charge of 748 kg on the intake, and the difference is visible only because the grid resolves
        the drawdown (check: sum(trace.dm_loss_kg) < sum(trace.dm_added_kg) * dm_loss_12m_pp_bags).
    (ii) The rent is quoted and paid monthly.
    (iii) The selling window the founder actually names is three months long. A grid coarser than
        monthly cannot represent "je les ecoule en trois mois" at all.
    (iv) The working capital - 2,915,000 XOF locked in one room - is the whole economics of this
        business. An annual grid nets the outflow and the inflow into a single number and makes the
        seven-month lock-up, which is the risk being paid for, invisible.

    WHAT THE HORIZON DELIBERATELY LEAVES OPEN - the impot synthetique on 2027 turnover falls due on
    31 March 2028 (ML-V25-06), five months after t=11. It is therefore accrued in NOPAT in the
    months the turnover arises and carried out of the horizon as a liability
    (trace.tax_payable_xof), not paid. A reader who wants the cash-closed view reads
    trace.tax_payable_xof[last] as the amount still owing on the last day of the grid; it is
    materialised as a trace row precisely so that it is not hidden inside a prose remark.

utterance:
  fr: |
    Moi je suis commercant, je fais le sorgho a Bamako. A la recolte, en novembre,
    j'achete deux cents sacs a quatorze mille cinq cents le sac. Je stocke dans mon
    magasin a Bamako. Je paie le magasin trente mille par mois. Je vends pendant la
    soudure, entre juin et aout, a vingt mille le sac. Les deux cents sacs, je les
    ecoule en trois mois. Le transport depuis les zones de production, c'est
    soixante-quinze francs par sac. Je travaille seul.
  en: |
    I'm a trader, I deal in sorghum in Bamako. At harvest, in November, I buy two
    hundred bags at fourteen thousand five hundred a bag. I store them in my
    warehouse in Bamako - thirty thousand a month rent. I sell during the lean
    season, June to August, at twenty thousand a bag. The two hundred bags I sell
    off over three months. Transport from the production zones is seventy-five
    francs a bag. I work alone.

inputs:

  # ---------------------------------------------------------------- STATED
  bags_purchased:
    value: 200
    unit: bags
    prov: STATED
    source: "\"j'achete deux cents sacs\" / \"I buy two hundred bags\""
    date: 2026-07-27
  purchase_price_xof_per_bag:
    value: 14500
    unit: XOF per bag
    prov: STATED
    source: "\"a quatorze mille cinq cents le sac\" / \"at fourteen thousand five hundred a bag\""
    date: 2026-07-27
  price_per_bag_xof:
    value: 20000
    unit: XOF per bag
    prov: STATED
    source: "\"Je vends pendant la soudure, entre juin et aout, a vingt mille le sac\""
    date: 2026-07-27
  transport_xof_per_bag:
    value: 75
    unit: XOF per bag
    prov: STATED
    source: "\"Le transport depuis les zones de production, c'est soixante-quinze francs par sac\". Carried at the founder's own figure in the base case. See notes finding F1 - this figure cannot be road freight from a production zone, and the input is retained as a STATED BELIEF about his business, not as a verified fact about the world."
    date: 2026-07-27
  rent_xof_per_month:
    value: 30000
    unit: XOF per month
    prov: STATED
    source: "\"Je paie le magasin trente mille par mois\""
    date: 2026-07-27
  bags_claimed_sold:
    value: 200
    unit: bags
    prov: STATED
    source: "\"Les deux cents sacs, je les ecoule en trois mois\" - the founder's claim that the quantity leaving equals the quantity entering. Retained as a separate named input BECAUSE it is the claim the physical balance falsifies; it is never used to compute revenue."
    date: 2026-07-27
  selling_months_count:
    value: 3
    unit: months
    prov: STATED
    source: "\"je les ecoule en trois mois\", window named as \"entre juin et aout\""
    date: 2026-07-27
  staff_count:
    value: 0
    unit: employees
    prov: STATED
    source: "\"Je travaille seul\" / \"I work alone\" - no payroll, therefore no INPS/AMO employer charges (ML-TAX-04) and no SMIG floor (ML-TAX-05) enter this model."
    date: 2026-07-27

  # ---------------------------------------------------------------- INFERRED
  first_selling_period_index:
    value: 7
    unit: 0-based period index
    prov: INFERRED
    source: "Grid starts at November (t=0). November=0, December=1, January=2, February=3, March=4, April=5, May=6, June=7. The founder names June as the first selling month, so t=7. No new information."
    date: 2026-07-27
  last_selling_period_index:
    value: 9
    unit: 0-based period index
    prov: INFERRED
    source: "first_selling_period_index + selling_months_count - 1 = 7 + 3 - 1 = 9 (August). No new information."
    date: 2026-07-27
  storage_months_before_first_sale:
    value: 7
    unit: months
    prov: INFERRED
    source: "Purchase at t=0 (November), first sale at t=7 (June): the grain is held with no withdrawals through periods 0 to 6 inclusive. Entailed by the two dates the founder gave."
    date: 2026-07-27
  handlers_per_sack:
    value: 2
    unit: persons
    prov: INFERRED
    source: "Smallest integer n such that n * ilo_max_manual_weight_kg >= bag_weight_kg, i.e. ceil(100/55) = 2. Deductive given bag_weight_kg and the ILO limit; carries no new information."
    date: 2026-07-27

  # ---------------------------------------------------------------- SOURCED (fiscal / accounting)
  accounting_framework:
    value: AUDCIF
    unit: framework
    prov: SOURCED
    source: "Mali is an OHADA member state; a Malian trader keeps accounts under the revised SYSCOHADA/AUDCIF, which is IAS/IFRS-aligned for inventory measurement (cost of purchase plus costs of bringing inventories to their present location and condition; storage costs excluded unless necessary before a further production stage)."
    authority: "OHADA, Acte uniforme relatif au droit comptable et a l'information financiere (AUDCIF) / SYSCOHADA revise, adopted 26 January 2017, effective 1 January 2018 - https://www.ohada.org/en/ohada-accounting"
    verified: 2026-07-27
    fact_id: ML-V25-01
  tax_regime:
    value: impot_synthetique
    unit: regime
    prov: SOURCED
    source: "The founder is an exploitant individuel (\"Je travaille seul\", no company mentioned) whose campaign turnover of 3,828,290.164979 XOF sits far below the entry threshold on either published reading of it. He therefore falls in the impot synthetique regime, not the reel/IS regime; IS at 30% (ML-TAX-02) and the IMF at 1% (ML-TAX-03) are NOT applicable and do not enter this model. Regime eligibility is asserted in checks."
    authority: "Republique du Mali, Code General des Impots, regime de l'Impot Synthetique (Titre III, art. 70 et suivants); Direction Generale des Impots du Mali, 'Les types d'entreprises et les regimes d'imposition' - https://www.dgi.gouv.ml/les-types-dentreprises-et-les-regimes/"
    verified: 2026-07-27
    fact_id: ML-V25-02
  impot_synthetique_rate:
    value: 0.03
    unit: fraction of annual turnover excluding tax
    prov: SOURCED
    source: "3% of annual turnover HT, turnover-proportional and NOT a bracket forfait (ML-TAX-01). It is liberatoire: it discharges the BIC and all direct and indirect taxes of Titles I and II of the CGI - so no separate patente, no separate BIC, no TVA on sales enters the model. Registration duties and impot sur les revenus fonciers are outside its scope, but the founder rents rather than owns, so neither arises for him."
    authority: "Direction Generale des Impots du Mali, 'Les types d'entreprises et les regimes d'imposition' - https://www.dgi.gouv.ml/les-types-dentreprises-et-les-regimes/ ; Republique du Mali, Code General des Impots, art. 70"
    verified: 2026-07-27
    fact_id: ML-V25-03
  impot_synthetique_threshold_xof:
    value: 50000000
    unit: XOF of annual turnover excluding tax
    prov: SOURCED
    source: "Entry ceiling for the regime. The two published statements of this figure differ - the CGI art. 70 text is cited at 30,000,000 XOF and the DGI web page at 50,000,000 XOF (annex row ML-TAX-01 flags the same divergence). I do not need to adjudicate it: campaign turnover of 3,828,290.164979 XOF is an order of magnitude below the LOWER of the two, so the regime holds under either reading. I carry the higher published figure and assert the eligibility margin in checks."
    authority: "Direction Generale des Impots du Mali, 'Les types d'entreprises et les regimes d'imposition' - https://www.dgi.gouv.ml/les-types-dentreprises-et-les-regimes/ ; Republique du Mali, Code General des Impots, art. 70"
    verified: 2026-07-27
    fact_id: ML-V25-04
  vat_rate_on_sales:
    value: 0
    unit: fraction
    prov: SOURCED
    source: "No TVA is charged on these sales: the impot synthetique is liberatoire of the indirect taxes of Titles I and II, and unprocessed cereals sit in the exoneration list in any case. Turnover HT therefore equals turnover TTC and the tax base needs no gross-up."
    authority: "Republique du Mali, Code General des Impots - liberatoire scope of the impot synthetique (Titre III, art. 70 et suivants) and exonerations de TVA (art. 195); Direction Generale des Impots du Mali - https://www.dgi.gouv.ml/"
    verified: 2026-07-27
    fact_id: ML-V25-05
  impot_synthetique_deadline:
    value: "31 mars de l'annee suivant l'annee d'imposition"
    unit: statutory date
    prov: SOURCED
    source: "The tax on calendar-2027 turnover (all three selling months fall in 2027) is payable by 31 March 2028, which is outside this 12-period grid. This is why trace.tax_paid_xof is zero throughout and the charge accumulates in trace.tax_payable_xof."
    authority: "Republique du Mali, Livre de Procedures Fiscales, art. 259; Direction Generale des Impots du Mali, echeance notice for 31 March - https://www.dgi.gouv.ml/"
    verified: 2026-07-27
    fact_id: ML-V25-06

  # ---------------------------------------------------------------- SOURCED (physical / engineering)
  dm_loss_12m_pp_bags:
    value: 0.0425
    unit: fraction of dry weight lost over 12 months
    prov: SOURCED
    source: "Measured grain weight loss for SORGHUM stored in ordinary woven-polypropylene bags under ambient conditions for 12 months in Burkina Faso - 4.25% weight loss and 16.83% damaged grains, against 0.35% and 0.57% for hermetic PICS bags in the same trial. Burkina Faso is the closest published analogue to a Bamako magasin: same Sudano-Sahelian climate, same crop, same bag. Insects recovered were Rhyzopertha dominica, Sitophilus zeamais, Tribolium castaneum and Oryzaephilus mercator. This is a DRY-WEIGHT loss - the destruction of substance - and is measured net of moisture, consistent with ML-SEC-02; the moisture channel is therefore modelled separately and must not be double counted."
    authority: "Waongo A, Traore F, Ba MN, et al., 'Effects of PICS bags on insect pests of sorghum during long-term storage in Burkina Faso', Journal of Stored Products Research, 2019;83:261-266, doi:10.1016/j.jspr.2019.07.010"
    verified: 2026-07-27
  dm_loss_rate_monthly:
    value: 0.0036125886704025945
    unit: fraction of dry matter at risk, per month
    prov: SOURCED
    source: "The 12-month benchmark expressed as a compounding monthly hazard so that it can act on the stock actually at risk: 1 - (1 - 0.0425)^(1/12). Compounding rather than a flat 1/12 charge is the whole point - the store drains from t=7, and a flat charge would keep destroying grain that has already been sold."
    authority: "Derived from Waongo A et al. 2019, Journal of Stored Products Research 83:261-266, doi:10.1016/j.jspr.2019.07.010; band corroborated by APHLIS, which models the storage stage alone at 2-5% and all stages at 11.1% for Mopti"
    verified: 2026-07-26
    fact_id: ML-SEC-02
  aphlis_storage_stage_loss_low:
    value: 0.02
    unit: fraction
    prov: SOURCED
    source: "Lower bound of the APHLIS storage-stage loss band for sorghum, used as a corroboration envelope for dm_loss_12m_pp_bags. APHLIS measures dry-weight loss and explicitly excludes moisture."
    authority: "APHLIS (African Postharvest Losses Information System), sorghum loss profiles - https://www.aphlis.net/"
    verified: 2026-07-26
    fact_id: ML-SEC-02
  aphlis_storage_stage_loss_high:
    value: 0.05
    unit: fraction
    prov: SOURCED
    source: "Upper bound of the APHLIS storage-stage band. The Waongo 12-month PP-bag figure of 4.25% sits inside this band, which is why I use it as the base case rather than the much higher untreated figures observed in hot-arid smallholder trials (13.8% at 24 weeks and 8.2% at 32 weeks untreated, Mubayiwa et al. 2021)."
    authority: "APHLIS - https://www.aphlis.net/ ; cross-checked against Mubayiwa M, Mvumi BM, Stathers T, Mlambo S, Nyabako T, 'Field evaluation of hermetic and synthetic pesticide-based technologies in smallholder sorghum grain storage in hot and arid climates', Scientific Reports 2021;11:3692, doi:10.1038/s41598-021-83086-3"
    verified: 2026-07-26
    fact_id: ML-SEC-02
  specific_volume_m3_per_tonne:
    value: 1.80
    unit: m3 per tonne
    prov: SOURCED
    source: "FAO specific volume for BAGGED sorghum - the space a tonne occupies as a stack of sacks, inclusive of stacking voids, not the loose bulk density of the grain (which is ~720-812 kg/m3, i.e. ~1.3 m3/t before bag and stack voids). Using the loose figure would understate the store required by about a third."
    authority: "FAO, 'Grain storage techniques - Storage at farm/village level and in warehouses: Modern warehouses', Table 6.1 - https://www.fao.org/4/t1838e/T1838E16.htm"
    verified: 2026-07-27
  max_stack_height_pp_m:
    value: 3.0
    unit: metres
    prov: SOURCED
    source: "FAO limit for sacks of woven polypropylene, which slide against one another; jute may go to 6 m. Malian cereal sacks are predominantly woven PP, so 3 m is the governing limit. FAO additionally requires 1 m clearance between stacks and walls, 1 m below roof frames and a handling lane of at least 2 m - allowed for in the floor-area reasoning in the passage rather than in the check, which tests the binding volumetric constraint."
    authority: "FAO, 'Grain storage techniques - Modern warehouses' - https://www.fao.org/4/t1838e/T1838E16.htm"
    verified: 2026-07-27
  ilo_max_manual_weight_kg:
    value: 55
    unit: kg
    prov: SOURCED
    source: "Indicative maximum weight for manual transport by one adult male worker in optimal conditions. A nominal 100 kg cereal sack is 1.82 times this. This is the constraint that the phrase \"Je travaille seul\" collides with - see finding F2."
    authority: "ILO Recommendation No. 128 (Maximum Weight Recommendation, 1967), accompanying ILO Convention No. 127 - https://www.ilo.org/dyn/normlex/en/f?p=NORMLEXPUB:12100:0::NO::P12100_ILO_CODE:C127"
    verified: 2026-07-27
  freight_benchmark_xof_per_tonne_km:
    value: 29.2
    unit: XOF per tonne-kilometre
    prov: SOURCED
    source: "Derived from the quoted road tariff Dakar-Bamako of 36,500 XOF per tonne over a road distance of approximately 1,250 km (36,500 / 1,250 = 29.2). Corroborated by Dakar-Kayes at 22,000 XOF/t over ~800 km = 27.5 XOF/t-km. This is deliberately a CONSERVATIVE benchmark for the founder's claim: it is a long-haul international corridor rate, and short domestic hauls are dearer per tonne-kilometre than long ones, not cheaper. If the founder's stated transport cost fails against this benchmark it fails against any."
    authority: "Trade-quoted West Africa road freight tariffs, Dakar-Bamako and Dakar-Kayes corridors, EspaceAgro transport listings - https://www.espaceagro.com/transport-dakar-bamako/exp-transport-dakar-bamako.html ; corroborating context in Banque africaine de developpement, 'Mali - Note sur le secteur des transports'"
    verified: 2026-07-27
  bamako_rh_min_pct:
    value: 16
    unit: percent relative humidity, monthly mean
    prov: SOURCED
    source: "Driest month (February) in Bamako. Feeds the moisture prior: sorghum equilibrium moisture content at 25 C is about 7.3% at 20% RH and 8.6% at 30% RH, so bagged grain in an unconditioned Bamako magasin is pulled well below its intake moisture through the harmattan."
    authority: "Bamako climate normals, annual mean relative humidity 42.8%, monthly range 16% (February) to 74% (August) - weather-and-climate.com / Climates to Travel, Bamako - https://www.climatestotravel.com/climate/mali/bamako"
    verified: 2026-07-27
  bamako_rh_max_pct:
    value: 74
    unit: percent relative humidity, monthly mean
    prov: SOURCED
    source: "Wettest month (August), inside the selling window. Sorghum EMC at 25 C is about 12.0% at 60% RH and 13.8% at 70% RH, so the grain re-absorbs water during the soudure. This is why the net moisture channel over the campaign is small and, in a wet August, could reverse sign."
    authority: "Bamako climate normals - https://www.climatestotravel.com/climate/mali/bamako ; sorghum EMC table, University of Florida IFAS extension AE44, 'Grain sorghum: Harvesting, Drying and Storage', Table 4 - https://ufdcimages.uflib.ufl.edu/IR/00/00/45/15/00001/AE11400.pdf"
    verified: 2026-07-27
  safe_storage_moisture_12m_frac:
    value: 0.12
    unit: fraction, wet basis
    prov: SOURCED
    source: "Extension standard: sorghum to be held in storage for 12 months should be dried below 12% moisture. Used to anchor the intake-moisture prior at the top of the safe band, which is the conservative choice for a trader buying at harvest from a sun-dried threshing floor."
    authority: "University of Arkansas Division of Agriculture, Cooperative Extension Service, 'On-Farm Grain Sorghum Drying and Storage' - https://www.uaex.uada.edu/farm-ranch/crops-commercial-horticulture/Grain_drying_and_storage/sorghum_drying_and_storage.aspx ; University of Georgia CAES, 'Grain Sorghum: Harvesting, Drying and Storing', C-1017"
    verified: 2026-07-27

  # ---------------------------------------------------------------- ELICITED
  bag_weight_kg:
    value: 100
    unit: kg per bag
    prov: ELICITED
    question: "Votre sac de sorgho, c'est bien le sac de cent kilos, ou vous achetez au sac de cinquante ?"
    range: {low: 50, high: 100}
    materiality: medium
    source: "Base case 100 kg - the standard Malian cereal sack, and the only reading the founder's own prices survive: 14,500 / 100 kg = 145 XOF/kg at harvest and 20,000 / 100 kg = 200 XOF/kg during the soudure, both squarely inside observed Malian sorghum price levels. A 50 kg sack would imply 290 XOF/kg AT HARVEST, above the lean-season retail price, which is impossible. Note that this input barely moves FCFF (revenue is quoted per sack, so the price per kg moves inversely) - what it moves decisively is the store-capacity test and the manual-handling test, which is why the ranking is medium and not high."
  moisture_in_frac:
    value: 0.12
    unit: fraction, wet basis
    prov: ELICITED
    question: "Le sorgho que vous achetez en novembre, il a deja seche au soleil sur l'aire de battage, ou il sort tout juste du champ ?"
    range: {low: 0.10, high: 0.14}
    materiality: medium
    source: "Base case 12% w.b. - the top of the safe band for grain to be held twelve months (safe_storage_moisture_12m_frac). This is the CONSERVATIVE choice in the direction that matters: it maximises the water bought and paid for, and therefore maximises the weight the grain can shed in store. Sahelian harvest-time grain in the harmattan is often drier than this, in which case the moisture channel shrinks."
  moisture_out_frac_question_placeholder:
    value: "see moisture_out_frac (ASSUMED)"
    unit: note
    prov: DEFAULTED
    source: "Placeholder kept only to make explicit that the OUTTURN moisture is deliberately NOT elicited - the founder has no moisture meter and could not answer it. It is tagged ASSUMED below, which is a weaker claim, and the empirical question that a founder CAN answer about the same physics is the one attached to sale_basis."
    date: 2026-07-27
  sourcing_distance_km:
    value: 160
    unit: km
    prov: ELICITED
    question: "Vos deux cents sacs, vous les achetez ou exactement - a Dioila, a Koutiala, a Segou ? Et c'est a combien de kilometres de votre magasin ?"
    range: {low: 120, high: 380}
    materiality: low
    source: "Base case 160 km, the approximate road distance to Dioila (Koulikoro), which is the LARGEST sorghum-producing cercle in Mali and the nearest of the main zones to Bamako. Koutiala and Sikasso are 370-375 km. I take the SHORTEST plausible haul deliberately, because it is the reading most favourable to the founder's stated transport cost: if his 75 XOF/bag fails the freight test even at 160 km, the finding is robust at every other sourcing point. It does not move base-case FCFF (transport is carried at his stated figure), which is why the ranking is low - it moves the finding, not the number."
  manutention_xof_per_bag:
    value: 0
    unit: XOF per bag handled
    prov: ELICITED
    question: "Quand le camion arrive et quand vous videz le magasin, qui porte les sacs - vous payez des manoeuvres, et c'est combien par sac ?"
    range: {low: 0, high: 200}
    materiality: medium
    source: "Base case 0 - the OMITTING choice. The founder listed purchase, rent and transport as his costs and said he works alone; taking him at his word means porterage is either done by him or absorbed by the counterparties' own porters. But a 100 kg sack cannot lawfully or physically be moved by one man (finding F2), so a non-zero answer here is more likely than not. Wired into trace.handling_xof through trace.bags_handled, so a different answer changes EBITDA on the 391.41450824894 sack-movements the campaign actually requires."
  store_floor_area_m2:
    value: 25
    unit: m2
    prov: ELICITED
    question: "Votre magasin, il fait combien de metres sur combien - et la hauteur sous plafond, c'est combien ?"
    range: {low: 12, high: 40}
    materiality: low
    source: "Base case 25 m2, back-solved from the rent: 30,000 XOF/month against observed Bamako commercial rents of roughly 1,000-1,500 XOF/m2/month at the bottom of the market (formal warehouses in the zone industrielle run 1,463-2,500 XOF/m2/month; small magasins are advertised from 30,000 XOF/month). The stack needs 12 m2 of footprint at the FAO 3 m polypropylene limit, so 25 m2 accommodates it with the FAO clearances. Ranked low because it moves no cash line - it is the rule-(c) feasibility test, and it passes."
  rent_months_paid:
    value: 12
    unit: months
    prov: ELICITED
    question: "Le magasin, vous le louez toute l'annee, ou seulement les mois ou vous avez du grain dedans ?"
    range: {low: 10, high: 12}
    materiality: medium
    source: "Base case 12 - the CONSERVATIVE choice. A commercial lease in Bamako runs the year; a trader who gave up the store in September would have nowhere to put the November harvest. The trace consequently charges rent in September and October (t=10, t=11) against an empty store, which is a real cost of holding the option on next year's campaign and is shown as such rather than netted away."
  buyer_credit_days:
    value: 0
    unit: days
    prov: ELICITED
    question: "Vos acheteurs pendant la soudure, ils payent cash a l'enlevement, ou vous leur faites credit - et sur combien de jours ?"
    range: {low: 0, high: 45}
    materiality: low
    source: "Base case 0 - cash on collection, the omitting choice and the standard for wholesale cereal sales at the Bamako marches de gros. Ranked low for THIS horizon specifically: sales end in August and the grid runs to October, so credit of any plausible length shifts cash inside the window and nets out of sum(fcff). It would matter on a shorter horizon."
  supplier_credit_days:
    value: 0
    unit: days
    prov: ELICITED
    question: "Les deux cents sacs en novembre, vous les payez comptant au moment de l'enlevement, ou le fournisseur vous laisse un delai ?"
    range: {low: 0, high: 30}
    materiality: low
    source: "Base case 0 - cash at harvest, the conservative choice and the norm (sellers at harvest want cash). This is the input that sets how much of the 2,915,000 XOF the trader must actually find on day one; on this horizon it shifts timing only."
  dunnage_capex_xof:
    value: 0
    unit: XOF
    prov: ELICITED
    question: "Dans le magasin, les sacs sont poses directement par terre, ou vous avez des palettes ou des rondins en dessous - et c'est vous qui les avez achetes ?"
    range: {low: 0, high: 60000}
    materiality: low
    source: "Base case 0 - the omitting choice: the founder describes a rented room and no equipment of any kind, and this is a pure trader with no vehicle, no processing and no staff. Wired into trace.capex_xof and, via dunnage_life_months, into trace.depreciation_xof, so a positive answer activates both the capex and the D&A terms of the FCFF build, which are otherwise structurally zero for this business. The physical point stands regardless of the answer: sacks in direct contact with a concrete or earth floor wick ground moisture into the bottom course, and that is a loss channel the base-case rate does not separately carry."
  storage_protection:
    value: "untreated woven-polypropylene sacks"
    unit: categorical
    prov: ELICITED
    question: "Quand vous rentrez le grain en novembre, vous mettez quelque chose dedans contre les charancons - de la poudre type Actellic, des comprimes sous bache - ou vous le laissez tel quel ?"
    range: {low: "untreated woven-PP sacks stacked on the floor", high: "pirimiphos-methyl protectant dust and/or hermetic liners, stacked on dunnage"}
    materiality: high
    source: "Base case untreated - the omitting choice (he named no chemical and no treatment cost) and also the conservative one, since the avoided treatment cost is an order of magnitude smaller than the avoided loss. This input is CATEGORICAL and STRUCTURAL: its answer selects which sourced loss rate governs, and the published spread is very wide - 0.35% over 12 months for hermetic storage against 4.25% for untreated woven PP in the same Burkina trial, and 7.7-13.8% in untreated hot-arid smallholder trials. It therefore cannot be wired to a single arithmetic check; it changes which number dm_loss_12m_pp_bags takes, and every downstream mass and money row with it."
  sale_basis:
    value: "weighed - paid on delivered weight"
    unit: categorical
    prov: ELICITED
    question: "Au mois d'aout, quand vous videz le magasin, sortez-vous bien deux cents sacs pleins - et l'acheteur les passe-t-il a la bascule, ou il vous paie vingt mille le sac sans peser ?"
    range: {low: "au sac, sans peser - the nominal sack trades as a unit", high: "pese a la bascule - paid on actual delivered weight"}
    materiality: high
    source: "Base case: paid on actual delivered weight at 200 XOF/kg, the conservative reading and the one consistent with Bamako wholesale practice, where the marches de gros weigh. This is the single most informative question in the set - it is a direct empirical test of the entire loss model, because the founder can simply count the full sacks that come out of his store. It is STRUCTURAL: if the sack trades as a nominal unit regardless of contents, the physical loss is real but is borne by the buyer, revenue reverts to 200 sacks x 20,000, and the transformation balance stops feeding the revenue line while remaining true of the grain."
  purchase_price_basis:
    value: "rendu Bamako - delivered to the warehouse"
    unit: categorical
    prov: ELICITED
    question: "Les quatorze mille cinq cents, c'est le prix rendu a votre magasin a Bamako, ou c'est ce que vous payez au village avant de charger le camion ?"
    range: {low: "bord champ / marche de collecte - ex-works, freight still to pay", high: "rendu magasin Bamako - freight already inside the price"}
    materiality: high
    source: "Base case delivered-Bamako. This is the only reading under which the founder's stated 75 XOF/bag is coherent (see finding F1), and it is corroborated by the price level: 145 XOF/kg is a Bamako wholesale harvest level, not a farmgate level. It is STRUCTURAL rather than a value: if the answer is ex-works, an entire freight leg of several hundred XOF per bag is missing from the cost base and must be added to inventory cost, which changes the ladder rather than a coefficient. Ranked high because it is the largest single un-modelled amount in the utterance."
  tax_registration_status:
    value: "registered - impot synthetique declared"
    unit: categorical
    prov: ELICITED
    question: "Vous avez un NIF et vous declarez l'impot synthetique chaque annee, ou vous n'etes pas encore inscrit ?"
    range: {low: "not registered - outside the declarative net", high: "registered with a NIF, impot synthetique declared annually"}
    materiality: high
    source: "Base case registered, which is the CONSERVATIVE choice because it charges the tax. STRUCTURAL: a non-registered informal trader pays no impot synthetique at all (though he typically pays municipal market tickets instead, which this model does not carry), so the answer removes or retains a whole line rather than scaling one. Ranked high: the charge is 114,848.704949 XOF against a post-tax campaign result of 438,441.460029 XOF."

  # ---------------------------------------------------------------- ASSUMED
  moisture_out_frac:
    value: 0.11
    unit: fraction, wet basis
    prov: ASSUMED
    source: "Prior, not a measurement, and not obtainable from the founder (he has no moisture meter) nor from any published Bamako-magasin outturn series I could find. Reasoning: sorghum EMC at 25 C is roughly 7.3% at 20% RH and 8.6% at 30% RH, and Bamako runs 16-30% RH from December to April, so a sack stack in an unconditioned magasin is pulled well below its 12% intake moisture through the harmattan; from June the RH climbs to 55-74% and the grain re-absorbs, but a 36 m3 stack re-equilibrates slowly from the surface inward while it is being sold out. A net 1.0 percentage point below intake at the point of sale is the central reading. The sign of this channel is NOT certain: in a wet August a trader can sell grain heavier than he bought it, which is one reason Sahelian traders like to sell late in the rains. Flagged as the weakest single number in this model."
    date: 2026-07-27
  despatch_capacity_bags_per_day:
    value: 20
    unit: bags per day
    prov: ASSUMED
    source: "Prior for what a two-man porter team can load out of a small magasin in a working day without special equipment, allowing for waiting on buyers rather than continuous work. Used only as a headroom test on the selling rate; the test passes by a factor of eight, so the prior is not load-bearing."
    date: 2026-07-27
  dunnage_life_months:
    value: 36
    unit: months
    prov: ASSUMED
    source: "Prior for the useful life of wooden pallets or rondins in a dry Bahamako store. Load-bearing only if dunnage_capex_xof is answered non-zero; at the base case of zero it multiplies nothing."
    date: 2026-07-27

  # ---------------------------------------------------------------- DEFAULTED
  drawdown_pattern:
    value: "equal dry-matter lots across the three selling months, store empty at end of August"
    unit: convention
    prov: DEFAULTED
    source: "The utterance says \"en trois mois\" and names no pattern. Equal lots is the neutral reading. Implemented exactly: the monthly lot W solves A*s^3/(1+s+s^2) where A is the dry matter opening June and s the monthly survival factor, so the store reaches exactly zero at the end of August with three IDENTICAL withdrawals - no rounding remainder and no repeating-decimal three-way split of a fixed total."
    date: 2026-07-27
  loss_before_withdrawal:
    value: "loss charged on opening stock plus additions, before the month's withdrawal"
    unit: convention
    prov: DEFAULTED
    source: "Standard stock-loss convention: grain is at risk for the month before it leaves. The alternative (withdraw first) would exempt each month's sales from that month's exposure. Materialised as trace.dm_at_risk_kg so the convention is visible and assertable rather than buried in an order of operations."
    date: 2026-07-27
  inventory_cost_basis:
    value: "purchase price plus inbound transport; storage and rent expensed as incurred"
    unit: convention
    prov: DEFAULTED
    source: "AUDCIF/IAS 2: cost of inventories comprises purchase cost and the costs of bringing them to their present location and condition, so the 75 XOF/bag inbound transport is capitalised into inventory. Storage costs are excluded from inventory cost unless necessary before a further production stage - a trader storing finished goods is not such a case, so the 30,000 XOF/month rent is expensed monthly and never enters unit cost. This is why unit_cost_xof_per_kg_dm is constant at 165.625 through the whole campaign."
    date: 2026-07-27
  shrinkage_written_off_as_incurred:
    value: "dry-matter loss expensed monthly at unit cost, not absorbed into the cost of units sold"
    unit: convention
    prov: DEFAULTED
    source: "Either treatment gives the same total charge; writing the loss off as it occurs makes it a visible line (trace.shrinkage_xof) instead of an invisible uplift in COGS, and makes the inventory roll-forward assertable. Note that the MOISTURE channel carries NO cost write-off - the dry matter is intact and only water has left - so it appears as revenue foregone, not as expense. Separating the two channels is what makes that distinction possible at all."
    date: 2026-07-27
  working_days_per_month:
    value: 26
    unit: days
    prov: DEFAULTED
    source: "Six-day working week, the standard convention for a Malian market trader."
    date: 2026-07-27
  no_discounting:
    value: "FCFF stated undiscounted, per period, in nominal XOF"
    unit: convention
    prov: DEFAULTED
    source: "The deliverable is the per-period unlevered cash flow, not a valuation. No WACC is asserted and none is needed; a reader who wants a present value supplies their own rate."
    date: 2026-07-27
  unlevered_basis:
    value: "no interest, no debt service, no owner drawings in FCFF"
    unit: convention
    prov: DEFAULTED
    source: "FCFF is by construction asset-side. The founder named no borrowing. Note that this convention hides a real question about the business - where the 2,915,000 XOF of November cash comes from - which is a financing fact, correctly outside an unlevered build, and flagged in notes."
    date: 2026-07-27

passage: |
  ===============================================================================================
  0. WHAT THE BUSINESS IS
  ===============================================================================================
  A one-man arbitrage across a season. The founder buys sorghum when it is cheapest (November,
  at harvest), holds it in a rented room in Bamako, and sells it when it is dearest (June to
  August, the soudure). There is no processing, no vehicle, no staff and no fixed asset. The
  business is therefore, in accounting terms, almost entirely WORKING CAPITAL: cash converts into
  grain, grain sits still for seven months losing substance and water, and grain converts back into
  cash. Everything that determines the answer is either a price the founder stated or a physical
  fact about grain sitting in a hot room, and the second of those he did not state at all.

  ===============================================================================================
  1. UNITS AND THE PHYSICAL BASE
  ===============================================================================================
  The founder's natural quantity is the SAC. I keep it, and carry kilograms alongside, because the
  sac is a NOMINAL unit and the physics acts on mass.

  Bag weight. The standard Malian cereal sack is 100 kg. The founder's own prices confirm it and
  admit no alternative: 14,500 / 100 = 145 XOF/kg at harvest, 20,000 / 100 = 200 XOF/kg in the
  soudure. Both sit inside observed Malian sorghum levels. On a 50 kg sack the harvest price would
  be 290 XOF/kg, i.e. above the lean-season price - a trader buying above his own selling price.
  Base: 100 kg/bag. ELICITED nonetheless, because it is his own operation.

    mass purchased = 200 bags x 100 kg = 20,000 kg = 20.000 tonnes

  Moisture at intake. Grain is bought and sold wet-basis; what is conserved is DRY MATTER. Sorghum
  to be held twelve months should be under 12% moisture (extension standard). I take intake at
  exactly 12.0% w.b., the top of the safe band, which is the conservative choice because it
  maximises the water in what he pays for.

    dry matter in  = 20,000 x (1 - 0.12) = 17,600.000000 kg DM
    water in       = 20,000 x 0.12       =  2,400.000000 kg

  ===============================================================================================
  2. THE TRANSFORMATION, AND WHAT THE FOUNDER'S RATIO IS NET OF   [physical closure rule (a)]
  ===============================================================================================
  The founder hands over an implicit conversion ratio of 1.000: 200 sacks in, 200 sacks out. That
  is not a balance. It is a claim that grain held for up to ten months in an unconditioned room in
  Bamako neither is eaten nor dries. Both are false, and they are DIFFERENT falsehoods that must
  not be conflated:

    CHANNEL 1 - DRY-MATTER LOSS. Insects (Rhyzopertha dominica, Sitophilus zeamais, Tribolium
    castaneum), rodents, mould, spillage, theft. This destroys substance. The measured benchmark
    for SORGHUM in ordinary woven-polypropylene sacks under ambient Sahelian conditions is 4.25%
    weight loss and 16.83% damaged grains over 12 months (Waongo et al. 2019, Burkina Faso), against
    0.35% and 0.57% for hermetic bags in the same trial. That 4.25% sits at the top of the APHLIS
    storage-stage band of 2-5%, and APHLIS measures DRY WEIGHT and excludes moisture. I use it.

    CHANNEL 2 - MOISTURE. Water leaving the grain as it equilibrates with the air. This destroys
    no substance at all, but it destroys SALEABLE WEIGHT, because grain is sold by weight. Bamako
    runs 16-30% relative humidity from December through April; sorghum EMC at those humidities is
    around 7-9%. The stack is pulled below its intake moisture through the harmattan, then partly
    re-wets from June as the RH climbs to 55-74%. Net at the point of sale: 11.0% w.b., one point
    below intake.

  These two must be kept apart. Channel 1 is a COST written off. Channel 2 is REVENUE FOREGONE with
  no cost attached, because the dry matter that remains is intact. Adding a headline "loss %" would
  merge them and get the accounting for both wrong.

  MONTHLY HAZARD. 4.25% over twelve months, expressed so that it acts on the stock actually at risk:

    s = (1 - 0.0425)^(1/12) = 0.9963874113295974          (monthly survival)
    r = 1 - s               = 0.0036125886704025945       (monthly dry-matter loss rate)

  ===============================================================================================
  3. THE STOCK, PERIOD BY PERIOD                                  [physical closure rule (b)]
  ===============================================================================================
  Rule of motion, in dry matter, with the loss charged on the quantity at risk BEFORE withdrawal:

    at_risk[t]  = stock[t-1] + added[t]
    loss[t]     = at_risk[t] x r
    stock[t]    = at_risk[t] - loss[t] - sold[t]

  Periods 0-6 (November to May) have no withdrawals. The stock decays geometrically:

    t=0 Nov  at risk 17,600.000000  loss 63.581561  ->  17,536.418439 kg DM
    t=1 Dec  at risk 17,536.418439  loss 63.351867  ->  17,473.066573
    t=2 Jan  at risk 17,473.066573  loss 63.123002  ->  17,409.943570
    t=3 Feb  at risk 17,409.943570  loss 62.894965  ->  17,347.048606
    t=4 Mar  at risk 17,347.048606  loss 62.667751  ->  17,284.380854
    t=5 Apr  at risk 17,284.380854  loss 62.441358  ->  17,221.939496
    t=6 May  at risk 17,221.939496  loss 62.215784  ->  17,159.723712

  So the store opens June with A = 17,600 x s^7 = 17,159.723712 kg DM.

  THE DRAWDOWN. "Je les ecoule en trois mois", no pattern given, so equal lots. Solving for the
  constant lot W that empties the store at the end of August while the residue keeps decaying:

    A.s^3 - W.s^2 - W.s - W = 0   =>   W = A.s^3 / (1 + s + s^2) = 5,678.630411 kg DM per month

    t=7 Jun  at risk 17,159.723712  loss 61.991023  sold 5,678.630411  ->  11,419.102278
    t=8 Jul  at risk 11,419.102278  loss 41.252520  sold 5,678.630411  ->   5,699.219347
    t=9 Aug  at risk  5,699.219347  loss 20.588935  sold 5,678.630411  ->           0.000000
    t=10 Sep at risk      0         loss  0         sold 0             ->           0
    t=11 Oct at risk      0         loss  0         sold 0             ->           0

  Note what the monthly grid buys here. Total dry-matter destroyed over the campaign is
  564.108766 kg, which is 3.205% of intake - NOT 4.25%. The difference is entirely the drawdown:
  the store is at full risk for seven months, then half, then a fifth. A flat twelve-month charge
  would have destroyed 748.000000 kg of grain that had already been sold. That is the rule-(b)
  error, and it is worth about 30,500 XOF of phantom cost.

  Exposure, cumulated (rule (d)): sum of tonnes at risk across the twelve months = 177.444140
  tonne-months. The store, at 25 m2 and the FAO 3 m polypropylene stack limit, can hold
  25 x 3 / 1.80 = 41.666667 tonnes, i.e. 500.000000 tonne-months over a twelve-month year. The
  campaign consumes 35.5% of what the rented room can physically deliver in a year.

  ===============================================================================================
  4. THE MASS BALANCE, AND HOW MANY SACKS ACTUALLY COME OUT
  ===============================================================================================
  Dry matter closes exactly:   17,600.000000 = 17,035.891234 sold + 564.108766 destroyed + 0 left.

  Converting to the wet mass that actually crosses the scale. Sold grain leaves at 11.0% moisture:

    mass sold per selling month = 5,678.630411 / (1 - 0.11) = 6,380.483608 kg
    total mass sold             = 19,141.450825 kg
    total mass destroyed        =    633.830074 kg   (564.108766 / 0.89 - the sacks-worth that no
                                                      longer exists)
    water evaporated            =    224.719101 kg   (17,600 x (1/0.88 - 1/0.89))

  THE BALANCE SUMS:  19,141.450825 + 633.830074 + 224.719101 = 20,000.000000 kg.  Exactly.

  In the founder's own unit, dividing through by 100 kg:

      200.000000 sacks in  =  191.414508 sacks sold
                            +   6.338301 sacks eaten, spoiled or spilled
                            +   2.247191 sacks' worth of water evaporated

  This is what his ratio of 1.000 is net of. He sells 191.41 sacks, not 200. The shortfall is
  8.585492 sacks - 4.29% of the intake - worth 171,709.835021 XOF of revenue at his own price. He
  is not lying; he is describing sacks he counted going IN and assuming they came OUT.

  Per selling month he shifts 63.804836 sacks, not 66.667.

  ===============================================================================================
  5. DOES THE PLANT FIT THE CLAIM?                                 [physical closure rule (c)]
  ===============================================================================================
  THE STORE - PASSES, tightly.
    FAO specific volume for BAGGED sorghum is 1.80 m3/tonne (not the 1.3 m3/t of loose grain -
    using the loose figure would understate the room by a third).
      peak stack volume = 20.000 t x 1.80 = 36.000000 m3
    Woven-polypropylene sacks may not be stacked above 3 m (they slide; jute may go to 6 m).
      minimum footprint = 36.000000 / 3.0 = 12.000000 m2
    FAO also wants 1 m clearance to walls and a 2 m handling lane, so a single 4 m x 3 m stack
    needs about 6 m x 5 m = 30 m2 of room to be worked properly, or about 20 m2 if he stacks
    against two walls as small traders do. At 30,000 XOF/month against observed Bamako commercial
    rents of roughly 1,000-1,500 XOF/m2/month, the rent buys 20-30 m2. The claim fits the plant.
    The one caveat is ceiling height: a typical small magasin has 3.0-3.5 m walls and FAO wants 1 m
    below the roof frames, so the practical stack is nearer 2.0-2.5 m, pushing the footprint to
    14.4-18 m2. Still inside the room, with little to spare. Hence the elicited question on
    dimensions.

  THE SELLING RATE - PASSES easily.
    63.804836 sacks per month over 26 working days = 2.454 sacks per day. One man with a hand
    truck, or a buyer's pickup, clears that before mid-morning. The three-month selling window is
    not a capacity constraint on this business; it is a market-timing choice.

  THE LIFT - FAILS, and this is a finding, not a rounding.
    The founder says "Je travaille seul". Over the campaign the grain must be handled
    200.000000 sacks IN + 191.414508 sacks OUT = 391.414508 sack-movements, every one of them a
    nominal 100 kg unit. ILO Recommendation No. 128 puts the maximum weight transported manually by
    one adult male at 55 kg. A 100 kg sack is 1.82 times that limit. Working alone cannot mean
    lifting alone: it takes at minimum ceil(100/55) = 2 people per sack, which is exactly how
    100 kg sacks are in fact moved in West African markets - one man loads another's back.
    So EITHER he pays manutentionnaires (a cost he did not name, and which the model currently
    carries at zero), OR the porterage is done by the seller's and the buyer's men and is embedded
    in the 14,500 and the 20,000. Cumulatively (rule (d)), the campaign is 391.414508 assisted
    lifts, well inside 12 x 26 x 20 = 6,240 sack-movements of one-man-plus-helper capacity in a
    year - so the constraint is not TIME, it is the WEIGHT PER LIFT, and no amount of time relaxes
    it. Elicited; see manutention_xof_per_bag.

  THE TRANSPORT - FAILS decisively, and it is the largest un-modelled amount in the utterance.
    75 XOF per 100 kg sack = 750 XOF per tonne. The nearest major sorghum zone to Bamako is Dioila,
    about 160 km; Koutiala and Sikasso are 370-375 km.
      implied rate = 750 / 160 = 4.687500 XOF per tonne-kilometre
    Benchmark: the quoted Dakar-Bamako road tariff is 36,500 XOF/tonne over about 1,250 km =
    29.2 XOF/t-km, and Dakar-Kayes is 22,000 XOF/t over about 800 km = 27.5 XOF/t-km. The founder's
    implied rate is 16.0% of a long-haul international corridor rate - and short domestic hauls
    cost MORE per tonne-kilometre than long international ones, not less. At the benchmark rate, a
    160 km haul is about 467 XOF/sack and a 370 km haul about 1,080 XOF/sack.
    75 XOF/sack is not road freight. It is the order of magnitude of a local cartage or porterage
    fee. The reading that makes his account coherent is that 14,500 is already a DELIVERED-Bamako
    price - which the price level supports, since 145 XOF/kg is a Bamako wholesale harvest level,
    not a farmgate level - and that the 75 is the last mile from the lorry park to his door. If
    that reading is wrong, his cost base is understated by roughly 400-1,000 XOF per sack, i.e. by
    several times the entire rent line. This is the first question to put to him.

  ===============================================================================================
  6. FROM PHYSICS TO MONEY
  ===============================================================================================
  INVENTORY COST (AUDCIF / IAS 2: purchase cost plus costs of bringing to present location and
  condition; storage costs excluded because there is no further production stage):

    purchase        = 200 x 14,500 = 2,900,000 XOF
    inbound freight = 200 x     75 =    15,000 XOF
    inventory cost                 = 2,915,000 XOF
    unit cost       = 2,915,000 / 17,600 kg DM = 165.625000 XOF per kg of DRY MATTER

  Costing per kg of DRY MATTER, not per wet kg, is the step that makes the two loss channels
  behave correctly: the water that evaporates carries no cost with it, because no substance left.

    COGS per selling month  = 165.625000 x 5,678.630411 = 940,523.161886 XOF
    shrinkage, e.g. t=0     = 165.625000 x    63.581561 =  10,530.695974 XOF
    total COGS + shrinkage  = 2,821,569.485657 + 93,430.514343 = 2,915,000.000000 XOF  (closes)

  REVENUE. Base case: the buyer weighs, and pays 20,000 per full 100 kg sack, i.e. 200 XOF/kg.

    revenue per selling month = 200 x 6,380.483608 = 1,276,096.721660 XOF
    campaign turnover HT      = 3,828,290.164979 XOF
    (his own arithmetic would say 200 x 20,000 = 4,000,000 - the gap is the 8.585 lost sacks)

  OPERATING COSTS.
    rent      30,000 XOF x 12 months = 360,000 XOF, charged every month including September and
              October when the store stands empty - he is paying to hold the room for the next
              harvest, and the model shows that rather than netting it away.
    handling  0 in the base case (see the lift finding above).
    labour    0 - "Je travaille seul", so no INPS/AMO employer charges and no SMIG floor.
    D&A       0 - no fixed asset exists. The store is rented, there is no vehicle, no scale, no
              equipment. Capex is 0 and depreciation is 0, and I say so explicitly rather than
              leaving the terms unexplained: for this business the FCFF build reduces to
              NOPAT - dNWC, and the working capital is the whole story.

  TAX. Exploitant individuel, campaign turnover 3,828,290.164979 XOF, far below the regime ceiling
  on either published reading of it (30m in the CGI art. 70 text, 50m on the DGI page). Impot
  synthetique applies at 3% of turnover HT and is liberatoire of the BIC and of all direct and
  indirect taxes of Titles I and II - so no patente, no BIC, no TVA. There is no VAT to gross up
  (turnover HT = turnover TTC).

    tax charge per selling month = 0.03 x 1,276,096.721660 = 38,282.901650 XOF
    campaign charge              = 114,848.704949 XOF

  A friction worth naming: this is called NOPAT, but the tax is a rate on TURNOVER, not on EBIT.
  The effective rate on EBIT is 114,848.704949 / 553,290.164979 = 20.76%, and it would be charged
  in full even if the campaign made a loss. That is a real feature of the regime, not a modelling
  artefact, and it means the tax line here does not behave like an income tax in a sensitivity.

  The charge is payable by 31 March 2028, five months beyond the grid. It is therefore accrued in
  NOPAT in June-August and carried as trace.tax_payable_xof, which reaches 114,848.704949 XOF at
  t=9 and stays there to t=11. Cash tax paid inside the horizon is zero.

  ===============================================================================================
  7. THE LADDER, PERIOD BY PERIOD
  ===============================================================================================
  Periods 0-6 (Nov-May): no revenue, no COGS. EBITDA = -(shrinkage + rent), running from
  -40,530.695974 at t=0 to -40,304.489143 at t=6 as the shrinking stock shrinks its own write-off.
  NOPAT equals EBITDA (no tax, no D&A).

  Periods 7-9 (Jun-Aug), each identical in volume:
    revenue     1,276,096.721660
    - COGS        940,523.161886
    - shrinkage    10,267.263262 (t=7) / 6,832.448544 (t=8) / 3,410.042399 (t=9)
    - rent         30,000.000000
    = EBITDA      295,306.296512 / 298,741.111229 / 302,163.517375
    - tax          38,282.901650
    = NOPAT       257,023.394862 / 260,458.209580 / 263,880.615725
  EBITDA rises across the three months not because anything improves but because the shrinkage
  write-off falls as the store empties - which is precisely the rule-(b) effect made visible.

  Periods 10-11 (Sep-Oct): rent only. EBITDA = NOPAT = -30,000.000000.

  WORKING CAPITAL.
    NWC = inventory + receivables - payables - tax payable
    t=0  inventory 2,904,469.304026, tax payable 0        ->  NWC  2,904,469.304026
    t=6  inventory 2,842,079.239863                       ->  NWC  2,842,079.239863
    t=9  inventory         0.000000, tax payable 114,848.704949 -> NWC -114,848.704949
    t=11 unchanged at -114,848.704949
  The whole business is that first number: 2.9 million XOF converted into a room full of grain in
  one day in November, and released over three months seven months later.

  FCFF = NOPAT + D&A - dNWC - capex, with D&A = capex = 0:
    t=0   -40,530.695974 - 2,904,469.304026 = -2,945,000.000000
    t=1-6 -30,000.000000 each (the shrinkage charge and the inventory release cancel exactly -
          a non-cash write-down cannot be a cash flow, and the model demonstrates it rather than
          asserting it)
    t=7-9 +1,246,096.721660 each  ( = 1,276,096.721660 collected less 30,000 rent )
    t=10-11 -30,000.000000 each

  Independent cash check: FCFF equals cash collected less cash paid, period by period, to within
  5e-10 XOF. Asserted in checks.

  ===============================================================================================
  8. THE ANSWER
  ===============================================================================================
  Sum of FCFF over the twelve periods = 553,290.164979 XOF, which equals campaign EBITDA exactly,
  because the store empties, there is no capex, and no tax is paid inside the window.

  Carried out of the horizon: a tax liability of 114,848.704949 XOF due 31 March 2028. The campaign
  result after that obligation is 438,441.460029 XOF, on capital of 2,915,000 XOF committed in
  November and not fully released until August - a return of 15.04% over roughly nine months of
  lock-up. That is the number to compare against the cost of the money, which the founder did not
  mention and which is the largest thing missing from his account after the freight.

  For orientation, the founder's own arithmetic - 200 sacks x (20,000 - 14,500 - 75), less 360,000
  rent, less 3% of 4,000,000 - gives 605,000 XOF. The 166,558.539971 XOF gap between that and
  438,441.460029 is almost entirely the 8.585 sacks that the physics says never reach the scale.
  Nothing in his description is dishonest. It is simply an account of a trade in which grain does
  not decay, and grain decays.


checks:
  # ---------- conservation: the stock and the transformation
  - "trace.dm_at_risk_kg[t] == trace.dm_stock_kg[t-1] + trace.dm_added_kg[t]"
  - "trace.dm_stock_kg[t] == trace.dm_at_risk_kg[t] - trace.dm_loss_kg[t] - trace.dm_sold_kg[t]"
  - "trace.dm_stock_kg[t] == trace.dm_stock_kg[t-1] + trace.dm_added_kg[t] - trace.dm_loss_kg[t] - trace.dm_sold_kg[t]"
  - "sum(trace.dm_added_kg) == bags_purchased * bag_weight_kg * (1 - moisture_in_frac)"
  - "sum(trace.dm_sold_kg) + sum(trace.dm_loss_kg) + trace.dm_stock_kg[last] == sum(trace.dm_added_kg)"
  - "trace.dm_stock_kg[last] == 0"
  - "trace.mass_out_gross_kg == trace.mass_sold_kg + trace.mass_dm_loss_kg + trace.mass_moisture_kg"
  - "sum(trace.mass_out_gross_kg) == bags_purchased * bag_weight_kg"
  - "(sum(trace.mass_sold_kg) + sum(trace.mass_dm_loss_kg) + sum(trace.mass_moisture_kg)) / bag_weight_kg == bags_purchased"
  - "sum(trace.mass_moisture_kg) * (1 - moisture_in_frac) * (1 - moisture_out_frac) == sum(trace.dm_added_kg) * (moisture_in_frac - moisture_out_frac)"
  - "trace.inventory_value_xof[t] == trace.inventory_value_xof[t-1] + trace.purchase_cost_xof[t] - trace.shrinkage_xof[t] - trace.cogs_xof[t]"
  - "trace.inventory_value_xof[last] == 0"
  - "trace.receivables_xof[t] == trace.receivables_xof[t-1] + trace.revenue_xof[t] - trace.cash_collected_xof[t]"
  - "trace.payables_xof[t] == trace.payables_xof[t-1] + trace.purchase_cost_xof[t] - trace.purchase_paid_xof[t]"
  - "trace.tax_payable_xof[t] == trace.tax_payable_xof[t-1] + trace.tax_charge_xof[t] - trace.tax_paid_xof[t]"
  - "trace.tax_payable_xof[last] == sum(trace.tax_charge_xof)"
  - "cumsum(trace.delta_nwc_xof) == trace.nwc_xof"
  - "sum(trace.cogs_xof) + sum(trace.shrinkage_xof) == bags_purchased * (purchase_price_xof_per_bag + transport_xof_per_bag)"

  # ---------- definition: the ladder
  - "trace.ebitda_xof == trace.revenue_xof - trace.cogs_xof - trace.shrinkage_xof - trace.rent_xof - trace.handling_xof"
  - "trace.ebit_xof == trace.ebitda_xof - trace.depreciation_xof"
  - "trace.nopat_xof == trace.ebit_xof - trace.tax_charge_xof"
  - "trace.nwc_xof == trace.inventory_value_xof + trace.receivables_xof - trace.payables_xof - trace.tax_payable_xof"
  - "trace.fcff_xof == trace.nopat_xof + trace.depreciation_xof - trace.delta_nwc_xof - trace.capex_xof"
  - "trace.fcff_xof == trace.cash_collected_xof - trace.purchase_paid_xof - trace.rent_xof - trace.handling_xof - trace.tax_paid_xof - trace.capex_xof"
  - "sum(trace.fcff_xof) == sum(trace.ebitda_xof) - sum(trace.tax_paid_xof) - sum(trace.capex_xof) - trace.inventory_value_xof[last] - trace.receivables_xof[last] + trace.payables_xof[last]"

  # ---------- driver-bridge: every computed line from its inputs
  - "trace.dm_loss_kg == trace.dm_at_risk_kg * dm_loss_rate_monthly"
  - "trace.mass_sold_kg * (1 - moisture_out_frac) == trace.dm_sold_kg"
  - "trace.mass_dm_loss_kg * (1 - moisture_out_frac) == trace.dm_loss_kg"
  - "trace.mass_out_gross_kg * (1 - moisture_in_frac) == trace.dm_sold_kg + trace.dm_loss_kg"
  - "trace.mass_at_risk_kg * (1 - moisture_in_frac) == trace.dm_at_risk_kg"
  - "trace.bags_sold * bag_weight_kg == trace.mass_sold_kg"
  - "trace.tonnes_at_risk * 1000 == trace.mass_at_risk_kg"
  - "trace.stack_volume_m3 == trace.tonnes_at_risk * specific_volume_m3_per_tonne"
  - "trace.unit_cost_xof_per_kg_dm * bags_purchased * bag_weight_kg * (1 - moisture_in_frac) == bags_purchased * (purchase_price_xof_per_bag + transport_xof_per_bag)"
  - "trace.cogs_xof == trace.unit_cost_xof_per_kg_dm * trace.dm_sold_kg"
  - "trace.shrinkage_xof == trace.unit_cost_xof_per_kg_dm * trace.dm_loss_kg"
  - "trace.revenue_xof * bag_weight_kg == price_per_bag_xof * trace.mass_sold_kg"
  - "sum(trace.purchase_cost_xof) == bags_purchased * (purchase_price_xof_per_bag + transport_xof_per_bag)"
  - "sum(trace.rent_xof) == rent_xof_per_month * rent_months_paid"
  - "trace.handling_xof == manutention_xof_per_bag * trace.bags_handled"
  - "sum(trace.bags_handled) == bags_purchased + sum(trace.bags_sold)"
  - "sum(trace.capex_xof) == dunnage_capex_xof"
  - "sum(trace.depreciation_xof) * dunnage_life_months == dunnage_capex_xof * grid.periods"
  - "trace.receivables_xof * 30 == trace.revenue_xof * buyer_credit_days"
  - "trace.payables_xof * 30 == trace.purchase_cost_xof * supplier_credit_days"
  - "trace.tax_charge_xof == impot_synthetique_rate * trace.revenue_xof"
  - "trace.dm_sold_kg[t] == 0 for t < 7"
  - "trace.revenue_xof[t] == 0 for t < 7"
  - "trace.dm_sold_kg[t] == 0 for t >= 10"

  # ---------- physical closure asserted as arithmetic, not prose
  - "max(trace.stack_volume_m3) <= store_floor_area_m2 * max_stack_height_pp_m"
  - "sum(trace.tonnes_at_risk) <= grid.periods * store_floor_area_m2 * max_stack_height_pp_m / specific_volume_m3_per_tonne"
  - "handlers_per_sack * ilo_max_manual_weight_kg >= bag_weight_kg"
  - "max(trace.bags_sold) <= despatch_capacity_bags_per_day * working_days_per_month"
  - "sum(trace.bags_handled) <= grid.periods * working_days_per_month * despatch_capacity_bags_per_day"
  - "sum(trace.bags_sold) < bags_claimed_sold"
  - "sum(trace.dm_loss_kg) < sum(trace.dm_added_kg) * dm_loss_12m_pp_bags"
  - "sum(trace.dm_loss_kg) >= sum(trace.dm_added_kg) * aphlis_storage_stage_loss_low"
  - "sum(trace.dm_loss_kg) <= sum(trace.dm_added_kg) * aphlis_storage_stage_loss_high"
  - "transport_xof_per_bag * 1000 / bag_weight_kg / sourcing_distance_km < freight_benchmark_xof_per_tonne_km"
  - "sum(trace.revenue_xof) < impot_synthetique_threshold_xof"

  # ---------- non-negativity
  - "min(trace.dm_stock_kg) >= 0"
  - "min(trace.dm_loss_kg) >= 0"
  - "min(trace.inventory_value_xof) >= 0"
  - "min(trace.tax_payable_xof) >= 0"
  - "min(trace.bags_sold) >= 0"
  - "min(trace.stack_volume_m3) >= 0"
  - "min(trace.mass_out_gross_kg) >= 0"

notes:
  findings:
    - id: F1
      title: "The stated transport cost cannot be road freight, and it is the largest un-modelled amount in the utterance"
      text: |
        75 XOF per 100 kg sack is 750 XOF per tonne. Against the nearest major sorghum zone
        (Dioila, about 160 km) that implies 4.6875 XOF per tonne-kilometre. The quoted Dakar-Bamako
        road tariff is 29.2 XOF/t-km and Dakar-Kayes 27.5 XOF/t-km - and those are long-haul
        international corridor rates, which are the CHEAPEST kind per kilometre; short domestic
        hauls cost more, not less. The founder's figure is about a sixth of the most favourable
        benchmark available, at the most favourable sourcing distance available. It is not road
        freight. The reconciling reading, which the price level independently supports (145 XOF/kg
        is a Bamako wholesale harvest level, not a farmgate level), is that 14,500 is already a
        delivered price and the 75 is local cartage from the lorry park. If that reading is wrong,
        a whole freight leg is missing from the cost base. Asserted in checks; question attached to
        purchase_price_basis and sourcing_distance_km. I did NOT quietly add a freight leg: the
        base case runs on the founder's own number, with the discrepancy visible.
    - id: F2
      title: "\"I work alone\" is inconsistent with 100 kg sacks"
      text: |
        The campaign requires 391.414508 sack-movements at a nominal 100 kg each. ILO Recommendation
        No. 128 puts the maximum manual transport weight for one adult male at 55 kg. The binding
        constraint is not time - the selling rate is 2.45 sacks a day against ample capacity - it is
        the weight per lift, and time does not relax it. Either porterage is bought (a cost the
        model currently carries at zero), or it is embedded in the counterparties' prices. Asserted
        in checks via handlers_per_sack.
    - id: F3
      title: "Two hundred sacks in is not two hundred sacks out"
      text: |
        The founder's implicit conversion ratio of 1.000 hides two distinct physical channels. Dry
        matter is destroyed by insects and rodents; water leaves by evaporation. They behave
        completely differently in the accounts - the first is a cost written off against inventory,
        the second is revenue foregone with no cost attached, because nothing was destroyed. The
        campaign closes exactly on 200 sacks in = 191.414508 sold + 6.338301 destroyed + 2.247191
        evaporated. This is the single largest gap between the founder's arithmetic and this model.
        It is also directly testable by him: he can count the full sacks that leave his store.
    - id: F4
      title: "The plant fits - and the monthly grid is what makes the loss honest"
      text: |
        The store passes: 36 m3 of stack, 12 m2 of footprint at the FAO 3 m polypropylene limit,
        against a rent that buys 20-30 m2 at bottom-of-market Bamako rates. The selling rate passes
        by a factor of eight. But the loss only comes out right because the grid resolves the
        drawdown - the store is at full risk for seven months and then empties, so the campaign
        destroys 3.205% of intake dry matter rather than the 4.25% a flat annual charge would
        impose. Asserted directly in checks.
    - id: F5
      title: "The tax is a turnover tax wearing an income tax's clothes"
      text: |
        The build is labelled NOPAT, but the impot synthetique is 3% of turnover, not a rate on
        EBIT, and it is liberatoire of BIC, patente and TVA alike. It would be charged in full on a
        loss-making campaign. The line therefore does not behave like an income tax and should not
        be flexed as one.
  simplifications:
    - "One campaign modelled standalone. In reality the founder buys again in November 2027 while the 2027 tax is still unpaid, so a going-concern view overlaps campaigns. The single-campaign frame is what keeps the model free of invented future price spreads."
    - "A constant monthly dry-matter hazard is used. Insect populations build exponentially, so real loss per month rises through the storage period; a constant rate calibrated to a twelve-month observation slightly front-loads the loss. Direction only - the campaign total is unaffected, the monthly profile is smoothed."
    - "The moisture channel is attributed entirely to the surviving grain (the destroyed dry matter is valued at outturn moisture). This is a bookkeeping convention chosen so that the three-way mass split closes exactly; no physical claim rests on it."
    - "Bags are carried as a continuous quantity. Physically the outturn is a whole number of full sacks plus a part sack; the model keeps kilograms exact rather than forcing an integer and absorbing the remainder. This is the friction between the founder's nominal unit and the scale, and it is left visible rather than papered over."
    - "The three selling months carry identical volumes because the utterance gives no pattern. A trader who reads the market would skew towards August, when soudure prices peak - direction only."
  deferred:
    - "Municipal market tickets and syndicate dues at the marches de gros are outside the liberatoire scope of the impot synthetique and are not modelled. Small, but not zero, and not stated."
    - "No insurance is carried, because none was mentioned. The entire business is 2.9 million XOF of one commodity in one unsprinklered room for ten months - a fire, a flood or a break-in is a total loss. Worth raising with the founder as a risk finding rather than a cost line."
    - "Financing is out of scope for an unlevered build, but the founder did not say where the November cash comes from. For a business whose whole return is a carry, the cost and the availability of that money is the second question after the freight."
    - "Ground-moisture wicking into the bottom course of sacks in direct floor contact is a real, separate loss channel that the Waongo benchmark does not isolate. Attached to the dunnage question rather than given its own rate, because no defensible rate was available."
  what_i_would_ask_first: |
    Three questions, in order, if the founder will only answer three: (1) is the 14,500 rendu Bamako
    or bord champ; (2) when he empties the store in August, how many FULL sacks actually come out,
    and does the buyer weigh; (3) does he put anything in the grain against weevils when it goes in.
    The first sizes a possibly missing cost leg, the second is a direct empirical test of the entire
    loss model, and the third selects which published loss rate governs it.
  annex_divergence_noted: |
    Annex row ML-TAX-01 records the impot synthetique ceiling as 30,000,000 XOF in the CGI art. 70
    text while noting the DGI page cites 50,000,000, and ML-V25-04 carries 50,000,000. I have not
    adjudicated the divergence because it cannot bind here - campaign turnover of 3,828,290.164979
    XOF is an order of magnitude below the lower figure. Flagged so that a reader porting these
    inputs to a larger business does not inherit an unexamined threshold.


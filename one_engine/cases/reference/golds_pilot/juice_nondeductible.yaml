id: ci-bouake-jus-mangue-fcff-unlevered-v1
title: "Unité de jus de mangue, Bouaké (Côte d'Ivoire) — unlevered FCFF (NOPAT build) over the residual life of the production line, with permanently non-deductible mango purchases"
currency: XOF
grid:
  periods: 9
  freq: annual

utterance:
  fr: |
    J'ai une petite unité de jus de mangue à Bouaké. J'achète la mangue directement aux paysans des
    vergers autour, à la récolte : je prends cent tonnes dans la saison, à cent vingt-cinq francs le
    kilo. Il faut trois kilos de mangue pour faire un litre de jus. Je vends le jus en bouteilles
    d'un litre aux supermarchés et aux boutiques d'Abidjan, à mille deux cents francs la bouteille.
    Les bouteilles, les bouchons et les étiquettes me coûtent deux cents francs par bouteille, et le
    sucre et l'acide citrique cent francs. J'ai la ligne de production que j'ai payée trente-cinq
    millions il y a un an — on me dit dix ans. Trois ouvriers à quatre-vingt-dix mille par mois, le
    hangar à deux cent mille par mois, et le courant et l'eau à trois cent mille par mois. Je suis
    une société déclarée, je paie l'impôt sur le bénéfice. Mais il y a un truc qui me fait mal : les
    paysans ne me donnent aucune facture — ils n'ont pas de registre de commerce, ils veulent le cash
    et c'est tout. Mon comptable me dit que sans facture il ne peut pas passer ces achats en charge
    déductible. Donc pour l'impôt, c'est comme si je n'avais jamais acheté ces mangues : je paie
    l'impôt sur un bénéfice bien plus gros que celui que je fais vraiment. Et ce n'est pas un décalage
    dans le temps — cette déduction-là, je ne la récupère jamais.
  en: |
    I have a small mango-juice unit in Bouaké. I buy the mangoes directly from the farmers in the
    orchards around, at harvest time: I take one hundred tonnes over the season, at one hundred and
    twenty-five francs a kilo. It takes three kilos of mango to make one litre of juice. I sell the
    juice in one-litre bottles to the supermarkets and the small shops in Abidjan, at one thousand
    two hundred francs a bottle. The bottles, the caps and the labels cost me two hundred francs per
    bottle, and the sugar and citric acid one hundred. I have the production line, which I paid
    thirty-five million for a year ago — they tell me ten years. Three workers at ninety thousand a
    month, the shed at two hundred thousand a month, and power and water at three hundred thousand a
    month. I am a registered company, I pay profits tax. But there is one thing that hurts: the
    farmers give me no invoice — they have no trade register entry, they want cash and that is all.
    My accountant tells me that without an invoice he cannot put those purchases through as a
    deductible expense. So for tax it is as if I had never bought those mangoes: I pay tax on a
    profit far bigger than the one I actually make. And it is not a timing difference — that
    deduction, I never get it back.


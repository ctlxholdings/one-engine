checks:
  - grid.periods == remaining_life_years
  - trace.mango_purchased_kg == mango_kg_per_season
  - trace.mango_stock_close[t] == trace.mango_stock_close[t-1] + trace.mango_purchased_kg[t] - trace.mango_kg_used[t]
  - trace.mango_stock_close[t] >= 0
  - trace.bottles == trace.mango_kg_used / mango_kg_per_litre
  - trace.bottles[t] >= 0
  - trace.revenue == price_per_bottle * trace.bottles * bottle_litres
  - trace.mango_cost == mango_price_per_kg * trace.mango_purchased_kg
  - trace.packaging_cost == packaging_cost_per_bottle * trace.bottles
  - trace.ingredient_cost == ingredient_cost_per_bottle * trace.bottles
  - trace.contribution_margin == trace.revenue - trace.mango_cost - trace.packaging_cost - trace.ingredient_cost
  - trace.labour_cost == workers * wage_per_worker_month * months_per_year
  - trace.rent_cost == rent_per_month * months_per_year
  - trace.utilities_cost == utilities_per_month * months_per_year
  - trace.fixed_cash_costs == trace.labour_cost + trace.rent_cost + trace.utilities_cost
  - trace.cash_opex == trace.mango_cost + trace.packaging_cost + trace.ingredient_cost + trace.fixed_cash_costs
  - trace.ebitda == trace.revenue - trace.cash_opex
  - trace.ebitda == trace.contribution_margin - trace.fixed_cash_costs
  - trace.ebitda[t] >= 0
  - trace.capex == capex_per_year
  - trace.depreciation == machine_cost / machine_life_years
  - trace.nbv_open[first] == nbv_opening
  - trace.nbv_open[t] == trace.nbv_close[t-1] for t >= 1
  - trace.nbv_close == trace.nbv_open + trace.capex - trace.depreciation
  - trace.nbv_close[t] >= 0
  - trace.nbv_close[last] == 0
  - sum(trace.depreciation) == nbv_opening + sum(trace.capex)
  - trace.ebit == trace.ebitda - trace.depreciation
  - trace.non_deductible_mango == trace.mango_cost * (1 - mango_deductible_fraction)
  - trace.taxable_profit == trace.ebit + trace.non_deductible_mango
  - trace.taxable_profit[t] >= trace.ebit[t]
  - trace.tax == tax_rate * trace.taxable_profit
  - trace.tax_min == minimum_tax_per_year
  - trace.tax[t] >= trace.tax_min[t]
  - trace.nopat == trace.ebit - trace.tax
  - trace.receivables == trace.revenue * dso_days / days_per_year
  - trace.receivables[t] >= 0
  - trace.inventory == trace.cash_opex * inventory_days / days_per_year
  - trace.inventory[t] >= 0
  - trace.payables == trace.cash_opex * payables_days / days_per_year
  - trace.nwc == trace.receivables + trace.inventory - trace.payables
  - trace.nwc[t] == trace.nwc[t-1] + trace.delta_nwc[t] for t >= 1
  - cumsum(trace.delta_nwc) + nwc_opening == trace.nwc
  - trace.cfo == trace.ebitda - trace.tax - trace.delta_nwc
  - trace.cfi == 0 - trace.capex
  - trace.fcff == trace.cfo + trace.cfi
  - trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex
  - trace.tax_if_deductible == tax_rate * trace.ebit
  - trace.tax_leakage == trace.tax - trace.tax_if_deductible
  - trace.tax_leakage == tax_rate * trace.non_deductible_mango
  - trace.fcff_if_deductible == trace.fcff + trace.tax_leakage
  - sum(trace.fcff_if_deductible) - sum(trace.fcff) == tax_rate * sum(trace.non_deductible_mango)

notes:
  - "The economic centre of this case is that the disallowance is a PERMANENT difference, stated as such by the founder ('ce n'est pas un décalage dans le temps'). Under IAS 12 no deferred tax asset arises: the difference never reverses, so it shows up purely as a lift in the effective tax rate and is fully cash. Modelling it as a temporary difference — or applying a flat 25% to EBIT — would overstate FCFF in every period. NOPAT is therefore built as EBIT minus the actual cash tax, not as EBIT × (1 − statutory rate)."
  - "The disallowance is defined on PURCHASES, not on cost of sales. Here they coincide only because year-end inventory is assumed nil. If the accounting year cut across the campaign, the add-back would follow the purchases while the P&L charge followed the sales, and the two would diverge period by period. This is the single most consequential open question in the model."
  - "Genuine friction between the sector's language and standard line items: the founder thinks in one CAMPAIGN — one harvest, one lot of 100 tonnes, one production run — while the accounts think in financial years. I kept the campaign as the period and aligned the financial year to it, which is defensible but is an alignment I chose, not one he stated. Inside the year the business is highly seasonal: the whole 12,500,000 mango spend leaves the till in a few weeks at harvest, while cash comes back over twelve months of sales. The annual grid nets that out to zero, so the model shows no working-capital swing where the business really has a large intra-year peak funding need. That peak is a financing question, not an asset-side FCFF question, so it does not belong in this build — but it should not be forgotten when the unit is asked how it funds itself."
  - "Horizon choice: nine periods, the residual life of the line. This deliberately places the replacement of the production line just outside the grid, so no reinvestment assumption has to be smuggled in. A longer horizon would require a replacement outlay and would reduce cumulative free cash flow; the direction is unambiguous. The model as built therefore flatters a perpetual view of the business and should not be read as a going-concern steady state beyond period nine."
  - "Flat prices and flat volumes are an assumption, not a finding. Farm-gate mango is a spot commodity with real campaign-to-campaign volatility, and it is the largest single cost line; the shelf price to Abidjan retail is comparatively sticky. The exposure is asymmetric — a mango price move hits the margin harder than the same proportional move in packaging or sugar — and because the mango is non-deductible, a rise in the mango price raises the cash cost without any offsetting tax shield at all. That last point is the real severity of the case and it is qualitative here by design."
  - "Whether 100 tonnes is a supply constraint (what the surrounding orchards will sell him) or a capacity constraint (what the line can press in the campaign window) is not stated and matters for any expansion question. Elicit: what is the line's rated throughput per campaign, and how many tonnes could be sourced locally?"
  - "The founder's own labour and any management remuneration are not costed anywhere in the utterance. If he draws a salary, EBITDA and every line below it are overstated. Elicit."
  - "VAT is entirely absent from the utterance. It is not clear whether the 1,200 per bottle is inclusive or exclusive, nor whether the unit is registered and recovering input VAT on packaging and sugar. I have treated every figure as VAT-neutral. Note that unprocessed fruit bought from unregistered farmers would carry no recoverable input VAT in any case, so the invoice problem is likely to have a VAT limb as well as an income-tax limb. Elicit before relying on the tax line."
  - "The remedy is worth raising with a tax adviser rather than treating the leakage as permanent fact: many jurisdictions provide a self-billing or purchase-voucher mechanism (bordereau d'achat) for buying from unregistered agricultural producers, or allow deductibility where the buyer withholds and remits on the seller's behalf; sourcing through a formally constituted producers' cooperative that can issue invoices achieves the same end. Any of these would move the business toward the counterfactual column already materialised in the trace. I make no claim here about which is available in Côte d'Ivoire — that is a question for local counsel, and it is the highest-value question in this file."
  - "The minimum forfaitary tax is carried as a guard-rail row and is checked, not merely asserted. It does not bind at this level of profit, but it is the reason the tax line cannot simply be scaled down toward zero in a downside case: below a certain profit the minimum takes over and the tax stops falling with earnings."
  - "Deferred to elicitation and flagged in inputs: customer payment terms (the only driver of the working-capital stock in this model), supplier credit on packaging and sugar, the financial-year end relative to the harvest, the applicable profits-tax rate and any investment-code exemption, maintenance capex and spares on the line, residual value after ten years, and whether the three workers and the shed are year-round or campaign-only commitments. Each of these is currently an ASSUMED prior, not a finding."

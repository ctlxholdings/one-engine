passage: |
  1. WHAT THE BUSINESS IS, AND THE GRID

  A single-site fruit-processing unit in Bouaké: it buys raw mango at the orchard gate during the
  harvest campaign, presses and bottles it, and sells one-litre bottles into Abidjan retail. The
  natural operating unit is the CAMPAIGN (one harvest season = one production year) and, inside it,
  the BOTTLE. I keep both and do not translate the campaign into an artificial "units per month".

  Horizon. The only asset with a stated finite life is the production line: paid 35,000,000 one year
  ago, told ten years, so nine years of service remain. I run the model over exactly those nine
  annual periods (t = 0 … 8, t = 0 being the coming campaign). This keeps the whole horizon inside a
  single asset cycle: no replacement capex falls inside it, and the line is exactly fully written
  down at t = 8. Everything is nominal XOF (FCFA), flat.

  2. PHYSICAL LAYER — FROM TONNES OF MANGO TO BOTTLES

  Mango bought per campaign: 100 tonnes × 1,000 kg/tonne = 100,000 kg (STATED volume, metric
  conversion).
  Conversion: 3 kg of mango per litre of juice (STATED — this ratio already contains the peel, stone
  and press losses, so I add no further yield haircut).
  Juice made: 100,000 kg ÷ 3 kg/litre = 33,333.333… litres per campaign.
  Bottles: the bottle is one litre, so litres and bottles are the same number:
  33,333.333… bottles per campaign. I carry the exact one-third rather than rounding, so the yield
  bridge (bottles = kg ÷ 3) reproduces exactly; physically the residue is one-third of a litre a
  year, i.e. nothing.
  Raw-material conservation: nothing is carried over between campaigns — 100,000 kg bought,
  100,000 kg pressed, closing mango stock nil in every period.

  3. REVENUE

  33,333.333… bottles × 1,200 XOF/bottle = 40,000,000 XOF per campaign. Recognised on delivery to
  the supermarkets and shops (IFRS 15 — control passes at delivery). I assume the whole campaign's
  output is sold within the campaign year: no finished-goods carry-over, so production = sales.

  4. VARIABLE COST — WHAT ONE BOTTLE EATS

  Mango in one bottle: 3 kg × 125 XOF/kg = 375 XOF.
  Packaging (bottle + cap + label): 200 XOF.
  Sugar + citric acid: 100 XOF.
  Total variable cost per bottle: 375 + 200 + 100 = 675 XOF.
  Contribution per bottle: 1,200 − 675 = 525 XOF.

  Grossed up to the campaign:
  Mango: 100,000 kg × 125 = 12,500,000 (equivalently 33,333.333… × 375).
  Packaging: 33,333.333… × 200 = 6,666,666.67.
  Sugar/acid: 33,333.333… × 100 = 3,333,333.33.
  Total variable: 22,500,000.
  Contribution margin: 40,000,000 − 22,500,000 = 17,500,000 (= 525 × 33,333.333…). Cross-checks.

  5. FIXED CASH COSTS

  Labour: 3 workers × 90,000/month × 12 = 3,240,000.
  Shed (hangar): 200,000 × 12 = 2,400,000.
  Power and water: 300,000 × 12 = 3,600,000.
  Total fixed cash costs: 9,240,000 per year.

  Total cash operating costs: 22,500,000 + 9,240,000 = 31,740,000.

  6. EBITDA

  EBITDA = 40,000,000 − 31,740,000 = 8,260,000 per campaign.
  Equivalently: contribution 17,500,000 − fixed cash 9,240,000 = 8,260,000. Cross-checks.
  Operating breakeven on contribution: 9,240,000 ÷ 525 = 17,600 bottles, i.e. about 52.8 tonnes of
  mango — the unit runs at roughly 1.9× its cash breakeven volume before tax.

  7. THE LINE — DEPRECIATION AND BOOK-VALUE ROLL-FORWARD

  Cost 35,000,000, useful life 10 years, nil residual, straight line (IAS 16):
  35,000,000 ÷ 10 = 3,500,000 per year. One year has already run, so the opening net book value at
  t = 0 is 35,000,000 − 3,500,000 = 31,500,000.

  Roll-forward, NBV(close) = NBV(open) + capex − depreciation, with capex nil throughout:
  t=0: 31,500,000 → 28,000,000
  t=1: 28,000,000 → 24,500,000
  t=2: 24,500,000 → 21,000,000
  t=3: 21,000,000 → 17,500,000
  t=4: 17,500,000 → 14,000,000
  t=5: 14,000,000 → 10,500,000
  t=6: 10,500,000 → 7,000,000
  t=7: 7,000,000 → 3,500,000
  t=8: 3,500,000 → 0
  Conservation: 9 × 3,500,000 = 31,500,000 = opening NBV. The asset is exactly exhausted at the end
  of the horizon.

  EBIT = EBITDA − depreciation = 8,260,000 − 3,500,000 = 4,760,000 per year, every year.

  8. TAX — THE CORE OF THIS CASE

  The founder is a registered company on the profits tax (IS/BIC). But the single largest cost in the
  business, the mango, is bought from farmers with no trade register entry and no invoice, and his
  accountant cannot put it through as a deductible charge. Two things the founder says fix the
  treatment precisely:
    (a) "sans facture il ne peut pas passer ces achats en charge déductible" — the deductible share
        of mango purchases is zero, not partial;
    (b) "ce n'est pas un décalage dans le temps — cette déduction-là, je ne la récupère jamais" — it
        is a PERMANENT difference, not a temporary one. So there is no deferred tax asset to set up:
        under IAS 12 a permanent difference never reverses, it only raises the effective rate.

  Taxable profit is therefore accounting EBIT with the whole mango spend added back:
  Taxable profit = 4,760,000 + 12,500,000 = 17,260,000 per year.
  Tax = 25% × 17,260,000 = 4,315,000 per year.

  Minimum-tax guard rail: the company pays the higher of the profits tax and the forfaitary minimum
  (IMF), carried here at 3,000,000 per year. 4,315,000 exceeds it in every period, so the profits tax
  is the binding leg throughout and the minimum never bites. I carry the minimum as its own trace row
  so this can be verified rather than asserted.

  Note the disallowance attaches to the PURCHASE, and here purchases equal cost of sales because
  nothing is left in stock at year end (see §9). If stock were carried, the add-back would follow the
  purchases, not the cost of sales, and the two would diverge — I flag that friction rather than
  paper over it.

  9. NOPAT

  This is where the case bites, and where a mechanical "EBIT × (1 − 25%)" would be simply wrong.
  NOPAT is EBIT less the CASH tax actually borne on operations — and the tax is not 25% of EBIT:

  NOPAT = EBIT − tax = 4,760,000 − 4,315,000 = 445,000 per year.

  Effective tax rate on EBIT: 4,315,000 ÷ 4,760,000 = 90.65%. The tax takes 52.2% of EBITDA and
  works out at 129.45 XOF of cash tax per bottle sold — a quarter of the 525 XOF contribution the
  bottle generates. The unit earns a real 4,760,000 of operating profit and is taxed as if it earned
  17,260,000.

  10. WORKING CAPITAL

  Three components, built from how the business actually pays and gets paid:
    Receivables. Sales are to Abidjan supermarkets and boutiques, i.e. trade customers on terms. The
    terms are not stated; I assume 45 days (flagged): 40,000,000 × 45/360 = 5,000,000.
    Payables. The mango is cash by construction — "ils veulent le cash et c'est tout" — so the
    largest input carries no supplier credit. I extend nil credit to packaging and sugar (flagged),
    giving payables of nil.
    Inventory. Assumed nil at each year-end, on the assumption that the accounting year is aligned
    with the campaign so that everything bought at harvest is pressed, bottled and sold inside the
    year.
  NWC = 5,000,000 + 0 − 0 = 5,000,000, constant.

  The unit has already traded for a year, so this 5,000,000 is already funded at t = 0; volumes and
  prices are flat, so the stock never moves. ΔNWC = 0 in every period of the horizon. Cumulatively,
  opening NWC of 5,000,000 plus nine periods of zero change reconciles to the closing 5,000,000.

  11. CAPEX

  Nil in every period. The 35,000,000 was paid a year ago — sunk, outside the grid — and nothing else
  is mentioned. Replacement of the line falls immediately AFTER the horizon, by construction (§1).

  12. FCFF — THE UNLEVERED BUILD, PER PERIOD

  FCFF = NOPAT + D&A − ΔNWC − capex
       = 445,000 + 3,500,000 − 0 − 0
       = 3,945,000 per year, for each of the nine periods.

  Cash cross-check by the indirect route: CFO = EBITDA − cash tax − ΔNWC = 8,260,000 − 4,315,000 − 0
  = 3,945,000; CFI = −capex = 0; FCFF = CFO + CFI = 3,945,000. The two routes agree, which is the
  point of running both.

  Every period is identical (flat prices, flat volumes, flat depreciation over the whole residual
  life, no working-capital movement, no capex), so the FCFF strip is 3,945,000 × 9 = 35,505,000 in
  total over the horizon — barely more than the 35,000,000 the line cost, undiscounted.

  13. THE COST OF THE MISSING INVOICES, MATERIALISED

  I carry the counterfactual as its own trace columns rather than as a remark, so it is checkable.
  Had the mango been supported by invoices and therefore deductible:
    Tax would be 25% × 4,760,000 = 1,190,000 per year;
    FCFF would be 8,260,000 − 1,190,000 = 7,070,000 per year.
  The leakage is 4,315,000 − 1,190,000 = 3,125,000 per year, which is exactly 25% × 12,500,000 — the
  tax rate applied to the disallowed purchase, as a permanent difference must be. Over the nine-year
  horizon that is 28,125,000, against 35,505,000 of FCFF actually generated: the missing invoices
  cost this business roughly four-ninths of the cash its assets would otherwise throw off, and 79% of
  the FCFF it does keep. Per bottle, 93.75 XOF of the 525 XOF contribution is surrendered to the
  disallowance.

  14. SUMMARY LADDER (identical for t = 0 … 8, except the book-value roll-forward)

  Bottles                    33,333.33
  Revenue                    40,000,000
  Mango                     (12,500,000)
  Packaging                  (6,666,667)
  Sugar + citric acid        (3,333,333)
  Contribution               17,500,000
  Labour                     (3,240,000)
  Shed                       (2,400,000)
  Power and water            (3,600,000)
  EBITDA                      8,260,000
  Depreciation               (3,500,000)
  EBIT                        4,760,000
  Add back non-deductible    12,500,000
  Taxable profit             17,260,000
  Tax at 25%                 (4,315,000)
  NOPAT                         445,000
  Add back D&A                3,500,000
  Less ΔNWC                           0
  Less capex                          0
  FCFF                        3,945,000


passage: |
  0. SCOPE, CURRENCY, GRID

  Ouagadougou places the business in Burkina Faso, so the currency is the XOF (franc CFA BCEAO) and
  every figure below is in XOF, nominal, at constant prices. The grid is 7 annual periods, t=0 to
  t=6. t=0 is taken to be the financial year the founder is describing - the good year, 48,000,000
  billed, about 12,000,000 still outstanding at its close.

  The horizon is not a round number chosen for convenience. The offset press is the binding durable
  asset: it was bought three years ago against a ten-year life, so it has exactly seven years left.
  Ending at t=6 means the model closes at the moment both machines stand at zero net book value,
  which is the only horizon length that embeds no implicit residual-value guess. Everything the
  founder said about his equipment is therefore fully consumed inside the grid and nothing is left
  dangling at the edge.

  1. THE NATURAL OPERATING UNITS, AND WHERE THEY DO NOT MAP

  A jobbing printer's natural quantities are jobs, print runs, impressions, reams of paper, kilos of
  ink, and machine-hours split between the offset and the digital press. The founder gives none of
  them. What he gives instead is: an annual billings figure for a good year; a materials-consumption
  ratio expressed as a percentage of billings; two machines with purchase prices and lives; three
  monthly fixed-overhead lines; and two payment cycles expressed in days.

  I keep that description rather than forcing it into a volume-times-price template, because the
  ratio he quotes IS the trade's own unit economics: a jobbing printer quotes a job by pricing the
  paper and ink and marking up, so materials at roughly forty percent of the quoted price is the
  natural way he knows his own costs. Forcing an invented impressions count and an invented price
  per impression underneath it would add two fabricated numbers and no information.

  The friction this leaves is worth naming: because there is no volume unit, the model cannot test
  capacity. Nothing here verifies that 48,000,000 of billings physically fits through one offset and
  one small digital press, nor what the marginal job costs once the presses are saturated. That is
  an elicitation - impressions per year, sheets per hour, number of shifts - not something I can
  deduce.

  2. REVENUE

  STATED: 48,000,000 for a good year. On recognition, the output is printed goods delivered to
  schools, NGOs and donor projects; control transfers on delivery of the printed work, and for a
  jobbing printer invoicing is the practical proxy for delivery. So accrual revenue is 48,000,000
  per period, held flat across all seven periods, since nothing in the utterance supports growth or
  price escalation.

  The bias must be flagged rather than buried: he said UNE BONNE ANNEE. Running his good year seven
  times is an upper reading of his own statement, and no bad-year figure was given to average
  against it.

  3. MATERIALS

  0.40 x 48,000,000 = 19,200,000 per period. With no stock position held (assumed, see inputs),
  purchases equal consumption, so the 19,200,000 is simultaneously the income-statement charge and
  the amount purchased from suppliers - which matters below, because it is the purchases figure, not
  the charge, that drives the payables balance.

  4. THE OTHER OPERATING COSTS

  Labour:      4 x 75,000 x 12 = 3,600,000 per year.
  Rent:        350,000 x 12    = 4,200,000 per year.
  Electricity: 180,000 x 12    = 2,160,000 per year.
  Other overheads: 0 - carried as an explicit zero row, not omitted (see step 5).

  Non-materials cash costs = 3,600,000 + 4,200,000 + 2,160,000 + 0 = 9,960,000.
  Total cash operating costs = 19,200,000 + 9,960,000 = 29,160,000 per period.

  I have not split these between cost of sales and overhead. In a four-man shop the same four people
  run the presses and finish the work; any allocation would be arbitrary and EBITDA is unaffected by
  it. In SYSCOHADA terms, the 19,200,000 sits in achats de matieres, the 3,600,000 in charges de
  personnel, the rent and power in services exterieurs.

  5. EBITDA, AND THE HOLE IN IT

  EBITDA = 48,000,000 - 29,160,000 = 18,840,000 per period, a margin of a little under forty
  percent of billings.

  That margin is high for a small jobbing printer, and the reason is almost certainly not that the
  business is unusually profitable but that the cost list the founder recited is incomplete. Absent
  from it: his own compensation (he names four employees and is not one of them, so either he draws
  nothing or the draw is invisible); plates, blankets, chemicals, spares and machine servicing;
  transport and delivery of banners and bulk exercise books; telephone and internet; insurance; the
  patente / CDL local business tax; bank charges; and employer social contributions if the 75,000
  per employee is what the employee receives rather than what the employer pays.

  I refuse to invent a figure for these - there is no anchor anywhere in the utterance to size them
  from - but I also refuse to let them vanish. They are carried as an explicit input and an explicit
  trace row at zero, tagged ELICITED, so that the omission is structurally visible and so that
  answering the question is a one-line change rather than a rebuild. The direction of the error is
  not in doubt: EBITDA, NOPAT and FCFF as derived here are all overstated.

  6. DEPRECIATION AND THE ASSET ROLL-FORWARD

  Offset press. 15,000,000 over 10 years, straight line to nil residual = 1,500,000 per year. Three
  years have already been charged, so accumulated depreciation at the opening of t=0 is 4,500,000
  and net book value is 10,500,000. Seven years remain: it charges 1,500,000 in each of t=0 through
  t=6 and reaches exactly zero at the close of t=6.

  Digital press. 4,000,000 over 5 years = 800,000 per year. The purchase date is not stated. On the
  assumption that it was bought alongside the offset three years ago, accumulated depreciation at
  the opening of t=0 is 2,400,000, net book value is 1,600,000, and two years remain. It is fully
  written off at the close of t=1 and must be replaced at the start of t=2 for the business to keep
  running - a capex of 4,000,000 at t=2. The replacement then charges 800,000 in each of t=2 through
  t=6, five years, and is itself exactly written off at the close of t=6. The retired machine leaves
  at zero net book value, so there is no disposal gain or loss and no scrap proceeds.

  The consequence is worth stating because it is counter-intuitive: the depreciation line is
  perfectly flat at 1,500,000 + 800,000 = 2,300,000 in every one of the seven periods, even though
  the asset underneath one half of it is retired and replaced mid-horizon. The cash line is not flat
  at all - it has a single 4,000,000 spike at t=2. That divergence between a smooth charge and a
  lumpy outlay is exactly what the depreciation-add-back and capex-deduction in the FCFF build
  exists to handle.

  Opening net book value = 10,500,000 + 1,600,000 = 12,100,000. Rolling forward with
  NBV_close = NBV_open + capex - D&A:

    t=0: 12,100,000 + 0         - 2,300,000 =  9,800,000
    t=1:  9,800,000 + 0         - 2,300,000 =  7,500,000
    t=2:  7,500,000 + 4,000,000 - 2,300,000 =  9,200,000
    t=3:  9,200,000 + 0         - 2,300,000 =  6,900,000
    t=4:  6,900,000 + 0         - 2,300,000 =  4,600,000
    t=5:  4,600,000 + 0         - 2,300,000 =  2,300,000
    t=6:  2,300,000 + 0         - 2,300,000 =          0

  Cross-checking the t=3 balance component by component: the offset has then run six years in total
  (three before the grid, four inside it through t=3), so 15,000,000 - 6 x 1,500,000... more
  carefully, three prior years plus t=0, t=1, t=2, t=3 is seven years, giving 15,000,000 -
  10,500,000 = 4,500,000; the replacement digital press has run t=2 and t=3, giving 4,000,000 -
  1,600,000 = 2,400,000; and 4,500,000 + 2,400,000 = 6,900,000, which is what the roll-forward
  produced. The two machines land together on zero at t=6.

  7. EBIT

  EBIT = 18,840,000 - 2,300,000 = 16,540,000, flat in every period.

  8. WORKING CAPITAL

  Receivables. The founder states the balance directly - always about twelve million lingering at
  year end - and separately states the term, ninety days. These are two independent statements and
  they reconcile exactly on a 360-day commercial year: 48,000,000 x 90 / 360 = 12,000,000. That is
  not a coincidence I engineered; it means the day-count convention is fixed by his own arithmetic
  rather than chosen by me, and it is then applied consistently to the supplier side.

  Payables. Thirty days of paper and ink purchases on the same basis: 19,200,000 x 30 / 360 =
  1,600,000.

  Inventory. Nil, assumed - see the flagged input.

  Net working capital = 12,000,000 - 1,600,000 = 10,400,000, opening and closing, in every period.
  Therefore the change in net working capital is ZERO in every period of the forecast.

  This deserves a sentence rather than a shrug, because it is the honest consequence of the word
  TOUJOURS. A receivable that is always about twelve million at year end is a level, not a trend.
  It represents 10,400,000 of the founder's capital permanently locked into financing his customers
  - it is a real and painful feature of his business, and it depresses what the business is worth
  because that money is already sunk into the opening balance sheet - but it does not consume any
  further cash in any forecast period, precisely because it never grows. Modelling it as a recurring
  cash drain would be double-counting the same 10,400,000 seven times.

  From the balances, the cash lines follow mechanically:
    Cash receipts        = revenue + AR_open - AR_close = 48,000,000 + 12,000,000 - 12,000,000
                         = 48,000,000 per period.
    Cash paid to paper suppliers = purchases + AP_open - AP_close
                         = 19,200,000 + 1,600,000 - 1,600,000 = 19,200,000 per period.
    Wages, rent and power are taken as paid when incurred (no accrued liabilities assumed), so
                         = 9,960,000 per period.
    Cash operating disbursements = 19,200,000 + 9,960,000 = 29,160,000.
    Cash operating surplus = 48,000,000 - 29,160,000 = 18,840,000.

  Note that this equals EBITDA less the change in net working capital, as it must by construction -
  the two routes to the same number are kept as separate rows and tied together in the checks.

  9. TAX - THE DISTINCTIVE PART OF THIS BUSINESS

  The founder is explicit that the base is what he actually collected less what he actually
  disbursed in the year, not what he invoiced. So the tax computation starts from the cash operating
  surplus of 18,840,000, not from invoiced revenue.

  The one thing his sentence genuinely leaves open is the machines. A press purchase is literally a
  decaissement, so a naive literal reading would deduct the whole 4,000,000 in t=2 and deduct
  nothing at all for the presses he already owns. Against that: in cash-basis regimes the cash
  convention governs the timing of receipts and of current expenses, while capital assets are still
  capitalised and written off over their life; and the founder himself thinks about the presses in
  terms of their lives. Base case therefore:

    Taxable income = cash operating surplus - depreciation
                   = 18,840,000 - 2,300,000 = 16,540,000 in every period.
    Tax at 27.5%   = 4,548,500 in every period.

  Now the finding that matters, and it is not the one the founder expects. Because his collection
  position is MODELLED AS level - about twelve outstanding, not growing, not released - the cash base
  and the accrual base coincide in every forecast period. TWO CORRECTIONS 2026-07-26 (physical audit).
  (a) 'EXACTLY' over-claimed: the founder said 'a peu pres douze', an explicit approximation, and this
  derivation sharpens it to the same round figure at BOTH ends - which is what drives the change in
  working capital to zero. The defensible claim is that the two bases coincide TO WITHIN THE FOUNDER'S
  OWN ROUNDING. (b) The conclusion just below - that the regime changes WHEN tax is paid but not HOW
  MUCH - is right in general but FALSE OF THIS GRID: with a level receivable the timing effect
  vanishes too, so here the regime changes NEITHER, and the demonstration reduces to 0 = 0. The
  general characterisation stands; the claim that these numbers demonstrate it does not. See the
  mechanism-inertness note at the end. The regime he describes is a
  timing device, not a rate change. Its arithmetic effect on tax in any given year is the tax rate
  multiplied by the movement in net working capital, with the sign reversed: in a year when
  receivables balloon he collects less than he bills and his tax falls; in the year the backlog is
  finally settled he collects more than he bills and the tax lands, as he puts it, full in the face.
  Both effects are real, and both are movements around a level - they net to nothing over any period
  that begins and ends at the same receivable balance.

  So his fear is correctly aimed at volatility, not at burden. What the regime costs him is
  predictability and the working capital needed to survive the spike year; what it does not do, on
  his own description of his receivables, is change the amount of tax he pays over the cycle.
  Quantifying the spike would require a collection profile he has not given - which year, how much
  of the twelve - so the mechanism is recorded and the profile is left as an elicitation rather than
  invented.

  Because the treatment of the machines is a genuine fork rather than a detail, the literal reading
  is carried through as a second fully-derived column instead of a remark: taxable income equals the
  cash operating surplus less the capex actually paid, with no depreciation deduction at all; tax at
  the same rate; and its own FCFF line. The direction of the result is the opposite of what one
  might guess. The literal cash-expensing reading leaves the founder WORSE off across this horizon,
  and the reason is visible in the numbers: the 12,100,000 of net book value already sitting in his
  two presses was paid for before the grid begins, so under a pure cash rule it can never be
  deducted inside the grid, while only the 4,000,000 replacement can be. Both columns are in the
  trace and both are tied to their drivers in the checks.

  10. NOPAT AND FCFF

  NOPAT is EBIT less the tax actually assessed. There is no debt anywhere in the utterance, so there
  is no interest and no interest tax shield to strip out - the build is unlevered by construction,
  not by adjustment.

    NOPAT = 16,540,000 - 4,548,500 = 11,991,500 per period.

  FCFF = NOPAT + D&A - change in NWC - capex:

    t=0: 11,991,500 + 2,300,000 - 0 - 0         = 14,291,500
    t=1: 11,991,500 + 2,300,000 - 0 - 0         = 14,291,500
    t=2: 11,991,500 + 2,300,000 - 0 - 4,000,000 = 10,291,500
    t=3: 11,991,500 + 2,300,000 - 0 - 0         = 14,291,500
    t=4: 11,991,500 + 2,300,000 - 0 - 0         = 14,291,500
    t=5: 11,991,500 + 2,300,000 - 0 - 0         = 14,291,500
    t=6: 11,991,500 + 2,300,000 - 0 - 0         = 14,291,500

  Cross-check by the direct route, which is an independent path to the same figure: cash flow from
  operations is the cash operating surplus less tax paid, 18,840,000 - 4,548,500 = 14,291,500 in
  every period; cash flow from investing is minus capex, zero except minus 4,000,000 at t=2; and
  their sum reproduces the FCFF line exactly. The two routes agree because the change in net working
  capital is precisely the bridge between EBITDA and the cash surplus, which is the identity the
  whole NOPAT build rests on.

  11. WHAT THE HORIZON DOES AND DOES NOT CONTAIN

  There is no terminal value here and none is implied. The grid ends at the precise moment the
  offset press reaches the end of its stated life at zero book value. Continuing the business past
  t=6 requires re-equipping with an offset press, and the founder's own purchase price is the
  natural anchor for what that costs. Anyone who extends this model beyond t=6 without inserting
  that re-investment will overstate the continuing cash flow, and will do so by an amount of the
  same order as a full year of FCFF.


checks:
  - "trace.revenue == revenue_billed_annual"
  - "trace.paper_ink == paper_ink_share * trace.revenue"
  - "trace.labour == employees * wage_per_employee_month * months_per_year"
  - "trace.rent == rent_month * months_per_year"
  - "trace.electricity == electricity_month * months_per_year"
  - "trace.other_overheads == other_overheads_annual"
  - "trace.cash_opex == trace.paper_ink + trace.labour + trace.rent + trace.electricity + trace.other_overheads"
  - "trace.ebitda == trace.revenue - trace.cash_opex"
  - "trace.dep_offset * offset_life == offset_cost"
  - "trace.dep_digital * digital_life == digital_cost"
  - "trace.da == trace.dep_offset + trace.dep_digital"
  - "trace.ebit == trace.ebitda - trace.da"
  - "trace.capex[t] == 0 for t < digital_replacement_index"
  - "cumsum(trace.capex)[t] == replacement_cost_digital for t >= digital_replacement_index"
  - "sum(trace.capex) == replacement_cost_digital"
  - "trace.nbv_close == trace.nbv_open + trace.capex - trace.da"
  - "trace.nbv_open[t] == trace.nbv_close[t-1] for t >= 1"
  - "trace.nbv_open[first] == opening_nbv"
  - "trace.nbv_close[t] >= 0"
  - "trace.nbv_open[t] >= 0"
  - "trace.nbv_close[last] == 0"
  - "sum(trace.da) == opening_nbv + sum(trace.capex) - trace.nbv_close[last]"
  - "trace.ar_close == trace.ar_open + trace.revenue - trace.cash_receipts"
  - "trace.ar_open[t] == trace.ar_close[t-1] for t >= 1"
  - "trace.ar_open[first] == opening_ar"
  - "trace.ar_close[t] >= 0"
  - "trace.ap_close == trace.ap_open + trace.paper_ink - trace.cash_paid_suppliers"
  - "trace.ap_open[t] == trace.ap_close[t-1] for t >= 1"
  - "trace.ap_open[first] == opening_ap"
  - "trace.ap_close[t] >= 0"
  - "trace.nwc_open == trace.ar_open - trace.ap_open"
  - "trace.nwc_close == trace.ar_close - trace.ap_close"
  - "trace.delta_nwc == trace.nwc_close - trace.nwc_open"
  - "sum(trace.delta_nwc) == trace.nwc_close[last] - trace.nwc_open[first]"
  - "cumsum(trace.delta_nwc)[t] == trace.nwc_close[t] - trace.nwc_open[first]"
  - "trace.cash_paid_other == trace.labour + trace.rent + trace.electricity + trace.other_overheads"
  - "trace.cash_opex_disbursed == trace.cash_paid_suppliers + trace.cash_paid_other"
  - "trace.cash_operating_surplus == trace.cash_receipts - trace.cash_opex_disbursed"
  - "trace.cash_operating_surplus == trace.ebitda - trace.delta_nwc"
  - "trace.taxable_income == trace.cash_operating_surplus - trace.da"
  - "trace.tax == tax_rate * trace.taxable_income"
  - "trace.taxable_income[t] >= 0"
  - "trace.tax[t] >= 0"
  - "trace.nopat == trace.ebit - trace.tax"
  - "trace.cfo == trace.cash_operating_surplus - trace.tax"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.nopat + trace.da - trace.delta_nwc - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.taxable_income_cash_expensing == trace.cash_operating_surplus - trace.capex"
  - "trace.tax_cash_expensing == tax_rate * trace.taxable_income_cash_expensing"
  - "trace.fcff_cash_expensing == trace.cash_operating_surplus - trace.tax_cash_expensing - trace.capex"
  - "trace.taxable_income_cash_expensing[t] >= 0"
  - "sum(trace.fcff) - sum(trace.fcff_cash_expensing) == tax_rate * (sum(trace.da) - sum(trace.capex))"
  - "sum(trace.fcff) - sum(trace.fcff_cash_expensing) == tax_rate * (opening_nbv - trace.nbv_close[last])"
  - "trace.tax - trace.tax_cash_expensing == tax_rate * (trace.capex - trace.da)"

notes:
  - "Horizon choice. Seven periods is entailed, not chosen for convenience: the offset press has ten years of stated life and three are gone. The grid ends with both machines at exactly zero net book value, so the model embeds no implicit residual-value assumption at the edge. The price of that clean ending is that no terminal value is computed, and that continuing past the horizon requires re-equipping with an offset press at an outlay of the order of the founder's own stated purchase price - omit it and continuing cash flow is overstated."
  - "The single most important finding. The founder frames his cash-basis regime as a burden. On his own description of his receivables it is not a burden, it is a timing device. He says the twelve million outstanding is ALWAYS there at year end - a level, not a growing balance - so in every forecast year he collects what he bills, the cash base and the invoice base coincide exactly, and the regime changes nothing about how much tax he pays. What it does change is when. The tax effect in any year equals the rate times the movement in net working capital with the sign reversed, so a year of slippage relieves tax and the year of catch-up repays it. His fear is correctly aimed at volatility and at the working capital needed to survive a catch-up year, not at the level of the burden. Quantifying the spike would need a collection profile he did not give - which year, how much of the twelve - so the mechanism is modelled and the profile is left open."
  - "Judgment call on the machines under the cash rule, and why it was not left as prose. His sentence taxes what he actually disbursed, and a press purchase is literally a disbursement. Standard practice in cash-basis regimes is that the cash convention governs receipts and current expenses while capital assets stay capitalised and are written off over their life, and his own framing of the presses by their lives points the same way - so that is the base case. Because the alternative is a genuine fork rather than a nuance, the literal reading is carried as a fully derived and fully checked second column rather than as an assertion in prose. Direction of the result, which is counter-intuitive: the literal cash-expensing reading is WORSE for him across this horizon, because the book value already sunk into the two presses was paid before the grid opens and can never be deducted inside it, while only the replacement can."
  - "The largest source of error is not any modelling choice, it is the missing cost lines. The founder recited materials, four wages, rent and power - and nothing else. Absent: his own compensation; plates, blankets, chemicals, spares and machine servicing; transport and delivery; telephone and internet; insurance; the patente / CDL local business tax; bank charges; and employer social contributions if the seventy-five thousand is take-home. No anchor exists in the utterance to size any of them, so none was invented. They are carried as an explicit zero input and an explicit zero trace row so the hole is visible and so that answering the question is a one-line change. Direction: EBITDA, NOPAT and every FCFF figure here are overstated, and a printer's genuine maintenance and consumables bill on two presses is not a rounding item."
  - "Second-largest source of error: the revenue level. He said a GOOD year bills forty-eight million. Running his good year seven times in a row is an optimistic reading of his own sentence, and no bad-year figure was offered to average against it. Direction: the revenue line, and therefore FCFF, is biased upward."
  - "Day-count convention was validated, not assumed. His ninety-day term and his twelve-million year-end receivable are two independent statements, and they reconcile exactly on a 360-day commercial year. That fixes the convention by his own arithmetic rather than by my preference, and the same basis was then applied to the thirty-day supplier terms. A 365-day basis would fail to reproduce his own receivable figure."
  - "The permanent working capital is real even though the change in it is zero. Roughly ten and a half million of the founder's capital is locked into financing schools and NGOs, and it is locked in permanently because the balance never unwinds. It sits in the opening balance sheet and depresses what the business is worth. Modelling it as a recurring cash drain in every forecast year would double-count the same money seven times over, which is why the delta row is zero while the stock rows are not - both are materialised so the distinction is checkable rather than asserted."
  - "The most load-bearing unstated prior is the purchase date of the small digital press. It was assumed to have been bought alongside the offset, which puts its replacement at the start of period index two. Change that date and the replacement year moves, the opening net book value moves, and the capex profile moves with it. Everything else in the model is comparatively insensitive."
  - "Deliberate absences. No terminal value. No inflation or price escalation - constant-price throughout, since nothing was said about either. No inventory - assumed a print-to-order shop that buys paper against the confirmed job. No accrued liabilities on wages, rent or power. No tax-payable balance: tax is treated as settled in the year assessed, whereas instalments and arrears would shift cash between adjacent years. No debt and no interest, which is doctrinally correct for an asset-side measure but leaves open whether the business is actually financed to survive a ninety-day-plus collection cycle - that is a question about viability, not about FCFF."
  - "Open questions that would most improve this model, in order: what are the missing overheads and do you pay yourself; are the forty-eight million billings inclusive or exclusive of VAT, given that NGO and donor work is frequently exempt or zero-rated and irrecoverable input VAT would become a real cost; does the inspector allow amortisation of the presses under your cash regime; when was the digital press bought; what does a bad year bill; is there a minimum turnover-based levy underneath the profits tax and at what rate; do you actually pay the paper supplier at thirty days or do you stretch when clients are slow; and, for any capacity view at all, how many impressions a year do the two presses run."
  - "MECHANISM INERTNESS -- the central finding of this gold's physical audit, recorded here because it is a finding ABOUT the gold rather than about the business. The auditor did not merely inspect this derivation, it MUTATED it: it re-computed the model taxing accrual EBIT and ignoring the cash-basis rule entirely -- no cash receipts, no disbursements, no working-capital bridge -- and obtained the IDENTICAL FCFF vector with every check still passing. A sign flip in the load-bearing identity (surplus = EBITDA PLUS the change in working capital) likewise changed nothing and broke nothing. So this gold cannot distinguish a correct implementation of the mechanism in its own title from total non-implementation of it. The cause is not in the derivation, which is sound: it is that a LEVEL receivable makes the cash base and the accrual base identical, so the mechanism is switched off before the arithmetic starts. The utterance itself is in tension on exactly this point -- it says the receivable is *toujours* about twelve at year end (a level) and also that *l annee ou ils me reglent tout d un coup, je prends l impot en pleine figure* (not a level). The author resolved toward the level, defensibly. What this gold therefore tests is the working-capital trap it does defend well -- an engine that wrongly subtracts the receivable STOCK as a period-zero drain does fail its checks -- and not the cash-basis tax mechanism. A sibling built from an utterance with a genuinely MOVING receivable is queued; that is where the mechanism bites."

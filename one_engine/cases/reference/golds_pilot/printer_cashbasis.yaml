id: ouaga-imprimerie-cash-basis-fcff-v1
title: "Imprimerie a Ouagadougou - unlevered FCFF (NOPAT build) under a cash-basis (encaissements/decaissements) tax regime, 7 annual periods"
currency: XOF
grid:
  periods: 7
  freq: annual

utterance:
  fr: |
    Je suis imprimeur a Ouagadougou. Je fais surtout des travaux pour les ecoles, les ONG et les
    projets - des cahiers d'exercices, des rapports, des affiches, des baches. Une bonne annee je
    facture dans les quarante-huit millions. Le papier et l'encre me prennent a peu pres quarante
    pour cent de ce que je facture. J'ai deux machines, une offset que j'ai achetee quinze millions
    il y a trois ans - elle me fera dix ans - et une petite numerique a quatre millions qui tient
    cinq ans. J'ai quatre employes a soixante-quinze mille par mois, l'atelier c'est trois cent
    cinquante mille par mois de loyer, et le courant tourne dans les cent quatre-vingt mille par
    mois. Le probleme c'est que mes clients ne paient pas vite : les ecoles et les ONG me reglent a
    quatre-vingt-dix jours, parfois plus, et sur mes quarante-huit millions il y en a toujours a peu
    pres douze qui trainent en fin d'annee. Mes fournisseurs de papier, eux, me font trente jours.
    Et voila ce qui est particulier chez moi : l'administration me taxe sur ce que j'ai reellement
    encaisse moins ce que j'ai reellement decaisse dans l'annee - pas sur mes factures. Le comptable
    appelle ca la comptabilite de tresorerie. Donc quand mes clients trainent, je facture beaucoup
    mais je paie peu d'impot cette annee-la, et l'annee ou ils me reglent tout d'un coup, je prends
    l'impot en pleine figure.
  en: |
    I am a printer in Ouagadougou. I mostly do work for schools, NGOs and donor projects - exercise
    books, reports, posters, banners. In a good year I bill around forty-eight million. Paper and
    ink take roughly forty percent of what I bill. I have two machines, an offset press I bought
    for fifteen million three years ago - it will last me ten years - and a small digital press at
    four million that lasts five years. I have four employees at seventy-five thousand a month, the
    workshop is three hundred and fifty thousand a month in rent, and electricity runs at about one
    hundred and eighty thousand a month. The problem is that my clients do not pay quickly: the
    schools and the NGOs settle at ninety days, sometimes more, and out of my forty-eight million
    there are always about twelve that are still outstanding at year end. My paper suppliers give
    me thirty days. And here is what is peculiar in my case: the administration taxes me on what I
    have actually collected less what I have actually disbursed during the year - not on my
    invoices. The accountant calls it cash-basis accounting. So when my clients drag their feet, I
    bill a lot but I pay little tax that year, and the year they settle everything at once, I take
    the tax full in the face.


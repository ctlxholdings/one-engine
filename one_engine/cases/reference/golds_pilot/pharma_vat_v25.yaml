notes:
  - "CROYANCE CONTRE REGLE. Le fondateur dit « les medicaments essentiels sont exoneres ». La regle senegalaise n est pas indexee sur l essentialite : l exoneration de TVA porte sur une liste limitative de medicaments, produits pharmaceutiques et materiels specialises annexee au Livre II du CGI. Les deux objets sont conserves separement dans les inputs : ce qu il facture est un fait sur son affaire (STATED, output_vat_charged = 0) ; le perimetre de l exoneration est un fait sur le monde (SOURCED). L ecart ne devient operant que par taxable_sales_share."
  - "SON INTUITION JURIDIQUE EST JUSTE. « Elle reste chez moi, elle devient un cout sec » est exactement la doctrine : exoneration n est pas taux zero. Un exportateur taxe a 0 % deduit et se fait restituer ; un operateur exonere ne deduit pas. Je l ai verifie plutot que de le croire, precisement parce que c est le genre d affirmation qui, fausse, ferait boucler l arithmetique autour d un faux."
  - "OU VIT LA TVA MORTE. Elle n a pas de ligne propre : par IAS 2.11 et IAS 16.16(a) elle est incorporee au cout. Elle est donc dans le loyer, dans l electricite, dans le carburant, et dans la base amortissable du materiel. Je l ai neanmoins materialisee en lignes de trace distinctes (irrecoverable_vat_opex, irrecoverable_vat_in_d_and_a, irrecoverable_vat_in_capex, vat_dead_cost_pl) parce que c est l objet meme de sa question et qu un lecteur doit pouvoir la voir sans la recalculer. Ces lignes sont descriptives : elles ne modifient aucun agregat."
  - "LE JUGEMENT PIVOT. Lire les montants cites comme TTC plutot que HT est le choix qui deplace le plus le resultat, et c est un choix, pas une deduction. Il est defendable parce que le carburant (prix a la pompe administre) et l electricite (facture Senelec) sont TTC par construction, et parce que c est le choix omettant. S il repond « HT », les couts d exploitation montent et le flux libre descend. Direction seulement — la question est attachee a l input, pas resolue par un scenario chiffre."
  - "CEL INCLUSE, MALGRE SON SILENCE. Il ne mentionne aucune fiscalite locale ; l omettre aurait surestime le flux libre. La CEL est materialisee en trois lignes separees (locaux loues, installations propres, valeur ajoutee) pour qu un lecteur puisse contester chaque morceau independamment. Robustesse constatee : le plancher de la CEL-VA mord sur toutes les definitions plausibles de l assiette de valeur ajoutee, de sorte que l incertitude de definition ne change pas la reponse."
  - "CEL — RELIEF POSSIBLE NON RETENU. Un minimum reduit de CEL-VA existe pour les secteurs a faible marge ou a prix reglementes. La distribution pharmaceutique senegalaise remplit a priori les deux criteres. J ai retenu le minimum de droit commun, qui est le choix conservateur ; si le regime reduit lui est applicable, la charge serait plus faible. Direction seulement."
  - "CEL — JUGEMENT SUR L ASSIETTE. J ai inclus l equipement frigorifique dans l assiette CEL-VL des installations inscrites a l actif, et exclu les camionnettes comme materiel roulant. C est une lecture de la regle appliquee a son cas, pas une citation ; elle est isolee dans sa propre ligne de trace pour pouvoir etre contestee seule."
  - "MESURE FISCALE RECENTE QU IL NE MENTIONNE PAS. Le droit de timbre de 1 % sur les paiements en especes (loi n° 2025-17 du 27 septembre 2025, applicable depuis le 4 octobre 2025) est posterieur a la mise en place de son affaire. Cote ventes il est neutralise par l exoneration des produits pharmaceutiques confirmee par la DGID en fevrier 2026 ; cote decaissements il reste ouvert et depend de la maniere dont il regle loyer, salaires et carburant. Reserve consignee dans l input : je n ai pas trouve, a la date de verification, la preuve de publication de l arrete d application annonce."
  - "REPERE DE MARGE. Les marges de grossistes prives observees au Senegal sont publiees a 13–30 % (marques) et 19–34 % (generiques), et les marges du secteur prive n y sont pas officiellement reglementees. Sa marge de 12 % se situe donc sous le bas de la fourchette publiee. Je n ai pas corrige son chiffre : sa marge est un fait sur son affaire. Mais l ecart merite d etre porte a sa connaissance — soit il opere au plus bas du marche, soit le couple (600 M, 12 %) est approximatif."
  - "FRICTION DE BASE DE MARGE. Le prix public des medicaments est calcule au Senegal selon une structure administree ou les marges s appliquent au prix grossiste hors taxe (PGHT). Sa marge de 12 % s applique, elle, a son prix d achat. Ce sont deux bases differentes ; je n ai pas force la sienne dans la structure reglementaire, parce qu il la definit sans ambiguite (« ce que j achete cent, je le revends cent douze »)."
  - "FORME JURIDIQUE. Non etablie. J ai applique la convention standard du build non leve — impot sur l EBIT au taux marginal des societes. Sous un regime d entreprise individuelle a l impot sur le revenu, a ce niveau de benefice, le taux effectif serait plus eleve et non plus faible. Direction seulement."
  - "AMORTISSEMENTS. Amortissement comptable pris egal a l amortissement fiscal, lineaire sur les durees qu il enonce, sans valeur residuelle et sans impot differe. Introduire une divergence de base fiscale reviendrait a inventer un regime qu il n a pas decrit."
  - "PAS DE VALEUR TERMINALE, PAS DE FINANCEMENT, PAS D INFLATION. Prix nominaux constants sur toute la grille, ce qui est aussi pourquoi les camionnettes de remplacement coutent le cout nominal des originales. Cette convention et revenue_growth = 0 disent la meme chose et doivent bouger ensemble : un lecteur qui indexe le chiffre d affaires doit indexer les couts et le cout de remplacement."
  - "AGE DES CAMIONNETTES — POURQUOI MOYEN ET NON HAUT. La duree de vie des camionnettes (6 ans) etant inferieure a l horizon (7 ans), toute reponse entre 0 et 5 ans laisse exactement un remplacement dans la fenetre. Sa reponse deplace le CALENDRIER des 18 000 000, pas leur presence, et laisse donc le total sur l horizon inchange. C est la raison du classement, et c est aussi ce que garantit le check sum(trace.capex) == vans_capitalised_cost."
  - "AMBIGUITE DU FRANCAIS SUR « ELLES FONT SIX ANS ». La phrase peut se lire « elles durent six ans » ou « elles ont six ans ». J ai suivi la traduction parallele (duree de vie) et la symetrie avec « ca dure dix ans » pour les chambres froides, et j ai isole l autre lecture dans la question elicitee sur l age. Si la reponse est « elles ont six ans », elles sont deja en fin de vie et le remplacement bascule en periode 1."
  - "AUCUN INPUT ASSUME. J ai cherche une quantite que ni le fondateur ne pourrait enoncer ni le monde ne permettrait de rechercher, et je n en ai pas trouve qui entre materiellement dans la derivation. Les deux qui s en approchent le plus ont ete classees en conventions nommees plutot qu en priors silencieux : le cout de remplacement a prix nominaux constants, et le remplacement immediat sans interruption de service. Une seule zone reste faible : la classe de risque accidents du travail (1–5 %) applicable a la distribution pharmaceutique, que je n ai pas pu sourcer ; elle ne sert qu a borner le haut d une fourchette elicitee et n entre dans aucun calcul du cas de base."
  - "LES TROIS QUESTIONS, S IL N EN REPOND QUE TROIS. (1) Les montants mensuels sont-ils TTC ou HT ? (2) Le chiffre d affaires croit-il ? (3) Les 110 000 sont-ils votre cout ou le net en main du salarie ? Les trois deplacent le resultat davantage que toutes les autres reunies, et la deuxieme rallume a elle seule les trois questions de fonds de roulement classees basses."
  - "DIFFERE. Creances douteuses et officines qui trainent — il ne dit rien d impayes. Frequence et structure des tournees de livraison — le carburant est donne en forfait mensuel, donc rien ne dependait de la reponse ici, mais une extension de perimetre en dependrait. Clause d indexation du bail du depot. ASSURANCE : elle n apparait dans aucune de ses lignes de couts, or un grossiste sous temperature dirigee assure normalement stock et rupture de chaine du froid — c est l omission la plus visible de sa liste et la premiere charge que je chercherais a confirmer. Redevances et droits d etablissement pharmaceutique au titre de la reglementation sectorielle. Aucun de ces postes n a ete chiffre par defaut : les omettre est visible, les inventer ne l aurait pas ete."

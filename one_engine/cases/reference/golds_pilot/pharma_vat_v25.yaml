  # --- definition: the ladder down to EBIT ---
  - "trace.ebitda == trace.revenue - trace.cogs - trace.opex - trace.cel - trace.stamp_duty"
  - "trace.dep_coldchain == coldchain_capitalised_cost / warehouse_fitout_life_years"
  - "trace.dep_vans == vans_capitalised_cost / vans_life_years"
  - "trace.d_and_a == trace.dep_coldchain + trace.dep_vans"
  - "trace.ebit == trace.ebitda - trace.d_and_a"

  # --- driver-bridge / definition: tax ---

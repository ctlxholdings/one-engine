  vat_standard_rate:
    value: 0.18
    unit: ratio
    prov: SOURCED
    source: "Taux de droit commun de la TVA au Senegal, applique au loyer, a l electricite, au carburant/entretien et au materiel. Le taux reduit de 10 % est reserve a l hebergement et a la restauration touristiques agrees et ne concerne aucune des lignes du fondateur."
    authority: "Senegal, Code general des impots (loi n° 2012-31 du 31 decembre 2012 modifiee), Livre II — Taxes indirectes, regime de la TVA : taux de droit commun 18 %. Corrobore par PwC Worldwide Tax Summaries — Senegal, rubrique « Other taxes / Value-added tax », derniere revue 31 mars 2026, https://taxsummaries.pwc.com/senegal/corporate/other-taxes"
    verified: "2026-07-27"

  medicines_vat_exempt:
    value: true
    unit: boolean
    prov: SOURCED
    source: "Le fondateur dit « les medicaments essentiels sont exoneres ». La regle n est pas indexee sur une notion d essentialite : l exoneration porte sur une LISTE LIMITATIVE de medicaments, produits pharmaceutiques et materiels specialises pour l activite medicale. Deux objets distincts : ce qu il croit (fait sur son affaire) et ce que dit la regle (fait sur le monde). L ecart ne mord que s il distribue des lignes hors liste — voir taxable_sales_share."
    authority: "Senegal, CGI, Livre II, article 361 (operations exonerees de TVA), l exoneration des livraisons de medicaments et materiels medicaux etant delimitee par la liste limitative de l annexe II au Livre II du CGI ; commentaires et communiques de la Direction generale des Impots et des Domaines (DGID), https://www.dgid.sn/"
    verified: "2026-07-27"

  exempt_output_gives_no_deduction_right:
    value: true
    unit: boolean
    prov: SOURCED
    source: "Verification de l intuition du fondateur (« elle reste chez moi, elle devient un cout sec ») : elle est juridiquement exacte. Une operation EXONEREE n ouvre aucun droit a deduction de la TVA d amont, a la difference d une operation taxee au TAUX ZERO (exportations) qui ouvre droit a deduction et a restitution du credit. Ses ventes etant integralement exonerees, son prorata de deduction est nul et la totalite de sa TVA d amont est un cout definitif."
    authority: "Senegal, CGI, Livre II, regime des deductions — articles 381 a 383 (exclusions et limitations du droit a deduction, prorata) ; principe general selon lequel la TVA n est deductible que si elle greve des biens et services utilises pour la realisation d operations ouvrant droit a deduction."
    verified: "2026-07-27"

  irrecoverable_vat_is_part_of_asset_cost:
    value: true
    unit: boolean
    prov: SOURCED
    source: "Traitement comptable de la TVA non recuperable : elle n est pas une creance fiscale mais une composante du cout du bien ou du service acquis. Consequence directe : elle ne figure pas sur une ligne separee du compte de resultat, elle est A L INTERIEUR du loyer, de l electricite, du carburant, et A L INTERIEUR de la base amortissable des chambres froides et des camionnettes."
    authority: "IAS 2.11 (« coût d achat ... droits de douane et autres taxes non recuperables ») et IAS 16.16(a) (« prix d achat ... droits de douane et taxes non remboursables »), IFRS Accounting Standards, IFRS Foundation."
    verified: "2026-07-27"

  corporate_tax_rate:
    value: 0.30
    unit: ratio
    prov: SOURCED

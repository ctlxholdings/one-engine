contract: "v2.5"
id: pharma_wholesale_dakar_vat_exempt_fcff
title: "Grossiste-repartiteur pharmaceutique a Dakar — FCFF non leve sur la duree de vie residuelle de la chaine du froid, avec TVA d amont non recuperable"
currency: XOF

grid:
  periods: 7
  freq: annual
  why: |
    SEPT PERIODES ANNUELLES, commencant a la date d analyse (2026-07-27).

    FREQUENCE. Le fondateur decrit son affaire dans deux rythmes seulement : un chiffre d affaires
    annuel (600 000 000) et une base de couts strictement mensuelle et fixe (salaires, loyer,
    carburant, electricite). Rien dans ses mots ne varie a l interieur d une annee : pas de saison,
    pas de campagne, pas de cycle de reapprovisionnement, pas de pic. Une grille mensuelle
    produirait 84 periodes en repliquant 84 fois le meme mois : elle n ajouterait aucune
    information et donnerait une fausse impression de finesse. Une grille annuelle ne perd rien.

    HORIZON. La chaine du froid EST cette affaire : un grossiste pharmaceutique sans temperature
    dirigee n est pas un grossiste pharmaceutique. Il dit l avoir equipee il y a trois ans pour une
    duree de vie de dix ans. Sept ans, c est exactement ce qui en reste. La periode 7 est donc la
    derniere annee ou la question « que degage la base d actifs existante ? » a une reponse qui ne
    depend pas d une decision non encore prise : refaire ou non le depot, a quel prix, a quelle
    specification, et — c est tout l objet de sa plainte — en supportant quelle TVA non
    recuperable. Aller a dix ans m obligerait a inventer ce reinvestissement. S arreter a trois ou
    cinq ans couperait l horizon avant que le cycle des camionnettes (six ans) ne se boucle une
    seule fois, or c est precisement au remplacement des camionnettes que la seconde moitie de son
    probleme de TVA redevient du cash. Sept ans contient exactement un remplacement complet de
    flotte et exactement zero remplacement invente de chaine du froid.

    CE QUE CE CHOIX COUTE. Il n y a pas de valeur terminale et il ne doit pas y en avoir : au-dela
    de la periode 7 la question change de nature. Un lecteur qui pense que les chambres froides
    tiendront au-dela de dix ans, ou qui veut une valeur d entreprise, doit allonger la grille et
    obtiendra une reponse differente et tout aussi legitime. Le choix est rendu mecanique et
    refutable par le check
    « warehouse_fitout_life_years - warehouse_fitout_age_years == grid.periods »
    et par le check « trace.nbv_coldchain[last] == 0 ».

utterance:
  fr: |
    Je suis grossiste en medicaments a Dakar. J approvisionne les pharmacies de la region — je livre
    a peu pres quatre-vingts officines. Je fais dans les six cents millions de chiffre d affaires par
    an et je travaille sur une marge de douze pour cent sur le prix d achat : ce que j achete cent,
    je le revends cent douze. J ai un depot sous temperature controlee que j ai equipe pour
    quarante-cinq millions il y a trois ans — les chambres froides et les groupes, ca dure dix ans.
    J ai deux camionnettes refrigerees achetees ensemble dix-huit millions, elles font six ans. Huit
    employes a cent dix mille par mois, le depot a un million deux cent mille par mois de loyer, le
    carburant et l entretien des camionnettes deux cent mille par mois, et l electricite — avec le
    froid qui tourne jour et nuit — sept cent mille par mois. Voila ma difficulte avec la TVA : les
    medicaments essentiels sont exoneres, donc je ne facture aucune TVA aux pharmacies. Mais la TVA
    que moi je paie sur le loyer du depot, sur l electricite, sur le carburant, sur l entretien —
    celle-la je ne peux pas la recuperer, justement parce que mes ventes sont exonerees. Elle reste
    chez moi, elle devient un cout sec. Et sur le materiel aussi : quand j ai achete les chambres
    froides et les camionnettes, la TVA que j ai payee dessus, je ne l ai jamais recuperee non plus.
  en: |
    I am a pharmaceutical wholesaler in Dakar. I supply the pharmacies of the region — I deliver to
    roughly eighty dispensaries. I do around six hundred million in turnover a year and I work on a
    twelve percent margin on the purchase price: what I buy at a hundred, I resell at a hundred and
    twelve. I have a temperature-controlled warehouse that I fitted out for forty-five million three
    years ago — the cold rooms and the compressor units last ten years. I have two refrigerated vans
    bought together for eighteen million, they last six years. Eight employees at a hundred and ten
    thousand a month, the warehouse at one million two hundred thousand a month in rent, fuel and
    maintenance of the vans two hundred thousand a month, and electricity — with the refrigeration
    running day and night — seven hundred thousand a month. Here is my difficulty with VAT:
    essential medicines are exempt, so I charge no VAT to the pharmacies. But the VAT that I myself
    pay on the warehouse rent, on electricity, on fuel, on maintenance — that one I cannot reclaim,
    precisely because my sales are exempt. It stays with me, it becomes a dead cost. And on the
    equipment too: when I bought the cold rooms and the vans, the VAT I paid on them, I never
    reclaimed that either.


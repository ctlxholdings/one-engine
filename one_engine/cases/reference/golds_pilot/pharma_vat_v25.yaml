  - "trace.nbv_vans[t] == trace.nbv_vans[t-1] + trace.capex[t] - trace.dep_vans[t] for t >= 1"
  - "trace.net_ppe == trace.nbv_coldchain + trace.nbv_vans"
  - "trace.net_ppe == trace.net_ppe_opening + trace.capex - trace.d_and_a"
  - "trace.net_ppe_opening[first] == ppe_opening_nbv"
  - "trace.net_ppe_opening[t] == trace.net_ppe[t-1] for t >= 1"

  # --- conservation / definition: capital expenditure ---

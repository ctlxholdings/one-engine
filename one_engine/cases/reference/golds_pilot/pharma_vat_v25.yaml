checks:
  # --- grid / horizon (the choice made falsifiable) ---
  - "warehouse_fitout_life_years - warehouse_fitout_age_years == grid.periods"
  - "trace.nbv_coldchain[last] == 0"
  - "revenue_per_pharmacy_year * pharmacies_served == revenue_annual"

  # --- driver-bridge: revenue and cost of goods ---
  - "trace.revenue[first] == revenue_annual"
  - "trace.revenue[t] == trace.revenue[t-1] * (1 + revenue_growth) for t >= 1"
  - "trace.cogs * (1 + markup_on_purchase) == trace.revenue"
  - "trace.gross_profit == trace.revenue - trace.cogs"

  # --- driver-bridge: operating cost base ---
  - "trace.payroll == headcount * wage_per_employee_month * 12 * (1 + employer_social_charge_rate)"
  - "trace.opex_vatable_cash == (rent_month + fuel_maintenance_month + electricity_month) * 12"
  - "trace.rent_ht * (1 + vat_standard_rate) == rent_month * 12"
  - "trace.opex_vatable_cash == trace.opex_vatable_ht + trace.irrecoverable_vat_opex"
  - "trace.irrecoverable_vat_opex == trace.opex_vatable_ht * vat_standard_rate"
  - "trace.opex == trace.payroll + trace.opex_vatable_cash"

  # --- driver-bridge: local business tax (CEL) ---
  - "trace.value_added == trace.revenue - trace.cogs - trace.opex_vatable_cash"
  - "trace.cel_vl_leased == trace.rent_ht * cel_vl_rate_leased"
  - "trace.cel_vl_owned == coldchain_capitalised_cost * cel_vl_owned_valeur_locative_pct * cel_vl_rate_owned"
  - "trace.cel_va_computed == trace.value_added * cel_va_rate"
  - "trace.cel_va >= trace.cel_va_computed"
  - "trace.cel_va >= trace.revenue * cel_va_floor_rate"
  - "trace.cel == trace.cel_vl_leased + trace.cel_vl_owned + trace.cel_va"

  # --- driver-bridge: cash stamp duty ---

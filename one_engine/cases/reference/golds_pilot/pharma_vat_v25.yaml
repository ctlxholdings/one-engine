  - "trace.tax_imf_uncapped == trace.revenue * imf_rate"
  - "trace.tax_imf >= imf_floor"
  - "trace.tax_imf <= imf_cap"
  - "trace.tax >= trace.tax_is"
  - "trace.tax >= trace.tax_imf"
  - "trace.nopat == trace.ebit - trace.tax"

  # --- driver-bridge / conservation: working capital ---
  - "trace.receivables == trace.revenue * dso_days / 365"
  - "trace.inventory == trace.cogs * dio_days / 365"
  - "trace.payables == trace.cogs * dpo_days / 365"
  - "trace.nwc == trace.receivables + trace.inventory - trace.payables"
  - "trace.nwc == trace.nwc_opening + trace.delta_nwc"
  - "trace.nwc_opening[t] == trace.nwc[t-1] for t >= 1"
  - "trace.nwc_opening[first] == nwc_opening_balance"
  - "cumsum(trace.delta_nwc) == trace.nwc - nwc_opening_balance"

  # --- conservation: fixed asset roll-forwards ---

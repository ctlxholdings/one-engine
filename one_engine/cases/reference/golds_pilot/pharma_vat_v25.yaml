    value: 0.005
    unit: ratio of turnover excl. VAT
    prov: SOURCED
    source: "Impot minimum forfaitaire : plancher d imposition applicable lorsque l IS de droit commun lui est inferieur. Materialise dans la trace parce que c est la contrainte qui mord des que la marge se comprime — un lecteur doit pouvoir constater qu elle n a pas mordu."
    authority: "Senegal, CGI, articles 38 et 39 — impot minimum forfaitaire assis sur le chiffre d affaires hors taxes au taux de 0,5 %, ni inferieur a 500 000 FCFA ni superieur a 5 000 000 FCFA."
    verified: "2026-07-27"

  imf_floor:
    value: 500000

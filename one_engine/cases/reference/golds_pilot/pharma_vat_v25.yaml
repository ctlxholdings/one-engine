    authority: "Senegal, CGI (loi n° 2012-31 du 31 decembre 2012 modifiee), impot sur les societes — taux 30 %. PwC Worldwide Tax Summaries — Senegal, « Taxes on corporate income », derniere revue 31 mars 2026, https://taxsummaries.pwc.com/senegal/corporate/taxes-on-corporate-income ; flyer IS de la DGID, https://www.dgid.sn/"
    verified: "2026-07-27"


passage: |
  0. QUEL GENRE D AFFAIRE, DANS SES PROPRES UNITES

  C est un grossiste-repartiteur : il achete des presentations finies aupres d importateurs et de
  laboratoires et les eclate vers 80 officines de la region de Dakar. Ses quantites naturelles sont
  le nombre d officines servies (80), le chiffre d affaires annuel qu il encaisse aupres d elles
  (600 000 000 XOF), et une marge exprimee sur le PRIX D ACHAT. « Ce que j achete cent, je le
  revends cent douze » est sans ambiguite : 12 % est une marge sur cout, pas une marge sur ventes.
  Ce sont deux nombres differents, et les confondre est l erreur la plus courante en modelisation de
  negoce. Marge sur ventes = 12/112 = 10,7142857 %.

  Deuxieme quantite naturelle : la chaine du froid. Il ne parle ni de palettes ni de lignes de
  commande ; il parle d un depot sous temperature controlee equipe pour 45 000 000 et de deux
  camionnettes refrigerees achetees ensemble 18 000 000. Pour un grossiste du froid, ce ne sont pas
  deux immobilisations parmi d autres : ce SONT la capacite d exploitation, et leurs durees de vie
  residuelles sont ce qui borne l horizon repondable.

  FRICTION SIGNALEE : rien dans ses mots ne donne de volumes en boites, en cartons ou en lignes. Je
  n invente pas une decomposition prix unitaire x volume. Le chiffre d affaires reste au niveau ou
  il l enonce, et la marge sur cout fait le travail qu une construction en couts unitaires ferait
  autrement. C est une perte de finesse assumee, pas une omission.

  1. CHIFFRE D AFFAIRES ET COUT D ACHAT, PAR PERIODE

  Le chiffre d affaires est plat a 600 000 000 sur chacune des sept annees (aucune croissance
  n est enoncee — voir revenue_growth).

  S il achete 100 et revend 112, alors ventes = achats x 1,12, donc
  achats = 600 000 000 / 1,12 = 535 714 285,7142857 par an.
  Marge brute = 600 000 000 - 535 714 285,7142857 = 64 285 714,2857143.
  Par officine cela represente 7 500 000 de chiffre d affaires annuel, soit 625 000 par mois et par
  pharmacie : c est le bon ordre de grandeur pour une officine et c est la lentille de vraisemblance
  que j applique au couple (600 M, 80 officines).

  Point crucial et souvent manque sur le sens de la TVA ici : les medicaments sont exoneres a TOUS
  les stades de la chaine, donc ses ACHATS de medicaments ne portent pas de TVA non plus. Il le
  confirme implicitement — sa liste de TVA morte comprend le loyer, l electricite, le carburant,
  l entretien et le materiel, et jamais les medicaments eux-memes. Les 535 714 285,7142857 sont
  donc un montant propre, sans TVA, et aucun retraitement ne s y applique. Cela compte : un
  operateur ayant des achats taxes et des ventes exonerees serait ecrase par le differentiel ; ce
  n est pas sa situation.

  2. BASE DE COUTS D EXPLOITATION EN TRESORERIE, PAR PERIODE

  Masse salariale : 8 x 110 000 x 12 = 10 560 000.
    En base je traite 110 000 comme le COUT EMPLOYEUR COMPLET mensuel — c est le choix omettant, il
    n ajoute rien qu il n ait dit. Les cotisations patronales senegalaises (IPRES, prestations
    familiales, accidents du travail, CFCE) existent et sont sourcees ; savoir si ses salaries sont
    declares et si 110 000 est du net en main ou du cout total est une question que lui seul peut
    trancher, et c est l une de mes trois questions de haute materialite.
  Loyer : 1 200 000 x 12 = 14 400 000.
  Carburant et entretien des camionnettes : 200 000 x 12 = 2 400 000, soit 100 000 par camionnette
    et par mois pour 40 officines chacune.
  Electricite : 700 000 x 12 = 8 400 000. Il dit lui-meme pourquoi c est si lourd : « le froid qui
    tourne jour et nuit ». La refrigeration est une charge continue 24 h sur 24 ; c est la seule
    ligne ou la structure de couts d un grossiste du froid differe qualitativement de celle d un
    grossiste de produits secs, et c est aussi celle qui porte le plus de TVA morte.

  Trois de ces quatre lignes portent de la TVA (loyer, carburant/entretien, electricite) ; les
  salaires n en portent pas, etant hors champ.
  Couts en tresorerie porteurs de TVA = 14 400 000 + 2 400 000 + 8 400 000 = 25 200 000.
  Total des couts d exploitation en tresorerie = 10 560 000 + 25 200 000 = 35 760 000.

  3. LE PIEGE DE LA TVA, ENONCE EXACTEMENT

  Le recit du fondateur est juste sur le fond, et je le verifie contre la regle plutot que de
  l accepter.

  (i) Ses ventes sont exonerees. Le CGI senegalais exonere les livraisons de medicaments et de
  produits pharmaceutiques, l exoneration etant delimitee par une LISTE LIMITATIVE figurant a
  l annexe II du Livre II. Il dit « je ne facture aucune TVA aux pharmacies » : c est un fait sur
  SON affaire et je le prends tel quel — son prorata de deduction est nul. Il dit aussi « les
  medicaments essentiels sont exoneres » : c est une affirmation sur LE MONDE, et elle n est pas
  tout a fait la regle, car l exoneration n est pas indexee sur une notion d essentialite mais sur
  une liste. Ce sont deux objets distincts et je les tiens separes. L ecart ne mord que s il
  distribue des lignes hors liste — voir taxable_sales_share.

  (ii) Exoneration n est pas taux zero. Sous le regime des deductions, une operation exoneree
  n ouvre AUCUN droit a deduction de la TVA d amont, alors qu une exportation taxee a 0 % ouvre
  droit a deduction et a restitution du credit. C est exactement pour cela que sa TVA d amont est
  morte tandis que celle d un exportateur lui est remboursee. Son intuition — « elle reste chez moi,
  elle devient un cout sec » — est juridiquement exacte.

  (iii) Consequence comptable : la TVA non recuperable n est pas une creance fiscale, c est une
  composante du cout du bien ou du service acquis (IAS 2.11, IAS 16.16(a) — taxes non
  remboursables incluses dans le cout). Elle n a donc pas de ligne propre : elle est A L INTERIEUR
  du loyer, A L INTERIEUR de l electricite, A L INTERIEUR du carburant, et A L INTERIEUR du montant
  amortissable des chambres froides et des camionnettes.

  En base, je lis les montants qu il cite comme les montants qu il DECAISSE, TVA comprise. Deux des
  quatre le sont par construction — le carburant est vendu a un prix a la pompe administre dont la
  TVA est l une des composantes statutaires, et une facture Senelec est presentee TTC au client.
  Aligner le loyer sur elles est le traitement coherent, et c est le choix omettant : il n ajoute
  rien au-dessus de ce qu il a dit. C est ma question de plus haute materialite.

  Sur cette lecture, par an :
    Couts porteurs de TVA, TTC ........ 25 200 000
    dont service sous-jacent (HT) ..... 25 200 000 / 1,18 = 21 355 932,2033898
    dont TVA definitivement perdue .... 25 200 000 - 21 355 932,2033898 = 3 844 067,7966102
    (verification : 21 355 932,2033898 x 0,18 = 3 844 067,7966102)

  Et sur le capital : les chambres froides a 45 000 000 et les camionnettes a 18 000 000 sont
  capitalisees a ces montants, TVA incluse, et la TVA qu ils contiennent est passee en charge par
  l amortissement :
    chaine du froid : 45 000 000 x 18/118 / 10 = 6 864 406,7796610 / 10 = 686 440,6779661 par an
    camionnettes ... : 18 000 000 x 18/118 / 6 = 2 745 762,7118644 / 6 = 457 627,1186441 par an
    total ........... : 1 144 067,7966102 par an
  L identite elegante — parce que tous les actifs reposent sur la meme base TTC — est que la TVA
  morte transitant par l amortissement vaut exactement D&A x 18/118 :
    7 500 000 x 18/118 = 1 144 067,7966102. C est un check du modele, pas une coincidence.

  TVA morte totale frappant le compte de resultat chaque annee :
    3 844 067,7966102 + 1 144 067,7966102 = 4 988 135,5932203.
  C est le nombre dont sa plainte parle. Il est plus lourd que la totalite de son budget carburant
  et entretien.

  4. CONTRIBUTION ECONOMIQUE LOCALE, PAR PERIODE

  Il n en parle pas et elle n est pas optionnelle. Depuis 2018 la patente est remplacee par la
  contribution economique locale, due par toute personne exercant une activite commerciale sous un
  regime de benefice reel — ce qu il est certainement a 600 M de chiffre d affaires.

  CEL-VL sur le depot loue : la base est le loyer tel qu il figure au bail, pris hors TVA :
    14 400 000 / 1,18 = 12 203 389,8305085, au taux de 15 % applicable aux locaux pris a bail
    = 1 830 508,4745763.
  CEL-VL sur ses propres installations : les chambres froides sont des « installations et
  agencements » portes a son actif ; leur valeur locative est conventionnellement 7 % du prix de
  revient, taxee a 20 % :
    45 000 000 x 7 % x 20 % = 3 150 000 x 0,20 = 630 000.
    Les camionnettes sont du materiel roulant et je les laisse hors de l assiette des locaux.
  CEL-VA : valeur ajoutee = 600 000 000 - 535 714 285,7142857 - 25 200 000 = 39 085 714,2857143,
    a 1 % = 390 857,1428571 ; mais le minimum legal est de 0,15 % du chiffre d affaires de
    l annee precedente, soit 900 000, et ce plancher mord.
    Il mord confortablement : meme sur la lecture la plus defavorable de l assiette de valeur
    ajoutee — en y reintegrant loyer, electricite et carburant — 1 % de la valeur ajoutee reste
    sous 900 000. L incertitude de definition sur ce qui se deduit de la VA ne change donc PAS la
    reponse, ce qui est le genre de robustesse qu il faut constater plutot que supposer.
    CEL-VA = 900 000.

  CEL totale = 1 830 508,4745763 + 630 000 + 900 000 = 3 360 508,4745763 par an, deductible pour
  l assiette de l IS.

  5. DROIT DE TIMBRE SUR LES PAIEMENTS EN ESPECES

  Depuis le 4 octobre 2025, un droit de timbre de 1 % frappe tous les paiements en especes au
  Senegal, sans seuil ni plafond. Deux expositions en decoulent : ce que les officines lui versent,
  et ce que lui-meme decaisse en especes (loyer, salaires, carburant). La premiere est neutralisee —
  la DGID a confirme en fevrier 2026 que les produits pharmaceutiques en sont totalement exoneres.
  La seconde reste ouverte et il n a pas dit comment il regle. Base : aucun reglement en especes,
  donc 0 par an, la question restant attachee au chiffre.

  6. DE L EBITDA A L EBIT, PAR PERIODE

  EBITDA = 600 000 000 - 535 714 285,7142857 - 35 760 000 - 3 360 508,4745763 - 0
         = 64 285 714,2857143 - 35 760 000 - 3 360 508,4745763
         = 28 525 714,2857143 - 3 360 508,4745763
         = 25 165 205,8111380, identique sur chacune des sept annees.

  Amortissements. Lineaire sur les durees qu il enonce, valeur residuelle nulle, pas de
  reevaluation.
    Chaine du froid : 45 000 000 sur 10 ans = 4 500 000 par an. Trois annees sont consommees, donc
      la valeur nette comptable d ouverture est 45 000 000 - 13 500 000 = 31 500 000, et elle tombe
      exactement a zero a la fin de la periode 7. Ce n est pas une coincidence : c est ainsi que
      j ai choisi l horizon, et le check trace.nbv_coldchain[last] == 0 le rend refutable.
    Camionnettes : 18 000 000 sur 6 ans = 3 000 000 par an. Base : achetees en meme temps que
      l equipement du depot, il y a trois ans, donc VNC d ouverture 9 000 000, extinction a la fin
      de la periode 3. Remplacement au debut de la periode 4 au meme cout nominal ; la nouvelle
      flotte s amortit 3 000 000 par an sur les periodes 4 a 7 et laisse 6 000 000 de VNC a
      l horizon.
    Le remplacement etant immediat, l amortissement des camionnettes vaut 3 000 000 a chaque
      periode quel que soit leur age, et la dotation totale est plate a 7 500 000 sur les sept ans.
      Detail de la VNC totale, periodes 1 a 7 :
        chaine du froid : 27 000 000 ; 22 500 000 ; 18 000 000 ; 13 500 000 ; 9 000 000 ;
                          4 500 000 ; 0
        camionnettes ... : 6 000 000 ; 3 000 000 ; 0 ; 15 000 000 ; 12 000 000 ; 9 000 000 ;
                          6 000 000
        total .......... : 33 000 000 ; 25 500 000 ; 18 000 000 ; 28 500 000 ; 21 000 000 ;
                          13 500 000 ; 6 000 000

  EBIT = 25 165 205,8111380 - 7 500 000 = 17 665 205,8111380 a chaque periode.

  7. IMPOT, PAR PERIODE

  Build non leve : on impose l EBIT au taux marginal des societes, sans economie d impot liee a la
  dette — c est ce qui rend le resultat un flux du cote actif.
    IS a 30 % = 17 665 205,8111380 x 0,30 = 5 299 561,7433414.
    Test du minimum : IMF = 0,5 % x 600 000 000 = 3 000 000, a l interieur de la bande legale
      500 000 – 5 000 000. L IS le depasse a chaque periode, donc c est l IS qui est du. Le test est
      neanmoins materialise dans la trace, parce qu il devient la contrainte mordante des que la
      marge se comprime : un lecteur doit pouvoir CONSTATER qu il n a pas mordu plutot que me croire.
    Impot retenu = 5 299 561,7433414.
    NOPAT = 17 665 205,8111380 - 5 299 561,7433414 = 12 365 644,0677966.

  8. BESOIN EN FONDS DE ROULEMENT, PAR PERIODE

  Il n en a rien dit, et pour un grossiste c est la plus grosse chose qu il n ait pas dite. Sur les
  valeurs de travail elicitees de 45 jours de creances, 45 jours de stock et 60 jours de dettes
  fournisseurs :
    creances clients ... 600 000 000 x 45/365 = 73 972 602,7397260
    stocks ............. 535 714 285,7142857 x 45/365 = 66 046 966,7318982
    dettes fournisseurs  535 714 285,7142857 x 60/365 = 88 062 622,3091976
    BFR net ............ 73 972 602,7397260 + 66 046 966,7318982 - 88 062 622,3091976
                       = 51 956 947,1624266
  Le point important est structurel, pas numerique : a chiffre d affaires plat, le BFR est constant,
  donc la VARIATION de BFR est nulle a chaque periode et le NIVEAU du BFR ne touche pas du tout le
  FCFF. Seule sa variation compte. C est pour cela que je classe les trois questions de BFR en
  materialite basse RELATIVEMENT a la question de croissance — et pour cela que la question de
  croissance, qui les rallume, est classee haute.
  Cela implique aussi que le solde d ouverture n est pas nul : l affaire tourne depuis trois ans et
  porte deja ce stock de BFR. Le check de conservation est donc ecrit contre un solde d ouverture,
  et non depuis zero — ecrire cumsum(delta_nwc) == nwc supposerait a tort une entreprise creee ce
  matin.

  9. INVESTISSEMENT, PAR PERIODE

  Rien en periodes 1 a 3 ; 18 000 000 en periode 4 pour les deux camionnettes de remplacement ;
  rien ensuite. Aucun remplacement de chaine du froid, par construction de l horizon. Aucun produit
  de cession en base ; et comme les anciennes camionnettes sont integralement amorties, tout produit
  eventuel serait une plus-value entierement taxable et non une recuperation de valeur nette
  comptable.
  A noter : ce remplacement porte 18 000 000 x 18/118 = 2 745 762,7118644 de TVA qu il ne
  recuperera pas davantage — la seconde morsure exactement du probleme qu il decrit, et la raison
  pour laquelle l horizon doit etre assez long pour en contenir une.

  10. FCFF, PAR PERIODE

  FCFF = NOPAT + D&A - variation de BFR - investissement net.
    Periodes 1, 2, 3, 5, 6, 7 :
      12 365 644,0677966 + 7 500 000 - 0 - 0 = 19 865 644,0677966
    Periode 4 :
      12 365 644,0677966 + 7 500 000 - 0 - 18 000 000 = 1 865 644,0677966
    Total sur les sept annees : 6 x 19 865 644,0677966 + 1 865 644,0677966
                              = 119 193 864,4067796 + 1 865 644,0677966
                              = 121 059 508,4745762

  Contre-verification par la route des flux :
    CFO = NOPAT + D&A - variation de BFR = 19 865 644,0677966 a chaque periode ;
    CFI = - investissement net = 0 partout sauf -18 000 000 en periode 4 ;
    FCFF = CFO + CFI. Memes nombres.

  11. LECTURE

  Sur 600 000 000 de chiffre d affaires, l affaire degage environ 19,9 M de flux libre en annee
  courante et environ 1,9 M l annee ou elle renouvelle sa flotte. La TVA morte de 4 988 135,5932203
  par an — celle dont il parle — represente plus du quart de son EBIT et environ le quart de son
  flux libre d annee courante. Ce n est pas un detail de presentation : c est, en ordre de grandeur,
  la difference entre une affaire confortable et une affaire tendue, et elle est integralement le
  produit du regime d exoneration, non de son exploitation.


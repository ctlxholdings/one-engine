    authority: "Senegal, CGI, articles 38 et 39."
    verified: "2026-07-27"

  cel_vl_rate_leased:
    value: 0.15
    unit: ratio
    prov: SOURCED
    source: "Contribution economique locale — valeur locative, taux applicable aux locaux PRIS A BAIL. Le fondateur ne mentionne pas la CEL ; elle n est pas optionnelle : elle est due par toute personne exercant une activite commerciale soumise a un regime de benefice reel, ce qui est certainement son cas a 600 M de chiffre d affaires. Base retenue : le loyer tel qu il figure au bail, hors TVA."
    authority: "Senegal, CGI, articles 320 et suivants — contribution economique locale instituee par la loi n° 2018-10 du 30 mars 2018 en remplacement de la patente ; CEL-VL 15 % pour les locaux loues ou occupes a titre gratuit. Depliant CEL-VL de la DGID, https://www.dgid.sn/wp-content/uploads/2022/03/DEPLIANT-CEL-RECTO-1-3.pdf ; PwC Worldwide Tax Summaries — Senegal, « Other taxes / Local economic contribution », revue 31 mars 2026."
    verified: "2026-07-27"

  cel_vl_rate_owned:
    value: 0.20
    unit: ratio
    prov: SOURCED
    source: "CEL-VL, taux applicable aux locaux, terrains, installations et agencements INSCRITS A L ACTIF. Applique ici a l equipement frigorifique du depot, qui est un agencement porte a son bilan."
    authority: "Senegal, CGI, articles 320 et suivants (loi n° 2018-10 du 30 mars 2018) ; PwC WWTS — Senegal, « Other taxes » : « The applicable rates are 15% for leased premises and 20% for owned premises, lands, and installations »."
    verified: "2026-07-27"

  cel_vl_owned_valeur_locative_pct:
    value: 0.07
    unit: ratio of cost price
    prov: SOURCED
    source: "Determination conventionnelle de la valeur locative des biens inscrits a l actif : 7 % du prix de revient."
    authority: "Senegal, CGI, article 291 (determination de la valeur locative) renvoye par les articles 320 et suivants ; PwC WWTS — Senegal : « The rental value corresponds to 7% of the cost price »."
    verified: "2026-07-27"

  cel_va_rate:
    value: 0.01
    unit: ratio of value added
    prov: SOURCED
    source: "CEL — valeur ajoutee, taux de 1 % sur la valeur ajoutee de l exercice precedent, plafonnee a 70 % du chiffre d affaires (plafond non mordant ici)."
    authority: "Senegal, CGI, articles 320 et suivants (loi n° 2018-10 du 30 mars 2018) ; PwC WWTS — Senegal, « Other taxes »."
    verified: "2026-07-27"

  cel_va_floor_rate:
    value: 0.0015
    unit: ratio of prior-year turnover
    prov: SOURCED
    source: "Minimum de la CEL-VA : 0,15 % du chiffre d affaires de l annee precedente. Un minimum reduit a 0,075 % existe pour les contribuables des secteurs a faible marge ou a prix reglementes ; la distribution pharmaceutique remplit a priori les deux criteres, mais l eligibilite effective releve de l administration et je retiens le taux de droit commun, qui est le choix conservateur."
    authority: "Senegal, CGI, articles 320 et suivants (loi n° 2018-10 du 30 mars 2018) ; PwC WWTS — Senegal : « the contribution must not be less than 0.15% of the prior year's turnover. For taxpayers operating in low-margin sectors or sectors with regulated prices, the minimum contribution threshold is reduced to 0.075% »."
    verified: "2026-07-27"

  cash_stamp_duty_rate:
    value: 0.01
    unit: ratio of cash payment
    prov: SOURCED
    source: "Droit de timbre de 1 % etendu a TOUS les paiements en especes, sans seuil ni plafond (auparavant limite aux montants superieurs a 100 000 FCFA). Le fondateur n en parle pas — la mesure est posterieure a la construction de son affaire. Deux expositions : ce que les officines lui versent, et ce que lui-meme decaisse en especes (loyer, salaires, carburant). Voir cash_settlement_share_opex."
    authority: "Senegal, loi n° 2025-17 du 27 septembre 2025 modifiant certaines dispositions de la loi n° 2012-31 portant Code general des impots, publiee au Journal officiel du 2 octobre 2025, applicable depuis le 4 octobre 2025."
    verified: "2026-07-27"

  pharmaceutical_products_exempt_from_cash_stamp_duty:
    value: true
    unit: boolean
    prov: SOURCED
    source: "Neutralise le risque du cote des ventes : les reglements en especes des officines portant sur des produits pharmaceutiques ne supportent pas le droit de timbre de 1 %. Reserve honnete : au 2026-07-27 je trouve la confirmation publique de la DGID (23 fevrier 2026) et l annonce d un arrete d application « dans les prochains jours », mais pas la preuve de publication de cet arrete ; je n ai trouve aucune mesure contraire."
    authority: "Direction generale des Impots et des Domaines du Senegal, position confirmee au Syndicat des Pharmaciens prives du Senegal et rendue publique le 23 fevrier 2026 (Agence de Presse Senegalaise, https://aps.sn/ ; SenePlus ; EnQuete+), a la suite de la loi n° 2025-17 du 27 septembre 2025."
    verified: "2026-07-27"

  benchmark_private_wholesale_markup_low:
    value: 0.13
    unit: ratio
    prov: SOURCED
    source: "Repere publie, PAS un driver du modele : les marges des grossistes prives au Senegal sont estimees a 13–30 % sur les produits de marque et 19–34 % sur les generiques, et les marges du secteur prive n y sont pas officiellement reglementees. La marge de 12 % annoncee par le fondateur se situe donc juste SOUS le bas de la fourchette observee. Je n ai pas corrige son chiffre : c est un fait sur son affaire, pas sur le monde."
    authority: "OMS, WHO Guideline on Country Pharmaceutical Pricing Policies — Evidence summary 1 : Regulation of mark-ups in the pharmaceutical supply chain, NCBI Bookshelf NBK258615, https://www.ncbi.nlm.nih.gov/books/NBK258615/"
    verified: "2026-07-27"

  pharma_public_price_structure_regulated:
    value: true
    unit: boolean
    prov: SOURCED
    source: "Le prix public des medicaments au Senegal est calcule selon une structure administree : au prix grossiste hors taxe s ajoutent les frais de mise a CAF (10 %), le transit local (1,5 % de la valeur CAF), le timbre douanier, puis les marges des grossistes-repartiteurs et des pharmaciens d officine. Friction a signaler : dans cette structure les marges s appliquent au PGHT, alors que la marge de 12 % du fondateur s applique a son prix d achat. Bases differentes ; j ai garde la sienne, qu il definit sans ambiguite."
    authority: "Senegal, arrete interministeriel n° 188/MSHP/DPM du 15 janvier 2003 fixant le mode de calcul du prix de vente au public des medicaments, produits et objets compris dans le monopole pharmaceutique (Journal officiel de la Republique du Senegal)."
    verified: "2026-07-27"

  employer_social_charge_rate_ceiling:
    value: 0.171
    unit: ratio of gross salary
    prov: SOURCED
    source: "Sert exclusivement a borner le haut de la fourchette de employer_social_charge_rate. Pour un salaire brut de 110 000 XOF/mois : IPRES regime general 8,4 % non plafonne a ce niveau (plafond 432 000) = 9 240 ; CSS prestations familiales 7 % sur assiette plafonnee a 63 000 = 4 410 ; accidents du travail sur assiette plafonnee a 63 000, classe de risque non identifiee pour la distribution pharmaceutique (fourchette 1–5 %, milieu de fourchette retenu pour borner) ; CFCE 3 % du brut = 3 300. Soit environ 17,1 % du brut."
    authority: "Senegal : IPRES (retraite regime general, 8,4 % employeur, plafond mensuel 432 000 XOF), Caisse de Securite sociale (prestations familiales 7 % et accidents du travail 1–5 %, plafond mensuel 63 000 XOF), contribution forfaitaire a la charge de l employeur (CFCE) 3 % des salaires bruts. PwC Worldwide Tax Summaries — Senegal, « Other taxes / Social security contributions », derniere revue 31 mars 2026."
    verified: "2026-07-27"

  # ---------- ELICITED ----------
  stated_costs_vat_basis:
    value: "TTC"

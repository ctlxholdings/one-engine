  # ── THE FORMULAE, AS THE REGULATOR PRINTS THEM ─────────────────────────────
  formulae_as_printed:
    eq1_plant_availability_factor: "PAF = average available capacity (MW) / installed capacity (MW) x 100    [p.16]"
    eq2_total_generation: "Total generation = Ave. hourly generation (MWh/h) x 24hrs x number of days in the quarter    [p.18]"
    eq3_load_factor: "Load Factor = Total Energy Generated (MWh) / [Ave. Available Capacity (MW) x 24hrs x period (in days)] x 100    [p.20]"
    eq7_energy_accounting_efficiency: "EAE = Total energy billed to customers (GWh) / Total energy received by the network (GWh) x 100    [p.31]"
    eq8_billing_efficiency: "BE = Total energy billed to customers (N) / [Total energy received by the network (kWh) x Average Allowed Tariff (N/kWh)] x 100    [p.33]"
    eq9_collection_efficiency: "CE = Total Revenue Collected (N) / Total Billed Amount (N) x 100    [p.35]"
    eq10_atcc_loss: "ATC&C Loss = [1 - (Billing Efficiency x Collection Efficiency)] x 100    [p.38]"


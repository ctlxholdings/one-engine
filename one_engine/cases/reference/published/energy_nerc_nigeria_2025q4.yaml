id: energy_nerc_nigeria_2025q4
title: "NERC Nigeria Quarterly Report 2025/Q4 — 28 grid-connected power plants: installed vs available capacity, availability factor, load factor, generation, and the DisCo billing/collection chain"

meta:
  source:
    - >
      Nigerian Electricity Regulatory Commission (NERC), "Fourth Quarter 2025 — NERC Quarterly
      Report", published April 2026.
      https://nerc.gov.ng/wp-content/uploads/2026/04/2025_Q4-Report.pdf
    - >
      Figures cited below carry the report's OWN printed page numbers (footer) and table numbers.
      Sections used: 2.1.1 Available generation capacity (p.14-15); 2.1.2 Plant availability
      factor, equation (1) and Table 1 (p.16-17); 2.1.3 Quarterly generation, equation (2) and
      Table 2 (p.17-19); 2.1.4 Generation load factor, equation (3) (p.20-21); Key Facts box
      (p.11); 2.3.1 Energy offtake (p.31); 2.3.2 Energy accounting efficiency, equation (7) and
      Table 5 (p.31-33); 2.3.3 Billing efficiency, equation (8) and Table 6 (p.33-34); 2.3.4
      Revenue and collection efficiency, equation (9) and Table 8 (p.35-36); 2.3.5 ATC&C loss,
      equation (10) (p.37-38).
  accessed: "2026-08-12"
  licence: >
    Publication of a Nigerian federal statutory regulator (NERC), published free to the public on
    the Commission's own website. No explicit reuse licence is stated in the document.
  kind: trade_case
  # ── HAND-LABELLED 2026-08-12 ────────────────────────────────────────────────
  # WHY THIS IS THE STRONG SHAPE THE HARVEST BRIEF ASKS FOR. NERC does not
  # print a bare "generated X GWh". It prints, separately and for TWO quarters:
  #   installed capacity (MW)  ->  average available capacity (MW)
  #     -> plant availability factor (%)          [ = available / installed ]
  #   available capacity (MW) x 24h x days        ->  load factor (%)
  #     -> average hourly generation (MWh/h)      -> total generation (GWh)
  #   energy received by DisCos -> energy billed  -> energy accounting eff. (%)
  #   naira value received -> naira value billed  -> billing efficiency (%)
  #   amount billed -> revenue collected          -> collection efficiency (%)
  #   billing eff. x collection eff.              -> ATC&C loss (%)
  # Every arrow is a formula the regulator PRINTS AS AN EQUATION (its equations
  # 1, 2, 3, 7, 8, 9, 10) and then applies to figures it also prints. That is
  # six independent multiply/divide chains, each checkable, over 28 named
  # plants and 11 named distribution companies, for two consecutive quarters.
  resolution: L3   # a multi-stage chain (capacity -> availability -> dispatch
  #                  -> energy -> naira -> collections) where the OUTPUT of one
  #                  printed ratio is the INPUT of the next; deeper than L2's
  #                  itemised money lines, shallower than mining_mt_todd's L4
  #                  because there is no depleting stock and no tax waterfall.
  basis: "the whole Nigerian Electricity Supply Industry (NESI) — 28 grid-connected generating plants and 11 distribution companies — for the calendar quarter 1 October to 31 December 2025 (92 days), with the immediately preceding quarter (2025/Q3, also 92 days) printed alongside"
  periods: 2
  # MECHANISM — same argument as energy_esmap_africa_minigrid_2019.yaml: the
  # DisCo half of this gold is a METERED CONNECTION sold to a captive customer
  # base off a fixed local network (capacity_service), while the GenCo half is
  # a wholesale commodity sale into a merit-order dispatch pool. This gold
  # spans both halves of the same national market in one document, which is
  # itself the finding: the "right" cell changes at the trading point, not at
  # the technology. Tagged capacity_service because the money side of the
  # source (the only side with a tariff, a bill and a collection) is the DisCo
  # side; the GenCo side carries physics only, no price.
  mechanism: capacity_service
  jurisdiction: NG
  currency: NGN   # the naira figures are NGN; the MW/MWh/GWh figures carry no
  #                 currency at all. No exchange rate is printed anywhere in
  #                 the sections used, so no USD conversion is attempted here.


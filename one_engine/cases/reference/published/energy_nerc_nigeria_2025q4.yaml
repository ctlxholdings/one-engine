mapping: {}
# No CANON binding. The naira lines here are a REGULATOR'S SECTOR AGGREGATE
# across 11 separately-owned distribution companies, not one enterprise's
# revenue: "revenue collected" (N630.93bn) is cash received by eleven firms,
# "energy billed" (N795.06bn) is their combined invoicing, and no cost of
# sales, opex or margin is published anywhere in the report. Binding a
# sector total to `revenue` would assert a single trading entity that does
# not exist — the same discipline svc_water_utility_wasreb_kenya.yaml applies
# to WASREB's 95-utility aggregate.

tolerance:
  abs: 0.02
  rel: 0.0005
  why: >
    NERC prints every capacity and energy figure to 2 decimal places (5,400.38 MW; 9,831.58 GWh;
    4,452.71 MWh/h) and every ratio to 2 decimal places (39.64%; 82.45%; 34.90%) — a table of
    computed values, not a narrative rounding. An absolute tolerance of 0.02 is exactly the last
    printed digit on the ratios, and the relative 0.0005 covers the one place where the source's
    own chain does not close to the last digit (equation 2 reproduces 9,227.56 GWh where the
    report prints 9,227.57 — see notes). Tolerance is NOT stretched to absorb the two genuine
    display inconsistencies recorded in notes; those are kept as findings.

notes: |
  EVERY ARITHMETIC CHAIN RE-DERIVED BY HAND, using only the regulator's own printed equations and
  its own printed inputs. Nine checks; seven close exactly, two do not.

  (1) EQUATION 1 — plant availability factor. Total row:
        Q4: 5,400.38 / 13,625 = 39.635%  -> printed 39.64%   RECONCILES
        Q3: 5,430.34 / 13,625 = 39.856%  -> printed 39.86%   RECONCILES
      Per-plant spot checks against Table 1: Kainji_1 Q4 572.70/760 = 75.36% (printed 75.36);
      Geregu_2 Q4 106.34/435 = 24.45% (printed 24.45); Egbin_1 Q4 631.11/1,320 = 47.81% (printed
      47.81); Trans Amadi_1 Q4 5.41/100 = 5.41% (printed 5.41). RECONCILES.
      Note the report's own gloss "60.36% ... was unavailable" is simply 100 - 39.64.

  (2) EQUATION 2 — total generation from average hourly generation and days:
        Q4: 4,452.71 MWh/h x 24 x 92 = 4,452.71 x 2,208 = 9,831,583.7 MWh = 9,831.58 GWh
            -> printed 9,831.58 GWh   RECONCILES EXACTLY
        Q3: 4,179.15 MWh/h x 2,208 = 9,227,563.2 MWh = 9,227.56 GWh
            -> printed 9,227.57 GWh   OFF BY 0.01 GWh (10 MWh, 1.1 parts per million).
      This is the only place the chain fails to close to the last printed digit, and it is a
      rounding artefact of the 2-dp hourly figure, not a modelling difference: an unrounded
      4,179.1545 MWh/h reproduces 9,227.57 exactly. Kept as a printed figure, not reconciled away.

  (3) EQUATION 3 — load factor:
        Q4: 9,831,580 MWh / (5,400.38 x 24 x 92 = 11,924,039 MWh) = 82.45%  -> printed 82.45%
        Q3: 9,227,570 MWh / (5,430.34 x 2,208 = 11,990,191 MWh) = 76.96%   -> printed 76.96%
      BOTH RECONCILE EXACTLY.

  (4) THE COMPOSITION IDENTITY THE REPORT NEVER WRITES DOWN. Availability and load factor are
      defined on different denominators (installed vs available), so their product is the plain
      capacity factor of the whole fleet:
        Q4: 0.3964 x 0.8245 = 32.68%; check directly 9,831,580 / (13,625 x 2,208) = 32.68%
        Q3: 0.3986 x 0.7696 = 30.68%; check directly 9,227,570 / (13,625 x 2,208) = 30.68%
      RECONCILES. This is the one number a plant-level model actually needs and the one number
      NERC does not print — it publishes the two factors and never their product. Recorded because
      it is exactly the "prints the factors separately, not just their product" property that makes
      this a formula test rather than an outcome transcription.

  (5) EQUATION 7 — energy accounting efficiency:
        Q4: 6,614.57 / 7,991.22 = 82.77%  -> printed 82.77%   RECONCILES
        Q3: 6,158.54 / 7,348.95 = 83.80%  -> printed 83.80%   RECONCILES
      And the offtake in GWh reconciles to the offtake in MWh/h through the same 2,208 hours:
        3,619.21 x 2,208 = 7,991,215 MWh = 7,991.22 GWh  RECONCILES EXACTLY
        3,328.33 x 2,208 = 7,348,952.6 MWh = 7,348.95 GWh RECONCILES EXACTLY

  (6) EQUATION 9 — collection efficiency:
        Q4: 630.93 / 795.06 = 79.357%  -> printed 79.36%   RECONCILES
        Q3: 570.25 / 706.61 = 80.702%  -> printed 80.70%   RECONCILES

  (7) EQUATION 10 — ATC&C loss, the two-factor composition:
        Q4: 1 - (0.8203 x 0.7936) = 1 - 0.65099 = 34.90%   -> printed 34.90%   RECONCILES EXACTLY
        Q3: 1 - (0.8269 x 0.8070) = 1 - 0.66731 = 33.27%   -> printed 33.27%   RECONCILES EXACTLY
      Components also close: 100 - 82.03 = 17.97 (printed 17.97 technical+commercial);
      100 - 79.36 = 20.64 (printed 20.64 collection loss). Billing losses N174.12bn = 969.19 -
      795.06 = 174.13 (printed 174.12, 0.01 rounding on the 2-dp inputs).

  (8) TWO STATED CHANGES THAT DO NOT REPRODUCE FROM THE PRINTED FIGURES — kept, not fixed:
      - p.36 says collection efficiency fell "1.35pp" between the quarters; 80.70 - 79.36 = 1.34pp,
        and the Key Facts box on p.11 itself says "1.34pp decrease". The SAME report gives both
        numbers for the same difference. Neither is a transcription error on my part; the report
        contradicts itself by 0.01pp between p.11 and p.36.
      - p.18 states total generation and average hourly generation both rose 6.55%; from the
        printed figures 9,831.58/9,227.57 - 1 = 6.546% and 4,452.71/4,179.15 - 1 = 6.546%. Both
        round to 6.55%, so this one holds — recorded only because footnote 7 makes the equal-days
        argument explicitly and it is worth confirming the footnote is right.

  (9) WHAT THIS SOURCE DOES NOT GIVE. No tariff per kWh is printed in the sections used — equation
      8's "Average Allowed Tariff (N/kWh)" is named as an input and its VALUE is never printed, so
      the naira-value-received line (N969.19bn) cannot be decomposed into kWh x tariff from this
      document alone. Dividing gives an implied 969.19bn / 7,991.22 GWh = N121.28/kWh, but that is
      MY division of two printed totals, not a rate the regulator publishes, and it is recorded
      here rather than lifted into `inputs`. No generation-side cost, fuel price, capacity payment
      or GenCo revenue appears anywhere: the money in this report starts at the DisCo trading
      point. No plant-level load factors are tabulated either — only seven are narrated (p.21:
      Trans Amadi_1 and Dadin-Kowa_1 at 100%, Afam_2 99.89%, Omoku_1 99.10%, Olorunsogo_1 99.08%,
      Geregu_1 98.07%, Kainji_1 95.02%, Jebba_1 75.39%, Shiroro_1 73.66%, Zungeru_1 62.88%) with
      the rest only in a bar chart.

  WHY THE SEASONAL PHYSICS MATTERS FOR A MODEL. The five hydro plants (Zungeru_1, Kainji_1,
  Jebba_1, Shiroro_1, Dadin-Kowa_1) move availability with the rains, not with maintenance: the
  report attributes Kainji_1's +19.67pp availability swing to "the rainy season during the quarter
  [leading] to higher water levels in the watersheds" and dates the inflow/flood season July to
  October (p.15-16). Availability here is therefore a RESOURCE variable for part of the fleet and
  a MECHANICAL one for the rest, in the same table, under the same column heading — a plant model
  that treats "availability factor" as one kind of number will fit the thermal plants and mis-state
  the hydro ones.

  NO COST SIDE: this gold gets no `inputs.costs:` block. NERC's money chain is entirely a REVENUE
  chain, and the report says so by what it prints: naira value of energy received (N969.19bn),
  naira value of energy billed (N795.06bn), revenue collected (N630.93bn), and the two losses that
  fall out of the gaps — billing losses N174.12bn and the N139.193bn ATC&C revenue loss. Every one
  of those is an amount NOT EARNED or NOT COLLECTED on the sales side. A revenue shortfall is not
  a cost incurred, and treating one as `cost_of_sales` would assert an expense the DisCos never
  recorded.
  On the generation side the report prints physics only: installed capacity, available capacity,
  availability factor, hourly generation, total generation, load factor — for all 28 plants, two
  quarters. Point (9) of the notes above already states the gap and it is worth restating as the
  reason this gold cannot be made runnable: NO generation-side cost, fuel price, gas price,
  capacity payment or GenCo revenue appears anywhere in the sections used. The money in this
  report STARTS at the DisCo trading point. There is no cost of sales, no opex, no staff cost, no
  network cost and no total operating cost for any of the 11 DisCos or any of the 28 GenCos.
  Even the one rate that would let energy be re-priced is withheld: equation 8 names "Average
  Allowed Tariff (N/kWh)" as an input and the report never prints its value. The implied
  N121.28/kWh (969.19bn / 7,991.22 GWh) is MY division of two printed totals, is already recorded
  in the notes above rather than lifted into `inputs`, and would in any case be a price, not a
  cost. Nothing to bind to `cost_of_sales` under RULE 4; `mapping: {}` stands as the original
  author set it.

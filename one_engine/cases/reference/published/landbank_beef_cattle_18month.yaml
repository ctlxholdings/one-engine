# Transcribed EXACTLY as published. Verified by hand against the primary PDF
# (curl + pdftotext, machine-readable vector text -- NOT a scanned image,
# contrary to an earlier assumption in this repo's trade-atlas notes).

meta:
  source: >
    Land Bank, "Livestock Enterprise Budget - Digital Book, 2023/24, Version
    2", "1. Beef Cattle 18 Months Marketing System", p.4 ("Enterprise Budget
    V2").
    https://landbank.co.za/Media-Centre/Publications/2025/Livestock%20Budget%20Enterprise%20Book.pdf
  accessed: "2026-08-11"
  licence: >
    "The material in this work is copyrighted and copying and/or
    transmitting portions or all of this work without permission may be a
    violation of national and international copyright law." (c) Land Bank
    (South Africa). No open licence found. Transcribed here, with full
    citation, for engine-verification/research use only.
  kind: trade_case
  # ── HAND-LABELLED 2026-08-12 ────────────────────────────────────────────
  # L2: gross_production_value_R is the sum of 4 different livestock-class
  # income lines (culled males, replacement cows, weaners, weaning bulls),
  # each its own mass x amount x price — no SINGLE quantity/price the
  # engine's `sale:` block (one resource) can hold, so the verified
  # aggregate is read directly.
  resolution: L2
  basis: "annual herd budget, 625 cows, 18-month marketing system"
  periods: 1
  jurisdiction: ZA
  currency: ZAR

inputs:
  currency: ZAR
  basis: "annual herd budget, 625 cows"
  # mirrors gross_production_value_R below — verified in notes as the exact
  # sum of the 4 income lines (culled males + replacement cows + weaners +
  # weaning bulls = 4,936,455.34). Not decomposed into `sale:` here: an
  # independent check of two of those four lines (mass x amount x price)
  # did not cleanly reproduce the printed sub-line values, so the verified
  # aggregate is used directly rather than a re-derivation this transcription
  # cannot fully justify.
  revenue: 4936455.34
  # ALL 17 individual per-annum cost lines across the source's three cost
  # blocks (vaccination/dosage, directly-attributable, feeding/supplement).
  # `total_vaccination_and_dosage_costs_R` (133,171.97) and
  # `total_directly_attributable_variable_costs_R` (282,390.93) are BOTH
  # excluded from here — each is the source's own printed subtotal of a
  # subset of these 17 lines, not an 18th line; both are still checkable
  # in principle (see notes on why they are not mapped below: neither is
  # the FULL cost_of_sales, only a partial block).
  costs:
    vaccination_spons_lambs_milt: 17615.60
    vaccination_brucella_s19: 20762.50
    vaccination_pasteurella: 3787.80
    vaccination_slendal_fever: 8630.00
    dosage_albendazole: 19796.40
    dosage_endoktosiede: 35680.00
    dip_dip_pour: 26899.67
    bulls_purchases: 32892.00
    heifers_purchases: 50900.00
    repairs_and_maintenance: 15000.00
    dangerous_control: 33816.93
    fuel: 30000.00
    veterinary: 4000.00
    fixed_labour: 115782.00
    feeding_concentration_maize: 109635.04
    feeding_winter_lick: 934808.80
    feeding_summer_lick: 234765.08
  number_of_cows: 625
  number_of_bulls: 19
  bull_pct: 3
  lsu_contribute_effect_of_farm: 1000
  lsu_factor_cattle_with_calf_and_bulls: 1.60
  calf_per_cow_18_month_system: 1
  weaning_pct: 80
  number_of_weaned_calves_per_year: 500
  pct_replacement_cows: 10
  pct_culling_bulls: 10
  herd_death_pct_excl_calves: 2
  live_weaner_weight_kg: 240
  live_cow_weight_kg: 450
  live_bull_weight_kg: 650
  slaughter_pct: 54
  price_per_kg_slaughter_avg_bull_R: 32.00
  price_per_kg_slaughter_avg_cows_R: 39.68
  price_weaner_to_250kg_live_R: 46.51
  sales_per_cow_calf_replacement_cows_bulls: 1.28

  # ── Vaccination and dosage (directly attributable variable costs) ────────
  vaccination_spons_lambs_milt_total_R: 17615.60
  vaccination_brucella_s19_total_R: 20762.50
  vaccination_pasteurella_total_R: 3787.80
  vaccination_slendal_fever_total_R: 8630.00
  dosage_albendazole_total_R: 19796.40
  dosage_endoktosiede_total_R: 35680.00
  dip_dip_pour_total_R: 26899.67

  # ── Directly attributable variable costs (per-annum totals) ──────────────
  bulls_purchases_total_R: 32892.00        # "buy 6 bulls over a 3 year period"
  heifers_purchases_total_R: 50900.00      # "buy 5 young heifers over a year period"
  repairs_and_maintenance_total_R: 15000.00
  dangerous_control_total_R: 33816.93
  fuel_total_R: 30000.00                   # "4000 km/year at R10.70/l" (implied)
  veterinary_total_R: 4000.00              # "an average of 2 visits a year"
  fixed_labour_total_R: 115782.00

  # ── Feeding / supplement (per-annum totals) ───────────────────────────────
  feeding_concentration_maize_total_R: 109635.04
  feeding_winter_lick_total_R: 934808.80
  feeding_summer_lick_total_R: 234765.08

  # ── Budget income (per-annum) ─────────────────────────────────────────────
  culled_males_slaughter_mass_kg: 351
  culled_males_slaughter_amount: 1.875
  culled_males_slaughter_price_R_per_kg: 32.00
  replacement_cows_slaughter_mass_kg: 243
  replacement_cows_slaughter_amount: 62.500
  replacement_cows_slaughter_price_R_per_kg: 39.68
  weaners_versions_mass_kg: 240
  weaners_versions_amount: 175.000
  weaners_versions_price_R_per_kg: 46.51
  weaning_bulls_mass_kg: 240
  weaning_bulls_amount: 247.750
  weaning_bulls_price_R_per_kg: 39.68

notes: |
  We independently re-derived the cost/margin cascade by hand:
    - Total Vaccination and dosage costs = sum of the 7 vaccination/dosage
      lines = 17,615.60+20,762.50+3,787.80+8,630.00+19,796.40+35,680.00+
      26,899.67 = 133,171.97 -- EXACT match to the printed total (and to
      R133.17/LSU, R213.08/cow when divided by 1000 LSU / 625 cows x 1.60
      LSU-factor respectively).
    - Total Directly Attributable Variable Costs = sum of the 7
      bulls/heifers/repairs/dangerous-control/fuel/veterinary/labour lines =
      32,892.00+50,900.00+15,000.00+33,816.93+30,000.00+4,000.00+115,782.00
      = 282,390.93 -- EXACT match to the printed total.
    - Total Cost supplement (feeding block) = 109,635.04+934,808.80+
      234,765.08 = 1,279,208.92, i.e. R1,279.21/LSU when divided by 1000 --
      matches the printed "Total Cost supplement ... R1,279.21" per-LSU
      figure to the cent.
    - Total all variable costs (per LSU) = Total Vaccination/dosage (R133.17)
      + Total Directly Attributable (R282.39) + Total Cost supplement
      (R1,279.21) = R1,694.77/LSU -- EXACT match to the printed "Total all
      variable costs R1,694.77".
    - Gross Production Value = sum of the 4 income lines (21,060.00 +
      602,640.00 + 1,953,382.54 + 2,359,372.80) = 4,936,455.34 -- EXACT
      match to the printed total, and to R4,936.46/LSU, R7,898.33/cow.
    - Gross Margin (per LSU) = Gross Production Value/LSU - Total all
      variable costs/LSU = 4,936.46 - 1,694.77 = 3,241.69 by hand vs
      3,241.68 printed -- 1-cent rounding gap (both derived quantities are
      themselves rounded from an underlying R4,936,455.34/1000 and a chain
      of per-LSU roundings, so this is expected chained-rounding noise, not
      flagged as a real error).
    - Gross Margin (per cow) = 7,898.33 - 2,711.63 (Total all variable costs
      per cow, printed) = 5,186.70 by hand vs 5,186.69 printed -- same
      1-cent rounding pattern.
  The source does NOT print a single herd-level (all 625 cows) Gross Margin
  figure -- only the per-cow (R5,186.69) and per-LSU (R3,241.68) columns.
  gross_margin_per_cow x 625 = R3,241,681.25 (not printed; a derived,
  not-cited, herd-level figure if an engine needs one).

  A second-block header labelling quirk in the source: the "Feeding /
  supplement" table (bottom half of p.4) prints its cost columns as "Total
  Costs per SSU" / "Total Costs per ewe" -- SSU/ewe are SHEEP units,
  evidently copy-pasted from a template shared with the sheep budgets
  elsewhere in the same workbook (this is a cattle budget: 625 COWS, LSU
  units). The underlying VALUES in that block are consistent with per-LSU /
  per-cow (not per-SSU/per-ewe) -- confirmed because they sum correctly into
  the (correctly labelled) "Total all variable costs" R/LSU and R/cow row
  immediately below. Transcribed the source's mislabelled header verbatim in
  this note; the `inputs`/`expected` field names above use the correct
  LSU/cow basis, not the source's literal (wrong) column header text.

# only gross_production_value_R maps to a full canon figure. The two cost
# SUB-BLOCK totals (total_vaccination_and_dosage_costs_R,
# total_directly_attributable_variable_costs_R) are each exact against
# their OWN 7 constituent lines (see notes), but neither is the FULL
# cost_of_sales — mapping either against `costs:` (all 17 lines) would be
# a self-inflicted mismatch, not a finding, so both stay unmapped. The
# source itself prints no herd-level `total_all_variable_costs_R` or
# `gross_margin_R` (only per-LSU/per-cow columns — see notes), so
# cost_of_sales/gross_margin have no herd-level figure to check against
# either way.
mapping:
  gross_production_value_R: revenue

tolerance:
  abs: 0.01
  why: >
    every figure carries two decimals (cents) and the notes independently
    verify this exact total (sum of the 4 income lines = 4,936,455.34); any
    gap beyond a cent is real

expected:
  total_vaccination_and_dosage_costs_R: 133171.97
  total_vaccination_and_dosage_costs_R_per_LSU: 133.17
  total_vaccination_and_dosage_costs_R_per_cow: 213.08

  total_directly_attributable_variable_costs_R: 282390.93
  total_directly_attributable_variable_costs_R_per_LSU: 282.39
  total_directly_attributable_variable_costs_R_per_cow: 451.83

  total_cost_supplement_R_per_LSU: 1279.21
  total_cost_supplement_R_per_cow: 2046.73

  total_all_variable_costs_R_per_LSU: 1694.77
  total_all_variable_costs_R_per_cow: 2711.63

  gross_production_value_R: 4936455.34
  gross_production_value_R_per_LSU: 4936.46
  gross_production_value_R_per_cow: 7898.33

  gross_margin_R_per_LSU: 3241.68     # see notes: hand-recompute gives 3,241.69
  gross_margin_R_per_cow: 5186.69     # see notes: hand-recompute gives 5,186.70

  cycle:
    duration_days: 120                 # stated twice: Tableau 3 header ("les
    #                                    4 mois du cycle") and Tableau 6
    #                                    header ("Amortissement 120 Jours
    #                                    (durée du cycle)"); text: "495 CFA
    #                                    pour les 120 jours d'embouche"
    duration_months: 4
    head_per_batch: 10
    entry_live_weight_kg: 35
    # NOT PRINTED: exit weight, daily gain, mortality, batches per year.
    # See notes/GAPS -- without an exit weight the "prix de revient d'un
    # kilogramme de viande" the source promises in its own Tableau 7 title
    # cannot be computed at all.
  # the ration schedule, kg per head per day, by month of the cycle (Tableau 3)
  ration_kg_per_head_per_day:
    fanes_de_niebe:      {mois1: 0.450, mois2: 0.500, mois3: 0.500, mois4: 0.500}
    fanes_darachide:     {mois1: null,  mois2: null,  mois3: null,  mois4: null}
    sons_de_cereales_mais: {mois1: 0.700, mois2: 0.750, mois3: 0.700, mois4: 0.750}
    tourteaux_de_coton:  {mois1: 0.125, mois2: 0.125, mois3: 0.125, mois4: 0.125}
    total_ration:        {mois1: 1.275, mois2: 1.375, mois3: 1.325, mois4: 1.375}
  investments_xof:                     # Tableau 4, for the 10-head unit
    etable: {quantite: 1, pu: 350000, montant: 350000}   # printed "35 0000"
    grange_de_foin: {quantite: 1, pu: 150000, montant: 150000}
    fosse_fumiere: {quantite: 1, pu: 10000, montant: 10000}
    mangeoire_abreuvoir: {quantite: 8, pu: 1500, montant: 12000}
    seau: {quantite: 3, pu: 1500, montant: 4500}
    bassine: {quantite: 3, pu: 1500, montant: 4500}
    fut_vide: {quantite: 2, pu: 10000, montant: 20000}
    balance_petites_pesees: {quantite: 1, pu: 25000, montant: 25000}
    hache_paille_mecanique: {quantite: 1, pu: 175000, montant: 175000}
    brouette: {quantite: 1, pu: 20000, montant: 20000}
    pelle: {quantite: 3, pu: 1750, montant: 5250}
    pics: {quantite: 2, pu: 2500, montant: 5000}
    fourche: {quantite: 3, pu: 1750, montant: 5250}
    rateau: {quantite: 3, pu: 1750, montant: 5250}
  fonds_de_roulement_xof:              # Tableau 5, the 120-day working capital
    achat_dovin_dembouche: {quantite: 10, unite: "tête de 35 kg à l'entrée", pu: 35000, montant: 350000}
    fanes_de_niebe: {quantite: 234, unite: kg, pu: 75, montant: 17550}
    sons_de_cereales: {quantite: 348, unite: kg, pu: 130, montant: 45240}
    tourteaux_de_coton: {quantite: 60, unite: kg, pu: 140, montant: 8400}
    soin_veterinaire: {quantite: 10, unite: tête, pu: 1500, montant: 15000}
    sels: {quantite: 10, unite: kg, pu: 1500, montant: 15000}
  amortissements_xof:                  # Tableau 6 -- NOTE the asset costs here
    #                                    differ from Tableau 4 (see notes)
    etable: {cout_total: 250000, duree_vie_ans: 15, amort_120j: 185}
    grange_de_foin: {cout_total: 125000, duree_vie_ans: 20, amort_120j: 69}
    mangeoire_abreuvoir: {cout_total: 12000, duree_vie_ans: 4, amort_120j: 33}
    seaux: {cout_total: 4500, duree_vie_ans: 3, amort_120j: 17}
    bassines: {cout_total: 4500, duree_vie_ans: 4, amort_120j: 13}
    futs_vides: {cout_total: 20000, duree_vie_ans: 5, amort_120j: 44}
    balance_petites_pesees: {cout_total: 15000, duree_vie_ans: 3, amort_120j: 56}
    brouettes: {cout_total: 17500, duree_vie_ans: 4, amort_120j: 49}
    pelles: {cout_total: 3500, duree_vie_ans: 4, amort_120j: 10}
    fourches: {cout_total: 3500, duree_vie_ans: 4, amort_120j: 10}
    rateaux: {cout_total: 3500, duree_vie_ans: 4, amort_120j: 10}
  compte_dexploitation_charges_xof:    # Tableau 9 -- a THIRD set of input
    #                                    quantities/values (see notes)
    achat_dovin_dembouche: 325000
    fanes_de_niebe: 32400
    sons_de_cereales: 67200
    tourteaux_de_coton: 15000
    soins_veterinaires: 10000
    sels: 10000
    main_doeuvre: 90000
  compte_dexploitation_produits_xof:
    vente_dovin_embouche: {quantite: 10, montant: 603910}
    valeur_de_la_fumure_organique: {quantite: 3000, montant: 75000}

  # the 7 charge lines of the compte d'exploitation (Tableau 9) -- the only
  # cost block in this document that the source itself totals and carries
  # through to a margin.
  costs:
    achat_dovin_dembouche: 325000
    fanes_de_niebe: 32400
    sons_de_cereales: 67200
    tourteaux_de_coton: 15000
    soins_veterinaires: 10000
    sels: 10000
    main_doeuvre: 90000
  revenue: 678910    # Tableau 9's own "Total" produits. NOTE Tableau 8 on the
  #                    same page prints 575,000 for the same batch.


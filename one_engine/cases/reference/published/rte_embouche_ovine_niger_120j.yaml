id: rte_embouche_ovine_niger_120j
title: "Niger PRADEL référentiel technico-économique — embouche ovine (sheep fattening): 10 rams held 120 days from 35 kg at entry, with the month-by-month ration and the full compte d'exploitation"

meta:
  source:
    - "Ministère de l'Agriculture et de l'Élevage (Niger) / Programme d'Appui au Développement de l'Élevage (PRADEL KIYO-ARZIKI), 'Référentiel Technico-Économique sur la filière bétail-viande — Embouche ovine', December 2020 (PDF authored by Patrick Delmas). Tableau 3 'rations pour 1 ovin de 35 Kg à l'entrée sur les 4 mois du cycle' (p.6); Tableau 4 'coût des investissements de l'opération d'embouche ovine (10 têtes)' (p.7); Tableau 5 'coût des besoins en FDR' (p.7); Tableau 6 'calcul des amortissements' (p.8, column header 'Amortissement 120 Jours (durée du cycle)'); Tableau 7 'calcul du Prix de revient d'un kilogramme de viande d'ovin embouché' (p.8); Tableau 8 'chiffre d'affaire' (p.9); Tableau 9 'Compte d'exploitation' (p.9). https://www.csan-niger.com/wp-content/uploads/2021/01/referentiel-technicoeconomique-embouche-ovine.pdf"
  accessed: "2026-08-12"
  licence: >
    Public extension/reference document of a Niger government livestock
    programme (PRADEL KIYO-ARZIKI), distributed free by RECA-Niger and CSAN
    Niger; no licence statement is printed. Transcribed here, with full
    citation, for engine-verification/research use only.
  kind: trade_case
  unit_of_analysis: "one fattening batch: 10 rams, 120 days"
  mechanism: buy_hold_then_sell
  # ── HAND-HARVESTED 2026-08-12, cycle-time/residence batch ────────────────
  # L3: revenue IS printed as quantity x price (10 têtes x 50,000 in Tableau
  # 8) -- but the compte d'exploitation on the SAME PAGE prints a different
  # revenue for the same 10 head (603,910 = 10 x 60,391). Both are
  # transcribed; see notes. The tables are page images, read directly off the
  # rendered pages, not from an extractable text layer.
  resolution: L3
  basis: "one batch of 10 rams, 35 kg live weight at entry, 120-day (4-month) fattening cycle, semi-intensive"
  periods: 1     # one money cycle. The RATION, however, is printed month by
  #                month over the 4 months (inputs.ration_kg_per_head_per_day),
  #                so the physical schedule has four sub-periods even though
  #                the compte d'exploitation is a single 120-day account.
  jurisdiction: NE
  currency: XOF

inputs:

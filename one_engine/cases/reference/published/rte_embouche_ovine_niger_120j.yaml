mapping:
  total_produits_xof: revenue
  charges_intermediaires_CI_xof: cost_of_sales
  marge_brute_xof: gross_margin

tolerance:
  abs: 1.0
  why: >
    every figure in this document is printed as a whole franc CFA (the XOF has
    no subdivision in practice) and the compte d'exploitation chain reconciles
    to the franc at every step, so 1 franc is pure display margin. Kept tight
    on purpose: the source's real defects here are 9,000 francs and 103,910
    francs wide (see notes) -- they are findings to surface, not noise to
    absorb.

notes: |
  WHY THIS ONE WAS HARVESTED: a 120-day residence stated three separate times,
  a batch size (10 head), an entry weight (35 kg), and -- rare in this genre --
  a ration printed MONTH BY MONTH across the four months of the cycle, so the
  physical inside of the holding period is visible, not just its endpoints.

  RE-DERIVED BY HAND. What ties EXACTLY:
    - Investments (Tableau 4): the 14 lines sum to 791,750, exact match to the
      printed total and to the total spelled out in words in the text. Each
      line also ties to quantité x PU (8 x 1,500 = 12,000; 3 x 1,750 = 5,250,
      three times over).
    - Working capital (Tableau 5): 350,000+17,550+45,240+8,400+15,000+15,000 =
      451,190 exact, and each line ties to its own qty x price (234 x 75 =
      17,550; 348 x 130 = 45,240; 60 x 140 = 8,400).
    - The ration (Tableau 3): all four monthly columns add exactly (1.275,
      1.375, 1.325, 1.375).
    - Compte d'exploitation (Tableau 9): CI = 549,600 exact; charges
      d'exploitation = 549,600 + 495 = 550,095 exact; produits = 603,910 +
      75,000 = 678,910 exact; marge brute = 678,910 - 549,600 = 129,310 exact;
      marge nette = 129,310 - 495 = 128,815 exact.
    - All four ratios recompute exactly: 678,910/550,095 = 1.234 -> 1,24;
      549,600/129,310 = 4.2503 -> 4,250; 550,095/129,310 = 4.2541 -> 4,254;
      495/129,310 = 0.00383 -> 0,0038.
    - Tableau 8: 10 x 50,000 = 500,000 and 3,000 kg x 25 = 75,000, total
      575,000 exact.
    - Tableau 7 internal chain: 45,960 + 495 = 46,455; 46,455 x 1.30 = 60,391;
      and 10 x 60,391 = the 603,910 that appears in Tableau 9. Internally
      consistent -- on a wrong starting number (below).
    - The feed quantities in Tableau 5 are EXACTLY 40% of what Tableau 3's
      ration requires over 120 days at 30-day months, and the same 40% holds
      for all three feeds independently: niébé 10 head x 58.5 kg = 585 -> 234
      printed; son 10 x 87 = 870 -> 348 printed; tourteau 10 x 15 = 150 -> 60
      printed. A single consistent factor across three unrelated lines is not
      coincidence, but the source never states it, so the working-capital
      table buys well under half the ration the technical table prescribes.

  FIVE SELF-CONTRADICTIONS, transcribed as printed and NOT corrected:
    1. THE BIG ONE -- prix de revient. Tableau 9's total charges are 549,600
       for the batch, i.e. 54,960 per head. Tableau 7 prints 45,960. That is a
       4/5 digit transposition, and everything downstream inherits it: prix
       total should be 55,455 (printed 46,455), the 30% commercial margin
       should be 16,637 (printed 13,936), and the recommended selling price
       should be 72,092 francs (printed 60,391). The document therefore
       recommends selling each ram for ~12,000 francs less than its own cost
       structure supports -- roughly 16% below the correct figure.
    2. TWO DIFFERENT REVENUES for the same batch on the same page. Tableau 8
       prices the ram at 50,000 (turnover 575,000); Tableau 9 prices it at
       60,391 (produits 678,910). Nothing in the document reconciles them.
       Both are transcribed; the mapping uses Tableau 9, because that is the
       one the margins and every ratio are computed from.
    3. THE DEPRECIATION IS OFF BY ~30x AND THE METHOD IS UNSTATED. Every line
       of Tableau 6 equals (coût total / durée de vie) / 90 -- verified on all
       eleven lines (250,000/15/90 = 185.19 -> 185; 125,000/20/90 = 69.44 ->
       69; 12,000/4/90 = 33.3 -> 33; 20,000/5/90 = 44.4 -> 44; and so on). But
       the column is headed "Amortissement 120 Jours (durée du cycle)", and
       120 days is one third of a year, so the correct charge is the annual
       one divided by ~3.04, not by 90. The whole batch is therefore charged
       495 francs of depreciation instead of roughly 15,000. Because the
       charge is so small, the error changes marge nette by ~11%.
    4. THE ASSET COSTS DISAGREE BETWEEN TABLEAU 4 AND TABLEAU 6. Étable
       350,000 vs 250,000; grange 150,000 vs 125,000; balance 25,000 vs
       15,000; brouette 20,000 vs 17,500; pelles/fourches/râteaux 5,250 each
       vs 3,500 each. Tableau 6 also silently drops the fosse fumière, the
       hache-paille (175,000, the second-largest asset) and the pics. Total
       depreciable base 459,000 vs an investment total of 791,750.
    5. THE INPUT COSTS DISAGREE BETWEEN TABLEAU 5 AND TABLEAU 9 for the same
       120-day batch: ram purchase 350,000 vs 325,000 (35,000 vs 32,500 a
       head), niébé 17,550 vs 32,400, son 45,240 vs 67,200, tourteau 8,400 vs
       15,000, soins 15,000 vs 10,000, sels 15,000 vs 10,000 -- and Tableau 9
       adds 90,000 of labour that Tableau 5 has no line for at all. Every
       single overlapping line differs.

  ALSO: Tableau 4 prints the étable's total as "35 0000" (a broken figure).
  It must be 350,000, because 350,000 is both the printed unit price on the
  same row and the only value that makes the column total 791,750. Transcribed
  as 350,000 with the typo recorded here.

  GAPS (not printed, therefore not asserted): no exit weight and no daily
  gain, so Tableau 7's own title ("Prix de revient d'un KILOGRAMME de viande")
  is never actually delivered -- the table gives francs per HEAD only. No
  mortality rate. No number of cycles per year, so annual throughput cannot be
  derived (contrast the companion bovine référentiel, which states 3 cycles).
  No basis for the 3,000 kg of manure. No interest or financing charge on the
  451,190 francs of working capital tied up for the 120 days.

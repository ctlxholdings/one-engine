id: cell_hotel_home2suites_graham
title: "Source Strategies Financial Feasibility Study — Home2 Suites, Graham, Texas (Year III stabilized, 2026)"

# ── WHY THIS FILE EXISTS ────────────────────────────────────────────────
# The engine implements `sold = min(demand, available)` and, as of the brief
# that produced this file, NO GOLD in this corpus had ever exercised it —
# every prior source assumed everything produced/available was sold. This
# is a hotel operator's OWN feasibility study, publishing capacity (rooms),
# demand (occupancy %) and price (ADR) as three SEPARATE figures, plus the
# revenue that follows from selling only the occupied share of capacity.
# See `notes:` for the worked short-side arithmetic.

meta:
  source:
    - "Source Strategies, Inc., 'Financial Feasibility Study: Home2 Suites, Graham, Texas 76450', 2 May 2022, pp.1-2 (capacity, investment), p.4 (Year III 2026 operating table + REVPAR formula). Publicly posted by the City of Graham, Texas: https://grahamtexas.net/wp-content/uploads/2022/05/Limited-Service-Graham-4.22.pdf"
  licence: >
    (c) Copyright Source Strategies, All Rights Reserved (printed on every page). Publicly hosted
    by the City of Graham, Texas municipal website (grahamtexas.net) as a public economic-
    development record; no explicit reuse licence is granted by the author. Figures transcribed
    here for verification/testing purposes only, following this corpus's established practice with
    other all-rights-reserved consultant/agency studies already in `cases/golds/` (FAO, IFAD, Land
    Bank all carry the same "all rights reserved" status and are treated the same way).
  kind: trade_case
  # L3: quantity (room-nights sold) x price (ADR) = revenue — PLUS a capacity ceiling (90 rooms x
  # 365 nights) stated strictly ABOVE the quantity sold. That extra ceiling, and demand realising
  # below it, is what makes this gold different from an ordinary L3 farm-budget transcription: it
  # is the short-side rule, `sold = min(demand, available)`, with demand (24,309) the binding term.
  resolution: L3
  basis: "per hotel, one operating year (Year III of operation = calendar 2026, the study's own stabilized/peak-performing year)"
  periods: 1
  mechanism: rent_asset   # rent_use x physical ("Physical Landlord") — sells the USE of a room, keeps the room
  cell: "rent_use x physical (Physical Landlord)"
  jurisdiction: US
  currency: USD
  trade: "90-room limited/select-service hotel (Home2 Suites brand), Graham, Texas — proposed development, opening January 2024"

inputs:
  capacity:
    rooms: {value: 90, unit: rooms, label_as_printed: "90 unit limited or select service hotel"}
    nights_per_year: {value: 365, unit: nights}
    room_nights_available:
      value: 32850
      unit: "room-nights"
      composition: "DERIVED: rooms (90) x nights_per_year (365) = 32,850 — not printed as one figure by the source, but both factors are the source's own stated basis (p.1)"
  demand:
    occupancy_pct:
      value: 74.0
      unit: "%"
      label_as_printed: "Occupancy %"
  price:
    adr:
      value: 168.59
      unit: "USD/room-night"
      label_as_printed: "Average Daily Rate"
  # engine convention: quantity x price. quantity (room-nights SOLD) is DERIVED from
  # capacity x occupancy, since the source states the percentage, not the room-night count —
  # see notes for why this derivation is the short-side rule itself, not an invented number.
  sale:
    quantity: 24309
    unit: room-nights
    price: 168.59

expected:
  revpar:
    value: 124.71
    unit: "USD/available-room-night"
    label_as_printed: "$ REVPAR"
    composition_as_printed: "occupancy (74.0%) x average daily rate (168.59) — the source's own stated formula, p.4: 'REVPAR is generated by multiplying occupancy times rate'"
  room_revenue:
    value: 4096621
    unit: USD
    label_as_printed: "Room Revenues"
  total_revenue:
    value: 4629182
    unit: USD
    label_as_printed: "Total Revenues"
    note: >
      includes roughly $532,561 of non-room revenue (the study states the product "is expected to
      include a significant food and beverage component", p.3) that is NOT itemised in the pages
      transcribed here. Reference only — not part of this gold's `mapping`, since only the room
      side is needed to test the short-side mechanism this file exists for.

# which of the source's own names we check against which of ours
mapping:
  room_revenue: revenue

tolerance:
  abs: 2000
  why: >
    the source displays occupancy to 1 decimal place (74.0%), ADR to the cent ($168.59), and REVPAR
    to the cent ($124.71) — three independently-rounded figures whose cross-products do not close
    exactly (see notes for all three checks). The largest of the source's own internal gaps,
    $1,633.31 (room_nights_sold x ADR vs. printed Room Revenues), is 0.04% of Room Revenue; 2,000 is
    set to clear that gap and no more — a divergence past it is the engine's, not the source's own
    rounding chain.

notes: |
  THE SHORT SIDE, worked from the source's own three separately-printed numbers: capacity (90 rooms
  x 365 nights = 32,850 room-nights/year) is a hard ceiling the study states directly (p.1: "90 unit
  ... hotel"); demand realises at only 74.0% of it in Year III 2026 (p.4) — 24,309 of the 32,850
  available room-nights are sold (32,850 x 0.740 = 24,309.0 exactly), 8,541 stand empty. Revenue is
  what was SOLD, not what was AVAILABLE: 24,309 x $168.59 = $4,098,254 (approximately the printed
  Room Revenues, see tolerance), not 32,850 x $168.59 = $5,538,182, which would overstate revenue by
  35% ($1.44M) by assuming full occupancy. This is `sold = min(demand, available)` with demand the
  binding constraint (24,309 < 32,850) — real-estate's version of the same physics BFAP's maize gold
  (`bfap_maize_bloedrivier_2024_25.yaml`) exercises in produced-vs-sold tonnes, here published by a
  hotel-industry consultant rather than an agronomist. As of this brief, no gold in this corpus's
  history had exercised this rule.

  THREE INTERNAL-CONSISTENCY CHECKS, all small and disclosed rather than smoothed over (per this
  corpus's standing rule that a source's own rounding chain is a finding, not something to hide):
    - occupancy (74.0%) x ADR (168.59) = 124.7566 -> printed REVPAR 124.71, a $0.05 gap
    - REVPAR (124.71) x room_nights_available (32,850) = 4,096,723.50 -> printed Room Revenues
      4,096,621, a $102.50 gap
    - room_nights_sold (24,309, itself derived from capacity x occupancy) x ADR (168.59) =
      4,098,254.31 -> printed Room Revenues 4,096,621, a $1,633.31 gap — the largest of the three,
      because it compounds the rounding of TWO upstream figures (occupancy and ADR) rather than one
  All three gaps are consistent with occupancy/ADR/REVPAR each being DISPLAY-rounded from finer
  underlying figures in the source's own spreadsheet — the same pattern documented in
  `bfap_maize_bloedrivier_2024_25.yaml`'s notes (a 2-Rand gap from the identical cause).

  CHOSEN YEAR: the study projects Years I-X (p.2, a 10-row summary table of Occupancy/ADR/REVPAR/
  Total Revenue/Cash Flow); Year III (2026, "the peak performing year" per the property's stated
  aging curve, p.9, with a +16% newness-adjustment factor over the market average) is transcribed
  because it is the ONLY year the source breaks out into a standalone block (p.4) that separately
  labels Room Revenues AND Total Revenues, rather than a single blended Total Revenue column.

  WHAT IS DELIBERATELY NOT TRANSCRIBED: the source's own Year III cost cascade (Income Before Fixed
  Costs $2,757,734 [59.6% of Total Revenue], Net Income Before Tax & Fin. $2,162,224 [46.7%], Cash
  Flow Before Financing $2,259,987 [48.8%], all p.4) is real and printed, but its footnote references
  a $2,221,914/yr capital-expenditure reserve that does not visibly reconcile against the 46.7% ->
  48.8% step (cash flow is HIGHER than net income before tax & financing despite a reserve
  deduction, implying a depreciation add-back larger than the reserve — plausible but not shown in
  the pages read). Rather than transcribe a chain I cannot independently verify, this gold stops at
  Room Revenue / Total Revenue — exactly what the short-side mechanism it exists to test needs, and
  no further.

  CONTEXT, not part of `expected`: Total investment = Land $500,000 + Improvements $12,600,000
  ($140,000/unit) = $13,100,000 (p.2); the study's own DCF at that budget returns 19.93% unleveraged
  pre-tax (a Year-10 sale at an 8% cap rate, less 4% cost of sale). Brand: Home2 Suites (Hilton).
  Opening: January 2024. Local market context (p.5): the 10-county area's long-run equilibrium
  occupancy is modelled at ~59-60%; the subject property is projected to run at 71-74% because of a
  "newness" premium that fades after Year 3 — i.e. the source's OWN model has the short side
  narrowing over the property's life, a second, slower-moving instance of the same mechanism.

  NO COST SIDE: this gold gets no `inputs.costs:` block, and that is the correct outcome rather
  than a gap to fill. The study publishes a MARGIN CASCADE, not cost lines. What p.4 prints below
  Total Revenues is three running subtotals, each with its percentage of revenue — Income Before
  Fixed Costs $2,757,734 (59.6%), Net Income Before Tax & Fin. $2,162,224 (46.7%), Cash Flow Before
  Financing $2,259,987 (48.8%) — plus one footnoted figure, a capital-expenditure reserve of
  $2,221,914/yr. That is the whole of it. What the study does NOT print, anywhere in the pages read,
  is a single itemised expense: no rooms department cost, no housekeeping, no franchise or
  management fee, no utilities, no property tax or insurance, no payroll. The share of revenue that
  each subtotal implies is disclosed; the composition of that share is not.

  A cost total could be BACKED OUT of the cascade — Total Revenues 4,629,182 less Income Before
  Fixed Costs 2,757,734 = 1,871,448 of departmental and undistributed cost — but that figure is
  arithmetic of mine, not of the source's, and a single derived subtotal is precisely what
  `costs:` must not hold: it is a total with no parts, and splitting it into plausible hotel expense
  lines would be inventing a breakdown the study never published. Worse, the cascade does not close
  on itself: cash flow before financing (48.8%) sits ABOVE net income before tax and financing
  (46.7%) despite the reserve deduction the footnote describes, which means at least one step in it
  carries an add-back the pages read do not show. Manufacturing lines out of a chain that does not
  reconcile would produce a gold that runs and teaches nothing.

  So the ROOM SIDE — capacity, occupancy, ADR, room revenue — is what this gold checks, and it is
  the whole of what it was built to check: `sold = min(demand, available)` is a claim about
  quantity and price, and it is fully testable without a cost line. This file stays `unrunnable`
  under a runner that requires costs, and it should: the honest state is that the source published
  a revenue side and a set of margins, and this corpus does not fabricate the difference.

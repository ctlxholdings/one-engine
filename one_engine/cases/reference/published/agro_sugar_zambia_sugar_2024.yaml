  # LIKE ASTRAL AND UNLIKE ALMOST EVERY OTHER SOURCE IN THIS CORPUS: the
  # INSTALLED CAPACITY CEILING IS PRINTED (3.6 million tonnes of cane a
  # year), the ACTUAL is printed (3.544 million tonnes), and the source
  # itself names the gap in physical units ("a shortfall of 300,000 tonnes
  # per year") -- so the utilisation question is answerable and the source's
  # own answer is checkable against it.
  resolution: L2
  basis: "Zambia Sugar PLC GROUP consolidated, one financial year (FY ended 31 August 2024). The document also prints a full separate COMPANY column, which differs materially and is carried separately below."
  periods: 1
  mechanism: grow_then_sell   # create x physical, transformation "grow" — the estate leg
  # SECOND LEG, DECLARED: Nakambala is an integrated estate AND mill AND
  # refinery. Milling and refining are create x physical, transformation
  # "assemble". 48.5% of the cane crushed (1.720 of 3.544 Mt) comes from
  # OUT-GROWERS, so the mill is also a processor of third-party crop -- a
  # relationship a single mechanism tag cannot carry.
  jurisdiction: ZM
  currency: ZMW
  trade: "integrated sugar estate, mill and refinery at Nakambala, Mazabuka, Zambia; 28 000 ha under cane; 403 out-growers; subsidiary of Illovo/ABF Sugar"


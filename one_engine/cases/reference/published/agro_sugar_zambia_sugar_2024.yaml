id: agro_sugar_zambia_sugar_2024
title: "Zambia Sugar PLC — FY2024 (year ended 31 August 2024): installed mill capacity vs cane supplied, estate and out-grower yields, sucrose content, and the full three statements"

meta:
  source:
    - "Zambia Sugar PLC, 'Annual Report 2024 — Growing Stronger Together, 60 Years' (year ended 31 August 2024), lodged with the Lusaka Securities Exchange: p.11 milestones (record cane, sugar, refined sugar, domestic sales, revenue); p.17-19 Agriculture section (3.544 million tonnes cane, estate 1.824 Mt, out-growers 1.720 Mt, yields 114 and 124 tonnes cane/ha, sucrose content 14.38% vs target 14.45%, INSTALLED FACTORY CAPACITY 3.6 million tonnes and the stated 300 000 tonne shortfall, irrigation water supply at 105% of budgeted demand, pump LTI 1.6% vs 4% target); p.64 Consolidated and Separate Statements of Profit or Loss and Other Comprehensive Income; p.65 Consolidated and Separate Statements of Financial Position; p.66 Statements of Changes in Equity; p.67 Consolidated and Separate Statements of Cash Flows; note 16.1 growing cane valuation assumptions (expected area to harvest, estimated yield, sucrose content, net sucrose price). https://www.luse.co.zm/wp-content/uploads/2024/11/ZAMBIA-SUGAR-ANNUAL-REPORT-2024.pdf"
  accessed: "2026-08-12"
  licence: >
    Public regulatory disclosure by a Lusaka Securities Exchange-listed company (LuSE: ZSUG),
    lodged with the exchange and published on the company's own site for market dissemination.
    No explicit reuse licence stated. Figures transcribed for verification/testing only.
  kind: trade_case

tolerance:
  abs: 1
  why: >
    every money figure is printed to the nearest ZMW thousand and every subtotal in all three
    statements, in BOTH the Group and the Company column, re-adds EXACTLY to the thousand by hand
    (see arithmetic_check), so a gap beyond K1 thousand is a real divergence, not display rounding.
    The physical figures split into two precisions the ruler must respect: the tonnages of SUGAR
    are printed to the whole tonne (424 531; 89 310; 320 419) while the tonnages of CANE are
    printed to three significant figures in millions (3.544 / 1.824 / 1.720 Mt), so cane-side
    identities can only be checked to ±1 000 tonnes. The cane split does close exactly at that
    precision; the capacity gap does not, and is recorded rather than absorbed.

arithmetic_check:
  every_subtotal_re_added_by_hand: true
  income_statement_group: "7 529 545 - 3 591 603 = 3 937 942 ✓ | 3 937 942 + 426 - 519 661 - 846 170 - 5 908 = 2 566 629 ✓ | -55 769 + 17 077 = -38 692 ✓ | 2 566 629 - 18 932 - 38 692 = 2 509 005 ✓ | 2 509 005 - 451 415 = 2 057 590 ✓"
  balance_sheet_group: "NCA 2 718 049 + 67 902 + 149 650 = 2 935 601 ✓ | CA 1 996 352 + 909 787 + 11 497 + 628 632 + 496 + 553 831 = 4 100 595 ✓ | 2 935 601 + 4 100 595 + 209 = 7 036 405 ✓ | equity 247 338 + 40 + 4 657 626 = 4 905 004 ✓ | NCL 189 725 + 363 694 = 553 419 ✓ | CL 932 180 + 28 113 + 122 355 + 141 628 + 249 184 + 50 904 + 53 618 = 1 577 982 ✓ | liabilities 553 419 + 1 577 982 = 2 131 401 ✓ | 4 905 004 + 2 131 401 = 7 036 405 = total assets ✓"
  cash_flow_group: "2 509 005 + 94 593 + 51 762 + 44 964 + 5 908 - 17 077 + 55 769 - 316 675 + 18 932 + 22 736 - 8 898 - 321 - 426 = 2 460 272 ✓ | working capital -753 800 + 97 537 - 164 - 72 302 + 245 821 - 128 645 = -611 553 ✓ | 2 460 272 - 611 553 = 1 848 719 ✓ | 1 848 719 + 17 077 - 13 214 - 35 831 - 248 792 = 1 567 959 ✓ | -771 371 + 1 611 = -769 760 ✓ | 1 567 959 - 769 760 = 798 199 net cash before financing ✓ | -1 104 834 - 47 541 = -1 152 375 ✓ | 798 199 - 1 152 375 = -354 176 ✓ | 838 863 - 354 176 + 18 240 = 502 927 ✓ | 553 831 - 50 904 = 502 927 ✓"
  cross_statement_tie: "the cash flow's 'gain in fair value of biological assets' of 316 675 ties to the BALANCE SHEET movements exactly: growing cane 909 787 - 595 776 = 314 011 (note 16.1's own 'change in fair value' line) PLUS livestock 11 497 - 8 833 = 2 664; 314 011 + 2 664 = 316 675 ✓. A real cross-statement identity, checked by hand, that an engine can be made to fail."
  physics_that_closes:
    cane_split: "1.824 Mt own estate + 1.720 Mt out-growers = 3.544 Mt total ✓ (exact at the printed three-significant-figure precision); prior year 1.667 + 1.500 = 3.167 ✓"
    domestic_sales_growth: "320 419 / 254 521 = 1.2589, i.e. +25.9%; the source prints 26% ✓"
    sugar_production_growth: "424 531 / 367 832 = 1.1540, i.e. +15.4%; the source prints 15% ✓"
    refined_sugar_growth: "89 310 / 78 058 = 1.1442, i.e. +14.4% — the source prints no percentage for refined, so this is derived context only"
    cane_growth: "3.544 / 3.167 = 1.1190, i.e. +11.9%; the source prints 12% ✓ | own estate 1.824 / 1.667 = +9.4% against a printed 9% ✓ | out-growers 1.720 / 1.500 = +14.7% against a printed 15% ✓"
    sugar_capacity_utilisation: "424 531 tonnes of sugar produced / 450 000 tonnes per annum installed sugar capacity = 94.3%. DERIVED here from two figures the source prints on different pages (p.4 and p.55) — kept OUT of `expected` for that reason, but it is the cleaner of the two utilisation readings in this document because both legs are stated to the tonne."
    revenue_growth: "7 529 545 / 5 827 704 = 1.2920, i.e. +29.2%; the source prints 29% ✓"
    non_domestic_sales: "400 631 total sales - 320 419 domestic = 80 212 tonnes sold outside the domestic market (export and industrial). Derived; the source prints the two totals but never the difference."
    cane_to_sugar_ratio: "3 544 000 tonnes cane / 424 531 tonnes sugar = 8.348 tonnes cane per tonne of sugar. DERIVED here, not printed — kept out of `expected` for that reason, but it sits close to Hippo Valley's printed 8.0, which is a useful independent sanity anchor across two different mills in the same regional industry."
    refined_share: "89 310 refined / 424 531 total sugar = 21.0% of production was taken to refined grade. Derived, not printed."
  physics_that_does_not_close:
    capacity_utilisation_vs_stated_shortfall: "3 544 000 actual / 3 600 000 installed capacity = 98.4% utilisation, i.e. a shortfall of 56 000 tonnes. But the SOURCE ITSELF states the shortfall is '300,000 tonnes per year'. These two statements are INCONSISTENT AS PRINTED and the document does not reconcile them. The most plausible reading is that the 300 000 tonne figure is a STANDING structural gap quoted from a normal (non-record) year rather than a recalculation against this record crop — the same paragraph frames it as an ongoing programme ('which the estate and out-growers are working hard to close'), not as this year's variance. NOT RESOLVED HERE, and deliberately NOT in `expected`: both figures are kept as printed. This is the single most interesting divergence in the file, because a reader who takes the source's own shortfall number and a reader who computes utilisation from the source's own capacity and volume get two different answers from ONE document."
    yields_cannot_be_re_derived: "the printed yields (estate 114, out-growers 124 tonnes cane/ha) cannot be checked against the printed tonnages, because the source does not print the ACTUAL harvested area for either party. Note 16.1's 14 966 ha is the area EXPECTED TO HARVEST NEXT season, used for fair-valuing standing cane at the balance sheet date, and 1 824 000 / 14 966 = 121.9 t/ha does not match either printed yield. Recorded as a gap: the areas and the yields in this document are not two ends of one calculation."
    sucrose_to_sugar: "sucrose content 14.38% x 3 544 000 tonnes cane = 509 627 tonnes of sucrose in cane, against 424 531 tonnes of sugar produced — implying an 83.3% overall recovery. DERIVED, not printed; Zambia Sugar publishes no extraction or boiling-house recovery percentages at all (contrast Hippo Valley, which publishes all three). Kept in notes only."

notes: |
  WHY THIS GOLD EXISTS, and what makes it different from the other sugar case in this corpus: it
  publishes an INSTALLED CAPACITY in physical units (3.6 million tonnes of cane a year) — the thing
  almost no annual report gives — and then contradicts itself about how far short of it the year
  fell. The company's own words put the gap at 300 000 tonnes; its own capacity and volume figures
  put it at 56 000. Both are printed, on the same page, in the same paragraph. That is not a
  transcription problem: it is a real property of the document, and it is left standing in
  `arithmetic_check.physics_that_does_not_close` rather than quietly resolved, because a gold whose
  job is to break a trio should carry the contradiction the world actually contains.

  TWO CEILINGS, ON OPPOSITE SIDES OF THE SAME MACHINE. The document prints an INPUT capacity (3.6
  million tonnes of cane a year, p.18) and, separately, an OUTPUT capacity (450 000 tonnes of sugar
  a year, p.4). Read together they imply a design cane-to-sugar ratio of 8.0 — which is exactly
  Hippo Valley's printed ratio, at a different mill, in a different country, and is close to the
  8.35 this year actually achieved. The output-side reading is the cleaner utilisation (424 531 /
  450 000 = 94.3%, both legs stated to the tonne); the input-side reading (98.4%) is the one the
  source's own 300 000-tonne shortfall contradicts. An engine given both ceilings has to decide
  which binds, and this file is a fair test of that because the source does not decide for it.

  THE INCOME STATEMENT IS THE MANUFACTURER'S SHAPE the comparison layer assumes — revenue, cost of
  sales, gross profit, then distribution and administration — so no adaptation is needed. One
  wrinkle worth naming: the operating profit line includes a small `profit on disposal of plant and
  equipment` (K426 thousand) ABOVE it, so operating profit is not gross profit less the three
  expense lines alone; miss the K426 and every subtotal below it is wrong by exactly that.

  GROUP AND COMPANY DIVERGE, WHICH IS THE POINT OF CARRYING BOTH. Revenue is IDENTICAL in the two
  columns (K7 529 545 thousand), but cost of sales is HIGHER in the Company (K3 829 537 vs
  K3 591 603 thousand), so Company gross profit is K237.9 million LOWER. The Company then picks up
  K46 833 thousand of dividend income from its subsidiary that the Group eliminates. The result is
  two internally consistent sets of statements, both re-adding exactly, that give different answers
  to "what did this business earn" — K2 057 590 thousand versus K1 889 199 thousand of profit. An
  engine that silently takes whichever column it parsed first will be right half the time.

  THE OUT-GROWERS OUT-YIELD THE ESTATE. 124 tonnes of cane per hectare from out-growers against 114
  from the company's own Nakambala estate — stated twice in the document, so not a typo. It matters
  for anyone modelling smallholder supply chains from this corpus, where the usual prior is the
  opposite (Hippo Valley's private farmers deliver 69 t/ha against the estate's 107). It also
  matters for the mechanism: 48.5% of the cane crushed here is bought in, not grown, so the mill's
  economics are half a processing business and only half a farming one.

  BIOLOGICAL ASSETS DRIVE A THIRD OF THE PROFIT SWING, and the source lets you see it. The fair
  value gain on standing cane and livestock was K316 675 thousand, against K5 392 thousand the
  prior year — a K311 million swing on a K2 509 million profit before tax, driven mostly by the net
  sucrose price assumption moving from K5 921 to K7 199 (+21.6%). Note 16.1 prints the four
  unobservable inputs (area, yield, sucrose content, price) and a sensitivity: a 1% change in
  estimated sucrose content moves fair value by K11 714 thousand, and 1% on sucrose price by
  K13 667 thousand. That is a full, checkable valuation model published alongside the physics that
  feeds it — rare, and the reason this file carries the note 16.1 assumptions as inputs even though
  they describe NEXT season rather than this one.

  WHAT THE SOURCE DOES NOT PUBLISH, recorded as gaps: no extraction or boiling-house recovery
  percentages, no crushing days, no throughput per hour, no mill stoppage rate — none of the mill
  physics Hippo Valley prints. No actual harvested hectares for the year (only next season's
  expected area). No cost per tonne of cane or sugar; cost of sales is one line. No export volume
  or export/domestic revenue split (only the domestic sales tonnage). No headcount.

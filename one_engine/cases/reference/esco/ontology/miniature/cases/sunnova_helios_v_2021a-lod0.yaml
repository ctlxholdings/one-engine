settings:   # the 13 LOD 0 facets, in vocabulary order
  payment_basis: {value: asset, status: inferred, why: "the homeowner buys equipment with a 25-year loan and pays a fixed instalment ([https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.18]); no payment depends on savings, output or energy delivered. Fallback savings not used. The production guarantee (c3) is a make-good, not the basis of payment"}
  client_sector: {value: private, status: stated, why: "'homeowner' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.3]"}
  partner_form:
    value: corporate
    status: default
    why: "no Partner (reviewer ruling, as posigen_backleverage); default kept. If Sunnova were read as the Partner it would be corporate: Sunnova Energy Corporation, a standing company ('wholly-owned subsidiary of Sunnova Energy International Inc., a public company', [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.3]); the Issuer is the vehicle, not the Partner"
  borrower:
    value: client
    status: stated
    why: "the homeowner takes the loan [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.18]; the Issuer's note debt is funding one level up (c8-c9)"
  receivable_holder:
    value: assignee
    status: inferred
    why: "the loans are contributed to the Issuer and pledged to the trustee ('Pledge of Trust Estate', diagram [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.30]), so the loan payments belong to the Issuer, not to Sunnova. Contribution and pledge are stated; that the Issuer owns (not just holds security over) the loans is inferred from the contribution chain"
  collection_placement:
    value: pledged_escrow
    status: inferred
    why: "collections go to a trust-controlled account: 'all collections with respect to the Solar Loans ... deposited in or transferred to the Collection Account' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.30]; the account is under the pledge to the indenture trustee. Whether the servicer first receives them is not stated (ACH 92.8%, p.19). Not the ENCODING fallback assignee_direct, since the report shows an account pledged to the trustee"
  aggregation:
    value: pool
    status: stated
    why: "5,269 loans pooled in one Issuer [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.12]"
  debt_seniority:
    value: subordinated
    status: stated
    why: "Class B is junior: 'subordination (in the case of Class A Notes)' and Class B interest is deferred behind Class A [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.3, p.6]. Recorded as the rank of the most junior debt in the deal"
  assignment_recourse:
    value: performance_exposed
    status: inferred
    why: "the report shows the assigned leg can vary with Sunnova's performance: 'the borrower with a valid claim may be entitled to stop payment or seek a refund of prior payment' and 'failure by Sunnova to honor the Production Guarantees may lead to selective borrower defaults' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.10]. Inferred (KBRA's reading of the FTC rule, not a contract clause in the notes)"
  savings_basis:
    value: measured
    status: default
    why: "the default; no savings enter the payment (payment_basis = asset). Savings are an underwriting theme ('the value of the customer's estimated savings ... compared to traditional utility rates', [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.17]) and a credit argument ('Solar Loans Result in Savings on Utility Bills', p.10), not a payment basis"
  grant_recipient:
    value: client
    status: inferred
    why: "the loans are built around the federal ITC: borrowers need not pay interest on the prepaid portion 'equal to the anticipated federal income tax credit' (30% for 2019 systems, 26% for 2020) [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.7]. A tax credit to the homeowner, not a grant by a party in the deal. Alternative none: a credit claimed on a tax return is not a payment by anyone in the deal"
  asset_owner:
    value: client
    status: inferred
    why: "'the borrower purchases the PV system from a dealer using financing provided by Sunnova' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.18]. The report's general paragraph that Sunnova 'takes title' (p.17) covers Sunnova's whole business; the loan pool is the purchase product"
  bill_custody:
    value: client
    status: inferred
    why: "'solar loan payments can be viewed as displacing utility payments' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.11]: the homeowner pays its own utility bill and a separate loan instalment"

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments + (b) non-repayable government financing, else ON BALANCE SHEET for government (E15 L2578-2582)
    applies_here: false
    this_case: "private US homeowners; not EU"
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: [partner, lessor, vehicle]}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? Private counterpart of C1: fires when client_sector is private and asset_owner is not client"
    applies_here: false
    this_case: "asset_owner = client (a loan, not a lease); the pool excludes Sunnova's lease and PPA products"
    source: E02 L3293-3295; elements.yaml IFRS16_lease_test
  production_guarantee:
    scope: contractual
    rule: "Sunnova 'guarantees minimum power production under all of the solar loan agreements where permitted by law' and pays 'the shortfall between expected production and actual production', with surplus carried forward [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.10, p.19]"
    applies_here: true
    source: "https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.10, p.19"
  ftc_holder_rule:
    scope: external-sectoral
    rule: "'a consumer's claim against a seller of goods and services may also be asserted against a lender that finances the purchase' (Federal Trade Commission rules, [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.10])"
    applies_here: true
    source: "https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.10"
  itc_interest_waiver:
    scope: contractual
    rule: "Under Easy Own and SunSafe Easy Own a borrower pays no interest on the ITC-prepaid portion if the ITC prepayment is made on time; otherwise the instalment steps up [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.7-8]"
    applies_here: true
    source: "https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.7-8"


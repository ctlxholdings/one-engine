lod0_gaps:   # what the deal needs that LOD 0 lacks, each with a classification
- kind: no_efficiency_partner_without_service_payment
  description: "A solar loan pool with a production guarantee and an O&M fee: Sunnova delivers an energy-service-like package (operate, maintain, guarantee output) but the homeowner pays only a fixed loan instalment. Reviewer: no Partner encoded (payment_basis = asset, as posigen_backleverage); the service content sits in c3 and c10. The case has no efficiency, so it stays out of scope"
  classification: "scope boundary (out-of-scope witness); no new term"
- kind: custodian
  description: "U.S. Bank as custodian of the loan files fits none of the 37 roles: account_bank_trustee is defined as holding accounts, a custodian holds documents. Left in source.context"
  classification: "encoding question; below LOD 0 (document custody)"
- kind: parent_guaranty_of_duties
  description: "The parent guaranty covers the performance of the Depositor, Manager and Servicer (including repurchase of defective loans), not payment of the notes. Encoded as a risk_promise from Sunnova to the Issuer under surety_guarantor ('guaranteeing a financing vehicle's debt' is the closest limb). Not exactly the definition"
  classification: "definition question (surety_guarantor: 'obligations of the Partner or of the vehicle's service providers'); no new term"
- kind: tax_credit_as_support
  description: "The federal ITC is a tax credit the borrower claims; LOD 0 has benefit_promise for 'a forgone charge such as a tax exemption' but requires a giver party, and none is in the deal. Encoded through grant_recipient = client (inferred) with no giver"
  classification: "encoding question"
- kind: waterfall_detail
  description: "Nineteen priority items, with sequential and regular amortisation, interest deferral and a make-whole amount, sit below LOD 0"
  classification: "below LOD 0 (LOD 1 waterfall, LOD 3 levels)"

conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F02
  title: "jurisdiction header field, dated at financial close; C1 trigger"
  convention: "A `jurisdiction` block (country, EU membership at close, whether the client is EU general government at close) sits in the header; C1 applies_when {client_sector: public, jurisdiction: EU at close}."
  applied_here: "jurisdiction US, dated 16 Feb 2021; C1 applies_here false"
- id: F04
  title: "borrower rule"
  convention: "borrower = none only when the source says own funds or equity; when no loan or equity is named, keep the default partner with status default."
  applied_here: "borrower = client (the homeowner takes the loan)"
- id: F06
  title: "one_way form"
  convention: "A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated."
  applied_here: "no party is one_way: every party has a stated or inferred counter-promise"
- id: F21
  title: "determination_promise is required"
  convention: "A determination_promise is required whenever a payment is computed on savings or completion; from = the party the source names, else the literal 'unstated'."
  applied_here: "c16 determination_promise (production monitoring), inferred from 'active monitoring of production'; loan instalments are not computed on savings"
- id: IFRS16
  title: "IFRS16_lease_test rule entry"
  convention: "IFRS16_lease_test applies_when {client_sector: private, asset_owner not client}."
  applied_here: "applies_here false (asset_owner client)"
- id: B2-R1
  title: "grant or loan giver by identity"
  convention: "A government body that lends or grants takes government_financier; grant_provider only for givers that are neither government nor EU funds."
  applied_here: "not triggered: no public lender; the ITC has no giver party"
- id: B3-web
  title: "web evidence"
  convention: "Evidence cited '<url> | <page or section>' with exact quotes of 25 words or fewer; PDF page = page of the PDF file."
  applied_here: "one KBRA report, 37 pages; PDF page = printed page"
- id: B3-scope
  title: "in_scope decided from the source"
  convention: "A case counts only if the source shows an efficiency deal; otherwise the file is kept as a witness and its uses do not count."
  applied_here: "in_scope false: solar-only pool; witness, uses not counted"
- id: B5-payment_basis
  title: "payment_basis setting (1 Oct ruling 1)"
  convention: "payment_basis goes first in settings with a status and a reason; no Partner is possible only when payment_basis is asset."
  applied_here: "payment_basis asset, inferred (equipment loan); no Partner"


# Miniature — D29 Sunnova Helios V Issuer, LLC, Solar Loan Backed Notes, Series 2021-A (US), expressed at ESCO LOD 0
#
# Batch 5 FINAL, reviewer rev-F (1 Oct 2026), reconciled from writers F-X and F-Y; base Y, Partner and servicer roles from X.
# Decisions: batch5/rev-F/decisions.json. Source re-fetched by the reviewer (WebFetch binary, pdftotext) and the disputed passages re-read.
# OUT-OF-SCOPE WITNESS: a pool of residential solar loans (PV, some with batteries); no efficiency asset is
# in the pool and the homeowner pays a loan, not for an energy service. Kept to show the vocabulary can express a trust-style ABS with a
# parent performance guaranty and a production guarantee; its uses are not counted.
# Evidence is one public document, fetched 1 Oct 2026 (WebFetch saved the binary; pdftotext to stdout; nothing kept in the project): [KBRA-NIR] https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955
# It is hosted on the New Jersey BPU public-access site (the server blocks plain curl; the PDF was obtained through the fetch tool).
# Kroll Bond Rating Agency 'ABS New Issue Report', 'Sunnova Helios V Issuer, LLC, Solar Loan Backed Notes, Series 2021-A', 16 Feb 2021, 37 pages.
# The page numbers are the printed 'Page | N' footers, which equal the PDF page. Quotes exact, <= 25 words. Statuses: stated / inferred / default /
# generic / unstated. The row's text came through a summarising tool; every figure below is re-read in the report.

miniature: sunnova_helios_v_2021a
lod: 0
case: batch5.D29_sunnova_helios_v_2021_a
case_kind: deal   # a named issue with a rating report: 'a $188.641 million residential solar loan ABS transaction' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.3]; the Easy Own loan below it is the representative (generic) contract
in_scope: false
in_scope_why: "The collateral is 'residential solar loans' financing 'Photovoltaic (PV) Systems, Energy Storage Systems (ESS), or both' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.3]; 'Only solar loan agreements are included in the securitization trust' (p.3). No efficiency measure is in the pool. The nearest energy-service feature is a production guarantee and an operations-and-maintenance (O&M) fee, but the homeowner's payment is a fixed loan instalment, so nobody is paid for an energy service. Out-of-scope witness; uses not counted (B3-scope)"

tests_unused:   # CASE_SPEC_5 list of unused items; a witness, so every item is false even where it fits
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "Structurally it fits and is stated: 'Sunnova Helios V Issuer, LLC' is the Issuer, 'a wholly-owned, direct subsidiary of the Depositor' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.4], which buys the solar loans through an 'Omnibus Contribution Agreement' and pledges the 'Trust Estate' to the indenture trustee (diagram, p.30). KBRA reviews 'the bankruptcy remoteness of collateral' as a general factor (p.29) but states no true-sale fact for this deal. Not counted: solar-only pool"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "Does not fit for the loans: under an Easy Own loan 'the borrower purchases the PV system from a dealer using financing provided by Sunnova' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.18]; the trust holds the loans, not the systems. The same report says generally that Sunnova 'takes title to the PV system' after commissioning (p.17), which belongs to Sunnova's lease and PPA products. asset_owner = client for this pool"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No hedge, swap or cap is named anywhere in the report (searched the whole text for hedge, swap, cap). The notes carry fixed coupons of 1.80% and 3.15% (p.3) against loans at a weighted average 3.94% (p.12). The only third-party credit item is an unnamed 'Eligible Letter of Credit Bank' in the waterfall (item xviii, p.32): no bank, no amount, no hedge"
- item: authority_guarantor
  kind: role
  used: false
  reason: "No public client; the obligors are homeowners. The only guarantee is the parent's performance guaranty (below), which is an obligation about the originator's duties, not a guarantee of any authority's payments"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The homeowner pays a fixed monthly loan instalment ('a fixed flat monthly payment', [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.8, p.18]). Sunnova's 'Production Guarantee' (p.10) is a make-good to the homeowner if output falls below a minimum, not a payment tied to a performance level: the instalment does not move with output. payment_basis = asset. The production guarantee is the nearest thing to a performance feature in the five deals of this batch; it sits inside c3"

source:   # where the facts come from; context = actors outside the deal boundary (F23); notes = observations that are not gaps
  id: KBRA-NIR
  title: "KBRA ABS New Issue Report, Sunnova Helios V Issuer, LLC, Solar Loan Backed Notes, Series 2021-A (16 Feb 2021)"
  publisher: "Kroll Bond Rating Agency; copy filed on the New Jersey Board of Public Utilities public-access site"
  passage: "https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.3-4 (summary, parties), p.6-7 (structure, interest waiver), p.10-11 (guarantees, parent guaranty), p.12 (transaction summary table), p.17-19 (origination, loan products, production guaranty, servicing), p.20-21 (custodian), p.29-32 (structure diagram, waterfall)"
  oracle: "none; the credit-enhancement figures can be re-computed from published sizes, shown in numbers"
  context:
  - "Sunnova Helios V Depositor, LLC and Sunnova ABS Holdings V, LLC: two intermediate special-purpose entities between Sunnova and the Issuer ('Issuer ... wholly-owned, indirect subsidiary of Sunnova ABS Holdings V, LLC', [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.4]). They pass the loans down ('Omnibus Contribution Agreement', p.30); the Depositor repurchases defective loans (p.31). Collapsed into the Issuer and Sunnova for LOD 0 (one level of ownership chain, no separate promise to the homeowner or noteholders is described)"
  - "Reviewer: the transaction parties table (p.4) and the waterfall (p.31) were re-read. Sunnova carries no partner_esco role (as PosiGen's sponsor in posigen_backleverage): the case ruling for solar-only loan pools is 'no energy-service Partner'; its O&M and production guarantee stay inside c3"
  - "U.S. Bank National Association: 'Custodian' of the loan files [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.4]; 'will take custody of copies of the solar loan files' (p.21). Holds documents, not accounts, so it does not fit account_bank_trustee ('holds escrow, trust-and-retention and reserve accounts'). Kept in context (lod0_gaps)"
  - "Credit Suisse Securities (USA) LLC and Popular Securities: 'Initial Purchasers' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.4]. Transient buyers that resell the notes; outside the deal boundary (as Ramirez in nyserda_green_bonds_2024a)"
  - "Eligible Letter of Credit Bank: an unnamed bank that may issue a letter of credit, repaid in item (xviii) of the waterfall [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.32]. No amount or purpose is stated in the report; context only"
  - "Sunnova ABS Holdings V, Sunnova Intermediate Holdings, LLC and Sunnova Energy International Inc. (the public parent): ownership chain on the diagram [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.30] and p.3. No promise to the deal beyond the parent guaranty by Sunnova Energy Corporation"
  - "Federal government (investment tax credit, ITC): 30% of the amount financed for systems placed in service in 2019, 26% for 2020 [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.7]. A tax credit claimed by the borrower; the loans are built around it (interest waiver on the prepaid ITC portion). No government party; recorded as a rule and in grant_recipient"
  - "Trinity Solar, Inc. and Infinity Energy Inc.: named dealers, 'A single dealer - Trinity Solar, Inc. - accounted for approximately 34% of Sunnova's in-service SSAs' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.17]. Two of 270 dealers; the pool's Dealer 1 to 3 are 19.47% / 13.48% / 12.20% by loan count (p.23). Represented by one generic dealer party"
  notes:
  - "Row check: 'collateral USD 181.25m' is the statistical pool, $181,254,889 over 5,269 loans [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.12]; the notes are larger ($188.641m) because 'approximately 13% will be prefunded at closing' of an approximately $208.4m pool [p.3, p.9]. 'Class A USD 150.079m 1.80% A-(sf); Class B USD 38.562m 3.15% BB-(sf)' match p.3. 'OC 9.5% initial' and 'reserve 1.0%' match the table on p.12. 'ARD Feb 2028' matches p.30"
  - "Row caveat 'Residential obligors, not a public authority. No hedge. Sponsor parent performance guarantee only' confirmed: parent guaranty p.10; no hedge in the report. 'Waterfall middle items not extracted': extracted here from p.31-32 (items i to xix)"
  - "Trustee and backup servicer are the same bank: 'Indenture Trustee/ Backup Servicer/ Transition Manager ... Wells Fargo Bank, National Association' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.4]. One party with two roles"
  - "KBRA gives no credit to the parent's guaranty: 'no credit is given to the guaranty as Sunnova, as the guarantor, is an unrated entity' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.10]"
  - "The report notes a holder-in-due-course style exposure: 'a consumer's claim against a seller of goods and services may also be asserted against a lender that finances the purchase' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.10]. This shapes assignment_recourse (performance_exposed, inferred)"
  - "Sunnova's own wording: 'provides low-cost solar electricity to homeowners' [https://publicaccess.bpu.state.nj.us/DocumentHandler.ashx?document_id=1241955 | p.3]. In the securitised pool the product is the loan (Easy Own); Sunnova also offers leases and PPAs, which are not in this pool ('Only solar loan agreements', p.3)"


# Miniature — Michigan DOT Metro Region Freeway Lighting P3 (DBFOM availability-payment concession), Freeway Lighting Partners LLC,
# 15 years from August 2015, expressed at ESCO LOD 0
#
# Batch 5 FINAL (reviewer rev-E, 1 Oct 2026), reconciled from writers E-X and E-Y (near-identical drafts). Base: E-X (keeps the federal
# money as a party, consistent with grant_recipient); E-Y's derived checks added.
# Evidence re-fetched 1 Oct 2026 (curl, text extracted). Quotes exact, 25 words or fewer.
#   [FHWA] https://www.fhwa.dot.gov/ipd/project_profiles/mi_metro_region_freeway_lighting.aspx  (FHWA project profile; 'Source: Freeway Lighting Partners')
#   [NOSS] https://www.nossaman.com/successes-MichiganStreetLightingFinancialClose  (MDOT's legal adviser, firm page)
# EVIDENCE GRADE: secondary. Both pages are summaries (one supplied by the concessionaire, one by the client's lawyer). The project
# agreement was not found. The deal is signed (financial close 24 Aug 2015); the payment mechanism is known only from the summaries.

miniature: michigan_freeway_lighting_p3
lod: 0
case: batch5.D21
case_kind: deal   # one named, closed DBFOM concession; commercial and financial close 24 August 2015
in_scope: true
in_scope_why: "Quarterly 'availability payments' that 'are a function of performance (e.g. correct roadway illumination), energy costs savings, and maintenance activities' [FHWA | Description], with 'a risk/reward mechanism for energy savings' [NOSS | para 3], for an LED replacement of about 15,000 freeway lights. Payment on a service level, with efficiency as a stated element: an ESCO deal under ruling 1 (payment_basis != asset)"

tests_unused:
- item: payment_basis=performance
  kind: setting_value
  used: true
  reason: "Exercised on secondary evidence. 'Quarterly service payments (availability payments)' over 13 years of O&M, a 'function of performance (e.g. correct roadway illumination)' [FHWA | Description; Financial Status]. A signed availability-payment concession, the field's standard form of payment tied to a performance level that is not savings; savings enter only as a risk/reward element [NOSS | para 3]. Deductions and thresholds sit in the unread project agreement. Status inferred. This is the strongest of the batch's three performance witnesses (signed deal; the payment recovers capex, O&M and debt service)"
- item: authority_guarantor
  kind: role
  used: false
  reason: "The service payments are 'backed in part by $79 million in federal funding' [FHWA | Description]: money MDOT draws on (c13), with no promise to the concessionaire to pay if MDOT does not. No guarantor named"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "debt is 'a private placement with Allianz Life Insurance of North America' [NOSS | para 3]; no hedge on either page"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "the lender lends to the concessionaire ('To the Borrower (Freeway Lighting Partners)' [FHWA | Project Advisors]); no note-issuing vehicle"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "title not stated; the concessionaire 'must hand back the system to MDOT' [NOSS | para 2]. No third-party title holder"

source:
  id: FHWA+NOSS
  title: "Project Profile: Metro Region Freeway Lighting P3 (Michigan); Nossaman, Michigan Street Lighting Financial Close"
  publisher: "U.S. DOT Federal Highway Administration, Center for Innovative Finance Support (data credited to Freeway Lighting Partners); Nossaman LLP"
  passage: "https://www.fhwa.dot.gov/ipd/project_profiles/mi_metro_region_freeway_lighting.aspx | Description; Cost; Funding Sources; Private Partner; Project Advisors; Lenders; Duration / Status; Financial Status; Innovations. https://www.nossaman.com/successes-MichiganStreetLightingFinancialClose | paras 1-4"
  oracle: "FHWA Funding Sources vs Cost: 44 + 5 = 49 = Design and Construction $49m (closes); milestones 6 + 6 = 12 (closes)"
  context:
  - "Advisers: KPMG, Nossaman, AECOM (to MDOT); Star America Infrastructure Fund, Hunton & Williams, Norton Rose Fulbright, Aon, Mazars (to the concessionaire) [FHWA | Project Advisors]. No promise in the deal"
  - "WSP, 'Lighting Design' [FHWA | Private Partner]: designer is a parked term (RULINGS 13)"
  - "Name conflict: NOSS calls the consortium 'Star America/Aldridge Electric/Cofely Services'; FHWA lists Star America 85% and Aldridge 15% as equity and 'Engie Services Group' for O&M performance. Not resolved"
  notes:
  - "Value conflict: FHWA '$172 million (15-year life cycle cost)' vs NOSS 'approximately $125 million'. Published payments give 12 + 2.1 x 4 x 13 = $121.2m, 3.0% below NOSS and $50.8m below FHWA"
  - "FHWA's header calls MDOT 'Project Sponsor / Borrower' but its advisers section names Freeway Lighting Partners 'the Borrower'; NOSS: 'The P3 was financed through a private placement'. Borrower = partner"
  - "Energy saving '$1.5 million annually, or $13 million over the duration of the contract' [FHWA | Innovations]: 1.5 x 13 = 19.5, 1.5 x 15 = 22.5; neither is 13. Unreconciled"


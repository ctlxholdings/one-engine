    family: performance_promise
    from: flp
    to: mdot
    status: stated
    what: "replaces, upgrades and maintains 'approximately 15,000 lights on the five corridors for a period of 15 years' [FHWA | Description]; 2-year build, 13-year O&M; hands the system back 'in a manner that meets contractual performance requirements' [NOSS | para 2]. Deductions stay inside this promise"
    established_by: concession_agreement
  c2:
    family: payment_promise
    from: mdot
    to: flp
    status: stated
    what: "'MDOT milestone payments made during construction totaled $12 million ($6 million at 90% and at 100% completion)' [FHWA | Financial Status]"
    established_by: concession_agreement
  c3:
    family: payment_promise
    from: mdot
    to: flp
    status: stated
    depends_on_savings: true   # availability payments a function of performance and energy cost savings (FHWA)
    what: "'Quarterly service payments (availability payments) of approximately $2.1 million' for the 13-year O&M period [FHWA | Financial Status], a function of performance, energy cost savings and maintenance [FHWA | Description]; compensate 'design and construction costs and ongoing operations, maintenance and debt service' [FHWA | Description]"

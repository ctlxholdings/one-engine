# Miniature — LIG Schloss Retzhof (Styria, Austria): Integrated Energy Contracting (IEC), efficiency measures plus supply of
# useful energy under one ESCo contract, expressed at ESCO LOD 0. Batch 7, group I, reviewer's reconciled file (writers X and Y), deal T02.
#
# Evidence: one local corpus text, cited as der-vpp/spec-run/esco-moneyflow/input/<file>.txt:<line> | <quote> (line numbers as grep -n counts them).
# IEA13 = der-vpp/spec-run/esco-moneyflow/input/iea-dsm-task16-phase1-final-report-2013.txt: Retzhof at L1814-1922, LIG's IEC tenders at L1733-1811,
# the IEC model abstract at L1103-1213. The same example is Figure 7-8 of input/iea-dsm-task16-final-report.txt (L1307-1376), which adds no party or figure.
# Not under input-licensed/, so quotes may run to 25 words. Every fact carries its status: stated / inferred / default / generic / unstated.
# Figure 11 (L1879-1901) is a two-chart diagram flattened to text: facts read only from its arrows are inferred.
# Section 7.1 (L1733-1811) describes LIG's IEC tenders in general: facts taken from it for Retzhof are generic.

miniature: lig_retzhof_iec
lod: 0
case: batch7.T02
case_kind: deal   # one named property, one ESCo contract; parties other than LIG are not named
in_scope: true
in_scope_why: "One ESCo contract combines efficiency measures with energy supply: der-vpp/spec-run/esco-moneyflow/input/iea-dsm-task16-phase1-final-report-2013.txt:1847-1848 | 'Combination of energy efficiency measures and supply of useful energy'. The ESCo finances and operates the plant and is paid for energy supplied and capital cost. Ruling 14: every efficiency deal counts; the ESCO reading comes from payment_basis = supply"

tests_unused:
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No receivables are sold and no notes are issued; a credit funds the ESCo (Figure 11 'FIN' 'CREDIT' 'ESCO', IEA13:1887)"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No hedge or interest-rate instrument is mentioned"
- item: authority_guarantor
  kind: role
  used: false
  reason: "Nobody is shown guaranteeing LIG's payments to the ESCo or the user's payments to LIG"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "der-vpp/spec-run/esco-moneyflow/input/iea-dsm-task16-phase1-final-report-2013.txt:1918 | 'The ESCo invests in the CHP plant upon it’s own risk.' No third-party owner is shown"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "LIG pays basic cost, heat, electricity and capital cost (Figure 11, IEA13:1894-1898). The quality assurance instruments 'secure the functionality and performance' of the measures (IEA13:1198-1199) but no payment is tied to an availability, output or comfort level"

single_source_exercised:   # terms in the CASE_SPEC_7 list that this deal uses
- term: occupant
  kind: role
  evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-dsm-task16-phase1-final-report-2013.txt:1916-1917 | 'co-financing of the investments by using funds provided by the user of the building'"
  confirmed: true
  note: "The user is named only as 'USER' (Figure 11, IEA13:1887); it rents from LIG ('Rental agreement', IEA13:1886-1887) and pays 'Rent +' 'operating cost' (IEA13:1896-1897). The text states its funds; the rental flows are read from the figure (inferred). It is the end user of a building it does not own, with promises to the owner, not to the ESCo: the role's definition"

source:
  id: IEA13
  title: "IEA DSM Task XVI Competitive Energy Services, Final Task Report (Phase 1) — 7.2 'Good Practice' Example, Schloss Retzhof"
  publisher: "Grazer Energieagentur GmbH and authors (J. W. Bleyl-Androschin, D. Schinnerl) for IEA DSM Task XVI, 2013"
  passage: "IEA13:1814-1922 (Retzhof), with the LIG tenders at IEA13:1733-1811 and the IEC model at IEA13:1103-1213"
  oracle: "none, not a published validation target. Figure 11 amounts and the area-based consumption re-added in numbers.derived"
  documents:
    IEA13: "der-vpp/spec-run/esco-moneyflow/input/iea-dsm-task16-phase1-final-report-2013.txt"
  context:
  - "Grazer Energieagentur GmbH: 'The project was implemented with the support of Grazer Energieagentur GmbH' (IEA13:1846); the agency also published the report. No promise, fee or contract is stated: context, not a party (batch-5 ruling on energy agencies)"
  - "LIG as a programme: it 'administers and manages more than 420 buildings in Styria' (IEA13:1736) and tendered IEC in pools (five buildings in 2007/08; Pool 2 of three real estates in 2009; IEA13:1750-1754); 'eight projects' so far (IEA13:1173). Whether Retzhof belongs to a pool is not stated; the Pool 2 savings ranges (IEA13:1777-1788) are not Retzhof's"
  - "The State Government of Styria owns LIG (IEA13:1737-1738); the caption calls Retzhof a 'Seminar House of the Province of Styria' (IEA13:1833). Ownership context; no promise to the ESCo"
  - "Procurement: LIG's IEC call was a 'negotiated procedure according to public procurement law' (IEA13:1756-1757), proposals assessed 'by a commission entrusted by the client' (IEA13:1764): recorded as a rule, no party"
  notes:
  - "Who the client is. LIG 'is a 100% subsidiary of the State Government of Styria' (IEA13:1737-1738) and the building owner whose goals the page lists (IEA13:1840-1845). Encoded authority (a state-owned owner buying under public procurement law). Whether LIG is inside Austria's general government is not stated, so the jurisdiction flag is undetermined; the role definition asks for an owner inside general government, and host ('private building owner') does not fit either. Logged as an encoding question"
  - "Who the user is: Figure 11 'USER' under a 'Rental agreement'; the complex is 'used as hotel and seminar house' (IEA13:1828). No legal person is named"
  - "Gas. Figure 11 puts UTILITY above the CLIENT with 'Gas' (chart 1) and 'Gas cost' (chart 2), and lists what the client pays the ESCo as 'Heat (minus gas)' (IEA13:1882-1896). Read as: the client buys the gas and pays the ESCo the rest. The page does not say it in words. Alternative: the ESCo buys the gas (bill_custody provider, R4 to the Partner)"
  - "Co-financing. 'Co-financing: €38.000' sits under CLIENT in Figure 11 (IEA13:1899); the text says the user's funds reduced 'the ongoing capital costs' by 'approx. 30 %' (IEA13:1916-1917). Encoded as the user's payment to LIG, which passes it into the capital-cost component; the payee is read from the figure, and whether it was paid once or over time is not stated"
  - "Savings guarantee replaced: 'measure specific quality assurance instruments substituting the EPC savings guarantee' (IEA13:1848-1849). In LIG's tenders the ESCo verifies compliance with the quality standards at 'acceptance' (IEA13:1793-1795, section 7.1): generic for Retzhof"
  - "Contract term: 'Contract term (e.g. 15 years)' is the model's example (IEA13:1860); 15 years is the pay-back period that 'corresponds to the contractual period' in Pool 2 (IEA13:1806-1807). The Retzhof term is not stated"


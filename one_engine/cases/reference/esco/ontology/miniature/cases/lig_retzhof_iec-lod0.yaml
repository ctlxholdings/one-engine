parties:
  lig:
    entity: lig_steiermark
    role: authority
    groups: [demand, public]
    status: inferred
    name: LIG, Landesimmobiliengesellschaft Steiermark (State Real Estate Company, Styria), owner of Schloss Retzhof
    text: "der-vpp/spec-run/esco-moneyflow/input/iea-dsm-task16-phase1-final-report-2013.txt:1737-1738 | 'LIG is a 100% subsidiary of the State Government of Styria, Austria'; owner's goal 'Outsourcing of energy supply and financing of the investments' (IEA13:1843). Role authority inferred; general-government status open (see source.notes). Legal form (GmbH or other) not given in the source, so not in legal_name"
  esco:
    role: partner_esco
    groups: [partner]
    status: stated
    name: ESCo of the Retzhof Integrated Energy Contracting (not named)
    text: "der-vpp/spec-run/esco-moneyflow/input/iea-dsm-task16-phase1-final-report-2013.txt:1918 | 'The ESCo invests in the CHP plant upon it’s own risk.'; acts 'as a general contractor' (IEA13:1907); 'The ESCo contract was awarded' in a two-phase negotiating procedure (IEA13:1849-1851)"
  fin:
    role: lender
    groups: [capital]
    status: inferred
    name: FIN, the financing institution (not named)
    text: "Figure 11 chart 1 'FIN' 'CREDIT' 'ESCO' (IEA13:1887); chart 2 'Repayment', 'Invest.' 'ca. €110.000' between FIN and ESCO (IEA13:1895-1899). A credit to the ESCo is read from the figure, hence inferred; lessor is the alternative reading of 'FIN'"
  user:
    role: occupant
    groups: [demand]
    status: inferred
    name: USER, the user of the building (not named)
    text: "Figure 11 'Rental agreement' between CLIENT and USER (IEA13:1886-1887) and 'Rent +' 'operating cost' (IEA13:1896-1897); der-vpp/spec-run/esco-moneyflow/input/iea-dsm-task16-phase1-final-report-2013.txt:1916-1917 | 'co-financing of the investments by using funds provided by the user of the building'. The buildings 'are used as hotel and seminar house' (IEA13:1828)"
  utility:
    role: utility_supplier
    groups: [energy, collection]
    status: inferred
    name: UTILITY, the gas supplier (not named)
    text: "Figure 11 'UTILITY' with 'Gas' (chart 1) and 'Gas cost' (chart 2) (IEA13:1882-1893); direction read as supply to the client (source.notes)"

contract:
  iec_contract:
    core: contract
    parties: [esco, lig]
    status: stated
    note: "der-vpp/spec-run/esco-moneyflow/input/iea-dsm-task16-phase1-final-report-2013.txt:1849-1851 | 'The ESCo contract was awarded in a combined competition of prices and solutions in the course of a two-phase negotiating procedure.' Figure 11 label 'IEC Contract' (IEA13:1886-1887). Terms and term length not published"
  credit_agreement:
    core: contract
    parties: [fin, esco]
    status: inferred
    note: "Figure 11 'CREDIT' between FIN and ESCO (IEA13:1887); 'Re-financing will be done by selling electric current to the building owner' (IEA13:1918-1919). Terms not published"
  rental_agreement:
    core: contract
    parties: [lig, user]
    status: stated
    note: "Figure 11 label 'Rental agreement' between CLIENT and USER (IEA13:1886-1887); its terms, and those of the user's co-financing, are not described"
  gas_supply:
    core: contract
    parties: [utility, lig]
    status: inferred
    note: "Figure 11 'UTILITY', 'Gas', 'Gas cost' (IEA13:1882-1893); direction inferred; terms not given"

commitments:
  c1:
    family: performance_promise
    from: esco
    to: lig
    status: stated
    what: "efficiency measures plus supply of useful energy under one contract (IEA13:1847-1849): new heating centre with CHP (IEA13:1837-1838, 1918), top-floor insulation of the castle (IEA13:1912-1915), as general contractor (IEA13:1906-1907); operation, maintenance and replacement of the installations in LIG's IEC contracts (IEA13:1799-1800, generic); 'quality assurance instruments substituting the EPC savings guarantee' (IEA13:1848-1849). No savings guarantee: the instruments secure functionality and performance, 'but not it’s exact quantitative outcome' (IEA13:1200)"
    established_by: iec_contract
  c2:
    family: payment_promise
    from: lig
    to: esco
    status: inferred
    what: "Figure 11 lists what the CLIENT pays the ESCo: 'Basic cost', 'Heat (minus gas)', 'Electricity (CHP)', 'Capital cost' (IEA13:1894-1898). For the CHP the text states the mechanism: der-vpp/spec-run/esco-moneyflow/input/iea-dsm-task16-phase1-final-report-2013.txt:1918-1919 | 'Re-financing will be done by selling electric current to the building owner during the contractual period.' Amounts not published"
    established_by: iec_contract
  c3:
    family: determination_promise
    from: esco
    to: lig
    status: generic
    determines: acceptance   # compliance with the specifications at acceptance (IEA13:1793-1795)
    what: "in LIG's IEC contracts 'the ESCo has to verify compliance with quality standards defined in the functional specifications and the QAI' at 'acceptance' (IEA13:1793-1795), and operates the plant with web access for the owner to consumption data (IEA13:1796-1798). Figure 10 lists annual audit, proof of function and performance measurement (IEA13:1863-1865). No independent verifier is named; the Retzhof results 'apply subject to a systematic monitoring and verification' (IEA13:1920-1921)"
    established_by: iec_contract
  c4:
    family: funding_promise
    from: fin
    to: esco
    status: inferred
    funding_instrument: loan   # credit for the ESCo's investment (IEA13:1898-1899)
    what: "credit for the ESCo's investment, 'Invest.' 'ca. €110.000' on the FIN-ESCO link (Figure 11, IEA13:1898-1899). The amount may be the investment rather than the credit: not stated"
    established_by: credit_agreement
  c5:
    family: payment_promise
    from: esco
    to: fin
    status: inferred
    what: "'Repayment' (Figure 11, IEA13:1895); reciprocal of c4"
    established_by: credit_agreement
  c6:
    family: performance_promise
    from: lig
    to: user
    status: inferred
    what: "use of the castle and guest houses (about 4,000 m2, 'used as hotel and seminar house', IEA13:1827-1828) under the 'Rental agreement' (IEA13:1886-1887); terms not described"
    established_by: rental_agreement
  c7:
    family: payment_promise
    from: user
    to: lig
    status: inferred
    what: "'Rent +' 'operating cost' (Figure 11, IEA13:1896-1897); no amount"
    established_by: rental_agreement
  c8:
    family: payment_promise
    from: user
    to: lig
    status: inferred
    what: "co-financing: 'Co-financing: €38.000' under CLIENT in Figure 11 (IEA13:1899); the user's funds reduced 'the ongoing capital costs' by 'approx. 30 %' (IEA13:1916-1917). The funds are stated; the payee (LIG) is read from the figure. A payment, not a funding_promise: no claim of the user on LIG is stated. Whether the user gets a rent reduction in return is not stated"
    established_by: rental_agreement
  c9:
    family: performance_promise
    from: utility
    to: lig
    status: inferred
    what: "gas supply (Figure 11 'Gas', IEA13:1884); direction read from 'Gas cost' and 'Heat (minus gas)' (source.notes)"
    established_by: gas_supply
  c10:
    family: payment_promise
    from: lig
    to: utility
    status: inferred
    what: "'Gas cost' (Figure 11, IEA13:1893); the ESCo's heat charge is 'minus gas' (IEA13:1895), so the gas appears to be bought separately"
    established_by: gas_supply

settings:
  payment_basis:
    value: supply
    status: inferred
    why: "LIG pays for heat, CHP electricity, basic cost and capital cost (Figure 11, IEA13:1894-1898); the IEC model keeps 'the simpler approach of the ESC business model' (IEA13:1185-1187), where 'no baseline is needed to measure savings' (IEA13:1129-1130), and replaces the savings guarantee (IEA13:1198). Capital cost of the efficiency measures is paid inside the same stream; alternative asset for that component"
  client_sector:
    value: public
    status: stated
    why: "der-vpp/spec-run/esco-moneyflow/input/iea-dsm-task16-phase1-final-report-2013.txt:1737-1738 | 'LIG is a 100% subsidiary of the State Government of Styria, Austria'; it procures 'according to public procurement law' (IEA13:1756-1757)"
  partner_form:
    value: corporate
    status: default
    why: "the ESCo is not named; no deal vehicle is described"
  borrower:
    value: partner
    status: inferred
    why: "Figure 11 'FIN' 'CREDIT' 'ESCO' (IEA13:1887); 'The ESCo invests in the CHP plant upon it’s own risk' (IEA13:1918). The ESCo, not LIG, takes the credit. Alternative lessor financing"
  receivable_holder:
    value: partner
    status: default
    why: "no assignment of LIG's payments mentioned; the ESCo refinances 'by selling electric current to the building owner' (IEA13:1918-1919)"
  collection_placement:
    value: operator_own
    status: default
    why: "not stated"
  aggregation:
    value: none
    status: inferred
    why: "one property, one IEC contract. LIG tenders buildings in pools (IEA13:1750-1754) but the page does not place Retzhof in one, and one client's several buildings stand alone anyway (ENCODING aggregation)"
  debt_seniority:
    value: senior
    status: default
    why: "rank not stated"
  assignment_recourse:
    value: not_applicable
    status: inferred
    why: "follows from receivable_holder = partner"
  savings_basis:
    value: measured
    status: default
    why: "payment is on supply, not savings; fallback value, flagged. LIG's tenders mention 'computational saving verifications' (IEA13:1790-1791) but no savings are paid for"
  grant_recipient:
    value: none
    status: default
    why: "no subsidy is named for Retzhof; the €38,000 comes from the user (IEA13:1916-1917). The remark that shell refurbishment needs 'additional subsidies or co-financing' (IEA13:1806-1808) is about Pool 2 and future projects"
  asset_owner:
    value: partner
    status: inferred
    why: "the ESCo invests in the CHP plant at its own risk and refinances it by selling electricity during the contract (IEA13:1918-1919); the model chart ends in 'Handover' (IEA13:1863). Title is not stated; alternative client for the building-side measures (insulation)"
  bill_custody:
    value: client
    status: inferred
    why: "'Gas cost' is a separate flow beside the CLIENT and the ESCo charges 'Heat (minus gas)' (Figure 11, IEA13:1893-1895): LIG appears to keep the gas bill. Read from the figure; alternative provider"

rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU general government at close}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: undetermined
    this_case: "public client in an EU member, but LIG's classification inside general government is not stated. If it is inside, the test has no guaranteed savings to count (quality assurance replaces the guarantee). The source: der-vpp/spec-run/esco-moneyflow/input/iea-dsm-task16-phase1-final-report-2013.txt:1204-1206 | 'fiscal and balance sheet related implications of the IEC Model will have to be reviewed in comparison to EPC'"
    source: "E15 L2576-2582, L6930-6943; IEA13:1204-1206"
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: false
    this_case: "client_sector public"
    source: "RULINGS.md ruling 7; E02 L3293-3295"
  austria_public_procurement:
    scope: external-sectoral
    applies_when: {client_sector: public}
    rule: "LIG's IEC calls: a competition of prices and solutions on functional specifications, 'a negotiated procedure according to public procurement law', evaluated on lowest project-cycle cost of energy supply, lowest CO2 and highest energy-cost savings from demand-side measures with pay-back under 15 years (IEA13:1744-1745, 1755-1764)"
    applies_here: true
    this_case: "the Retzhof ESCo contract was 'awarded in a combined competition of prices and solutions in the course of a two-phase negotiating procedure' (IEA13:1849-1851): stated for Retzhof; the evaluation criteria are generic (section 7.1)"
    source: "der-vpp/spec-run/esco-moneyflow/input/iea-dsm-task16-phase1-final-report-2013.txt:1756-1757 | 'procured in the framework of a negotiated procedure according to public procurement law'"

numbers:
  investment_eur: "ca. 110,000 (Figure 11 'Invest.', IEA13:1898-1899)"
  user_cofinancing_eur: "38,000 (Figure 11, IEA13:1899)"
  capital_cost_reduction_pct: "approx. 30, 'ongoing capital costs' (IEA13:1917)"
  useful_area_m2: "approx. 4,000 (IEA13:1827-1828)"
  consumption_indicator_before_kwh_per_m2_a: "approx. 185 (IEA13:1838-1839)"
  contract_term_years: "not stated for Retzhof; model example 'e.g. 15 years' (IEA13:1860)"
  lig_portfolio: "more than 420 buildings managed, about 200 owned, over 700,000 m2 owned (IEA13:1736-1737)"
  derived:
    cofinancing_share: "38,000 / 110,000 = 34.5 % if the 110,000 includes the user's part; 38,000 / (110,000 + 38,000) = 25.7 % if it comes on top. The printed 'approx. 30 %' is on 'ongoing capital costs', whose base is not published, and falls between the two: no tie claimed"
    net_investment_eur: "110,000 - 38,000 = 72,000, only if the co-financing is part of the 110,000 (not stated)"
    energy_use_before_kwh_a: "approx. 185 kWh/m2/a x approx. 4,000 m2 = approx. 740,000 kWh/a (both approximate; the indicator may use a different floor-area base)"


conventions_applied:
- id: F02
  title: jurisdiction header, dated at close
  convention: "country, EU membership, client EU general government at close; undetermined when the source does not classify a state-owned company"
  origin: RULINGS.md ruling 4
  applied_here: "AT, EU member; client flag undetermined; C1 applies_here undetermined"
- id: R14
  title: scope read from payment_basis
  convention: "every efficiency deal counts; ESCO-ness is payment_basis != asset"
  origin: RULINGS.md ruling 14
  applied_here: "in scope; payment_basis supply"
- id: B5-agencies
  title: energy agencies are context unless they promise
  convention: "advisers and energy agencies are source.context, not parties, unless the source states a promise by them"
  origin: REVIEW_SPEC_5 rulings
  applied_here: "Grazer Energieagentur in source.context"
- id: F18
  title: facts read only from figure arrows are inferred
  convention: "status discipline for diagrams flattened to text"
  origin: findings F18; ENCODING.md Status
  applied_here: "Figure 11: c2, c4-c10 inferred"
- id: F21
  title: determination_promise by the performing party
  convention: "the from-party of the determination promise says who determines"
  origin: verdict rule F21
  applied_here: "c3 ESCo verifies at acceptance (generic, LIG's tenders)"
- id: R15
  title: risk_allocation holds only rows the source states or implies
  convention: "converter derives every other row from the settings"
  origin: RULINGS.md rulings 15-16; ENCODING.md
  applied_here: "R1 usage and R4 rows"
- id: R17
  title: contracts binding and settled by default
  convention: "binding: non_binding or terms_settled: unsettled only when the source says so"
  origin: RULINGS.md ruling 17
  applied_here: "all four agreements default; the source describes an awarded, implemented contract"
- id: R18
  title: one identity per legal entity
  convention: "entity / entity_new / entity_local on each party"
  origin: RULINGS.md ruling 18
  applied_here: "lig_steiermark entity_new; the other four parties are unnamed: entity_local"


  country: Austria
  iso: AT
  eu_member: true
  client_eu_general_government_at_close: undetermined
  as_of: "contract date not given (the new guest house dates from 2009, IEA13:1827; LIG's IEC tenders ran 2007-2009, IEA13:1750-1753)"
  status: inferred
  why: "Styria, Austria, an EU member. LIG is 'a 100% subsidiary of the State Government of Styria' (IEA13:1737-1738); whether this company is classified inside general government is not stated"


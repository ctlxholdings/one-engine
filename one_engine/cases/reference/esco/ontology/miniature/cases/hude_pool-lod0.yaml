source:
  id: DENA
  title: Anwendungsbeispiele von Energiespar-Contracting (dena Kompetenzzentrum Contracting), entry 'Gemeinde Hude'
  publisher: Deutsche Energie-Agentur GmbH (dena), Kompetenzzentrum Contracting
  passage: 'https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | entry ''Gemeinde Hude'': intro text, Basisdaten,
    Projektbeteiligte, Weitere Daten, Liegenschaft(en), Maßnahmen, Merkmale. Re-fetched 1 Oct 2026 by the reviewer (curl, tags stripped); every quote below
    asserted as a substring of that text'
  oracle: none external. Internal checks in numbers.checks re-compute the printed percentage, the phase length and the Merkmale size classes from the page's
    own figures
  context:
  - 'BEKS EnergieEffizienz GmbH is listed under Beratung (''Beratung BEKS EnergieEffizienz GmbH'', [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/
    | Gemeinde Hude > Projektbeteiligte]). An adviser with no promise stated on the page: context, not a party (standing ruling on advisers and energy agencies)'
  - 'End user: the municipality''s own nine buildings (''Neun Liegenschaften, unter anderem das Rathaus, mehrere Schulen und ein Kindergarten wurden in
    Hude zu einem Gebäudepool zusammengefasst.'', [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | Gemeinde
    Hude > Liegenschaft(en)]). It signs nothing and promises nothing on the page; the client is the municipality itself'
  - dena is also the publisher of the page. No funder, bank, guarantor or verifier is named in the entry; nothing is added
  notes:
  - 'Payment mechanics are not on the page for this entry: no remuneration, schedule, shortfall rule or measurement method. The page''s general text says
    only ''Die Realisierung von Projekten durch einen Energiespar-Contractor führt in der Regel zu höheren Einsparungen, die zusätzlich noch vertraglich
    garantiert werden.'' [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | page intro > ESC für die öffentliche
    Hand]'
  - 'Construction-cost subsidy flag: ''mit Baukostenzuschuss: ja'' [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/
    | Gemeinde Hude > Merkmale]. Under the standing ruling a Baukostenzuschuss flagged ''ja'' is the client''s own payment to the Partner (c4, inferred),
    not a grant; no amount, payer or date is published'
  - 'Savings percentage: 31,000 / 213,000 = 14.55% vs 14.7% printed: does NOT close: 14.55% rounds to 14.6%, gap 0.15 points; 14.7% of 213,000 = 31,311
    EUR. The page gives no unrounded inputs, so the gap cannot be explained; immaterial at LOD 0'
  - 'Budget relief ''Haushaltsentlastung: 9.000 Euro pro Jahr'' [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/
    | Gemeinde Hude > Weitere Daten]. Read as the part of the saving the client keeps after paying the contractor, from the page''s own use of the term
    on another entry: ''Das führt dazu, dass keine Haushaltsentlastung möglich ist, sondern aufgrund des großen Anlagenbestandes eine Zuzahlung benötigt
    wird.''. This reading is inferred, and the difference to the guarantee is a check, not a published payment'
  - 'Pool: the entry states a building pool (''Neun Liegenschaften, unter anderem das Rathaus, mehrere Schulen und ein Kindergarten wurden in Hude zu einem
    Gebäudepool zusammengefasst.'') and ''Pool-Projekt: ja''; nine properties (''Anzahl Liegenschaften: 9''). Consistent; aggregation = pool, stated'

in_scope: true
in_scope_why: 'A named, signed energy-saving contract (''Contracting-Modell: Energiespar-Contracting''; ''Vertragsschluss: 30.04.2010'') in which the contractor
  guarantees a yearly energy-cost saving (''Einspargarantie: 31.000 Euro pro Jahr (14,7 Prozent)''). The client pays for an energy service tied to savings,
  so payment_basis = savings and the deal is in scope (EED Art. 2(27) via E02 L556-560)'

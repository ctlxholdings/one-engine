rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when:
      client_sector: public
      jurisdiction: EU at close
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of the operational payments + non-repayable government financing (an upfront
      grant at face value); else ON the government balance sheet (E15 L2578-2582)
    applies_here: true
    this_case: 'public client in Germany, an EU member at close (2010-04-30). The test is triggered but its outcome is undetermined: the operational payments
      are not published. Only the guarantee (31,000 EUR/yr over a 12-year phase) and the investment (251,000 EUR) are printed. The client''s Baukostenzuschuss
      (c4) is public money not repayable by the Partner, so under the rule''s wording it would enter side (b) at face value; its amount is not published.'
    source: E15 L2576-2582 (NPV basis, owner ruling 1 Oct, change 1); client sector from the dena page

# Miniature: Stockethill, Aberdeen. A not-for-profit council heat company, a 10-year annual-payment contract with Aberdeen City Council,
# a GBP 1 million loan and a council loan guarantee. Expressed at ESCO LOD 0. Batch 7, deal T12, reconciled by the group L reviewer from writers X and Y (decisions.json).
#
# Evidence: the local corpus text der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt (UNEP, District Energy in Cities, 2015), case study 3.11 (L4717-4751) and the guarantee
# passage in section 2 (L2990-3005). The page is set in columns, so a line number holds pieces of neighbouring columns; each quote
# below is one contiguous piece of one column. Not under input-licensed/, so quotes are at most 25 words.
# Citations read <path>:<line> | 'exact quote'. Every fact carries its status: stated / inferred / default / generic / unstated.

miniature: stockethill_aberdeen_heat_company
lod: 0
case: batch7.T12
case_kind: deal   # a named first project, 289 apartments at Stockethill, with an annual payment, a loan and a guarantee
in_scope: true
in_scope_why: "a communal heating system connected to combined heat and power ('water-based communal heating systems connected to CHP', der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4728 | 'connected to CHP. Although the Council could afford to') delivered to 289 council flats under a 10-year contract (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4723 | 'For the first project, serving 289 apartments in four blocks'). Efficiency deal by ruling 14; the Council pays a fixed annual amount, so payment_basis supply (inferred) and an ESCO deal"

tests_unused:
- item: authority_guarantor
  kind: role
  used: false
  reason: "the Council's guarantee covers the company's loan, a Partner debt, not the Council's own payments: 'Aberdeen City Council underwrites' (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:3001 | 'Aberdeen City Council underwrites') 'the not-for-profit district heating company' (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:3002 | '(via a loan guarantee) the not-for-profit'). A public body guaranteeing the Partner's debt takes government_financier (elements.yaml)"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "no hedge is mentioned; the loan is described as 'commercial debt financing at attractive rates' (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:3004 | 'to obtain commercial debt financing')"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "the company is a not-for-profit operating company, not a bankruptcy-remote buyer of receivables; no notes"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "title is not stated (default client); the company is the Partner, not a third-party owner"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "considered. The annual payment is tied to no stated availability, output or comfort level (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4725 | 'company to deliver the project based on an annual payment'), so performance is not supported. See lod0_gaps"

single_source_exercised: []   # none of the 11 single-source roles or 4 single-source settings is used; the guarantee covers the Partner's debt, so authority_guarantor stays unused

source:
  id: UNEP2015
  documents:
    UNEP2015: "der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt (case study 3.11 at L4717-4751; guarantee passage at L2990-3005)"
  title: District Energy in Cities, Case Study 3.11 Aberdeen City Council, a not-for-profit model
  publisher: UNEP (with the Danfoss, IFC and others cited as contributors), 2015
  passage: "L4717-4751 (middle column of the page holds the Stockethill facts), L2993-3005 (guarantee, section 2)"
  oracle: "none; not a published validation target"
  context:
  - "Residents of the 289 apartments: members of the company, who nominated board directors (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4747 | 'community, including residents, who nominated board'). Heat users; the text states no payment promise by residents to anyone in this deal, so no occupant party is encoded"
  - "A government-funded capital grant programme that became available 'at that point' (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4731 | 'to the City Council. At that point, a government-funded'). The company then 'spread the loan finance over two more projects, blending it with grants' (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4735 | 'and the company was able to spread the loan finance over'). Applies to the second and third projects, not to Stockethill: context, grant_recipient none for this deal"
  - "The Council's capital investment programme for upgrading its heating stock: funds 'otherwise intended for refurbishing the heating systems' were blended into the later projects (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4737 | 'two more projects, blending it with grants and the funds'). Not part of the Stockethill chain"
  - "Carbon Trust (case study contributor, der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:237 | 'Michael King (Carbon Trust)'): acknowledgement, no promise"
  notes:
  - "The same GBP 1 million loan is described as spread over two further projects (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4735-4737). The loan in this file is the Stockethill loan as the box first states it; later drawings are not encoded"
  - "The guarantee passage in section 2 (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:3001-3004) speaks of the not-for-profit company in general, not of Stockethill by name. Linking it to the Stockethill loan is inferred"
  - "The company is not named in the text. A company limited by guarantee 'based on membership', with two Council seats on its board (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4749 | 'directors, with two seats reserved on the board for the')"

jurisdiction:
  country: United Kingdom
  iso: GB
  eu_member: true
  client_eu_general_government_at_close: true
  as_of: "contract date not given. After the 1999 Affordable Warmth Strategy (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4723 | 'In 1999, Aberdeen City Council adopted an Affordable') and before the 2015 report"
  status: inferred
  why: "Aberdeen, Scotland (contributor line, der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:6250). The UK was an EU member throughout 1999 to 2015 (not in the text), so whatever the closing date, eu_member is true; a city council is local general government"


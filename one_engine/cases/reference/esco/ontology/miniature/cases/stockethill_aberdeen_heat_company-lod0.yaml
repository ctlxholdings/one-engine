rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, client_eu_general_government_at_close: true}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: true
    this_case: "the trigger is met on recorded values (a UK city council, EU member before 2020). The outcome is undetermined: no savings are guaranteed or published, so the test has no left-hand side. The Council also guarantees the company's loan and sits on its board (two seats, der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4749); the company's control and the guarantee would count in a real assessment"
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: false
    this_case: "client_sector public"
    source: RULINGS.md ruling 7; E02 L3293-3295
  company_governance:
    scope: contractual
    rule: "the company is arm's-length and limited by guarantee 'based on membership'; members drawn from the community nominate directors, two board seats reserved for the Council (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4743-4749)"
    applies_here: true
    source: "der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4741-4751"


lod0_gaps:
- kind: fixed_annual_service_fee_has_no_payment_basis
  description: "The Council pays a fixed GBP 219,000 a year for a heat service. payment_basis offers savings, performance (a level that is not savings), supply (per unit) and asset (works). A fixed annual fee tied to no stated level fits supply only loosely and performance only if availability were read into the text. Encoded supply, inferred"
  classification: "encoding question"
- kind: guarantee_link_to_this_loan
  description: "The Council's loan guarantee is stated for the company in general (section 2); its link to the Stockethill loan, its amount and cover are not published"
  classification: "evidence gap"
- kind: payment_split_and_operating_terms
  description: "how the annual payment splits between debt service, operation and fuel, who buys the fuel, and what residents pay are not published"
  classification: "below LOD 0"


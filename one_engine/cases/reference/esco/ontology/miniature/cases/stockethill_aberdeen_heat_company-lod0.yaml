  client_sector:
    value: public
    status: stated
    why: "Aberdeen City Council"
  partner_form:
    value: corporate
    status: inferred
    why: "a standing not-for-profit company 'limited by guarantee' that later took further projects (der-vpp/spec-run/esco-moneyflow/input/unep-district-energy-in-cities-2015.txt:4735-4737); not a vehicle for one deal"

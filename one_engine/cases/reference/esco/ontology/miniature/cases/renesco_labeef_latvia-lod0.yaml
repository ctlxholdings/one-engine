    JRC21: "der-vpp/spec-run/esco-moneyflow/input/jrc-epc-in-the-eu-2020-2021.txt"
    A61_table_A1: "der-vpp/esco-model/sources/gesco-wave2/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.pdf, PDF p.111 (image; not line-checkable)"
    EUKI: "https://www.euki.de/wp-content/uploads/2018/12/Fact-Sheet-LABEEF-Latvian-Energy-Efficiency-Facility-LV.pdf"
    CITY20: "http://citynvest.eu/sites/default/files/library-documents/ES_Model%2020_SUNShINE_final.pdf"
    EBRD17: "https://www.ebrd.com/news/2017/ebrd-supports-innovative-energy-efficiency-in-latvia.html"
    CORDIS: "https://cordis.europa.eu/article/id/422275-innovative-financial-instrument"
    GREENH: "https://www.green-home.org/wp-content/uploads/2022/06/5_GREEN-Home_GP-LABEEF-LV_en.pdf"
  title: "IEA EBC Annex 61 business guide, Appendix A.3 'EPC business models in Latvia's Residential Building Sector' (RenESCO) with Table A-1; EEFIG Underwriting Toolkit Text Box 2.12 (LABEEF)"
  publisher: "IEA EBC Programme Annex 61 (2017); EEFIG (2017, 2022); European Commission JRC (2017, 2019, 2021)"
  passage: "A61 L4207-4340 and L3348-3351; EUT L1777-1802; EE22 L8617-8645; JRC17 L7563-7580, L7619-7626, L7739-7751, L2868-2875; JRC19 L5207-5331, L8042-8046; JRC21 L7008-7043"
  oracle: "none published for this deal; every ratio and split is re-added in numbers.derived"
  context:
  - "Ekodoma and Riga Technical University evaluated the RenESCO model (A61 L4287-4289): an ex post study, no promise in the deal"
  - "ALTUM, the state development finance institution, 'can support the project with grants or guarantees' (JRC17 L7748-7751) and runs a competence centre (JRC19 L5223-5224). No source ties it to RenESCO's grant or to LABEEF: context, not a party"
  - "SUNShINE and Accelerate SUNShINE (H2020, coordinator Riga Technical University) set up LABEEF and standardised the EPC (JRC21 L7025-7038; JRC19 L5217-5223). Research projects with no payment in the deal: context"
  - "The Energy Efficiency Law integrates EPC principles and lets ESCOs take part in multifamily renovation 'using the Latvian Baltic Energy Efficiency Fund' (JRC19 L5220-5223). A rule source, not a party"
  - "ALTUM (web, 4 Oct): EBRD17 says the EU grants for energy efficiency 'are managed by Altum , the state agency for EU grants' and that Altum 'will also provide approvals for those LABEEF investments where EU grants have been previously utilised' (https://www.ebrd.com/news/2017/ebrd-supports-innovative-energy-efficiency-in-latvia.html | which will also provide approvals for those LABEEF investments where EU grants have been previously utilised.). A statutory gate on grant-funded buildings, not a promise in this deal: context. EUKI p.9 adds that the EBRD 'invited ALTUM to participate and channel the EBRD funds to LABEEF'; whether ALTUM did is not stated, so c19 stays EBRD to LABEEF"
  - "Latvian government and LGA (web, 4 Oct): EUKI p.9, the EBRD gave a term sheet to the Latvian Guarantee Agency in 2014 and 'the Latvian government set aside EUR 10 million according to the EBRDs term sheet' in 2015; ALTUM 'approved a EUR 160 million Programme' in 2017 (https://www.euki.de/wp-content/uploads/2018/12/Fact-Sheet-LABEEF-Latvian-Energy-Efficiency-Facility-LV.pdf | the Latvian government set aside EUR 10 million according to the EBRDs term sheet). No source says what the EUR 10m backs or that it reaches LABEEF's deals: context"
  - "ESEB, the Building and Energy Conservation Bureau, helps convince residents and takes their complaints, forwarding them to LABEEF (EUKI p.12); a facilitating NGO with no stated promise in the deal: context"
  notes:
  - "Which ESCO sells to LABEEF: EUT and JRC17 say 'the ESCO' without a name. That it is RenESCO is inferred from A61 L3350 ('The refinancing of RenESCO is provided by the collected and forfeited savings'), EE22 L8638-8640 and JRC17 L2870-2874 (the Latvian ESCO lacking capital)"
  - "Whether the fund exists: A61 L4314-4316 says a forfeiting fund 'has not yet been put in place'; EUT L1797-1798, JRC17 L7745-7747 and JRC21 L7011-7013 describe LABEEF established, funded by EBRD and buying a first 6 buildings in April 2017. The A61 case text predates the fund; the assignment is written as stated"
  - "EBRD date and form: EUT L1797-1798 a 'EUR 4 million funding agreement with EBRD' signed in February 2017; JRC17 L7745-7746 'a loan signed with EBRD in December 2016'. Two dates, not reconciled; read as one loan to LABEEF with the EUT amount"
  - "Funding: A61 L4241-4245 gives 60% from savings financed by RenESCO and 40% from the ERDF-funded national renovation programme, RenESCO's share being 60% bank debt and 40% own equity; A61 L4270 also says 'RenESCO financed 100% of the cost' (read as RenESCO advancing the whole cost); JRC17 L7566-7567 says 'EU Structural Funds and Green Investments Scheme benefits were used' (a second public source, amount not given); A61 L3350-3351 adds 'soft loan programs of the EU'. Kept as printed, not reconciled"
  - "Fund name: EUT L1777-1779 'Latvian Building Energy Efficiency Fund'; JRC17 L7745, JRC21 L7012 and JRC19 L5223 use 'Latvian Baltic Energy Efficiency Facility' / 'Latvian Building Energy Efficiency Facility' / 'Latvian Baltic Energy Efficiency Fund'. Same acronym; legal form not stated"
  - "Latvian market context is not a deal figure: kept in numbers.latvian_market_context only"
  - "Web sources, 4 Oct (conflicts flagged, none reconciled by guessing):"
  - "CONFLICT 1, the owners' payment. EUKI p.7: owners agree to 'fixed increased energy payments over a timeframe of approximately 18 years, which are about 15% higher than the original energy bill'; EBRD17: 'residents will not have to pay extra'; CITY20: 'el propietario de la vivienda sigue pagando lo mismo'; EUT L1786-1787 and JRC17 L7570-7571 agree with EBRD17 and CITY20. Chosen as a flagged default: the bill stays the same (numbers.owner_payment_pct_of_pre_renovation_bill = 100), because four sources say so and CITY20, EUT and JRC17 describe RenESCO's own programme, while EUKI describes LABEEF's standardised EPC of 2018. Flip to 115 and an 18-year payment term to run EUKI's version"
  - "CONFLICT 2, RenESCO's second 40%. A61 L4243-4245: 60% Latvian bank debt and 40% RenESCO 'own equity capital'; CITY20 p.2: 60% local commercial banks and 40% 'un crédito garantizado por terceros' from 'el Instituto Holandés de la Vivienda', guaranteed by 'la Corporación Holandesa de la Vivienda'. The 60% bank share agrees. Both kept: the Dutch credit is written as parties dutch_housing_institute and dutch_housing_guarantor with c26-c28 (stated, CITY20), and the engine books A61's equity as a flagged default (the Dutch credit is not booked). One reading reconciles them (RenESCO's equity funded by the Dutch credit), but no source says so"
  - "CONFLICT 3, the first EPC year: 2008 (JRC17 L7564-7565) vs 'Fecha de creación 2009 (RenEsco)' (CITY20 p.6) and EPC in Latvia 'since around 2009' (EUKI p.6). Not reconciled; numbers.renesco_first_epc_year keeps both"
  - "CONFLICT 4, who signs the EPC: EUKI p.7 says 'LABEEF enters into a standardised EPC agreement with the building's parties'; EUT L1782, A61 L4236-4239 and CITY20 p.2 ('La ESE firma un contrato CRE de 20 años con la Asociación de Propietarios de Viviendas') say the ESCO signs. Kept: the ESCO signs (contract epc); EUKI's sentence is read as LABEEF's standard form and its later purchase (c15)"
  - "CONFLICT 5, public or private fund: CITY20 p.4 'Tipo de fondo Fondo público' vs GREENH 'LABEEF did not receive any funding apart from the banks and private investors financing the investment fund' and EUKI (EBRD loan, F3 shareholder, '100% private funding by 2025' as a goal). Not reconciled; no setting depends on it"
  - "Resolved by CORDIS: the ESCO that sold to LABEEF is RenESCO: 'LABEEF has for instance forfeited a portfolio of six buildings from project partner RenEsco' (https://cordis.europa.eu/article/id/422275-innovative-financial-instrument | LABEEF has for instance forfeited a portfolio of six buildings from project partner RenEsco.). The earlier inference (A61 L3350) now rests on a stated sentence; GREENH also prints six buildings funded"
  - "LABEEF founded 2016 (EUKI p.1 'The company was founded in 2016') vs GREENH 'Started in 2014, ongoing' (the initiative). Different events, no conflict for the deal"

jurisdiction:
  country: Latvia
  iso: LV
  eu_member: true
  client_eu_general_government_at_close: false
  as_of: "financial close of the representative EPC not stated; RenESCO's EPCs from 2008 (JRC17 L7564-7565); LABEEF loan December 2016 / February 2017, first sale April 2017 (JRC17 L7745-7747; EUT L1797-1798)"
  status: inferred
  why: "Latvia is an EU member state (JRC17 chapter 8.16 among the EU markets). The clients are private flat owners ('owner occupied', A61 L4224-4225), outside general government, so C1 does not apply"

core_v7:
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: each contract establishes (fibo-fnd-rel-rel:confers) its commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:
  home_owners:
    role: [host, occupant]
    groups: [demand]
    status: stated
    name: Flat owners of a Soviet-era apartment block, through their Home Owner Association (representative client)
    text: "'an ESCO signs a 20 year contract with the Home Owner Association' (EUT L1782); 'The flat owners are obliged to pay the energy cost savings to RenESCO' (A61 L4238-4239). Private owners, so host; they live in the flats and receive the comfort guarantee (A61 L4256), so occupant second. Whether the association or each owner is the legal contract party is not stated: one party"
  renesco:
    entity: renesco
    role: partner_esco
    groups: [partner]
    status: stated
    name: RenESCO (SIA Renesco)
    text: "'RenESCO is a residential private ESCO and a social enterprise' (A61 L4230); 'The energy service company SIA Renesco' (JRC19 L5212; JRC17 L7601). Responsible for 'planning, implementation, funding, operation, maintenance, and M&V' (A61 L4240)"
  house_maintenance_company:
    role: collector_biller
    groups: [collection]
    status: stated
    name: House Maintenance Company of the block
    text: "bills the owners 'the same amount as before the renovation works', pays the ESCO 'a percentage of those bills' and 'pays the reduced energy bill to the heat providers' (EUT L1786-1789); after the sale the cash flows go 'via the House Maintenance Company, to LABEEF' (EUT L1793). Not a utility and not the payee"
  heat_providers:
    role: utility_supplier
    groups: [energy, collection]
    status: stated
    name: Heat providers (district heating suppliers of the block)
    text: "paid 'the reduced energy bill' by the House Maintenance Company (EUT L1789). They collect for nobody in this deal, so utility_supplier only"
  latvian_bank:
    role: lender
    groups: [capital]
    status: stated
    name: Latvian bank lending to RenESCO
    text: "'Sixty percent of RenESCO's share of the investment currently consists of debt-financing from a Latvian bank' (A61 L4243-4244); 'the ESCO takes on a loan from a financial institution' (EUT L1783)"
  erdf_programme:
    role: eu_funds
    groups: [public, capital]
    status: stated
    name: ERDF-funded national renovation programme
    text: "'40% comes from the ERDF-funded national renovation program' (A61 L4242). ERDF money under a national programme is eu_funds (convention F03). JRC17 L7620-7622 names the 2009-2015 ERDF programme 'Improvement of heat insulation of multi-dwellings buildings'; that it is the one used here is not stated"
  labeef:
    entity: labeef
    role: forfaiter
    groups: [capital]
    status: stated
    name: LABEEF
    text: "'LABEEF has been established to purchase the cash flows from Energy Performance Contracts' (EUT L1779-1780); 'designed to be a EUR 30 million fund' (EUT L1797). No notes are issued, so forfaiter; no manager is named, so no fund_manager party"
  ebrd:
    entity: ebrd
    role: ifi_dfi
    groups: [public, capital]
    status: stated
    name: European Bank for Reconstruction and Development
    text: "'EUR 4 million funding agreement with EBRD' (EUT L1798); 'a loan signed with EBRD in December 2016' (JRC17 L7745-7746). The money goes to LABEEF. A multilateral bank: ifi_dfi (ENCODING.md)"
  subcontractors:
    role: [epc_contractor, equipment_supplier]
    groups: [delivery, capital]
    status: stated
    name: Construction companies and equipment providers
    text: "'the ESCO renovates the building ... while sub-contracting to construction companies and equipment providers' (EUT L1784-1785). Bundled; two roles because the source names both functions"
  agent_bank:
    role: account_bank_trustee
    groups: [collection]
    status: stated
    name: Agent bank between the management companies and LABEEF (unnamed)
    text: "'The apartment building management companies collect the EPC receivables from the building’s residents and transfers them to an agent bank' and 'The agent bank is interposed to increase securities for investment institutions such as the EBRD' (EUKI p.8). A bank holding the collections for the creditors: account_bank_trustee with an agency promise (ENCODING P09, two-stage collection). CITY20 p.3 'Un fiduciario se encarga de garantizar la transparencia de las transacciones' is read as the same party (inferred). Case-local: not named"
  f3:
    entity: funding_for_future
    role: equity_investor
    groups: [capital]
    status: stated
    name: Funding For Future BV (F3)
    text: "'the Dutch company Funding For Future (F3) will invest €1 million to become a shareholder in LABEEF' (EBRD17); 'The company Funding for future (F3) acts as a shareholder for LABEEF' (EUKI p.8); 'FUNDING FOR FUTURE BV' among the SUNShINE partners (CITY20 p.4). Owns the vehicle that buys the receivables: equity_investor (ENCODING T22)"
  dutch_housing_institute:
    role: lender
    groups: [capital]
    status: stated
    name: Dutch housing institute lending to RenESCO ('Instituto Holandés de la Vivienda')
    text: "RenESCO was financed by local banks (60%) and 'de un crédito garantizado por terceros (40 %) del Instituto Holandés de la Vivienda' (CITY20 p.2). A second lender to RenESCO beside latvian_bank. Named only by a Spanish rendering; its Dutch legal name is not printed, so case-local. Conflicts with A61's 40% own equity (source.notes CONFLICT 2)"
  dutch_housing_guarantor:
    role: surety_guarantor
    groups: [risk]
    status: stated
    name: Dutch housing corporation guaranteeing the credit ('Corporación Holandesa de la Vivienda')
    text: "the credit is '(garantizado por la Corporación Holandesa de la Vivienda), en función de los flujos de caja del proyecto' (CITY20 p.2). A third party guaranteeing the Partner's debt: surety_guarantor. Named only by a Spanish rendering: case-local"

contract:
  epc:
    core: contract
    parties: [home_owners, renesco]
    status: stated
    note: "'an ESCO signs a 20 year contract with the Home Owner Association' (EUT L1782); 'the EPC period (20 years)' (A61 L4239). Binding and settled by default (ruling 17). JRC21 L7014 gives 15-20 years for SUNShINE contracts"
  house_maintenance:
    core: contract
    parties: [home_owners, house_maintenance_company]
    status: inferred
    note: "the company 'maintains the housing block' and bills the owners (EUT L1786); A61 L4299-4300 names 'the heating and maintenance bills'. The contract itself is not described"
  collection_arrangement:
    core: contract
    parties: [house_maintenance_company, renesco, labeef]
    status: inferred
    note: "the company pays the ESCO its percentage (EUT L1787) and after the sale passes the cash flows to LABEEF (EUT L1793). Its parties, terms and fee are not described; inferred from the flow"
  heat_supply:
    core: contract
    parties: [house_maintenance_company, heat_providers]
    status: inferred
    note: "'pays the reduced energy bill to the heat providers' (EUT L1789); the supply contract is not described"
  bank_loan:
    core: contract
    parties: [latvian_bank, renesco]
    status: stated
    note: "'The bank financing is based solely on the EPC contract. No other collateral is used' (A61 L4244-4245); amount and tenor not given; cost of capital '~7%' (A61 L4314)"
  grant_agreement:
    core: contract
    parties: [erdf_programme, home_owners]
    status: inferred
    note: "A61 L4242 gives the 40% share, not the recipient. Owners inferred: 2007-2013 programmes 'excluded third parties such as ESCO as borrower or grant receiver' (A61 L4326) and owners 'should have access to public grants' if they engage an ESCO (A61 L4331-4332). Alternative: grant to RenESCO"
  assignment_agreement:
    core: contract
    parties: [renesco, labeef]
    status: stated
    note: "'once the project is implemented and savings are proved, an Assignment agreement is signed between the ESCO and LABEEF' (EUT L1790-1791); the owners' acknowledgement is not described"
  ebrd_funding:
    core: contract
    parties: [ebrd, labeef]
    status: stated
    note: "EUR 4 million funding agreement, February 2017 (EUT L1797-1798); loan signed December 2016 (JRC17 L7745-7746); terms not given"
  subcontracts:
    core: contract
    parties: [renesco, subcontractors]
    status: stated
    note: "'sub-contracting to construction companies and equipment providers' (EUT L1784-1785); terms not given"
  agent_bank_arrangement:
    core: contract
    parties: [agent_bank, labeef, ebrd]
    status: inferred
    note: "the agent bank receives the receivables and transfers them to LABEEF, interposed 'to increase securities for investment institutions such as the EBRD' (EUKI p.8). The account or agency agreement itself is not described; parties inferred from the flow"
  f3_shareholding:
    core: contract
    parties: [f3, labeef]
    status: stated
    note: "F3 'will invest €1 million to become a shareholder in LABEEF' (EBRD17); 'acts as a shareholder' (EUKI p.8). Share terms not given"
  dutch_credit:
    core: contract
    parties: [dutch_housing_institute, renesco]
    status: stated
    note: "'un crédito garantizado por terceros (40 %)' based on the project cash flows, 'No se preveían otras garantías' (CITY20 p.2). Amount, rate and tenor not given"
  dutch_guarantee:
    core: contract
    parties: [dutch_housing_guarantor, dutch_housing_institute]
    status: stated
    note: "the credit is 'garantizado por la Corporación Holandesa de la Vivienda' (CITY20 p.2); form and fee not given"
  labeef_takeout:
    core: contract
    parties: [labeef, latvian_bank, renesco]
    status: inferred
    note: "'The agreement with the bank is supported by LABEEF, which guarantees to assume the financing risks after the measures are completed, monitored and verified' (EUKI p.7). Whether this is a separate document or a clause of the bank loan is not stated"

commitments:
  c1:
    family: performance_promise
    from: renesco
    to: home_owners
    status: stated
    what: "takes over 'the whole conservation and modernization process' and 'responsibility for operation and maintenance for 20 years' (A61 L4236-4238); envelope insulation (TICS, 10 cm average), new hot-water and heating networks, ventilation with 90% heat recovery (A61 L4272-4283); 'a temperature level of 21.5 °C' (L4256); 'a 20-year guarantee on all construction' (L4259); energy-saving guarantees (L4288). Shortfall make-good stays inside this promise (G18)"
    established_by: epc
  c2:
    family: payment_promise
    from: home_owners
    to: renesco
    status: stated
    depends_on_savings: true   # a percentage of the bills based on the realised savings (EUT L1787-1788)
    what: "'The flat owners are obliged to pay the energy cost savings to RenESCO during the EPC period (20 years)' (A61 L4238-4239); in the billing flow the company pays the ESCO 'a percentage of those bills, based on the realized savings' (EUT L1787-1788); the heating payment 'has remained unchanged' (JRC17 L7570-7571). The percentage is not published. Web, 4 Oct: CITY20 p.2 'el propietario de la vivienda sigue pagando lo mismo' and EBRD17 'residents will not have to pay extra' agree; EUKI p.7 says about 15% above the original bill for about 18 years (source.notes CONFLICT 1; same bill kept as the flagged default)"
    established_by: epc
  c3:
    family: determination_promise
    from: renesco
    to: [home_owners, labeef]
    status: stated
    determines: savings   # M&V of savings (A61 L4240; EUT L1790)
    what: "RenESCO is responsible for 'M&V' (A61 L4240); the assignment needs savings 'proved' (EUT L1790). No independent verifier is named, so the performing party determines (P21). Expected and performed savings 'within a 2-5% range of error' (A61 L4307-4308)"
    established_by: epc
  c4:
    family: payment_promise
    from: home_owners
    to: renesco
    status: inferred
    what: "the 40% grant reaches the funder of the works: owners 'incur no additional refurbishment costs' (A61 L4258) and 'RenESCO financed 100% of the cost' (A61 L4270). Same shape as ctu_prague c3. Alternative: the grant is paid to RenESCO directly (grant_recipient partner, c4 then drops)"
    established_by: epc
  c5:
    family: payment_promise
    from: renesco
    to: home_owners
    status: stated
    what: "'a 25% profit share of RenESCO's net result' offered to the owners as an incentive 'to keep the energy consumption as low as possible' (A61 L4263-4265)"
    established_by: epc
  c6:
    family: payment_promise
    from: home_owners
    to: house_maintenance_company
    status: inferred
    what: "the heating and maintenance bill, billed at 'the same amount as before the renovation works' (EUT L1786-1787); A61 L4299-4300 'the heating and maintenance bills'. The owners' obligation follows from the company billing them"
    established_by: house_maintenance
  c7:
    family: performance_promise
    from: house_maintenance_company
    to: home_owners
    status: stated
    what: "maintains the housing block (EUT L1786) and buys its heat, paying the reduced energy bill (EUT L1789)"
    established_by: house_maintenance
  c8:
    family: agency_promise
    from: house_maintenance_company
    to: [renesco, labeef]
    status: stated
    what: "collects the owners' payments, pays the ESCO its percentage (EUT L1786-1788) and, after the sale, passes the cash flows to LABEEF (EUT L1793). Its fee, if any, is not stated. EUKI p.8 adds a step: the management companies 'collect the EPC receivables from the building’s residents and transfers them to an agent bank' (c23)"
    established_by: collection_arrangement
  c9:
    family: payment_promise
    from: house_maintenance_company
    to: heat_providers
    status: stated
    what: "'pays the reduced energy bill to the heat providers' (EUT L1789)"
    established_by: heat_supply
  c10:
    family: performance_promise
    from: heat_providers
    to: house_maintenance_company
    status: inferred
    what: "heat to the block, 'typically city heating' (A61 L4285); the counter-performance to c9, not described as a promise"
    established_by: heat_supply
  c11:
    family: funding_promise
    from: latvian_bank
    to: renesco
    status: stated
    funding_instrument: loan   # bank debt (A61 L4243-4244)
    what: "debt for 60% of RenESCO's share of the investment (A61 L4243-4244), 'based solely on the EPC contract' (A61 L4244-4245); the contracts 'bankable by a local financier' (A61 L4288-4289). Amount not published"
    established_by: bank_loan
  c12:
    family: payment_promise
    from: renesco
    to: latvian_bank
    status: inferred
    what: "repayment with interest (a loan is repayable); RenESCO's 'cost of capital is still much too high (~7%)' (A61 L4313-4314), 7-10% in Table A-1 (PDF p.111). Whether the LABEEF price repays it is not stated (LOD 1). EUKI p.7: 'Through forfeiting, the payment risk as well as the ESCO’s debt are transferred to LABEEF instead of banks' (and c30): the debt leaves the bank at the sale; how (prepayment or transfer) is LOD 1"
    established_by: bank_loan
  c13:
    family: benefit_promise
    from: erdf_programme
    to: home_owners
    status: inferred
    what: "'40% comes from the ERDF-funded national renovation program' (A61 L4242); recipient inferred (see grant_agreement). Non-repayable, so no payment back"
    established_by: grant_agreement
  c14:
    family: performance_promise
    from: renesco
    to: labeef
    status: stated
    what: "assigns the future receivables once savings are proved (EUT L1790-1791); 'the ESCO has forfaited the cash flows from 6 buildings' (JRC17 L7746-7747). Web, 4 Oct: a share, 80%: 'LABEEF therefore forfeits an 80% share of the ESCOs future contracting rates' (EUKI p.2); CORDIS names the seller, 'six buildings from project partner RenEsco'"
    established_by: assignment_agreement
  c15:
    family: funding_promise
    from: labeef
    to: renesco
    status: stated
    funding_instrument: receivable_purchase   # discounted cash flow for the future receivables (EUT L1791-1792)
    what: "'The ESCO received discounted cash flow for the future receivables, minus an amount for Operations and Maintenance and a performance guarantee' (EUT L1791-1792). Price and discount rate not published. Web, 4 Oct: 80% of the contracting rates (EUKI p.2); bought after completion, 'approximately 1.5–2 years' (EUKI p.2; CITY20 p.2 'después de 1 o 2 años'), once savings are verified over 'a winter season' (EUKI p.7); forfaiting 'on a non-recourse basis' (EUKI p.7); CITY20 p.3 repeats the holdbacks ('una vez deducidos los gastos de operaciones y mantenimiento (O&M) y la garantía')"
    established_by: assignment_agreement
  c16:
    family: payment_promise
    from: home_owners
    to: labeef
    status: inferred
    what: "the ceded cash flows run 'from the homeowners, via the House Maintenance Company, to LABEEF' (EUT L1793): c2's money after the transfer, not a second payment"
    established_by: [epc, assignment_agreement]
  c17:
    family: performance_promise
    from: renesco
    to: labeef
    status: stated
    what: "keeps operating and maintaining against LABEEF's continuing payments (EUT L1793-1794) and stands behind the savings with 'a performance guarantee' held back from the price (EUT L1792). Make-good stays inside this promise (G18)"
    established_by: assignment_agreement
  c18:
    family: payment_promise
    from: labeef
    to: renesco
    status: stated
    what: "LABEEF 'keeps paying the ESCO for Operations & Maintenance' (EUT L1793-1794), out of the amount held back in c15; amount and schedule not published"
    established_by: assignment_agreement
  c19:
    family: funding_promise
    from: ebrd
    to: labeef
    status: stated
    funding_instrument: loan   # EBRD loan (JRC17 L7745-7746)
    what: "EUR 4 million funding agreement (EUT L1797-1798); 'a loan signed with EBRD in December 2016' (JRC17 L7745-7746), towards a fund 'designed to be a EUR 30 million fund' (EUT L1797)"
    established_by: ebrd_funding
  c20:
    family: payment_promise
    from: labeef
    to: ebrd
    status: inferred
    what: "repayment of the loan (JRC17 L7745 'a loan'); terms not given"
    established_by: ebrd_funding
  c21:
    family: performance_promise
    from: subcontractors
    to: renesco
    status: stated
    what: "construction and equipment supply for the renovation (EUT L1784-1785)"
    established_by: subcontracts
  c22:
    family: payment_promise
    from: renesco
    to: subcontractors
    status: inferred
    what: "price of the works and equipment; a subcontract is paid. Amount not published"
    established_by: subcontracts
  # c23-c30 added 4 Oct 2026 from the web sources (header; source.documents)
  c23:
    family: agency_promise
    from: agent_bank
    to: [labeef, ebrd]
    status: stated
    what: "receives the EPC receivables the management companies collect and 'then transfers the receivables to LABEEF' (EUKI p.8); 'interposed to increase securities for investment institutions such as the EBRD' (EUKI p.8), hence EBRD as a second beneficiary. CITY20 p.3: a trustee ensures 'la transparencia de las transacciones'"
    established_by: agent_bank_arrangement
  c24:
    family: funding_promise
    from: f3
    to: labeef
    status: stated
    funding_instrument: equity   # 'invest €1 million to become a shareholder' (EBRD17)
    what: "EUR 1 million of equity: 'the Dutch company Funding For Future (F3) will invest €1 million to become a shareholder in LABEEF' (EBRD17), 'In parallel' with the EBRD loan"
    established_by: f3_shareholding
  c25:
    family: payment_promise
    from: labeef
    to: f3
    status: inferred
    what: "residual claim of the shareholder (ENCODING: equity carries an inferred residual-claim payment back); LABEEF repays its loans, transfers 20% to the ESCO 'and retain a low margin' (EUKI p.8). Amount not published"
    established_by: f3_shareholding
  c26:
    family: funding_promise
    from: dutch_housing_institute
    to: renesco
    status: stated
    funding_instrument: loan   # 'un crédito garantizado por terceros' (CITY20 p.2)
    what: "40% of RenESCO's financing as 'un crédito garantizado por terceros (40 %) del Instituto Holandés de la Vivienda', 'en función de los flujos de caja del proyecto' (CITY20 p.2). Conflicts with A61's 40% own equity (source.notes CONFLICT 2); not booked by the engine"
    established_by: dutch_credit
  c27:
    family: payment_promise
    from: renesco
    to: dutch_housing_institute
    status: inferred
    what: "repayment of the credit (a credit is repayable); terms not given"
    established_by: dutch_credit
  c28:
    family: risk_promise
    from: dutch_housing_guarantor
    to: dutch_housing_institute
    status: stated
    covers: [R5b]   # guarantees RenESCO's credit: the lender's exposure to the Partner
    cover_kind: guarantee   # 'garantizado por la Corporación Holandesa de la Vivienda' (CITY20 p.2)
    what: "guarantees the credit to RenESCO: 'garantizado por la Corporación Holandesa de la Vivienda' (CITY20 p.2). Amount and trigger not given"
    established_by: dutch_guarantee
  c29:
    family: payment_promise
    from: labeef
    to: renesco
    status: stated
    what: "LABEEF receives the receivables and uses them 'to repay its loans, transfer 20% to the ESCO, and retain a low margin' (EUKI p.8): the 20% of the contracting rates LABEEF does not buy (80% bought, EUKI p.2). Whether this 20% is the same money as EUT's O&M payments (c18) is not stated; kept separate"
    established_by: assignment_agreement
  c30:
    family: risk_promise
    from: labeef
    to: latvian_bank
    status: stated
    covers: [R7, R5b]   # R7 refinancing: the bank is taken out once the works are verified; R5b: after the take-out the bank no longer depends on RenESCO's credit ('the ESCO’s debt are transferred to LABEEF', EUKI p.7)
    what: "LABEEF supports the ESCO's bank agreement and 'guarantees to assume the financing risks after the measures are completed, monitored and verified' (EUKI p.7); 'Through forfeiting, the payment risk as well as the ESCO’s debt are transferred to LABEEF instead of banks' (EUKI p.7). A take-out commitment, put-like (ENCODING M28); cover_kind left unstated (not one of the listed forms)"
    established_by: labeef_takeout
  c31:
    family: payment_promise
    from: labeef
    to: agent_bank
    status: unstated
    what: "counter-promise required by duality; source silent (the agent bank's fee is not stated)"
  c32:
    family: payment_promise
    from: unstated
    to: dutch_housing_guarantor
    status: unstated
    what: "counter-promise required by duality; source silent (who pays the guarantee fee, if any, is not stated)"

settings:
  payment_basis:
    value: savings
    status: stated
    why: "'The flat owners are obliged to pay the energy cost savings to RenESCO' (A61 L4238-4239); the ESCO is paid 'a percentage of those bills, based on the realized savings' (EUT L1787-1788)"
  client_sector:
    value: private
    status: inferred
    why: "privately owned, owner-occupied flats (A61 L4224-4225); a Home Owner Association is not a public body in any source"
  partner_form:
    value: corporate
    status: inferred
    why: "'a residential private ESCO and a social enterprise' (A61 L4230) with EPCs since 2008 and 15 blocks (JRC17 L7564-7566): a standing company, not a deal vehicle"
  borrower:
    value: [partner, vehicle]
    status: stated
    why: "two loans in one deal (ruling OI-7): RenESCO's bank loan, 'debt-financing from a Latvian bank' (A61 L4243-4244; EUT L1783), and LABEEF's 'loan signed with EBRD in December 2016' (JRC17 L7745-7746). vehicle = a fund that is not the Partner (elements.yaml); the converter maps it to LABEEF's role, forfaiter"
  receivable_holder:
    value: split
    status: stated
    why: "changed 4 Oct from assignee: EUKI prints the split. 'LABEEF therefore forfeits an 80% share of the ESCOs future contracting rates' (EUKI p.2) and LABEEF passes '20% to the ESCO' (EUKI p.8): 80% to the assignee, 20% kept by RenESCO, the setting's split value. Before: 'an Assignment agreement is signed between the ESCO and LABEEF' (EUT L1790-1791) and 'the ESCO has forfaited the cash flows from 6 buildings' (JRC17 L7746-7747) read as the whole stream. collection_placement records the assigned leg (definition). Back to assignee only if a source shows LABEEF buying 100%"
  collection_placement:
    value: on_bill
    status: inferred
    why: "the owners pay on the House Maintenance Company's bill ('bills the same amount as before', EUT L1786), which carries the heat charges, and the money moves on 'via the House Maintenance Company, to LABEEF' (EUT L1793). Not a utility bill (see lod0_gaps). Alternative assignee_direct, the fallback when receivables are assigned. Web, 4 Oct: EUKI p.8 adds an agent bank between the management companies and LABEEF; per ENCODING (two-stage collection) the setting records the bill and the agent bank is a rule entry plus its agency promise c23. CITY20 p.6 lists 'Recurso Cobros pignorados' (pledged collections)"
  aggregation:
    value: pool
    status: inferred
    why: "one fund buys the cash flows of several owners' EPCs: 'purchase the cash flows from Energy Performance Contracts' (EUT L1779-1780), first sale 'cash flows from 6 buildings' (JRC17 L7746-7747). Each EPC alone would be none"
  debt_seniority:
    value: senior
    status: default
    why: "no rank stated for the bank loan or the EBRD loan"
  assignment_recourse:
    value: performance_exposed
    status: inferred
    why: "the ESCO is paid the discounted flow 'minus an amount for Operations and Maintenance and a performance guarantee' (EUT L1791-1792): the assignee holds back money against the ESCO's performance, ENCODING.md's case for performance_exposed. Alternative waiver, the generic forfeiting form in A61 L3109-3112, if the owners waive defences (not described). Web, 4 Oct: EUKI p.7 calls the purchase forfaiting 'on a non-recourse basis' (no recourse to the ESCO for the owners' credit, a different question) and has LABEEF verify the savings over a winter before it buys: consistent with performance_exposed"
  savings_basis:
    value: measured
    status: inferred
    why: "RenESCO does 'M&V' (A61 L4240); payment follows 'the realized savings' (EUT L1787-1788) and savings are 'proved' before the sale (EUT L1790); 'expected and performed savings' are compared (A61 L4307)"
  grant_recipient:
    value: client
    status: inferred
    why: "40% ERDF money (A61 L4242), recipient not stated; programmes 'excluded third parties such as ESCO as borrower or grant receiver' (A61 L4326) and owners 'should have access to public grants' when they engage an ESCO (A61 L4331-4332). Alternative partner"
  asset_owner:
    value: client
    status: default
    why: "title not stated; the building belongs to the owners (A61 L4224-4225) and the fund buys cash flows, not assets. JRC19 L5323-5324: title to installed equipment is legally ambiguous in Latvia"
  bill_custody:
    value: client
    status: inferred
    why: "the House Maintenance Company, acting for the owners, 'pays the reduced energy bill to the heat providers' (EUT L1789); the ESCO does not pay the energy bill"

rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU general government at close}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: false
    this_case: "Latvia is an EU member but the clients are private owners (client_sector private). The 40% ERDF grant would count as government financing only for a public client"
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: false
    this_case: "asset_owner is client by default, so the trigger is not met; if RenESCO held title during the 20 years the owners' payments would need the test"
    source: RULINGS.md ruling 7; E02 L3293-3295
  assignment_after_proof:
    scope: contractual
    rule: "the assignment is signed only 'once the project is implemented and savings are proved' (EUT L1790); the price is the discounted cash flow minus an O&M amount and a performance guarantee (EUT L1791-1792)"
    applies_here: true
    this_case: "stated for LABEEF; before the sale RenESCO carries the project on its bank loan and equity"
    source: EUT L1790-1792
  bank_security_epc_only:
    scope: contractual
    rule: "the bank financing 'is based solely on the EPC contract. No other collateral is used' (A61 L4244-4245)"
    applies_here: true
    source: A61 L4244-4245
  owner_payment_incentive:
    scope: external-sectoral
    rule: "payment is tied to ownership: 'Poor owners have a strong incentive to pay their utility bills because they will otherwise be forced to sell their renovated flats' (A61 L4300-4301)"
    applies_here: true
    this_case: "a credit mitigant for R5a reported from RenESCO's record (97% on time, 0% non-payment over 6 years, A61 L4298-4299); no contract clause is given"
    source: A61 L4294-4302; JRC17 L7578-7579
  agent_bank_collection:
    scope: contractual
    rule: "after the sale the receivables run management company -> agent bank -> LABEEF; LABEEF repays its loans, transfers 20% to the ESCO and keeps a low margin (EUKI p.8)"
    applies_here: true
    this_case: "the second stage of a two-stage collection (ENCODING: collection_placement keeps on_bill; the escrow-like stage is this rule plus the agent bank's agency promise c23). The order of LABEEF's three uses is as printed; whether it is a ranked waterfall is not stated (LOD 2)"
    source: "https://www.euki.de/wp-content/uploads/2018/12/Fact-Sheet-LABEEF-Latvian-Energy-Efficiency-Facility-LV.pdf | LABEEF, which uses them to repay its loans, transfer 20% to the ESCO, and retain a low margin"
  purchase_after_winter_verification:
    scope: contractual
    rule: "LABEEF buys only after the works are completed (about 1.5-2 years) and the guaranteed savings are verified through one winter (EUKI p.2, p.7); CITY20 p.2: after savings are shown, usually 1 or 2 years"
    applies_here: true
    this_case: "sharpens assignment_after_proof (EUT L1790): the proof is one heating season of M&V. Dates are LOD 1"
    source: "https://www.euki.de/wp-content/uploads/2018/12/Fact-Sheet-LABEEF-Latvian-Energy-Efficiency-Facility-LV.pdf | The monitoring and verification process is initiated once the measures are completed and lasts through a winter season."

numbers:
  # Every figure the sources print for this deal, with its line. Derived figures only under `derived`.
  epc_term_years: "20 (EUT L1782; A61 L4239); SUNShINE contracts 15-20 (JRC21 L7014); multi-family EnPC projects 'can take up to 20 years' (JRC19 L5280-5281)"
  renesco_blocks: "15 typical Soviet-era apartment buildings 'Within 5 years' (A61 L4270-4271); 'at least 15 projects' (JRC19 L5212-5213); 'more than 15 multi-apartment buildings' (JRC17 L7565-7566); 'invested over €4m in 15 Soviet-era blocks' (EE22 L8638)"
  renesco_first_epc_year: "2008 (JRC17 L7564-7565); '6 years of operation' at the time of A61's payment record (A61 L4298-4299)"
  funding_split_pct_of_project: "roughly 60 from the energy cost savings financed by RenESCO, 40 from the ERDF-funded national renovation programme (A61 L4241-4242); RenESCO 'financed 100% of the cost' (A61 L4270)"
  renesco_share_split_pct: "60 bank debt from a Latvian bank, 40 RenESCO own equity (A61 L4243-4245)"
  renesco_cost_of_capital_pct: "~7 (A61 L4314); 7-10 (A61 Table A-1, PDF p.111)"
  interest_vs_subsidy: "'1% lower interest over 20 years = 9% investment subsidy' (A61 Table A-1, PDF p.111)"
  programme_transaction_cost: "support-programme transaction costs consume at least 70% of RenESCO staff time and add 10-15% to total project costs (A61 Table A-1, PDF p.111)"
  programme_lead_times_years: "1-2 to develop projects, 3-5 to develop capable organisations (A61 Table A-1, PDF p.111)"
  owner_payment_record_pct: "97 on time, 0 non-payment over 6 years (A61 L4298-4299); 'In 97% cases the apartment owners fulfil their financial obligation on time' (JRC17 L7578-7579)"
  savings_accuracy_pct: "expected vs performed savings within 2-5 error, constant over time (A61 L4307-4308; Table A-1 'usually within 2-5% margin of error')"
  energy_savings_pct: "45 to 65 typical (EUT L1784); owners' savings estimated 50-80 (A61 L4261-4262); typical Latvian EnPC 50 to 70 (JRC19 L5281-5282); SUNShINE 30-60 secured (JRC21 L7018); energy costs expected to drop 50 after the contracts (JRC17 L7576-7577)"
  specific_consumption_kwh_m2_year: "from 200-240 to 70-80 for heating and hot water (JRC17 L7573-7575)"
  renovation_cost_to_owners_eur_m2: "150 on average, '1/7 of the price of new buildings' (JRC17 L7572-7573)"
  market_value_uplift_pct: "20-40 (A61 L4253-4254); 10-20 (JRC17 L7577-7578)"
  heat_payment_level: "unchanged after renovation (JRC17 L7570-7571); billed 'the same amount as before the renovation works' (EUT L1786-1787)"

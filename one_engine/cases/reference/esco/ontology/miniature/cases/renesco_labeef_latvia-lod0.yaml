# Miniature: RenESCO energy performance contract for Soviet-era apartment blocks in Latvia, refinanced by the LABEEF forfaiting fund, at ESCO LOD 0.
# Batch 8, group N, deal T16: reviewer's reconciled file (3 Oct 2026) from blind drafts X and Y. Method: REVIEW_SPEC_7 / CASE_SPEC_7.
# This is the owner's chosen replication deal for LOD 1: every published figure is kept in `numbers` with its line.
#
# Evidence: six local texts under der-vpp/spec-run/esco-moneyflow/input/ (none is under input-licensed/), cited <short name> L<line>,
# line numbers as grep -n counts them; quotes <= 25 words.
#   A61   iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt   (Appendix A.3 on RenESCO, L4207-4340; Table A-1 caption L4319; L3348-3351; forfeiting L3100-3116)
#   EUT   eefig-underwriting-toolkit-2017.txt                            (Text Box 2.12 'The Latvian Building Energy Efficiency Fund', L1777-1802)
#   EE22  eefig-report-on-the-evolution-of-financing-practices-for-energy-effici-2022.txt (sheet D.14 'Factoring funds for EPC', L8617-8645)
#   JRC17 jrc-energy-service-companies-in-the-eu-2017.txt                (Latvia 8.16, L7563-7580, L7601, L7619-7626, L7739-7751; forfeiting fund L2868-2875)
#   JRC19 jrc-energy-service-market-eu-2019.txt                          (Latvia 4.16, L5207-5331; Sunshine L8042-8046)
#   JRC21 jrc-epc-in-the-eu-2020-2021.txt                                (SUNShINE and Accelerate SUNShINE tables, L7008-7043)
# Table A-1 of A61 ('Real and perceived risks in Latvian housing sector (source: RenESCO)') is an image: the text file holds only its
# caption (A61 L4319). Both writers read it from der-vpp/esco-model/sources/gesco-wave2/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.pdf,
# PDF page 111 (printed page 99); the reviewer re-rendered that page and confirmed the cells. Cited "A61 Table A-1 (PDF p.111)":
# these quotes CANNOT be line-checked against the text corpus. The five rows are reproduced in numbers.risk_table_a1.
# Every fact carries its status: stated / inferred / default / generic / unstated.
#
# Web sources (added 4 Oct 2026; five open documents the corpus does not hold, none licensed). Cited "<URL> | <exact quote>",
# quotes <= 25 words; CITY20 is in Spanish and quoted in Spanish. Short names (full URLs in source.documents):
#   EUKI    Ecofys/adelphi for BMU (EUKI BEACON), 'LABEEF in Latvia' fact sheet, 5 Dec 2018 (PDF; page = printed page)
#   CITY20  CITYnvest model 20 'SUNShINE Letonia' (Spanish; PDF)
#   EBRD17  EBRD press release 'EBRD supports innovative energy efficiency in Latvia' (2017)
#   CORDIS  CORDIS Results in Brief on SUNShINE, 'Innovative financial instrument ...' (last update 29 Sep 2020)
#   GREENH  GREEN-Home good-practice factsheet 'LABEEF' (2022; PDF)
# What they add: LABEEF buys 80% of the contracting rates, the agent bank, F3's EUR 1m equity, CITY20's 15 buildings at EUR 4m
# CAPEX and RenESCO's 60/40 bank / Dutch guaranteed credit split. Conflicts with the corpus are flagged in source.notes.

miniature: renesco_labeef_latvia
lod: 0
case: batch8.T16
case_kind: programme   # RenESCO signed one EPC per block (15 blocks, A61 L4270-4271) and LABEEF buys the receivables of several EPCs (6 buildings in the first sale, JRC17 L7746-7747); no individual contract is published, one representative block is written
in_scope: true
in_scope_why: "RenESCO 'finances housing modernization through energy conservation' (A61 L4230-4231) and the flat owners 'are obliged to pay the energy cost savings to RenESCO' for 20 years (A61 L4238-4239): payment_basis savings, so an ESCO deal (ruling 14)"

tests_unused:
- item: collector_biller
  kind: role
  used: true
  reason: "The House Maintenance Company 'bills the same amount as before the renovation works and pays the ESCO a percentage of those bills' (EUT L1786-1787), and after the sale the cash flows go 'via the House Maintenance Company, to LABEEF' (EUT L1793). A party other than the payee bills and collects for the payee: the role's definition. Not a utility, so collector_biller alone"
- item: occupant
  kind: role
  used: true
  reason: "The flat owners live in the flats: 'Ninety-seven percent of Latvia's building stock is owner occupied' and 'tenants became owners of their flats' (A61 L4224-4225); RenESCO 'guarantees a temperature level of 21.5 °C' to the residents (A61 L4256). Written on the owners' party, home role host first, because payer and user are the same people (T24 splits them only when they differ). JRC17 L7576-7578 also names 'tenants' as beneficiaries: the minority of rented flats is not written as a separate party"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "LABEEF buys cash flows and is funded by an EBRD loan (EUT L1779, L1797-1798; JRC17 L7745-7746); no source says it issues notes. forfaiter, as in forfaiting_bulgaria"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No hedge or rate instrument is mentioned in any of the six texts; all amounts are in EUR"
- item: authority_guarantor
  kind: role
  used: false
  reason: "No guarantee of the owners' payments exists in the deal. JRC19 L5328-5329 lists 'the lack of state guarantees for ESCO loans' as a barrier; Table A-1 (PDF p.111) says banks talk up payment risk to 'collect extra guarantees from governments' and calls it a red herring"
- item: backup_servicer
  kind: role
  used: false
  reason: "No standby collector is named; the House Maintenance Company is the only collector"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "Title to the installed assets is not stated; the fund buys cash flows, not assets (EUT L1790-1793). JRC19 L5323-5324 names 'title to the installed equipment' as a legal ambiguity in Latvia. Client by default"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The ESCO is paid 'a percentage of those bills, based on the realized savings' (EUT L1787-1788): savings. The 21.5 °C temperature is a service level inside RenESCO's performance promise; no source says the payment varies with it"
- item: collection_placement=on_tax
  kind: setting_value
  used: false
  reason: "Collection runs on the House Maintenance Company's heating-and-maintenance bill, not a property-tax bill"
- item: debt_seniority=subordinated
  kind: setting_value
  used: false
  reason: "Neither loan has a stated rank; the bank loan is 'based solely on the EPC contract. No other collateral is used' (A61 L4244-4245). Senior by the fallback"
- item: borrower=none
  kind: setting_value
  used: false
  reason: "Two loans: 'the ESCO takes on a loan from a financial institution' (EUT L1783; A61 L4243-4244) and LABEEF's 'loan signed with EBRD in December 2016' (JRC17 L7745-7746)"


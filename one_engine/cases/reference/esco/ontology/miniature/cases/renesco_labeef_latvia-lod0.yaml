- id: F03
  title: ESIF/Cohesion grant giver = eu_funds
  convention: "a grant from an ERDF-funded programme is given by eu_funds, whatever national body administers it"
  origin: batch 1-4 review; ENCODING.md
  applied_here: "erdf_programme eu_funds, entity_local (paying body unnamed)"
- id: F06
  title: one_way form
  convention: "a grant giver is one_way by nature"
  origin: verdict rule
  applied_here: erdf_programme
- id: F10
  title: fund and manager are two parties
  convention: "a fund by its act (forfaiter), its funder by its act (ifi_dfi); a manager only when named"
  origin: verdict rule
  applied_here: "labeef forfaiter; ebrd ifi_dfi; no fund_manager"
- id: F13
  title: role list, home role first

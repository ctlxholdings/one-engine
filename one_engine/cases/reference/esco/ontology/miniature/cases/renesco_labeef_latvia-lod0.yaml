  origin: verdict rule
  applied_here: "RenESCO's savings and construction guarantees in c1; the performance guarantee held back by LABEEF in c17; no risk_promise from RenESCO. The two risk promises added 4 Oct are third parties': the Dutch guarantor (c28) and LABEEF's take-out of the bank (c30)"
- id: P21
  title: determination by whoever establishes the fact

lod0_gaps:
- kind: collector_not_utility
  description: "on_bill is defined as 'via the utility bill'; here the money travels on a building manager's heating-and-maintenance bill and is passed to the fund. on_bill is the nearest value; the collector is carried by collector_biller and agency promise c8"
  classification: "encoding question (G-B8N-01)"
- kind: two_stage_finance
  description: "the same cash flow first backs RenESCO's bank loan and is then sold to LABEEF once savings are proved; R5a and R7 bearers change at the sale date, LOD 0 holds one row per category. Whether the sale price repays the bank loan is not stated. Web, 4 Oct: EUKI p.7 says LABEEF commits ahead to 'assume the financing risks' once the works are verified (c30) and that the ESCO's debt moves to LABEEF at the forfaiting; the mechanics stay LOD 1"
  classification: "below LOD 0: LOD 1 events (G-B8N-02)"
- kind: table_a1_outside_text_corpus
  description: "Table A-1, the per-risk statement for this deal, is an image (A61 L4319 caption only); its cells are cited from the PDF and cannot be line-checked. It names risk types and verdicts, not bearers"
  classification: "evidence gap (G-B8N-03)"
- kind: grant_route_and_recipient
  description: "A61 gives the 40% ERDF share but not who receives it; JRC17 adds the Green Investment Scheme with no amount. Owners inferred, with the pass-through c4"
  classification: "evidence gap (G-B8N-04)"
- kind: esco_identity_and_dates
  description: "EUT and JRC17 do not name the ESCO selling to LABEEF (RenESCO inferred from A61 L3350, EE22 L8638); A61 says the fund 'has not yet been put in place'; EBRD date December 2016 vs February 2017. Web, 4 Oct: identity resolved, CORDIS 'forfeited a portfolio of six buildings from project partner RenEsco'; EBRD17 (2017) gives no signing date"
  classification: "evidence gap (G-B8N-05)"
- kind: figures_unpublished
  description: "percentage of bills paid to the ESCO, discount rate, held-back O&M and guarantee amounts, bank and EBRD loan terms, grant per block, the House Maintenance Company's fee, and whether the association or each owner signs the EPC"
  classification: "evidence gap (G-B8N-06); the formulas are LOD 2. Web, 4 Oct: the share sold (80%), the ESCO's 20%, the purchase timing, F3's EUR 1m and the programme CAPEX (EUR 4m, 15 buildings) are now printed; the rest stays unpublished"
- kind: web_sources_conflict
  description: "five web sources (header) disagree with the corpus on three money terms: the owners' payment (EUKI about 15% above the old bill for about 18 years vs the same bill for 20 years), RenESCO's second 40% (A61 own equity vs CITY20 Dutch guaranteed credit) and the first EPC year (2008 vs 2009); also who signs the EPC and whether the fund is public. Each is kept as printed with a flagged default chosen (source.notes CONFLICT 1-5)"
  classification: "evidence gap (G-B8N-07); a modeller flips the flagged defaults to run the other version"

conventions_applied:

risk_allocation:   # owner rulings 15-16 (3 Oct): rows the sources state or clearly imply; the converter derives the rest (ENCODING.md). Replication deal: rows equal to a default are kept when a sentence supports them for this deal
  - {category: R1, driver: technical, bearer: [partner_esco], share: sole, status: stated, evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4240 | responsibility for the planning, implementation, funding, operation, maintenance, and M&V", why: "RenESCO carries M&V and gives the energy-saving guarantees (A61 L4288); LABEEF holds back 'a performance guarantee' from the price (EUT L1792), so the ESCO keeps performance after the sale; JRC19 L5283-5284: Latvian ESCOs 'guarantee the savings'. Table A-1 calls the savings fear a 'Proven Red Herring' (2-5% error): size, not bearer. Equal to the derived row; stated. X and Y agree"}
  - {category: R1, driver: usage, bearer: [partner_esco, host], share: shared, status: inferred, evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4264 | owners to contribute to keep the energy consumption as low as possible", why: "RenESCO guarantees 21.5 °C (L4256), is paid on 'realized savings' (EUT L1787-1788) with no baseline adjustment described, and gives the owners 25% of its net result so they keep consumption low (L4263-4265): consumption moves RenESCO's result, and a quarter of that comes back to the owners. Differs from the default (client). Reviewer's reading: Y had partner_esco sole, X the default"}
  - {category: R2, driver: null, bearer: [partner_esco], share: sole, status: stated, evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4238 | responsibility for operation and maintenance for 20 years", why: "A61 L4236-4238 and L4259-4260; after the sale LABEEF 'keeps paying the ESCO for Operations & Maintenance' (EUT L1793-1794); 'the ESCO is obliged to provide maintenance' (JRC17 L7579-7580). Equal to the derived row; stated. X and Y agree"}
  - {category: R3, driver: null, bearer: [partner_esco], share: sole, status: stated, evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4258 | The flat owners incur no additional refurbishment costs.", why: "RenESCO has 'planning, implementation, funding' (A61 L4240) and subcontracts the works (EUT L1784-1785); the owners carry no extra cost, so overruns fall on RenESCO. Equal to the derived row; stated. X and Y agree. Web, 4 Oct: 'the execution risk stays with the ESCO while the financing risk is transferred to LABEEF' (EUKI p.1); CITY20 p.6 'Riesgo de ejecución ESE'"}
  - {category: R5a, driver: null, bearer: [forfaiter, partner_esco], share: shared, status: stated, evidence: "https://www.euki.de/wp-content/uploads/2018/12/Fact-Sheet-LABEEF-Latvian-Energy-Efficiency-Facility-LV.pdf | LABEEF takes over 80% of the risk and rewards, leaving 20% with the ESCO ; https://www.euki.de/wp-content/uploads/2018/12/Fact-Sheet-LABEEF-Latvian-Energy-Efficiency-Facility-LV.pdf | Through forfeiting, the payment risk as well as the ESCO’s debt are transferred to LABEEF instead of banks. ; der-vpp/spec-run/esco-moneyflow/input/eefig-report-on-the-evolution-of-financing-practices-for-energy-effici-2022.txt:8621 | Through forfaiting, the funds would take over the credit of the clients", why: "on the sheet that lists LABEEF and RenESCO (EE22 L8634-8640); A61 L3114-3115 (generic): in an EPC forfeiting 'the bank then assumes the credit risk'. Before the sale RenESCO holds the payments; LOD 0 keeps one row, the post-sale holder. The bank lends to RenESCO, so owner default reaches it only through RenESCO (R5b): X's added lender dropped. Credit rated low: 97% on time, 0% non-payment (A61 L4298-4299). Equal to the derived row. Changed 4 Oct from forfaiter sole (inferred) to forfaiter 80% / partner_esco 20%, stated: EUKI p.8 prints the 80/20 split of risk and rewards and the cash (LABEEF passes 20% of the receivables to the ESCO, so owner default reaches RenESCO's 20%); EUKI p.7 moves 'the payment risk' to LABEEF. Matches receivable_holder split (derived row: assignee + Partner, shared). Shares are LOD 2"}
  - {category: R6, driver: law, bearer: [partner_esco], share: sole, status: inferred, evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4335 | the lack of consistent policies from governments and", why: "Table A-1 (PDF p.111, not line-checkable): start-stop of programmes is a 'Major problem' that 'destroys projects and renovation companies'; programme rules consume '70% of RenESCO staff time' and add 10-15% to project cost. RenESCO advances the whole cost (A61 L4270) and relies on the 40% programme money (L4241-4242) while the owners bear no extra cost (L4258): a subsidy change lands on RenESCO. Differs from the default (client). X and Y agree on the bearer; Y's evidence line (L4311, lack of finance) replaced"}
  - {category: R7, driver: interest_rate, bearer: [partner_esco, forfaiter], share: shared, status: inferred, evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4314 | cost of capital is still much too high (~7%)", why: "RenESCO carries its own cost of capital (A61 L4313-4314; Table A-1 '7-10%'); LABEEF borrows from EBRD (JRC17 L7745-7746) and pays a price fixed at the sale, so the rate on its funding is its own. Each borrower, as the derived row; written to carry the stated RenESCO half. X had partner_esco alone, Y none"}
  - {category: R7, driver: refinancing, bearer: [partner_esco, forfaiter], share: shared, status: stated, via: [c30], evidence: "https://www.euki.de/wp-content/uploads/2018/12/Fact-Sheet-LABEEF-Latvian-Energy-Efficiency-Facility-LV.pdf | The agreement with the bank is supported by LABEEF, which guarantees to assume the financing risks after the measures are completed, monitored and verified. ; der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4311 | Nevertheless, there is no suitable financing available.", why: "A61 L4311-4316: approved projects cancelled for lack of finance, and a forfeiting fund to lower 'RenESCO's financing costs and to enable a quicker recapitalization'; JRC21 L7011-7013: 'refinancing is enabled by sales of future cash flows' to LABEEF. RenESCO bears the refinancing need until the fund buys. X inferred, Y stated; stated, the sentences name RenESCO. Changed 4 Oct from partner_esco sole: RenESCO carries refinancing until the works are verified (A61), then LABEEF has committed to take the financing over (EUKI p.7, risk promise c30; EUKI p.1 'the financing risk is transferred to LABEEF'; CITY20 p.6 'Riesgo financiero Fondos de inversión'). Two holders over time, one LOD 0 row: shared; the switch date is LOD 1"}

    payment_record: "97% on time and 0% non-payment (A61 L4298-4299) imply the 3% late payments were paid eventually; not stated"
    interest_vs_subsidy_check: "level annuity, 20 years: the payment saved by a 1-point lower rate is worth 7.6% of the loan at 7% vs 6% (8.3% if discounted at 6%), 7.3% at 8% vs 7%; 14.4% undiscounted. Table A-1's 9% sits between and does not tie exactly; its basis is not stated"

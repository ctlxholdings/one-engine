    capex_per_block_avg: "derived: EUR 4,000,000 / 15 buildings = EUR 266,667 per building (CITY20 p.5); equals EE22's 'over €4m'/15 floor (0.267m) and sits inside JRC19's EUR 150,000-350,000 band. An average over the programme, not a printed block cost"
    capex_stack_eur: "derived: on EUR 4.0m, ERDF 40% = 1.60m; RenESCO 60% = 2.40m, of which bank 60% = 1.44m and the second 40% = 0.96m (A61 equity or CITY20's Dutch credit, CONFLICT 2); 1.44 + 0.96 + 1.60 = 4.00 (ties)"
    payback_implied_savings: "derived: simple payback 9-10 years 'incluidas las ayudas de FEDER' (CITY20 p.5). If the grant is netted first: 2.40m / 10 to 2.40m / 9 = EUR 240,000-266,667 a year for 15 buildings (EUR 16,000-17,778 per building); on the gross CAPEX: 4.0m / 10 to 4.0m / 9 = EUR 400,000-444,444 (EUR 26,667-29,630 per building). The basis is not stated: a range for checks, not an engine input"
    labeef_capital_printed: "derived: EBRD EUR 4.0m loan + F3 EUR 1.0m equity = EUR 5.0m printed capital, 80% debt / 20% equity; 5.0 / 30 = 16.7% of the EUR 30m design size (EUT L1797)"
    labeef_split_check: "derived: 80% bought (EUKI p.2) + 20% passed to the ESCO (EUKI p.8) = 100% of the contracting rates (ties); risk and rewards 80 / 20 (EUKI p.8) match the cash split"
    labeef_portfolio_ratios: "derived: EUR 50m / 110 buildings = EUR 0.455m per building; EUR 50m / 300,000 m2 = EUR 167/m2 vs EUKI's own 140 + 20 structural = EUR 160/m2 (4% above) and JRC17's 150 (11% above); 300,000 / 110 = 2,727 m2 per building (EUKI p.10-11)"
    sunshine_target_ratios: "derived: EUR 30m / 80 buildings = EUR 0.375m per building; 200,000 m2 / 80 = 2,500 m2 per building; EUR 30m / 200,000 m2 = EUR 150/m2, ties with JRC17's 150 (CITY20 p.1)"
    owner_bill_conflict_size: "derived: EUKI's 115% of the old bill for ~18 years = 20.7 old-bill-years vs 100% for 20 years = 20.0 (CITY20, EBRD17, EUT, JRC17): totals within 3.5%, shapes differ (higher and shorter vs flat and longer). Not reconciled; CONFLICT 1"

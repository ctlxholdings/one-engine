  risk_table_a1:
    source: "A61 Table A-1 'Real and perceived risks in Latvian housing sector (source: RenESCO)', PDF p.111 (printed p.99), image; not line-checkable. Re-rendered and read by the reviewer 3 Oct"
    performance_1: "Perceived: low and medium income people cannot pay the bills. Verdict: 'Proven Red Herring'; banks talk it up to raise rates or 'collect extra guarantees from governments'; track record excellent in Eastern Europe"
    performance_2: "Perceived: expected savings not achieved or dropping. Verdict: 'Proven Red Herring'; thousands of similar buildings; savings usually within 2-5% margin of error and do not decrease"

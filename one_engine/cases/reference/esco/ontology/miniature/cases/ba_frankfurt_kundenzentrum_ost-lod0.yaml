  settings_by_status: {stated: 3, inferred: 2, generic: 0, default: 8}
  commitments_by_status: {stated: 1, inferred: 1, generic: 0, unstated: 1}
  one_way_parties: []
  parties_count: 2
  commitments_count: 3
  below_lod0: {lod1_adds: 'events (signature 04/2005, works, start 06/2006, annual savings determination, end 05/2015)', lod2_adds: 'fee

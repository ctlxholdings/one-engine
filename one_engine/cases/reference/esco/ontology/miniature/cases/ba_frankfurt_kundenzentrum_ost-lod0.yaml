risk_allocation:   # owner rulings 15-16 (3 Oct): rows the source states or implies; the converter derives the rest (ENCODING.md)
  - {category: R1, driver: technical, bearer: [partner_esco], share: sole, status: stated, evidence: "cases/ba_frankfurt_kundenzentrum_ost-lod0.yaml:106", why: "the dena page prints the contractor's savings guarantee ('Einspargarantie: 35.000 Euro pro Jahr'), so a technical shortfall falls on the contractor; same bearer as the default but stated, which upgrades it from derived. Adjudicator call: drafts A and B agree (stated); A cited a scratchpad copy, re-anchored to the case-file quote; stated, as for the other dena entries (baw_karlsruhe). Nothing else on the page allocates risk"}

source:
  id: DENA-ESC
  title: 'Energiespar-Contracting: Anwendungsbeispiele (dena project database, entry "JVA Moabit, Berliner Energiesparpartnerschaften Pool 20")'
  publisher: Deutsche Energie-Agentur (dena), Kompetenzzentrum Contracting; re-fetched by the reviewer 1 Oct 2026
  passage: https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | entry "JVA Moabit, Berliner Energiesparpartnerschaften
    Pool 20", blocks Basisdaten, Projektbeteiligte, Weitere Daten, Maßnahmen, Merkmale
  oracle: 'none: a project data sheet, not the contract. Printed percentages re-computed in numbers.derived'
  context:
  - 'Berliner Energieagentur GmbH: ''Beratung'' [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | entry "JVA Moabit,
    Berliner Energiesparpartnerschaften Pool 20", Projektbeteiligte]. Energy agency with no stated promise: context (ruling)'
  - 'Berliner Energiesparpartnerschaften: the programme named in the entry title (''Pool 20''). The page describes no programme body and no promise by it: context'
  notes:
  - 'Title ''Pool 20'' vs ''Pool-Projekt: nein'' and one site; aggregation none by the stated flag'
  - '''Haushaltsentlastung: 117.000 Euro pro Jahr'' is printed without definition. 454.000 - 117.000 = 337.000 is arithmetic only, not a published contractor remuneration'
  - 'Windows: ''ein Teil der Einsparbeteiligung des AG dazu verwendet, in einem Gebäude für 350.000 € komplett die Fenster zu sanieren'' [Maßnahmen]; ''ebenfalls
    vom Contractor realisiert''. Whether inside the 1,6 Mio. EUR investment is not stated'
  - '''Verfahren: Einstufig''; ''Leuchtturmprojekt: Ja''. Intro ''um mehr als 30 Prozent'' consistent with 35,0 %'
  - 'Payment mechanics, penalties, funding party: not on the page (row caveat confirmed)'

# Miniature — SunStrong 2018-1 Issuer, LLC, $400m Solar Asset Backed Notes, Series 2018-1 (US), expressed at ESCO LOD 0
#
# Batch 5 FINAL, reviewer rev-F (1 Oct 2026), reconciled from writers F-X and F-Y; base X (its paragraph numbers match the release:
# para 1 dateline with pricing, 2-3 the two CFO quotes, 4 issuer and collateral, 5 securities law); membership-interest promises from Y.
# Decisions: batch5/rev-F/decisions.json. Release re-fetched by the reviewer (curl, HTML stripped).
# OUT-OF-SCOPE WITNESS: a securitisation of residential solar leases; no energy service is paid for.
# Evidence: one public document, fetched 1 Oct 2026 (curl, HTML stripped in a scratch folder):
#   [HASI18] https://investors.hasi.com/news/press-releases/detail/70/sunstrong-capital-holdings-llc-successfully-completes-400
#            SunPower / Hannon Armstrong joint press release (PRNewswire), 28 November 2018: 'SunStrong Capital Holdings, LLC
#            Successfully Completes $400 Million Asset Backed Securitization'. A PRESS RELEASE by the sponsors: no trustee,
#            no reserve, no waterfall, no lease terms. Cited by paragraph (the page has no page numbers).
# Every fact carries its status: stated / inferred / default / generic / unstated. The row's text was treated as unverified.
# Coverage of the deal is thin by construction; the file records what the release supports and nothing else.

miniature: sunstrong_2018_1
lod: 0
case: batch5.D31_sunstrong_2018_1
case_kind: deal   # one named note issue, closed 28 Nov 2018 ($400m)
in_scope: false
in_scope_why: "The notes are secured by cash flows from 'residential solar leases originated by SunPower' [HASI18 | para 4]. The lessee pays for the use of a solar system; no efficiency asset, no savings and no energy-service price appear. The only efficiency word is the JV partner's strategy ('industry leaders in energy efficiency and renewable energy', para 3), not this pool. Out-of-scope witness, as batch-3 posigen_backleverage. Its uses are not counted"
tests_unused:
- item: securitisation_vehicle
  kind: role
  used: false
  structural_fit: true
  reason: "Fits: 'The Notes were issued by a special purpose entity, SunStrong 2018-1 Issuer, LLC' and it 'will be the sole obligor of the Notes' [HASI18 | para 4]. The collateral is a variant: the notes are secured by 'the managing member interests' in project companies, not by the leases themselves. Bankruptcy-remote is not stated. Not counted: solar-lease pool, out of scope"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No hedge provider is named. The release says 'priced at a fixed interest rate of 5.68 percent' [HASI18 | para 1] and is silent on any hedge. Nothing to quote"
- item: authority_guarantor
  kind: role
  used: false
  reason: "Clients are residential lessees; no public body or guarantee. The release says the notes 'will not be obligations of SunStrong or any of its other subsidiaries, or of SunPower, Hannon Armstrong' [HASI18 | para 4]: no sponsor guarantee either"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "The leases sit in 'indirectly owned subsidiary project companies' that are the lessors (inferred), so asset_owner = lessor. The issuer owns membership interests, not the systems or leases"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The release gives no lease terms. A residential lease is a fixed payment for the system, so payment_basis = asset (inferred); a production guarantee or per-kWh price would change it to performance or supply, but nothing in the release says so"

source:
  id: [HASI18]
  documents:
    HASI18: "https://investors.hasi.com/news/press-releases/detail/70/sunstrong-capital-holdings-llc-successfully-completes-400 — joint press release of SunPower Corporation and Hannon Armstrong Sustainable Infrastructure Capital, Inc., 28 Nov 2018. Sponsor press release: primary for what the sponsors announced, secondary for structure"
  title: SunStrong Capital Holdings, LLC Successfully Completes $400 Million Asset Backed Securitization
  publisher: SunPower Corporation and Hannon Armstrong Sustainable Infrastructure Capital, Inc. (PRNewswire)
  passage: "paragraphs 1-5 of the release (dateline to the securities-law notice); para 1 is the dateline paragraph with pricing and dates"
  oracle: none — not a published validation target; acceptance is structural
  context:
  - "SunStrong Capital Holdings, LLC: the 'joint venture' of SunPower and Hannon Armstrong; the Issuer is 'an indirectly wholly-owned subsidiary of SunStrong' [HASI18 | para 4]. The release names it as sponsor of the deal only by headline. No promise by it is stated, so it is not a party. The row's 'sponsor' reading is an inference"
  - "KBRA: rated the notes 'A (sf)' [HASI18 | para 1]; Moody's Investors Service gave a 'Green Bond Assessment of GB1' (para 1). Neither makes a promise: rule sources"
  - "Hannon Armstrong Sustainable Infrastructure Capital (NYSE: HASI): JV partner and a 'leading capital and services provider to the sustainable infrastructure market' [HASI18 | para 2]. Its equity in the JV is not described; outside the deal boundary"
  - "Not found in the release: trustee, account bank, custodian, backup servicer, reserve account, hedge, waterfall, initial purchasers. The row's caveat says the same. None is invented"
  notes:
  - "Sale to qualified buyers only: 'only being sold to qualified institutional buyers under Rule 144A ... and to persons outside the United States pursuant to Regulation S' [HASI18 | para 5]"
  - "Use of proceeds: 'The proceeds will primarily be used to refinance the existing debt obligations associated with SunStrong's residential lease portfolio' [HASI18 | para 4]. So the notes refinance, they do not fund new leases"
  - "SunPower's own words on the effect: 'we have now fully deconsolidated our existing leveraged residential lease portfolio' [HASI18 | para 2]"
  - "Row check: '$400m, 5.68%, KBRA A(sf), ARD Nov 2028, final Nov 2048' all match para 1. '37,500+ leases' matches para 4. The row calls the vehicle 'SPV secured by managing-member interests': matches para 4"

jurisdiction:
  country: United States
  iso: US
  eu_member: false
  client_eu_general_government_at_close: false
  as_of: "closing announced 28 Nov 2018 [HASI18 | para 1]"
  status: inferred
  why: "SunPower is a US company ('SAN JOSE, Calif.') and the leases are 'residential solar leases' originated by it; the notes are sold under US Rule 144A and Regulation S (HASI18 | para 1, 4, 5). The lessees' location is not stated; inferred US"

core_v7:
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: each contract establishes (fibo-fnd-rel-rel:confers) its commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:
  lessee:
    role: host
    groups: [demand]
    status: generic
    text: "'more than 37,500 residential solar leases originated by SunPower' [HASI18 | para 4]. The lessees are not named; a representative homeowner"
  project_companies:
    role: lessor
    groups: [capital]
    status: inferred
    text: "'indirectly owned subsidiary project companies, which own more than 37,500 residential solar leases' [HASI18 | para 4]. They hold the leases, so they are the lessors; the systems' title is not stated. Not named"
  sunpower:
    entity: sunpower_corp
    role: [originator_developer, collector_biller]
    groups: [delivery, collection]
    status: stated
    name: SunPower Corporation
    text: "'residential solar leases originated by SunPower'; 'SunPower will continue to service the leases underlying the Notes' [HASI18 | para 4]. collector_biller is inferred from 'service'; the release does not say SunPower bills or collects"
  issuer:
    entity: sunstrong_2018_1_issuer
    role: securitisation_vehicle
    groups: [capital]
    status: stated
    name: SunStrong 2018-1 Issuer, LLC
    text: "'a special purpose entity, SunStrong 2018-1 Issuer, LLC (SunStrong Issuer), an indirectly wholly-owned subsidiary of SunStrong' [HASI18 | para 4]"
  noteholders:
    role: lender
    groups: [capital]
    status: stated
    text: "buyers of the $400m notes, 'qualified institutional buyers' and non-US persons [HASI18 | para 1, 5]. Not named"

contract:
  residential_lease:
    core: contract
    parties: [project_companies, lessee]
    status: generic
    note: "the representative contract: a residential solar lease originated by SunPower [HASI18 | para 4]. Terms, price and term are not in the release"
  servicing_arrangement:
    core: contract
    parties: [sunpower, project_companies]
    status: inferred
    note: "'SunPower will continue to service the leases' [HASI18 | para 4]; the counterparty (project companies or issuer) is not stated. Inferred: the project companies own the leases"
  notes_indenture:
    core: contract
    parties: [issuer, noteholders]
    status: stated
    note: "'Solar Asset Backed Notes, Series 2018-1' (HASI18 | para 1). The indenture and its trustee are not named in the release"
  membership_interests:
    core: contract
    parties: [issuer, project_companies]
    status: stated
    note: "the Issuer owns 'managing member interests' in the project companies (HASI18 | para 4), which entitle it to their cash flow. The operating agreements are not in the release"

commitments:
  c1:
    family: performance_promise
    from: project_companies
    to: lessee
    status: inferred
    what: "make the solar system available under the lease (the project companies own the leases, HASI18 | para 4). Inferred; no lease terms stated"
    established_by: residential_lease
  c2:
    family: payment_promise
    from: lessee
    to: project_companies
    status: inferred
    what: "lease payments for the system; the amount and escalator are not stated. 'cash flow generated by the managing member interests' (HASI18 | para 4) comes from them"
    established_by: residential_lease
  c3:
    family: agency_promise
    from: sunpower
    to: project_companies
    status: stated
    what: "'SunPower will continue to service the leases underlying the Notes' [HASI18 | para 4]; 'asset management responsibilities' (para 2)"
    established_by: servicing_arrangement
  c4:
    family: payment_promise
    from: project_companies
    to: sunpower
    status: unstated
    what: "counter-promise required by duality; servicing fee not stated"
    established_by: servicing_arrangement
  c5:
    family: payment_promise
    from: project_companies
    to: issuer
    status: stated
    what: "distributions on the managing member interests: the notes are 'secured by, and payable from, the cash flow generated by the managing member interests owned by SunStrong Issuer' [HASI18 | para 4]. The mechanics of the distribution are not described (from writer Y: stated)"
    established_by: membership_interests
  c6:
    family: funding_promise
    from: issuer
    to: project_companies
    status: inferred
    what: "note proceeds pass down to the lease portfolio: 'The proceeds will primarily be used to refinance the existing debt obligations associated with SunStrong's residential lease portfolio' [HASI18 | para 4]. Route (loan, capital contribution through the JV) not stated (from writer Y: inferred)"
    established_by: membership_interests
  c7:
    family: funding_promise
    from: noteholders
    to: issuer
    status: stated
    funding_instrument: bond   # Solar Asset Backed Notes (HASI18 para 1)
    what: "buy $400 million of Solar Asset Backed Notes, Series 2018-1, 'priced at a fixed interest rate of 5.68 percent per annum', rated A(sf) by KBRA [HASI18 | para 1]"
    established_by: notes_indenture
  c8:
    family: payment_promise
    from: issuer
    to: noteholders
    status: stated
    what: "interest at 5.68% a year; 'anticipated repayment date is in November 2028, with a rated final maturity date in November 2048' [HASI18 | para 1]. 'The Notes are secured by, and payable from' the cash flow of the managing member interests; the issuer is the 'sole obligor' (para 4)"
    established_by: notes_indenture

settings:
  payment_basis: {value: asset, status: inferred, why: "No Partner. The lessee pays for the use of a system (c2); no savings or output figure appears in the release. Alternatives: supply or performance if the lease is a PPA or has a production guarantee; the release says only 'residential solar leases' (para 4)"}
  client_sector: {value: private, status: stated, why: "'residential solar leases' (HASI18 | para 4)"}
  partner_form: {value: corporate, status: default, why: "no ESCO Partner: SunPower originates and services; the project companies lease. Default kept"}
  borrower: {value: client, status: inferred, why: "the lessee takes the lease (definition widened to 'loan or lease', RULINGS.md ruling 6). The issuer's note debt is funding one level up (c7-c8)"}
  receivable_holder: {value: assignee, status: inferred, why: "the lease payments belong to the project companies, which are not the originator SunPower: 'project companies, which own more than 37,500 residential solar leases originated by SunPower' (HASI18 | para 4)"}
  collection_placement: {value: assignee_direct, status: default, why: "F09 fallback: receivable_holder = assignee and the release is silent on where payments land"}
  aggregation: {value: pool, status: stated, why: "'more than 37,500 residential solar leases' in one portfolio (HASI18 | para 4)"}
  debt_seniority: {value: senior, status: default, why: "one class of notes; no rank stated. Fallback senior"}
  assignment_recourse: {value: waiver, status: default, why: "F08 fallback: receivable_holder = assignee and the release is silent on recourse. Alternative performance_exposed: the notes are secured by membership interests, so the assignee is behind the lessor; not stated"}
  savings_basis: {value: measured, status: default, why: "no savings are computed; a lease payment. Default kept, no object"}
  grant_recipient: {value: none, status: default, why: "no grant or tax-credit receipt is described in the release. Residential solar leases normally monetise the federal ITC in the lessor, but the release does not say so"}
  asset_owner: {value: lessor, status: inferred, why: "the project companies own the leases (HASI18 | para 4) and so lease the systems. Alternative vehicle: the issuer holds only membership interests; the project companies are the lessors, so lessor"}
  bill_custody: {value: client, status: default, why: "not stated; the lessee keeps the utility account"}

rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments forecast over the EPC + (b) any government financing not repayable by the Partner (e.g. capital grant), else the EPC is ON BALANCE SHEET for government (E15 L2578-2582)
    applies_here: false
    this_case: private lessees in the US; outside the EU
    source: E15 L2576-2582
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? Applies when the client is private and asset_owner is not the client (owner ruling 1 Oct)"
    applies_here: true
    this_case: "triggered formally: private client, asset_owner = lessor. It is a plain lease, so the answer is lease. A consumer lessee does not report under IFRS 16; recorded for consistency, as in batch-3 posigen_backleverage"
    source: E02 L3293-3295; RULINGS.md ruling 7
  notes_non_recourse_to_sponsors:
    scope: contractual
    rule: "'SunStrong Issuer will be the sole obligor of the Notes and the Notes will not be obligations of SunStrong or any of its other subsidiaries, or of SunPower, Hannon Armstrong, or any of their respective subsidiaries' (HASI18 | para 4)"
    applies_here: true
    source: HASI18 para 4

numbers:
  notes_usd: 400 million (para 1; 'Solar Asset Backed Notes, Series 2018-1')
  coupon_pct: 5.68 fixed, per annum (para 1)
  rating: A (sf) by KBRA (para 1); Green Bond Assessment GB1 by Moody's (para 1)
  anticipated_repayment_date: November 2028 (para 1)
  rated_final_maturity: November 2048 (para 1)
  leases: more than 37,500 residential solar leases (para 4)
  closing_announcement: 2018-11-28 (para 1)
  derived:
    term_to_ard: "Nov 2018 to Nov 2028 = 10 years; to final maturity Nov 2048 = 30 years (arithmetic on printed dates; closes)"
    not_derived: "reviewer: no average per lease and no annual interest are derived; neither checks a published figure, and the proceeds refinance existing debt, so notes per lease would mislead (writer Y's position)"

reciprocity:
  lessee: {gives: [c2], receives: [c1], one_way: false}
  project_companies: {gives: [c1, c4, c5], receives: [c2, c3, c6], one_way: false}
  sunpower:
    gives: [c3]
    receives: [c4]
    one_way: true
    reason: the servicing fee exists only by duality; recorded as c4 unstated
  issuer: {gives: [c6, c8], receives: [c5, c7], one_way: false}
  noteholders: {gives: [c7], receives: [c8], one_way: false}

lod0_gaps:
- kind: membership_interest_collateral
  description: "The notes are secured by managing member interests in project companies, not by the leases. LOD 0 has no single value for 'the issuer holds equity in the lessors and the notes are paid from their distributions'. Encoded as c5 (distribution, stated) and c6 (proceeds down, inferred); receivable_holder = assignee records that the lessors, not the originator SunPower, hold the leases. securitisation_vehicle fits loosely: it holds equity, not receivables or title (writer Y)"
  classification: "encoding question (receivable_holder values are about who is entitled to the client's payments)"
- kind: thin_source
  description: "A press release: no trustee, account bank, backup servicer, reserve, waterfall, lease terms or tenor. The row's caveat already says so"
  classification: "evidence gap"
- kind: no_partner_lease
  description: "A lease pool with no efficiency or service content. payment_basis = asset with no Partner records it"
  classification: "encoding question (scope boundary); out-of-scope witness"

conventions_applied:
- id: F02
  title: jurisdiction header field; C1 trigger
  convention: 'jurisdiction block dated at financial close; C1 applies_when {client_sector: public, jurisdiction: EU at close}'
  origin: RULINGS.md ruling 4
  applied_here: US (inferred); C1 off
- id: F06
  title: one_way form
  convention: a party whose counter-promise exists only by duality is one_way with a reason; the counter-promise is unstated
  origin: batch rule
  applied_here: sunpower one_way, c4 unstated
- id: F08
  title: conditional default assignment_recourse
  convention: receivable_holder assignee and source silent -> waiver (status default)
  origin: ENCODING.md
  applied_here: waiver, default
- id: F09
  title: conditional default collection_placement
  convention: receivable_holder assignee and source silent -> assignee_direct (status default)
  origin: ENCODING.md
  applied_here: assignee_direct, default
- id: G23
  title: IFRS16_lease_test
  convention: applies when client_sector private and asset_owner is not client
  origin: RULINGS.md ruling 7
  applied_here: true (asset_owner = lessor), formal only
- id: B2-R1
  title: public money by identity
  convention: a government body that lends or grants takes government_financier
  origin: batch-2 adjudication
  applied_here: not triggered, no public body
- id: P1
  title: payment_basis first in settings
  convention: payment_basis is the first setting; a deal with no Partner is possible only when it is asset
  origin: RULINGS.md ruling 1
  applied_here: asset, inferred


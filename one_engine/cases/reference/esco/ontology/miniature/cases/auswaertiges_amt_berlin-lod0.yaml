reciprocity:   # gives/receives computed from commitments; one_way per convention F06
  auswaertiges_amt: {gives: [c2, c3], receives: [c1, c4], one_way: false}
  caverion: {gives: [c1], receives: [c2, c3, c4], one_way: false}

lod0_gaps:   # what the deal needs that LOD 0 lacks, each with a classification (reviewer ids in ../gaps.json)
- kind: same_government_programme_money
  description: "A federal programme pays a Baukostenzuschuss for a federal ministry's contract. Encoded as the client's own payment (giver = the client's government). Whether a central programme budget of the same legal person is ever a separate government_financier is a convention question, not a missing term (A5-G01)"
  classification: encoding question
- kind: fee_funding_verifier
  description: "Fee formula, financier of the 3,0 Mio. Euro, savings verifier and penalties are not on the page (A5-G04)"
  classification: evidence gap
- kind: budget_relief_undefined
  description: "'Haushaltsentlastung' is printed without a definition; not used (A5-G05)"
  classification: evidence gap

conventions_applied:   # what this file assumes beyond elements.yaml
- id: B5-advisers
  title: advisers and energy agencies are context
  convention: "dena, Berliner Energieagentur, KEA-BW, eta, CDM Consult are source.context unless the source states a promise by them"
  origin: REVIEW_SPEC_5 rulings
  applied_here: "dena in source.context"
- id: B5-BKZ
  title: Baukostenzuschuss is the client's payment
  convention: "A Baukostenzuschuss the client pays or co-funds is the client's payment promise to the Partner, not a grant; grant_recipient none unless a named giver that is neither client nor Partner gives non-repayable money"
  origin: REVIEW_SPEC_5 rulings
  applied_here: "c3 payment_promise from the client; the giver 'der Bund' is the client's own government; grant_recipient none (inferred)"
- id: F02
  title: jurisdiction header, C1 trigger
  convention: "Jurisdiction dated at financial close; German public client = EU general government, stated when a public body is named; C1 outcome undetermined when payments are not published"
  origin: RULINGS.md ruling 4; REVIEW_SPEC_5 rulings
  applied_here: "true, stated; C1 applies, outcome undetermined"
- id: F05
  title: provider's own capital inside performance_promise
  convention: "Under one service contract the provider's own capital sits inside its performance_promise; a funding_promise needs a distinct claim between distinct parties"
  origin: ENCODING.md
  applied_here: "the 3,0 Mio. Euro investment inside c1"
- id: F21
  title: determination_promise required
  convention: "A determination_promise is required when a payment depends on savings; from the literal unstated when no verifier is named"
  origin: ENCODING.md; REVIEW_SPEC_5 rulings
  applied_here: "c4 from unstated"
- id: ENC
  title: fallbacks when the source is silent
  convention: "Silent settings take the ENCODING.md fallback with status default"
  origin: ENCODING.md
  applied_here: "borrower, receivable_holder, collection_placement, debt_seniority, assignment_recourse, savings_basis, asset_owner, bill_custody"


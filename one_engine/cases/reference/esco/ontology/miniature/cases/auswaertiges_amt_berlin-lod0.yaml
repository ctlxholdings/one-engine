# Miniature — Auswärtiges Amt Berlin guaranteed-savings energy-saving contract (Caverion), Germany, expressed at ESCO LOD 0
#
# Batch 5, pair A, reviewer's reconciled file (writers X and Y encoded blind; decisions in ../decisions.json).
# Evidence: one dena project record, re-fetched 1 Oct 2026 by the reviewer (curl, read as text); every quote below was matched
# against that text. Cited '[DENA | <section>]', quotes of 25 words or fewer, German number format kept as printed.
#   [DENA] https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/
#          dena, 'Anwendungsbeispiele von Energiespar-Contracting', entry 'Auswärtiges Amt Berlin'.
# The page is a project summary, not the contract. Every fact carries its status: stated / inferred / default / unstated.

miniature: auswaertiges_amt_berlin
lod: 0
case: batch5.D01
case_kind: deal   # one named contract, signed 06.07.2010
in_scope: true
in_scope_why: "The contractor guarantees an annual saving to a federal ministry: 'Einspargarantie: 604.000 Euro pro Jahr (31,1 Prozent)' [DENA | Basisdaten], under 'Contracting-Modell: Energiespar-Contracting'. A guaranteed-savings contract meets the EED energy performance contracting test (E02 L556-560). That the client pays against the savings is inferred: the page prints no fee"

tests_unused:   # CASE_SPEC_5 unused items; none is forced in
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "The page lists client, adviser and contractor only; nothing is sold on or securitised"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No debt and no hedge are described"
- item: authority_guarantor
  kind: role
  used: false
  reason: "No guarantee of the client's payments; the only guarantee on the page is the contractor's savings guarantee"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "Title is not stated; asset_owner is the default client. No third-party holder appears"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The guarantee is a savings amount in EUR per year, not an availability, output or comfort level"

source:   # where the facts come from; context = actors outside the deal boundary (F23); notes = observations that are not gaps
  id: DENA
  title: "dena Kompetenzzentrum Contracting, 'Anwendungsbeispiele von Energiespar-Contracting', entry 'Auswärtiges Amt Berlin'"
  publisher: Deutsche Energie-Agentur GmbH (dena)
  passage: "https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | entry 'Auswärtiges Amt Berlin' (text, Basisdaten, Projektbeteiligte, Weitere Daten, Maßnahmen, Merkmale)"
  oracle: "the printed ratio Einspargarantie / Basisenergiekosten (31,1 Prozent) is re-computed in numbers.derived"
  context:
  - "dena is listed under 'Beratung' (adviser) with no promise stated: context, not a party (batch-5 ruling on advisers and energy agencies). It also publishes the page"
  - "The federal building-energy programme: 'aus dem Energieeinsparprogramm Bundesliegenschaften (sog. 120-Mio-Programm)' [DENA | text]. It is the budget line the Bund drew the Baukostenzuschuss from; a programme, not a party (see c3 and lod0_gaps)"
  notes:
  - "Baukostenzuschuss: 'Um die Konditionen des Angebots zu verbessern, beteiligte sich der Bund mit einem Baukostenzuschuss in Höhe von 1,2 Millionen Euro' [DENA | text]. The page types the client 'Auftraggeber: Bund' [DENA | Merkmale]: the giver is the client's own government (the ministry is an organ of the Bund). Under the batch-5 ruling a Baukostenzuschuss the client co-funds is the client's own payment to the Partner (c3), not a grant; grant_recipient none, no government_financier party. Both writers had encoded a separate Bund government_financier; overruled (decisions.json)"
  - "'Haushaltsentlastung: 317.000 Euro pro Jahr' [DENA | Weitere Daten] is printed without a definition. If it meant guarantee minus fee, the fee would be 604.000 - 317.000 = 287.000 Euro per year; that is a reading of an undefined term and is not encoded"
  - "One property ('Anzahl Liegenschaften: 1'), three buildings optimised on it: 'Im Energiespar-Contracting wurden drei Gebäude optimiert' [DENA | Liegenschaft(en)]"
  - "Flagship flag: 'Ja: Erstes Bundesministerium im Energiespar-Contracting' [DENA | Merkmale]"
  - "The page gives no fee formula, no shortfall rule, no financier and no M&V party: these are default or unstated, never filled in"

jurisdiction:   # header field, not a setting (F02); dated at financial close
  country: Germany
  iso: DE
  eu_member: true
  client_eu_general_government_at_close: true
  as_of: "contract signed 06.07.2010: 'Vertragsschluss: 06.07.2010' [DENA | Weitere Daten]"
  status: stated
  why: "The source names a public body: the Auswärtiges Amt, typed 'Auftraggeber: Bund' [DENA | Merkmale]. Germany was an EU member in 2010"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: the energy-saving contract establishes (fibo-fnd-rel-rel:confers) its commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 37 (a list = several roles, home role first; F13); groups computed from the role(s)
  auswaertiges_amt:
    entity: bund_de
    role: authority
    groups: [demand, public]
    status: stated
    name: Auswärtiges Amt, Innerer Dienst, Berlin
    text: "listed as 'Auftraggeber' [DENA | Projektbeteiligte]; 'Auftraggeber: Bund' [DENA | Merkmale]. A federal ministry"
  caverion:
    entity: caverion_deutschland_gmbh
    role: partner_esco
    groups: [partner]
    status: stated
    name: Caverion Deutschland GmbH, Facility Services, München
    text: "listed as 'Contractor' [DENA | Projektbeteiligte]; installs the measures and guarantees the savings"

contract:   # the agreements that establish the commitments
  esc_contract:
    core: contract
    parties: [auswaertiges_amt, caverion]
    status: stated
    note: "'Contracting-Modell: Energiespar-Contracting' [DENA | Basisdaten]; 'Vertragsschluss: 06.07.2010'; 'Hauptleistungsphase: 09/2011 bis 08/2021' [DENA | Weitere Daten]; 'Verfahren: Zweistufig'. Title and clauses are not on the page"

commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: performance_promise
    from: caverion
    to: auswaertiges_amt
    status: stated
    what: "installs a high-efficiency compression chiller, LED lighting in the garage and cellar corridors, room-by-room heating control for ca. 850 rooms, a ca. 200 m2 solar air collector, pumps, hydraulic balancing and extra metering [DENA | text, Maßnahmen], and guarantees 'Einspargarantie: 604.000 Euro pro Jahr (31,1 Prozent)' [DENA | Basisdaten] over the performance phase 09/2011-08/2021. Its own funding of the 'Investition: 3,0 Mio. Euro' sits inside this promise (F05); no shortfall rule is printed"
    established_by: esc_contract
  c2:
    family: payment_promise
    from: auswaertiges_amt
    to: caverion
    status: inferred
    what: "pays the contractor during the performance phase. Inferred from the contracting model; amount and formula are not printed"
    established_by: esc_contract
  c3:
    family: payment_promise
    from: auswaertiges_amt
    to: caverion
    status: inferred
    what: "upfront construction-cost contribution of 1,2 Mio. Euro: 'Baukostenzuschuss: 1,2 Mio. Euro' [DENA | Weitere Daten], paid by 'der Bund' from the 120-Mio-Programm 'Um die Konditionen des Angebots zu verbessern' [DENA | text]. The client's own payment under the batch-5 Baukostenzuschuss ruling; inferred because the page names 'der Bund' (the client's type), not the ministry, and does not print the payee"
    established_by: esc_contract
  c4:
    family: determination_promise
    from: unstated
    to: [auswaertiges_amt, caverion]
    status: unstated
    determines: savings   # achieved savings against the guarantee
    what: "establishes the achieved savings against the guarantee (F21). The page names no verifier; it mentions only 'Einbau von Strom-, Wasser- und Wärmemengenzählern für ein erweitertes Energiemonitoring' [DENA | Maßnahmen]"
    established_by: esc_contract

settings:   # the 13 LOD 0 facets, in vocabulary order
  payment_basis: {value: savings, status: inferred, why: "'Energiespar-Contracting' with an 'Einspargarantie' in EUR per year [DENA | Basisdaten]; what the client pays for is not printed"}
  client_sector: {value: public, status: stated, why: "'Auftraggeber: Bund' [DENA | Merkmale]"}
  partner_form: {value: corporate, status: inferred, why: "Caverion Deutschland GmbH is a standing company named with a division; the page does not say it is not a deal SPV"}
  borrower: {value: partner, status: default, why: "no loan, lease or equity is named; ENCODING.md fallback partner"}
  receivable_holder: {value: partner, status: default, why: "no assignment of the client's payments is mentioned"}
  collection_placement: {value: operator_own, status: default, why: "nothing assigned and no escrow; vocabulary default"}
  aggregation: {value: none, status: stated, why: "'Pool-Projekt: nein' [DENA | Merkmale]; 'Anzahl Liegenschaften: 1' [DENA | Weitere Daten]"}
  debt_seniority: {value: senior, status: default, why: "no debt is stated"}
  assignment_recourse: {value: not_applicable, status: default, why: "nothing assigned"}
  savings_basis: {value: measured, status: default, why: "how savings are determined is not stated; vocabulary default"}
  grant_recipient: {value: none, status: inferred, why: "the Baukostenzuschuss comes from 'der Bund', the client's own government ('Auftraggeber: Bund' [DENA | Merkmale]); no giver that is neither client nor Partner is named, so no grant (batch-5 ruling). Inferred, because reading 'der Bund' as the client is a reading"}
  asset_owner: {value: client, status: default, why: "title is not stated; ENCODING.md fallback"}
  bill_custody: {value: client, status: default, why: "who pays the energy bill is not stated; vocabulary default"}

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments + (b) non-repayable government financing, else ON BALANCE SHEET for government (E15 L2578-2582)
    applies_here: true
    this_case: "applies (German federal ministry, EU at close); outcome undetermined: the payments are not published. Guaranteed savings 604.000 Euro/yr x 10 years = 6,04 Mio. Euro nominal. The 1,2 Mio. Euro upfront contribution is government money paid at face value; it sits on the right-hand side of the test whether read as a payment or as government financing"
    source: E15 L2576-2582, L6930-6943; RULINGS.md ruling 3
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: [partner, lessor, vehicle]}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? Private counterpart of C1"
    applies_here: false
    this_case: "public client; asset_owner is the default client"
    source: E02 L3293-3295; RULINGS.md ruling 7

numbers:   # published figures as printed, with units; derived values with arithmetic
  contract_signed: {value: '2010-07-06', unit: date, source: "'Vertragsschluss: 06.07.2010' [DENA | Weitere Daten]"}
  performance_phase: {value: 09/2011 to 08/2021, unit: month range, source: "'Hauptleistungsphase: 09/2011 bis 08/2021' [DENA | Weitere Daten]"}
  base_energy_costs: {value: 1900000, unit: EUR/yr, source: "'Basisenergiekosten: 1,9 Mio. Euro pro Jahr' [DENA | Basisdaten]", note: printed to 0,1 Mio.}
  guaranteed_savings: {value: 604000, unit: EUR/yr, source: "'Einspargarantie: 604.000 Euro pro Jahr (31,1 Prozent)' [DENA | Basisdaten]"}
  guaranteed_savings_pct: {value: 31.1, unit: '% of base energy costs', source: same line; the text says 'jährlich 31 Prozent'}
  investment: {value: 3000000, unit: EUR, source: "'Investition: 3,0 Mio. Euro' [DENA | Basisdaten]"}
  baukostenzuschuss: {value: 1200000, unit: EUR, source: "'Baukostenzuschuss: 1,2 Mio. Euro' [DENA | Weitere Daten]"}
  budget_relief: {value: 317000, unit: EUR/yr, source: "'Haushaltsentlastung: 317.000 Euro pro Jahr' [DENA | Weitere Daten]", note: term not defined on the page}
  co2_saving: {value: 1780, unit: t/yr (22,6 %), source: "'1.780 Tonnen pro Jahr (22,6 Prozent)' [DENA | Weitere Daten]"}
  floor_area: {value: 163000, unit: m2 BGF, source: "'Fläche: 163.000 m² BGF' [DENA | Weitere Daten]"}
  derived:
    savings_pct_check: "604.000 / 1.900.000 = 31,79 % vs 31,1 % printed: does not close on the rounded base. 604.000 / 0,311 = 1.942.122 Euro, inside the rounding band of '1,9 Mio.' (1,85-1,95 Mio. gives 32,65 % to 30,97 %). Closes within rounding"
    performance_phase_length: "09/2011 to 08/2021 = 120 months = 10 years (a count)"
    guarantee_over_phase: "604.000 x 10 = 6.040.000 Euro nominal vs investment 3.000.000 Euro: ratio 2,0"
    contribution_share: "1.200.000 / 3.000.000 = 40 % of the investment (not printed)"
    budget_relief_reading: "604.000 - 317.000 = 287.000 Euro/yr, only if 'Haushaltsentlastung' = guarantee minus fee; undefined, not used"
    pre_phase: "signature 07/2010 to start of the guarantee phase 09/2011 = 14 months (a count; the page says 'Die Garantiephase hat im September 2011 begonnen')"
  links:   # R-A17 (architect, 6 Oct): which recorded figure sizes which promise; configuration, read by oe.census.printability
  - {evidence: 'the case prints the construction-cost contribution the client pays: "Baukostenzuschuss: 1,2 Mio. Euro" [DENA | Weitere Daten]', figure: baukostenzuschuss, promise: c3, sizes: amount}
  - {evidence: "investment printed once (investment); c1 is the deal's only candidate; one performance promise carries outlay and savings, not two legs", figure: investment, origin: "linked by rule single outlay promise", promise: c1, promise_kind: performance_promise, sizes: outlay, period: once, scale: 1, scale_rule: "printed in full (no scale in the key)", currency: EUR}
  - {evidence: "guaranteed_savings_per_period printed once (guaranteed_savings); c1 is the deal's only candidate; one performance promise carries outlay and savings, not two legs", figure: guaranteed_savings, origin: "linked by rule single savings promise", promise: c1, promise_kind: performance_promise, sizes: savings, period: year, scale: 1, scale_rule: "printed in full (no scale in the key)", currency: EUR}
  engine_inputs:   # R-A38 (2): written by program from numbers.links; edit the links, then re-run
    origin: derived from numbers.links by oe.census.inputs_from_links
    term_years:
      value: 10
      from: numbers.performance_phase
      rule: 120 months in the printed range / 12
    legs:
    - promise: c3
      leg: funding
      amount: baukostenzuschuss
      evidence: '''Baukostenzuschuss: 1,2 Mio. Euro'' [DENA | Weitere Daten] (linked by hand, R-A17)'
      start_year: 0
    - promise: c1
      leg: outlay
      amount: investment
      evidence: '''Investition: 3,0 Mio. Euro'' [DENA | Basisdaten] (linked by rule single outlay promise)'
      start_year: 0
    - promise: c1
      leg: savings
      amount: guaranteed_savings
      evidence: '''Einspargarantie: 604.000 Euro pro Jahr (31,1 Prozent)'' [DENA | Basisdaten] (linked by rule single savings promise)'
    dated_legs: []
    not_booked: []
    not_linked: []
    missing:
    - promise: c2
      what: c2 amount not printed
      evidence: engine/out/r2_census/census.csv
    calendar:
      anchor: '2011-09-01'
      cycle: P1Y
      status: derived
      flagged: false

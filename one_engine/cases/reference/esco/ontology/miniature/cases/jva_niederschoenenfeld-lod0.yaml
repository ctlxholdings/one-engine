rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when:
      client_sector: public
      jurisdiction: EU general government at close
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments forecast over the EPC + (b) any government financing not
      repayable by the Partner (an upfront grant or capital contribution at face value), else ON the government balance sheet (E15 L2578-2582)
    applies_here: true
    this_case: 'Applies (public client, Germany EU member at close). Outcome undetermined: operational payments and discount rate unpublished. The client''s 405.000
      EUR contribution is the Authority''s capital contribution: it counts on side (b) as non-repayable government financing at face value (E15 Box 7, L5424-5429;
      L5466-5470), not on the operational-payment side. Theme 14.1 share: 405.000 / 1.500.000 = 27,0 % of capex (21,3 % if on top), in the band ''one third or less
      but more than 10%'' = HIGH importance (E15 L5350-5353). Undiscounted: 180.000 x 10 = 1.800.000 EUR; less 405.000 leaves 1.395.000 EUR as the undiscounted ceiling
      for operational payments (not an NPV test)'
    source: 'E15 L2576-2582 (NPV basis); L5424-5429 (Box 7: the Authority''s capital contribution counted as government financing); L5466-5470 (milestone payments
      count); deal figures from the dena entry'
  IFRS16_lease_test:
    scope: accounting
    applies_when:
      client_sector: private
      asset_owner: not client
    rule: Is the client's contract a service agreement or a lease under IFRS 16? Applies when the client is private and someone other than the client owns the installed
      assets
    applies_here: false
    this_case: client_sector public; asset_owner client (default)
    source: RULINGS.md ruling 7; E02 L3293-3295

rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, client_eu_general_government_at_close: true}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments + (b) non-repayable government financing, else ON BALANCE SHEET for government (E15 L2576-2582)
    applies_here: true
    this_case: "Applies under the ruling (public client, EU, gg flag inferred true; doubtful, see jurisdiction). Outcome undetermined: payments not published. The page itself signals the test would be tight: the guarantee does not cover the investment alone, hence the annual top-up (c4); 520.000 x 12 = 6,24 Mio. EUR nominal vs 5,3 Mio. EUR investment before financing and service costs"
    source: E15 L2576-2582, L6930-6943; RULINGS #3
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: [partner, lessor, vehicle]}
    rule: Is the client's contract a service agreement or a lease under IFRS 16? Private counterpart of C1
    applies_here: false
    this_case: "client public (inferred) and asset_owner client (default). If the client were private, still off while asset_owner stays client"
    source: E02 L3293-3295; batch2/review/verdict.md change 2


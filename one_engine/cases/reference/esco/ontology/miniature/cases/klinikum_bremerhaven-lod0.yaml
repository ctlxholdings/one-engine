  c2:
    family: payment_promise
    from: klinikum
    to: siemens
    status: stated
    what: "pays the contractor out of the saving: the investment is 'zu einem überwiegenden Teil ... aus den eingesparten Energiekosten refinanziert' [DENA | narrative]. Rate and formula not printed"

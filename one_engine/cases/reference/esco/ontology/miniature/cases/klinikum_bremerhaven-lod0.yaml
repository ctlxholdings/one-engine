  budget_relief_eur_per_year: {value: 274972, quote: "Haushaltsentlastung: 274.972 Euro pro Jahr", note: not defined on the page}
  co2_saving: {t_per_year: 4100, percent: 37.0, quote: "4.100 Tonnen pro Jahr (37,0 Prozent)"}
  contract_signed: '2006-01-01'
  performance_phase: 05/2007 to 04/2019
  works_months: {value: 12, quote: "zwölf Monate lang bei laufendem Betrieb saniert"}
  floor_area_m2_bgf: 64000
  baseline_consumption: {district_heat_mwh: 11360, district_steam_mwh: 8692, electricity_mwh: 9336, water_m3: 131541}
  merkmale_bands: {base_energy_costs: "über 1 Mio. Euro pro Jahr", investment: "über 2 Mio. Euro", chp: nein, baukostenzuschuss: ja, pool: nein, auftraggeber: sonstige}
  derived:
    guarantee_share: "520.000 / 2.100.000 = 24,76 % vs 25,2 % printed; closes if the base is 520.000 / 0,252 = 2.063.492 EUR, which prints as '2,1 Mio.'. Rounding, not an error"
    achieved_saving_eur: "0,347 x 2.063.492 = about 716.000 EUR/yr (or 0,347 x 2,1 Mio. = 728.700): above the narrative's 'mehr als eine halbe Million' and about 196.000 EUR/yr over the guarantee. Consistent"
    phase_length: "05/2007 to 04/2019 = 144 months = 12 years"
    build_period: "01.01.2006 to 05/2007 = 16 months from signing; the page states 12 months of works, so about 4 months of preparation"
    guarantee_vs_investment: "5.300.000 / 520.000 = 10,2 years simple payback inside a 12-year phase; 520.000 x 12 = 6,24 Mio. = 1,18 x investment, thin before financing and service: consistent with the stated annual top-up"
    budget_relief_vs_guarantee: "274.972 / 520.000 = 52,9 %; vs the achieved ~716.000, 38 %. Undefined field: no fee derived"
    baseline_energy_mwh: "11.360 + 8.692 + 9.336 = 29.388 MWh/yr (heat, steam, power), excluding water"


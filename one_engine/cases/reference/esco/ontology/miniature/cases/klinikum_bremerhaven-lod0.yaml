source:
  id: DENA
  title: "Anwendungsbeispiele von Energiespar-Contracting (entry 'Klinikum Bremerhaven Reinkenheide')"
  publisher: dena (Deutsche Energie-Agentur), Kompetenzzentrum Contracting
  passage: "https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | Klinikum Bremerhaven Reinkenheide: narrative, Basisdaten, Projektbeteiligte, Weitere Daten, Weitere Kennwerte, Maßnahmen, Merkmale"
  oracle: "Basisenergiekosten 2,1 Mio. EUR/yr; Einspargarantie 520.000 EUR/yr (25,2 %); Erreichte Energiekosteneinsparung 34,7 %; Investition 5,3 Mio. EUR; Haushaltsentlastung 274.972 EUR/yr; CO2 4.100 t/yr (37,0 %); narrative 'mehr als eine halbe Million Euro' saved. Re-computed in numbers.derived"
  context:
  - "Berliner Energieagentur GmbH: listed under 'Beratung' [DENA | Projektbeteiligte]. Energy agency with no stated promise: context (REVIEW_SPEC_5 ruling; Y had it as facilitator)"
  - "District-heat supplier (unnamed): the top-up is partly covered 'durch eine mit dem Projekt verbundene Vertragsänderung beim Fernwärmebezug' [DENA | narrative]. A separate supply contract outside the ESC; no promise to the ESC parties"
  - "Stadt Bremerhaven: owner of the client, 'in kommunaler Trägerschaft der Seestadt Bremerhaven' [KBR | Über uns]. Not a party; supports client_sector public"
  - "dena: publisher; no promise"
  notes:
  - "'Auftraggeber: sonstige' [DENA | Merkmale]: dena does not class the client as Land, Kommune or Bund. The client is a gGmbH (a non-profit limited company); public ownership comes from the hospital's own site, today, not from dena and not dated 2006"
  - "Contradiction on the page: Merkmale 'Bundesland: Niedersachsen', while Bremerhaven belongs to the Land Bremen (the Bremen state hospital register lists it under 'Krankenhäuser im Land Bremen', krankenhauswegweiser.bremen.de). No LOD 0 value depends on it"
  - "'Aufschaltung der GLT auf Leitwarte des Contractors' [Maßnahmen]: the contractor monitors the building controls remotely during the contract; LOD 1 operation detail"
  - "Not on the page: rate formula, the top-up amount, the Baukostenzuschuss amount, penalties, M&V method and verifier, who kept the excess saving"


    what: "establishes the achieved saving against the guarantee (F21). A result is published, 'Erreichte Energiekosteneinsparung: 34,7 Prozent' [Basisdaten], but no verifier is named, so unstated per the ruling"
    established_by: esc_contract
  c4:
    family: payment_promise
    from: klinikum
    to: siemens
    status: stated
    what: "annual top-up for the share savings do not cover: 'für den verbleibenden Anteil eine jährliche Zuzahlung des Klinikums erforderlich' [DENA | narrative]. Payee read as the contractor (the remaining share of its investment); amount not printed"

conventions_applied:   # what this file assumes beyond elements.yaml
- id: B5-advisers
  title: advisers and energy agencies are context
  convention: "dena, Berliner Energieagentur, KEA-BW, eta, CDM Consult are source.context unless the source states a promise by them"
  origin: REVIEW_SPEC_5 rulings
  applied_here: "KEA-BW in source.context"
- id: B5-BKZ
  title: Baukostenzuschuss is the client's payment
  convention: "A Baukostenzuschuss the client pays or co-funds is the client's payment promise to the Partner (inferred if only flagged 'ja'); grant_recipient none unless a named giver that is neither client nor Partner gives non-repayable money"
  origin: REVIEW_SPEC_5 rulings
  applied_here: "c3 inferred; grant_recipient none (inferred)"
- id: F02
  title: jurisdiction header, C1 trigger
  convention: "Jurisdiction dated at financial close; German public client = EU general government, stated when a public body is named; C1 outcome undetermined when payments are not published"
  origin: RULINGS.md ruling 4; REVIEW_SPEC_5 rulings
  applied_here: "true, stated; C1 applies, outcome undetermined"
- id: F05
  title: provider's own capital inside performance_promise
  convention: "Under one service contract the provider's own capital sits inside its performance_promise"
  origin: ENCODING.md
  applied_here: "any own funding inside c1"
- id: F21
  title: determination_promise required
  convention: "A determination_promise is required when a payment depends on savings; from the literal unstated when no verifier is named"
  origin: ENCODING.md; REVIEW_SPEC_5 rulings
  applied_here: "c4 from unstated"
- id: ENC
  title: fallbacks when the source is silent
  convention: "Silent settings take the ENCODING.md fallback with status default"
  origin: ENCODING.md
  applied_here: "borrower, receivable_holder, collection_placement, debt_seniority, assignment_recourse, savings_basis, asset_owner, bill_custody"


  derived:
    savings_pct_check: "119.000 / 173.000 = 68,79 %, printed 68,8 % (closes)"
    performance_phase_length: "01/2010 to 06/2016 = 78 months = 6,5 years (a count)"
    guarantee_over_phase: "119.000 x 6,5 = 773.500 Euro nominal"

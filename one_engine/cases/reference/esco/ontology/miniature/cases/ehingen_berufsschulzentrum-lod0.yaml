# Miniature — Berufsschulzentrum Ehingen guaranteed-savings energy-saving contract (Siemens), Alb-Donau-Kreis, expressed at ESCO LOD 0
#
# Batch 5, pair A, reviewer's reconciled file (writers X and Y encoded blind; decisions in ../decisions.json).
# Evidence: one dena project record, re-fetched 1 Oct 2026 by the reviewer (curl, read as text); every quote below was matched
# against that text. Cited '[DENA | <section>]', quotes of 25 words or fewer, German number format kept as printed.
#   [DENA] https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/
#          dena, 'Anwendungsbeispiele von Energiespar-Contracting', entry 'Berufsschulzentrum Ehingen'.
# The page is a project summary, not the contract. Every fact carries its status: stated / inferred / default / unstated.

miniature: ehingen_berufsschulzentrum
lod: 0
case: batch5.D04
case_kind: deal   # one named contract, signed 01.03.2009
in_scope: true
in_scope_why: "The contractor guarantees an annual saving to a rural district: 'Einspargarantie: 119.000 Euro pro Jahr (68,8 Prozent)' [DENA | Basisdaten], under 'Energiespar-Contracting'. A guaranteed-savings contract meets the EED energy performance contracting test (E02 L556-560). The high ratio comes from replacing oil and gas boilers with a wood-chip boiler"

tests_unused:   # CASE_SPEC_5 unused items; none is forced in
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "The page lists client, adviser and contractor only; nothing is sold on or securitised"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No debt and no hedge are described"
- item: authority_guarantor
  kind: role
  used: false
  reason: "No guarantee of the client's payments; the only guarantee on the page is the contractor's savings guarantee"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "Title is not stated; asset_owner is the default client. No lessor or fund appears"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The guarantee is a savings amount in EUR per year, not an availability, output or comfort level"

source:   # where the facts come from; context = actors outside the deal boundary (F23); notes = observations that are not gaps
  id: DENA
  title: "dena Kompetenzzentrum Contracting, 'Anwendungsbeispiele von Energiespar-Contracting', entry 'Berufsschulzentrum Ehingen'"
  publisher: Deutsche Energie-Agentur GmbH (dena)
  passage: "https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | entry 'Berufsschulzentrum Ehingen' (text, Basisdaten, Projektbeteiligte, Weitere Daten, Maßnahmen, Merkmale)"
  oracle: "the printed ratio Einspargarantie / Basisenergiekosten (68,8 Prozent) is re-computed in numbers.derived"
  context:
  - "KEA Klimaschutz- und Energieagentur Baden-Württemberg GmbH is listed under 'Beratung' (adviser) with no promise stated: context (batch-5 ruling on advisers and energy agencies)"
  notes:
  - "Baukostenzuschuss: 'Baukostenzuschuss: 462.000 Euro' [DENA | Weitere Daten] and 'mit Baukostenzuschuss: ja' [DENA | Merkmale]; no giver, payee or budget is named. Under the batch-5 ruling it is the client's own payment to the Partner, inferred (c3); grant_recipient none. X had grant_recipient client, Y a benefit_promise from unstated to the contractor; both overruled (decisions.json)"
  - "The guarantee does not amortise the investment on its own: 119.000 x 6,5 years = 773.500 Euro nominal, against 1.700.000 - 462.000 = 1.238.000 Euro net of the contribution (62,5 %). The page does not say what covers the rest (savings above the guarantee, further client payments, avoided boiler replacement). Not encoded"
  - "One property ('Anzahl Liegenschaften: 1') with '7 große Gebäude mit 3 Heizzentralen' [DENA | Liegenschaft(en)]; 'Pool-Projekt: nein'"
  - "The Merkmale band 'Investition: 500.000 bis 2 Mio. Euro' is a range; the Basisdaten figure 1,7 Mio. Euro is used"
  - "The page gives no fee formula, no shortfall rule, no financier and no M&V party"

jurisdiction:   # header field, not a setting (F02); dated at financial close
  country: Germany
  iso: DE
  eu_member: true
  client_eu_general_government_at_close: true
  as_of: "contract signed 01.03.2009: 'Vertragsschluss: 01.03.2009' [DENA | Weitere Daten]"
  status: stated
  why: "The source names a public body: the Alb-Donau-Kreis (a Landkreis), typed 'Auftraggeber: Kommune' [DENA | Merkmale]. Germany was an EU member in 2009"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: the energy-saving contract establishes (fibo-fnd-rel-rel:confers) its commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 37 (a list = several roles, home role first; F13); groups computed from the role(s)
  alb_donau_kreis:
    entity: alb_donau_kreis
    role: authority
    groups: [demand, public]
    status: stated
    name: Alb-Donau-Kreis, Fachdienst Finanzen, Schulen, Liegenschaften, Ulm
    text: "listed as 'Auftraggeber' [DENA | Projektbeteiligte]; 'Auftraggeber: Kommune' [DENA | Merkmale]"
  siemens:
    entity: siemens_ag
    role: partner_esco
    groups: [partner]
    status: stated
    name: Siemens AG, Siemens Deutschland, Building Technologies Division, Frankfurt am Main
    text: "listed as 'Contractor' [DENA | Projektbeteiligte]; builds the heat plant and guarantees the savings. No subcontractor is named, so no epc_contractor party"

contract:   # the agreements that establish the commitments
  esc_contract:
    core: contract
    parties: [alb_donau_kreis, siemens]
    status: stated
    note: "'Contracting-Modell: Energiespar-Contracting' [DENA | Basisdaten]; 'Vertragsschluss: 01.03.2009'; 'Hauptleistungsphase: 01/2010 bis 06/2016' [DENA | Weitere Daten]. Title and clauses are not on the page"

commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: performance_promise
    from: siemens
    to: alb_donau_kreis
    status: stated
    what: "installs 'Einbau eines 360 kW Holzhackschnitzelkessels' with buffer storage, a 900 kW oil low-temperature boiler for peaks and reserve, a wood-chip bunker, a heat line linking three school buildings, three thermal solar plants, ca. 800 luminaires and new controls [DENA | Maßnahmen]; guarantees 'Einspargarantie: 119.000 Euro pro Jahr (68,8 Prozent)' [DENA | Basisdaten], 01/2010-06/2016. Any own funding of the 'Investition: 1,7 Mio. Euro' sits inside this promise (F05)"
    established_by: esc_contract
  c2:
    family: payment_promise
    from: alb_donau_kreis
    to: siemens
    status: inferred
    what: "pays the contractor during the performance phase. Inferred from the contracting model; amount and formula are not printed"
    established_by: esc_contract
  c3:
    family: payment_promise
    from: alb_donau_kreis
    to: siemens
    status: inferred
    what: "upfront construction-cost contribution: 'Baukostenzuschuss: 462.000 Euro' [DENA | Weitere Daten]. Payer and payee are not printed; the client's own payment to the contractor under the batch-5 Baukostenzuschuss ruling (inferred, flag 'ja' only)"
    established_by: esc_contract
  c4:
    family: determination_promise
    from: unstated
    to: [alb_donau_kreis, siemens]
    status: unstated
    determines: savings   # achieved savings against the guarantee
    what: "establishes the achieved savings against the guarantee (F21). The page names no verifier and no method"
    established_by: esc_contract


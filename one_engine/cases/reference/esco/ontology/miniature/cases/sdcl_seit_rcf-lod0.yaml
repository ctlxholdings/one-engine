# Miniature — SDCL Efficiency Income Trust plc: the holding-level Investec RCF over the portfolio, with Primary Energy's
# Cokenergy waste-gas project as the deal under the wrapper, expressed at ESCO LOD 0
#
# Batch 3, RECONCILED by the batch-3 adjudicator from writers P and Q (base Q; rulings in batch3/review/decisions.json).
# Writer Q's text below, with two misattributed RNS quotes corrected. Shape copied from batch2/final/*-lod0.yaml (normalised 1 Oct 2026).
# Frame: model/elements.yaml LOD 0 block (41 roles, 7 commitment families, 12 settings; owner rulings 28 Sep 2026).
# Every fact carries its status: stated / inferred / default / generic / unstated. Nothing from memory.
# Evidence is public web documents, cited '<url> | <page or section>' with exact quotes of 25 words or fewer:
#   [AR25]  https://www.seitplc.com/wp-content/uploads/2025/06/SEIT-AR25-Web-1.pdf  (Annual Report to 31 Mar 2025; primary).
#           Read from WebFetch's automatic cache with pdftotext to stdout; 'p.N' = PDF page index (printed folio = N-2).
#   [RNS-SEP26] https://www.tradingview.com/news/reuters.com,2026-09-30:newsml_RSd8639Wa:0-reg-sdcl-efficiency-inc-company-update/
#           ('REG - SDCL Efficiency Inc. - Company Update', 30 Sep 2026; the company's regulatory announcement as carried by Reuters; primary text)
#   [RNS-JUN26] https://www.investegate.co.uk/announcement/rns/sdcl-efficiency-income-trust--seit/results-for-the-year-ended-31-march-2026/9635404
#           (Results for the year ended 31 Mar 2026, 25 Jun 2026; primary). Both RNS were read through WebFetch's summariser:
#           quotes from them are as returned and were re-requested once; where two fetches differed, only the common words are quoted.

miniature: sdcl_seit_rcf
lod: 0
case: batch3.sdcl_seit_rcf
case_kind: deal
in_scope: true
in_scope_why: "Primary Energy 'provides energy efficiency solutions to two US steel mills through three energy recycling projects' [AR25 p.27]; Cokenergy turns the mill's waste gas into power and steam [AR25 p.28]: industrial waste-energy recovery sold under a long-term contract (energy supply contracting, an ESCO model besides the savings-guarantee EPC). The wrapper role tested here does not depend on which project is chosen"   # a named, signed facility (Investec RCF) over a portfolio; the deal under the wrapper is one project contract, Cokenergy's PPA with Cleveland-Cliffs

tests_unused:   # which of the still-unused LOD 0 items this case was chosen to test
- item: wrapper_creditor
  kind: role
  used: true
  reason: "'The Company is the guarantor of the RCF between Holdco and Investec Bank plc' [AR25 p.134 note 17]; the RCF lenders required 'disposal proceeds to be used to permanently reduce the facility' and proceeds are 'expected to be applied first towards RCF debt repayment ... before cash is returned to shareholders' [RNS-SEP26]. A creditor of the holding entity over the pool, paid ahead of equity from pool cash: the definition fits exactly"
- item: equity_investor
  kind: role
  used: true
  reason: "the listed shareholders own 1,085,419,558 fully paid ordinary shares [AR25 p.131]; notifiable holders include 'General Atlantic Partners' at 16.15% [AR25 p.105]. Also SEIT (owner of Holdco) and Holdco (owner of the project company) carry equity_investor"
- item: fund_manager
  kind: role
  used: true
  reason: "'has appointed SDCL as Investment Manager ... to manage the portfolio of investments on its behalf' [AR25 p.2]; 'the Investment Manager is the Company's AIFM' [AR25 p.134]"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "hedges exist but no counterparty is named: the refinanced RCF has 'rolling interest rate caps' [AR25 p.13], and Primary Energy keeps 'the long-term interest rate swaps currently in place' [AR25 p.38]. The spec allows the role only for a named counterparty; recorded in lod0_gaps as an evidence gap"
- item: surety_guarantor
  kind: role
  used: true
  reason: "'The Company is a guarantor to the RCF but has no other guarantees or commitments' [AR25 p.106]. Not on the spec's list; exercised because the source states it"

source:   # where the facts come from; context = actors outside the deal boundary (F23); notes = observations that are not gaps
  id: AR25
  title: SEIT Annual Report 2025 (year to 31 March 2025)
  publisher: SDCL Efficiency Income Trust plc, June 2025
  passage: "https://www.seitplc.com/wp-content/uploads/2025/06/SEIT-AR25-Web-1.pdf | p.2 'Company Structure'; p.27-29 'Primary Energy'; p.38 'Consolidated Gearing'; p.105 'Significant Voting Rights'; p.106, p.121 going concern; p.131-134 notes 13-17"
  secondary:
  - id: RNS-SEP26
    title: REG - SDCL Efficiency Inc. - Company Update
    publisher: SDCL Efficiency Income Trust plc via Reuters/TradingView, 30 Sep 2026
    passage: "https://www.tradingview.com/news/reuters.com,2026-09-30:newsml_RSd8639Wa:0-reg-sdcl-efficiency-inc-company-update/ | RCF paragraphs"
  - id: RNS-JUN26
    title: Results for the year ended 31 March 2026
    publisher: SDCL Efficiency Income Trust plc via Investegate, 25 Jun 2026
    passage: "https://www.investegate.co.uk/announcement/rns/sdcl-efficiency-income-trust--seit/results-for-the-year-ended-31-march-2026/9635404 | highlights; Primary Energy"
  oracle: none
  notes:
  - "Representative project chosen: Primary Energy's Cokenergy project (Indiana, USA), c.53% of Primary Energy's revenues: 'the project receives waste gas and converts it to power and steam to sell to CC's BF #7 through a long-term PPA that is index linked' [AR25 p.28]. Chosen over RED-Rochester (a regulated district-energy utility with 120+ tariff customers) because Primary Energy is described as 'energy recycling' and 'process efficiency' with one named offtaker, the nearest to an ESCO energy-service contract"
  - "Primary Energy is the portfolio company holding five projects; the AR gives its debt and O&M at that level, not per project. The Partner is therefore recorded as 'Primary Energy (Cokenergy project)'"
  - "Wind-down: 'Post year end publication of a shareholder Circular proposing a managed wind-down of the Company' [RNS-JUN26]; context for why the RCF priority matters, not a commitment (quote corrected by the adjudicator)"
  - "Adjudicator: writer P chose RED-Rochester (district energy utility, 120+ customers on a regulated tariff). Not adopted: a regulated multi-customer utility is further from an ESCO contract than Cokenergy's single-offtaker waste-energy recovery. P's RED-Rochester encoding would use the same wrapper roles (wrapper_creditor, equity_investor, fund_manager, surety_guarantor) plus utility_supplier"
  - "The RCF is structurally junior to project debt (it sits at Holdco, above project-level loans of c.$155m at Primary Energy [AR25 p.27]) but senior to shareholders in the wind-down; see lod0_gaps"
  context:
  - "Other portfolio companies (RED-Rochester, Onyx, Oliva, Driva, etc.) are outside this deal; their project debts are listed in [AR25 p.38]"
  - "North Lake REC approval by 'the Public Utilities Commission of Ohio' [AR25 p.28] concerns another project of Primary Energy"
  - "The fund administrator in the structure chart [AR25 p.2] makes no promise in this deal"

jurisdiction:   # header field, not a setting (F02); dated at financial close (batch-2 verdict change 3)
  country: "United Kingdom (SEIT, Holdco, RCF) over a United States project (Indiana)"
  iso: GB / US
  eu_member: false
  client_eu_general_government: false
  as_of: "RCF refinanced to £240m in the year to 31 Mar 2025 [AR25 p.134]; Cokenergy contract renegotiated 2024 [AR25 p.29]"
  status: stated
  why: "'a closed-ended investment company incorporated in England and Wales' [AR25 p.2]; Primary Energy 'Asset location Indiana, USA' [AR25 p.27]. Neither is EU; C1 does not apply"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: the PPA, the project financing, the RCF, the parent guarantee, the investment management agreement and the share capital each establish (fibo-fnd-rel-rel:confers) their commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 41 (a list = several roles, home role first; F13); groups computed from the role(s)
  cleveland_cliffs:
    entity: cleveland_cliffs
    role: host
    groups: [demand]
    status: stated
    name: Cleveland-Cliffs ('CC')
    text: "'Counterparties/offtakers Cleveland-Cliffs (\"CC\"), US Steel (\"USS\")' [AR25 p.27]; Cokenergy sells power and steam 'to CC's BF #7' [AR25 p.28]. A private steel company ('sub-investment grade', [AR25 p.29])"
  primary_energy:
    entity: primary_energy
    role: partner_esco
    groups: [partner]
    status: inferred
    name: Primary Energy (Cokenergy project)
    text: "'Portfolio of on-site energy recycling, cogeneration and process efficiency projects' [AR25 p.27]; 'Primary Energy provides energy efficiency solutions to two US steel mills' [AR25 p.27]; O&M by 'Primary Energy, CC, USS' [AR25 p.27]. Inferred partner_esco: it builds, owns and operates and sells energy; no savings guarantee is stated"
  project_lenders:
    role: lender
    groups: [capital]
    status: stated
    text: "'a new five-year term loan and revolving credit facility to 2029' [AR25 p.28]; 'Project-level debt c.$155 million at 31 March 2025' [AR25 p.27]; not named"
  holdco:
    entity: seit_holdco
    role: equity_investor
    groups: [capital]
    status: stated
    name: SEIT Holdco Limited
    text: "'sole direct subsidiary and main investment vehicle, SEEIT Holdco Limited' [AR25 p.2]; 'The Holdco issues equity and loans to finance the projects' [AR25 p.120]; Primary Energy 'Direct equity (100% in four projects ...)' [AR25 p.27]. Alternative securitisation_vehicle (it holds the portfolio, but nothing says it is bankruptcy-remote)"
  investec:
    entity: investec_bank_plc
    role: wrapper_creditor
    groups: [capital]
    status: stated
    name: Investec Bank plc
    text: "'The Company is the guarantor of the RCF between Holdco and Investec Bank plc' [AR25 p.134]; disposal proceeds 'applied first towards RCF debt repayment' [RNS-SEP26]. The 2026 RNS speaks of 'RCF lenders' (plural); only Investec is named"
  seit:
    entity: seit_plc
    role: [equity_investor, surety_guarantor]
    groups: [capital, risk]
    status: stated
    name: SDCL Efficiency Income Trust plc
    text: "'The Company holds no other investments' than Holdco [AR25 p.2]; 'The Company is a guarantor to the RCF' [AR25 p.106]"
  shareholders:
    role: equity_investor
    groups: [capital]
    status: stated
    text: "listed on 'the London Stock Exchange's Main Market' [AR25 p.2]; 1,085,419,558 ordinary shares 'fully paid' [AR25 p.131]; largest notified holder General Atlantic Partners, 16.15% [AR25 p.105]"
  sdcl:
    entity: sdcl_llp
    role: fund_manager
    groups: [capital]
    status: stated
    name: Sustainable Development Capital LLP
    text: "'Sustainable Development Capital LLP (\"SDCL\") is an independent investment firm' [AR25 p.11 'Meet the Investment Manager']; 'The Investment Manager controls the actions of Holdco and its direct and indirect subsidiaries' [AR25 p.2]"

contract:   # the agreements that establish the commitments
  cokenergy_ppa:
    core: contract
    parties: [primary_energy, cleveland_cliffs]
    status: stated
    note: "'a long-term PPA that is index linked'; 'revenues are protected from demand fluctuations through a true-up mechanism' [AR25 p.28]; renegotiated in 2024 [AR25 p.29]. Term and price not published"
  project_financing:
    core: contract
    parties: [project_lenders, primary_energy]
    status: stated
    note: "term loan and RCF to 2029 [AR25 p.28]; 'Primary Energy is financed through a combination of a fully drawn term loan and revolving credit facilities at project level' [RNS-JUN26]. (Writer Q's 'no recourse to or guarantees from' quote is about RED-Rochester in the RNS, not Primary Energy; removed by the adjudicator)"
  project_equity:
    core: contract
    parties: [holdco, primary_energy]
    status: stated
    note: "'Direct equity' [AR25 p.27]; Holdco 'issues equity and loans to finance the projects' [AR25 p.120]"
  rcf:
    core: contract
    parties: [investec, holdco]
    status: stated
    note: "£240m, refinanced from £180m, to March 2028 with two one-year extension options [AR25 p.134]; lender conditions on the revised investment policy 'capping the facility at the current level' [RNS-SEP26]"
  parent_guarantee:
    core: contract
    parties: [seit, investec]
    status: stated
    note: "'The Company is the guarantor of the RCF' [AR25 p.134]"
  holdco_funding:
    core: contract
    parties: [seit, holdco]
    status: stated
    note: "equity and coupon-bearing loan notes; 'The loan notes accrue interest at 6%, are unsecured' [AR25 p.128]"
  share_capital:
    core: contract
    parties: [shareholders, seit]
    status: stated
    note: "ordinary shares, listed 11 Dec 2018 [AR25 p.2]"
  investment_management_agreement:
    core: contract
    parties: [sdcl, seit]
    status: stated
    note: "'Under the terms of the Investment Management Agreement, the Investment Manager will be entitled to a fee' [AR25 p.134]; revised from 1 Oct 2025 [RNS-JUN26]"

commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: performance_promise
    from: primary_energy
    to: cleveland_cliffs
    status: stated
    what: "converts CC's waste gas 'to power and steam to sell to CC's BF #7' [AR25 p.28]; operation by Primary Energy (O&M, [AR25 p.27]) inside this promise"
    established_by: cokenergy_ppa
  c2:
    family: payment_promise
    from: cleveland_cliffs
    to: primary_energy
    status: stated
    what: "PPA payments, 'index linked', 'protected from demand fluctuations through a true-up mechanism' [AR25 p.28]; Cokenergy is 'c.53% of revenues' of Primary Energy [AR25 p.28]"
    established_by: cokenergy_ppa
  c3:
    family: performance_promise
    from: cleveland_cliffs
    to: primary_energy
    status: stated
    what: "supplies the input: 'Fuel supply Waste gases from CC' [AR25 p.27]; 'the project receives waste gas' [AR25 p.28]"
    established_by: cokenergy_ppa
  c4:
    family: funding_promise
    from: project_lenders
    to: primary_energy
    status: stated
    funding_instrument: loan   # term loan and revolving credit facilities (AR25 p.27)
    what: "term loan and revolving credit facilities at project level, c.$155m at 31 Mar 2025 [AR25 p.27] (c.$149m in 2026, [RNS-JUN26]); recourse to SEIT not stated for Primary Energy"
    established_by: project_financing
  c5:
    family: payment_promise
    from: primary_energy
    to: project_lenders
    status: inferred
    what: "debt service; inferred from the term loan, with 'long-term interest rate swaps currently in place' [AR25 p.38]"
    established_by: project_financing
  c6:
    family: funding_promise
    from: holdco
    to: primary_energy
    status: stated
    funding_instrument: equity   # direct equity in the projects (AR25 p.27)
    what: "direct equity in the projects [AR25 p.27]; 'The Holdco issues equity and loans to finance the projects' [AR25 p.120]"
    established_by: project_equity
  c7:
    family: payment_promise
    from: primary_energy
    to: holdco
    status: inferred
    what: "residual distributions: a project company 'provides target returns to Holdco and ultimately the Company' [AR25 p.2] (F07)"
    established_by: project_equity
  c8:
    family: funding_promise
    from: investec
    to: holdco
    status: stated
    funding_instrument: loan   # revolving credit facility (AR25 p.121)
    what: "£240m RCF; £234m drawn at 31 Mar 2025 [AR25 p.121], £233m at 31 Mar 2026 [RNS-JUN26], c.£188m at 30 Sep 2026 [RNS-SEP26]"
    established_by: rcf
  c9:
    family: payment_promise
    from: holdco
    to: investec
    status: stated
    what: "repayment ahead of equity: lenders required 'disposal proceeds to be used to permanently reduce the facility' [RNS-SEP26]; '£45 million of disposal proceeds applied to repay drawings' after the Kyotherm sale [RNS-JUN26]"
    established_by: rcf
  c10:
    family: risk_promise
    covers: []   # the source names no category; Holdco is the investor, not the Partner, so R5b (both drafts) does not fit (adjudicator X2)
    from: seit
    to: investec
    status: stated
    cover_kind: guarantee   # parent guarantee of the RCF (AR25 p.134)
    what: "parent guarantee of Holdco's RCF: 'The Company is the guarantor of the RCF between Holdco and Investec Bank plc' [AR25 p.134]"
    established_by: parent_guarantee
  c11:
    family: funding_promise
    from: seit
    to: holdco
    status: stated
    what: "'£7.0 million ... of funding was provided by the Company to the Holdco for investment acquisitions and the repayment of the RCF' [AR25 p.134]; equity and loan notes"
    established_by: holdco_funding
  c12:
    family: payment_promise
    from: holdco
    to: seit
    status: stated
    what: "interest on loan notes ('accrue interest at 6%', [AR25 p.128]; £3.9m accrued in the year [AR25 p.134]) and dividends to the Company"
    established_by: holdco_funding
  c13:
    family: funding_promise
    from: shareholders
    to: seit
    status: stated
    funding_instrument: equity   # share capital (AR25 p.131)
    what: "share capital: 1,085,419,558 ordinary shares, fully paid [AR25 p.131]"
    established_by: share_capital
  c14:
    family: payment_promise
    from: seit
    to: shareholders
    status: stated
    what: "dividends and, in the wind-down, return of cash, which comes only after RCF repayment: proceeds applied first to the RCF 'before cash is returned to shareholders' [RNS-SEP26] (F07 residual claim, stated here)"
    established_by: share_capital
  c15:
    family: agency_promise
    from: sdcl
    to: seit
    status: stated
    what: "'active discretionary investment management of the Company's portfolio' under the Investment Management Agreement [AR25 p.134]; controls Holdco and subsidiaries [AR25 p.2]"
    established_by: investment_management_agreement
  c16:
    family: payment_promise
    from: seit
    to: sdcl
    status: stated
    what: "'0.9% per annum of the adjusted NAV APM' up to £750m, 0.8% above [AR25 p.134]; £8.7m in the year to 31 Mar 2025 [AR25 p.134]; revised from 1 Oct 2025 [RNS-JUN26]"
    established_by: investment_management_agreement
  c17:
    family: payment_promise
    from: seit
    to: investec
    status: unstated
    what: "counter-promise required by duality; source silent (any fee for the parent guarantee is not stated; as the borrower's parent SEIT may give it for no fee, in which case its consideration is the funding of its own subsidiary)"
    established_by: parent_guarantee

settings:   # the 13 LOD 0 facets, in vocabulary order (payment_basis added 1 Oct, owner ruling)
  payment_basis: {value: supply, status: stated, why: "c2: Cleveland-Cliffs pays index-linked PPA payments for power and steam delivered, with a demand true-up (AR25 p.28)."}
  client_sector:
    value: private
    status: stated
    why: "Cleveland-Cliffs, a steel company, 'sub-investment grade' [AR25 p.29]"
  partner_form:
    value: spv
    status: inferred
    why: "'Holdco typically invests in project companies' structured 'so that they can be sold in an active secondary market' [AR25 p.2]; Holdco invests 'via individual corporate entities' [AR25 p.120]. Inferred for Primary Energy's projects"
  borrower:
    value: partner
    status: stated
    why: "'Primary Energy is financed through a combination of a fully drawn term loan and revolving credit facilities at project level' [RNS-JUN26]; also [AR25 p.28]"
  receivable_holder: {value: partner, status: default, why: "no assignment of the PPA receivable stated"}
  collection_placement: {value: operator_own, status: default, why: "not stated (project debt may require pledged accounts; not shown)"}
  aggregation:
    value: pool
    status: inferred
    why: "the project sits in a portfolio of project companies under one holding vehicle financed at holding level by the RCF [AR25 p.2, p.38]. Alternative none (the PPA itself stands alone)"
  debt_seniority:
    value: senior
    status: inferred
    why: "project debt is a term loan and RCF with no stated junior tranche [AR25 p.28]. The Holdco RCF is structurally junior to it but is wrapper debt, outside the deal's own capital stack (lod0_gaps)"
  assignment_recourse: {value: not_applicable, status: default, why: nothing assigned}
  savings_basis:
    value: measured
    status: default
    why: "no savings computation; the PPA pays for power and steam delivered, with a true-up against demand [AR25 p.28]"
  grant_recipient:
    value: none
    status: default
    why: "no grant for Cokenergy; its RECs are sold 'in the open market' [AR25 p.28], a sale, not support"
  asset_owner:
    value: partner
    status: inferred
    why: "'Direct equity (100% in four projects; 50% in PCI Associates)' [AR25 p.27]: the plant belongs to the project company; 'Primary Energy assets' [AR25 p.29]"
  bill_custody: {value: client, status: default, why: "not stated; CC buys power and steam from the project and keeps its other supply"}

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments + (b) non-repayable government financing, else ON BALANCE SHEET for government (E15 L2578-2582)
    applies_here: false
    this_case: private US client; UK holding
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: [partner, lessor, vehicle]}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? Private counterpart of C1 (trigger widened per batch-2 verdict change 2)"
    applies_here: true
    this_case: "triggered: a dedicated plant on the client's site ('our incumbent occupancy at the sites', [AR25 p.29]) owned by the Partner and paid through a PPA with a demand true-up. The source does not discuss the client's accounting (a US filer would test under ASC 842, not IFRS 16); not determinable"
    source: E02 L3293-3295; batch2/review/verdict.md change 2


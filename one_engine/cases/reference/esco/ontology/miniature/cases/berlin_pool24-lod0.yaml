  settings_by_status: {stated: 2, inferred: 3, generic: 0, default: 8}
  commitments_by_status: {stated: 1, inferred: 1, generic: 0, unstated: 1}
  one_way_parties: []
  parties_count: 2
  commitments_count: 3

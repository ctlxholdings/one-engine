  - {category: R1, driver: technical, bearer: [partner_esco], share: sole, status: stated, evidence: "cases/berlin_pool24-lod0.yaml:15", why: "the dena page prints SPIE's pool-wide savings guarantee ('Einspargarantie: 432.000 Euro pro Jahr (21 Prozent)'); equal to the default but stated. A and B agree (B had written the party id spie, corrected to the role)"}
  - {category: R2, driver: null, bearer: [partner_esco], share: sole, status: stated, evidence: "cases/berlin_pool24-lod0.yaml:93", why: "the page says the contractor also maintains the existing old plant ('Der Contractor ist zudem für die Instandhaltung der entsprechenden Altanlagen zuständig'), for which the client pays a top-up; equal to the default but stated. A and B agree"}

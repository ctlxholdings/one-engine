set_aside:
  "EXHIBIT 9.5 Completed Forecast of the Income Statement": the exhibit's number
  "percent 2009": column heading, a year
  "2010 $ million 2009": column headings, years
  "2010": column heading, a year
  "EXHIBIT 9.6 Historical Balance Sheet": the exhibit's number
  "2008 2009 2008 2009": the column headings, years
  "EXHIBIT 9.7 Forecast of Reported Taxes": the exhibit's number
  "2009": column heading, a year
  "EXHIBIT 9.10 Partial Forecast of the Balance Sheet": the exhibit's number
  "Forecast ratio 2009": column heading, a year
  "EXHIBIT 9.11 Statement of Retained Earnings": the exhibit's number
  "2008 2009": the column headings, years
  "EXHIBIT 9.12 Forecast Balance Sheet: Sources of Financing": the exhibit's number
  "2008 2009 2010": the column headings, years
case:
  case: valuation-chapter-9-forecast
  periods: 3
  phases: [operate]
  currency: USD
  floors: {}
  generators:
    model:
      kind: valuation_formulas
      periods: 3
      inputs: exhibit
      values:
        days_in_year: 365
        # ── the income statement: 2009 as printed, 2010 from the 2009 ratios ──
        revenue: revenues + (revenues__1 * (1 + revenue_growth__1) if t == 2 else 0)
        cogs_line: cogs + (cogs__1 / revenues__1 * revenue if t == 2 else 0)
        sga_line: sga + (sga__1 / revenues__1 * revenue if t == 2 else 0)
        ppe_balance: net_ppe + (net_ppe__1 / revenues__1 * revenue if t == 2 else 0)
        # the driver of depreciation, lagged by the printed subscript (t-1)
        ppe_driver: lag(ppe_balance, -depreciation_lag__1)
        depreciation_rate_2009: (-depreciation / ppe_driver) if t == 1 else 0
        depreciation_line: depreciation + (-lag(depreciation_rate_2009, 1) * ppe_driver if t == 2 else 0)
        ebita_line: revenue + cogs_line + sga_line + depreciation_line
        debt_balance: short_term_debt + long_term_debt + (short_term_debt__1 + long_term_debt__1 if t == 2 else 0)
        interest_rate_2009: -interest_expense__1 / (short_term_debt__0 + long_term_debt__0)
        interest_expense_line: interest_expense + (-interest_rate_2009 * lag(debt_balance, 1) if t == 2 else 0)
        # 2009 excess cash, what the 2009 balance sheet leaves after every other line (for 2010's interest income)
        net_income_2009: >-
          revenues__1 + cogs__1 + sga__1 + depreciation__1 + interest_expense__1 + interest_income__1
          + nonoperating_income__1 + provision__1
        retained_earnings_2008: starting_re_2008__0 + net_income_2008__0 + dividends__0
        excess_cash_2009: >-
          accounts_payable__1 + short_term_debt__1 + long_term_debt__1 + common_stock__1
          + retained_earnings_2008 + net_income_2009 + dividends__1
          - operating_cash__1 - inventory__1 - net_ppe__1 - equity_investments__1
        excess_cash_balance: excess_cash_2008 + (excess_cash_2009 if t == 1 else 0)
        interest_income_rate_2009: interest_income__1 / excess_cash_2008__0
        interest_income_line: interest_income + (interest_income_rate_2009 * excess_cash_2009 if t == 2 else 0)
        nonoperating_line: nonoperating_income + (nonoperating_income__1 * (1 + nonoperating_growth__1) if t == 2 else 0)
        earnings_before_taxes_line: ebita_line + interest_expense_line + interest_income_line + nonoperating_line
        # taxes: the 2009 operating rate backed out of the provision; nonoperating items at the statutory rate
        operating_tax_rate_2009: >-
          (-provision__1 - statutory_rate__1 * (interest_expense__1 + interest_income__1 + nonoperating_income__1))
          / (revenues__1 + cogs__1 + sga__1 + depreciation__1)
        operating_taxes: operating_tax_rate_2009 * ebita_line
        nonoperating_net: interest_expense_line + interest_income_line + nonoperating_line
        nonoperating_taxes: statutory_rate__1 * nonoperating_net
        provision_line: provision + (-(operating_taxes + nonoperating_taxes) if t == 2 else 0)
        net_income_line: earnings_before_taxes_line + provision_line
        # dividends: 2009's payout ratio on 2010 net income
        payout_history: (-dividends / (net_income_line + net_income_2008)) if t < 2 else 0
        dividends_line: dividends + (-lag(payout_history, 1) * net_income_line if t == 2 else 0)
        dividends_posted: dividends_line if t > 0 else 0
        retained_earnings_balance: retained_earnings_2008 + cumsum(net_income_line) + cumsum(dividends_posted)
        # ── the balance sheet: 2009 as printed, 2010 from the 2009 ratios ──
        # (a constant number of days of revenues is a constant share of them)
        operating_cash_balance: operating_cash + (operating_cash__1 / revenues__1 * revenue if t == 2 else 0)
        inventory_balance: inventory + (inventory__1 / cogs__1 * cogs_line if t == 2 else 0)
        payables_balance: accounts_payable + (accounts_payable__1 / cogs__1 * cogs_line if t == 2 else 0)
        equity_growth_2009: (equity_investments / lag(equity_investments, 1) - 1) if t == 1 else 0
        equity_investments_balance: >-
          equity_investments + (equity_investments__1 * (1 + lag(equity_growth_2009, 1)) if t == 2 else 0)
        short_term_debt_balance: short_term_debt + (short_term_debt__1 if t == 2 else 0)
        long_term_debt_balance: long_term_debt + (long_term_debt__1 if t == 2 else 0)
        common_stock_balance: common_stock + (common_stock__1 if t == 2 else 0)
        # step 2: assets excluding excess cash against the claims excluding newly issued debt
        assets_ex_cash: operating_cash_balance + inventory_balance + ppe_balance + equity_investments_balance
        claims_ex_new_debt: >-
          payables_balance + short_term_debt_balance + long_term_debt_balance + common_stock_balance
          + retained_earnings_balance
        # step 3: newly issued debt plugs a shortfall; otherwise excess cash (the books' residual) does
        newly_issued_debt: max(0, assets_ex_cash - claims_ex_new_debt) if t == 2 else 0
        # ── the moves that take each balance to its year-end level ──
        operating_cash_move: (operating_cash_balance - lag(operating_cash_balance, 1)) if t > 0 else 0
        inventory_move: (inventory_balance - lag(inventory_balance, 1)) if t > 0 else 0
        capex: (ppe_balance - lag(ppe_balance, 1) - depreciation_line) if t > 0 else 0
        equity_investments_move: (equity_investments_balance - lag(equity_investments_balance, 1)) if t > 0 else 0
        payables_move: (payables_balance - lag(payables_balance, 1)) if t > 0 else 0
        short_term_debt_move: (short_term_debt_balance - lag(short_term_debt_balance, 1)) if t > 0 else 0
        long_term_debt_move: (long_term_debt_balance - lag(long_term_debt_balance, 1)) if t > 0 else 0
        common_stock_move: (common_stock_balance - lag(common_stock_balance, 1)) if t > 0 else 0
        # ── the ratios each year shows, for comparison ──
        revenue_growth_shown: (revenue / lag(revenue, 1) - 1) if t == 2 else 0
        cogs_ratio_shown: (-cogs_line / revenue) if t > 0 else 0
        sga_ratio_shown: (-sga_line / revenue) if t > 0 else 0
        depreciation_ratio_shown: (-depreciation_line / ppe_driver) if t > 0 else 0
        ebita_ratio_shown: (ebita_line / revenue) if t > 0 else 0
        interest_rate_shown: (-interest_expense_line / lag(debt_balance, 1)) if t > 0 else 0
        interest_income_rate_shown: (interest_income_line / lag(excess_cash_balance, 1)) if t > 0 else 0
        nonoperating_growth_shown: (nonoperating_line / lag(nonoperating_line, 1) - 1) if t == 2 else 0
        operating_tax_rate_shown: (operating_taxes / ebita_line) if t > 0 else 0
        marginal_rate_shown: (nonoperating_taxes / nonoperating_net) if t > 0 else 0
        average_tax_rate_shown: (-provision_line / earnings_before_taxes_line) if t > 0 else 0
        payout_shown: -(dividends_line / (net_income_line + net_income_2008))
        cash_days_shown: (operating_cash_balance / revenue * days_in_year) if t > 0 else 0
        inventory_days_shown: (inventory_balance / -cogs_line * days_in_year) if t > 0 else 0
        payables_days_shown: (payables_balance / -cogs_line * days_in_year) if t > 0 else 0
        ppe_ratio_shown: (ppe_balance / revenue) if t > 0 else 0
        equity_growth_shown: (equity_investments_balance / lag(equity_investments_balance, 1) - 1) if t > 0 else 0
  opening:
    company:
      operating_cash: {nature: asset, value: {generator: model, output: operating_cash__0}}
      excess_cash: {nature: asset, value: {generator: model, output: excess_cash_2008__0}}
      inventory: {nature: asset, value: {generator: model, output: inventory__0}}
      net_ppe: {nature: asset, value: {generator: model, output: net_ppe__0}}
      equity_investments: {nature: asset, value: {generator: model, output: equity_investments__0}}
      accounts_payable: {nature: liability, value: {generator: model, output: accounts_payable__0}}
      short_term_debt: {nature: liability, value: {generator: model, output: short_term_debt__0}}
      long_term_debt: {nature: liability, value: {generator: model, output: long_term_debt__0}}
      common_stock: {nature: equity, value: {generator: model, output: common_stock__0}}
      retained_earnings: {nature: equity, value: {generator: model, output: retained_earnings_2008}}
  contracts: {}
  rulebooks:
    # each amount signed: a positive one debits the first account, a negative one is reversed
    years:
      kind: transfer
      entity: company
      phase: operate
      declare: {revenue: income, cogs: expense, sga: expense, depreciation: expense, interest_expense: expense,
                interest_income: income, nonoperating_income: income, tax_expense: expense,
                newly_issued_debt: liability}
      moves:
        revenue: {debit: excess_cash, credit: revenue, amount: {generator: model, output: revenue}}
        cogs: {debit: excess_cash, credit: cogs, amount: {generator: model, output: cogs_line}}
        sga: {debit: excess_cash, credit: sga, amount: {generator: model, output: sga_line}}
        depreciation: {debit: net_ppe, credit: depreciation, amount: {generator: model, output: depreciation_line}}
        interest_expense: {debit: excess_cash, credit: interest_expense,
                           amount: {generator: model, output: interest_expense_line}}
        interest_income: {debit: excess_cash, credit: interest_income,
                          amount: {generator: model, output: interest_income_line}}

# Valuation, Exhibits 9.5-9.7 and 9.10-9.12 (ch. 9, pp. 197-206): the chapter's hypothetical company, forecast one year.
#
# Six exhibits print one company's linked statements. 2008 and 2009 are
# history; 2010 is forecast. 9.5 is the income statement with its forecast
# worksheet, 9.6 the historical balance sheets, 9.7 the reported taxes split
# into operating and nonoperating, 9.10 the balance sheet with its forecast
# ratios (partly filled), 9.11 the statement of retained earnings, and 9.12
# the balance sheet completed with the plug. Periods 0, 1 and 2 are 2008,
# 2009 and 2010.
#
# The forecast follows the book's method (pp. 194-206). Each 2010 ratio is
# set to its 2009 value, computed from the history and kept unrounded.
# Revenues grow at the printed 2009 growth. COGS and SG&A are shares of
# revenues. Depreciation is a share of the prior year's net PP&E: the
# subscript "t-1" prints as -1, and that -1 is read and used as the lag.
# Interest expense is charged on the prior year's total debt, interest income
# earned on the prior year's excess cash, and nonoperating income grows at
# its printed growth. Operating taxes are the operating tax rate on EBITA. The
# 2009 rate is backed out of the provision as provision less the statutory
# rate on the net nonoperating items, over EBITA. Nonoperating taxes are the
# statutory rate on the net nonoperating items. Dividends are the 2009 payout
# ratio on net income. On the balance sheet, operating cash is in days of
# revenues and inventory and payables in days of COGS, all at 365 days (the
# calendar year's days). Net PP&E is a share of revenues, equity investments
# grow at their 2009 growth (nil), and debt and common stock are held.
# Retained earnings follow clean surplus, and newly issued debt is the plug
# when assets excluding excess cash exceed the other claims (9.12's step 3);
# otherwise excess cash is.
#
# The company is booked. The opening balance sheet is 2008's (9.6), with
# retained earnings from 9.11's 2008 roll-forward (36.0 + 36.0 - 16.0). Each
# year posts its income statement and dividends, then moves every balance
# but excess cash to its year-end level against excess cash: 2009 to the
# printed balances, 2010 to the forecast. Capital expenditures are the
# growth in net PP&E plus depreciation. So excess cash in both years is what
# the books leave, and the forecast's newly issued debt (nil here) is posted
# from the plug test. Every figure the six exhibits print is then read back
# and compared. Balances and income-statement lines come from the books.
# Ratios are the ratio each year actually shows, computed by the
# valuation_formulas generator, so a 2010 ratio is checked against the 2010
# forecast it describes, not copied from 2009.
excerpt: "9.5-7+9.10-12"
periods: [1, 2]
entity: company
plant: revenues
notes: >-
  The 2010 EBITA/revenues cell prints 35.8 (the 2009 value carried), but the exhibit's own 2010 EBITA and
  revenues give 102.3 / 288.0 = 35.5 percent; the prose on p. 200 instead quotes a 2010 EBITA of 103.2
  (35.8 percent of 288). Compared as the ratio of the printed statement; it fails, a book inconsistency.
  The caption "1 + 2 Provision for income taxes" prints the step number 2 as a figure (the 1 reads as a
  footnote mark); it is read as an input row and used for nothing.

# Valuation, Exhibit 11.12 (ch. 11, p. 262): TRACE trades in Home Depot's 5.875% bond due December
# 2036 on May 28, 2009, and the default premium read from them.
#
# Each trade prints its volume, clean price and yield to maturity. The yield is computed here from the
# price by the pack's bond_yield (semiannual coupons, clean price per 100 of face, a stub period
# accruing) and compared with the printed one. Years to maturity run from the trade date of the Source
# line to the maturity of the bond line. The maturity day is not printed: it is taken as the middle of
# December (the 15th) and stated here; any December day gives 55.0 to 55.2 semiannual periods, and
# every trade's computed yield moves by under 0.004 across them and stays within 0.0065 of the print.
# The bond yield the book uses is the large trades' (the prose, p. 262: trades of $1 million or more,
# a volume above 1000 in this $-thousand column): the mean of their printed yields, 7.616, printed 7.62.
# The default premium is that yield less the 30-year Treasury yield (printed negative, as subtracted).
# Each printed yield is therefore read twice: as an input to the large-trade mean, and as a figure
# compared with the yield computed from its price.

# Valuation, Exhibit 14.7 (ch. 14, pp. 323-324): enterprise value multiples when a company holds
# nonoperating assets or has minority shareholders.
#
# Three companies with the same core operations: A has only debt and equity;
# B also holds excess cash and a nonconsolidated stake; C has outside
# shareholders in a consolidated subsidiary. Only net enterprise value (the
# core operations) over EBITA gives the same multiple for all three (p. 323).
#
# Translated as a calculation, the lines read literally: debt plus equity is
# the debt and the market value of equity, minority interest not included.
# Company C's "Debt plus equity minus cash to EBITA" prints 9.0, but its lines
# give (300 + 500 - 0) / 100 = 8.0, the same as the next row, which prints 8.0
# for C. That cell is compared as computed and recorded as a book slip.

# Valuation, Exhibits 13.7 and 13.9 (ch. 13, pp. 305-308): ConsumerCo valued by segment, read with the
# segment data it rests on.
#
# 13.7 is a chart: the DCF value of each of ConsumerCo's three business units
# stacked into the cumulative segment valuation, each unit's share of revenues,
# and each unit's enterprise value over its EBITA (p. 305). 13.9 is the segment
# disclosure: revenues, operating profit and the rest by unit and for the
# corporate center (p. 308). 13.7's shares and multiples are 13.9's revenues
# and operating profits set against 13.7's values, so the two exhibits are one
# excerpt here (13.9 also stands alone as oracle 13.9).
#
# Translated as a calculation:
#   * 13.9: the four columns are inputs, and each consolidated cell is their
#     sum (as in oracle 13.9);
#   * 13.7: the three unit values are inputs (their DCFs are not printed). The
#     cumulative valuation is their sum; each revenue share is the unit's
#     revenues over consolidated revenues (the corporate center has none, so
#     the shares make 100%); each multiple is the unit's value over its
#     operating profit, taken as EBITA. The aggregate multiple is the
#     cumulative segment valuation over the three units' operating profit: the
#     valuation leaves the corporate center out, so its cost is left out of
#     the denominator too (over the consolidated 69.2 it would be 9.4).
# The chart's data labels stand on lines no label opens; they are read by line.

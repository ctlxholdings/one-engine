# Valuation, Exhibit 14.5 (ch. 14, pp. 320-321): why EBITDA multiples mislead when one company owns its
# equipment and the other outsources production.
#
# Company A makes its products on its own equipment; Company B buys from a
# supplier whose depreciation is in B's raw-material price. Their EBITA,
# NOPLAT, free cash flow and value are the same, but A's large depreciation
# makes its EBITDA larger and its EV-to-EBITDA multiple lower (pp. 320-321).
#
# Translated as a calculation: revenues, raw materials, operating costs,
# depreciation, operating taxes (no rate is printed), the investment in
# working capital, capital expenditures and enterprise value are inputs.
# EBITDA, EBITA, NOPLAT, the free-cash-flow panel (NOPLAT, depreciation added
# back, gross cash flow, free cash flow) and both multiples are computed and
# compared.
#
# The two panels share the text lines, so a label recurs: the free-cash-flow
# panel's NOPLAT and depreciation print before the income statement's.

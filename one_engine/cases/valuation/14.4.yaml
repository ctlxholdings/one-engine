# Valuation, Exhibit 14.4 (ch. 14, pp. 318-319): amortization of acquired intangibles distorts the
# EV-to-EBIT multiple.
#
# Three companies with the same operating economics before A buys B; after the
# purchase the combined A + B equals C except for the acquired intangibles
# (B's price over its book capital) and their amortization, which lower EBIT
# and raise the EV-to-EBIT multiple without any change in value (p. 319).
#
# Translated as a calculation: the before-acquisition columns are inputs,
# with the year's amortization of the acquired intangibles (its five-year life
# is prose). A + B is the sum of A and B; C after is C before; acquired
# intangibles are B's enterprise value less its organic capital. The EV-to-EBITA
# row is compared as its label means: enterprise value over EBIT before
# amortization. The book prints 5.0 in every column, which is enterprise value
# over revenues less cost of sales (EBITDA); EV over EBITA is 7.5 throughout.
# Those five cells are recorded as book slips.

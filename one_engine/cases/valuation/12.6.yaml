# Valuation, Exhibit 12.6 (ch. 12, pp. 286-288): Hasbro's equity value per share in November 2008,
# with its convertible bond valued three ways.
#
# One enterprise value, less the same traditional debt, unfunded pensions and
# employee options in each column, with the convertible bond taken at (1) its
# traded market value, (2) a Black-Scholes value (straight debt plus the
# conversion option, pp. 287-288), or (3) converted into shares, so the bond
# drops out and the new shares join the share count. A fourth column prints
# the debt lines at book value, for comparison only. Value per share is equity
# value over the share count: the undiluted count for the first two methods,
# the diluted one for conversion (p. 288).
#
# Translated as a calculation. The first column's lines are inputs, and the
# same lines printed in the other columns are compared with them (one
# enterprise value and one set of other claims serve every method). The
# Black-Scholes value of the bond and the new shares on conversion are inputs:
# the exhibit prints them as results, the conversion price and option inputs
# being in the prose. The book-value column, and the bond's coupon and
# maturity (printed in its label), enter no calculation the exhibit prints;
# they are inputs only. Equity values, diluted shares and values per share
# are computed and compared.

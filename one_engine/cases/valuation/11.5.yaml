# Valuation, Exhibit 11.5 (ch. 11, p. 245): U.S. stock, bond and excess returns averaged over holding
# periods of 1, 2, 4, 5 and 10 years, 1900-2009, and the excess return annualized.
#
# Each holding-period row is placed at the case period equal to its length in years (the row "4-year
# holding periods" at period 4), so the period index is the N of the row. The average cumulative
# returns (stocks, government bonds, excess) are inputs: they are averages of yearly data the book
# does not print, and the excess column is not stocks less bonds (1-year: 11.2 - 5.4 = 5.8, printed
# 6.1), so only the excess one feeds a computation. The annualized column is the cumulative excess
# return as an annual rate over N years, the pack's annualized(c, n) = (1 + c)^(1/n) - 1, compared.
# The Blume estimator column is read but not compared (see not_compared).

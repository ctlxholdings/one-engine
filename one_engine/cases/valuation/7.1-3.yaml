# Valuation, Exhibits 7.1-7.3 (ch. 7, pp. 136-139): the chapter's example company, one year on the books.
#
# The three exhibits print one company: its accountant's balance sheet for two
# years beside invested capital (7.1), its income statement beside NOPLAT (7.2),
# and its cash flow statement beside free cash flow (7.3). Here that company is
# booked, not restated:
#   * period 0 is the prior year: the accountant's prior-year balances (7.1) are
#     the opening balance sheet, which must balance on its own;
#   * period 1 is the current year: the accountant's income statement (7.2) and
#     cash flow statement (7.3) are posted as they print, each line a transfer
#     between cash (or net PP&E, for depreciation) and its account. Taxes are
#     not taken from the print: they are the footnote's 25% on earnings before
#     taxes, and the printed (66) is compared.
# Everything else the exhibits print is read back and compared: the
# current-year balance sheet, every subtotal of the three accountant's
# statements, and the whole reorganized side (invested capital, NOPLAT, free
# cash flow and both reconciliations) from the valuation lens over the books.
# Cash is classified as operating; the exhibit's company holds none, and the
# books end the year with none.
excerpt: "7.1-3"
periods: [0, 1]
entity: company
plant: revenues
notes: >-
  Exhibit 7.3 prints "equality investments" for equity investments on the accountant's side; the row
  is read as printed.
rows:
  # 7.1, the accountant's balance sheet (prior year in, current year compared)
  inventory_prior: {label: Inventory, periods: [0]}
  inventory: {label: Inventory, periods: [1], skip: 1}
  net_ppe_prior: {label: Net PP&E, periods: [0]}
  net_ppe: {label: Net PP&E, periods: [1], skip: 1}
  equity_investments_prior: {label: Equity investments, periods: [0]}
  equity_investments: {label: Equity investments, periods: [1], skip: 1}
  total_assets: Total assets
  accounts_payable_prior: {label: Accounts payable, occurrence: 2, periods: [0]}
  accounts_payable: {label: Accounts payable, occurrence: 2, periods: [1], skip: 1}
  debt_prior: {label: Interest-bearing debt, periods: [0]}
  debt: {label: Interest-bearing debt, periods: [1], skip: 1}
  common_stock_prior: {label: Common stock, periods: [0]}
  common_stock: {label: Common stock, periods: [1], skip: 1}
  retained_earnings_prior: {label: Retained earnings, periods: [0]}
  retained_earnings: {label: Retained earnings, periods: [1], skip: 1}
  total_liabilities_and_equity: Total liabilities and equity
  # 7.1, invested capital
  ic_inventory: {label: Inventory, occurrence: 2}
  ic_accounts_payable: {label: Accounts payable, occurrence: 1}
  operating_working_capital: Operating working capital
  ic_net_ppe: {label: Net PP&E, occurrence: 2}
  invested_capital: Invested capital
  ic_equity_investments: {label: Equity investments, occurrence: 2}
  total_funds_invested: Total funds invested
  rec_debt: {label: Interest-bearing debt, occurrence: 2}
  rec_common_stock: {label: Common stock, occurrence: 2}
  rec_retained_earnings: {label: Retained earnings, occurrence: 2}
  rec_total_funds: {label: Total funds invested, occurrence: 2}
  # 7.2, the accountant's income statement
  revenues: {label: Revenues, periods: [1]}
  operating_costs: {label: Operating costs, periods: [1]}
  depreciation: {label: Depreciation, periods: [1]}
  operating_profit: {label: Operating profit, periods: [1]}
  interest: {label: Interest, periods: [1]}
  nonoperating_income: {label: Nonoperating income, periods: [1]}
  earnings_before_taxes: {label: Earnings before taxes, periods: [1]}
  taxes: {label: Taxes, periods: [1]}
  net_income: {label: Net income, periods: [1]}
  marginal_tax: {label: marginal tax of, periods: [1], scale: 0.01}
  # 7.2, NOPLAT and its reconciliation
  noplat_revenues: {label: Revenues, occurrence: 2, periods: [1]}
  noplat_operating_costs: {label: Operating costs, occurrence: 2, periods: [1]}
  noplat_depreciation: {label: Depreciation, occurrence: 2, periods: [1]}
  noplat_operating_profit: {label: Operating profit, occurrence: 2, periods: [1]}
  operating_taxes: {label: Operating taxes1, periods: [1]}
  noplat: {label: NOPLAT, periods: [1]}
  after_tax_nonoperating_income: {label: After-tax nonoperating income1, periods: [1]}
  income_to_investors: {label: Income available to investors, periods: [1]}
  rec_net_income: {label: Net income, occurrence: 2, periods: [1]}
  after_tax_interest_expense: {label: After-tax interest expense1, periods: [1]}
  rec_income_to_investors: {label: Income available to investors, occurrence: 2, periods: [1]}
  # 7.3, the accountant's cash flow statement
  cf_net_income: {label: Net income, occurrence: 3, periods: [1]}
  cf_depreciation: {label: Depreciation, occurrence: 3, periods: [1]}
  inventory_change: {label: Decrease (increase) in inventory, periods: [1]}
  payables_change: {label: Increase (decrease) in accounts payable, periods: [1]}
  cash_flow_from_operations: {label: Cash flow from operations, periods: [1]}
  capex: {label: Capital expenditures, periods: [1]}
  equity_investments_change: {label: Decrease (increase) in equality investments, periods: [1]}
  cash_flow_from_investing: {label: Cash flow from investing, periods: [1]}
  debt_change: {label: Increase (decrease) in debt, periods: [1]}
  common_stock_change: {label: Increase (decrease) in common stock, periods: [1]}
  dividends: {label: Dividends, periods: [1]}
  cash_flow_from_financing: {label: Cash flow from financing, periods: [1]}
  # 7.3, free cash flow and its reconciliation
  fcf_noplat: {label: NOPLAT, occurrence: 2, periods: [1]}
  fcf_depreciation: {label: Depreciation, occurrence: 4, periods: [1]}
  gross_cash_flow: {label: Gross cash flow, periods: [1]}
  fcf_inventory_change: {label: Decrease (increase) in inventory, occurrence: 2, periods: [1]}
  fcf_payables_change: {label: Increase (decrease) in accounts payable, occurrence: 2, periods: [1]}
  fcf_capex: {label: Capital expenditures, occurrence: 2, periods: [1]}
  free_cash_flow: {label: Free cash flow, periods: [1]}
  fcf_after_tax_nonoperating_income: {label: After-tax nonoperating Income, periods: [1]}
  fcf_equity_investments_change: {label: Decrease (increase) in equity investments, periods: [1]}
  cash_flow_to_investors: {label: Cash flow available to investors, periods: [1]}
  rec_after_tax_interest: {label: After-tax interest, periods: [1]}
  rec_debt_change: {label: Increase (decrease) in interest-bearing debt, periods: [1]}
  rec_common_stock_change: {label: Increase (decrease) in common stock, occurrence: 2, periods: [1]}
  rec_dividends: {label: Dividends, occurrence: 2, periods: [1]}
  rec_cash_flow_to_investors: {label: Cash flow available to investors, occurrence: 2, periods: [1]}
inputs: [inventory_prior, net_ppe_prior, equity_investments_prior, accounts_payable_prior, debt_prior,
         common_stock_prior, retained_earnings_prior, revenues, operating_costs, depreciation, interest,
         nonoperating_income, marginal_tax, inventory_change, payables_change, capex,
         equity_investments_change, debt_change, common_stock_change, dividends]
set_aside:
  "EXHIBIT 7.1 An Example of Invested Capital": the exhibit's number
  "EXHIBIT 7.2 An Example of NOPLAT": the exhibit's number
  "EXHIBIT 7.3 An Example of Free Cash Flow": the exhibit's number
case:
  case: valuation-chapter-7-example
  periods: 2
  phases: [operate]
  currency: USD
  floors: {}
  generators:
    book:
      kind: formulas
      periods: 2
      inputs: exhibit
      values:
        # the footnote: a marginal tax of 25% on all income, so on earnings before taxes
        tax_due: -(marginal_tax * (revenues + operating_costs + depreciation + interest + nonoperating_income))
  opening:
    company:
      inventory: {nature: asset, value: {generator: book, output: inventory_prior__0}}
      net_ppe: {nature: asset, value: {generator: book, output: net_ppe_prior__0}}
      equity_investments: {nature: asset, value: {generator: book, output: equity_investments_prior__0}}
      accounts_payable: {nature: liability, value: {generator: book, output: accounts_payable_prior__0}}
      debt: {nature: liability, value: {generator: book, output: debt_prior__0}}
      common_stock: {nature: equity, value: {generator: book, output: common_stock_prior__0}}
      retained_earnings: {nature: equity, value: {generator: book, output: retained_earnings_prior__0}}
  contracts: {}
  rulebooks:
    # each line as printed, signed: a positive amount debits cash, a negative one credits it
    year:
      kind: transfer
      entity: company
      phase: operate
      declare: {cash: asset, revenue: income, operating_costs: expense, depreciation: expense, interest: expense,
                nonoperating_income: income, tax_expense: expense}
      moves:
        revenues: {debit: cash, credit: revenue, amount: {generator: book, output: revenues}}
        operating_costs: {debit: cash, credit: operating_costs, amount: {generator: book, output: operating_costs}}
        depreciation: {debit: net_ppe, credit: depreciation, amount: {generator: book, output: depreciation}}
        interest: {debit: cash, credit: interest, amount: {generator: book, output: interest}}
        nonoperating_income: {debit: cash, credit: nonoperating_income,
                              amount: {generator: book, output: nonoperating_income}}
        taxes: {debit: cash, credit: tax_expense, amount: {generator: book, output: tax_due}}
        inventory: {debit: cash, credit: inventory, amount: {generator: book, output: inventory_change}}
        payables: {debit: cash, credit: accounts_payable, amount: {generator: book, output: payables_change}}
        capex: {debit: cash, credit: net_ppe, amount: {generator: book, output: capex}}
        equity_investments: {debit: cash, credit: equity_investments,
                             amount: {generator: book, output: equity_investments_change}}
        debt: {debit: cash, credit: debt, amount: {generator: book, output: debt_change}}
        common_stock: {debit: cash, credit: common_stock, amount: {generator: book, output: common_stock_change}}
        dividends: {debit: cash, credit: retained_earnings, amount: {generator: book, output: dividends}}
  schemes:
    valuation:
      cash: operating_current_asset
      inventory: operating_current_asset
      accounts_payable: operating_current_liability
      net_ppe: operating_long_term
      equity_investments: nonoperating_asset
      debt: debt
      common_stock: equity
      retained_earnings: equity
      revenue: revenue
      operating_costs: operating_cost
      depreciation: depreciation
      interest: interest
      nonoperating_income: nonoperating
      tax_expense: tax
    cash_flow:
      revenue: operating
      operating_costs: operating
      interest: operating
      nonoperating_income: operating
      tax_expense: operating
      inventory: operating
      accounts_payable: operating
      net_ppe: investing
      equity_investments: investing
      debt: financing
      common_stock: financing
      retained_earnings: financing
  cuts:
    operations: {entity: company, account: cash, scheme: cash_flow, include: [operating]}
    investing: {entity: company, account: cash, scheme: cash_flow, include: [investing]}
    financing: {entity: company, account: cash, scheme: cash_flow, include: [financing]}
  lenses:
    v:
      kind: valuation
      entity: company
      scheme: valuation
      marginal_tax_rate: {generator: book, output: marginal_tax}
  measures: {}
figures:
  inventory: {balance: inventory}
  net_ppe: {balance: net_ppe}
  equity_investments: {balance: equity_investments}
  total_assets: {balance: cash + inventory + net_ppe + equity_investments}
  accounts_payable: {balance: accounts_payable}
  debt: {balance: debt}
  common_stock: {balance: common_stock}
  # the books keep income and expense open: retained earnings as printed include the year's profit
  retained_earnings: {balance: retained_earnings + revenue + nonoperating_income - operating_costs - depreciation - interest - tax_expense}
  total_liabilities_and_equity: {balance: accounts_payable + debt + common_stock + retained_earnings + revenue + nonoperating_income - operating_costs - depreciation - interest - tax_expense}
  ic_inventory: {cut: v.operating_current_assets}
  ic_accounts_payable: {cut: v.operating_current_liabilities}
  operating_working_capital: {cut: v.operating_working_capital}
  ic_net_ppe: {cut: v.operating_long_term}
  invested_capital: {cut: v.invested_capital}
  ic_equity_investments: {cut: v.nonoperating_assets}
  total_funds_invested: {cut: v.total_funds_invested}
  rec_debt: {cut: v.debt_and_equivalents}
  rec_common_stock: {balance: common_stock}
  rec_retained_earnings: {sum: [{cut: v.equity_and_equivalents}, {balance: common_stock, sign: -1}]}
  rec_total_funds: {cut: v.total_funds_sources}
  operating_profit: {change: revenue - operating_costs - depreciation}
  earnings_before_taxes: {change: revenue + nonoperating_income - operating_costs - depreciation - interest}
  taxes: {change: tax_expense, sign: -1}
  net_income: {cut: v.net_income}
  noplat_revenues: {cut: v.revenue}
  noplat_operating_costs: {change: operating_costs, sign: -1}
  noplat_depreciation: {cut: v.depreciation, sign: -1}
  noplat_operating_profit: {cut: v.ebita}
  operating_taxes: {cut: v.operating_taxes, sign: -1}
  noplat: {cut: v.noplat}
  after_tax_nonoperating_income: {cut: v.after_tax_nonoperating}
  income_to_investors: {cut: v.income_to_investors}
  rec_net_income: {cut: v.net_income}
  after_tax_interest_expense: {cut: v.after_tax_interest}
  rec_income_to_investors: {sum: [{cut: v.net_income}, {cut: v.after_tax_interest}]}
  cf_net_income: {cut: v.net_income}
  cf_depreciation: {cut: v.depreciation}
  cash_flow_from_operations: {cut: operations}
  cash_flow_from_investing: {cut: investing}
  cash_flow_from_financing: {cut: financing}
  fcf_noplat: {cut: v.noplat}
  fcf_depreciation: {cut: v.depreciation}
  gross_cash_flow: {cut: v.gross_cash_flow}
  fcf_inventory_change: {change: inventory, sign: -1}
  fcf_payables_change: {change: accounts_payable}
  # capital expenditures: the growth of net PP&E plus the depreciation that wore it down
  fcf_capex: {sum: [{change: net_ppe, sign: -1}, {cut: v.depreciation, sign: -1}]}
  free_cash_flow: {cut: v.fcf}
  fcf_after_tax_nonoperating_income: {cut: v.after_tax_nonoperating}
  fcf_equity_investments_change: {change: equity_investments, sign: -1}
  cash_flow_to_investors: {cut: v.cash_flow_to_investors}
  rec_after_tax_interest: {cut: v.after_tax_interest}
  rec_debt_change: {change: debt, sign: -1}
  rec_common_stock_change: {change: common_stock, sign: -1}
  rec_dividends: {change: retained_earnings, sign: -1}
  rec_cash_flow_to_investors: {sum: [{cut: v.after_tax_interest}, {change: debt, sign: -1},
                                     {change: common_stock, sign: -1}, {change: retained_earnings, sign: -1}]}

# Valuation, Exhibit 11.2 (ch. 11, p. 238): Home Depot's weighted average cost of capital.
#
# The exhibit prints, for debt and equity, the share of total capital, the cost of capital, the
# marginal tax rate (debt only), the after-tax cost and the contribution to the weighted average, then
# the WACC. The shares, the pretax costs and the tax rate are the inputs (the prose, p. 238, explains
# where each comes from: a CAPM cost of equity, a BBB+ yield, the chapter-7 tax rate). The after-tax
# cost of debt, each contribution, the shares' total and the WACC itself are computed, the WACC by the
# pack's wacc(d, e, kd, ke, tm), and compared. The exhibit's footnote warns that the contributions do
# not add to the WACC (1.3 + 7.1 against 8.5): each is rounded on its own.
# Every row has one number per column; the single case period holds them. Percents are read as
# fractions (scale 0.01).
excerpt: "11.2"
periods: [0]
entity: model
plant: debt_cost
rows:
  debt_weight: {label: Debt, scale: 0.01}
  debt_cost: {label: Debt, skip: 1, scale: 0.01}
  marginal_tax: {label: Debt, skip: 2, scale: 0.01}
  debt_after_tax: {label: Debt, skip: 3, scale: 0.01}
  debt_contribution: {label: Debt, skip: 4, scale: 0.01}
  equity_weight: {label: Equity, scale: 0.01}
  equity_cost: {label: Equity, skip: 1, scale: 0.01}
  equity_after_tax: {label: Equity, skip: 2, scale: 0.01}
  equity_contribution: {label: Equity, skip: 3, scale: 0.01}
  total_capital: {label: WACC, scale: 0.01}
  wacc: {label: WACC, skip: 1, scale: 0.01}
inputs: [debt_weight, debt_cost, marginal_tax, equity_weight, equity_cost]
set_aside:
  "EXHIBIT 11.2 Home Depot: Weighted Average Cost of Capital": the exhibit's number
case:
  case: valuation-chapter-11-home-depot-wacc
  periods: 1
  phases: [operate]
  currency: USD
  floors: {}
  generators:
    m:
      kind: valuation_formulas
      periods: 1
      inputs: exhibit
      values:
        debt_after_tax_m: debt_cost__0 * (1 - marginal_tax__0)
        debt_contribution_m: debt_weight__0 * debt_after_tax_m
        # equity carries no tax shield: its after-tax cost is its cost
        equity_after_tax_m: equity_cost__0
        equity_contribution_m: equity_weight__0 * equity_after_tax_m
        total_capital_m: debt_weight__0 + equity_weight__0
        wacc_m: wacc(debt_weight__0, equity_weight__0, debt_cost__0, equity_cost__0, marginal_tax__0)
  opening: {}
  contracts: {}
  rulebooks: {}
  schemes: {}
  cuts: {}
  lenses: {}
  measures: {}
figures:
  debt_after_tax: {driver: m.debt_after_tax_m}
  debt_contribution: {driver: m.debt_contribution_m}
  equity_after_tax: {driver: m.equity_after_tax_m}
  equity_contribution: {driver: m.equity_contribution_m}
  total_capital: {driver: m.total_capital_m}
  wacc: {driver: m.wacc_m}

        long_term_operating: {debit: cash, credit: long_term_operating,
                              amount: {generator: book, output: long_term_operating}}
        aoci: {debit: cash, credit: aoci, amount: {generator: book, output: aoci}}
        interest_income: {debit: cash, credit: interest_income, amount: {generator: book, output: interest_income}}
        nonrecurring: {debit: cash, credit: nonrecurring, amount: {generator: book, output: nonrecurring}}
        discontinued: {debit: cash, credit: discontinued, amount: {generator: book, output: discontinued}}
        nonoperating_taxes: {debit: cash, credit: nonoperating_taxes,
                             amount: {generator: book, output: nonoperating_taxes}}
        excess_cash: {debit: cash, credit: excess_cash, amount: {generator: book, output: excess_cash}}
        long_term_investments: {debit: cash, credit: long_term_investments,
                                amount: {generator: book, output: long_term_investments}}
        loss_carryforwards: {debit: cash, credit: loss_carryforwards,
                             amount: {generator: book, output: loss_carryforwards}}
        hd_supply: {debit: cash, credit: hd_supply, amount: {generator: book, output: hd_supply}}
        after_tax_interest: {debit: after_tax_interest, credit: cash,

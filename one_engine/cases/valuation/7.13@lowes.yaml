      kind: formulas
      periods: 3
      inputs: exhibit
      values: {}
  contracts: {}
  rulebooks:
    # operating and nonoperating lines: into cash as printed; financing lines: out of cash as printed
    year:
      kind: transfer
      entity: company
      phase: operate
      declare: {cash: asset, noplat: income, depreciation: income, working_capital: asset, net_capex: asset,
                leased_assets: asset, goodwill: asset, long_term_operating: asset, aoci: equity,
                interest_income: income, nonrecurring: expense, discontinued: income, nonoperating_taxes: expense,
                excess_cash: asset, long_term_investments: asset, loss_carryforwards: asset, hd_supply: asset,
                after_tax_interest: liability, after_tax_lease_interest: liability, short_term_debt: liability,
                long_term_debt: liability, lease_debt: liability, nonoperating_deferred_taxes: equity,
                dividends: equity, repurchases: equity, retained_earnings_adjustments: equity}
      moves:

                                   amount: {generator: book, output: after_tax_lease_interest}}
        short_term_debt: {debit: short_term_debt, credit: cash, amount: {generator: book, output: short_term_debt}}
        long_term_debt: {debit: long_term_debt, credit: cash, amount: {generator: book, output: long_term_debt}}

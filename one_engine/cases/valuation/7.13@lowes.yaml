# Valuation, Exhibit 7.13 (ch. 7, p. 155), Lowe’s: free cash flow and cash flow to investors.
#
# The exhibit builds free cash flow for 2006-2008 (periods 0-2) from NOPLAT
# (Exhibit 7.10), depreciation and the year's investments in invested capital
# (changes of Exhibit 7.5's balances), adds the cash flow of the nonoperating
# items to reach cash flow available to investors, and reconciles that with
# what went to debt holders and equity holders (pp. 155-158). This oracle
# reads Lowe's, three columns to the right of Home Depot (7.13@home_depot).
# Every line is a figure the book takes from those exhibits, so the lines are
# inputs; what the exhibit adds is its subtotals
# and the reconciliation, and those are what the case checks.
#   * The exhibit is booked as one pool of cash: each operating and
#     nonoperating line a transfer into cash (as printed, an outflow negative)
#     from an account of its own; each financing line a transfer out of cash
#     to the investors' account it names (as printed, a payment to investors
#     positive).
#   * Capitalized operating leases print twice, as an investment and as a flow
#     to debt holders: both postings are made from the investment line (the
#     leased asset and the debt equivalent that finances it, as Exhibit 7.5
#     books them), and the financing printing is compared.
#   * Every subtotal is a cut of the cash account by the class of the account
#     at the other end: gross cash flow, gross investment, free cash flow,
#     nonoperating cash flow and cash flow available to investors on the
#     operating side; flows to debt holders, to equity holders, and their sum
#     on the financing side. The two printings of cash flow available to
#     investors are read from the two sides, so the reconciliation is tested.
excerpt: "7.13"
periods: [0, 1, 2]
entity: company
columns_of: [home_depot]
plant: noplat
notes: >-
  The text extraction repeats free cash flow after the footnote; the repeat is read and compared like the row it
  repeats. Lowe's prints nil for the Home Depot lines (goodwill, nonrecurring, discontinued operations, HD
  Supply, nonoperating deferred taxes); they are read and booked as nil. The footnote mark of nonoperating
  deferred taxes is not printed on its row.

# Valuation, Exhibit 14.10 (ch. 14, p. 329): enterprise-value-based PEG ratios of eight specialty retailers.
#
# The book's adjusted PEG ratio (p. 329) divides the forward EV-to-EBITA
# multiple (the one Exhibit 14.1 prints) by 100 times the expected growth of
# EBITA, so it is the multiple per percentage point of growth.
#
# Translated as a calculation: each retailer's multiple and projected EBITA
# growth are inputs (the multiple is 14.1's, from data neither exhibit prints);
# the PEG ratio is computed and compared.

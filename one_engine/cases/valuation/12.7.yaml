        other_claims: traditional_debt_outstanding + convertible_outstanding + pensions_outstanding
        # option values deducted (negative as printed); under the exercise approach none is, and the
        # exercise brings cash in instead
        options_exercise: 0
        proceeds_outstanding: 0
        proceeds_exercisable: 0
        equity_outstanding: enterprise_value_outstanding + other_claims + options_outstanding + proceeds_outstanding
        equity_exercisable: enterprise_value_outstanding + other_claims + options_exercisable + proceeds_exercisable
        equity_exercise: enterprise_value_outstanding + other_claims + options_exercise + proceeds_exercise
        new_shares_outstanding: 0
        new_shares_exercisable: 0
        diluted_outstanding: shares_outstanding + new_shares_outstanding
        diluted_exercisable: shares_outstanding + new_shares_exercisable
        diluted_exercise: shares_outstanding + new_shares_exercise
        per_share_outstanding: equity_outstanding / diluted_outstanding
        per_share_exercisable: equity_exercisable / diluted_exercisable
        per_share_exercise: equity_exercise / diluted_exercise

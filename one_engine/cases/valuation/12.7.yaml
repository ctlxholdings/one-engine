# Valuation, Exhibit 12.7 (ch. 12, pp. 289-290): Hasbro's equity value per share in November 2008,
# with its employee options valued three ways.
#
# The same bridge as Exhibit 12.6's market-value column (enterprise value less
# traditional debt, the convertible bond at market value and unfunded
# pensions), with the employee options deducted at (1) the Black-Scholes value
# of all outstanding options, (2) the Black-Scholes value of the currently
# exercisable ones, or (3) the exercise approach: the exercisable options are
# taken as exercised now, so the cash their exercise brings in is added and the
# new shares join the share count (p. 290). Value per share is equity over the
# undiluted count for the two option-value columns and over the diluted count
# for the exercise approach.
#
# Translated as a calculation. The first column's lines are inputs, and the
# lines repeated in the other columns are compared with them. The two option
# values, the exercise proceeds and the new shares are inputs (the exhibit
# prints them as results; their option-model and strike inputs are in the
# prose). The bond's coupon and maturity, printed in its label, enter no
# calculation and are inputs only. Equity values, diluted shares and values per
# share are computed and compared.

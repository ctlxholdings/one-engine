# Workbook "van_10ans_previsions_3moissons": the CAP 3Moissons farms' 7-year forecast and the NPV of the
# first 1, 10 and 50 CAPs over 10 and 12 years, in MCFA (Baghara 02-Financial-Models/Nour-3Moissons-Haraz/
# "VAN 10 ans Prévisions 3 moissons.xlsx"; cases/reference/workbooks/van_10ans_previsions_3moissons.xlsx).
#
# Every amount is a workbook input by name (a typed cell, a number typed inside a formula, or a value the
# workbook imported from a linked file it was not saved with: [1], [2], [3]), or a formula over them
# (generator `src`). This file is generated by consolidation/experiments/workbooks/van_10ans/build.py. Period t is the workbook's year t + 1:
# columns D to J (year 1 to 7) of "PL", "Invest", "Tréso", "1 CAP", "50 CAP"; E to K of "Emprunts"; D to O
# (year 1 to 12) of "VAN des CAP". Five books:
#   * cap1, cap2, cap3 (CFA): one CAP of the year-1, year-2 and year-3 cohort. cap1 posts the imported
#     per-CAP P&L by age (PL rows 56-76: revenue from year 2, rents from year 1; year 7 is year 6 grown
#     by C6 for revenue, overheads, taxes and salaries, purchases at the mean of the year-5 and 6 margin
#     rates, rents held at year 5), capex (Invest rows 36-42, tangible and intangible, years 5-7 filled
#     with year 4 as the sheet does), the depreciation base and the leased equipment as memo pairs (no
#     cash moves), the loan (Emprunts rows 184-194: drawdowns, repayments, interest, the insurance and
#     fees in row 192 beyond the interest of row 191, the part taken over), the electricity it uses (PL
#     rows 154-155: C59 kWh scaled by revenue against year 5, at 657 x the euro price of C60) and its
#     bank balance (Tréso rows 30-31, imported in MCFA, kept in CFA by the VAN's /1000000);
#     cap2 and cap3 are cap1 one and two years later (PL rows 83-130, Invest 47-64 and 91-102, Emprunts
#     203-230, Tréso 35-41);
#   * farms (MCFA): the 50 CAPs, 10 + 20 + 20 created in years 1-3 ('50 CAP' C17:C21; PL rows 10-14):
#     each line is the cohort counts times the three cohorts' amounts / 1000000 (PL rows 27-47, 144-146,
#     Invest 20-28 and 72-75, Emprunts 26-32, Tréso 20-21, the bank without the division); the year's
#     capex is split by nature in proportion to '50 CAP' C79:C86, as its rows 79-86 do; the VAN holds
#     year 7 for years 8-12 ("C.A. constant 7 ans après"), so every P&L line is held there;
#   * one_cap (MCFA): the separate one-CAP model the "1 CAP" sheet imports ([2]): revenue, purchases,
#     rents, interest and the rest of the imported result as one line, its electricity, capex (split by
#     nature as C79:C86), leased equipment, loan and bank; revenue and result held after year 7 for the VAN.
#   * The VAN's cash flow is result before tax less IMF (C7 of revenue) less capex, as row 23 and row 46
#     compute it (the note in B4 says EBITDA, but the rows read "RN avant IS"; the books follow the rows).
#     Discount factors: 1 for year 1, then 1 / (1 + rate) per year at the typed rates D14:K14 (nil) and C6
#     from year 9; the 10-year NPVs stop at year 10, the 12-year one at 12.
#   * Counts, kWh, MWh, MWc, prices, margin rates, rates and discount factors are drivers. The VAN's 10
#     CAPs are 10 x the one-CAP rows (each row's own typed 10).
#
# Where the books disagree with the workbook (the workbook wins; kept read):
#   * PL row 33 "Charges externes ponctuelles" = (D$10*E62 + D$12*D90 + D$14*D117)/1e6: the second and third
#     cohorts take row 90 and 117, their overheads, instead of rows 89 and 116 (one-off charges, all nil;
#     the first cohort also reads the next year's E62, and F33 reads J$12). The overheads of cohorts 2 and 3
#     are counted twice: C33 4,208.74 where the books give 0 (F33 230.74 ... J33 1,258.03). It flows into
#     EBITDA C40 (21,361.69 against 25,570.43), EBIT C43, result C47 (6,410.34 against 10,619.08),
#     '50 CAP' C37:J37, and the 50-CAP VAN rows 43, 46, 47: NPV C48 12,243.55 against 22,500.57 MCFA
#     (C49 18.67 against 34.30 MEUR), 10-year C51 5,158.72 against 13,068.04 (C52 7.86 against 19.92 MEUR);
#   * Invest!I38:J38 hold year 5's depreciation (=H38, 23,536,833 CFA) where the P&L charges the imported
#     [1]invest!$V$5 = 21,857,333 (PL!I70:J70); the books depreciate as the P&L does, so Invest C24:J24
#     (5,986.09 against 5,918.91), C25:J25 and the second cohort's J49 differ;
#   * the per-CAP loan balance (Emprunts row 187) is stitched from two linked files ([3] for year 1, [1]
#     for years 2-7) and is not the drawdowns less repayments of the same rows: 1 CFA above them in years
#     2-5 (F187 208,333,334.28 against 208,333,333.28), 0.19 and 0.23 above in years 6-7 (K187 -0.0000003
#     against -0.23). Emprunts D30:K30, F206:K206, G223:K223 and '50 CAP' D109:J109 differ by that.
# Slips without effect on any number: VAN F15:K15 compound $E$15 instead of each year's own rate (all nil);
# VAN G45:O45 read Invest row 22 (depreciation base) instead of row 20 (both nil from year 4); Invest C26
# sums D26:G26 only; Invest J85 reads PL!I64 for year 7 (same rent). The euro rate is 656 in the MEUR rows,
# 657 in the kWh price (C61, PL!C138) and 655.957 in the VAN; each is used where the workbook uses it.
# The per-CAP depreciation base (348,382,500 CFA) exceeds the capex (248,382,500); it is an imported memo.

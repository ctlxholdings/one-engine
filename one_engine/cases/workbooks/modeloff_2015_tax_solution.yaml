notes: >
  One figure is left unread, waiting on a reading: Solution M62:EN62, the flag of the first month a loss
  expires ((M59<>0) * no earlier flag). No reading tests a record for nonzero (or takes the first period it
  is), so the flag cannot be read from the books' expired losses (all nil here, the switch G59 being 0); it
  feeds only answer F104, a date, which the oracle sets aside. tax_instalments counts a tax year as
  periods_per_year periods from t = 0; the workbook's year is the calendar year of each month (row 65).
  The two agree because M6 is a 1 January; a grid starting in another month would need the rulebook to
  take the first period of the tax year. The instalment months are placed from MONTH(M6) all the same.

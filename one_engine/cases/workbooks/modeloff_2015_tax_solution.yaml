  Solution.A94: {driver: src.solution_2, at: 0}
  Solution.M13:EN13: {cut: taxable_profit}
  Solution.M34:EN34: {driver: src.days_rate_1}
  Solution.M35:EN35: {driver: src.days_rate_2}
  Solution.M36:EN36: {driver: src.days_rate_3}
  Solution.M37:EN37: {driver: src.days_rate_4}
  Solution.M38:EN38: {driver: src.days_rate_5}

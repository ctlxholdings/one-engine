# Workbook "baghara_v15_24": "3 Fermes Incubatrices", Baghara's financial model of an incubator company that
# builds and runs incubator farms (A01 = 3 farms) with a farmer-training programme and two genetics programmes
# (animal insemination, plant nursery), over 8 years (origin: golds one-place,
# oracles/external/excel_models/corpus/downloads/baghara_v15.24.xlsx on Ali's Mac, sha-256 checked against the
# Mac copy, vendored unmodified 2026-10-13; cases/reference/workbooks/baghara_v15_24.xlsx).
# The earlier one_engine Baghara cases (cases/baghara.yaml, cases/baghara/) are a different model (a physical
# process network), so nothing of theirs is reused here.
#
# Every amount is a workbook input by name (a typed cell, a number typed inside a formula, or a run of typed
# cells), or a formula over them (generator `src`). Period t is the workbook's year t - 1 (row 4 of
# 02_Timeline: years -1 .. 6 in columns E..L): t = 0 is the pre-programme year, t = 1 the construction year
# (Y0), t = 2 the commercial operation date (A04 = year 1). Column D is each row's Total (the eight-year
# sum); on 18_Validation the years run E..L and M is their sum.
#
# Three books:
#   * `incubator`, the company the statements describe (07 Revenue .. 17 Outputs);
#   * `plan`, the capital budget of 05_CAPEX and 06_S&U: its uses and its sources (equity, senior and junior
#     debt, grants), sized on the plan's own bases, which are not the company's (see below);
#   * `tax_basis`, a memo book of the tax net book value and the loss pool (11_FA rows 14-17, 13_Tax 16-19).
#
# Economics (incubator):
#   * revenue from year 1 on: dairy (herd E08 x milk E09 at E16), beef (herd E10, sold E11, carcass E12 x E13
#     at E17), market gardening (E04 ha x E15 t x E07 cycles at E19) and cereals (E05 ha x E14 t at E18),
#     each per farm and ramped E20 in year 1, E21 in year 2, then 100%; training and genetics earn nothing;
#   * farming costs: inputs per hectare (P01-P07), concentrate feed for the deficit of need over own forage
#     (X24 USD at the A08 rate), vet, insemination, calves, managers (P12 x P13), electricity and diesel on
#     the kWh of each activity (Q01-Q08), mechanisation by the hectare, tonne and cut (R01-R08), the audit
#     (J04 for J05 years) and the DSRA letter-of-credit fee (K07 a year from COD);
#   * training: one-time design, trainer training, international trips and materials (year -1 / Y0), training
#     plateaux, accommodation and monitoring hardware (Y0), all capitalised; recurring trainer salaries,
#     stipends net of the credit kept for days off-farm (by trainee group a-d, volumes rounded as the workbook
#     rounds them), coordination and communications, expensed;
#   * genetics A (animal) and B (plant): hardware capitalised in Y0; pre-operation and recurring costs
#     expensed;
#   * capital works: every capitalised cost line sits on its own CWIP account and moves to fixed assets at
#     COD; the farm works (I01-I09, H08-H10), studies J01, legal J03 and supervision J02 on the farm works;
#     book depreciation is the Y0 CWIP over M04 = 20 years, tax depreciation over M05 = 10 years;
#   * grants: the training and genetics hardware is grant-funded, deferred and released over M04 years from
#     COD; the recurring training and genetics costs are matched by recurring grants in the year;
#   * debt: tranches L04 + L04B drawn in year N02 = 0 at L01, interest on opening plus draw; equal repayments
#     of (L04 + L04B) / (L02 - L03) from year N03 = 4;
#   * tax: M01 on pre-tax income (grant income is not taxed), a holiday of M02 = 5 years from COD in which
#     the loss pool is not used but losses still add to it; deferred tax M01 x (book NBV - tax NBV);
#   * working capital: receivables M06 days of revenue, payables M07 days of opex (the 365 inside 12_WC E8
#     and E9);
#   * equity: the cash L06 and the in-kind land L07 and herd L08 in Y0 (the cash flow statement shows the
#     in-kind items as cash in, as the balance sheet's cash plug requires), and the fattening herd
#     (A01 x E10 x P14) straight to inventory; the plan's funding gap, nil here, would come in as equity;
#   * CFADS is EBITDA plus working-capital movement less cash tax; DSCR is CFADS over interest plus
#     repayment; NPV at M03 over Y1-Y6 as Excel's NPV discounts it (Y1 discounted one year);
#   * physical rows (hectares, heads, tonnes, kWh, litres, trainee-days, flags and counts), prices derived
#     from inputs, the DSCR and the workbook's 0/1 checks are drivers.
#
# The plan and the books disagree, and the workbook keeps them apart (observations, not slips; each figure
# agrees on its own sheet):
#   * 05_CAPEX B1 builds the farms from its own unit lines (USD inputs X17-X20 at A08, land L07 per farm,
#     I01A, I01B, I03A, I03B): 2,701,585.82, where 10_CWIP builds them from the typed EUR totals I01-I04:
#     2,701,583.64; supervision is 5% of the plan's base
#     (152,329.18) on 05_CAPEX row 77 and of the CWIP farm works (135,079.18) in 10_CWIP;
#   * 06_S&U sizes senior debt X14 = 66%, junior X15 = 14% and sponsor equity on the plan's B1+B4+B5:
#     2,363,058.30, 501,254.79 and 62,623.73, but 09_Debt draws the typed L04 2,323,456.86 + L04B 492,854.49
#     and the balance sheet takes the typed cash equity L06 50,623.29; the plan's working-capital, DSRA,
#     MMR and contingency reserves (B5) never reach the company's books.
#
# Where the books disagree with the workbook (the workbook wins; these are its own formula slips):
#   * 08_OpEx row 17, the DSRA LC fee (=ASM_K07_DSRA_LC_FEE_EUR_YR*FLAG_POST_COD_Yn, 2,270 a year from Y1,
#     13,620 in all), is left out of every total: "Farming operations" E7 =E39+E49+E63+E16 and "TOTAL OPEX"
#     E71 =E13+E16+E39+E49+E63+E68 skip E17. The case charges the fee, so farming opex D7 is 3,154,511.80
#     against 3,140,891.80 and total opex D10/D71 5,193,571.80 against 5,179,951.80; Y6 EBITDA (Cover D25,
#     17_Outputs D34) 986,609.02 against 988,879.02. It shows in 08_OpEx rows 7, 10 and 71 and carries
#     through payables and working capital
#     (12_WC rows 9, 13, 15), pre-tax income and the loss pool (13_Tax 9, 12, 16-19), the income statement
#     (14_IS 8, 9, 13, 18, 22, 27), cash, retained earnings and the totals of the balance sheet (15_BS 8, 13,
#     16, 20, 24, 26, 27), the cash flow statement (16_CFS 8, 11, 13, 26, 28, 29), CFADS, DSCR, NPV and the
#     commercial IRR (17_Outputs 8, 9, 11, 14, 16, 18, 22, 25, 29, 30, 34-38: the IRR is 17.11% against
#     17.21%) and Cover D24-D26: 50 figures in all, every one of which agrees when the fee is left out.
#   * 09_Debt D13, the Total column of interest, is =(ASM_L04_DEBT_T1_AMOUNT_EUR+ASM_L04B_DEBT_T2_AMOUNT_EUR)
#     *ASM_L01_DEBT_T1_RATE, one year's interest on the full amount (140,815.57), not =SUM(E13:L13) as on
#     every other row: the eight years sum to 938,770.45 (and 14_IS D21 shows that sum).
#   * Cover D8:D20 point one row up into 18_Validation (D8 =M6 for the S&U check on M7, ... D20 =M26 for
#     the named-range check on M27): every value is 0, so the case reads each the check its label names.
#   * The named range CFADS_Yn points at 17_Outputs row 8 (EBITDA), not row 11 (CFADS); Cover D26 "CFADS SS"
#     reads it. In Y6 the two are equal (988,879.02), the working capital being steady and the tax holiday on.
#
# Not compared: the "Inputs from Assumptions" blocks of 03_Training, 04_Genetics, 05_CAPEX, 06_S&U and
# 08_OpEx and the echo rows of 07_Revenue copy an assumption into every year; the case reads the assumption
# itself. 03_Training row 118 copies row 73 (itself X07).
#
# The commercial unlevered IRR, 17_Outputs D30 =IFERROR(IRR(E29:L29,0.1),"n/a") and D38 =D30, runs on row 29:
# the company's CFADS (row 11) less the plan's B1 capex (row 28), a stream across two books, read as one
# `sum` cut of the two (cut commercial_fcf, measure commercial_irr).
workbook: baghara_v15_24
entity: incubator
plant: _01_Assumptions__D30
case:
  case: workbook-baghara-v15-24
  periods: 8
  phases: [operate]
  currency: EUR

          * (_02_Timeline__E4_L4 - _01_Assumptions__D35 + 1), _01_Assumptions__D48)', cum_b: '(_02_Timeline__E4_L4 >= _01_Assumptions__D35)
          * min(tl_rb * (_02_Timeline__E4_L4 - _01_Assumptions__D35 + 1), _01_Assumptions__D49)', cum_c: '(_02_Timeline__E4_L4

# Workbook "business_plan_3moissons_2021": the 3Moissons farm business plan of April 2021: a 300 ha irrigated
# farm growing eleven crops, financed 30% by equity and 70% by a term loan, over ten years (Baghara repository,
# 03_evidence/promoter-originals/promoters_files_archive/BAGHARA / Etudes 2007/2020/3. projet 3Moissons 2021)/
# "Final Business Plan 3Moissons_April 2021.xlsx", vendored unmodified 2026-10-13 with Ali's agreement;
# cases/reference/workbooks/business_plan_3moissons_2021.xlsx).
#
# Every amount is a workbook input by name (a typed cell, or a number typed inside a formula), or a formula
# over them (generator `src`; the cells the books need are translated formula by formula as x_<sheet>_<cell>).
# Period t = 0 is the construction year: column C of "P&L", column B of "Dep.", C53 of "Debt". Period t = k is
# year k: columns D:M of "P&L" and of the annual rows of "Debt" (48-71), columns C:L of "Growing cost  assum"
# and of "Dep.". The P&L's cash flow, ratios, IRR and payback blocks stop at year 9 (column L); the balance
# sheet runs to year 10. The P&L's 254 columns are years: only C:M (and O98, IT16) hold numbers. "Debt" rows
# 4-43 are quarters 1-40: quarter q belongs to year (q - 1) // 4 + 1 and is read from that year's books.
#   * capex, all at t = 0, one asset account per line: basic infrastructure (fencing, roads, guard posts, land
#     preparation, water tank, buildings), 34 lines of core equipment (G35 adds 5% of G2:G34 for the workshop),
#     7 lines of other equipment (excise and VAT columns blank), project management D4, engineering D9, R&D D18,
#     contingency D19 = 5% of the rest: total 'Project Cost'!D21 = 7,959,143.66;
#   * funding at t = 0: equity 30% of D21 ('Fin Assumptions'!B34), the term loan the rest (B36), no grant;
#   * each crop's realisation is hectares x yield x price (rows 18, 36, ... of "Growing cost  assum"), and its
#     nine cost lines are hectares x a cost per hectare; the P&L sells ten crops (rows 4-13); alfalfa's nine
#     cost lines are in the P&L's variable costs (rows 19-27) but its realisation (C201) is not;
#   * fixed costs: salaries D42:D52 of "Fin Assumptions" escalated by the factors typed in E32:M32; maintenance
#     at the percent of D21 typed in each cell of row 33; PMC (row 34) and R&D (row 35) as typed; insurance at
#     1% of the closing tax written-down value (row 36);
#   * working capital: debtors at the days of Debt!D63:M63 of the P&L's revenue over 360 (raw material typed 0);
#     the working capital loan is never drawn in the cash flow (P&L row 74 is blank) but its interest, 12% on
#     80% of working capital (Debt rows 70-71), is charged and paid;
#   * term loan: 6% a year, interest quarterly on the opening balance, eight quarters of moratorium, then 32
#     equal quarterly repayments of principal (B10 = B36 / B6); the annuity ("EQI", Debt J:M and K1) is a
#     variant `eqi`, and the 12% / 20-quarter annuity quoted in Debt O12:Q31 a variant `quote`;
#   * book depreciation straight line on cost and never past it: plant and machinery (core equipment) at
#     B25, miscellaneous fixed assets (other equipment) at B27, technical buildings (basic infrastructure) at
#     B28; non-technical buildings have a book base of 0 (Dep.B19); project management, engineering, R&D and
#     contingency are capitalised and not depreciated, as the workbook has them;
#   * the tax register (entity `fisc`) depreciates the same three classes on written-down value at C25, C27,
#     C28, and engineering (Dep.B33) as non-technical buildings at C29; income tax at B22 on PBT plus book less
#     tax depreciation, when the cumulative taxable income is not negative;
#   * the project IRR (P&L 140-155) is on PAT + depreciation + term loan interest (rows 149-150 multiply the
#     working capital increase and principal by the 0 typed there) after the capex, with the net fixed assets at
#     year 10 as terminal value (lens `project_view`: the fixed assets are the project's claim at the exit);
#     the payback (rows 226-232, C241) is read on the same stream;
#   * physical rows (hectares, yields, days, quantities), prices and rates per unit, percentages, the loan's
#     quarter coefficients and the payback year are drivers.
#
# Where the books disagree with the workbook (the workbook wins; these are its own formula slips):
#   * S1 Dep.C32:L32 (technical buildings, tax) multiply by $C4 (15%, miscellaneous assets) instead of $C5 (5%):
#     year-1 tax depreciation 300,276.20 against 100,092.07, WDV B39:L39 1,701,565.16 against 1,901,749.30;
#     this moves the total tax depreciation C34:L34 (897,232.17 against 699,336.39), the total WDV C42:L42
#     (5,217,649.12 against 5,430,800.43) and so the insurance P&L!D36:M36 (52,176.49 against 54,308.00);
#   * S2 Dep.B17 and B38 = 'Other Equipment'!I10/100000 (a lakh conversion left over from a rupee template):
#     0.1526 against 15,255.68, so book depreciation C17:L17 is 0.0158 against 1,577.44 a year; and the tax
#     base Dep.B31 is typed 0, so C31 = 0 against 2,288.35 (later years run on B38's 0.1526);
#   * S3 Dep.L15 (and L17) keep charging B15 x B3 in year 10 though 10 x 10.34% passes the cost: 404,608.31
#     against the 271,564.96 left, NBV L22 -133,043.35 against 0 (other equipment: 1,058.74 left in year 10);
#     S1-S3 together: depreciation P&L!D45 471,469.83 against 473,047.25 (M45 339,485.21), EBITDA D42
#     2,228,356.01 against 2,226,224.50, tax D47 49,341.92 against 59,130.14, PAT D48 1,363,258.91 against
#     1,349,761.76, and every row built on them (cash, balance sheet, ratios, IRR, payback, rows 176-218);
#   * S4 the year-10 balance sheet reads a cash flow that stops at year 9: P&L!M94 = L94-M80 with M80 blank
#     (696,425.07 against 0, Debt!M50 repays it), M102 = M85 blank (0 against 22,116,223.44 of cash), so M95,
#     M103 and the check M104 (22,911,358.59 against 0) are off;
#   * S5 P&L!J111:L111 (debt-equity) = K94/J91, next year's loan: J 0.5833 against 0.8750, K 0.2917 against
#     0.5833 (L agrees only because S4's M94 equals L94);
#   * S6 P&L!K114:L114 (DSCR) = K136:L136, which are blank (row 136 stops at J): 0 against 4.2204 and 4.3602;
#   * S7 P&L!E179:L179 (total fixed cost) = SUM(E178:E178), the depreciation (471,469.83) against the fixed
#     costs SUM(E32:E36) as D179 (1,141,494.68 in year 2); E181:L181 (variable cost 1,373,223.06 against
#     706,911.75) and E183:L183 follow;
#   * S8 P&L!D183 (contribution) = D4-D181, groundnut revenue only: -656,511.75 against 3,043,580.38 (D16);
#   * S9 the IRR stream C154:M154 puts the year-10 net fixed assets (M154 = M100, 3,244,445.36) at year 10
#     without year 10's own cash flow (the block stops at L): with it, 6,575,831.78; C155 (and C240) IRR 31.69%
#     against 32.43% (32.53% with this fix alone, at the workbook's depreciation);
#   * S10 P&L!D232:L232 (payback) = C227 + C228/D230, capex over the cumulative inflow: G232 3.7932 against
#     F227 + (C228 - F230)/G229 = 3.3076; and C241 = H232, a column late (year 5): 0 against 3.3076;
#   * S11 "Growing cost  assum"!C15:L15 (groundnut total cost) = SUM(C5:C14) adds the 80 hectares: 40,435.34
#     against 40,355.34; the margin C20:L20 9,964.66 against 10,044.66;
#   * S12 C107:L107 (sorghum) = SUM(C97:C106) adds its 40 hectares: 12,433.48 against 12,393.48; C112:L112
#     25,113.19 against 25,153.19;
#   * S13 C198:L198 (alfalfa) = SUM(C188:C197) adds its 60 hectares: 50,148.27 against 50,088.27; C203:L203
#     4,397.18 against 4,457.18;
#   * S14 C149:L149 (aubergine margin) = C147-C145 subtracts the yield (50,000 kg) instead of the cost C144:
#     200,000 against 144,976.76.
# Latent, no effect on any number: sesame's rows 60-72 multiply by groundnut's hectares C$5 instead of C$59
# (both 80; the case reads C59); P&L!G98:M98 add the previous year's capex (F78, all zero); P&L!M58 tests the
# blank M60 instead of a cumulative taxable income (positive in every year anyway).
# Kept as the workbook states them (choices, not slips): alfalfa is grown at a cost but not sold (variant
# `alfalfa_sold` books its realisation, to read C201:L201 and C203:L203); the working capital loan's interest
# without the loan; non-depreciation of project management, engineering, R&D and contingency; average DSCR
# D137 over years 1-6 and average ICR D125 over years 1-7; rows 199 and 214 leave salaries out.
# Set aside: the staffing memo 'Basic Infrastructure'!I11:L22 and the alternative salary table 'Fin
# Assumptions'!G42:K56 (and the memo C55:C56, "Growing cost  assum"!N6), which no formula reads; the totals of
# the hidden Sheet1-Sheet4, a rupee estimate of another project (Pudussery, Mettupalayam, Bodinayakanur) that
# no formula reads (Sheet1's unit rates are read as drivers; Sheet5-Sheet8 hold no figure).

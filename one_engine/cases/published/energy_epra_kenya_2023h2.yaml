# Published case "energy_epra_kenya_2023h2": Kenya's electricity supply industry, 1 July to
# 31 December 2023: installed and captive capacity, energy generated by technology, and Kenya
# Power's purchased-versus-sold system losses (EPRA, Bi-Annual Energy & Petroleum Statistics
# Report FY2023/24, Tables 1.1, 1.2, 1.8 and ch.2; cases/reference/published/energy_epra_kenya_2023h2.yaml).
#
# A sector statistics report: every figure is MW, GWh or a percentage, none is money (EPRA prints
# no tariff, revenue or cost), so nothing is posted and every reading is a driver of the formulas
# generator `src`, each a published input by name:
#   * Table 1.1's rows (capacity_mw.<technology>) arrive as six-element series, one element per
#     column of the table: 0 interconnected installed, 1 interconnected effective, 2 captive,
#     3 off-grid, 4 total installed, 5 printed share. The case's six periods are those columns
#     here, so a capacity figure reads its column with `at`, and a ratio of two columns reads one
#     through lag(x, k) (the captive column, 2, seen from the total column, 4). The imports row
#     has a blank, so it arrives as the scalars imports_0..imports_4;
#   * renewables are hydro, geothermal, wind, solar and bioenergy (not thermal, imports or waste
#     heat recovery), as EPRA's own 2,776.3 MW and 84.93% count them;
#   * the generation shares divide each Table 1.2 row by the sum of its seven rows (the printed
#     6,805.28 total is not used: the books add it themselves);
#   * the renewable capacity share divides by the total installed less the 200 MW import
#     interconnector, the base EPRA's % column uses (oracle notes, does-not-reconcile 1);
#   * each month's system loss is (purchased - sold) / purchased from Table 1.8's own pair;
#   * a half-on-half change is this half's GWh over the prior half's printed GWh, less one.
# Percentages are computed as fractions and read with scale 0.01.
# FINDINGS (kept, not fitted; documented in the oracle's notes as does-not-reconcile 2): the
# printed hydro change +5.19% and wind change -18.07% divide the change by THIS half's GWh
# ((1,534.01 - 1,454.40) / 1,534.01; (972.82 - 1,148.63) / 972.82, both exact), while the same
# column's captive-solar change divides by the prior half's, so the source mixes two bases. The
# books take the prior half's for every row (+5.47%, -15.31%). (Cause found by an audit of
# 2026-10-13; the earlier note only said the pairs did not reconcile.)
# Set aside: the SAIDI/SAIFI/CAIDI reliability indices (Table 1.9) and each producer's market share
# (Table 1.10) are about outages and producers that no input describes.
published: energy_epra_kenya_2023h2
entity: sector
plant: geothermal__gwh
case:
  case: published-epra-kenya-h2
  periods: 6
  phases: [operate]
  currency: KES
  floors: {}
  generators:
    src:
      kind: formulas
      periods: 6
      inputs: published
      values:
        # Table 1.2: energy generated, half-year
        gwh_total: hydro__gwh + thermal__gwh + wind__gwh + geothermal__gwh + biomass__gwh + imports__gwh + solar__gwh
        gwh_renewable: geothermal__gwh + hydro__gwh + wind__gwh + solar__gwh
        renewable_share: gwh_renewable / gwh_total
        share_geothermal: geothermal__gwh / gwh_total
        share_hydro: hydro__gwh / gwh_total
        share_wind: wind__gwh / gwh_total
        share_solar: solar__gwh / gwh_total
        share_thermal: thermal__gwh / gwh_total
        share_imports: imports__gwh / gwh_total
        # Table 1.1, column by column (period = column)
        cap_renewable: hydro + geothermal + wind + solar + bioenergy
        cap_all_rows: hydro + geothermal + thermal + wind + solar + bioenergy + whrc
        cap_renewable_share_ex_imports: cap_renewable / cap_all_rows    # every row but imports
        captive_share_of_total: lag(cap_all_rows, 2) / (cap_all_rows + imports_4)
        solar_share_of_captive: solar / cap_all_rows
        # half-on-half changes
        chg_geothermal: geothermal__gwh / geothermal_h2_2022 - 1
        chg_hydro: hydro__gwh / hydro_h2_2022 - 1
        chg_wind: wind__gwh / wind_h2_2022 - 1
        chg_captive_solar: energy_fy2022_23_gwh / energy_fy2021_22_gwh - 1
        # Table 1.8: system losses
        loss_jul: (purchased_gwh__jul - sales_gwh__jul) / purchased_gwh__jul
        loss_aug: (purchased_gwh__aug - sales_gwh__aug) / purchased_gwh__aug
        loss_sep: (purchased_gwh__sep - sales_gwh__sep) / purchased_gwh__sep
        loss_oct: (purchased_gwh__oct - sales_gwh__oct) / purchased_gwh__oct
        loss_nov: (purchased_gwh__nov - sales_gwh__nov) / purchased_gwh__nov
        loss_dec: (purchased_gwh__dec - sales_gwh__dec) / purchased_gwh__dec
        loss_total: (purchased_gwh__total - sales_gwh__total) / purchased_gwh__total
  opening:
    sector:
      cash: {nature: asset, value: 0}
      equity: {nature: equity, value: 0}
  contracts: {}
  rulebooks: {}
  schemes: {}
  cuts: {}
  measures: {}
figures:
  total_energy_generated_gwh: {driver: src.gwh_total, at: 0}
  renewable_share_of_generation_pct: {driver: src.renewable_share, scale: 0.01, at: 0}
  technology_shares_pct.geothermal: {driver: src.share_geothermal, scale: 0.01, at: 0}
  technology_shares_pct.hydro: {driver: src.share_hydro, scale: 0.01, at: 0}
  technology_shares_pct.wind: {driver: src.share_wind, scale: 0.01, at: 0}
  technology_shares_pct.solar: {driver: src.share_solar, scale: 0.01, at: 0}
  technology_shares_pct.thermal: {driver: src.share_thermal, scale: 0.01, at: 0}
  technology_shares_pct.imports: {driver: src.share_imports, scale: 0.01, at: 0}
  renewable_installed_capacity_mw: {driver: src.cap_renewable, at: 4}
  renewable_installed_capacity_mw.share_pct: {driver: src.cap_renewable_share_ex_imports, scale: 0.01, at: 4}
  renewable_installed_capacity_mw.interconnected: {driver: src.cap_renewable, at: 0}
  renewable_installed_capacity_mw.captive: {driver: src.cap_renewable, at: 2}
  captive_capacity_mw: {driver: src.cap_all_rows, at: 2}
  captive_capacity_mw.share_of_total_installed_pct: {driver: src.captive_share_of_total, scale: 0.01, at: 4}
  captive_capacity_mw.solar_share_of_captive_pct: {driver: src.solar_share_of_captive, scale: 0.01, at: 2}
  half_on_half_changes_pct.geothermal: {driver: src.chg_geothermal, scale: 0.01, at: 0}
  half_on_half_changes_pct.hydro: {driver: src.chg_hydro, scale: 0.01, at: 0}
  half_on_half_changes_pct.wind: {driver: src.chg_wind, scale: 0.01, at: 0}
  half_on_half_changes_pct.captive_solar: {driver: src.chg_captive_solar, scale: 0.01, at: 0}
  system_loss_pct.jul: {driver: src.loss_jul, scale: 0.01, at: 0}
  system_loss_pct.aug: {driver: src.loss_aug, scale: 0.01, at: 0}
  system_loss_pct.sep: {driver: src.loss_sep, scale: 0.01, at: 0}
  system_loss_pct.oct: {driver: src.loss_oct, scale: 0.01, at: 0}
  system_loss_pct.nov: {driver: src.loss_nov, scale: 0.01, at: 0}
  system_loss_pct.dec: {driver: src.loss_dec, scale: 0.01, at: 0}
  system_loss_pct.total: {driver: src.loss_total, scale: 0.01, at: 0}
not_compared:
  reliability_indices: >-
    SAIDI, SAIFI and CAIDI (Table 1.9) measure distribution outages; no input carries outage
    durations, interruptions or customers served, so nothing here derives them
  market_share_pct: >-
    each producer's share of energy purchased (Table 1.10); no input carries energy by producer

        son_de_mil: {debit: son_de_mil, credit: cash, amount: {generator: src, output: y_son_de_mil}}
        tourteaux_de_coton: {debit: tourteaux_de_coton, credit: cash, amount: {generator: src, output: y_tourteaux_de_coton}}
        pierre_a_lecher: {debit: pierre_a_lecher, credit: cash, amount: {generator: src, output: y_pierre_a_lecher}}

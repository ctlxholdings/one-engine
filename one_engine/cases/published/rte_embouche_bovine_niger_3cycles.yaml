# Published case "rte_embouche_bovine_niger_3cycles": cattle fattening in Niger, a 3-head pen run for
# three 3-4 month cycles in a year, nine head bought and sold (PRADEL KIYO-ARZIKI, Référentiel
# technico-économique, embouche bovine, Tableaux 8 to 12, pp.8-9;
# cases/reference/published/rte_embouche_bovine_niger_3cycles.yaml).
#
# Every amount is a published input by name, or quantité x PU of a printed line (generator `src`).
# Two books, one period each:
#   * `pen`, the year (Tableaux 8, 9, 11, 12): the infrastructure (étable, fenil, fosse fumière)
#     and the equipment (nine lines) are bought for cash and capitalised, each at quantité x PU;
#     the fifteen expense lines of the three cycles (Tableau 11, depenses_exploitation_3cycles_xof),
#     quantité x PU, paid and expensed in the year (the variable costs, CV); the year's sales are
#     the printed recettes_dexploitation (the source gives no price or weight behind it), for
#     cash; the fixed charge is the printed amortisation (charges_fixes_amort_infra_et_equipement),
#     charged against accumulated depreciation; income tax at taux_impot on the net result,
#     payable at the year end (income_tax rulebook);
#   * `cycle`, one 3-month cycle's working capital (Tableau 10, fonds_de_roulement_3mois_xof):
#     its fifteen lines, quantité x PU, paid and expensed; the working capital is that cycle's
#     spend.
# The ratios are read from the books over the same amounts computed from the inputs (`per`):
# rentabilité = sales / (CV + CF), productivity of CV and CF = CV or CF / RBE, TMVC = RBE / sales,
# break-even = CF / TMVC, point mort = break-even / (sales per head, head_per_year).
# Source findings (read, they differ): Tableau 9 prints the equipment total 327,000 though its
# nine lines are 90,500, and the investment total 645,500 inherits it (409,000 on the lines);
# Tableau 10 prints the working capital 243,850 though its fifteen lines are 873,850 (the
# 630,000 cattle purchase left out of its own total).
published: rte_embouche_bovine_niger_3cycles
entity: pen
plant: recettes_dexploitation
case:
  case: published-rte-embouche-bovine
  periods: 1
  phases: [operate, tax]
  currency: XOF
  floors: {}
  generators:
    src:
      kind: formulas
      periods: 1
      inputs: published
      values:
        etable: etable__quantite * etable__pu
        fenil: fenil__quantite * fenil__pu
        fosse_fumiere: fosse_fumiere__quantite * fosse_fumiere__pu
        machette: machette__quantite * machette__pu
        rateau: rateau__quantite * rateau__pu
        brouette: brouette__quantite * brouette__pu
        mangeoires: mangeoires__quantite * mangeoires__pu
        abreuvoirs: abreuvoirs__quantite * abreuvoirs__pu
        futs_vides: futs_vides__quantite * futs_vides__pu
        seaux: seaux__quantite * seaux__pu
        fourche: fourche__quantite * fourche__pu
        cordes: cordes__quantite * cordes__pu
        y_achat_de_bovin: depenses_exploitation_3cycles_xof__achat_de_bovin__quantite * depenses_exploitation_3cycles_xof__achat_de_bovin__pu
        y_tige_de_sorgho_hachee: depenses_exploitation_3cycles_xof__tige_de_sorgho_hachee__quantite * depenses_exploitation_3cycles_xof__tige_de_sorgho_hachee__pu
        y_paille_de_brousse: depenses_exploitation_3cycles_xof__paille_de_brousse__quantite * depenses_exploitation_3cycles_xof__paille_de_brousse__pu
        y_fane_de_niebe: depenses_exploitation_3cycles_xof__fane_de_niebe__quantite * depenses_exploitation_3cycles_xof__fane_de_niebe__pu
        y_son_de_mil: depenses_exploitation_3cycles_xof__son_de_mil__quantite * depenses_exploitation_3cycles_xof__son_de_mil__pu
        y_tourteaux_de_coton: depenses_exploitation_3cycles_xof__tourteaux_de_coton__quantite * depenses_exploitation_3cycles_xof__tourteaux_de_coton__pu
        y_pierre_a_lecher: depenses_exploitation_3cycles_xof__pierre_a_lecher__quantite * depenses_exploitation_3cycles_xof__pierre_a_lecher__pu
        y_bloc_a_lecher: depenses_exploitation_3cycles_xof__bloc_a_lecher_uree_ciment__quantite * depenses_exploitation_3cycles_xof__bloc_a_lecher_uree_ciment__pu
        y_sel_foga: sel_foga__quantite * sel_foga__pu
        y_sel_cuisine: sel_cuisine__quantite * sel_cuisine__pu
        y_antiparasitaire: antiparasitaire__quantite * antiparasitaire__pu
        y_vaccination: depenses_exploitation_3cycles_xof__vaccination__quantite * depenses_exploitation_3cycles_xof__vaccination__pu
        y_multi_vitamine: depenses_exploitation_3cycles_xof__apport_multi_vitaminique__quantite * depenses_exploitation_3cycles_xof__apport_multi_vitaminique__pu
        y_traitement_individuel: depenses_exploitation_3cycles_xof__traitement_individuel__quantite * depenses_exploitation_3cycles_xof__traitement_individuel__pu
        y_main_doeuvre: depenses_exploitation_3cycles_xof__main_doeuvre__quantite * depenses_exploitation_3cycles_xof__main_doeuvre__pu
        c_achat_de_bovin: fonds_de_roulement_3mois_xof__achat_de_bovin__quantite * fonds_de_roulement_3mois_xof__achat_de_bovin__pu
        c_tige_de_sorgho_hachee: fonds_de_roulement_3mois_xof__tige_de_sorgho_hachee__quantite * fonds_de_roulement_3mois_xof__tige_de_sorgho_hachee__pu
        c_paille_de_brousse: fonds_de_roulement_3mois_xof__paille_de_brousse__quantite * fonds_de_roulement_3mois_xof__paille_de_brousse__pu
        c_fane_de_niebe: fonds_de_roulement_3mois_xof__fane_de_niebe__quantite * fonds_de_roulement_3mois_xof__fane_de_niebe__pu
        c_son_de_mil: fonds_de_roulement_3mois_xof__son_de_mil__quantite * fonds_de_roulement_3mois_xof__son_de_mil__pu
        c_tourteaux_de_coton: fonds_de_roulement_3mois_xof__tourteaux_de_coton__quantite * fonds_de_roulement_3mois_xof__tourteaux_de_coton__pu
        c_pierre_a_lecher: fonds_de_roulement_3mois_xof__pierre_a_lecher__quantite * fonds_de_roulement_3mois_xof__pierre_a_lecher__pu
        c_bloc_a_lecher: fonds_de_roulement_3mois_xof__bloc_a_lecher_uree_ciment__quantite * fonds_de_roulement_3mois_xof__bloc_a_lecher_uree_ciment__pu
        c_sel_fogha: sel_fogha__quantite * sel_fogha__pu
        c_sel: sel__quantite * sel__pu
        c_anti_parasitaire: anti_parasitaire__quantite * anti_parasitaire__pu
        c_vaccination: fonds_de_roulement_3mois_xof__vaccination__quantite * fonds_de_roulement_3mois_xof__vaccination__pu
        c_multi_vitamine: fonds_de_roulement_3mois_xof__apport_multi_vitaminique__quantite * fonds_de_roulement_3mois_xof__apport_multi_vitaminique__pu
        c_traitement_individuel: fonds_de_roulement_3mois_xof__traitement_individuel__quantite * fonds_de_roulement_3mois_xof__traitement_individuel__pu
        c_main_doeuvre: fonds_de_roulement_3mois_xof__main_doeuvre__quantite * fonds_de_roulement_3mois_xof__main_doeuvre__pu
        cv: y_achat_de_bovin + y_tige_de_sorgho_hachee + y_paille_de_brousse + y_fane_de_niebe + y_son_de_mil + y_tourteaux_de_coton + y_pierre_a_lecher + y_bloc_a_lecher + y_sel_foga + y_sel_cuisine + y_antiparasitaire + y_vaccination + y_multi_vitamine + y_traitement_individuel + y_main_doeuvre
        cf: charges_fixes_amort_infra_et_equipement
        rbe: recettes_dexploitation - cv
        total_costs: cv + cf
        tmvc: rbe / recettes_dexploitation
        per_head_margin: rbe / head_per_year
  opening:
    pen:
      cash: {nature: asset, value: 0}
      equity: {nature: equity, value: 0}
    cycle:
      cash: {nature: asset, value: 0}
      equity: {nature: equity, value: 0}
  contracts: {}
  rulebooks:
    year:
      kind: transfer
      entity: pen
      phase: operate
      declare:
        infrastructures: asset
        equipements: asset
        accumulated_depreciation: asset
        sales: income
        amortisation: expense
        achat_de_bovin: expense
        tige_de_sorgho_hachee: expense
        paille_de_brousse: expense
        fane_de_niebe: expense
        son_de_mil: expense
        tourteaux_de_coton: expense
        pierre_a_lecher: expense
        bloc_a_lecher: expense
        sel_foga: expense
        sel_cuisine: expense
        antiparasitaire: expense
        vaccination: expense
        multi_vitamine: expense
        traitement_individuel: expense
        main_doeuvre: expense
      moves:
        etable: {debit: infrastructures, credit: cash, amount: {generator: src, output: etable}}
        fenil: {debit: infrastructures, credit: cash, amount: {generator: src, output: fenil}}
        fosse_fumiere: {debit: infrastructures, credit: cash, amount: {generator: src, output: fosse_fumiere}}
        machette: {debit: equipements, credit: cash, amount: {generator: src, output: machette}}
        rateau: {debit: equipements, credit: cash, amount: {generator: src, output: rateau}}
        brouette: {debit: equipements, credit: cash, amount: {generator: src, output: brouette}}
        mangeoires: {debit: equipements, credit: cash, amount: {generator: src, output: mangeoires}}

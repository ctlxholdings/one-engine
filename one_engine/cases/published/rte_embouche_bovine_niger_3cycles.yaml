        son_de_mil: {debit: son_de_mil, credit: cash, amount: {generator: src, output: c_son_de_mil}}
        tourteaux_de_coton: {debit: tourteaux_de_coton, credit: cash, amount: {generator: src, output: c_tourteaux_de_coton}}

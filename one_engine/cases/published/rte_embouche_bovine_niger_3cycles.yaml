        futs_vides: {debit: equipements, credit: cash, amount: {generator: src, output: futs_vides}}
        seaux: {debit: equipements, credit: cash, amount: {generator: src, output: seaux}}
        fourche: {debit: equipements, credit: cash, amount: {generator: src, output: fourche}}
        cordes: {debit: equipements, credit: cash, amount: {generator: src, output: cordes}}
        sales: {debit: cash, credit: sales, amount: {generator: src, output: recettes_dexploitation}}
        achat_de_bovin: {debit: achat_de_bovin, credit: cash, amount: {generator: src, output: y_achat_de_bovin}}
        tige_de_sorgho_hachee: {debit: tige_de_sorgho_hachee, credit: cash, amount: {generator: src, output: y_tige_de_sorgho_hachee}}
        paille_de_brousse: {debit: paille_de_brousse, credit: cash, amount: {generator: src, output: y_paille_de_brousse}}

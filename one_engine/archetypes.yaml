# Deal archetypes: the kinds of deal the engine models, and what each may use.
#
# Read by one_engine/archetypes.py; tests/test_archetypes.py holds every case to it.
# Codes follow the consolidation's MODELING_TAXONOMY (A physical, B operating and
# appraisal, C accounting, D financing, E vehicles).
#
# Each archetype lists:
#   cases       patterns (fnmatch) over case ids: case/<stem> for a file in
#               one_engine/cases, panel/<stem> for an esco panel base, and
#               <family>/<oracle> for one oracle's translation (published/...,
#               golds/..., pilot/..., esco/..., external/..., workbook/...,
#               actus/<type>/<test>). Every case matches exactly one archetype.
#   modules     the engine modules its runs may call (dotted under one_engine:
#               shared modules such as kernel, tax, measures, and packs.*),
#               traced from what ran, not what was imported.
#   rulebooks, contracts, generators
#               the kinds its case files may declare (a contract's kind is its type).
#
# The lists were written from what the cases were measured to use on 2026-10-13,
# so they record the architecture as built. Re-measured on 2026-10-14, after the
# rulebooks three or more archetypes declare moved from packs.pf and packs.tea to
# one_engine/rulebooks, and after the tracer stopped counting a module a case only
# imported (B3 had nine such). Re-measured again on 2026-10-15, after the
# formulas generator, the loop rules and tax_instalments moved out of the packs. A case that needs more is either a
# different archetype or a decision to grow this one; either is made here, by a
# person, with a line in consolidation/LOG.md.
archetypes:
  A1:
    name: Production and mass balance
    cases: [case/baghara, published/sep_*, published/phys_*]
    modules: [checks, contracts, cuts, entities, formulas, inputs, kernel, packs.contracts, packs.process, packs.tea, rulebooks.postings, units]
    rulebooks: [transfer, write_down]
    contracts: [offtake, operating_cost]
    generators: [formulas]
  A3:
    name: Capex build-up and levelized cost
    cases: [published/bld_*, published/cap_*, published/energy_*]
    modules: [checks, contracts, cuts, entities, formulas, inputs, kernel, measurement, packs.contracts, rulebooks.measurement, rulebooks.postings, rulebooks.tax, tax, units]
    rulebooks: [asset_register, income_tax, settle, transfer]
    contracts: [capex, capex_class, offtake, operating_cost]
    generators: [formulas]
  B1:
    name: Operating budget and unit economics
    cases: [published/atlas_*, published/ext_*, published/bfap_*, published/landbank_*, published/iowa_*, published/rte_*, published/giz_*, published/cell_*, published/svc_*, case/modeloff_collect_the_cash, case/modeloff_hard_times, workbook/modeloff_2013_hard_times]
    # packs.valuation added 2026-10-18: the valuation lens reads every top-level case (case/*)
    modules: [checks, contracts, cuts, entities, formulas, inputs, kernel, measurement, packs.contracts, packs.valuation, rulebooks.measurement, rulebooks.postings, rulebooks.tax, tax, units]
    rulebooks: [asset_register, income_tax, pay_as_due, transfer]
    contracts: [capex, capex_class, loan, offtake, offtake_on_dates, operating_cost, payable_run_off, receivable_run_off]
    generators: [formulas]
  B2:
    name: Project appraisal (DCF, NPV, IRR)
    cases: [published/fao_*, published/ifad_*, published/mining_*, case/modeloff_time_is_money, case/modeloff_investment_property, workbook/modeloff_2014_time_is_money, workbook/modeloff_2012_investment_property, external/modeloff_property, workbook/nour_*, workbook/van_10ans_*, workbook/cap_3moissons_*, workbook/business_plan_3moissons_*, workbook/baghara_v15_24]
    # packs.valuation added 2026-10-18: the valuation lens reads every top-level case (case/*)
    modules: [allocation, checks, contracts, cuts, entities, formulas, holders, inputs, kernel, measurement, measures, packs.contracts, packs.corporate, packs.valuation, rulebooks.allocation, rulebooks.measurement, rulebooks.postings, rulebooks.tax, tax, units]
    rulebooks: [asset_register, funding_plan, held_balance, income_tax, transfer, waterfall]
    contracts: [capex, capex_class, loan, offtake, operating_cost, sponsor_equity]
    generators: [formulas]
  B3:
    name: Small-business plan with a funding need
    cases: [golds/*, pilot/*, golds_pilot/*]
    modules: [checks, contracts, cuts, entities, formulas, inputs, kernel, measurement, packs.contracts, packs.tea, rulebooks.measurement, rulebooks.postings, rulebooks.tax, tax, units]
    rulebooks: [asset_pool, asset_register, held_balance, income_tax, settle, tax_instalments, transfer, write_down]
    contracts: [capex, capex_class, offtake, operating_cost]
    generators: [formulas]
  C1:
    name: Financial statements, tax and depreciation
    cases: [published/agro_*, published/fc_*, published/tax_*, published/taxeng_*, external/cfi_*, external/ias*, case/modeloff_asset_schedule, case/modeloff_tax, workbook/modeloff_2012_asset_schedule, workbook/modeloff_2015_tax_solution, workbook/cattle_*, workbook/haraz_*]
    # packs.valuation added 2026-10-18: the valuation lens reads every top-level case (case/*)
    modules: [checks, contracts, cuts, entities, formulas, inputs, kernel, measurement, measures, packs.contracts, packs.valuation, rulebooks.measurement, rulebooks.postings, rulebooks.tax, tax, units]
    rulebooks: [asset_register, held_balance, income_tax, settle, tax_instalments, transfer]
    contracts: [capex, offtake, operating_cost]
    generators: [formulas]
  C2:
    # added 2026-10-18 for the valuation book's exhibits; a placement made by Claude as the default
    # and put to Ali (consolidation/LOG.md), to stand or move as he decides
    name: Company valuation (statements reorganized into invested capital, NOPLAT and free cash flow)
    cases: [valuation/*]
    modules: [checks, cuts, entities, formulas, inputs, kernel, measures, packs.valuation, rulebooks.postings, units]
    rulebooks: [stated, transfer]
    contracts: []
    generators: [formulas, valuation_formulas]
  D1:
    name: Project finance SPV
    cases: [case/vanilla_100mw, case/feature_50mw, case/nightmare_500mw, case/bodmer_6mw, case/averta_spv, case/modeloff_more_money_please, workbook/modeloff_2015_more_money_please, workbook/bodmer_*, published/express_fiji_*]
    # packs.valuation added 2026-10-18: the valuation lens reads every top-level case (case/*)
    modules: [allocation, checks, conditions, contracts, cuts, entities, formulas, inputs, kernel, loops, measurement, measures, packs.contracts, packs.corporate, packs.pf, packs.solar, packs.valuation, rulebooks.allocation, rulebooks.loops, rulebooks.measurement, rulebooks.postings, rulebooks.tax, tax, units]
    rulebooks: [asset_register, capital_first, forgiveness, funding_plan, income_tax, pay_as_due, pro_rata_funding, promote, provision, transfer, waterfall, withholding]
    contracts: [capex, capex_class, debt_reserve, deposit_account, financing_fee, foreign_loan, loan, maintenance_reserve, offtake, operating_cost, reserve_letter_of_credit, shareholder_loan, sinking_fund, sponsor_equity, term_loan]
    generators: [formulas, rooftop_revenue, zone_sumproduct]
  D2:
    name: Loans, deposits and other debt instruments
    cases: [actus/*, case/modeloff_acquisition_financing, case/modeloff_precise_debt, case/modeloff_fund_the_future]
    # packs.valuation added 2026-10-18: the valuation lens reads every top-level case (case/*)
    modules: [checks, contracts, cuts, dates, entities, inputs, kernel, loops, market, packs.actus, packs.contracts, packs.valuation, rulebooks.loops, rulebooks.postings, units]
    rulebooks: [pay_as_due]
    contracts: [deposit_account, loan]
    generators: []
  D3:
    name: Leveraged buyout
    cases: [case/macabacus_*, workbook/macabacus_*]
    # packs.valuation added 2026-10-18: the valuation lens reads every top-level case (case/*)
    modules: [allocation, checks, contracts, cuts, entities, formulas, holders, inputs, kernel, measures, packs.contracts, packs.corporate, packs.valuation, rulebooks.allocation, rulebooks.postings, rulebooks.tax, tax, units]
    rulebooks: [acquisition, income_tax, operating_plan, transfer, waterfall]
    contracts: [financing_fee, loan, preferred_stock, sponsor_equity]
    generators: [formulas]
  D7:
    name: Securitisation
    cases: [external/open_securitisation]
    modules: [allocation, checks, contracts, cuts, entities, formulas, inputs, kernel, measures, packs.contracts, rulebooks.allocation, rulebooks.postings, units]
    rulebooks: [transfer, waterfall]
    contracts: [sponsor_equity, term_loan]
    generators: [formulas]
  D8:
    name: Energy performance contract (ESCO)
    cases: [case/eria, case/ficompass_deal, esco/*, panel/*]
    # packs.valuation added 2026-10-18: the valuation lens reads every top-level case (case/*)
    modules: [allocation, checks, contracts, cuts, entities, formulas, inputs, kernel, loops, measures, packs.contracts, packs.obligations, packs.valuation, rulebooks.allocation, rulebooks.loops, rulebooks.postings, units]
    # serviced_bullet added 2026-10-22: esco-product's Indiana Toll Road (panel/indiana_toll_road)
    rulebooks: [claim, deficit_funding, duty, held_balance, pay_as_due, pool, ranked_distribution, serviced_bullet, stack, transfer]
    contracts: [deposit_account, equity_funding, loan, offtake, one_off_purchase, operating_cost, shared_savings, sponsor_equity]
    generators: [formulas]
  E2:
    name: Holding and fund vehicles (HoldCo, GP)
    cases: [case/averta_holdco*, case/averta_gp*]
    # packs.valuation added 2026-10-18: the valuation lens reads every top-level case (case/*)
    modules: [allocation, checks, contracts, cuts, entities, inputs, kernel, measurement, measures, packs.contracts, packs.pf, packs.solar, packs.valuation, portfolio, rulebooks.allocation, rulebooks.measurement, rulebooks.postings, rulebooks.tax, tax, units]
    rulebooks: [asset_register, capital_first, deficit_funding, funding_plan, income_tax, pay_as_due, promote, waterfall]
    contracts: [capex, loan, offtake, operating_cost, sponsor_equity]
    generators: [cohorts, instalments, rooftop_valuation]
  E4:
    name: Development company (DevCo)
    cases: [case/averta_devco*]
    # packs.valuation added 2026-10-18: the valuation lens reads every top-level case (case/*)
    modules: [allocation, checks, contracts, cuts, entities, inputs, kernel, measures, packs.contracts, packs.valuation, rulebooks.allocation, rulebooks.tax, tax, units]
    rulebooks: [capital_first, deficit_funding, income_tax, waterfall]
    contracts: [offtake, operating_cost, sponsor_equity]
    generators: []
  E5:
    name: Exit buyer
    cases: [case/averta_buyer*]
    # packs.valuation added 2026-10-18: the valuation lens reads every top-level case (case/*)
    modules: [allocation, checks, conditions, contracts, cuts, entities, inputs, kernel, measurement, measures, packs.contracts, packs.pf, packs.solar, packs.valuation, portfolio, rulebooks.allocation, rulebooks.measurement, rulebooks.postings, rulebooks.tax, tax, units]
    rulebooks: [asset_register, capital_first, funding_plan, waterfall]
    contracts: [capex, debt_reserve, offtake, operating_cost, sponsor_equity, term_loan]
    generators: [acquisition, cohorts]

# Averta reference SPV: one 124.12 kWp rooftop project, as the live model runs it (plan step 8).
#
# Source: 01-averta 01_model/engine_v2 at commit cab622b,
# engine_v2.runners.run_averta.build_reference_spv(cfg, params, n_periods=100), at the P50 specific
# yield (1488.2 kWh/kWp, zone-weighted). What it was given and what it
# produced are in cases/reference/averta_live/spv_p50.json
# (consolidation/experiments/capture_averta_live.py); this file is written
# by make_case_averta_spv.py.
#
# Grid: 100 quarters. Period 0 is construction (the asset is bought), COD is
# period 1, period 99 is the terminal period. EUR.
#
# How the live model's SPV is assembled here:
#   * revenue: two offtakes (self-consumption and surplus), volume x price
#     each quarter, collected on 45 days' terms (AR target = the quarter's
#     revenue x 45 / 91.25, nil at the terminal period);
#   * six operating cost lines, each a fixed annual amount / 4 times an
#     index stepped once a year, paid on 30 days' terms;
#   * the asset is bought at period 0 at the transfer price
#     ((600 EUR/kWp x kWp + effective devex) x 1.075 = '437912/5') with 21%
#     VAT, refunded a quarter later; equity funds both (funding_plan, the
#     residual);
#   * depreciation: book over 100 quarters from COD, the rest written off at
#     period 99; tax over 48 quarters (12 years) from COD (the register's
#     tax side, the 'timing' lines of the tax base); tax at 25% of the base
#     after losses (no expiry), paid the quarter it is charged; deferred tax
#     on the difference and on the losses, as one net balance;
#   * the inverter replacement reserve: '37236/5' (60 EUR/kWp) paid in
#     equal parts each quarter from COD to period 49 inclusive, whatever
#     the cash (the live S7 posts it unconditionally: pay_as_due, before the
#     waterfall), and all of it taken back into cash at period 49
#     (a deposit_account with no return that closes then). Declared: the live
#     model never spends it (S7's drawdown is not passed to S4), so it is
#     reproduced as a reserve that returns to the distribution;
#   * distributions: each quarter's cash flow after tax and the reserve,
#     contributed capital returned first (capital_first). Declared: the live
#     waterfall distributes current-period CFADS only, so the capex VAT
#     refund received at period 1 ('2299038/125') stays in the account until the
#     terminal sweep at period 99: a keep tier holds exactly it from 1 to 98.

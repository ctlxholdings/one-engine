      cargo: {1: 0.035841, 2: 0.026538, 3: 0.014336, 4: 0.007168, 5: 0.004595, 6: 0.002867}
      market: {1: 0.1, 2: 0.113, 3: 0.108, 4: 0.103, 5: 0.1, 6: 0.097}
      margin: 0.008
      discount_factor: 0.85

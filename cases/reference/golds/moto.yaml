passage: |
  SETTING & CURRENCY. A single owner-operated zémidjan (moto-taxi) in Cotonou, Benin; the domestic
  currency is the West African CFA franc (XOF), the "francs" of the utterance. The stated useful life —
  "quatre bonnes années" — fixes both the depreciation life and the natural horizon: an acquisition
  instant (t=0) followed by four operating years (t=1..4). With no growth or price change stated, the
  four operating years are identical in flow; only the moto's book value rolls down.

  STEP 1 — ACTIVITY (trips per year). He works every day except Sunday, i.e. 6 days/week; on a 52-week
  convention that is 6 x 52 = 312 working days/year (DEFAULTED; a 365-52 Sundays count gives 313 —
  immaterial). At 20 trips/day on average, annual volume = 20 x 312 = 6,240 trips.

  STEP 2 — FARE MIX & REVENUE. Fares are tiered: short 200, medium 300, long 500 XOF. The mix was not
  given, so I apply a uniform 1/3-1/3-1/3 split (ASSUMED; natural elicitation: "what share of your trips
  are short / medium / long?"). Because 6,240 divides evenly by three, each tier carries exactly 2,080
  trips. Revenue = 2,080x200 + 2,080x300 + 2,080x500 = 416,000 + 624,000 + 1,040,000 = 2,080,000 XOF/yr
  (equivalently average fare 1,000/3 ≈ 333.3 x 6,240).

  STEP 3 — DISTANCE (the trips->km friction). Fuel is metered per kilometre, but the founder speaks in
  trips and flat fares, not kilometres — a genuine friction that must be bridged. I assign representative
  loaded distances per tier (ASSUMED): short 2 km, medium 4 km, long 6 km. Loaded distance =
  2,080x2 + 2,080x4 + 2,080x6 = 24,960 km/yr. A moto-taxi also runs empty between fares, so I gross up by
  a dead-head factor of 1.25 (ASSUMED) -> 31,200 total km/yr (≈100 km/day — plausible for a full urban day).

  STEP 4 — FUEL COST. Stated consumption 2.5 L/100 km = 0.025 L/km (INFERRED). Litres = 31,200 x 0.025 =
  780 L/yr. At 725 XOF/L, fuel = 780 x 725 = 565,500 XOF/yr (27% of revenue).

  STEP 5 — MAINTENANCE. Nothing was said about upkeep, yet a moto covering 31,200 km/yr needs oil, chain,
  tyres, brakes and repairs; a zero figure would flatter the result. I charge 5 XOF/km (ASSUMED; elicit
  "what do you spend on repairs, oil and tyres?") -> 31,200 x 5 = 156,000 XOF/yr.

  STEP 6 — EBITDA. Revenue - fuel - maintenance = 2,080,000 - 565,500 - 156,000 = 1,358,500 XOF/yr.

  STEP 7 — DEPRECIATION. Moto costs 600,000, lasts 4 years; straight-line to nil salvage (DEFAULTED) =
  600,000 / 4 = 150,000 XOF/yr, booked each operating year. Net book value: 600,000 (t0) -> 450,000 ->
  300,000 -> 150,000 -> 0 (t4); accumulated depreciation 0 -> 150,000 -> 300,000 -> 450,000 -> 600,000.

  STEP 8 — EBIT & TAX. EBIT = 1,358,500 - 150,000 = 1,208,500. For NOPAT I apply Benin's statutory
  business income-tax rate of 30% (DEFAULTED) -> tax 362,550; NOPAT = 845,950 XOF/yr. JUDGMENT/FLAG: a
  real informal zémidjan almost certainly falls under Benin's synthetic micro-regime (Taxe
  Professionnelle Unique), a small turnover-based levy, not 30% IS — so 30% is a conservative
  formal-sector reference that understates after-tax cash. This is the single largest elicitation.

  STEP 9 — WORKING CAPITAL. Pure cash trade: fares on the spot, fuel in cash, no receivables/payables/
  inventory of consequence. NWC = 0 every period, so ΔNWC = 0 (INFERRED).

  STEP 10 — CAPEX. The 600,000 outflow occurs once, at acquisition (t=0); no reinvestment within the
  4-year life; salvage assumed nil at t=4.

  STEP 11 — FCFF BUILD. Operating years (t=1..4, all identical):
    FCFF = NOPAT 845,950 + D&A 150,000 - ΔNWC 0 - capex 0 = 995,950 XOF.
    (CFO = 845,950 + 150,000 = 995,950; CFI = -0; FCFF = CFO + CFI = 995,950.)
  Acquisition (t=0): NOPAT 0 + D&A 0 - ΔNWC 0 - capex 600,000 = -600,000 (CFO 0 + CFI -600,000).

  HORIZON RESULT. FCFF = [-600,000; 995,950; 995,950; 995,950; 995,950]; undiscounted sum = 3,383,800 XOF
  over the moto's life. Operating cash of ~996,000/yr against a 600,000 machine implies a payback of
  roughly seven months — characteristic moto-taxi economics, where the truly scarce input is the owner's
  own labour. This FCFF is struck BEFORE any charge for the proprietor's labour; imputing a market driver's
  wage (order 0.5-0.7 m XOF/yr) would roughly halve the residual return to capital.


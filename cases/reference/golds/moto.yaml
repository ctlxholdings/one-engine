  trips_per_year:      [0, 6240, 6240, 6240, 6240]
  trips_short:         [0, 2080, 2080, 2080, 2080]
  trips_medium:        [0, 2080, 2080, 2080, 2080]
  trips_long:          [0, 2080, 2080, 2080, 2080]
  revenue:             [0, 2080000, 2080000, 2080000, 2080000]
  km_loaded:           [0, 24960, 24960, 24960, 24960]
  km_total:            [0, 31200, 31200, 31200, 31200]
  fuel_litres:         [0, 780, 780, 780, 780]
  fuel_cost:           [0, 565500, 565500, 565500, 565500]
  maintenance:         [0, 156000, 156000, 156000, 156000]
  ebitda:              [0, 1358500, 1358500, 1358500, 1358500]
  depreciation:        [0, 150000, 150000, 150000, 150000]
  ebit:                [0, 1208500, 1208500, 1208500, 1208500]
  tax:                 [0, 362550, 362550, 362550, 362550]
  nopat:               [0, 845950, 845950, 845950, 845950]
  capex:               [600000, 0, 0, 0, 0]
  accum_depreciation:  [0, 150000, 300000, 450000, 600000]
  book_value:          [600000, 450000, 300000, 150000, 0]
  nwc:                 [0, 0, 0, 0, 0]
  delta_nwc:           [0, 0, 0, 0, 0]
  cfo:                 [0, 995950, 995950, 995950, 995950]
  cfi:                 [-600000, 0, 0, 0, 0]
  fcff:                [-600000, 995950, 995950, 995950, 995950]

fcff: [-600000, 995950, 995950, 995950, 995950]

checks:
  # --- conservation ---
  - "trace.book_value[t] == trace.book_value[t-1] + trace.capex[t] - trace.depreciation[t]"
  - "trace.accum_depreciation[t] == trace.accum_depreciation[t-1] + trace.depreciation[t]"
  - "trace.book_value[t] + trace.accum_depreciation[t] == cumsum(trace.capex)[t]"
  - "cumsum(trace.delta_nwc) == trace.nwc"
  - "trace.trips_short[t] + trace.trips_medium[t] + trace.trips_long[t] == trace.trips_per_year[t]"
  # --- definition (the ladder) ---
  - "trace.ebitda == trace.revenue - trace.fuel_cost - trace.maintenance"
  - "trace.ebit == trace.ebitda - trace.depreciation"
  - "trace.nopat == trace.ebit - trace.tax"
  - "trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc"
  - "trace.cfi == -trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex"
  # --- driver-bridge ---
  - "trace.trips_per_year == trips_per_day * working_days for t >= ops_start"
  - "trace.revenue == trace.trips_short*fare_short + trace.trips_medium*fare_medium + trace.trips_long*fare_long"
  - "trace.km_loaded == trace.trips_short*dist_short + trace.trips_medium*dist_medium + trace.trips_long*dist_long"
  - "trace.km_total == trace.km_loaded * deadhead_factor"
  - "trace.fuel_litres == trace.km_total * fuel_consumption_l_per_km"
  - "trace.fuel_cost == trace.fuel_litres * fuel_price"
  - "trace.maintenance == trace.km_total * maint_rate_per_km"
  - "trace.depreciation == moto_cost / moto_life for t >= ops_start"
  - "trace.tax == trace.ebit * tax_rate"
  - "trace.capex[first] == moto_cost"
  - "sum(trace.capex) == moto_cost"
  # --- non-negativity ---
  - "trace.book_value[t] >= 0"
  - "trace.fuel_litres[t] >= 0"
  - "trace.ebitda[t] >= 0"
  - "trace.nopat[t] >= 0"

notes:
  - "OWNER'S LABOUR is not costed. As a sole owner-operator taking the residual, no wage is expensed, so this FCFF is pre-proprietor-compensation — it rewards BOTH the capital and the owner's own labour. Imputing a market driver's wage (~0.5-0.7 m XOF/yr) would cut the return to capital roughly in half. Standard micro-enterprise convention; flagged as the key interpretive caveat."
  - "TAX is the biggest single lever. 30% Benin corporate income tax (IS) is applied for a standard formal reference, but an informal Cotonou zémidjan realistically pays the synthetic Taxe Professionnelle Unique (a small turnover-based levy) and little formal income tax. Under that regime after-tax FCFF would be materially higher (approaching EBITDA less a small fixed levy)."
  - "FARE MIX assumed uniform (1/3 each) because unstated. Revenue is linear in the mix: a long-trip-heavy day raises revenue (max 500/trip = 3.12 m/yr if all long; min 200/trip = 1.248 m/yr if all short). ELICIT the actual split."
  - "TRIPS->KM BRIDGE is the main fuel/maintenance uncertainty. Per-tier distances (2/4/6 km) and the 1.25 dead-head factor are assumed to convert trips into the km that fuel and upkeep depend on. ELICIT typical km/day (currently ≈100 km/day). Fuel and maintenance scale directly with total km."
  - "MAINTENANCE at 5 XOF/km (156,000/yr) is a domain prior; unstated. ELICIT actual spend on oil, chain, tyres, brakes, repairs."
  - "WORKING DAYS = 312 (52x6). A 365-52 count gives 313 (immaterial). Unplanned downtime (illness, heavy rain, days the moto is in the shop, public holidays) is NOT modelled and would scale revenue, fuel and maintenance together; the stated '20 trips/day on average' partly absorbs this."
  - "NO GROWTH / NO INFLATION: fares and the 725 XOF/L fuel price are held flat in nominal terms across all four years. In practice Benin petrol prices swing (incl. cheaper informal 'kpayo' cross-border fuel, which would lower the fuel line) while fares are sticky. Deferred."
  - "SALVAGE assumed nil at t=4 ('quatre bonnes années' => worn out). A modest scrap/resale value would add a small positive terminal inflow."
  - "OTHER SMALL COSTS not separately modelled: union/'syndicat' dues, plate/registration, phone airtime. Each could add a small fixed annual charge. ELICIT."
  - "FINANCING excluded by construction (unlevered FCFF). Many drivers acquire the moto on credit or a work-to-own arrangement; that affects equity cash flow and the acquisition timing, not asset-side FCFF."
  - "GRID CONVENTION: t=0 is the acquisition instant (capex only); t=1..4 are the four operating years, over which depreciation is booked and the book value runs 600,000 -> 0. Undiscounted lifetime FCFF = 3,383,800 XOF; no discount rate was applied (none is derivable from the utterance)."

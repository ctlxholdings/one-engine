  price_per_loaf:
    value: 250
    unit: XOF/loaf
    prov: STATED
    source: "vendus à deux cent cinquante francs pièce"
    date: 2026-07-24

  days_per_year:
    value: 365
    unit: days/year
    prov: INFERRED
    source: "Je travaille tous les jours — working every day entails no closure day in the year, hence a full calendar year of baking. Calendar length of 365 days; leap days ignored (DEFAULTED, 365-day convention)."
    date: 2026-07-24

  bakers_count:
    value: 2
    unit: persons
    prov: STATED
    source: "Je paie deux boulangers"
    date: 2026-07-24

  baker_wage_month:
    value: 100000
    unit: XOF/month/person
    prov: STATED
    source: "deux boulangers à cent mille par mois chacun"
    date: 2026-07-24

  rent_month:
    value: 800000
    unit: XOF/month
    prov: STATED
    source: "le loyer du local est à huit cent mille par mois"
    date: 2026-07-24

  months_per_year:
    value: 12
    unit: months/year
    prov: DEFAULTED
    source: "Calendar convention — monthly commitments annualise at 12 months per year."
    date: 2026-07-24

  flour_cost_normal:
    value: 150
    unit: XOF/loaf
    prov: STATED
    source: "Normalement la farine me coûte cent cinquante francs par pain"
    date: 2026-07-24

  flour_cost_shock:
    value: 300
    unit: XOF/loaf
    prov: STATED
    source: "elle est montée à trois cents francs par pain"
    date: 2026-07-24

  shock_periods:
    value: 1
    unit: years
    prov: INFERRED
    source: "cette année la farine a doublé ... l'année prochaine ça redescendra à la normale — the elevated price covers exactly the current year (period t=0); normalisation begins in the following year. Hence exactly one shocked period."
    date: 2026-07-24

  horizon_years:
    value: 5
    unit: years
    prov: DEFAULTED
    source: "Analyst horizon convention — the shortest grid that shows (a) the shock year, (b) the normalisation year, and (c) enough stable years to absorb the banked tax loss and reveal whether the business recovers the cash it lost. Four stable years exhaust the loss pool, so five periods is the minimum self-contained horizon."
    date: 2026-07-24

  owner_salary_month:
    value: 0
    unit: XOF/month
    prov: ELICITED
    source: "OPEN QUESTION — the founder says Je travaille tous les jours but never says he draws a wage. No compensation for owner labour is recorded. Carried at nil pending answer; see notes."
    date: 2026-07-24

  other_variable_cost_per_loaf:
    value: 0
    unit: XOF/loaf
    prov: ELICITED
    source: "OPEN QUESTION — flour is the only per-loaf input named. Yeast, salt, water, oven fuel (wood/gas/electricity), sacks and packaging, and wastage on unsold loaves are all absent from the utterance. Carried at nil pending answer; see notes."
    date: 2026-07-24

  capex_per_year:
    value: 0
    unit: XOF/year
    prov: ELICITED
    source: "OPEN QUESTION — no oven, equipment, vehicle or purchase is described, and the premises are rented (le loyer du local), so no building is owned. No asset base can be derived from the words. Carried at nil pending answer; see notes."
    date: 2026-07-24

  depreciation_per_year:
    value: 0
    unit: XOF/year
    prov: ELICITED
    source: "OPEN QUESTION — follows from the absence of any described depreciable asset. Carried at nil pending answer; see notes."
    date: 2026-07-24

  flour_stock_days:
    value: 7
    unit: days
    prov: ASSUMED
    source: "DOMAIN PRIOR (flagged) — a small daily bakery in a market supplied by importers typically buys flour in weekly sacks. Nothing in the utterance states purchase frequency or stock cover. One week of usage held as inventory."
    date: 2026-07-24

  receivable_days:
    value: 0
    unit: days
    prov: ASSUMED
    source: "DOMAIN PRIOR (flagged) — over-the-counter bread retail in this setting is a cash trade; no customer credit is described. Nil receivables."
    date: 2026-07-24

  payable_days:
    value: 0
    unit: days
    prov: ASSUMED
    source: "DOMAIN PRIOR (flagged) — no supplier credit is described, and an import-stressed flour market is where credit is least likely to be extended. Nil trade payables. This is the conservative direction for cash."
    date: 2026-07-24

  nwc_opening:
    value: 525000
    unit: XOF
    prov: ASSUMED
    source: "Derived as flour_stock_days * loaves_per_day * flour_cost_normal = 7 * 500 * 150. The stock on hand at the start of the shock year was bought before the shock, at the normal price. Rests on the ASSUMED 7-day cover, therefore ASSUMED, not INFERRED."
    date: 2026-07-24

  tax_rate:
    value: 0.25
    unit: ratio
    prov: ASSUMED
    source: "DOMAIN PRIOR (flagged) — standard corporate income tax rate in the CFA-franc zone sits in a 25-30 percent band. 25 percent applied. The founder says nothing about tax, registration or regime."
    date: 2026-07-24

  nol_opening_balance:
    value: 0
    unit: XOF
    prov: ASSUMED
    source: "DOMAIN PRIOR (flagged) — Normalement la farine me coûte cent cinquante francs par pain describes a normally profitable trade, so no inherited tax losses are carried into the shock year. Opening loss pool nil."
    date: 2026-07-24

passage: |
  ================================================================
  STEP 0 — WHAT THE BUSINESS PHYSICALLY IS
  ================================================================
  This is a single-site artisanal bakery running one physical process: flour in, loaves
  out, sold over the counter. The founder describes it in exactly the quantities the
  process runs on — loaves per day, francs per loaf of flour, francs per loaf of bread —
  and only two commitments that do not scale with loaves: two bakers on monthly wages
  and one monthly rent. That is a textbook one-product operation with a single variable
  input priced per unit of output and a fixed cost block. I keep his units (the loaf,
  the day) as primitives and annualise only at the last possible moment.

  The grid is five annual periods. Period t=0 is the current, shocked year; t=1 is the
  year flour returns to normal; t=2, t=3, t=4 are the stable years the founder expects
  ("après ça devrait rester stable").

  ================================================================
  STEP 1 — ANNUAL VOLUME
  ================================================================
  "Je fais cinq cents pains par jour" gives 500 loaves/day. "Je travaille tous les
  jours" is decisive on the day count: every day means no closure, so 365 baking days,
  not the 300-ish a six-day-week bakery would run.

      loaves_produced = 500 loaves/day x 365 days/year = 182,500 loaves/year

  Same in every period: the founder describes no growth, no capacity change, and no
  seasonal pattern.

  Production equals sales. He says the loaves are made and sold in a single breath
  ("cinq cents pains par jour, vendus a deux cent cinquante francs piece"), and bread is
  a same-day good, so there is no finished-goods build. Whether some loaves go unsold is
  an open question I flag rather than invent (see notes).

  ================================================================
  STEP 2 — REVENUE
  ================================================================
  Price is 250 per loaf and stays there for the whole horizon. This is not an assumption
  I supplied — he states the constraint himself and gives its reason: "Je n'ai pas pu
  augmenter le prix du pain : ici les gens ne suivraient pas, le pain c'est politique."
  Nothing in the utterance says that constraint lifts when flour normalises.

      revenue = 182,500 loaves x 250 XOF/loaf = 45,625,000 XOF/year

  Flat in all five periods: 45,625,000 each year.

  ================================================================
  STEP 3 — FLOUR, THE ONLY COSTED VARIABLE INPUT
  ================================================================
  The founder has already done the analyst's job of normalising: he quotes flour per
  loaf, not per sack. Two levels are stated outright:

      normal      150 XOF/loaf   ("Normalement la farine me coute cent cinquante")
      shock year  300 XOF/loaf   ("elle est montee a trois cents francs par pain")

  and the two are internally consistent with "la farine a doublé" (300 = 2 x 150), which
  is a free corroboration of both numbers.

  Timing: "cette année" for the shock, "l'année prochaine ça redescendra à la normale".
  So exactly one shocked period, then normal thereafter.

      t=0:      182,500 x 300 = 54,750,000
      t=1..4:   182,500 x 150 = 27,375,000

  Other per-loaf inputs (yeast, salt, water, oven fuel, sacks) are not mentioned at all.
  I carry them as an explicit nil line rather than silently omitting them, so the gap is
  visible in the ladder and testable.

      other_variable_cost = 0 x 182,500 = 0 in every period

  ================================================================
  STEP 4 — UNIT CONTRIBUTION: THE CRUX OF THE WHOLE CASE
  ================================================================
  Contribution per loaf = price - flour - other variable:

      normal year:   250 - 150 - 0 = +100 XOF/loaf
      shock year:    250 - 300 - 0 =  -50 XOF/loaf

  This is the single most important number in the business. In the shock year the
  contribution margin is NEGATIVE: every loaf that comes out of the oven destroys 50
  francs before a single franc of wages or rent has been met. The usual break-even
  question ("how many loaves cover the fixed costs?") has no answer in that year — there
  is no volume at which the operation covers its fixed block, because volume makes
  things worse, not better.

      gross_profit t=0     = 182,500 x (-50)  =  -9,125,000
      gross_profit t=1..4  = 182,500 x (+100) = +18,250,000

  ================================================================
  STEP 5 — FIXED OPERATING COSTS
  ================================================================
  Wages: "deux boulangers à cent mille par mois chacun"

      wages = 2 persons x 100,000 XOF/month x 12 months = 2,400,000 XOF/year

  Rent: "le loyer du local est à huit cent mille par mois"

      rent = 800,000 x 12 = 9,600,000 XOF/year

  Owner compensation: he works every day but names no draw for himself.

      owner_comp = 0 x 12 = 0

      fixed_costs = 2,400,000 + 9,600,000 + 0 = 12,000,000 XOF/year

  Held flat in nominal terms across all five periods. Nothing in the utterance escalates
  wages or rent, and his own forward view is that things "devrait rester stable". Note
  that rent alone (9.6m) is four times the entire wage bill (2.4m) — this is a
  rent-heavy, labour-light cost structure, which matters because rent cannot be reduced
  by baking fewer loaves.

  ================================================================
  STEP 6 — EBITDA, AND THE ONE EXTERNAL CROSS-CHECK AVAILABLE
  ================================================================
      t=0:     -9,125,000 - 12,000,000 = -21,125,000
      t=1..4: +18,250,000 - 12,000,000 =  +6,250,000

  The sign in t=0 is corroborated by the founder himself: "J'ai tenu toute l'année à
  perte." That is the only outside validation of the whole price-volume-cost triangle,
  and it holds: the model reproduces his stated loss without being told to. Had my
  volume or day-count been wrong by enough, the shock year could have come out positive
  and contradicted him.

  Note the asymmetry that dominates this case: the shock year loses 21.1m; a normal year
  earns 6.25m. One bad year costs about three and a half good ones.

  ================================================================
  STEP 7 — DEPRECIATION AND CAPEX
  ================================================================
  A bakery physically requires an oven. The founder never mentions one — no purchase, no
  cost, no age, no life — and he rents the premises ("le loyer du local"), so no building
  sits on his balance sheet either. There is no route from his words to an asset base.

  I therefore carry depreciation = 0 and capex = 0 in every period, and record the oven
  and equipment as an open elicitation rather than inventing a number. The direction of
  the resulting error is known and one-sided: any real depreciable asset lowers EBIT, and
  any real replacement or maintenance spend lowers FCFF. The model as built is an upper
  bound on asset-side cash flow in this respect.

      EBIT = EBITDA - 0, so EBIT = -21,125,000; then +6,250,000 in each of t=1..4.

  ================================================================
  STEP 8 — CASH TAX AND THE LOSS CARRY-FORWARD
  ================================================================
  FCFF is built on unlevered cash taxes charged on EBIT. Because the business carries no
  debt in anything the founder describes, unlevered tax and actual tax coincide — there
  is no interest shield to strip out.

  Rate: nothing is stated. I apply 25 percent, the standard corporate rate in the
  CFA-franc zone, explicitly flagged as an assumption.

  The shock-year loss is not refundable — no carry-back is available in these regimes —
  so it is banked and relieved against later profits. The horizon is short enough that a
  standard five-year carry-forward and an unlimited one produce the same schedule.

  Roll-forward of the loss pool (opening balance nil):

      t=0  open 0
           EBIT -21,125,000 -> 21,125,000 added to pool
           relief used 0 (no profit to shelter)
           taxable income = -21,125,000 + 21,125,000 - 0 = 0
           cash tax = 0
           close 21,125,000

      t=1  open 21,125,000
           EBIT +6,250,000; relief used = min(21,125,000; 6,250,000) = 6,250,000
           taxable income = 6,250,000 + 0 - 6,250,000 = 0
           cash tax = 0
           close 21,125,000 - 6,250,000 = 14,875,000

      t=2  open 14,875,000; relief 6,250,000; taxable 0; tax 0; close  8,625,000
      t=3  open  8,625,000; relief 6,250,000; taxable 0; tax 0; close  2,375,000

      t=4  open 2,375,000
           EBIT +6,250,000; relief used = min(2,375,000; 6,250,000) = 2,375,000
           taxable income = 6,250,000 - 2,375,000 = 3,875,000
           cash tax = 0.25 x 3,875,000 = 968,750
           close 0

  So the shock does not only destroy a year of profit; it also buys four tax-free years.
  The taxman reappears only in year five, and even then at a partial charge.

      NOPAT = EBIT - cash tax
      t=0: -21,125,000    t=1: 6,250,000    t=2: 6,250,000
      t=3:   6,250,000    t=4: 6,250,000 - 968,750 = 5,281,250

  ================================================================
  STEP 9 — WORKING CAPITAL
  ================================================================
  Three components, and only one of them is alive.

  Receivables: bread sold over the counter is a cash trade; no customer credit is
  described. Nil. (Assumed, flagged.)

  Finished goods: bread is baked and sold the same day; it does not carry over. Nil.
  (Assumed on the perishability prior, flagged.)

  Flour stock: the one real balance sheet item this business has. The founder never says
  how often he buys, so I carry one week of cover — 7 days — flagged as assumed. Under
  IAS 2 it is measured at cost, and the cost per loaf-equivalent is precisely the flour
  price he quotes.

      opening (start of t=0, bought pre-shock at the normal price):
          7 x 500 x 150 = 525,000
      t=0 close:  7 x 500 x 300 = 1,050,000
      t=1..4 close: 7 x 500 x 150 =   525,000

  Payables: nil (assumed cash purchase), so NWC = flour stock throughout.

      NWC:        1,050,000; 525,000; 525,000; 525,000; 525,000
      delta NWC:   +525,000; -525,000;       0;       0;       0

  This is the second, quieter bite of the shock and it is easy to miss: the same physical
  week of flour costs twice as much to finance while the price is high, so the shock
  absorbs an extra 525,000 of cash in t=0 on top of the trading loss — and releases it
  again in t=1 as the price normalises. Over the horizon the swing nets to zero, so the
  assumed stock cover moves cash between t=0 and t=1 and changes nothing else.

  ================================================================
  STEP 10 — THE UNLEVERED FREE CASH FLOW
  ================================================================
      FCFF = NOPAT + D&A - delta NWC - capex

      t=0: -21,125,000 + 0 -   525,000 - 0 = -21,650,000
      t=1:  +6,250,000 + 0 - (-525,000) - 0 =  +6,775,000
      t=2:  +6,250,000 + 0 -         0  - 0 =  +6,250,000
      t=3:  +6,250,000 + 0 -         0  - 0 =  +6,250,000
      t=4:  +5,281,250 + 0 -         0  - 0 =  +5,281,250

  Equivalently, via the cash statement: CFO = NOPAT + D&A - delta NWC and CFI = -capex,
  which is nil in every period because nothing is bought.

      cumulative FCFF: -21,650,000; -14,875,000; -8,625,000; -2,375,000; +2,906,250

  ================================================================
  STEP 11 — READING THE RESULT
  ================================================================
  Three things fall out that were not obvious from the founder's account.

  First, the business does not climb back above water until year five. One year of
  doubled flour consumes roughly three and a half years of normal cash generation, and
  the whole five-year horizon nets to only about 2.9m of cumulative free cash — less
  than half of one normal year's cash flow.

  Second, the tax shelter is a real and substantial part of the recovery. Four of the
  five years pay no tax at all, purely because the loss was banked.

  Third, and most uncomfortable: in the shock year the loaves themselves were the
  problem, not the overheads. At a negative contribution per loaf, baking 182,500 loaves
  destroyed value relative to baking none; the flour spread alone accounts for the
  gross_profit line at t=0, on top of the fixed block that would have run regardless.
  The founder kept going for reasons he states plainly and which are not financial ("le
  pain c'est politique"). I have modelled the business as he ran it, not as an optimiser
  would have run it.

  And all of that is BEFORE an oven, before fuel, before the founder's own wage — three
  costs that certainly exist and that the model, on his words alone, cannot see.

trace:

  # CORRECTED 2026-07-25 (physical audit): flour is now costed on a consistent FIFO basis.
  # The prior version valued ALL shock-year consumption at the 300 replacement price while
  # carrying the opening buffer at the 150 historical price — mixing two cost bases and
  # double-counting the buffer revaluation, which overstated the t0 cash bleed by 525,000
  # and the t1 inflow by the same (cumulative unaffected). See notes.inventory_cost_basis.
  flour_cost_per_loaf:   [300, 150, 150, 150, 150]     # marginal / replacement price
  loaves_produced:       [182500, 182500, 182500, 182500, 182500]
  revenue:               [45625000, 45625000, 45625000, 45625000, 45625000]
  buffer_price_open:     [150, 300, 150, 150, 150]     # price the opening buffer was bought at
  buffer_loaves:         [3500, 3500, 3500, 3500, 3500]
  flour_purchases:       [54750000, 27375000, 27375000, 27375000, 27375000]   # physical buys = consumption
  flour_cost:            [54225000, 27900000, 27375000, 27375000, 27375000]   # FIFO COGS
  other_variable_cost:   [0, 0, 0, 0, 0]
  contribution_per_loaf: [-50, 100, 100, 100, 100]     # MARGINAL (price - replacement flour)
  gross_profit:          [-8600000, 17725000, 18250000, 18250000, 18250000]
  wages:                 [2400000, 2400000, 2400000, 2400000, 2400000]
  rent:                  [9600000, 9600000, 9600000, 9600000, 9600000]
  owner_comp:            [0, 0, 0, 0, 0]
  fixed_costs:           [12000000, 12000000, 12000000, 12000000, 12000000]
  ebitda:                [-20600000, 5725000, 6250000, 6250000, 6250000]
  depreciation:          [0, 0, 0, 0, 0]
  ebit:                  [-20600000, 5725000, 6250000, 6250000, 6250000]
  nol_opening:           [0, 20600000, 14875000, 8625000, 2375000]
  loss_added:            [20600000, 0, 0, 0, 0]
  loss_used:             [0, 5725000, 6250000, 6250000, 2375000]
  nol_closing:           [20600000, 14875000, 8625000, 2375000, 0]
  taxable_income:        [0, 0, 0, 0, 3875000]
  cash_tax:              [0, 0, 0, 0, 968750]
  nopat:                 [-20600000, 5725000, 6250000, 6250000, 5281250]
  inventory_flour:       [1050000, 525000, 525000, 525000, 525000]
  receivables:           [0, 0, 0, 0, 0]
  payables:              [0, 0, 0, 0, 0]
  nwc:                   [1050000, 525000, 525000, 525000, 525000]
  delta_nwc:             [525000, -525000, 0, 0, 0]
  capex:                 [0, 0, 0, 0, 0]
  cfo:                   [-21125000, 6250000, 6250000, 6250000, 5281250]
  cfi:                   [0, 0, 0, 0, 0]
  fcff:                  [-21125000, 6250000, 6250000, 6250000, 5281250]
  cumulative_fcff:       [-21125000, -14875000, -8625000, -2375000, 2906250]

fcff: [-21125000, 6250000, 6250000, 6250000, 5281250]

checks:

  # ---- conservation ----
  - "trace.nol_closing[t] == trace.nol_opening[t] + trace.loss_added[t] - trace.loss_used[t]"
  - "trace.nol_opening[t] == trace.nol_closing[t-1]"
  - "sum(trace.loss_used) == sum(trace.loss_added) - trace.nol_closing[last]"
  - "trace.loss_used[t] <= trace.nol_opening[t]"
  - "cumsum(trace.delta_nwc) == trace.nwc - nwc_opening"
  - "sum(trace.delta_nwc) == trace.nwc[last] - nwc_opening"
  # inventory conservation: closing stock = opening + purchases - COGS (ties FIFO to cash buys)
  - "trace.inventory_flour == trace.buffer_loaves * trace.buffer_price_open + trace.flour_purchases - trace.flour_cost"
  - "trace.cumulative_fcff == cumsum(trace.fcff)"
  - "sum(trace.fcff) == trace.cumulative_fcff[last]"
  - "grid.periods == horizon_years"

  # ---- definition (the ladder) ----
  - "trace.gross_profit == trace.revenue - trace.flour_cost - trace.other_variable_cost"
  - "trace.fixed_costs == trace.wages + trace.rent + trace.owner_comp"
  - "trace.ebitda == trace.gross_profit - trace.fixed_costs"
  - "trace.ebit == trace.ebitda - trace.depreciation"
  - "trace.taxable_income == trace.ebit + trace.loss_added - trace.loss_used"
  - "trace.nopat == trace.ebit - trace.cash_tax"
  - "trace.nwc == trace.inventory_flour + trace.receivables - trace.payables"
  - "trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex"

  # ---- driver-bridge ----
  - "trace.loaves_produced == loaves_per_day * days_per_year"
  - "trace.revenue == price_per_loaf * trace.loaves_produced"
  - "trace.flour_cost_per_loaf == flour_cost_shock for t < shock_periods"
  - "trace.flour_cost_per_loaf == flour_cost_normal for t >= shock_periods"
  - "trace.flour_cost_per_loaf[first] == 2 * flour_cost_normal"
  # FIFO COGS: the constant buffer flows out at the price it was bought at, the remainder
  # of consumption at the current replacement price.
  - "trace.buffer_loaves == flour_stock_days * loaves_per_day"
  - "trace.buffer_price_open[first] == flour_cost_normal"
  - "trace.buffer_price_open[t] == trace.flour_cost_per_loaf[t-1] for t >= 1"
  - "trace.flour_cost == trace.buffer_loaves * trace.buffer_price_open + (trace.loaves_produced - trace.buffer_loaves) * trace.flour_cost_per_loaf"
  - "trace.flour_purchases == trace.flour_cost_per_loaf * trace.loaves_produced"
  - "trace.other_variable_cost == other_variable_cost_per_loaf * trace.loaves_produced"
  - "trace.contribution_per_loaf == price_per_loaf - trace.flour_cost_per_loaf - other_variable_cost_per_loaf"
  - "trace.wages == bakers_count * baker_wage_month * months_per_year"
  - "trace.rent == rent_month * months_per_year"
  - "trace.owner_comp == owner_salary_month * months_per_year"
  - "trace.depreciation == depreciation_per_year"
  - "trace.capex == capex_per_year"
  - "trace.inventory_flour == flour_stock_days * loaves_per_day * trace.flour_cost_per_loaf"
  - "trace.cash_tax == tax_rate * trace.taxable_income"
  - "trace.nol_opening[first] == nol_opening_balance"
  - "trace.loss_added == 0 - trace.ebit for t < shock_periods"
  - "trace.loss_added == 0 for t >= shock_periods"
  - "trace.cash_tax <= tax_rate * trace.ebit for t >= shock_periods"

  # ---- non-negativity / sign invariants ----
  - "trace.nol_opening[t] >= 0"
  - "trace.nol_closing[t] >= 0"
  - "trace.loss_used[t] >= 0"
  - "trace.loss_added[t] >= 0"
  - "trace.taxable_income[t] >= 0"
  - "trace.cash_tax[t] >= 0"
  - "trace.inventory_flour[t] >= 0"
  - "trace.nwc[t] >= 0"
  - "trace.revenue[t] > 0"
  - "trace.loaves_produced[t] > 0"
  - "trace.gross_profit[t] >= 0 for t >= shock_periods"
  - "trace.contribution_per_loaf[first] < 0"
  - "trace.ebitda[first] < 0"
  - "trace.fcff[first] < 0"
  - "trace.ebitda[last] > 0"
  - "trace.fcff[last] > 0"

notes:

  - |
    CROSS-CHECK THAT VALIDATES THE BUILD. The founder's statement "J'ai tenu toute
    l'année à perte" is the only external test of the volume x price x cost triangle,
    and the derivation reproduces it without being told to: the shock year comes out
    negative at every level (contribution per loaf, gross profit, EBITDA, FCFF). This
    is checked directly. The corroboration that flour "a doublé" is also checked
    (300 = 2 x 150), tying the two stated flour prices together.

  - |
    THE ANALYTICAL HEADLINE. The shock year is not a thin-margin year, it is a
    negative-contribution year: at 250 revenue against 300 of flour, each loaf loses 50
    francs before wages or rent. That inverts the ordinary logic of a bakery — volume
    stops being the cure and becomes the disease, and no output level breaks even.
    Cumulative free cash flow does not turn positive until the fifth period.

  - |
    SHUTDOWN OPTION NOT EXERCISED, AND NOT MODELLED AS IF IT WERE. At a negative unit
    contribution, idling the ovens would have limited the year's damage to the fixed
    commitments; continuing to bake added the flour spread on top (the trace gross_profit
    line at t=0). The founder states he continued, and gives a non-financial reason ("le
    pain c'est politique") — social licence, likely a de facto obligation to keep the
    neighbourhood supplied. The model follows what he did, not what an optimiser would
    have done. Whether the two bakers could in fact have been laid off, and whether the
    rent would have run regardless, is an open question.

  - |
    ELICITATION LIST — the questions that would most change this answer, in order of
    materiality:
    (1) What oven and equipment do you own, what did they cost, when did you buy them,
        and how long do they last before replacement?
    (2) Besides flour, what do you pay for on every batch — yeast, salt, water, and
        above all the fuel for the oven (wood, gas, electricity)? Sacks, packaging?
    (3) Do you pay yourself, and how much?
    (4) Do you sell every loaf you bake, or do some go unsold at the end of the day?
    (5) Do you buy flour for cash or on credit, and how many days of flour do you keep
        in the store?
    (6) Are you registered for tax, under which regime, and what did you actually pay
        last year?
    (7) Did both bakers stay on through the loss year?
    (8) Is the 800,000 rent fixed for a term, and when does it review?

  - |
    UNCOSTED INPUTS — DIRECTION OF THE ERROR. Flour is the only per-loaf cost named, and
    no fixed asset, no fuel and no owner's wage appear anywhere in the utterance. Each of
    these is carried as an explicit nil row so the gap is visible in the ladder rather
    than silently absent. Every one of them, if filled in, moves EBIT and FCFF in the
    same direction — downward. The result should therefore be read as an upper bound on
    asset-side cash flow, and the gap is potentially material: oven fuel in particular is
    normally a significant per-batch cost in this trade.

  - |
    NO REINVESTMENT MEANS THE TAIL IS NOT SUSTAINABLE. With capex at nil, the stable-year
    cash flow contains no allowance for replacing the productive asset that must exist.
    The horizon figures are therefore usable for near-term liquidity and recovery
    analysis, but the final period must not be treated as a perpetuity-ready steady state
    without first answering the oven question.

  - |
    IAS 2 FRICTION, DELIBERATELY NOT APPLIED. In the shock year the cost of flour per
    loaf (300) exceeds the loaf's net realisable value (250 selling price less the costs
    to complete it), so IAS 2 would strictly require the closing flour stock to be
    written down to NRV. I have carried the stock at cost instead. The omission is
    structurally neutral to FCFF in that year: a write-down reduces EBIT and reduces
    closing NWC by the identical amount, and the two offset exactly in the
    NOPAT - delta_NWC bridge, while cash tax in that year is nil regardless of the
    charge. It would begin to matter only if the shock persisted into a tax-paying year.
    Flagged for the reader's awareness rather than modelled, to keep the inventory
    roll-forward legible.

  - |
    WORKING CAPITAL — WHAT THE ASSUMED STOCK COVER DOES AND DOES NOT DRIVE. The 7-day
    flour cover is the only fabricated quantity of consequence in the model. Because the
    flour price returns to its starting level within the horizon, the stock revaluation
    it produces reverses in full: it shifts cash between the first and second periods and
    leaves cumulative FCFF unchanged. This is a structural property of the build, not a
    scenario result — it holds for any cover period. Receivables and payables are both
    nil by assumption; assuming any supplier credit would improve first-period cash, so
    the nil-payables choice is the conservative one.

  - |
    TAX — THREE UNSTATED THINGS. The rate (25 percent applied), the regime (a bakery this
    size may sit under a simplified or synthetic regime rather than standard corporate
    income tax, which would change the base entirely, sometimes to a turnover charge),
    and the carry-forward window. On the last point: the loss pool takes four years to
    unwind here, so a carry-forward window shorter than that would forfeit part of the
    relief and raise cash tax; a five-year or unlimited window gives the schedule shown.
    No carry-back is assumed, which is standard in these regimes.

  - |
    PRICE, VOLUME AND COST HELD FLAT. No growth is stated and none is imputed — the
    founder's forward view is explicitly that things "devrait rester stable". The 250
    price is held for all five years on his own words; note that the constraint he
    describes is political rather than competitive, and he does not say it lifts once
    flour normalises. Wages and rent are held flat in nominal terms, which is the
    optimistic side in a market that has just seen an import price double; general
    inflation would push both up and FCFF down.

  - |
    UNITS AND CURRENCY. "Francs" in a francophone African market is read as the CFA
    franc (XOF). The arithmetic is unit-agnostic and holds under XAF or any other franc
    denomination. Day count is 365 with leap days ignored.

  - |
    NATURAL UNITS PRESERVED. The founder reasons in loaves per day and francs per loaf,
    and the derivation keeps those as the primitives — annualisation happens once, at
    volume, and the flour cost never needs converting out of his per-loaf frame. The one
    place his description does not map cleanly onto a standard line item is the flour
    stock: he priced flour per loaf of output, whereas an inventory balance wants a
    quantity of raw material. I have carried the stock in loaf-equivalents at his own
    per-loaf cost, which is exact given his framing but would need restating in sacks if
    the elicitation ever produced a sack price and a purchase cycle.

  - |
    NOT COMPUTED. No terminal value and no discount rate — neither is derivable from the
    utterance, which contains nothing about the cost of capital, the owner's required
    return, or local financing conditions. No financing side: the build is deliberately
    unlevered, and the founder describes no debt.

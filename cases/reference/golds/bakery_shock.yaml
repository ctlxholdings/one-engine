id: bakery_flour_shock_fcff_v1
title: "Artisanal daily bakery under a one-year imported-flour price shock — unlevered FCFF (NOPAT build), 5-year annual horizon"
currency: XOF
grid:
  periods: 5
  freq: annual

utterance:
  fr: |
    Moi je tiens une boulangerie. Je fais cinq cents pains par jour, vendus à deux cent cinquante francs pièce. Je paie deux boulangers à cent mille par mois chacun, et le loyer du local est à huit cent mille par mois. Je travaille tous les jours. Normalement la farine me coûte cent cinquante francs par pain. Mais cette année la farine a doublé — elle est montée à trois cents francs par pain, à cause des importations. Je n'ai pas pu augmenter le prix du pain : ici les gens ne suivraient pas, le pain c'est politique. J'ai tenu toute l'année à perte. Les gens du marché disent que l'année prochaine ça redescendra à la normale, et après ça devrait rester stable.
  en: |
    I run a bakery. I make five hundred loaves a day, sold at two hundred fifty francs each. I pay two bakers a hundred thousand a month each, and the shop rent is eight hundred thousand a month. I work every day. Normally flour costs me one hundred fifty francs per loaf. But this year flour doubled — it went up to three hundred francs per loaf, because of imports. I couldn't raise the price of bread: here people wouldn't accept it, bread is political. I ran the whole year at a loss. The market people say next year it'll come back down to normal, and after that it should stay stable.


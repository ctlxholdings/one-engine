checks:
  # --- driver-bridge: each computed line from its inputs ---
  - trace.production_t == trace.yield_per_ha * area
  - trace.production_kg == trace.production_t * kg_per_tonne
  - trace.revenue == trace.production_kg * price_per_kg
  - trace.yield_per_ha == mature_yield_t_per_ha for t >= maturity_index
  - trace.revenue == 0 for t < first_harvest_index
  - trace.opex == 0 for t < first_harvest_index
  - trace.opex == annual_maintenance for t >= first_harvest_index
  - trace.depreciation == 0 for t < first_harvest_index
  - trace.depreciation == annual_depreciation for t >= first_harvest_index
  - trace.capex == 0 for t >= first_harvest_index
  - trace.tax == trace.ebit * tax_rate
  - depreciable_base == establishment_cost + n_preproductive_years * annual_maintenance
  - annual_depreciation == depreciable_base / useful_life_years
  # --- definition: the ladder ---
  - trace.ebitda == trace.revenue - trace.opex
  - trace.ebit == trace.ebitda - trace.depreciation
  - trace.nopat == trace.ebit - trace.tax
  - trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc
  - trace.cfi == 0 - trace.capex
  - trace.fcff == trace.cfo + trace.cfi
  - trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex
  - fcff == trace.fcff
  # --- conservation: stock roll-forwards ---
  - trace.book_value[t] == trace.book_value[t-1] + trace.capex[t] - trace.depreciation[t]
  - cumsum(trace.delta_nwc) == trace.nwc
  - sum(trace.capex) == depreciable_base
  - trace.book_value[last] == depreciable_base - sum(trace.depreciation)
  # --- non-negativity ---
  - min(trace.book_value) >= 0
  - min(trace.production_t) >= 0
  - min(trace.revenue) >= 0
  - min(trace.opex) >= 0
  - min(trace.capex) >= 0

notes:
  horizon_and_terminal_value: >-
    Explicit grid stops at Year 10 for tractability, but a mango orchard bears for ~30–40 yrs.
    The economic value is dominated by the post-Year-10 tail of ~6,010,000/yr (declining once
    trees senesce near end of life). A full valuation would either extend the grid to ~Year 30
    or attach a terminal value to the Year-10 steady-state FCFF (e.g. a finite annuity over the
    remaining productive years, or a perpetuity-with-decline). This is deferred, not modelled.
  key_judgement_capitalise_vs_expense: >-
    Pre-productive husbandry (Years 1–2, 1,500,000/yr) is CAPITALISED into the bearer-plant
    asset per IAS 16, not expensed. Rationale: (i) it is the IFRS-correct treatment for bringing
    a bearer plant to productive condition; (ii) it keeps pre-tax EBIT ≥ 0, avoiding an
    invented tax-loss-carryforward regime. The alternative (expense as incurred) yields the SAME
    pre-tax FCFF — the two Years' 1,500,000 shift from capex to opex — and differs only in tax
    timing: it would create Year 1–2 operating losses (−1,500,000 EBIT) whose tax benefit
    depends on unstated loss-carryforward rules and whether other taxable income exists. If those
    losses were fully usable against later profit, lifetime tax is nearly identical; the choice
    mainly moves value between years. Reversible/internal call — logged here.
  yield_ramp_is_assumed: >-
    The single largest modelling assumption. The founder gives Year-3 "first real harvest" and a
    separate mature yield, but no ramp and no maturity year. The 40%/70%/100% ramp over Years
    3–5 is a supplied prior. If instead Year 3 already equals mature yield, Years 3–4 FCFF each
    rise by ~4.2m/1.5m; if maturity is reached later (say Year 7–8), early FCFF is lower. High
    sensitivity — should be elicited before use.
  tax_status: >-
    30% (Senegal IS) is applied for completeness, but is the second-largest swing factor and is
    almost certainly wrong for a real smallholder: Senegalese agricultural revenue enjoys broad
    exemptions and most smallholders are informal (effective rate ≈ 0%). At 0% tax, mature FCFF
    rises from 6,010,000 to 8,700,000/yr (= EBITDA 8.5m + no tax − 0 ... i.e. NOPAT→EBIT 8.3m +
    dep 0.2m). Elicit entity type and tax regime.
  working_capital: >-
    Set to zero (perishable crop → no year-end inventory; cash farmgate sales → no receivables;
    cash inputs → no payables). If the founder sells on credit to traders or holds stock, a small
    positive ΔNWC would appear in ramp-up years. Not stated.
  land: >-
    The 4,000,000 is land PREPARATION, saplings and fencing — NOT land purchase. Land is assumed
    already owned / family land at no incremental cost or rent. If land is leased, add annual rent
    to opex. Not stated.
  simplifications:
    - Single lumped orchard asset over 35 yrs; in reality fencing (~10–15 yr life) is shorter-lived than the trees and would be depreciated faster / replaced within the horizon.
    - Flat mature yield; real mango exhibits alternate (biennial) bearing, so mature-year revenue would oscillate around 10,000,000.
    - Price and cost held nominal-flat (no inflation, no price path); "environ / à peu près / dans les" language signals the founder's own figures are approximate.
    - No post-harvest losses, no grading/rejects, no marketing/transport commission netted from farmgate price.
  elicited_questions:
    - "What did you actually harvest in Year 3, Year 4, etc., and in which year did the orchard reach the full 10 t/ha? (fixes the yield ramp and maturity year)"
    - "Is this operated as a company (IS 30%), by you personally (IR), or under an agricultural exemption / informally (0%)? (fixes the tax rate)"
    - "How many years do you expect the trees to keep producing, and do you plan to replant? (fixes useful life and terminal horizon)"
    - "Do you sell for cash at harvest, or on credit? Do you store any fruit past year-end? Do you pay for inputs in advance? (fixes working capital)"
    - "Does the 1,500,000/yr tending already happen in the planting year, and is it on top of the 4,000,000, or included in it? (fixes Year-1 cost stacking)"
    - "Is the land yours, or rented? Any annual land cost not in the 4,000,000? (fixes whether rent belongs in opex)"

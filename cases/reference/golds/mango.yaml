  opex:           [0, 0, 1500000, 1500000, 1500000, 1500000, 1500000, 1500000, 1500000, 1500000]
  ebitda:         [0, 0, 2500000, 5500000, 8500000, 8500000, 8500000, 8500000, 8500000, 8500000]
  capex:          [5500000, 1500000, 0, 0, 0, 0, 0, 0, 0, 0]

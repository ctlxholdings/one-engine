id: casamance-mango-orchard-fcff
title: "Five-hectare mango orchard (Casamance, Senegal) — unlevered FCFF via NOPAT"
currency: XOF   # West African CFA franc (FCFA). Casamance ∈ Senegal ∈ WAEMU → XOF. The founder's "francs" = FCFA.
grid:
  periods: 10          # annual. Period index t = 0..9  ↔  calendar Year (t+1) = Year 1..Year 10.
  freq: annual
  note: >-
    Year 1 (t=0) = planting / establishment season. Year 3 (t=2) = first real harvest.
    Full maturity (10 t/ha) assumed reached Year 5 (t=4). Orchard keeps producing for
    decades beyond the horizon; explicit grid stops at Year 10 (see notes: terminal value).

utterance:
  fr: |
    Moi j'ai planté cinq hectares de manguiers en Casamance. La préparation du terrain, les plants et la clôture m'ont coûté quatre millions. Les manguiers, ça ne donne pas tout de suite — il faut attendre la troisième année pour la première vraie récolte. À maturité, je récolte à peu près dix tonnes à l'hectare, que je vends deux cents francs le kilo. Même les années où ça ne produit pas, il faut entretenir : la taille, le désherbage, les traitements, la main-d'œuvre, ça fait dans les un million cinq cent mille par an.
  en: |
    I planted five hectares of mango trees in Casamance. Land prep, saplings and fencing cost me four million. Mango trees don't bear right away — you wait until the third year for the first real harvest. At maturity I harvest about ten tonnes per hectare, which I sell at two hundred francs a kilo. Even in the years it doesn't produce, you have to tend it: pruning, weeding, treatments, labor — that runs about one million five hundred thousand a year.

inputs:

  area:
    value: 5
    unit: hectare
    prov: STATED
    source: '"j''ai planté cinq hectares de manguiers" / "I planted five hectares of mango trees"'
    date: 2026-07-24

  establishment_cost:
    value: 4000000
    unit: XOF
    prov: STATED
    source: '"La préparation du terrain, les plants et la clôture m''ont coûté quatre millions" / "Land prep, saplings and fencing cost me four million" — one-off capital outlay at planting (Year 1). Note: "préparation du terrain" = land PREP, not land PURCHASE; no land acquisition cost or rent is stated.'
    date: 2026-07-24

  first_harvest_year:
    value: 3
    unit: year (calendar, planting = Year 1)
    prov: STATED
    source: '"il faut attendre la troisième année pour la première vraie récolte" / "you wait until the third year for the first real harvest"'
    date: 2026-07-24

  mature_yield_t_per_ha:
    value: 10
    unit: tonne/hectare/year
    prov: STATED
    source: '"À maturité, je récolte à peu près dix tonnes à l''hectare" / "At maturity I harvest about ten tonnes per hectare" — note this is the MATURE yield, explicitly distinguished by the founder from the "première vraie récolte" of Year 3.'
    date: 2026-07-24

  price_per_kg:
    value: 200
    unit: XOF/kg
    prov: STATED
    source: '"que je vends deux cents francs le kilo" / "which I sell at two hundred francs a kilo"'
    date: 2026-07-24

  annual_maintenance:
    value: 1500000
    unit: XOF/year
    prov: STATED
    source: '"Même les années où ça ne produit pas, il faut entretenir ... ça fait dans les un million cinq cent mille par an" / "Even in the years it doesn''t produce, you have to tend it ... that runs about one million five hundred thousand a year" — recurring husbandry (pruning, weeding, treatments, labour), every year.'
    date: 2026-07-24

  first_harvest_index:
    value: 2
    unit: grid index (0-based)
    prov: INFERRED
    source: 'first_harvest_year = 3 mapped onto the grid (Year k ↔ index k−1) ⇒ index 2. Used by period masks.'
    date: 2026-07-24

  n_preproductive_years:
    value: 2
    unit: years
    prov: INFERRED
    source: 'Trees planted Year 1, first harvest Year 3 (first_harvest_year) ⇒ Years 1–2 bear no fruit ⇒ 2 pre-productive years. No new information.'
    date: 2026-07-24

  kg_per_tonne:
    value: 1000
    unit: kg/tonne
    prov: DEFAULTED
    source: 'Metric convention 1 t = 1000 kg (needed to bridge "tonnes/ha" to "XOF/kg").'
    date: 2026-07-24

  tax_rate:
    value: 0.30
    unit: fraction
    prov: ASSUMED
    source: 'Senegal corporate income tax (Impôt sur les Sociétés) statutory rate = 30%. FLAG: entity type/tax status not stated — a natural-person farmer would pay IR (progressive), and Senegalese agricultural income / informal smallholders are frequently exempt or de facto untaxed. See ELICITED question. Materially affects NOPAT.'
    date: 2026-07-24

  useful_life_years:
    value: 35
    unit: years
    prov: ASSUMED
    source: 'Productive life of a well-managed grafted mango orchard ≈ 30–40 yrs; 35 chosen (mid-range, and divides the 7,000,000 base to an exact 200,000/yr). Not stated. See ELICITED.'
    date: 2026-07-24

  maturity_index:
    value: 4
    unit: grid index (0-based)  # = Year 5
    prov: ASSUMED
    source: 'Founder gives Year-3 "first real harvest" and a separate "at maturity" yield but no ramp and no maturity year. A 3-year ramp (Years 3→4→5) to full bearing is a standard horticultural prior. See ELICITED.'
    date: 2026-07-24

  ramp_fraction_y3:
    value: 0.40
    unit: fraction of mature yield
    prov: ASSUMED
    source: 'Year-3 "première vraie récolte" set at 40% of mature (→ 4 t/ha). No stated value; standard first-bearing fraction. See ELICITED.'
    date: 2026-07-24

  ramp_fraction_y4:
    value: 0.70
    unit: fraction of mature yield
    prov: ASSUMED
    source: 'Year-4 yield set at 70% of mature (→ 7 t/ha). No stated value; ramp interpolation. See ELICITED.'
    date: 2026-07-24

  mature_revenue:
    value: 10000000
    unit: XOF/year
    prov: INFERRED
    source: 'mature_yield_t_per_ha(10) × area(5) × kg_per_tonne(1000) × price_per_kg(200) = 10,000,000. Pure arithmetic on STATED inputs + metric convention.'
    date: 2026-07-24

  depreciable_base:
    value: 7000000
    unit: XOF
    prov: DEFAULTED
    source: 'IAS 16 bearer-plant rule: costs of bringing the orchard to productive condition are capitalised. Base = establishment_cost(4,000,000) + n_preproductive_years(2) × annual_maintenance(1,500,000) = 7,000,000. Rule = IAS 16 (bearer plants; pre-productive cultivation costs capitalised); arithmetic is deductive.'
    date: 2026-07-24

  annual_depreciation:
    value: 200000
    unit: XOF/year
    prov: INFERRED
    source: 'Straight-line: depreciable_base(7,000,000) / useful_life_years(35) = 200,000. Depreciation begins in the first productive year (IAS 16 "available for use" = first_harvest_year).'
    date: 2026-07-24

passage: |
  UNITS & SCALE. Everything in XOF (FCFA). Grid is annual, Years 1..10 (index t=0..9);
  Year 1 is the planting/establishment season. All figures are pre-financing (unlevered):
  we build NOPAT, add back depreciation, subtract the change in net working capital and
  capex, to reach asset-side free cash flow FCFF = NOPAT + D&A − ΔNWC − capex.

  --- STEP 1: PHYSICAL VOLUMES (the business's own quantities: hectares → tonnes → kg) ---
  The orchard is 5 ha (STATED). Mature yield is 10 t/ha (STATED, "à maturité"), i.e. a
  mature crop of 10 × 5 = 50 t/yr = 50,000 kg/yr. The founder explicitly separates the
  "première vraie récolte" of Year 3 from the "à maturité" yield, so Year 3 is NOT yet the
  mature crop. No ramp is stated, so I supply one (ASSUMED, flagged): Year 3 = 40% of mature
  = 4 t/ha, Year 4 = 70% = 7 t/ha, Year 5 onward = full maturity = 10 t/ha. Years 1–2 bear
  nothing (STATED, "ça ne donne pas tout de suite"). Yields per ha, then whole-orchard tonnes,
  then kg:
    Year 1: 0 t/ha → 0 t → 0 kg
    Year 2: 0 t/ha → 0 t → 0 kg
    Year 3: 4 t/ha → 20 t → 20,000 kg
    Year 4: 7 t/ha → 35 t → 35,000 kg
    Year 5–10: 10 t/ha → 50 t → 50,000 kg each

  --- STEP 2: REVENUE (recognised at harvest/sale, IAS 15) ---
  Revenue = kg × 200 XOF/kg (STATED price). Mango is perishable and sold at harvest, so the
  crop of each year is the sale of that year.
    Year 1–2: 0
    Year 3: 20,000 × 200 = 4,000,000
    Year 4: 35,000 × 200 = 7,000,000
    Year 5–10: 50,000 × 200 = 10,000,000 each  (= mature_revenue)

  --- STEP 3: OPERATING COSTS & THE ESTABLISHMENT ASSET (IAS 16 bearer plants) ---
  Two cash cost streams: (a) the 4,000,000 establishment outlay (land prep + saplings +
  fencing) at planting, and (b) recurring husbandry of 1,500,000/yr (pruning, weeding,
  treatments, labour), incurred EVERY year including the non-producing ones (STATED).
  Under IAS 16 a mango tree is a BEARER PLANT: all costs of bringing it to productive
  condition are capitalised into the asset until it matures, then it is depreciated over its
  productive life; husbandry incurred AFTER it is productive is expensed. Therefore:
    • Year 1: capitalise establishment 4,000,000 + pre-productive husbandry 1,500,000 = 5,500,000 added to the orchard asset. No expense, no revenue.
    • Year 2: capitalise pre-productive husbandry 1,500,000. No expense, no revenue.
    • Orchard asset cost at start of production = 4,000,000 + 1,500,000 + 1,500,000 = 7,000,000 (depreciable_base).
    • Year 3 onward (productive): the 1,500,000/yr husbandry is now an OPERATING EXPENSE (opex).
  Note the friction/judgement: the founder experiences the Years 1–2 husbandry as a "cost";
  IFRS reclassifies that cash as capitalised investment, not P&L expense. The CASH is
  identical either way — it simply appears in FCFF as capex (Years 1–2) rather than opex, so
  pre-tax FCFF is unaffected by the choice. Capitalising also keeps pre-tax EBIT ≥ 0 in every
  year and so avoids inventing tax-loss-carryforward rules (the expense-as-incurred
  alternative would create Year 1–2 operating losses; see notes).

  --- STEP 4: DEPRECIATION (IAS 16, straight-line, from first productive year) ---
  Depreciation begins when the asset is "available for use" — for a bearer plant, when it
  starts bearing commercially = Year 3 (first_harvest_year). Straight-line over 35 yrs
  (ASSUMED life): 7,000,000 / 35 = 200,000/yr.
    Year 1–2: 0 (not yet in service)
    Year 3–10: 200,000 each
  Orchard net book value roll-forward (stock = prior + additions(capex) − depreciation):
    Y1: 0 + 5,500,000 − 0        = 5,500,000
    Y2: 5,500,000 + 1,500,000 − 0 = 7,000,000
    Y3: 7,000,000 + 0 − 200,000   = 6,800,000
    Y4: 6,600,000 ; Y5: 6,400,000 ; Y6: 6,200,000 ; Y7: 6,000,000 ;
    Y8: 5,800,000 ; Y9: 5,600,000 ; Y10: 5,400,000  (stays > 0; life ≫ horizon).

  --- STEP 5: EBITDA → EBIT ---
  EBITDA = revenue − opex; EBIT = EBITDA − depreciation.
    Year 1–2: EBITDA 0, EBIT 0.
    Year 3: EBITDA 4,000,000 − 1,500,000 = 2,500,000 ; EBIT 2,500,000 − 200,000 = 2,300,000.
    Year 4: EBITDA 7,000,000 − 1,500,000 = 5,500,000 ; EBIT 5,300,000.
    Year 5–10: EBITDA 10,000,000 − 1,500,000 = 8,500,000 ; EBIT 8,300,000 each.

  --- STEP 6: TAX & NOPAT (unlevered — tax on EBIT, no interest shield) ---
  Tax = EBIT × 30% (ASSUMED Senegal IS). EBIT ≥ 0 throughout, so tax ≥ 0 (no NOL needed).
  NOPAT = EBIT − tax = EBIT × 0.70.
    Year 1–2: tax 0, NOPAT 0.
    Year 3: tax 690,000 ; NOPAT 1,610,000.
    Year 4: tax 1,590,000 ; NOPAT 3,710,000.
    Year 5–10: tax 2,490,000 ; NOPAT 5,810,000 each.

  --- STEP 7: WORKING CAPITAL ---
  No credit terms, storage or input-financing are stated; mango is perishable (no year-end
  inventory) and smallholder sales are cash at farmgate. So NWC = 0 every year and ΔNWC = 0
  every year (DEFAULTED; see ELICITED). No cash-flow effect.

  --- STEP 8: CAPEX (= capitalised additions to the orchard asset) ---
    Year 1: 5,500,000 ; Year 2: 1,500,000 ; Year 3–10: 0.
  (No replanting within a 10-yr horizon — trees live decades.)

  --- STEP 9: FCFF = NOPAT + D&A − ΔNWC − capex ---
  Equivalently CFO (= NOPAT + D&A − ΔNWC) + CFI (= −capex).
    Year 1: 0 + 0 − 0 − 5,500,000 = −5,500,000
    Year 2: 0 + 0 − 0 − 1,500,000 = −1,500,000
    Year 3: 1,610,000 + 200,000 − 0 − 0 = 1,810,000
    Year 4: 3,710,000 + 200,000 − 0 − 0 = 3,910,000
    Year 5–10: 5,810,000 + 200,000 − 0 − 0 = 6,010,000 each
  Cumulative FCFF turns positive during Year 5 (undiscounted payback ≈ 5 yrs): running total
  −5.50m, −7.00m, −5.19m, −1.28m, +4.73m, then +6.01m/yr thereafter. At steady state the
  orchard throws off 6,010,000/yr of unlevered cash — the bulk of its value sits in the long
  productive tail beyond Year 10 (see notes on terminal value).


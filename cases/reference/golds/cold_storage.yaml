id: cold_room_kaolack_fcff
title: Solar cold room (chambre froide solaire), Kaolack — unlevered FCFF via NOPAT
currency: XOF            # West African CFA franc; the founder's "francs" = FCFA
grid:
  periods: 11           # years 0..10 : year 0 = investment/build, years 1..10 = operations
  freq: A               # annual

utterance:
  fr: |
    Moi je gère une chambre froide solaire à Kaolack. Je loue de la place aux mareyeurs
    et aux vendeuses de légumes — ils viennent garder leur poisson et leurs tomates au frais.
    La chambre peut tenir dix tonnes. Je prends vingt-cinq francs le kilo par mois.
    La première année, la chambre était à peine remplie à quarante pour cent, les gens ne
    connaissaient pas encore. Aujourd'hui je tourne à quatre-vingt-dix pour cent, c'est plein
    presque tout le temps. La chambre m'a coûté quinze millions ; elle marche au solaire, donc
    je ne paie pas de courant. Je paie un gardien-opérateur à quarante mille par mois,
    l'entretien du groupe froid me revient à deux cent mille par an, et il y a bien cent vingt
    mille de petites dépenses par an.
  en: |
    I run a solar cold room in Kaolack. I rent space to fish traders and vegetable sellers —
    they store their fish and tomatoes cold. The room holds ten tonnes. I charge twenty-five
    francs per kilo per month. The first year it was barely forty percent full, people didn't
    know about it yet. Now I run at ninety percent, it's full almost all the time. The room cost
    me fifteen million; it runs on solar, so I pay no electricity. I pay a guard-operator forty
    thousand a month, the cold-unit maintenance runs two hundred thousand a year, and there's a
    good hundred and twenty thousand in small expenses a year.


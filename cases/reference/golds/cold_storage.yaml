checks:
  # --- conservation ---
  - "trace.book_value[t] == trace.book_value[t-1] - trace.dep[t] + trace.capex[t]"
  - "trace.nol_end[t] == trace.nol_end[t-1] + trace.nol_added[t] - trace.nol_used[t]"
  - "cumsum(trace.delta_nwc) == trace.nwc"
  - "sum(trace.dep) == sum(trace.capex)"
  - "trace.book_value[last] == salvage_value"
  # --- definition (the ladder) ---
  - "trace.ebitda == trace.revenue - trace.opex"
  - "trace.ebit == trace.ebitda - trace.dep"
  - "trace.taxable_income == trace.ebit - trace.nol_used + trace.nol_added"
  - "trace.nopat == trace.ebit - trace.tax"
  - "trace.fcff == trace.nopat + trace.dep - trace.delta_nwc - trace.capex"
  - "trace.fcff == trace.ebitda - trace.tax - trace.delta_nwc - trace.capex"
  - "fcff == trace.fcff"
  # --- driver-bridge ---
  - "trace.kg_months == capacity_kg * months_per_year * trace.utilization"
  - "trace.revenue == price_per_kg_month * trace.kg_months"
  - "trace.revenue == price_per_kg_month * capacity_kg * months_per_year * trace.utilization"
  - "trace.tax == tax_rate * trace.taxable_income"
  - "trace.dep[t] == capex_amount / useful_life_years for t >= first_operating_period"
  - "trace.dep[t] == 0 for t < first_operating_period"
  - "trace.opex[t] == guard_monthly * months_per_year + maintenance_annual + small_expenses_annual for t >= first_operating_period"
  - "trace.opex[t] == 0 for t < first_operating_period"
  - "trace.capex[t] == 0 for t >= first_operating_period"
  - "trace.capex[first] == capex_amount"
  # --- non-negativity / bounds ---
  - "trace.book_value[t] >= 0"
  - "trace.nol_end[t] >= 0"
  - "trace.taxable_income[t] >= 0"
  - "trace.revenue[t] >= 0"
  - "trace.kg_months[t] >= 0"
  - "trace.utilization[t] <= 1"
  - "trace.revenue[t] <= price_per_kg_month * capacity_kg * months_per_year"

notes: |
  - Natural unit. The business sells kg-months of cold storage (10,000 kg re-let each month =
    120,000 kg-months/yr at full capacity). Occupancy is a stock-fill fraction; revenue accrues
    per kg-month. Kept in kg-months rather than forced into a generic "volume × price" line.
  - Occupancy path is a deliberate two-regime (40% in year 1, 90% thereafter) using ONLY the two
    stated data points. The founder implies growth from 40% to 90% but does not say over how many
    years, so no intermediate ramp is invented. ELICIT the elapsed time / adoption curve if a
    smoother ramp is wanted; that would lower years 2–3 revenue.
  - Own-inventory is zero — the stored fish and tomatoes belong to customers, not the operator.
    This is why NWC is held at 0. The one live working-capital question is fee timing (prepaid =
    deferred-revenue liability, lowering NWC; arrears = receivable, raising it). Flagged, set to 0.
  - Depreciation drives a genuine year-1 accounting loss (EBITDA +400k < depreciation 1,500k).
    I bank that loss as a carry-forward rather than granting a fictional year-1 tax refund, which
    is the realistic treatment for a standalone entity and qualifies as deferred-depreciation
    carry-forward under OHADA/Senegalese rules. The alternative textbook convention
    NOPAT = EBIT × (1 − t) applied symmetrically gives FCFF_1 = 730,000 and FCFF_2..10 = 1,780,000;
    lifetime tax (750,000) and total FCFF (+1,750,000) are identical — only tax timing differs.
  - Tax rate is the 30% Senegal IS statutory rate as a domain prior. HIGH-IMPACT and likely wrong
    for reality: at ~1.2–2.7M annual turnover this operator almost certainly sits under the CGU
    simplified regime (a modest turnover-based flat charge), which would cut tax sharply and raise
    FCFF. Modelled with IS to keep a standard NOPAT build; flagged for the founder to confirm.
  - Useful life (10 yr) is assumed and materially affects the shape: a 15-yr life shrinks the
    year-1 loss (dep 1,000k) and improves early FCFF. The refrigeration unit, not the solar array,
    is the binding life constraint; confirm expected years to compressor replacement.
  - Horizon deliberately ends at year 10 = full depreciation. Beyond it the cold unit needs
    replacement/major overhaul (lumpy capex not modelled here); extending the horizon would require
    a replacement-capex assumption.
  - Economic reading: undiscounted cumulative FCFF is only +1,750,000 on a 15,000,000 investment,
    with nominal payback in year 10 — a thin, near-break-even asset at 30% tax. Viability hinges on
    the tax regime (CGU vs IS) and asset life above. No price escalation is modelled (none stated);
    holding the 25 XOF/kg/month tariff flat in nominal terms is conservative under inflation.
  - No interest/financing appears anywhere — consistent with an UNLEVERED FCFF (asset-side) build.
  - No land rent, insurance, or owner's salary was mentioned; none assumed. If the operator draws
    a wage or pays ground rent, opex is understated — ELICIT.

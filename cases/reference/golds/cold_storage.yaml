passage: |
  NATURAL OPERATING UNIT. This is a cold-storage rental. The physical thing sold is
  kilogram-months of refrigerated space: one kg held for one month = one kg-month, priced at
  25 XOF. Capacity is a STOCK of 10 t = 10,000 kg that can be re-let every month, so the annual
  productive capacity is 10,000 kg × 12 months = 120,000 kg-months/year. Occupancy (the founder's
  "percent full") is the fraction of that stock filled on average. I keep the derivation in
  kg-months, then translate to the standard NOPAT/FCFF ladder.

  GRID. t=0 is the build/investment year: the 15,000,000 room is bought and no trading yet.
  Operations run t=1..10 (10 years), matching the assumed 10-year economic life so the asset is
  fully depreciated exactly at the horizon.

  STEP 1 — Occupancy path. The founder gives two regimes: first year "barely 40%", and today
  "90%, full almost all the time". Only these two points are stated; the number of years taken to
  climb from 40% to 90% is NOT given, so I do not fabricate an intermediate ramp. I use the
  minimum-assumption two-regime path: t=1 at 40%, t=2..10 at the mature 90%. (A multi-year
  adoption ramp is plausible; it is flagged as an elicitation, not invented here.)

  STEP 2 — kg-months sold. kg_months = 120,000 × occupancy.
    t=1 : 120,000 × 0.40 = 48,000 kg-months.
    t≥2 : 120,000 × 0.90 = 108,000 kg-months.

  STEP 3 — Revenue = 25 XOF × kg-months.
    t=1 : 25 × 48,000  = 1,200,000.
    t≥2 : 25 × 108,000 = 2,700,000.
  (Cross-check: full-capacity revenue = 25 × 120,000 = 3,000,000/yr; revenue = 3,000,000 × occupancy.)

  STEP 4 — Cash operating costs (the "matching" side). All are period costs, incurred once
  trading begins (t≥1). Electricity is zero (solar). Per year:
    guard-operator 40,000 × 12 = 480,000
    cold-unit maintenance          200,000
    small expenses                 120,000
    ----------------------------------------
    opex total                     800,000/yr.
  Maintenance is expensed (routine upkeep of the groupe froid), not capitalised.

  STEP 5 — EBITDA = Revenue − opex.
    t=1 : 1,200,000 − 800,000 =   400,000.
    t≥2 : 2,700,000 − 800,000 = 1,900,000.

  STEP 6 — Depreciation. 15,000,000 straight-line over 10 years to zero salvage = 1,500,000/yr,
  charged t=1..10. Book value rolls 15,000,000 → 13,500,000 → … → 0 at t=10.

  STEP 7 — EBIT = EBITDA − depreciation.
    t=1 : 400,000 − 1,500,000 = −1,100,000  (an accounting LOSS in year 1: positive EBITDA of
                                             400k is more than absorbed by the 1.5M depreciation).
    t≥2 : 1,900,000 − 1,500,000 = 400,000.

  STEP 8 — Tax on the unlevered operation (30% IS), with a loss carry-forward. A standalone
  micro-business cannot monetise the year-1 loss as a refund, so I do NOT apply tax symmetrically
  to negative EBIT; instead the loss (driven by depreciation — "amortissement réputé différé",
  carried forward without time limit under OHADA) is banked and offsets later profits:
    t=1 : EBIT −1,100,000 → taxable 0, tax 0; NOL carry-forward stock = 1,100,000.
    t=2 : EBIT 400,000 fully sheltered by NOL → taxable 0, tax 0; NOL 700,000.
    t=3 : EBIT 400,000 sheltered → taxable 0, tax 0; NOL 300,000.
    t=4 : EBIT 400,000, only 300,000 of NOL left → taxable 100,000, tax 30,000; NOL 0.
    t=5..10 : EBIT 400,000, no NOL → taxable 400,000, tax 120,000 each.

  STEP 9 — NOPAT = EBIT − tax.
    t=1 −1,100,000 ; t=2 400,000 ; t=3 400,000 ; t=4 370,000 ; t=5..10 280,000.

  STEP 10 — Working capital. No own-inventory; monthly cash rental. NWC held at 0, so ΔNWC = 0
  every period. (Flagged assumption; see inputs.nwc_level.)

  STEP 11 — Capex. 15,000,000 at t=0 only. No expansion is possible (capacity capped at 10 t and
  already ~90% full) and none is mentioned; maintenance is opex, not capex. Horizon ends at t=10
  before any replacement cycle.

  STEP 12 — FCFF = NOPAT + D&A − ΔNWC − capex.
    t=0  : 0 + 0 − 0 − 15,000,000        = −15,000,000
    t=1  : −1,100,000 + 1,500,000        =     400,000
    t=2  :    400,000 + 1,500,000        =   1,900,000
    t=3  :    400,000 + 1,500,000        =   1,900,000
    t=4  :    370,000 + 1,500,000        =   1,870,000
    t=5..10 : 280,000 + 1,500,000        =   1,780,000
  Equivalent (D&A cancels): FCFF = EBITDA − cash tax − ΔNWC − capex — a useful independent check.

  READING. Undiscounted FCFF over the 10 years sums to +1,750,000 on a 15,000,000 outlay:
  nominal payback lands only in year 10, so on a discounted basis this asset does not recover its
  cost within its assumed life at a 30% tax rate. The business is thin/marginal as specified.
  Two levers dominate: (a) tax regime — under the CGU simplified regime the effective charge would
  be a fraction of the modelled IS, materially lifting FCFF; (b) asset life — a 15-year life
  (dep 1,000,000/yr) shrinks the year-1 loss and improves early FCFF. Note the total tax over the
  life is 750,000 either way (30% × ΣEBIT = 30% × 2,500,000): the loss carry-forward only reshapes
  the timing of tax, not its lifetime total, so total FCFF is +1,750,000 under either tax-timing
  convention.


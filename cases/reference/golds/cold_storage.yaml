    value: 120000
    unit: XOF/year
    prov: STATED
    source: '"il y a bien cent vingt mille de petites dépenses par an" / "a good hundred and twenty thousand in small expenses a year"'
    date: 2026-07-24
  electricity_cost_annual:
    value: 0
    unit: XOF/year
    prov: STATED
    source: '"elle marche au solaire, donc je ne paie pas de courant" / "it runs on solar, so I pay no electricity"'
    date: 2026-07-24
  tax_rate:
    value: 0.30
    unit: fraction
    prov: ASSUMED
    source: >
      Domain prior — Senegal statutory corporate income tax (Impôt sur les Sociétés) = 30%.
      NOT stated. A micro-business at this turnover almost certainly falls under Senegal's
      Contribution Globale Unique (CGU) simplified regime, whose flat turnover-based charge
      would be materially lower. ELICIT: is the operator on IS or CGU?
    date: 2026-07-24
  nwc_level:
    value: 0
    unit: XOF
    prov: ASSUMED
    source: >
      Cash rental business — the operator holds NO inventory of its own (the stored fish and
      tomatoes belong to the customers). Monthly storage fees assumed settled in cash on/near
      the month of service, so receivables ≈ payables ≈ 0. Payment timing NOT stated —

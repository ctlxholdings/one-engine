id: arise-kenya-solar-fcff
title: "Arise Kenya — 234 MW AC solar IPP: unlevered FCFF (NOPAT build) over a 20-year USD PPA"
currency: USD
grid: {periods: 21, freq: annual}

utterance:
  fr: ""
  en: |
    We are Arise Kenya — a solar platform with six grid-connected plants totaling 234 megawatts AC,
    across the Rift Valley. We have a 20-year PPA with Kenya Power at 9.56 US cents per kilowatt-hour,
    USD-denominated. The plants run at a 20% capacity factor — about 410,000 megawatt-hours per year.
    Total construction capex is 510 million US dollars. Every five years we replace inverters and do a
    major overhaul — that costs about 8% of the original capex each time. Annual operating cost is 1%
    of capex — equipment O&M in USD, land and labor in shillings. Corporate tax is 30%. At year 20 the
    PPA ends; we expect a salvage value of 10% of original capex.


passage: |
  HORIZON & FRAME. Arise Kenya is six operating solar PV plants (234 MW AC) selling all output to
  Kenya Power under a 20-year USD-denominated PPA. I model the asset unlevered (project view) over 21
  annual periods: t=0 is the construction year (capital outlay, no production) and t=1..20 are the
  operating years under the PPA. FCFF is built as NOPAT + D&A - dNWC - capex, plus after-tax disposal
  proceeds at close. Everything is carried in USD: tariff, capex and salvage are USD, and although the
  operator pays land and labour O&M in shillings, that O&M is quantified as 1% of USD capex, so the KES
  leg is an FX-risk note rather than a separate cash line.

  REVENUE (t=1..20). Output is the operator's stated ~410,000 MWh/yr, which reconciles with
  234 MW x 8,760 h x 20% = 409,968 MWh (rounding). The tariff 9.56 US cents/kWh = 9.56 x 10 = $95.60/MWh.
  Revenue = 410,000 MWh x $95.60/MWh = $39,196,000/yr, flat in nominal USD (USD-fixed tariff, no stated
  escalation; output held flat, no degradation modelled). t=0 revenue = 0.

  OPERATING COST (t=1..20). O&M = 1% x $510m = $5,100,000/yr, flat. t=0 opex = 0.

  EBITDA = revenue - opex = 39,196,000 - 5,100,000 = $34,096,000/yr (t=1..20); 0 at t=0.

  CAPITAL & DEPRECIATION. Construction capex $510m is placed in service at t=0 and depreciated
  straight-line over the 20-year PPA life on its depreciable amount = cost - residual = 510 - 51 = $459m,
  i.e. 459/20 = $22,950,000/yr in t=1..20, which leaves book value of exactly $51m (=salvage) at t=20.
  Every five years the inverters are replaced and a major overhaul performed at 8% x 510 = $40.8m; under
  the IAS 16 component approach each overhaul is capitalised and depreciated over the five years to the
  next overhaul (40.8/5 = $8.16m/yr). The original inverters (inside construction capex) serve years 1-5;
  replacements are installed at the end of years 5, 10 and 15 — three overhauls — depreciated over t=6-10,
  t=11-15 and t=16-20 respectively. No overhaul is undertaken at year 20 because the PPA then ends and the
  plant is disposed. Total depreciation is therefore $22.95m/yr in t=1-5 and 22.95 + 8.16 = $31.11m/yr in
  t=6-20. The fixed-asset roll-forward NBV[t] = NBV[t-1] + capex[t] - dep[t] - disposal[t] runs
  510.00 -> 487.05 -> 464.10 -> 441.15 -> 418.20 -> (overhaul) 436.05 -> ... -> 82.11m at t=19, then at
  t=20 the final 31.11m of depreciation brings it to 51.0m and disposal takes it to 0.

  EBIT, TAX, NOPAT. EBIT = EBITDA - D&A. t=1-5: 34.096 - 22.95 = $11.146m; t=6-20: 34.096 - 31.11 =
  $2.986m (positive throughout, so tax is always due and there are no loss carry-forwards). Tax at 30% =
  $3,343,800 (t=1-5) and $895,800 (t=6-20). NOPAT = EBIT x 0.70 = $7,802,200 (t=1-5) and $2,090,200 (t=6-20).

  WORKING CAPITAL. Electricity is not storable, so there is no inventory; the only material working-capital
  item is the trade receivable from the single offtaker, Kenya Power. Payment terms were not stated, so I
  apply a standard 30-day settlement: receivables = revenue x 30/365 = 39,196,000 x 30/365 = $3,221,589.04,
  established in t=1 (dNWC = +3,221,589.04, a cash outflow) and held flat while revenue is flat, so dNWC = 0
  in t=2..19. At t=20 the PPA ends and the balance is collected out, releasing working capital
  (NWC -> 0, dNWC = -3,221,589.04). Over the life dNWC nets to zero. Payables on the small O&M line are
  ignored as immaterial.

  SALVAGE / DISPOSAL (t=20). Expected residual = 10% x 510 = $51,000,000. Because the plant's book value at
  t=20 equals exactly this $51m, disposal yields zero accounting gain and hence no salvage tax; the $51m is
  a clean investing inflow.

  FCFF BUILD (per period), FCFF = NOPAT + D&A - dNWC - capex + salvage = CFO (NOPAT + D&A - dNWC) + CFI
  (salvage - capex):
    t=0 (construction): 0 + 0 - 0 - 510,000,000 + 0 = -$510,000,000.
    t=1 (first year, WC build): 7,802,200 + 22,950,000 - 3,221,589.04 - 0 = $27,530,610.96.
    t=2,3,4 (steady, pre-overhaul): 7,802,200 + 22,950,000 = $30,752,200.
    t=5 (overhaul): 7,802,200 + 22,950,000 - 40,800,000 = -$10,047,800.
    t=6-9, 11-14, 16-19 (steady, post-overhaul dep): 2,090,200 + 31,110,000 = $33,200,200.
    t=10 and t=15 (overhaul years): 33,200,200 - 40,800,000 = -$7,599,800.
    t=20 (terminal: operations + WC release + salvage): 2,090,200 + 31,110,000 + 3,221,589.04 + 51,000,000
      = $87,421,789.04.
  Undiscounted, the 21-period FCFF sums to +$70,364,000, which by construction equals cumulative NOPAT:
  total depreciation $581.4m + salvage $51m = total capex $632.4m, so the D&A/capex/salvage terms cancel —
  an internal consistency check on the build.


checks:
  # conservation
  - trace.nbv[t] == trace.nbv[t-1] + trace.capex[t] - trace.depreciation[t] - trace.disposal_bv[t]
  - cumsum(trace.delta_nwc) == trace.receivables
  - trace.delta_nwc[t] == trace.receivables[t] - trace.receivables[t-1]
  - trace.nbv[last] == 0
  - sum(trace.depreciation) == sum(trace.capex) - sum(trace.salvage)
  # definition
  - trace.ebitda[t] == trace.revenue[t] - trace.opex[t]
  - trace.ebit[t] == trace.ebitda[t] - trace.depreciation[t]
  - trace.nopat[t] == trace.ebit[t] - trace.tax[t]
  - trace.cfo[t] == trace.nopat[t] + trace.depreciation[t] - trace.delta_nwc[t]
  - trace.cfi[t] == trace.salvage[t] - trace.capex[t]
  - trace.fcff[t] == trace.cfo[t] + trace.cfi[t]
  - trace.fcff[t] == trace.nopat[t] + trace.depreciation[t] - trace.delta_nwc[t] - trace.capex[t] + trace.salvage[t]
  # driver-bridge
  - trace.revenue[t] == energy_mwh * tariff_usd_per_mwh for t >= ops_start
  - trace.revenue[t] == 0 for t < ops_start
  - trace.opex[t] == opex_annual for t >= ops_start
  - trace.opex[t] == 0 for t < ops_start
  - trace.tax[t] == tax_rate * trace.ebit[t]
  - trace.receivables[t] == trace.revenue[t] * dso_days / 365 for t < terminal_period
  - sum(trace.capex) == capex_construction + 3 * overhaul_capex
  - sum(trace.salvage) == salvage_value
  - trace.salvage[last] == salvage_value
  - trace.fcff[first] == -capex_construction
  # non-negativity
  - trace.nbv[t] >= 0
  - trace.receivables[t] >= 0
  - trace.ebitda[t] >= 0
  - trace.ebit[t] >= 0
  - trace.revenue[t] >= 0

notes:
  - "Frame: unlevered (asset-side) FCFF including construction capex at t=0, so the stream is directly discountable to an enterprise/NPV. Financing (any debt on the plants) is deliberately excluded — this is FCFF, not FCFE."
  - "Revenue held flat in nominal USD: the PPA tariff is USD-fixed with no stated escalation, and output is held at the stated ~410,000 MWh with no degradation. Real PV output degrades ~0.3-0.7%/yr; ignoring it makes late-year revenue (and FCFF) modestly optimistic. ELICIT: contractual escalation and a degradation curve."
  - "Capacity-factor cross-check (234 x 8760 x 0.20 = 409,968 MWh) confirms the operator's ~410,000; I used the stated 410,000 as the driver."
  - "Overhauls modelled as IAS 16 major-component capex ($40.8m) depreciated over the 5 years to the next overhaul, installed end of yrs 5/10/15 (original inverters, inside construction capex, serve yrs 1-5). Judgment call: the whole 8% is capitalised — if part of the 'major overhaul' is really routine maintenance it should be opex; ELICIT the capex/opex split. Second judgment call: NO overhaul at year 20 (PPA ends, plant disposed); a 4-overhaul reading (yrs 5/10/15/20) would add $40.8m capex at t=20 with no depreciable life."
  - "Depreciation: straight-line over the 20-yr PPA life on cost less residual (depreciable base $459m), leaving book value = salvage $51m at t=20. Book depreciation is assumed to equal tax depreciation (no deferred tax). Kenya offers investment deductions / accelerated allowances for power assets that would front-load the tax shield and change the tax profile; not modelled. ELICIT tax-depreciation basis and any investment deduction / capital allowance."
  - "Salvage treated as disposal proceeds equal to book value -> zero gain -> no salvage tax. If tax written-down value differs from $51m, a balancing charge/allowance would arise at disposal; not modelled."
  - "EBIT is positive in every operating year (min $2.986m in yrs 6-20), so cash tax is always payable and there are no loss carry-forwards to track."
  - "Working capital: only a trade receivable from the single offtaker (Kenya Power) at an ASSUMED 30-day DSO; no inventory (electricity is not storable); O&M payables ignored as immaterial. Full WC release booked in the terminal year. dNWC nets to zero over the life. ELICIT actual PPA settlement terms."
  - "FX: the KES land/labour portion of O&M and the KES cost base sit against a USD revenue and USD tariff — a real currency mismatch/risk, but the operator quantifies total O&M as 1% of USD capex, so it enters as a single USD line; the FX exposure is flagged, not separately cashflowed."
  - "Counterparty/credit: 100% offtake concentration on Kenya Power (sovereign-adjacent utility). This does not change the cash mechanics here but is first-order for the discount rate / risk premium applied to this FCFF stream."
  - "Undiscounted FCFF sums to +$70,364,000 = cumulative NOPAT (because total depreciation $581.4m + salvage $51m = total capex $632.4m). No WACC/discounting was requested, so only the FCFF stream is delivered; discounting would require a project cost of capital."
  - "Deferred/ELICIT list: PPA escalation & degradation; O&M escalation and KES/USD split; overhaul capex-vs-opex split and exact timing; offtaker DSO; tax depreciation basis, investment allowances, VAT/withholding; whether construction capex is a single-year outlay or a multi-year draw (modelled as single t=0 outlay)."
  - "PROVENANCE NOTE 2026-07-26 (canonicalization, metadata only). Four arise golds were generated blind and independently and each emitted this same id. This gold — the base overhaul-component-capex variant — retains `arise-kenya-solar-fcff`; the three tax-depreciation siblings were disambiguated to -ida / -5050 / -wt. No number changed in any of the four."

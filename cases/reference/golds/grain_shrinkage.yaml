notes:
  - "STRUCTURAL FINDING. Nothing in the utterance is a durable asset: freight is bought per bag, the premises are rented, phostoxin is a consumable, and there is no payroll. Capex and D&A are therefore structurally zero and the unlevered build reduces to FCFF = NOPAT - dNWC. The asset side of this business is entirely its bag inventory. Any model that manufactures a depreciation schedule here is inventing a business the founder did not describe."
  - "HORIZON. One complete crop cycle, monthly, November (t=0) to October (t=11). The founder says every year is the same story, so this is the steady state and later cycles replicate it period for period. Closing the horizon on a full cycle forces inventory and NWC to open and close at zero, which makes cumulative FCFF equal cumulative NOPAT a conservation identity rather than a coincidence."
  - "IAS 2 FRICTION, KEPT VISIBLE. Warehouse rent and fumigation are storage costs and are excluded from the cost of inventory under IAS 2.16(b) because there is no further production stage; they are expensed as incurred. The trader's own frame loads them into a cost per bag out of the store. Both views are reconciled arithmetically in the passage and give the identical cycle profit; they differ only in the monthly split between carrying value and expense. I did not force the trader's frame into the IFRS lines or the reverse."
  - "SHRINKAGE TIMING IS A JUDGMENT CALL. The founder gives an outturn ratio, not a rate. I accrued the loss straight-line over the ten months the grain is physically in store, because all three mechanisms he names (weevils, rats, drying down) are continuous in time. Direction only: recognising the loss at outturn instead would push the expense out of the pre-season months into the selling months and hold inventory at a higher carrying value in the interim. Full-cycle profit and full-cycle FCFF are unchanged either way; only the monthly profile moves."
  - "RENT MONTHS. Modelled as a continuous 12-month tenancy on the reading that 'my own warehouse' plus an annually repeating cycle means a standing lease. ELICIT: do you pay the 30,000 in September and October when the store is empty? Direction only: a tenancy confined to the occupied months would lower operating cost and raise cycle FCFF, and the effect is not trivial relative to the margin."
  - "TRANSPORT AT 75 XOF PER BAG IS TAKEN AS STATED but sits an order of magnitude below observed inter-regional bag freight into Bamako. ELICIT: is that 75 per bag all-in from the production zone, or per bag per some distance unit, or a loading fee on top of a separate lorry charge? Direction only: at the stated rate freight is a rounding error in the unit cost; at a realistic inter-regional rate it would compress the margin materially. This is the single input I would verify first."
  - "TAX REGIME IS THE LARGEST UNRESOLVED ITEM. I applied 30% (Mali impot sur les societes) as a notional unlevered tax on EBIT, flagged ASSUMED. A sole trader at this turnover almost certainly falls under Mali's impot synthetique, the regime for small individual operators. Direction only: moving off a profit base removes the loss-month credits and decouples the charge from margin. Rather than assert an unverified alternative number, the zero-tax boundary is materialised as trace.fcff_no_tax and checked."
  - "CORRECTION 2026-07-26 (physical audit; two FALSE PROSE CLAIMS withdrawn from the tax note above, no trace number changed). (a) REGIME SHAPE was mischaracterised as 'a fixed annual amount by activity bracket'. Verified against the Direction Generale des Impots du Mali: the impot synthetique is levied at 3% of annual turnover excluding tax, on individual operators up to 30,000,000 XOF of turnover, payable annually, and it discharges the BIC together with the direct and indirect taxes of Titles I and II of the CGI. It is a single discharging levy, but its BASE IS TURNOVER-PROPORTIONAL, not a bracket forfait -- 'invariant to margin' was right, 'fixed annual amount' was not. (b) THE BOUND WAS FALSE AND POINTED THE WRONG WAY. The note asserted that the synthetic-regime answer 'lies between that column and the base case', i.e. between the zero-tax cycle total and the modelled one. It does not: at 3% of this cycle's turnover the levy exceeds the modelled notional tax, so the true cycle FCFF falls BELOW the modelled base case, outside the claimed bracket. That was an unverified quantified bracket asserted in prose, which the machine gate cannot see -- exactly the failure mode contract v2.3 forbids -- and it was wrong. THE 30% IS RETAINED as generated: tax_rate is honestly tagged ASSUMED with its elicitation question recorded, and per docs/CAPTURE_FINDINGS.md Finding 1 an honestly-disclosed default is not a gold defect but capture evidence. The sibling gold on the same utterance carries the identical treatment; changing one and not the other would split a convention rather than fix a defect. What was defective was claiming a bound this gold had not verified."
  - "LOSS-MONTH TAX SYMMETRY. Notional tax is accrued on EBIT in every period including the seven negative ones. This is the standard unlevered convention and the cycle closes in profit so the credits are absorbed within it. Real cash tax is settled annually, and the crop cycle straddles two Malian fiscal (calendar) years. This is a within-cycle timing convention, not a value difference over the closed cycle."
  - "OWNER'S LABOUR IS UNPRICED. 'I work alone', so no wage is booked and none should be under standard accounting for a sole proprietorship. The consequence must be stated: the cycle NOPAT is the joint return to the founder's capital AND to twelve months of his own labour, not a clean return on capital. Any imputed wage would reduce it, and at this scale of margin the imputation is not academic."
  - "FINANCING IS OUT OF SCOPE BY CONSTRUCTION. Warrantage / tierce detention (inventory-collateralised credit against stored grain) is widespread in Mali and would transform the November cash requirement. It changes the equity cash profile and the levered picture entirely, but it does not touch unlevered FCFF, which is what was asked for."
  - "WORKING CAPITAL POLICY IS ASSUMED, NOT STATED. Zero receivables and zero payables. ELICIT: do you give credit to any lean-season buyers, and do you buy any of the 200 bags on credit from producers or collectors? Either would change the monthly FCFF shape without changing the cycle total."
  - "SALES PROFILE WITHIN THE SEASON IS A CONVENTION. The founder says he clears the store over June-August, which entails the total but not the split. I allocated 60 bags a month uniformly. ELICIT: does volume or price skew toward July-August as the soudure deepens? A single sale price of 20,000 across all three months is what he stated and is what I used."
  - "DEFERRED, NOT MODELLED: patente and municipal or market levies; any insurance; bag replacement, restacking or rebagging costs; losses to theft as distinct from rodents; any residual value in the 20 lost bags (damaged grain is sometimes sold on for animal feed rather than being a total loss); and whether the 200-bag volume is capital-constrained or store-constrained. The last of these is the one that matters for any growth question."

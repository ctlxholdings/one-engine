  ===================================================================================
  9. CAPEX AND D&A
  ===================================================================================
  capex[t] = 0 and depreciation[t] = 0 for all t, for the reasons set out in section 0.
  This is asserted, not assumed away silently: the utterance names a per-bag freight
  charge (a service), a monthly rent (a lease), a consumable fumigant and no employees.
  There is no asset to place in service and therefore nothing to depreciate. Elicitation
  question recorded (cart, scales, tarpaulins, sprayer).

  ===================================================================================
  10. FCFF, PER PERIOD
  ===================================================================================
      CFO[t]  = NOPAT[t] + D&A[t] - dNWC[t]
      CFI[t]  = -capex[t] = 0
      FCFF[t] = CFO[t] + CFI[t] = NOPAT[t] + 0 - dNWC[t] - 0


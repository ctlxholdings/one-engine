  ===================================================================================
  11. THE TRADER'S OWN VIEW, RECONCILED
  ===================================================================================
  The founder would not describe any of the above as three separate lines. He would say:
  what does a bag cost me by the time I sell it? Answer, from the same inputs:

      total cash cost of the campagne
        = 2,915,000 (200 bags landed at 14,575)
        +   360,000 (12 months x 30,000 rent)
        +    30,000 (2 x 15,000 phostoxin)
        = 3,305,000 XOF

      bags actually sold = 180

      all-in cost per SELLABLE bag = 3,305,000 / 180 = 18,361.11 XOF
      selling price                =                   20,000.00 XOF
      margin per sellable bag      =                    1,638.89 XOF
      x 180 bags                   =                  295,000    XOF  = cycle EBIT. OK.

  The 10% outturn loss is what does the damage. Landed cost per bag IN is 14,575; cost per
  bag OUT, before a franc of rent, is 2,915,000 / 180 = 16,194.44. The shrinkage alone
  moves the unit cost by 1,619.44 per sellable bag — very nearly the entire per-bag margin.
  Storage overhead (390,000 / 180 = 2,166.67 per sellable bag) does the rest.

  Breakeven outturn at the stated prices and costs: he needs
      3,305,000 / 20,000 = 165.25 sellable bags out of 200, i.e. an outturn of
      165.25 / 200 = 82.625%.
  He is running at 90%. The entire trade sits on 7.4 percentage points of outturn. That is
  the operating risk of the business stated in the founder's own unit, and it is why the
  phostoxin is not optional.

  Breakeven lean-season price at the stated 90% outturn is the 18,361.11 computed above,
  against a harvest price of 14,500 — the trade needs the seasonal spread to be at least
  26.6% (18,361.11 / 14,500 - 1) gross of nothing else, and it is running at 37.9%.

  ===================================================================================
  12. WHAT THE ANSWER IS
  ===================================================================================
  Unlevered FCFF over one complete crop cycle, monthly, is the array in `fcff`: a single
  large outflow of 2,937,755 in November, a thin drip of roughly 12,000 to 23,000 a month
  through the carry, three inflows of 1,090,095 in June, July and August, and two 21,000
  outflows in the empty months. Cycle total 206,500 XOF.
  CORRECTED 2026-07-26 (physical audit): this paragraph previously quoted "peak invested capital of
  2,885,850 XOF - a return of about 7.2%". Both figures were wrong, and wrong in the unsafe
  direction. Peak invested capital is the deepest point of CUMULATIVE cash outflow, not the peak
  inventory/NWC balance: the NWC balance omits the storage opex carried through the season, which is
  funded month after month and never capitalised. Read off this gold's own fcff row, cumulative cash
  troughs at the end of the carry, below the NWC peak, so both the funding requirement and the
  return on it were misstated - the capital tied up was understated and the return correspondingly
  overstated. The trace was always right; the sentence describing it was not. No trace number
  changed. STRENGTHENED: trace.cum_fcff is materialised and checked, so the funding requirement is
  now readable as a machine-verified row rather than a prose assertion - it is the
  single most decision-relevant number for a trader deciding whether he can fund the campagne.


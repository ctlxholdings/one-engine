id: ml-bamako-sorghum-storage-trade-fcff-v1
title: "Bamako sorghum storage trade (achat récolte novembre / vente soudure juin-août) — unlevered FCFF over one full crop cycle"
currency: XOF
grid:
  periods: 12
  freq: monthly

utterance:
  fr: |-
    Je suis commerçant, je fais le sorgho à Bamako. À la récolte, en novembre, j'achète deux cents sacs
    à quatorze mille cinq cents le sac. Le transport depuis les zones de production, c'est soixante-quinze
    francs le sac. Je les stocke dans mon propre magasin à Bamako — trente mille par mois de loyer. Mais
    le grain ne sort pas comme il rentre. Les charançons s'y mettent, les rats prennent leur part, et les
    sacs se dessèchent et perdent du poids pendant la saison chaude. Chaque année c'est la même histoire :
    sur cent sacs que je mets au magasin, j'en récupère à peu près quatre-vingt-dix que je peux réellement
    vendre. C'est ce que ça coûte, stocker le sorgho. Je fais aussi la fumigation — les comprimés de
    phostoxin, c'est quinze mille francs pour tout le magasin, une fois quand je remplis en novembre et
    une deuxième fois vers mars. Ce qui sort, je le vends pendant la soudure, de juin à août, à vingt mille
    le sac, et je vide le magasin sur ces trois mois. Je travaille seul.
  en: |-
    I'm a trader, I deal in sorghum in Bamako. At harvest, in November, I buy two hundred bags at fourteen
    thousand five hundred a bag. Transport from the production zones is seventy-five francs a bag. I store
    them in my own warehouse in Bamako — thirty thousand a month rent. But the grain doesn't come out the
    way it goes in. The weevils get into it, the rats take their share, and the bags dry down and lose
    weight sitting there through the hot season. Every year it's the same story: out of a hundred bags I
    put in the store, I get about ninety back out that I can actually sell. That's just what storing
    sorghum costs you. I also fumigate — the phostoxin tablets are fifteen thousand francs for the whole
    store, once when I fill it in November and once again around March. What comes out I sell during the
    lean season, June to August, at twenty thousand a bag, and I clear the store over those three months.
    I work alone.


passage: |
  ===================================================================================
  0. WHAT KIND OF BUSINESS THIS IS, AND WHAT THAT IMPLIES FOR THE ASSET SIDE
  ===================================================================================
  This is not a manufacturer and not a service firm. It is a seasonal carry trade in a
  storable staple: the founder buys the physical commodity at the harvest trough, holds
  it through the dry season, and liquidates into the lean-season ("soudure") price peak.
  The natural quantities are HIS quantities: the sac (bag) of sorghum, the campagne
  (crop cycle) running from the November harvest to the August clearance, and the
  outturn ratio (bags out that are sellable, per bag in). I keep those and do not force
  the model onto a tonnage or a calendar year.

  The consequence for the asset side, and it is the single most important structural
  finding: NOTHING IN THE UTTERANCE IS A DURABLE ASSET. Transport is bought per bag, so
  there is no truck. The warehouse carries a monthly rent, so there is no building on
  balance sheet. Phostoxin is a consumable. He works alone, so there is no payroll and
  no tooling. Therefore capex = 0 and D&A = 0 in every period, and the unlevered build

      FCFF = NOPAT + D&A - dNWC - capex

  collapses to

      FCFF = NOPAT - dNWC.

  The entire asset side of this business IS its working capital. Modelling it properly
  means modelling the bag stock and its carrying value month by month; there is nothing
  else on the asset side to model.

  ===================================================================================
  1. THE GRID
  ===================================================================================
  The business is a single annual round trip. Its whole economics is the carry: money
  goes out in one month and comes back seven to nine months later. An annual grid would
  destroy exactly the information that matters, so the grid is MONTHLY, and the horizon
  is one complete crop cycle:

      t = 0  November (purchase, fill, first fumigation)
      t = 1  December
      t = 2  January
      t = 3  February
      t = 4  March (second fumigation)
      t = 5  April
      t = 6  May
      t = 7  June   (selling month 1)
      t = 8  July   (selling month 2)
      t = 9  August (selling month 3, store cleared)
      t = 10 September (store empty)
      t = 11 October (store empty; cycle closes)

  12 periods. The founder says "every year it's the same story", so this cycle is the
  steady state and subsequent cycles replicate it period for period. Choosing a horizon
  that is exactly one closed cycle has an analytic payoff: inventory opens at zero and
  closes at zero, so cumulative dNWC over the horizon must be exactly zero and cumulative
  FCFF must equal cumulative NOPAT. That is a conservation identity the model must satisfy,
  and it is asserted in checks.

  ===================================================================================
  2. THE PHYSICAL BAG FLOW (the operations layer)
  ===================================================================================
  Bags in:  200 in November.       (STATED)
  Bags out that can be sold: 200 x 0.90 = 180.   (INFERRED from the outturn ratio)
  Bags lost:                200 - 180 = 20.      (INFERRED)

  The 20 lost bags are the physical consequence of three distinct mechanisms the founder
  names — weevil (charancon) infestation, rodent predation, and moisture loss as the bags
  dry down through the hot season. He does not separate them, and he does not need to:
  he gives the aggregate outturn, which is exactly the operating parameter a storage
  trader carries in his head. I keep it aggregated.

  TIMING OF THE LOSS. This is a real judgment call and I flag it. The founder states a
  ratio (a stock-to-stock outturn), not a rate. Two defensible conventions exist: recognise
  the loss progressively while the grain sits, or recognise it at outturn when bags are
  weighed out. The physical mechanisms are all continuous-in-time (insects breed, rats
  feed, moisture leaves), so I accrue the loss straight-line over the ten months the grain
  is actually in store:

      bags_shrunk_per_month = 20 bags / 10 storage months = 2 bags per month, Nov..Aug.

  Sales: 180 sellable bags cleared over the three stated selling months, uniformly:

      bags_sold_per_selling_month = 180 / 3 = 60 bags per month, Jun / Jul / Aug.

  PHYSICAL STOCK ROLL-FORWARD, stock[t] = stock[t-1] + purchased[t] - shrunk[t] - sold[t]:

      t=0  Nov: 0   + 200 - 2 - 0   = 198
      t=1  Dec: 198 + 0   - 2 - 0   = 196
      t=2  Jan: 196 - 2             = 194
      t=3  Feb: 194 - 2             = 192
      t=4  Mar: 192 - 2             = 190
      t=5  Apr: 190 - 2             = 188
      t=6  May: 188 - 2             = 186
      t=7  Jun: 186 - 2 - 60        = 124
      t=8  Jul: 124 - 2 - 60        = 62
      t=9  Aug: 62  - 2 - 60        = 0
      t=10 Sep: 0                   = 0
      t=11 Oct: 0                   = 0

  The store empties to exactly zero at the end of August, which is what "I clear the store
  over those three months" requires. Total shrunk 10 x 2 = 20; total sold 3 x 60 = 180;
  20 + 180 = 200 = bags in. Physical conservation holds.

  ===================================================================================
  3. UNIT COST OF INVENTORY
  ===================================================================================
  Under IAS 2.11 the cost of purchase comprises the purchase price plus transport and
  handling directly attributable to acquisition:

      unit cost = 14,500 (price) + 75 (transport to Bamako) = 14,575 XOF per physical bag.

  Total cost of the November intake:
      200 x 14,575 = 2,915,000 XOF
      (cross-check: 200 x 14,500 = 2,900,000 goods, plus 200 x 75 = 15,000 freight,
       2,900,000 + 15,000 = 2,915,000).

  NOT capitalised: warehouse rent and fumigation. IAS 2.16(b) excludes storage costs from
  the cost of inventories unless they are necessary in a production process before a
  further production stage. This is pure trading with no processing stage, so rent and
  phostoxin are period costs, expensed as incurred.

  FRICTION, STATED PLAINLY. The trader does not think this way. In his head the cost of a
  bag out of the store includes the rent and the tablets and the bags the rats ate — that
  is precisely what he means by "that's just what storing sorghum costs you". The IFRS
  presentation splits that single economic idea across three lines (COGS, shrinkage loss,
  storage opex). Section 11 below reconciles the two views. Over the closed cycle they
  give the identical profit; they differ only in how the monthly total is split between
  carrying value and expense.

  SHRINKAGE MEASUREMENT. The 20 lost bags are written off at their carrying cost,
  14,575 each; the cost of the lost bags is NOT reallocated onto the survivors. CORRECTED
  2026-07-26 (physical audit): this was justified by the claim that 'IAS 2 does not permit
  stepping up the carrying amount of remaining inventory for losses'. IAS 2 contains no such
  prohibition. IAS 2.16(a) excludes only ABNORMAL waste from the cost of inventories; normal,
  expected, unavoidable waste is ordinarily absorbed into the cost of the good units under
  IAS 2.10. And this loss is normal on the founder's own evidence -- 'chaque annee c'est la meme
  histoire ... c'est ce que ca coute, stocker le sorgho'. So absorption at 2,915,000/180 =
  16,194.44 per sellable bag, which section 11 computes and files under 'the trader's frame', is
  a defensible IFRS treatment and arguably the better one. What is retained here is a POLICY
  CHOICE, disclosed as such; what is withdrawn is the false claim that the standard forbids the
  alternative. No trace number changes: the two bases give the same cycle total and differ only
  in the monthly split, and that difference reaches FCFF solely through the notional tax shield
  on a non-cash charge. NOTE the coverage consequence, logged rather than papered over: the
  check trace.cogs[t] == unit_inventory_cost_per_bag * trace.bags_sold[t] hard-codes this basis
  into an invariant, so the alternative cannot be tested against this gold. The 180
  survivors stay at 14,575. NRV test: 14,575 cost against a 20,000 expected selling price,
  so no write-down to NRV is required at any point in the cycle.

  ===================================================================================
  4. INVENTORY CARRYING VALUE AND NET WORKING CAPITAL
  ===================================================================================
  inventory_value[t] = 14,575 x bags_in_store[t]:

      t=0  198 x 14,575 = 2,885,850
      t=1  196 x 14,575 = 2,856,700
      t=2  194 x 14,575 = 2,827,550
      t=3  192 x 14,575 = 2,798,400
      t=4  190 x 14,575 = 2,769,250
      t=5  188 x 14,575 = 2,740,100
      t=6  186 x 14,575 = 2,710,950
      t=7  124 x 14,575 = 1,807,300
      t=8   62 x 14,575 =   903,650
      t=9    0          =         0
      t=10   0          =         0
      t=11   0          =         0

  Value roll-forward, inventory[t] = inventory[t-1] + purchases_at_cost[t] - cogs[t]
  - shrinkage_loss[t], verified at the two structural points:
      t=0:  0 + 2,915,000 - 0 - 29,150 = 2,885,850   OK
      t=7:  2,710,950 - 874,500 - 29,150 = 1,807,300 OK

  Receivables: zero. He sells for cash off the store floor in the lean season (ASSUMED,
  flagged; elicitation question recorded).
  Payables: zero. Harvest purchases are settled on the spot, rent monthly, tablets cash
  (ASSUMED, flagged).

  Therefore NWC[t] = inventory_value[t], and

      dNWC[t] = NWC[t] - NWC[t-1], with NWC[-1] = 0:

      t=0  2,885,850 - 0         = +2,885,850   <-- the whole capital requirement, in one month
      t=1  2,856,700 - 2,885,850 =    -29,150
      t=2                        =    -29,150
      t=3                        =    -29,150
      t=4                        =    -29,150
      t=5                        =    -29,150
      t=6                        =    -29,150
      t=7  1,807,300 - 2,710,950 =   -903,650
      t=8    903,650 - 1,807,300 =   -903,650
      t=9          0 -   903,650 =   -903,650
      t=10                       =          0
      t=11                       =          0

  Sum: 2,885,850 - 6 x 29,150 - 3 x 903,650 = 2,885,850 - 174,900 - 2,710,950 = 0. The
  cycle is closed and working capital is fully released, as it must be.

  Note the shape: peak invested capital is 2,885,850 XOF in November, against a full-cycle
  operating profit derived below. This is a capital-intensive-in-inventory, thin-margin
  trade. The cash conversion cycle is seven months from outlay to first receipt.

  ===================================================================================
  5. REVENUE AND COST OF GOODS SOLD, PER PERIOD
  ===================================================================================
  Revenue[t] = 20,000 x bags_sold[t]:
      t=0..6   0
      t=7   60 x 20,000 = 1,200,000
      t=8   60 x 20,000 = 1,200,000
      t=9   60 x 20,000 = 1,200,000
      t=10,11  0
      Total revenue = 3,600,000.

  Revenue recognition (IFRS 15): control of the bags passes on delivery at the store; each
  monthly tranche is recognised in the month sold. No performance obligation extends past
  delivery, no financing component.

  COGS[t] = 14,575 x bags_sold[t]:
      t=7,8,9  60 x 14,575 = 874,500 each
      Total COGS = 2,623,500.

  Gross profit on bags actually sold:
      t=7,8,9  1,200,000 - 874,500 = 325,500 each
      Total = 976,500.

  Shrinkage loss[t] = 14,575 x bags_shrunk[t] = 2 x 14,575 = 29,150 per month, t=0..9.
      Total shrinkage = 10 x 29,150 = 291,500.

  Cost conservation: 2,623,500 (COGS) + 291,500 (shrinkage) = 2,915,000 = total purchases
  at cost. Every franc that went into the store leaves the balance sheet exactly once,
  either through the till or through the rats. Asserted in checks.

  ===================================================================================
  6. STORAGE COSTS, PER PERIOD
  ===================================================================================
  Rent: 30,000 per month. I model a continuous 12-month tenancy (ASSUMED, flagged): he
  calls it "my own warehouse" and runs the cycle every year, which points to a standing
  lease rather than a seasonal let released in September. Under IFRS 16 a lease of this
  size and duration was justified here by the short-term / low-value practical expedient. THAT
  JUSTIFICATION IS WITHDRAWN 2026-07-26 (physical audit): the low-value exemption is aimed at
  small items of the tablet/office-furniture kind and cannot reach a warehouse, and the short-term
  limb is defeated by this gold's OWN argument for a 12-month rent cycle -- a standing, annually
  renewed tenancy is precisely the fact pattern that takes a lease out of the short-term exemption.
  The two arguments destroyed each other. The TREATMENT stands and no number changes: expensing the
  rent is the right presentation for an unlevered operating FCFF on a month-to-month informal
  tenancy whose enforceable term is not established by the utterance. What is withdrawn is the
  reasoning offered for it, which was load-bearing and wrong. The rent is therefore
  expensed straight-line rather than capitalised as a right-of-use asset — which is also
  why no ROU asset or lease liability appears, and why D&A stays at zero.
      rent_expense[t] = 30,000 for t = 0..11. Total = 360,000.

  Fumigation: 15,000 per treatment, two treatments.
      t=0  (November, on filling) 15,000
      t=4  (March)                15,000
      all other months            0
      Total = 30,000.

  storage_opex[t] = rent + fumigation:
      t=0  45,000
      t=1  30,000
      t=2  30,000
      t=3  30,000
      t=4  45,000
      t=5  30,000
      t=6  30,000
      t=7  30,000
      t=8  30,000
      t=9  30,000
      t=10 30,000
      t=11 30,000
      Total = 390,000.

  Labour: zero. "I work alone" and there is no payroll. See notes for what this does to
  the interpretation of the answer.

  ===================================================================================
  7. EBITDA AND EBIT, PER PERIOD
  ===================================================================================
  EBITDA[t] = revenue[t] - COGS[t] - shrinkage_loss[t] - storage_opex[t]

      t=0  Nov:      0 -       0 - 29,150 - 45,000 =  -74,150
      t=1  Dec:      0 -       0 - 29,150 - 30,000 =  -59,150
      t=2  Jan:                                    =  -59,150
      t=3  Feb:                                    =  -59,150
      t=4  Mar:      0 -       0 - 29,150 - 45,000 =  -74,150
      t=5  Apr:                                    =  -59,150
      t=6  May:                                    =  -59,150

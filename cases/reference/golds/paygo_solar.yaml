  receivable_balance_after_month6:
    value: 43683.8452941286
    unit: XOF per contract
    prov: INFERRED
    source: "amortised balance of financed_amount at weekly_effective_rate after 6*weeks_per_month = 26.0892857143 weekly payments. B(n) = 120000*(1+i)^n - 5000*((1+i)^n - 1)/i."
    date: "2026-07-27"
  receivable_balance_after_month7:
    value: 25764.4850180054
    unit: XOF per contract
    prov: INFERRED
    source: "same amortisation function at n = 7*weeks_per_month = 30.4375 weeks."

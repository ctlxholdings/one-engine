contract: "v2.6"
id: paygo_solar_ouagadougou_plateau_central
title: "PAYGo solar home systems, Ouagadougou and Plateau-Central (Burkina Faso) — unlevered asset-side free cash flow by hand"
currency: XOF

grid:
  periods: 12
  freq: monthly
  why: >-
    The PERIOD is the calendar month because every quantity this founder actually manages is monthly:
    forty kits installed, three salaries at a hundred thousand, a hundred thousand of fuel and
    maintenance, two hundred thousand of rent, and a stock he sizes as «deux mois de kits». Only one
    quantity is weekly — the five thousand instalment over thirty-six weeks — and I convert it at
    365.25/7/12 = 4.348214285714286 weeks per month rather than pretending a month is four weeks.
    That conversion is the single unit friction in this model and it is stated, not hidden: it makes
    a thirty-six-week contract 8.2837 months long, so the ninth contract month collects only 1.2143
    weeks of payments.
    The HORIZON is twelve months for two reasons that are independent of each other. First, twelve
    months is the shortest span that contains one complete customer life-cycle end to end — install,
    8.28 months of collection, the month-six/seven stop that the founder describes, the recovery
    trip, the refurbishment and the ninety-thousand resale — so nothing in the operating loop is
    truncated. Second, twelve months is exactly one Burkinabè tax year, which is what makes the
    progressive IBICA schedule and the minimum forfaitaire de perception computable on their own
    statutory base instead of pro-rated out of a longer or shorter window.
    It stops at twelve because the founder gave no growth rate, no season, no price path and no
    market size. The business he described is stationary, and I model it stationary. Running this
    to twenty-four or sixty months would repeat this year month for month while presenting my
    extrapolation as his information. A reader who wants to disagree should disagree here: the two
    things a longer horizon would add are the motorcycle replacement (which on the elicited fleet
    age falls in month 36, outside this window) and whatever growth the founder can actually
    evidence — and the second of those is a question in `inputs`, not a number I am entitled to.

utterance:
  fr: |
    Je vends des kits solaires à Ouagadougou et dans les villages du Plateau-Central. Un kit c'est un
    panneau, une batterie, trois lampes, une radio et de quoi charger les téléphones.

    Les gens ne peuvent pas payer les cent quarante mille d'un coup. Alors je fais comme les autres :
    ils versent vingt mille à l'installation et puis cinq mille par semaine pendant trente-six
    semaines. Le kit a une carte SIM dedans — s'ils ne paient pas, la lampe s'éteint toute seule
    jusqu'à ce qu'ils paient. Ça fait cent quatre-vingt-dix-huit mille au total, oui, c'est plus cher,
    mais c'est le seul moyen qu'ils achètent.

    Sur cent clients, il y en a à peu près quinze qui arrêtent de payer avant la fin. La plupart
    s'arrêtent vers le sixième ou septième mois. Quand ça arrive j'envoie quelqu'un récupérer le kit —
    je récupère le panneau et la batterie, les lampes en général sont cassées ou perdues. Un kit
    récupéré, je peux le remettre en état et le revendre, mais moins cher, disons quatre-vingt-dix
    mille, et il faut remplacer la batterie une fois sur deux. Aller récupérer un kit dans un village
    me coûte dans les huit mille en transport et en temps.

    Le kit m'est livré de Chine par un importateur à Ouaga, je le paie quatre-vingt-deux mille. Il faut
    que je paie la moitié quand je commande et le reste à la livraison, et entre les deux il y a six
    semaines. J'installe à peu près quarante kits par mois. J'ai trois techniciens installateurs à
    cent mille par mois, chacun peut faire deux installations par jour mais compte tenu des
    déplacements en village c'est plutôt une par jour en moyenne réelle. J'ai deux motos pour les
    techniciens, achetées huit cent mille chacune, et le carburant plus l'entretien c'est cent mille
    par mois pour les deux.

    Le local et le magasin c'est deux cent mille par mois. Je garde toujours à peu près deux mois de
    kits en stock parce que si je suis en rupture le client va chez le concurrent.
  en: |
    I sell solar kits in Ouagadougou and in the villages of the Plateau-Central. A kit is a panel, a
    battery, three lamps, a radio and something to charge phones with.

    People can't pay the hundred and forty thousand all at once. So I do what the others do: they pay
    twenty thousand at installation and then five thousand a week for thirty-six weeks. The kit has a
    SIM card in it — if they don't pay, the lamp switches itself off until they do. That comes to a
    hundred and ninety-eight thousand in total, yes it's more expensive, but it's the only way they
    buy at all.

    Out of a hundred customers, about fifteen stop paying before the end. Most of them stop around the
    sixth or seventh month. When that happens I send someone to recover the kit — I get the panel and
    the battery back, the lamps are usually broken or lost. A recovered kit I can refurbish and resell,
    but cheaper, say ninety thousand, and half the time the battery has to be replaced. Going out to
    recover a kit in a village costs me around eight thousand in transport and time.

    The kit is shipped to me from China through an importer in Ouaga, I pay eighty-two thousand for it.
    I have to pay half when I order and the rest on delivery, and there are six weeks between the two.
    I install about forty kits a month. I have three installer technicians at a hundred thousand a
    month; each can do two installations a day, but given the travel out to the villages it's really
    more like one a day on average. I have two motorcycles for the technicians, bought at eight hundred
    thousand each, and fuel plus maintenance is a hundred thousand a month for the two.

    The premises and the store come to two hundred thousand a month. I always keep about two months of
    kits in stock, because if I'm out of stock the customer goes to the competition.


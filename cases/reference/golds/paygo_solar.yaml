checks:
  # ---- conservation ----
  - trace.inventory_units[t] == trace.inventory_units[t-1] + trace.opening_inventory_injection[t] + trace.kits_purchased[t] - trace.new_installs[t] - trace.kits_shrunk[t]
  - trace.inventory_units_opening[t] == trace.inventory_units[t-1] + trace.opening_inventory_injection[t]
  - trace.receivables_gross[t] == trace.receivables_gross[t-1] + trace.opening_receivables_injection[t] + trace.receivable_additions[t] + trace.receivable_interest_accrued[t] - trace.receivable_collections[t] - trace.receivable_writeoffs[t]
  - trace.supplier_advance[t] == trace.supplier_advance[t-1] + trace.opening_advance_injection[t] + trace.advance_paid[t] - trace.advance_released[t]
  - trace.moto_nbv[t] == trace.moto_nbv[t-1] + trace.moto_nbv_opening_injection[t] + trace.capex[t] - trace.depreciation[t]
  - cumsum(trace.delta_nwc) == trace.nwc - trace.nwc_opening
  - trace.cum_fleet_km == cumsum(trace.km_fleet_month)
  - trace.panels_in_recovered_kits == trace.panels_recovered + trace.panels_lost
  - trace.panels_fitted_refurb == trace.panels_recovered + trace.panels_purchased
  - trace.batteries_in_recovered_kits == trace.batteries_recovered_serviceable + trace.batteries_scrapped
  - trace.batteries_fitted_refurb == trace.batteries_recovered_serviceable + trace.batteries_purchased
  - trace.lamps_in_recovered_kits == trace.lamps_recovered + trace.lamps_lost
  - trace.lamps_fitted_refurb == trace.lamps_recovered + trace.lamps_purchased
  - trace.radiochargers_in_recovered_kits == trace.radiochargers_recovered + trace.radiochargers_lost
  - trace.radiochargers_fitted_refurb == trace.radiochargers_recovered + trace.radiochargers_purchased
  - trace.panels_in_recovered_kits == trace.kits_recovered * panels_per_kit
  - trace.batteries_in_recovered_kits == trace.kits_recovered * batteries_per_kit
  - trace.lamps_in_recovered_kits == trace.kits_recovered * lamps_per_kit
  - trace.radiochargers_in_recovered_kits == trace.kits_recovered * radiochargers_per_kit

  # ---- definition ----
  - trace.revenue_total == trace.revenue_goods_new + trace.revenue_financing + trace.revenue_refurb_resale
  - trace.opex_total == trace.cost_refurb_parts + trace.cost_recovery + trace.cost_shrinkage + trace.credit_losses + trace.cost_payroll_gross + trace.cost_cnss + trace.cost_tpa + trace.cost_fuel_maint + trace.cost_rent + trace.cost_patente + trace.cost_sim_platform + trace.cost_collection_fees + trace.cost_in_contract_service + trace.cost_marketing
  - trace.ebitda == trace.revenue_total - trace.cogs_new_kits - trace.opex_total
  - trace.ebit == trace.ebitda - trace.depreciation
  - trace.nopat == trace.ebit - trace.tax
  - trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc
  - trace.cfi == 0 - trace.capex
  - trace.fcff == trace.cfo + trace.cfi
  - fcff == trace.fcff
  - trace.nwc == trace.inventory_value + trace.receivables_gross + trace.supplier_advance - trace.payables
  - trace.cash_in_total == trace.cash_deposits + trace.cash_instalments + trace.cash_refurb_resale
  - trace.cash_out_total == trace.cash_kit_purchases + trace.cost_refurb_parts + trace.cost_recovery + trace.cost_payroll_gross + trace.cost_cnss + trace.cost_tpa + trace.cost_fuel_maint + trace.cost_rent + trace.cost_patente + trace.tax + trace.cost_sim_platform + trace.cost_collection_fees + trace.cost_in_contract_service + trace.cost_marketing
  - trace.fcff == trace.cash_in_total - trace.cash_out_total
  - trace.cash_kit_purchases == trace.advance_paid + trace.advance_released
  - trace.moto_slack_trip_days == trace.moto_trip_capacity - trace.trips_required
  - contract_total == deposit + weekly_payment * contract_weeks
  - financed_amount == kit_cash_price - deposit
  - financing_charge_per_contract == contract_total - kit_cash_price
  - default_share_month6 + default_share_month7 == default_share
  - moto_replacement_period_index == moto_life_months - moto_age_months_at_t0

  # ---- driver-bridge ----
  - trace.new_installs == installs_per_month
  - trace.revenue_goods_new == trace.new_installs * kit_cash_price / (1 + kit_vat_rate)
  - trace.cogs_new_kits == trace.new_installs * kit_purchase_cost / (1 + kit_vat_rate)
  - trace.revenue_refurb_resale == trace.refurb_installs * resale_price_refurb / (1 + kit_vat_rate)
  - trace.inventory_value == trace.inventory_units * kit_purchase_cost / (1 + kit_vat_rate)
  - trace.cash_deposits == trace.new_installs * deposit
  - trace.receivable_additions == trace.new_installs * financed_amount
  - trace.defaults_per_month == pre_horizon_installs_per_month * (default_share_month6 + default_share_month7)
  - trace.kits_recovered == trace.defaults_per_month * repossession_recovery_rate
  - trace.refurb_installs == trace.kits_recovered
  - trace.cost_recovery == trace.defaults_per_month * recovery_cost_per_default
  - trace.credit_losses == pre_horizon_installs_per_month * default_share_month6 * receivable_balance_after_month6 + pre_horizon_installs_per_month * default_share_month7 * receivable_balance_after_month7
  - trace.receivable_writeoffs == trace.credit_losses
  - trace.receivable_collections == pre_horizon_installs_per_month * instalment_cash_per_cohort_kit
  - trace.cash_instalments == trace.receivable_collections
  - trace.revenue_financing == pre_horizon_installs_per_month * financing_income_per_cohort_kit
  - trace.receivable_interest_accrued == trace.revenue_financing
  - trace.opening_receivables_injection[first] == pre_horizon_installs_per_month * receivable_stock_per_cohort_kit
  - trace.cash_refurb_resale == trace.revenue_refurb_resale * refurb_sale_is_cash
  - trace.refurb_receivable_created == trace.revenue_refurb_resale - trace.cash_refurb_resale
  - trace.batteries_recovered_serviceable == trace.kits_recovered * (1 - battery_replacement_rate)
  - trace.batteries_purchased == trace.kits_recovered * battery_replacement_rate
  - trace.lamps_lost == trace.kits_recovered * lamps_lost_per_repossessed_kit
  - trace.lamps_purchased == trace.lamps_lost
  - trace.radiochargers_recovered == trace.kits_recovered * radiocharger_recovery_rate
  - trace.cost_refurb_parts == trace.batteries_purchased * refurb_battery_cost + trace.lamps_purchased * refurb_lamp_cost + trace.radiochargers_purchased * radiocharger_replacement_cost
  - trace.inventory_units_opening[first] == stock_cover_months * installs_per_month
  - trace.kits_shrunk == trace.inventory_units_opening * inventory_shrinkage_rate_monthly
  - trace.cost_shrinkage == trace.kits_shrunk * kit_purchase_cost / (1 + kit_vat_rate)
  - trace.kits_purchased == trace.new_installs + trace.kits_shrunk
  - trace.advance_paid == supplier_prepay_share * trace.kits_purchased * kit_purchase_cost / (1 + kit_vat_rate)
  - trace.supplier_advance == supplier_prepay_share * trace.kits_purchased * kit_purchase_cost / (1 + kit_vat_rate) * supplier_lag_weeks / weeks_per_month
  - trace.cost_payroll_gross == technicians * tech_wage_monthly
  - trace.cost_cnss == trace.cost_payroll_gross * cnss_employer_rate
  - trace.cost_tpa == trace.cost_payroll_gross * tpa_rate
  - trace.cost_fuel_maint == moto_fuel_maint_monthly
  - trace.cost_rent == rent_monthly
  - trace.cost_patente == (patente_droit_proportionnel_rate * rent_monthly * 12 + patente_droit_fixe_annual) / 12
  - trace.depreciation == motos * moto_cost / moto_life_months
  - trace.moto_nbv_opening_injection[first] == motos * moto_cost * (1 - moto_age_months_at_t0 / moto_life_months)
  - trace.capex[t] == 0 for t < moto_replacement_period_index
  - trace.cost_sim_platform == trace.active_contracts * sim_platform_cost_per_active_kit_month
  - trace.cost_collection_fees == trace.receivable_collections / weekly_payment * collection_fee_per_instalment
  - trace.cost_in_contract_service == trace.active_contracts * in_contract_service_cost_per_active_kit_month
  - trace.cost_marketing == marketing_cost_monthly
  - trace.trips_required == trace.new_installs + trace.refurb_installs + trace.defaults_per_month * recovery_trip_uses_company_moto
  - trace.moto_trip_capacity == motos * (working_days_per_month - public_holidays_per_year / 12 - moto_downtime_days_per_month)
  - trace.tech_day_capacity == technicians * (working_days_per_month - public_holidays_per_year / 12 - paid_leave_working_days_per_month) * (1 - tech_absence_rate)
  - trace.litres_fuel_month == moto_fuel_maint_monthly * fuel_share_of_moto_budget / gasoline_price_per_litre
  - trace.km_fleet_month == trace.litres_fuel_month / moto_fuel_consumption_l_per_100km * 100
  - trace.km_per_moto_month == trace.km_fleet_month / motos
  - max(trace.new_installs) - min(trace.new_installs) == installs_per_month * seasonality_amplitude
  - sum(trace.tax) == (ibica_rate_band1 * ibica_band1_ceiling + ibica_rate_band2 * (ibica_band2_ceiling - ibica_band1_ceiling) + ibica_rate_band3 * (sum(trace.ebit) - ibica_band2_ceiling)) * (1 - cga_ibica_reduction * cga_member)

  # ---- non-negativity and feasibility ----
  - trace.inventory_units[t] >= 0
  - trace.receivables_gross[t] >= 0
  - trace.supplier_advance[t] >= 0
  - trace.moto_nbv[t] >= 0
  - trace.credit_losses[t] >= 0
  - trace.moto_slack_trip_days[t] >= 0
  - trace.tech_day_capacity[t] >= trace.trips_required[t] / installs_per_tech_day_realised
  - trace.new_installs[t] <= technicians * installs_per_tech_day_nameplate * working_days_per_month
  - trace.cum_fleet_km[last] <= motos * moto_life_km
  - max(trace.km_per_moto_month) * moto_life_months <= moto_life_km
  - tech_wage_monthly >= smig_monthly
  - tech_wage_monthly <= cnss_ceiling_monthly
  - sum(trace.revenue_goods_new) + sum(trace.revenue_refurb_resale) >= rni_threshold
  - sum(trace.ebit) >= ibica_band2_ceiling
  - sum(trace.tax) >= mfp_rate * (sum(trace.revenue_goods_new) + sum(trace.revenue_refurb_resale))
  - sum(trace.tax) >= mfp_floor_rni

notes: |
  FINDINGS

  F1 — The founder's own total does not tie. He states 20,000 down and 5,000 a week for 36 weeks, and
  then states that this «fait cent quatre-vingt-dix-huit mille au total». It makes 200,000. I have
  modelled 200,000 because it is entailed by the three numbers he is surest of, and recorded 198,000
  as a belief. The gap is 2,000 per contract and immaterial to FCFF, but a man who has mis-stated his
  own headline price by 2,000 should be re-asked the price, and it is the cheapest question on the list.

  F2 — The refurbishment cost is missing its largest component. The founder costs a recovered kit as
  «remplacer la batterie une fois sur deux» and stops there. But he has separately told us the lamps
  come back broken or lost, and no kit is saleable at 90,000 without three working lamps. Costing only
  the battery understates refurbishment by the whole lamp line. On the elicited spare-part prices that
  is 18 lamps a month against 3 batteries — the part he omits is larger than the part he names. This is
  exactly what a yield ratio hides: «I get the panel and the battery back» is a statement about what
  returns, not a balance of what the kit was made of, and the model closes it component by component in
  `trace` rather than accepting the ratio.

  F3 — The binding constraint is two motorcycles, not three technicians. Forty installations plus six
  refurbished-kit installations is 46 village or city trips a month. Three technicians at the founder's
  own realised rate of one job a day supply 65.4 technician-days. Two motorcycles supply 46.68 trip-days
  after holidays and an elicited day and a half of downtime each. The fleet runs at 98.5% and the labour
  at 70%. The third technician is absence cover, not capacity. Two consequences follow and neither is a
  rounding: if the recovery trips are in fact run in-house on a company machine, the requirement rises to
  52 trips and the stated volume does not fit the plant described; and there is no headroom at all for
  growth without a third machine. The slack is materialised as `trace.moto_slack_trip_days` and asserted
  non-negative, so a different answer to the downtime question breaks the check rather than passing
  silently.

  F4 — The fuel budget and the geography disagree. 100,000 a month at an elicited 60% fuel share buys
  70.6 litres at the verified pump price of 850 XOF, which at 2.5 l/100km is 2,823.5 fleet kilometres —
  61.4 km per job, about 31 km each way. That is a business working Ouagadougou and the near Plateau-
  Central. The province's further communes are 80 to 110 km out and a single round trip there would
  consume a fifth of the monthly fuel. Either the villages served are closer than «les villages du
  Plateau-Central» suggests, or the fuel budget is understated. The cumulative test passes: 33,882 km of
  fleet distance over the horizon, and 67,765 km per machine over its full 48-month depreciation life,
  inside an 80,000 km economic life. The plant can deliver the mileage the model implies.

  F5 — Four real costs enter this model at zero, and all four are questions rather than assumptions
  because the founder holds the answers. A kit that switches itself off is on a cellular network and
  that is normally a monthly cost per active unit; there are roughly 1,394 instalments collected a month
  and mobile-money or agent collection is not free; 351 kits are live under contract and warranty-type
  failures during the contract are normally the seller's problem; and forty new rural customers a month
  do not arrive without a cost of acquisition. Every one of these is wired into `checks` so that a
  non-zero answer changes the number. Until they are answered, the FCFF here is an upper bound wearing
  the clothes of a base case, and it should be read that way.

  F6 — The tax regime the rule imposes is not the one this size of business usually assumes. Goods and
  resale turnover alone is 73,680,000, above the 50,000,000 RNI threshold, so this is the réel normal:
  full SYSCOHADA accounting, monthly declarations, and in principle VAT registration. The founder does
  not mention VAT at all. The world-fact is that an exoneration for solar equipment exists (arrêté
  n°2020-33/ME/MINEFID/MCIA of 16 March 2020) but is NOT automatic — it requires an eligibility
  certificate. Whether he holds it is a fact about his business and only he can say; it is therefore the
  highest-materiality question in the register, because if the answer is no, every price he quoted is a
  gross price and every revenue and cost line in this model divides by 1.18.

  F7 — A widely repeated claim had to be discarded. Several sources describe a blanket October 2024
  interministerial order granting total VAT, customs and banking-tax exemption on renewable energy
  equipment; on checking the instrument, it is Ivorian, not Burkinabè. The earlier Burkinabè
  loi n°051-2012/AN granted a five-year solar exemption running from 1 January 2013 and has lapsed on
  its own terms. What survives is the 2020 arrêté with its certificate condition. This is recorded
  because an unverified statutory claim is the one error that ties perfectly through every internal check.

  ACCOUNTING JUDGMENTS

  J1 — Revenue split. The contract is treated under IFRS 15 as a sale with a significant financing
  component: 140,000 of goods revenue when the kit is installed and control passes, and 60,000 earned
  as financing income over the term on the effective-interest basis. The alternative — recognising the
  full 200,000 as goods revenue over the collection period — would overstate goods margin and understate
  the fact that roughly 28% of this business's revenue is interest.

  J2 — Financing income is classified as OPERATING, and therefore sits inside EBIT and inside NOPAT.
  This is a deliberate departure from the reflex of stripping interest out of an unlevered build. For a
  PAYGo retailer the credit spread is not a treasury by-product, it is the reason the business exists
  and the reason the customer is reachable at all. Stripping it out while leaving the 25m receivable
  inside working capital would penalise the model twice for the same decision. The friction is named
  rather than hidden.

  J3 — Credit losses are recognised when the customer stops paying, not as a day-one expected credit
  loss provision under IFRS 9. In a stationary book the two give the same steady-state charge; in a
  growing book the IFRS 9 treatment would front-load it. Direction only: a growing book would show a
  lower early FCFF under IFRS 9 than under this treatment.

  J4 — Rent is expensed. IFRS 16 would capitalise a right-of-use asset and a lease liability and move
  rent out of operating cost, which would raise EBIT and change FCFF. The founder states no lease term,
  the entity reports under SYSCOHADA rather than IFRS, and a premises let of this kind in Ouagadougou is
  typically short and cancellable. Expensing is the honest treatment on what he said.

  J5 — Repossessed kits carry no book cost. The 82,000 went to cost of sales at the original installation,
  so the refurbished resale shows 90,000 against only the parts fitted. This is correct but it makes the
  refurbishment loop look better than a full-lifecycle view of a defaulting customer would: over that
  customer's whole life the business collects 150,446 of instalments plus 90,000 of resale against 82,000
  of kit, 8,000 of recovery and 29,000 of parts.

  J6 — The founder takes no salary in this model. For an entreprise individuelle his drawings are a
  distribution of profit, not a deductible charge, so excluding them is technically right. It is also
  economically misleading: he is plainly running the operation, and a reader valuing this business on
  35.9m of annual FCFF should ask what it would cost to replace him.

  SIMPLIFICATIONS AND THINGS DEFERRED

  S1 — Installations are placed at period end and the first instalment in the following period. This
  delays cash rather than accelerating it. Deposits are still collected in the installation month.

  S2 — Defaulters are assumed to accrue no interest after their last payment and to be written off in
  the following month, with the recovery trip, refurbishment and resale all falling in that same month.
  A longer real grace period would push a small amount of cash to the right.

  S3 — There is no separate stock of refurbished kits: six come in and six go out in the same month.
  The founder describes no such stock and demand exceeds the six-a-month supply.

  S4 — Payables are zero. The importer is paid half at order and half at delivery, so nothing is owed
  after the goods arrive. Wages, rent and fuel are treated as paid in the month incurred. This is the
  unfavourable convention on both sides.

  S5 — The retenue à la source of 5% on payments to registered service providers would apply to the
  bought-in recovery trips, but it is withheld from the supplier's fee rather than added to the cost, so
  it does not enter the income statement. Likewise IUTS on wages is borne by the employee, not the
  employer; only CNSS at 16% and TPA at 3% are employer charges and both are in the model.

  S6 — The patente droit fixe is elicited rather than sourced because I could not verify the tariff
  table in the consolidated CGI text available. The droit proportionnel is computed from the verified 8%
  rate on a valeur locative proxied by the annual rent; the true valeur locative is administratively
  assessed and may differ from the rent actually paid.

  S7 — The model is flat month to month, and that is a result rather than a shortcut. The founder
  described a stationary operation and gave no growth, no season and no price path. The only period-to-
  period movement I could have manufactured would have been mine, not his. Two consequences follow, both
  qualitative: the level of net working capital, 33.8m, matters far more to this business than the shape
  of its cash flow; and the flat profile is almost certainly wrong in a rural Sahelian market where both
  installation demand and repayment discipline move with the agricultural year — which is why
  seasonality is a high-materiality question wired into the checks rather than a silent zero.

  pre_horizon_installs_per_month:
    value: 40
    unit: new kits installed per month in the ten months before t=0
    prov: ELICITED
    source: "base case set equal to the STATED current rate, which is the choice that omits any ramp. It is not a free assumption: it fixes the whole opening receivable book, the monthly write-off flow and the monthly repossession flow, because in month t the defaults arrive from cohorts installed 7 and 8 months earlier."
    question: "Have you been installing about forty kits a month for the whole of the last year, or has that number been climbing — what did you install in the same month last year?"
    range: {low: 20, high: 40}
    materiality: high
  default_share_month6:
    value: 0.075
    unit: fraction of a cohort stopping at the end of contract month 6
    prov: ELICITED
    source: "half of the STATED 15% placed at month 6, half at month 7, because the founder said «vers le sixième ou septième mois» and gave no split. This is the omitting choice: it puts all defaults at the point he named and none earlier, which maximises the cash collected before the stop."
    question: "Of the fifteen in a hundred who stop, do they all stop around the sixth or seventh month, or do some of them stop much earlier — in the first month or two, before they have paid much?"
    range: {low: 0.02, high: 0.12}
    materiality: high
  default_share_month7:
    value: 0.075
    unit: fraction of a cohort stopping at the end of contract month 7
    prov: ELICITED
    source: "other half of the STATED 15%, same reasoning; constrained by check to sum with default_share_month6 to the stated 0.15."
    question: "And of those who stop, is it more like the sixth month or more like the seventh — or later, once they can nearly see the end?"
    range: {low: 0.03, high: 0.13}
    materiality: medium
  repossession_recovery_rate:
    value: 1.0
    unit: fraction of defaulted kits actually recovered
    prov: ELICITED
    source: "base case takes the founder's account literally — «j'envoie quelqu'un récupérer le kit» describes recovery as something that happens, not something that is attempted. This is the NON-conservative end of the range and is flagged as such: a kit not recovered loses the 90,000 resale and still costs the 8,000 trip."
    question: "Out of ten customers who stop paying, how many kits do you actually get back — and how many have moved away, refused, or already sold it on?"
    range: {low: 0.5, high: 1.0}
    materiality: high
  refurb_sale_is_cash:
    value: 1
    unit: "1 = refurbished kit sold for cash, 0 = sold on the same deposit-plus-weekly plan"
    prov: ELICITED
    source: "base case is cash, the omitting choice: it creates no second receivable book and no second default stream. If refurbished kits go out on the same PAYGo plan the working capital and the credit exposure both rise."
    question: "The ninety thousand for a refurbished kit — does the customer hand you that in cash on the day, or does he take it on the same twenty-thousand-plus-five-thousand-a-week plan?"
    range: {low: "same weekly plan", high: "cash on installation"}
    materiality: high
  lamps_lost_per_repossessed_kit:
    value: 3
    unit: lamps
    prov: ELICITED
    source: "«les lampes en général sont cassées ou perdues» is a statement about generality, not a count. Base case takes all three as lost, the conservative reading, because a kit cannot be resold at 90,000 without three working lamps in it."
    question: "When you get a kit back, how many of the three lamps are usually still working — none, one, two?"
    range: {low: 1, high: 3}
    materiality: low
  radiocharger_recovery_rate:
    value: 1.0
    unit: fraction of the radio-and-charger assembly recovered per recovered kit
    prov: ELICITED
    source: "base case recovers it, because the founder named only the lamps as lost. Recorded explicitly rather than left silent: physical closure rule (a) requires every component of the kit to be accounted for as recovered, replaced or lost, and the radio and charger are the two the utterance never disposes of."
    question: "When you recover a kit, do you get the radio and the phone-charging unit back as well, or is it really only the panel and the battery that come home?"
    range: {low: 0.0, high: 1.0}
    materiality: low
  refurb_battery_cost:
    value: 25000
    unit: XOF per replacement battery
    prov: ELICITED
    source: "the founder buys these; nobody else can price his supplier. Base case 25,000 sits a little above the pro-rata share of the 82,000 kit that a battery would represent in a typical multi-light solar home system bill of materials, because spares bought singly cost more than the same part inside a bulk kit."
    question: "When you have to put a new battery in a recovered kit, what do you pay for that battery on its own?"
    range: {low: 15000, high: 40000}
    materiality: medium
  refurb_lamp_cost:
    value: 5500
    unit: XOF per replacement lamp
    prov: ELICITED
    source: "same reasoning as the battery. Base case 5,500 per lamp, i.e. 16,500 to relamp a kit."
    question: "And one replacement lamp — what does that cost you?"
    range: {low: 3000, high: 10000}
    materiality: low
  radiocharger_replacement_cost:
    value: 9000
    unit: XOF per radio-and-charger assembly
    prov: ELICITED
    source: "carried so that the bill of materials closes if the radio does not come back; contributes zero in the base case because radiocharger_recovery_rate is 1.0."
    question: "If the radio and the charging unit are missing from a recovered kit, what do you pay to replace them?"
    range: {low: 4000, high: 20000}
    materiality: low
  inventory_shrinkage_rate_monthly:
    value: 0.0025
    unit: fraction of opening stock lost per month
    prov: ELICITED
    source: "physical closure rule (b) forbids a silent zero on a stock held for two months. The founder holds the answer — he counts the store. Base case 0.25% a month applied to the opening 80 kits, i.e. 0.2 kits a month, which also absorbs the slow self-discharge and sulfation of batteries sitting two months in a Ouagadougou store under first-in-first-out rotation."
    question: "Over the last twelve months, how many kits went missing, were stolen, or turned out damaged in the store before you could install them?"
    range: {low: 0.0, high: 0.01}
    materiality: low
  moto_age_months_at_t0:
    value: 12
    unit: months of age at the start of the horizon
    prov: ELICITED
    source: "«achetées» is past tense and the founder has observed a full default cycle, so the business is at least a year old; base case puts the fleet at one year. This is the omitting choice for capex: at twelve months of age the replacement falls in period 36, outside the grid, so capex is zero throughout."
    question: "When did you buy the two motos — how many months ago, and were they new or second-hand?"
    range: {low: 0, high: 48}
    materiality: medium
  moto_downtime_days_per_month:
    value: 1.5
    unit: days per motorcycle per month off the road
    prov: ELICITED
    source: "this is the input that decides whether the stated forty installations a month physically fit the plant described, and the founder is the only person who knows it. Base case 1.5 days leaves 0.68 spare trip-days a month across the whole fleet — see finding F3. Nothing in the utterance supports a lower figure; a higher one breaks the operation."
    question: "In a normal month, how many days is each moto off the road — punctures, servicing, waiting for a part, or too much rain to go out?"
    range: {low: 0.5, high: 6}
    materiality: high
  fuel_share_of_moto_budget:
    value: 0.6
    unit: fraction of the 100,000 monthly moto budget that is fuel
    prov: ELICITED
    source: "the founder pays both bills separately and can split them. Base case 60/40 fuel to maintenance. It does not move FCFF by a franc — the 100,000 is stated in total — but it is the hinge of the physical closure test on distance, because it converts money into litres into kilometres."
    question: "Of the hundred thousand a month for the two motos, roughly how much is fuel at the pump and how much is repairs, tyres and servicing?"
    range: {low: 0.4, high: 0.85}
    materiality: medium
  recovery_trip_uses_company_moto:
    value: 0
    unit: "1 = a recovery trip consumes one company motorcycle-day, 0 = it is bought in"
    prov: ELICITED
    source: "base case 0, read from «j'envoie QUELQU'UN récupérer le kit» plus the fact that the trip carries an explicit 8,000 out-of-pocket cost — a technician already on payroll riding a moto already fuelled would not generate a separate 8,000 charge. If it is in fact an in-house trip, the fleet cannot deliver the stated volume."
    question: "When you send someone out to recover a kit, is that one of your three technicians on one of your motos, or somebody you pay for the trip?"
    range: {low: "hired in, no company moto used", high: "own technician on a company moto"}
    materiality: medium
  tech_absence_rate:
    value: 0.04
    unit: fraction of scheduled days lost to illness and family obligations
    prov: ELICITED
    source: "over and above statutory leave and public holidays, which are handled separately. Base case 4%. Technicians are not the binding constraint in this operation, so this figure has room to be wrong without moving the answer."
    question: "Apart from their leave, how many days a month does a technician typically miss — illness, a funeral, a family obligation?"
    range: {low: 0.0, high: 0.15}
    materiality: low
  kit_vat_rate:
    value: 0
    unit: fraction, VAT charged on the kit
    prov: ELICITED
    source: "the world-fact is settled and recorded as SOURCED above: an exoneration for solar equipment exists under arrêté n°2020-33/ME/MINEFID/MCIA and is conditional on a certificate. What is NOT settled is whether THIS founder holds it and whether the round numbers he quotes are inclusive or exclusive of tax — and only he can say. Base case zero, which is the reading consistent with a man who quotes 140,000 and 82,000 and never mentions TVA. If the answer is 18%, every price in this model is a gross price and all revenue and COGS lines divide by 1.18."
    question: "Do you have the attestation that exempts solar kits from the TVA — and when you say the kit is 140,000 and you pay 82,000, is that with the TVA inside or without?"
    range: {low: 0, high: 0.18}
    materiality: high
  legal_form_is_entreprise_individuelle:
    value: 1
    unit: "1 = entreprise individuelle taxed under IBICA, 0 = société taxed under IS"
    prov: ELICITED
    source: "the founder speaks throughout in the first person singular about his own techniciens, his own motos, his own local, and never mentions a société, so the base case is an entreprise individuelle under the progressive IBICA. This answer changes the STRUCTURE of the tax computation rather than a value — a société would be flat IS at 27.5% (19.25% with CGA) instead of a three-band schedule — so it is not wired to a single check; it is the reason the tax check is written in bands at all."
    question: "Is the business registered in your own name, or is there a société — a SARL — behind it?"
    range: {low: "société (IS)", high: "entreprise individuelle (IBICA)"}
    materiality: medium
  cga_member:
    value: 0
    unit: "1 = member of a Centre de gestion agréé"
    prov: ELICITED
    source: "base case not a member, the conservative choice, because it produces the higher tax. Membership would cut the IBICA by 30%."
    question: "Are you a member of a Centre de gestion agréé?"
    range: {low: 0, high: 1}
    materiality: medium
  patente_droit_fixe_annual:
    value: 200000
    unit: XOF per year
    prov: ELICITED
    source: "the droit proportionnel is computable from a SOURCED rate; the droit fixe follows a tariff table assessed on turnover two years back which I could not verify in the consolidated CGI text available to me. The founder holds the answer directly — it is printed on his avis d'imposition. Base case 200,000."
    question: "What is the droit fixe figure on your patente notice this year — the amount before the part calculated on the rent?"
    range: {low: 50000, high: 1000000}
    materiality: low
  sim_platform_cost_per_active_kit_month:
    value: 0
    unit: XOF per active contract per month
    prov: ELICITED
    source: "base case zero — the OMITTING choice, and it is almost certainly wrong in one direction. A kit that switches itself off remotely is talking to something over a cellular network, and that costs money every month unless the importer has bundled airtime and platform licence into the 82,000 for the life of the contract. Zero is carried so the arithmetic runs; it means FCFF here is an upper bound on this line. With 351 contracts live, every 100 XOF per kit per month is 35,100 XOF a month of cost this model does not have."
    question: "Does the 82,000 you pay the importer cover the SIM airtime and the software that switches the lamp off, for the whole life of the contract — or do you pay something every month for the SIMs and the platform?"
    range: {low: 0, high: 1000}
    materiality: high
  collection_fee_per_instalment:
    value: 0
    unit: XOF per weekly instalment collected
    prov: ELICITED
    source: "base case zero, the omitting choice. This business collects roughly 1,394 separate instalments a month. If they arrive by Orange Money or Moov Money there is a commission on each one; if they arrive as cash to an agent there is a commission and a cash-handling risk instead. Either way the true figure is above zero."
    question: "How do the customers actually get you the five thousand each week — cash to somebody, Orange Money, Moov Money — and what does each payment cost you in commission?"
    range: {low: 0, high: 250}
    materiality: high
  in_contract_service_cost_per_active_kit_month:
    value: 0
    unit: XOF per active contract per month
    prov: ELICITED
    source: "base case zero, the omitting choice. The utterance costs failures only AFTER default and repossession; it is silent on what happens when a lamp or a battery fails in month three while the customer is still paying and still owns the right to a working kit. In this industry that obligation is real and is normally the seller's."
    question: "While a customer is still paying, if a lamp stops working or the battery dies, who pays to put it right — and how many kits a month come back to you like that?"
    range: {low: 0, high: 1500}
    materiality: high
  marketing_cost_monthly:
    value: 0
    unit: XOF per month
    prov: ELICITED
    source: "base case zero, the omitting choice. Forty new customers a month in villages do not arrive unprompted; there is normally an agent commission, a market-day presence or radio advertising behind that number. The founder describes no sales function at all, and that absence is itself a finding (F5)."
    question: "How do the forty customers a month find you — and what does that cost you each month in commissions to agents, radio adverts, or days spent at markets?"
    range: {low: 0, high: 400000}
    materiality: high
  seasonality_amplitude:
    value: 0
    unit: peak-to-trough spread as a fraction of average monthly installs
    prov: ELICITED
    source: "base case flat, the omitting choice, and the choice I am least comfortable with. In a Sahelian rural market both sides of this business move with the agricultural calendar: cash is scarcest in the soudure before the harvest and most abundant after it, and village tracks in the Plateau-Central are hardest in the rains. A flat twelve months is the founder's average, not his year."
    question: "Across a year, are there months where you install many more or many fewer than forty — and are there months where more people fall behind on the five thousand?"
    range: {low: 0.0, high: 0.5}
    materiality: high

  # ---------- ASSUMED ----------
  moto_life_months:
    value: 48
    unit: months
    prov: ASSUMED
    source: "no party to this business holds this number and I could not verify the Burkinabè CGI depreciation tariff for matériel de transport in the consolidated text available to me, so it is an assumption and is flagged as one. Four years straight-line is the ordinary convention for a light utility motorcycle and it is corroborated from below by the distance test: at the fuel budget implied above, 48 months of this duty cycle is 67,765 km per machine, comfortably inside moto_life_km. Straight-line with zero residual is DEFAULTED (IAS 16.62, straight-line where the consumption pattern cannot be reliably determined otherwise)."
    date: "2026-07-27"
  moto_life_km:
    value: 80000
    unit: km per motorcycle
    prov: ASSUMED
    source: "economic life of a small utility motorcycle in daily service on Sahelian laterite roads. Used only as the ceiling in the cumulative-distance test required by physical closure rule (d); it is not in the FCFF arithmetic."
    date: "2026-07-27"
  moto_fuel_consumption_l_per_100km:
    value: 2.5
    unit: litres per 100 km
    prov: ASSUMED
    source: "typical consumption of a 110-125cc utility motorcycle carrying a passenger or a load. Used with the SOURCED pump price to turn the stated fuel budget into kilometres for physical closure rules (c) and (d)."
    date: "2026-07-27"

passage: |
  ── 1. WHAT IS BEING SOLD, AND WHAT THE PRICE ACTUALLY IS

  The founder states two different prices for the same object. 140,000 is what the kit costs if you
  could pay for it at once — that is the plain reading of «les gens ne peuvent pas payer les cent
  quarante mille d'un coup». 20,000 down plus 5,000 a week for 36 weeks is what you pay if you cannot.
  That schedule sums to 20,000 + 36 × 5,000 = 200,000. The founder says it comes to 198,000. It does
  not; the arithmetic of his own three numbers gives 200,000. I model 200,000 and record 198,000 as a
  belief (finding F1). The 2,000 gap is immaterial to FCFF but it matters to trust in the other
  numbers, and it is the first thing to put back to him.

  The 60,000 difference between 200,000 and 140,000 is not goods revenue. Under IFRS 15.60 a contract
  containing a significant financing component is split: revenue at the cash-equivalent selling price
  when control passes, and interest over the financing period. So each installation recognises 140,000
  of goods revenue on the day, of which 20,000 arrives as cash and 120,000 becomes a receivable, and
  the remaining 60,000 is earned as financing income across the 36 weeks.

  The implicit rate follows from the founder's own cash flows and nothing else. 120,000 discounted at
  a weekly rate i must equal 36 payments of 5,000, so the annuity factor is exactly 120,000/5,000 = 24.
  Solving, i = 2.3799920808164% per week. Compounded over a 52.1786-week year that is an effective
  241.20% a year. That is not a criticism — it is what the founder's own numbers say, it is normal for
  PAYGo, and the reason it is bearable is that the tenor is eight months, not eight years. But it means
  roughly 28% of the revenue of this business is interest, not solar equipment, and it should be
  presented that way.

  ── 2. PUTTING A 36-WEEK CONTRACT ON A MONTHLY GRID

  A month is 365.25/7/12 = 4.348214285714286 weeks, so 36 weeks is 8.2837 months. Contract months 1
  to 8 each collect 5,000 × 4.348214285714286 = 21,741.0714285714. Contract month 9 collects only the
  remaining 36 − 34.7857142857 = 1.2142857143 weeks, i.e. 6,071.4285714286. Those ten figures sum to
  180,000 exactly. Installation is placed at the end of its month and the first instalment in the
  following month, which is the convention that delays cash rather than accelerating it.

  The receivable balance after n weeks is B(n) = 120,000(1+i)^n − 5,000((1+i)^n − 1)/i, evaluated at
  fractional n. Month by month: 120,000.00 at installation, then 110,298.97, 99,553.25, 87,650.34,
  74,465.64, 59,861.11, 43,683.85, 25,764.49, 5,915.43, and 0.00 at 36 weeks. The interest earned in
  each month is the residual that makes the roll-forward close — balance minus prior balance plus the
  payment received — and those nine residuals sum to 59,999.9999999999, i.e. the 60,000 charge. The
  schedule closes to the franc by construction.

  ── 3. WHO STOPS PAYING, WHEN, AND WHAT COMES BACK

  15 in 100 stop; most around month six or seven. I split them evenly: 7.5% stop at the end of
  contract month 6 with 43,683.8452941286 still outstanding, 7.5% at the end of month 7 with
  25,764.4850180054 outstanding. Per kit installed, the credit loss is therefore 0.075 × 43,683.85 +
  0.075 × 25,764.49 = 5,208.62. Note what that number says: because the defaults land two-thirds of
  the way through an eight-month contract, the customer has already paid 150,446 of a 200,000 contract
  before he stops. The 15% default rate destroys only about 4.3% of the financed amount.

  Weighting the instalment schedule by survivors (all paying through month 6, 92.5% in month 7, 85% in
  months 8 and 9) gives 174,197.5446428572 of instalment cash and 59,406.1694162672 of financing
  income per kit installed, against 120,000 of receivable created and 5,208.6247734100 written off.
  Those four close exactly: 120,000 + 59,406.17 − 174,197.54 − 5,208.62 = 0.00.

  Now the physical side, which is where a ratio would have hidden the truth. The founder gives a
  yield-like statement — «je récupère le panneau et la batterie» — and it is not a balance. A kit is
  six things: one panel, one battery, three lamps, one radio-and-charger assembly. Six kits a month
  come back. Component by component, and every component summing:

    panels        6 in the recovered kits = 6 recovered + 0 lost;   6 refitted = 6 recovered + 0 bought
    batteries     6 in                    = 3 serviceable + 3 scrapped; 6 refitted = 3 recovered + 3 bought
    lamps        18 in                    = 0 recovered + 18 lost;  18 refitted = 0 recovered + 18 bought
    radio/charger 6 in                    = 6 recovered + 0 lost;    6 refitted = 6 recovered + 0 bought

  This is where the founder's own costing fails. He prices refurbishment as «remplacer la batterie une
  fois sur deux» and no more. But he has also told us the lamps are gone, and a kit cannot be resold at
  90,000 without three lamps in it. His refurbishment cost is missing 18 lamps a month. At the elicited
  5,500 a lamp that is 99,000 a month he does not think he is spending. Total refurbishment parts are
  therefore 3 × 25,000 + 18 × 5,500 = 75,000 + 99,000 = 174,000 a month, of which he has accounted for
  75,000. (Finding F2.)

  The repossessed kit itself carries no book cost: the 82,000 went to cost of sales when the kit was
  originally sold. So the 540,000 of monthly resale revenue meets only 174,000 of parts, plus the
  48,000 of recovery trips (6 × 8,000, charged on defaults whether or not the kit comes home). The
  recovery loop contributes 318,000 a month.

  ── 4. DOES THE OPERATION FIT INSIDE THE PLANT?

  A six-day week gives 365.25/12 × 6/7 = 26.0892857142857 working days a month. Fifteen statutory
  holidays a year remove 1.25 of them.

  Technicians: statutory leave is 2.5 calendar days per month of service, 2.1428571428571 working days,
  and 4% of what remains goes to illness and family. Each technician is available 21.7885714285714 days;
  three of them, 65.3657142857143 technician-days a month. At the founder's own realised rate of one
  installation per technician-day that is 65.37 jobs a month of labour capacity.

  Motorcycles: two machines, 24.8392857142857 nominal days each after holidays, less 1.5 days off the
  road, gives 46.6785714285714 motorcycle trip-days a month.

  Demand for trips: 40 new installations plus 6 refurbished-kit installations. Recovery trips are
  excluded because the utterance prices them as a bought-in service. That is 46 trips against 46.68
  trip-days — 98.5% utilisation and 0.68 spare trip-days across the whole fleet in a month. Labour has
  30% slack; the fleet has none. The binding constraint on this business is two motorcycles, and the
  third technician exists to cover absence, not to add throughput. This is a finding, not a rounding
  (F3): the same volume with recovery trips run in-house needs 52 trips and does not fit, and neither
  does it fit if a machine is off the road more than about a day and a half a month.

  Distance, which is the test the founder's numbers were never asked to pass. At the elicited 60% fuel
  share, 60,000 a month buys 60,000/850 = 70.5882352941 litres. At 2.5 litres per 100 km that is
  2,823.5294117647 fleet kilometres a month, 1,411.7647058824 per machine. Spread over 46 trips that is
  61.4 km per job — about 31 km each way. That is consistent with a business working Ouagadougou and the
  near Plateau-Central; it is not consistent with regular work in the far communes of the province, which
  are 80 to 110 km out. The fuel budget and the geography have to be reconciled, and the fuel budget is
  the harder of the two to argue with (F4).

  Cumulatively, over the twelve months, the fleet covers 33,882.3529411765 km. Over the full 48-month
  depreciation life a machine covers 67,764.7 km, inside the 80,000 km I take as its economic life. The
  claimed operation is deliverable by the assets described.

  Space: 80 kits in the store. A boxed kit of this kind is roughly 0.6 × 0.4 × 0.4 m; 80 of them stacked
  three high occupy about 6.4 m² of floor. Any premises renting at 200,000 a month in Ouagadougou is an
  order of magnitude larger than that. The store is not a constraint and no question is spent on it.

  ── 5. STOCKS AND WHAT THEY LOSE

  Two stocks are held and both must declare a loss rate.

  Kits: 2 months × 40 = 80 units, 6,560,000 at cost. The loss rate is 0.25% a month applied to the
  OPENING 80 units, not to purchases and not to a flat charge — 0.2 kits, 16,400 a month. Because this
  store is in steady state at 80 units, the base is constant and a flat charge and a base-weighted
  charge coincide here; that would not be true of a draining store and the model states the base
  explicitly for that reason. Lead-acid self-discharge and sulfation over a two-month first-in-first-out
  rotation is inside this rate, not additional to it. Purchases are therefore 40 + 0.2 = 40.2 kits a
  month, 3,296,400.

  Receivables: 24,974,936.658723752 outstanding, being 40 monthly installs times the 624,373.4164680938
  of book each month of installs sustains. Its loss is the write-off stream, 208,344.9909364019 a month,
  0.83% of the book per month.

  Supplier advances: half of every order is paid six weeks before the goods arrive. Six weeks is
  1.3798882681564 months of purchases, so 55.4710472279 kits are permanently in transit half-paid:
  2,274,312.9363449696 lent to the importer at all times. There is no trade payable at all — the balance
  is due on delivery. This business finances its supplier and finances its customers, and is financed by
  nobody. That is the single most important structural fact about its working capital.

  Net working capital is 6,560,000 + 24,974,936.658723752 + 2,274,312.9363449696 − 0 =
  33,809,249.595068722. In a stationary business it does not move, so the change in net working capital
  is zero in every period — but the LEVEL is 33.8m, which is 11.3 months of FCFF tied up. Anyone reading
  the free cash flow below without reading that number will misjudge this business badly.

  ── 6. THE MONTHLY INCOME STATEMENT

  Revenue: 40 × 140,000 = 5,600,000 of goods; 40 × 59,406.1694162672 = 2,376,246.7766506877 of
  financing income; 6 × 90,000 = 540,000 of refurbished resales. Total 8,516,246.7766506877.

  Cost of sales on new kits: 40 × 82,000 = 3,280,000. Note this is kits INSTALLED, not kits purchased;
  the 0.2 kits of shrinkage is a separate expense so that the physical roll-forward and the income
  statement do not double-count.

  Operating costs: refurbishment parts 174,000; recovery trips 48,000; shrinkage 16,400; credit losses
  208,344.9909364019; gross wages 300,000; CNSS employer contributions at 16% = 48,000 (the 800,000
  ceiling is nowhere near binding at a 100,000 wage, and 100,000 is comfortably above the 45,000 SMIG);
  TPA at 3% = 9,000; fuel and maintenance 100,000; rent 200,000; patente 32,666.6666666667 a month,
  being 8% of a 2,400,000 valeur locative proxied by the annual rent plus an elicited 200,000 droit
  fixe, over twelve. SIM and platform, collection commissions, in-contract service and marketing all
  enter at zero and all four are questions, not facts. Operating costs total 1,136,411.6576030685.

  EBITDA = 8,516,246.7766506877 − 3,280,000 − 1,136,411.6576030685 = 4,099,835.1190476194.
  Depreciation: two motorcycles at 800,000 over 48 months = 33,333.3333333333 a month.
  EBIT = 4,066,501.7857142859 a month, 48,798,021.4285714 a year.

  ── 7. TAX

  Regime first, because it is a fact about the world and the founder never mentions it. Goods and
  resale turnover alone is 12 × 6,140,000 = 73,680,000, above the 50,000,000 threshold, so this is the
  réel normal d'imposition — not the RSI he may believe he is in, and not the CME. He speaks as an
  individual throughout, so the tax is IBICA on the progressive schedule, not the flat 27.5% IS.

  IBICA on 48,798,021.4285714: 10% of the first 500,000 = 50,000; 20% of the next 500,000 = 100,000;
  27.5% of the remaining 47,798,021.4285714 = 13,144,455.8928571. Total 13,294,455.8928571, an
  effective rate of 27.24%. No CGA membership is assumed, so no 30% abatement.

  The minimum forfaitaire de perception is 0.5% of turnover with a 1,000,000 floor for RNI taxpayers:
  0.5% × 73,680,000 = 368,400, so the floor governs at 1,000,000. IBICA far exceeds it and the minimum
  does not bite. Tax is 13,294,455.8928571 a year, 1,107,871.3244047619 a month.

  Because the profile is flat, allocating the annual charge evenly across the twelve months is exact
  rather than approximate.

  NOPAT = 4,066,501.7857142859 − 1,107,871.3244047619 = 2,958,630.4613095238 a month.

  ── 8. FREE CASH FLOW TO THE FIRM

  FCFF = NOPAT + D&A − ΔNWC − capex
       = 2,958,630.4613095238 + 33,333.3333333333 − 0 − 0
       = 2,991,963.7946428572 a month, 35,903,565.5357142857 a year.

  Capex is zero because the only durable assets are the two motorcycles, they are already owned, and on
  the elicited fleet age their replacement falls in period 36, outside this horizon. ΔNWC is zero because
  the business is stationary; the 33.8m is already invested, not being invested.

  The build is checked against a completely independent direct cash construction. Cash in: 800,000 of
  deposits + 6,967,901.7857142864 of instalments + 540,000 of resales = 8,307,901.7857142864. Cash out:
  3,296,400 of kit purchases (half paid six weeks early, half on delivery, which in a stationary business
  is exactly one month of purchases) + 174,000 parts + 48,000 recovery + 357,000 payroll and charges +
  100,000 fuel + 200,000 rent + 32,666.6666666667 patente + 1,107,871.3244047619 tax =
  5,315,937.9910714286. Difference: 2,991,963.7946428572. The indirect and direct builds agree to the
  centime, which is the strongest single assurance in this document.

  ── 9. WHAT THE NUMBER IS AND IS NOT

  35.9m XOF a year of unlevered free cash flow, on 102.2m of revenue, from a stationary operation with
  three employees and two motorcycles. Read that number with three things beside it. First, 33.8m of
  working capital is standing behind it permanently, so the cash-on-cash picture depends entirely on how
  that 33.8m was funded — a question this unlevered view deliberately does not answer. Second, four cost
  lines that certainly exist in a PAYGo operation enter this model at zero because the founder did not
  mention them: SIM airtime and platform, collection commissions on roughly 1,394 payments a month,
  in-contract service on 351 live kits, and any customer acquisition cost at all. Third, the founder
  draws no salary in this model, because for an entreprise individuelle his drawings are a distribution
  and not a deductible cost — but the operating work he does is real, and if he had to hire the person
  doing it the cost base would rise. This is an upper bound presented as a base case, and the questions
  in `inputs` are ranked so that a reader who can ask only three knows which three.


    unit: USD_per_kWh
    prov: STATED
    source: "'9.56 US cents per kilowatt-hour'"
    date: 2026-07-25
  capex_usd_m:
    value: 510
    unit: USD_million
    prov: STATED
    source: "'Construction cost 510 million US dollars'"
    date: 2026-07-25
  book_life_yrs:
    value: 20
    unit: years
    prov: STATED
    source: "'we depreciate the plant straight-line over the 20-year PPA life'"
    date: 2026-07-25
  ppa_yrs:
    value: 20
    unit: years
    prov: STATED
    source: "'20-year USD-denominated PPA'"
    date: 2026-07-25
  wda_rate:
    value: 0.125
    unit: fraction_reducing_balance
    prov: STATED
    source: "'wear-and-tear allowances at 12.5 percent on a reducing-balance basis'"
    date: 2026-07-25
  opcost_pct:
    value: 0.01
    unit: fraction_of_capex_per_year
    prov: STATED
    source: "'Operating cost is 1 percent of capex a year'"
    date: 2026-07-25
  tax_rate:
    value: 0.30
    unit: fraction
    prov: STATED
    source: "'Corporate tax is 30 percent'"
    date: 2026-07-25
  salvage_pct:
    value: 0.10
    unit: fraction_of_original_cost
    prov: STATED
    source: "'a salvage of 10 percent of the original cost'"
    date: 2026-07-25
  op_start:
    value: 1
    unit: period_index_0based
    prov: DEFAULTED
    source: "Greenfield IPP convention: full capex incurred in construction year t=0 (no operation), commercial operation and all revenue/opex/allowances run t=1..20. 0-based index of first operating period."
    date: 2026-07-25
  disposal_t:
    value: 20
    unit: period_index_0based
    prov: INFERRED
    source: "'At year 20 the PPA ends' -> disposal in the last operating period; with t=0 = construction, operating year 20 is array position t=20 = grid.periods-1."
    date: 2026-07-25
  delta_nwc_all:
    value: 0
    unit: USD_million
    prov: ASSUMED
    source: "No receivable/payable terms stated. PPA offtake (Kenya Power) and 1%-of-capex O&M assumed settled within the period; net working-capital change treated as immaterial. ELICITED question: what are Kenya Power's payment terms / receivable days on the USD PPA, and are there O&M payables? A material DSO would shift cash within the horizon but not lifetime FCFF."
    date: 2026-07-25
  loss_cf_regime:
    value: indefinite
    unit: regime
    prov: ASSUMED
    source: "Tax losses from the allowance-heavy early years assumed carried forward and fully usable (neutral prior). Under FIFO the year-1 loss is absorbed within 9 subsequent years (by year 10) and the pool is exhausted in year 12, so a limited carryforward window would only just bind on the earliest loss - flagged qualitatively in notes."
    date: 2026-07-25

passage: |
  UNITS: money in USD millions unless stated; energy in MWh; tariff in USD/kWh. Grid = 21 annual periods,
  t=0 (construction) then t=1..20 (operation, 20-year PPA). Salvage/disposal at t=20.

  STAGE 0 - CAPEX AND TIMELINE
  Full construction cost is incurred at t=0: capex[0] = 510. No revenue, opex, depreciation or allowance in t=0.
  Operations, straight-line book depreciation and wear-and-tear allowances all begin in the first operating
  year t=1 (asset brought into use).

  STAGE 1 - REVENUE (IFRS 15, energy delivered x tariff)
  Annual energy = 410,000 MWh (stated; matches 234 MW * 8,760 h * 0.20 = 409,968 MWh to within 0.01%).
  Revenue = 410,000 MWh * 1,000 kWh/MWh * 0.0956 USD/kWh = 39,196,000 USD = 39.196 per year (t=1..20).
  The PPA is a flat USD tariff with no escalation stated; revenue is constant.

  STAGE 2 - OPERATING COST (cost matching)
  Opcost = 1% * 510 = 5.100 per year (t=1..20), flat (no escalation stated).

  STAGE 3 - BOOK DEPRECIATION (accounting ladder; does NOT drive cash tax)
  Straight-line over 20 years: book_dep = 510 / 20 = 25.500 per year (t=1..20).
  The operator states straight-line over the PPA life with no residual carved out of the book charge, so the
  book base runs to zero: NBV rolls 510 -> 0 over t=1..20 (book_nbv_close[t] = 510 - 25.5*t). At t=20 book NBV
  is 0; the salvage sale would post a book gain, but book gain is not used anywhere in the unlevered cash build
  (cash tax uses the tax base; proceeds enter FCFF as cash), so there is no double count.

  STAGE 4 - BOOK EBIT (kept in the accounting ladder)
  EBIT = Revenue - Opcost - Book depreciation = 39.196 - 5.100 - 25.500 = 8.596 per year (t=1..20).

  STAGE 5 - TAX WRITTEN-DOWN VALUE, 12.5% REDUCING BALANCE (drives cash tax)
  Tax base opens at 510. Each operating year: allowance = 0.125 * opening TWDV; closing = opening - allowance
  (closing = opening * 0.875). The balance never reaches zero.
    t : opening        allowance       closing
    1 : 510.000000000  63.750000000  446.250000000
    2 : 446.250000000  55.781250000  390.468750000
    3 : 390.468750000  48.808593750  341.660156250
    4 : 341.660156250  42.707519531  298.952636719
    5 : 298.952636719  37.369079590  261.583557129
    6 : 261.583557129  32.697944641  228.885612488
    7 : 228.885612488  28.610701561  200.274910927
    8 : 200.274910927  25.034363866  175.240547061
    9 : 175.240547061  21.905068383  153.335478678
   10 : 153.335478678  19.166934835  134.168543844
   11 : 134.168543844  16.771067980  117.397475863
   12 : 117.397475863  14.674684483  102.722791380
   13 : 102.722791380  12.840348923   89.882442458
   14 :  89.882442458  11.235305307   78.647137150
   15 :  78.647137150   9.830892144   68.816245007
   16 :  68.816245007   8.602030626   60.214214381
   17 :  60.214214381   7.526776798   52.687437583
   18 :  52.687437583   6.585929698   46.101507885
   19 :  46.101507885   5.762688486   40.338819400
   20 :  40.338819400   5.042352425   35.296466975
  Total allowances t=1..20 = 510 - 35.296466975 = 474.703533025 (= cost - closing TWDV).

  STAGE 6 - DISPOSAL / BALANCING ADJUSTMENT at t=20
  Salvage proceeds = 10% * 510 = 51.000. TWDV at disposal (after the year-20 allowance) = 35.296466975.
  Proceeds (51.000) > TWDV (35.296466975) -> BALANCING CHARGE (taxable) = 51.000 - 35.296466975 = 15.703533025,
  added to year-20 taxable income. (Proceeds are far below original cost, so this is an ordinary balancing charge,
  not a capital gain.) Note the timing convention is immaterial: had the year-20 allowance (5.042352425) been
  skipped in the disposal year, the balancing charge would rise by exactly the same 5.042352425 to 10.661180600
  on a TWDV of 40.338819400 - year-20 taxable income, and every period's cash tax, is identical either way.

  STAGE 7 - TAXABLE INCOME, LOSS CARRYFORWARD, CASH TAX
  Pre-allowance operating margin for tax = Revenue - Opcost = 39.196 - 5.100 = 34.096 per year.
  Raw taxable = 34.096 - allowance (+ 15.703533025 balancing charge in t=20).
  Early years the allowance exceeds 34.096, so t=1..5 generate tax losses that pool and carry forward:
    pool end t1..t5 = 29.654, 51.339250, 66.051844, 74.663363, 77.936443.
  From t=6 positive taxable income is absorbed by the pool (zero cash tax) until the pool is exhausted:
    pool end t6..t11 = 76.538388, 71.053089, 61.991453, 49.800521, 34.871456, 17.546524; pool = 0 from t12.
  First cash tax is in t=12 on the un-absorbed remainder 19.421316 - 17.546524 = 1.874791 -> tax 0.562437.
  t=13..20 are fully taxable (pool empty). Cash tax = 30% * taxable-after-offset.
  Lifetime tie: total taxable = 20*34.096 - 474.703533025 + 15.703533025 = 681.920 - 459.000 = 222.920;
  total cash tax = 66.876 (= 30% * 222.920). The net lifetime tax deduction equals cost - proceeds = 459.000.

  STAGE 8 - NOPAT (EBIT minus CASH tax) AND UNLEVERED FCFF
  NOPAT = EBIT - cash tax. FCFF = NOPAT + D&A(book) - dNWC - net capex, with dNWC = 0 and
  net capex = capex - disposal proceeds (disposal proceeds treated as an asset-side inflow / negative capex).
  Because the book D&A add-back cancels the book depreciation inside EBIT, operating FCFF collapses to
  FCFF[t] = (Revenue - Opcost) - cash tax - dNWC - net capex = 34.096 - cash tax (+51.000 disposal at t=20).
  t=1..11: FCFF = 34.096 (no cash tax). t=12..19: FCFF = 34.096 - cash tax. t=20: 34.096 - 13.427154180
  + 51.000 = 71.668845820. t=0: FCFF = -510.
  Lifetime FCFF = -510 + 20*34.096 - 66.876 + 51.000 = -510 + 681.920 - 66.876 + 51.000 = 156.044.


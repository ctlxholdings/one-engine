checks:
  - revenue[t] == energy_mwh[t] * tariff_usd_per_kwh / 1000
  - opcost[t] == opcost_pct * capex_usd_m for t >= op_start
  - opcost[t] == 0 for t < op_start
  - book_dep[t] == capex_usd_m / book_life_yrs for t >= op_start
  - book_nbv_close[first] == capex_usd_m
  - book_nbv_open[t] == book_nbv_close[t-1] for t >= op_start
  - book_nbv_close[t] == book_nbv_open[t] - book_dep[t] for t >= op_start
  - book_nbv_close[last] == 0
  - ebit[t] == revenue[t] - opcost[t] - book_dep[t]
  - twdv_close[first] == capex_usd_m
  - twdv_open[t] == twdv_close[t-1] for t >= op_start
  - capital_allowance[t] == wda_rate * twdv_open[t] for t >= op_start
  - twdv_close[t] == twdv_open[t] - capital_allowance[t] for t >= op_start
  - twdv_close[t] > 0
  - sum(capital_allowance) == capex_usd_m - twdv_close[last]
  - balancing_charge[t] == 0 for t < disposal_t
  - balancing_charge[last] == disposal_proceeds[last] - twdv_close[last]
  - disposal_proceeds[last] > twdv_close[last]
  - disposal_proceeds[last] == salvage_pct * capex_usd_m
  - taxable_raw[t] == revenue[t] - opcost[t] - capital_allowance[t] + balancing_charge[t]
  - loss_pool_close[t] == max(loss_pool_close[t-1] - taxable_raw[t], 0)
  - loss_pool_close[t] >= 0
  - taxable_after_offset[t] == max(taxable_raw[t] - loss_pool_close[t-1], 0)
  - taxable_after_offset[t] >= 0
  - cash_tax[t] == tax_rate * taxable_after_offset[t]
  - cash_tax[t] >= 0
  - sum(cash_tax) == tax_rate * (sum(revenue) - sum(opcost) - (capex_usd_m - twdv_close[last]) + balancing_charge[last])
  - nopat[t] == ebit[t] - cash_tax[t]
  - dna[t] == book_dep[t]
  - net_capex[t] == capex[t] - disposal_proceeds[t]
  - capex[first] == capex_usd_m
  - capex[t] == 0 for t >= op_start
  - fcff[t] == nopat[t] + dna[t] - delta_nwc[t] - net_capex[t]
  - fcff[t] == revenue[t] - opcost[t] - cash_tax[t] - delta_nwc[t] - net_capex[t] for t >= op_start
  - fcff[first] == -capex_usd_m
  - sum(fcff) == sum(revenue) - sum(opcost) - sum(cash_tax) + disposal_proceeds[last] - capex[first]

notes:
  - "Horizon: 21 periods, t=0 construction (capex 510) then t=1..20 operation over the 20-year PPA. Money in USD millions."
  - "Currency is USD because the PPA is explicitly USD-denominated; no FX exposure on revenue is modelled."
  - "Cash tax is built on the TAX base (taxable income after 12.5% reducing-balance capital allowances), not on book depreciation, per instruction. Book straight-line depreciation (25.5/yr) is retained only in the accounting ladder (EBIT and the NBV roll-forward) and is added back as D&A in the FCFF build, so it nets out of unlevered cash flow."
  - "Front-loaded capital allowances exceed the operating margin (34.096) in years 1-5, creating tax losses that pool to 77.936443 by end-year 5. Assuming carryforward is available, the pool absorbs profits through year 11 and is exhausted mid-year 12; first cash tax (0.562437) falls in year 12. Lifetime cash tax = 66.876 = 30% of lifetime taxable income 222.920, and the net lifetime tax deduction equals cost minus proceeds (459.000) - both hard ties."
  - "Loss-carryforward regime is the main judgment call. Base case assumes indefinite carryforward. Under FIFO the earliest (year-1) loss of 29.654 is fully absorbed only during year 10 - nine years after it arose - and the pool clears in year 12. CURRENT-LAW CORRECTION 2026-07-25 (physical audit): Kenya's loss carryforward was indefinite only from 1 Jan 2022 to 30 Jun 2025. The Finance Act 2025 reinstated a FIVE-YEAR cap (extendable on application to the Cabinet Secretary), effective 1 Jul 2025 — i.e. before this gold's date. The trace faithfully models the operator's stated 'carried forward until absorbed' premise, so the numbers stand as an indefinite-carryforward oracle, but that premise is NOT current law. Under a 5-year cap much of the front-loaded relief is forfeited and cash tax starts far earlier (materially lower FCFF). The loss-expiry mechanism is a SPAWN sibling, not an edit here. This is a discrete regime question, not a smooth sensitivity, so it is left qualitative here rather than materialised as a scenario column."
  - "Disposal timing convention is immaterial to every period's tax. Claiming the year-20 wear-and-tear allowance (TWDV -> 35.296467, balancing charge 15.703533) versus skipping it in the disposal year (TWDV 40.338819, balancing charge 10.661181) leaves year-20 taxable income - and thus cash tax - identical, because the forgone allowance exactly equals the increase in the balancing charge. The literal reading of the utterance (value 'falls by 12.5% each year' across the life, then 'difference between sale proceeds and the tax written-down value') is used: 20 annual allowances, then a balancing charge on the 35.296467 residual."
  - "Book depreciation uses the full 510 base to zero, matching the operator's 'straight-line over the 20-year PPA life' with no residual carved out. At year 20 book NBV is 0 while proceeds are 51, i.e. a book gain of 51; this book gain never enters the cash build (cash tax is on the tax base; the 51 enters FCFF as a cash inflow), so there is no double count. An IAS 16 residual-aware book charge would lower annual book depreciation but is irrelevant to FCFF."
  - "Working capital: no receivable/payable terms were given, so dNWC = 0 throughout (ASSUMED immaterial). ELICITED: Kenya Power's USD-PPA payment lag and any O&M payables. A material receivable balance would shift cash between periods (a one-off build in year 1 and release at year 20) without changing lifetime FCFF."
  - "Revenue holds the stated 410,000 MWh/yr, which reconciles to 234 MW * 8,760 h * 0.20 = 409,968 MWh (0.008% lower); the ~32 MWh gap is rounding in the operator's figure and is left as-is rather than forced. No tariff escalation, no O&M escalation, and no degradation of output were stated, so all three are held flat - each would, if present, lower later-year FCFF."
  - "Lifetime unlevered FCFF (undiscounted) = 156.044. This is an asset-side FCFF only; no discount rate, financing, debt service, or DSCR is computed, per the unlevered mandate."
  - "Six checks form the conservation backbone: the reducing-balance TWDV roll-forward, the loss-pool roll-forward (max-based), the two lifetime ties (sum of allowances = cost - closing TWDV; sum of cash tax = 30% of lifetime taxable), the balancing-charge definition at disposal, and the FCFF identity restated two ways (build-up and the D&A-cancelled operating bridge)."
  - "PROVENANCE CORRECTION 2026-07-26 (canonicalization, metadata only — no number changed). All four arise golds were generated blind and independently, and each emitted the same id `arise-kenya-solar-fcff`, a 4-way primary-key collision that only became visible when the siblings were promoted into one library. Ids disambiguated to arise-kenya-solar-fcff-wt; filenames, titles, inputs, passage, trace, fcff and checks are untouched."

id: arise-kenya-solar-fcff-wt
title: "Arise Kenya - 234 MW AC Rift Valley solar portfolio: unlevered FCFF over the 20-year PPA life"
currency: USD
grid:
  periods: 21
  freq: annual
utterance:
  fr: ""
  en: |
    We are Arise Kenya - six grid-connected solar plants totalling 234 megawatts AC in the Rift Valley.
    We have a 20-year USD-denominated PPA with Kenya Power at 9.56 US cents per kilowatt-hour; the plants
    run at a 20 percent capacity factor, about 410,000 megawatt-hours a year. Construction cost 510 million
    US dollars. In our financial accounts we depreciate the plant straight-line over the 20-year PPA life.
    For tax we claim wear-and-tear allowances at 12.5 percent on a reducing-balance basis - the tax written-down
    value falls by 12.5 percent of the remaining balance each year and never quite reaches zero. Operating cost
    is 1 percent of capex a year. Corporate tax is 30 percent. At year 20 the PPA ends; we expect a salvage of
    10 percent of the original cost, and the difference between the sale proceeds and the tax written-down value
    is settled as a balancing charge or allowance.

inputs:
  capacity_mw:
    value: 234
    unit: MW_AC
    prov: STATED
    source: "'six grid-connected solar plants totalling 234 megawatts AC'"
    date: 2026-07-25
  capacity_factor:
    value: 0.20
    unit: fraction
    prov: STATED
    source: "'the plants run at a 20 percent capacity factor'"
    date: 2026-07-25
  energy_mwh:
    value: 410000
    unit: MWh_per_year
    prov: STATED
    source: "'about 410,000 megawatt-hours a year'; cross-checks to 234*8760*0.20 = 409,968 MWh (0.008% below), so the stated figure is used"
    date: 2026-07-25
  tariff_usd_per_kwh:

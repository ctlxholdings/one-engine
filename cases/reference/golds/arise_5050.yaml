id: arise-kenya-solar-fcff-5050
title: "Arise Kenya — six-plant 234 MW solar PPA: unlevered FCFF via NOPAT (book vs tax depreciation, loss carryforward, terminal salvage)"
currency: USD
grid:
  periods: 21
  freq: annual   # t=0 construction (capex year); t=1..20 = the twenty operating years of the 20-year PPA; disposal at end of t=20

utterance:
  fr: ""
  en: |
    We are Arise Kenya — six grid-connected solar plants totalling 234 megawatts AC in the Rift Valley.
    We have a 20-year USD-denominated PPA with Kenya Power at 9.56 US cents per kilowatt-hour; the plants
    run at a 20 percent capacity factor, about 410,000 megawatt-hours a year. Construction cost 510 million
    US dollars. In our financial accounts we depreciate the plant straight-line over the 20-year PPA life.
    For tax we deduct 50 percent of the plant cost in the first year of operation, and the remaining 50 percent
    straight-line over the rest of the 20-year life. Operating cost is 1 percent of capex a year. Corporate tax
    is 30 percent. At year 20 the PPA ends and we expect a salvage of 10 percent of the original cost.


passage: |
  ============================================================================
  HAND DERIVATION — Arise Kenya, unlevered (asset-side) FCFF = NOPAT + D&A - dNWC - capex
  ============================================================================
  Horizon choice: 1 construction year (t=0) + 20 operating years (t=1..20) matching the
  20-year PPA. Capex is spent at t=0; the plant earns t=1..20; salvage lands end of t=20.
  All flows nominal USD (USD-denominated PPA, so no FX layer).

  ---------------------------------------------------------------------------
  STEP 1 — Revenue (operating quantity: MWh delivered under the PPA)
  ---------------------------------------------------------------------------
  Energy: operator's stated 410,000 MWh/yr is the driver.
    Cross-check: 234 MW x 8,760 h x 0.20 = 409,968 MWh (0.008% off; use 410,000).
  Price: 9.56 US cents/kWh = 0.0956 USD/kWh, fixed for 20 years (no escalation stated).
  Revenue/yr = 410,000 MWh x 1,000 kWh/MWh x 0.0956 USD/kWh
             = 410,000,000 kWh x 0.0956 = 39,196,000 USD  (t=1..20; 0 at t=0).

  ---------------------------------------------------------------------------
  STEP 2 — Operating cost
  ---------------------------------------------------------------------------
  Opex = 1% x capex = 0.01 x 510,000,000 = 5,100,000 USD/yr (t=1..20; 0 at t=0).

  ---------------------------------------------------------------------------
  STEP 3 — BOOK depreciation (accounting ladder; drives EBIT, NOT cash tax)
  ---------------------------------------------------------------------------
  Straight-line over 20-yr PPA life: 510,000,000 / 20 = 25,500,000 USD/yr (t=1..20).
  Book NBV roll-forward: capitalise 510,000,000 at t=0, then subtract 25.5m/yr.
    NBV(0)=510,000,000; NBV(t)=NBV(t-1)-25,500,000; NBV(20)=0. Sum of book dep = 510,000,000.

  ---------------------------------------------------------------------------
  STEP 4 — TAX capital allowances (drives CASH tax) and tax-WDV roll-forward
  ---------------------------------------------------------------------------
  Year 1 (t=1): 50% x 510,000,000 = 255,000,000.
  Years 2..20 (t=2..20): remaining 50% = 255,000,000 straight-line over the "rest" = 19 years
    => 255,000,000 / 19 = 13,421,052.631578947 USD/yr.
  Check: 255,000,000 + 19 x 13,421,052.631578947 = 510,000,000. Fully relieved by t=20.
  Tax-WDV roll-forward: TWDV(0)=510,000,000; TWDV(1)=255,000,000;
    TWDV(t)=255,000,000 x (20 - t)/19 for t=1..20; TWDV(20)=0.

  ---------------------------------------------------------------------------
  STEP 5 — EBIT (book, operating only; disposal gain kept out — see Step 8)
  ---------------------------------------------------------------------------
  EBIT(t) = Revenue - Opex - Book dep = 39,196,000 - 5,100,000 - 25,500,000
          = 8,596,000 USD/yr (t=1..20); EBIT(0)=0.

  ---------------------------------------------------------------------------
  STEP 6 — Taxable income on the TAX base, with loss carryforward
  ---------------------------------------------------------------------------
  Pre-loss taxable income = Revenue - Opex - Capital allowance (+ balancing charge at t=20).
    t=1 : 39,196,000 - 5,100,000 - 255,000,000 = -220,904,000  -> TAX LOSS of 220,904,000.
    t=2..19: 39,196,000 - 5,100,000 - 13,421,052.631578947 = 20,674,947.368421053.
    t=20: 20,674,947.368421053 + 51,000,000 (balancing charge, Step 8) = 71,674,947.368421053.
  Loss carryforward (created in t=1, then absorbed against later positive years):
    Balance after t=1 = 220,904,000. Each of t=2..11 absorbs 20,674,947.368421053
    (10 years -> 206,749,473.68421053 used), leaving 14,154,526.315789474 at end of t=11.
    t=12 absorbs the remaining 14,154,526.315789474; loss fully used, balance = 0.
    => Cash-tax profile: ZERO tax t=1..11; first (partial) tax in t=12; full tax t=13..20.
  Taxable income after loss offset:
    t=1..11: 0.
    t=12: 20,674,947.368421053 - 14,154,526.315789474 = 6,520,421.052631579.
    t=13..19: 20,674,947.368421053.
    t=20: 71,674,947.368421053.
  CASH TAX = 30% x taxable-after-offset:
    t=1..11: 0.
    t=12: 0.30 x 6,520,421.052631579 = 1,956,126.315789474.
    t=13..19: 0.30 x 20,674,947.368421053 = 6,202,484.210526316.
    t=20: 0.30 x 71,674,947.368421053 = 21,502,484.210526316.

  ---------------------------------------------------------------------------
  STEP 7 — NOPAT = EBIT - CASH tax  (book EBIT, but tax computed on the tax base)
  ---------------------------------------------------------------------------
    t=1..11: 8,596,000 - 0 = 8,596,000.
    t=12: 8,596,000 - 1,956,126.315789474 = 6,639,873.684210526.
    t=13..19: 8,596,000 - 6,202,484.210526316 = 2,393,515.789473684.
    t=20: 8,596,000 - 21,502,484.210526316 = -12,906,484.210526316
          (negative because the balancing-charge tax on the salvage passes through cash tax
           here, while the offsetting salvage cash sits in the capex/investing line — Step 8).

  ---------------------------------------------------------------------------
  STEP 8 — Capex and terminal salvage
  ---------------------------------------------------------------------------
  Capex: 510,000,000 outflow at t=0; nil t=1..19.
  Salvage at end t=20 = 10% x 510,000,000 = 51,000,000 gross proceeds.
    Book NBV at t=20 = 0 -> book gain 51,000,000 (deliberately excluded from EBIT to avoid
      double-counting the cash proceeds).
    Tax WDV at t=20 = 0 -> balancing charge = 51,000,000 (recapture), taxed at 30% = 15,300,000
      (embedded in the t=20 cash-tax of 21,502,484.21 via the +51,000,000 in pre-loss income).
    Modelling: gross salvage 51,000,000 enters the investing line as NEGATIVE capex, so
      net capex(20) = capex_gross(20) - salvage_proceeds(20) = 0 - 51,000,000 = -51,000,000.
    Net after-tax salvage = 51,000,000 - 15,300,000 = 35,700,000 (recovered in FCFF(20)).

  ---------------------------------------------------------------------------
  STEP 9 — Working capital
  ---------------------------------------------------------------------------
  No payment terms stated; negligible inventory -> dNWC = 0 every period (flagged).

  ---------------------------------------------------------------------------
  STEP 10 — FCFF = NOPAT + D&A - dNWC - capex   (D&A = book dep, non-cash, cancels)
  ---------------------------------------------------------------------------
    t=0 : 0 + 0 - 0 - 510,000,000 = -510,000,000.
    t=1..11: 8,596,000 + 25,500,000 - 0 - 0 = 34,096,000.
    t=12: 6,639,873.684210526 + 25,500,000 = 32,139,873.684210526.
    t=13..19: 2,393,515.789473684 + 25,500,000 = 27,893,515.789473684.
    t=20: -12,906,484.210526316 + 25,500,000 - 0 - (-51,000,000) = 63,593,515.789473684.
  Cross-check t=20 = operating after-tax cash (34,096,000 - 6,202,484.210526316 = 27,893,515.79)
    + after-tax salvage (35,700,000) = 63,593,515.79. Undiscounted sum of FCFF = 156,044,000.


checks:
  - "revenue[t] == energy_mwh[t] * 1000 * ppa_price_usd_per_kwh"
  - "energy_mwh[t] == annual_energy_mwh for t >= first_operating_period"
  - "energy_mwh[t] == 0 for t < first_operating_period"
  - "opex[t] == opex_rate * construction_cost for t >= first_operating_period"
  - "opex[t] == 0 for t < first_operating_period"
  - "book_dep[t] == construction_cost / book_dep_years for t >= first_operating_period"
  - "book_dep[t] == 0 for t < first_operating_period"
  - "ebit[t] == revenue[t] - opex[t] - book_dep[t]"
  - "dna[t] == book_dep[t]"
  - "delta_nwc[t] == 0"
  - "book_nbv[t] == book_nbv[t-1] + capex_gross[t] - book_dep[t]"
  - "book_nbv[last] == 0"
  - "sum(book_dep) == construction_cost"
  - "twdv[t] == twdv[t-1] + capex_gross[t] - capital_allowance[t]"
  - "twdv[last] == 0"
  - "capital_allowance[t] == (tax_remaining_fraction * construction_cost) / tax_remaining_years for t >= second_operating_period"
  - "capital_allowance[t] == 0 for t < first_operating_period"
  - "sum(capital_allowance) == construction_cost"
  - "taxable_income_preloss[t] == revenue[t] - opex[t] - capital_allowance[t] + balancing_charge[t]"
  - "taxable_income_postloss[t] == taxable_income_preloss[t] + loss_created[t] - loss_offset[t]"
  - "loss_cf[t] == loss_cf[t-1] + loss_created[t] - loss_offset[t]"
  - "cash_tax[t] == tax_rate * taxable_income_postloss[t]"
  - "nopat[t] == ebit[t] - cash_tax[t]"
  - "loss_cf[t] >= 0"
  - "taxable_income_postloss[t] >= 0"
  - "loss_created[t] >= 0"
  - "loss_offset[t] >= 0"
  - "cash_tax[t] >= 0"
  - "loss_created[t] * loss_offset[t] == 0"
  - "taxable_income_postloss[t] * loss_created[t] == 0"
  - "loss_offset[t] <= loss_cf[t-1]"
  - "sum(loss_created) - sum(loss_offset) == loss_cf[last]"
  - "balancing_charge[t] == 0 for t < disposal_period_index"
  - "balancing_charge[last] == salvage_proceeds[last] - twdv[last]"
  - "salvage_proceeds[t] == 0 for t < disposal_period_index"
  - "salvage_proceeds[last] == salvage_rate * construction_cost"
  - "sum(salvage_proceeds) == salvage_rate * construction_cost"
  - "capex[t] == capex_gross[t] - salvage_proceeds[t]"
  - "capex_gross[first] == construction_cost"
  - "capex_gross[t] == 0 for t >= first_operating_period"
  - "sum(capex_gross) == construction_cost"
  - "fcff[t] == nopat[t] + dna[t] - delta_nwc[t] - capex[t]"
  - "fcff[first] == 0 - construction_cost"
  - "revenue[t] >= 0"
  - "energy_mwh[t] >= 0"
  - "opex[t] >= 0"
  - "twdv[t] >= 0"
  - "book_nbv[t] >= 0"

notes:
  - "Horizon: t=0 = construction (capex 510m, no operations); t=1..20 = the twenty operating years of the 20-year PPA; disposal at end of t=20. 21 periods total."
  - "Energy driver: used the operator's STATED 410,000 MWh/yr. Capacity-factor build (234 MW x 8,760 h x 0.20 = 409,968 MWh) differs by 0.008% and is immaterial; no equality check asserted between the two (would breach the 0.5 tolerance) — it is a reconciliation, not an invariant."
  - "Book vs tax split (the crux): book straight-line 25.5m/yr feeds EBIT; tax allowances (255m in t=1, then 13,421,052.631578947/yr in t=2..20) feed CASH tax. Front-loaded allowances create a 220,904,000 tax loss in year 1, carried forward and fully absorbed by year 12. Result: zero corporate tax in years 1-11, a partial tax in year 12, full tax thereafter. CURRENT-LAW NOTE 2026-07-25 (physical audit): this absorption schedule assumes losses carry forward without expiry. Kenya's indefinite carryforward ran only 1 Jan 2022 - 30 Jun 2025; the Finance Act 2025 reinstated a FIVE-YEAR cap effective 1 Jul 2025, before this gold's date. The trace faithfully models the stated premise and stands as an indefinite-carryforward oracle, but under the cap much front-loaded relief would be forfeited and cash tax would start far earlier. Loss-expiry is a SPAWN sibling."
  - "Salvage/terminal: 51,000,000 gross at end of t=20. Book NBV and tax WDV are both 0 by then, so (a) book gain on disposal = 51,000,000 is EXCLUDED from EBIT to avoid double counting the cash, and (b) a tax balancing charge of 51,000,000 is recaptured and taxed at 30% (=15,300,000), embedded in the t=20 cash tax. Gross proceeds enter as negative capex; net after-tax salvage = 35,700,000. NOPAT(20) is negative purely because the balancing-charge tax routes through cash tax while the proceeds route through the investing line — FCFF(20)=63,593,515.79 is correct. An equivalent presentation (operating-only cash tax + salvage booked net-of-tax in the terminal line) yields the identical FCFF."

id: arise-kenya-solar-234mw-ppa-fcff
title: "Arise Kenya - 234 MW AC solar portfolio, Rift Valley: unlevered FCFF over the 20-year Kenya Power PPA"
currency: USD
grid:
  periods: 20
  freq: annual

utterance:
  en: >-
    We are Arise Kenya - six grid-connected solar plants totalling 234 megawatts AC in the Rift
    Valley. We have a 20-year USD-denominated PPA with Kenya Power at 9.56 US cents per
    kilowatt-hour, and construction cost 510 million US dollars. In the first full year the plants
    give us about 410,000 megawatt-hours. But panels do not hold their output. The manufacturer's
    warranty says we lose about half a percent of production every year, and after eight years of
    running our own plants that is exactly what we see - each year comes in a little under the one
    before, and it compounds. So 410,000 is the first year; every year after that is half a percent
    below the year before it. Operating cost is 1 percent of capex a year. Corporate tax is 30
    percent, and any tax loss carries forward until it is absorbed. At year 20 the PPA ends and we
    expect a salvage of 10 percent of the original cost.
  fr: >-
    Nous sommes Arise Kenya - six centrales solaires raccordees au reseau totalisant 234 megawatts
    AC dans la Vallee du Rift. Nous avons un contrat d'achat d'electricite (PPA) de 20 ans libelle
    en dollars americains avec Kenya Power a 9,56 cents US le kilowattheure, et la construction a
    coute 510 millions de dollars americains. La premiere annee pleine, les centrales nous donnent
    environ 410 000 megawattheures. Mais les panneaux ne conservent pas leur production. La garantie
    du fabricant indique que nous perdons environ un demi pour cent de production chaque annee, et
    apres huit ans d'exploitation de nos propres centrales, c'est exactement ce que nous constatons -
    chaque annee arrive un peu en dessous de la precedente, et cela se compose. Donc 410 000 pour la
    premiere annee ; chaque annee suivante est inferieure de un demi pour cent a l'annee precedente.
    Le cout d'exploitation represente 1 pour cent du capex par an. L'impot sur les societes est de 30
    pour cent, et toute perte fiscale est reportee jusqu'a son absorption. A l'annee 20, le PPA prend
    fin et nous attendons une valeur residuelle de 10 pour cent du cout d'origine.


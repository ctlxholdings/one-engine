passage: |
  SCOPE, HORIZON AND GRID

  The asset is a portfolio of six grid-connected PV plants in the Kenyan Rift Valley, 234 MW AC in
  aggregate, selling its entire output to a single offtaker (Kenya Power) under a 20-year
  USD-denominated PPA. The only economic terminus the founder supplies is the end of that contract
  ("At year 20 the PPA ends and we expect a salvage of 10 percent of the original cost"), so the
  sensible horizon is exactly the PPA term: 20 annual periods, t = 0 .. 19, mapping to operating /
  PPA years 1 .. 20. Period t = 0 is the first FULL operating year, and the entire 510,000,000
  construction cost is charged to t = 0 as the initial investment. That is a modelling convention,
  not a claim about the build programme - it collapses construction into the same annual bucket as
  the first year of production. The alternative (a separate construction period ahead of t = 0)
  would shift the whole operating stream one period later without changing any operating figure.

  The build is UNLEVERED throughout: no debt, no interest, no financing flows. That is what makes
  the result asset-side. No discount rate is stated, so no NPV or IRR is computed; the deliverable
  is the FCFF stream itself.

  STEP 1 - PHYSICAL PRODUCTION (natural unit: MWh delivered per portfolio-year)

  Nameplate reference: 234 MW AC x 8,760 h/yr = 2,049,840 MWh at a theoretical 100% capacity
  factor. The founder's stated first-full-year energy is 410,000 MWh, which implies an AC capacity
  factor of 410,000 / 2,049,840 = 20.0%, i.e. a specific yield of about 1,752 MWh per MW-AC per
  year. For Rift Valley irradiation that is an ordinary, unremarkable number, so the utterance is
  internally consistent on its own terms and no re-basing of the energy figure is warranted.
  Averaged across six plants that is 39 MW and roughly 68,333 MWh per plant-year, but the founder
  never says the six plants are equal, so everything below runs at portfolio level only. The
  410,000 MWh is treated as NET energy delivered at the metering point - it is what "the plants
  give us", i.e. already after auxiliary consumption, transformer losses and availability.

  Degradation is stated twice and unambiguously, including the compounding and the exclusion of
  year 1: "410,000 is the first year; every year after that is half a percent below the year before
  it", and "it compounds". So the production recursion is

      G(0) = 410,000 MWh
      G(t) = G(t-1) x (1 - 0.005)  for t >= 1,  equivalently  G(t) = 410,000 x 0.995^t

  Eight years of the founder's own operating history are cited as confirming the rate, so 0.5%/yr
  is treated as an OBSERVED AC-side portfolio degradation - not a nameplate DC warranty step that
  would need translating into plant output.

      G(0)  = 410,000.00 MWh
      G(1)  = 410,000 x 0.995            = 407,950.00 MWh
      G(2)  = 407,950 x 0.995            = 405,910.25 MWh
      G(3)  = 405,910.25 x 0.995         = 403,880.70 MWh
      G(9)  = 410,000 x 0.995^9          = 391,914.73 MWh
      G(19) = 410,000 x 0.995^19         = 372,754.07 MWh

  Cumulative output loss over the PPA is 1 - 0.995^19 = 9.08%. Total energy delivered over the 20
  years is 410,000 x (1 - 0.995^20)/0.005 = 7,821,940.62 MWh.
  CORRECTED 2026-07-26 (physical audit): this line previously evaluated to 7,822,987 MWh. The FORMULA
  was right and the ARITHMETIC was wrong, overstating lifetime output by about 1,046 MWh. It is
  refuted twice by this gold's own numbers - the sum of trace.generation_mwh, and the passage's own
  lifetime revenue divided by the tariff, both give 7,821,940.62. No trace value changed; only this
  sentence was wrong. Note the general lesson it illustrates: NO CHECK BINDS PASSAGE PROSE TO THE
  TRACE, so a number written only in prose is outside the machine gate entirely - which is why
  contract v2.3 forbids putting quantified results there in the first place.

  STEP 2 - REVENUE (IFRS 15)

  Tariff unit bridge: 9.56 US cents/kWh = 0.0956 USD/kWh; 1 MWh = 1,000 kWh; therefore the tariff
  is 95.60 USD/MWh. The PPA is USD-denominated and one tariff number is quoted for the entire
  20-year term with no index mentioned, so the price is FLAT in nominal USD across all 20 periods.

  Revenue is recognised as electricity is delivered - a performance obligation satisfied over time,
  measured by an output method (MWh metered), which is the natural measure here and requires no
  estimation.

      Revenue(t) = 95.60 x G(t)

      Revenue(0)  = 95.60 x 410,000.00     = 39,196,000.00
      Revenue(1)  = 95.60 x 407,950.00     = 39,000,020.00
      Revenue(2)  = 95.60 x 405,910.25     = 38,805,019.90
      Revenue(3)  = 95.60 x 403,880.70     = 38,610,994.80
      Revenue(9)  = 95.60 x 391,914.73     = 37,467,047.91
      Revenue(19) = 95.60 x 372,754.07     = 35,635,288.83

  Because the tariff is flat, revenue inherits the degradation recursion exactly:
  Revenue(t) = Revenue(t-1) x 0.995. Both routes agree to the cent, which is the first internal
  cross-check of the build. Total revenue over 20 years = 39,196,000 x (1 - 0.995^20)/0.005 =
  747,777,523.

  STEP 3 - OPERATING COST

  "Operating cost is 1 percent of capex a year" gives 0.01 x 510,000,000 = 5,100,000 per year, in
  every one of the 20 periods. Because both the rate and the base are fixed, this is a FLAT nominal
  figure and is not indexed. It is a period cost, expensed as incurred and matched to the year of
  generation. Taken as covering O&M, land, insurance, security, grid/regulatory charges and admin -
  the founder itemises nothing separately, and adding items would be invention.

  STEP 4 - EBITDA

      EBITDA(t) = Revenue(t) - 5,100,000

      EBITDA(0)  = 39,196,000.00 - 5,100,000 = 34,096,000.00
      EBITDA(1)  = 39,000,020.00 - 5,100,000 = 33,900,020.00
      EBITDA(9)  = 37,467,047.91 - 5,100,000 = 32,367,047.91
      EBITDA(19) = 35,635,288.83 - 5,100,000 = 30,535,288.83

  Total EBITDA over the horizon = 747,777,523 - 102,000,000 = 645,777,523. Note the operating
  geometry: revenue decays 0.5%/yr but the cost base is flat, so EBITDA decays slightly faster in
  percentage terms - 34,096,000 to 30,535,289 is -10.4%, against -9.1% on revenue. This is the
  fixed-cost drag that degradation creates, and it is the reason the physical decay matters more to
  cash than the headline 0.5% suggests.

  STEP 5 - CAPITAL BASE, DEPRECIATION AND THE PP&E ROLL-FORWARD (IAS 16)

  Cost of the PP&E = 510,000,000. The founder expects to realise 10% of original cost = 51,000,000
  at the end of the PPA. An expected disposal amount at the end of the asset's useful life to the
  entity IS the IAS 16.6 residual value, so under IAS 16.53 it must be deducted from the
  depreciable amount:

      depreciable amount = 510,000,000 - 51,000,000 = 459,000,000

  Useful life to this entity = 20 years. IAS 16 defines useful life entity-specifically: the period
  over which the asset is expected to be available for use BY THE ENTITY. The PPA ends at year 20
  and the plants are expected to be disposed of then, so 20 years is the relevant life even though
  the panels' technical life is longer. Method: straight line.

      annual depreciation = 459,000,000 / 20 = 22,950,000

  Roll-forward. Gross cost is held at 510,000,000 for t = 0 .. 18. Accumulated depreciation builds
  at 22,950,000/yr: 22,950,000 at t = 0, 229,500,000 at t = 9, 436,050,000 at t = 18. Net book
  value therefore runs 487,050,000 at t = 0, down 22,950,000 per year, to 73,950,000 at t = 18. In
  t = 19 the final 22,950,000 charge takes NBV to exactly 51,000,000 immediately before disposal;
  the disposal then derecognises cost 510,000,000 and accumulated depreciation 459,000,000, so
  gross, accumulated and net all close at zero. The books close clean, with no stub asset left
  behind - a direct consequence of matching the depreciable base to the stated residual.

  Consequence for tax: proceeds of 51,000,000 equal NBV of 51,000,000, so the gain on disposal is
  exactly zero and the terminal cash carries no tax. This falls out of applying IAS 16.53 to a
  residual the founder himself stated; it is not an additional assumption.

  STEP 6 - EBIT

      EBIT(t) = EBITDA(t) - 22,950,000

      EBIT(0)  = 34,096,000.00 - 22,950,000 = 11,146,000.00
      EBIT(1)  = 33,900,020.00 - 22,950,000 = 10,950,020.00
      EBIT(9)  = 32,367,047.91 - 22,950,000 =  9,417,047.91
      EBIT(19) = 30,535,288.83 - 22,950,000 =  7,585,288.83

  Total EBIT = 645,777,523 - 459,000,000 = 186,777,523. EBIT is positive in every one of the 20
  periods; the depreciation shield never exceeds EBITDA.

  STEP 7 - TAX AND THE LOSS CARRYFORWARD

  Unlevered build, so no interest enters taxable income. Gain on disposal is zero. Therefore
  taxable income before losses = EBIT in every period.

  The founder specifically flagged that "any tax loss carries forward until it is absorbed", so the
  mechanism is modelled explicitly rather than asserted away: an opening pool, an addition equal to
  the loss whenever pre-loss taxable income is negative, a utilisation capped at the lesser of the
  opening pool and positive taxable income, and a closing pool carried into the next period.

  FINDING: on the founder's own numbers the pool is never created, never drawn and closes at zero
  in all 20 periods, because EBIT is positive throughout. The carryforward feature he emphasised is
  inert in this business plan. It would only start to bite if EBIT went negative, and the stated
  0.5%/yr decay does not come close - EBIT is still above 7.5m in the final year, some 27% above (corrected 2026-07-26, physical audit)
  the annual depreciation-plus-opex floor it would have to fall through. This is worth telling him:
  the loss-relief provision he is relying on is protection he does not currently need, and its
  presence should not be read as slack in the plan.

      Tax(t) = 0.30 x EBIT(t)

      Tax(0)  = 0.30 x 11,146,000.00 = 3,343,800.00
      Tax(1)  = 0.30 x 10,950,020.00 = 3,285,006.00
      Tax(9)  = 0.30 x  9,417,047.91 = 2,825,114.37
      Tax(19) = 0.30 x  7,585,288.83 = 2,275,586.65

  Total tax = 0.30 x 186,777,523 = 56,033,257. Tax base is taken equal to the book base, so current
  tax is 30% of book EBIT and no deferred tax arises.

  STEP 8 - NOPAT

      NOPAT(t) = EBIT(t) - Tax(t)

      NOPAT(0)  = 11,146,000.00 - 3,343,800.00 =  7,802,200.00
      NOPAT(1)  = 10,950,020.00 - 3,285,006.00 =  7,665,014.00
      NOPAT(9)  =  9,417,047.91 - 2,825,114.37 =  6,591,933.54
      NOPAT(19) =  7,585,288.83 - 2,275,586.65 =  5,309,702.18

  Total NOPAT over the horizon = 130,744,266.

  STEP 9 - WORKING CAPITAL

  The utterance contains no payment terms, no receivable ageing, no arrears figure, no consumables
  inventory and no payables policy. A PV plant carries no fuel inventory and its spare parts sit
  inside the 1%-of-capex line. The single real working-capital item is the offtaker receivable, and
  its size depends entirely on Kenya Power's payment behaviour, which was not stated and cannot be
  deduced. Net working capital is therefore set to zero in every period, so delta NWC = 0
  throughout and NOPAT converts to cash one-for-one. Receivables, payables, NWC and delta NWC are
  still carried as explicit rows so the choice is visible and the roll-forward is checkable. This
  is a flagged modelling decision, not a finding about the business.

  STEP 10 - CAPEX AND SALVAGE

  Capex: 510,000,000 in period 0, zero in every subsequent period. The founder names no replacement
  or major-maintenance capex and folds all recurring spend into the operating line; that is taken
  at face value.

  Salvage: 51,000,000 received in period 19 (PPA year 20). It is an investing inflow from the
  disposal of PP&E, NOT revenue, and it is presented that way - it never touches EBITDA, EBIT or
  the tax computation. Because NBV at disposal is also exactly 51,000,000, the gain is zero and the
  proceeds arrive untaxed.

  STEP 11 - FCFF, PER PERIOD

      CFO(t)  = NOPAT(t) + D&A(t) - delta NWC(t) = NOPAT(t) + 22,950,000 - 0
      CFI(t)  = salvage(t) - capex(t)
      FCFF(t) = CFO(t) + CFI(t) = NOPAT(t) + D&A(t) - delta NWC(t) - capex(t) + salvage(t)

      t = 0:  7,802,200.00 + 22,950,000 - 0 - 510,000,000 + 0 = -479,247,800.00
      t = 1:  7,665,014.00 + 22,950,000                       =   30,615,014.00
      t = 2:  7,528,513.93 + 22,950,000                       =   30,478,513.93
      t = 3:  7,392,696.36 + 22,950,000                       =   30,342,696.36
      t = 9:  6,591,933.54 + 22,950,000                       =   29,541,933.54
      t = 18: 5,435,052.44 + 22,950,000                       =   28,385,052.44
      t = 19: 5,309,702.18 + 22,950,000 - 0 - 0 + 51,000,000  =   79,259,702.18

  The operating-phase FCFF steps down by a fixed, checkable amount each year. Since delta NWC,
  capex and depreciation are all constant in t = 1 .. 18, the year-on-year fall in FCFF is exactly
  the after-tax fall in revenue: (1 - 0.30) x 0.005 x Revenue(t-1) = 0.0035 x Revenue(t-1). At the
  start of the decline that is 0.0035 x 39,000,020 = 136,500.07, matching FCFF(1) - FCFF(2)
  = 30,615,014.00 - 30,478,513.93 exactly; at the end it is 0.0035 x 35,814,360.63 = 125,350.26,
  matching CFO(18) - CFO(19). The whole operating profile is a linear-in-revenue, geometrically
  decaying annuity, and this identity is the cheapest way to audit it.

  AGGREGATES AND SHAPE

  Total FCFF over the 20 periods = 130,744,266. That figure is identically equal to total NOPAT,
  because total depreciation (459,000,000) exactly equals capex (510,000,000) less salvage
  (51,000,000), and delta NWC sums to zero over the horizon. That identity is asserted in `checks`
  and is the single strongest audit hook on the whole build: any engine that gets the ladder right
  but the capital account wrong will break it.

  Cumulative FCFF runs -479,247,800 at t = 0, is still -179,158,975 at t = 10, -5,411,521 at t = 16,
  and turns positive at t = 17 (operating year 18) at 23,099,511. Undiscounted payback therefore
  falls inside the PPA term, but only just - roughly the last three years of the contract, plus the
  salvage, carry the entire undiscounted return. That is the central risk shape of this asset: the
  economics are back-loaded onto the tail of a single-offtaker contract, and any event that
  truncates or impairs the last few PPA years destroys a disproportionate share of the whole return.

  Finally, a companion row `fcff_ex_initial_capex` is carried, showing the same stream with the
  period-0 construction outflow removed. It answers the going-concern question directly - what the
  installed asset base throws off per year if the 510,000,000 is treated as already sunk - and it is
  checked against `fcff` and `capex` rather than being asserted in prose.


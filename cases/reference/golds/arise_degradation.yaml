notes:

  - "OPERATIONS CROSS-CHECK (finding, not an assumption). 234 MW AC x 8,760 h = 2,049,840 MWh of nameplate hours; the stated 410,000 MWh first-year output implies a 20.0% AC capacity factor, about 1,752 MWh per MW-AC per year. That is an ordinary specific yield for Rift Valley irradiation, so the founder's capacity figure and his energy figure are mutually consistent and neither needed re-basing. This is asserted in checks via capacity_factor rather than left in prose."

  - "HORIZON. The PPA term is the only terminus the founder gives an economic value for, and he prices the exit at that date (salvage at year 20). A 20-period annual grid mapping t = 0..19 to PPA years 1..20 is therefore the natural horizon. No post-PPA merchant tail, re-contracting or extension is modelled, because none was described; a separate agent is examining the expiry question."

  - "CAPEX TIMING (judgment call, logged). The founder used the past tense ('construction cost 510 million'), which is ambiguous between 'this is the investment we are appraising' and 'this is already sunk'. The base build charges the full 510,000,000 to period 0 as the initial investment, which is the standard asset-side project view and the one that makes total FCFF a whole-life number. Because the ambiguity is real, the going-concern alternative is MATERIALISED as trace.fcff_ex_initial_capex and checked against trace.fcff and trace.capex, rather than being described in prose. What would change the call: a stated commercial operation date, a draw schedule, or an explicit statement that the plants are already operating and the spend is historic."

  - "CONSTRUCTION PERIOD. Construction is collapsed into the same annual bucket as the first full operating year rather than given its own period ahead of t = 0. Direction of the effect if separated: the entire operating stream would sit one year later relative to the outflow, which worsens any time-weighted measure while leaving every operating line unchanged."

  - "DEPRECIATION BASE (judgment call, logged). IAS 16.53 requires the depreciable amount to be cost less residual value, and the founder's expected year-20 salvage IS a residual value on the IAS 16.6 definition. The depreciable base is therefore 459,000,000, not 510,000,000. The consequence is that book value at disposal equals proceeds, so there is no gain and no exit tax. Direction of the effect of the alternative (depreciating the full cost): annual depreciation would be higher, so tax would be lower during the PPA, but the disposal would then throw off a taxable gain and terminal FCFF would fall. What would change the call: evidence that the 10% is a scrap estimate the entity does not actually expect to realise, or a policy of depreciating to nil."

  - "USEFUL LIFE. Set equal to the PPA term because the founder expects to dispose of the plants when the contract ends. This is ASSUMED, not INFERRED - PV modules have a longer technical life, and IAS 16 useful life is entity-specific. ELICITED question not asked: do you intend to re-contract, go merchant, or sell at year 20?"

  - "TAX BASE. No Kenyan capital-allowance schedule is modelled; the tax base is taken equal to the book base, so current tax is 30% of book EBIT and no deferred tax arises. Kenya does grant investment deductions on qualifying plant. Direction of the effect if accelerated allowances apply: tax is deferred into later years, raising early FCFF and lowering late FCFF. ELICITED question not asked: which allowance regime and rate applies to these six plants? CORRECTED 2026-07-26 (physical audit): this note previously added that the total would be 'broadly preserved'. That is TRUE ONLY UNDER INDEFINITE LOSS CARRYFORWARD and was stated unconditionally. Under indefinite carryforward the invariance is in fact exact, not merely broad - undiscounted lifetime FCFF is the same whatever the allowance schedule, because lifetime net relief is cost minus proceeds regardless of timing - and the auditor confirmed it holds to the cent across several allowance regimes, which is independent evidence that this gold capital account is sound. But the invariance BREAKS under a capped carryforward, because front-loaded allowances then create relief that expires unused, and Kenya reinstated a five-year cap in the Finance Act 2025. Direction only: under a cap, an accelerated allowance forfeits relief and lifetime FCFF falls substantially rather than being preserved. The sibling gold arise_expiry isolates exactly that regime; this gold and that one are the two sides of the invariant, and the condition is the carryforward rule."

  - "LOSS CARRYFORWARD IS INERT (finding). The founder specifically volunteered that tax losses carry forward until absorbed, which usually signals that the speaker expects loss years. On his own numbers there are none: EBIT is positive in all 20 periods and the carryforward pool is created, drawn and closed at zero throughout. The mechanism is still materialised as four explicit rows so the logic is visible and checkable rather than assumed away. Worth telling him directly: the relief he is counting on is not doing any work in this plan, and its presence should not be read as headroom."

  - "WORKING CAPITAL SET TO ZERO (flagged modelling choice, not a finding). No payment terms, ageing, arrears or payables policy appear in the utterance, and no defensible level can be deduced. Receivables, payables, NWC and delta NWC are carried as explicit zero rows so the choice is auditable. Direction of the effect if a real offtaker receivable exists: cash lags revenue, so an outflow appears in the build-up year and reverses at contract end, without changing the horizon total. ELICITED question not asked: what are Kenya Power's contractual payment terms, and what is the current arrears position? Given the offtaker, this is the single most material unasked question in the whole build."

  - "NO ESCALATION ANYWHERE. The tariff is a single USD number quoted for a 20-year term, and opex is a fixed percentage of a fixed capex, so both lines are flat in nominal USD. Real opex therefore declines across the horizon. Direction of the effect if the 1% was meant in real terms: nominal opex rises through the horizon and late-year FCFF falls, amplifying the back-loading risk noted below. ELICITED question not asked: is the 1% a nominal run-rate or a real one?"

  - "REPLACEMENT CAPEX OMITTED. Utility-scale PV normally carries a mid-life inverter replacement, and this build has none because the founder folded all recurring spend into the 1%-of-capex operating line and named no capex after year one. Taken at face value. Direction of the effect if a replacement is required: FCFF in the affected year falls sharply and the payback date moves later. ELICITED question not asked: does the 1% cover inverter and transformer replacement, or is that separate?"

  - "RISK SHAPE (finding). Cumulative FCFF is still negative at t = 16 and turns positive only at t = 17, and the year-20 period carries the salvage. The undiscounted return is therefore concentrated in the last stretch of a single-offtaker contract. Anything that truncates, reprices or impairs the final PPA years - curtailment, offtaker non-payment, renegotiation, early termination - destroys a disproportionate share of the whole return. This is a structural observation readable directly off trace.cum_fcff, not a scenario."

  - "IFRS CLASSIFICATION FRICTION. A 20-year contract under which a single offtaker takes substantially all output of identified plants can, depending on control and pricing terms, fall to be accounted for as a lease (IFRS 16) or a service concession (IFRIC 12) rather than own-use PP&E with energy revenue. On the facts given - an energy-only c/kWh tariff, plants described as 'our own plants', and no capacity payment or transfer obligation mentioned - PP&E plus IFRS 15 energy revenue is the correct default. If it were a finance-lease or concession-receivable model, the D&A line and the balance-sheet presentation would change and part of the receipt would be interest, but the underlying asset-side cash the plants generate would not. ELICITED question not asked: does the PPA contain a capacity charge, a purchase option, or a transfer obligation?"

  - "CURRENCY / TAX MISMATCH FRICTION. The PPA and the capex are USD, but Kenyan corporate tax is assessed on profits measured in the entity's functional currency. If that is KES, USD/KES movements generate taxable translation gains and losses that sit outside this build entirely, and the effective cash tax rate would diverge from the 30% statutory rate applied here. Flagged rather than modelled because no FX path was given. ELICITED question not asked: what is the functional currency of the Kenyan entity?"

  - "NATURAL UNITS PRESERVED. The business's own quantities are MWh delivered per portfolio-year and US cents per kWh. The model keeps MWh throughout the production layer and converts only once, at the revenue line, via the 95.60 USD/MWh bridge. Nothing was forced into a generic per-unit template."

  - "PORTFOLIO-LEVEL ONLY. Six plants are modelled as one 234 MW portfolio. The founder gives no plant-level capacities, COD dates or availability; an equal split would be an invention. The degradation rate is applied to portfolio AC output as a single observed rate, which is what eight years of his own operating data support."

  - "POINT ESTIMATES. 'About 410,000' and 'about half a percent' are used as point estimates. No probabilistic or P50/P90 treatment is applied, and no availability or curtailment allowance is layered on top - the 410,000 MWh is taken as net delivered energy at the metering point. ELICITED question not asked: is that figure a P50 forecast or an achieved first-year actual, and does the PPA compensate deemed energy on curtailment?"

  - "SALVAGE TREATED AS NET. The 51,000,000 is taken as gross investing proceeds and assumed already net of any decommissioning or site-restoration obligation, since the founder quoted a positive figure at the end of the contract. If a material IAS 37 restoration provision exists it would need to be accreted and settled, reducing the terminal inflow. ELICITED question not asked: is there a decommissioning obligation in the land leases or the PPA, and is the 10% net of it?"

  - "DEFERRED, NOT MODELLED. No discount rate was stated, so no NPV, IRR or LCOE is computed - the deliverable is the unlevered FCFF stream. The build is deliberately unlevered end to end: no debt, no interest, no DSRA, no financing flows. Any levered view would need the debt terms, which were not given."

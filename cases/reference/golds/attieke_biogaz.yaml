  fuel_saving:                 [1800000, 1800000, 1800000, 1800000, 1800000]
  cumulative_fuel_saving:      [1800000, 3600000, 5400000, 7200000, 9000000]

fcff: [7400000, 7400000, 7400000, 7400000, 6600000]

checks:

  # --- conservation ---
  - "trace.nbv_closing == trace.nbv_opening + trace.capex - trace.depreciation"
  - "trace.nbv_opening[t] == trace.nbv_closing[t-1] for t >= first_lagged_period"
  - "trace.nbv_closing - trace.nbv_opening[first] == cumsum(trace.capex) - cumsum(trace.depreciation)"
  - "sum(trace.depreciation) + trace.nbv_closing[last] == trace.nbv_opening[first] + sum(trace.capex)"
  - "trace.nbv_opening[t] == 0 for t >= digester_remaining_life_years"
  - "cumsum(trace.delta_nwc) == trace.nwc"
  - "cumsum(trace.fuel_saving) == trace.cumulative_fuel_saving"
  - "sum(trace.fcff_zero_tax) - sum(trace.fcff) == sum(trace.tax)"
  - "sum(trace.fcff) == 36200000"

  # --- definition (the ladder) ---
  - "trace.cash_operating_cost == trace.cassava_cost + trace.wood_cost + trace.labour_cash_cost"
  - "trace.ebitda == trace.revenue - trace.cash_operating_cost"
  - "trace.ebit == trace.ebitda - trace.depreciation"
  - "trace.nopat == trace.ebit - trace.tax"
  - "trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex"
  - "trace.nopat_zero_tax == trace.ebit - trace.tax_zero_scenario"
  - "trace.fcff_zero_tax == trace.nopat_zero_tax + trace.depreciation - trace.delta_nwc - trace.capex"
  - "trace.fcff_zero_tax - trace.fcff == trace.tax"
  - "trace.fuel_saving == trace.wood_cost_counterfactual - trace.wood_cost"
  - "trace.fcff_per_woman == trace.fcff / workers_count"

  # --- driver-bridge ---
  - "trace.demi_bachees == demi_bachees_per_week * weeks_per_year"
  - "trace.cassava_tonnes == trace.demi_bachees * tonnes_per_demi_bachee"
  - "trace.attieke_kg == trace.demi_bachees * attieke_yield_kg_per_demi_bachee"
  - "trace.attieke_kg == trace.cassava_tonnes * 1000 * attieke_mass_yield_ratio"
  - "trace.revenue == trace.attieke_kg * wholesale_price_per_kg"
  - "trace.cassava_cost == trace.demi_bachees * cassava_price_per_demi_bachee"
  - "trace.wood_cost == trace.demi_bachees * wood_cost_per_demi_bachee_biogas"
  - "trace.wood_cost_counterfactual == trace.demi_bachees * wood_cost_per_demi_bachee_legacy"
  - "trace.labour_cash_cost == labour_cash_cost_per_year"
  - "trace.nwc == nwc_level"
  - "trace.tax == trace.revenue * turnover_tax_rate"
  - "trace.tax_zero_scenario == trace.revenue * informal_tax_rate"
  - "trace.depreciation == (digester_cost - digester_residual_value) / digester_life_years"
  - "trace.contribution_per_kg == wholesale_price_per_kg - cassava_price_per_demi_bachee / attieke_yield_kg_per_demi_bachee - wood_cost_per_demi_bachee_biogas / attieke_yield_kg_per_demi_bachee"
  - "trace.ebitda == trace.contribution_per_kg * trace.attieke_kg"
  - "trace.nbv_opening[first] == digester_cost - digester_cost / digester_life_years"
  - "trace.capex[first] == 0"
  - "trace.capex[last] == digester_cost"
  - "sum(trace.capex) == digester_cost"
  - "grid.periods == digester_life_years"
  - "digester_remaining_life_years == digester_life_years - digester_age_at_horizon_start_years"

  # --- non-negativity ---
  - "trace.nbv_opening >= 0"
  - "trace.nbv_closing >= 0"
  - "trace.contribution_per_kg >= 0"
  - "trace.ebitda >= 0"
  - "trace.tax >= 0"
  - "min(trace.fcff) >= 0"
  - "min(trace.fcff_zero_tax) >= 0"
  - "trace.cumulative_fuel_saving[first] >= digester_cost"

notes:

  scope_and_status:
    - "This is an asset-side (unlevered) FCFF. No debt is mentioned and the digester was self-funded, so there is no financing leg to strip out and, on the facts given, FCFF and equity free cash flow coincide."
    - "Every FCFF figure is struck BEFORE any remuneration of the ten women. That is the single largest qualification on the output and it is a consequence of the utterance containing no wage, not of a modelling choice to ignore labour."
    - "No terminal value. The horizon deliberately stops after one full asset-replacement cycle. A going-concern valuation would need a view on cassava price durability and on whether the ten women continue, neither of which is deducible here."

  judgment_calls:
    - "Horizon set to five periods rather than four. The installed digester expires at end of Y4; stopping there would exclude the replacement outflow and overstate steady-state cash generation. Y5 carries the replacement so that the renewal decision sits inside the window."
    - "Replacement capex placed in Y5 rather than Y4, on the convention that the outflow falls in the period the asset enters service, matching a full year of depreciation on the new unit in the same period."
    - "The 800,000 already paid is treated as sunk and excluded from horizon capex. It is reflected only through the one year of depreciation already taken, which is why opening net book value is 640,000 and not 800,000."
    - "No IAS 20 grant is recognised. The founder distinguishes a project that helped from money that was hers - 'qu on a payés nous-mêmes'. Had the project paid, the asset would be carried net of grant or a deferred income released over five years, and the cash story would differ materially."
    - "Working capital: the level is unobservable and normalised to zero, but the change is deduced to be zero from constant volume, constant prices and an already-running business. FCFF here is insensitive to the level, which is why the unanswered payment-terms questions do not block the answer."

  frictions_with_standard_line_items:
    - "The cost side is driven by the demi-bâchée (a transport unit) and the revenue side by the kilo (a mass unit). Both are retained in their natural form; the conversion is applied once, at revenue, using the stated 500 kg per demi-bâchée."
    - "Tax is modelled on turnover, not on profit, because a 35,000,000 XOF business in Côte d Ivoire sits in the small-taxpayer bands rather than the corporate-income-tax band. The NOPAT construct still runs, but the tax line does not respond to EBIT, and depreciation shields nothing - it is deducted and added straight back with no cash consequence. The rate itself is an analyst prior and is the weakest input in the model."
    - "The untaxed alternative is not left as prose. It is a traced, checked parallel column (tax_zero_scenario, nopat_zero_tax, fcff_zero_tax), so the tax exposure is a computed quantity rather than an assertion."
    - "The wood-only counterfactual is likewise traced (wood_cost_counterfactual, fuel_saving, cumulative_fuel_saving) rather than described, so the digester payback claim in the passage rests on a check and not on prose arithmetic."

  omitted_cost_lines_deliberately_not_invented:
    - "Water for washing, steeping and pressing; grating fees at the râpeuse; pressing sacks and sieves; packaging (bins or bags); transport of cassava in and attiéké out where not embedded in the 125,000 delivered price; digester feedstock, water, desludging and burner repair; rent of the courtyard; communal and market-association levies; any social contributions."
    - "All of these are real and none is quantified in the utterance. Rather than assign them guessed magnitudes, they are carried as ELICITED inputs with the question I would ask. Direction of the error is unambiguous and one-sided: EBITDA, NOPAT and FCFF as traced are upper bounds on the true figures. No size is claimed."
    - "No maintenance capex is modelled for anything other than the digester, because no other durable asset is mentioned. If grating or pressing equipment exists and is owned, capex is understated and FCFF overstated."

  elicitation_priority:
    - "First, what the ten women actually draw. Nothing else changes the interpretation of the output as much."
    - "Second, the real tax status and what is actually handed over. The base case rate is an analyst prior and the traced spread between the taxed and untaxed columns is the exposure."
    - "Third, the per-batch consumables and the digester running cost - the two omissions most likely to be material against an 88 XOF per kilo contribution."
    - "Fourth, payment terms. Wanted for the balance sheet, but on these facts it cannot move FCFF."

  risk_concentration:
    - "Cassava is 250 of the 350 XOF selling price and contribution is 88 XOF per kilo. The business is far more exposed to the cassava root price and to the 500 kg per tonne yield than to anything on the energy side. Direction only, no figures asserted: adverse moves in either driver compress FCFF disproportionately, and the model as built holds both flat because the founder gave no basis for varying them."
    - "Prices and costs are held flat with no escalation, per the utterance. If cassava inflates faster than the wholesale attiéké price, the traced flows overstate later periods."

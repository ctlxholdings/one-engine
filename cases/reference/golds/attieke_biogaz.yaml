id: attieke-atelier-abobo-biogas-fcff-2026
title: >-
  Atelier d'attiéké, Abobo (Abidjan) — unlevered FCFF via NOPAT over a five-year horizon
  spanning the remaining life of the biogas digester and its first replacement
currency: XOF
grid:
  periods: 5
  freq: annual
  labels: [Y1, Y2, Y3, Y4, Y5]
  convention: >-
    Y1 is the first full operating year after the utterance. The digester was installed one year
    before Y1 starts, so Y1-Y4 consume its remaining service life and Y5 is the first year of its
    replacement.

utterance:
  fr: |
    Moi je suis gérante d'un atelier d'attiéké à Abobo, Abidjan. On est dix femmes. On achète le
    manioc à la demi-bâchée, une tonne, à cent vingt-cinq mille. Avec une demi-bâchée, on produit
    cinq cents kilos d'attiéké. On fait quatre demi-bâchées par semaine. On vend en gros à trois
    cent cinquante francs le kilo. On tourne cinquante semaines par an, deux semaines de pause.
    Avant on cuisait au bois, et le bois nous revenait à quinze mille francs par demi-bâchée.
    L'année dernière un projet nous a aidées à installer un digesteur à biogaz — ça nous a coûté
    huit cent mille francs, qu'on a payés nous-mêmes. Maintenant on cuit au biogaz et le bois ne
    nous coûte plus que six mille par demi-bâchée, juste pour l'appoint. On nous a dit que le
    digesteur tient cinq ans.
  en: |
    I run an attiéké workshop in Abobo, Abidjan. We're ten women. We buy cassava by the
    demi-bâchée — one tonne — at a hundred twenty-five thousand. From one demi-bâchée we produce
    five hundred kilos of attiéké. We do four demi-bâchées a week. We sell wholesale at three
    hundred fifty francs per kilo. We operate fifty weeks a year, two weeks off. We used to steam
    with wood, and wood cost us fifteen thousand francs per demi-bâchée. Last year a project
    helped us install a biogas digester — it cost us eight hundred thousand francs, which we paid
    ourselves. Now we steam with biogas and wood only costs us six thousand per demi-bâchée, just
    for topping up. They told us the digester lasts five years.


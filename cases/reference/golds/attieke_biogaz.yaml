passage: |
  STEP 0 — THE NATURAL UNIT CHAIN, AND WHERE IT DOES NOT MAP ONTO LINE ITEMS

  The atelier's natural production unit is the demi-bâchée: a half-truckload of fresh cassava
  root that the founder pins to one tonne. Every cost she quotes attaches to that batch — cassava
  at 125,000 XOF per demi-bâchée, wood at 15,000 and now 6,000 XOF per demi-bâchée. Revenue, by
  contrast, attaches to the kilo of finished attiéké at 350 XOF. The bridge between the two is
  stated: one demi-bâchée yields 500 kg of attiéké.

  I therefore drive the entire cost side off the demi-bâchée and convert to kilos only at the
  revenue line. Friction to record: "demi-bâchée" is a transport unit (half a tarpaulin-covered
  pickup), not a weight unit, and it is only because the founder equates it with a tonne that a
  mass yield exists at all. That yield is 500 kg out of 1,000 kg = 50.0% by mass; the missing
  half leaves as peel, press-water and steam loss. Nothing in the derivation depends on that
  ratio — it is a plausibility read, and it is coherent with what peeled-grated-fermented-pressed-
  steamed cassava semolina returns.

  Second friction: the ten women. They are stated as a headcount, never as a cost. In a formal
  employer they would be a payroll line; here they are the atelier. I book zero cash payroll and
  flag it loudly (see STEP 6): every profit and cash figure below is struck BEFORE remunerating
  them. As a capacity read only, 200 demi-bâchées a year across ten women is 20 tonnes of cassava
  per woman per year, or 0.4 demi-bâchée per woman per week — 200 kg of finished attiéké per
  woman per week. That is a credible artisanal throughput and gives no reason to doubt the stated
  volume.

  STEP 1 — HORIZON

  The only asset with a stated life is the digester: five years, installed last year. One year is
  therefore already consumed and four remain. I run five annual periods, Y1 to Y5. Y1-Y4 exhaust
  the installed unit; Y5 is the first year of its replacement. This is deliberate: a four-year
  horizon would flatter the business by stopping just before the replacement cheque, and a
  perpetual horizon would need a terminal value nobody has given me the inputs for. Five years
  shows one full renewal decision inside the window.

  Prices and costs are held flat. The founder escalates nothing, so the model is in constant
  units of account of the utterance date; the replacement digester is priced at the same 800,000.

  STEP 2 — VOLUME (per period, identical Y1 to Y5)

  Demi-bâchées per year = 4 per week x 50 weeks = 200.
  Cassava throughput    = 200 demi-bâchées x 1 tonne = 200 tonnes.
  Attiéké output        = 200 demi-bâchées x 500 kg = 100,000 kg.
  Cross-check by mass   = 200 t x 1,000 kg/t x 0.50 = 100,000 kg. Agrees.

  The two idle weeks are already inside the 50; they consume no cost and produce no output, so
  they simply do not appear again.

  STEP 3 — REVENUE (per period, identical Y1 to Y5)

  Revenue = 100,000 kg x 350 XOF/kg = 35,000,000 XOF.

  Recognition: wholesale attiéké is handed over and settled at collection, so control passes on
  delivery and the whole 35,000,000 is Y-t revenue in the year of production (IFRS 15). Attiéké
  is a fresh, few-day-shelf-life product — there is no finished-goods build to defer.

  STEP 4 — CASSAVA (per period, identical Y1 to Y5)

  Cassava cost = 200 demi-bâchées x 125,000 XOF = 25,000,000 XOF.

  Matched, not merely paid: cassava bought is cassava processed within days (roots deteriorate in
  48-72 hours), so purchases equal cost of materials consumed and no raw-material inventory
  accumulates. Per finished kilo this is 125,000 / 500 = 250.00 XOF/kg — i.e. 71.4% of the 350
  selling price is the root itself. This is the dominant fact about the business.

  STEP 5 — FUEL (per period, identical Y1 to Y5)

  Wood top-up under biogas = 200 x 6,000 = 1,200,000 XOF, i.e. 12.00 XOF per finished kilo.

  The pre-digester counterfactual, carried as a memo column and not in the cost stack:
  wood-only cost = 200 x 15,000 = 3,000,000 XOF, so the digester saves 15,000 - 6,000 = 9,000 XOF
  per demi-bâchée, 1,800,000 XOF a year, 9,000,000 XOF over the five modelled years. Against an
  800,000 XOF outlay the saving repays the machine inside the first year of the horizon — and had
  in fact already repaid it in the year before the horizon opens. That is the whole economics of
  the intervention, and it is why the digester is not a discretionary asset: not replacing it in
  Y5 would hand back 1,800,000 XOF a year of fuel cost.

  STEP 6 — LABOUR

  Nothing stated. Base case books 0. The consequence is explicit: EBITDA, NOPAT and FCFF below
  are pre-labour-remuneration flows, economically the ten women's collective earnings plus the
  return on the digester, not a return on capital after paying for work. Any user who wants an
  after-labour figure must subtract whatever the elicitation on drawings returns. I refuse to
  invent a wage: no market rate for Abobo attiéké work is deducible from these words.

  STEP 7 — EBITDA (per period, identical Y1 to Y5)

  Cash operating cost = 25,000,000 + 1,200,000 + 0 = 26,200,000 XOF.
  EBITDA = 35,000,000 - 26,200,000 = 8,800,000 XOF. Margin 25.1%.

  Unit cross-check: contribution per kilo = 350 - 250 - 12 = 88.00 XOF/kg;
  88 x 100,000 kg = 8,800,000. Agrees to the franc.

  STEP 8 — THE DIGESTER: COST, VINTAGE, DEPRECIATION, BOOK VALUE, REPLACEMENT

  Cost. The founder is precise that a project "helped" but that the 800,000 was "payé
  nous-mêmes". So there is no capital grant to recognise and nothing to net against the asset or
  defer into income (IAS 20 does not bite). Capitalised cost = 800,000 XOF, full stop. Had the
  project funded the machine, the whole depreciation and replacement logic below would still hold
  physically but the cash story would differ.

  Depreciation. Straight line over the stated five-year life, nil residual:
  800,000 / 5 = 160,000 XOF per year, in every one of Y1 to Y5.

  Sunk-cost discipline. The 800,000 was paid last year. It is NOT capex in this horizon. Only the
  replacement is.

  Net book value roll-forward. One year's depreciation has already been taken before Y1 opens, so
  opening NBV at Y1 = 800,000 - 160,000 = 640,000 XOF.
    Y1: 640,000 opening,  -160,000 depreciation, no capex -> 480,000 closing.
    Y2: 480,000 opening,  -160,000              , no capex -> 320,000 closing.
    Y3: 320,000 opening,  -160,000              , no capex -> 160,000 closing.
    Y4: 160,000 opening,  -160,000              , no capex ->       0 closing. The installed
        digester is exactly consumed at the end of Y4, which is what "tient cinq ans" from a
        one-year-old machine means.
    Y5:       0 opening, +800,000 replacement capex, -160,000 depreciation -> 640,000 closing.
  Total depreciation charged in-horizon 5 x 160,000 = 800,000; opening 640,000 plus capex 800,000
  less that 800,000 leaves the 640,000 closing. The roll-forward closes.

  Timing convention (DEFAULTED): the replacement enters service the day the old unit retires, i.e.
  at the start of Y5, so the 800,000 outflow is a Y5 cash flow and Y5 carries a full year of
  depreciation on the new unit. No half-year convention is used; the periods are annual and the
  physical handover is a single event.

  STEP 9 — EBIT (per period, identical Y1 to Y5)

  EBIT = 8,800,000 - 160,000 = 8,640,000 XOF.

  Note how small depreciation is: 160,000 on 35,000,000 of revenue, 1.60 XOF per finished kilo.
  This is a working-capital-light, capital-light, materials-heavy business. The digester matters
  through the fuel line, not through the asset base.

  STEP 10 — TAX, AND THE REGIME FRICTION

  The founder says nothing about tax, so this is the least secure input in the model and it is
  flagged ASSUMED, not inferred. At 35,000,000 XOF of turnover the atelier is far below the
  thresholds at which Ivorian corporate income tax on profit applies; a business of this size
  falls in the small-taxpayer bands, which levy a percentage of TURNOVER. I take 6% of turnover
  as the base case:

  Tax = 0.04 x 35,000,000 = 1,400,000 XOF per year, every year.

  The friction with the requested build is real and worth stating plainly. FCFF via NOPAT wants a
  tax computed on EBIT. A turnover tax is not that. Two consequences follow mechanically. First,
  the tax is invariant to profitability — it is charged whether the year is good or bad. Second,
  depreciation shields nothing: the 160,000 charge changes book profit but not the tax bill, so
  in this model D&A is entirely cash-neutral to FCFF (it is deducted at EBIT and added straight
  back), and the choice of depreciation method is immaterial to the answer. Under a profit-based
  regime that would not be true.

  I express the burden as an effective rate on EBIT for comparability only:
  2,100,000 / 8,640,000 = 24.3% of EBIT. A 6% turnover levy behaves, at this margin, like a
  roughly quarter-of-profit tax — and would behave far worse in a year of weak margins.

  Because the true regime is unknown, the untaxed case is not left as prose. It is carried as a
  fully traced parallel column (tax_zero_scenario, nopat_zero_tax, fcff_zero_tax) representing an
  unregistered atelier, and it is checked.

  STEP 11 — NOPAT (per period, identical Y1 to Y5)

  NOPAT = EBIT - tax = 8,640,000 - 2,100,000 = 6,540,000 XOF.
  Parallel untaxed column: NOPAT = 8,640,000 - 0 = 8,640,000 XOF.

  STEP 12 — CHANGE IN NET WORKING CAPITAL

  The founder gives no receivable, payable or inventory terms. But FCFF needs the CHANGE, not the
  level, and the change is determinable without knowing the level. The argument, step by step:

    (a) The atelier is an ongoing business — it was steaming with wood before, so whatever working
        capital the trade requires is already installed at the start of Y1. There is no ramp.
    (b) Volume is constant at 200 demi-bâchées a year across all five periods, and prices are
        constant.
    (c) Trade receivables, trade payables and inventory each scale with nominal activity at fixed
        terms. Constant activity at constant terms means each stock is constant.
    (d) Therefore net working capital is constant, and its change is zero in every forecast
        period, whatever its level happens to be.

  Note the sharp status of this: (a)-(d) is a deduction from stated facts. The additional claim
  that the LEVEL is zero is a normalisation I supplied, and it is flagged ASSUMED. It is
  presentational: because the change is zero, FCFF is completely insensitive to the level, and the
  elicitation on payment terms — which I still want answered — would change the balance sheet
  without changing a single FCFF figure in this trace.

  The physical facts support small working capital anyway: fresh attiéké cannot be stocked, and
  cassava root cannot be stocked either. So ΔNWC = 0 for Y1 to Y5, NWC held at 0.

  STEP 13 — CAPEX

  Capex Y1 = 0, Y2 = 0, Y3 = 0, Y4 = 0, Y5 = 800,000 (replacement digester).
  Nothing else in the utterance is a durable asset. The grating, pressing and sieving equipment,
  the steaming pots and the premises are never mentioned and are not conjured into existence here;
  they are flagged as omissions rather than guessed at.

  STEP 14 — FCFF, BASE CASE (FCFF = NOPAT + D&A - ΔNWC - capex)

    Y1: 6,540,000 + 160,000 - 0 -       0 = 6,700,000 XOF
    Y2: 6,540,000 + 160,000 - 0 -       0 = 6,700,000 XOF
    Y3: 6,540,000 + 160,000 - 0 -       0 = 6,700,000 XOF
    Y4: 6,540,000 + 160,000 - 0 -       0 = 6,700,000 XOF
    Y5: 6,540,000 + 160,000 - 0 - 800,000 = 5,900,000 XOF

  Five-year total 32,700,000 XOF. Read as an operating-plus-investing split: CFO is 6,700,000 in
  every year (NOPAT plus the depreciation add-back, no working-capital drag) and CFI is nil until
  the Y5 outflow of 800,000.

  Per woman, dividing by the stated headcount of ten: 670,000 XOF a year in Y1-Y4 and 590,000 in
  the replacement year — roughly 55,800 XOF a month per woman in a normal year. Since no wage was
  charged above, this IS what the ten women live on plus the return on the machine, not a surplus
  on top of pay. It is a sober number, and it is the single most important thing the model says.

  STEP 15 — FCFF, UNTAXED PARALLEL COLUMN

    Y1-Y4: 8,640,000 + 160,000 - 0 -       0 = 8,800,000 XOF
    Y5   : 8,640,000 + 160,000 - 0 - 800,000 = 8,000,000 XOF

  Five-year total 43,200,000 XOF. The gap to the base case is exactly the five years of turnover
  tax, 10,500,000 XOF, which is asserted as a check rather than left as an assertion in prose.
  In this column FCFF collapses to EBITDA less capex, which is what a no-tax, no-working-capital,
  no-financing business is.

  STEP 16 — WHAT WOULD MOVE THESE NUMBERS

  The model has one enormous exposure and it is not the digester. Cassava is 71.4% of the selling
  price. Contribution is 88 XOF on a 350 XOF kilo, so the whole enterprise lives in a 25-point
  band. A move in the cassava price of the order of a tenth, or an equivalent slip in the 500 kg
  yield per tonne, swings the entire cash flow far harder than the fuel line the intervention
  addressed. Direction only, no figures invented: the atelier is a cassava-price business wearing
  an energy-project label. The right next question after the elicitation list is not about biogas.


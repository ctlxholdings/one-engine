passage: |
  STEP 0 — Timeline & conventions
  - t=0 is the current operating year: the oven is now 6 years old, running through its 7th year.
  - t=1 is 'next year': at the START of t=1 the old oven is sold and the new oven is bought.
  - Horizon = 5 annual periods (t=0..4): one status-quo year, the replacement year, three new-oven years.
  - Operations flat (no stated growth or inflation) → all operating flows constant in nominal XOF.
  - Depreciation: straight-line, zero residual, FULL year in the addition year, NONE in the disposal year.
  - Tax: one corporate income-tax rate on total EBIT (operating EBIT + disposal gain). Unlevered → no interest.
  - Working capital: cash bakery, nothing stated → NWC = 0 every period → ΔNWC = 0.

  STEP 1 — Daily & annual operating flows (identical every period)
  - Revenue/day = 500 × 250 = 125,000 ; annual = 125,000 × 365 = 45,625,000.
  - Flour/day   = 500 × 150 =  75,000 ; annual =  75,000 × 365 = 27,375,000.
  - Gross profit = 45,625,000 − 27,375,000 = 18,250,000.
  - Labour = 2 × 100,000 × 12 = 2,400,000.
  - Rent   = 800,000 × 12 = 9,600,000.
  - Gas    = 200,000 × 12 = 2,400,000.
  - EBITDA = 18,250,000 − 2,400,000 − 9,600,000 − 2,400,000 = 3,850,000  (constant t=0..4).

  STEP 2 — Oven / PP&E roll-forward
  Old oven: cost 6,000,000, life 10y → 600,000/y. Age 6 now → accumulated 3,600,000; opening NBV = 2,400,000.
    t=0: depreciate 600,000 → closing NBV = 1,800,000 (oven now age 7).
    t=1: sold at start for 3,000,000; NBV at disposal = 1,800,000 → GAIN = 3,000,000 − 1,800,000 = 1,200,000;
         asset derecognised → NBV = 0. No old-oven depreciation in the disposal year.
  New oven: cost 8,000,000, assumed life 10y → 800,000/y, acquired start of t=1 (full-year dep in t=1).
    t=1 NBV = 8,000,000 − 800,000 = 7,200,000 ; t=2 = 6,400,000 ; t=3 = 5,600,000 ; t=4 = 4,800,000.
  Total D&A: t=0 = 600,000 ; t=1..4 = 800,000.
  Total PP&E closing NBV: 1,800,000 / 7,200,000 / 6,400,000 / 5,600,000 / 4,800,000.

  STEP 3 — EBIT, tax, NOPAT (tax_rate = 0.30)
  - Operating EBIT = EBITDA − D&A:  t=0 = 3,250,000 ; t=1..4 = 3,050,000.
  - Disposal gain (1,200,000) enters pre-tax profit ONLY at t=1 (IAS 16.68 — gain in P&L, not revenue).
  - EBIT_total: t=0 = 3,250,000 ; t=1 = 3,050,000 + 1,200,000 = 4,250,000 ; t=2..4 = 3,050,000.
  - Tax = 0.30 × EBIT_total: 975,000 / 1,275,000 / 915,000 / 915,000 / 915,000.
  - NOPAT = EBIT_total − tax:  2,275,000 / 2,975,000 / 2,135,000 / 2,135,000 / 2,135,000.

  STEP 4 — FCFF = NOPAT + D&A − ΔNWC − capex + proceeds − gain_on_disposal
  - t=0: 2,275,000 + 600,000 − 0 − 0 + 0 − 0 = 2,875,000.
  - t=1: 2,975,000 + 800,000 − 0 − 8,000,000 + 3,000,000 − 1,200,000 = −2,425,000.
  - t=2: 2,135,000 + 800,000 − 0 − 0 + 0 − 0 = 2,935,000.  (t=3, t=4 identical = 2,935,000)
  Why subtract the gain: NOPAT already holds the AFTER-tax gain [gain×(1−t)]; adding full cash proceeds and
  removing the full accounting gain leaves proceeds − t×gain = the true after-tax disposal cash. Equivalently
  '+proceeds − gain' collapses to '+ NBV disposed' (1,800,000) at t=1.

  STEP 5 — Independent cross-check (EBITDA path)
  FCFF = EBITDA×(1−t) + t×D&A − capex + proceeds − t×gain.
  - EBITDA×(1−t) = 3,850,000 × 0.70 = 2,695,000 (every period).
  - t=0: 2,695,000 + 0.30×600,000 = 2,875,000.  ✓
  - t=1: 2,695,000 + 0.30×800,000 − 8,000,000 + 3,000,000 − 0.30×1,200,000 = −2,425,000.  ✓
  - t=2..4: 2,695,000 + 0.30×800,000 = 2,935,000.  ✓
  Step from 2,875,000 (t=0) to 2,935,000 (t≥2) is exactly the extra depreciation tax shield 0.30×200,000 = 60,000.


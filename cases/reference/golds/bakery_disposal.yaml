checks:
  - "trace.revenue[t] == loaves_per_day * price_per_loaf * days_per_year"
  - "trace.flour_cost[t] == loaves_per_day * flour_per_loaf * days_per_year"
  - "trace.gross_profit[t] == trace.revenue[t] - trace.flour_cost[t]"
  - "trace.labor[t] == n_bakers * baker_wage * 12"
  - "trace.rent[t] == rent_month * 12"
  - "trace.gas[t] == gas_month * 12"
  - "trace.ebitda[t] == trace.gross_profit[t] - trace.labor[t] - trace.rent[t] - trace.gas[t]"
  - "max(trace.ebitda) - min(trace.ebitda) == 0"
  - "trace.dep_old[t] == oven_old_cost / oven_old_life for t < replace_period"
  - "trace.dep_old[t] == 0 for t >= replace_period"
  - "trace.dep_new[t] == oven_new_cost / oven_new_life for t >= replace_period"
  - "trace.dep_new[t] == 0 for t < replace_period"
  - "trace.dep_total[t] == trace.dep_old[t] + trace.dep_new[t]"
  - "trace.nbv_old_open[first] == oven_old_cost - oven_age_now * (oven_old_cost / oven_old_life)"
  - "trace.nbv_old_open[t] == trace.nbv_old_close[t-1] for t >= replace_period"
  - "trace.nbv_old_close[t] == trace.nbv_old_open[t] - trace.dep_old[t] - trace.nbv_disposed[t]"
  - "trace.nbv_disposed[t] == 0 for t < replace_period"
  - "sum(trace.nbv_disposed) == oven_old_cost - (oven_age_now + 1) * (oven_old_cost / oven_old_life)"
  - "trace.proceeds[t] == 0 for t < replace_period"
  - "sum(trace.proceeds) == disposal_proceeds"
  - "trace.gain_on_disposal[t] == trace.proceeds[t] - trace.nbv_disposed[t]"
  - "sum(trace.gain_on_disposal) == disposal_proceeds - (oven_old_cost - (oven_age_now + 1) * (oven_old_cost / oven_old_life))"
  - "trace.capex[t] == 0 for t < replace_period"
  - "sum(trace.capex) == oven_new_cost"
  - "trace.nbv_new_open[t] == trace.nbv_new_close[t-1]"
  - "trace.nbv_new_close[t] == trace.nbv_new_open[t] + trace.capex[t] - trace.dep_new[t]"
  - "trace.ppe_nbv_close[t] == trace.nbv_old_close[t] + trace.nbv_new_close[t]"
  - "trace.ebit_operating[t] == trace.ebitda[t] - trace.dep_total[t]"
  - "trace.ebit_total[t] == trace.ebit_operating[t] + trace.gain_on_disposal[t]"
  - "trace.tax[t] == trace.ebit_total[t] * tax_rate"
  - "trace.nopat[t] == trace.ebit_total[t] - trace.tax[t]"
  - "trace.nwc[t] == nwc_level"
  - "trace.delta_nwc[t] == trace.nwc[t] - trace.nwc[t-1]"
  - "trace.fcff[t] == trace.nopat[t] + trace.dep_total[t] - trace.delta_nwc[t] - trace.capex[t] + trace.proceeds[t] - trace.gain_on_disposal[t]"
  - "trace.fcff[t] == trace.ebitda[t] * (1 - tax_rate) + tax_rate * trace.dep_total[t] - trace.capex[t] + trace.proceeds[t] - tax_rate * trace.gain_on_disposal[t]"
  - "min(trace.revenue) >= 0"
  - "min(trace.gross_profit) >= 0"
  - "min(trace.ebitda) >= 0"
  - "min(trace.dep_total) >= 0"
  - "min(trace.nbv_old_close) >= 0"
  - "min(trace.nbv_new_close) >= 0"
  - "min(trace.ppe_nbv_close) >= 0"

notes:
  - "Currency: 'francs' inferred as CFA franc (XOF or XAF); country unspecified. Both pegged to EUR at the same rate, so the arithmetic is invariant to which."
  - "Tax rate 0.30 is ASSUMED (CFA-zone corporate income tax spread ~25%–33%). Qualitatively, the operating portion of FCFF scales with (1 − tax_rate): a higher rate lowers every period's FCFF; a lower rate raises it. Not a driver the founder supplied — the single largest external assumption."
  - "Disposal gain (1,200,000 at t=1) is taxed at the ordinary IS rate. Several Francophone/CGI-derived regimes grant plus-value professionnelle rollover/deferral when proceeds are reinvested — which they are here (new oven). If such relief applies, the gain is untaxed and t=1 FCFF improves by the tax otherwise levied on the gain. Deferred pending the jurisdiction."
  - "Completeness caveat — only STATED costs are modelled. Not mentioned, hence omitted (each would reduce EBITDA/FCFF): other ingredients (water, salt, yeast), electricity/water utilities, oven maintenance/repairs, packaging, delivery, licences, and crucially the OWNER'S OWN wage (the founder works daily but draws no stated salary). EBITDA of 3,850,000 is therefore a stated-cost ceiling, not a market-wage-adjusted figure."
  - "Residual value defaulted to 0 for both ovens. Tension: the old oven fetched 3,000,000 in resale at age 7, evidence that these assets retain material residual value. A positive residual on the NEW oven would lower its annual depreciation (smaller tax shield, slightly lower steady-state FCFF) and imply future disposal proceeds beyond this horizon."
  - "Timing convention: replacement at the START of t=1 → full-year depreciation on the new oven in t=1, none on the old oven in its disposal year. This pins NBV-at-disposal = 1,800,000 and gain = 1,200,000. A mid-year (half-year) convention would change the disposal-year depreciation and the gain."
  - "Working capital taken as 0 (cash bakery). Even a constant positive NWC yields ΔNWC = 0 under flat operations, so FCFF is unchanged except for an initial NWC build, which is not modelled (no opening balance stated)."
  - "Horizon note: steady-state FCFF of 2,935,000/y continues through the new oven's remaining life (to ~t=10) before the next replacement cycle. A valuation would append a terminal/continuing value from t=5 onward — outside the scope of this FCFF-generation exercise."
  - "Minimum turnover tax (impôt minimum forfaitaire, ~0.5% of turnover in several CFA states) is not binding here: IS on profit (≈915,000/y steady) exceeds any plausible turnover minimum on 45,625,000. Flagged, not applied."
  - "t=1 FCFF is negative (−2,425,000) purely because the 8,000,000 replacement capex lands in one year against 3,000,000 proceeds; the business is structurally cash-generative (≈2.9M/y) around it."

id: bakery-fcff-2026
title: "Unlevered FCFF (FCFF via NOPAT) — daily-cash bakery with oven replacement next year"
currency: "XOF"
grid:
  periods: 5
  freq: "annual"
  note: "t=0 = current operating year; t=1 = 'next year' (oven replacement); t=2..4 = new-oven steady state."

utterance:
  fr: |
    Moi je tiens une boulangerie. Je fais cinq cents pains par jour, vendus à deux cent
    cinquante francs pièce. La farine me coûte cent cinquante francs par pain. Je paie deux
    boulangers à cent mille par mois chacun, le loyer c'est huit cent mille par mois. Le gaz
    du four me revient à deux cent mille par mois. Je travaille tous les jours. Mon four, je
    l'ai payé six millions il y a six ans, on m'avait dit dix ans de durée. L'année prochaine
    je le remplace par un neuf à huit millions, et l'ancien, un revendeur me le reprend à
    trois millions.
  en: |
    I run a bakery. I make five hundred loaves a day, sold at two hundred fifty francs each.
    Flour costs me one hundred fifty francs per loaf. I pay two bakers a hundred thousand a
    month each, and the rent is eight hundred thousand a month. The oven gas runs me two
    hundred thousand a month. I work every day. My oven, I paid six million for it six years
    ago; they told me it would last ten years. Next year I replace it with a new one costing
    eight million, and a dealer takes the old one off me for three million.


    verified: "2026-07-27"

  cnss_family_rate:
    value: 0.09
    unit: "fraction of gross wages, employer-borne"
    prov: SOURCED
    authority: >-
      CLEISS, Le régime béninois de sécurité sociale — cotisations au Bénin, prestations familiales

  cotonou_portonovo_road_km_one_way:
    value: 40
    unit: "km"
    prov: SOURCED
    authority: >-
      Road distance Cotonou-Porto-Novo, quoted between 35 km and 47 km depending on route;
      https://fr.distance.to/Cotonou/Porto-Novo and
      https://www.distancede.com/bj/distance-entre-cotonou-et-porto-novo/HistoiredeDistance/386122.aspx
      A mid-range 40 km one way (80 km round trip) is used for the vehicle duty-cycle test.
    verified: "2026-07-27"

  min_cet_duty_rate:
    value: 0.05
    unit: "fraction of CIF value"
    prov: SOURCED
    authority: >-
      ECOWAS Common External Tariff as applied by Benin — five bands, 0%, 5%, 10%, 20% and 35%; the
      lowest non-zero band is 5% and the 0% band is reserved for essential social goods, which
      motorcycle wear parts are not. https://ecotis.projects.ecowas.int/faqs/tarif-exterieur-commun-de-la-cedeao-tec/?lang=fr
      and UEMOA TEC, https://www.uemoa.int/sites/default/files/bibliotheque/tarif-exterieur-commun-de-luemoa-du-17-janvier-2017.pdf
    verified: "2026-07-27"
    note: >-
      The specific HS 8714 tariff line was NOT verified to the digit. The finding it supports (F2)
      does not depend on which band applies — it only needs the band to be non-zero.

  eur_xof_parity:
    value: 655.957
    unit: "XOF per EUR"
    prov: SOURCED
    authority: >-
      Fixed parity of the Franc CFA (BCEAO, XOF) to the euro, 1 EUR = 655.957 XOF, unchanged since
      the euro's introduction. Used only to compare the stated freight cost with published freight
      benchmarks.
    verified: "2026-07-27"

  china_cotonou_40ft_freight_usd_low:
    value: 3000
    unit: "USD per 40ft container, port to port base ocean freight"
    prov: SOURCED
    authority: >-
      Published 2026 China-to-Cotonou FCL market rates, USD 3,000-5,200 for a 40ft from major Chinese
      ports, exclusive of surcharges, insurance and clearance;
      https://suaidglobal.com/insights/ocean-freight-rates-2026/ and
      https://www.dantful.com/how-much-does-shipping-from-china-to-benin-cost/
    verified: "2026-07-27"

  china_cotonou_40ft_freight_usd_high:
    value: 5200
    unit: "USD per 40ft container, port to port base ocean freight"
    prov: SOURCED
    authority: "As china_cotonou_40ft_freight_usd_low; https://suaidglobal.com/insights/ocean-freight-rates-2026/"
    verified: "2026-07-27"

  # --------------------------------------------------------------- ASSUMED
  packing_efficiency:
    value: 0.85
    unit: "fraction of container internal volume occupied by goods"
    prov: ASSUMED
    source: >-
      A prior I supplied. Standard FCL stuffing efficiency for mixed cartoned goods — nobody in this
      business measures it and it is not published for this trade lane. Used only in the store-space
      test, never in a money line.
    date: "2026-07-27"

  van_fuel_consumption_l_per_100km:
    value: 12
    unit: "litres per 100 km"
    prov: ASSUMED
    source: >-
      A prior I supplied. A light commercial delivery van in loaded urban and short-haul use. The
      founder could state his tank-to-tank consumption, but he did not, and the range across plausible
      vehicles is narrow enough that this does not merit displacing a higher-value question.
    date: "2026-07-27"

  van_lifetime_km_capacity:
    value: 250000
    unit: "km over the vehicle's economic life"
    prov: ASSUMED
    source: >-
      A prior I supplied. The distance a light commercial van can be expected to deliver before
      replacement. Used only for the cumulative-distance test (physical closure rule d).
    date: "2026-07-27"

  max_transactions_per_salesperson_per_day:
    value: 80
    unit: "counter transactions per salesperson per working day"
    prov: ASSUMED
    source: >-
      A prior I supplied. At a nine-hour trading day this is one served customer every 6.75 minutes
      sustained, which is the practical ceiling for a parts counter where each transaction involves
      identifying a part, fetching it and taking payment. Used only for the staff-throughput test.
    date: "2026-07-27"

  # ------------------------------------------------------------- DEFAULTED
  van_depreciation_method:
    value: "straight-line to zero residual"
    unit: "convention"
    prov: DEFAULTED
    source: >-
      IAS 16.60-62 — depreciate systematically over the useful life on the pattern in which the
      asset's benefits are consumed; straight-line in the absence of a better pattern. Zero residual
      because a delivery van in this service is normally run to the end.
    date: "2026-07-27"

  payables_policy:
    value: 0
    unit: "XOF of trade payables"
    prov: DEFAULTED
    source: >-
      The goods leg carries zero payables because the founder states 100% prepayment. Rent, wages and
      running costs are treated as settled within the period in which they are incurred (accrual =
      cash), the standard simplifying convention where no terms are stated. This is why the entire
      working capital of the business sits on the owner — see finding F8.
    date: "2026-07-27"

  tax_payment_convention:
    value: "accrued and paid in the period of accrual"
    unit: "convention"
    prov: DEFAULTED
    source: >-
      Unlevered FCFF convention — tax is computed at profit_tax_rate on EBIT, with no interest shield,
      and no instalment timing is modelled. Benin's AIB advance and the April 30 balancing declaration
      would shift cash between periods within the year but not the annual total.
    date: "2026-07-27"

  balance_measurement_convention:
    value: "end of period, after that period's flows"
    unit: "convention"
    prov: DEFAULTED
    source: >-
      All stock rows are closing balances. This is why implied inventory days sit slightly below half
      the stated sell-through duration: a container's last half-period of stock is measured after it
      has been sold, not before.
    date: "2026-07-27"

  # -------------------------------------------------------------- ELICITED
  realised_markup_on_landed:
    value: 0.70
    unit: "fraction above landed cost"
    prov: ELICITED
    source: >-
      Base case runs on his own figure, 0.70 — the omitting choice, because deducting a discount he
      did not mention would be inventing one. But he says "à peu près soixante-dix pour cent" and in
      the same breath says he gives the regular shops thirty days; trade credit in this market is
      normally priced. What I do not have is whether 70% is the price he asks or the price he
      averages after the discounts that go with credit terms and with volume. Everything downstream
      of revenue turns on this one number.
    question: >-
      Ce soixante-dix pour cent, c'est le prix que vous demandez au départ, ou c'est ce qui vous reste
      en moyenne une fois que vous avez fait le prix aux boutiques régulières et aux gros acheteurs ?
    range: {low: 0.40, high: 0.70}
    materiality: high
    date: "2026-07-27"

  vat_price_divisor:
    value: 1.00
    unit: "divisor applied to the marked-up price to reach a VAT-exclusive figure"
    prov: ELICITED
    source: >-
      Base case 1.00 — the model is run VAT-exclusive throughout, on the reading that he is registered
      (turnover is ~8.7x the 50,000,000 threshold), charges TVA on top of the prices he quotes, and
      recovers the import VAT he pays at the port. That reading is what makes his 7,000,000 port
      payment arithmetically possible (see import_vat_on_cif_floor). If instead the prices he quotes
      to mechanics are all-inclusive, the divisor is 1.18 and roughly a sixth of the revenue in this
      model is not his. This is a fact about his own invoicing that he can state in one sentence.
    question: >-
      Quand vous annoncez un prix à un mécanicien, est-ce que la TVA est déjà dedans, ou est-ce que
      vous la facturez en plus ? Et est-ce que vous récupérez la TVA que vous payez au port ?
    range: {low: 1.00, high: 1.18}
    materiality: high
    date: "2026-07-27"

  annual_obsolete_stock_at_cost:
    value: 2150000
    unit: "XOF of landed cost per year"
    prov: ELICITED
    source: >-
      Base case takes the literal reading of "dans les cinq pour cent d'un conteneur" — five percent
      of ONE container, 0.05 * 43,000,000, once a year. That is what the words say, and substituting a
      sector prior for the founder's own words would be the larger sin. But it implies an obsolescence
      rate of 0.83% of annual throughput, which is very low for a trade whose defining problem is
      that "les modèles changent". The other available reading — five percent of EACH of the six —
      gives 12,900,000 and is closer to what this trade normally carries. He can settle it instantly.
    question: >-
      Les pièces qui restent en fin d'année, c'est à peu près le contenu de cinq pour cent d'un seul
      conteneur — disons deux millions de marchandise — ou bien c'est cinq pour cent de chacun des six
      conteneurs de l'année, ce qui ferait plutôt treize millions ?
    range: {low: 2150000, high: 12900000}
    materiality: high
    date: "2026-07-27"

  dump_share_of_residue:
    value: 0.50
    unit: "fraction of the year-end residue actually sold at half price"
    prov: ELICITED
    source: >-
      He gives an "ou" — dumped at half price OR sitting on the shelf forever — and no split. Base
      case is an even one, because an even split is the only division the utterance itself supports.
      The two ends of the range are materially different: the dumped half recovers 85% of its cost,
      the shelved half recovers nothing and keeps occupying space forever.
    question: >-
      Sur ce qui vous reste en fin d'année, quelle part arrivez-vous vraiment à brader, et quelle part
      ne part jamais du tout et reste sur l'étagère ?
    range: {low: 0.20, high: 0.80}
    materiality: medium
    date: "2026-07-27"

  bad_debt_rate_per_period:
    value: 0.0
    unit: "fraction of the outstanding receivable balance lost per half-month"
    prov: ELICITED
    source: >-
      Carried at ZERO, and the zero is a statement, not a silence. He describes his credit customers
      as "les boutiques régulières" — regulars, therefore known — and reports no losses at all. The
      rate is applied to trace.receivables[t-1], the balance actually at risk, not to sales, so a
      non-zero answer would scale with the exposure rather than with turnover. Forty percent of a
      436-million turnover on thirty-day terms to small market shops is not a book that normally loses
      nothing, so the zero is a working value awaiting his answer, not a finding.
    question: >-
      Sur une année, l'argent que les boutiques vous doivent et que vous ne revoyez jamais, ça
      représente combien — rien du tout, ou une ou deux boutiques par an ?
    range: {low: 0.0, high: 0.02}
    materiality: medium
    date: "2026-07-27"

  inventory_shrinkage_rate_per_period:
    value: 0.0
    unit: "fraction of the inventory balance lost per half-month"
    prov: ELICITED
    source: >-
      Carried at ZERO, stated rather than passed over. Justification for the zero: his 70% markup and
      his 4-to-5-month sell-through are both reported as observed outcomes, so any quiet shrinkage is
      already inside them and charging it again would double-count. Against that, this is metal and
      rubber in a humid coastal store with four people handling it, and he never mentions a stock
      count. The rate acts on trace.inventory_total[t-1] — the quantity actually at risk, which falls
      as a container drains — rather than as a flat per-period charge.
    question: >-
      Quand vous comptez le stock dans le magasin et que vous le comparez à ce que vos cahiers disent,
      est-ce que ça tombe juste, ou est-ce qu'il manque toujours quelque chose ?
    range: {low: 0.0, high: 0.005}
    materiality: medium
    date: "2026-07-27"

  other_overheads_per_period:
    value: 75000
    unit: "XOF per half-month"
    prov: ELICITED
    source: >-
      1,800,000 a year, for the things a store of this size cannot operate without and that he did not
      list — electricity, water, telephone, a night guard, compulsory third-party motor insurance on
      the van (CIMA code), packaging, and municipal business charges. This is not the omitting choice:
      omitting would be zero, and zero is not available, because a store with no electricity and an
      uninsured van is not the business he described. He holds the answer exactly.
    question: >-
      En dehors du loyer, des salaires et des huit cent mille de la camionnette, qu'est-ce que vous
      payez chaque mois pour faire tourner le magasin — électricité, eau, téléphone, gardien,
      assurance de la camionnette, taxes de la mairie ?
    range: {low: 50000, high: 400000}
    materiality: medium
    date: "2026-07-27"

  owner_manager_cost_per_period:
    value: 150000
    unit: "XOF per half-month"
    prov: ELICITED
    source: >-
      300,000 a month, 3,600,000 a year, for the founder's own labour, which the utterance costs at
      nothing. He personally buys in Guangzhou, negotiates, clears customs and carries the credit
      decisions; asset-side cash flow that treats that labour as free is not the cash flow the asset
      generates, it is the cash flow the asset generates plus an uncosted full-time manager. The base
      sits above his storeman's 100,000 and well below what a manager running a 436-million-turnover
      import book would command. He can price his own replacement.
    question: >-
      Si demain vous deviez engager quelqu'un pour faire exactement votre travail — acheter en Chine,
      dédouaner, négocier avec les fournisseurs, décider à qui on fait crédit — vous devriez le payer
      combien par mois ?
    range: {low: 150000, high: 600000}
    materiality: medium
    date: "2026-07-27"

  share_of_landing_costs_prepaid_with_goods:
    value: 0.0
    unit: "fraction of freight, insurance, duty and port charges paid at order rather than at clearance"
    prov: ELICITED
    source: >-
      Base case zero — freight and duty paid at clearance, which is how duty always works and how
      separately-quoted freight usually works. He lists the goods at 32 million and then says "PLUS le
      fret", which reads as a separate invoice. If in fact he wires freight with the goods, another
      24 million a year spends an extra 2.5 months asleep.
    question: >-
      Le fret et l'assurance, vous les payez au moment du virement en Chine en même temps que la
      marchandise, ou seulement quand le conteneur arrive et que vous dédouanez ?
    range: {low: 0.0, high: 1.0}
    materiality: medium
    date: "2026-07-27"

  sell_through_periods:
    value: 9
    unit: "half-month periods to sell a container through"
    prov: ELICITED
    source: >-
      He gives a range, "quatre à cinq mois". Base is the midpoint, 4.5 months = 9 periods exactly on
      this grid. Materiality is low rather than absent because with a fixed six containers a year the
      sell-through duration moves the level of inventory and therefore the capital employed, but not
      the annual profit or, in a stationary year, the annual change in working capital.
    question: >-
      Pour un conteneur, entre le jour où vous l'ouvrez et le jour où la dernière pièce qui part
      normalement est vendue, c'est quatre mois ou cinq mois ?
    range: {low: 8, high: 10}
    materiality: low
    date: "2026-07-27"

  transit_loss_rate_per_period:
    value: 0.0
    unit: "fraction of the in-transit balance lost per half-month"
    prov: ELICITED
    source: >-
      Carried at ZERO, declared rather than omitted. Ocean containers on the China-West Africa lane do
      arrive short or wet, and a prepaid buyer with no supplier relationship has no practical recourse.
      The zero is justified only by the fact that his realised markup and sell-through are reported as
      outcomes, so any recurring shortage is already inside them.
    question: >-
      Est-ce qu'il vous arrive d'ouvrir un conteneur et de trouver des cartons manquants, mouillés ou
      cassés ? Sur les six conteneurs de l'année, ça représente à peu près quelle part de la valeur ?
    range: {low: 0.0, high: 0.006}
    materiality: low
    date: "2026-07-27"

  risques_professionnels_rate:
    value: 0.02
    unit: "fraction of gross wages, employer-borne"
    prov: ELICITED
    source: >-
      The CNSS occupational-risk contribution is set between 1% and 4% by branch of activity (CLEISS,
      https://www.cleiss.fr/docs/cotisations/benin.html); the band is a world-fact and is SOURCED, but
      which rate applies to HIS establishment is on his own CNSS notification and only he can read it.
      Base 2%, mid-band for warehousing and trade.
    question: >-
      Sur votre avis de cotisation CNSS, quel taux de risques professionnels est appliqué à votre
      entreprise ?
    range: {low: 0.01, high: 0.04}
    materiality: low
    date: "2026-07-27"

  container_internal_volume_m3:
    value: 67.7
    unit: "cubic metres of internal container capacity"
    prov: ELICITED
    source: >-
      Base case is a 40-foot dry container (67.7 m3 internal). The inference that points there is his
      own freight figure: 4,000,000 XOF is EUR 6,098 at the fixed parity, and published 2026
      port-to-port base rates from Chinese ports to Cotonou run USD 3,000-5,200 for a 40ft and
      materially less for a 20ft, so an all-in 4 million including surcharges and insurance fits a
      40-footer and is generous for a 20-footer. But it is his container and he knows which it is.
      Multiplied by packing_efficiency this drives the store-space test only, never a money line.
    question: "Vos conteneurs, ce sont des vingt pieds ou des quarante pieds ?"
    range: {low: 33.2, high: 67.7}
    materiality: medium
    date: "2026-07-27"

  store_usable_stock_volume_m3:
    value: 96.0
    unit: "cubic metres of store volume actually available for stock"
    prov: ELICITED
    source: >-
      Base 96 m3 = 80 m2 of floor, 2.4 m of usable stacking height, half the floor given up to aisles,
      the counter and circulation. It is a construction, not a measurement, and it exists only so the
      capacity assertion has something to be tested against. His annual rent of 1,200,000 over that
      area works out at about 1,250 XOF per square metre per month, which is low for a store trading
      into Dantokpa — so either the store is smaller than this and the stock does not fit, or the rent
      is a legacy one. See finding F5.
    question: >-
      Votre magasin fait combien de mètres carrés, et jusqu'à quelle hauteur vous empilez la
      marchandise ?
    range: {low: 40, high: 200}
    materiality: low
    date: "2026-07-27"

  van_fuel_share_of_running_cost:
    value: 0.60
    unit: "fraction of the 800,000 that is fuel rather than maintenance"
    prov: ELICITED
    source: >-
      He gives one number "entre carburant et entretien" and no split. Base 60/40 in favour of fuel,
      which is the usual shape for a low-mileage light van. Only used for the vehicle duty-cycle test.
    question: >-
      Sur les huit cent mille par an de la camionnette, il y a combien de carburant et combien
      d'entretien et de réparations ?
    range: {low: 0.40, high: 0.80}
    materiality: low
    date: "2026-07-27"

  average_ticket_xof:
    value: 15000
    unit: "XOF per counter transaction"
    prov: ELICITED
    source: >-
      Base 15,000 — a mechanic buying a chain and a set of pads. Used only to convert revenue into a
      number of customers served, so that the two salespeople can be tested against the throughput the
      model requires of them.
    question: >-
      Une vente moyenne à un mécanicien, ça fait combien — cinq mille francs, quinze mille, cinquante
      mille ?
    range: {low: 5000, high: 50000}
    materiality: low
    date: "2026-07-27"

  working_days_per_year:
    value: 300
    unit: "days"
    prov: ELICITED
    source: >-
      Base 300 — six days a week, which is how the Dantokpa trade runs. Used only in the staff
      throughput test alongside average_ticket_xof.
    question: "Le magasin ouvre combien de jours par semaine, et vous fermez combien de jours dans l'année ?"
    range: {low: 250, high: 340}
    materiality: low
    date: "2026-07-27"

  van_remaining_life_years:
    value: 5
    unit: "years"
    prov: ELICITED
    source: >-
      "J'ai une camionnette ACHETÉE quatre millions" — bought, past tense, date not given. Base case
      treats it as having its full five-year life ahead of it at t=0, which is the choice that puts the
      largest depreciation charge in the year and therefore does not flatter the profit. If it is
      already four years old, most of the 4,000,000 is spent and a replacement is imminent — which
      matters far more to a multi-year view than to this one.
    question: "La camionnette, vous l'avez achetée en quelle année, et elle a combien de kilomètres ?"
    range: {low: 1, high: 5}
    materiality: low
    date: "2026-07-27"

  legal_form:
    value: "entreprise individuelle"
    unit: "legal form"
    prov: ELICITED
    source: >-
      CANNOT BE WIRED INTO A CHECK, and the reason is a result rather than an evasion: at this level of
      profit the Beninese impôt sur les sociétés standard rate and the top marginal band of the IRPP
      scale are both 30%, so the legal form changes which return is filed and which minimum-perception
      rule applies, but not profit_tax_rate and therefore not a single number in the trace. It is
      recorded because the question would otherwise look unasked.
    question: >-
      Le commerce est enregistré à quel nom — c'est une entreprise individuelle à votre nom, ou une
      société, une SARL ?
    range: {low: "entreprise individuelle", high: "SARL"}
    materiality: low
    date: "2026-07-27"

passage: |
  ============================================================================
  0. WHAT KIND OF BUSINESS THIS IS, AND WHAT THAT MEANS FOR THE MODEL
  ============================================================================
  This is a pure trading operation. Nothing is manufactured; a container of Chinese motorcycle wear
  parts is bought, cleared, shelved and resold. There is therefore no yield in the manufacturing
  sense — but there IS a transformation, and it is the one that decides the answer: a quantity of
  landed goods becomes a quantity sold at the normal price, a quantity dumped at half price, and a
  quantity that never sells at all. Section 3 makes those three sum to the container.

  The operating unit the founder actually runs on is the CONTAINER, not the month and not the piece.
  He buys them, he counts them ("six conteneurs par an"), he times them ("quatre à cinq mois"), and
  he measures his dead stock in them ("cinq pour cent d'un conteneur"). Every quantity below is
  therefore carried in containers or in the landed cost of a container, and converted to money only
  at the last step.

  ============================================================================
  1. THE UNIT OF PURCHASE, AND WHAT ONE CONTAINER COSTS
  ============================================================================
  Goods, paid 100% before loading                     32,000,000
  Freight and insurance                                4,000,000
  Duties and port charges                              7,000,000
                                                     -----------
  Landed cost per container                           43,000,000
  Times six containers a year                        258,000,000  of landed purchases per year

  The founder defines his selling price against exactly this base — "soixante-dix pour cent au-dessus
  de ce qu'elle me coûte RENDUE AU MAGASIN" — so the 70% is applied to 43,000,000, not to 32,000,000.
  Applying it to the goods cost alone would overstate gross profit by 70% of 11,000,000 per container.

  Two frictions with standard line items, kept rather than forced:
  (a) The 43,000,000 is his "rendue au magasin" and it does NOT include the cost of moving the
      container from the port to the store, which sits inside the van's 800,000 and inside whatever
      haulage he does not mention. Landed cost is therefore very slightly understated and gross
      margin very slightly overstated.
  (b) The 7,000,000 is a single number covering duty, community levies, port charges and — if he is
      registered — the AIB advance. Section 8 tests it against the statutory structure and finds
      what it cannot contain.

  ============================================================================
  2. THE LATTICE — WHY EVERY LAG LANDS ON A WHOLE PERIOD
  ============================================================================
  Period = half a month, 24 in the year, t = 0..23.
    Payment to shelf         2.5 months  ->  5 periods
    Sell-through             4.5 months  ->  9 periods
    Between containers       2.0 months  ->  4 periods
    Customer credit          30 days     ->  2 periods
  Payments fall at t = 0, 4, 8, 12, 16, 20 (six a year). A container paid at t lands and starts
  selling at t+5, so landings inside the horizon come from the payments at t = -4, 0, 4, 8, 12, 16
  and fall at t = 1, 5, 9, 13, 17, 21 — again six. The business is already running, so period 0 opens
  with a balance sheet, not with nothing; section 7 states those opening balances and section 12
  shows the year closing on exactly the same ones.

  CONTAINERS AFLOAT. A container is in transit for 5 periods and one is paid every 4, so at any
  instant either two or one are afloat. The count runs 2,1,1,1 repeating, averaging 1.25 containers,
  which is 5/4 exactly — the transit length over the order interval. At 32,000,000 of prepaid goods
  each, that is 40,000,000 of the founder's money permanently at sea. This single line is his stated
  problem, in money.

  CONTAINERS SELLING. Each container sells over 9 periods and one lands every 4, so 2 or 3 are on the
  shelf selling at once: 3 in the periods where a new one lands (t = 1 mod 4), 2 otherwise. Over the
  year that is 6*3 + 18*2 = 54 container-periods = 6 containers * 9 periods exactly. Nothing is lost
  or double-counted in the overlap.

  ============================================================================
  3. PHYSICAL CLOSURE (a) — THE TRANSFORMATION, MADE TO SUM
  ============================================================================
  A container is 43,000,000 of landed cost. It becomes three things and nothing else:

    sold at the normal wholesale price   42,641,666.666667   99.166667%
    dumped at half price                    179,166.666667    0.416667%
    never sold, written down to nil         179,166.666667    0.416667%
                                        -----------------   ---------
                                         43,000,000.000000  100.000000%

  Derivation of the split. The founder says that at the end of a year he is left with "dans les cinq
  pour cent d'un conteneur", which on the literal reading is 0.05 * 43,000,000 = 2,150,000 of landed
  cost a year, spread across six containers = 358,333.333333 each. Half of that he brades, half sits
  forever (his "ou", split evenly for want of a stated division). The remaining 42,641,666.666667 per
  container is what actually moves at the normal price, and it is that figure — not the full
  43,000,000 — that is spread over the 9 selling periods:

    a = (43,000,000 - 358,333.333333) / 9 = 4,737,962.962963 per container per period

  so regular COGS is 2a = 9,475,925.925926 in an ordinary period and 3a = 14,213,888.888889 in a
  landing period. Over the year, 54a = 255,850,000, plus the 2,150,000 that goes through the year-end
  event, equals 258,000,000 — the whole of the year's purchases. The transformation closes.

  WHAT THE FOUNDER'S RATIOS ARE NET OF, said explicitly:
    - The 70% markup is on landed cost INCLUDING duty. It is NOT net of the 5% that does not sell, NOT
      net of any discount to the shops he gives thirty days to, NOT net of shrinkage, and — on the
      base-case reading — NOT inclusive of VAT. Each of those is a separate question above.
    - The 5% residue is stated as a year-END position. It is not said whether it is net of stock he
      already braded during the year, so the model treats the whole 5% as newly disposed of at the
      year end and does not also charge a running dump.

  WHERE THE MASS GOES. The written-off portion is written DOWN, not thrown away. Under IAS 2.9 stock
  is carried at the lower of cost and net realisable value, and stock that "reste sur l'étagère pour
  toujours" has a realisable value of nil — so its carrying value goes to zero while the parts stay
  physically on the shelf. The trace therefore carries dead_stock_cum at original cost as a memo, and
  section 6 includes it in the space the store has to find. A yield ratio that simply discarded it
  would have hidden a pile that grows by roughly a million francs of cost a year, forever.

  ============================================================================
  4. PHYSICAL CLOSURE (b) — EVERY STOCK DECLARES ITS LOSS
  ============================================================================
  Four things are held over time in this business. Each gets a rate, and each rate is applied to the
  balance actually at risk in that period, not as a flat charge:

    Goods afloat (transit_stock)     transit_loss_rate_per_period          = 0, applied to
                                     transit_stock[t-1]. Zero because his realised markup and
                                     sell-through are reported as outcomes, so any recurring shortage
                                     is already inside them. Question attached; range up to 0.6% per
                                     period.
    Shelf stock (inventory_total)    inventory_shrinkage_rate_per_period   = 0, applied to
                                     inventory_total[t-1], which falls as a container drains — so a
                                     non-zero answer would automatically charge less against a
                                     half-empty store than against a full one. Zero for the same
                                     reason, plus he never mentions a stock count. Question attached.
    Slow-moving pool (inventory_slow) The loss IS the obsolescence, and it is not zero: the whole
                                     pool is disposed of once a year, half at 85% of cost and half at
                                     nil. This is the only declared loss that carries a number.
    Receivables                      bad_debt_rate_per_period              = 0, applied to
                                     receivables[t-1]. Zero because he calls his credit customers
                                     "boutiques régulières" and reports no losses. Question attached.

  Three of the four are zero. That is a claim about this business, made deliberately and with the
  question kept attached to each, not a silence — and each is wired into a check, so a different
  answer moves the trace rather than a footnote.

  ============================================================================
  5. PHYSICAL CLOSURE (c) — DOES THE CLAIMED OUTPUT FIT THE PLANT DESCRIBED?
  ============================================================================
  THE VAN. Capacity is not the constraint here; the duty cycle is. Of the 800,000 a year, 60% is
  fuel = 480,000, which at the official pump price of 725 XOF/litre buys 662.07 litres a year. At 12
  litres per 100 km that is 5,517.24 km a year — 229.885058 km per half-month, 18 km per working day
  at 300 days. A Cotonou-Porto-Novo round trip is about 80 km. So the entire annual fuel budget pays
  for 68.97 Porto-Novo round trips and nothing else at all — no deliveries in Cotonou, no runs to the
  port, nothing to the rest of "tout le sud du pays". THE CLAIMED SERVICE AREA DOES NOT FIT INSIDE
  THE STATED RUNNING COST. This is reported as a finding (F4), not absorbed: either the 800,000
  understates what the van costs, or he buys informal cross-border fuel well below the official 725,
  or the van does far less than the utterance implies and customers collect.

  WHO DRIVES IT. Nobody. The payroll is two salespeople, a storeman and an apprentice; there is no
  driver, and the founder does not say he drives. Either one of the four is off the shop floor
  whenever the van moves — which takes a salesperson away from a counter that section 5 shows is
  already busy — or there is an undeclared fifth person. Finding F3.

  THE STAFF. Revenue of 435,858,750 at an average ticket of 15,000 is 29,057.25 counter transactions
  a year. Over 300 working days that is 96.86 a day, or 48.43 per salesperson per day — one every
  11.1 minutes over a nine-hour day. In the heaviest period of the model (a landing period) it peaks
  at 1,610.907407 transactions per half-month, which is 64.44 per salesperson per day, or one every
  8.4 minutes. That fits inside a busy parts counter, but not with room to spare, and it fits only
  while both salespeople are actually at the counter — see the driver point above. The check asserts
  the peak against a ceiling of 80 a day.

  THE STORE. Section 6.

  ============================================================================
  6. PHYSICAL CLOSURE (c, continued) — THE SPACE
  ============================================================================
  Steady-state stock peaks in the landing periods. At t = 21, the last landing period before the
  year-end clear-out, the store holds 57,572,222.222222 of active stock plus 2,149,999.999998 of
  slow-moving pool = 59,722,222.222220 at landed cost, which is 1.388889 containers. On the base-case
  reading of a 40-foot container (67.7 m3 internal, 85% stuffing) that is:

    1.388889 * 67.7 * 0.85 = 79.923611 cubic metres of goods on the floor.

  To hold 79.92 m3 you need, at 2.4 m of usable stacking and half the floor lost to aisles, the
  counter and circulation, about 66.6 m2 of stock floor and perhaps 80 m2 of store. His rent of
  1,200,000 a year over 80 m2 is about 1,250 XOF per square metre per month, which is cheap for a
  store trading into Dantokpa. So one of three things is true and he can say which: the store is
  bigger than the rent suggests, the rent is a legacy one, or the containers are 20-footers and
  everything in this paragraph halves. Reported as finding F5, with the check asserting the peak
  against store_usable_stock_volume_m3.

  Note what the dead pile does to this over time. It never leaves. Within this one year it adds only
  1,074,999.999999 of cost — about 1.4 m3 — but it is additive and permanent, so on the base-case
  reading the store loses roughly a cubic metre and a half of shelf a year, forever, and on the
  higher reading of the obsolescence question, four times that.

  ============================================================================
  7. THE OPENING BALANCE SHEET
  ============================================================================
  This is a going concern, so period 0 does not start empty. Steady state at t = -1:

    Goods afloat, one container prepaid              32,000,000
    Shelf stock, two containers part-sold            38,620,370.370370
      ( = 8a + 2 * 358,333.333333 )
    Slow-moving pool, just cleared at the year end             0
    Receivables, 40% of the last two periods' sales  13,252,759.259259
      ( = 0.40 * (17,022,824.074073 + 16,109,074.074074), those being the t=23 and t=22 revenues of
        the identical preceding year )
    Trade payables                                            0
                                                     ------------------
    Opening net working capital                      83,873,129.629629

  Payables are zero, and that is the whole shape of this business: the supplier takes 100% up front,
  the customers take 40% on thirty days, and there is nobody in between to carry any of it.

  ============================================================================
  8. TAX AND REGIME — ESTABLISHED, NOT ASSUMED
  ============================================================================
  Turnover on the base case is 435,858,750 a year.

  TPS. The Taxe Professionnelle Synthétique at 5% of receipts is reserved for enterprises below
  50,000,000 of annual turnover. This business is at 8.7 times that ceiling. IT IS NOT ON TPS, and
  the 5% receipts tax does not apply. Nor do the accessories that ride with it. Two consequences
  follow: the business falls under the régime du réel, and it is not exempt from the Versement
  Patronal sur Salaires (TPS taxpayers are; this one is not).

  TVA. The same 50,000,000 is the registration threshold. At 436 million the business is required to
  be registered and to charge TVA at 18%. The whole model is therefore run EXCLUSIVE of VAT: output
  VAT is collected on top of the prices modelled and remitted, input VAT at the port is recovered,
  and neither touches asset-side cash flow except through a timing effect that a stationary annual
  view suppresses. The alternative — that the prices he quotes are all-inclusive — is the single
  largest open question in this document (vat_price_divisor).

  THE 7,000,000, TESTED. It is 19.4444% of the 36,000,000 CIF value. Import VAT alone, at 18% on the
  bare CIF and ignoring the duty and levies that properly gross the base up, is 6,480,000. That
  leaves at most 520,000 — 1.44% of CIF — for every duty and levy combined, and the lowest non-zero
  ECOWAS CET band is 5%. THE STATED 7,000,000 CANNOT CONTAIN IMPORT VAT. It is a duty-and-levy
  figure. That is coherent with a registered trader who recovers his port VAT and does not think of
  it as a cost — which is the base case — and it is incoherent with an unregistered one. Finding F2.

  PROFITS TAX. 30%, applied to EBIT with no interest shield, per the unlevered convention. The rate
  is robust to the legal form: the standard IS rate is 30% and the top marginal band of the IRPP
  scale is also 30% (above 530,000 a month), and this operation's monthly profit is far above that.
  The minimum forfaitaire de perception (1.5% of turnover HT, floor 500,000) applies to loss-makers
  and does not bind — 1.5% of turnover is 6,537,881 against a computed charge of 49,499,097.

  PAYROLL CHARGES, which the founder's cost base omits entirely. On gross wages of 3,840,000:
    CNSS prestations familiales           9.0%
    CNSS vieillesse, part patronale       6.4%
    CNSS risques professionnels           2.0%   (band 1-4%; his own rate to be confirmed)
    Versement Patronal sur Salaires       4.0%   (CGI art. 211-215; not exempt, see TPS above)
                                        -------
    Total employer charge                21.4%   = 821,760 a year = 34,240 a half-month

  SMIG. The apprentice is paid 40,000 a month against a statutory SMIG of 52,000 for a 40-hour week.
  What the founder believes about his wage bill and what the rule says are different objects: unless
  the apprentice sits under a formal apprenticeship contract, that post is below the legal floor, and
  regularising it would raise the wage bill and every charge computed on it. Finding F6.


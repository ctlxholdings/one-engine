contract: "v2.6"
id: importer_prepayment_cotonou_moto_parts
title: "Cotonou motorcycle spare-parts wholesaler — unlevered FCFF over one stationary year at half-month resolution"
currency: XOF

grid:
  periods: 24
  freq: "half-month (24 per year; each period = 1/24 of a year = 15.208 days)"
  why: >-
    FREQUENCY. Every lag this business runs on is a whole number of half-months and none of them is a
    whole number of months — 2.5 months from the wire transfer to goods on the shelf (5 periods), 4.5
    months to sell a container through (9 periods), 2 months between container arrivals (4 periods),
    30 days of credit to the regular shops (2 periods). A monthly grid would force the 2.5-month
    prepayment lag — the single fact the founder names as his problem — to be rounded to 2 or 3
    months, moving the capital he has asleep by roughly a fifth of a container. A quarterly or annual
    grid nets the prepayment against itself and makes the drag vanish entirely. The half-month is the
    coarsest grid on which nothing has to be rounded.
    HORIZON. One year, because the founder's own accounting unit is the year — six containers a year,
    rent a year, van cost a year, "at the end of a year I'm left with about 5% of a container" — and
    because the obsolescence event is annual, so a shorter horizon would cut it in half. Not longer,
    because nothing in his account changes after year one — no growth, no new asset, no change of
    terms, no season stated. Year 2 as described reproduces year 1 exactly, and the model demonstrates
    that rather than asserting it: it closes on the same working-capital balance it opens on
    (trace.nwc[last] == nwc_opening_balance). And the one term the whole answer turns on — "they don't
    know me well enough to give me credit" — is by his own framing a relationship expected to change;
    a five-year projection would be projecting a supplier's opinion, not an operation.
    CONSEQUENCE, stated so a reader can disagree with it. A single stationary year contains no van
    replacement. Depreciation is therefore added back with no capex against it, which overstates the
    repeatable figure by exactly the annual depreciation charge. That is why trace carries
    fcff_normalised — FCFF with a replacement-capex accrual set equal to depreciation, which is the
    unbiased steady-state figure across the van's full cycle. Read trace.fcff for the year's actual
    asset-side cash and trace.fcff_normalised for what repeats.

utterance:
  fr: >-
    Je suis grossiste en pièces détachées de moto à Cotonou. Je vends aux mécaniciens et aux petites
    boutiques de Dantokpa et de tout le sud du pays. Plaquettes, chaînes, pignons, filtres, bougies,
    tout ce qui s'use sur les motos chinoises et indiennes qu'on a ici.
    Mon problème c'est le fournisseur. J'achète en Chine, à Guangzhou. Eux, ils ne me connaissent pas
    assez pour me faire crédit : je dois payer cent pour cent avant qu'ils chargent le conteneur.
    Après il faut compter huit à dix semaines entre le virement et le jour où je sors la marchandise
    du port. Donc mon argent dort pendant deux mois et demi avant même de commencer à vendre. Un
    conteneur me coûte trente-deux millions de marchandise, plus le fret et l'assurance quatre
    millions, plus les droits de douane et les taxes au port — là-dessus je paie autour de sept
    millions. Je fais venir six conteneurs par an.
    Le conteneur, je le vends en gros quatre à cinq mois. Mes clients à moi, les mécaniciens, ils
    paient comptant pour la plupart, mais les boutiques régulières je leur fais trente jours. Ça fait
    peut-être quarante pour cent de mes ventes à crédit. Je vends la marchandise à peu près à
    soixante-dix pour cent au-dessus de ce qu'elle me coûte rendue au magasin.
    Il y a toujours des pièces qui ne partent pas. Les modèles changent, les mécaniciens ne veulent
    plus. À la fin d'une année il me reste dans les cinq pour cent d'un conteneur que je finis par
    brader à moitié prix, ou qui reste sur l'étagère pour toujours.
    J'ai un magasin à un million deux cent mille par an de loyer, deux vendeurs à quatre-vingt-dix
    mille par mois, un magasinier à cent mille, et un apprenti à quarante mille. J'ai une camionnette
    achetée quatre millions pour les livraisons en ville et vers Porto-Novo, elle me coûte huit cent
    mille par an entre carburant et entretien.
  en: >-
    I'm a wholesaler of motorcycle spare parts in Cotonou. I sell to mechanics and to the small shops
    in Dantokpa and across the whole south of the country. Brake pads, chains, sprockets, filters,
    spark plugs — everything that wears out on the Chinese and Indian motorcycles we have here.
    My problem is the supplier. I buy in China, in Guangzhou. They don't know me well enough to give
    me credit: I have to pay a hundred percent before they load the container. Then you have to count
    eight to ten weeks between the transfer and the day I get the goods out of the port. So my money
    sits idle for two and a half months before I even start selling. A container costs me thirty-two
    million in goods, plus four million freight and insurance, plus customs duties and port taxes —
    on that I pay around seven million. I bring in six containers a year.
    A container takes four to five months to sell through wholesale. My own customers, the mechanics,
    mostly pay cash, but the regular shops I give thirty days. That's maybe forty percent of my sales
    on credit. I sell the goods at about seventy percent above what they cost me landed in the store.
    There are always parts that don't move. Models change, the mechanics don't want them any more. At
    the end of a year I'm left with about five percent of a container that I end up dumping at half
    price, or that sits on the shelf forever.
    I have a store at one million two hundred thousand a year in rent, two salespeople at ninety
    thousand a month, a storeman at a hundred thousand, and an apprentice at forty thousand. I have a
    van bought for four million for deliveries around town and out to Porto-Novo; it costs me eight
    hundred thousand a year between fuel and maintenance.

inputs:

  # ---------------------------------------------------------------- STATED
  goods_cost_per_container:
    value: 32000000
    unit: "XOF per container"
    prov: STATED
    source: >-
      "Un conteneur me coûte trente-deux millions de marchandise" / "A container costs me thirty-two
      million in goods". This is the supplier invoice, paid in full before loading.
    date: "2026-07-27"

  freight_insurance_per_container:
    value: 4000000
    unit: "XOF per container"
    prov: STATED
    source: >-
      "plus le fret et l'assurance quatre millions" / "plus four million freight and insurance".
    date: "2026-07-27"

  duties_port_per_container:
    value: 7000000
    unit: "XOF per container"
    prov: STATED
    source: >-
      "plus les droits de douane et les taxes au port — là-dessus je paie autour de sept millions".
      Taken at his figure. See notes finding F2 — this amount cannot contain import VAT.
    date: "2026-07-27"

  containers_per_year:
    value: 6
    unit: "containers per year"
    prov: STATED
    source: '"Je fais venir six conteneurs par an."'
    date: "2026-07-27"

  supplier_prepayment_fraction:
    value: 1.0
    unit: "fraction of goods cost paid before shipment"
    prov: STATED
    source: >-
      "je dois payer cent pour cent avant qu'ils chargent le conteneur" — 100% prepayment, hence
      trade payables of zero on the goods leg.
    date: "2026-07-27"

  port_transit_weeks_low:
    value: 8
    unit: "weeks from wire transfer to goods leaving the port"
    prov: STATED
    source: '"il faut compter huit à dix semaines entre le virement et le jour où je sors la marchandise du port"'
    date: "2026-07-27"

  port_transit_weeks_high:
    value: 10
    unit: "weeks from wire transfer to goods leaving the port"
    prov: STATED
    source: '"huit à dix semaines"'
    date: "2026-07-27"

  money_asleep_months:
    value: 2.5
    unit: "months from wire transfer to first sale"
    prov: STATED
    source: >-
      "mon argent dort pendant deux mois et demi avant même de commencer à vendre". Note this is
      longer than his own 8-10 weeks (1.84-2.30 months) to port exit, which is coherent — clearing,
      haulage to the store and shelving sit between port exit and first sale.
    date: "2026-07-27"

  credit_sales_fraction:
    value: 0.40
    unit: "fraction of sales value on credit"
    prov: STATED
    source: '"Ça fait peut-être quarante pour cent de mes ventes à crédit."'
    date: "2026-07-27"

  credit_terms_days:
    value: 30
    unit: "days"
    prov: STATED
    source: '"les boutiques régulières je leur fais trente jours"'
    date: "2026-07-27"

  rent_per_year:
    value: 1200000
    unit: "XOF per year"
    prov: STATED
    source: '"J''ai un magasin à un million deux cent mille par an de loyer"'
    date: "2026-07-27"

  n_salespeople:
    value: 2
    unit: "people"
    prov: STATED
    source: '"deux vendeurs à quatre-vingt-dix mille par mois"'
    date: "2026-07-27"

  salesperson_wage_monthly:
    value: 90000
    unit: "XOF per month per person"
    prov: STATED
    source: '"deux vendeurs à quatre-vingt-dix mille par mois"'
    date: "2026-07-27"

  storeman_wage_monthly:
    value: 100000
    unit: "XOF per month"
    prov: STATED
    source: '"un magasinier à cent mille"'
    date: "2026-07-27"

  apprentice_wage_monthly:
    value: 40000
    unit: "XOF per month"
    prov: STATED
    source: >-
      "et un apprenti à quarante mille". Below the statutory SMIG — see smig_monthly and notes
      finding F6.
    date: "2026-07-27"

  van_cost:
    value: 4000000
    unit: "XOF"
    prov: STATED
    source: '"J''ai une camionnette achetée quatre millions pour les livraisons"'
    date: "2026-07-27"

  van_running_cost_per_year:
    value: 800000
    unit: "XOF per year"
    prov: STATED
    source: >-
      "elle me coûte huit cent mille par an entre carburant et entretien" — fuel and maintenance
      only. No driver wage, no insurance, no tyres named separately.
    date: "2026-07-27"

  # -------------------------------------------------------------- INFERRED
  landed_cost_per_container:
    value: 43000000
    unit: "XOF per container"
    prov: INFERRED
    source: >-
      goods_cost_per_container + freight_insurance_per_container + duties_port_per_container =
      32,000,000 + 4,000,000 + 7,000,000. The founder himself defines his markup base as the cost
      "rendue au magasin" (landed in the store), and these are the three components he names.
    date: "2026-07-27"

  annual_landed_purchases:
    value: 258000000
    unit: "XOF per year"
    prov: INFERRED
    source: "landed_cost_per_container * containers_per_year = 43,000,000 * 6."
    date: "2026-07-27"

  prepay_to_shelf_lag_periods:
    value: 5
    unit: "half-month periods"
    prov: INFERRED
    source: >-
      money_asleep_months = 2.5 months; the grid period is half a month; 2.5 / 0.5 = 5 periods
      exactly. No new information enters. Consistency check against his other statement — 8-10 weeks
      to port exit is 1.84-2.30 months, leaving 0.20-0.66 months for clearing, haulage and shelving.
    date: "2026-07-27"

  container_order_interval_periods:
    value: 4
    unit: "half-month periods"
    prov: INFERRED
    source: >-
      containers_per_year = 6 at an even cadence, so 24 periods / 6 = 4 periods (2 months) between
      payments. Evenness is the only regular pattern the utterance supports; no season is stated.
    date: "2026-07-27"

  credit_period_periods:
    value: 2
    unit: "half-month periods"
    prov: INFERRED
    source: "credit_terms_days = 30 days = 1 month = 2 half-month periods."
    date: "2026-07-27"

  cash_sales_fraction:
    value: 0.60
    unit: "fraction of sales value collected in the period of sale"
    prov: INFERRED
    source: >-
      1 - credit_sales_fraction. "les mécaniciens, ils paient comptant pour la plupart" — the
      complement of the 40% he puts on credit.
    date: "2026-07-27"

  wages_per_period:
    value: 160000
    unit: "XOF per half-month"
    prov: INFERRED
    source: >-
      (2 * 90,000 + 100,000 + 40,000) = 320,000 per month gross = 160,000 per half-month;
      3,840,000 per year.
    date: "2026-07-27"

  rent_per_period:
    value: 50000
    unit: "XOF per half-month"
    prov: INFERRED
    source: "rent_per_year / 24 = 1,200,000 / 24."
    date: "2026-07-27"

  van_running_per_period:
    value: 33333.333333
    unit: "XOF per half-month"
    prov: INFERRED
    source: "van_running_cost_per_year / 24 = 800,000 / 24 (repeating decimal carried to 6 dp)."
    date: "2026-07-27"

  residue_per_container:
    value: 358333.333333
    unit: "XOF of landed cost per container"
    prov: INFERRED
    source: >-
      annual_obsolete_stock_at_cost / containers_per_year = 2,150,000 / 6 (repeating decimal carried
      to 6 dp). This is the portion of each container that leaves the normal sell-through and enters
      the slow-moving pool.
    date: "2026-07-27"

  dump_price_factor:
    value: 0.50
    unit: "fraction of the normal selling price"
    prov: INFERRED
    source: >-
      "que je finis par brader à moitié prix" — half PRICE, and the only price he has named is his
      selling price (landed cost + 70%). So dumped goods realise 0.50 * 1.70 = 0.85 of landed cost, a
      15% loss on cost rather than a 50% one. The alternative reading (half of COST) is recorded in
      notes finding F9.
    date: "2026-07-27"

  van_opening_nbv:
    value: 4000000
    unit: "XOF"
    prov: INFERRED
    source: >-
      van_cost, on the base-case answer to van_remaining_life_years that the van is treated as
      unused at t=0. If the van is older the opening NBV is lower and so is the depreciation charge.
    date: "2026-07-27"

  transit_opening_balance:
    value: 32000000
    unit: "XOF"
    prov: INFERRED
    source: >-
      Steady state at t=-1: with a payment every 4 periods and a 5-period transit, either one or two
      containers are afloat; at t=-1 (three periods after a payment) exactly one is, carrying
      goods_cost_per_container.
    date: "2026-07-27"

  inv_active_opening_balance:
    value: 38620370.370370
    unit: "XOF"
    prov: INFERRED
    source: >-
      Steady state at t=-1 = 8*a + 2*residue_per_container where a = (landed_cost_per_container -
      residue_per_container) / sell_through_periods = 4,737,962.962963. Two containers are part-sold
      at t=-1, with 8 container-periods of unsold full-price stock between them plus their two
      untouched residues.
    date: "2026-07-27"

  receivables_opening_balance:
    value: 13252759.259259
    unit: "XOF"
    prov: INFERRED
    source: >-
      credit_sales_fraction * (revenue of period -1 + revenue of period -2). The prior year is
      identical to this one, so those are the t=23 and t=22 revenues: 0.40 * (17,022,824.074073 +
      16,109,074.074074).
    date: "2026-07-27"

  nwc_opening_balance:
    value: 83873129.629629
    unit: "XOF"
    prov: INFERRED
    source: >-
      transit_opening_balance + inv_active_opening_balance + 0 (the slow pool is cleared at each year
      end) + receivables_opening_balance - 0 payables.
    date: "2026-07-27"

  port_charge_rate_on_cif:
    value: 0.194444444444
    unit: "fraction of CIF value"
    prov: INFERRED
    source: >-
      duties_port_per_container / (goods_cost_per_container + freight_insurance_per_container) =
      7,000,000 / 36,000,000. Used only to test the founder's port payment against the statutory
      import charge structure.
    date: "2026-07-27"

  import_vat_on_cif_floor:
    value: 6480000
    unit: "XOF per container"
    prov: INFERRED
    source: >-
      vat_standard_rate * (goods_cost_per_container + freight_insurance_per_container) = 0.18 *
      36,000,000. This is the SMALLEST possible import VAT charge, because the real VAT base is CIF
      grossed up by duty and community levies. It leaves at most 520,000 XOF (1.44% of CIF) of the
      stated 7,000,000 for all duties and levies, which is below any non-exempt CET band. Hence
      finding F2.
    date: "2026-07-27"

  # --------------------------------------------------------------- SOURCED
  tps_turnover_ceiling:
    value: 50000000
    unit: "XOF of annual turnover"
    prov: SOURCED
    authority: >-
      République du Bénin, Code Général des Impôts — the Taxe Professionnelle Synthétique regime is
      reserved for enterprises with annual turnover below 50,000,000 FCFA and no longer covers
      taxpayers falling under the impôt sur les sociétés. Confirmed at
      https://www.village-justice.com/articles/benin-nouveau-code-general-des-impots,42296.html
      (commentary on the CGI instituted by loi n°2021-15 du 23 décembre 2021) and at
      https://benin.eregulations.org/procedure/1200 . CGI 2026 text at
      https://api.impots.bj/media/6984ebbbb7bc0_Bénin-Code%20Général%20des%20Impôts%202026.pdf
    verified: "2026-07-27"

  tps_rate:
    value: 0.05
    unit: "fraction of annual receipts"
    prov: SOURCED
    authority: >-
      fact_id BJ-V25-01. République du Bénin, Code Général des Impôts, édition 2026 (intégrant la loi
      de finances pour la gestion 2026, loi n°2025-22 du 8 décembre 2025), Livre 1, Titre 3, Chapitre
      1, Article 183-1.
    verified: "2026-07-27"
    note: >-
      RECORDED, NOT APPLIED. This business's turnover is roughly 8.7 times the 50,000,000 ceiling, so
      it cannot be on TPS. Carried here because establishing that it does NOT apply is a result, not
      an omission. See finding F1.

  annex_vat_rate_applicable_moto:
    value: 0.0
    unit: "fraction"
    prov: SOURCED
    authority: >-
      fact_id BJ-V25-07. Code Général des Impôts du Bénin, édition 2026, Articles 226, 228 et 229-1
      (modifiés par les lois de finances pour 2023 et 2025).
    verified: "2026-07-27"
    note: >-
      RECORDED AND REJECTED FOR THIS BUSINESS. A 0% applicable VAT rate is a fact about a small
      moto-taxi operator below the registration threshold. It is not a fact about a spare-parts
      wholesaler turning over ~436 million XOF. Applying it here would be the single largest error
      available in this problem. See finding F2 and vat_standard_rate.

  vat_standard_rate:
    value: 0.18
    unit: "fraction"
    prov: SOURCED
    authority: >-
      République du Bénin, Code Général des Impôts — standard TVA rate 18%, unchanged for 2026; see
      https://www.auditiaafrica.com/actualites/37 (Bénin 2026 — TVA, IS et obligations déclaratives,
      citing Articles 221-225 and 248 bis CGI) and the DGI list of VAT-liable enterprises at
      https://www.impots.finances.gouv.bj/la-dgi-publie-la-liste-des-entreprises-assujetties-a-la-tva/
    verified: "2026-07-27"

  vat_registration_turnover_threshold:
    value: 50000000
    unit: "XOF of annual turnover"
    prov: SOURCED
    authority: >-
      Direction Générale des Impôts du Bénin — only enterprises with turnover above 50,000,000 FCFA
      that are up to date with their obligations and appear on the published list are entitled to
      charge TVA;
      https://www.impots.finances.gouv.bj/la-dgi-publie-la-liste-des-entreprises-assujetties-a-la-tva/
    verified: "2026-07-27"

  profit_tax_rate:
    value: 0.30
    unit: "fraction of taxable profit"
    prov: SOURCED
    authority: >-
      République du Bénin — standard impôt sur les sociétés rate of 30% (reduced 25% rate reserved
      for industrial companies and private schools, neither of which this is);
      https://uggcafrica.com/fr/investir-au-benin-ohada/ and
      https://www.auditiaafrica.com/actualites/37 . The rate is robust to the legal form: the top
      marginal band of the Beninese IRPP scale on business/salary income is also 30%, applying above
      530,000 XOF per month (https://blog.uptimise.io/tout-savoir-sur-les-retenues-sur-salaires-au-benin/),
      and this operation's monthly profit is far above that band.
    verified: "2026-07-27"

  mfp_rate_loss_making:
    value: 0.015
    unit: "fraction of turnover excluding tax"
    prov: SOURCED
    authority: >-
      Bénin, loi de finances 2026 — the minimum forfaitaire de perception rises from 1% to 1.5% of
      turnover HT for loss-making companies, with a floor of 500,000 FCFA (Article 55 CGI);
      https://www.auditiaafrica.com/actualites/37
    verified: "2026-07-27"
    note: "RECORDED, NOT BINDING. The operation is profitable in every period of the trace."

  mfp_floor:
    value: 500000
    unit: "XOF per year"
    prov: SOURCED
    authority: "Bénin, loi de finances 2026, Article 55 CGI; https://www.auditiaafrica.com/actualites/37"
    verified: "2026-07-27"

  vps_rate:
    value: 0.04
    unit: "fraction of gross wages, employer-borne"

  claimed here.

  Independently, the whole FCFF array is reproduced by the DIRECT method, which touches none of the
  accrual machinery. For t=1, a landing period:
    Collections on prior credit sales             6,809,129.629629
    Cash sales, 60% of 24,163,611.111111         14,498,166.666667
    Cash in                                      21,307,296.296296
    Freight and duty paid at clearance          -11,000,000.000000
    Operating cash costs                            -502,573.333333
    Tax                                          -2,824,144.666667
                                                 -----------------
    Cash flow                                     6,980,578.296296   = trace.fcff[1]
  And for t=0, a payment period:
    Cash in                                      16,109,074.074074
    Prepayment to Guangzhou                     -32,000,000.000000
    Operating cash costs                            -502,573.333333
    Tax                                          -1,829,172.444445
                                                 -----------------
    Cash flow                                   -18,222,671.703704   = trace.fcff[0]
  The identity holds in all 24 periods and is asserted as a check. An engine that reproduced the
  headline by a different route would have to satisfy it too.

  ============================================================================
  13. PHYSICAL CLOSURE (d) — THE CUMULATIVE TEST AGAINST THE WORLD
  ============================================================================
  Distance. The per-period figure of 229.885058 km looks unremarkable. Cumulated it is 5,517.24 km a
  year and, over the five-year life the depreciation charge assumes, 27,586.21 km. A light commercial
  van is built for something of the order of 250,000 km. So the van will be written off to nil having
  covered about 11% of what it could deliver: the five-year life is a convention about age and
  condition, not about wear, and the depreciation charge is not a usage charge. The check asserts the
  lifetime distance against the vehicle's capability, and it passes with enormous room — which is
  itself the finding, because it says the fuel budget, not the vehicle, is what limits the delivery
  service, and that returns us to F4.

  Throughput. Cumulated tonnage is not computable without a weight the founder never gives, so it is
  not asserted. What is asserted cumulatively is the container count (6 paid, 6 landed), the
  container-periods of selling (54 = 6 * 9), the closure of purchases into the three disposal routes
  (258,000,000 in, 258,000,000 out), and the residue transfers into the year-end clearance
  (6 * 358,333.333333 = the amount disposed of).

  ============================================================================
  14. WHERE THIS NUMBER SHOULD NOT BE BELIEVED
  ============================================================================
  FCFF of 116,297,893 on average capital employed of 102,545,291.67 is a return of 113.4% a year, on
  an operation whose founder describes himself as cash-squeezed. Those two statements are not
  compatible. A business earning 116 million a year of unlevered free cash on 103 million of capital
  would fund its entire working capital out of one year's cash flow, and the supplier's refusal of
  credit would have stopped being the binding problem some time ago.

  The arithmetic above is internally exact — it closes, it reconciles by two independent methods, and
  it repeats. It is nevertheless describing a business that, as described, cannot be the one making
  the complaint. The discrepancy is not in the mechanics; it is in the inputs, and it is concentrated
  in the three questions marked high: whether the 70% is asked or realised, whether the prices are
  VAT-inclusive, and whether the dead stock is 5% of one container or of six. Those three, answered,
  would move this number more than everything else in the document combined. That is what the
  materiality ranking is for.


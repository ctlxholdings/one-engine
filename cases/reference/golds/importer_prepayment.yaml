checks:

  # ---- conservation: stocks roll forward ---------------------------------
  - "trace.transit_stock[t] == trace.transit_stock[t-1] + trace.transit_opening[t] + trace.prepayment_cash[t] - trace.transit_out[t] - trace.transit_loss[t]"
  - "trace.inventory_active[t] == trace.inventory_active[t-1] + trace.inv_active_opening[t] + trace.landed_in[t] - trace.cogs_regular[t] - trace.residue_transfer[t] - trace.inventory_shrinkage[t]"
  - "trace.inventory_slow[t] == trace.inventory_slow[t-1] + trace.residue_transfer[t] - trace.obsolescence_out[t]"
  - "trace.inventory_total[t] == trace.inventory_active[t] + trace.inventory_slow[t]"
  - "trace.dead_stock_cum[t] == trace.dead_stock_cum[t-1] + trace.cogs_writeoff[t]"
  - "trace.receivables[t] == trace.receivables[t-1] + trace.receivables_opening[t] + trace.credit_sales[t] - trace.collections[t] - trace.bad_debt[t]"
  - "trace.van_nbv == van_opening_nbv - cumsum(trace.dep) + cumsum(trace.capex)"
  - "cumsum(trace.delta_nwc) + nwc_opening_balance == trace.nwc"
  - "trace.van_km_cum == cumsum(trace.van_km)"

  # ---- conservation: the year closes and repeats -------------------------
  - "trace.nwc[last] == nwc_opening_balance"
  - "sum(trace.delta_nwc) == 0"
  - "trace.transit_stock[last] == transit_opening_balance"
  - "trace.inventory_active[last] == inv_active_opening_balance"
  - "trace.receivables[last] == receivables_opening_balance"

  # ---- conservation: the transformation closes (physical closure a) ------
  - "sum(trace.cogs_regular) + sum(trace.cogs_dump) + sum(trace.cogs_writeoff) + sum(trace.inventory_shrinkage) == sum(trace.landed_in) + inv_active_opening_balance - trace.inventory_total[last]"
  - "sum(trace.residue_transfer) == sum(trace.obsolescence_out)"
  - "trace.obsolescence_out[t] == trace.cogs_dump[t] + trace.cogs_writeoff[t]"
  - "sum(trace.obsolescence_out) == annual_obsolete_stock_at_cost"
  - "sum(trace.prepayment_cash) + transit_opening_balance == sum(trace.transit_out) + trace.transit_stock[last] + sum(trace.transit_loss)"
  - "sum(trace.containers_paid) == containers_per_year"
  - "sum(trace.containers_landed) == containers_per_year"
  - "sum(trace.containers_in_transit) == containers_per_year * prepay_to_shelf_lag_periods"
  - "sum(trace.containers_selling) == containers_per_year * sell_through_periods"
  - "sum(trace.prepayment_cash) + sum(trace.cash_landing_costs) == containers_per_year * landed_cost_per_container"
  - "sum(trace.credit_sales) == sum(trace.collections) + trace.receivables[last] - receivables_opening_balance + sum(trace.bad_debt)"

  # ---- definition: the operating ladder ----------------------------------
  - "trace.revenue == trace.revenue_full + trace.revenue_dump"
  - "trace.cogs_total == trace.cogs_regular + trace.cogs_dump + trace.cogs_writeoff"
  - "trace.gross_profit == trace.revenue - trace.cogs_total"
  - "trace.ebitda == trace.gross_profit - trace.opex_total"
  - "trace.ebit == trace.ebitda - trace.dep"
  - "trace.tax == profit_tax_rate * trace.ebit"
  - "trace.nopat == trace.ebit - trace.tax"
  - "trace.stock_losses == trace.transit_loss + trace.inventory_shrinkage + trace.bad_debt"

  # ---- definition: working capital and the unlevered build ---------------
  - "trace.nwc == trace.transit_stock + trace.inventory_total + trace.receivables - trace.payables"
  - "trace.capital_employed == trace.nwc + trace.van_nbv"
  - "trace.cfo == trace.nopat + trace.dep - trace.delta_nwc"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.fcff == trace.nopat + trace.dep - trace.delta_nwc - trace.capex"
  - "trace.fcff_normalised == trace.fcff - trace.dep + trace.capex"
  - "trace.fcff_normalised == trace.nopat - trace.delta_nwc"

  # ---- definition: independent direct-method cash reconciliation ---------
  - "trace.fcff == trace.cash_from_customers - trace.prepayment_cash - trace.cash_landing_costs - trace.opex_total + trace.stock_losses - trace.tax - trace.capex"

  # ---- driver bridges: every computed line from its inputs ---------------
  - "landed_cost_per_container == goods_cost_per_container + freight_insurance_per_container + duties_port_per_container"
  - "residue_per_container == annual_obsolete_stock_at_cost / containers_per_year"
  - "trace.prepayment_cash == (goods_cost_per_container * supplier_prepayment_fraction + share_of_landing_costs_prepaid_with_goods * (freight_insurance_per_container + duties_port_per_container)) * trace.containers_paid"
  - "trace.cash_landing_costs == (1 - share_of_landing_costs_prepaid_with_goods) * (freight_insurance_per_container + duties_port_per_container) * trace.containers_landed"
  - "trace.transit_stock == goods_cost_per_container * trace.containers_in_transit"
  - "trace.transit_out == goods_cost_per_container * trace.containers_landed"
  - "trace.landed_in == landed_cost_per_container * trace.containers_landed"
  - "trace.residue_transfer == residue_per_container * trace.containers_landed"
  - "trace.cogs_regular == trace.containers_selling * (landed_cost_per_container - residue_per_container) / sell_through_periods"
  - "trace.cogs_dump == dump_share_of_residue * trace.obsolescence_out"
  - "trace.cogs_writeoff == (1 - dump_share_of_residue) * trace.obsolescence_out"
  - "trace.revenue_full == (1 + realised_markup_on_landed) * trace.cogs_regular / vat_price_divisor"
  - "trace.revenue_dump == (1 + realised_markup_on_landed) * dump_price_factor * trace.cogs_dump / vat_price_divisor"
  - "trace.credit_sales == credit_sales_fraction * trace.revenue"
  - "trace.cash_from_customers == trace.collections + (1 - credit_sales_fraction) * trace.revenue"
  - "trace.opex_total == rent_per_period + wages_per_period + (cnss_family_rate + cnss_pension_employer_rate + risques_professionnels_rate + vps_rate) * wages_per_period + van_running_per_period + owner_manager_cost_per_period + other_overheads_per_period + trace.stock_losses"
  - "trace.dep == van_opening_nbv / van_remaining_life_years / grid.periods"
  - "trace.transit_loss == transit_loss_rate_per_period * trace.transit_stock[t-1]"
  - "trace.inventory_shrinkage == inventory_shrinkage_rate_per_period * trace.inventory_total[t-1]"
  - "trace.bad_debt == bad_debt_rate_per_period * trace.receivables[t-1]"
  - "trace.stock_volume_m3 == (trace.inventory_total + trace.dead_stock_cum) / landed_cost_per_container * container_internal_volume_m3 * packing_efficiency"
  - "trace.customer_transactions == trace.revenue / average_ticket_xof"
  - "trace.van_fuel_litres == van_fuel_share_of_running_cost * van_running_per_period / pump_price_essence"
  - "trace.van_km == trace.van_fuel_litres * 100 / van_fuel_consumption_l_per_100km"
  - "wages_per_period == (2 * salesperson_wage_monthly + storeman_wage_monthly + apprentice_wage_monthly) / 2"
  - "rent_per_period == rent_per_year / grid.periods"
  - "van_running_per_period == van_running_cost_per_year / grid.periods"

  # ---- non-negativity ----------------------------------------------------
  - "trace.transit_stock[t] >= 0"
  - "trace.inventory_active[t] >= 0"
  - "trace.inventory_slow[t] >= 0"
  - "trace.inventory_total[t] >= 0"
  - "trace.dead_stock_cum[t] >= 0"
  - "trace.receivables[t] >= 0"
  - "trace.van_nbv[t] >= 0"
  - "trace.revenue[t] >= 0"
  - "trace.tax[t] >= 0"
  - "trace.stock_volume_m3[t] >= 0"

  # ---- physical capacity and regime assertions ---------------------------
  - "max(trace.stock_volume_m3) <= store_usable_stock_volume_m3"
  - "max(trace.customer_transactions) / (working_days_per_year / grid.periods) / n_salespeople <= max_transactions_per_salesperson_per_day"
  - "trace.van_km_cum[last] * van_remaining_life_years <= van_lifetime_km_capacity"
  - "sum(trace.revenue) > tps_turnover_ceiling"
  - "sum(trace.revenue) > vat_registration_turnover_threshold"
  - "import_vat_on_cif_floor == vat_standard_rate * (goods_cost_per_container + freight_insurance_per_container)"
  - "duties_port_per_container - import_vat_on_cif_floor < min_cet_duty_rate * (goods_cost_per_container + freight_insurance_per_container)"
  - "port_charge_rate_on_cif == duties_port_per_container / (goods_cost_per_container + freight_insurance_per_container)"
  - "apprentice_wage_monthly < smig_monthly"
  - "profit_tax_rate * sum(trace.ebit) > mfp_rate_loss_making * sum(trace.revenue)"
  - "profit_tax_rate * sum(trace.ebit) > mfp_floor"

notes:

  - id: F1
    kind: finding
    title: "The business is not on the Taxe Professionnelle Synthétique, and establishing that is a result"
    text: >-
      The verified-fact annex supplies a 5% TPS rate and its accessories. None of them applies here.
      TPS is reserved for enterprises below the 50,000,000 XOF turnover ceiling; this operation's
      turnover, asserted in checks against that ceiling, is roughly nine times it. It therefore falls
      under the régime du réel, pays the profits tax rather than a receipts tax, and — a second-order
      consequence that is easy to miss — loses the exemption from the Versement Patronal sur Salaires
      that TPS taxpayers enjoy. The 4% VPS is charged in trace.opex_total for exactly that reason. A
      model that had reached for the annex's 5% because it was offered would have taxed receipts
      instead of profit and would have missed the employer charges entirely.

  - id: F2
    kind: finding
    title: "The annex's 0% VAT row does not govern this business, and the stated port payment proves it"
    text: >-
      A 0% applicable VAT rate is a fact about a moto-taxi operator below the registration threshold.
      This wholesaler is far above it and is required to charge TVA at 18%. Independently, his own
      figures show the same thing from the other direction: import VAT at 18% on the bare CIF value is
      import_vat_on_cif_floor, which is a floor because the real base is CIF grossed up by duty and
      community levies, and it already absorbs all but a small remainder of the 7,000,000 he says he
      pays at the port — leaving less for all duties and levies combined than the lowest non-zero
      ECOWAS CET band would require on its own. The check asserts this. The conclusion is that the
      7,000,000 is a duty-and-levy figure and the VAT he pays at the port is recovered, not borne.
      The whole model is therefore run VAT-exclusive. If instead he is quoting all-inclusive prices to
      his customers, a sixth of the revenue in this document is the State's — which is why
      vat_price_divisor is one of the three questions marked high.

  - id: F3
    kind: finding
    title: "The van has no driver"
    text: >-
      The payroll is two salespeople, a storeman and an apprentice. Nobody is named as a driver and
      the founder does not say he drives. Every delivery therefore either takes one of the four away
      from the store — and the throughput test in the passage shows the counter has little slack when
      both salespeople are on it — or there is a fifth person whose cost is not in the utterance and
      therefore not in trace.opex_total. Direction of the error, if it is one: operating costs are
      understated and free cash flow overstated.

  - id: F4
    kind: finding
    title: "The stated running cost cannot move the van over the stated service area"
    text: >-
      trace.van_km_cum accumulates to a figure that, over the van's assumed life, is a small fraction
      of what a light commercial vehicle is built to deliver — the check passes with enormous room,
      and that is the problem rather than the reassurance. Converted at the official pump price, the
      fuel half of his 800,000 buys barely enough distance for a couple of Porto-Novo round trips a
      week and nothing else, whereas the utterance claims deliveries around Cotonou, out to Porto-Novo
      and into "tout le sud du pays". Three explanations are available and only he can choose: the
      800,000 omits something, he buys informal cross-border fuel materially below the official price,
      or the delivery service is far smaller than the words suggest and customers mostly collect. This
      is reported rather than absorbed because absorbing it would mean silently raising his cost or
      silently shrinking his market.

  - id: F5
    kind: finding
    title: "The steady-state stock nearly fills the store the rent implies"
    text: >-
      trace.stock_volume_m3 peaks in the landing period before the year-end clear-out at a volume that
      needs, on ordinary stacking and aisle assumptions, most of an eighty-square-metre store. His
      rent of 1,200,000 a year over that area is cheap for a business trading into Dantokpa. One of
      three things is true: the store is larger than the rent suggests, the rent is a legacy or
      family arrangement, or the containers are 20-footers and the whole space question halves. The
      capacity assertion in checks passes on the base case, but with less margin than a reader should
      be comfortable with, and it is stated so that a different answer to
      container_internal_volume_m3 or store_usable_stock_volume_m3 breaks it visibly.

  - id: F6
    kind: finding
    title: "The apprentice's wage is below the statutory minimum"
    text: >-
      What the founder believes about his wage bill and what the rule says are different objects. He
      pays the apprentice 40,000 a month; the SMIG for a 40-hour week is 52,000, in force since 1
      January 2023. The check asserts the inequality. Unless the post sits under a formal
      apprenticeship contract, it is below the legal floor, and regularising it would raise both the
      wage line and every employer charge computed on it. Direction only: costs up, free cash flow
      down.

  - id: F7
    kind: finding
    title: "The founder's cost base omits the employer's statutory payroll charges and his own labour"
    text: >-
      He lists gross wages and stops. Benin charges the employer 9% for family benefits, 6.4% for
      pensions, 1-4% for occupational risk, and 4% VPS on top — carried in trace.opex_total and wired
      to the payroll bridge check. He also lists no cost for himself, although he personally buys in
      Guangzhou, clears customs and makes the credit decisions; owner_manager_cost_per_period exists
      so that the asset-side cash flow is not quietly crediting the business with a free full-time
      manager. Both additions are visible, both are questions rather than assertions, and a reader who
      disagrees with the imputation can see exactly which line to remove.

  - id: F8
    kind: finding
    title: "The whole working capital of the business sits on one person, and that is the actual answer to his question"
    text: >-
      trace.payables is zero in every period, by construction and by his own words. The supplier takes
      100% before loading, the customers take 40% on thirty days, and there is nobody in between. The
      consequence is visible in trace.capital_employed: at any instant the founder is carrying prepaid
      goods afloat, a store full of stock, and a month of receivables, against no trade credit at all.
      The 2.5-month prepayment is not a nuisance in his cash flow — it is roughly forty percent of the
      capital his business requires. Anything that converted part of that prepayment into supplier
      credit would release capital without touching a single line of the profit and loss.

  - id: F9
    kind: finding
    title: "The margin this model computes is not compatible with the problem the founder describes"
    text: >-
      The passage sets it out in full. Free cash flow of roughly the same order as average capital
      employed means an unlevered return above one hundred percent a year, for a trader whose opening
      complaint is that his money is asleep. Both cannot be true. The arithmetic is exact — it closes,
      it reconciles by an independent direct-method cash identity, and it repeats — so the fault is in
      the inputs rather than the mechanics, and it is concentrated in the three high-materiality
      questions: whether the 70% is asked or realised, whether the quoted prices carry VAT, and
      whether the dead stock is five percent of one container or of six. This is a finding about the
      account, not a defect in the derivation, and it is the single most important thing this document
      has to say.

  - id: J1
    kind: judgment
    title: "The reading of 'brader à moitié prix'"
    text: >-
      Taken as half the selling price, not half the cost, because price is the word he uses and the
      only price he has named is his own. On this reading dumped stock recovers 85% of its landed cost
      and loses 15%. The alternative reading — half of cost — would make the dumped half considerably
      worse than the written-off half is good, and would sit oddly with the fact that he bothers to
      dump it at all. Recorded here rather than elicited because it is a question about his words
      rather than about his operation; if a reader disagrees, dump_price_factor is the single input to
      change and the two revenue bridge checks will follow it.

  - id: J2
    kind: judgment
    title: "The reading of 'cinq pour cent d'un conteneur'"
    text: >-
      Taken literally — five percent of ONE container per year — rather than five percent of each of
      the six. Fidelity to the words wins over the sector prior, but only just, and the question is
      marked high because on the alternative reading the obsolescence load is six times larger. What
      would change my mind: any indication of how much dead stock has accumulated on his shelves over
      the years, since the two readings imply piles that differ by a factor of six.

  - id: J3
    kind: judgment
    title: "The container arrival cadence is taken as even"
    text: >-
      Six containers a year, one every two months. No season is stated and the motorcycle wear-parts
      trade has no strong one. An uneven cadence would not change the annual totals but would change
      the intra-year working-capital profile, which is most of what the half-month grid exists to show.

  - id: S1
    kind: simplification
    title: "Obsolescence is recognised in a single year-end event"
    text: >-
      IAS 2 would write stock down when its net realisable value falls, which happens continuously as
      models change, not on 31 December. The founder's own frame is annual ("à la fin d'une année"),
      and a stationary annual view is indifferent to when within the year the charge lands. On a
      shorter grid or a growing business it would not be.

  - id: S2
    kind: simplification
    title: "VAT and AIB flows are outside the model"
    text: >-
      Output VAT collected on credit sales is remitted before it is collected, and import VAT and the
      AIB advance are paid at the port and recovered later; both are genuine timing drags on a business
      with this working-capital shape. Neither is modelled, because both net out over a stationary
      year and because the founder's VAT position is itself an open question. Direction if modelled:
      more capital employed, unchanged annual profit.

  - id: S3
    kind: simplification
    title: "Balances are closing balances, and haulage from port to store is inside the van line"
    text: >-
      Two conventions worth naming. Stock rows are measured after the period's sales, which is why the
      implied inventory days sit slightly below half the stated sell-through. And the founder's
      "rendue au magasin" cost excludes port-to-store haulage, which is somewhere inside his 800,000
      van line; landed cost is therefore marginally understated and gross margin marginally overstated.

  - id: D1
    kind: deferred
    title: "The lattice coincidence, recorded so it is not mistaken for an error"
    text: >-
      Container residues enter the slow-moving pool in the same periods that new containers land. That
      is not an assumption — it falls out of the arithmetic, because the sell-through of nine periods
      ends eight periods after a landing and eight is a whole number of four-period order intervals.
      If sell_through_periods is answered as eight or ten, the two events separate and the inventory
      rows change shape while the annual totals do not.

  - id: D2
    kind: deferred
    title: "What a longer horizon would need"
    text: >-
      Three things this one-year view cannot answer and did not attempt: the timing of the van
      replacement, which needs van_remaining_life_years; the trajectory of the dead-stock pile, which
      grows without limit and eventually competes with saleable stock for the space tested in F5; and
      whether the supplier's prepayment demand survives, which is the assumption the whole answer rests
      on and the one the founder himself frames as temporary. trace.fcff_normalised is provided so that
      the figure a reader carries forward is the one with a replacement-capex accrual in it, rather than
      the year's raw cash.

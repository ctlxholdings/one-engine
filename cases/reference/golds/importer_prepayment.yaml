    verified: "2026-07-27"

  cnss_pension_employer_rate:
    value: 0.064
    unit: "fraction of gross wages, employer-borne"
    prov: SOURCED
    authority: >-
      CLEISS, cotisations au Bénin — vieillesse/invalidité/décès 6.4% employeur (3.6% salarié), no

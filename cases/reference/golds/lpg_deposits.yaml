contract: "v2.6"
id: ci_yopougon_lpg_deposit_distribution
title: "Butane cylinder distribution on the consigne (deposit) system, Yopougon - Abidjan: unlevered FCFF over ten annual periods"
currency: XOF

grid:
  periods: 10
  freq: annual
  why: >-
    Annual, ten periods. THREE CHOICES, each contestable.
    (1) FREQUENCY. The founder's own operating cycle is monthly and he speaks in months, but every
    driver he can actually state at monthly resolution is flat: he says explicitly that the rainy
    season changes nothing and that December rises only "un peu". A monthly grid would therefore add
    120 rows and one unstated seasonal shape without adding one stateable driver. Against that, the
    two charges that decide this business are annual objects: the cylinder attrition rate is quoted
    per year, and the tax that applies at this turnover (impot des microentreprises) is a single
    annual charge on annual turnover. Annual is the frequency at which the numbers he holds and the
    numbers the law holds are both natively expressed.
    (2) HORIZON LENGTH. The dominant asset here is not the van, it is the cylinder pool: about
    63,000,000 XOF of steel at cost against 90,000,000 XOF of annual sales. At the founder's own 8%
    annual attrition the mean life of a cylinder to this business is 12.5 years, so a ten-year window
    turns over roughly four fifths of the pool and makes the replacement drag - the charge he does
    not book - impossible to hide. A twelve-month view hides it almost entirely, because in any one
    month the fleet looks intact. Ten years also contains exactly one lumpy van replacement (period
    index 6), so the horizon includes at least one real reinvestment decision rather than only
    steady-state trickle capex.
    (3) WHY NOT LONGER. The entire gross margin of this operation rests on transacting at prices far
    above the State's administered butane price, which is reset monthly by the Direction generale des
    hydrocarbures and is a live subsidy-reform question in Cote d'Ivoire. Projecting that spread for
    fifteen or twenty years would be projecting a policy, not a business. Ten years is already
    generous and the reader should discount the tail accordingly.

utterance:
  fr: >-
    Je distribue le gaz butane a Yopougon, a Abidjan. J'ai un depot et trois points de vente dans le
    quartier. Je vends surtout la bouteille de six kilos, c'est celle que les menages prennent, et un
    peu de douze kilos pour les maquis et les gargotes.
    Le systeme c'est celui de la consigne. La premiere fois, le client achete la bouteille : il paie
    la consigne de la bouteille vide, huit mille pour la six kilos, et puis le gaz. Apres, il revient
    seulement echanger : il rend sa bouteille vide et repart avec une pleine, et il ne paie que le
    gaz. La recharge de six kilos je la vends quatre mille deux cents et le gaz me revient a trois
    mille cent chez le marketeur. Je fais dans les mille deux cents echanges par mois sur la six
    kilos et trois cents sur la douze kilos, ou je vends la recharge a huit mille deux cents pour un
    cout de six mille deux cents.
    Le probleme avec les bouteilles, c'est qu'il faut en avoir en circulation. Pour servir mille deux
    cents echanges par mois il me faut a peu pres deux mille bouteilles a moi qui tournent, entre
    celles qui sont chez les clients, celles qui sont pleines en rayon et celles qui attendent
    d'aller au remplissage. Une bouteille neuve me coute vingt-deux mille et elle dure une quinzaine
    d'annees, mais chaque annee j'en perds a peu pres huit pour cent : il y en a qui ne reviennent
    jamais, il y en a que le marketeur refuse au remplissage parce que la robinetterie est abimee ou
    que la date d'epreuve est depassee. Quand une bouteille disparait, je garde la consigne du
    client, ce qui compense un peu, mais huit mille contre vingt-deux mille ca ne compense pas tout.
    Le remplissage se fait au centre emplisseur a Vridi. Ma camionnette porte cent bouteilles de six
    kilos par voyage, et je fais trois voyages par semaine. Le trajet aller-retour c'est cinquante
    kilometres et la camionnette fait douze litres aux cent. Je l'ai achetee six millions il y a
    quatre ans.
    J'ai quatre employes a quatre-vingt-dix mille par mois et un chauffeur a cent quarante mille. Le
    depot et les trois points de vente, tout compris, ca fait quatre cent cinquante mille de loyer
    par mois. En saison des pluies les gens cuisinent pareil, ca ne change pas beaucoup, mais en
    decembre ca monte un peu avec les fetes.
  en: >-
    I distribute butane gas in Yopougon, Abidjan. I have a depot and three sales points in the
    neighbourhood. I mainly sell the six-kilo cylinder, that's the one households take, and some
    twelve-kilo for the street restaurants and food stalls.
    The system is the deposit system. The first time, the customer buys the cylinder: they pay the
    deposit on the empty cylinder, eight thousand for the six-kilo, and then the gas. After that they
    only come back to exchange: they hand in their empty and leave with a full one, and they only pay
    for the gas. The six-kilo refill I sell at four thousand two hundred and the gas costs me three
    thousand one hundred from the marketer. I do around one thousand two hundred exchanges a month on
    the six-kilo and three hundred on the twelve-kilo, where I sell the refill at eight thousand two
    hundred for a cost of six thousand two hundred.
    The problem with the cylinders is that you have to have them in circulation. To serve one thousand
    two hundred exchanges a month I need about two thousand cylinders of my own turning over, between
    the ones at customers' homes, the ones full on the shelf and the ones waiting to go for filling. A
    new cylinder costs me twenty-two thousand and lasts about fifteen years, but every year I lose
    about eight percent of them: some never come back, some the marketer refuses at filling because
    the valve is damaged or the test date has expired. When a cylinder disappears I keep the
    customer's deposit, which offsets it a bit, but eight thousand against twenty-two thousand
    doesn't offset all of it.
    Filling is done at the bottling plant in Vridi. My van carries a hundred six-kilo cylinders per
    trip, and I do three trips a week. The round trip is fifty kilometres and the van does twelve
    litres per hundred. I bought it for six million four years ago.
    I have four employees at ninety thousand a month and a driver at a hundred and forty thousand.
    The depot and the three sales points, all in, come to four hundred and fifty thousand a month in
    rent. In the rainy season people cook the same, it doesn't change much, but in December it goes
    up a little with the holidays.


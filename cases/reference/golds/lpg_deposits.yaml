  # ---------- WORLD FACTS THE FOUNDER'S PRICES MUST BE TESTED AGAINST ----------
  homologated_price_6kg:
    value: 2000
    unit: "XOF per 6 kg cylinder, administered ceiling"
    prov: SOURCED
    source: "BELIEF VERSUS LAW. The founder states, as a fact about his business, that he sells the 6 kg refill at 4,200 and buys it at 3,100. The State, as a fact about the world, fixes the 6 kg butane price at 2,000 XOF and has held it there since at least 2023. These are two different objects and both are carried. Ivorian reporting documents the gap as routine in Abidjan quartiers - 6 kg bottles \"qui doivent etre vendues a 2.000 FCFA sont cedees a 2.500 et 5.500 FCFA voire plus\" during shortages - so his 4,200 is inside the observed street range, but it is not the legal price and neither is his 3,100 purchase price."
    authority: "Ministere des Mines, du Petrole et de l'Energie / Direction generale des hydrocarbures, prix plafonds des produits petroliers, avril 2026: butane 6 kg = 2,000 XOF, 12.5 kg = 5,200, 15 kg = 6,965, 17.5 kg = 8,125, 25 kg = 11,610, 28 kg = 13,000; display of these prices is mandatory. https://abidjantv.net/economie/cote-divoire-les-prix-des-carburants-pour-le-mois-davril-2026/ ; unchanged since the DGH schedule of 22 August 2023, https://www.yeclo.com/gaz-butane-en-cote-divoire-voici-les-prix-homologues"
    verified: 2026-07-27
  homologated_price_12_5kg:
    value: 5200
    unit: "XOF per 12.5 kg cylinder, administered ceiling"
    prov: SOURCED
    source: "Same schedule. Per kilogram the Ivorian structure is deliberately progressive - about 333 XOF/kg on the 6 kg social bottle against about 416-464 XOF/kg on the larger formats - which is a coherent subsidy design and confirms these are gas-refill prices rather than bottle-plus-deposit prices."
    authority: "Same authority and URL as homologated_price_6kg."
    verified: 2026-07-27

passage: |
  STEP 0 - WHAT KIND OF BUSINESS THIS IS, BEFORE ANY ARITHMETIC

  This is not a gas business. It is a steel-rental business with a gas business attached. The founder
  buys sealed filled cylinders and sells them sealed; he never opens one, never weighs one, never
  decants. His margin per cylinder is fixed and known. What he actually risks is 63,000,000 XOF of
  steel that lives in other people's kitchens, and 8% of it walks away every year. Every number below
  is organised around that, because that is where the money in this operation goes.

  STEP 1 - REVENUE, FROM HIS OWN QUANTITIES

  He counts in exchanges per month, so I keep exchanges per month and annualise at 12.
    6 kg refills   = 1,200 x 12 = 14,400 per year
    12.5 kg refills =  300 x 12 =  3,600 per year
    Revenue, 6 kg   = 14,400 x 4,200 = 60,480,000
    Revenue, 12.5 kg =  3,600 x 8,200 = 29,520,000
    Gas revenue                       = 90,000,000 per year, flat across all ten periods.

  The consigne is NOT in this line and must not be. When a first-time customer pays 8,000 for the
  empty bottle, that 8,000 is refundable on return of the cylinder: it is a refund obligation, a
  liability, not revenue. It appears in this model only in the balance-sheet roll-forward and,
  when it is forfeited, as other operating income. Treating it as turnover would be the single
  easiest way to overstate this business, and the founder's own words rule it out - "il rend sa
  bouteille vide et repart avec une pleine, et il ne paie que le gaz."

  STEP 2 - COST OF GAS

    COGS, 6 kg    = 14,400 x 3,100 = 44,640,000
    COGS, 12.5 kg =  3,600 x 6,200 = 22,320,000
    COGS                           = 66,960,000
    Gross margin on gas            = 23,040,000 per year, i.e. 25.6% of sales.

  Per cylinder his spread is 1,100 XOF on the 6 kg and 2,000 XOF on the 12.5 kg. Per kilogram of
  butane that is 183.33 and 160.00 - the bigger bottle earns him less per kilo, which is the normal
  volume-discount shape and is a small internal coherence check that his four prices pass.

  STEP 3 - PHYSICAL CLOSURE (a): THE TRANSFORMATION, AND WHY IT HAS NO LOSS LINE

  There is no transformation of matter in this operation, and saying so explicitly is the point.
  Butane bought = 14,400 x 6 + 3,600 x 12.5 = 86,400 + 45,000 = 131,400 kg per year.
  Butane sold   = 131,400 kg per year.
  Loss          = 0 kg. Not omitted - zero, and here is why it is zero. Filling loss belongs to the
  marketer and is inside the 3,100; a short fill is borne by the customer, who pays the full refill
  price regardless of what is actually in the bottle; a cylinder that leaks in his stock does not
  show up as lost gas but as a cylinder Vridi refuses next time, which is already counted inside the
  8% attrition. The mass that leaves this business is STEEL, not butane. That single observation is
  the reason the cylinder pool, and not the gas, dominates everything below.

  STEP 4 - PHYSICAL CLOSURE (b): THE CYLINDER STOCK AND ITS LOSS

  He states 2,000 six-kilo cylinders in circulation and 8% lost a year. Two things must be said
  about that 8% that he did not say.

  First, WHAT IT ACTS ON. It acts on the cylinders actually at risk, which is the opening fleet in
  each period: 0.08 x 2,000 = 160 cylinders a year. The base does not drain here only because he
  replaces every one of them, which is exactly what "il faut en avoir en circulation" means. If he
  stopped buying replacements the base would fall and a flat 160-a-year charge would overstate the
  tail; the model applies the rate to the roll-forward, not as a flat count.

  Second, WHAT IT IMPLIES ABOUT LIFE. He gives two numbers, fifteen years and 8% a year, and they
  are not independent: the causes he lists for the 8% include end-of-life scrappage ("la date
  d'epreuve est depassee"), so the 8% is the OBSERVED all-causes retirement rate and the fifteen
  years is a nameplate. Mean life to this business is therefore 1 / 0.08 = 12.5 years, not 15. Under
  a flat 8% hazard only 0.92^15 = 28.6% of cylinders would ever reach fifteen. I depreciate the pool
  at 8%, not at 1/15, and I test 12.5 <= 15 as a check rather than assuming it.

  The 12.5 kg fleet is not stated. Applying his own float ratio (2,000 / 1,200 = 1.6667 cylinders per
  monthly exchange) to 300 exchanges gives exactly 500 cylinders, losing 40 a year. That number is
  ELICITED and flagged, not inferred, because the ratio's transfer to a different customer type is
  a prior I supplied.

  STEP 5 - PHYSICAL CLOSURE (b), CONTINUED: WHERE THE 2,000 CYLINDERS ARE, AND WHETHER 2,000 IS EVEN
  POSSIBLE

  At any instant each customer holds exactly one cylinder, so:
    cylinders at customers = fleet - own stock = 2,000 - 200 = 1,800
    household exchange cycle = 1,800 / 1,200 = 1.5 months
    implied household consumption = 6 kg / 1.5 months = 4.0 kg of butane per month.
  That is squarely inside the range for an urban household that cooks entirely on gas, so his 2,000
  closes. It is worth noticing how tightly: at a 2-month household cycle he would need 2,400
  cylinders to serve 1,200 exchanges and his stated 2,000 would be impossible. The founder's fleet
  figure and his volume figure only both survive if households come back roughly every six weeks.
  The same arithmetic on the 12.5 kg gives 450 cylinders at customers, a 1.5-month cycle and 8.3 kg
  a month per maquis - which is LOW for a commercial kitchen, and is the reason the 12.5 kg fleet
  carries a high-materiality question rather than a quiet assumption.

  Own stock of 200 six-kilo cylinders is 5.1 days of cover at 39.5 exchanges a day. That is thin but
  consistent with filling runs roughly every other day, which is what Step 6 requires.

  STEP 6 - PHYSICAL CLOSURE (c): DOES THE CLAIMED OUTPUT FIT THE VAN? IT DOES NOT.

  Van capacity is stated in six-kilo cylinders: 100 per trip. The binding leg is the return, loaded
  with fulls. Gross laden mass per 6 kg cylinder is 6.0 + 7.0 = 13.0 kg, so the implied payload is
  100 x 13.0 = 1,300 kg - a credible 1.5-tonne light commercial van, and consistent with a
  6,000,000 XOF second-hand price. A 12.5 kg cylinder grosses 12.5 + 13.5 = 26.0 kg and therefore
  consumes exactly two of those slots.

    Slots required per year = 14,400 x 1 + 3,600 x 2 = 21,600
    Trips required per year = 21,600 / 100 = 216
    Trips the stated schedule delivers = 3 x 52 = 156
    SHORTFALL = 60 trips a year. The stated logistics deliver 72.2% of what the stated volumes need.

  This is a finding about the business, not a rounding, and I have not absorbed it. Something the
  founder said is wrong: either he runs more than three trips in a normal week, or someone else
  moves part of his gas, or the twelve-kilo bottles are collected separately, or - least likely,
  because he counts his own sales - the volumes are lower than he says. Because revenue is the
  quantity he is most certain about (he handles the cash) and trip frequency is the quantity he
  rounded ("dans les", "a peu pres" appear all over this utterance), I drive the model off the
  volumes and let the trip count be the residual. That raises fuel cost, which is the conservative
  direction, and leaves the discrepancy visible in trace.trip_shortfall rather than buried.

  AVAILABILITY. 216 trips against roughly 299 operating days is 0.72 trips a day, comfortably inside
  one round trip per van-day. There is about 28% headroom, which is where breakdowns, servicing, the
  Vridi queue, fuel shortages and the driver's leave live. The van is not the binding constraint on
  216 trips; the founder's own three-a-week habit is.

    Distance = 216 x 50 = 10,800 km a year
    Fuel     = 10,800 x 12 / 100 = 1,296 litres a year
    Fuel cost = 1,296 x 675 = 874,800 XOF a year (gasoil at the April 2026 administered price).

  STEP 7 - PHYSICAL CLOSURE (c), CONTINUED: DOES THE CLAIMED FOOTPRINT FIT THE PAYROLL? IT DOES NOT.

  Four premises - depot plus three sales points - at a normal 60 opening hours a week need 240
  site-hours a week. Four employees at the Ivorian legal 40-hour week supply 160. The gap is 80
  hours a week, a third of the requirement, and it does not close even if the depot is unmanned
  (3 x 60 = 180 > 160). Either the points open far shorter hours than a neighbourhood gas point
  normally does, or unpaid family labour is on the counter, or overtime is worked and is not in the
  90,000. In every one of those readings the true payroll cost is at or above the stated one, never
  below, so this finding pushes FCFF down, not up. It is carried in trace.staffing_gap_hours.

  Wages themselves are compliant: 90,000 and 140,000 both clear the 75,000 SMIG.

  STEP 8 - PHYSICAL CLOSURE (d): CUMULATIVE QUANTITIES AGAINST THE WORLD

  Over the ten-year horizon the derivation implies:
    Butane moved      = 1,314,000 kg (1,314 tonnes) in 2,160 trips, i.e. about 608 kg of gas a trip
                        inside a 1,300 kg payload that also carries 700 kg of steel. Fits.
    Distance          = 108,000 km. Van one is retired at age 10 having covered roughly 108,000 km
                        including its first four years; van two ends the horizon at 43,200 km. Both
                        are a fraction of a light van's mechanical life. FINDING: this van is
                        retired on age and corrosion, not on wear. At 10,800 km a year it is running
                        at perhaps a fifth of what a commercial vehicle normally does, which means
                        a dedicated van is an expensive way to make 216 short trips, and the
                        replacement decision at period 6 deserves to be a genuine question rather
                        than an automatic repurchase.
    Fills per cylinder = 14,400 fills over a 2,000 fleet = 7.2 a year, so about 90 fills across a
                        12.5-year mean life. Steel bottles tolerate far more than 90 fills; what
                        they do not tolerate is missing a requalification. At a 10-year interval the
                        average cylinder in this fleet meets its test date at about fill 72, before
                        its mean retirement - which is precisely why "la date d'epreuve est
                        depassee" is one of the two loss channels the founder names, and it closes.

  STEP 9 - THE CONSIGNE, WHICH IS THE HEART OF THIS BUSINESS

  Four flows, and they must be kept apart.

  (i) A first-time customer pays 8,000. Cash in, liability up 8,000. No revenue.
  (ii) A cylinder never comes back. The customer keeps it; his 8,000 is forfeited. The liability is
       derecognised and 8,000 becomes other operating income. NO CASH MOVES at that moment - the
       cash arrived years ago.
  (iii) A cylinder is refused at Vridi. It was in HIS hands; the customer went home with a good
       bottle and still has a live deposit. Nothing is forfeited. He simply loses 22,000 of steel.
  (iv) He buys a replacement for 22,000 and puts it out with a new customer who pays 8,000.

  Splitting the 160 annual losses 50/50 between channels (ii) and (iii):
    Forfeiture income  = 80 x 8,000 + 20 x 15,000 = 640,000 + 300,000 = 940,000 per year
    New consignes in   = the same 940,000 in cash, from the customers who take the replacements
    Consigne liability = unchanged. Received 940,000, released 940,000.
  So in a steady state the deposit book contributes 940,000 of income and 940,000 of cash and
  nothing at all to the change in working capital. Note what that means for the founder's own
  sentence: "huit mille contre vingt-deux mille ca ne compense pas tout" is true, but it is only
  true of half his losses. Averaged over both channels he recovers 4,000 against 22,000, not 8,000
  against 22,000. That is why the split between the two channels is a real question and not a
  rounding.

  Consigne liability level = 1,800 x 8,000 + 450 x 15,000 = 14,400,000 + 6,750,000 = 21,150,000.

  STEP 10 - WORKING CAPITAL

    Gas inventory = 0.5 x (200 x 3,100 + 50 x 6,200) = 0.5 x 930,000 = 465,000
    Receivables   = 0 (retail cash trade; no credit to maquis in the base case)
    Payables      = 0 (cash on collection at Vridi in the base case)
    Consigne liability = 21,150,000
    NWC = 465,000 + 0 - 0 - 21,150,000 = -20,685,000, constant, so delta-NWC = 0 in every period.

  That is a substantive result, not a modelling shortcut. The consigne float funds the entire
  working capital of this business and 20.7 million besides. But a float is a one-off historical
  windfall: it was cash the day each customer joined, and in a flat business it contributes exactly
  zero to free cash flow thereafter. Anyone valuing this operation off the fact that it holds 21
  million of other people's money is valuing a stock as though it were a flow.

  STEP 11 - DEPRECIATION AND CAPEX

  Cylinders are individually immaterial, homogeneous and retired continuously, so the pool is
  depreciated on the composite method at the rate at which it actually retires - 8% of gross cost -
  with retirements charged against accumulated depreciation and no separate gain or loss. This is
  the only treatment that makes the pool self-closing: gross book value stays at fleet x unit cost,
  the annual charge equals the annual replacement spend, and no vintage ledger has to be invented
  for a fleet whose age the founder never stated.
    Gross book value, 6 kg   = 2,000 x 22,000 = 44,000,000 -> depreciation 3,520,000
    Gross book value, 12.5 kg =  500 x 38,000 = 19,000,000 -> depreciation 1,520,000
    Replacement capex        = 160 x 22,000 + 40 x 38,000 = 5,040,000, identical by construction.

  The van is 4 years into an assumed 10-year life, so its opening net book value is
  6,000,000 x 6/10 = 3,600,000, depreciating 600,000 a year to zero at the end of period 5, replaced
  at period index 6 for 6,000,000 and depreciating 600,000 a year thereafter.
    Total D&A = 3,520,000 + 1,520,000 + 600,000 = 5,640,000 a year.
    Total capex = 5,040,000 a year, plus 6,000,000 at period index 6.

  STEP 12 - THE LADDER, PER PERIOD

    Gas revenue                                      90,000,000
    Forfeited consignes (other operating income)        940,000
    Turnover TTC                                     90,940,000
    less cost of gas                                (66,960,000)
    less payroll incl. employer charges              (7,177,500)
    less rent                                        (5,400,000)
    less fuel                                          (874,800)
    less vehicle running costs ex fuel                 (700,000)
    less site utilities and security                   (900,000)
    EBITDA                                            8,927,700
    less depreciation                                (5,640,000)
    EBIT                                              3,287,700
    less tax                                         (6,365,800)
    NOPAT                                            (3,078,100)
    plus depreciation                                 5,640,000
    less change in net working capital                        0
    less capex                                       (5,040,000)   [(11,040,000) at index 6]
    FCFF                                             (2,478,100)   [(8,478,100) at index 6]

  Payroll builds as: gross (4 x 90,000 + 140,000) x 12 = 6,000,000; pension 7.7% x 6,000,000 =
  462,000; family and maternity 5.75% and work-injury 5.0% on the capped base of 5 x 70,000 x 12 =
  4,200,000, giving 241,500 and 210,000; payroll taxes 4.4% x 6,000,000 = 264,000. Employer charges
  1,177,500, total cost 7,177,500.

  STEP 13 - THE TAX, WHICH IS THE SECOND FINDING

  At 90,940,000 of annual turnover TTC he sits in the regime des microentreprises band and pays 7%
  of TURNOVER, not 25% of profit: 6,365,800 a year. That charge is nearly twice his EBIT. A
  turnover tax is close to neutral for a business with a 40% net margin and close to confiscatory
  for a distributor whose gross margin is 25.6% and whose net margin before tax is 3.6%; this
  business is the second kind. Membership of a centre de gestion agree replaces the 7% with 5% on
  the same base, which is carried as a checked trace row rather than asserted here, and is the one
  lever in this entire derivation that is large, legal, and entirely within his control.

  STEP 14 - THE ANSWER, AND WHAT IT MEANS

  FCFF is -2,478,100 XOF a year for nine of the ten periods and -8,478,100 in the period the van is
  replaced. Cumulative ten-year FCFF is -30,781,000.

  The business is EBITDA-positive and cash-negative, and the gap is made of exactly two things the
  founder does not book: 5,040,000 a year of cylinder replacement, and 6,365,800 a year of turnover
  tax. His felt income is the EBITDA line - about 744,000 a month - and it is real in the sense that
  it is what passes through his hands. It is not free cash flow, because a fifth of it has to go
  back into steel every year just to stand still, and a further 530,000 a month belongs to the DGI
  if he is filing.

  STEP 15 - THE FINDING THAT SITS UNDER ALL OF THE ABOVE

  Every number in this model rests on a spread that is not legal. The administered ceiling for a 6 kg
  butane cylinder in Cote d'Ivoire is 2,000 XOF and has been since 2023. He sells at 4,200 - 2.1
  times the ceiling - and, more tellingly, he BUYS at 3,100, which is already 1.55 times the price
  at which the State says the bottle should reach the consumer. At the homologated price he would
  lose 1,100 XOF on every 6 kg refill before paying a single wage. His supply is therefore not
  coming through the subsidised chain as priced, and his sales are not going out through it either.
  That is not a modelling adjustment - it is the load-bearing fact about this business, and it means
  the correct reading of the FCFF above is: a business that already destroys value while
  transacting at more than twice the legal price.


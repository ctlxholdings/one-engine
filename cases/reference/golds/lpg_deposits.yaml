checks:
  # ============ CONSERVATION ============
  - 'trace.fleet_6kg_close[t] == trace.fleet_6kg_open[t] - trace.cyl6_lost[t] + trace.cyl6_purchased[t]'
  - 'trace.fleet_6kg_open[t] == trace.fleet_6kg_close[t-1] for t >= 1'
  - 'trace.fleet_6kg_open[first] == fleet_6kg_opening'
  - 'trace.fleet_12kg_close[t] == trace.fleet_12kg_open[t] - trace.cyl12_lost[t] + trace.cyl12_purchased[t]'
  - 'trace.fleet_12kg_open[t] == trace.fleet_12kg_close[t-1] for t >= 1'
  - 'trace.fleet_12kg_open[first] == fleet_12kg_opening'
  - 'trace.deposit_liability_close[t] == trace.deposit_liability_open[t] + trace.deposits_received[t] - trace.deposits_forfeited[t] - trace.deposits_refunded[t]'
  - 'trace.deposit_liability_open[t] == trace.deposit_liability_close[t-1] for t >= 1'
  - 'trace.deposit_liability_open[first] == (fleet_6kg_opening - depot_stock_6kg) * deposit_6kg + (fleet_12kg_opening - depot_stock_12kg) * deposit_12kg'
  - 'trace.van_nbv_close[t] == trace.van_nbv_open[t] + trace.van_capex[t] - trace.dep_van[t]'
  - 'trace.van_nbv_open[t] == trace.van_nbv_close[t-1] for t >= 1'
  - 'trace.van_nbv_open[first] == van_purchase_price * (van_economic_life_years - van_age_years) / van_economic_life_years'
  - 'sum(trace.van_capex) == van_purchase_price'
  - 'trace.nwc_close[t] == trace.nwc_open[t] + trace.delta_nwc[t]'
  - 'trace.nwc_open[t] == trace.nwc_close[t-1] for t >= 1'
  - 'sum(trace.delta_nwc) == trace.nwc_close[last] - trace.nwc_open[first]'
  - 'trace.gas_purchased_kg[t] == trace.gas_sold_kg[t] + trace.gas_loss_kg[t]'
  - 'sum(trace.van_km) == grid.periods * round_trip_km * trace.trips_required[first]'
  - 'sum(trace.gas_sold_kg) == grid.periods * (exchanges_6kg_per_month * months_per_year * gas_content_6kg + exchanges_12kg_per_month * months_per_year * gas_content_12kg)'

  # ============ DEFINITION (the ladder) ============
  - 'trace.revenue_gas[t] == trace.revenue_6kg[t] + trace.revenue_12kg[t]'
  - 'trace.cogs_gas[t] == trace.cogs_6kg[t] + trace.cogs_12kg[t]'
  - 'trace.gross_margin_gas[t] == trace.revenue_gas[t] - trace.cogs_gas[t]'
  - 'trace.forfeiture_income[t] == trace.deposits_forfeited[t]'
  - 'trace.turnover_ttc[t] == trace.revenue_gas[t] + trace.forfeiture_income[t]'
  - 'trace.payroll_cost[t] == trace.gross_payroll[t] + trace.employer_social_charges[t]'
  - 'trace.opex_total[t] == trace.payroll_cost[t] + trace.rent[t] + trace.fuel_cost[t] + trace.vehicle_running_cost[t] + trace.utilities_security[t]'
  - 'trace.ebitda[t] == trace.turnover_ttc[t] - trace.cogs_gas[t] - trace.opex_total[t]'
  - 'trace.dep_total[t] == trace.dep_cyl6[t] + trace.dep_cyl12[t] + trace.dep_van[t]'
  - 'trace.ebit[t] == trace.ebitda[t] - trace.dep_total[t]'
  - 'trace.nopat[t] == trace.ebit[t] - trace.tax[t]'
  - 'trace.nwc_close[t] == trace.inventory[t] + trace.receivables[t] - trace.payables[t] - trace.deposit_liability_close[t]'
  - 'trace.nwc_open[first] == trace.inventory[first] + trace.receivables[first] - trace.payables[first] - trace.deposit_liability_open[first]'
  - 'trace.capex_total[t] == trace.capex_cylinders[t] + trace.van_capex[t]'
  - 'trace.cfo[t] == trace.nopat[t] + trace.dep_total[t] - trace.delta_nwc[t]'
  - 'trace.cfi[t] == 0 - trace.capex_total[t]'
  - 'trace.fcff[t] == trace.cfo[t] + trace.cfi[t]'
  - 'trace.fcff[t] == trace.nopat[t] + trace.dep_total[t] - trace.delta_nwc[t] - trace.capex_total[t]'
  - 'trace.staffing_gap_hours[t] == trace.site_hours_required[t] - trace.staff_hours_available[t]'
  - 'trace.trip_shortfall[t] == trace.trips_required[t] - trace.trips_stated_capacity[t]'
  - 'trace.cyl6_lifetime_fills[t] == trace.cyl6_fills_per_cylinder[t] * trace.cylinder_mean_life_years[t]'

  # ============ DRIVER-BRIDGE ============
  - 'trace.refills_6kg[t] == exchanges_6kg_per_month * months_per_year'
  - 'trace.refills_12kg[t] == exchanges_12kg_per_month * months_per_year'
  - 'trace.revenue_6kg[t] == trace.refills_6kg[t] * refill_price_6kg'
  - 'trace.revenue_12kg[t] == trace.refills_12kg[t] * refill_price_12kg'
  - 'trace.cogs_6kg[t] == trace.refills_6kg[t] * refill_cost_6kg'
  - 'trace.cogs_12kg[t] == trace.refills_12kg[t] * refill_cost_12kg'
  - 'trace.gas_sold_kg[t] == trace.refills_6kg[t] * gas_content_6kg + trace.refills_12kg[t] * gas_content_12kg'
  - 'trace.gas_loss_kg[t] == gas_loss_rate * trace.gas_purchased_kg[t]'
  - 'trace.cyl6_lost[t] == cylinder_loss_rate * trace.fleet_6kg_open[t]'
  - 'trace.cyl12_lost[t] == cylinder_loss_rate * trace.fleet_12kg_open[t]'
  - 'trace.cyl6_purchased[t] == trace.cyl6_lost[t]'
  - 'trace.cyl12_purchased[t] == trace.cyl12_lost[t]'
  - 'trace.cyl6_non_return[t] == non_return_share_of_losses * trace.cyl6_lost[t]'
  - 'trace.cyl12_non_return[t] == non_return_share_of_losses * trace.cyl12_lost[t]'
  - 'trace.deposits_forfeited[t] == trace.cyl6_non_return[t] * deposit_6kg + trace.cyl12_non_return[t] * deposit_12kg'
  - 'trace.deposits_refunded[t] == deposit_refunds_value_per_year'
  - 'trace.deposits_received[t] == trace.deposits_forfeited[t] + trace.deposits_refunded[t]'
  - 'trace.cylinders_at_customers_6kg[t] == trace.fleet_6kg_close[t] - depot_stock_6kg'
  - 'trace.cylinders_at_customers_12kg[t] == trace.fleet_12kg_close[t] - depot_stock_12kg'
  - 'trace.household_exchange_cycle_months[t] == trace.cylinders_at_customers_6kg[t] / exchanges_6kg_per_month'
  - 'trace.cyl6_fills_per_cylinder[t] == trace.refills_6kg[t] / trace.fleet_6kg_close[t]'
  - 'trace.cylinder_mean_life_years[t] * cylinder_loss_rate == 1'
  - 'trace.inventory[t] == filled_share_of_depot_stock * (depot_stock_6kg * refill_cost_6kg + depot_stock_12kg * refill_cost_12kg)'
  - 'trace.receivables[t] == trace.revenue_12kg[t] * customer_credit_days_12kg / 365'
  - 'trace.payables[t] == trace.cogs_gas[t] * supplier_payment_days / 365'
  - 'trace.gross_payroll[t] == (employees_count * employee_wage_monthly + driver_wage_monthly) * months_per_year'
  - 'trace.employer_social_charges[t] == staff_declared_to_cnps * (cnps_pension_employer_rate * trace.gross_payroll[t] + (cnps_family_maternity_employer_rate + cnps_at_mp_employer_rate) * (employees_count + 1) * cnps_capped_base_monthly * months_per_year) + employer_payroll_tax_rate * trace.gross_payroll[t]'
  - 'trace.rent[t] == rent_monthly * months_per_year'
  - 'trace.utilities_security[t] == site_utilities_security_annual'
  - 'trace.vehicle_running_cost[t] == vehicle_running_cost_ex_fuel_annual'
  - 'trace.staff_hours_available[t] == employees_count * legal_working_week_hours'
  - 'trace.site_hours_required[t] == sites_count * site_opening_hours_per_week'
  - 'slot_equivalent_12kg * (gas_content_6kg + tare_6kg) == gas_content_12kg + tare_12kg'
  - 'trace.van_slots_required[t] == trace.refills_6kg[t] + trace.refills_12kg[t] * slot_equivalent_12kg'
  - 'trace.trips_required[t] == trace.van_slots_required[t] / van_capacity_6kg_per_trip'
  - 'trace.trips_stated_capacity[t] == trips_per_week_stated * weeks_per_year'
  - 'trace.van_km[t] == trace.trips_required[t] * round_trip_km'
  - 'trace.fuel_litres[t] == trace.van_km[t] * van_consumption_l_per_100km / 100'
  - 'trace.fuel_cost[t] == trace.fuel_litres[t] * fuel_price_per_litre'
  - 'trace.van_payload_kg_per_trip[t] == van_capacity_6kg_per_trip * (gas_content_6kg + tare_6kg)'
  - 'trace.van_trip_capacity_days[t] == operating_days_per_year * max_round_trips_per_van_day'
  - 'trace.cyl6_gross_book_value[t] == trace.fleet_6kg_close[t] * cylinder_cost_6kg'
  - 'trace.cyl12_gross_book_value[t] == trace.fleet_12kg_close[t] * cylinder_cost_12kg'
  - 'trace.dep_cyl6[t] == cylinder_loss_rate * trace.cyl6_gross_book_value[t]'
  - 'trace.dep_cyl12[t] == cylinder_loss_rate * trace.cyl12_gross_book_value[t]'
  - 'trace.dep_van[t] == van_purchase_price / van_economic_life_years'
  - 'trace.capex_cylinders[t] == trace.cyl6_purchased[t] * cylinder_cost_6kg + trace.cyl12_purchased[t] * cylinder_cost_12kg'
  - 'trace.dep_cyl6[t] + trace.dep_cyl12[t] == trace.capex_cylinders[t]'
  - 'trace.van_capex[t] == 0 for t < van_replacement_index'
  - 'trace.ime_rate[t] == ime_rate_standard - cga_member * (ime_rate_standard - ime_rate_cga)'
  - 'trace.tax[t] == trace.ime_rate[t] * trace.turnover_ttc[t]'
  - 'trace.price_premium_6kg[t] == refill_price_6kg / homologated_price_6kg'
  - 'trace.margin_at_homologated_price_6kg[t] == homologated_price_6kg - refill_cost_6kg'

  # ============ NON-NEGATIVITY AND PHYSICAL / LEGAL BOUNDS ============
  - 'min(trace.van_nbv_close) >= 0'
  - 'min(trace.van_nbv_open) >= 0'
  - 'min(trace.inventory) >= 0'
  - 'min(trace.fleet_6kg_close) >= 0'
  - 'min(trace.fleet_12kg_close) >= 0'
  - 'min(trace.deposit_liability_close) >= 0'
  - 'min(trace.cylinders_at_customers_6kg) >= 0'
  - 'min(trace.cylinders_at_customers_12kg) >= 0'
  - 'min(trace.gas_loss_kg) >= 0'
  - 'min(trace.capex_total) >= 0'
  - 'employee_wage_monthly >= smig_monthly'
  - 'driver_wage_monthly >= smig_monthly'
  - 'min(trace.turnover_ttc) >= micro_band_low'
  - 'max(trace.turnover_ttc) <= micro_band_high'
  - 'trace.trips_required[t] <= trace.van_trip_capacity_days[t]'
  - 'sum(trace.gas_sold_kg) <= sum(trace.trips_required) * trace.van_payload_kg_per_trip[first]'
  - 'trace.cylinder_mean_life_years[t] <= cylinder_nameplate_life_years'
  - 'trace.cylinder_mean_life_years[t] >= cylinder_requalification_interval_years'
  - 'trace.cyl6_non_return[t] <= trace.cyl6_lost[t]'
  - 'trace.cyl12_non_return[t] <= trace.cyl12_lost[t]'
  - 'depot_stock_6kg <= fleet_6kg_opening'
  - 'depot_stock_12kg <= fleet_12kg_opening'

notes:

  findings:
    - id: F1
      title: "The whole gross margin sits above the administered price, on both sides of the trade"
      note: >-
        Butane retail prices in Cote d'Ivoire are fixed by the State and have been unchanged since
        2023. The founder's stated selling price is 2.1 times the ceiling for the 6 kg bottle
        (trace.price_premium_6kg), and his stated PURCHASE price is already above the price at which
        the State says the bottle should reach the consumer, so at the legal price he would take a
        negative margin on every 6 kg refill before paying a single cost
        (trace.margin_at_homologated_price_6kg). The same direction holds on the 12.5 kg. Ivorian
        reporting documents this gap as ordinary in Abidjan quartiers during shortages, so the
        figures are not implausible - but they are not lawful, and they mean his supply is not
        reaching him through the subsidised chain as priced. This is the load-bearing fact about the
        business: a policy change, an enforcement drive, or the marketer normalising its own pricing
        removes the margin, and there is no version of this operation that survives at the
        homologated price on the stated cost. Recorded as belief-versus-law: his prices are facts
        about his business and are what the model runs on; the ceiling is a fact about the world and
        is carried alongside.
    - id: F2
      title: "The stated transport cannot move the stated volume"
      note: >-
        Three trips a week at 100 six-kilo cylinders delivers 156 loads a year. Serving 1,200 six-kilo
        and 300 twelve-and-a-half-kilo exchanges a month needs 216, because a 12.5 kg bottle grosses
        twice a 6 kg bottle and eats two slots of the same payload. The shortfall is carried as
        trace.trip_shortfall. This is a finding about the business, not a rounding: one of the
        founder's statements is wrong. I drove the model off the volumes, because that is the
        quantity he counts in cash, and let the trip count be the residual, which raises fuel cost
        (the conservative direction). The alternative readings - a second vehicle, a hired truck, or
        marketer delivery for part of the volume - would each add a cost this model does not carry,
        so the direction of the error is again against FCFF, not for it. Availability is not the
        problem: 216 trips fits inside one round trip per operating day with roughly a quarter of
        the year spare for breakdowns, servicing, the Vridi queue and driver absence.
    - id: F3
      title: "The stated payroll cannot man the stated footprint inside the legal week"
      note: >-
        Four premises at ordinary opening hours need substantially more site-hours a week than four
        employees legally supply at the 40-hour week (trace.staffing_gap_hours), and the gap does not
        close even if the depot is left unmanned. Either the sales points open far shorter hours than
        assumed, or unpaid family labour is behind the counter, or overtime is worked and is not
        inside the quoted 90,000. Every one of those readings puts true labour cost at or above the
        modelled figure, never below. Direction: FCFF as computed is, if anything, flattered.
    - id: F4
      title: "The van is retired on age, not on use, and is heavily under-employed"
      note: >-
        The derivation implies 10,800 km a year, so over the horizon neither vehicle comes close to a
        light commercial van's mechanical limit; what ends its life is age and corrosion. That means
        the replacement at period index 6 is a real question rather than an automatic repurchase: a
        dedicated van running roughly a fifth of normal commercial mileage is an expensive way to
        make 216 short trips, and hiring, sharing, or backhauling are live alternatives the founder
        did not raise. Not quantified here because no alternative cost is stateable from the
        utterance.
    - id: F5
      title: "A turnover tax on a thin-margin distributor is the second-largest charge in the business"
      note: >-
        At this turnover the applicable regime taxes revenue, not profit, and the resulting charge
        exceeds EBIT. That outcome is structural, not a modelling artefact: a levy on turnover is
        near-neutral for a high-margin business and close to confiscatory for a distributor whose
        gross margin is a quarter of sales and whose pre-tax margin is a few percent. The one legal
        lever is adherence to a centre de gestion agree, which substitutes the reduced rate for the
        standard one on the same base; it is materialised as trace.ime_rate driven by the cga_member
        input rather than asserted here, so a reader can see the effect run through every line below
        EBIT. It is the highest-value question in the whole document.
    - id: F6
      title: "The consigne float is a stock, not a flow"
      note: >-
        The deposit book funds the entire working capital of this business and a large balance
        besides (trace.nwc_close is materially negative and constant). But in a flat operation the
        deposits received from replacement customers exactly offset the deposits released when
        cylinders disappear, so the liability does not move and the float contributes nothing at all
        to free cash flow. It was cash once, on the day each customer joined. Anyone valuing this
        operation on the strength of the money it holds is valuing a stock as though it were a flow.
        The float only becomes a cash event again if the customer base shrinks - which is exactly
        what the deposit_refunds question is there to detect early.
    - id: F7
      title: "The founder's own offset arithmetic is right about the direction and wrong by half"
      note: >-
        He says the forfeited 8,000 does not fully offset the 22,000 cylinder. True, but it
        understates the problem, because a forfeit only happens on the losses where the customer
        keeps the bottle. On the other channel - refused at the filling plant - the cylinder was in
        his own hands and nothing is forfeited at all. Averaged over both channels his recovery per
        lost cylinder is materially below the 8,000 he has in mind. That is why the split between the
        two channels is an elicited question with real weight rather than a detail.

  judgment_calls:
    - "DEPRECIATION OF THE CYLINDER POOL. Cylinders are individually immaterial, homogeneous and retired continuously, so I used the composite (group) method at the observed retirement rate, charging retirements against accumulated depreciation with no separate gain or loss. This keeps the pool self-closing - gross book value constant, annual charge equal to annual replacement - without inventing a vintage ledger for a fleet whose age the founder never stated. FRICTION WITH IAS 16, STATED RATHER THAN HIDDEN: a strict item-by-item application would depreciate each cylinder over its own life and write off the residual book value of each loss separately, which needs an age distribution I do not have. Depreciating instead at 1/15 of cost, as the nameplate life would suggest, would charge less than the business actually spends replacing the fleet, and the identity in checks (pool depreciation equals replacement capex) would fail. The composite rate is the one that ties."
    - "THE 8% IS ALL-CAUSES. The founder gives 15 years and 8% a year, and the causes he lists for the 8% include expired test dates, i.e. end of life. I therefore read 8% as the total observed retirement rate rather than an attrition rate to be stacked on top of a separate wear-out channel. Mean life to the business is the reciprocal, and it is tested against the nameplate in checks rather than assumed. What would change my mind: if he said the 8% counts only bottles that never come back and he scraps others on top, replacement would be higher and FCFF lower."
    - "THE CONSIGNE IS A LIABILITY, NOT REVENUE. A refundable deposit on a returnable container is a refund obligation. It enters the model only through the balance-sheet roll-forward and, on forfeiture, as other operating income. Treating it as turnover is the single easiest way to overstate this business."
    - "FORFEITED DEPOSITS ARE IN THE TAX BASE. The microenterprise tax is on chiffre d'affaires TTC, and whether forfeited consignes belong in that base is arguable. I included them, which is the conservative reading; the effect is small relative to gas sales and it keeps the tax base identical to the operating-income line the model actually builds."
    - "NO GROWTH, CONSTANT PRICES. The founder describes a stable operation, states no growth plan, and says seasonality is slight. The model is real - constant 2026 prices throughout, replacement van at the same cost - so nothing here is nominal growth dressed as performance. Both the December uplift and general inflation are therefore absent, and both would move revenue and cost together."
    - "12.5 KG, NOT 12. The Ivorian range has no 12 kg bottle. I took the physical content from the world because the mass balance and van payload depend on the real size, and accepted the small friction that the founder's per-kilogram buying prices then differ slightly between formats instead of matching exactly."
    - "THE VAN'S OPENING BOOK VALUE. Taken as cost straight-lined over the assumed total life, four years elapsed. He never said what he has depreciated it to, and for a business at this scale a formal fixed-asset register may not exist; this is the standard convention rather than his figure."

  deferred:
    - "AIRSI. The acompte d'impot sur les revenus du secteur informel survives the microenterprise regime and can be withheld at source in the petroleum-products chain. Whether the marketer withholds it on his purchases, at what rate, and whether it is creditable against his microenterprise tax or is an outright cost, I could not resolve to a standard I would put a number on. Left out of the model and flagged: if it is withheld and not creditable, the tax burden is worse than modelled, never better."
    - "OPTION FOR THE REEL SIMPLIFIE. The option to move from turnover taxation to profit taxation is open above a turnover threshold this business does not reach on the stated volumes, so it is not available to him today; it would become available if volumes grew, and it would bring VAT registration and the impot minimum forfaitaire with it. Structural, so it is carried as the tax_regime question rather than as a scenario."
    - "VAT. Under the microenterprise regime the tax is liberatoire of VAT: he neither charges nor recovers it, so every price and cost in this model is VAT-inclusive and no VAT machinery is needed. Recorded because a reader arriving from a reel-normal model will look for it."
    - "PATENTE. Also subsumed by the microenterprise tax, so no separate business-licence charge is modelled."
    - "REGULATORY STATUS OF THE DEPOT. An LPG storage depot and three retail points are classified installations in most regimes and carry authorisation, siting, fire-safety and inspection obligations. Nothing in the utterance touches on this and no cost is modelled beyond the elicited site running-cost line. It is a live compliance exposure, not a costed one."
    - "SEASONALITY. The founder reports a December uplift and no rainy-season effect. At annual frequency the uplift is inside the period and invisible. Recorded as a deliberate consequence of the grid choice, not an oversight."
    - "TERMINAL VALUE AND FINANCING. Neither is in scope: this is an unlevered asset-side derivation over a stated horizon, with no continuing value and no debt, interest or tax shield."

  what_would_move_this_most:
    - "1. Adherence to a centre de gestion agree (cga_member) - the largest legal, controllable lever in the document."
    - "2. Whether he is registered and filing at all (tax_regime) - changes the architecture, not a coefficient."
    - "3. The size of the twelve-and-a-half-kilo fleet (fleet_12kg_opening) - drives replacement capex directly, and the derived per-maquis consumption suggests the base figure may be too high."
    - "4. The split of cylinder losses between customer non-return and plant refusal (non_return_share_of_losses)."
    - "5. The two unstated cost lines - vehicle running costs and site utilities and security - which together are wide enough that the sign of FCFF is inside the width of the questions being asked. That is the honest headline: on the base case this business is cash-negative before financing, and even the most favourable answers to the small questions leave it close to breakeven while it is trading at more than twice the administered price."

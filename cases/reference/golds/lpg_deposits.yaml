  # ---------- CYLINDER PHYSICS ----------
  gas_content_6kg:
    value: 6
    unit: "kg butane per cylinder"
    prov: STATED
    source: "\"la bouteille de six kilos\"; the 6 kg bottle is also the smallest size in the Ivorian administered price schedule."
    date: 2026-07-27
  gas_content_12kg:
    value: 12.5
    unit: "kg butane per cylinder"
    prov: SOURCED
    source: "The founder says \"douze kilos\". There is no 12 kg bottle in the Ivorian range: the administered schedule lists 6 / 12.5 / 15 / 17.5 / 25 / 28 kg. \"Douze kilos\" is the colloquial name for the 12.5 kg bottle. FRICTION NOTED: his price arithmetic (6,200 / 12 = 3,100 / 6 exactly) would tie at 12 kg and does not at 12.5 kg; I take the physical size from the world because the mass balance and the van payload depend on the real bottle, and let the per-kg buying price differ slightly between formats, which is itself normal."
    authority: "Ministere des Mines, du Petrole et de l'Energie / Direction generale des hydrocarbures, note de prix des produits petroliers, avril 2026 (butane price schedule by cylinder size: 6 kg / 12.5 kg / 15 kg / 17.5 kg / 25 kg / 28 kg). Reported at https://abidjantv.net/economie/cote-divoire-les-prix-des-carburants-pour-le-mois-davril-2026/ and https://www.nasuba.info/economie/cote-divoire-les-prix-du-carburant-et-du-gaz-butane-restent-stables-en-fevrier-2026/"
    verified: 2026-07-27
  tare_6kg:
    value: 7.0
    unit: "kg empty weight per cylinder"
    prov: ASSUMED
    source: "Steel LPG cylinder tare for a 6 kg-charge bottle. Published tare weights for small steel LPG bottles run roughly 4.4-8 kg depending on gauge and design; West African refillable bottles sit at the heavy end. Value chosen so that gross laden mass is a round 13.0 kg. The derivation depends only on the RATIO to the 12.5 kg tare, which is ~1.9-2.0 across the whole plausible tare range, so the finding this feeds is robust to the absolute figure."
    date: 2026-07-27
  tare_12kg:
    value: 13.5
    unit: "kg empty weight per cylinder"
    prov: ASSUMED
    source: "Same basis as tare_6kg. A 12.5 kg-charge steel bottle runs 13-15 kg empty. Value chosen so that gross laden mass is a round 26.0 kg and the payload equivalence against the 6 kg bottle is exactly 2, which the utterance permits and which keeps every downstream trip count an exact integer."
    date: 2026-07-27
  slot_equivalent_12kg:
    value: 2
    unit: "six-kg van slots per twelve-and-a-half-kg cylinder"
    prov: INFERRED
    source: "(gas_content_12kg + tare_12kg) / (gas_content_6kg + tare_6kg) = 26.0 / 13.0 = 2. The founder states van capacity in 6 kg cylinders; a 12.5 kg cylinder consumes payload in proportion to its gross laden mass, so it occupies exactly two 6 kg slots. No new information."
    date: 2026-07-27
  gas_loss_rate:
    value: 0
    unit: "fraction of butane purchased"
    prov: INFERRED
    source: "STOCK-LOSS DECLARATION, RULE (b), AND IT IS ZERO. He never decants: he hands sealed empty cylinders to the Vridi filling centre and receives sealed full ones, and he sells the cylinder, not the kilogram. Filling loss at the plant sits inside the marketer's price; a short fill is borne by the customer, who still pays the full refill price; a leaking cylinder in his stock surfaces as a cylinder refused at the next filling, which is already inside the 8% attrition rate. The distributor's physical loss in this business is in STEEL, not in gas, and that is exactly why the cylinder pool - not the gas - is where the money leaks."
    date: 2026-07-27

  # ---------- THE CYLINDER FLEET ----------
  fleet_6kg_opening:
    value: 2000
    unit: "cylinders"
    prov: STATED
    source: "\"Pour servir mille deux cents echanges par mois il me faut a peu pres deux mille bouteilles a moi qui tournent\""
    date: 2026-07-27
  fleet_12kg_opening:
    value: 500
    unit: "cylinders"
    prov: ELICITED
    source: "He gives a fleet only for the 6 kg. Base case applies HIS OWN float ratio (2,000 cylinders per 1,200 monthly exchanges = 1.6667) to the 300 monthly 12.5 kg exchanges, giving exactly 500. That is the omitting choice - it invents no faster or slower turn for the maquis - but it is an unstated prior applied to a stated ratio, so it is his number to give, not mine to assume. The derived consequence is testable: it implies each maquis holds one bottle and comes back every 1.5 months, i.e. burns about 8.3 kg of butane a month, which is low for a commercial kitchen. If the real answer is that maquis exchange more often, the fleet is smaller and the replacement capex falls."
    question: "Combien de bouteilles de douze kilos vous appartiennent en tout, en comptant celles qui sont chez les maquis, celles qui sont pleines au depot et celles qui attendent d'aller a Vridi ?"
    range: {low: 300, high: 800}
    materiality: high
    date: 2026-07-27
  cylinder_cost_6kg:
    value: 22000
    unit: "XOF per new cylinder"
    prov: STATED
    source: "\"Une bouteille neuve me coute vingt-deux mille\""
    date: 2026-07-27
  cylinder_cost_12kg:
    value: 38000
    unit: "XOF per new cylinder"
    prov: ELICITED
    source: "He prices only the 6 kg cylinder. Base case scales roughly with steel mass (tare 13.5 kg vs 7.0 kg) but less than proportionally, because valve, collar and foot-ring are largely fixed cost per bottle. He buys these; he knows the invoice."
    question: "Une bouteille de douze kilos neuve, vous la payez combien chez votre fournisseur ?"
    range: {low: 30000, high: 48000}
    materiality: medium
    date: 2026-07-27
  cylinder_loss_rate:
    value: 0.08
    unit: "fraction of the opening fleet lost per year"
    prov: STATED
    source: "\"chaque annee j'en perds a peu pres huit pour cent\". Read as the OBSERVED all-causes annual retirement rate, because he immediately enumerates the causes and they include end-of-life scrappage (\"la date d'epreuve est depassee\"), theft-equivalent non-return and mechanical failure. It is therefore the rate that governs replacement, not a rate to be added to a separate wear-out channel."
    date: 2026-07-27
  cylinder_nameplate_life_years:
    value: 15
    unit: "years"
    prov: STATED
    source: "\"elle dure une quinzaine d'annees\". Carried as a CONSTRAINT to be tested against the derivation (see trace.cylinder_mean_life_years), NOT used as the depreciation life - see notes."
    date: 2026-07-27
  cylinder_requalification_interval_years:
    value: 10
    unit: "years"
    prov: ASSUMED
    source: "Periodic hydrostatic requalification of refillable LPG cylinders is set at 5 or 10 years across the regimes that publish it, 10 years being the standard interval for LPG service. I could not find a published Ivorian interval, so this is a prior about the world rather than a sourced rule. Used only in a closure test: it must be SHORTER than the mean life to the business, otherwise \"date d'epreuve depassee\" could not be one of the loss channels the founder actually names."
    date: 2026-07-27
  deposit_6kg:
    value: 8000
    unit: "XOF per cylinder held by a customer"
    prov: STATED
    source: "\"il paie la consigne de la bouteille vide, huit mille pour la six kilos\""
    date: 2026-07-27
  deposit_12kg:
    value: 15000
    unit: "XOF per cylinder held by a customer"
    prov: ELICITED
    source: "He states the 6 kg consigne only. Base case sits at the low end of the 15,000-20,000 band reported for 12.5 kg deposits in the Ivorian market - the conservative choice, since a lower deposit means less forfeiture income when a bottle disappears."
    question: "La consigne que vous faites payer sur la bouteille de douze kilos, c'est combien ?"
    range: {low: 12000, high: 20000}
    materiality: low
    date: 2026-07-27
  non_return_share_of_losses:
    value: 0.5
    unit: "fraction of annual cylinder losses that are customer non-returns"
    prov: ELICITED
    source: "He names TWO loss channels and they behave completely differently. A cylinder that never comes back is at a customer, so the 8,000 consigne is forfeited to him and becomes income. A cylinder refused at Vridi is in HIS hands - the customer handed in an empty and went home with a good full one - so nothing is forfeited and he simply eats 22,000. He does not split them. Base 0.50 is the neutral split; it is not a conservative choice and I am not pretending it is, because I have no basis for leaning either way and the honest thing is to say so and ask."
    question: "Sur cent bouteilles que vous perdez dans l'annee, combien ne reviennent jamais du client, et combien c'est Vridi qui vous les refuse ?"
    range: {low: 0.2, high: 0.8}
    materiality: medium
    date: 2026-07-27
  depot_stock_6kg:
    value: 200
    unit: "cylinders held by the business, full or awaiting filling"
    prov: ELICITED
    source: "Base 200 = 10% of the fleet, about five days of cover at 39.5 exchanges a day, which is what three-to-four filling trips a week can support. Note what this input DOES and DOES NOT move: in a steady state it sets the level of the consigne liability and hence the level of net working capital, but not FCFF, because the level is constant and only the change enters the unlevered build. Its real work is closure: it fixes how many cylinders are at customers, hence the household exchange cycle, hence whether the founder's 2,000 figure is physically consistent with 1,200 exchanges a month at all."
    question: "Un jour normal, combien de bouteilles de six kilos sont chez vous - pleines en rayon plus les vides qui attendent le camion - en comptant le depot et les trois points de vente ?"
    range: {low: 100, high: 400}
    materiality: low
    date: 2026-07-27
  depot_stock_12kg:
    value: 50
    unit: "cylinders held by the business"
    prov: INFERRED
    source: "depot_stock_6kg * fleet_12kg_opening / fleet_6kg_opening = 200 * 500 / 2000 = 50. Same proportion of the fleet held off-customer; no new information beyond depot_stock_6kg and the two fleet sizes."
    date: 2026-07-27
  filled_share_of_depot_stock:
    value: 0.5
    unit: "fraction of own-stock cylinders that are full"
    prov: ASSUMED
    source: "A depot in continuous exchange holds roughly as many empties waiting for the next Vridi run as it holds fulls waiting to be sold; the two queues are fed by the same flow. Used only to value gas inventory. Nobody could state this from the business as a stable number - it swings between the morning after a run and the hour before one - so it is a prior, not a question."
    date: 2026-07-27
  deposit_refunds_value_per_year:
    value: 0
    unit: "XOF of consignes refunded per year"
    prov: ELICITED
    source: "STOCK-LOSS DECLARATION FOR THE CONSIGNE LIABILITY, RULE (b): I am carrying zero and saying why. He describes customers leaving by keeping the bottle, never by bringing it back for their 8,000, so the base case is the omitting choice. Honest one-clause caveat: in a steady state a refund is matched by the new customer who takes the returned bottle and pays a fresh consigne, so this moves the gross flows in trace.deposits_refunded and trace.deposits_received but not net FCFF. It is asked because a refund WAVE - a competitor buying customers out - is the one event that turns the consigne float from a free 21 million into a call on cash, and he would see it coming before any model would."
    question: "Dans un mois normal, combien de clients rapportent leur bouteille pour reprendre leur consigne et arretent ?"
    range: {low: 0, high: 2400000}
    materiality: low
    date: 2026-07-27

  # ---------- LOGISTICS AND THE VAN ----------
  van_capacity_6kg_per_trip:
    value: 100
    unit: "six-kg cylinders per trip"
    prov: STATED
    source: "\"Ma camionnette porte cent bouteilles de six kilos par voyage\". Binding on the RETURN leg (full cylinders); the outbound leg carries the same 100 bottles empty and is not the constraint."
    date: 2026-07-27
  trips_per_week_stated:
    value: 3
    unit: "round trips to Vridi per week"
    prov: STATED
    source: "\"je fais trois voyages par semaine\". Carried as a CLAIM to be tested against the volume it must serve, not used to drive fuel - see trace.trip_shortfall and notes finding F2."
    date: 2026-07-27
  round_trip_km:
    value: 50
    unit: "km per round trip"
    prov: STATED
    source: "\"Le trajet aller-retour c'est cinquante kilometres\""
    date: 2026-07-27
  van_consumption_l_per_100km:
    value: 12
    unit: "litres per 100 km"
    prov: STATED
    source: "\"la camionnette fait douze litres aux cent\""
    date: 2026-07-27
  van_purchase_price:
    value: 6000000
    unit: "XOF"
    prov: STATED
    source: "\"Je l'ai achetee six millions il y a quatre ans\". Also used as the like-for-like replacement cost at period 6, on the constant-price convention below."
    date: 2026-07-27
  van_age_years:
    value: 4
    unit: "years"
    prov: STATED
    source: "\"il y a quatre ans\""
    date: 2026-07-27
  van_economic_life_years:
    value: 10
    unit: "years of total economic life from purchase"
    prov: ELICITED
    source: "STRUCTURAL AS WELL AS NUMERIC. 6,000,000 XOF is a second-hand price for a light commercial van in Abidjan, not a new one, so the clock did not start at zero when he bought it: total life from HIS purchase depends on how old it already was. Base 10 years from purchase gives 6 years remaining and puts one replacement inside the horizon at index 6. A different answer moves the 6,000,000 capex to a different period and changes the annual depreciation charge; if the answer is \"it is already an old van\", the replacement lands earlier and inside a window where the business is already cash-negative."
    question: "La camionnette, elle etait neuve ou d'occasion quand vous l'avez prise, c'est quelle annee, et vous comptez la garder encore combien de temps ?"
    range: {low: 6, high: 15}
    materiality: medium
    date: 2026-07-27
  van_replacement_index:
    value: 6
    unit: "0-based period index"
    prov: INFERRED
    source: "van_economic_life_years - van_age_years = 10 - 4 = 6. The van is 4 years into a 10-year life, so it is retired at the end of period index 5 and replaced at the start of period index 6 (the seventh of ten annual periods). No new information."
    date: 2026-07-27
  operating_days_per_year:
    value: 299
    unit: "days"
    prov: ASSUMED
    source: "Six operating days a week (52 * 6 = 312) less about 13 Ivorian public holidays. A prior about how a neighbourhood gas depot trades, not a fact he was asked for. Used only in the availability test on the van."
    date: 2026-07-27
  max_round_trips_per_van_day:
    value: 1
    unit: "round trips per van per operating day"
    prov: ASSUMED
    source: "AVAILABILITY, RULE (c). Nothing runs at 100%. A 50 km Yopougon-Vridi round trip is short, but the binding time is the queue and the load/unload at the filling centre, plus Abidjan crossing traffic; one round trip consumes most of a working day. This is the ceiling the required trip count must fit inside, and it also carries the servicing, breakdown, fuel-shortage and driver-absence allowance implicitly, since it assumes no day ever produces two trips."
    date: 2026-07-27
  fuel_price_per_litre:
    value: 675
    unit: "XOF per litre of gasoil"
    prov: SOURCED
    source: "The founder does not say what the van burns or what he pays. Fuel prices in Cote d'Ivoire are administered monthly, so the price is a world-fact, not a question for him. Gasoil taken as the base because a light commercial van at 12 L/100 km carrying 1.3 tonnes is far more likely diesel than petrol; super sans plomb is 820 XOF/L if it is petrol, which would raise fuel cost by about a fifth of a small line."
    authority: "Ministere des Mines, du Petrole et de l'Energie / Direction generale des hydrocarbures, prix plafonds des produits petroliers, periode du 1er au 30 avril 2026: super sans plomb 820 XOF/L, gasoil 675 XOF/L, petrole lampant 705 XOF/L. https://abidjantv.net/economie/cote-divoire-les-prix-des-carburants-pour-le-mois-davril-2026/"
    verified: 2026-07-27

  # ---------- PEOPLE ----------
  employees_count:
    value: 4
    unit: "employees excluding the driver"
    prov: STATED
    source: "\"J'ai quatre employes\""
    date: 2026-07-27
  employee_wage_monthly:
    value: 90000
    unit: "XOF gross per month"
    prov: STATED
    source: "\"quatre employes a quatre-vingt-dix mille par mois\""
    date: 2026-07-27
  driver_wage_monthly:
    value: 140000
    unit: "XOF gross per month"
    prov: STATED
    source: "\"un chauffeur a cent quarante mille\""
    date: 2026-07-27
  sites_count:
    value: 4
    unit: "premises"
    prov: INFERRED
    source: "\"J'ai un depot et trois points de vente\" - one plus three. No new information."
    date: 2026-07-27
  site_opening_hours_per_week:
    value: 60
    unit: "hours a site is open per week"
    prov: ELICITED
    source: "Base 60 = six days at ten hours, the ordinary trading pattern for a neighbourhood gas point that households come to after work. He knows his own opening hours. This input drives finding F3: at 60 hours a site the four premises need 240 site-hours a week while four employees legally supply 160, so the stated payroll cannot man the stated footprint inside the 40-hour legal week. A shorter answer closes the gap; a longer one widens it and means the true payroll is higher than the one he quoted."
    question: "Vos trois points de vente et le depot, ils ouvrent a quelle heure et ferment a quelle heure, et combien de jours par semaine ?"
    range: {low: 40, high: 84}
    materiality: medium
    date: 2026-07-27
  staff_declared_to_cnps:
    value: 1
    unit: "1 if the five staff are declared to CNPS, 0 if not"
    prov: ELICITED
    source: "Base case 1 - full declaration - which is the conservative choice because it loads the employer contributions onto the cost base. He is the only person who knows whether his five people are on a declared payroll. This is his to answer, not the world's: the RATES are law and sourced below, the FACT of declaration is his."
    question: "Vos quatre employes et le chauffeur, ils sont declares a la CNPS, et vous payez les cotisations patronales tous les mois ?"
    range: {low: 0, high: 1}

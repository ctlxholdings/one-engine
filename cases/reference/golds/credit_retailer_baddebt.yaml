    source: "fact_id SN-TAX-08 / SN-V25-18. Régime général employer share. The 432,000 XOF monthly ceiling does not bind — the highest salary here is 100,000."
    authority: "IPRES, régime général, part employeur 8,4%, plafond mensuel 432 000 XOF (CLEISS, régime de sécurité sociale du Sénégal)"

  cash_stamp_duty_rate:
    value: 0.01
    unit: "ratio of each cash payment"
    prov: "SOURCED"
    source: "fact_id SN-V25-14, RE-VERIFIED BY ME because it is the single rule most likely to govern this business without the founder knowing it. Loi n° 2025-17 du 27 septembre 2025 (JO du 2 octobre 2025) removed the former 100,000 XOF threshold: the droit de timbre de quittance of 1% now applies to ALL cash payments, without threshold and without cap. Payments by card, transfer or other electronic means are outside the charge. The pharmaceutical exemption confirmed by the DGID in February 2026 (fact_id SN-V25-15) is product-specific and does not reach furniture or appliances; the ministerial arrêté listing exempt products had not been issued as at the verification date. This matters HERE more than almost anywhere: the founder's payment plan is 40,000 down plus four instalments of 30,000, every one of which sat BELOW the old 100,000 threshold and was therefore free of the duty until October 2025."
    authority: "Sénégal, loi n° 2025-17 du 27 septembre 2025 modifiant le Code général des impôts, JO du 2 octobre 2025 — droit de timbre de quittance, 1% sur les paiements en espèces, sans seuil ni plafond; https://cabex.sn/en/la-loi-n2025-17-du-27-septembre-2025-un-defi-dequilibre-entre-objectif-budgetaire-justice-fiscale-et-transformation-digitale/"
    verified: "2026-07-27"
  cgu_turnover_ceiling_goods:

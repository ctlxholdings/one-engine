checks:

  # ---- conservation: the unit balance of the trading stock (physical closure rule a) ----
  - "trace.stock_units_bop[t] == trace.stock_units[t-1] + trace.stock_units_open[t]"
  - "trace.stock_units[t] == trace.stock_units_bop[t] + trace.units_purchased[t] - trace.units_sold[t] - trace.units_shrunk[t]"
  - "trace.units_shrunk[t] == stock_shrinkage_rate_monthly * trace.stock_units_bop[t]"
  - "sum(trace.units_purchased) + trace.stock_units_bop[first] == sum(trace.units_sold) + sum(trace.units_shrunk) + trace.stock_units[last]"

  # ---- conservation: the credit book (physical closure rule a, applied to money) ----
  - "trace.ar_gross[t] == trace.ar_gross[t-1] + trace.ar_gross_open[t] + trace.credit_sales_ttc[t] - trace.cash_collections[t] - trace.writeoffs[t]"
  - "trace.allowance[t] == trace.allowance[t-1] + trace.allowance_open[t] + trace.bad_debt_expense[t] - trace.writeoffs[t]"
  - "trace.ar_net[t] == trace.ar_gross[t] - trace.allowance[t]"
  - "trace.ar_gross[t] == trace.ar_not_yet_due[t] + trace.ar_overdue[t]"
  - "trace.gross_sales_ttc[t] == trace.cash_collections[t] + trace.writeoffs[t]"
  - "instalment_paid_on_time_share + instalment_paid_lag1_share + instalment_paid_lag2_share + instalment_paid_lag3_share + instalment_never_paid_share == 1"
  - "down_payment_share + instalment_total_share == 1"
  - "bad_debt_rate_on_credit_sales == instalment_never_paid_share * instalment_total_share"

  # ---- conservation: fixed asset and working capital roll-forwards ----
  - "trace.van_nbv[t] == trace.van_nbv[t-1] + trace.van_nbv_open[t] + trace.capex[t] - trace.depreciation[t]"
  - "trace.delta_nwc[t] == trace.nwc[t] - trace.nwc[t-1] - trace.nwc_open[t]"
  - "sum(trace.delta_nwc) == trace.nwc[last] - trace.nwc_open[first]"

  # ---- driver-bridge: volume, price and VAT ----
  - "trace.transactions[t] == items_sold_per_month / items_per_basket"
  - "trace.units_sold[t] == items_sold_per_month"
  - "trace.gross_sales_ttc[t] == trace.transactions[t] * avg_basket_ttc"
  - "trace.revenue_ht[t] == trace.gross_sales_ttc[t] / (1 + prices_are_vat_inclusive * vat_standard_rate)"
  - "trace.vat_output[t] == trace.gross_sales_ttc[t] - trace.revenue_ht[t]"
  - "trace.vat_input[t] == trace.purchases_ht[t] * vat_standard_rate"
  - "trace.vat_payable[t] == trace.vat_output[t] - trace.vat_input[t]"

  # ---- driver-bridge: margin, cost and stock ----
  - "blended_gross_margin == margin_is_on_selling_price * (furniture_share_of_sales_value * furniture_margin_stated + (1 - furniture_share_of_sales_value) * appliance_margin_stated) + (1 - margin_is_on_selling_price) * (furniture_share_of_sales_value * furniture_margin_stated / (1 + furniture_margin_stated) + (1 - furniture_share_of_sales_value) * appliance_margin_stated / (1 + appliance_margin_stated))"
  - "trace.cogs_ht[t] == trace.revenue_ht[t] * (1 - blended_gross_margin)"
  - "trace.gross_margin_ht[t] == trace.revenue_ht[t] - trace.cogs_ht[t]"
  - "trace.unit_cost_ht[t] == trace.cogs_ht[t] / trace.units_sold[t]"
  - "trace.stock_units[t] == inventory_months_of_sales * items_sold_per_month"
  - "trace.inventory_ht[t] == trace.stock_units[t] * trace.unit_cost_ht[t]"
  - "trace.shrinkage_cost_ht[t] == trace.units_shrunk[t] * trace.unit_cost_ht[t]"
  - "trace.purchases_ht[t] == trace.units_purchased[t] * trace.unit_cost_ht[t]"
  - "trace.payables[t] == trace.purchases_ht[t] * (1 + vat_standard_rate) * supplier_credit_share"

  # ---- driver-bridge: the credit book ----
  - "trace.credit_sales_ttc[t] == trace.gross_sales_ttc[t] * credit_sales_share"
  - "trace.down_payment_cash[t] == trace.credit_sales_ttc[t] * down_payment_share"
  - "trace.instalments_due[t] == trace.credit_sales_ttc[t] * instalment_total_share"
  - "trace.instalment_cash[t] == trace.instalments_due[t] * (1 - instalment_never_paid_share)"
  - "trace.cash_collections[t] == trace.down_payment_cash[t] + trace.instalment_cash[t]"
  - "trace.writeoffs[t] == trace.credit_sales_ttc[t] * bad_debt_rate_on_credit_sales"
  - "trace.bad_debt_expense[t] == trace.credit_sales_ttc[t] * bad_debt_rate_on_credit_sales"
  - "ar_gross_steady_multiple == n_instalments * (n_instalments + 1) / 2 + n_instalments * (instalment_paid_lag1_share + 2 * instalment_paid_lag2_share + 3 * instalment_paid_lag3_share + writeoff_lag_months * instalment_never_paid_share)"
  - "allowance_steady_multiple == n_instalments * instalment_never_paid_share * (writeoff_lag_months + (n_instalments + 1) / 2)"
  - "trace.ar_gross[t] == ar_gross_steady_multiple * trace.instalments_due[t] / n_instalments"
  - "trace.allowance[t] == allowance_steady_multiple * trace.instalments_due[t] / n_instalments"
  - "trace.ar_not_yet_due[t] == n_instalments * (n_instalments + 1) / 2 * trace.instalments_due[t] / n_instalments"
  - "avg_instalment_amount == avg_basket_ttc * instalment_total_share / n_instalments"

  # ---- driver-bridge: delivery, collection and the physical plant (rule c) ----
  - "trace.deliveries[t] == trace.transactions[t] * delivery_share_of_sales"
  - "trace.delivery_cost[t] == trace.deliveries[t] * delivery_unit_cost"
  - "trace.delivery_trips[t] == trace.deliveries[t] / deliveries_per_trip"
  - "trace.delivery_km[t] == trace.delivery_trips[t] * round_trip_km"
  - "trace.delivery_fuel_litres[t] == trace.delivery_km[t] * van_fuel_l_per_km"
  - "trace.delivery_fuel_cost[t] == trace.delivery_fuel_litres[t] * diesel_price_per_litre"
  - "trace.van_trip_hours[t] == trace.delivery_trips[t] * round_trip_hours"
  - "trace.van_hours_available[t] == working_days_per_month * van_available_share * van_working_hours_per_day"
  - "trace.moto_fuel_litres[t] == moto_fuel_budget_per_month / petrol_super_price_per_litre"
  - "trace.moto_km[t] == trace.moto_fuel_litres[t] / moto_fuel_l_per_km"
  - "trace.collection_visits_available[t] == working_days_per_month * collector_visits_per_day"
  - "trace.collection_visits_required[t] == trace.ar_overdue[t] / avg_instalment_amount"
  - "trace.moto_km_per_visit[t] == trace.moto_km[t] / trace.collection_visits_available[t]"
  - "trace.store_floor_required_m2[t] == trace.stock_units[t] * floor_area_per_stored_unit_m2 * (1 - has_separate_storage)"

  # ---- driver-bridge: costs and taxes ----
  - "trace.rent_expense[t] == rent_per_month * (1 - rent_vat_recoverable_share * vat_standard_rate / (1 + vat_standard_rate))"
  - "trace.salaries_gross[t] == n_salespeople * salary_salesperson + salary_delivery_man + salary_collector"
  - "trace.social_charges[t] == employees_declared_share * (n_salespeople * (ipres_employer_rate * salary_salesperson + css_pf_rate * css_monthly_ceiling + css_at_rate * css_monthly_ceiling + cfce_rate * salary_salesperson) + ipres_employer_rate * salary_delivery_man + css_pf_rate * css_monthly_ceiling + css_at_rate * css_monthly_ceiling + cfce_rate * salary_delivery_man + ipres_employer_rate * salary_collector + css_pf_rate * css_monthly_ceiling + css_at_rate * css_monthly_ceiling + cfce_rate * salary_collector)"
  - "trace.payroll_total[t] == trace.salaries_gross[t] + trace.social_charges[t]"
  - "trace.moto_fuel_cost[t] == moto_fuel_budget_per_month"
  - "trace.timbre[t] == trace.cash_collections[t] * cash_share_of_collections * cash_stamp_duty_rate"
  - "trace.cel_vl[t] == cel_vl_rate_leased * rent_per_month"
  - "trace.value_added[t] == trace.gross_margin_ht[t] - trace.shrinkage_cost_ht[t] - trace.rent_expense[t] - trace.moto_fuel_cost[t] - trace.delivery_cost[t]"
  - "trace.cel_va[t] == trace.value_added[t] * cel_va_rate"
  - "trace.cel_total[t] == trace.cel_vl[t] + trace.cel_va[t]"
  - "trace.imf_charge[t] == trace.revenue_ht[t] * imf_rate"
  - "trace.is_charge[t] == trace.ebit[t] * corporate_income_tax_rate"
  - "trace.depreciation[t] == van_cost / van_useful_life_months"
  - "trace.capex[t] == van_cost for t >= van_replacement_period_index"
  - "trace.capex[t] == 0 for t < van_replacement_period_index"

  # ---- definition: the ladder to FCFF ----
  - "trace.opex_total[t] == trace.shrinkage_cost_ht[t] + trace.rent_expense[t] + trace.payroll_total[t] + trace.moto_fuel_cost[t] + trace.delivery_cost[t] + trace.bad_debt_expense[t] + trace.timbre[t] + trace.cel_total[t]"
  - "trace.ebitda[t] == trace.gross_margin_ht[t] - trace.opex_total[t]"
  - "trace.ebit[t] == trace.ebitda[t] - trace.depreciation[t]"
  - "trace.tax_charge[t] == trace.is_charge[t]"
  - "trace.nopat[t] == trace.ebit[t] - trace.tax_charge[t]"
  - "trace.nwc[t] == trace.inventory_ht[t] + trace.ar_net[t] - trace.payables[t] - trace.vat_payable[t]"
  - "trace.cfo[t] == trace.nopat[t] + trace.depreciation[t] - trace.delta_nwc[t]"
  - "trace.cfi[t] == 0 - trace.capex[t]"
  - "trace.fcff[t] == trace.cfo[t] + trace.cfi[t]"
  - "trace.fcff[t] == trace.nopat[t] + trace.depreciation[t] - trace.delta_nwc[t] - trace.capex[t]"
  - "trace.credit_function_cost[t] == trace.bad_debt_expense[t] + salary_collector + employees_declared_share * (ipres_employer_rate * salary_collector + css_pf_rate * css_monthly_ceiling + css_at_rate * css_monthly_ceiling + cfce_rate * salary_collector) + trace.moto_fuel_cost[t] + trace.timbre[t]"

  # ---- non-negativity ----
  - "trace.stock_units[t] >= 0"
  - "trace.inventory_ht[t] >= 0"
  - "trace.ar_gross[t] >= 0"
  - "trace.ar_net[t] >= 0"
  - "trace.allowance[t] >= 0"
  - "trace.ar_overdue[t] >= 0"
  - "trace.van_nbv[t] >= 0"
  - "trace.ebitda[t] >= 0"
  - "trace.nwc[t] >= 0"

  # ---- physical capacity and regime (rules c and d, asserted rather than left in prose) ----
  - "trace.store_floor_required_m2[t] <= store_area_m2"
  - "trace.van_trip_hours[t] <= trace.van_hours_available[t]"
  - "trace.delivery_cost[t] >= trace.delivery_fuel_cost[t]"
  - "trace.collection_visits_required[t] >= trace.collection_visits_available[t]"
  - "trace.moto_km_per_visit[t] <= round_trip_km"
  - "sum(trace.delivery_km) <= van_economic_life_km"
  - "sum(trace.gross_sales_ttc) / 3 > cgu_turnover_ceiling_goods"
  - "trace.tax_charge[t] >= trace.imf_charge[t]"
  - "sum(trace.imf_charge) / 3 >= imf_floor"
  - "sum(trace.imf_charge) / 3 <= imf_cap"
  - "trace.cel_va[t] >= trace.revenue_ht[t] * cel_va_floor_rate"
  - "salary_salesperson <= ipres_monthly_ceiling"
  - "css_monthly_ceiling <= salary_salesperson"

notes:

  - finding: "THE STAMP DUTY IS THE RULE THIS BUSINESS IS MOST LIKELY NOT TO KNOW ABOUT. Until the loi n° 2025-17 of 27 September 2025 the 1% droit de timbre de quittance applied only to cash payments above 100,000 XOF. This founder's entire payment architecture — 40,000 down, then four instalments of 30,000 — sat below that threshold, so the duty touched nothing he did. The reform removed the threshold and the cap. The charge now falls on every banknote that crosses his counter and is materialised as trace.timbre, at more than one seventh of his EBIT. It is charged here as a cost he absorbs, because a Pikine retailer selling against a posted price to salaried customers cannot re-price a sale after the fact the way a supermarket chain can. Direction of the alternatives, without numbers: if he can pass it on, EBIT rises; if part of his collection arrives by Wave or Orange Money rather than in cash, the base shrinks and the charge falls with it, which is precisely what the measure is designed to make happen."

  - finding: "THE COLLECTION FUNCTION DOES NOT FIT INSIDE ONE NEPHEW. trace.collection_visits_required stands at about twice trace.collection_visits_available in every period, and that gap is asserted in checks rather than described here. Four instalments come due on each of eighty sales every month; on the base-case profile roughly ninety-six of those slip each month, on top of a standing overdue book of 7,584,000 XOF. One man at five calls a day for twenty-six days cannot work that. This is not a criticism of the nephew; it is the structural reason the ultimate loss settles where it does. It also means the 6% is not an exogenous property of the customers — it is partly a property of the resource pointed at them, and it will move if that resource moves in either direction."

  - finding: "THE 6,000 A DELIVERY OVERLAPS THE DELIVERY MAN'S SALARY. The founder says the figure is 'entre le carburant et le temps'. The fuel is materialised at trace.delivery_fuel_cost, derived from the distance the van actually covers at the administered gasoil price, and it is about a fifth of what the 6,000 charges. The rest is time — the time of a man on the payroll at 90,000 a month plus employer charges, counted separately in trace.payroll_total. Both are kept in the base case because taking the founder's own number at face value is the conservative reading, but a reader should understand that this line is charged twice in part, and the direction of correcting it is upward for EBIT and for FCFF. The question that resolves it is put to the founder."

  - finding: "THE STORE IS AT ITS PHYSICAL LIMIT. Two months of stock is 160 items needing an estimated 224 m2 of the 250 m2 available, and that is only achievable if the great majority of the stock is boxed and stacked rather than displayed — a single living-room set laid out for a customer takes about 5 m2 on its own. The check passes, but with little headroom: growth in volume at the stated stock policy runs into the walls before it runs into anything else. If there is an unmentioned depot, the space constraint disappears and a rent appears that is nowhere in this model."

  - finding: "THE VAN IS RETIRED BY AGE, NOT BY DISTANCE. Over the horizon it covers 45,000 km, an order of magnitude below what a light diesel commercial vehicle can deliver in its life. The five-year life used to depreciate it, and therefore the replacement capex in the final period and therefore the horizon itself, rest on a wear-and-maintenance convention rather than on a physical limit the derivation has demonstrated. A longer life pushes the capex out of the horizon entirely and lowers the annual depreciation, in opposite directions for EBIT and for FCFF; the question is put to the founder as van_useful_life_months."

  - finding: "THE STATED MARGIN IS NET OF THE IMPORTER'S INVOICE AND OF NOTHING ELSE. On the base case the trading margin is 3,091,525.4237288135 XOF a month and the full cost of the credit function — write-offs, the collector and his charges, his fuel, and the stamp duty on the cash he brings in — is 1,036,020 XOF a month, a third of it. The founder's mental model prices the credit risk at 6% of sales; the credit CHANNEL costs 8.09% of sales. That is the single most useful thing this derivation says back to him, and it is materialised as trace.credit_function_cost rather than argued."

  - judgment: "WORKING CAPITAL DOES NOT MOVE, AND THAT IS A RESULT RATHER THAN AN OMISSION. The utterance contains one steady volume and no trend, so the base case grows at zero; with flat volumes, prices and collection behaviour, every balance — inventory, gross and net receivables, the allowance, payables and the VAT payable — is constant, and the change in net working capital is zero in every period. FCFF over this horizon is therefore NOPAT plus depreciation less capex. The 40,018,370.169491524 XOF standing in working capital is capital already sunk: it does not appear as a flow, but it is what a buyer would have to fund and it is more than three times the annual FCFF. The roll-forward checks are still load-bearing — they are what would expose an opening balance that is not in fact the steady state, because the balances would drift and the change in net working capital would stop being zero."

  - judgment: "THE OPENING BALANCE SHEET IS SET AT THE STEADY STATE, NOT AT ZERO. This is an established business — the van is two years old and the founder speaks of losses 'année après année'. Starting the receivable, the allowance and the inventory at zero would have manufactured an enormous first-year working-capital build that does not exist. The steady-state receivable is derived analytically from the collection profile by Little's law and cross-checked by a second, independent route (the present collectible amount), which agree to the franc; the opening balances are injected at t=0 through the *_open rows so that the roll-forward assertions remain executable under the convention that a value before t=0 is zero."

  - judgment: "REVENUE IS RECOGNISED IN FULL AT THE SALE WHILE ONLY A QUARTER OF THE CASH ARRIVES. Control of the goods passes when the customer takes them away or has them delivered, so IFRS 15 puts the whole basket into revenue in the month of sale. The four-month plan is inside the twelve-month practical expedient, so no financing component is imputed and the cost of extending credit stays inside the stated margins rather than being shown as finance income. The consequence is that this business pays VAT and income tax on money it has not yet collected, and on 6% of it, money it never will."

  - judgment: "THE ECL PROVISION AND ITS TAX TREATMENT ARE NEUTRAL HERE BY COINCIDENCE OF THE STEADY STATE. Senegalese practice restricts the deduction of doubtful-debt provisions to individually identified and pursued debts, so a blanket 6% charge would not normally be deductible; but in a flat book the amount provided each month equals the amount definitively written off each month, so the accounting and taxable bases coincide. In a growing book they would not, and the tax charge would run ahead of the accounting charge."

  - simplification: "VAT ON WRITTEN-OFF RECEIVABLES IS NOT RECLAIMED. Output VAT is remitted on the full sale in the month of sale, and when the receivable dies six months past due the VAT inside it dies with it. Recovery is possible in principle on proof of exhausted recourse; a retailer chasing 30,000-franc instalments will not produce it. The effect is conservative and its direction if wrong is favourable."

  - simplification: "RENT IS EXPENSED GROSS AND FUEL CARRIES NO INPUT VAT RECOVERY. Professional letting is taxable in principle, but the base case assumes a landlord who issues no VAT invoice, and pump fuel is treated as a cash cost with no deduction. Both are the conservative reading; both are asked about."

  - simplification: "THE ITEM MIX BEHIND THE AVERAGE BASKET IS NOT RECONSTRUCTED. The founder prices three of his five product lines and not the televisions or the gas cookers, so any five-line mix that reproduced both eighty items and 12,800,000 XOF would have required two prices invented out of nothing. The floor-space test is therefore run on an average stored footprint per item with the assumption stated openly, rather than on a fabricated bill of goods. The furniture-versus-appliance split, which is what actually drives the blended margin, is asked of the founder instead of assumed away."

  - simplification: "THE OWNER'S OWN COMPENSATION IS NOWHERE IN THE COST BASE. The utterance names five employees and no salary for the founder. FCFF here is before any drawings he takes; a reader comparing this to a business where the principal is on the payroll is not comparing like with like."

  - deferred: "THE LEGAL FORM IS OPEN AND CHANGES THE STRUCTURE OF THE TAX LINE, NOT ITS VALUE. The base case taxes profit at the 30% IS rate. If the business is an entreprise individuelle in the founder's own name — which is the commoner arrangement at this scale — the profit is taxed in his hands through the progressive IRPP barème, which is a different computation and not a different rate, and it cannot be represented by substituting a number into this model. It is recorded as an ELICITED input with that limitation stated explicitly, and it is the one open question in this file that no check can wire."

  - deferred: "THE 6% IS TREATED AS UNIFORM ACROSS PRODUCTS EVEN THOUGH THE FOUNDER SAYS IT IS NOT. He says the loss is worse on the big items and better on mattresses. Splitting the loss rate by product line would require the furniture-versus-appliance split (asked), a loss rate per line (not asked in this file, and a second question to the same man), and a basket mix by line. Since the blended rate is his own all-in figure and the base case is a single blended margin anyway, the split is deferred rather than invented. It matters for pricing and for credit policy, not for the total FCFF at the stated blend."

  - deferred: "NO SEASONALITY, NO GROWTH, NO PRICE PATH. Tabaski and the start of the school year move furniture and appliance sales in Dakar, and the utterance says nothing about either. A monthly grid is the right frequency to carry seasonality if it were known; it is left flat because inventing a shape would be inventing information. The same applies to the replacement van, held at its historical 3,500,000 in constant prices."

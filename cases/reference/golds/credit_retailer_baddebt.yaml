contract: "v2.6"
id: "SN-PIKINE-CREDIT-RETAIL-001"
title: "Pikine furniture and appliance retailer selling on 25%-down / 4-instalment consumer credit — unlevered FCFF, 36 monthly periods"
currency: "XOF"

grid:
  periods: 36
  freq: "month"
  why: >-
    MONTHLY, because every operating quantity in the utterance is monthly (eighty articles a month,
    rent a month, salaries a month) and because the subject of the utterance is a CREDIT BOOK whose
    whole behaviour is monthly: a quarter down, then four monthly instalments, with the founder's own
    aging language (thirty days, ninety days, six months) attaching to month-scale buckets. An annual
    grid would collapse the down-payment, the four instalments, the drag and the six-month write-off
    point into a single number and would make the only thing the founder is actually worried about
    invisible. THIRTY-SIX periods, because the only dated durable object in the utterance fixes the
    endpoint: the delivery van was bought two years ago, is depreciated over a five-year service life,
    and therefore has exactly thirty-six months of that life left. The horizon runs to the moment the
    business must decide to buy another van, and the replacement capex falls inside the horizon (final
    period, t = 35) rather than being pushed off the end where it would flatter the answer. Beyond
    three years nothing in the utterance supports a projection: no growth rate, no lease term, no
    price path, no statement about competition or the size of the Pikine catchment. A reader who
    thinks the van will last eight years, or that the credit book will grow, should disagree with this
    grid first and with the arithmetic second.

utterance:
  fr: >-
    Je vends des meubles et de l'électroménager à Pikine, à Dakar. Des salons, des matelas, des
    frigos, des télés, des gazinières. Ma clientèle c'est des fonctionnaires, des enseignants, des
    gens de la mairie — des salariés. Un salon complet c'est deux cent cinquante mille, un frigo cent
    quatre-vingt mille, un matelas soixante-cinq mille. Presque personne ne paie comptant. Ce que je
    fais : le client verse le quart et il paie le reste en quatre mensualités. Pour les fonctionnaires
    je prends une copie du bulletin de salaire et le numéro du service. Je vends à peu près
    quatre-vingts articles par mois, et le panier moyen c'est cent soixante mille. Le problème c'est
    le recouvrement. Il y en a toujours qui traînent. Sur ce que j'ai à recouvrer, disons qu'à trente
    jours de retard j'ai encore de bonnes chances, à quatre-vingt-dix jours c'est déjà difficile, et
    au-delà de six mois j'ai arrêté d'y croire. Au total, année après année, je perds à peu près six
    pour cent de tout ce que je vends à crédit. C'est plus chez ceux qui achètent les gros articles,
    moins chez les matelas. J'ai un neveu qui ne fait que ça, courir après les clients, je le paie
    cent mille par mois plus le carburant de sa moto, mettons trente mille. Ma marge sur les meubles
    c'est trente-cinq pour cent, sur l'électroménager plutôt vingt-deux pour cent parce que la
    concurrence est plus dure. Je m'approvisionne chez des importateurs à Dakar, je paie à trente
    jours quand j'ai la confiance, mais souvent comptant. Je garde pour environ deux mois de ventes en
    magasin parce que les gens veulent emporter le jour même. Le magasin fait deux cent cinquante
    mètres carrés à Pikine, deux cent mille de loyer par mois. J'ai trois vendeurs à quatre-vingt-cinq
    mille, un livreur à quatre-vingt-dix mille. La camionnette de livraison m'a coûté trois millions
    cinq cent mille il y a deux ans. Les livraisons c'est gratuit pour le client dans Dakar, ça fait
    partie de la vente, mais ça me coûte quelque chose comme six mille par livraison entre le
    carburant et le temps.
  en: >-
    I sell furniture and appliances in Pikine, Dakar. Living-room sets, mattresses, fridges,
    televisions, gas cookers. My customers are civil servants, teachers, town-hall people — salaried
    people. A full living-room set is two hundred and fifty thousand, a fridge a hundred and eighty
    thousand, a mattress sixty-five thousand. Almost nobody pays cash. What I do is: the customer puts
    down a quarter and pays the rest in four monthly instalments. For civil servants I take a copy of
    the payslip and the department number. I sell about eighty items a month, and the average basket
    is a hundred and sixty thousand. The problem is collection. There are always some who drag. On
    what I have to collect, let's say at thirty days late I still have a good chance, at ninety days
    it's already difficult, and past six months I've stopped believing in it. All in, year after year,
    I lose about six percent of everything I sell on credit. It's more with the ones who buy the big
    items, less on mattresses. I have a nephew who does nothing but that, chasing customers; I pay him
    a hundred thousand a month plus the fuel for his motorcycle, say thirty thousand. My margin on
    furniture is thirty-five percent, on appliances more like twenty-two percent because the
    competition is harder. I get supplied by importers in Dakar; I pay at thirty days when I have
    their trust, but often cash. I keep about two months of sales in the store because people want to
    take it away the same day. The store is two hundred and fifty square metres in Pikine, two hundred
    thousand a month in rent. I have three salespeople at eighty-five thousand, a delivery man at
    ninety thousand. The delivery van cost me three million five hundred thousand two years ago.
    Delivery is free for the customer within Dakar, it's part of the sale, but it costs me something
    like six thousand a delivery between fuel and time.

inputs:


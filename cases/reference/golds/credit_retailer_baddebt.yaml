    date: "2026-07-27"
  store_area_m2:
    value: 250
    unit: "m2"
    prov: "STATED"
    source: "\"Le magasin fait deux cent cinquante mètres carrés\""
    date: "2026-07-27"
  rent_per_month:
    value: 200000
    unit: "XOF/month"
    prov: "STATED"
    source: "\"deux cent mille de loyer par mois\""
    date: "2026-07-27"
  n_salespeople:
    value: 3
    unit: "people"
    prov: "STATED"
    source: "\"J'ai trois vendeurs\""
    date: "2026-07-27"
  salary_salesperson:
    value: 85000
    unit: "XOF/month gross"
    prov: "STATED"
    source: "\"trois vendeurs à quatre-vingt-cinq mille\""
    date: "2026-07-27"
  salary_delivery_man:
    value: 90000
    unit: "XOF/month gross"
    prov: "STATED"
    source: "\"un livreur à quatre-vingt-dix mille\""
    date: "2026-07-27"
  salary_collector:
    value: 100000
    unit: "XOF/month gross"
    prov: "STATED"
    source: "\"J'ai un neveu qui ne fait que ça... je le paie cent mille par mois\""
    date: "2026-07-27"
  moto_fuel_budget_per_month:
    value: 30000
    unit: "XOF/month"
    prov: "STATED"
    source: "\"plus le carburant de sa moto, mettons trente mille\""
    date: "2026-07-27"
  van_cost:
    value: 3500000
    unit: "XOF"
    prov: "STATED"
    source: "\"La camionnette de livraison m'a coûté trois millions cinq cent mille\""

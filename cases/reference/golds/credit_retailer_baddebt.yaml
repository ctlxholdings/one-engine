  # ---------------- ELICITED ----------------
  items_per_basket:
    value: 1
    unit: "items/basket"
    prov: "ELICITED"
    source: "Base case 1 because the three prices the founder quotes (250,000 / 180,000 / 65,000) have an unweighted mean of 165,000, almost exactly the stated average basket of 160,000 — which is what one expects if a basket is normally one article. But \"eighty articles\" and \"average basket\" are two different counting units and the utterance never joins them, so the revenue line rests on a join the founder never made. Wired through trace.transactions."
    question: "Quand vous dites quatre-vingts articles par mois et un panier moyen de cent soixante mille : est-ce que ça fait quatre-vingts ventes différentes dans le mois, ou est-ce que beaucoup de clients repartent avec deux ou trois articles dans la même vente ?"
    range: {low: 1, high: 2.5}
    materiality: "high"
    date: "2026-07-27"
  margin_is_on_selling_price:
    value: 1
    unit: "boolean (1 = taux de marque, margin as a share of the selling price; 0 = taux de marge, mark-up on the purchase price)"
    prov: "ELICITED"
    source: "Base case 1, the colloquial trader reading, because it is what \"gross margin\" means to a reader of the ladder. In strict French accounting usage \"taux de marge\" is the mark-up on cost, which would put the gross margin at 35/135 and 22/122 instead. The two readings are not close and nothing in the utterance separates them. Wired through blended_gross_margin."
    question: "Sur un salon que vous vendez deux cent cinquante mille, il vous reste combien une fois l'importateur payé — quatre-vingt-sept mille cinq cents, ou bien vous l'achetez à cent quatre-vingt-cinq mille et vous ajoutez trente-cinq pour cent dessus ?"
    range: {low: "mark-up on purchase price (taux de marge)", high: "share of selling price (taux de marque)"}
    materiality: "high"
    date: "2026-07-27"
  furniture_share_of_sales_value:
    value: 0.50
    unit: "ratio of monthly sales value"
    prov: "ELICITED"
    source: "Base case 0.50. The founder names two furniture lines (salons, matelas) and three appliance lines (frigos, télés, gazinières), which argues for an appliance tilt; but salons are the highest-priced item and he says the losses are worse on \"les gros articles\", which argues the other way. A midpoint is the omitting choice. Wired through blended_gross_margin, which is the single largest lever on EBIT."
    question: "Sur cent mille francs que vous vendez dans le mois, il y a combien de meubles — salons et matelas — et combien d'électroménager ?"
    range: {low: 0.30, high: 0.70}
    materiality: "high"
    date: "2026-07-27"
  prices_are_vat_inclusive:
    value: 1
    unit: "boolean"
    prov: "ELICITED"
    source: "Base case 1 (TTC), the conservative choice, because it lowers recognised revenue by 15.25%. A price quoted across a counter to a consumer in Dakar is normally the price the customer hands over, and the business is above the CGU ceiling so it is a redevable réel of VAT. But the founder never says so, and if he is quoting net-of-VAT prices then revenue and margin are both understated here. Wired through trace.revenue_ht."
    question: "Les deux cent cinquante mille du salon, c'est le prix que le client vous donne à la caisse, TVA comprise, ou est-ce que vous ajoutez la TVA par-dessus sur la facture ?"
    range: {low: "prix hors taxes (VAT added on top)", high: "prix toutes taxes comprises"}
    materiality: "high"
    date: "2026-07-27"
  cash_share_of_collections:
    value: 1.00
    unit: "ratio of amounts collected"
    prov: "ELICITED"
    source: "Base case 1.00, the conservative choice, because it maximises the droit de timbre. This is the question the founder is least likely to have thought about and most likely to be wrong about: since October 2025 the 1% stamp duty applies to cash payments with no threshold, and to nothing paid by Wave, Orange Money, card or transfer. His entire instalment book used to be below the old 100,000 threshold. Wired through trace.timbre."
    question: "Quand un client vient payer sa mensualité de trente mille, il vous donne des billets, ou il vous envoie par Wave ou Orange Money ? Sur dix mensualités, combien arrivent en billets ?"
    range: {low: 0.40, high: 1.00}
    materiality: "high"
    date: "2026-07-27"
  credit_sales_share:
    value: 1.00
    unit: "ratio of sales value sold on the instalment plan"
    prov: "ELICITED"
    source: "Base case 1.00, the conservative choice: it maximises both the receivable and the bad debt. \"Presque personne ne paie comptant\" is explicitly not \"personne\", so some fraction is cash-and-carry and is being ignored here. Wired through trace.credit_sales_ttc."
    question: "Sur dix clients, il y en a combien qui sortent l'argent en une seule fois le jour même, sans passer par les mensualités ?"
    range: {low: 0.85, high: 1.00}
    materiality: "medium"
    date: "2026-07-27"
  instalment_paid_on_time_share:
    value: 0.70
    unit: "ratio of each instalment amount"
    prov: "ELICITED"
    source: "Base case 0.70. \"Il y en a toujours qui traînent\" says the on-time share is materially below 1 but does not say by how much. The three late buckets below are set to be consistent with his own aging language — most of the drag cured inside thirty days, a thinner tail at ninety, nothing believed past six months — and with the 8% that never arrives. Wired through ar_gross_steady_multiple and hence through the receivable, the overdue book and the collector-capacity test."
    question: "Sur dix mensualités qui tombent ce mois-ci, combien sont payées dans le mois, et sur celles qui glissent, combien rentrent le mois suivant ?"
    range: {low: 0.50, high: 0.90}
    materiality: "medium"
    date: "2026-07-27"
  instalment_paid_lag1_share:
    value: 0.15
    unit: "ratio of each instalment amount"
    prov: "ELICITED"
    source: "Base case 0.15, the \"trente jours de retard, j'ai encore de bonnes chances\" bucket. Set with the on-time share so that the five buckets sum to exactly 1. Wired through ar_gross_steady_multiple."
    question: "Une mensualité qui n'est pas payée à temps, elle rentre le mois d'après dans combien de cas sur dix ?"
    range: {low: 0.08, high: 0.25}
    materiality: "low"
    date: "2026-07-27"
  instalment_paid_lag2_share:
    value: 0.05
    unit: "ratio of each instalment amount"
    prov: "ELICITED"
    source: "Base case 0.05, the \"quatre-vingt-dix jours, c'est déjà difficile\" bucket. Wired through ar_gross_steady_multiple."
    question: "Et à deux mois de retard, il vous en rentre encore combien sur dix ?"
    range: {low: 0.02, high: 0.12}
    materiality: "low"
    date: "2026-07-27"
  instalment_paid_lag3_share:
    value: 0.02
    unit: "ratio of each instalment amount"
    prov: "ELICITED"
    source: "Base case 0.02, the thin tail between three months and the six-month point at which the founder stops believing. Wired through ar_gross_steady_multiple."
    question: "Entre trois mois et six mois de retard, est-ce qu'il vous en rentre encore, et à peu près combien sur dix ?"
    range: {low: 0.00, high: 0.06}
    materiality: "low"
    date: "2026-07-27"
  delivery_share_of_sales:
    value: 1.00
    unit: "ratio of transactions delivered"
    prov: "ELICITED"
    source: "Base case 1.00, the conservative (cost-maximising) choice. But the founder's own reason for holding two months of stock is that \"les gens veulent emporter le jour même\", which says in the same breath that a real share of sales walks out of the shop and is never delivered. Wired through trace.deliveries."
    question: "Sur dix ventes, combien repartent avec le client le jour même, et combien vous devez livrer avec la camionnette ?"
    range: {low: 0.55, high: 1.00}
    materiality: "medium"
    date: "2026-07-27"
  delivery_unit_cost:
    value: 6000
    unit: "XOF/delivery"
    prov: "ELICITED"
    source: "Base case 6,000, the founder's own figure taken at face value, which is the conservative choice. He says it is \"entre le carburant et le temps\" — and the time is the time of a delivery man he already pays 90,000 a month, which is charged separately above. The fuel that 6,000 could buy is materialised as trace.delivery_fuel_cost so the double-count is visible rather than argued. Wired through trace.delivery_cost."
    question: "Sur les six mille francs d'une livraison, il y a combien de gasoil réellement, et combien c'est vous qui comptez le temps du livreur que vous payez déjà tous les mois ?"
    range: {low: 2500, high: 6000}
    materiality: "medium"
    date: "2026-07-27"
  van_useful_life_months:
    value: 60
    unit: "months of service to this owner"
    prov: "ELICITED"
    source: "Base case 60 months. IAS 16.50 requires depreciation over the useful life TO THIS ENTITY, which is well defined whether the van was bought new or second-hand — but the founder never says which, and a five-year-old van bought second-hand two years ago is a different asset from a new one. This input sets both the depreciation charge and the period in which the replacement capex falls, and therefore also the horizon. Wired through trace.depreciation and van_replacement_period_index."
    question: "La camionnette, vous l'avez prise neuve ou d'occasion, et vous comptez la garder combien d'années encore avant d'en racheter une ?"
    range: {low: 48, high: 96}
    materiality: "medium"
    date: "2026-07-27"
  employees_declared_share:
    value: 1.00
    unit: "ratio of payroll actually declared to IPRES and the CSS"
    prov: "ELICITED"
    source: "Base case 1.00 — the lawful position and the conservative one. In this market segment the practice is frequently partial, so this is one of the places where what the founder does and what the rule requires may be different objects. Wired through trace.social_charges."
    question: "Vos cinq employés, ils sont déclarés à l'IPRES et à la Caisse de Sécurité sociale, et vous payez les cotisations patronales sur les cinq ?"
    range: {low: 0.00, high: 1.00}
    materiality: "medium"
    date: "2026-07-27"
  stock_shrinkage_rate_monthly:
    value: 0.0025
    unit: "ratio of units held at the start of the month"
    prov: "ELICITED"
    source: "Base case 0.25% of the units AT RISK per month, i.e. 0.4 items a month out of the 160 standing in the shop, which is about 0.5% of annual unit sales. The founder says nothing about stock loss, but he is the only person who knows: he sees the scratched salon, the cracked cooker glass, the fridge that came back. The rate is applied to the standing stock, not to sales, because damage and theft act on what is physically there. Wired through trace.units_shrunk."
    question: "Dans une année, combien d'articles vous perdez au magasin ou à la livraison — cassés, abîmés, volés, ou que vous finissez par brader parce qu'ils ne partent plus ?"
    range: {low: 0.001, high: 0.010}
    materiality: "low"
    date: "2026-07-27"
  supplier_credit_share:
    value: 0.00
    unit: "ratio of purchases bought on 30-day terms"
    prov: "ELICITED"
    source: "Base case 0.00 (pay cash), the conservative choice on the level of working capital, and the reading of \"mais souvent comptant\". Note honestly why this ranks low: the horizon is flat, so payables affect the LEVEL of net working capital and not the CHANGE, and FCFF over this horizon is therefore untouched by the answer. It moves how much of the owner's money is standing in the business, not the asset-side cash flow. Wired through trace.payables and hence trace.nwc."
    question: "Chez vos importateurs, sur dix commandes, combien vous partent à trente jours et combien vous devez payer le jour même ?"
    range: {low: 0.00, high: 1.00}
    materiality: "low"
    date: "2026-07-27"
  rent_vat_recoverable_share:
    value: 0.00
    unit: "ratio of the rent carrying deductible input VAT"
    prov: "ELICITED"
    source: "Base case 0.00, the conservative choice: the full 200,000 is expensed. Professional letting is taxable in principle (SN-TAX-09), but a Pikine landlord who is a natural person below the VAT threshold issues no VAT invoice and there is nothing to deduct. Wired through trace.rent_expense."
    question: "Votre bailleur vous donne une facture avec la TVA dessus, ou bien c'est un particulier qui vous fait juste un reçu ?"
    range: {low: 0.00, high: 1.00}
    materiality: "low"
    date: "2026-07-27"
  css_at_rate:
    value: 0.03
    unit: "ratio of capped salary"
    prov: "ELICITED"
    source: "Base case 0.03, the midpoint of the statutory 1-5% accident-du-travail band (the BAND is SOURCED at SN-TAX-08; the point within it is set by the CSS for the employer's activity and is printed on his own notification, so he holds the answer, not the world). Wired through trace.social_charges."
    question: "Sur votre notification de la Caisse de Sécurité sociale, le taux accident du travail qu'on vous applique, c'est combien — un, trois ou cinq pour cent ?"
    range: {low: 0.01, high: 0.05}
    materiality: "low"
    date: "2026-07-27"
  has_separate_storage:
    value: 0
    unit: "boolean"
    prov: "ELICITED"
    source: "Base case 0: all 160 items are assumed to stand inside the 250 m2. This is the input behind the floor-space test — if there is a magasin de dépôt somewhere else, the space test passes trivially but a second rent appears that is nowhere in the utterance. Wired through trace.store_floor_required_m2 (which is asserted against store_area_m2)."
    question: "Les cent soixante articles que vous gardez en stock, ils tiennent tous dans les deux cent cinquante mètres carrés, ou vous avez un dépôt ailleurs — et si oui, vous payez combien pour ce dépôt ?"
    range: {low: "no separate depot — everything inside the 250 m2", high: "separate depot, with its own rent not stated"}
    materiality: "low"
    date: "2026-07-27"
  income_tax_regime_is_company:
    value: 1
    unit: "boolean"
    prov: "ELICITED"
    source: "Base case 1: taxed as a company at the 30% IS rate. CANNOT BE WIRED TO A VALUE — it changes the STRUCTURE of the tax computation rather than a number in it: an entreprise individuelle's profit goes through the progressive IRPP barème in the founder's own hands, which is a different computation, not a different rate. It is recorded here because it is the second-largest open question in the file after the margin convention, and because a reader must not take the 30% as settled."
    question: "L'affaire est immatriculée comment — une SARL ou une SUARL, ou bien c'est à votre nom propre comme entreprise individuelle ?"
    range: {low: "entreprise individuelle — IRPP barème progressif", high: "société — IS at 30%"}
    materiality: "high"
    date: "2026-07-27"


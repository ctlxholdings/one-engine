  # ---------------- INFERRED ----------------
  instalment_total_share:
    value: 0.75
    unit: "ratio of sale value"
    prov: "INFERRED"
    source: "1 - down_payment_share. \"le client verse le quart et il paie le reste\": the remainder is by definition three quarters. No new information."
    date: "2026-07-27"
  avg_instalment_amount:
    value: 30000
    unit: "XOF/instalment"
    prov: "INFERRED"
    source: "avg_basket_ttc * instalment_total_share / n_instalments = 160000 * 0.75 / 4. Entailed by the stated basket and the stated plan."
    date: "2026-07-27"
  avg_down_payment_amount:
    value: 40000
    unit: "XOF"
    prov: "INFERRED"
    source: "avg_basket_ttc * down_payment_share = 160000 * 0.25"
    date: "2026-07-27"
  instalment_never_paid_share:
    value: 0.08
    unit: "ratio of each instalment amount"
    prov: "INFERRED"
    source: "The down payment is collected at the sale, so the whole of the 6% loss must fall on the instalments: 0.06 / 0.75 = 0.08. Entailed by bad_debt_rate_on_credit_sales and down_payment_share together, no new information."
    date: "2026-07-27"
  blended_gross_margin:
    value: 0.285
    unit: "ratio of net (VAT-exclusive) selling price"
    prov: "INFERRED"
    source: "furniture_share_of_sales_value * furniture_margin_stated + (1 - furniture_share_of_sales_value) * appliance_margin_stated = 0.5*0.35 + 0.5*0.22, under the marque convention (margin_is_on_selling_price = 1). It inherits the ELICITED status of its two priors and is only as good as they are."
    date: "2026-07-27"
  stock_units_target:
    value: 160
    unit: "items"
    prov: "INFERRED"
    source: "inventory_months_of_sales * items_sold_per_month = 2 * 80. \"deux mois de ventes\" read as two months of the physical flow of goods, i.e. 160 items, carried at cost."
    date: "2026-07-27"
  van_nbv_opening:
    value: 2100000
    unit: "XOF"
    prov: "INFERRED"
    source: "van_cost * (1 - van_age_months_at_t0 / van_useful_life_months) = 3500000 * (1 - 24/60)"
    date: "2026-07-27"
  van_replacement_period_index:
    value: 35
    unit: "0-based period index"
    prov: "INFERRED"
    source: "van_useful_life_months - van_age_months_at_t0 - 1 = 60 - 24 - 1. The van reaches the end of its service life at the end of the 36th month of the horizon, which is 0-based index 35."
    date: "2026-07-27"
  ar_gross_steady_multiple:
    value: 13.16
    unit: "multiples of one instalment-cohort amount"
    prov: "INFERRED"
    source: "Little's law on the collection profile: each instalment i (i=1..4) is held on average i + (1*lag1 + 2*lag2 + 3*lag3 + writeoff_lag*never) = i + 0.79 months; summed over i=1..4 gives 10 + 4*0.79 = 13.16. Entailed by the profile shares and the write-off lag."
    date: "2026-07-27"
  allowance_steady_multiple:
    value: 2.72
    unit: "multiples of one instalment-cohort amount"
    prov: "INFERRED"
    source: "n_instalments * instalment_never_paid_share * (writeoff_lag_months + (n_instalments+1)/2) = 4 * 0.08 * 8.5. The lifetime ECL is raised at the sale and released instalment by instalment at write-off."
    date: "2026-07-27"


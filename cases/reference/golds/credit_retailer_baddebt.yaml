  # ---------------- DEFAULTED ----------------
  depreciation_method:
    value: "straight-line, zero residual value"
    unit: "convention"
    prov: "DEFAULTED"
    source: "IAS 16.60/16.62 — the method reflects the pattern of consumption; straight line is the default absent evidence of another pattern. Zero residual under IAS 16.53 because a five-year-old delivery van in Dakar is worth its scrap and the founder does not say he sells it on."
    date: "2026-07-27"
  inventory_measurement:
    value: "at cost (weighted average), lower of cost and net realisable value"
    unit: "convention"
    prov: "DEFAULTED"
    source: "IAS 2.9 and IAS 2.25. This is why \"deux mois de ventes\" enters the balance sheet at 2 x monthly COGS and not at 2 x monthly retail value."
    date: "2026-07-27"
  revenue_recognition_point:
    value: "on transfer of control of the goods to the customer"
    unit: "convention"
    prov: "DEFAULTED"
    source: "IFRS 15.31/15.38. The customer takes the goods away or has them delivered at the sale, so the whole basket is revenue in the month of sale even though only a quarter of the cash arrives then."
    date: "2026-07-27"
  significant_financing_component:
    value: "none imputed"
    unit: "convention"
    prov: "DEFAULTED"
    source: "IFRS 15.63 practical expedient — the period between transfer of the goods and the last instalment is four months, under one year, so no interest is imputed out of the transaction price. The cost of extending credit stays inside the stated margins rather than being separated out as finance income."
    date: "2026-07-27"
  ecl_approach:
    value: "IFRS 9 simplified approach, lifetime expected credit losses"
    unit: "convention"
    prov: "DEFAULTED"
    source: "IFRS 9.5.5.15 — mandatory for trade receivables without a significant financing component. The consequence is that the 6% loss is charged to profit in the MONTH OF SALE, while the gross receivable stays on the books until the founder's own six-month point, when it is derecognised against the allowance."
    date: "2026-07-27"
  vat_on_bad_debts_recovered:
    value: 0
    unit: "boolean"
    prov: "DEFAULTED"
    source: "Conservative default: the VAT embedded in a written-off receivable is not reclaimed. Recovery of output VAT on definitively irrecoverable debts requires evidence of exhausted recourse, which a retailer chasing 30,000-franc instalments through a nephew on a motorcycle will not produce. The whole VAT-inclusive amount is therefore lost."
    date: "2026-07-27"
  new_van_depreciation_start:
    value: "the month after commissioning"
    unit: "convention"
    prov: "DEFAULTED"
    source: "IAS 16.55 — depreciation begins when the asset is available for use. The replacement van is bought in the final period, so it carries no depreciation inside the horizon."
    date: "2026-07-27"
  price_basis:
    value: "nominal XOF, constant prices, no inflation"
    unit: "convention"
    prov: "DEFAULTED"
    source: "No price path is stated for goods, rent, wages or the replacement van. Holding all prices constant is the omitting choice and keeps the replacement van at its historical 3,500,000."
    date: "2026-07-27"

passage: |
  0. WHICH RULES GOVERN THIS BUSINESS

  Nothing can be computed until the regime is fixed, and the founder never states it. Eighty articles a
  month at an average basket of 160,000 is 12,800,000 XOF a month and 153,600,000 XOF a year of turnover.
  The contribution globale unique is available for supplies of goods only up to 50,000,000 XOF of annual
  turnover; this business is at three times that ceiling. It is therefore in the régime du réel, which
  settles four things at once: it is a redevable of VAT at 18% and must invoice and remit it; its profit
  bears the impôt sur les sociétés at 30% subject to the impôt minimum forfaitaire at 0.5% of prior-year
  turnover excluding VAT; it owes the contribution économique locale in both its legs; and its five
  employees carry full employer social charges. Every tax line below follows from that one determination.

  One rule matters here more than the founder can be expected to know. Since the loi n° 2025-17 of
  27 September 2025 the droit de timbre de quittance of 1% applies to ALL cash payments, with no threshold
  and no cap; before that reform it only bit above 100,000 XOF. His payment plan is a down payment of
  40,000 and four instalments of 30,000 — every single payment in the book was below the old threshold and
  free of the duty until October 2025, and every single one of them is now inside it. Electronic payments
  are outside the charge. This is recorded as a fact about the world, distinct from anything the founder
  believes; the question of how much of his collection actually arrives in banknotes is put to him.

  1. VOLUME, PRICE AND THE JOIN THE FOUNDER DID NOT MAKE

  Eighty articles a month; average basket 160,000. These are two different counting units and the utterance
  never joins them. The base case takes one article per basket, which the three quoted prices support: the
  unweighted mean of 250,000, 180,000 and 65,000 is 165,000, within 3% of the stated basket. So
  transactions = 80 / 1 = 80 a month, and gross sales = 80 x 160,000 = 12,800,000 XOF a month, VAT
  included. Net of VAT at 18%: revenue HT = 12,800,000 / 1.18 = 10,847,457.627118644 XOF a month, and
  output VAT = 1,952,542.372881356 XOF a month.

  2. THE ONLY TRANSFORMATION A RETAILER PERFORMS, AND ITS CLOSURE

  Nothing is transformed physically in this business: no fruit becomes juice, no grain becomes flour. The
  goods that leave are the goods that arrived. The transformation that must nonetheless close is the unit
  balance of the trading stock, and it closes on three legs, not on a yield ratio:

      units purchased = units sold + units lost + change in units held.

  Units sold are 80 a month. Units lost are not mentioned by the founder at all, and silence is not zero:
  a shop holding 160 items of furniture and white goods loses some to handling damage, glass breakage,
  soiled fabric, delivery scuffs and theft. The loss rate is applied to the quantity AT RISK — the 160
  items standing in the shop — and not to sales, at 0.25% a month, i.e. 0.4 items a month, about 0.5% of
  annual unit sales. Stock is held flat at 160 items, so purchases are 80 + 0.4 = 80.4 items a month. Over
  the 36 months: 2,894.4 items purchased, 2,880 sold, 14.4 lost, stock unchanged at 160 — the three legs
  sum exactly.

  3. MARGIN, COST AND WHAT THE 35% IS NET OF

  The founder's 35% on furniture and 22% on appliances are, on the base-case reading, margins on the
  selling price. Weighted at a 50/50 split of sales value: 0.5 x 0.35 + 0.5 x 0.22 = 0.285. So:

      COGS HT = 10,847,457.627118644 x 0.715 = 7,755,932.2033898305 XOF a month
      gross margin HT = 10,847,457.627118644 - 7,755,932.2033898305 = 3,091,525.4237288135 XOF a month

  That 35% is net of the importer's invoice and of NOTHING ELSE. It is gross of the delivery he gives away
  free, gross of the 6% he loses on credit, gross of the nephew and the motorcycle that exist only because
  he sells on credit, gross of the stamp duty on the cash he collects, gross of the rent and the three
  salespeople. Read as a return on the goods it is correct; read as what he keeps it is wrong by a factor
  the rest of this derivation makes explicit.

  Unit cost follows: 7,755,932.2033898305 / 80 = 96,949.15254237288 XOF an item. Inventory of 160 items is
  therefore 15,511,864.406779661 XOF at cost — the balance-sheet figure that "two months of sales" produces
  once it is measured at cost rather than at retail, which is a difference of about 4.3 million XOF.
  Stock loss costs 0.4 x 96,949.15254237288 = 38,779.66101694915 XOF a month, and purchases at cost are
  80.4 x 96,949.15254237288 = 7,794,711.86440678 XOF a month, carrying deductible input VAT of
  1,403,048.1355932204 XOF. Net VAT remitted is 1,952,542.372881356 - 1,403,048.1355932204 =
  549,494.2372881356 XOF a month, payable the following month and therefore standing as a payable of one
  month's charge.

  4. THE CREDIT BOOK: CLOSING THE MONEY THE WAY THE STOCK WAS CLOSED

  Each sale of 160,000 breaks into a down payment of 40,000 collected at the counter and four instalments
  of 30,000 falling due one, two, three and four months later. The 6% ultimate loss cannot fall on the down
  payment, which is in hand before the goods leave; it must therefore fall entirely on the instalments, at
  0.06 / 0.75 = 8% of every instalment amount. That is the arithmetic bridge between the founder's headline
  6% and the mechanics underneath it, and it has to hold in both directions: 0.08 x 0.75 = 0.06.

  Each instalment amount is then closed across five destinations that sum to one, in the founder's own
  aging language — paid in the month it falls due 70%; paid one month late, the bucket where he "still has
  a good chance", 15%; two months late, "already difficult", 5%; three months late, the thin tail, 2%;
  never paid, 8%, derecognised six months after the due date, the point past which he has "stopped
  believing". 70 + 15 + 5 + 2 + 8 = 100. A collection percentage on its own would have hidden the timing;
  the timing is the whole subject of the utterance.

  Per month, in the steady state: down payments 0.25 x 12,800,000 = 3,200,000; instalments falling due
  4 x 2,400,000 = 9,600,000, of which 92% is eventually collected, so 9,600,000 x 0.92 = 8,832,000 arrives;
  total cash collected 3,200,000 + 8,832,000 = 12,032,000; written off 0.06 x 12,800,000 = 768,000. Sales
  close against cash: 12,032,000 + 768,000 = 12,800,000 exactly.

  5. HOW BIG THE BOOK IS

  Little's law on the profile gives the standing receivable without simulating cohorts. Instalment i is
  held on average i + (1 x 0.15 + 2 x 0.05 + 3 x 0.02 + 6 x 0.08) = i + 0.79 months. Summing i = 1..4:
  (1+2+3+4) + 4 x 0.79 = 13.16 instalment-amounts. With one instalment-cohort amount of 2,400,000 a month:

      gross receivable = 13.16 x 2,400,000 = 31,584,000 XOF, i.e. 74 days of sales

  The lifetime ECL allowance is raised at the sale, 6% of 12,800,000 = 768,000 a month, and released in
  four equal tranches as each instalment is derecognised at months 7, 8, 9 and 10 after the sale, an
  average of 8.5 months: allowance = 4 x 0.08 x 8.5 = 2.72 instalment-amounts = 6,528,000 XOF. Net
  receivable = 31,584,000 - 6,528,000 = 25,056,000 XOF. That figure is confirmed independently: the money
  actually still to be collected is 0.92 x i + 0.31 per instalment, summed 10.44 instalment-amounts,
  10.44 x 2,400,000 = 25,056,000. The two routes agree to the franc.

  Of the gross book, the amounts not yet fallen due are (4+3+2+1) x 2,400,000 = 24,000,000, so the OVERDUE
  book — what the nephew is actually chasing — stands at 31,584,000 - 24,000,000 = 7,584,000 XOF at any
  month end, about 253 instalments in arrears.

  6. OPERATING COSTS, MONTHLY

  Rent 200,000, expensed in full because the base case assumes no VAT invoice from the landlord. Payroll:
  3 x 85,000 + 90,000 + 100,000 = 445,000 gross. Employer charges are built per head rather than at a
  blanket rate, because two of the four contributions are capped at 63,000 a month and every salary here is
  above that cap: IPRES 8.4% of salary (the 432,000 ceiling does not bind), prestations familiales 7% of
  63,000 = 4,410 flat, accident du travail 3% of 63,000 = 1,890 flat, CFCE 3% of salary uncapped. Per
  salesperson 7,140 + 4,410 + 1,890 + 2,550 = 15,990; three of them 47,970. Delivery man 7,560 + 4,410 +
  1,890 + 2,700 = 16,560. Collector 8,400 + 4,410 + 1,890 + 3,000 = 17,700. Total 82,230, an effective
  18.5% of gross. Payroll cost 527,230.

  Motorcycle fuel 30,000. Deliveries 80 x 6,000 = 480,000. Bad debt charge 768,000. Droit de timbre 1% of
  12,032,000 collected in cash = 120,320. CEL-VL is 15% of the valeur locative, which for leased premises
  is the rent itself: 15% x 2,400,000 a year = 360,000 a year = 30,000 a month. CEL-VA is 1% of value
  added, where value added is the trading margin less external consumptions: 3,091,525.4237288135 -
  38,779.66101694915 - 200,000 - 30,000 - 480,000 = 2,342,745.7627118644, so 23,427.457627118644 a month;
  the 0.15%-of-turnover floor would give only 16,271.186440677966, so the value-added basis binds. Total
  CEL 53,427.457627118644.

  Total operating costs 2,217,757.118644068, so EBITDA = 3,091,525.4237288135 - 2,217,757.118644068 =
  873,768.3050847455 XOF a month.

  7. DOES THE CLAIMED OUTPUT FIT THE PLANT

  FLOOR SPACE. 160 items at an assumed 1.4 m2 of floor each, boxed and stacked where the goods allow it,
  need 224 m2 against 250 m2 available. It fits, with 10% to spare — but only on the assumption that most
  of the stock is stacked and boxed rather than displayed, since a single living-room set laid out for a
  customer takes 5 m2 on its own. This is a finding, not a comfort: two months of stock is at the physical
  limit of the shop, and the founder is asked whether there is a depot he has not mentioned, because if
  there is, there is a rent that is not in this model.

  THE VAN. 80 deliveries a month over 26 trading days is 3.08 a day, and at 90% vehicle availability
  3.42 a day on the days it runs. Consolidated at 1.6 deliveries a trip, that is 50 trips a month, 87.5
  hours of running against 26 x 0.9 x 10 = 234 available hours. The van is at 37% of its time capacity and
  the payload is never in question: a light van of this class carries 1,000 kg and about 7 m3, and 1.6
  household items are inside that with room. The delivery function fits, comfortably.

  THE COLLECTOR. It does not. Four instalments come due each month on each of 80 sales, so 320
  instalment-events a month, of which 30% slip: 96 fresh delinquencies a month, on top of a standing
  overdue book of 7,584,000 XOF, about 253 instalments in arrears. One man on one motorcycle at 5 calls a
  day for 26 days can make 130 visits a month. Required against available is roughly two to one. The
  motorcycle fuel confirms the shape of it: 30,000 XOF at 920 XOF a litre of super buys 32.61 litres, which
  at 2.5 L/100 km is 1,304 km a month — 10.0 km per visit at 130 visits, which is a dense local round
  through Pikine and Guédiawaye and not a man riding to ministries on the Plateau. The collection function
  is capacity-constrained by a factor of about two, and that is the structural reason 8% of instalments end
  up unrecoverable. It is reported as a finding about the business; it is not absorbed into the numbers.

  8. TESTING THE CUMULATIVE QUANTITIES AGAINST THE WORLD

  Over 36 months the van makes 2,880 deliveries in 1,800 trips, covering 45,000 km and burning 5,400 litres
  of gasoil costing 3,672,000 XOF. At the end of the horizon it is five years old with roughly 45,000 km
  put on it in this business — nowhere near the 250,000 km a light diesel commercial vehicle can deliver.
  The conclusion is a real one about the asset: what retires this van is age, corrosion and maintenance,
  not distance, and the five-year life used to depreciate it is a convention rather than a physical limit.

  The same test turns on the delivery charge. 45,000 km of running burns 3,672,000 XOF of gasoil over the
  horizon, 102,000 XOF a month, against the 480,000 XOF a month the 6,000-per-delivery figure charges.
  Fuel is 21% of what is charged; the remaining 79% is the "temps" the founder names — the time of a
  delivery man he already pays 90,000 XOF a month plus 16,560 XOF of charges, counted separately above. The
  base case keeps both, because that is the conservative reading of his own words, but both rows are
  materialised so the overlap is visible rather than argued about.

  9. FROM EBITDA TO FCFF

  The van cost 3,500,000 two years ago and is depreciated straight-line over 60 months: 58,333.333333333336
  XOF a month, with 36 months and 2,100,000 XOF of net book value left at the start of the horizon. It
  reaches zero at the end of the final period, which is where the replacement capex of 3,500,000 falls
  (0-based index 35). The replacement carries no depreciation inside the horizon.

      EBIT = 873,768.3050847455 - 58,333.333333333336 = 815,434.9717514122 XOF a month

  Tax: IS at 30% of EBIT = 244,630.49152542365 a month, 2,935,565.898305084 a year. The IMF alternative is
  0.5% of turnover HT = 54,237.28813559322 a month, 650,847.4576271186 a year, inside the 500,000 floor and
  the 5,000,000 cap. IS is roughly four and a half times the IMF, so the minimum tax does not bind — but it
  is carried as a row because several of the open questions, the margin convention above all, could push
  profit low enough for it to start binding. Note that the deductibility of the ECL provision, which
  Senegalese practice restricts to individually identified and pursued debts, is neutral here: in the
  steady state the charge raised each month, 768,000, exactly equals the amount derecognised each month, so
  the accounting base and the taxable base coincide.

      NOPAT = 815,434.9717514122 - 244,630.49152542365 = 570,804.4802259885 XOF a month

  Working capital stands at inventory 15,511,864.406779661 plus net receivables 25,056,000 less payables 0
  (the base case pays the importers cash) less VAT payable 549,494.2372881356 = 40,018,370.169491524 XOF.
  Because volumes, prices and the collection profile are all flat, that figure does not move: the change in
  net working capital is zero in every period of the horizon. This is worth saying plainly rather than
  letting it pass as an artefact. The 40 million XOF is capital already sunk in the business, not a flow
  the horizon has to fund; it is what a buyer of this business would have to bring, and it is 3.1 times the
  annual FCFF the business throws off. It also means that the questions about supplier terms and about the
  collection profile move the SIZE of the book and the owner's capital at risk, but not the asset-side cash
  flow inside this horizon — which is exactly why they are ranked below the questions that move profit.

      FCFF = NOPAT + depreciation - change in NWC - capex
           = 570,804.4802259885 + 58,333.333333333336 - 0 - 0 = 629,137.8135593218 XOF a month
             for the first 35 periods, and
           = 629,137.8135593218 - 3,500,000 = -2,870,862.1864406782 XOF in the final period.

  Over the 36 months, 19,148,961.288135592 XOF, or about 7.55 million XOF a year before the van
  replacement — 4.9% of turnover including VAT, 5.8% of turnover net of it. The owner's own compensation is
  nowhere in the cost base: this is his return, not a salary he has already drawn.

  10. WHAT THE CREDIT FUNCTION ACTUALLY COSTS

  The founder prices his credit risk at 6%. The full monthly cost of selling on credit is the 768,000 he
  writes off, plus the nephew at 100,000 and his 17,700 of employer charges, plus 30,000 of motorcycle fuel,
  plus the 120,320 of stamp duty that exists only because instalments arrive as banknotes: 1,036,020 XOF a
  month, 8.09% of gross sales and one third of the entire trading margin. The 6% is the write-off. It is not
  the cost.


  items_sold_per_month:
    value: 80
    unit: "items/month"
    prov: "STATED"
    source: "\"Je vends à peu près quatre-vingts articles par mois\" / \"I sell about eighty items a month\""
    date: "2026-07-27"
  avg_basket_ttc:
    value: 160000
    unit: "XOF/basket (price as quoted to the customer)"
    prov: "STATED"
    source: "\"le panier moyen c'est cent soixante mille\""
    date: "2026-07-27"
  price_salon_ttc:
    value: 250000
    unit: "XOF/item"
    prov: "STATED"
    source: "\"Un salon complet c'est deux cent cinquante mille\" — used only as a cross-check on the basket"
    date: "2026-07-27"
  price_fridge_ttc:
    value: 180000
    unit: "XOF/item"
    prov: "STATED"
    source: "\"un frigo cent quatre-vingt mille\" — cross-check only"
    date: "2026-07-27"
  price_mattress_ttc:
    value: 65000
    unit: "XOF/item"
    prov: "STATED"
    source: "\"un matelas soixante-cinq mille\" — cross-check only"
    date: "2026-07-27"
  down_payment_share:
    value: 0.25
    unit: "ratio of sale value"
    prov: "STATED"
    source: "\"le client verse le quart\" / \"the customer puts down a quarter\""
    date: "2026-07-27"
  n_instalments:
    value: 4
    unit: "instalments"
    prov: "STATED"

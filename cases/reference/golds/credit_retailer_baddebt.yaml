  sales_growth_per_month:
    value: 0.00
    unit: "ratio/month"
    prov: "ASSUMED"
    source: "Prior of zero growth. The founder gives one steady rate (\"à peu près quatre-vingts articles par mois\") and says nothing about a trend, a season or a plan. Zero is the omitting choice; it also makes the horizon flat, which is why every change in net working capital in this file is zero."

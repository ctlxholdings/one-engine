    prov: "SOURCED"
    source: "fact_id SN-TAX-10. Used to ESTABLISH THE REGIME, which the annex leaves to me: annual turnover here is 153,600,000 XOF, three times the ceiling, so this business cannot be on the contribution globale unique at 2% of turnover. It falls in the régime du réel — VAT-registered, IS/IMF, CEL, and full employer social charges. That determination drives every tax line below."
    authority: "Sénégal, CGI — contribution globale unique, plafond de chiffre d'affaires 50 000 000 XOF pour les livraisons de biens, taux 2% pour le commerce (DGID)"
    verified: "2026-07-26"
  ipres_employer_rate:

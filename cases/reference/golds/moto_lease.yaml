passage: |
  STEP 0 — THE REPORTING ENTITY AND ITS BOUNDARY

  The first thing to settle is what the entity IS, because the founder's own words draw
  the boundary unusually sharply and it is the boundary that determines the entire shape
  of the answer.

  He says "la moto n'est pas à moi" — the moto is not mine — and "Le patron s'occupe des
  grosses réparations et des papiers de la moto". So three cost pools that a normal
  transport business would carry sit OUTSIDE this entity: the acquisition of the vehicle,
  its major mechanical overhauls, and its registration and insurance papers. What sits
  INSIDE is: the fare revenue he collects, the daily rental he pays, the fuel he buys,
  and the running consumables (tyres, oil changes, "les petites choses") he pays for.

  The immediate consequence, which I will confirm formally at Step 8, is that this entity
  has essentially no asset side. It is a labour-and-consumables operation wrapped around
  a rented machine. An unlevered FCFF built on it will therefore reduce almost exactly to
  NOPAT, and the "free cash flow to the firm" it produces is very largely the operator's
  own labour income rather than a return on invested capital. I flag that now and return
  to it in the notes, because it is the single most important analytical finding here and
  it would be easy to bury under mechanics.

  STEP 1 — THE OPERATING CALENDAR

  "Je travaille tous les jours, sauf dimanche." A week is seven days; he works every one
  of them except Sunday. Six working days per week — this is a deduction, not an
  assumption, so I mark it INFERRED.

  Annualising, I apply the standard 52-week commercial year (DEFAULTED convention):

      days worked per year = 6 days/week x 52 weeks = 312 days

  Friction worth naming: a calendar year contains 52 or 53 Sundays, so the true count is
  312 to 314 depending on the year and on leap days. The 52-week convention understates
  by at most two days out of 312, which is well under one percent and does not merit a
  calendar routine. I note it and move on.

  Note also that he already smooths for me — "vingt courses par jour, EN MOYENNE" — so
  the twenty trips is an average across good and bad days. I therefore do NOT layer a
  further seasonality or weather factor on top; that would be double-counting a haircut
  he has already taken. His "qu'il pleuve ou qu'il fasse beau" reinforces that he does
  not stand down for weather.

  STEP 2 — TRIP VOLUMES BY TARIFF TIER

  He does 20 trips a day and quotes three tariffs — 200, 300, 500 — but he never says how
  the twenty split across the three. This is the largest hole in the utterance. Without a
  mix, daily revenue is only bounded to the range between all-short and all-long; it is
  not determined. A mix must therefore be supplied, and it is an ASSUMPTION, not an
  inference.

  The prior I supply is that urban moto-taxi demand in a dense West African capital is
  dominated by short hops, with a thinner tail of long runs — half short, three tenths
  medium, two tenths long. I choose that exact split partly because it is my honest
  central view of the trade and partly because it lands on whole trips at twenty a day,
  which is physically meaningful in a way that a repeating third of a trip is not.

      short trips per day  = 20 x 0.50 = 10
      medium trips per day = 20 x 0.30 =  6
      long trips per day   = 20 x 0.20 =  4
      total                            = 20   (ties back to the stated 20)

  Annualised over 312 working days:

      short  = 10 x 312 = 3,120 trips
      medium =  6 x 312 = 1,872 trips
      long   =  4 x 312 = 1,248 trips
      total  = 20 x 312 = 6,240 trips

  STEP 3 — REVENUE (IFRS 15)

  Revenue recognition here is the simplest case in the standard. Each trip is a single
  performance obligation, satisfied at a point in time when the passenger is delivered,
  and the transaction price is the posted tier fare collected in cash on completion.
  There are no contract assets, no contract liabilities, no variable consideration to
  constrain, no financing component. Recognition and cash collection coincide.

      revenue from short trips  = 3,120 x 200 =   624,000 XOF
      revenue from medium trips = 1,872 x 300 =   561,600 XOF
      revenue from long trips   = 1,248 x 500 =   624,000 XOF
      total revenue                           = 1,809,600 XOF per year

  Cross-check on a daily basis: 10 x 200 + 6 x 300 + 4 x 500 = 2,000 + 1,800 + 2,000 =
  5,800 XOF a day, and 5,800 x 312 = 1,809,600. Consistent.

  Implied average fare = 1,809,600 / 6,240 = 290 XOF per trip.

  Indirect tax: Benin levies TVA at the standard rate, but a sole operator of this size
  falls below the registration threshold and sits in the presumptive small-taxpayer
  regime, so fares are recorded gross with no output VAT, and the input VAT embedded in
  the 725 XOF pump price is non-recoverable and stays in the cost. This is the DEFAULTED
  treatment for a micro-operator; it is internally consistent — I do not gross fares up
  for a tax he does not charge, and I do not net fuel down for a credit he cannot claim.

  STEP 4 — DISTANCE, THE HIDDEN DRIVER

  Here is the real modelling problem. Both of his cost rates are expressed PER KILOMETRE
  — 2.5 litres per 100 km for fuel, about 5 francs a kilometre for consumables — but he
  never once says how many kilometres he rides. Distance is the pivot on which the entire
  cost side turns, and it is unobserved.

  What can be inferred: the tier names themselves. "Court", "moyen", "long" are distance
  words. So km_short < km_medium < km_long is entailed by his own vocabulary. What cannot
  be inferred: the levels. Those I must supply.

  The prior I supply is that the fare ladder is a distance ladder, i.e. that the tiers are
  priced roughly in proportion to how far they go. That maps 200/300/500 onto 2/3/5 km and
  implies a uniform yield of 100 XOF per paid kilometre, which is in the plausible band
  for Cotonou zem work. I flag this as ASSUMED and note explicitly at Step 12 that the
  clean "100 XOF per paid km" result reported below is a CONSEQUENCE of this assumption
  and not an independent finding.

      paid km per day = 10 x 2 + 6 x 3 + 4 x 5 = 20 + 18 + 20 = 58 km
      paid km per year = 58 x 312 = 18,096 km

  Now the operations-economics correction that a naive model misses. A for-hire vehicle
  does not travel only the kilometres it sells. It repositions after a drop-off, it
  circulates looking for the next fare, it rides home. Fuel burns and tyres wear on those
  kilometres exactly as on paid ones. So total kilometres exceed paid kilometres. I supply
  a 25 percent empty-running factor (80 percent loaded), which is a standard order of
  magnitude for dense urban taxi operations. ASSUMED — the founder says nothing about it.

      total km per day  = 58 x 1.25 = 72.5 km
      deadhead km/day   = 72.5 - 58 = 14.5 km
      total km per year = 72.5 x 312 = 22,620 km
      deadhead per year = 22,620 - 18,096 = 4,524 km

  A sanity read on 22,620 km a year on a small moto: that is a hard-working commercial
  machine but not an implausible one, and it is entirely consistent with the boss having
  to carry "les grosses réparations".

  STEP 5 — FUEL COST

  He states consumption of 2.5 litres per 100 km and a pump price of 725 XOF per litre.
  Consumption applies to every kilometre the engine turns, paid or empty.

      litres per year = 22,620 km x 2.5 / 100 = 565.5 litres
      fuel cost       = 565.5 x 725 = 409,987.50 XOF per year

  Unit check: 2.5/100 x 725 = 18.125 XOF of fuel per kilometre ridden.
  Daily check: 72.5 x 0.025 = 1.8125 litres a day, x 725 = 1,314.0625 XOF a day, and
  1,314.0625 x 312 = 409,987.50. Consistent.

  STEP 6 — CONSUMABLES AND SMALL MAINTENANCE

  "moi je paie l'essence et les petites choses, les pneus, la vidange — ça me fait dans
  les cinq francs le kilomètre." He has already done the analyst's job of converting
  lumpy replacements into a run-rate. I take it as stated, applied to total kilometres,
  because a tyre wears on empty running just as it does under a passenger.

      consumables cost = 22,620 km x 5 = 113,100 XOF per year

  Accounting friction, recorded not resolved: a per-kilometre accrual for tyres and oil
  that have not yet been bought is, strictly, a provision for future costs. IAS 37 would
  not recognise it — there is no present obligation arising from a past event; the
  obligation crystallises when he buys the tyre. Strict IFRS would therefore expense
  replacements as incurred and produce a lumpy, saw-toothed cost line. Over an annual
  measurement period with a running fleet-of-one in continuous service, the smoothed
  run-rate and the incurred cost converge, so I adopt his framing. It would matter if the
  grid were monthly.

  Note also that "les petites choses" is open-ended. It plausibly absorbs items an
  outsider would treat as separate — roadside levies, informal payments at checkpoints,
  minor bribes, a spare inner tube. I treat his 5 XOF/km as covering the whole of it,
  since that is what he says, and flag the ambiguity for elicitation.

  STEP 7 — THE RENTAL, AND WHY IT IS AN EXPENSE AND NOT A LEASE ASSET

  "je lui verse mille cinq cents francs chaque jour que je travaille". The charge is
  strictly per day worked — it does not accrue on Sundays and, on the plain reading, does
  not accrue on days the bike is off the road.

      rental cost = 1,500 x 312 = 468,000 XOF per year

  This needs an IFRS 16 determination, because if a right-of-use asset were recognised the
  whole shape of the FCFF build would change. The test:

    (a) Is there a lease? There is an identified asset (a specific moto) and he directs
        its use throughout the period of use. On the face of it, yes.
    (b) What is the lease term? IFRS 16 measures the ENFORCEABLE period. This arrangement
        is settled day by day, with no stated commitment beyond the day worked and no
        termination penalty described. The enforceable term is therefore effectively one
        day, which sits comfortably inside the twelve-month short-term lease exemption.
    (c) Independently, the low-value asset exemption applies. A small-displacement moto is
        far below the informal threshold at which that exemption is understood to bite.

  Either limb alone is sufficient. Conclusion: no right-of-use asset, no lease liability.
  The 1,500 a day is recognised as an operating expense on a straight-line basis as
  incurred. This is why depreciation in this model is nil rather than merely small.

  Economic observation that follows from the same fact: the rental converts what would
  otherwise be the owner's capital expenditure, depreciation and financing cost into a
  daily operating charge borne by this entity. The asset side of the balance sheet is
  empty BY CONSTRUCTION, not by accident.

  STEP 8 — EBITDA, D&A AND EBIT

      revenue                    1,809,600.00
      less fuel                   (409,987.50)
      less consumables            (113,100.00)
      less moto rental            (468,000.00)
      -----------------------------------------
      total operating cost        (991,087.50)
      EBITDA                        818,512.50

      depreciation and amortisation        0.00   (Step 7; no owned PPE, no ROU asset)
      -----------------------------------------
      EBIT                          818,512.50

  EBIT equals EBITDA exactly. I keep the depreciation line in the ladder rather than
  collapsing it, because its being zero is a substantive result of the IFRS 16 analysis
  and should be visible, not implicit.

  Daily equivalent, for the founder's own frame of reference: 5,800 revenue less 1,314
  fuel less 363 consumables less 1,500 rent, giving about 2,623 XOF of EBITDA on a
  working day.

  STEP 9 — TAX

  This is the least satisfactory input in the model and I say so plainly. The unlevered
  build requires a tax on EBIT. What a Cotonou zem operator actually pays is not a profit
  tax at all — it is a presumptive small-taxpayer levy assessed on turnover, and in
  practice a large share of the trade is outside the net entirely.

  I resolve it by carrying two columns rather than by picking one and hiding the other:

    Base column — 30 percent of EBIT, Benin's standard company income tax rate used as a
    formalisation benchmark:
        tax   = 818,512.50 x 0.30 = 245,553.75 XOF
        NOPAT = 818,512.50 - 245,553.75 = 572,958.75 XOF

    Informal column — 0 percent, the de facto position of an unregistered operator:
        tax   = 0.00
        NOPAT = 818,512.50 XOF

  Friction, stated and not swept away: because no owner's compensation is charged
  anywhere above the tax line (Step 12), applying a company profit-tax rate here means
  taxing what is substantially the operator's labour income at a corporate rate. That is
  the standard unlevered-FCFF convention mechanically applied, and it is arguably the
  wrong economic object. Both columns are traced so the reader can see the full wedge.

  STEP 10 — WORKING CAPITAL

  Every flow in this business settles same-day in cash. Fares are collected on completion,
  so trade receivables are nil. Fuel is bought cash at the pump or the roadside, and the
  rent is handed over daily, so trade payables are nil. The only working capital item that
  genuinely exists is the fuel sitting in the tank.

      fuel inventory = one day of fuel consumption = 409,987.50 / 312 x 1 = 1,314.0625 XOF
      net working capital = 1,314.0625 + 0 receivables - 0 payables = 1,314.0625 XOF

  Because the founder describes an operation already running, that float already sits on
  the opening balance sheet. It is not built during the forecast. With volumes flat, it
  does not move:

      change in NWC = 0.00 in every period

  This near-nil working capital is not a modelling shortcut, it is the finding: a
  same-day-cash micro-operation ties up essentially nothing.

  STEP 11 — CAPEX AND THE FCFF BUILD

  Capital expenditure is nil, for the reason established at Step 0 and Step 7 — the one
  durable asset belongs to the lessor, who also carries its major repairs and its papers.
  Nothing in the utterance describes an owned durable item.

  Unlevered cash flow, per year, all five years:

      NOPAT                              572,958.75
      plus depreciation and amortisation        0.00
      less change in net working capital        0.00
      -----------------------------------------------
      unlevered cash from operations     572,958.75
      less capital expenditure                  0.00
      -----------------------------------------------
      FCFF                               572,958.75 XOF per year

  Informal-tax column: FCFF = 818,512.50 XOF per year.

  Per working day, base column: 572,958.75 / 312 = 1,836.41 XOF a day.

  STEP 12 — PERIODS 2 TO 5, AND WHAT DOES NOT CHANGE

  Nothing in the utterance describes growth, a fare revision, a fuel-price path, or a
  change in the rental. I therefore hold the operation flat in nominal terms and each of
  years 2 through 5 reproduces year 1 exactly: 6,240 trips, 18,096 paid km, 22,620 total
  km, 565.5 litres, 1,809,600 revenue, 818,512.50 EBIT, 572,958.75 FCFF. The cumulative
  rows roll forward — odometer reaching 113,100 km and cumulative FCFF reaching
  2,864,793.75 XOF by the end of year 5.

  A flat five-year strip is the honest answer, not a lazy one. Inventing a growth rate the
  founder did not give would be fabrication, and the operation has no reinvestment
  mechanism through which growth could arise — he cannot buy a second moto out of this
  model because he owns no moto at all.

  Two constructed results to disclaim before anyone reads them as evidence. First, revenue
  per paid kilometre comes out at exactly 100 XOF; that is a direct consequence of my Step 4
  choice to set distances proportional to fares, and carries no independent information.
  Second, because fare per km is then uniform across tiers, the yield is mix-invariant —
  which is itself an artefact of the same assumption and would not survive a real
  tariff survey.

  STEP 13 — OPERATING LEVERAGE AND THE BREAKEVEN

  The rental is fixed per day worked while everything else scales with kilometres, so the
  business has genuine operating leverage within the day. Contribution after fuel and
  consumables but before rent:

      per day  = 5,800 - 1,314.0625 - 362.50 = 4,123.4375 XOF
      per trip = 4,123.4375 / 20 = 206.171875 XOF
      per paid km = 4,123.4375 / 58 = 71.09375 XOF

  Trips needed just to discharge the day's rent:

      1,500 / 206.171875 = 7.28 trips

  So roughly the first seven and a quarter of his twenty daily trips go to the patron
  before he earns anything. That is the sharpest single number in this model and the one
  the founder would recognise immediately.

  Variable cost per kilometre ridden = 18.125 fuel + 5.000 consumables = 23.125 XOF/km,
  which grossed up for empty running is 28.90625 XOF per PAID kilometre against a 100 XOF
  paid-kilometre yield.


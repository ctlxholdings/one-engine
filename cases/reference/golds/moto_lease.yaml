checks:

  # ---- conservation ----
  - "trace.trips_total == trace.trips_short + trace.trips_medium + trace.trips_long"
  - "trace.total_km == trace.paid_km + trace.deadhead_km"
  - "trace.revenue == trace.revenue_short + trace.revenue_medium + trace.revenue_long"
  - "trace.total_operating_cost == trace.fuel_cost + trace.maintenance_cost + trace.rental_cost"
  - "trace.cum_total_km[t] == trace.cum_total_km[t-1] + trace.total_km[t]"
  - "trace.cum_fcff[t] == trace.cum_fcff[t-1] + trace.fcff[t]"
  - "trace.cum_total_km == cumsum(trace.total_km)"
  - "trace.cum_fcff == cumsum(trace.fcff)"
  - "trace.nwc == nwc_opening + cumsum(trace.delta_nwc)"
  - "trace.cum_fcff[last] == sum(trace.fcff)"
  - "sum(trace.fcff) == trace.fcff[first] * grid.periods"
  - "share_short + share_medium + share_long == 1"

  # ---- definition ----
  - "trace.ebitda == trace.revenue - trace.total_operating_cost"
  - "trace.ebit == trace.ebitda - trace.depreciation"
  - "trace.tax == trace.ebit * tax_rate"
  - "trace.nopat == trace.ebit - trace.tax"
  - "trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex"
  - "trace.nwc == trace.fuel_inventory"
  - "trace.tax_informal == trace.ebit * tax_rate_informal"
  - "trace.nopat_informal == trace.ebit - trace.tax_informal"
  - "trace.fcff_informal == trace.nopat_informal + trace.depreciation - trace.delta_nwc - trace.capex"
  - "trace.depreciation == depreciation_per_year"
  - "trace.capex == capex_per_year"

  # ---- driver-bridge ----
  - "trace.days_worked == working_days_per_week * weeks_per_year"
  - "trace.trips_total == trips_per_day * trace.days_worked"
  - "trace.trips_short == trips_per_day * share_short * trace.days_worked"
  - "trace.trips_medium == trips_per_day * share_medium * trace.days_worked"
  - "trace.trips_long == trips_per_day * share_long * trace.days_worked"
  - "trace.revenue_short == trace.trips_short * fare_short"
  - "trace.revenue_medium == trace.trips_medium * fare_medium"
  - "trace.revenue_long == trace.trips_long * fare_long"
  - "trace.paid_km == trace.trips_short * km_short + trace.trips_medium * km_medium + trace.trips_long * km_long"
  - "trace.total_km == trace.paid_km * deadhead_factor"
  - "trace.litres_fuel == trace.total_km * fuel_consumption_l_per_100km / 100"
  - "trace.fuel_cost == trace.litres_fuel * fuel_price_per_litre"
  - "trace.maintenance_cost == trace.total_km * maintenance_per_km"
  - "trace.rental_cost == daily_rent * trace.days_worked"
  - "trace.fuel_cost_per_km == fuel_price_per_litre * fuel_consumption_l_per_100km / 100"
  - "trace.variable_cost_per_km == trace.fuel_cost_per_km + maintenance_per_km"
  - "trace.avg_fare == trace.revenue / trace.trips_total"
  - "trace.revenue_per_paid_km == trace.revenue / trace.paid_km"
  - "trace.contribution_per_trip == (trace.revenue - trace.fuel_cost - trace.maintenance_cost) / trace.trips_total"
  - "trace.breakeven_trips_per_day * trace.contribution_per_trip == daily_rent"
  - "trace.fuel_inventory == trace.fuel_cost / trace.days_worked * fuel_inventory_days"

  # ---- non-negativity and ordering ----
  - "trace.ebitda[t] >= 0"
  - "trace.ebit[t] >= 0"
  - "trace.nopat[t] >= 0"
  - "trace.fcff[t] >= 0"
  - "trace.nwc[t] >= 0"
  - "trace.fuel_inventory[t] >= 0"
  - "trace.deadhead_km[t] >= 0"
  - "trace.paid_km[t] <= trace.total_km[t]"
  - "trace.contribution_per_trip[t] > 0"
  - "trace.breakeven_trips_per_day[t] <= trips_per_day"
  - "trace.fcff_informal[t] >= trace.fcff[t]"
  - "trace.cum_fcff[t] >= trace.fcff[t]"

notes:

  headline_finding: |
    This entity has almost no asset side. The moto is rented, its major repairs and its
    registration and insurance are the lessor's cost, and every transaction settles in
    cash the same day. Invested capital is one day of fuel in the tank. Consequently
    FCFF collapses to NOPAT — the D&A, capex and change-in-working-capital terms of the
    unlevered bridge are all identically zero — and the resulting cash flow is
    overwhelmingly the operator's labour income rather than a return on capital. Return
    on invested capital is not a meaningful metric on this business, and any valuation
    that capitalises this FCFF is capitalising a person's earning capacity, not a firm.

  owner_compensation: |
    No charge for the operator's own labour is taken anywhere in the build, because he
    describes none and there is no market wage in the utterance. FCFF as reported
    therefore conflates his wage with any residual return to capital. Charging a market
    wage would reduce FCFF; on a business with this cost structure the direction is
    unambiguous and the magnitude is large enough that the sign of the residual is not
    assured. This is deferred to elicitation rather than guessed at.

  largest_uncertainties_direction_only: |
    Ranked by how much they move the answer, all directional only — no alternative
    numbers are asserted here.
      1. Fare mix across the three tiers (ASSUMED 50/30/20). Under the assumed distance
         ladder, a mix skewed toward long trips means more kilometres sold per day at a
         positive contribution per kilometre against a rent that is fixed per day, so
         FCFF rises. A mix skewed short lowers it.
      2. Distance per trip (ASSUMED 2/3/5 km). Shorter trips at the same posted fares
         raise yield per kilometre and cut fuel and consumables, so FCFF rises. Longer
         trips at the same fares lower it.
      3. Empty running (ASSUMED 25 percent). More deadheading burns fuel and wears tyres
         on unpaid kilometres, so FCFF falls.
      4. Tax regime. Both bounds of the plausible range are materialised as traced
         columns rather than described in prose.
      5. Vehicle availability. He asserts he rides rain or shine, but the lessor's
         "grosses réparations" imply days off the road. Because rent is due only on days
         worked and no fuel burns on an idle day, downtime scales the entire profit and
         loss account down roughly proportionally, so FCFF falls.

  accounting_judgement_calls: |
    - IFRS 16. The rental is expensed, not capitalised. The arrangement is settled day by
      day with no described commitment or termination penalty, so the enforceable lease
      term is effectively one day and the short-term exemption applies; the low-value
      exemption applies independently. Had a right-of-use asset been recognised, the
      payments would move below the operating line and unlevered FCFF would be higher —
      direction only.
    - IAS 37. The 5 XOF/km consumables run-rate is an accrual for replacements not yet
      purchased, which strict IFRS would not recognise as a provision. Adopted anyway
      because on an annual grid the smoothed run-rate and the incurred cost converge, and
      because it is the founder's own natural description of the cost. It would need
      revisiting on a monthly or quarterly grid, where the saw-tooth would be visible.
    - TVA. Treated as below the registration threshold — fares gross with no output tax,
      input VAT in the pump price non-recoverable and left in cost. Internally consistent.
    - Tyres are expensed, not capitalised, even though a tyre is physically durable. The
      operator cannot capitalise an improvement to an asset he does not control beyond
      the current day, and he captures no residual value on it.

  natural_units_kept: |
    The trace is carried in the business's own quantities — trips by tariff tier,
    kilometres paid and kilometres ridden, litres — rather than being forced into generic
    volume-times-price lines. The friction worth naming is that "revenue per trip" and
    "revenue per kilometre" are two different natural units here and the operator thinks
    in the first while both of his cost rates are quoted in the second. Bridging them is
    exactly where the unobserved distance assumption enters, which is why that assumption
    is the load-bearing one in the whole model.

  flat_profile: |
    No growth, inflation, fare revision or fuel-price path is stated, so the strip is held
    flat in nominal terms. There is also no reinvestment mechanism through which growth
    could arise, since the operator owns no vehicle to add to. In real terms the profile
    is unlikely to be flat — customary zem fares are sticky while fuel is volatile — so
    real FCFF would tend to erode over the horizon. Direction only.

  horizon: |
    Five annual periods. The arrangement itself is cancellable daily and has no
    contractual term, so this is an economic horizon anchored on the service life of the
    class of machine being rented, not a contractual one. Because the profile is flat, the
    horizon choice does not affect per-period FCFF; it only scales the cumulative rows.

  calendar: |
    312 days worked uses the 52-week convention. A real calendar gives 312 to 314,
    depending on the number of Sundays and leap days. Under one percent; not modelled.

  elicitation_questions: |
    Ordered by value of the information.
      1. Of twenty trips on a normal day, how many are court, how many moyen, how many
         long? This single answer removes the largest uncertainty in the model.
      2. How far is a course courte, a moyenne, a longue — in minutes or in landmarks if
         not in kilometres?
      3. How many kilometres do you ride in a day in total, including when you are empty
         and looking for a client? Or, equivalently, how many litres do you buy in a day?
      4. Do you pay the patron on a day the moto is in the workshop? How many days a year
         is it off the road?
      5. Does "les petites choses" include payments at police checkpoints, the municipal
         zem plate, or your own badge and licence, or only tyres and oil?
      6. Do you pay anything to the mairie or the tax office in a year, and how much?
      7. Do you own anything used in the work — helmet, phone, spare parts, a deposit
         lodged with the patron?
      8. Are there regular clients who pay you weekly or monthly rather than per trip?
      9. Is the 725 the station price, and is that what you actually pay, or do you buy
         at the roadside?
      10. What would you earn in a month doing other work available to you? This is the
          input needed to separate your wage from any return on capital.

  risks_not_quantified: |
    Accident and injury, with no income protection described for the operator himself
    (the lessor holds the moto's papers, which would cover the vehicle and third parties,
    not this entity's earnings). Sudden fare regulation. Fuel supply disruption. Loss of
    the rental at the lessor's discretion, which given the daily cancellability is a
    one-day-notice termination of the entire business. None of these are in the numbers.

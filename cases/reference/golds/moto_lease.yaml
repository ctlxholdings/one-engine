id: zem-cotonou-rented-moto-fcff-001
title: "Zémidjan (moto-taxi) owner-operator on a rented bike, Cotonou, Benin — unlevered FCFF via NOPAT"
currency: XOF
grid:
  periods: 5
  freq: annual

utterance:
  fr: |
    Moi je fais zémidjan à Cotonou, mais la moto n'est pas à moi. Je la loue au patron : je lui verse mille cinq cents francs chaque jour que je travaille, qu'il pleuve ou qu'il fasse beau. Je fais vingt courses par jour, en moyenne. Y a le court à 200, le moyen à 300, le long à 500. L'essence c'est 725 le litre, je consomme deux litres et demi par cent bornes. Je travaille tous les jours, sauf dimanche. Le patron, lui, s'occupe des grosses réparations et des papiers de la moto ; moi je paie l'essence et les petites choses, les pneus, la vidange — ça me fait dans les cinq francs le kilomètre.
  en: |
    I run a moto-taxi in Cotonou, but the moto isn't mine. I rent it from the boss: I pay him one thousand five hundred francs every day I work, rain or shine. I do about twenty trips a day on average. Short trips 200, medium 300, long 500. Fuel is 725 a litre, the bike does two and a half litres per hundred kilometres. I work every day except Sunday. The boss handles the big repairs and the moto's papers; I pay the fuel and the small things, tyres, oil changes — that runs me about five francs a kilometre.


  sw_mannheim:
    entity: studierendenwerk_mannheim
    role: authority
    groups: [demand, public]
    status: stated
    name: Studierendenwerk Mannheim (SW Mannheim, the student union)
    text: "'The building owner, the student´s union (Studierendenwerk Mannheim) is a public institution' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4347); owns 19 apartment buildings with some 3,150 apartments (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4349-4350); 'the building owner decided to continue the refurbishment process only if the responsibility of the energy performance were provided by the contractor' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4354-4356). Role authority on 'public institution'; its place inside general government is not shown"

rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU general government at close}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: true
    this_case: "German public client, EU member at close (standing ruling): the test applies; its outcome is undetermined because neither the guaranteed savings, the contract term nor the operational payments are published. Planning figures only: investment 2,541 kEUR against savings of 185.8 kEUR/yr, 'without any seed money' (no grant, no owner contribution, L4577-4578)"
    source: E15 L2576-2582
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: false
    this_case: "client_sector public and asset_owner client"
    source: RULINGS.md ruling 7
  penalty_holiday:
    scope: contractual
    rule: "'Many standard European EPC contracts now penalize unfulfilled performance guarantees. These penalties have been excluded from the DER EPC contract for the first 3 years' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4481-4484)"
    applies_here: true
    source: "der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4481-4484"
  maintenance_cap:
    scope: contractual
    rule: "'only a limited cost capacity of 0.3 €/m²yr must be provided' for windows and thermal envelope; 'the building owner will pay the difference' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4528-4531)"
    applies_here: true
    source: "der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4528-4531"


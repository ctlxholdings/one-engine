    status: inferred
    note: "'In 2015, it was agreed to set up the first German DER EPC project in the Ludwig Frank quartier' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4356-4357); the award is still open on 1 June 2016 and the detailed technical plan comes after it (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4563-4571). Unsettled: terms still to be fixed. Contract period not stated, but it is 'extended' against HVAC EPCs (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4525)"
  subcontracts:

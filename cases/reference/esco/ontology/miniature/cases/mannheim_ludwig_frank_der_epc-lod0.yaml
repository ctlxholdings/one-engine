commitments:
  c1:
    family: performance_promise
    from: awarded_esco
    to: sw_mannheim
    status: stated
    what: "takes 'responsibility for the energy performance of a thermal retrofit' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4456-4457) across the quartier: deep retrofit of one building (envelope, ventilation, HVAC, lighting), HVAC, lighting and PV in seven buildings, and a CHP with gas peak boiler for buildings 1 to 8 (Table A-5, der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4586-4602); 'responsible for the total investment costs of the measures' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4495-4496). Maintenance and replacement duty limited to one life cycle for larger HVAC parts, two for smaller devices, and a cap for windows and envelope (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4526-4529). Penalties for an unmet guarantee are excluded for the first 3 years (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4482-4484). The Partner's own capital sits inside this promise"
    established_by: epc
  c2:
    family: payment_promise
    from: sw_mannheim
    to: awarded_esco
    status: inferred
    depends_on_savings: true   # remuneration related to verified performance (A61 L4458-4459)
    what: "'remuneration system ... related to the verified performance' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4458-4459): the ESCO is paid from the savings partition it won in the bid; 'the remaining risk of receiving only the verified energy savings' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4484-4485). The share is a bid variable (award criterion, Table A-4, der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4537-4543) and is not published. If the cap of 0.3 EUR/m2 yr for window and envelope maintenance is not enough, 'the building owner will pay the difference needed to maintain the functionality' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4528-4531)"
    established_by: epc
  c3:
    family: determination_promise
    from: [awarded_esco, sw_mannheim]
    to: [awarded_esco, sw_mannheim]
    status: inferred
    determines: savings   # verified savings (A61 L4458-4459)
    what: "payment follows 'verified' savings (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4458-4459); the de-risking steps include 'Simplification of M&V process' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4629). The baseline is set in the audit (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4358-4361). Who measures and verifies is not stated; no independent verifier named"
    established_by: epc
  c4:
    family: performance_promise
    from: kea
    to: sw_mannheim
    status: inferred
    what: "supplies the PHPP model of the pre-refurbishment state and a modelling solution for -55% savings, provided to the bidders in the tender data (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4467-4471). Inferred as a service to the client because the client ran the tender; no agreement between KEA and SW Mannheim is described"
  c5:
    family: payment_promise
    from: sw_mannheim
    to: kea
    status: unstated
    what: "counter-promise required by duality; the text does not say KEA is paid (it worked inside the Annex 61 research group)"
  c6:
    family: performance_promise
    from: subcontractors
    to: awarded_esco
    status: generic
    what: "deliver the envelope and HVAC works priced in the bids the ESCOs collect (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4499-4500)"
    established_by: subcontracts
  c7:
    family: payment_promise
    from: awarded_esco
    to: subcontractors
    status: unstated
    what: "counter-promise required by duality; price not given"
    established_by: subcontracts


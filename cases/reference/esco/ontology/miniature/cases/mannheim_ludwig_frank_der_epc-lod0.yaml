# Miniature — Studierendenwerk Mannheim, Ludwig Frank quartier: the first German deep-energy-retrofit EPC (Mannheim, Germany),
# expressed at ESCO LOD 0. Batch 7, group J, deal T05: reviewed final (X and Y reconciled, 3 Oct 2026; decisions in ../decisions.json).
#
# Evidence: one local text, IEA EBC Annex 61 "Deep Energy Retrofit, Business and Technical Concepts" business guide (2017), Appendix A.4,
# plus two mentions of the same project in chapter 5. Not under input-licensed/, so quotes run up to 25 words.
# Every fact carries its status: stated / inferred / default / generic / unstated.
# The text is written at the award stage (1 June 2016): the winning ESCO is not named, the EPC is not yet signed and no financing is described.

miniature: mannheim_ludwig_frank_der_epc
lod: 0
case: batch7.T05
case_kind: deal   # a real project with a named client and quartier, described before signature; one EPC over eight buildings
in_scope: true
in_scope_why: "The goal is 'a performance guarantee in which the remuneration system is related to the verified performance of the implemented project measures' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4457-4459); the ESCO takes 'responsibility for the energy performance of a thermal retrofit' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4456-4457). payment_basis savings, so an ESCO deal (ruling 14)."

tests_unused:
- item: energy_auditor
  kind: role
  used: true
  reason: "KEA supplies the baseline model that the bidders price against: 'KEA is providing a PHPP role model in the software PHPP, which depicts the pre-refurbishment status of the building' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4467-4469), with a modelling solution 'to achieve -55% of energy savings' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4469-4470). That is the role definition: baseline and savings potential before contract. KEA never calls itself an auditor, and who ran the building energy audit (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4358-4361) is not stated, so the fit is by function (inferred)"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No receivables, notes or vehicle in the text"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No financing is described, so no hedge"
- item: authority_guarantor
  kind: role
  used: false
  reason: "No guarantee of the client's payments is mentioned. The chapter-5 SMESCO model has a public-bank loan guarantee (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:3862-3868) but for small ESCOs generally, not for Mannheim"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "Title is not stated; the default client applies. No third-party owner"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "'the remaining risk of receiving only the verified energy savings' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4484-4485): the ESCO is paid from verified savings, not from an availability or comfort level"

single_source_exercised:
- term: energy_auditor
  kind: role
  evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4467 | It was agreed that KEA is providing a PHPP role"
  note: "role fit by function (baseline model for the tender); KEA's contract with the client is not stated"

source:
  id: ANNEX61
  title: IEA EBC Annex 61, Deep Energy Retrofit, Business and Technical Concepts for a Large-Scale Implementation, business guide
  publisher: IEA Energy in Buildings and Communities Programme, 2017
  passage: "Appendix A.4 'Implementation of advanced DER EPC business models in dormitories in Mannheim, Germany' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4343-4636); chapter 5 mentions (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:3352-3356, der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:3859-3860)"
  oracle: "none; not a published validation target"
  context:
  - "VfW, the German association of heating suppliers (chapter EPC): organised three workshops with 'four interested ESCOs' that identified the de-risking measures (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4461-4463). Industry association, no promise: rule source / context"
  - "The Annex 61 ST B working group: wrote the de-risking measures (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4460-4463). Research group, no promise"
  - "The three ESCOs selected to bid (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4561-4562) and the losing bidders: they prepare bids, no promise in the awarded EPC. Context"
  - "A review team of 'building owner, three experienced architects' checks the specification and subcontractor prices (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4500-4502), and 'External experts with expertise in DER and building physics will provide the QA of the technical plan' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4569-4570). Reviewers for the client: no promise stated, and no role fits a design reviewer: context"
  notes:
  - "The EPC is not yet signed in the text: 'one ESCO will be awarded. This is happening at this point of time (June 1, 2016)' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4566-4567), then a detailed planning phase before 'the second implementation phase will begin in September 2016' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4570-4571). The EPC is recorded terms_settled unsettled"
  - "Pool size differs inside the source: one deep-retrofit building with 'seven other buildings' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4475-4476) in appendix A.4, 'one DER and four normal HVAC assets' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:3356) in chapter 5. Table A-3 lists eight buildings (42, 43, 1 to 6) and Table A-5 labels eight (B42, B2 to B8). Appendix A.4 followed"
  - "Table A-5 labels buildings B42 and B2 to B8 while Table A-3 uses 42, 43 and 1 to 6: the mapping is not given"
  - "Payback: the text says 'dynamic payback period of global investment costs in 17.4 years' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4576-4577); the last row of Table A-5 prints 13.8 years static for the 44 kEUR/yr partition and the heading says '17 years' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4607-4609)"
  - "KEA is also described as having 'implemented a DER EPC by including energy savings, energy substitution by renewables, and maintenance cost savings into the financing scheme' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:3352-3353) and the case is called a 'facilitation' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4619). A facilitator role is possible but the text does not say KEA facilitated the Mannheim tender; not added"

jurisdiction:
  country: Germany
  iso: DE
  eu_member: true
  client_eu_general_government_at_close: true
  as_of: "no financial close in the text; award stage, 1 June 2016 (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4567)"
  status: stated
  why: "'The building owner, the student´s union (Studierendenwerk Mannheim) is a public institution.' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4347). Standing batch-5 ruling: a German public client named as a public body is EU general government at close, status stated; C1 applies and its outcome is undetermined when the payments are not published. The statistical classification itself is not in the source"


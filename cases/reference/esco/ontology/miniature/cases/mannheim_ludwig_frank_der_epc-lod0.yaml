    name: The ESCO awarded the contract (not named)
    text: "'one ESCO will be awarded. This is happening at this point of time (June 1, 2016)' (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4566-4567); it will 'prepare a detailed technical plan' with SW Mannheim (der-vpp/spec-run/esco-moneyflow/input/iea-ebc-annex61-deep-energy-retrofit-business-guide-2017.txt:4568-4569). Inferred: the party exists as the awardee, not as a signatory"

# Miniature — EESL's UJALA programme, on-bill option (India), expressed at ESCO LOD 0
#
# Batch 2 (CASE_SPEC_2.md), reconciled by the adjudicator from writers X (base) and Y; changes listed in source.notes.
# Original writer X. Shape copied from bytom_schools-lod0.yaml (normalised 1 Oct 2026).
# Frame: model/elements.yaml LOD 0 block (41 roles, 7 commitment families, 12 settings; owner rulings 28 Sep 2026).
# Every fact carries its status: stated / inferred / default / generic / unstated. Nothing invented; only the corpus.
# A programme: one representative contract — a household taking LED bulbs under Option 2 (PAYS on the electricity
# bill) of Figure 7. Line numbers refer to corpus input/wb-super-escos-emerging-possibilities-2018.txt (E16), whose
# layout is multi-column: the EESL paragraph runs in the right column L405-422 and continues in the left column
# L482-524; Figure 7 is at L441-479.

miniature: eesl_ujala_onbill
lod: 0
case: batch2.eesl_ujala_onbill
case_kind: programme   # UJALA: 'over 300 million ... LED bulbs over four years to households and institutional consumers' (L510-516)

tests_unused:   # which of the 22 unused LOD 0 items this case was chosen to test
- item: collection_placement=on_bill
  kind: setting_value
  used: true
  reason: "'making the entire up-front capital investment, through PAYS under an on-bill financing approach (Option 2 in figure 7)' (L420-422); Figure 7 routes the consumer's 'Monthly payment' through the 'Electricity distribution utility' (L444-457)"
- item: collector_biller
  kind: role
  used: true
  reason: "recoded 3 Oct (G-B7M-02: a utility collecting on its bill for another payee also takes collector_biller). The distribution utility carries the consumer's 'Monthly payment' and passes 'Payments' to EESL (Figure 7, L444-459) for EESL's appliances, not for the utility's own energy (L420-422): EESL is the payee. One party with two roles, home role utility_supplier"
- item: equipment_supplier
  kind: role
  used: true
  reason: "'by procuring large volumes from a variety of suppliers that meet strong technical standards' (L490-492); 'competitive bulk procurement' (L417-418). Also exercised; not on the spec's list for this case"
- item: occupant
  kind: role
  used: false
  reason: "the households pay the electricity bill that carries the instalment, so host ('pays the fee or the energy bill') fits; the text does not distinguish tenant from owner"

source:   # where the facts come from; context = actors outside the deal boundary (F23); notes = observations that are not gaps
  id: E16
  title: 'Transforming Energy Efficiency Markets in Developing Countries: The Emerging Possibilities of Super ESCOs'
  publisher: World Bank Live Wire 2018/92 (Sarkar & Moin)
  passage: "'India's Energy Efficiency Services Limited (EESL)' (corpus input/wb-super-escos-emerging-possibilities-2018.txt L405-422 right column, continued L482-524 left column; fn 8 L425-427); Figure 7 'Operating model of EESL's UJALA Program' (L441-479)"
  secondary:
  - id: E09
    passage: "corpus input/src-limaye-case-for-super-esco-2010.txt L591-607: EESL being established, 'capitalized by four existing national public sector undertakings', initial capital 'expected to be about US$50 million' (2010, before UJALA)"
  oracle: none
  notes:
  - "Adjudication (batch 2): X and Y agreed on every role and every setting value. Kept the distribution agency as epc_contractor (inferred) — both writers; it delivers goods for the Partner rather than building works, so the definition fits loosely (lod0_gaps). Added writer Y's development_partners (ifi_dfi) as a separate loan leg (L416-417). Utility collection kept inferred (agency read from Figure 7 arrows)"
  - "Figure 7 nodes: 'Financial institution', 'EESL', 'Electricity distribution utility', 'Consumer', 'Distribution agency'; labels 'Loan from financial institution', 'Loan repayment', 'Payments', 'LED bulbs, tube lights, and fans', 'LED bulbs, tube lights, and fan distribution', 'Monthly payment', 'Energy saving', 'Option 1 Upfront payment', 'Option 2' (L444-474). Arrow directions are not recoverable from the text extraction; read with the prose (L420-422). Arrow-derived commitments are inferred (F18)"
  - "Option 1 (direct up-front payment by the consumer, L422, L482) is outside this representative contract"
  - "No determination drives the payment: the PAYS instalment is not stated to be computed on measured savings. EESL performs 'M&V of savings' within UJALA (L516-518), recorded as c13"
  context:
  - "EESL's street-lighting programme (SLNP, deemed savings, L498-506) and the later World Bank loan to develop business models with private ESCOs (L442-448) are other EESL activities, outside this contract"

jurisdiction:   # header field, not a setting (F02): drives the C1 trigger
  country: India
  iso: IN
  eu_member: false
  client_eu_general_government: false
  status: stated
  why: "'India's Energy Efficiency Services Limited (EESL)' (L405); households in India (L512-516)"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: the UJALA on-bill purchase, the collection arrangement and the financing each establish (fibo-fnd-rel-rel:confers) their commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 41 (a list = several roles, home role first; F13); groups computed from the role(s)
  eesl:
    entity: eesl
    role: aggregator_super_esco
    groups: [partner, delivery, capital, public]
    status: stated
    name: Energy Efficiency Services Limited (EESL)
    text: "'established in 2009 as a state-owned ESCO, a joint venture of four public sector enterprises under the Ministry of Power' (L406-408); listed among 'more recently established Super ESCOs in India' (L403); 'EESL's approach involves aggregating demand for energy-efficient appliances and equipment, providing up-front financing ... and using competitive bulk procurement' (L413-418). Its role 'as a facilitator of projects implemented by private ESCOs has been limited to date' (L441-442): in UJALA it subcontracts no ESCO. Alternative partner_esco"
  consumer:
    role: host
    groups: [demand]
    status: stated
    text: "'households and institutional consumers' (L514-516); Figure 7 'Consumer' paying a 'Monthly payment' under Option 2 (L456-462). Role host: pays the fee and the energy bill"
  discom:
    role: [utility_supplier, collector_biller]
    groups: [energy, collection]
    status: stated
    text: "Figure 7 'Electricity distribution utility' (L444-453) carrying the consumer's 'Monthly payment' (Option 2) and passing 'Payments' to EESL (L456-459); 'PAYS under an on-bill financing approach' (L421-422). Not named. collector_biller second (G-B7M-02, 3 Oct): it bills and collects for EESL, a payee other than itself"
  distribution_agency:
    role: epc_contractor
    groups: [delivery]
    status: inferred
    text: "Figure 7 'Distribution agency' receiving 'LED bulbs, tube lights, and fans' and doing 'LED bulbs, tube lights, and fan distribution' (L466-474). Nearest role: epc_contractor (delivers the works for the Partner); it distributes, it does not build or install (lod0_gaps)"
  suppliers:
    role: equipment_supplier
    groups: [delivery, capital]
    status: stated
    text: "'by procuring large volumes from a variety of suppliers that meet strong technical standards' (L490-492); 'competitive bulk procurement' (L417-418); not named. No supplier credit is stated"
  financial_institution:
    role: lender
    groups: [capital]
    status: stated
    text: "Figure 7 'Loan from financial institution' / 'Loan repayment' (L445-457); 'loans from ... commercial lenders' (L416-417). Not named"
  development_partners:
    role: ifi_dfi
    groups: [public, capital]
    status: stated
    text: "'loans from development partners' (L416-417), part of EESL's 'combination of financing sources' (L415-416). Not named; whether they fund UJALA in particular is not said (taken from writer Y)"
  promoters:
    role: equity_investor
    groups: [capital]
    status: stated
    name: NTPC, REC, PFC, PGCIL (fn 8)
    text: "'equity capital from promoters' (L415-416); 'a joint venture of four public sector enterprises' (L407), named in fn 8 (L425-427). Public sector enterprises, so government_financier is the alternative; equity_investor kept because the act is ownership capital and the text calls them promoters"

contract:   # the agreements that establish the commitments
  ujala_onbill:
    core: contract
    parties: [eesl, consumer]
    status: stated
    note: "Option 2 'PAYS under an on-bill financing approach' (L420-422); instalment amount and number not given"
  collection_arrangement:
    core: contract
    parties: [eesl, discom]
    status: inferred
    note: "Figure 7 'Monthly payment' via the utility and 'Payments' to EESL (L456-459); form not stated"
  distribution:
    core: contract
    parties: [eesl, distribution_agency]
    status: inferred
    note: Figure 7 (L466-474)
  procurement:
    core: contract
    parties: [eesl, suppliers]
    status: stated
    note: "'competitive bulk procurement' (L417-418)"
  loan:
    core: contract
    parties: [financial_institution, eesl]
    status: stated
    note: "Figure 7 'Loan from financial institution' (L445-452); L416-417"
  dp_loans:
    core: contract
    parties: [development_partners, eesl]
    status: stated
    note: "'loans from development partners' (L416-417); terms not stated"
  equity:
    core: contract
    parties: [promoters, eesl]
    status: stated
    note: "'equity capital from promoters' (L415-416)"

commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: performance_promise
    from: eesl
    to: consumer
    status: stated
    what: "LED bulbs, tube lights and efficient ceiling fans (Figure 7 title, L441-442), with 'quality control, M&V of savings, and after-sales and warranty servicing' (L516-518); EESL makes 'the entire up-front capital investment' (L420-421), which stays inside this promise (F05)"
    established_by: ujala_onbill
  c2:
    family: payment_promise
    from: consumer
    to: eesl
    status: stated
    what: "repayment of the equipment through PAYS on the electricity bill (Option 2, L421-422); Figure 7 'Monthly payment' (L456-457). Amount, number of instalments not given"
    established_by: ujala_onbill
  c3:
    family: agency_promise
    from: discom
    to: eesl
    status: inferred
    what: "collects the consumer's monthly payment on the electricity bill and remits it to EESL: Figure 7 'Monthly payment' via the 'Electricity distribution utility' and 'Payments' to EESL (L444-459); prose 'on-bill financing approach' (L421-422). Inferred from figure arrows (F18)"
    established_by: collection_arrangement
  c4:
    family: payment_promise
    from: eesl
    to: discom
    status: unstated
    what: "counter-promise required by duality; source silent (a collection fee or other consideration for the utility's billing service is not stated)"
    established_by: collection_arrangement
  c5:
    family: performance_promise
    from: distribution_agency
    to: eesl
    status: inferred
    what: "'LED bulbs, tube lights, and fan distribution' to consumers on EESL's behalf (Figure 7, L466-474)"
    established_by: distribution
  c6:
    family: payment_promise
    from: eesl
    to: distribution_agency
    status: unstated
    what: counter-promise required by duality; source silent (what EESL pays the distribution agency is not stated)
    established_by: distribution
  c7:
    family: performance_promise
    from: suppliers
    to: eesl
    status: stated
    what: "supply of high-efficiency appliances in large volumes meeting 'strong technical standards' (L490-492)"
    established_by: procurement
  c8:
    family: payment_promise
    from: eesl
    to: suppliers
    status: inferred
    what: "purchase price under competitive bulk procurement (L417-418); LED procurement price fell 'from $4.60 per bulb in 2014 to $0.56 in 2017' (L520-522)"
    established_by: procurement
  c9:
    family: funding_promise
    from: financial_institution
    to: eesl
    status: stated
    funding_instrument: loan   # loan from a financial institution (L445-452)
    what: "'Loan from financial institution' (Figure 7, L445-452); 'loans from ... commercial lenders' (L416-417)"
    established_by: loan
  c10:
    family: payment_promise
    from: eesl
    to: financial_institution
    status: inferred
    what: "'Loan repayment' (Figure 7, L456-457; figure arrow)"
    established_by: loan
  c11:
    family: funding_promise
    from: promoters
    to: eesl
    status: stated
    funding_instrument: equity   # promoters' equity (L415-416)
    what: "'equity capital from promoters' (L415-416)"
    established_by: equity
  c12:
    family: payment_promise
    from: eesl
    to: promoters
    status: inferred
    what: residual claim of the owners on the company they capitalised (F07); not stated
    established_by: equity
  c13:
    family: determination_promise
    from: eesl
    to: consumer
    status: stated
    determines: savings   # M&V of savings (L516-518)
    what: "'M&V of savings' as part of UJALA delivery (L516-518). The instalment is not stated to depend on it"
    established_by: ujala_onbill
  c14:
    family: funding_promise
    from: development_partners
    to: eesl
    status: stated
    funding_instrument: loan   # loans from development partners (L416-417)
    what: "'loans from development partners' (L416-417), part of the financing mix"
    established_by: dp_loans
  c15:
    family: payment_promise
    from: eesl
    to: development_partners
    status: inferred
    what: repayment; a loan is by definition repayable (L416-417)
    established_by: dp_loans

settings:   # the 13 LOD 0 facets, in vocabulary order (payment_basis added 1 Oct, owner ruling)
  payment_basis: {value: asset, status: stated, why: "c2: consumer repays EESL's up-front investment in the bulbs and fans through on-bill instalments 'or a direct up-front payment' (E16 L420-422; Fig 7 L456-457)."}
  client_sector:
    value: private
    status: stated
    why: "'households and institutional consumers' (L514-516); the representative contract is a household (E16 fn 9 on 'the residential sector', L428-437). Institutional consumers may be public"
  partner_form:
    value: corporate
    status: stated
    why: "'a state-owned ESCO, a joint venture of four public sector enterprises' (L406-407): a standing company, not a deal SPV (F22)"
  borrower:
    value: partner
    status: stated
    why: "EESL takes the loans: 'Loan from financial institution' to EESL (Figure 7) and 'loans from development partners and commercial lenders' (L416-417)"
  receivable_holder:
    value: partner
    status: inferred
    why: "the consumer repays EESL's up-front investment (L420-422); the utility collects as agent (c3), no assignment is mentioned"
  collection_placement:
    value: on_bill
    status: stated
    why: "'through PAYS under an on-bill financing approach (Option 2 in figure 7)' (L421-422)"
  aggregation:
    value: super_esco
    status: stated
    why: "EESL is a Super ESCO in the source (L403-408) and its approach is 'aggregating demand' (L413); F13 pairs this value with the role aggregator_super_esco"
  debt_seniority: {value: senior, status: default, why: not stated}
  assignment_recourse: {value: not_applicable, status: inferred, why: follows from receivable_holder = partner}
  savings_basis:
    value: measured
    status: inferred
    why: "UJALA delivery includes 'M&V of savings' (L516-518). Alternative deemed: EESL uses 'the deemed savings M&V approach' in street lighting (L484-487, L502-504), a different programme; the corpus does not say which method UJALA's M&V uses"
  grant_recipient: {value: none, status: default, why: no grant mentioned for UJALA}
  asset_owner:
    value: client
    status: inferred
    why: "the bulbs, tube lights and fans are distributed to consumers (Figure 7, L470-474) and repaid by them; no retention of title is mentioned"
  bill_custody:
    value: client
    status: inferred
    why: "the consumer keeps paying its electricity bill, which carries the instalment (Option 2, L421-422)"

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments forecast over the EPC + (b) any government financing not repayable by the Partner (e.g. capital grant), else the EPC is ON BALANCE SHEET for government (E15 L2578-2582; the summary box L6932-6943 states the sum without the basis)
    applies_here: false
    this_case: private household client in India; outside the rule on both counts
    source: E15 L2576-2582, L5363-5380 (EU vs government financing), L6930-6943; register constraints.entries.C1_eurostat
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: partner}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? The private-sector counterpart of C1: when the Partner owns the installed assets during the term and the client pays for their use, the payments may be a lease liability on the client's balance sheet. Corpus: E02 L3293-3295 ('renewed interest for EnPC and EEaaS after leasing has been categorized as on-balance in the IFRS rules')"
    applies_here: false
    this_case: "client private but asset_owner client (the consumer buys the bulbs by instalments); households do not report under IFRS"
    source: gaps G23; E02 L3293-3295; register.yaml L301 ifrs_16 flag

numbers:   # instance data, not vocabulary
  eesl_established: 2009                     # L406
  india_ee_market_usd_bn_per_year: 12        # L410-411
  led_bulbs_deployed_m: 300                  # 'over 300 million (7 and 9 watt) LED bulbs over four years' (L510-516), as of May 2018
  led_watts: 7 and 9                          # L512
  avoided_generation_capacity_gw: 8.5        # 'over 8.5 gigawatts' (L508-510)
  led_procurement_price_usd: {2014: 4.60, 2017: 0.56}   # L520-522
  led_retail_price_usd: {before: 8.20, after: 2.20}       # L522-524 ('during the same period')
  led_payback_months_generic: 6-12          # L44 (general statement, not UJALA-specific)
  derived:
    procurement_price_drop: (4.60 - 0.56) / 4.60 = 87.8%
    retail_price_drop: (8.20 - 2.20) / 8.20 = 73.2%
    bulbs_per_year_m: 300 / 4 = 75 (average over the four years)

reciprocity:   # gives/receives computed from commitments; one_way per convention F06
  eesl: {gives: [c1, c4, c6, c8, c10, c12, c13, c15], receives: [c2, c3, c5, c7, c9, c11, c14], one_way: false}
  consumer: {gives: [c2], receives: [c1, c13], one_way: false}
  discom:
    gives: [c3]
    receives: [c4]
    one_way: true
    reason: "counter-promise economically necessary but unstated: the utility bills and collects for EESL; its consideration is not stated; recorded as c4 status unstated (F06)"
  distribution_agency:
    gives: [c5]
    receives: [c6]
    one_way: true
    reason: "counter-promise economically necessary but unstated: what EESL pays for distribution is not stated; recorded as c6 status unstated (F06)"
  suppliers: {gives: [c7], receives: [c8], one_way: false}
  financial_institution: {gives: [c9], receives: [c10], one_way: false}
  development_partners: {gives: [c14], receives: [c15], one_way: false}
  promoters: {gives: [c11], receives: [c12], one_way: false}

lod0_gaps:   # what the deal needs that LOD 0 lacks, each with a classification
- kind: distributor_role
  description: "Figure 7's 'Distribution agency' distributes equipment to consumers for EESL. None of the 41 roles is a distributor/retail channel: epc_contractor 'builds and installs the works', equipment_supplier 'supplies equipment' (it receives the goods from EESL, it does not supply them), operator_om operates. Encoded epc_contractor as the nearest delivery role"
  classification: "encoding question (definition of epc_contractor could read 'delivers the works or goods for the Partner'); not a new role"
- kind: super_esco_definition_fit
  description: "aggregator_super_esco 'signs a master contract with end users, subcontracts ESCOs, raises finance and may guarantee savings'. In UJALA EESL aggregates demand and raises finance but subcontracts no ESCO and gives no savings guarantee (its private-ESCO role is 'limited to date', L441-442). The source still calls it a Super ESCO; F13 then forces aggregation super_esco"
  classification: "encoding question (definition: which clauses are necessary)"
- kind: fee_without_savings_link
  description: "PAYS 'on-bill financing' (L421-422) is an equipment instalment sized against savings, not a payment computed on determined savings. LOD 0 expresses it (payment_promise + on_bill); whether the instalment is fixed is LOD 2 (fee_basis)"
  classification: "below LOD 0 (fee variant, LOD 2)"

conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F02
  title: jurisdiction header field; C1 trigger
  convention: 'A `jurisdiction` block (country, EU membership, whether the client is EU general government) sits in the miniature header, not among the settings; C1 applies_when {client_sector: public, jurisdiction: EU}.'
  origin: verdict change 2; findings F02; gaps G27
  applied_here: jurisdiction IN; C1 applies_here false
- id: F05
  title: "provider's own capital is inside performance_promise"
  convention: "Under one service contract the provider's own capital is part of its performance_promise; funding_promise requires a distinct claim between distinct parties (loan, equity, receivable purchase, lease)."
  origin: verdict rule; findings F05; gaps G07
  applied_here: "EESL's up-front investment for the consumer stays inside c1; repayment is c2"
- id: F06
  title: one_way form (CASE_SPEC)
  convention: 'A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated; one_way: false is reserved for parties whose counter-promise is stated or inferred from a stated fact.'
  origin: verdict rule; findings F06
  applied_here: "discom and distribution_agency one_way: true; c4, c6 unstated"
- id: F07
  title: equity / capitalisation reciprocal
  convention: "Equity or state capitalisation is a funding_promise whose reciprocal is the residual claim, recorded as a payment_promise with status inferred; if the source shows a non-returnable endowment, benefit_promise. Never funding_promise + 'unilateral by nature'."
  origin: verdict rule; findings F07
  applied_here: promoters' equity c11 with inferred residual claim c12
- id: F13
  title: aggregation super_esco iff the role; role may be a list
  convention: "aggregation = super_esco iff a party carries aggregator_super_esco. A party's `role` may be a list, home role first, so one party can carry several of the 41 roles."
  origin: verdict rule; findings F13; gaps G11
  applied_here: eesl aggregator_super_esco <-> aggregation super_esco
- id: F18
  title: status discipline
  convention: stated = the source says it of this deal. A value read from a market table, a figure arrow, a bracketed template option or a contradicted AI passage is inferred (alternative in why) or generic, per CASE_SPEC.
  origin: findings F18
  applied_here: "Figure 7 arrows (c3, c5, c10) inferred; prose facts stated"
- id: F22
  title: partner_form corporate definition
  convention: partner_form corporate = any standing legal entity (company, public body, state fund) that is not a deal-specific SPV (E15 ch.2 fn 21 reading). No new value.
  origin: verdict change 5; findings F22; gaps G14
  applied_here: a state-owned joint-venture company is corporate
- id: IFRS16
  title: IFRS16_lease_test rule entry
  convention: "One rule entry, not a setting: IFRS16_lease_test, applies_when {client_sector: private, asset_owner: partner} — the private counterpart of C1."
  origin: verdict change 6; gaps G23
  applied_here: rule present; does not fire (asset_owner client)

coverage:   # computed from the blocks above, not typed; below_lod0 is the writer's note
  roles_used: [aggregator_super_esco, host, utility_supplier, collector_biller, epc_contractor, equipment_supplier, lender,
    ifi_dfi, equity_investor]
  roles_count: 9 of 41
  families_used: [payment_promise, performance_promise, funding_promise, agency_promise, determination_promise]
  families_absent: [benefit_promise, risk_promise]
  families_unstated_only: []
  settings_by_status: {stated: 6, inferred: 5, generic: 0, default: 2}
  commitments_by_status: {stated: 7, inferred: 6, generic: 0, unstated: 2}
  one_way_parties: [discom, distribution_agency]
  parties_count: 8
  commitments_count: 15
  below_lod0: {lod1_adds: 'events (bulk procurement, delivery to the distribution agency, distribution to the household, monthly
      billing and collection, remittance to EESL, loan drawdown and repayment), the instalment schedule, Option 1 (up-front
      cash payment) as the alternative path', lod2_adds: 'instalment amount and count (fixed vs savings-linked), warranty terms,
      the M&V method for UJALA'}
risk_allocation:   # owner rulings 15-16 (3 Oct): rows the source states or implies; the converter derives the rest (ENCODING.md)
  - {category: R1, driver: technical, bearer: [aggregator_super_esco], share: sole, status: inferred, evidence: "der-vpp/spec-run/esco-moneyflow/input/wb-super-escos-emerging-possibilities-2018.txt:518", why: "EESL runs UJALA with 'quality control, M&V of savings, and after-sales and warranty servicing' (L516-520), so a faulty bulb is EESL's to replace, not the household's. Departs from the default (asset basis => client). Inferred: the page names the services, not a risk clause. A and B agree"}

# Miniature — Illuminated Cities (Città Illuminate S.r.l.): European Energy Efficiency Fund (eeef) and Siram (Veolia) street-lighting joint venture, Italy,
# expressed at ESCO LOD 0
#
# Batch 6, pair H, RECONCILED by the pair-H reviewer from writers X and Y (base X; rulings in batch6/H/review/decisions.json). Evidence: the eeef Annual Report 2018 (one PDF), fetched 1 Oct 2026 and read with pdftotext. Cited as '<url> | PDF page', quotes of 25 words
# or fewer, copied exactly. PDF page numbers are the page of the PDF file (the report also prints its own page numbers, which equal the PDF page here).
# Every fact carries a status: stated, inferred (follows from a stated fact, and which), default (source silent), generic, unstated (counter-promise required by duality).
# The only document is the fund's annual report: it describes the joint venture and the fund's investment in it. It publishes no contract with a municipality.

miniature: illuminated_cities_eeef_siram
lod: 0
case: batch6.S04
case_kind: deal   # one named investment that reached financial close on 27.09.2018; the municipal contract under it is not published, so the client side is representative
in_scope: true
in_scope_why: "Siram is 'the industrial partner and full contractor for each project’s commissioning and operation' of street-lighting upgrades (LED, remote control, Wi-Fi) for public entities, with stated energy savings (77% vs baseline at Rozzano, 56% for the portfolio) (W-EEEF | PDF p.13). An energy-efficiency finance chain with a delivery partner; the money flow is the fund's junior funds into a joint-venture holding company"
tests_unused:   # the five unused items named in CASE_SPEC_5, plus the item named in the row (debt_seniority=subordinated)
- item: debt_seniority=subordinated
  kind: setting_value
  used: false
  reason: "REVIEW RULING: a stretch, not evidence; the deal does not count as a second source for subordinated. The setting keeps the value subordinated (inferred) because the vocabulary's definition counts shareholder loans as subordinated and the key figures print one, but the support is our definition applied to a label, not the source. Against counting: (a) 'Junior funds (equity and shareholder loan)' is the fund's category label, printed identically for Smart H&U and Wattosun (PDF p.35, p.38); (b) the deal's own line on p.30 reads '€16.0 m equity investment in the JV Illuminated Cities'; (c) the fund keeps a separate class 'Subordinated debt' (Banca Transilvania, p.30, p.39) and its split by instrument, 25% Equity / 15% Subordinated debt / 60% Senior debt (p.21), adds up only if all five junior-funds and equity-and-shareholder-loan investments sit in Equity (40.5 / 165.5 = 24.5%; 25.0 / 165.5 = 15.1%); (d) no loan amount and no debt ranking ahead of it is named. Writers X and Y both marked used true with these limits. Would change: the JV's shareholder-loan agreement or financial statements showing a loan amount and its subordination to a named lender. Writer X's original reading follows: The fund's own key-figures box calls the investment 'Junior funds (equity and shareholder loan)' (https://www.eeef.lu/files/downloads/Impact_Reports/eeef_Annual_Report_2018.pdf | PDF p.13 and p.35). 'Junior' is the source's word; it never writes 'subordinated' for this deal and never gives the rank of the shareholder-loan part against any other debt. The model counts shareholder loans as subordinated (elements.yaml debt_seniority), so the value is inferred from the source's word junior plus that definition. Two limits: (1) the same report calls the whole EUR 16.0m an 'equity investment' (p.30), so a loan part is shown only by the label; (2) no other debt in the JV is named, so the junior rank is relative to nothing the source shows. Supported, with those limits"
- item: lessor
  kind: role
  used: false
  reason: "No lease in the source (writer Y)"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "Città Illuminate is a joint-venture holding company that finances lighting projects, not a bankruptcy-remote entity buying receivables or issuing notes. No note issue appears in the report pages on this deal (W-EEEF | PDF p.13)"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No interest-rate hedge or swap is named anywhere in the report (searched for hedge, swap, cap)"
- item: authority_guarantor
  kind: role
  used: false
  reason: "No guarantee of any municipal payment appears (searched the report for guarantee: only an unrelated feed-in tariff and a disclaimer)"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "Who holds title to the lampposts is not stated. The JV holding is the nearest vehicle, but nothing says it owns the assets (a concession would put them with the Partner; ordinary supply would leave them with the municipality). Default client kept, flagged"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The municipality's payment basis is not published. Estimated savings are reported, but no payment tied to an availability or output level is described. Default savings kept, flagged"

source:   # where the facts come from; context = actors outside the deal boundary; notes = observations that are not gaps
  id: [W-EEEF]
  documents:
    W-EEEF: "https://www.eeef.lu/files/downloads/Impact_Reports/eeef_Annual_Report_2018.pdf — European Energy Efficiency Fund S.A., SICAV-SIF, Annual Report 2018 (investment profile PDF p.13 and p.35; letter p.8; approach p.12; investments list p.30; funding p.46-47; savings table p.63). Primary: the fund's own annual report"
  title: eeef Annual Report 2018 — Italy, Illuminated Cities
  publisher: "European Energy Efficiency Fund S.A., SICAV-SIF (Investment Manager: Deutsche Bank)"
  passage: "PDF p.8 (letter), p.12 (approach), p.13 and p.35 (Illuminated Cities profile and key figures), p.30 (investments list), p.21 (investments by partner), p.47 (share classes), p.63 (savings table, footnotes 1, 4, 5)"
  oracle: none — not a published validation target; acceptance is structural
  context:
  - "Deutsche Bank: the fund's Investment Manager: 'The Investment Manager conducts the Fund’s business on behalf of the Management Board and the Investment Committee.' (W-EEEF | PDF p.22). Manages the fund, not this JV: an adviser one level above the deal, kept out of the parties (adviser ruling)"
  - "The fund's own backers: 'The initial capital provided by the European Commission (EUR 125.0 m) was increased by contributions from sponsors' (W-EEEF | PDF p.46); EIB, Cassa Depositi e Prestiti and Deutsche Bank. Upstream of the eeef, not parties to the JV"
  - "Rule sources: the report names IPMVP and ISO 14064 for savings accounting and says the methodologies are 'validated by a global engineering company' (W-EEEF | PDF p.63, footnote 1). That validator is unnamed and serves the fund's impact reporting, not a contract in this deal"
  - "Heading 'Project Partner' on PDF p.13 is the report's own label for Siram, not the ESCO term of this vocabulary. Who is the Partner (contracted to deliver the energy service to the municipality) is an encoding choice: see notes and lod0_gaps"
  notes:
  - "What the source does not publish: any contract with Rozzano or another municipality, the price or payment basis, the term of a concession, the guaranteed savings, the JV's other lenders, who owns the lampposts, and the split of the EUR 16.0m between equity and shareholder loan"
  - "Equity or loan: key figures say 'Junior funds (equity and shareholder loan)' (p.13, p.35); the list of investments says 'equity investment' for the same EUR 16.0m (p.30). The two do not contradict if the label is the fund's category for junior instruments, but no split is given"
  - "Partner choice: Partner = Città Illuminate S.r.l. (partner_form spv), because the JV is 'newly established' for 'a portfolio of street lighting projects' and 'will enable public entities to implement' the solutions (p.8, p.13). Alternative reading: Siram is the Partner (the report calls it Project Partner and says the fund partners with ESCOs 'who are able to apply for public tenders', p.12), with the JV as an owning vehicle. The source never says which entity signs with the municipality. Project companies below the holding are not shown, though the report calls the JV a 'holding company'"
  - "Reviewer: the fund's 'Investments by financial instrument' (PDF p.21, 'Based on commitments signed to projects') prints 25% Equity, 15% Subordinated debt, 60% Senior debt. Re-added from the p.30 list (matured SPL excluded): senior and forfaiting 100.0, subordinated 25.0 (Banca Transilvania alone), junior funds and equity-and-shareholder-loan 40.5 (Orléans 5.1, Rennes 7.3, Wattosun 5.1, Smart H&U 7.0, Illuminated Cities 16.0); total 165.5, printed 166. So the fund books this investment as Equity, apart from its Subordinated-debt class (writer Y's finding, verified)"
  - "Reviewer: the timeline places the partnership in October 2018 ('The eeef and Siram become partners', PDF p.27) while the key figures give financial close 27.09.2018 (p.13); taken as announcement after close (writer Y)"
  - "The cumulative savings table (p.63) lists Illuminated Cities at 11,190 MWh and 1,623 t CO2e. These are exactly half of the annual estimates of p.13 (22,380 MWh and 3,245 t): see numbers.derived. The report does not explain; footnote 5 says the line is 'based on/partially based on signed commitments'"

jurisdiction:   # header field, not a setting: dated at financial close, drives the C1 trigger
  country: Italy
  iso: IT
  eu_member_at_close: true
  client_eu_general_government_at_close: true
  as_of: "financial close 27.09.2018 (W-EEEF | PDF p.13)"
  status: stated
  why: "Financial close 27.09.2018 (W-EEEF | PDF p.13). Italy was an EU member. The client is a public entity: 'the municipality of Rozzano' (PDF p.13) and 'public entities' generally (PDF p.8). A municipality is general government (stated that the client is a public body)"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: each contract establishes (fibo-fnd-rel-rel:confers) its commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 37 (a list = several roles, home role first); groups computed from the role(s)
  rozzano:
    entity: comune_rozzano
    role: authority
    groups: [demand, public]
    status: inferred
    name: Municipality of Rozzano (representative client; other municipalities of the portfolio are not named)
    text: "'the municipality of Rozzano, in the metropolitan area of Milan, with an investment volume of circa EUR 3.5 m' (W-EEEF | PDF p.13). The report names it as the first project of the portfolio and gives its savings, but not the contract: whether it is a concession, an EPC or a service contract is not stated, so the role authority (public body that contracts and pays) is inferred"
  citta_illuminate:
    entity: citta_illuminate
    role: partner_esco
    groups: [partner]
    status: inferred
    name: Città Illuminate S.r.l. (Illuminated Cities)
    text: "'Città Illuminate S.r.l. (Illuminated Cities) is the holding company for the joint venture (JV) between the eeef and Siram by Veolia' (W-EEEF | PDF p.13). Newly established, 80% eeef / 20% Siram (PDF p.8). Taken as the Partner (spv) because it is the vehicle that targets the street-lighting portfolio. That it contracts with the municipalities is inferred (see source.notes)"
  eeef:
    entity: eeef
    role: [equity_investor, lender]
    groups: [capital]
    status: stated
    name: European Energy Efficiency Fund S.A., SICAV-SIF (eeef)
    text: "'The eeef is the main investor in the JV' (W-EEEF | PDF p.13). Owns 80% of the JV (PDF p.8); EUR 16.0m 'equity investment' (PDF p.30) described as 'Junior funds (equity and shareholder loan)' (PDF p.13). Equity_investor for the shares; lender for the shareholder-loan part, which is shown only by the label"
  siram:
    entity: siram_spa
    role: [epc_contractor, operator_om, equity_investor]
    groups: [delivery, capital]
    status: stated
    name: Siram S.p.A. (Siram by Veolia)
    text: "'Siram acts as the industrial partner and full contractor for each project’s commissioning and operation' (W-EEEF | PDF p.13); 20% shareholder of the JV (PDF p.8). Contractor and operator for the JV or the projects (to whom it owes the works is not stated); equity_investor for its 20%"

contract:   # the agreements that establish the commitments
  municipal_contract:
    core: contract
    parties: [citta_illuminate, rozzano]
    status: inferred
    note: "Not published. The report speaks of 'in the frame of public private partnerships' (PDF p.13) and of Rozzano 'adopting' the technology; type, term and price are unknown. Recorded as the contract that would establish c1 to c3"
  jv_shareholder_arrangements:
    core: contract
    parties: [eeef, siram, citta_illuminate]
    status: stated
    note: "Joint venture, 80% / 20% (PDF p.8), financial close 27.09.2018 (PDF p.13). The shareholder agreement and the shareholder-loan agreement are not published"
  contractor_agreement:
    core: contract
    parties: [citta_illuminate, siram]
    status: stated
    note: "Siram as 'full contractor for each project’s commissioning and operation' (PDF p.13). The counterparty of the contract (JV or project company) is inferred"

commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: performance_promise
    from: citta_illuminate
    to: rozzano
    status: inferred
    what: "deliver the street-lighting upgrade: 'the instalment of LEDs, remote control management systems, video surveillance, Wi-Fi and charging stations for electric vehicles' (W-EEEF | PDF p.13). Inferred from the JV purpose; no municipal contract is published"
    established_by: municipal_contract
  c2:
    family: payment_promise
    from: rozzano
    to: citta_illuminate
    status: unstated
    what: "counter-promise required by duality; the source is silent on what the municipality pays, how often or on what basis. It reports only that the project will have 'a corresponding impact on the municipality’s electricity bill' (W-EEEF | PDF p.13)"
    established_by: municipal_contract
  c3:
    family: determination_promise
    from: unstated
    to: rozzano
    status: unstated
    determines: savings   # savings the payments would rest on
    what: "who establishes the savings the municipal payments would rest on. Required because payment_basis is the default savings (a payment computed on savings needs a determination). The source says savings are 'calculated following international protocols, including the International Performance Measurement and Verification Protocol' and 'validated by a global engineering company' (W-EEEF | PDF p.63, footnote 1), but that is the fund's portfolio reporting, not a named contract verifier"
    established_by: municipal_contract
  c4:
    family: funding_promise
    from: eeef
    to: citta_illuminate
    status: stated
    funding_instrument: equity   # equity investment in the JV (W-EEEF p.30)
    what: "EUR 16.0m 'equity investment in the JV Illuminated Cities' (W-EEEF | PDF p.30); 'eeef investment size (¤m): 16.0' of a 'Total project size (¤m): 20.0' (PDF p.13), i.e. 80% of the JV (PDF p.8)"
    established_by: jv_shareholder_arrangements
  c5:
    family: payment_promise
    from: citta_illuminate
    to: eeef
    status: inferred
    what: "residual return on the 80% stake: dividends or exit proceeds, after the JV's costs. Inferred from equity (ENCODING convention); no distribution is described. Maturity 15 years (PDF p.13)"
    established_by: jv_shareholder_arrangements
  c6:
    family: funding_promise
    from: eeef
    to: citta_illuminate
    status: inferred
    funding_instrument: loan   # shareholder loan (W-EEEF p.13)
    what: "the shareholder-loan part of the junior funds: 'Junior funds (equity and shareholder loan)' (W-EEEF | PDF p.13). Shown by the investment-type label only; the amount of the loan is not published and p.30 calls the whole EUR 16.0m an 'equity investment'"
    established_by: jv_shareholder_arrangements
  c7:
    family: payment_promise
    from: citta_illuminate
    to: eeef
    status: inferred
    what: "repay the shareholder loan with interest, ranking behind other creditors if any (junior). Inferred from c6; terms unpublished"
    established_by: jv_shareholder_arrangements
  c8:
    family: funding_promise
    from: siram
    to: citta_illuminate
    status: inferred
    funding_instrument: equity   # Siram's 20% stake (W-EEEF p.8)
    what: "Siram's 20% stake: 'respectively owned 80% / 20% by the eeef and Siram' (W-EEEF | PDF p.8). The amount is not published; 20% of the stated total project size of 20.0 would be 4.0, but the report does not say the 20.0 is all equity (derived, not stated)"
    established_by: jv_shareholder_arrangements
  c9:
    family: payment_promise
    from: citta_illuminate
    to: siram
    status: inferred
    what: "residual return on the 20% stake. Inferred from equity (ENCODING convention)"
    established_by: jv_shareholder_arrangements
  c10:
    family: performance_promise
    from: siram
    to: citta_illuminate
    status: stated
    what: "'Siram acts as the industrial partner and full contractor for each project’s commissioning and operation' (W-EEEF | PDF p.13): builds, commissions and operates the projects"
    established_by: contractor_agreement
  c11:
    family: payment_promise
    from: citta_illuminate
    to: siram
    status: unstated
    what: "counter-promise required by duality; contractor price and operating fee not published"
    established_by: contractor_agreement

settings:   # the 13 LOD 0 facets, in vocabulary order
  payment_basis:
    value: savings
    status: default
    why: "The source does not say what the municipality pays for (ENCODING: silent source takes savings). Savings are the only payment-related fact reported: 'estimated energy savings in the region of 77% compared to baseline' at Rozzano, with 'a corresponding impact on the municipality’s electricity bill' (W-EEEF | PDF p.13). Alternatives that street lighting often uses: supply (priced per point or kWh), performance (availability) or asset (fixed price). Not tested: payment_basis=performance stays unused"
  client_sector:
    value: public
    status: stated
    why: "'the municipality of Rozzano' and 'public entities' (W-EEEF | PDF p.13, p.8); 'mainly benefitting small to medium-sized municipalities' (PDF p.13)"
  partner_form:
    value: spv
    status: inferred
    why: "Città Illuminate S.r.l. is 'newly established' (W-EEEF | PDF p.8) as the JV vehicle for the portfolio. Under the alternative reading (Siram is the Partner) the value would be corporate"
  borrower:
    value: partner
    status: inferred
    why: "The only debt shown is the shareholder-loan part of the fund's junior funds, owed by the JV (the Partner). No loan to the municipality and no third-party bank loan is named. Equity and a shareholder loan are named, so this is inferred from the stated investment type, not the silent-source fallback"
  receivable_holder:
    value: partner
    status: default
    why: "nothing in the report says the municipal payments are assigned to a financier; the fund invests in the holding, not in a receivable"
  collection_placement:
    value: operator_own
    status: default
    why: "no account, escrow or on-bill route is mentioned"
  aggregation:
    value: pool
    status: stated
    why: "'targets a portfolio of street lighting projects in Italy' (W-EEEF | PDF p.13); 'Through such aggregation, the eeef addresses one of the key challenges of financing energy efficiency projects of low investment volume' (PDF p.13)"
  debt_seniority:
    value: subordinated
    status: inferred
    why: "REVIEW: value kept by the vocabulary's definition, flagged; it does not count as a use (tests_unused). The fund books the whole EUR 16.0m as Equity, apart from its Subordinated-debt class (PDF p.21, p.30). 'Junior funds (equity and shareholder loan)' (W-EEEF | PDF p.13, p.35). The source says junior, not subordinated; the vocabulary counts shareholder loans as subordinated (elements.yaml debt_seniority, E15 Box 7 x2.5). A shareholder loan inside the junior funds is only shown by the label (c6). If the label is read as equity only, no debt is shown and the fallback would be senior (default). See tests_unused"
  assignment_recourse:
    value: not_applicable
    status: default
    why: "nothing is assigned (receivable_holder = partner)"
  savings_basis:
    value: measured
    status: default
    why: "not stated for the municipal payments. The fund reports savings under IPMVP, which is a measurement protocol (W-EEEF | PDF p.63 footnote 1), but for its impact reporting, and the Rozzano figure is an estimate (PDF p.13). Default measured kept"
  grant_recipient:
    value: none
    status: default
    why: "no grant to the JV or the municipality is named in the Illuminated Cities pages. The fund's technical-assistance facility (partly ELENA-funded, PDF p.12) is a separate service, not shown to touch this deal"
  asset_owner:
    value: client
    status: default
    why: "title to the lampposts is not stated; see tests_unused (asset_owner=vehicle). If the JV holds the assets under a concession, asset_owner = partner, and IFRS16_lease_test would still not apply because the client is public"
  bill_custody:
    value: client
    status: inferred
    why: "inferred (writer Y): the municipality is the electricity customer ('impact on the municipality’s electricity bill', PDF p.13)"

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments forecast over the EPC + (b) any government financing not repayable by the Partner (e.g. capital grant), else the EPC is ON BALANCE SHEET for government (E15 L2578-2582; the summary box L6932-6943 states the sum without the basis)
    applies_here: true
    this_case: "applies: a public client (municipality of Rozzano) in the EU at close (2018). Outcome undetermined: the municipal payments, the guaranteed savings and any government financing are not published. The fund's own backers (EC, EIB, CDP) are upstream of the JV and are not shown to give non-repayable money to the project"
    source: E15 L2576-2582, L5363-5380, L6930-6943; register constraints.entries.C1_eurostat
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: partner}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? Applies when client_sector is private and asset_owner is not client (elements.yaml IFRS16_lease_test; E02 L3293-3295)"
    applies_here: false
    this_case: client_sector is public; C1 is the counterpart for a public client
    source: gaps G23; E02 L3293-3295; register.yaml L301 ifrs_16 flag

  eeef_instrument_classification:
    scope: contractual
    rule: "The fund reports 'Investments by financial instrument' as 25% Equity, 15% Subordinated debt, 60% Senior debt (W-EEEF | PDF p.21); its junior-funds and equity-and-shareholder-loan investments sit in Equity (numbers.derived.instrument_shares). Recorded because it is the fund's own reading of the rank this file's debt_seniority infers"
    applies_here: true
    source: W-EEEF PDF p.21, p.30

numbers:   # instance data as printed, with units; derived values show their arithmetic
  currency_note: "the report prints the euro sign as the glyph ¤ in the key-figures box (PDF p.13); read as EUR m"
  total_project_size_eur_m: "20.0 (¤m) (PDF p.13, p.35)"
  eeef_investment_size_eur_m: "16.0 (¤m) (PDF p.13, p.35); '€16.0 m equity investment' (PDF p.30)"
  ownership: "80% eeef / 20% Siram (PDF p.8)"
  maturity: "15 years (PDF p.13)"
  financial_close: "27.09.2018 (PDF p.13)"
  estimated_co2e_savings_t_per_year: "3,245 (PDF p.13)"
  estimated_primary_energy_savings_mwh_per_year: "22,380 (PDF p.13; not printed on the p.35 repeat)"
  rozzano_investment_volume_eur_m: "circa 3.5 (PDF p.13); 'the eeef made its first investment through Illuminated Cities of circa EUR 3.5 m' (PDF p.13)"
  rozzano_estimated_energy_savings_pct: "77% compared to baseline (PDF p.13)"
  portfolio_primary_energy_savings_pct: "56% for the entire portfolio compared to baseline (PDF p.13); 56 in the table (PDF p.63)"
  cumulative_savings_table_p63: "Illuminated Cities 11,190 MWh cumulative primary energy, 56%; 1,623 t CO2e cumulative carbon, 56% (PDF p.63); basis: financial close to loan maturity, estimates for projects under construction (footnote 4)"
  eeef_italy_total_eur_m: "54.8 (PDF p.30)"
  eeef_total_investments_eur_m: "170.5 invested since inception, EUR 127 m disbursed (PDF p.30); 166 current total committed capital (PDF p.21)"
  derived:
    ownership_check: "16.0 / 20.0 = 80% = the stated 80% ownership (PDF p.8). Matches. Remainder 20.0 - 16.0 = 4.0 is not stated to be Siram's capital"
    italy_total_check: "31.8 + 16.0 + 7.0 = 54.8 (PDF p.30: Progetto ISOM senior loan and VAT facility, Illuminated Cities, Smart H&U). Matches the printed 54.8"
    pie_share_check: "16.0 / 166 = 9.6%, printed 10% for Illuminated Cities in the investments-by-partner chart (PDF p.21). Matches after rounding"
    rozzano_share_of_jv: "3.5 / 20.0 = 17.5% of the stated total project size is the Rozzano project so far (circa; both figures printed)"
    cumulative_vs_annual: "11,190 / 22,380 = 0.50 exactly; 1,623 / 3,245 = 0.5002 (3,245 / 2 = 1,622.5, rounded 1,623). The cumulative line is half of one year's estimate. Does not match what a cumulative figure to loan maturity over 15 years would give (22,380 x 15 = 335,700 MWh). The source does not explain; read as a reporting-date artefact (footnote 5: partly based on signed commitments) and do not use it as a savings figure"
    instrument_shares: "p.30 commitments without matured SPL: senior and forfaiting 30.0 + 31.8 + 8.5 + 4.3 + 12.1 + 9.2 + 2.5 + 1.0 + 0.6 = 100.0; subordinated 25.0; junior funds / equity and shareholder loan 5.1 + 7.3 + 5.1 + 7.0 + 16.0 = 40.5; total 165.5 (printed 166, p.21). Shares 100.0 / 165.5 = 60.4% (printed 60), 25.0 / 165.5 = 15.1% (printed 15), 40.5 / 165.5 = 24.5% (printed 25). All match to rounding (reviewer re-computed)"
    implied_t_per_mwh: "3,245 t / 22,380 MWh = 0.145 t CO2e per MWh (derived; consistent with 1,623 / 11,190 = 0.145)"


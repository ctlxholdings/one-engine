conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F02
  title: jurisdiction header field, dated at close
  convention: 'A `jurisdiction` block (country, EU membership at close, whether the client is EU general government at close) sits in the header; C1 applies_when {client_sector: public, jurisdiction: EU at close}.'
  origin: owner ruling 1 Oct (change 2)
  applied_here: Italy, EU member in 2018, municipal client; C1 applies, outcome undetermined (payments unpublished)
- id: F06
  title: one_way form (CASE_SPEC)
  convention: 'A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated.'
  origin: verdict rule
  applied_here: rozzano one_way, its only promise c2 is unstated (reviewer, from writer Y); c11 sits with a party that also gives stated or inferred promises
- id: F21
  title: determination_promise is required
  convention: "A determination_promise is required whenever a payment is computed on savings or completion; from = the party the source names, else the literal 'unstated'."
  origin: verdict rule; findings F21
  applied_here: c3 from unstated (payment_basis is the default savings)
- id: ENC-EQ
  title: equity is a funding_promise with an inferred residual-claim payment_promise back
  convention: "Equity or a state capitalisation is a funding_promise with an inferred residual-claim payment_promise back (ENCODING.md)."
  origin: ENCODING.md
  applied_here: c4/c5 (eeef), c8/c9 (Siram), c6/c7 (shareholder loan)
- id: ENC-ADV
  title: advisers and managers are context
  convention: "Advisers and energy agencies are source.context unless the source states a promise by them."
  origin: batch-5 rulings
  applied_here: Deutsche Bank as Investment Manager of the fund; the fund's backers EC, EIB, CDP

- id: REV-H6-1
  title: a definition-driven value is not a second source
  convention: "When a setting value follows only from the vocabulary's definition applied to a label the source itself classifies otherwise, the file may keep the value (status inferred, flagged) but tests_unused marks it used false."
  origin: batch-6 pair-H review
  applied_here: debt_seniority = subordinated kept, used false


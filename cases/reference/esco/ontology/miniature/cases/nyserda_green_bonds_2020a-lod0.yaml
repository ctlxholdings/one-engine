# Miniature — NYSERDA Residential Solar and Energy Efficiency Financing Green Revenue Bonds, Series 2020A (Federally Taxable) (Green Bonds)
# (New York, US) expressed at ESCO LOD 0. Batch 9, deal T17. RECONCILED by the group-O reviewer from writers X and Y (base X;
# rulings in batch9/O/review/decisions.json, 5 Oct 2026). Every quote re-checked by script against its PDF page text.
#
# Main source: the Official Statement dated 1 Oct 2020 (OS), read in full from its text (126 pages (pdfinfo; an earlier header said 127)). Second source: NYSERDA's Annual Bond
# Sales Report for the fiscal year ended 31 Mar 2025, with its schedule of bonds outstanding (BSR), fetched 5 Oct 2026, read-only.
# Citation form: '<url> p.<page> | <exact quote of 25 words or fewer>'. <page> is the page of the PDF file (the form-feed count of the text).
# For the body of the OS the printed page number is the PDF page minus 12 (PDF p.18 is printed page 6).
# Every fact carries its status: stated (the source says it), inferred (follows from a stated fact, said which), generic (programme-level,
# not this bond series), default (source silent, flagged fallback), unstated (counter-promise required by duality, source silent).
# The representative contract is one Program Loan from NYSERDA to a homeowner (Smart Energy Loan or On-Bill Recovery Loan); the deal is the
# bond issue that the Authority backs with the Loan Payments of 2,259 such loans.
# Sibling case (same programme, later series): nyserda_green_bonds_2024a-lod0.yaml. Party and role choices follow it; where the 2020A OS says
# otherwise the difference is in source.notes. This file feeds the engine exit slice: numbers.bonds, rules.flow_of_funds,
# rules.reserve_fund_requirement_and_release, rules.excess_revenues_redemption, rules.optional_redemption_clean_up, numbers.sources_and_uses_usd
# and the pool strata at the 31 Jul 2020 Cutoff Date carry every printed figure with its page.

miniature: nyserda_green_bonds_2020a
lod: 0
case: batch9.T17
case_kind: deal   # one named, signed bond issue: $16,690,000, Indenture of Trust dated as of 1 Oct 2020, delivered 14 Oct 2020
in_scope: true
in_scope_why: "The bonds fund and are repaid from efficiency and solar loans: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:346-348 | 'finance loans made by the Authority to fund (i) the installation of energy efficiency improvements'. The pool is mixed: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1800 | 'Energy Efficiency 1,418 62.8% $10,774,279 46.3%' and 'Solar Photovoltaic 841 37.2 12,520,770 53.7'. Mixed with solar, so in scope. No ESCO: nobody is paid for an energy service, payment_basis is asset (same open boundary as the 2024A case)"

tests_unused:   # items still unused after batch 7 that this deal could exercise
- item: backup_servicer
  kind: role
  used: true
  reason: "A named backup servicer for this series, Vervent, Inc.: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1552-1553 | 'the Backup Servicer agrees to assume the primary portfolio servicing responsibilities under the Servicing Agreement within forty-five (45) days'. Trigger printed: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:423-425 | 'will agree to assume the primary portfolio servicing responsibilities if the Servicer resigns or is removed by the Authority'. Second series for the role after 2024A (where the backup is Carmel, not Vervent)"
- item: collector_biller
  kind: role
  used: true
  reason: "Concord collects for NYSERDA and the seven utilities bill and collect the On-Bill Recovery instalments for NYSERDA: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1206-1207 | 'commence billing, collecting, and remitting the On-Bill Recovery Loan installments'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1057-1058 | 'The Servicer is responsible for Borrower billing and collections'"
- item: account_bank_trustee
  kind: role
  used: true
  reason: "The Bank of New York Mellon holds the pledge and the Reserve, Revenue, Debt Service and Redemption Funds: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2777 | 'All such Funds are held by the Trustee'"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No separate issuer or trust. NYSERDA itself issues: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:51 | 'The Series 2020A Bonds will not be general obligations of the Authority'. It pledges only the loan payments and keeps the loans: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2524-2525 | 'The Portfolio Loans are not pledged to the repayment of the Series 2020A Bonds, only the Pledged Loan Payments'. The OS does not call the Trustee's estate an issuer or a bankruptcy-remote vehicle"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No hedge. Fixed coupons on the bonds, fixed rates on the loans; the only 'hedge' word in the OS is in the tax discussion (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.66, U.S. Holders). Searched the whole text for swap, hedge and guarantee"
- item: authority_guarantor
  kind: role
  used: false
  reason: "Nobody guarantees the homeowners' payments. cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2925 | 'The Series 2020A Bonds will not be insured or guaranteed by the Authority, the Originator, the Servicer'"
- item: debt_seniority=subordinated
  kind: setting_value
  used: false
  reason: "One class, serial and term bonds equally secured: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:4041-4042 | 'equally and ratably secured by the Indenture without preference, priority or distinction'"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "No vehicle (see securitisation_vehicle). The homeowners own the installed measures, inferred"
- item: collection_placement=on_tax
  kind: setting_value
  used: false
  reason: "Collections land in a pledged account, 36.7% of the pool balance through the utility bill, never through a tax bill"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "Level fully amortising loan instalments, not tied to a performance level: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1613-1614 | 'level scheduled monthly payments that fully amortize the amount financed'"

single_source_exercised:   # terms with one source or none before batch 9 that this deal uses (CASE_SPEC_7)
- term: backup_servicer
  kind: role
  evidence: "cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1552-1553 | 'the Backup Servicer agrees to assume the primary portfolio servicing responsibilities under the Servicing Agreement within forty-five (45) days'"
  status: stated
- term: collector_biller
  kind: role
  evidence: "cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1206-1207 | 'commence billing, collecting, and remitting the On-Bill Recovery Loan installments'"
  status: stated

source:
  id: [OS2020A, BSR2025]
  documents:
    OS2020A: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf — Official Statement dated 1 Oct 2020, $16,690,000 NYSERDA Residential Solar and Energy Efficiency Financing Green Revenue Bonds, Series 2020A (Federally Taxable) (Green Bonds); 127 PDF pages; Appendices A (definitions and summary of the Indenture), D (weighted average lives) and E read. Primary"
    BSR2025: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/Publications/Annual-Reports-and-Financial-Statements/2025-03-31-Annual-Bond-Sale-Report-and-Schedule-of-Bonds-Outstanding.pdf — NYSERDA Annual Bond Sales Report, fiscal year ended 31 Mar 2025, with the schedule of bonds outstanding (PDF p.6 lists the ten 2020A bonds with amount issued and amount outstanding in $000s). Second source, same issuer, a different document written four and a half years later; read-only. The KBRA release for 2020A was not fetched"
  title: NYSERDA Residential Solar and Energy Efficiency Financing Green Revenue Bonds, Series 2020A (Green Jobs-Green New York loan programme)
  publisher: New York State Energy Research and Development Authority (issuer of both documents)
  passage: "OS PDF p.1 (cover, bonds), p.7-11 (summary), p.13 (pledge), p.18-30 (programme, originator, servicer, backup servicer), p.30-40 (Portfolio Loans), p.48-49 (sources and uses, security), p.52-55 (bonds, redemption, funds), p.55-65 (investment considerations), p.65-68 (underwriting, rating, approvals), p.69-84 (Appendix A), p.99-101 (Appendix D). BSR PDF p.6"
  oracle: "none, not a published validation target. The bond amounts, coupons, reserve rule and redemption order are printed; tied by arithmetic in numbers.derived and against the BSR schedule"
  context:
  - "Ramirez & Co., Inc., underwriter: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3509 | 'The Underwriter has agreed to purchase all Series 2020A Bonds if any are purchased'; price and fee: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3508-3509 | 'at an aggregate purchase price of $16,690,000. The Underwriter will be paid an underwriting fee equal to $105,055'. Firm-commitment buyer that resells to the public (cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:342 | 'The Series 2020A Bonds are being offered to the public'). Kept outside the deal boundary on the 2024A reasoning: no role of the 37 covers an underwriter, and the lasting funders are the bondholders (lod0_gaps)"
  - "Kutak Rock LLP, counsel to the Underwriter, and Hawkins Delafield & Wood LLP with Law Offices of Joseph C. Reid, P.A., Co-Bond Counsel: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3678 | 'Co-Bond Counsel to the Authority'. Advisers, no promise in the deal"
  - "Omnicap Group LLC, municipal advisor to the Authority: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3652 | 'has acted as independent registered municipal advisor to the Authority'. Adviser, no promise in the deal"
  - "Kroll Bond Rating Agency, LLC, the only rating agency: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3917 | 'KBRA is the only Rating Agency'; rating 'A (sf)' expected (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.66, RATING). Rating surveillance fees are an Administrative Expense paid from the trust estate (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.58); the agency makes no promise to the parties. Rule source, not a party"
  - "First Environment, Inc., second-party opinion on alignment with the Green Bond Principles (Appendix E): cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:361-362 | 'First Environment, Inc., an independent, third party auditor'. Verifier of a label, no payment chain: context"
  - "The Depository Trust Company, nominee Cede & Co., registered owner of the bonds: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:46-47 | 'registered in the name of Cede & Co., as nominee of The Depository Trust Company'. Holds for the beneficial owners (the bondholders party); no promise of its own in the deal"
  - "State of New York: not a debtor and not a guarantor (cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:451-452 | 'The Series 2020A Bonds shall not be a debt of the State nor shall the State be liable thereon'); gives a pledge not to alter the Authority's rights (cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3487 | 'the State will not limit or alter the rights and powers vested in the Authority by the Act'). A rule source, not a party (rules below)"
  - "Approvers: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3667 | 'subject to the approval of the Comptroller of the State'; the Governor approves the proceedings, the Commissioner of Taxation and Finance certain Indenture provisions, and the Public Authorities Control Board any commitment. Approvals, no promise: rule sources"
  - "Public Service Commission of the State: sets the tariffs under which the utilities bill the on-bill charge (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.17, Regulatory Approvals). Regulator, no promise in the deal"
  - "New York State Environmental Facilities Corporation: some GJGNY funds are pledged to it for other bonds, 'The amount so pledged is not available to pay the Series 2020A Bonds' (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.18). Other financings, outside the boundary"
  - "The Authority's six earlier GJGNY bond series (three Residential Energy Efficiency, two Residential Solar Loan, one Residential Solar and Energy Efficiency): their trust estates are 'wholly distinct and separate' from this one (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.14), though the Authority may have to pay into them from the GJGNY Revolving Fund. Other deals of the programme, not parties here"
  - "NY-Sun Initiative and Assisted Home Performance with ENERGY STAR: public incentive programmes that pay solar incentives to the contractor of record and a cash back to qualifying households (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.19). Programme support beside the loan; no promise inside this deal"
  notes:
  - "Differences from the 2024A case, all from the OS: (1) the backup servicer is Vervent, Inc. (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.29), not Carmel Solutions (2024A). (2) The OS states an assignment: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1579-1580 | 'the Authority will assign to the Trustee the right to receive Loan Payments for certain Program Loans', where the 2024A case had only a pledge from board minutes. Reviewer: the assignment is as security only (the Trustee is 'secured party', p.30; the loans are not pledged and cannot be sold, p.49, p.56; the Authority keeps the exclusive right to enforce, p.75), so receivable_holder stays partner as in 2024A (decisions.json). (3) The pool mix is printed, 36.68% On-Bill Recovery and 63.32% Smart Energy by balance (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.32), so collection_placement is set from the majority stream, not from the on-bill stream alone. (4) Trustee, servicer, backup servicer, originator and utility fees are printed (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.16, p.20, p.58), so their counter-promises are stated, not unstated. (5) originator_developer now covers 'originates the client loans of a financing programme' (elements.yaml), so the 2024A loan_originator gap is closed"
  - "Pledge scope, exactly: the Authority 'will pledge and assign to the Trustee' the Pledged Revenues (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.13); the loans themselves stay with the Authority and the Trustee cannot sell them: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2525-2526 | 'The Trustee has no right to sell Portfolio Loans'. The bonds are 'limited obligations of the Authority, payable solely from and secured by the Pledged Revenues' (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.1). No State guarantee (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.13), no guarantee by the Authority, the Originator or the Servicer (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.56), no acceleration (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.60)"
  - "Excess Revenues redemption order, exactly as written (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.52): first, in April each year from April 2021, the bonds maturing the following October; second, the term bond due 1 Oct 2036; third, all remaining bonds ratably by outstanding principal of each maturity. The term bond is therefore retired ahead of the serial bonds due 2025 to 2029, not in maturity order. The BSR schedule agrees (numbers.derived.bsr_check)"
  - "Contractor Participation Agreements with the Authority exist (cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:914-915 | 'a company must submit a contractor application, enter into a Participation Agreement with the Authority'). No money promise in them is printed, so they are not encoded as a contract (reviewer; X had a contract with no promise)"
  - "Cutoff Date 31 Jul 2020, Date of Issuance 14 Oct 2020, Pledge Date the second Business Day before reimbursement. Pool reductions between the Cutoff Date and the Pledge Date go to the Revenue Fund and pay principal on 1 Oct 2021 (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.32). All strata below are as of the Cutoff Date"
  - "Page citations use the PDF page. Internal inconsistencies in the OS, each recomputed in numbers.derived: project-type, Smart-Energy-by-tier and several strata balances differ from the pool total by 1 dollar (rounding); the Summary says 'approximately 63.3%' Smart Energy and the table prints 63.32% (agree); the Summary's optional-redemption wording ('on and after the date') differs from the body's (each Interest Payment Date on which the outstanding amount, after other principal payments, is no greater than ten percent) and both are recorded in rules.optional_redemption_clean_up"


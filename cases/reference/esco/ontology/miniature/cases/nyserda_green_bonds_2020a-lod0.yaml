lod0_gaps:
- kind: underwriter
  description: "Ramirez & Co. buys the whole issue at par ($16,690,000) for a fee of $105,055 and resells it; none of the 37 roles covers an underwriter or placement agent. Left in source.context, as in the 2024A case, because the lasting funder is the bondholders. facilitator (arranging_finance) was considered and rejected: the OS gives the underwriter a purchase, not a mandate to arrange"
  classification: "below LOD 0 (issuance mechanics; LOD 1 event). Role question open: a principal-buyer role for a firm-commitment underwriter"
- kind: no_partner_loan_programme
  description: "A public lender lends straight to homeowners; there is no ESCO. partner_form takes a default with nothing to describe, and assignment_recourse and savings_basis take values with no object. Same as the 2024A case and batch-2 light_motril"
  classification: "encoding question (boundary of ESCO scope; ruling 14 keeps such deals in scope, payment_basis asset)"
- kind: pledge_vs_assignment
  description: "The OS says the Authority 'pledges and assigns' the right to receive Loan Payments to the Trustee as secured party, while it keeps the loans, the Trustee cannot sell them, and the Authority keeps the exclusive right to enforce until an Event of Default (p.30, p.49, p.75). receivable_holder offers assignee (a sale, as in forfaiting) or partner; neither names 'assigned as security, claim kept'. Reviewer kept partner (inferred), as in the 2024A case, so the programme's two series read the same; X had assignee (stated), Y partner (default). The choice changes no derived risk row here (borrower = client decides R5a)"
  classification: "encoding question (receivable_holder definition: say that a security assignment or pledge to a trustee for the payee's own lenders leaves the value at the payee)"
- kind: waterfall_and_redemption_order
  description: "The flow of funds (four-step Revenue Fund waterfall, shortfall draw order), the Excess Revenues redemption order (next-October maturity, then the 2036 term bond, then pro rata), the reserve sizing rule and its release are priority rules over time. LOD 0 holds them only as text in rules and as figures in numbers; no promise attribute carries a rank or a trigger"
  classification: "below LOD 0 (LOD 1 events: redemption dates, reserve top-up and release; LOD 2 formulas: Excess Revenues, Reserve Fund Requirement)"
- kind: clean_up_call
  description: "The 10% optional redemption is the Authority's right to redeem in whole at par, not a promise. LOD 0 has no option or call; a put option is a risk promise (ENCODING M28), a call by the debtor is not. Kept as a rule entry"
  classification: "below LOD 0 (LOD 1 event with a trigger); encoding question whether an issuer call needs a term"
- kind: overcollateralisation
  description: "141.6% initial cover, the 175% lapse test and excess interest are the primary credit enhancement (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.56). No LOD 0 term sizes a cushion contributed by the issuer rather than a third party; it appears only as the R5a risk row (NYSERDA first, Owners after) and as numbers"
  classification: "below LOD 0 (LOD 2 sizing); risk row inferred"
- kind: two_client_streams_one_pool
  description: "36.68% of the pool pays on the utility bill and 63.32% by ACH or cheque to the Servicer; collection_placement takes one value. Encoded from the majority stream with the other named in the reason (ENCODING, two client groups). The two-stage route (bill, then pledged account) has no list value (G-B7M-01, held for the owner)"
  classification: "encoding question (already open as G-B7M-01)"
- kind: evidence_gap_not_printed

    bsr_check: "BSR outstanding 4,800 = 1,195 + 1,090 + 965 + 835 + 715 (ties); redeemed or matured 16,690 - 4,800 = 11,890. Scheduled maturities to 1 Oct 2024: 1,905 + 2,065 + 1,820 + 1,635 = 7,425. Extra redemption = 11,890 - 7,425 = 4,465 = term bond 3,240 + serial 2025 to 2029 1,225 (310 + 280 + 245 + 210 + 180; ties). Consistent with the printed order: the term bond (second priority) is fully retired while serial bonds due 2025 to 2029 are still outstanding, and those five lost 20.6%, 20.4%, 20.2%, 20.1% and 20.1% of their par, near-equal as 'ratably' requires. Consistent with, not proof of, the order: the BSR does not say when each redemption fell"
    bsr_vs_appendix_d: "the term bond was gone by 31 Mar 2025, earlier than the last redemption in every Appendix D case (10/1/2026 to 10/1/2028), i.e. faster than the 4% CPR / 5% default projection"
    underwriting_fee: "105,055 / 16,690,000 = 0.63% of par"
    admin_cap_vs_fees: "trustee and rating 10,500 a year + backup 0.05% x 23,295,050 = 11,648 + servicing 5.07 x 12 x 2,259 = 137,438 gives about 159,586 a year at the Cutoff Date pool against the 160,000 cap (derived, uses the printed averages; the OS does not add them)"

conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F02
  title: jurisdiction header field; C1 trigger
  convention: 'A `jurisdiction` block (country, EU membership, whether the client is EU general government at close) sits in the miniature header; C1 applies_when {client_sector: public, jurisdiction: EU}.'
  origin: verdict change 2; findings F02; gaps G27
  applied_here: jurisdiction US; C1 applies_here false
- id: F06
  title: one_way form
  convention: 'A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated.'
  origin: verdict rule; findings F06
  applied_here: not triggered; every fee is printed, so no party is one_way
- id: F08
  title: 'conditional default: assignment_recourse'
  convention: "receivable_holder in {assignee, split} and source silent -> assignment_recourse = waiver, status default."
  origin: verdict change 3; findings F08; gaps G28
  applied_here: "not triggered: receivable_holder partner (reviewer), assignment_recourse not_applicable"
- id: F21
  title: determination_promise is required when payment is computed on savings or completion

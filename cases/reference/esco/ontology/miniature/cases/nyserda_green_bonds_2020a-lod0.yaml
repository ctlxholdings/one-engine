    core: contract
    parties: [borrowers, contractors]
    status: stated
    note: "cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:911 | 'Contractors are responsible for the contract with the customer'; terms not published"

commitments:   # reviewer: X's c5 (Excess Revenues redemption) folded into c4, the same principal flow; X's c8 retyped agency to the Trustee; renumbered
  c1:
    family: funding_promise
    from: nyserda
    to: borrowers
    status: stated
    funding_instrument: loan   # Program Loan (OS p.72 'any loan made by the Authority to a Borrower')
    what: "each Program Loan, funded first from the GJGNY Revolving Fund and in the Authority's name: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:979-980 | 'the Originator directly funds each On-Bill Recovery and Smart Energy Loans in the name of the Authority'; the Authority reimburses the Originator (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.21). Limits: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:862-863 | 'not more than $13,000 per Borrower, or not more than $25,000 if the financed project payback is 15 years or less'; terms of 5, 10 or 15 years (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.18)"
    established_by: loan_agreements
  c2:
    family: payment_promise
    from: borrowers
    to: nyserda
    status: stated
    depends_on_savings: false   # OS p.30 'level scheduled monthly payments that fully amortize'; savings tests are eligibility only (OS p.21)
    what: "cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1613-1614 | 'level scheduled monthly payments that fully amortize the amount financed over its original term to maturity'; fixed rates, pool weighted average 4.64% (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.32). Smart Energy Loans billed by the Servicer or paid by ACH; On-Bill Recovery instalments on the utility bill (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.9). Unsecured: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2926-2927 | 'the Portfolio Loans will be unsecured obligations of the Borrowers thereunder'. The right to receive these payments is assigned to the Trustee as security (settings.receivable_holder)"
    established_by: loan_agreements
  c3:
    family: funding_promise
    from: bondholders
    to: nyserda
    status: stated
    funding_instrument: bond   # Series 2020A bonds
    what: "buy the ten Series 2020A bonds, $16,690,000 at a price of 100% (cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:29 | 'Serial Series 2020A Bonds: $13,450,000' and the $3,240,000 term bond). Proceeds go to the Funds held by the Trustee: Loan Fund $15,821,989 to reimburse the GJGNY Revolving Fund, Reserve Fund $333,800, Costs of Issuance Fund about $534,211 (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.9, p.54, p.48). The Reserve Fund deposit is this funding, not a separate promise (ENCODING M12; c5 holds and applies it)"
    established_by: indenture
  c4:
    family: payment_promise
    from: nyserda
    to: bondholders
    status: stated
    depends_on_savings: false   # fixed coupons, OS p.1
    what: "interest and principal on the ten bonds, solely from the Pledged Revenues: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:24 | 'payable solely from and secured by the Pledged Revenues'. Interest cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2683 | 'payable semi-annually on April 1 and October 1 of each year, commencing April 1, 2021', 30/360; principal at maturity on 1 Oct 2021 to 2029 and 1 Oct 2036 (numbers.bonds), or earlier by mandatory redemption at par from Excess Revenues in the printed order: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2689-2691 | 'in whole or in part, on each Interest Payment Date, commencing April 1, 2021, from amounts remaining on deposit in the Redemption Fund' (rules.excess_revenues_redemption). Not accelerable after an Event of Default (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.60)"
    established_by: indenture
  c5:
    family: agency_promise
    from: bny_mellon
    to: bondholders
    status: stated
    what: "hold the Loan, Revenue, Debt Service, Reserve, Redemption and Cost of Issuance Funds and apply them in the printed order (rules.flow_of_funds), including the Reserve Fund draws and release: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2780-2781 | 'The Trustee is obligated to deposit all Pledged Revenues in the Revenue Fund upon receipt by the Trustee'; registrar and paying agent (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.8); may enforce the Indenture but not accelerate (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.10, p.60)"
    established_by: indenture
  c6:
    family: payment_promise
    from: nyserda
    to: bny_mellon
    status: stated
    what: "Trustee fees, an Administrative Expense paid from the Revenue Fund within the $160,000 yearly cap: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3063-3064 | 'annual administration fee and the Rating Surveillance Fees are collectively $10,500 per annum' (trustee and rating-surveillance fees together)"
    established_by: indenture
  c7:
    family: agency_promise
    from: nyserda
    to: bny_mellon
    status: stated
    what: "the Authority's Indenture covenants, enforceable by the Trustee (cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:481-482 | 'The Trustee is authorized to enforce the Indenture and such covenants against the Authority.'): pass every Pledged Revenue on (cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2779-2780 | 'The Authority covenants in the Indenture to cause all Pledged Revenues to be paid to the Trustee for deposit in the Revenue Fund'), sweep the Dedicated Account each Business Day (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.26), enforce the Loan Agreements (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.55), publish an Information Statement after each Interest Payment Date (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.66), and pay administrative expenses above the cap out of the GJGNY Revolving Fund where legally available (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.58)"
    established_by: indenture
  c8:
    family: risk_promise
    covers: []   # eligibility breach, not client credit: the OS says these warranties 'do not address the collectability' (p.58)
    from: nyserda
    to: bondholders
    status: stated
    what: "release of Pledged Loan Payments on a Portfolio Loan found not to meet the Loan Criteria, by depositing its unpaid principal and interest: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3033-3034 | 'the Authority will, subject to certain limitations, effect the release of Pledged Loan Payments'. Limited to GJGNY Revolving Fund money legally available and inapplicable while ineligible loans are $100,000 or less or Value is at least 175% of bonds plus accrued interest (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.57-58). cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3049-3050 | 'do not address the collectability of the Portfolio Loans'. cover_kind absent: a conditional repurchase, none of the listed forms"
    established_by: indenture
  c9:
    family: agency_promise
    from: concord
    to: nyserda
    status: stated
    what: "service all Portfolio Loans, bill and collect Smart Energy Loans, post On-Bill Recovery files to the utilities, hold the original notes, deposit collections in the Dedicated Account pledged to the Trustee: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1149 | 'The Servicing Agreement appoints the Servicer as custodian for the Loan Agreements'; remains servicer until the bonds are no longer outstanding or a successor is appointed (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.23). Default collections through its unit Blackwell Recovery on a contingency fee (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.29)"
    established_by: servicing_agreement
  c10:
    family: payment_promise
    from: nyserda
    to: concord
    status: stated
    what: "Servicing Fees, per loan and per service: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3061-3062 | 'the Servicing Fees for the Portfolio Loans have averaged approximately $5.07 per loan/per month'; higher fees on delinquent loans and a contingency fee for default collections, offset against the Pledged Revenues (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.62)"
    established_by: servicing_agreement
  c11:
    family: risk_promise
    covers: []   # servicer negligence; servicer failure is LOD 3 (ENCODING risk defaults)
    from: concord
    to: nyserda
    status: stated
    what: "indemnity for its negligence: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1153-1154 | 'the Servicer agrees to indemnify and hold harmless the Authority from and against all liabilities'. Runs to the Authority only, not to the Owners (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.64). cover_kind absent: a contractual indemnity, not insurance (professional_indemnity is defined as insurance)"
    established_by: servicing_agreement
  c12:
    family: agency_promise
    from: vervent
    to: nyserda
    status: stated
    what: "stand ready and take over servicing: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1552-1553 | 'the Backup Servicer agrees to assume the primary portfolio servicing responsibilities under the Servicing Agreement within forty-five (45) days'; until then it reviews the monthly report and holds the month-end data file (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.30). Trigger: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:423-425 | 'will agree to assume the primary portfolio servicing responsibilities if the Servicer resigns or is removed by the Authority'"
    established_by: backup_servicing_agreement
  c13:
    family: payment_promise
    from: nyserda
    to: vervent
    status: stated
    what: "Backup Servicing Fees: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3062-3063 | 'the Backup Servicing Fees are 0.05% of the principal amount of the Portfolio Loans per annum'; once appointed, the backup receives its own compensation, not the Servicer's (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.29)"
    established_by: backup_servicing_agreement
  c14:
    family: agency_promise
    from: slipstream
    to: nyserda
    status: stated
    what: "review applications, originate and fund each loan in the Authority's name, prepare the documents and pay the contractor on completion: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1051-1052 | 'disburses the loan proceeds to the contractor upon submission of a certification of completion'; submits completed loans weekly to the Servicer (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.21)"
    established_by: origination_agreement
  c15:
    family: payment_promise
    from: nyserda
    to: slipstream
    status: stated
    what: "origination fee: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:992-993 | 'The Originator is paid an origination fee of $165 per originated Smart Energy Loan and $225 per originated On-Bill Recovery Loan'; the applicant also pays the Originator $150, which may be financed (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.20)"
    established_by: origination_agreement
  c16:
    family: risk_promise
    covers: [R5a]   # partial transfer: the credit loss on a loan underwritten outside the standards
    from: slipstream
    to: nyserda
    status: stated
    what: "the Originator bears the loss from a loan that breaches the underwriting standards: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:982-983 | 'the Originator is responsible for the total loss incurred by the Authority resulting from such non-compliance, not to exceed the outstanding loan balance'. Runs to the Authority; the Origination Agreement is not pledged to the Trustee (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.18). cover_kind absent: a contractual indemnity"
    established_by: origination_agreement
  c17:
    family: agency_promise
    from: utilities
    to: nyserda
    status: stated
    what: "bill the On-Bill Recovery instalment with the utility charges, collect it and remit it: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1213-1214 | 'remit on the 15th day of the month all amounts paid by customers for the On-Bill Recovery Loan installments'. The instalment ranks behind the utility charges: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:767-768 | 'any remaining amount will be applied to the on-bill recovery charge'"
    established_by: billing_services_agreements
  c18:
    family: payment_promise
    from: nyserda
    to: utilities
    status: stated
    what: "statutory fees to the utility in whose territory the customer sits: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:721-722 | 'to pay a fee of $100 per loan to the utility in whose service territory such customer is located' and a servicing fee of 1.00% of the loan amount (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.16)"
    established_by: billing_services_agreements
  c19:
    family: risk_promise
    covers: []   # collector negligence or breach; LOD 3
    from: utilities
    to: nyserda
    status: stated
    what: "indemnity for negligence, wilful misconduct or breach: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3448 | 'The utility subservicers will be obligated under the related subservicing agreements to indemnify the Authority'. Runs to the Authority only, not to the Owners (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.64). cover_kind absent"
    established_by: billing_services_agreements
  c20:
    family: performance_promise
    from: contractors
    to: borrowers
    status: stated
    what: "identify and install the financed measures and, for efficiency work, test out the house: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:924-925 | 'Contractors perform a comprehensive home energy assessment (audit), including health and safety testing, prior to performing work'; solar systems by NY-Sun contractors (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.18)"
    established_by: home_improvement_contracts
  c21:
    family: payment_promise
    from: borrowers
    to: contractors
    status: inferred
    what: "the project price, paid out of the loan: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1051-1052 | 'disburses the loan proceeds to the contractor upon submission of a certification of completion'. Inferred from the disbursement; the price itself is not printed"
    established_by: home_improvement_contracts

settings:
  payment_basis:
    value: asset
    status: inferred
    why: "No Partner, no energy service paid for. The homeowner repays a loan that bought the works from a contractor (c20, c21); instalments are level and do not move with savings (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.30). Savings tests are eligibility only: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1040-1041 | 'On-Bill Recovery Loan monthly payments may not exceed 1/12th of the estimated average annual energy cost savings'"
  client_sector:
    value: private
    status: stated
    why: "cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:555-556 | 'one-to-four family residential structures'; borrowers are individuals"
  partner_form:
    value: corporate
    status: default
    why: "no Partner: nobody designs, guarantees or operates; the Authority lends and a contractor installs. Default kept, as in the 2024A case"
  borrower:
    value: client
    status: stated
    why: "the homeowners take the Program Loans (c1, c2). The Authority's own bond debt is one level up (c3, c4); it is not a project loan for a Partner"
  receivable_holder:
    value: partner
    status: inferred
    why: "Reviewer (X assignee stated, Y partner default): the Authority keeps the loans and assigns only the right to receive their payments, as security. cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1579-1580 | 'the Authority will assign to the Trustee the right to receive Loan Payments for certain Program Loans'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1588-1589 | 'Other than the Trustee, as secured party under the Indenture, no party will have any material direct or contingent claim'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2524 | 'The Portfolio Loans are not pledged to the repayment of the Series 2020A Bonds'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:4062-4063 | 'the Authority reserves the exclusive right to enforce and to direct the enforcement of the Program Agreements'. assignee in this vocabulary marks a sale of the client payments (DEAL_SCHEMA P3, forfaiting; ENCODING fallbacks waiver and assignee_direct presume one); a security assignment to a trustee for the Authority's own bondholders is the lender keeping the claim and pledging it, as in the 2024A case. Value 'partner' stands for the payee itself (no Partner here). Alternative assignee if the owner reads a security assignment as an assignment (lod0_gaps pledge_vs_assignment). Changes no derived risk row: borrower = client fires first for R5a"
  collection_placement:
    value: pledged_escrow
    status: inferred
    why: "Representative value from the majority stream (ENCODING, two client groups in one deal). Smart Energy Loans, 63.32% of the pool balance, pay by ACH (52.4%) or cheque (10.9%) and land in an Authority account pledged to the Trustee: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1339-1340 | 'are deposited to a segregated demand deposit account of the Authority which is pledged to the Trustee under the Indenture', swept to the Trustee's Revenue Fund 'no less frequently than each Business Day' (p.26). The Servicer bills and processes; the account is not its own, so not operator_own (Y's choice). On-Bill Recovery Loans, 36.68%, are billed on the utility bill and remitted by ACH by the 15th of the next month (p.24, p.26), which by G-B7M-01 would be on_bill; that stream is c17 and numbers.pool_by_loan_type. Inferred because the value is a choice between two printed streams"
  aggregation:
    value: pool
    status: stated
    why: "2,259 loans pooled and pledged together (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.34); cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:387-388 | 'a portfolio of approximately $23.3 million of Program Loans'"
  debt_seniority:
    value: senior
    status: inferred
    why: "one class of ten bonds, all pari passu: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:4041-4042 | 'equally and ratably secured by the Indenture without preference, priority or distinction'. The redemption order (rules.excess_revenues_redemption) sequences repayment; it does not subordinate any bond"
  assignment_recourse:
    value: not_applicable
    status: inferred
    why: "follows from receivable_holder = partner: nothing is sold, so no assignee needs protection from the Partner's performance (there is no Partner). X's waiver (F08 default) fell with its assignee reading"
  savings_basis:
    value: deemed
    status: inferred
    why: "savings are only estimated before the loan, for eligibility: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1044-1045 | 'estimated energy cost savings over the anticipated life of improvements must be at least 80% of the total principal' (Smart Energy, with interest) and the On-Bill 1/12th test; nothing is measured afterwards and the payment does not depend on savings. Describes nothing under payment_basis asset"
  grant_recipient:
    value: client
    status: inferred
    why: "for efficiency work, 'a homeowner cash back incentive for those households qualifying for the Assisted Home Performance with ENERGY STAR' program (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.19); solar incentives go to the contractor of record, 'not to the customer or builder' (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.19). Mixed; efficiency (46.3% of the pool balance) takes the client. No giver is a party here"
  asset_owner:
    value: client
    status: inferred
    why: "unsecured consumer loans for work on the borrower's own home (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.56); title to the installed measures is not stated and is not security for the bonds"
  bill_custody:
    value: client
    status: inferred
    why: "the homeowner keeps the utility account; the On-Bill Recovery instalment is a separate line on that bill: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:426-427 | 'will be presented separately from any electricity/gas charges on a'"

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments forecast over the EPC + (b) any government financing not repayable by the Partner (e.g. capital grant), else the EPC is ON BALANCE SHEET for government (E15 L2578-2582; the summary box L6932-6943 states the sum without the basis)
    applies_here: false
    this_case: private homeowners in the US; outside the EU
    source: E15 L2576-2582, L5363-5380 (EU vs government financing), L6930-6943; register constraints.entries.C1_eurostat
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: partner}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? The private-sector counterpart of C1: when the Partner owns the installed assets during the term and the client pays for their use, the payments may be a lease liability on the client's balance sheet. Corpus: E02 L3293-3295"
    applies_here: false
    this_case: asset_owner = client (a loan, not a lease)
    source: gaps G23; E02 L3293-3295; register.yaml L301 ifrs_16 flag
  pledge_pledged_loan_payments_only:
    scope: contractual
    rule: "Only the Pledged Loan Payments, with the other Pledged Revenues and Funds, secure the bonds; the loans do not. cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2524-2525 | 'The Portfolio Loans are not pledged to the repayment of the Series 2020A Bonds, only the Pledged Loan Payments'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2525-2526 | 'The Trustee has no right to sell Portfolio Loans'. The Authority's rights under the Origination, Servicing, Backup Servicing and billing agreements are not pledged and cannot be enforced by the Trustee or Owners: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:879-880 | 'are not assigned or pledged by the Authority pursuant to the Indenture and cannot be enforced directly by the Trustee or by Owners'"
    applies_here: true
    source: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.18, p.49"
  limited_recourse_no_guarantee:
    scope: contractual
    rule: "Limited obligations; no recourse to the Authority's general credit, to the State or to any servicing party. cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:51 | 'The Series 2020A Bonds will not be general obligations of the Authority'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:582-583 | 'The Series 2020A Bonds will not be guaranteed by the State.'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2925 | 'The Series 2020A Bonds will not be insured or guaranteed by the Authority, the Originator, the Servicer'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3199 | 'The Series 2020A Bonds may not be accelerated following an Event of Default under the Indenture'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:513-515 | 'the Authority is not authorized to seek protection from its creditors pursuant to the United States Bankruptcy Code'"
    applies_here: true
    source: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.1, p.11, p.13, p.56, p.60"
  not_state_debt:
    scope: external-sectoral
    rule: "cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:451-452 | 'The Series 2020A Bonds shall not be a debt of the State nor shall the State be liable thereon'. The State's pledge not to alter the Authority's rights (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.65) is not a guarantee of payment"
    applies_here: true
    source: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.10, p.65"
  flow_of_funds:
    scope: contractual
    rule: "Order in which the Trustee applies the Revenue Fund (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.53-54). (a) each month, to the Authority for Scheduled Administrative Expenses, capped at $160,000 a Bond Year; (b) each March and September, to the Debt Service Fund up to the interest to accrue to the next Interest Payment Date plus any Principal Installment due; (c) each March and September, to the Reserve Fund up to the Reserve Fund Requirement; (d) each March and September, the remaining balance to the Redemption Fund. Quotes: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2789 | 'on the first Business Day of each month, to the order of the Authority'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2803 | 'on the first Business Day of each March and September, to the Debt Service Fund'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2819-2820 | 'to the Redemption Fund, the remaining balance in the Revenue Fund'. Debt Service Fund pays interest first, then Principal Installments: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:4170 | 'FIRST: to the payment of interest then due'. Shortfalls in Required Debt Service or administrative expenses are drawn from the Revenue Fund, then the Redemption Fund, then the Reserve Fund: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:4287, :4289, :4291 | '(a) Revenue Fund; (b) Redemption Fund; and (c) Reserve Fund'. Surplus in the Debt Service Fund returns to the Revenue Fund (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.77); unused Costs of Issuance Fund returns to the Revenue Fund (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.78)"
    applies_here: true
    source: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.53-54, p.76-78"
  reserve_fund_requirement_and_release:
    scope: contractual
    rule: "Requirement: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2841-2842 | 'the greater of: (a) two percent (2.00%) of the aggregate amount of all Outstanding Series 2020A Bonds; or (b) $50,000'. Funded at $333,800 from bond proceeds (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.54). Used for Scheduled Administrative Expenses and Required Debt Service when the Revenue and Redemption Funds fall short (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.54, p.78). Topped up from the Revenue Fund each March and September (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.54). Release: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:4209-4210 | 'exceeds the Reserve Fund Requirement, the Trustee will transfer any moneys in the Reserve Fund to the extent of such excess to the Revenue Fund', on an Interest Payment Date. The $50,000 floor binds once Outstanding bonds fall to $2,500,000 or less (derived). Purpose: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2843-2844 | 'The Reserve Fund is established to pay Scheduled Administrative Expenses and Required Debt Service on the Series 2020A Bonds'. Encoded as a debt-service reserve under ENCODING M12 (the Trustee's agency promise c5 plus the funding, here bond proceeds in c3), not as a risk_promise with cover_kind funded_reserve (Y's c20): it is funded from the bondholders' own money and topped up from the pledged revenues, so no party outside the lenders puts cash at risk for them (reviewer)"
    applies_here: true
    source: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.54, p.77, p.78"
  excess_revenues_redemption:
    scope: contractual
    rule: "Mandatory redemption at 100% of principal plus accrued interest on each Interest Payment Date from 1 Apr 2021, from Excess Revenues. Definition: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2693-2694 | 'the lesser of (x) the amount transferred from the Revenue Fund to the Redemption Fund pursuant to clause (d)' and '(y) the balance then on deposit in the Redemption Fund'. Order, exactly as written (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.52): cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2697-2698 | 'first, on each Interest Payment Date in April, commencing in April 2021, to the redemption of Series 2020A Bonds'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2698-2699 | 'if any, that mature on the Interest Payment Date in the following October'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2699-2700 | 'second, to the redemption of Series 2020A Bonds that mature on October 1, 2036'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2700-2701 | 'third, to the remaining Series 2020A Bonds ratably according to the outstanding principal amount of Series 2020A Bonds of each maturity'. So: (1) April only, the bonds due the next 1 October; (2) the term bond due 1 Oct 2036; (3) every other bond ratably by outstanding principal. The Trustee may buy bonds in lieu at not more than par: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2704-2705 | 'direct the Trustee to purchase Series 2020A Bonds with moneys in the Redemption Fund, at a price not greater than par'"
    applies_here: true
    source: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.52, p.54, p.78"
  optional_redemption_clean_up:
    scope: contractual
    rule: "Authority's call, in whole only, at 100% plus accrued interest from any source, once the bonds are small: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2711-2712 | 'is no greater than ten percent (10%) of the original principal amount of the Series 2020A Bonds on the Date of Issuance'. Threshold 10% of $16,690,000 = $1,669,000 (derived). Body wording tests each Interest Payment Date 'after giving effect to all other principal payment'; the Summary says 'on any Interest Payment Date on and after the date on which' the amount is at or below 10% (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.8). A right of the Authority, not a promise"
    applies_here: true
    source: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.8, p.52"
  loan_criteria_and_tiers:
    scope: contractual
    rule: "Eligibility of a Program Loan for the pledge: valid, no prior lien, original maturity at most 180 months, remaining balance $100 to $25,000, rate at least 2.99% (0.00% allowed for the 1-15 Jun 2020 promotion), level fully amortising payments, New York origination, at most 60 days delinquent at the Cutoff Date; a Tier 2 loan must be 60 months old (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.30-31). cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1601 | 'each Program Loan had an original maturity of not more than 180 months'; cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:1628-1629 | 'originated no fewer than sixty (60) months prior to the Pledge Date'"
    applies_here: true
    source: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.30-31"
  overcollateralisation_and_release_tests:
    scope: contractual
    rule: "At issuance Value of the Portfolio Loans plus cash and investments in the Pledged Funds is at least 141.6% of outstanding bond principal: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2445-2446 | 'will not be less than 141.6% of the aggregate amount of the outstanding principal amount of the Series 2020A Bonds'. The Authority's duty to release ineligible loans lapses while Value is at least 175% of bonds plus accrued interest (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.57-58). Primary enhancement: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:2928-2930 | 'The primary credit enhancement for the Series 2020A Bonds is overcollateralization, excess interest on the Portfolio Loans and amounts on deposit in the Reserve Fund'"
    applies_here: true
    source: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.48, p.56-58"
  on_bill_payment_priority:
    scope: external-sectoral
    rule: "The utility applies a partial payment first to its own charges: cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:767-768 | 'any remaining amount will be applied to the on-bill recovery charge'. The charge survives a sale of the property and is not a lien (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.16). Late fees on the on-bill charge were removed by the PSC (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.17-18)"
    applies_here: true
    source: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.16-18"
  administrative_expense_cap:
    scope: contractual
    rule: "cases/sources/nyserda-green-revenue-bonds-2020a-official-statement.txt:3057-3058 | 'applied to pay Administrative Expenses from the trust estate securing the Series 2020A Bonds to $160,000 in any Bond Year'. May be amended on satisfying the Rating Agency Requirement (KBRA confirmation); the Authority pays any excess from the GJGNY Revolving Fund where legally available (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.58)"
    applies_here: true
    source: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Solar-2020-Official-Statement.pdf p.58"


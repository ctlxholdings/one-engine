  applied_here: "The Bank of New York Mellon, c5"
- id: M12
  title: debt-service reserve
  convention: "Debt-service and maintenance reserves are the account bank's agency promise plus the funding party's payment into the account; collection_placement pledged_escrow when collections run through it; sizing is LOD 3."

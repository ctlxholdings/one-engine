lod0_gaps:   # what the deal needs that LOD 0 lacks
- kind: lease_in_name_loan_in_substance
  description: "Role lessor is defined by owning the equipment until the lease is paid. This municipal lease-purchase names the financier 'Lessor' but vests title in the lessee on acceptance and calls the transaction a loan for tax. The vocabulary can say it (role lender, asset_owner client), so this is not a missing term, but a modeller reading the label will choose lessor; the choice rests on the title clause and needs a rule that role follows title, not the document's label"
  classification: "encoding question (definition of lessor vs lender for lease-purchase; no new term)"
- kind: non_appropriation_exit
  description: "The district's right to terminate without penalty if its governing body does not appropriate funds (Master s.8) is a credit feature that moves title and the equipment back to the financier. LOD 0 holds it as a rule (non_appropriation); asset_owner is set for the term and cannot show the conditional reversion"
  classification: "below LOD 0 (event and contingent title transfer, LOD 1); recorded as a rule"
- kind: performance_contract_missing
  description: "The Performance Contracting Agreement, with any savings guarantee, M&V and price, is not in the package ('Scope of Work and Services from PCA to be attached'). payment_basis and the Partner's commitments are inferred from the names and Exhibit A only"
  classification: "evidence gap"
  checked: "3 Oct 2026 (Stage 1 step 5): the cited PDF (copy fetched 1 Oct) was searched again for the agreement. It is listed as closing item 10 ('Performance Contracting Agreement', Closing List) and Exhibit A-1 reads '[Scope of Work and Services from PCA to be attached.]'; its text is not in the package, and no der-vpp corpus file names Carpinteria. The contract stays as already encoded (performance_contract, c7 and c8, inferred). No savings guarantee, price or M&V term is shown, so no risk_promise and no risk_allocation `covers` line are added. Would change: the signed agreement, e.g. from the district's board packet"
- kind: lessee_as_lessor_agent
  description: "The district acts as the lessor's agent for acquiring and installing the equipment (Master s.4, s.6) while holding the Purchase Contracts. An agency_promise from client to financier is expressible (c6); it is not a role"
  classification: "none; recorded as a commitment"
- kind: hell_or_high_water_toward_lender
  description: "The district's payments are 'absolute and unconditional' and defences are waived against the lessor's assignees (Master s.5, s.18). assignment_recourse describes an assignee of the client's payments to the Partner; here nothing is assigned and the protected party is the client's own lender. Recorded as rules hell_or_high_water and a note (writer X)"
  classification: "encoding question (assignment_recourse = not_applicable with the note; no new value)"
- kind: billing_agent
  description: "SFS invoices for the lessor but is not shown collecting; collector_biller needs bills and collects (writer X)"
  classification: "encoding question (kept in source.context)"
- kind: unsigned_draft
  description: "All terms are as drafted on 23 June 2017; principal, dates, schedule and signatures are blank, so every stated item is stated-as-drafted"
  classification: "evidence gap"

conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F02
  title: jurisdiction header field; C1 trigger
  convention: 'A `jurisdiction` block (country, EU membership, whether the client is EU general government, all at financial close) sits in the miniature header, not among the settings; C1 applies_when {client_sector: public, jurisdiction: EU at close}.'
  origin: verdict change 2; findings F02; gaps G27
  applied_here: jurisdiction US-CA; C1 applies_here false
- id: F04
  title: borrower rule for provider-financed deals
  convention: borrower = none only when the source says own funds or equity; when the Partner finances the works and no loan or equity is named, keep the default partner with status default.
  origin: verdict change 4; findings F04; gaps G24
  applied_here: not triggered — the district takes a named lease-purchase loan, borrower = client (stated)
- id: F06
  title: one_way form (CASE_SPEC)
  convention: 'A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated; one_way: false is reserved for parties whose counter-promise is stated or inferred from a stated fact.'
  origin: verdict rule; findings F06
  applied_here: not triggered (reviewer removed SFS and its unstated c10)
- id: F08
  title: 'conditional default: assignment_recourse'
  convention: "receivable_holder in {assignee, split} and source silent -> assignment_recourse = waiver, status generic; performance_exposed only when the source shows the assigned leg varying with performance."
  origin: verdict change 3; findings F08; gaps G28
  applied_here: not triggered — receivable_holder = partner; Master s.18's waiver of defences against a future assignee is recorded in notes
- id: F09
  title: 'conditional default: collection_placement'
  convention: receivable_holder in {assignee, split} and source silent -> collection_placement = assignee_direct, status generic (E06 L558; E08 Fig 30 L3312-3317).
  origin: verdict change 3; findings F09; gaps G28
  applied_here: not triggered — nothing assigned; collection_placement inferred operator_own from the wire instructions
- id: F21
  title: determination_promise is required
  convention: "A determination_promise is required whenever a payment is computed on savings or completion; from = the party the source names, else the literal 'unstated'."
  origin: verdict rule; findings F21; gaps G08
  applied_here: c5 and c9 — escrow disbursement is released on the district's completion and acceptance certificates; from = district (stated)
- id: G17
  title: receivable_holder concerns payments under the EPC
  convention: "receivable_holder says who is entitled to the client's payments under the EPC; financing payments owed to the client's own lender are not an assigned EPC receivable."
  origin: batch 2-4 practice (espc_us)
  applied_here: Lease Payments go to Siemens Public under the financing, price of the works to Siemens Industry -> partner
- id: G23
  title: IFRS16_lease_test rule entry
  convention: "Rule entry IFRS16_lease_test, applies_when {client_sector: private, asset_owner: not client}: whether the client's contract is a service agreement or a lease (IFRS 16)."
  origin: verdict change 6; gaps G23
  applied_here: applies_here false (public client; title vests in the client)
- id: B2-R1
  title: grant or loan giver by identity (batch-2 adjudication)
  convention: "A government body that lends or grants takes government_financier; eu_funds for EU structural funds; grant_provider only for givers that are neither government nor EU funds."
  origin: batch-2 adjudication; CASE_SPEC_3
  applied_here: not triggered — the lender, Siemens Public, Inc., is a private company, role lender
- id: B2-T1
  title: definition touch-ups from batch 2 (debt_seniority = rank of the most junior debt in the deal)
  convention: "debt_seniority records the rank of the most junior debt in the deal."
  origin: batch-2 verdict, definition touch-ups
  applied_here: one loan -> senior (default)
- id: ROLE-BY-SUBSTANCE
  title: role by what the party does, not the document's label (RULINGS.md 2, partner by what it does; CASE_SPEC_5 asset_owner)
  convention: "A party takes the role its documents make it play. Siemens Public is called Lessor but, with title in the lessee and a loan for tax, plays lender."
  origin: RULINGS.md ruling 2 (Partner by what it does), applied by analogy; flagged for the reviewer
  applied_here: siemens_public = lender, asset_owner = client

- id: REV-H6-2
  title: lessor by title, not by label
  convention: "A financier named 'Lessor' takes lessor only when it holds title during the term (elements.yaml lessor: 'Owns the equipment until the lease is paid'); when title vests in the client at acceptance it takes lender and asset_owner = client."
  origin: batch-6 pair-H review (both writers; verified against Master s.10 and Schedule s.10)
  applied_here: siemens_public = lender; asset_owner = client (stated)


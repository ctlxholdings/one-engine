# Miniature — Carpinteria Valley Water District performance contract with Siemens Industry, financed by a tax-exempt
# lease-purchase from Siemens Public, Inc. with an escrow at UMB Bank (California), draft closing documents of June 2017,
# expressed at ESCO LOD 0
#
# Batch 6, pair H, RECONCILED by the pair-H reviewer from writers X and Y (base Y; rulings in batch6/H/review/decisions.json). Evidence is one public web document, fetched 1 Oct 2026 (curl, pdftotext; text kept only in the
# scratchpad), cited as '<url> | <section>' with an exact quote of 25 words or fewer. The PDF is a 44-page compilation of
# closing documents; it has no continuous page numbers, so sections are named by the document's own headings. UNSIGNED DRAFT:
# the cover reads 'Gilmore & Bell, P.C. Draft #2-June 23, 2017'; dates, amounts, signatures and the Performance Contracting
# Agreement itself are blank or absent. Every fact is therefore 'as drafted'. Every fact carries its status: stated,
# inferred (follows from a stated fact: said which), default (source silent), generic, unstated (counter-promise required
# by duality).

miniature: carpinteria_siemens_lease_purchase
lod: 0
case: batch6.S05
case_kind: deal   # one named transaction (Leasing Schedule #280-0006004-001 to a Master Lease Purchase Agreement), but only an unsigned draft of its closing documents
in_scope: true
in_scope_why: "The equipment list is 'Energy savings equipment as described in the Performance Contracting Agreement' with Siemens Industry: water-meter replacements and retrofits, advanced metering infrastructure, interior lighting upgrade and a photovoltaic system (CVWD17 | Leasing Schedule, Exhibit A). Efficiency (lighting, metering) and solar are mixed, and the contract is called a performance contract and an 'Energy Savings Contract' (Opinion of Counsel). A Partner delivers the equipment, so the deal is in scope. The Performance Contracting Agreement is not in the package, so whether Siemens Industry guarantees savings is not shown (payment_basis)"
tests_unused:   # items the row names, plus the unused items CASE_SPEC_5 lists
- item: lessor
  kind: role
  used: false
  reason: "REVIEW RULING (both writers agree; verified): lender, not lessor. elements.yaml defines lessor as the party that 'Owns the equipment until the lease is paid'; this lease vests title in the district at acceptance. The documents call Siemens Public, Inc. 'Lessor' but the vocabulary defines lessor as owning the equipment until the lease is paid, and here title does not stay with Siemens Public: 'Upon acceptance of the Equipment by Lessee, title to the Equipment shall vest in Lessee' (https://cvwd.granicus.com/MetaViewer.php?view_id=1&clip_id=12&meta_id=428 | Master Lease Purchase Agreement s.10). Title returns to the lessor only on non-appropriation or default (same section). The schedule states the parties' tax intent: 'a conditional sale or financing arrangement consisting of a loan from the Lessor directly to the Lessee' (Leasing Schedule s.10), and Siemens' own letter says 'Thank you for selecting Siemens Public, Inc. (“Siemens”) as your lender' (Lessor's Role Letter). Substance is a loan, so the role is lender. Alternative lessor, if the role is read from the label"
- item: asset_owner=lessor
  kind: setting_value
  used: false
  reason: "Read the lease, not the label: asset_owner = client. Title vests in the district on acceptance (Master s.10) and the district is 'deemed the owner of the Equipment' for income tax (Leasing Schedule s.10). Siemens Public holds only a first security interest and the right to take title back on default or non-appropriation (Master s.10, s.8)"
- item: collector_biller
  kind: role
  used: false
  reason: "REVIEW RULING (writer X over writer Y): Siemens Financial Services, Inc. (SFS) is 'Lessor’s fiscal agent' (Master s.9(b)) and receives the district's invoice-address form (Customer Billing Information), but the role needs a party that 'bills and collects' for the payee, and the lease payments are wired to 'Account Title: Siemens Public, Inc.' (Leasing Schedule s.9). Its requisition approvals are signed 'SIEMENS PUBLIC, INC., by SIEMENS FINANCIAL SERVICES, INC., As Fiscal Agent' (Escrow Exhibit A), i.e. acts in the lessor's name. SFS goes to source.context. Would change: a servicing or fiscal-agency agreement showing SFS receiving the lease payments"
- item: account_bank_trustee
  kind: role
  used: true
  reason: "UMB Bank, N.A. is the escrow agent holding the Equipment Acquisition Escrow Fund, 'irrevocably held in trust for the benefit of the Lessor and the Lessee' (Escrow Agreement s.3.3)"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No vehicle, no notes: Siemens Public lends 'for Siemens’ own account' (Lessor's Role Letter). Assignment by the lessor is allowed (Master s.18) but none is made in the draft"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "Fixed rate of 2.261% on the schedule (Leasing Schedule, Exhibit B); no hedge is mentioned in any document"
- item: authority_guarantor
  kind: role
  used: false
  reason: "No guarantor of the district's payments. The district's own non-appropriation right (Master s.8) is the only credit feature; the lessor's protection is the equipment and the escrow, not a third party"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The district pays fixed quarterly lease payments (60 payments) and the contract price of the works; no availability or output level sets a payment in the documents. Payment is 'absolute and unconditional' whatever the equipment does (Master s.5). payment_basis = asset"

source:   # where the facts come from; context = actors outside the deal boundary; notes = observations that are not gaps
  id: CVWD17
  title: "Carpinteria Valley Water District: closing documents, $[Principal Amount] Leasing Schedule #280-0006004-001 to Master Lease Purchase Agreement with Siemens Public, Inc. (Gilmore & Bell, P.C., Draft #2, 23 June 2017)"
  publisher: Carpinteria Valley Water District (agenda attachment, Granicus MetaViewer); drafted by Gilmore & Bell, P.C. as lessor's counsel
  passage: "https://cvwd.granicus.com/MetaViewer.php?view_id=1&clip_id=12&meta_id=428 | Closing List; Master Lease Purchase Agreement s.1-27; Leasing Schedule (incl. s.10-12, Exhibits A, A-1, B); Escrow Agreement (s.1-6, Schedule 1, Exhibit A, Exhibit B arbitrage instructions); Opinion of Counsel to Lessee; Officer's Certificate; Essential Use Certificate; Insurance Coverage Requirements; Customer Billing Information; Lessor's Role Letter"
  oracle: none — an unsigned draft, not a published validation target; no price or principal is stated, so only the printed rate, term and fee figures are tested
  context:
  - "Siemens Financial Services, Inc. (SFS): 'Lessor’s fiscal agent' (CVWD17 | Master s.9(b)); receives invoice-address instructions (Customer Billing Information) and signs requisition approvals in the lessor's name (Escrow Exhibit A). Payments land in Siemens Public's own account (Leasing Schedule s.9), so no collection for another party is shown: context, not collector_biller (reviewer)"
  - "Gilmore & Bell, P.C.: drafting counsel, named at the head of the closing list and as the addressee for the role letter (Lessor's Role Letter). Counsel, no promise in the deal"
  - "Lessee's counsel, special tax counsel and the Debt and Investment Advisory Commission filings: opinion, IRS Form 8038-G and the 'Report of Proposed Debt Issuance' (Closing List items 7-9, 13). Conditions of closing; the opinions give the lessor reliance but they are not commitments of the deal"
  - "Insurer: the district must insure the equipment and name the lessor as additional insured and loss payee (Master s.16; Insurance Coverage Requirements). No insurer is named; self-insurance is an option. The cover is a district obligation, not a promise by an insurer inside the deal"
  - "Suppliers other than Siemens Industry: Master s.3 and Schedule s.11 speak of 'one or more vendors, suppliers or contractors'. Only Siemens Industry is named; its subcontractors are not"
  - "Internal Revenue Code ss.103, 141, 148, 149(e): the tax-exempt status of the interest drives covenants, arbitrage instructions and a recalculation clause (Master s.5, s.9; Escrow Exhibit B). Rule source, not a party (rule tax_exempt_interest)"
  notes:
  - "Who is who: Siemens Industry Inc., Building Technologies Division is the performance contractor (the 'Energy Savings Contract' counterparty, Opinion of Counsel). Siemens Public, Inc. is the lessor and Siemens Financial Services, Inc. its fiscal agent. Three Siemens-branded entities with three roles. The documents never say whether they are affiliates"
  - "A lease in name, a loan in substance: the Master Lease Purchase Agreement vests title in the district on acceptance (s.10), the district reports as owner for tax (Schedule s.10) and bears 'all risk of loss' (Master s.15), and the lessor disclaims all warranties (Master s.7). The lease-purchase label is the market's normal one for a public borrower avoiding a debt limit: 'nothing in the Lease shall be construed to create an indebtedness or commitment of funds other than current revenues of Lessee' (Master s.5)"
  - "Payment is cut off from performance: 'Lessee's obligation to pay the Lease Payments is absolute and unconditional in all events' and cannot be set off for 'any failure of any of the Equipment to be delivered or installed' (Master s.5). Its only exit is non-appropriation (Master s.8). The lessor therefore does not bear the Partner's performance risk"
  - "Pre-agreed waiver of defences if the lessor assigns: 'Lessee shall not have the right to and shall not assert against any assignee any claim, defense, recoupment claim, setoff or counterclaim' (Master s.18). Not active in the draft (receivable_holder partner, nothing assigned), but it is the assignment_recourse = waiver clause, ready for use"
  - "Lessee-as-agent: the district is the lessor's agent for acquiring and installing the equipment (Master s.4, s.6), while the Purchase Contracts with the suppliers belong to the district and their rights are assigned to the lessor (Schedule s.11(d), 'but none of its obligations')"
  - "The escrow is a construction fund: the lessor deposits the principal with UMB Bank; disbursements go to suppliers on requisitions signed by the district and approved by the lessor (Escrow s.2.2, s.3.2). Unspent money prepays the lease (Escrow s.3.2.3, s.3.5). It is not a collections account"
  - "The draft is unsigned and the key numbers are blank: Principal Amount, Maximum Equipment Cost, dates, payment schedule ('[To be provided by Lessor.]', Exhibit B). Printed and usable: rate 2.261%, 60 quarterly payments, escrow fees, interest on late payment, the equipment list"


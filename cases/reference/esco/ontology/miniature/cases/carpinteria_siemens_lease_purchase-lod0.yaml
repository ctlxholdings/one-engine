commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: funding_promise
    from: siemens_public
    to: district
    status: stated
    funding_instrument: lease   # lease purchase agreement (CVWD17)
    what: "advance the lease principal by depositing it with the escrow agent: 'Lessor will deposit, or cause to be deposited on its behalf, with the Escrow Agent, the Escrow Fund Deposit' (CVWD17 | Escrow s.2.2); Principal Amount blank in the draft; Siemens is 'extending credit to you through the purchase of a lease purchase agreement' (Lessor's Role Letter)"
    established_by: [lease_purchase, escrow_agreement]
  c2:
    family: payment_promise
    from: district
    to: siemens_public
    status: stated
    what: "60 quarterly Lease Payments including interest at 2.261% (CVWD17 | Leasing Schedule s.4, Exhibit B), 'absolute and unconditional in all events' (Master s.5), subject to non-appropriation (Master s.8); payable to the lessor 'or its assignee' (Master s.5); each payment late by over ten days bears the lesser of 12% a year or the highest lawful rate (Master s.5)"
    established_by: lease_purchase
  c3:
    family: agency_promise
    from: umb_bank
    to: [siemens_public, district]
    status: stated
    what: "hold the escrow fund in trust for lessor and lessee and disburse it on requisitions: 'irrevocably held in trust for the benefit of the Lessor and the Lessee' (CVWD17 | Escrow s.3.3); disburse for Acquisition Costs on a requisition signed by the district and approved by the lessor (s.3.2.2.2); unspent balance prepays the lease (s.3.2.3, s.3.5)"
    established_by: escrow_agreement
  c4:
    family: payment_promise
    from: district
    to: umb_bank
    status: stated
    what: "escrow fees: 'The Lessee shall pay $600 to the Escrow Agent on the Effective Date' then '$1,200 per year annually payable in arrears' or $100 a month for a partial year (CVWD17 | Escrow s.5.4)"
    established_by: escrow_agreement
  c5:
    family: determination_promise
    from: district
    to: siemens_public
    status: stated
    determines: acceptance   # completion and acceptance of the equipment
    what: "certify completion and acceptance of the equipment, which releases the escrow money: a Requisition Requesting Disbursement 'irrevocably accepts that portion of the Equipment' (CVWD17 | Escrow, Exhibit A, para 4) and a final Acceptance Certificate (Escrow s.3.2.3; Schedule s.12). The payment to the supplier is computed on completion, so F21 asks for this promise; the district itself determines it, with the lessor approving"
    established_by: [lease_purchase, escrow_agreement]
  c6:
    family: agency_promise
    from: district
    to: siemens_public
    status: stated
    what: "act as the lessor's agent in buying and installing the equipment: 'Lessor hereby irrevocably appoints Lessee as its agent in connection with the acquisition and installation of the Equipment' (CVWD17 | Master s.4); 'Lessee, as agent of Lessor, shall cause the acquisition and installation of Equipment to be completed as soon as reasonably practicable' (s.4)"
    established_by: lease_purchase
  c7:
    family: performance_promise
    from: siemens_industry
    to: district
    status: inferred
    what: "supply and install the 'Energy savings equipment as described in the Performance Contracting Agreement': 'Water Meter Replacements and Retrofits', 'Advanced Meter Infrastructure (AMI)', 'Photo Voltaic System', 'Interior Lighting Upgrade' at the district office carport, the Carpinteria Reservoir and 'various locations' (CVWD17 | Leasing Schedule, Exhibit A). Inferred: the agreement is not in the package, and Exhibit A-1 'Scope of Work and Services from PCA to be attached' is empty. Any savings guarantee would belong here and is not shown"
    established_by: performance_contract
  c8:
    family: payment_promise
    from: district
    to: siemens_industry
    status: inferred
    what: "the contract price of the works, paid out of the escrow fund on requisitions: disbursements go 'directly to one or more Suppliers or in reimbursement of advance payments by Lessee' (CVWD17 | Leasing Schedule s.11(e)); price blank. Payee read as Siemens Industry because Exhibit A names its agreement as the equipment source (inferred); costs above the Maximum Equipment Cost are the district's own funds (s.11(b))"
    established_by: performance_contract
  c9:
    family: determination_promise
    from: siemens_public
    to: umb_bank
    status: stated
    determines: other   # approval of each escrow requisition
    what: "approve each requisition before the escrow pays: Acquisition Costs are disbursed on a requisition 'executed by an Authorized Officer of Lessee and approved for payment by an Authorized Officer of Lessor' (CVWD17 | Escrow s.3.2.2.2). The escrow agent pays only on the lessor's approval, signed through its fiscal agent (Escrow Exhibit A). Added by the reviewer from writer X (c8)"
    established_by: escrow_agreement

settings:   # the 13 LOD 0 facets, in vocabulary order (payment_basis first)
  payment_basis:
    value: asset
    status: inferred
    why: "what the district is shown paying is a fixed price for installed equipment (c8, from escrow) and fixed lease payments on a loan (c2); nothing in the package ties a payment to measured savings or an output level. Alternative savings (the ENCODING.md fallback) if the unseen Performance Contracting Agreement guarantees savings, as its name suggests: 'Performance Contracting Agreement' and 'Energy Savings Contract' (Opinion of Counsel). Fixed-rate lease payments are 'absolute and unconditional' whatever the equipment does (Master s.5)"
  client_sector:
    value: public
    status: stated
    why: "'a state or a fully constituted political subdivision or agency of the State of Lessee' (CVWD17 | Master s.9(a)(i)); 'a public body corporate and politic' with 'the power to tax' (Opinion of Counsel, para 1)"
  partner_form:
    value: corporate
    status: inferred
    why: "Siemens Industry Inc., a division of a standing company (CVWD17 | Opinion of Counsel); no project vehicle is mentioned"
  borrower:
    value: client
    status: stated
    why: "the district takes the lease-purchase financing: 'a loan from the Lessor directly to the Lessee' (CVWD17 | Leasing Schedule s.10); Lessee pays the Lease Payments (Master s.5). The definition 'loan or lease' covers it"
  receivable_holder:
    value: partner
    status: inferred
    why: "convention G17 (as espc_us): receivable_holder concerns payments under the EPC. The district's price for the works goes to Siemens Industry (c8); the Lease Payments are owed under the financing contract to the lender (c2), not assigned from the Partner. Nothing is assigned yet: 'Lessor (and any assignee of Lessor) may assign any of its rights' (Master s.18) is a permission only"
  collection_placement:
    value: operator_own
    status: inferred
    why: "'all payments shall be sent by wire transfer' to an account titled Siemens Public, Inc. (CVWD17 | Leasing Schedule s.9): the lender's own account, invoiced by its fiscal agent. The escrow (UMB) holds the construction money, not the client's payments, so pledged_escrow does not apply. Alternative assignee_direct if the lessor assigns the lease"
  aggregation:
    value: none
    status: inferred
    why: "one district, one Leasing Schedule. The Master Lease allows 'to be entered into from time to time' (CVWD17 | Master s.1), a financing framework on the lender's side, not a client-side framework or pool (as Sittard's ING covering agreement)"
  debt_seniority:
    value: senior
    status: inferred
    why: "REVIEW (writer X over writer Y's default): the only debt shown is the lease-purchase loan, secured by 'a first and prior security interest' in the equipment (CVWD17 | Master s.10); no other debt or shareholder loan appears, so nothing ranks ahead of it. Inferred from a stated lien and a single debt, not the silent-source fallback"
  assignment_recourse:
    value: not_applicable
    status: inferred
    why: "follows from receivable_holder = partner (nothing assigned in the draft). Master s.18 pre-agrees a waiver of defences against any future assignee, so waiver would apply the day the lessor assigns; recorded in notes"
  savings_basis:
    value: measured
    status: default
    why: "the package states no savings figure and no M&V method; the performance contract that would carry them is missing. Vocabulary default, with no object while payment_basis is asset"
  grant_recipient:
    value: none
    status: default
    why: "no grant or rebate in the documents; the Essential Use Certificate asks 'Will any loan or grant monies be used to make lease payments?' and the answer is blank"
  asset_owner:
    value: client
    status: stated
    why: "'Upon acceptance of the Equipment by Lessee, title to the Equipment shall vest in Lessee' (CVWD17 | Master s.10); the district 'being deemed the owner of the Equipment' for tax (Leasing Schedule s.10). Title passes to the lessor only if the district terminates for non-appropriation or defaults (Master s.10, s.8). Not lessor: see tests_unused"
  bill_custody:
    value: client
    status: default
    why: "who pays the water district's energy bills is not stated; vocabulary default. The district alone may 'own, use, manage or operate the Equipment' (Master s.9(a)(ix))"

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU at close}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments forecast over the EPC + (b) any government financing not repayable by the Partner (e.g. capital grant), else the EPC is ON BALANCE SHEET for government (E15 L2578-2582; the summary box L6932-6943 states the sum without the basis)
    applies_here: false
    this_case: a California water district; outside the EU, so no Eurostat test
    source: E15 L2576-2582, L5363-5380 (EU vs government financing), L6930-6943; register constraints.entries.C1_eurostat
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? The private-sector counterpart of C1: when the Partner owns the installed assets during the term and the client pays for their use, the payments may be a lease liability on the client's balance sheet. Corpus: E02 L3293-3295"
    applies_here: false
    this_case: client is public and asset_owner = client (title vests in the district on acceptance)
    source: gaps G23; E02 L3293-3295; register.yaml ifrs_16 flag
  non_appropriation:
    scope: contractual
    rule: "'in the event no funds or insufficient funds are appropriated and budgeted in any fiscal period for Lease Payments', the Lease terminates 'without penalty or expense to Lessee', which returns the equipment and the title to the lessor (CVWD17 | Master s.8; s.10)"
    applies_here: true
    source: CVWD17 Master s.8, s.10
  hell_or_high_water:
    scope: contractual
    rule: "'Lessee's obligation to pay the Lease Payments is absolute and unconditional in all events' and not subject to set-off or defence, 'including without limitation any failure of any of the Equipment to be delivered or installed' (CVWD17 | Master s.5), except non-appropriation (s.8)"
    applies_here: true
    source: CVWD17 Master s.5
  tax_exempt_interest:
    scope: external-sectoral
    rule: "The rate is set on the footing that 'the interest portion of the Lease Payments being excludable from gross income' (CVWD17 | Master s.5; Code s.103). If the exclusion is lost the lessor 'shall recalculate the Lease Payments' (s.5). The district covenants against arbitrage and private-activity-bond status (s.9(a)(vi)-(vii)) and follows the Arbitrage Investment Instructions (Escrow Exhibit B). Small-issuer exception: $5,000,000 of tax-exempt issues in the year (Exhibit B s.4(a))"
    applies_here: true
    source: CVWD17 Master s.5, s.9; Escrow Exhibit B
  essential_use:
    scope: contractual
    rule: "The district certifies the equipment is 'essential to the functions of the Lessee', for a need 'not temporary or expected to diminish' (CVWD17 | Essential Use/Source of Funds Certificate; Master s.9(a)(xiii)-(xiv)); a precondition of the non-appropriation structure"
    applies_here: true
    source: CVWD17 Essential Use Certificate; Master s.9


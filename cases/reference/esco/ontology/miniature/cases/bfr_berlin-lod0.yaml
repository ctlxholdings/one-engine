in_scope: true
in_scope_why: 'A named, signed energy-saving contract (''Contracting-Modell: Energiespar-Contracting''; ''Vertragsschluss: 01.06.2006'') in which the contractor
  guarantees a yearly energy-cost saving (''Einspargarantie: 37.000 Euro pro Jahr (25,0 Prozent)''). The client pays for an energy service tied to savings,
  so payment_basis = savings and the deal is in scope (EED Art. 2(27) via E02 L556-560)'

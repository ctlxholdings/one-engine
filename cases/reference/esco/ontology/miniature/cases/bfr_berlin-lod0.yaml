    every quote below asserted as a substring of that text'
  oracle: none external. Internal checks in numbers.checks re-compute the printed percentage, the phase length and the Merkmale size classes from the page's
    own figures
  context:
  - 'Deutsche Energie-Agentur GmbH (dena) is listed under Beratung (''Beratung Deutsche Energie-Agentur GmbH (dena)'', [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/
    | Bundesinstitut für Risikobewertung Berlin > Projektbeteiligte]). An adviser with no promise stated on the page: context, not a party (standing ruling
    on advisers and energy agencies)'
  - 'End user: the federal risk-assessment institute; one site of twelve buildings (''Zum Standort gehören 12 Gebäude, die als Büro- und Verwaltungsgebäude,
    Labore, Tierställe und Fischzuchtanlage genutzt werden.'', [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/
    | Bundesinstitut für Risikobewertung Berlin > Liegenschaft(en)]). It signs nothing and promises nothing on the page; the named client contracts for
    it, which the authority definition covers (''for itself or other public bodies''). Not encoded as occupant'
  - dena is also the publisher of the page. No funder, bank, guarantor or verifier is named in the entry; nothing is added
  notes:
  - 'Payment mechanics are not on the page for this entry: no remuneration, schedule, shortfall rule or measurement method. The page''s general text says
    only ''Die Realisierung von Projekten durch einen Energiespar-Contractor führt in der Regel zu höheren Einsparungen, die zusätzlich noch vertraglich
    garantiert werden.'' [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | page intro > ESC für die öffentliche
    Hand]'
  - 'Construction-cost subsidy flag: ''mit Baukostenzuschuss: ja'' [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/
    | Bundesinstitut für Risikobewertung Berlin > Merkmale]. Under the standing ruling a Baukostenzuschuss flagged ''ja'' is the client''s own payment to
    the Partner (c4, inferred), not a grant; no amount, payer or date is published'
  - 'Savings percentage: 37,000 / 147,000 = 25.17% vs 25.0% printed: does NOT close: 25.17% rounds to 25.2%, gap 0.17 points; 25.0% of 147,000 = 36,750
    EUR. The page gives no unrounded inputs, so the gap cannot be explained; immaterial at LOD 0'

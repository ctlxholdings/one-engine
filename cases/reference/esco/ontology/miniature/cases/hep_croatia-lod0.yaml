# Miniature — HEP ESCO (Croatia), the utility-based super-ESCO, expressed at ESCO LOD 0
#
# Batch 2 (CASE_SPEC_2.md), reconciled by the adjudicator from writers X (base) and Y; changes listed in source.notes.
# Original writer X. Shape copied from bytom_schools-lod0.yaml (normalised 1 Oct 2026).
# Frame: model/elements.yaml LOD 0 block (41 roles, 7 commitment families, 12 settings; owner rulings 28 Sep 2026).
# Every fact carries its status: stated / inferred / default / generic / unstated. Nothing invented; only the corpus.
# A programme: HEP ESCO signed many contracts (31 projects, E16); encoded as one representative contract with a
# public client. E09 = src-limaye-case-for-super-esco-2010.txt; E16 = wb-super-escos-emerging-possibilities-2018.txt
# (two-column layout: the HEP paragraph runs in the middle column L421-436, then the right column L389-404).

miniature: hep_croatia
lod: 0
case: batch2.hep_croatia
case_kind: programme   # one entity, 31 projects (E16 L433-436); the representative contract is HEP ESCO with a public client

tests_unused:   # which of the 22 unused LOD 0 items this case was chosen to test
- item: grant_provider
  kind: role
  used: true
  reason: "'The HEP ESCO received a $7 million GEF grant' (E09 L517). GEF is not government, so government_financier does not fit; the grant_provider definition cites 'E16 (GEF)'. E09 L505 also says GEF funds provided 'additional credit enhancement for HEP ESCO projects and ... technical assistance': the text gives the money as a grant to HEP ESCO and describes part of its use; the grant is the promise recorded (lod0_gaps notes the use)"
- item: grant_recipient=partner
  kind: setting_value
  used: true
  reason: "the recipient named is HEP ESCO itself (E09 L517), the Partner on the representative contract"

source:   # where the facts come from; context = actors outside the deal boundary (F23); notes = observations that are not gaps
  id: E09
  title: 'Scaling Up Energy Efficiency: The Case for a Super ESCO'
  publisher: Limaye & Limaye, SRC Global, Research Paper 2009-03, January 2010
  passage: "'Croatia - HEP ESCO' (corpus input/src-limaye-case-for-super-esco-2010.txt L500-520); super-ESCO definition L429-442, L467-474"
  secondary:
  - id: E16
    title: 'Transforming Energy Efficiency Markets in Developing Countries: The Emerging Possibilities of Super ESCOs'
    publisher: World Bank Live Wire 2018/92 (Sarkar & Moin)
    passage: "'The HEP ESCO in Croatia' (corpus input/wb-super-escos-emerging-possibilities-2018.txt L421-436 middle column, continued L389-404 right column)"
  oracle: "none numeric; super_esco-lod0.yaml (batch 1) cited E09 L516-519 as 'the corpus's only super-ESCO capitalisation anatomy, but another entity'"
  notes:
  - "Adjudication (batch 2): GEF kept as grant_provider only (X). Y's second role guarantee_facility and its inferred risk_promise GEF->local banks not adopted: E09 L505 says 'credit enhancement' without the form (guarantee, reserve, first loss) or the protected lender, and L517 names the money a grant received by HEP ESCO; guarantee_facility ('partial credit guarantee facility') would assert a form the text does not give. Recorded as an evidence gap. HEP ESCO kept as aggregator_super_esco (both writers): both sources class it a Super ESCO and it raises finance, is publicly owned and delivers through others; partner_esco is the alternative if 'subcontracts ESCOs' is read strictly. C1 applies_here set to undetermined: membership at signing (2003-2008) cannot be shown from the corpus"
  - "The two sources give different portfolio figures: E09 'By the end of 2008, about 186 million Kuna (US$35.4 million) in energy savings contracts have been signed' (L519-520); E16 'It implemented 31 energy efficiency projects ... for a total cumulative value of $29.5 million in energy efficiency investments' (L433-436). Different measures (contracts signed vs investments) and dates; both recorded, neither reconciled"
  - "E16 L400-401: 'loans to the HEP ESCO were made through HEP, which is a creditworthy client' — the World Bank loan is routed through the parent; recorded as a funding promise to HEP ESCO (E09 L503 'capitalized by a World Bank loan'), routing noted"
  - "E16 L389-393: HEP ESCO later 'entered new market segments, including greenfield renewable energy projects—a notable example was the Hrast biomass cogeneration project' — outside the representative EE contract"

jurisdiction:   # header field, not a setting (F02): drives the C1 trigger
  country: Croatia
  iso: HR
  eu_member: true
  eu_member_at_signing: undetermined   # E02 shows membership in 2020-21 only; contracts 2003-2008
  client_eu_general_government: true
  client_eu_general_government_at_close: undetermined   # owner ruling 1 Oct: jurisdiction dated at financial close; C1 cannot be decided
  status: inferred
  why: "public clients: 'public buildings of local authorities (administration buildings, schools, etc.), hospitals, or universities, and street lighting' (E16 L429-433); 'public agencies are not required to conduct any competitive procurement to contract with HEP ESCO' (E09 L514-516). EU membership: E02 (jrc-epc-in-the-eu-2020-2021.txt L332-345) counts Croatia among the Member States in 2020-21. The HEP contracts date from 2003-2008 (E09 L501, L519-520); the corpus does not date Croatia's accession, so membership at signing cannot be shown — hence inferred (lod0_gaps)"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: the energy savings contract and each financing agreement establish (fibo-fnd-rel-rel:confers) their commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 41 (a list = several roles, home role first; F13); groups computed from the role(s)
  hep_esco:
    entity: hep_esco
    role: aggregator_super_esco
    groups: [partner, delivery, capital, public]
    status: stated
    name: HEP ESCO (subsidiary of Hrvatska Elektroprivreda d.d.)
    text: "E09 lists it under 'EXAMPLES OF SUPER ESCOS' (L476-500): 'an ESCO subsidiary within the national power utility, Hravatska Electroprivreda (HEP)' (L501-502); E16 counts it among Super ESCOs (L400-403) and says it was created 'with the objective of developing, financing, and implementing energy efficiency projects on a commercial, for-profit basis, using local businesses as key delivery agents' (L423-427). Alternative partner_esco: it contracts public clients directly and the text names no subcontracted ESCOs, only 'local businesses'"
  public_client:
    role: authority
    groups: [demand, public]
    status: stated
    text: "'public buildings of local authorities (administration buildings, schools, etc.), hospitals, or universities, and street lighting' (E16 L429-433); 'Government entities can directly contract with government companies and their subsidiaries' (E09 L514-515). E09 L504 also names 'private clients'; the representative contract is public"
  local_businesses:
    role: epc_contractor
    groups: [delivery]
    status: stated
    text: "'using local businesses as key delivery agents' (E16 L426-427); not named"
  gef:
    entity: gef
    role: grant_provider
    groups: [public]
    status: stated
    name: Global Environment Facility (GEF)
    text: "'The HEP ESCO received a $7 million GEF grant' (E09 L517); 'the World Bank and the Global Environment Facility (GEF) helped create an ESCO subsidiary' (L501-502); 'GEF funds were also mobilized to provide additional credit enhancement for HEP ESCO projects and provide some technical assistance to the ESCO and local banks' (L505-506)"
  world_bank:
    role: ifi_dfi
    groups: [public, capital]
    status: stated
    name: World Bank
    text: "'a $5 million World Bank loan' (E09 L517); 'capitalized by a World Bank loan' (L503); E16 L400-401 'loans to the HEP ESCO were made through HEP'"
  hep:
    entity: hep_dd
    role: [equity_investor, utility_supplier]
    groups: [capital, energy, collection]
    status: stated
    name: Hrvatska Elektroprivreda d.d. (HEP), the national power utility
    text: "'equity investment from the parent utility' (E09 L517-518), 'HEP equity' (L503): its act in the deal is equity, so equity_investor first; it is 'the national power utility' (E16 L423), and utility_supplier's definition includes 'may own an ESCO'. E16 L395-398: HEP ESCO 'gained access to HEP's customer database'. No on-bill collection is stated"
  local_banks:
    role: lender
    groups: [capital]
    status: stated
    text: "'The ESCO also negotiated financing arrangements with local commercial bank debt facilities' (E09 L518-519); 'capitalized by ... local banks' (L503-504); not named"

contract:   # the agreements that establish the commitments
  energy_savings_contract:
    core: contract
    parties: [public_client, hep_esco]
    status: stated
    note: "'186 million Kuna (US$35.4 million) in energy savings contracts have been signed' (E09 L519-520); direct award without competition (L514-516); 'open book' pricing (L513); term not given"
  delivery_subcontracts:
    core: contract
    parties: [hep_esco, local_businesses]
    status: inferred
    note: "'local businesses as key delivery agents' (E16 L426-427); form not stated"
  gef_grant:
    core: contract
    parties: [gef, hep_esco]
    status: stated
    note: "'$7 million GEF grant' (E09 L517)"
  wb_loan:
    core: contract
    parties: [world_bank, hep_esco]
    status: stated
    note: "'$5 million World Bank loan' (E09 L517); made 'through HEP' (E16 L400-401)"
  equity:
    core: contract
    parties: [hep, hep_esco]
    status: stated
    note: "'equity investment from the parent utility' (E09 L517-518)"
  bank_facilities:
    core: contract
    parties: [local_banks, hep_esco]
    status: stated
    note: "'local commercial bank debt facilities' (E09 L518-519)"

commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: performance_promise
    from: hep_esco
    to: public_client
    status: stated
    what: "develops, finances and implements energy efficiency projects for public buildings, hospitals, universities and street lighting (E16 L423-433); 'energy efficiency services' (E09 L504); 'open book' pricing (E09 L513). HEP ESCO's own financing of the project is inside this promise (F05)"
    established_by: energy_savings_contract
  c2:
    family: payment_promise
    from: public_client
    to: hep_esco
    status: inferred
    what: "payment under the energy savings contract; follows from 'energy savings contracts' (E09 L519-520) on 'a commercial, for-profit basis' (E16 L424-426); payment form and term not stated"
    established_by: energy_savings_contract
  c3:
    family: performance_promise
    from: local_businesses
    to: hep_esco
    status: stated
    what: "delivery of the projects as 'key delivery agents' (E16 L426-427)"
    established_by: delivery_subcontracts
  c4:
    family: payment_promise
    from: hep_esco
    to: local_businesses
    status: inferred
    what: "price for the delivery work; follows from local businesses acting as HEP ESCO's delivery agents on a commercial basis (E16 L424-427); amounts not stated"
    established_by: delivery_subcontracts
  c5:
    family: benefit_promise
    from: gef
    to: hep_esco
    status: stated
    what: "'$7 million GEF grant' (E09 L517), with 'some technical assistance to the ESCO' (L505-506). E09 L505-506 describes GEF funds also providing 'additional credit enhancement for HEP ESCO projects' and technical assistance 'to the ESCO and local banks'; the split of the $7m between direct support, credit enhancement and TA is not given (lod0_gaps)"
    established_by: gef_grant
  c6:
    family: funding_promise
    from: world_bank
    to: hep_esco
    status: stated
    funding_instrument: loan   # World Bank loan (E09 L517)
    what: "'$5 million World Bank loan' (E09 L517); routed 'through HEP' (E16 L400-401)"
    established_by: wb_loan
  c7:
    family: payment_promise
    from: hep_esco
    to: world_bank
    status: inferred
    what: repayment of the loan with interest; a loan is by definition repayable (E09 L517 'loan'); terms not stated
    established_by: wb_loan
  c8:
    family: funding_promise
    from: hep
    to: hep_esco
    status: stated
    funding_instrument: equity   # equity from the parent utility (E09 L517-518)
    what: "'equity investment from the parent utility' (E09 L517-518); amount not stated"
    established_by: equity
  c9:
    family: payment_promise
    from: hep_esco
    to: hep
    status: inferred
    what: "residual claim of the parent on its subsidiary (F07): HEP ESCO operates 'on a commercial, for-profit basis' (E16 L424-426) and sought to increase 'its profitability' (E16 L389)"
    established_by: equity
  c10:
    family: funding_promise
    from: local_banks
    to: hep_esco
    status: stated
    funding_instrument: loan   # local commercial bank debt facilities (E09 L518-519)
    what: "'financing arrangements with local commercial bank debt facilities' (E09 L518-519)"
    established_by: bank_facilities
  c11:
    family: payment_promise
    from: hep_esco
    to: local_banks
    status: inferred
    what: debt service on the bank facilities; debt is by definition repayable (E09 L518-519)
    established_by: bank_facilities
  c12:
    family: determination_promise
    from: unstated
    to: [public_client, hep_esco]
    status: unstated
    determines: savings   # savings the payments rest on (E09 L519-520)
    what: "the contracts are 'energy savings contracts' (E09 L519-520), so some party establishes the savings the payments rest on; no party or M&V arrangement is named for HEP (F21: from = 'unstated')"
    established_by: energy_savings_contract

settings:   # the 13 LOD 0 facets, in vocabulary order (payment_basis added 1 Oct, owner ruling)
  payment_basis: {value: savings, status: inferred, why: "c2: clients sign 'energy savings contracts' with HEP ESCO (E09 L519-520); payment form and term not stated."}
  client_sector:
    value: public
    status: stated
    why: "public buildings of local authorities, hospitals, universities, street lighting (E16 L429-433); 'public agencies ... contract with HEP ESCO' (E09 L514-516). E09 L504 adds private clients; the representative contract is public"
  partner_form:
    value: corporate
    status: stated
    why: "'an ESCO subsidiary within the national power utility' (E09 L501-502): a standing company, not a deal SPV (F22)"
  borrower:
    value: partner
    status: stated
    why: "HEP ESCO takes the World Bank loan and the local bank facilities (E09 L517-519); the Partner on the representative contract is HEP ESCO"
  receivable_holder: {value: partner, status: default, why: no assignment or forfaiting mentioned}
  collection_placement: {value: operator_own, status: default, why: "not stated; no on-bill collection through HEP is mentioned for HEP ESCO"}
  aggregation:
    value: super_esco
    status: inferred
    why: "F13: aggregation = super_esco iff a party carries aggregator_super_esco; both sources class HEP ESCO as a Super ESCO (E09 L476-503; E16 L400-403). Alternative none if HEP ESCO is read as a single ESCO with subcontractors (it engages 'local businesses', not ESCOs)"
  debt_seniority: {value: senior, status: default, why: "not stated for the World Bank loan or the bank facilities"}
  assignment_recourse: {value: not_applicable, status: inferred, why: follows from receivable_holder = partner}
  savings_basis:
    value: deemed
    status: inferred
    why: "JRC 2017 (corpus input/jrc-energy-service-companies-in-the-eu-2017.txt L3966-3971) on HEP ESCO's projects: mostly contracts 'with fixed payments'; 'Energy savings are defined at the time of contracting' and were 'not been monitored and verified during the project lifetime'. Savings stipulated at signing = deemed (ENCODING.md, J7-G1). Inferred, not stated: the passage describes HEP ESCO's usual model (about 100 projects, 2015), not the representative 2003-08 contract. Was measured by default until 3 Oct (wave-2 FINDINGS s.3)"
    evidence: "der-vpp/spec-run/esco-moneyflow/input/jrc-energy-service-companies-in-the-eu-2017.txt:3969 | Energy savings are defined at the time"
  grant_recipient:
    value: partner
    status: stated
    why: "'The HEP ESCO received a $7 million GEF grant' (E09 L517). The credit-enhancement use (L505) does not change the recipient named"
  asset_owner: {value: client, status: default, why: not stated}
  bill_custody: {value: client, status: default, why: not stated}

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments forecast over the EPC + (b) any government financing not repayable by the Partner (e.g. capital grant), else the EPC is ON BALANCE SHEET for government (E15 L2578-2582; the summary box L6932-6943 states the sum without the basis)
    applies_here: undetermined
    this_case: "trigger met only if Croatia was a Member State at financial close, which the corpus does not date (E02 shows membership in 2020-21); on the corpus's own present-tense jurisdiction fact (public client; Croatia a Member State per E02) but not computable: no guaranteed savings or payments are published. If it bites: the GEF grant and the World Bank loan are not government financing (IFI financing 'is considered to be financing from the private sector', E15 L5381-5383); HEP's equity would be, if HEP acts on government instruction (E15 L5385-5391) — the corpus does not say. Caveat: the contracts (2003-2008) may predate membership; the corpus does not date it (lod0_gaps)"
    source: E15 L2576-2582, L5363-5396 (EU, IFI and public-corporation financing), L6930-6943; register constraints.entries.C1_eurostat
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: partner}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? The private-sector counterpart of C1: when the Partner owns the installed assets during the term and the client pays for their use, the payments may be a lease liability on the client's balance sheet. Corpus: E02 L3293-3295 ('renewed interest for EnPC and EEaaS after leasing has been categorized as on-balance in the IFRS rules')"
    applies_here: false
    this_case: client_sector public; the Eurostat test is the public-sector counterpart
    source: gaps G23; E02 L3293-3295; register.yaml L301 ifrs_16 flag
  direct_award:
    scope: external-procurement
    status: stated
    rule: "'Government entities can directly contract with government companies and their subsidiaries, so public agencies are not required to conduct any competitive procurement to contract with HEP ESCO' (E09 L514-516)"
    this_case: a procurement constraint on who becomes Partner; kept as a rule beside the tree, not a setting (G15, as in super_esco)
    source: E09 L514-516

numbers:   # instance data, not vocabulary
  created_year: 2003                    # E09 L501
  gef_grant_usd_m: 7                    # E09 L517
  world_bank_loan_usd_m: 5              # E09 L517
  contracts_signed_by_end_2008_hrk_m: 186     # E09 L519-520 ('about')
  contracts_signed_by_end_2008_usd_m: 35.4    # E09 L520
  projects_implemented: 31              # E16 L433
  cumulative_investment_usd_m: 29.5     # E16 L435-436
  derived:
    implied_rate_hrk_per_usd: 186 / 35.4 = 5.25
    grant_plus_ifi_loan_usd_m: 7 + 5 = 12
    grant_plus_ifi_loan_vs_contracts_signed: 12 / 35.4 = 33.9%
    average_investment_per_project_usd_m: 29.5 / 31 = 0.95
    gap_between_sources_usd_m: 35.4 - 29.5 = 5.9 (contracts signed by 2008 vs investments implemented; different measures)

reciprocity:   # gives/receives computed from commitments; one_way per convention F06
  hep_esco: {gives: [c1, c4, c7, c9, c11], receives: [c2, c3, c5, c6, c8, c10, c12], one_way: false}
  public_client: {gives: [c2], receives: [c1, c12], one_way: false}
  local_businesses: {gives: [c3], receives: [c4], one_way: false}
  gef:
    gives: [c5]
    receives: []
    one_way: true
    reason: "benefit promise, unilateral by nature: a non-repayable GEF grant (E09 L517)"
  world_bank: {gives: [c6], receives: [c7], one_way: false}
  hep: {gives: [c8], receives: [c9], one_way: false}
  local_banks: {gives: [c10], receives: [c11], one_way: false}

lod0_gaps:   # what the deal needs that LOD 0 lacks, each with a classification
- kind: grant_used_as_credit_enhancement
  description: "E09 gives the GEF money as a grant to HEP ESCO (L517) and says GEF funds 'also' provided 'additional credit enhancement for HEP ESCO projects' and TA to the ESCO and local banks (L505-506). The same programme money may be a benefit_promise (grant) and, in its use, a risk_promise to lenders; LOD 0 has both families but the text does not split the $7m or name the protected lender. Recorded as one benefit_promise"
  classification: "evidence gap (G12 programme-funding family)"
- kind: jurisdiction_time_dependence
  description: "the jurisdiction header is a single snapshot. Croatia is a Member State in E02 (2020-21) but the HEP contracts were signed 2003-2008; whether C1 reached them depends on the membership date at financial close, which the corpus does not give. The header may need an as-of date (the contract's financial close)"
  classification: "real LOD 0 gap (refinement of G27 jurisdiction field)"
- kind: super_esco_without_esco_subcontractors
  description: "aggregator_super_esco's definition says it 'subcontracts ESCOs'; HEP ESCO uses 'local businesses as key delivery agents' (E16 L426-427), not ESCOs. The sources still call it a Super ESCO. Encoded aggregator_super_esco + epc_contractor; the definition fits loosely"
  classification: "encoding question (definition: subcontracts ESCOs or contractors)"
- kind: award_mode
  description: "direct award without competition (E09 L514-516); kept as the rule direct_award"
  classification: "below LOD 0 / rule (G15)"

conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F01
  title: C1 rule text states the NPV basis
  convention: 'C1_eurostat: NPV at financial close of guaranteed savings >= NPV of operational payments + non-repayable government financing, else on the government balance sheet (E15 L2578-2582; summary box L6932-6943 omits the basis). Files that computed nominal sums say so; with level annual flows the direction does not change.'
  origin: verdict change 1; findings F01
  applied_here: C1 stated on the NPV basis; not computable here
- id: F02
  title: jurisdiction header field; C1 trigger
  convention: 'A `jurisdiction` block (country, EU membership, whether the client is EU general government) sits in the miniature header, not among the settings; C1 applies_when {client_sector: public, jurisdiction: EU}.'
  origin: verdict change 2; findings F02; gaps G27
  applied_here: jurisdiction HR, EU member per E02 (inferred; date caveat in lod0_gaps); C1 applies_here true, not computable
- id: F05
  title: "provider's own capital is inside performance_promise"
  convention: "Under one service contract the provider's own capital is part of its performance_promise; funding_promise requires a distinct claim between distinct parties (loan, equity, receivable purchase, lease)."
  origin: verdict rule; findings F05; gaps G07
  applied_here: "HEP ESCO's financing of client projects stays inside c1; funding promises only for the World Bank, HEP equity and local banks"
- id: F06
  title: one_way form (CASE_SPEC)
  convention: 'A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated; one_way: false is reserved for parties whose counter-promise is stated or inferred from a stated fact.'
  origin: verdict rule; findings F06
  applied_here: "gef one_way: true, unilateral by nature (grant)"
- id: F07
  title: equity / capitalisation reciprocal
  convention: "Equity or state capitalisation is a funding_promise whose reciprocal is the residual claim, recorded as a payment_promise with status inferred; if the source shows a non-returnable endowment, benefit_promise. Never funding_promise + 'unilateral by nature'."
  origin: verdict rule; findings F07
  applied_here: HEP equity c8 with inferred residual claim c9
- id: F13
  title: aggregation super_esco iff the role; role may be a list
  convention: "aggregation = super_esco iff a party carries aggregator_super_esco. A party's `role` may be a list, home role first, so one party can carry several of the 41 roles."
  origin: verdict rule; findings F13; gaps G11
  applied_here: "hep_esco aggregator_super_esco <-> aggregation super_esco; HEP = [equity_investor, utility_supplier]"
- id: F21
  title: determination_promise is required
  convention: "A determination_promise is required whenever a payment is computed on savings or completion; from = the party the source names, else the literal 'unstated'."
  origin: verdict rule; findings F21; gaps G08
  applied_here: "c12 from the literal 'unstated'"
- id: F22
  title: partner_form corporate definition
  convention: partner_form corporate = any standing legal entity (company, public body, state fund) that is not a deal-specific SPV (E15 ch.2 fn 21 reading). No new value.
  origin: verdict change 5; findings F22; gaps G14
  applied_here: a utility subsidiary is corporate
- id: IFRS16
  title: IFRS16_lease_test rule entry
  convention: "One rule entry, not a setting: IFRS16_lease_test, applies_when {client_sector: private, asset_owner: partner} — the private counterpart of C1."
  origin: verdict change 6; gaps G23
  applied_here: rule present; does not apply (public client)
- id: B2-R1
  title: grant giver by identity (batch-2 adjudication)
  convention: "A grant or subsidy from general government or a public entity acting for it is given by government_financier (its definition lists grants; it is what the Eurostat thresholds count, E15 L5361-5391); from EU structural funds by eu_funds (F03); grant_provider only for givers that are neither (GEF and other multilateral grant windows, foundations, utility rebate programmes). Corrects F03's last clause ('grant_provider is for national or other non-EU grants')."
  origin: batch-2 adjudication; audit proposal unused/final.json grant_provider (rename_redefine)

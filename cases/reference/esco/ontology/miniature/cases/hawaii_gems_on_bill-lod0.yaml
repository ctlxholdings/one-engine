# Miniature — Hawaii GEM$ (Green Energy Money $aver) On-Bill Financing Program, Hawaii Green Infrastructure Authority,
# repayments on the Hawaiian Electric bill, expressed at ESCO LOD 0
#
# Batch 6, pair H, RECONCILED by the pair-H reviewer from writers X and Y (base Y; rulings in batch6/H/review/decisions.json).
# Page numbers below are the report's printed numbers; the PDF page is one higher (printed p.6 = PDF p.7). Evidence is one public web document, fetched 1 Oct 2026 (curl, pdftotext; text kept only in the
# scratchpad), cited as '<url> | <page>' with an exact quote of 25 words or fewer. Page numbers are the report's own printed
# page numbers (footer 'N|Page'). Every fact carries its status: stated, inferred (follows from a stated fact: said which),
# default (source silent), generic (the source's general description of the programme, not one named contract), unstated
# (counter-promise required by duality). The representative contract is one GEM$ on-bill loan from the Authority to a
# residential owner-occupant for a PV or solar-hot-water system, repaid on the Hawaiian Electric bill.
# The source is a statutory annual report written by the Authority; it describes the mechanism and gives counts, not the
# loan documents.

miniature: hawaii_gems_on_bill
lod: 0
case: batch6.S06
case_kind: programme   # a scheme with many on-bill obligations (277 residential and commercial to 30 Sep 2022), encoded as one representative loan
in_scope: false
in_scope_why: "REVIEW RULING (writer Y over writer X): out-of-scope witness. The deal boundary is the on-bill channel the row names, and it is a solar loan chain: of 294 GEM$ on-bill obligations (277 residential + 17 commercial), 17 are filed as 'EE (SWH)' (solar water heating) and none as other efficiency (HGIA22 | p.13, p.15): 17 / 294 = 5.8%. The fund's efficiency lending (state-department lighting and HVAC, commercial EE loans) runs through direct loans, not the bill. Nobody is paid for an energy service. Would change: an owner ruling that the whole GEMS fund is the deal (efficiency about half of estimated gross savings, (170,619,931 + 334,295) / 340,581,157 = 50.2%, p.16), as NYSERDA was read. Writer Y's text follows. Out-of-scope witness. The on-bill product finances solar, not efficiency: of 277 GEM$ on-bill obligations to 30 Sep 2022, 260 are for PV (226 loans + 34 leases) and 17 for solar water heating, which the report files under 'EE (SWH)'; 'Total Number of GEM$ OBOs, EE' is 0 in the commercial table (HGIA22 | p.13, p.15). 17/277 = 6.1%, and solar water heating is a renewable heat source, not a reduction of demand. Nobody is paid for an energy service: the payment is a loan instalment for installed hardware. The fund's efficiency lending (state-department retrofits, lighting) runs through direct loans, not through the on-bill chain this row names. Kept because the money chain itself (public lender, utility collecting on the bill, ratepayer-funded bond) is the on-bill finance pattern the batch looks for a second source on; a reviewer may weigh the 17 solar-hot-water loans differently"
tests_unused:   # items the row names, plus the unused items CASE_SPEC_5 lists
- item: collector_biller
  kind: role
  used: false
  reason: "WITNESS ONLY (out of scope, posigen/geolumen precedent): the deal shows it but does not count. The utility carries the repayments for the lender: 'a risk mitigating loan repayment mechanism tied to the utility meter and paid through the Hawaiian Electric Companies’ electric utility bill' (https://files.hawaii.gov/dbedt/annuals/archive/2022/2022-hgia.pdf | p.6). The report does not say in so many words that the utility remits to HGIA; that it does is inferred from the repayment arriving at HGIA, which later 'transferred' loan repayments to the PUC (p.5). Same party also bills the Green Infrastructure Fee (p.4). Role list [utility_supplier, collector_biller], home role first"
- item: collection_placement=on_bill
  kind: setting_value
  used: false
  reason: "WITNESS ONLY (out of scope, posigen/geolumen precedent): the deal shows it but does not count. Stated: the title of the product and the mechanism are on-bill ('Green Energy Money $aver On-Bill Financing Program', p.6). Programme-level fact, so the status of the setting is stated for the programme and the representative contract inherits it"
- item: utility_supplier
  kind: role
  used: false
  reason: "WITNESS ONLY (out of scope, posigen/geolumen precedent): the deal shows it but does not count. Hawaiian Electric Company, Inc. ('the Hawaiian Electric Companies') supplies the electricity whose bill carries the instalment and the fee (p.4, p.6). It sells energy to the client; it is not an ESCO here"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "The report names the Department of Business, Economic Development & Tourism as issuer of the bonds (p.4) and says 'The GEMS bonds are not an obligation of the State of Hawaii' (p.4), but it names no separate bankruptcy-remote entity that holds receivables or issues notes. Whether a special-purpose entity sits between DBEDT and the ratepayer fee is not in this document, so nothing is encoded. The securitised asset is the right to the fee, not the loans"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "The report does not mention an interest-rate hedge. Nothing to quote"
- item: authority_guarantor
  kind: role
  used: false
  reason: "No guarantor of a public client's payments: the client here is a private homeowner, and the bonds are repaid by ratepayers, not guaranteed by the State (p.4)"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "The homeowner holds the PV system under the loan (asset_owner client). The 34 PV leases would put title with a lessor, not a vehicle, and the lessor is not named"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The client pays a fixed loan instalment on a bill; no availability or output level is the basis of payment. payment_basis = asset"

source:   # where the facts come from; context = actors outside the deal boundary; notes = observations that are not gaps
  id: HGIA22
  title: "2022 Annual Report to the Governor and Legislature, Hawaii Green Infrastructure Authority (pursuant to Act 211, SLH 2013 and Act 107, SLH 2021)"
  publisher: Hawaii Green Infrastructure Authority, Department of Business, Economic Development & Tourism (State of Hawaii)
  passage: "https://files.hawaii.gov/dbedt/annuals/archive/2022/2022-hgia.pdf | p.3-7 (authorization, PUC orders, GEM$ launch, community solar); p.12-17 (reporting metrics, OBO counts, savings, remaining capital). Metrics are to 30 Sep 2022"
  oracle: none — not a published validation target; acceptance is structural. Printed counts re-added below
  context:
  - "Hawaii Public Utilities Commission (PUC): approved the bond Financing Order (4 Sep 2014) and the loan Program Order (30 Sep 2014) and in Order No. 34930 (26 Oct 2017) changed the priority of uses of loan repayments (HGIA22 | p.5). A regulator: rule source, not a party (rule PUC_repayment_priority)"
  - "Department of Business, Economic Development & Tourism (DBEDT): the bond issuer under Act 211 (HGIA22 | p.4); HGIA is 'administratively attached' to it (p.6). Folded into the public financier side (hgia); lod0_gaps"
  - "Public Benefits Fee: the PUC Order makes loan repayments replenish it first (p.5); who pays into and draws from it is not in the report"
  - "Federal and other capital: USDA Rural Energy Savings Program loan of $20.0 million 'preliminarily approved' (p.10-11); EPA Greenhouse Gas Reduction Fund hoped for (p.11). Future funding of HGIA, not this programme's chain"
  - "Solar installers and the 'WECC' application channel: the report counts 'Status of Applications (WECC)' separately from 'Direct' (p.14) without saying who WECC is. The installer's contract with the homeowner is not described, so no epc_contractor party is encoded"
  - "Other HGIA products (HI-CAP, C-PACE, community solar, state-department retrofits) are separate programmes outside this deal boundary (p.7-9)"
  notes:
  - "The bond is repaid by the ratepayer fee, not by the loans: 'Its sole obligor are the ratepayers of the Hawaiian Electric Companies’ through a non-by-passable Green Infrastructure Fee on ratepayers’ utility bills' (HGIA22 | p.4). Two separate on-bill flows therefore exist: the borrower's GEM$ instalment (to HGIA) and every ratepayer's fee (to the bondholders). The loans are not the bond collateral"
  - "Order No. 34930 sends loan repayments first to 'replenishment of the Public Benefits Fee' before administrative costs (p.5); 'some $12.2 million' of loan repayments transferred to the PUC Special Fund appear on p.3, while p.5 says 'over $8.2 million'. Two figures for the same transfer in one document, not reconciled (the p.3 figure is cumulative 'since inception', the p.5 text carries no date)"
  - "GEM$ replaced credit underwriting: the on-bill mechanism 'enabled the Authority to abandon traditional credit underwriting' (p.6), and the report's FICO table 'Excludes on-bill applicants' (p.14)"
  - "Eligibility narrowed in 2019: 'limiting the use of all remaining GEMS loan capital to only LMI homeowners and renters' and others (p.6); in Aug 2022 HGIA asked the PUC to open GEM$ to all eligible applicants (p.7)"
  - "No ESCO and no Partner: the programme is a loan chain. The only savings in the report are estimates: 'Net savings calculations include tax credits, assume historical utility rate increase per island and are net of loan payments required' (p.16)"

jurisdiction:   # header field, not a setting (F02): drives the C1 trigger; dated at financial close
  country: United States (Hawaii)
  iso: US-HI
  eu_member_at_close: false
  client_eu_general_government_at_close: false
  as_of: "launch of GEM$ on-bill financing, April 2019 (HGIA22 | p.6); bonds issued November 2014"
  status: stated
  why: "State of Hawaii statute (Act 211, SLH 2013) and a State agency (HGIA22 | p.4-6); clients are residential and commercial ratepayers in Hawaii; outside the EU, so C1 does not apply"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: each contract establishes (fibo-fnd-rel-rel:confers) its commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 37 (a list = several roles, home role first; F13); groups computed from the role(s)
  homeowner:
    role: host
    groups: [demand]
    status: generic
    text: "'a risk mitigating loan repayment mechanism' for 'LMI homeowners and renters' (https://files.hawaii.gov/dbedt/annuals/archive/2022/2022-hgia.pdf | p.6). Not named; a representative owner-occupant (225 of the 226 on-bill PV loans are owner-occupied, p.13)"
  hgia:
    entity: hgia
    role: government_financier
    groups: [public, capital, risk]
    status: stated
    name: Hawaii Green Infrastructure Authority (HGIA), Hawaii's Green Bank
    text: "'The Authority, Hawaii’s Green Bank, was constituted in November 2014' (HGIA22 | p.5); attached to a State department (p.6). A public body that lends, so government_financier (B2-R1)"
  heco:
    entity: hawaiian_electric
    role: [utility_supplier, collector_biller]
    groups: [energy, collection]
    status: stated
    name: Hawaiian Electric Company, Inc. (the Hawaiian Electric Companies)
    text: "'paid through the Hawaiian Electric Companies’ electric utility bill' (HGIA22 | p.6); the Companies' ratepayers carry the fee (p.4). Supplier is stated; the collector role is inferred from the instalment arriving at HGIA through the bill"
  bondholders:
    role: lender
    groups: [capital]
    status: inferred
    text: "Buyers of the Green Energy Market Securitization bonds: 'HGIA’s loan fund was capitalized with the $146.0 million net proceeds of a Green Energy Market Securitization (“GEMS”) Bond issued in November 2014' (HGIA22 | p.6). No holder, trustee or underwriter is named; holders are inferred from 'bond'"
  ratepayers:
    role: host
    groups: [demand]
    status: stated
    text: "'Its sole obligor are the ratepayers of the Hawaiian Electric Companies’ through a non-by-passable Green Infrastructure Fee on ratepayers’ utility bills' (HGIA22 | p.4). All customers of the utility, a class, not a signatory"

contract:   # the agreements that establish the commitments
  gems_on_bill_loan:
    core: contract
    parties: [hgia, homeowner]
    status: generic
    note: "The representative contract. A GEM$ loan 'tied to the utility meter and paid through the Hawaiian Electric Companies’ electric utility bill' (HGIA22 | p.6). The loan documents were not fetched"
  on_bill_collection:
    core: contract
    parties: [hgia, heco]
    status: inferred
    note: "The launch was announced 'along with ... the Hawaiian Electric Company, Inc.' (HGIA22 | p.6); the agreement between HGIA and the utility, its fee and remittance terms are not in the report"
  green_infrastructure_fee:
    core: contract
    parties: [ratepayers, bondholders, heco]
    status: stated
    note: "Not a negotiated contract: a statutory charge under Act 211 and the bond Financing Order of 4 Sep 2014 (HGIA22 | p.4-5). Encoded as a contract only because LOD 0 has no separate slot for a statutory levy (lod0_gaps)"
  gems_bond:
    core: contract
    parties: [bondholders, hgia]
    status: inferred
    note: "'Green Energy Market Securitization bonds to capitalize the green infrastructure loan fund' (HGIA22 | p.4). Issuer is DBEDT by statute; encoded on the public side as HGIA, which holds the fund (lod0_gaps)"

commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: funding_promise
    from: hgia
    to: homeowner
    status: generic
    funding_instrument: loan   # GEM$ loan (HGIA22 p.7)
    what: "a GEM$ loan to install 'solar hot water or solar PV systems' (HGIA22 | p.7); underwritten on the meter, not on credit: 'abandon traditional credit underwriting' (p.6)"
    established_by: gems_on_bill_loan
  c2:
    family: payment_promise
    from: homeowner
    to: hgia
    status: generic
    what: "the loan repayment, billed on the homeowner's Hawaiian Electric bill: 'loan repayment mechanism tied to the utility meter and paid through the Hawaiian Electric Companies’ electric utility bill' (HGIA22 | p.6)"
    established_by: gems_on_bill_loan
  c3:
    family: agency_promise
    from: heco
    to: hgia
    status: inferred
    what: "bill the instalment on the customer's electric bill and pass the money on to the lender. Inferred: the report says repayment is 'paid through' the bill (p.6) and that HGIA 'transferred' loan repayments onward (p.5); the remittance step itself is not described"
    established_by: on_bill_collection
  c4:
    family: payment_promise
    from: hgia
    to: heco
    status: unstated
    what: "counter-promise required by duality; source silent (a fee for billing and remitting the instalment)"
    established_by: on_bill_collection
  c5:
    family: funding_promise
    from: bondholders
    to: hgia
    status: stated
    funding_instrument: bond   # GEMS bonds (HGIA22 p.6)
    what: "buy the GEMS bonds whose proceeds capitalise the loan fund: '$146.0 million net proceeds' of a bond 'issued in November 2014' (HGIA22 | p.6); the report also calls it the '$150.0 million Green Energy Market Securitization Bond' (p.6). Issuer is DBEDT; encoded against HGIA, the fund holder"
    established_by: gems_bond
  c6:
    family: payment_promise
    from: ratepayers
    to: bondholders
    status: stated
    what: "the Green Infrastructure Fee on utility bills services the bonds: ratepayers are the bonds' 'sole obligor' through a 'non-by-passable' fee (HGIA22 | p.4). Payee is the bondholders by inference from 'bonds'"
    established_by: green_infrastructure_fee
  c7:
    family: agency_promise
    from: heco
    to: bondholders
    status: inferred
    what: "collect the fee on its bills ('on ratepayers’ utility bills', HGIA22 | p.4) for the bond. The report does not name the utility as the fee collector; inferred because the fee sits on its bill. Remittance route and any trustee are not in the report"
    established_by: green_infrastructure_fee
  c8:
    family: payment_promise
    from: bondholders
    to: heco
    status: unstated
    what: "counter-promise required by duality; source silent (a servicing fee for billing and collecting the fee)"
    established_by: green_infrastructure_fee
  c9:
    family: performance_promise
    from: hgia
    to: ratepayers
    status: unstated
    what: "REVIEW (writer X's family over writer Y's benefit_promise, which by definition has no reciprocal promise and so cannot be a duality counter-promise): operate the programme the fee funds; HGIA 'is responsible for the administration and oversight of the $150.0 million Green Energy Market Securitization Bond' (HGIA22 | p.6). Counter-promise required by duality; source silent. The objective 'Enable more ratepayers to reduce their energy use and energy costs by helping them finance clean energy improvements' (HGIA22 | p.4) is a programme aim, not a promise to the fee payers"
    established_by: green_infrastructure_fee

settings:   # the 13 LOD 0 facets, in vocabulary order (payment_basis first)
  payment_basis:
    value: asset
    status: inferred
    why: "No Partner. The client repays a loan for an installed PV or solar-hot-water system (c1, c2); the instalment does not depend on measured savings. The only savings in the report are estimates, 'net of loan payments required' (HGIA22 | p.16)"
  client_sector:
    value: private
    status: stated
    why: "the representative client is a homeowner; the report's residential on-bill obligations are to 'low and moderate-income homeowners and renters' (HGIA22 | p.7). The programme also reaches nonprofits, small businesses and State departments (p.6, p.15), outside this representative contract"
  partner_form:
    value: corporate
    status: default
    why: "no Partner: nobody is contracted to deliver an energy service. Default kept, as in nyserda_green_bonds_2024a"
  borrower:
    value: client
    status: stated
    why: "the homeowner takes the loan: 'helping them finance clean energy improvements' (HGIA22 | p.4); the report counts 226 on-bill PV loans to 'Owner Occupied OBOs' 225 and 'Renter OBOs' 1 (p.13). The bonds sit one level up (c5, c6)"
  receivable_holder:
    value: partner
    status: default
    why: "default; there is no EPC and no Partner. The instalment (c2) is payable to HGIA as lender, so the value has no object (lod0_gaps, same as nyserda_green_bonds_2024a). Nothing is assigned to the bondholders: the bond is serviced by the fee, not by the loans"
  collection_placement:
    value: on_bill
    status: stated
    why: "'tied to the utility meter and paid through the Hawaiian Electric Companies’ electric utility bill' (HGIA22 | p.6). Programme-level; GEM$ is called 'On-Bill Financing Program'"
  aggregation:
    value: none
    status: inferred
    why: "each GEM$ loan is a stand-alone loan from the fund; the report shows no pool pledged to investors, because the bond is repaid by the fee and not by loan cash flows (p.4). Alternative pool, if the loan fund is read as a pool (the fund holds 277 on-bill obligations, p.13)"
  debt_seniority:
    value: senior
    status: default
    why: "no rank is stated for the GEM$ loan or the bond. The report calls the fund 'patient, subordinate GEMS funds' only for a community-solar project (p.7), a different product, so it does not set the rank here"
  assignment_recourse:
    value: not_applicable
    status: inferred
    why: follows from receivable_holder = partner (nothing assigned)
  savings_basis:
    value: measured
    status: default
    why: "REVIEW (writer X over writer Y's deemed): payment_basis is asset, so the setting has no object and keeps the vocabulary default. Writer Y's note: no savings are measured: the report publishes 'Estimated' yearly production and 'Aggregate, Estimated' cost savings computed with an assumed rate increase (p.12, p.16). The payment does not depend on them. Alternative measured (default) if the setting is read as having no object"
  grant_recipient:
    value: none
    status: default
    why: "no non-repayable support is shown for the on-bill loan. Federal tax credits enter the report's net-savings estimate (p.16) but are not a grant from a giver in the deal"
  asset_owner:
    value: client
    status: inferred
    why: "a loan: the homeowner owns the PV or solar-hot-water system. The 34 on-bill PV leases (p.13) would put title with a lessor; the lessor is not named and the representative contract is a loan"
  bill_custody:
    value: client
    status: inferred
    why: "the homeowner keeps the electric account and the instalment rides on that bill (p.6)"

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU at close}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments forecast over the EPC + (b) any government financing not repayable by the Partner (e.g. capital grant), else the EPC is ON BALANCE SHEET for government (E15 L2578-2582; the summary box L6932-6943 states the sum without the basis)
    applies_here: false
    this_case: private homeowners in Hawaii; outside the EU
    source: E15 L2576-2582, L5363-5380 (EU vs government financing), L6930-6943; register constraints.entries.C1_eurostat
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? The private-sector counterpart of C1: when the Partner owns the installed assets during the term and the client pays for their use, the payments may be a lease liability on the client's balance sheet. Corpus: E02 L3293-3295"
    applies_here: false
    this_case: asset_owner = client (a loan, not a lease), and no Partner. The 34 on-bill PV leases would raise the question; they are not the representative contract
    source: gaps G23; E02 L3293-3295; register.yaml ifrs_16 flag
  PUC_repayment_priority:
    scope: external-sectoral
    rule: "PUC Order No. 34930 (26 Oct 2017) 'amended the order of loan repayments received to be applied first towards the replenishment of the Public Benefits Fee' (HGIA22 | p.5); over $8.2 million transferred to the PUC (p.5)"
    applies_here: true
    source: HGIA22 p.5
  bond_not_state_debt:
    scope: external-sectoral
    rule: "'The GEMS bonds are not an obligation of the State of Hawaii' (HGIA22 | p.4); the fee is 'non-by-passable' (p.4)"
    applies_here: true
    source: HGIA22 p.4
  GEMS_borrower_eligibility:
    scope: contractual
    rule: "From 15 Aug 2019 remaining GEMS loan capital is limited 'to only LMI homeowners and renters' and other underserved borrowers (HGIA22 | p.6); a request to open GEM$ to all eligible applicants went to the PUC in Aug 2022 (p.7), outcome not stated"
    applies_here: true
    source: HGIA22 p.6-7

numbers:   # instance data, not vocabulary; figures as printed
  bond_face_usd: "150.0 million (HGIA22 p.6, 'the $150.0 million Green Energy Market Securitization Bond')"
  bond_net_proceeds_usd: "146.0 million (HGIA22 p.6, 'net proceeds')"
  bond_issued: "November 2014 (HGIA22 p.6); loan applications from July 2015 (p.6); GEM$ on-bill launch April 2019 (p.6)"
  puc_orders: "Financing Order 4 Sep 2014; Program Order 30 Sep 2014; Order No. 34930 26 Oct 2017 (HGIA22 p.5)"
  loan_repayments_transferred_to_puc_usd: "over 8.2 million (p.5 text); some 12.2 million 'expenditures' (p.3 note); not reconciled in the report"
  gems_loans_funded_since_inception_usd: 82,662,586 (HGIA22 p.13, 'GEMS Loans Funded', all products, not on-bill only)
  gems_loan_capital_left_usd: "22.05 million (HGIA22 p.17, 'only $22.05 million in GEMS loan capital left to lend', as of 30 Sep 2022)"
  gems_revenues_cash_since_inception_usd: 25,357,217 (HGIA22 p.13)
  gems_admin_and_program_costs_since_inception_usd: 7,433,455 (HGIA22 p.13, excludes loan repayments transferred to the PUC)
  residential_obo_counts: "PV loans 226 (owner-occupied 225, renter 1); PV leases 34; solar water heating (EE) 17, all owner-occupied; total GEM$ OBOs 277 since inception; quarter 7/1/22-9/30/22: 25 + 1 + 0 = 26 (HGIA22 p.13)"
  commercial_obo_counts: "GEM$ OBOs for PV 17 (all owner-user); GEM$ OBOs for EE 0 (HGIA22 p.15)"
  residential_gems_applications: "received 1,188; declined 238; withdrawn/expired 433 since inception (HGIA22 p.14)"
  projects_financed_all_products: "solar PV 850; energy storage 150; lighting upgrades 965,037; HVAC 2,325; controls 1,667; energy/water nexus 212; mechanical 1; total 970,242 (HGIA22 p.13; lighting and HVAC are 'State Energy Efficiency Projects')"
  pv_installed_capacity_kw: 13,602 since inception (HGIA22 p.12)
  average_pv_system_cost_per_watt_usd: 3.74 all consumers; 3.73 underserved (HGIA22 p.16-17)
  derived:
    obo_sum_check: "226 + 34 + 17 = 277 (matches the printed 'Total Number of GEM$ OBOs' 277, p.13)"
    pv_share_of_residential_obo_pct: "(226 + 34) / 277 = 93.9%; solar water heating 17 / 277 = 6.1%; commercial EE OBOs 0 of 17 (p.15)"
    owner_occupied_split: "225 + 1 = 226 PV loans (matches p.13)"
    income_table_check: "since inception 1 + 3 + 6 + 37 + 64 + 115 + 313 = 539 and AMI table 14 + 51 + 134 + 249 + 91 = 539 (both match, p.14); quarter 1 + 1 + 1 + 5 + 2 + 5 + 11 = 26 (matches the 26 quarterly OBOs)"
    capital_check: "82,662,586 funded + 22.05 million left to lend = about 104.7 million, against 146.0 million net bond proceeds. About 41 million is not accounted for in the report (repayments to the PUC, direct and non-GEM$ uses); not reconciled"
    sources_not_derived: "No instalment size, rate, term, fee to the utility, fee rate or bondholder return is published, so none is computed"

reciprocity:   # gives/receives computed from commitments; one_way per convention F06
  homeowner: {gives: [c2], receives: [c1], one_way: false}
  hgia: {gives: [c1, c4, c9], receives: [c2, c3, c5], one_way: false}
  heco:
    gives: [c3, c7]
    receives: [c4, c8]
    one_way: true
    reason: both counter-promises (billing fees) exist only by duality; recorded as c4 and c8 unstated
  bondholders: {gives: [c5, c8], receives: [c6, c7], one_way: false}
  ratepayers:
    gives: [c6]
    receives: [c9]
    one_way: true
    reason: the fee is a statutory charge; the counter-promise to the fee payers exists only by duality, recorded as c9 unstated

lod0_gaps:   # what the deal needs that LOD 0 lacks
- kind: no_partner_loan_programme
  description: "A public lender lends straight to homeowners and no ESCO is paid for a service. receivable_holder, partner_form and assignment_recourse take values with nothing to describe, as in nyserda_green_bonds_2024a and light_motril"
  classification: "encoding question (boundary of ESCO scope; same open question as the NYSERDA case)"
- kind: statutory_levy
  description: "The bonds are serviced by a non-bypassable fee imposed by statute and a regulator's Financing Order, paid by every customer of the utility. A payment_promise between a class of customers and bondholders through a contract slot is a stretch: no counter-promise, no signature. LOD 0 has no 'statutory charge' kind"
  classification: "encoding question; a rule or contract kind 'levy' only if a second in-scope case needs it"
- kind: loan_repayment_priority
  description: "A regulator's order sends the first call on loan repayments to a Public Benefits Fee ahead of the programme's own costs. This is a waterfall rule between the lender and a public fund; LOD 0 holds it as a rule (PUC_repayment_priority), the order of payments is LOD 1"
  classification: "below LOD 0 (waterfall); recorded as a rule"
- kind: bond_issuer_vs_fund_holder
  description: "DBEDT issues the bonds and HGIA holds the fund. The report does not describe the transfer of proceeds between them, so the file puts both on the public side as hgia"
  classification: "evidence gap"
- kind: on_bill_loan_vs_lease
  description: "The report counts on-bill obligations as 'PV (Loans)' and 'PV (Leases)', 226 and 34, and says nothing of who the lessor or the lender behind the 'WECC' channel is. The lessor role and asset_owner = lessor would apply to the leases; not encoded"
  classification: "evidence gap"
- kind: collector_remittance_terms
  description: "Whether the utility remits the instalment to HGIA, when, at what fee and with what remedy for non-payment (the mechanism is 'tied to the utility meter') is not in the report"
  classification: "evidence gap"

conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F02
  title: jurisdiction header field; C1 trigger
  convention: 'A `jurisdiction` block (country, EU membership, whether the client is EU general government, all at financial close) sits in the miniature header, not among the settings; C1 applies_when {client_sector: public, jurisdiction: EU at close}.'
  origin: verdict change 2; findings F02; gaps G27
  applied_here: jurisdiction US-HI; C1 applies_here false
- id: F04
  title: borrower rule for provider-financed deals
  convention: borrower = none only when the source says own funds or equity; when the Partner finances the works and no loan or equity is named, keep the default partner with status default.
  origin: verdict change 4; findings F04; gaps G24
  applied_here: not triggered — the client takes a loan, borrower = client (stated)
- id: F06
  title: one_way form (CASE_SPEC)
  convention: 'A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated; one_way: false is reserved for parties whose counter-promise is stated or inferred from a stated fact.'
  origin: verdict rule; findings F06
  applied_here: heco and ratepayers one_way with unstated c4, c8, c9
- id: F08
  title: 'conditional default: assignment_recourse'
  convention: "receivable_holder in {assignee, split} and source silent -> assignment_recourse = waiver, status generic; performance_exposed only when the source shows the assigned leg varying with performance."
  origin: verdict change 3; findings F08; gaps G28
  applied_here: not triggered — nothing is assigned
- id: F09
  title: 'conditional default: collection_placement'
  convention: receivable_holder in {assignee, split} and source silent -> collection_placement = assignee_direct, status generic (E06 L558; E08 Fig 30 L3312-3317).
  origin: verdict change 3; findings F09; gaps G28
  applied_here: not triggered — collection_placement is stated (on_bill)
- id: F21
  title: determination_promise is required
  convention: "A determination_promise is required whenever a payment is computed on savings or completion; from = the party the source names, else the literal 'unstated'."
  origin: verdict rule; findings F21; gaps G08
  applied_here: not triggered — the instalment is a loan repayment, not computed on savings
- id: G23
  title: IFRS16_lease_test rule entry
  convention: "Rule entry IFRS16_lease_test, applies_when {client_sector: private, asset_owner: not client}: whether the client's contract is a service agreement or a lease (IFRS 16)."
  origin: verdict change 6; gaps G23
  applied_here: applies_here false (the homeowner owns the system under a loan)
- id: B2-R1
  title: grant or loan giver by identity (batch-2 adjudication)
  convention: "A government body that lends or grants takes government_financier; eu_funds for EU structural funds; grant_provider only for givers that are neither government nor EU funds."
  origin: batch-2 adjudication; CASE_SPEC_3
  applied_here: "HGIA, a State of Hawaii agency, lends to homeowners -> government_financier, not lender"
- id: B2-T1
  title: definition touch-ups from batch 2 (debt_seniority = rank of the most junior debt in the deal)
  convention: "debt_seniority records the rank of the most junior debt in the deal."
  origin: batch-2 verdict, definition touch-ups
  applied_here: one loan and one bond with no stated rank -> senior (default)
- id: REV-H6-3
  title: on-bill scope is read on the on-bill channel
  convention: "An on-bill programme is judged on the products that ride the bill, not on the lender's other lending; a channel that is about 94% solar by count is a solar witness."
  origin: batch-6 pair-H review; batch-5 ruling on solar-only pools; batch-3 NYSERDA precedent (49% efficiency, in scope)
  applied_here: in_scope false; collector_biller, on_bill and utility_supplier not counted
- id: ENC
  title: in-scope practice (ENCODING.md and CASE_SPEC_5)
  convention: "A deal where nobody is paid for an energy service is encoded as an out-of-scope witness, with the reason in in_scope_why."
  origin: CASE_SPEC_5; batch-3 practice
  applied_here: in_scope false, solar-dominated on-bill loans


rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU general government at close}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing, else ON the government balance sheet (E15 L2578-2582)"
    applies_here: false
    this_case: "private client"
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: true
    this_case: "trigger met on recorded values (private client, Innowatio holds title during the term); outcome undetermined: payments are a share of variable savings, the source gives no accounting treatment"
    source: RULINGS.md ruling 7; E02 L3293-3295
  white_certificates_obligation:
    scope: external-sectoral
    applies_when: {jurisdiction: Italy}
    rule: "Italian law obliges electricity and gas distributors to reach efficiency targets set by the regulator and lets them buy certificates: der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6281-6283 | 'Italian law requires electricity and natural gas distributors to pursue end‐use' ; each certificate equals one tonne of oil equivalent (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4487 | 'TEE stands for titoli di efficienza energetica, and is equal to a toe')"
    applies_here: true
    source: IEA13 lines 6279-6293, 4466-4470
  epc_buyback:
    scope: contractual
    rule: "der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4457-4458 | 'The EPC has a buyback provision regarding energy efficiency investments with a payback period longer than three years' : the customer may change partners by buying out the depreciated plant. Termination compensation is LOD 1"
    applies_here: true
    source: IEA13 lines 4457-4459


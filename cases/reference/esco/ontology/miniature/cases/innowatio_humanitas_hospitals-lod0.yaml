  eu_member: true
  client_eu_general_government_at_close: false
  as_of: "EPC date not stated; programme since February 2011, first-year results reported"
  status: stated
  why: "Italy is an EU member; the client is a 'privately‐owned' group (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4423-4424 | 'privately‐owned Humanitas Group'), so not general government and C1 does not apply"


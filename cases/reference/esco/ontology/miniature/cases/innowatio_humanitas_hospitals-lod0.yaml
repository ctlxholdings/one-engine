contract:
  epc:
    core: contract
    parties: [humanitas, innowatio]
    status: stated
    note: "der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4454-4455 | 'Innowatio and Humanitas entered into an energy performance contract (EPC) projecting' . Binding and settled by default; it projects 'expected energy and demand savings, price baselines, and WhC revenues' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4455 | 'expected energy and demand savings, price baselines, and WhC revenues'). Term: the benefits are counted over a 10 year project life (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4462 | 'over the 10 year life of the')"
  certificate_sale:
    core: contract
    parties: [innowatio, certificate_buyers]
    status: generic
    note: "the certificate market (spot or over the counter) is where the revenue arises: der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6291-6293 | 'high levels of certificate trading through the spot and over‐the‐counter markets' . No contract with a named buyer is described"

commitments:
  c1:
    family: performance_promise
    from: innowatio
    to: humanitas
    status: stated
    what: "audit, design, finance and coordinate the installation of the measures: comfort levels, chilled-water cooling with absorption chillers, LED and occupancy sensors, and a CHP revamp 'yet to be executed' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4453 | 'Revamping of existing CHP plants (yet to be executed);'). Shortfall make-good, if any, sits inside this promise (not described). der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4424-4425 | 'Innowatio identified, designed, financed and coordinated the installation of multiple energy efficiency improvements'"
    established_by: epc
  c2:
    family: payment_promise
    from: humanitas
    to: innowatio
    status: stated
    depends_on_savings: true   # half of the monthly savings
    savings_arrangement: shared   # half of the monthly savings (IEA13 L4456-4457)
    what: "'half of the monthly energy savings' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4456-4457 | 'Innowatio receives half of the monthly energy savings and half of the White Certificates revenues generated'). The certificate half is not a payment by Humanitas: Innowatio applies for and sells the certificates (c4, c5) and passes half of that revenue to Humanitas (c6)"
    established_by: epc
  c3:
    family: determination_promise
    from: [innowatio, humanitas]
    to: [innowatio, humanitas]
    status: inferred
    determines: savings   # monthly savings against price baselines
    what: "a monthly savings figure has to be established against 'price baselines' and an M&V approach: der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4477-4478 | 'Contract, including the baseline price and savings estimates and M&V approach.' ; first-year result reported as 'energy savings of 8%, energy bill reductions of 12.5%' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4460-4461 | 'savings of 8%, energy bill reductions of 12.5%, and produced 900 White Certificates.'). Who measures is not stated; both parties named"
    established_by: epc
  c4:
    family: performance_promise
    from: innowatio
    to: certificate_buyers
    status: generic
    what: "Innowatio applies for and originates the certificates: der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4463-4464 | 'Innowatio takes charge of applying for the White Certificates administered by the Italian' ; 900 certificates produced in year one (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4461 | 'savings of 8%, energy bill reductions of 12.5%, and produced 900 White Certificates.'). Delivery to a buyer is inferred from the market (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6288-6289 | 'rely on the revenues provided by originating White')"
    established_by: certificate_sale
  c5:
    family: payment_promise
    from: certificate_buyers
    to: innowatio
    status: generic
    what: "price of the certificates: 'In 2011 the market value of 1 toe, or 1 TEE, is about EUR 100.' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4464 | 'In 2011 the market value of 1 toe, or 1 TEE, is about EUR 100.'). Obliged distributors 'purchase' certificates (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6283-6286 | 'purchase energy efficiency certificates through White Certificates markets operated by the Italian'). The buyer of Innowatio's own certificates is not named, so the payer is the obligated class (generic); Innowatio is the payee as the applicant (c4)"
    established_by: certificate_sale
  c6:
    family: payment_promise
    from: innowatio
    to: humanitas
    status: inferred
    what: "half of the White Certificate revenues: Innowatio is the applicant (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4463 | 'Innowatio takes charge of applying for the White Certificates') and shares the revenues with the client (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4426-4427 | 'sharing the operations cost savings and White Certificate (WhC) revenues with Humanitas through an Energy Performance Contract'). The source states the half-split (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4456-4457) but not the direction of the flow; Innowatio-to-Humanitas is inferred from the applicant and from 'sharing ... with Humanitas'"
    established_by: epc


# Miniature — Innowatio and the Humanitas hospitals (Milan and Bergamo, Italy), shared-savings EPC with White Certificates, expressed at ESCO LOD 0.
# Batch 7, group J, reviewed final (X and Y reconciled, 3 Oct 2026; decisions in ../decisions.json). Evidence: one IEA report, cited by line of the local text (grep -n numbering), quotes <= 25 words (file not under input-licensed/).
# Every fact carries its status: stated / inferred / default / generic / unstated.

miniature: innowatio_humanitas_hospitals
lod: 0
case: batch7.T04
case_kind: deal   # one EUR 6 million project in two hospitals of one private group, one EPC
in_scope: true
in_scope_why: "Innowatio 'identified, designed, financed and coordinated the installation' of efficiency measures and is paid by sharing the savings: 'Innowatio receives half of the monthly energy savings'. The client pays out of measured savings, so payment_basis is savings and this is an ESCO deal. Evidence: der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4424-4425 | 'Innowatio identified, designed, financed and coordinated the installation of multiple energy efficiency improvements' ; der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4456-4457 | 'Innowatio receives half of the monthly energy savings and half of the White Certificates revenues generated'"

tests_unused:
- item: certificate_obligated_party
  kind: role
  used: true
  reason: "The second revenue stream is White Certificates. The buyers are the obliged Italian distributors, reached through the certificate market, and the source names none: der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4421-4422 | 'White Certificates scheme which obligates Italian energy distributors to meet' ; der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6283-6286 | 'purchase energy efficiency certificates through White Certificates markets operated by the Italian' . Encoded as a generic party. The source never says who bought Innowatio's 900 certificates, so the buyer is the scheme's obligated class, status generic"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No receivable is sold and no vehicle appears in the case text"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No hedge or lender is named; the source says only that Innowatio financed the measures"
- item: authority_guarantor
  kind: role
  used: false
  reason: "The client is a private hospital group; no guarantee of its payments is mentioned"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "Title sits with Innowatio during the term (buy-out of its depreciated plant); no third-party owner"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "Pay is a share of savings, not an availability or comfort level"

single_source_exercised:   # terms with one source or none before this batch, used by this deal
- term: certificate_obligated_party
  kind: role
  evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4421-4422 | 'White Certificates scheme which obligates Italian energy distributors to meet'"
  status: generic
- term: energy_auditor
  kind: role
  evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4445 | 'Innowatio conducted energy audits and cost‐benefit analysis'"
  status: stated

source:
  id: IEA13
  title: Energy Provider-Delivered Energy Efficiency, case study 23, Innowatio (Table 30)
  publisher: OECD/IEA, 2013 (A global stock-taking based on case studies)
  passage: "Table 30 and text, local text lines 4390-4486; summary at 1140-1148; Italian obligation scheme described again at 6279-6293 (Studio Bartucci case, generic)"
  documents:
    IEA13: "der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt"
  oracle: "none; not a published validation target"
  context:
  - "Italian energy authorities administer the White Certificates: der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4463-4464 | 'Innowatio takes charge of applying for the White Certificates administered by the Italian' . Rule source, no promise in the EPC"
  - "Energy market operator runs the certificate market: der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6285-6286 | 'markets operated by the Italian' . Market infrastructure, outside the deal"
  - "Technology providers: Innowatio 'specializes in matching up technology providers who can deliver the plant and process improvements identified for a given client' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4420-4421). A description of Innowatio's business in general; no provider, contract or flow is described for the Humanitas project, so context, not a party (batch-6 H ruling on unnamed installers)"
  - "Italian regulator (AEEG) sets the distributors' targets: der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6282-6283 | 'targets determined by the Italian energy regulator' . Rule source"
  notes:
  - "Humanitas is a group: der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4423-4424 | 'two different hospitals of the privately‐owned Humanitas Group' . The contracting legal entity is not named, so the client party is case-local"
  - "The document gives no EPC date. Programme 'Ongoing since February 2011' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4403 | 'Ongoing since February 2011'); the White Certificate price quoted is for 2011; the project life is 10 years (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4462 | 'over the 10 year life of the')"
  - "Innowatio does its own energy audit, so one party carries both partner_esco and energy_auditor"


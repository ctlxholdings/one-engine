lod0_gaps:
- kind: certificate_revenue_payer_and_split
  description: "The source says Innowatio 'receives half' of the White Certificate revenues and shares them 'with Humanitas'. It does not say who sells the certificates or which way the half-share flows. Written as c5 (buyers to Innowatio, generic) and c6 (Innowatio passes half to Humanitas, inferred from Innowatio being the applicant, L4463, and from L4426-4427)"
  classification: evidence gap
- kind: certificate_buyer_unnamed
  description: "certificate_obligated_party is used as a generic class. The certificates are traded on a market; no individual obliged party buys Innowatio's certificates in the text"
  classification: evidence gap
- kind: buyback_option
  description: "customer's right to buy out the plant where payback exceeds three years is a termination term"
  classification: below LOD 0 (termination compensation, LOD 1)
- kind: baseline_and_mv_terms
  description: "price baselines, savings baseline and M&V approach exist (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:4477-4478) but are not published"
  classification: below LOD 0

conventions_applied:
- id: F06
  title: one_way form
  convention: "a party whose counter-promise exists only by duality is one_way with a reason; the counter-promise is recorded as unstated"
  origin: verdict rule
  applied_here: "no one-way party: every party gives and receives (technology providers moved to context, see decisions.json)"
- id: F13
  title: role list, home role first
  convention: "a party may hold several roles"
  origin: verdict rule
  applied_here: "innowatio [partner_esco, energy_auditor]"
- id: F21
  title: determination_promise required
  convention: "a payment computed on savings needs a determining party; from = the parties the source names"
  origin: verdict rule
  applied_here: "c3 from Innowatio and Humanitas, inferred"
- id: R14
  title: scope by payment_basis
  convention: "every efficiency deal counts; ESCO or not is read from payment_basis (ruling 14)"
  origin: RULINGS.md ruling 14
  applied_here: "payment_basis savings: an ESCO deal"
- id: R17
  title: agreements binding and settled by default
  convention: "binding: non_binding or terms_settled: unsettled only when the source says so (ruling 17)"
  origin: RULINGS.md ruling 17
  applied_here: "no flag: the EPC was entered into"
- id: R18
  title: identity per legal entity
  convention: "entity, entity_new or entity_local on every party (ruling 18)"
  origin: RULINGS.md ruling 18
  applied_here: "innowatio entity_new; humanitas and certificate_buyers entity_local"


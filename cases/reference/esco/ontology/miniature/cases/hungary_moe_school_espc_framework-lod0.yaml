# Miniature: Hungary Ministry of Education school ESPC framework (Szemunk Fenye programme; consortium led by OTP Bank with Caminus;
# IFC partial credit guarantee), expressed at ESCO LOD 0. Batch 7, deal T11, reconciled by the group L reviewer from writers X and Y (decisions.json).
#
# Evidence: the local corpus text der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt (World Bank, Public Procurement of Energy Efficiency Services, 2010), Box 4.1 and the passages
# that describe the same model. Not under input-licensed/, so quotes are at most 25 words. Citations read <path>:<line> | 'exact quote'.
# Every fact carries its status: stated / inferred / default / generic / unstated.
# Programme: one framework agreement with many school projects under it; encoded as the framework plus one representative school project.

miniature: hungary_moe_school_espc_framework
lod: 0
case: batch7.T11
case_kind: programme   # one 20-year framework agreement, many project contracts with municipalities and school operators; one representative project contract is generic
in_scope: true
in_scope_why: "the consortium provides 'energy efficiency improvement services' to schools under an ESPC (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2255 | 'energy efficiency improvement services to municipalities and other school oper-'; der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2250 | 'tively select a single consortium of firms using an ESPC. The umbrella tender'). payment_basis savings, so an ESCO deal"


    value: operator_own
    status: default
    why: "not stated"
  aggregation:
    value: framework
    status: stated
    why: "'20-year framework agreement' with an 'umbrella IQC-type contract' that schools use without a new tender (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2253-2256)"
  debt_seniority:
    value: senior
    status: default
    why: "no rank stated"

  asset_owner:
    value: client
    status: default
    why: "title is not stated; the ENCODING.md fallback"
  bill_custody:
    value: client
    status: default
    why: "not stated"

rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, client_eu_general_government_at_close: true}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: true
    this_case: "the trigger is met (Hungary, EU member in 2006; municipalities and school operators as clients). The outcome is undetermined: the box publishes no guaranteed savings, no payments and no school contract. The IFC guarantee backs the consortium's lenders and is not government financing. Each school contract would be tested on its own"
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: false
    this_case: "client_sector public"
    source: RULINGS.md ruling 7; E02 L3293-3295
  direct_award_under_framework:
    scope: contractual
    rule: "a school may contract the consortium without a new tender; if it does not use the consortium it must follow the usual bidding (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2256-2258)"
    applies_here: true
    source: "der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2256-2258"
  unit_price_bids:
    scope: contractual
    rule: "the umbrella tender required bidders to propose unit prices for heating and lighting systems (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2251 | 'also required bidders to propose unit prices for heating and lighting systems.'); the text elsewhere names price per lamp or per control unit as the Hungarian practice (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:5285 | 'or per control unit installed, as was done in Hungary. Another approach')"
    applies_here: true
    source: "der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2251, :5283-5285"

numbers:
  framework_term: "20 years (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2253)"
  launch_year: "2006 (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2246)"
  annual_goal: "at least HUF 11.1 billion (US$50 million) per year between 2006 and 2010 (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2259-2260)"
  total_expected_size: "HUF 56 billion (US$250 million) (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2261)"
  ifc_partial_credit_guarantee: "up to US$250 million (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2263)"
  contracts_signed_august_2008: "HUF 5.0 billion (about US$22 million) (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2264-2265)"
  derived:
    goal_vs_total: "US$50 million x 5 years (2006 to 2010 inclusive) = US$250 million = the stated total (ties). HUF 11.1 bn x 5 = 55.5 bn vs 56 bn (ties within rounding)"
    implied_fx: "56 bn / 250 m = 224 HUF per US$; 11.1 bn / 50 m = 222; 5.0 bn / 22 m = 227. The three agree within 2%, so the box uses one rate near 224"
    guarantee_vs_total: "the guarantee ceiling US$250 million equals the whole expected programme value US$250 million; it is a ceiling, not an amount drawn"
    signed_vs_goal: "5.0 bn signed by August 2008 = 45% of one year's goal of 11.1 bn (5.0 / 11.1); goal is for projects completed per year, signed value is a different measure, so no gap is claimed"

reciprocity:
  moe: {gives: [c2], receives: [c1], one_way: false}
  school_operators: {gives: [c4], receives: [c3, c5], one_way: false}
  consortium: {gives: [c1, c3, c5, c7, c9], receives: [c2, c4, c6], one_way: false}
  ifc: {gives: [c8], receives: [c9], one_way: true, reason: "its guarantee fee exists only by duality (c9 unstated) (F06)"}
  local_lenders: {gives: [c6], receives: [c7, c8], one_way: false}

lod0_gaps:
- kind: consortium_members_without_roles
  description: "A consortium 'led by the OTP Bank' that 'included a Hungarian ESCO, Caminus' (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2252). OTP Bank's function (lender, equity, contractor) is not stated, so the consortium is one partner_esco party with entity_local, and OTP Bank and Caminus have no entity identity. A party can carry one entity only"
  classification: "evidence gap, plus an encoding question (a consortium of named entities)"
- kind: framework_without_purchase_commitment
  description: "The framework commits no volume: schools may go elsewhere (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2256-2258). The consortium carries the risk of low take-up, which has no risk category (R1-R7 do not include volume or demand). The Ministry's promise is written as a benefit"
  classification: "below LOD 0 (take-up is pipeline risk before each call-off is signed; R1-R7 start at signature or close)"
- kind: guarantee_beneficiary_and_fee
  description: "Beneficiary of the IFC guarantee, its fee and the guarantee share of each loan are not published"
  classification: "evidence gap"

conventions_applied:
- id: F02
  title: jurisdiction header, dated at close
  convention: "country, EU membership, client EU general government at close"
  origin: RULINGS.md ruling 4
  applied_here: "HU, EU member, general government inferred; C1 trigger met"
- id: F06
  title: counter-promise unstated
  convention: "a promise with no stated return gets an unstated counter-promise, not a one_way flag, when the return is usual"
  origin: verdict rule
  applied_here: "c5 (determination) and c9 (guarantee fee); ifc one_way: true, as caixa in belo_horizonte and the guarantee bank in austria_pharma_lease"
- id: R14
  title: scope by payment_basis
  convention: "every efficiency deal counts; ESCO or not is read from payment_basis"
  origin: RULINGS.md ruling 14
  applied_here: "in_scope true, payment_basis savings"
- id: R17
  title: contracts binding and settled by default
  convention: "binding: non_binding or terms_settled: unsettled only when the source says so"
  origin: RULINGS.md ruling 17
  applied_here: "no contract marked otherwise; the framework's missing quantity is by design (IQC), not unsettled terms"
- id: R18
  title: one identity per legal entity
  convention: "entity, entity_new or entity_local on every party"
  origin: RULINGS.md ruling 18
  applied_here: "moe (the ministry as named signer) and ifc entity_new; school_operators, consortium, local_lenders entity_local. IFC belongs to the World Bank group (parties.yaml group world_bank_group); the link is for the registry"


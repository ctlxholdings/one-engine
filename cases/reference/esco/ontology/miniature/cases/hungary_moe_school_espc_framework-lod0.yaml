- item: authority_guarantor
  kind: role
  used: false
  reason: "the one guarantee in the box is IFC's partial credit guarantee 'to help it access local lending' (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2263 | 'Finance Corporation for up to US$250 million to help it access local lending. As'): it backs the consortium's borrowing, not a client's payments"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "no hedge or hedge provider is mentioned"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "no receivables are sold and no notes are issued"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "title is not stated; the consortium is the Partner, not a third-party owner"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "the programme uses an ESPC (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2250), paid from savings"

single_source_exercised: []   # none of the 11 single-source roles or 4 single-source settings is used (aggregation=framework is not on the list)

source:
  id: WB2010
  documents:
    WB2010: "der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt (Box 4.1 L2243-2266; Table 2 L684-693; chapter 4 L2132-2237; credit guarantees L4960-4975)"
    JRC2010: "der-vpp/spec-run/esco-moneyflow/input/jrc-esco-market-in-europe-status-report-2010.txt (Szemunk Fenye consortium L1630-1636, footnote L1656-1659; taken from writer X)"
  title: Public Procurement of Energy Efficiency Services, Box 4.1 Indefinite Quantity Contracts (IQC) in Schools in Hungary
  publisher: World Bank (Hinsz, Taylor, Singh and others), 2010
  passage: "Box 4.1 (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2243-2266), source line 'IFC, 2006; Tibor Kludovacz and Russell Sturm, IFC, pers. comm.' (L2266); context L2198-2237, L4960-4975, L5278-5289"
  oracle: "none; not a published validation target"
  context:
  - "IFC as arranger of the HEECP and CEEF guarantee programmes: IFC 'in collaboration with the GEF, has successfully used the strategy of leveraging commercial financing' (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:4960 | 'Credit or risk guarantees. The International Finance Corporation (IFC),'). That passage is general; Box 4.1 names IFC alone for the consortium, so no GEF money is encoded in this deal"
  - "Szemunk Fenye programme: the Ministry's school renovation finance programme (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2247 | 'education facilities renovation finance program (called the Szemunk Fenye'). Programme body, same party as the Ministry"
  - "The named local lenders are not in the text. 'local lending' (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2263) only. A lender party is encoded as generic"
  notes:
  - "The box says the consortium 'received' the guarantee. A partial credit guarantee covers lenders, so the lender is the inferred beneficiary (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:4963 | 'ESPCs, using partial credit or risk guarantees. The rationale for this'; der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:4968 | 'one of the key reasons local commercial banks were unwilling to finance')"
  - "The box says 'pooled public tender' (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2249). The pooling is of the Ministry's tender, not of loans or contracts financed together; aggregation is framework"
  - "Box total: 'contacts' in the source (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2264 | 'of August 2008, the total value of contacts signed was HUF 5.0 billion (about'), read as contracts"

jurisdiction:
  country: Hungary
  iso: HU
  eu_member: true
  client_eu_general_government_at_close: true
  as_of: "framework signed after the 2006 launch (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2246 | 'In 2006, the Hungarian Ministry of Education (MOE) launched a large-scale'); exact date not given"
  status: inferred
  why: "Hungary joined the EU in 2004, before the 2006 launch (not in the text). The Ministry and municipalities are general government; 'other school operators' are not specified, so the general-government flag is inferred for the representative client"

core_v7:
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: each contract establishes (fibo-fnd-rel-rel:confers) its commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:
  moe:
    entity: hungary_state
    role: facilitator
    groups: [delivery, public]
    status: stated
    name: Hungarian Ministry of Education (MOE)
    text: "der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2253 | 'a Hungarian ESCO, Caminus. MOE signed a 20-year framework agreement with'. Ran the 'pooled public tender' (L2249) and signs the framework; pays nothing for school projects in the text. facilitator ('prepares tenders, bundles projects'), as DOE/FEMP in doe_idiq_task_order; authority is not added because its definition includes paying the operational payments, which the schools do"
  school_operators:
    role: authority
    groups: [demand, public]
    status: generic
    name: Municipalities and other school operators (representative client of the framework)
    text: "der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2255 | 'energy efficiency improvement services to municipalities and other school oper-'. Not obliged to use the consortium (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2256 | 'ators without an additional tender process for each individual project. Schools')"
  consortium:
    role: partner_esco
    groups: [partner]
    status: stated
    name: Winning consortium (led by OTP Bank, including the ESCO Caminus)
    text: "der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2252 | 'The winner of the tender was a consortium led by the OTP Bank and included'. Delivers the ESPC services; borrows locally"
  ifc:
    entity: ifc
    role: guarantee_facility
    groups: [public, risk]
    status: stated
    name: International Finance Corporation (IFC)
    text: "der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2262 | 'winning consortium received a partial credit guarantee from the International'. Guarantee ceiling US$250 million"
  local_lenders:
    role: lender
    groups: [capital]
    status: inferred
    name: Local commercial lenders (unnamed)
    text: "der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2263 | 'Finance Corporation for up to US$250 million to help it access local lending. As'"

contract:
  framework_agreement:
    core: contract
    parties: [moe, consortium]
    status: stated
    note: "der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2253 | 'a Hungarian ESCO, Caminus. MOE signed a 20-year framework agreement with'; 'umbrella IQC-type contract' (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2254). No quantity is committed: 'Schools are not obligated to use the selected consortium' (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2256-2257)"
  school_espc:
    core: contract
    parties: [school_operators, consortium]
    status: generic
    note: "a project contract signed by a school operator directly with the consortium under the framework, 'without an additional tender process for each individual project' (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2256). The text gives no individual contract; terms are the usual ESPC"
  credit_guarantee:
    core: contract
    parties: [ifc, local_lenders, consortium]
    status: inferred
    note: "partial credit guarantee 'for up to US$250 million' (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2263). The consortium obtained it; the lender is the inferred beneficiary (see notes)"
  local_loans:
    core: contract
    parties: [local_lenders, consortium]
    status: inferred
    note: "'to help it access local lending' (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2263); lender, amount and terms not given"

commitments:
  c1:
    family: performance_promise
    from: consortium
    to: moe
    status: stated
    what: "under the 20-year framework, 'would provide energy efficiency improvement services to municipalities and other school operators' (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2255 | 'energy efficiency improvement services to municipalities and other school oper-'); lighting and heating modernisation (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2248 | 'program) to modernize lighting and heating systems in schools. The program'). Unit prices for heating and lighting systems were bid (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2251 | 'also required bidders to propose unit prices for heating and lighting systems.')"
    established_by: framework_agreement
  c2:
    family: benefit_promise
    from: moe
    to: consortium
    status: inferred
    what: "the Ministry gives the consortium the right to be contracted directly by schools without a further tender (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2256 | 'ators without an additional tender process for each individual project. Schools'). It commits no volume: 'Schools are not obligated to use the selected consortium'. Written as a benefit, since the Ministry is paid nothing and promises nothing to buy"
    established_by: framework_agreement
  c3:
    family: performance_promise
    from: consortium
    to: school_operators
    status: generic
    what: "audit, project design and implementation of the efficiency measures at a school (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2236 | 'client, implements the project and is paid for both the audit and project')"
    established_by: school_espc
  c4:
    family: payment_promise
    from: school_operators
    to: consortium
    status: generic
    depends_on_savings: true   # paid from the savings (WB10 L2237)
    what: "paid 'from the savings' for audit and project (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2237 | 'from the savings. If, however, the public client decides not to proceed,'). Payment profile and term of a school contract not given. The source describes this for IQCs in general, and the Hungarian programme is an ESPC (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2250)"
    established_by: school_espc
  c5:
    family: determination_promise
    from: consortium
    to: school_operators
    status: unstated
    determines: savings   # savings the payment is made from
    what: "payment from savings needs a determining party. The box does not say who measures or verifies savings or by what method; counter-promise required by the convention, source silent"
    established_by: school_espc
  c6:
    family: funding_promise
    from: local_lenders
    to: consortium
    status: inferred
    funding_instrument: loan   # local lending to the consortium (WB10 L2263)
    what: "local lending to the consortium (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2263 | 'Finance Corporation for up to US$250 million to help it access local lending. As'); amount and terms not given"
    established_by: local_loans
  c7:
    family: payment_promise
    from: consortium
    to: local_lenders
    status: inferred
    what: "repayment of the local lending; follows from c6"
    established_by: local_loans
  c8:
    family: risk_promise
    covers: [R5b]
    from: ifc
    to: local_lenders
    status: inferred
    cover_kind: guarantee   # IFC partial credit guarantee (WB10 L2262)
    what: "partial credit guarantee for up to US$250 million (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2262 | 'winning consortium received a partial credit guarantee from the International'). It covers part of a lender's loss on lending to the consortium (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:4963 | 'ESPCs, using partial credit or risk guarantees. The rationale for this'). Beneficiary inferred from the product, not named in Box 4.1"
    established_by: credit_guarantee
  c9:
    family: payment_promise
    from: consortium
    to: ifc
    status: unstated
    what: "guarantee fee; counter-promise required by duality, source silent"
    established_by: credit_guarantee

settings:
  payment_basis:
    value: savings
    status: inferred
    why: "der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2250 | 'tively select a single consortium of firms using an ESPC. The umbrella tender'; paid 'from the savings' (der-vpp/spec-run/esco-moneyflow/input/wb-public-procurement-ee-services-2010.txt:2237), which the report says of IQCs in general, not of Hungary; the box itself gives only unit prices for the systems (L2251), so inferred. Alternative: asset, if schools pay the unit prices outright"

# Miniature — Sittard city hall EPC with ING finance lease (Netherlands) expressed at ESCO LOD 0
#
# Batch 2, reconciled by the adjudicator from writers Y (base) and X; changes listed in source.notes. Original writer Y. Shape copied from bytom_schools-lod0.yaml (normalised
# 1 Oct 2026). Every fact carries its status: stated, inferred (follows from a stated fact — said which), default
# (source silent), generic (the source's general description of leasing, not this deal), unstated (counter-promise
# required by duality). Nothing invented. Figures 22-23 are text-extracted diagrams; which edge a contract label
# sits on is read from the layout and marked inferred.

miniature: sittard_cityhall
lod: 0
case: corpus_batch2.sittard_cityhall
case_kind: deal
tests_unused:   # the 22 items (16 roles + 6 values) unused in the first 13 files; CASE_SPEC_2 names this case's tests
- item: lessor
  kind: role
  used: true
  reason: "'Intermittent financing 100 % through ESCO, Financial lease by ING bank' (E08 L2888); Fig 23 'FIN ... 2. Financial lease' (L2932-2934). Lessor = 'Owns the equipment until the lease is paid'"
- item: asset_owner=lessor
  kind: setting_value
  used: true
  reason: "inferred, not stated for Sittard: in leasing 'Lessor is legal owner' and 'Lessee is economic owner => has to capitalize investment' (finance-lease table L2408-2409; L1963-1970). The setting asks who owns the installed assets during the term; legal title sits with ING. The economic owner is the lessee (the city, see borrower), which the value does not capture"
- item: grant_provider
  kind: role
  used: false
  reason: "'Government subsidy € 13,000' (L2889): the giver is government, so government_financier, whose definition lists grants and which is 'what the Eurostat thresholds count' — and C1 applies here (Dutch municipality). grant_provider is kept for givers that are neither government nor EU funds (adjudication rule B2-R1)"

source:   # where the facts come from; context = actors outside the deal boundary (F23); notes = observations that are not gaps
  id: E08
  title: Financing of ESCo Projects — IEA DSM Task XVI manual (Bleyl & Schinnerl, Grazer Energieagentur)
  publisher: IEA DSM Task XVI / Grazer Energieagentur, c. 2008-10
  passage: "§5.5.4 'City Hall in Sittard uses EPC with Finance Leasing for HVAC, Lighting and Energy Management, Netherlands', Figures 22-23 (corpus input/iea-dsm-financing-options-manual.txt L2829-2959); leasing features §5.2 and §5.4 (L1926-2010, L2287-2446, fn27 L2445-2446)"
  oracle: none — not a published validation target; acceptance is structural
  context:
  - "Ger Kempen of Essent Local Energy Solutions reported the case (L2833-2835)"
  - "'Covering agreement between ING bank and Essent: Target groups A+B defined for further EC-projects; Certain interest-conditions for target groups defined' (L2956-2958); Fig 22 'General agreement about finance-leasing' (L2913-2914): a framework between financier and ESCO above this deal, recorded as the framework contract below"
  notes:
  - "CASE_SPEC_2 asks for the subcontractor flow if the source names one: Fig 22 names 'Subcontractors: Implementation and maintenance by installation firms according design Essent / Technical risks of good function' (L2922-2926) under 'GC – Essent' with 'Procurement of subcontracts' (L2917-2919)"
  - "Who the lessee is: Fig 23 places '1. Framework contract / 2. Financial lease' between FIN (top) and CLIENT (right), and '1. EPC Contract / 2. Financing and pledge agreement' between CLIENT and ESCO (L2932-2944); the cash-flow side shows 'ESCO forwards leasing rates 15 years' and 'Client pays contracting rates 15 years' (L2937-2943). Read as: the city is lessee, pays all-in contracting rates to Essent, which forwards the leasing rates to ING. Alternative: Essent is lessee (Fig 22 'General agreement about finance-leasing' sits between ING and Essent, L2911-2914)"
  - "'pledge agreement' (L2942): what is pledged is not said"
  - "Adjudication (batch 2): lessee = the city (Y) kept over Essent (X). Fig 23 is a triangle: the label '1. Framework contract 2. Financial lease' sits on the FIN-CLIENT diagonal and 'Total investment (260,000 €)' on the FIN-CLIENT side of the cash-flow triangle; ING carries the 'Risk of non payment' (L2910), which is the client's risk; and 'ESCO forwards leasing rates' (L2937) reads as passing on, not paying. What would change it: a text sentence naming Essent as lessee. Subsidy giver changed from grant_provider (Y) to government_financier (X, rule B2-R1). Agency promise c5 downgraded stated -> inferred (its family depends on the lessee reading). Y's c6 (unstated ING fee to Essent for forwarding) dropped: neither party is one-way, so F06 does not require it"
  - "Interim financing: 'Intermittent financing 100 % through ESCO' (L2888) during construction stays inside c1 (F05); time-phased financing is below LOD 0 (G04)"

jurisdiction:   # header field, not a setting (F02): drives the C1 trigger
  country: Netherlands
  iso: NL
  eu_member: true
  client_eu_general_government: true
  status: stated
  why: "'The municipality Sittard Geleen in the south of the Netherlands' (L2836); the Netherlands is surveyed as a member state in E02 (L169). A municipality is general government"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: each contract establishes (fibo-fnd-rel-rel:confers) its commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 41 (a list = several roles, home role first; F13); groups computed from the role(s)
  city_of_sittard:
    entity: gemeente_sittard_geleen
    role: authority
    groups: [demand, public]
    status: stated
    name: Municipality of Sittard-Geleen (city hall)
    text: "'The municipality Sittard Geleen ... One of the first projects was realized in the city hall' (L2836-2838); 'building owner (city of Sittard)' (L2886)"
  essent:
    entity: essent_energy_services
    role: partner_esco
    groups: [partner]
    status: stated
    name: Essent Energy Services
    text: "'design and project management by Essent Energy Services (works as ESCO)' (L2886-2887); 'ESCO as a general contractor' (L2890); Fig 22 'GC – Essent': design, project management, procurement of subcontracts, monitoring, 'Economic risk of guaranties' (L2914-2921)"
  ing_bank:
    entity: ing_bank
    role: lessor
    groups: [capital]
    status: stated
    name: ING bank
    text: "'Financial lease by ING bank' (L2888); Fig 22 'FI – ING bank': 'Financing', 'Risk of non payment' (L2909-2911); Fig 23 'FIN ... Financial lease' (L2932-2934). lender is the alternative (a finance lease 'can be seen as a mixture between a conventional credit and an operate lease', L2288-2289)"
  government:
    role: government_financier
    groups: [public, capital, risk]
    status: stated
    text: "'Government subsidy € 13,000' (L2889); the granting body is not named. government_financier, not grant_provider: the definition lists grants and is what the Eurostat thresholds count (E15 L5361-5380: only EU financing is excluded)"
  subcontractors:
    role: epc_contractor
    groups: [delivery]
    status: stated
    text: "Fig 22 'Subcontractors: Implementation and maintenance by installation firms according design Essent / Technical risks of good function' (L2922-2926). Separate companies from Essent, not named"

contract:   # the agreements that establish the commitments
  epc_contract:
    core: contract
    parties: [city_of_sittard, essent]
    term_years: 15
    status: stated
    note: "'Energy Performance Contract' (L2885); 'Contract period 15 years' (L2891); Fig 23 '1. EPC Contract 2. Financing and pledge agreement' (L2940-2942)"
  finance_lease:
    core: contract
    parties: [ing_bank, city_of_sittard]
    term_years: 15
    status: inferred
    note: "Fig 23 '1. Framework contract 2. Financial lease' on the FIN-CLIENT edge (L2932-2934, layout reading); leasing rates over 15 years (L2937-2938)"
  framework_ing_essent:
    core: contract
    parties: [ing_bank, essent]
    status: stated
    note: "Fig 22 'General agreement about finance-leasing' (L2913-2914); 'Covering agreement between ING bank and Essent' (L2956-2958)"
  subcontracts:
    core: contract
    parties: [essent, subcontractors]
    status: stated
    note: "Fig 22 'Procurement of subcontracts' (L2917-2919)"
  subsidy:
    core: contract
    parties: [government, city_of_sittard]
    status: inferred
    note: "'Government subsidy € 13,000' (L2889); recipient not stated"

commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: performance_promise
    from: essent
    to: city_of_sittard
    status: stated
    what: "design and project management, energy management and controlling system, 10 high-efficiency boilers, refrigeration with 70% free cooling, high-efficiency lighting (L2874-2879, L2886-2887); guaranteed savings heat 293 MWh/a and electricity 150 MWh/a (L2893-2894); 'ESCo takes total care' (L2950). Essent's 'Intermittent financing 100 % through ESCO' during construction (L2888) is inside this promise (F05)"
    established_by: epc_contract
  c2:
    family: payment_promise
    from: city_of_sittard
    to: essent
    status: stated
    what: "'Client pays contracting rates 15 years' (Fig 23 L2940-2943); 'Sharing of extra savings: 50 % / 50 % to ESCO/Client' (L2895)"
    established_by: epc_contract
  c3:
    family: funding_promise
    from: ing_bank
    to: city_of_sittard
    status: inferred
    funding_instrument: lease   # finance lease of the installation (Fig 23)
    what: "finance lease of the installation, 'Total investment (260,000 €)' (Fig 23 L2934-2935); ING carries the 'Risk of non payment' (L2910). Lessee read from the Fig 23 layout (see source.notes); alternative to: essent"
    established_by: finance_lease
  c4:
    family: payment_promise
    from: city_of_sittard
    to: ing_bank
    status: inferred
    what: "leasing rates over 15 years (Fig 23 L2937-2938), paid inside the contracting rates and forwarded by Essent (c5)"
    established_by: finance_lease
  c5:
    family: agency_promise
    from: essent
    to: ing_bank
    status: inferred
    what: "'ESCO forwards leasing rates 15 years' (Fig 23 L2937-2938): Essent collects the client's contracting rates and passes the leasing part to ING"
    established_by: framework_ing_essent
  c6:
    family: performance_promise
    from: subcontractors
    to: essent
    status: stated
    what: "'Implementation and maintenance by installation firms according design Essent'; they carry the 'Technical risks of good function' (L2923-2926)"
    established_by: subcontracts
  c7:
    family: payment_promise
    from: essent
    to: subcontractors
    status: inferred
    what: payment for the subcontracted works; Essent procures the subcontracts as general contractor (L2890, L2917-2919)
    established_by: subcontracts
  c8:
    family: determination_promise
    from: essent
    to: city_of_sittard
    status: stated
    determines: savings   # monitoring of savings above the guarantee (L2895, L2920)
    what: "Fig 22 'Monitoring' by GC – Essent (L2920); needed because 'extra savings' above the guarantee are shared 50/50 (L2895) (F21)"
    established_by: epc_contract
  c9:
    family: benefit_promise
    from: government
    to: city_of_sittard
    status: inferred
    what: "'Government subsidy € 13,000' (L2889); recipient inferred — the city owns the building (L2886) and is the lessee; alternative essent"
    established_by: subsidy

settings:   # the 13 LOD 0 facets, in vocabulary order (payment_basis added 1 Oct, owner ruling)
  payment_basis: {value: savings, status: stated, why: "c2: contracting rates over 15 years (E08 L2940-2943) against guaranteed savings 293/150 MWh/a, 'Sharing of extra savings: 50 % / 50 % to ESCO/Client' (L2893-2895)."}
  client_sector: {value: public, status: stated, why: "the municipality / 'city of Sittard' (L2836, L2886)"}
  partner_form: {value: corporate, status: default, why: "Essent Energy Services, part of Essent (L2835, L2887); no project SPV mentioned"}
  borrower:
    value: client
    status: inferred
    why: "the city is read as lessee of the finance lease (Fig 23 layout, see source.notes); a finance lease is 'closer to the credit' (L2288-2290) and the lessee 'has to capitalize investment' (L2409). Alternative partner if Essent is the lessee; Essent's own 'Intermittent financing' (L2888) covers the construction period only"
  receivable_holder:
    value: partner
    status: inferred
    why: "'Client pays contracting rates' to the ESCO and the ESCO 'forwards leasing rates' (Fig 23 L2937-2943): the claim stays with Essent, which acts as collector for ING; no cession is mentioned (contrast the pharma case's 'cession of claims', L2558)"
  collection_placement:
    value: operator_own
    status: inferred
    why: "the client pays Essent, which forwards (L2937-2943). Alternative pledged_escrow: a 'Financing and pledge agreement' exists (L2941-2942) but what is pledged and where payments land is not said"
  aggregation:
    value: none
    status: inferred
    why: "one building, one EPC (L2838). The ING-Essent covering agreement for 'further EC-projects' (L2956-2958) is a financing framework, not a client-side framework or pool"
  debt_seniority: {value: senior, status: default, why: not stated; one financier}
  assignment_recourse: {value: not_applicable, status: inferred, why: follows from receivable_holder = partner}
  savings_basis:
    value: measured
    status: inferred
    why: "guaranteed savings in MWh/a (L2893-2894) with 50/50 sharing of 'extra savings' (L2895) and 'Monitoring' (L2920)"
  grant_recipient:
    value: client
    status: inferred
    why: "'Government subsidy € 13,000' (L2889); recipient not stated — the city as building owner and lessee is the likelier; alternative partner"
  asset_owner:
    value: lessor
    status: inferred
    why: "'Lessor is legal owner' / 'Lessee is economic owner' (L2408-2409; L1963-1970) applied to 'Financial lease by ING bank' (L2888). The economic owner (the city) carries the asset on its books (fn27 L2445-2446)"
  bill_custody: {value: client, status: default, why: not stated}

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments forecast over the EPC + (b) any government financing not repayable by the Partner (e.g. capital grant), else the EPC is ON BALANCE SHEET for government (E15 L2578-2582; the summary box L6932-6943 states the sum without the basis)
    applies_here: true
    this_case: "applies; not computable — the guarantee is in MWh (L2893-2894), not EUR, and contracting rates are not given. Term (b) includes the EUR 13,000 government subsidy (E15 L5361-5380; giver = government_financier): 13,000 / 260,000 = 5.0% of capital cost, 'of MODERATE importance' (10% or less, E15 L5356-5359). Independently, the source says finance leasing puts the asset on the lessee's books: 'Lessee is economic proprietary and has to account for the investment in his balance sheet. Thus finance leasing is not Maastricht neutral' (E08 fn27 L2445-2446). With the city as lessee that points ON BALANCE whatever C1 gives"
    source: E15 L2576-2582, L5363-5380 (EU vs government financing), L6930-6943; register constraints.entries.C1_eurostat; E08 fn27 L2445-2446
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: partner}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? The private-sector counterpart of C1: when the Partner owns the installed assets during the term and the client pays for their use, the payments may be a lease liability on the client's balance sheet. Corpus: E02 L3293-3295 ('renewed interest for EnPC and EEaaS after leasing has been categorized as on-balance in the IFRS rules')"
    applies_here: false
    this_case: client_sector public; the Eurostat test and the fn27 statement cover the public side
    source: gaps G23; E02 L3293-3295; register.yaml L301 ifrs_16 flag

numbers:   # instance data, not vocabulary
  contract_costs_eur: 260000 (L2889; Fig 23 'Total investment (260,000 €)' L2935)
  government_subsidy_eur: 13000 (L2889)

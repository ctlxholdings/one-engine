  floor_area_m2: 5600 (L2847)
  volume_m3: 16750 (L2848)
  energy_costs_eur_per_year: 200000 (L2849, '0.2 million €/a')
  guaranteed_heat_mwh_per_year: 293 (L2894)
  guaranteed_electricity_mwh_per_year: 150 (L2894)
  extra_savings_split_esco_client_pct: 50 / 50 (L2895)
  total_operating_cost_reduction_pct: 4 (L2954)
  emission_reduction_pct: 17 (L2955)
  boilers: 10 high-efficiency (L2875-2876)
  free_cooling_pct: 70 (L2877)

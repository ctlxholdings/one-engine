reciprocity:   # gives/receives computed from commitments; one_way per convention F06
  city_of_sittard: {gives: [c2, c4], receives: [c1, c3, c8, c9], one_way: false}
  essent: {gives: [c1, c5, c7, c8], receives: [c2, c6], one_way: false}
  ing_bank: {gives: [c3], receives: [c4, c5], one_way: false}
  government:
    gives: [c9]
    receives: []
    one_way: true
    reason: benefit promise, unilateral by nature (subsidy, L2889)
  subcontractors: {gives: [c6], receives: [c7], one_way: false}

lod0_gaps:   # what the deal needs that LOD 0 lacks
- kind: legal_vs_economic_owner
  description: "asset_owner records one owner during the term. In a finance lease the source separates legal ownership (lessor) from economic ownership (lessee, who capitalises): L1963-1970, L2408-2409, fn27 L2445-2446. The balance-sheet consequence the setting exists for follows the economic owner, so asset_owner = lessor alone hides that the city carries the asset. Candidate classification: definition touch-up (say which ownership asset_owner records), no new value"
  classification: "encoding question (definition touch-up of asset_owner: legal owner during the term; the economic-owner split is LOD 1)"
- kind: lessee_not_a_setting
  description: "LOD 0 has no way to say who is the lessee: borrower takes 'client' by analogy (a finance lease as credit). Workable for Sittard; with an operate lease to the Partner (austria_pharma_lease) borrower = partner reads oddly because the source says the lease keeps the investment off the ESCO's balance sheet. Candidate classification: encoding question — extend borrower's definition to 'takes the project loan or lease'"
  classification: "encoding question (definition touch-up of borrower; no new value)"
- kind: grant_giver_overlap
  description: "A national government subsidy fits both grant_provider ('Gives non-repayable support') and government_financier ('grants, loans, equity, guarantees'). Batch 1's F03 text says 'grant_provider is for national or other non-EU grants', which contradicts government_financier's definition and would take the subsidy out of the Eurostat count C1 needs here. Resolved by rule B2-R1 (government giver -> government_financier); the grant_provider definition must say so"
  classification: "real LOD 0 gap (definition change of grant_provider; correct the F03 convention text)"
- kind: interim_financing
  description: "'Intermittent financing 100 % through ESCO' (L2888) during construction, then the ING lease: two financiers in sequence"
  classification: "below LOD 0 (G04 time-phased financing)"

conventions_applied:   # what this file assumes beyond elements_pilot.yaml (owner rules on the vocabulary)
- id: F01
  title: C1 rule text states the NPV basis
  convention: 'C1_eurostat: NPV at financial close of guaranteed savings >= NPV of operational payments + non-repayable government financing, else on the government balance sheet (E15 L2578-2582; summary box L6932-6943 omits the basis). Files that computed nominal sums say so; with level annual flows the direction does not change.'
  origin: verdict change 1; findings F01
  applied_here: C1 rule text carries the NPV basis; not computable (guarantee in MWh)
- id: F02
  title: jurisdiction header field; C1 trigger
  convention: 'A `jurisdiction` block (country, EU membership, whether the client is EU general government) sits in the miniature header, not among the settings; C1 applies_when {client_sector: public, jurisdiction: EU}.'
  origin: verdict change 2; findings F02; gaps G27
  applied_here: jurisdiction NL / EU general government; C1 applies_here true
- id: F04
  title: borrower rule for provider-financed deals
  convention: borrower = none only when the source says own funds or equity; when the Partner finances the works and no loan or equity is named, keep the default partner with status default.
  origin: verdict change 4; findings F04; gaps G24
  applied_here: a lease to the client is read from Fig 23, so borrower = client (inferred), not the provider-financed default
- id: F08
  title: 'conditional default: assignment_recourse'
  convention: "receivable_holder in {assignee, split} and source silent -> assignment_recourse = waiver, status generic (E06 L503-505 'without recourse against the seller'; E08 L3222-3226 'continued payment obligations ... regardless of any disputes'); performance_exposed only when the source shows the assigned leg varying with performance."
  origin: verdict change 3; findings F08; gaps G28
  applied_here: not triggered — Essent collects and forwards; nothing is assigned
- id: F09
  title: 'conditional default: collection_placement'
  convention: receivable_holder in {assignee, split} and source silent -> collection_placement = assignee_direct, status generic (E06 L558; E08 Fig 30 L3312-3317).
  origin: verdict change 3; findings F09; gaps G28
  applied_here: not triggered
- id: G23
  title: IFRS16_lease_test rule entry
  convention: "Rule entry IFRS16_lease_test, applies_when {client_sector: private, asset_owner: partner}: whether the client's contract is a service agreement or a lease (IFRS 16) — the private counterpart of C1. A rule beside the tree, not a setting (corpus: E02 L3293-3295)."
  origin: verdict change 6; gaps G23
  applied_here: applies_here false (public client)
- id: F03
  title: ESIF/Cohesion grant giver = eu_funds
  convention: A grant paid from an ESIF/Cohesion operational programme is given by eu_funds whatever national body administers it (elements_pilot eu_funds = 'EU structural funds and their managing authority'); grant_provider is for national or other non-EU grants. The EU/national co-financing split is an amount (LOD 1), not a role.
  origin: verdict rule; findings F03; gaps G01
  applied_here: "'Government subsidy' with no EU programme named -> not eu_funds; giver is government -> government_financier (rule B2-R1, which corrects this convention's last clause: grant_provider is for non-government, non-EU givers)"
- id: F05
  title: "provider's own capital is inside performance_promise"
  convention: "Under one service contract the provider's own capital is part of its performance_promise; funding_promise requires a distinct claim between distinct parties (loan, equity, receivable purchase, lease)."
  origin: verdict rule; findings F05; gaps G07
  applied_here: Essent's construction-period financing (L2888) is inside c1; ING's lease is the distinct funding c3
- id: F06
  title: one_way form (CASE_SPEC)
  convention: 'A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated; one_way: false is reserved for parties whose counter-promise is stated or inferred from a stated fact.'
  origin: verdict rule; findings F06
  applied_here: 'government one_way: true (benefit). Essent and ING each have stated or inferred reciprocals, so neither is one_way and no unstated forwarding fee is recorded'
- id: F21
  title: determination_promise is required
  convention: "A determination_promise is required whenever a payment is computed on savings or completion; from = the party the source names, else the literal 'unstated'."
  origin: verdict rule; findings F21; gaps G08
  applied_here: c8 from Essent ('Monitoring', L2920)
- id: G18
  title: shortfall make-good stays in performance_promise
  convention: "The performing party's own savings-shortfall make-good is part of its performance_promise; risk_promise is a third party's promise to pay if a named risk occurs."
  origin: verdict rule; gaps G18
  applied_here: "Essent's 'Economic risk of guaranties' (L2921-2922) and the subcontractors' 'Technical risks of good function' (L2926) stay inside c1 and c6"
- id: B2-R1
  title: grant giver by identity (batch-2 adjudication)
  convention: "A grant or subsidy from general government or a public entity acting for it is given by government_financier (its definition lists grants; it is what the Eurostat thresholds count, E15 L5361-5391); from EU structural funds by eu_funds (F03); grant_provider only for givers that are neither (GEF and other multilateral grant windows, foundations, utility rebate programmes). Corrects F03's last clause ('grant_provider is for national or other non-EU grants')."
  origin: batch-2 adjudication; audit proposal unused/final.json grant_provider (rename_redefine)
  applied_here: "the EUR 13,000 'Government subsidy' (L2889) -> government_financier"


contract:
  works_contract_social:
    core: contract
    parties: [nch, melius]
    status: inferred
    note: "'procured based on' a fixed price, judged on whole life cost and design quality (STN L2094-2098). The procuring body and the price are not printed; NCH is inferred as buyer for the social homes"
  works_contract_private:
    core: contract
    parties: [private_owners, melius]
    status: inferred
    note: "owners and private landlords receive the works and pay a contribution after the grant (STN L2098-2104); the contract and its payee are not described"
  energy_plan:
    core: contract
    parties: [occupants, nch]
    status: stated
    note: "the household pays an 'Energy plan' and 'the landlord (NCH) received' the income (STN3 L789-790). Terms not published beyond 'as little as £600' a year in the first UK pilot (STN L2154)"
  loan_agreement:
    core: contract
    parties: [credit_union, private_owners]
    status: stated
    note: "a zero-interest loan 'to help householders pay for their contribution' (STN L2108-2112), spread 'over a number of years' (STN L2116). Amount and term not published"

commitments:
  c1:
    family: performance_promise
    from: melius
    to: [nch, private_owners]
    status: stated
    what: "whole-house retrofit from concept design to 'performance in use' (STN L2066-2069): off-site roof and wall cassettes and an external energy module (STN L2145-2150), with a performance 'long term guaranteed and defined as year-round comfort' (STN L2152-2153); a 'Long-term whole house performance guarantee' (STN L2162). Recipients inferred (the owners). Any shortfall make-good stays inside this promise (G18)"
    established_by: [works_contract_social, works_contract_private]
  c2:
    family: payment_promise
    from: nch
    to: melius
    status: inferred
    what: "a fixed price for the works on the social homes (STN L2094-2096). Payer inferred; amount and timing not published. The plan income funds 'similar works to more homes' (STN3 L790-791), not stated for this price"
    established_by: works_contract_social
  c3:
    family: payment_promise
    from: private_owners
    to: melius
    status: inferred
    what: "the owner's contribution after the grant, 1400 to 2536 euro (£1260 to £2280) by property type (STN L2102-2104). Amount stated; payee inferred to be the provider (the text does not name it)"
    established_by: works_contract_private
  c4:
    family: benefit_promise
    from: unstated
    to: private_owners
    status: stated
    what: "'received a grant towards the work' (STN L2100); without it the improvement would cost 'upwards of 8900€ (£8000)' (STN L2106-2108). The giver is not named (source.notes)"
  c5:
    family: funding_promise
    from: credit_union
    to: private_owners
    status: stated
    funding_instrument: loan   # zero-interest loan (STN L2110-2112)
    what: "the zero-interest loan for the householders' contribution (STN L2110-2112); amount not published"
    established_by: loan_agreement
  c6:
    family: payment_promise
    from: private_owners
    to: credit_union
    status: inferred
    what: "repayment of the principal 'over a number of years' 'without accruing extra costs' (STN L2116-2118). A loan is repayable; schedule not published"
    established_by: loan_agreement
  c7:
    family: payment_promise
    from: occupants
    to: nch
    status: stated
    what: "the energy plan, a 'flat rate cost for energy' that 'will not rise significantly' when energy bills rise (STN3 L791-792); 'as little as £600' a year in the first UK pilot (STN L2154). Amount in this pilot not published"
    established_by: energy_plan
  c8:
    family: performance_promise
    from: nch
    to: occupants
    status: inferred
    what: "the comfort and energy the plan buys: 21/18 degrees C in lounge and bedrooms, 140 litres of hot water a day and 2,300 kWh a year for lighting, cooking and sockets (STN L2154-2156). Who supplies it is not stated; NCH, which is paid, is inferred"
    established_by: energy_plan

settings:
  payment_basis:
    value: asset
    status: inferred
    why: "the provider was 'procured based on' a fixed price (STN L2094-2096) and the owners pay a fixed contribution (STN L2102-2104); the comfort guarantee is a promise on performance in use, not a pricing rule. The comfort-level payment (the plan) runs from household to landlord (STN3 L789-791), outside the Partner's contract. Alternative performance, if the plan is read as paying the provider (the Energiesprong model, not stated here)"
  client_sector:
    value: public
    status: inferred
    why: "the social homes belong to the council, 'public owner' (STN L2064), and NCH acts for it (STN L2032-2033). The private owners' branch is private"
  partner_form:
    value: corporate
    status: inferred
    why: "'Melius Homes (UK)' is weighing a new prefabrication factory (STN L2115-2119): a standing company, not a vehicle for the pilot"
  borrower:
    value: client
    status: stated
    why: "the private owners take the zero-interest loan to pay their contribution (STN L2110-2112). No loan for the social branch. The converter would resolve 'client' to the authority role, so the R7 row is written explicitly"
  receivable_holder:
    value: partner
    status: default
    why: "no assignment of any payment is mentioned"
  collection_placement:
    value: operator_own
    status: default
    why: "not stated where payments land"
  aggregation:
    value: none
    status: inferred
    why: "one pilot of ten homes (STN L2023) with one provider. The procurement sentence (STN L2094-2096) names no buyer and does not say the private owners' homes were contracted with the social homes, so a pool of several clients is not shown. Alternative pool"
  debt_seniority:
    value: senior
    status: default
    why: "a single zero-interest loan; no rank stated"
  assignment_recourse:
    value: not_applicable
    status: inferred
    why: "nothing assigned (receivable_holder partner)"
  savings_basis:
    value: measured
    status: default
    why: "not applicable: payment_basis is asset (known wrinkle, DEAL_SCHEMA)"
  grant_recipient:
    value: client
    status: stated
    why: "'Each home owner/private landlord' received 'a grant towards the work' (STN L2098-2100)"
  asset_owner:
    value: client
    status: inferred
    why: "the homes belong to the council and to private owners (STN L2031-2032, L2079); the retrofit is fixed to the houses and no provider title is mentioned. For the social homes the legal owner is NCC, for whom NCH acts"
  bill_custody:
    value: client
    status: default
    why: "who pays the energy supplier under the plan is not stated; the plan is a flat rate paid to the landlord (STN3 L790-792)"

rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, client_eu_general_government_at_close: true}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: undetermined
    this_case: "public client (inferred) in a member state at the works date, but NCH's general-government status is not stated (jurisdiction undetermined). Even if it fires, the outcome is undetermined: no guaranteed savings (asset basis, comfort guarantee) and no contract value published"
    source: E15 L2576-2582, L6930-6943; RULINGS.md ruling 3-4
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: false
    this_case: "client_sector public and asset_owner client; the retrofit is bought, not leased"
    source: RULINGS.md ruling 7; E02 L3293-3295

numbers:
  homes_in_business_case: "10, terraced houses and bungalows (STN L2023-2024)"
  share_of_social_housing_in_area_pct: "65 (STN L2031)"
  works_period: "December 2017 to 2018 (STN L2092)"
  energy_use_kwh_m2_yr: "97 before, 43 after (STN L2014-2016)"
  owner_contribution: "1400 to 2536 euro = £1260 to £2280, by property type (STN L2102-2104)"
  cost_without_grant: "upwards of 8900 euro = £8000 (STN L2106-2108)"
  energy_plan_price: "as little as £600 a year, first UK pilot (STN L2154)"
  energy_plan_content: "21/18 degrees C lounge/bedrooms, 140 litres hot water a day, 2,300 kWh/yr electricity (STN L2155-2156)"
  retrofit_result: "near zero net energy, under 1,500 kWh/yr (STN L2157)"
  second_generation_module_cost: "35 percent less expected (STN L2149-2150)"
  horizon_2020: "£5 million to Nottingham, £3m of it for domestic efficiency in over 400 homes (STN L2120-2130); programme level"
  derived:
    consumption_cut: "(97 - 43) / 97 = 55.7 percent. The source prints no percentage"
    currency_ratio: "1400 / 1260 = 1.111; 2536 / 2280 = 1.112; 8900 / 8000 = 1.1125: one rate, about 1.11 euro per pound, throughout (ties)"
    grant_floor_per_home: "£8000 - £2280 = £5720 to £8000 - £1260 = £6740 at least, if the 'upwards of' cost covers the same work as the contribution. Indicative only (source.notes)"
    horizon_per_home_ceiling: "£3,000,000 / 400 = £7,500 per home at most ('over 400' homes); programme level, indicative"


# Miniature: Sneinton, Nottingham Energiesprong-type whole-house retrofit (Melius Homes, REMOURBAN pilot, 2017-2018), expressed at ESCO LOD 0.
# Batch 7, group M, reviewed final (reconciles writers X and Y, 3 Oct 2026).
#
# Evidence: STUNNING deliverable D5.2 "Case studies results" (2019), business case W12 (pages 47-49), and D5.3 (2019) for one clean
# paragraph on the energy plan. STN = der-vpp/spec-run/esco-moneyflow/input/stunning-d5-2-case-studies-results-2019.txt;
# STN3 = der-vpp/spec-run/esco-moneyflow/input/stunning-d5-3-replicability-potential-2019.txt. Cited as STN L<line> | 'quote'.
# D5.2 is a two-column table, so sentences interleave in the text; quotes come from one column of one line.
# Quotes are 8 words or fewer (review rule for this group). Line numbers as grep -n counts them; every line re-opened by the reviewer.
# Every fact carries its status: stated / inferred / default / generic / unstated.

miniature: nottingham_sneinton_energiesprong
lod: 0
case: batch7.T15
case_kind: deal   # a named pilot of ten homes with a named solution provider; social-tenant and private-owner legs in one file
in_scope: true
in_scope_why: "a whole-house energy retrofit (consumption 97 to 43 kWh/m2/yr, STN L2014-2016) by a solution provider that 'committed to delivering a performance' that is 'long term guaranteed' (STN L2152-2153). An efficiency deal (ruling 14). payment_basis asset (inferred): the provider was procured at a fixed price, so not an ESCO deal by the payment_basis test"

tests_unused:
- item: occupant
  kind: role
  used: true
  reason: "the tenant household pays the landlord an 'Energy plan' (STN L2097-2099; STN3 L789-790) and the tenants helped develop the design brief (STN L2075-2076). A tenant paying for comfort and energy, not the owner paying for the works: the role's definition"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "Closest call in the batch. The provider's guarantee is comfort-defined ('defined as year-round comfort', STN L2153) and the household pays a flat plan for a comfort bundle (STN L2154-2156). But the provider was 'procured based on' a fixed price (STN L2094-2096) and the plan is paid to the landlord, not the provider (STN3 L789-791). payment_basis records what the client pays the Partner for: asset. Alternative performance; see lod0_gaps"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No receivable is sold; the landlord's plan income funds more works (STN3 L790-791), it is not sold"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No hedge is mentioned; the only loan is at zero interest (STN L2112)"
- item: authority_guarantor
  kind: role
  used: false
  reason: "No guarantee of a client's payments. The generic Energiesprong text mentions a '30-years insurance-backed energy performance' (STN L1988) for the model, not for Nottingham"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "The homes belong to the council or to private owners (STN L2031-2032, L2079); nobody is said to own the energy module separately"
- item: energy_auditor
  kind: role
  used: false
  reason: "NEP is listed as engineers and designers (STN L2070-2071); no audit promise is stated"

single_source_exercised:
- term: occupant
  evidence: "der-vpp/spec-run/esco-moneyflow/input/stunning-d5-3-replicability-potential-2019.txt:790 | payed an ‘Energy plan’, and the landlord (NCH)"
  confirmed: "stated; the same sentence is in D5.2 across two columns (STN L2097-2099). Second source for the role"

source:
  id: STN
  documents:
    STN: "der-vpp/spec-run/esco-moneyflow/input/stunning-d5-2-case-studies-results-2019.txt"
    STN3: "der-vpp/spec-run/esco-moneyflow/input/stunning-d5-3-replicability-potential-2019.txt"
  title: "STUNNING D5.2 Case studies results, business case W12 (social housing and single-family houses, Nottingham, UK); D5.3 Report on replicability potential"
  publisher: STUNNING project (EU Horizon 2020), 2019
  passage: "STN L2002-2163 (W12 table L2002-2130, key features L2131-2163); L1977-1990 (generic Energiesprong model, not Nottingham); STN3 L778-792"
  oracle: "none; not a published validation target"
  context:
  - "Nottingham City Council (NCC), 'public owner' (STN L2064): owns the social homes, which NCH manages 'on their behalf' (STN L2032-2033). No promise by NCC is stated: context. It is the legal owner behind asset_owner client"
  - "Nottingham Energy Partnership (NEP), engineers and designers (STN L2070-2071), 'introduced a zero interest loan' with the credit union (STN L2110-2112). Its own promise or payment is not stated: context"
  - "NTU (public university), INFOHUB Ltd (monitoring and controls developer), SASIE Ltd (renewable-energy installers), Studio Partington (design, printed 'Prtington') (STN L2068-2081): listed stakeholders with no stated promise"
  - "EU Horizon 2020: 'Nottingham received £5 million of EU Horizon' 2020 research funding, £3m of it for domestic efficiency in over 400 homes (STN L2120-2130). Programme level; the text does not link it to these homes or name the recipient: context, no commitment"
  - "REMOURBAN and Transition Zero, the projects the pilot belongs to (STN L2025-2026); the council's cross-cutting smart city department (STN L2132-2136): context"
  notes:
  - "Two client groups. Social homes (65 percent of the area, STN L2031): the tenant household pays an energy plan to the landlord NCH (STN3 L789-790). Private owners: 'Each home owner/private landlord' got a grant and paid a contribution, helped by a zero-interest loan (STN L2098-2112). Settings carry the representative value and name the other group in the reason"
  - "Who procured the works is not stated (STN L2094-2096). NCH is written as buyer for the social homes (it manages them and receives the plan income); the private owners' contract with the provider is inferred"
  - "The grant giver for private owners is not named (STN L2098-2100): c4 has an unstated giver. Horizon 2020 is a possible source the text does not link"
  - "Who supplies the comfort the plan buys is not stated. NCH receives the payment, so NCH is written as the supplier (c8, inferred); the guaranteed performance itself is the provider's (c1)"
  - "Scope of the printed prices: the contribution (STN L2102-2104) and the 'upwards of' cost (STN L2106-2108) are for 'this home improvement', and the loan sentence calls 'the insulation' a more realistic option (STN L2114). Whether they cover the whole retrofit is unclear; recorded as printed"
  - "Equipment and goods costs rose 'between the initial bid and delivery' (STN L2137-2139), putting financial pressure on the budget; who absorbed it is not said"

jurisdiction:
  country: United Kingdom (England)
  iso: GB-ENG
  eu_member: true
  client_eu_general_government_at_close: undetermined
  as_of: "works 'began in December 2017' and finished in 2018 (STN L2092); contract date not stated"
  status: inferred
  why: "Nottingham (STN L2002). The UK was an EU member in December 2017: a public fact outside the document (it left on 31 January 2020). The client NCH is an 'arms-length management organisation' and 'not-for-profit company' of the council (STN L2065-2067); whether it is classified inside general government is not stated and the corpus does not settle it: undetermined. The owner NCC is a public body but makes no stated promise"


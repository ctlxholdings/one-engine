  melius: {gives: [c1], receives: [c2, c3], one_way: false}
  credit_union: {gives: [c5], receives: [c6], one_way: false}

lod0_gaps:
- kind: comfort_payment_outside_partner_contract
  description: "the occupant pays a flat plan for a defined comfort level to the landlord, while the landlord pays the Partner a fixed price. payment_basis describes the client-to-Partner leg; the comfort leg is written as its own payer-payee pair (c7, c8). Writable without a new term; if the plan were read as paying the provider, payment_basis would be performance"
  classification: "encoding question"
- kind: two_client_groups
  description: "a public social landlord and private owners with different financing (grant and loan only for the private branch). Settings take one value per deal; client_sector public and borrower client are the representative values, each naming the other branch, and an explicit R7 row fixes the converter's client resolution"
  classification: "encoding question"
- kind: unnamed_parties_and_prices
  description: "the procuring body, the fixed price, the grant giver, the plan amount in this pilot and who measures comfort are not published"
  classification: "evidence gap"
- kind: zero_interest_cost_unstated
  description: "who covers the interest the credit union forgoes is not stated (NEP is named with it)"
  classification: "evidence gap"
- kind: plan_income_reinvested
  description: "NCH's plan income funds 'similar works to more homes' (STN3 L790-791): a revolving use of money across later projects, outside this deal"
  classification: "below LOD 0"

conventions_applied:
- id: F02
  title: jurisdiction header, dated at close
  convention: "country, EU membership, client EU general government at close"
  origin: RULINGS.md ruling 4
  applied_here: "GB-ENG, EU member at the works date (inferred); client flag undetermined"
- id: B2-R1
  title: giver by identity
  convention: "EU money takes eu_funds; a government body that lends or grants takes government_financier"
  origin: batch-2 adjudication; RULINGS #8
  applied_here: "the grant giver is unnamed, so no giver role; Horizon 2020 kept as context"
- id: G18
  title: shortfall make-good stays in performance_promise
  convention: "the performing party's own guarantee is part of its performance_promise"
  origin: verdict rule; gaps G18
  applied_here: "inside c1; no risk_promise"
- id: B7-ruling14
  title: every efficiency deal counts; ESCO or not is read from payment_basis
  convention: "in_scope true for any efficiency deal; payment_basis != asset marks an ESCO deal"
  origin: RULINGS.md ruling 14
  applied_here: "asset (inferred): in scope, not an ESCO deal by this test"
- id: B7-ruling17
  title: contracts binding and settled by default
  convention: "binding: non_binding or terms_settled: unsettled only when the source says so"
  origin: RULINGS.md ruling 17
  applied_here: "all contracts default"
- id: B7-ruling18
  title: one identity per legal entity
  convention: "entity when already in cases/parties.yaml, entity_new otherwise, entity_local when the source names none"
  origin: RULINGS.md ruling 18
  applied_here: "NCH, Melius Homes and the credit union new; the two household groups local"


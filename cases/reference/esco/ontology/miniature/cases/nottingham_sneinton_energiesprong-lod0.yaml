    name: Nottingham City Homes (NCH)
    text: "manages the council's social homes 'on their behalf' (STN L2032-2033); an ALMO and 'not-for-profit company' (STN L2065-2067); 'the landlord (NCH) received an on-going income' (STN3 L790). Role authority inferred: it acts for the public owner; its general-government status is not stated (alternative host)"
  occupants:
    role: occupant
    groups: [demand]
    status: stated
    name: Tenant households of the council homes
    text: "'The household payed an ‘Energy plan’' (STN3 L789-790); 'The tenants were involved in' the design brief (STN L2075-2076)"
  private_owners:
    role: host
    groups: [demand]
    status: stated
    name: Private home owners and private landlords
    text: "'Private owners' are listed stakeholders (STN L2079); 'Each home owner/private landlord' received a grant and paid a contribution (STN L2098-2104)"
  melius:
    entity: melius_homes
    role: partner_esco
    groups: [partner]

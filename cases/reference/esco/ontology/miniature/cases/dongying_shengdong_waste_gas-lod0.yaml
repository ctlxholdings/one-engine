# Miniature — Dongying Shengdong EMC, 1.9 MW waste-gas power station at a coking plant (China, c. 2004), expressed at ESCO LOD 0.
# Batch 7, deal T07, reviewer's reconciled file (group K, from writers X and Y). Evidence: World Bank (2008) "Financing Energy
# Efficiency", Case Study 11 (the station) and Case Study 1 (the guarantee programme behind the loan); UNIDO (2011) s.2.3 repeats
# the company and adds no figure for this project. Citations are `<file>:<line> | <exact quote>`; line numbers as grep -n counts them.
# Every fact carries its status: stated / inferred / default / generic / unstated.

miniature: dongying_shengdong_waste_gas
lod: 0
case: batch7.T07
case_kind: deal   # one named EMC and one sample project (the 1.9 MW station) with its own loan and figures; the contract itself is not published
in_scope: true
in_scope_why: "The EMC finances, owns and runs a station that burns the client's waste gas and sells the electricity to the client below the grid tariff [der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10358 | electricity is then sold to the client at a marked-down price]; 'These projects contribute to energy efficiency by using waste gas' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:556 | contribute to energy efficiency by using waste gas]. Ruling 14: an efficiency deal counts; payment_basis supply, so an ESCO deal"

tests_unused:
- item: authority_guarantor
  kind: role
  used: false
  reason: "The one third-party guarantee backs the EMC's bank loan (I&G, guarantee_facility). The client's 'provision of financial guarantees to the EMC' [der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10399 | and provision of financial guarantees to the EMC] names no third party; it could be a guarantee company the client arranges (the book says pilot EMCs ask for one, der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:9098-9100), which would be authority_guarantor, but the text does not say so: evidence gap, kept inside the client's own promise c3"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No receivable is sold and no note issued; a one-year bank loan repaid from project cash flow [der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10411 | a good percentage of the loan was paid back entirely from]"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No hedge is named for a one-year yuan loan"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "The EMC keeps title [der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10377 | providing (but retaining ownership of) the power equipment itself]"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The client pays per kWh at a tariff-linked price with a floor [der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10433 | the minimum price would be Y 0.30]; no availability or output level is paid for. The EMC's three-month compensation for a stoppage is a make-good inside its performance promise"

single_source_exercised: []   # none of the CASE_SPEC_7 single-source terms is used: the guarantee backs the Partner's loan (guarantee_facility), not the client's payments

source:
  id: WB08
  documents:
    WB08: "der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt"
    UNIDO11: "der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt"
  title: Financing Energy Efficiency, Case Study 11 "Dongying Shengdong EMC Waste Gas Power Projects", with Case Study 1 (China EMC Loan Guarantee Program)
  publisher: The World Bank, 2008 (Taylor, Govindarajalu, Levin, Meyer, Ward)
  passage: "WB08 L10291-10464 (Case Study 11: company L10315-10364, Figure CS11.1 L10334-10356, sample project L10367-10448, lessons L10452-10463); L6799-6945 (Case Study 1: flow of funds L6861-6919, 90% cover L6936-6939); L5502-5527 (I&G, 90 percent of loan amounts); L3241-3251 (risk structuring). UNIDO11 L552-605 (same company, generic model)"
  oracle: "none; figures re-added in numbers.derived"
  context:
  - "GEF and the World Bank: GEF money is paid by the World Bank 'into an ESCO (EMC) Guarantee Program Special Fund account, held by China's Ministry of Finance' [der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:6870 | sement in installments by the World Bank into an ESCO (EMC)]. The grant capitalises a programme-wide reserve and reaches neither the client nor the Partner, so GEF is context here (grant_provider covers givers to the client or the Partner); the Ministry, which holds the fund that backs the guarantee, is encoded (mof)"
  - "EMC Association of China (EMCA): introduces the programme to its members [der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:6944 | and identification of potential customers for I&G's program]; no promise in this deal"
  - "Local grid company: sets the industrial tariff the price follows [der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10432 | be adjusted in line with tariff adjustments for industrial customers of]. A price reference, not a party"
  - "Shengli Oil Machinery Company's managers and employees set up and own the EMC [der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10320 | several of its managers and employees set up the Dongying Sheng-]; Figure CS11.1 'Ownership (through employees/managers)'. No amount or named owner: not a party"
  notes:
  - "One payment, two descriptions: a 65/35 sharing of 'savings in electricity costs compared to grid supply' [der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10418 | in electricity costs compared to grid supply would be shared over a] and a per-kWh price below the grid tariff, tariff-linked, with a floor [der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10430 | onsite generation would be lower than the grid-supplied tariff (Y 0.45]. Encoded supply (stated), alternative savings; the sharing formula is LOD 2"
  - "UNIDO11 says the company sells 'any excess to the grid' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:565 | normal grid purchases, selling any excess to the grid] in its general model; the sample project sells to the client only [der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10375 | was then sold to the client]. No grid_buyer in this deal"
  - "Case Study 11 says the loan was guaranteed 'through the WB/GEF loan guarantee fund (see Case Study 1)' [der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10405 | WB/GEF loan guarantee fund (see Case Study 1)]; the link between the deal and the programme is the book's own cross-reference"


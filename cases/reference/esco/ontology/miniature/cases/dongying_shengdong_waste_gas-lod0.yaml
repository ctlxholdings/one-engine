rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, client_eu_general_government_at_close: true}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: false
    this_case: "China, not EU; client private by default"
    source: E15 L2576-2582, L6930-6943; RULINGS #3
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: true
    this_case: "trigger met on recorded values (private by default; the EMC holds title). Outcome undetermined: the client's accounting framework is not stated, the payment varies with kWh delivered and the client has no purchase right in the text"
    source: RULINGS.md ruling 7; E02 L3293-3295
  price_floor_and_tariff_link:
    scope: contractual
    rule: "price below the grid tariff (Y 0.45/kWh at signing), moved with industrial-tariff adjustments, never below Y 0.30/kWh including tax"
    applies_here: true
    source: WB08 L10429-10434
  mutual_three_month_compensation:
    scope: contractual
    rule: "client default: three months of electricity bills plus removal costs to the EMC (L10439-10443); EMC failure halting generation: three months of fees, at average monthly production, to the client (L10444-10448)"
    applies_here: true
    source: WB08 L10439-10448
  guarantee_cover_ratio:
    scope: contractual
    rule: "I&G covers up to 90% of loan amounts, to be reduced as bank reform proceeds"
    applies_here: true
    source: WB08 L5525-5527, L6936-6939


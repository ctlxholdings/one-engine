lod0_gaps:
- kind: intercept_of_client_transfers
  description: "the client's federal transfers are pledged and paid over by the finance ministry on default. Carried by a risk_promise from the client; the ministry is context. Not authority_guarantor (G-E2)"
  classification: "encoding question; no new term"
- kind: alliance_without_partner
  description: "installer and lessor bound separately; no Partner, allowed because payment_basis is asset"
  classification: "encoding note; no new term"
- kind: annexed_instruments_missing
  description: "the two annexed instruments (price, warranty, title, guarantee clause) are not in the PDF"
  classification: "evidence gap"
- kind: rate_conflict
  description: "rent schedule implies about 10.8% a year vs ESMAP 6.7%"
  classification: "evidence gap"

conventions_applied:
- id: B3-scope
  title: in_scope from the source
  convention: "a case counts only if the source shows an efficiency payment; otherwise a witness whose uses do not count"
  origin: batch3 and batch4 decisions (posigen, geolumen)
  applied_here: "in_scope false (fixed rent)"
- id: B5-AG
  title: authority_guarantor test (reviewer rev-E)
  convention: "a body other than the client and the Partner guaranteeing the client's own payments; an intercept of the client's own transfers does not qualify"
  origin: reviewer rev-E, gaps G-E2
  applied_here: "SHCP intercept -> context; client pledge c7"
- id: F02
  title: jurisdiction header
  convention: "dated at close"
  origin: ruling 4
  applied_here: "MX, 15 Apr 2015"
- id: F06
  title: one_way form
  convention: "counter-promise by duality recorded unstated"
  origin: verdict rule
  applied_here: "surety one_way (premium c6 unstated)"


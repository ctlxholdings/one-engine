# Miniature — Guadalajara public-lighting LED luminaire lease (Arrendamiento Puro), Municipality of Guadalajara / ELECTROTEC + SOLUCASH,
# signed 15 April 2015, expressed at ESCO LOD 0. OUT-OF-SCOPE WITNESS.
#
# Batch 5 FINAL (reviewer rev-E, 1 Oct 2026), reconciled from writers E-X and E-Y. Base: E-X (it read the whole contract); E-Y's World
# Bank case-study facts added as secondary (payment security over federal transfers, title transfer at end, 6.7% rate, total payments).
# Evidence re-fetched 1 Oct 2026:
#   [CONTRATO] http://transparencia.guadalajara.gob.mx/sites/default/files/ContratoArrendamientoSolucash.pdf (live host: HTTP 404).
#              Read from the Internet Archive copy http://web.archive.org/web/20241110210827if_/https://transparencia.guadalajara.gob.mx/sites/default/files/ContratoArrendamientoSolucash.pdf
#              Plain downloads stop at 1,048,576 bytes; a resumed download (curl -C -) completes at 3,842,991 bytes, 8 pages, OCR text layer
#              partly garbled (opening, NOVENA). Only clean lines are quoted. (E-Y saw only the truncated copy; E-X and the reviewer read all 8 pages.)
#   [ESMAP]    https://www.esmap.org/sites/esmap.org/files/DocumentLibrary/Guadalajara%20-%20Proven%20LED%20Delivery%20Models8_Optimized_Final.pdf
#              World Bank ESMAP case study 'Guadalajara, Mexico: Lease-to-Own' (live URL 403; Archive copy, text as extracted by E-Y). Secondary.

miniature: guadalajara_led_lease
lod: 0
case: batch5.D22
case_kind: deal   # one named, signed contract, 15 April 2015
in_scope: true
in_scope_why: "Efficiency deal (LED street lighting under a pure lease), asset basis: counts under owner ruling 14 (3 Oct: every efficiency deal counts; ESCO or not is read from payment_basis). Earlier verdict: witness, fixed rent under Arrendamiento Puro [CONTRATO | cl. PRIMERA]."

tests_unused:
- item: authority_guarantor
  kind: role
  used: false
  reason: "NOT exercised (E-Y said true; overruled). ESMAP quotes the master contract: Guadalajara 'establishes as a guarantee payment or alternate source of payment the federal holdings (Participaciones Federales)', and on default the lessor 'will give notice to the State Ministry of Finance and Public Credit ... to make payment of the missing amount within 48 hours through federal contributions' [ESMAP | p.12]. The money is the municipality's own federal revenue share; the ministry pays it on instruction, it does not guarantee from its own resources. An intercept of the client's own transfers, not a guarantee by another body. The lease itself puts the guarantees on the client: 'las garantías a dar por el propio ARRENDATARIO' [CONTRATO | cl. CUARTA A)]. Encoded as the client's own security (c7). Secondary source, and the deal is out of scope, so nothing would count anyway"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "fixed rent schedule; the kWh-saving standard per luminaire (cl. TERCERA A) is a technical compliance duty, not a payment trigger. Asset"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "SOLUCASH may arrange its own 'fondeo o financiamiento' [CONTRATO | cl. NOVENA]; no vehicle or note issue in the deal"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "no hedge named; fixed rent"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "the lessor holds title (asset_owner lessor)"

source:
  id: CONTRATO
  title: "Contrato de Arrendamiento (Arrendamiento Puro), Municipio de Guadalajara with the alliance ELECTROTEC / SOLUCASH SOFOM E.N.R., 15 April 2015"
  publisher: "Municipio de Guadalajara, transparency portal (Internet Archive copy of 10 Nov 2024)"
  passage: "http://transparencia.guadalajara.gob.mx/sites/default/files/ContratoArrendamientoSolucash.pdf | Antecedentes I-IV; Declaraciones; cl. PRIMERA-DÉCIMA SEGUNDA; signature page"
  secondary:
  - id: ESMAP
    passage: "ESMAP case study pp.7-16: Financing (p.12, the guarantee clause quoted from the master contract), Installation (p.15), Lessons (p.16)"
  oracle: "ESMAP note 9: total payments 'Mex$490.4 million'; the contract's schedule gives 6 x 1,873,261.21 + 108 x 4,436,715.40 = MXN 490,404,830.46 (closes)"
  context:
  - "Secretaría de Hacienda y Crédito Público (named by ESMAP as 'State Ministry of Finance and Public Credit'): pays a missed instalment out of the municipality's Participaciones Federales on the lessor's notice [ESMAP | p.12]. Executes the client's own pledge; no promise of its own shown. Also keeps the federal debt register the lease needs [CONTRATO | cl. CUARTA A)]. Context, not a party"
  - "Comisión Federal de Electricidad: its authorisation is a condition for installation [CONTRATO | cl. TERCERA A) iv)]; the city 'will continue to pay for electricity to CFE' [ESMAP | p.12]. No promise in this contract"
  - "CONUEE National Lighting Program: a 15% reimbursement (cap Mex$10m) 'If targets are met' [ESMAP | p.9]; Guadalajara applied to the programme, receipt not stated; ESMAP's summary table attributes the reimbursement to Banobras. Not encoded"
  - "Registro de Deuda Pública del Estado de Jalisco; tender LP 006/2015; decrees D 80/01/14 and D 93/03/2015: rule sources"
  notes:
  - "The supply side is an alliance whose two members bind themselves separately: ELECTROTEC and SOLUCASH 'cada una de ellas se obligan en lo particular' [CONTRATO | cl. SEGUNDA]; their obligations to the lessee 'no dependerán una de otras' [CONTRATO | cl. SÉPTIMA]. The rent is owed whatever the installer does"
  - "Term: 'hasta por 10 años' [cl. PRIMERA] and '114 meses' [cl. SEXTA]; ESMAP says '10-year'. 114 months = 9.5 years"
  - "MXN 300,000,000 is a ceiling incl. VAT 'más gastos, accesorios y comisiones financieras' [cl. PRIMERA], not the rent total"
  - "Row's 'up to 300 units': ELECTROTEC's initial stock of '300 trescientas luminarias' [CONTRATO | declaración 1.1]; ESMAP gives 40,000 of 80,000 points replaced"

jurisdiction:
  country: Mexico (Guadalajara, Jalisco)
  iso: MX
  eu_member: false
  client_eu_general_government_at_close: false
  as_of: "signature 15 April 2015 [CONTRATO | signature page]"
  status: stated
  why: "municipality under Art. 115 of the Mexican Constitution [CONTRATO | Antecedente I]. Not EU"

core_v7:
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: the lease contract, its two annexed instruments and the performance bond each establish (fibo-fnd-rel-rel:confers) their commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:
  guadalajara:
    entity: municipio_guadalajara
    role: authority
    groups: [demand, public]
    status: stated
    name: Municipio de Guadalajara ('EL ARRENDATARIO')
    text: "the lessee; pays the rent [CONTRATO | cl. QUINTA A)]"
  electrotec:
    entity: electrotec
    role: epc_contractor
    groups: [delivery]
    status: stated
    name: Electricidad y Tecnología S.A. de C.V. (ELECTROTEC)
    text: "'Llevar a cabo la instalación, puesta en operación y entregar' the luminaires within 23 weeks of the conditions [CONTRATO | cl. TERCERA A)]; warranty over the term per ESMAP p.14. Not Partner: no energy service is paid for"
  solucash:
    entity: solucash
    role: lessor
    groups: [capital]
    status: stated
    name: SOLUCASH S.A. de C.V. SOFOM E.N.R.
    text: "'Otorgar el financiamiento bajo la figura del arrendamiento' and receive the rent 'como contraprestación' [CONTRATO | cl. CUARTA A), C)]"
  surety:
    role: surety_guarantor
    groups: [risk]
    status: stated
    name: "an 'afianzadora nacional' (not named)"
    text: "bond 'expedida por una afianzadora nacional a favor del Municipio' for 10% of the contract amount incl. VAT [CONTRATO | cl. TERCERA B)]"

contract:
  lease_contract:
    core: contract
    parties: [guadalajara, electrotec, solucash]
    status: stated
    note: "signed 15 April 2015; 114 months from perfection [CONTRATO | cl. SEXTA]"
  electrotec_instrument:
    core: contract
    parties: [guadalajara, electrotec]
    status: inferred
    note: "'Se anexarán a este contrato el instrumento legal que regulará la relación jurídica específica entre el ARRENDATARIO y ELECTROTEC' [CONTRATO | cl. TERCERA]; not in the PDF"
  solucash_instrument:
    core: contract
    parties: [guadalajara, solucash]
    status: inferred
    note: "the matching instrument with SOLUCASH [CONTRATO | cl. CUARTA]; ESMAP quotes its payment-security clause from the 'Master Contract' and 'Annex' [ESMAP | p.12]"
  performance_bond:
    core: contract
    parties: [surety, guadalajara, electrotec]
    status: stated
    note: "'la fianza ... para el cumplimiento del Contrato' [CONTRATO | cl. TERCERA B)]"
  equipment_purchase:
    core: contract
    parties: [solucash, electrotec]
    status: inferred
    note: "SOLUCASH's funds 'se destinarán a la adquisición de los bienes objeto de la Licitación' [CONTRATO | cl. CUARTA B)]; seller inferred to be ELECTROTEC"

commitments:
  c1:
    family: performance_promise
    from: electrotec
    to: guadalajara
    status: stated
    what: "installs, commissions and delivers the luminaires in 23 weeks once the debt registrations, a works supervisor, written instructions and CFE's authorisation are in place; equipment 'deberán cumplir con el ahorro de energía en KWh' of the Mexican standard [CONTRATO | cl. TERCERA A)]"
    established_by: lease_contract
  c2:
    family: payment_promise
    from: solucash
    to: electrotec
    status: inferred
    what: "price of the goods bought with the lease funds [CONTRATO | cl. CUARTA B)]; seller and amount inferred/unstated"
    established_by: equipment_purchase
  c3:
    family: funding_promise
    from: solucash
    to: guadalajara
    status: stated
    funding_instrument: lease   # financing as a lease (CONTRATO cl. CUARTA A)
    what: "'Otorgar el financiamiento bajo la figura del arrendamiento' once the municipality is on the public-debt registers [CONTRATO | cl. CUARTA A)]; ESMAP: 'reflects an interest rate of 6.7 percent' [ESMAP | p.12]"
    established_by: lease_contract
  c4:
    family: payment_promise
    from: guadalajara
    to: solucash
    status: stated
    what: "rent MXN 1,873,261.21 a month for six months, then MXN 4,436,715.40 'hasta la conclusión del contrato' [CONTRATO | cl. CUARTA C)]; 114 months; non-payment for 'más de dos meses consecutivos' is a rescission cause [CONTRATO | cl. OCTAVA A.1]"
    established_by: lease_contract
  c5:
    family: risk_promise
    covers: [R3]
    from: surety
    to: guadalajara
    status: stated
    cover_kind: surety   # performance bond, 10% (CONTRATO cl. TERCERA B)
    what: "performance bond, 10% of 'el monto total del Contrato incluyendo el IVA' [CONTRATO | cl. TERCERA B)]"
    established_by: performance_bond
  c6:
    family: payment_promise
    from: electrotec
    to: surety
    status: unstated
    what: "counter-promise required by duality: bond premium; not stated"
    established_by: performance_bond
  c7:
    family: risk_promise
    covers: [R5a]
    from: guadalajara
    to: solucash
    status: inferred
    what: "the client's own payment security: its Participaciones Federales as 'guarantee payment or alternate source of payment', paid by the finance ministry within 48 hours on the lessor's notice [ESMAP | p.12, quoting the master contract]; the lease names 'las garantías a dar por el propio ARRENDATARIO' [CONTRATO | cl. CUARTA A)]. Inferred: clause read only as quoted by a secondary source"
    established_by: solucash_instrument

settings:
  payment_basis:
    value: asset
    status: stated
    why: "fixed rent for leased luminaires, 'Arrendamiento Puro' [CONTRATO | cl. PRIMERA, CUARTA C)]; no Partner encoded, which the ruling allows only for asset"
  client_sector:
    value: public
    status: stated
    why: "Municipio de Guadalajara"
  partner_form:
    value: corporate
    status: default
    why: "no Partner (payment_basis asset); vocabulary default"
  borrower:
    value: client
    status: stated
    why: "the municipality takes the lease [CONTRATO | cl. CUARTA A)]; definition covers 'loan or lease'"
  receivable_holder:
    value: partner
    status: default
    why: "no Partner and nothing assigned: SOLUCASH is the original creditor (as in light_motril). E-X's 'assignee' rejected"
  collection_placement:
    value: operator_own
    status: default
    why: "rent paid to SOLUCASH; no account named; the participaciones pledge is security, not a collection route"
  aggregation:
    value: none
    status: stated
    why: "one municipality, one lease"
  debt_seniority:
    value: senior
    status: default
    why: "no rank stated"
  assignment_recourse:
    value: not_applicable
    status: default
    why: "nothing assigned. The cl. SÉPTIMA independence of the rent from the installer's performance is recorded in notes; it is not an assignment waiver"
  savings_basis:
    value: measured
    status: default
    why: "not applicable (asset)"
  grant_recipient:
    value: none
    status: default
    why: "no grant in the contract; the CONUEE reimbursement is conditional and its receipt unstated (context)"
  asset_owner:
    value: lessor
    status: inferred
    why: "'Arrendamiento Puro' [CONTRATO]; 'After the leasing contract expires ... ownership of the luminaires will be transferred to the municipality' [ESMAP | p.12]"
  bill_custody:
    value: client
    status: stated
    why: "'The city will continue to pay for electricity to CFE' [ESMAP | p.12]"

rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU at close}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments + (b) non-repayable government financing, else ON BALANCE SHEET for government (E15 L2578-2582)
    applies_here: false
    this_case: "Mexican municipality, not EU; the Mexican counterpart is the public-debt registration the lease requires"
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: [partner, lessor, vehicle]}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? Private counterpart of C1"
    applies_here: false
    this_case: "public client; a lease on its face"
    source: E02 L3293-3295; RULINGS 7


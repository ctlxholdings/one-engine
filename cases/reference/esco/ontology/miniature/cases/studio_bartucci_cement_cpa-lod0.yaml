  country: Italy
  iso: IT
  eu_member: true
  client_eu_general_government_at_close: false
  as_of: "programme 'Ongoing since 2010' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6182 | 'Programme tenure                            Ongoing since 2010'); contract date not given"
  status: inferred
  why: "'Italian cement plant' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6206 | 'analyzer/probe technology taken from the steel industry and applied in an Italian cement plant.'); Italy was an EU member throughout. The client is a cement manufacturer, a private company: C1 does not apply"


# Miniature: Studio Bartucci combustion probe/analyzer (CP/A) at an Italian cement plant, shared-savings EPC plus White Certificates,
# expressed at ESCO LOD 0. Batch 7, deal T10, reconciled by the group L reviewer from writers X and Y (decisions.json).
#
# Evidence: the local corpus text der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt (IEA, Energy Provider-Delivered Energy Efficiency, 2013, Case Study 38, pp.129-132).
# Not under input-licensed/, so quotes are at most 25 words. Citations read <path>:<line> | 'exact quote' (line numbers as grep -n counts them).
# Every fact carries its status: stated / inferred / default / generic / unstated.

miniature: studio_bartucci_cement_cpa
lod: 0
case: batch7.T10
case_kind: deal   # one named ESCO and one unnamed cement manufacturer; the source describes one plant's EPC (Studio Bartucci has more than 60 projects, L1298)
in_scope: true
in_scope_why: "the ESCO finances, installs and owns a process-efficiency device and is paid 50% of the verified savings value: der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6261 | 'The shared savings component of the EPC specifies that the cement manufacturer will transfer 50'. payment_basis savings, so an ESCO deal"

tests_unused:
- item: certificate_obligated_party
  kind: role
  used: false
  reason: "no certificate buyer or obligated party is a counterparty in the text. The ESCO 'contracts with a trading company to get the best price for the White Certificates' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6260 | 'scheme, and contracts with a trading company to get the best price for the White Certificates.'). Distributors are obligated by the scheme (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6281 | 'Italian law requires electricity and natural gas distributors to pursue'), not by this deal. The trader is not said to buy, so it does not fit the role either (lod0_gaps)"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "no receivables are sold and no notes are issued; the ESCO pays the whole cost itself (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6250 | 'the ESCO took on the entire investment cost. The CP/A was installed and is owned by Studio')"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "no hedge or lender is named anywhere in the case"
- item: authority_guarantor
  kind: role
  used: false
  reason: "the client is a private manufacturer; no guarantee of its payments is mentioned"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "title sits with the ESCO and reverts to the manufacturer (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6251 | 'Bartucci, with ownership eventually reverting to the cement manufacturer after the term')"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "pay is a share of 'verified energy savings value': savings, not availability or output"
- item: borrower=none
  kind: setting_value
  used: false
  reason: "considered (writer X chose it). 'The ESCO financed the technology application itself' (L6207) says the Partner, not the client or a third party, finances; it does not say own funds or that no loan exists. ENCODING.md keeps none for a source that says own funds or equity; batch 5 pair D ruled the same wording partner, inferred"

single_source_exercised: []   # none used: certificate_obligated_party is not supported (no buyer named); borrower=none considered and rejected (tests_unused)

source:
  id: IEA38
  documents:
    IEA38: "der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt (summary box L1296-1307; case study L6170-6310)"
  title: Energy Provider-Delivered Energy Efficiency, Case Study 38 Studio Bartucci (industrial energy savings through energy performance contracting)
  publisher: OECD/IEA, 2013
  passage: "L6170-6310 (table 45 at L6170-6195, programme description L6201-6267, regulatory drivers L6279-6294, lessons learned L6295-6311); summary L1296-1307"
  oracle: "none; not a published validation target"
  context:
  - "Italian energy regulator (AEEG) sets the distributors' efficiency targets (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6282 | 'energy efficiency, according to targets determined by the Italian energy regulator (Autorita per'): rule source, no promise in the EPC"
  - "Obligated distributors and the market operator that runs the certificate market (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6281-6286): scheme actors outside the deal boundary. The scheme 'expiring May 31 2013' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6308 | 'concerns about the stability of WhC revenue streams. Furthermore, with the current')"
  - "Technology licensor: Studio Bartucci 'purchased a license' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6225 | 'niche. Having identified its potential for the Italian cement industry and purchased a license,'). Licensor not named, no role fits a licence: context"
  - "Trading company that sells the White Certificates for the ESCO (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6260). Unnamed; no LOD 0 role (lod0_gaps)"
  - "EU ETS market for the 3000 tCO2/year of credits (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6239 | '3000 tCO2/year within the European Union Allowances (EUA) scheme, saves 1 000 tons of Pet'): buyer is the market, not a party"
  notes:
  - "The reference list gives a company website for the technology (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6197 | 'http://www.tenovagroup.com/efsop_systems.php'). The text does not say that company supplied or licensed the CP/A, so it is not encoded"
  - "Who shares the certificate revenue is stated two ways. The summary says the EPC governs 'sharing of the energy savings and White Certificates revenue streams' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:1305 | 'recovered, and sharing of the energy savings and White Certificates revenue streams. A typical'), while the case study gives the client's 50% as a share of savings value and adds the certificate and ETS revenue to the ESCO's own revenue (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6263 | 'Bartucci adds its participation in energy savings to the revenues it expects to make from'). Encoded as the case study reads; flagged in lod0_gaps"
  - "Table 45 'Budget EUR 1 million' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6191 | 'Budget                                      EUR 1 million') heads the programme, not this plant; the plant's investment is not published"


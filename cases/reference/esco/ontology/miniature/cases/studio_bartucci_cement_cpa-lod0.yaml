  typical_payback: "3-5 years for a typical industrial process innovation (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:1306-1307); not stated for this plant"
  programme_budget: "EUR 1 million (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6191), programme table, not stated to be this plant's cost"
  studio_bartucci_portfolio: "more than 60 industrial energy efficiency projects (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:1298)"
  derived:
    certificates_vs_savings: "not re-computable: tying 2000 certificates (toe) to 1 000 t of pet coke and 175 MWh needs conversion factors the text does not publish. No tie claimed"
    value_of_certificates: "no price published, so no revenue figure is derived"

reciprocity:
  cement_manufacturer: {gives: [c2], receives: [c1, c3], one_way: false}
  studio_bartucci: {gives: [c1, c3], receives: [c2], one_way: false}

lod0_gaps:
- kind: certificate_trader_has_no_role
  description: "The ESCO contracts a trading company to sell its White Certificates (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6260). The trader is unnamed and not said to buy; certificate_obligated_party ('Obligated party, scheme or its delegate that buys') does not fit an intermediary. The owner already planned to widen the certificate-buyer term when a street-lighting deal is encoded (RULINGS.md, OI-6)"
  classification: "encoding question (definition touch-up)"
- kind: third_party_revenue_leg
  description: "The ESCO's certificate and ETS revenue comes from buyers outside the EPC. No counterparty is named, so no payment promise can be written; the revenue appears only as a note. Who shares it with the manufacturer is stated two ways (notes in source)"
  classification: "evidence gap"
- kind: savings_value_basis
  description: "the price or tariff used to value the 50% of savings, the repayment period and the reversion trigger are not published"
  classification: "below LOD 0"


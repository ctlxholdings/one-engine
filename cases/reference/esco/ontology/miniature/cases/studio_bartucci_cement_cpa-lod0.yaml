  - {category: R1, driver: technical, bearer: [partner_esco], share: sole, status: stated, via: [], evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6298 | 'Studio Bartucci developed an EPC arrangement through which it assumed the technology'", why: "the lessons-learned paragraph says the ESCO took the technology risk 'in exchange for a share in the expected energy savings' (L6299). Equal to the default for savings and measured, kept because stated"}
  - {category: R6, driver: law, bearer: [partner_esco], share: sole, status: inferred, via: [], evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6308 | 'concerns about the stability of WhC revenue streams. Furthermore, with the current'", why: "the ESCO counts the White Certificate and ETS revenue towards recovering its investment (L6263-6265), and the text ties ESCO project viability to the certificate market and the obligation scheme's expiry on 31 May 2013 (L6306-6311). No sentence names the bearer, so inferred; the summary box says the certificate revenue is shared (L1305), which would add the client. The default for R6 law would be the client"}
  - {category: R4, driver: null, bearer: [host, partner_esco], share: shared, status: inferred, via: [], evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6262 | '% of the verified energy savings value from the CP/A application to Studio Bartucci as payback.'", why: "the ESCO is paid half of the value of the verified savings, so a fall in electricity or pet-coke prices lowers both the manufacturer's net saving and the ESCO's payment. The split follows from the payment formula, not from a named bearer, so inferred. The default row would be the client alone (taken from writer X)"}

parties:
  cement_manufacturer:
    role: host
    groups: [demand]
    status: stated
    name: Cement manufacturer (plant owner, unnamed)
    text: "der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6226 | 'Bartucci offered the cement plant owner, a shared savings Energy Performance Contract'. Private company: client_sector private by inference"
  studio_bartucci:
    entity: studio_bartucci
    role: partner_esco
    groups: [partner]
    status: stated
    name: Studio Bartucci
    text: "der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6201 | 'Studio Bartucci is an Italian Energy Services Company (ESCO) specializing in identifying and'. Finances, installs, owns and measures the CP/A. Legal form not stated"

contract:
  epc:
    core: contract
    parties: [studio_bartucci, cement_manufacturer]
    status: stated
    note: "der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6226 | 'Bartucci offered the cement plant owner, a shared savings Energy Performance Contract'. The EPC 'governs measurement of savings, how costs are' recovered and shared (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:1304). Signed: the text says the parties 'agree' to share (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6253). Duration not given ('throughout the EPC duration', der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6254)"

commitments:
  c1:
    family: performance_promise
    from: studio_bartucci
    to: cement_manufacturer
    status: stated
    what: "finances the CP/A application, installs and owns it, prepares the White Certificates application and develops the measurement and verification scheme (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6259 | 'prepares the application for the White Certificates, develop the Measurement and Verification'). 'assumed the technology risk' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6298 | 'Studio Bartucci developed an EPC arrangement through which it assumed the technology'). Shortfall make-good stays inside this promise"
    established_by: epc
  c2:
    family: payment_promise
    from: cement_manufacturer
    to: studio_bartucci
    status: stated
    depends_on_savings: true   # 50% of the verified savings value
    savings_arrangement: shared   # 50% of the verified savings value (IEA13 L6262)
    what: "50% of the verified energy savings value from the CP/A, as payback (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6262 | '% of the verified energy savings value from the CP/A application to Studio Bartucci as payback.'). Duration of payments: 'the established repayment period' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6265); amount not published"
    established_by: epc
  c3:
    family: determination_promise
    from: studio_bartucci
    to: cement_manufacturer
    status: inferred
    determines: savings   # verified savings (IEA13 L6259)
    what: "the ESCO develops the measurement and verification scheme (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6259) and the savings are 'verified' (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6262); no independent verifier is named, so the determining party is inferred to be the ESCO under the EPC, which governs measurement (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:1304)"
    established_by: epc


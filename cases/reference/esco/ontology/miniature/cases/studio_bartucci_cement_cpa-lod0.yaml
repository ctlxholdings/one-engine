rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, client_eu_general_government_at_close: true}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: false
    this_case: "the client is a private cement manufacturer"
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: true
    this_case: "trigger met on recorded values (private client, the ESCO owns the CP/A during the term). The outcome is undetermined: the manufacturer's accounting framework and the payment profile are not stated. Payments vary with verified savings, which the register treats as variable"
    source: RULINGS.md ruling 7; E02 L3293-3295
  italian_white_certificate_scheme:
    scope: external-regulatory
    rule: "distributors must meet efficiency targets set by the regulator and can buy certificates on the market (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6281 | 'Italian law requires electricity and natural gas distributors to pursue'); the obligation scheme was due to expire 31 May 2013 (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6308-6309). One certificate equals one tonne of oil equivalent (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6273 | 'A White Certificate is equivalent to 1 ton of oil equivalent (toe)')"
    applies_here: true
    source: "der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6280-6286, :6308-6311"

numbers:
  share_of_verified_savings_value_to_esco: "50% (der-vpp/spec-run/esco-moneyflow/input/iea-energy-provider-delivered-ee-2013.txt:6261-6262)"

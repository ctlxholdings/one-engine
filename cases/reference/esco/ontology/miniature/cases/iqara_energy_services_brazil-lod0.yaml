parties:
  client:
    role: host
    groups: [demand]
    status: generic
    name: Industrial and commercial clients (representative client)
    text: "der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10579-10580 | 'The market consists of medium-size energy consumers (up to 5 MW of demand, usually much less)'; Figure CS12.1 'Industrial/commercial client' (WB08:10560-10564); sectors supermarkets, hotels, shopping centres, industry (Table CS12.1, WB08:10628-10640)"
  ies:
    entity: iqara_energy_services
    role: partner_esco
    groups: [partner]
    status: stated
    name: Iqara Energy Services (IES), later Ecogen
    text: "der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10526-10527 | 'IES offers a comprehensive package, which includes 100 percent financing of the project'; designs, finances, installs, operates and maintains through subcontractors, manages the energy supply contracts and supplies natural gas (Figure CS12.1, WB08:10565-10570). Renamed Ecogen (UNIDO11:589-590)"
  iqara_london:
    entity: iqara_london
    role: equity_investor
    groups: [capital]
    status: inferred
    name: Iqara (London), sole shareholder of IES (itself wholly owned by British Gas)
    text: "der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10474-10475 | 'a wholly owned subsidiary of Iqara (London), itself a wholly owned subsidiary of British Gas'. That the parent supplied the equity (WB08:10684-10685) is inferred from sole ownership"
  subcontractors:
    role: [epc_contractor, operator_om]
    groups: [delivery]
    status: generic
    name: Engineering firms and ESCOs (outsourced engineering, installation, maintenance and operation)
    text: "IES does not undertake the plant engineering, installation, maintenance and operation (WB08:10652-10653): der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10653 | 'This work is outsourced.'; Figure CS12.1 'Subcontracts' to 'Engineering firms/ESCOs' (WB08:10561-10566)"
  equipment_manufacturers:
    role: equipment_supplier
    groups: [delivery, capital]
    status: generic
    name: Equipment manufacturers (not named)
    text: "Figure CS12.1 box 'Equipment manufacturers' (WB08:10556-10557); IES handles 'acquisition and installation of the equipment' (WB08:10528). Supplier credit is not mentioned"

contract:
  energy_services_contract:
    core: contract
    parties: [ies, client]
    status: generic
    note: "the package contract, 'a kind of chauffage performance contract'; 'The contracts are quite long term (15 years length is common)' (WB08:10542-10543). Individual contracts are not published"
  subcontracts:
    core: contract
    parties: [ies, subcontractors]
    status: stated
    note: "der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10653 | 'This work is outsourced.'; Figure CS12.1 'Subcontracts' (WB08:10561)"
  equipment_purchase:
    core: contract
    parties: [ies, equipment_manufacturers]
    status: inferred
    note: "Figure CS12.1 places equipment manufacturers beside IES (WB08:10556-10557); IES acquires the equipment (WB08:10528). Terms not given"
  equity_funding:
    core: contract
    parties: [iqara_london, ies]
    status: inferred
    note: "share capital of IES; equity is the only financing (WB08:10684-10685); the instrument is not described"

commitments:
  c1:
    family: performance_promise
    from: ies
    to: client
    status: generic
    what: "100 percent financing, project design, acquisition and installation of the equipment, O&M, management of the electricity and gas supply contracts, natural-gas supply (WB08:10526-10530, 10565-10570), and the guarantee that the cost of the energy services will be lower than before, Y = X - (guaranteed percent of X), typically 3-10 percent (WB08:10530-10540). IES keeps ownership of the equipment during the contract (WB08:10544-10545). The cost make-good stays inside this promise"
    established_by: energy_services_contract
  c2:
    family: payment_promise
    from: client
    to: ies
    status: generic
    what: "'Monthly payments' (Figure CS12.1, WB08:10558) for the package over a term where '15 years length is common' (WB08:10543). Amount and indexation not published"
    established_by: energy_services_contract
  c3:
    family: determination_promise
    from: unstated
    to: [ies, client]
    status: unstated
    determines: savings   # costs with and without IES that the guarantee compares (WB08:10535-10538)
    what: "someone must establish the costs with IES (Y) and the former costs (X) that the guarantee compares (WB08:10535-10538); the source gives the equation but not who establishes the sums or how"
    established_by: energy_services_contract
  c4:
    family: performance_promise
    from: subcontractors
    to: ies
    status: generic
    what: "plant engineering, installation, maintenance and operation, outsourced by IES (WB08:10652-10653)"
    established_by: subcontracts
  c5:
    family: payment_promise
    from: ies
    to: subcontractors
    status: inferred
    what: "price of the outsourced work; not stated"
    established_by: subcontracts
  c6:
    family: performance_promise
    from: equipment_manufacturers
    to: ies
    status: inferred
    what: "supply of the cogeneration sets and absorption chillers (WB08:10498-10501, 10528; Figure CS12.1 WB08:10556-10557)"
    established_by: equipment_purchase
  c7:
    family: payment_promise
    from: ies
    to: equipment_manufacturers
    status: inferred
    what: "price of the equipment, paid from IES's equity; terms not given"
    established_by: equipment_purchase
  c8:
    family: funding_promise
    from: iqara_london
    to: ies
    status: inferred
    funding_instrument: equity   # all financing with the firm's equity (WB08:10684-10685)
    what: "equity that funds the whole investment ('it appears to have been US$10–12 million' for the projects shown, WB08:10619-10620): 'all financing is with the firm’s equity' (WB08:10684-10685). The equity provider is inferred from ownership"
    established_by: equity_funding
  c9:
    family: payment_promise
    from: ies
    to: iqara_london
    status: inferred
    what: "residual claim of the shareholder (F07); no dividend or return is stated"
    established_by: equity_funding

settings:
  payment_basis:
    value: supply
    status: inferred
    why: "the client pays monthly for the energy services IES delivers, natural gas included (WB08:10529-10530, 10558, 10570), under what the source calls 'a kind of chauffage performance contract' (WB08:10542). Alternative savings: the guarantee is a percentage cost reduction against X, but the client does not pay for a share of measured savings"
  client_sector:
    value: private
    status: inferred
    why: "industrial and commercial consumers (WB08:10560-10564, Table CS12.1); IES is 'an entirely private sector, market-driven initiative' (WB08:10482). No public client appears"
  partner_form:
    value: corporate
    status: stated
    why: "IES is 'a wholly owned subsidiary' (WB08:10474) that has operated since January 2003 (WB08:10513) with a portfolio of contracts, a standing company, not a vehicle for one deal"
  borrower:
    value: none
    status: stated
    why: "der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10684-10685 | 'all financing is with the firm’s equity. There is no debt finance.' Confirmed by UNIDO11:589 ('self-financing model'). No lease: IES owns the plant"
  receivable_holder:
    value: partner
    status: default
    why: "no assignment of client payments mentioned"
  collection_placement:
    value: operator_own
    status: default
    why: "not stated"
  aggregation:
    value: none
    status: inferred
    why: "each client contracts with IES directly; the portfolio is many separate contracts, not pooled or financed together (ENCODING aggregation). The 'ESCO project aggregator' label (WB08:10503) is discussed in source.notes"
  debt_seniority:
    value: senior
    status: default
    why: "no debt at all; fallback value, immaterial"
  assignment_recourse:
    value: not_applicable
    status: inferred
    why: "follows from receivable_holder = partner"
  savings_basis:
    value: measured
    status: default
    why: "payment is on supply, not on savings; fallback value, flagged. The guarantee compares costs (X against Y), not metered savings"
  grant_recipient:
    value: none
    status: inferred
    why: "no grant or subsidy appears; IES is 'an entirely private sector, market-driven initiative' (WB08:10482)"
  asset_owner:
    value: partner
    status: stated
    why: "der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10544-10545 | 'During this period, IES maintains ownership of the installed equipment.' End-of-term transfer is not described (LOD 1)"
  bill_custody:
    value: provider
    status: inferred
    why: "IES manages 'the energy supply contracts both for electricity and natural gas' (WB08:10529-10530), supplies the gas (WB08:10570), and its Y sum includes natural gas and backup power (WB08:10537-10538), so the energy bills sit inside the guaranteed total. Alternative client: the source does not show who the utilities invoice"

rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU general government at close}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: false
    this_case: "private clients in Brazil; Brazil is not an EU member"
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: true
    this_case: "trigger met on recorded values (private clients, IES owns the equipment for the term). Outcome undetermined: the clients' accounting framework is not stated, and the source's 'taking the investment off their balance sheets' (WB08:10541-10542) is a 2008 claim, not an IFRS 16 analysis"
    source: "RULINGS.md ruling 7; E02 L3293-3295; WB08:10541-10542"

numbers:
  cost_reduction_guaranteed_pct: "typically 3–10 (WB08:10540)"
  contract_length_years: "15 is common (WB08:10543)"
  guarantee_formula: "Y = X - (guaranteed percent of X); X = electricity cost + fuel bill + O&M; Y = equipment + natural gas + backup/compl. power + O&M (WB08:10535-10538)"
  client_size: "up to 5 MW demand, usually much less; A4 tariff, 2.3–25 kV; these consumers pay 40–50 percent more per kWh than large consumers (WB08:10579-10582)"
  peak_price_multiple: "an A4 consumer pays 8–10 times more for peak power at the same load factor (WB08:10649-10650)"
  projects_listed: "11 (Table CS12.1, WB08:10628-10640)"
  capacity_kw_listed: "Sonda Penha 395; Sonda Santo Amaro 375; Sonda São Bernardo Campos 790; Sofitel 300; Caesar Park Guarulhos 395; Caesar Park Ipanema 0; Taubaté 0; Taboão 2,855 (800 only for peak); Mega Pólo 0; Osasco 1,300 (peak hour); Inapel Embalagens 1,120 (WB08:10629-10640)"
  total_investment_usd_m: "no estimate available; 'it appears to have been US$10–12 million' for the projects shown (WB08:10618-10620)"
  target: "600 projects and US$300 million by 2010 (WB08:10657-10658)"
  operation_start: "January 2003 (WB08:10513)"
  derived:
    project_count: "3 supermarkets + 3 hotels + 4 shopping centres + 1 industry = 11 rows; 7 with electric capacity and thermal output (cogeneration) + 3 with 0 kW (Caesar Park Ipanema, Taubaté, Mega Pólo) + 1 with thermal output 0 (Osasco). Ties with 'Three are direct-fired absorption chiller projects and one is a peak load generating plant' (WB08:10610-10611)"
    cogeneration_capacity_kw: "395 + 375 + 790 + 300 + 395 + 2,855 + 1,120 = 6,230 kW over 7 projects (Taboão's 2,855 includes 800 kW 'only for peak'); largest 2,855 kW, under the 5 MW limit (WB08:10617-10618): ties"
    investment_per_project_usd_m: "10 / 11 = 0.91 to 12 / 11 = 1.09 (the source gives no per-project figure; rough, for scale only)"
    target_per_project_usd_m: "300 / 600 = 0.50, about half the listed average; consistent with the stated emphasis on small projects (WB08:10659), not a tie"


conventions_applied:
- id: F02
  title: jurisdiction header, dated at close
  convention: "country, EU membership, client EU general government at close"
  origin: RULINGS.md ruling 4
  applied_here: "BR, not EU; C1 false"
- id: R14
  title: scope read from payment_basis
  convention: "every efficiency deal counts; ESCO-ness is payment_basis != asset"
  origin: RULINGS.md ruling 14
  applied_here: "in scope; payment_basis supply"
- id: B6-programme
  title: programme as one representative contract
  convention: "the representative contract of a programme is generic"
  origin: CASE_SPEC_2; batch 3 and batch 6 reviews (nyserda, S01)
  applied_here: "energy_services_contract, c1, c2 generic"
- id: F07
  title: equity reciprocal
  convention: "equity is a funding_promise with an inferred residual-claim payment back"
  origin: verdict rule
  applied_here: c8 / c9
- id: F21
  title: determination from `unstated`
  convention: "a payment computed against a baseline needs a determination promise; a source that names no verifier gives one from the literal unstated"
  origin: batch-5 ruling; kawarna_biomass precedent
  applied_here: c3
- id: R15
  title: risk_allocation holds only rows the source states or implies
  convention: "converter derives every other row from the settings"
  origin: RULINGS.md rulings 15-16; ENCODING.md
  applied_here: "R2, R4, R7 rows"
- id: R17
  title: contracts binding and settled by default
  convention: "binding: non_binding or terms_settled: unsettled only when the source says so"
  origin: RULINGS.md ruling 17
  applied_here: "all four agreements default; no pre-contract document in the source"
- id: R18
  title: one identity per legal entity
  convention: "entity / entity_new / entity_local on each party"
  origin: RULINGS.md ruling 18
  applied_here: "iqara_energy_services (later Ecogen) and iqara_london entity_new; client, subcontractors, manufacturers entity_local"


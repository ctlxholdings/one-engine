# Miniature — Iqara Energy Services (IES), Brazil: 100%-financed natural-gas cogeneration "chauffage" package for medium-size
# industrial and commercial clients, expressed at ESCO LOD 0. Batch 7, group I, reviewer's reconciled file (writers X and Y), deal T01.
#
# Evidence: local corpus texts, cited as der-vpp/spec-run/esco-moneyflow/input/<file>.txt:<line> | <quote> (line numbers as grep -n counts them).
# Main document WB08 = der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt (case study 12, L10469-10748).
# Second document UNIDO11 = der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt (footnote 9, L589-593, L634-636).
# Neither file is under input-licensed/, so quotes may run to 25 words. Every fact carries its status: stated / inferred / default / generic / unstated.
# Programme: IES contracts the same package with many clients (Table CS12.1 lists 11 projects); one representative client contract is encoded (generic).

miniature: iqara_energy_services_brazil
lod: 0
case: batch7.T01
case_kind: programme   # one provider's standard package over a portfolio of small projects; no single contract is published
in_scope: true
in_scope_why: "IES sells an energy service with a cost guarantee: 'It guarantees that the cost of the energy services provided by natural gas will be lower' (WB08:10530-10532) and calls it 'a kind of chauffage performance contract' (WB08:10542). The cogeneration strategy 'usually results in energy efficiency improvements' (WB08:10484-10485). Ruling 14: every efficiency deal counts; the ESCO reading comes from payment_basis = supply. Caveat from the source: the three direct-fired chiller projects and the peak plant are not efficiency projects (WB08:10610-10612), so the encoded contract is the cogeneration package"

tests_unused:
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No receivables are sold or pooled and no notes are issued: der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10684-10685 | 'all financing is with the firm’s equity. There is no debt finance.'"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No debt and no hedge. The page discusses energy-price risk and says price cover 'requires a large and sophisticated backer' (WB08:10703-10704), a hypothetical backer, not a named party"
- item: authority_guarantor
  kind: role
  used: false
  reason: "The clients are private businesses; nobody is named guaranteeing a client's payments"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "IES itself keeps title: der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10544-10545 | 'IES maintains ownership of the installed equipment'"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The client pays monthly for the energy services delivered (supply), with a total-cost guarantee; no availability, output or comfort level sets the payment (WB08:10535-10538, 10558)"

single_source_exercised:   # terms in the CASE_SPEC_7 list that this deal uses
- term: borrower=none
  kind: setting_value
  evidence: "der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10684-10685 | 'all financing is with the firm’s equity. There is no debt finance.'"
  confirmed: true
  note: "Stated, and repeated three years later by a second document: der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:589 | 'the same self-financing model is used by the Brazilian company Ecogen (formerly Iqara'. Debt was 'considered too cumbersome' (WB08:10685-10692). Not a lease either: IES owns the plant (WB08:10544-10545)"

source:
  id: WB08
  title: "Financing Energy Efficiency: Lessons from Brazil, China, India, and Beyond — case study 12, Iqara Energy Services in Brazil"
  publisher: "The World Bank, 2008 (R. Taylor, C. Govindarajalu, J. Levin, A. Meyer, W. Ward)"
  passage: "WB08:10469-10748: introduction (10472-10520), institutional arrangements and results (10524-10662), advantages and disadvantages (10665-10712), lessons learned (10716-10746); Figure CS12.1 (10552-10572); Table CS12.1 (10627-10642)"
  oracle: "none, not a published validation target. Table CS12.1 capacities and the investment per project re-added in numbers.derived"
  documents:
    WB08: "der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt"
    UNIDO11: "der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt"
  context:
  - "British Gas, the ultimate owner, 'is the majority owner (60 percent) of Comgás' (WB08:10478-10479). Comgás is named only as the franchise area where IES first marketed (WB08:10598-10599); it buys or sells nothing in IES's contracts. Group context"
  - "Later name: UNIDO11:589-590 says the model is used by 'Ecogen (formerly Iqara Energy Services, a subsidiary of British Gas), a subsidiary of Geriba Investimentos'. A rename and a later owner, recorded for parties.yaml (`formerly`); the 2008 description is what is encoded"
  - "BG India Energy Services Private Limited (created 2004, Surat) 'replicates the basic business model' (WB08:10516-10519): another deal, not encoded"
  - "Bolivian gas supply crisis of 2005 (WB08:10670-10672): market context, no promise in the contract"
  - "The clients' electricity distribution utility supplies the backup power counted in Y (WB08:10537-10538); not named, no party"
  notes:
  - "Chauffage reading. The guarantee is on total cost: Y = X - (guaranteed percent of X), X = electricity + fuel + O&M before, Y = equipment + natural gas + backup power + O&M with IES (WB08:10535-10538); 'typically in the range of 3–10 percent' (WB08:10540). The client pays one monthly amount for the whole service (Figure CS12.1 'Monthly payments', WB08:10558). payment_basis supply, alternative savings. The formula is LOD 2 (fee_basis chauffage)"
  - "Role of IES. The page says IES 'can be viewed both as an example of a DSM operation or an ESCO project aggregator' and 'tends to be more like the latter' (WB08:10502-10504), because it outsources the engineering and concentrates on finance and contracts (WB08:10504-10510). It signs each client contract itself, so it is the Partner (partner_esco), aggregation none; aggregator_super_esco is the alternative reading"
  - "Parent equity. IES is 'a wholly owned subsidiary of Iqara (London), itself a wholly owned subsidiary of British Gas' (WB08:10474-10475). The page does not say the parent injected the equity that funds the projects, so the funding promise is inferred; 'strong financial backing' (WB08:10725)"
  - "Who establishes X and Y for the cost guarantee is not stated: determination promise from `unstated` (batch-5 ruling), as in kawarna_biomass, where the supply invoice is also computed against the initial situation"
  - "Energy supply contracts. The package includes 'management of the energy supply contracts both for electricity and natural gas' (WB08:10529-10530) and Figure CS12.1 shows IES supplying natural gas (WB08:10570). The utilities on those contracts are not named, so no utility_supplier party"
  - "The source's reservation: 'the savings guaranteed are relatively small and the length of contracts has been quite long' (WB08:10675-10676)"

jurisdiction:
  country: Brazil
  iso: BR
  eu_member: false
  client_eu_general_government_at_close: false
  as_of: "IES began operation in January 2003 (WB08:10513); contracts are signed project by project, so no single close"
  status: stated
  why: "Case study 'Iqara Energy Services in Brazil' (WB08:10469), clients in São Paulo and Rio de Janeiro (WB08:10598-10606); private clients. Not an EU member; C1 does not apply"


risk_allocation:   # rulings 15-16: rows the source states or clearly implies; the converter derives the rest (ENCODING.md)
  - {category: R2, driver: null, bearer: [partner_esco], share: sole, status: inferred, evidence: "der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10693-10694 | The cost of the package is increased by the fact that IES assumes all risks", why: "O&M is part of IES's package to the client (WB08:10529) and IES 'assumes all risks'. The converter would put R2 on operator_om, the outsourced subcontractors, who owe IES and not the client; how risk passes between IES and its subcontractors is not stated. Reviewer addition"}
  - {category: R4, driver: null, bearer: [partner_esco], share: sole, status: stated, evidence: "der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10693-10695 | IES assumes all risks, including changes in the relative prices of energy inputs (basically electricity and natural gas)", why: "stated of IES's package; the source then argues the consumer would be the better bearer (WB08:10696-10699), which is advice, not the contract. X and Y agree"}
  - {category: R7, driver: null, bearer: [partner_esco], share: sole, status: inferred, evidence: "der-vpp/spec-run/esco-moneyflow/input/wb-financing-energy-efficiency-brazil-china-india-2008.txt:10684-10685 | all financing is with the firm’s equity. There is no debt finance.", why: "no loan exists, so the cost of the capital tied up over the 15-year term sits with the equity-funded Partner, which 'assumes all risks' (WB08:10693-10694). The converter's fallback for borrower none would put R7 on the client (flagged), which nothing in the source supports. Y wrote it; X left it to the converter"}

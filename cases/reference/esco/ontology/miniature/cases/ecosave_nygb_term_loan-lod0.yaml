reciprocity:   # gives/receives computed from commitments; one_way per convention F06
  customer: {gives: [c4], receives: [c3, c5], one_way: false}
  ecosave_inc: {gives: [c3, c7], receives: [c5, c6], one_way: false}
  contract_assets: {gives: [c2, c6], receives: [c1, c4, c7], one_way: false}
  nygb: {gives: [c1], receives: [c2], one_way: false}

lod0_gaps:   # what the deal needs that LOD 0 lacks, each with a classification
- kind: borrowing_vehicle_is_not_a_note_issuer
  description: "securitisation_vehicle is defined as a 'bankruptcy-remote entity, not the Partner, that buys receivables or holds asset title and issues notes against them'. Ecosave Contract Assets, LLC buys (acquires) projects and holds receivables but takes a bank-style term loan from one lender and issues no notes; bankruptcy-remoteness is not stated. It fits the role only on two limbs of three. Encoded as inferred. Not proposed: a new term. Possible definition reading ('borrows against' as well as 'issues notes against') is the owner's call"
  classification: "encoding question (definition touch-up, owner's call); the deal can be written with the current role; reviewer: not counted as a use of securitisation_vehicle"
- kind: customer_mix
  description: "'commercial and institutional customers' without a split. client_sector takes one value; a pool mixing private and public clients has no value. C1 (public, EU) and IFRS16 (private) depend on it"
  classification: "evidence gap here; encoding question if a real mixed pool turns up"
- kind: loan_terms
  description: "Tenor, pricing, amortisation, security and draw conditions of the Term Loan are absent from the profile"
  classification: "evidence gap"
- kind: contract_form
  description: "ESA versus EPC with guaranteed savings is not shown at contract level, so payment_basis and fee structure rest on the profile's two words"
  classification: "evidence gap (LOD 2 fee_basis)"

conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F02
  title: "jurisdiction header field, dated at financial close; C1 trigger"
  convention: "A `jurisdiction` block (country, EU membership at close, whether the client is EU general government at close) sits in the header; C1 applies_when {client_sector: public, jurisdiction: EU at close}."
  applied_here: "jurisdiction US-NY, dated close 27 Jun 2019 / 4 Jun 2020; C1 applies_here false"
- id: F04
  title: "borrower rule"
  convention: "borrower = none only when the source says own funds or equity; when no loan or equity is named, keep the default partner with status default."
  applied_here: "borrower = vehicle (named borrower that is not the Partner), not the default"
- id: F06
  title: "one_way form"
  convention: "A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated."
  applied_here: "none one_way: every party has a stated or inferred counter-promise; c5 is unstated but has no party of its own"
- id: F21
  title: "determination_promise is required"
  convention: "A determination_promise is required whenever a payment is computed on savings or completion; from = the party the source names, else the literal 'unstated'."
  applied_here: "c5 determination_promise, from 'unstated' (the profile names no party)"
- id: IFRS16
  title: "IFRS16_lease_test rule entry"
  convention: "IFRS16_lease_test applies_when {client_sector: private, asset_owner not client}."
  applied_here: "applies_here false (asset_owner client by fallback); would fire if title sits with the subsidiary"
- id: B2-R1
  title: "grant or loan giver by identity"
  convention: "A government body that lends or grants takes government_financier; grant_provider only for givers that are neither government nor EU funds."
  applied_here: "NYGB, a state green bank that lends -> government_financier"
- id: B3-web
  title: "web evidence"
  convention: "Evidence cited '<url> | <page or section>' with exact quotes of 25 words or fewer; PDF page = page of the PDF file."
  applied_here: "one primary 4-page PDF"
- id: B3-scope
  title: "in_scope decided from the source"
  convention: "A case counts only if the source shows an efficiency deal; otherwise the file is kept as a witness and its uses do not count."
  applied_here: "in_scope true: guaranteed-savings ESA/EPC receivables back the loan"
- id: B5-payment_basis
  title: "payment_basis setting (1 Oct ruling 1)"
  convention: "payment_basis goes first in settings with a status and a reason; no Partner is possible only when payment_basis is asset."
  applied_here: "payment_basis savings, inferred (reviewer)"


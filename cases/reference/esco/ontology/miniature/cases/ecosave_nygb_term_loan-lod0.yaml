    commitment_step: "30.0 - 15.0 = 15.0 million (the June 2020 increase doubles the commitment; the profile says 'increased the loan size to $30.0 million', consistent)"
    lifetime_over_annual: "lifetime / annual = 158,471 / 10,565 = 15.00; 198,089 / 13,206 = 15.00; 486,108 / 32,407 = 15.00; 607,635 / 40,509 = 15.00; 105,114 / 7,008 = 15.00; 131,393 / 8,760 = 15.00 (each within 7 units of annual x 15, rounding). The profile does not state a project life; a 15-year basis is implied by the table, not published"
    low_high_ratio: "198,089 / 158,471 = 1.25 for electricity; 607,635 / 486,108 = 1.25 for gas; 131,393 / 105,114 = 1.25 for GHG (the high case is 25% above the low case in all three, not stated by the source)"

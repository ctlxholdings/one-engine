  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: each contract establishes (fibo-fnd-rel-rel:confers) its commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:
  facility:
    role: host
    groups: [demand]
    status: stated
    name: Pfizer Freiburg Facility (manufacturing site of the Pfizer Corporation)
    text: "'The Freiburg Facility is an important manufacturing facility of the Pfizer Corporation' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1083 | The Freiburg Facility is an important manufacturing facility of the Pfizer]"
  ec_bioenergie:
    entity: ec_bioenergie_gmbh
    role: partner_esco
    groups: [partner]
    status: stated
    name: EC Bioenergie GmbH, Heidelberg (subsidiary of SHV Holdings N.V.)
    text: "'The ESCO was also contracted as the initial provider of wood pellets' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1206 | The ESCO was also contracted as the initial provider of wood pellets to fire the]; named in footnote 26 [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1235]"

contract:
  boiler_and_pellet_contract:
    core: contract
    parties: [facility, ec_bioenergie]
    term_years: 10
    status: stated
    note: "'a ten-year supply contract to the Facility' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1254 | contracts itself that it was prepared to offer a ten-year supply contract to the]; install and supply 'for the coming ten years' (L1252-1253). Signing date and prices not stated"

commitments:
  c1:
    family: performance_promise
    from: ec_bioenergie
    to: facility
    status: stated
    what: "installs the wood-pellet boiler (with 'technical assistance', L1205) and supplies wood pellets for ten years [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1253 | boiler and supply wood pellets for the coming ten years]; gives 'financial guarantees' against disruption (L1230-1231; form and amount not given); brought 'specialized knowledge in this case on carbon markets' (L1304). The supplier's own guarantee stays inside this promise"
    established_by: boiler_and_pellet_contract
  c2:
    family: payment_promise
    from: facility
    to: ec_bioenergie
    status: stated
    what: "pays for the pellets at a price 'indexed by a market index of wood pellet prices' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1255 | a market index of wood pellet prices (an index of the cost of wood pellets sold in the region)] and capped at 70% of the heat-equivalent market cost of oil (L1256). Amount, payment terms and any payment for the installation not described"
    established_by: boiler_and_pellet_contract

settings:
  payment_basis:
    value: supply
    status: inferred
    why: "a 'ten-year supply contract' with a unit price on a pellet index, capped against oil [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1254-1256]: payment per unit of fuel energy delivered. Alternative asset for the installation leg if the Facility paid a fixed price for the boiler (not stated)"
  client_sector:
    value: private
    status: stated
    why: "'the Pfizer Corporation, a global pharmaceutical company' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1083 | facility of the Pfizer Corporation, a global]"
  partner_form:
    value: corporate
    status: inferred
    why: "EC Bioenergie GmbH, a standing subsidiary with other contracting business [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1236 | giant SHV Holdings N.V. See www.ec-bioenergie.de/ for information on the innovative contracting and]; no deal vehicle"
  borrower:
    value: none
    status: inferred
    why: "no loan, lease or Partner financing; the Facility carries the extra investment and its payback [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1204 | the payback period on that additional investment was easily less than two years]. ENCODING.md reserves none for a source that says own funds; this one implies it (corporate capex, L1117) without the words. Alternative partner if EC Bioenergie financed and owns the boiler. The least certain choice in the file"
  receivable_holder:
    value: partner
    status: default
    why: no assignment mentioned
  collection_placement:
    value: operator_own
    status: default
    why: not stated
  aggregation:
    value: none
    status: inferred
    why: "one facility, one contract; the Master Plan's other projects are separate [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1111 | consisted of some 50+ projects in various areas]"
  debt_seniority:
    value: senior
    status: default
    why: no debt described
  assignment_recourse:
    value: not_applicable
    status: inferred
    why: follows from receivable_holder partner
  savings_basis:
    value: measured
    status: default
    why: "applies only when payment_basis is savings (DEAL_SCHEMA wrinkle); the Facility runs 'a Facility-wide measurement system' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1110 | Energy Master Plan that was based on a Facility-wide measurement system]"
  grant_recipient:
    value: none
    status: inferred
    why: "'Governmental incentives (tax reductions and feed-in tariffs' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1127 | Governmental incentives (tax reductions and feed-in tariffs for excess electric energy] are a Master-Plan-wide heading, none tied to the boiler; credit sales are market revenue, not grants"
  asset_owner:
    value: client
    status: default
    why: "title not stated; the Facility carries the investment (L1203-1204). Alternative partner if EC Bioenergie owns the boiler"
  bill_custody:
    value: client
    status: default
    why: "the Facility buys the pellets and keeps oil and gas boilers 'as a standby' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1242 | of the existing boiler capacity (fired by oil and gas) was kept as a standby in case additional]"

rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, client_eu_general_government_at_close: true}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: false
    this_case: "private client in Germany, not general government"
    source: E15 L2576-2582, L6930-6943; RULINGS #3
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: false
    this_case: "asset_owner client by default, so the trigger is not met; it would be if EC Bioenergie owns the boiler (not stated)"
    source: RULINGS.md ruling 7; E02 L3293-3295
  pellet_price_cap:
    scope: contractual
    rule: "pellet price indexed to a regional wood-pellet index and capped at 70 percent of the heat-equivalent market cost of oil, ten years"
    applies_here: true
    source: UNIDO11 L1253-1256
  standby_capacity:
    scope: contractual
    rule: "part of the oil and gas boiler capacity kept as standby against extra demand or disruption of the biomass boiler; the client's own choice, not a promise by the ESCO"
    applies_here: true
    source: UNIDO11 L1231, L1242-1243

numbers:
  term_years: "10 [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1252-1254]"
  price_cap: "70 percent of the heat-equivalent market cost of oil [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1256]"
  payback: "easily less than two years on the extra investment over a gas boiler [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1203-1204]"
  co2_saved_t_per_year: "in excess of 5,000 [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1212-1213]"
  co2_factors_t_per_mwh: "wood pellets 0; oil 0.25; natural gas 0.19 [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1210-1211]"
  credit_price_eur_per_t: "just under 15, December 2008 [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1221-1222]"
  credit_revenue_eur_per_year: "75,000 [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1224-1225]"
  phase_1: "implemented 2008-2009 [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1285]"
  boiler_cost_and_contract_price: "not published"
  derived:
    credit_revenue: "5,000 t x EUR 15/t = EUR 75,000: matches the printed figure; with 'just under 15' and 'in excess of 5,000' it is approximate in both directions"
    heat_displaced_scale: "5,000 / 0.25 = 20,000 MWh if all displaced fuel were oil; 5,000 / 0.19 = 26,316 MWh if all gas. Scale check only; heat output not published"

reciprocity:
  facility: {gives: [c2], receives: [c1], one_way: false}
  ec_bioenergie: {gives: [c1], receives: [c2], one_way: false}

lod0_gaps:
- kind: carbon_credit_revenue_leg
  description: "The Facility expects to certify its avoided emissions under JI and sell the credits on the EU ETS (about EUR 75,000 a year). Certifier and buyer are a scheme and an anonymous market; no named party promises anything. Recorded in numbers"
  classification: "evidence gap"
- kind: install_price_and_ownership_unstated
  description: "One contract covers installing the boiler and ten years of pellets; only the pellet price is described. Who paid for and owns the boiler is not stated, so borrower none and asset_owner client are inferred / default. If the client paid a fixed price for the boiler, payment_basis would need asset and supply together"
  classification: "evidence gap"
- kind: borrower_none_wording
  description: "ENCODING.md allows borrower none only when the source says own funds; here the text implies a client-funded capex without the words"
  classification: "encoding question"

conventions_applied:
- id: G18
  title: own guarantees stay in performance_promise
  convention: "the supplier's 'financial guarantees' against disruption are inside c1"
  origin: ENCODING.md party conventions
  applied_here: c1
- id: R14
  title: every efficiency deal counts
  convention: "ESCO or not is read from payment_basis"
  origin: ruling 14
  applied_here: "in_scope true, supply"
- id: R18
  title: one identity per legal entity
  convention: "entity_new for a named legal entity not yet in the registry; entity_local when no legal person is named"
  origin: ruling 18
  applied_here: "EC Bioenergie entity_new; the Facility entity_local"


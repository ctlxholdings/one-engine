# Miniature — Pfizer Freiburg biomass (wood-pellet) boiler with EC Bioenergie GmbH (Germany, 2008-2009), expressed at ESCO LOD 0.
# Batch 7, deal T08, reviewer's reconciled file (group K, from writers X and Y). Evidence: one UNIDO working paper (2011), s.4.1
# "An example of a well-organized approach", based on a business-school case (Aflaki and Kleindorfer 2010) not in the corpus. It is
# the only text in input*/ that names the boiler or EC Bioenergie. No contract price, investment amount or financing is given.
# Citations are `<file>:<line> | <exact quote>`; line numbers as grep -n counts them.
# Every fact carries its status: stated / inferred / default / generic / unstated.

miniature: pfizer_freiburg_biomass_boiler
lod: 0
case: batch7.T08
case_kind: deal   # one named facility, one named ESCO, phase 1 of a three-phase plan; contract described, not published
in_scope: true
in_scope_why: "Two oil/gas boilers replaced by 'a single efficient boiler fired by wood pellets' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1202 | consisted of the replacement of boilers #1 and #2 with a single efficient boiler], installed and fuelled for ten years by an ESCO. Ruling 14: an efficiency deal counts; payment_basis supply (the client pays for pellets delivered), so an ESCO deal"

tests_unused:
- item: borrower=none
  kind: setting_value
  used: true
  reason: "No loan, lease or ESCO financing is named; the Facility carries 'that additional investment' and its payback [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1204 | the payback period on that additional investment was easily less than two years]. Inferred, not stated: no sentence says own funds"
- item: certificate_obligated_party
  kind: role
  used: false
  reason: "The credits are Joint Implementation emission credits sold on the EU ETS 'for the going market price' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1221 | traded in the cap and trade system for the going market price]; no obligated party is named and they are not savings certificates"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No receivable sold, no vehicle"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No hedge; the pellet price is indexed and capped in the contract instead [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1256 | and capped at 70 percent of the heat equivalent market cost of oil]"
- item: authority_guarantor
  kind: role
  used: false
  reason: "Private client; the only guarantee is the supplier's own [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1231 | guarantees provided by the supplier, little risk from disruptions was envisaged], inside its performance promise"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "Title not stated; client by default. No third-party owner"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The client pays an indexed, capped price for pellets; no availability or output level is paid for"

single_source_exercised:
- term: "borrower=none"
  evidence: "der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1203 | The initial cost of the replacement boiler was higher than an alternative gas boiler, but"
  note: "inferred: no lender, lease or Partner financing is named and the extra investment and its payback sit with the Facility (L1203-1204; the Master Plan values each project by 'capital expenditure requirements and expected payback periods', L1117). Alternative partner if EC Bioenergie financed the boiler"

source:
  id: UNIDO11
  documents:
    UNIDO11: "der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt"
  title: Risk management in energy efficiency projects in developing countries, s.4.1 (Pfizer Freiburg Facility)
  publisher: UNIDO, 2011 (case based on Aflaki and Kleindorfer, 2010)
  passage: "UNIDO11 L1082-1310: Master Plan L1108-1130; biomass boiler and the ESCO L1198-1207; emissions and credits L1210-1225; guarantees and standby L1228-1243; footnote 26 names the ESCO L1235-1237; phase-1 contract L1251-1257; phases 2-3 L1260-1282; outcome L1285; the ESCO's carbon-market knowledge L1304-1305"
  oracle: "none; the figures are re-added in numbers.derived"
  context:
  - "SHV Holdings N.V.: Dutch parent of EC Bioenergie [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1235 | The ESCO in question is the Heidelberg-based subsidiary EC Bioenergie GmbH of the]. Group link, no promise"
  - "Joint Implementation certification agencies and the EU ETS: 'JI allows certification agencies to verify emission reductions' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1219 | allows certification agencies to verify emission reductions from energy efficiency]. The scheme, not a named party; the credits 'will be certified' (future) and sold to an anonymous market. Revenue kept in numbers"
  - "Pellet producers behind the ESCO: 'The supplier had sufficient long-term contracts itself' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1253 | The supplier had sufficient long-term]. Unnamed, outside the deal"
  - "Pfizer Freiburg's CEMG and the Energy Master Plan (50+ projects, from 2005) [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1109 | launched in 2005 by the Pfizer Freiburg's CEMG]: the client's own organisation"
  - "Phases 2 (absorption cooling) and 3 (co-generation) were planned, not contracted [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1260 | Phase 2 of the BMB project was planned as the installation of an absorption]; phase 1 only is encoded"
  notes:
  - "Who contracts what: the boiler 'was achieved with the technical assistance of a large ESCO' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1205 | of the boiler was achieved with the technical assistance of a large ESCO] and 'the Facility would contract the ESCO supplier to install the boiler and supply wood pellets for the coming ten years' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1252 | In phase 1, the Facility would contract the ESCO supplier to install the]. Read as one contract: EC Bioenergie installs and supplies. Only the pellet price is described; who paid for and owns the boiler is not stated"

jurisdiction:
  country: Germany
  iso: DE
  eu_member: true
  client_eu_general_government_at_close: false
  as_of: "phase 1 'implemented in 2008-2009' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1285 | Phase I of the project was implemented in 2008-2009]; signing date not stated"
  status: stated
  why: "'Freiburg is located in Germany' [der-vpp/spec-run/esco-moneyflow/input/unido-risk-management-ee-projects-developing-countries-2011.txt:1084 | Freiburg is located in Germany]; a private company's site, not general government, so C1 does not apply"


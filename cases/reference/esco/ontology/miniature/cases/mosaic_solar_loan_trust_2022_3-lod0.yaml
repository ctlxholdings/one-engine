  homeowners: {gives: [c2], receives: [c1, c3], one_way: false}
  solar_mosaic: {gives: [c1, c4, c5, c9, c12], receives: [c6, c10, c11], one_way: false}
  concord:
    gives: [c11]
    receives: [c12]
    one_way: true
    reason: the subservicing fee exists only by duality; recorded as c12 unstated
  vervent:
    gives: [c13]
    receives: [c14]
    one_way: true
    reason: the backup servicer's fee exists only by duality; recorded as c14 unstated
  issuer_trust: {gives: [c6, c8, c10, c14, c16, c18], receives: [c2, c5, c7, c9, c13, c17], one_way: false}

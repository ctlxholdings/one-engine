  expected_ratings: {A: AA-sf, B: A-sf, C: BBBsf, D: BBsf, R: NRsf}   # [p.1]
  credit_enhancement_pct: {A: 49.2, B: 15.2, C: 9.7, D: 7.2}   # on adjusted balance [p.1]
  coupons: "Fixed - TBD for A-D (not published in the presale)"
  reserve_fund_usd_m: {initial: 3.08, floor: 1.54}     # [p.11]
  target_oc_pct: "100 for the first 16 months, then 10.5"  # [p.1, p.11]
  ysoc_discount_rate_pct: 7.7                           # [p.11]
  ysoc_amount_usd_m: "about 89 at closing"              # [p.11]
  legal_final_maturity: "June 2053"                     # [p.1]
  lifetime_default_expectation_pct: 8.3                 # [p.1]
  base_case_recovery_pct: 30                            # [p.1]
  derived:
    classes_sum: "114.0 + 74.3 + 12.1 + 5.3 = 205.7 (closes with 'Total Rated Notes 205.7')"
    total_with_r: "205.7 + 12.7 = 218.4 = adjusted collateral balance of 218.4 (closes: 218,435,262 rounded; the notes fund the adjusted balance, not the $307.9m principal)"
    ysoc: "307.907 - 218.435 = 89.47 million, matching 'about $89 million' (closes)"
    reserve_pct_unadjusted: "3.08 / 307.907 = 1.00% = 'equal to 1% of the outstanding unadjusted collateral balance' (closes); floor 1.54 = 3.08 / 2 = 0.50% of the initial balance"
    reserve_pct_adjusted: "3.08 / 218.4 = 1.41% = the presale's 'equal to 1.4% of the balance of the adjusted collateral portfolio' (closes)"
    class_a_ce: "114.0 / 218.4 = 52.2%, so 1 - 0.522 = 47.8% subordination; the presale gives 49.2% including the reserve (3.08 / 218.4 = 1.4%: 47.8 + 1.4 = 49.2, closes)"
    class_bcd_ce: "reviewer: (218.435 + 3.08 - 188.3) / 218.435 = 15.2% (B), (218.435 + 3.08 - 200.4) / 218.435 = 9.7% (C), (218.435 + 3.08 - 205.7) / 218.435 = 7.2% (D): all close with p.1"
    class_a_ce_unadjusted: "reviewer: (307.907 + 3.08 - 114.0) / 307.907 = 64.0%, the printed unadjusted class A CE on p.11 (closes; from writer X)"
    avg_balance: "307,906,983 / 6,781 = 45,407 USD against a published 'Average Original Loan Balance' of 45,500 (original balance, so a small difference is expected; current average not published). Not forced to close"


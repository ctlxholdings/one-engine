  installers: {gives: [c3], receives: [c4], one_way: false}

lod0_gaps:   # what the deal needs that LOD 0 lacks, each with a classification
- kind: no_efficiency_no_partner
  description: "A solar loan pool with no energy service: payment_basis = asset with no Partner. Three settings that presume a Partner (partner_form, receivable_holder, assignment_recourse) carry values with nothing to describe, as in batch-3 nyserda_green_bonds_2024a"
  classification: "scope boundary (out-of-scope witness)"
- kind: servicer_chain_roles
  description: "Master servicer, subservicer, backup servicer and 'verification agent' map to collector_biller (two parties) and backup_servicer; the 'verification agent' duty of Vervent (checking the servicer's reports) is not a role of its own and sits under backup_servicer, not verifier_mnv (which certifies savings, not data tapes)"
  classification: "encoding question; no new term needed"
- kind: collector_not_a_transaction_party
  description: "Concord and Wells Fargo (the servicer's collection account) are outside the transaction documents but inside the cash path. LOD 0 has no flag for 'party outside the transaction documents'; Concord is encoded as a party, Wells Fargo as context"
  classification: "encoding question (deal boundary, F23)"
- kind: presale_terms
  description: "Coupons 'TBD', ratings 'expected', documentation in draft: the final terms are not in the document"
  classification: "evidence gap"
- kind: waterfall_detail
  description: "The combined waterfall (15 lines, before and after a trigger breach, with a 16-month equity lockout) is below LOD 0"
  classification: "below LOD 0 (LOD 1 waterfall, LOD 3 levels)"

conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F02
  title: "jurisdiction header field, dated at financial close; C1 trigger"
  convention: "A `jurisdiction` block (country, EU membership at close, whether the client is EU general government at close) sits in the header; C1 applies_when {client_sector: public, jurisdiction: EU at close}."
  applied_here: "jurisdiction US, dated presale 7 Dec 2022; C1 applies_here false"
- id: F04
  title: "borrower rule"
  convention: "borrower = none only when the source says own funds or equity; when no loan or equity is named, keep the default partner with status default."
  applied_here: "borrower = client (the homeowner takes the loan)"
- id: F06
  title: "one_way form"
  convention: "A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated."
  applied_here: "concord, vervent and wilmington one_way (fees c12, c14, c16 unstated)"
- id: F21
  title: "determination_promise is required"
  convention: "A determination_promise is required whenever a payment is computed on savings or completion; from = the party the source names, else the literal 'unstated'."
  applied_here: "not triggered: loan instalments are not computed on savings"
- id: IFRS16
  title: "IFRS16_lease_test rule entry"
  convention: "IFRS16_lease_test applies_when {client_sector: private, asset_owner not client}."
  applied_here: "applies_here false (asset_owner client)"
- id: B2-R1
  title: "grant or loan giver by identity"
  convention: "A government body that lends or grants takes government_financier; grant_provider only for givers that are neither government nor EU funds."
  applied_here: "not triggered: no public lender or grant; the federal ITC has no giver party in the deal (grant_recipient client, inferred)"
- id: B3-web
  title: "web evidence"
  convention: "Evidence cited '<url> | <page or section>' with exact quotes of 25 words or fewer; PDF page = page of the PDF file."
  applied_here: "one Fitch presale PDF, 21 pages"
- id: B3-scope
  title: "in_scope decided from the source"
  convention: "A case counts only if the source shows an efficiency deal; otherwise the file is kept as a witness and its uses do not count."
  applied_here: "in_scope false: solar-only pool ('Nonsolar Loans 0.0'); witness, uses not counted"
- id: E1
  title: "equity layer"
  convention: "Equity is a funding_promise with an inferred residual-claim payment_promise back (ENCODING)."
  applied_here: "class R holder, c17-c18 (from writer X)"
- id: B5-payment_basis
  title: "payment_basis setting (1 Oct ruling 1)"
  convention: "payment_basis goes first in settings with a status and a reason; no Partner is possible only when payment_basis is asset."
  applied_here: "payment_basis asset, inferred (a loan for equipment); no Partner"


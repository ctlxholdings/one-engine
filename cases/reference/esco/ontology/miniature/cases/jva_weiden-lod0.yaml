# Miniature — JVA Weiden (Justizvollzugsanstalt Weiden i. d. Oberpfalz, DE), guaranteed-savings Energiespar-Contracting with
# WISAG Energiemanagement, signed 21.01.2010, performance phase 05/2011-04/2021, expressed at ESCO LOD 0.
#
# Batch 5 FINAL, pair D (reviewer rev-D, 1 Oct 2026) from writers D-X and D-Y. Base: Y for the figures (Y read the Basisdaten and
# Weitere Daten correctly), X for the Baukostenzuschuss flag (X read the entry's Merkmale block; Y missed it). Rulings applied:
# REVIEW_SPEC_5 (advisers to context; Baukostenzuschuss = client payment; unstated verifier; German public client), RULINGS.md, ENCODING.md.
# Evidence: the shared raw text of the dena page (batch5/dena.txt, entry 'JVA Weiden', lines 1627-1709), cited
#   [DENA] https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | JVA Weiden, <section>
# The page lists each entry as: narrative, Basisdaten, Projektbeteiligte, Weitere Daten, Maßnahmen, then that entry's Merkmale
# (checked on the Gummersbach entry, whose Merkmale names Gummersbach). Quotes are 25 words or fewer. Nothing from memory.


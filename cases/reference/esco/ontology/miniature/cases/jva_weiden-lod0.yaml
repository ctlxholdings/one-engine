rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, client_eu_general_government_at_close: true}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments + (b) non-repayable government financing, else ON BALANCE SHEET for government (E15 L2576-2582)
    applies_here: true
    this_case: "Applies: a Land prison in an EU member at signing. Outcome undetermined: the operational payments and the Baukostenzuschuss amount are not published. Guarantee side only: 97.000 x 10 = 970.000 EUR nominal (NPV needs a rate the page does not give)"
    source: E15 L2576-2582, L6930-6943; RULINGS #3
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: [partner, lessor, vehicle]}
    rule: Is the client's contract a service agreement or a lease under IFRS 16? Private counterpart of C1
    applies_here: false
    this_case: client is public
    source: E02 L3293-3295; batch2/review/verdict.md change 2

numbers:
  base_energy_costs_eur_per_year: {value: 228000, quote: "Basisenergiekosten: 228.000 Euro pro Jahr"}
  guaranteed_savings_eur_per_year: {value: 97000, quote: "Einspargarantie: 97.000 Euro pro Jahr (42,6 Prozent)"}
  guaranteed_savings_percent: {value: 42.6, unit: percent of base energy costs}
  investment_eur: {value: 495000, quote: "Investition: 495.000 Euro"}
  budget_relief_eur_per_year: {value: 7000, quote: "Haushaltsentlastung: 7.000 Euro pro Jahr", note: not defined on the page}
  contract_signed: '2010-01-21'
  performance_phase: 05/2011 to 04/2021
  sites: {value: 1, quote: "Anzahl Liegenschaften: 1"}
  chp: {value: "50 kW_el, 85 kW_therm", quote: "Gas-BHKW (50 kW_el, 85 kW_therm)"}
  merkmale_bands: {base_energy_costs: "200.000 bis 1 Mio. Euro pro Jahr", investment: "bis 500.000 Euro", chp: ja, baukostenzuschuss: ja, pool: nein}
  derived:
    guarantee_share: "97.000 / 228.000 = 42,54 % vs 42,6 % printed; 0,426 x 228.000 = 97.128. Closes within rounding of the printed thousands. (X's 'implied baseline 227.700' is superseded: the base is printed)"
    bands_check: "228.000 sits in '200.000 bis 1 Mio.'; 495.000 sits in 'bis 500.000': the Merkmale block is this entry's"
    performance_phase_length: "05/2011 to 04/2021 = 120 months = 10 years"
    build_period: "21.01.2010 to 05/2011 = about 15 months from signing to the performance phase (not stated as the build period)"
    payback_on_guarantee: "495.000 / 97.000 = 5,1 years; 97.000 x 10 = 970.000 EUR nominal = 1,96 x the investment"
    budget_relief_vs_guarantee: "7.000 / 97.000 = 7,2 %. If the relief is the client's retained share of the guaranteed saving, about 90.000 EUR/yr would go to the contractor (97.000 - 7.000); a reading, not a published figure"


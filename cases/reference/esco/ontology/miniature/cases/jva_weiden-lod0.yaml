    family: payment_promise
    from: jva_weiden
    to: wisag
    status: inferred
    what: "pays the contractor during the performance phase. Existence inferred from an ESC in which the contractor invests and guarantees savings, and from the printed 'Haushaltsentlastung: 7.000 Euro pro Jahr' (the client keeps part of the saving). Amount and formula not on the page"

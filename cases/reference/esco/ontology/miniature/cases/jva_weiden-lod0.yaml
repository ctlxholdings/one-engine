source:
  id: DENA
  title: "Anwendungsbeispiele von Energiespar-Contracting (entry 'JVA Weiden')"
  publisher: dena (Deutsche Energie-Agentur), Kompetenzzentrum Contracting
  passage: "https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | JVA Weiden: narrative, Basisdaten, Projektbeteiligte, Weitere Daten, Maßnahmen, Merkmale"
  oracle: "Basisenergiekosten 228.000 EUR/yr, Einspargarantie 97.000 EUR/yr (42,6 %), Investition 495.000 EUR, Haushaltsentlastung 7.000 EUR/yr; Merkmale bands (base 200.000 bis 1 Mio., investment bis 500.000). All re-computed in numbers.derived"
  context:
  - "CDM Consult (Bochum): listed under 'Beratung' [DENA | JVA Weiden, Projektbeteiligte]. An adviser with no stated promise: context, not a party (REVIEW_SPEC_5 ruling on advisers; Y had it as facilitator)"
  - "The Land (Freistaat Bayern by the address): 'Auftraggeber: Land' [DENA | JVA Weiden, Merkmale]. The prison is part of the Land's administration, so one legal person with the client, not a second party"
  - "dena: publisher of the register; no promise in the deal"
  notes:
  - "Contradiction on the page: Merkmale says 'Bundesland: Niedersachsen', while the address is '92637 Weiden i. d. Oberpfalz' with 'www.justizvollzug-bayern.de' [DENA | JVA Weiden, Projektbeteiligte]. Weiden is in Bavaria by the address; the Bundesland field looks like a register error. No LOD 0 value depends on it (country DE either way)"
  - "Dropped from writer X: 'Vertragslaufzeit 10/2010 bis 09/2022' and 'CO2 128 Tonnen pro Jahr' are not in this entry; '128 Tonnen pro Jahr' belongs to another entry of the page (dena.txt line 912). Fetch-tool cross-contamination"
  - "'Haushaltsentlastung: 7.000 Euro pro Jahr' [DENA | JVA Weiden, Weitere Daten] is printed but not defined on the page. Read as the client's budget relief during the contract; no fee is derived from it"
  - "Not on the page: the contracting rate or fee formula, penalties, the M&V method, who finances the 495.000 EUR"


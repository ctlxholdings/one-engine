# Miniature — Birmingham highways maintenance and street-lighting PFI contract with Amey Plc (United Kingdom, signed May 2010), expressed at ESCO LOD 0.
# Batch 7, deal T09, reviewer's reconciled file (group K, from writers X and Y). Evidence: World Bank / ESMAP (2017) "Proven Delivery
# Models for LED Public Lighting", case study 4 (synthesis, case body, Figure 4) and its cross-cutting findings; JRC (2010) only for
# the UK in the EU ESCO-market survey. The contract covers roads, footways, trees, signals and bridges as well as lighting; the study
# "focuses on the streetlights". Figure 4 facts are status inferred. Citations are `<file>:<line> | <exact quote>`.
# Every fact carries its status: stated / inferred / default / generic / unstated.

miniature: birmingham_pfi_amey
lod: 0
case: batch7.T09
case_kind: deal   # one named 25-year PFI contract, signed May 2010; lighting is one part of a roads-and-structures PFI
in_scope: true
in_scope_why: "The contract includes an LED retrofit of 97,000 streetlights with a central management system; Amey 'had assumed electricity cost risk' and keeps the saving [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1005 | Thus, any savings in electricity consumption would accrue to Amey Plc]. Ruling 14: an efficiency deal counts; payment_basis performance, so an ESCO deal"

tests_unused:
- item: payment_basis=performance
  kind: setting_value
  used: true
  reason: "The Council pays a 'Single monthly unitary' payment (Figure 4, der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1088) for a contract that 'defines service level criteria rather than technology' [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1040 | the contract defines service level criteria rather than technology], with performance penalties [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1511 | with performance penalties in PPP]. Not savings (the saving goes to Amey), not per unit, not a fixed price for works. Inferred: no sentence says the unitary payment is abated for poor performance"
- item: authority_guarantor
  kind: role
  used: false
  reason: "No guarantor of the Council's payments; Table 1 lists only 'Work with private sector with substantial resources' [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1522 | Work with private sector with] against payment failure"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "The SPV 'was created to install the LED lights' [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1022 | purpose vehicle was created to install the LED lights]; it holds no receivables and issues no notes (epc_contractor)"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No hedge is mentioned"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "'Amey Plc assumed ownership and maintenance of the lights' [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:281 | ownership and maintenance of the lights for the duration of the contract]; the SPV is majority-owned by Amey, not a third party"


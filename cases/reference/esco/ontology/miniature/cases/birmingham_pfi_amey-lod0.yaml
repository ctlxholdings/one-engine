rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, client_eu_general_government_at_close: true}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: true
    this_case: "trigger met on recorded values (public client; UK in the EU at May 2010, inferred). Outcome undetermined: no saving is guaranteed to the Council (payment_basis performance), no unitary payment is published, and the PFI credits (£996m or £620m) would count at face value as non-repayable government financing if they are a grant. The study does not discuss statistical treatment"
    source: E15 L2576-2582, L6930-6943; RULINGS #3
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: false
    this_case: client public
    source: RULINGS.md ruling 7; E02 L3293-3295
  output_specified_contract:
    scope: contractual
    rule: "outputs, not inputs, are specified; the contractor 'was free to choose LEDs' (L1042) over a 25-year life"
    applies_here: true
    source: WB17 L972-974, L1038-1043
  unitary_payment_step_up:
    scope: contractual
    rule: "single monthly unitary payment with a 4% increase every six months through Year 5, each step approved by an independent certifier"
    applies_here: true
    source: WB17 Figure 4, L1088-1094
  performance_penalties:
    scope: contractual
    rule: "'lighting service' with performance penalties in the PPP contract; size and trigger not given"
    applies_here: true
    source: WB17 L1509-1512


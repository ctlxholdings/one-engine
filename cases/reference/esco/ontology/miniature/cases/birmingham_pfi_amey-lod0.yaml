source:
  id: WB17
  documents:
    WB17: "der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt"
    JRC10: "der-vpp/spec-run/esco-moneyflow/input/jrc-esco-market-in-europe-status-report-2010.txt"
  title: Proven Delivery Models for LED Public Lighting, case study 4 "Public-Private Partnership Delivery Model in Birmingham, United Kingdom"
  publisher: World Bank / ESMAP, 2017
  passage: "WB17 L262-281 (synthesis); L951-1050 (case body); L1059-1097 (Figure 4 labels); L1423-1431 (PFI credits); L1479-1483 (private financing); L1499-1539 (risk table, who assumed what)"
  oracle: "none; the text's own amounts disagree (numbers.derived)"
  context:
  - "Street Services Division: 'Council created a new Street Services Division (SSD) to audit Amey Plc's performance' [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1025 | Council created a new Street Services]. Part of the Council; its audit is the Council's determination promise c3"
  - "HM Treasury / Infrastructure UK 'PFI technical assistance' (Figure 4, der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1068): folded into the government's benefit promise c9. PFI and PF2 frameworks: rule sources"
  - "Banks and 'Other Private Investors': financing 'by both the government and private sector (banks, funds, and Amey Plc itself)' [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:279 | and private sector (banks, funds, and Amey Plc itself), a special purpose vehicle]. No bank, amount or borrower named: not parties"
  - "Staff and unions joined Amey and the SPV [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1024 | Plc and the Council addressed these concerns. Many lighting staff joined both Amey]; no promise in this deal"
  - "Roads, footways, trees, signals, bridges and structures are in the same contract [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:997 | maintain, and manage of 2,500 kilometers of roads, 4,200 kilometers of footways,]; their payments are not separated"
  notes:
  - "The text disagrees with itself: '£2.7 billion (US$4.2 billion)' and '£996 million in PFI credits' (L1009-1011) against '£620 million in PFI credits' and 'a total contract value of £2.6 billion' [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1427 | £620 million in PFI credits for the Birmingham PPP, which had a total contract value]. Both kept in numbers, no choice made"
  - "The funds' instrument is not written: 'Uberior Fund and Equitix Investment Fund provided £330 million in financing' [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1010 | Uberior Fund and Equitix Investment Fund provided]. Figure 4 draws them above the SPV with 'Other Private Investors' and a '1/3 equity stake' label (L1077-1079), which fits the text's 'majority-owned by Amey Plc' SPV (L280) if the outside investors hold the third. Encoded as equity into the SPV, inferred"
  - "Who signed: the text says Birmingham 'contracted Amey Plc' (L996) and 'signed a 25-year contract with Amey Plc' (L277-278); Figure 4 shows the SPV delivering the lighting to the Council. Encoded as the text has it: Amey is the Partner and owner, the SPV its installing vehicle"
  - "Procurement: 41 expressions of interest, 2 finalists, preferred bidder July 2009, signed May 2010 [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1019 | May 2010, the final contract was signed]"


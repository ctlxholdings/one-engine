  term_years: "25 [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:277-278, 999]"
  assets: "2,500 km roads, 4,200 km footways, 97,000 streetlights, 76,000 trees, 1,100 signals, over 850 bridges, tunnels and structures [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:997-999]"
  funds_gbp_m: "330 (Uberior Fund and Equitix Investment Fund) [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1010-1011, 1482]; '$530M' in Figure 4 [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1061]"
  pfi_credits_gbp_m: "996 [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1011] ('$996M' in Figure 4, L1063); 620 [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1427]"
  payment_step: "4% every 6 months through Year 5 [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1088-1092]"
  procurement: "41 expressions of interest, 2 finalists, preferred bidder July 2009, signed May 2010 [der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:1016-1019]"
  derived:
    lighting_share: "117 / 4,200 = 2.8% of the contract value (US$ basis)"
    lighting_per_point: "117,000,000 / 97,000 = US$1,206 per streetlight, if the US$117m covers all points (not stated)"
    implied_fx: "4,200 / 2,700 = 1.556 US$ per £ (contract); 530 / 330 = 1.606 US$ per £ (funds): two rates 3% apart, unexplained"
    credits_discrepancy: "996 - 620 = £376m apart; 2.7 vs 2.6 = £0.1bn apart; not reconciled in the study"
    credits_vs_value: "996 / 2,700 = 36.9%; 620 / 2,600 = 23.8%"
    escalation: "1.04^10 = 1.480 if ten six-monthly steps compound; the base and compounding are not stated"
    financing_gap: "2,700 - 996 - 330 = 1,374 is not 'the rest of the financing' (L1012): contract value is payments over 25 years, not a financing total. No check claimed"


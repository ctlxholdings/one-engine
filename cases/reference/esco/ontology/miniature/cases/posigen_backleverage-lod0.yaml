# Miniature — PosiGen (US): Brookfield's c.$600m backleverage loan to the "Backleverage Entities" and the Connecticut
# Green Bank second lien, over a pool of residential solar leases held in tax equity partnerships, expressed at ESCO LOD 0
#
# Batch 3, RECONCILED by the batch-3 adjudicator from writers P and Q (base P; rulings in batch3/review/decisions.json).
# OUT-OF-SCOPE WITNESS: kept to show the vocabulary can express the structure; its uses are not counted.
# Writer P's text below. Shape copied from batch2/final/*.yaml (normalised 1 Oct 2026). Evidence is public web documents,
# fetched 1 Oct 2026, cited as '<url> | <page or section>' with an exact quote of 25 words or fewer. Main source: the
# D. Conn. order of 12 Nov 2025 (case 3:25-CV-1841). Second source: the debtors' cash-management motion in the Texas
# chapter 11 (Doc 5, 25-90787), a court filing that describes the leases, the TEPs and collections. Statuses: stated,
# inferred (follows from a stated fact — said which), default (source silent), generic (the source's general
# description), unstated (counter-promise required by duality).
#
# SCOPE: neither source shows energy-efficiency assets in the pool. The leases are 'Solar Leases' of 'Solar Systems'
# and the court calls PosiGen 'a solar energy company'. The file encodes the structure honestly, but per CASE_SPEC_3 the
# tested items are marked used: false and the case is flagged as outside ESCO scope (lod0_gaps).

miniature: posigen_backleverage
lod: 0
case: batch3.posigen_backleverage
case_kind: deal
in_scope: false
in_scope_why: "No efficiency asset is shown in the pool. The court calls PosiGen 'a solar energy company' (order p.2); every lease, asset and collection the debtors describe is a 'Solar Lease' of a 'Solar System' (Doc 5 p.11-12). Efficiency appears only in the company's self-description ('residential solar and energy efficiency solutions', Doc 5 p.3). A solar-lease pool is not an efficiency/ESCO deal unless the source shows efficiency, so this file is an out-of-scope witness and its uses do not count"
tests_unused:   # items still unused after batch 2 that CASE_SPEC_3 names for this case
- item: wrapper_creditor
  kind: role
  used: false
  reason: "Structurally it fits: Brookfield lent to holding subsidiaries, 'were funded with approximately $600 million borrowed from Defendant Brookfield' (https://ecf.ctd.uscourts.gov/cgi-bin/show_public_doc?2025cv1841-77= | p.2), then 'appointed an independent manager' and 'assumed control over the funding' (p.2). Encoded as Brookfield's second role. Not counted: no efficiency asset shown in the pool, so the case is outside ESCO scope"
- item: lessor
  kind: role
  used: false
  reason: "Structurally it fits: PosiGen 'leased these systems to homeowners' and sold 'the Solar Leases into the TEPs' (https://bankruptcy-proxy-api.dowjones.ai/cases/Texas_Southern_Bankruptcy_Court/9--25-bk-90787/PosiGen_PBC/docs/5.pdf | p.11). Encoded on the TEPs. Not counted: the leased assets shown are solar systems only"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "Structurally it fits, inferred: the TEPs hold the systems and leases, and their documents 'required that lease collection be deposited in an account owned by the applicable TEP and prohibited commingling' (Doc 5 | p.12); they stayed outside the chapter 11 as non-debtors. 'Bankruptcy-remote' is not stated. Not counted: solar-only pool"
- item: debt_seniority=subordinated
  kind: setting_value
  used: false
  reason: "Structurally it fits and is stated: CGB's c.$30m is 'pursuant to a second lien credit agreement' (order | p.2). Not counted: out of scope (added by the adjudicator from writer Q)"
- item: collector_biller
  kind: role
  used: false
  reason: "Genpact 'invoices each of PosiGen's customers' (Doc 5 | p.12): fits. Not counted: out of scope (added by the adjudicator from writer Q); the role is counted in nyserda_green_bonds_2024a instead"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "Structurally it fits: PosiGen 'sold the systems into TEPs' (Doc 5 | p.11), so the TEPs own the assets during the lease. Encoded as the setting value. Not counted: solar-only pool"

source:   # where the facts come from; context = actors outside the deal boundary; notes = observations that are not gaps
  id: [W-DCONN-77, W-TXSB-5, W-CGB-ABOUT, W-PW-SALE]
  documents:
    W-DCONN-77: "https://ecf.ctd.uscourts.gov/cgi-bin/show_public_doc?2025cv1841-77= — Connecticut Green Bank v. PosiGen, PBC et al., 3:25-CV-1841 (SVN), D. Conn., Order denying TRO and preliminary injunction, 12 Nov 2025 (12 pages). Primary; its facts are 'set forth in Plaintiff's complaint, are generally undisputed' (p.2, fn.1)"
    W-TXSB-5: "https://bankruptcy-proxy-api.dowjones.ai/cases/Texas_Southern_Bankruptcy_Court/9--25-bk-90787/PosiGen_PBC/docs/5.pdf — In re PosiGen, PBC, Case 25-90787 (ARP), S.D. Tex., Doc 5, Debtors' emergency cash-management motion, filed 25 Nov 2025 (28 pages). Primary court filing on a third-party host; statements are the debtors' own"
    W-CGB-ABOUT: "https://www.ctgreenbank.com/about-us/ — Connecticut Green Bank 'About us' page. Primary (self-description)"
    W-PW-SALE: "https://www.paulweiss.com/insights/client-news/brookfield-asset-management-to-acquire-posigen-assets-in-bankruptcy-sale — Paul, Weiss client news, 23 Feb 2026 (Brookfield's counsel). source_reliability: secondary; used only in context"
  title: PosiGen PBC — Backleverage Facility (Brookfield, first lien) and CGB second lien over a residential solar-lease pool held in tax equity partnerships
  publisher: US District Court for the District of Connecticut; US Bankruptcy Court for the Southern District of Texas (debtors' filing)
  passage: "W-DCONN-77 p.1-3 (parties, facts), p.11 (wind-down); W-TXSB-5 p.3 (business), p.5-7 (accounts), p.11-13 (receipts, TEPs, Genpact, Backleverage Facility), p.26 (facility list)"
  oracle: none — not a published validation target; acceptance is structural
  context:
  - "Brookfield parties named in the order: 'BID Administrator LLC, BID III PosiGen Aggregator LP, and BII BID US Holdings LLC (together, \"Brookfield\")' (W-DCONN-77 | p.1). The caption reads 'BID III', the body 'BID II'"
  - "Other funded debt listed by the debtors: Secured Convertible Notes, Battery Revolving Credit Facility, Promissory Note, June and July Bridge Loan Facilities, Unsecured Convertible Notes, and 'the DCGB 3L Facility' (W-TXSB-5 | p.26). A DC Green Bank third lien sits behind CGB; its amount is not in the fetched primary documents"
  - "Outcome (secondary): Brookfield acquired 'substantially all of PosiGen's assets' through a bankruptcy sale and 'a strict foreclosure on their non-debtor affiliates' assets'; the Connecticut case 'was dismissed with prejudice on February 10 following a settlement' (W-PW-SALE). status generic, source_reliability secondary"
  - "SRECs and ITCs: the TEPs 'can mint SRECs' and PosiGen 'monetized associated SRECs, Solar Investment Tax Credits' (W-TXSB-5 | p.11). Buyers of SRECs and the tax-credit benefit are outside this representative contract"
  - "KeyBank: holds PosiGen's ordinary deposit accounts; the lease account 'is not subject to any deposit account control agreement' (W-TXSB-5 | p.12). A deposit bank, not an escrow or trustee, so not account_bank_trustee"
  notes:
  - "Efficiency share of the pool: not shown. The debtors describe the company as 'a leading provider of residential solar and energy efficiency solutions for low-to-moderate income homeowners' (W-TXSB-5 | p.3), but every lease, asset and collection they describe is a 'Solar Lease' of a 'Solar System' (p.11-12); the court calls PosiGen 'a solar energy company' (W-DCONN-77 | p.2). Recorded share: 0% shown, unknown actual"
  - "Adjudicator: the TEPs are NON-debtors. The debtors' filing lists 'the non-Debtor tax equity partnerships (the \"TEPs\")' (Doc 5 and Doc 12, account table; the PDF text layer splits 'non' and 'Debtor' around a table cell). Writer Q read 'Debtor tax equity partnerships' and concluded the TEPs were not bankruptcy-remote in fact; that reading is not adopted"
  - "Adjudicator: writer Q also recorded the ITC as a benefit_promise from the US government, PosiGen as partner_esco, and the channel partners as epc_contractor. Not adopted: out of scope, and none would change a count"
  - "No PPA is mentioned in either source; the contracts are leases. The 'lease/PPA pool' wording in CASE_SPEC_3 is not supported by the fetched text"
  - "What the Backleverage Entities hold is not stated. The order says only that they are 'Certain subsidiaries of PosiGen PBC' funded by the $600m and $30m loans (p.2). Their link to the TEPs is inferred from the name and the debtors' description that TEP cash is routed through the TEP waterfalls 'prior to the Debtors receiving such funds' (W-TXSB-5 | p.11)"
  - "Collections broke the TEP documents: 'This centralized cash collection system generally did not meet the requirements of the governing documents of each TEP' (W-TXSB-5 | p.12). collection_placement records the actual practice"
  - "No determination_promise: lease payments are not computed on savings or completion (F21 not triggered)"

jurisdiction:   # header field, not a setting (F02): drives the C1 trigger
  country: United States (Connecticut court; operations in fifteen states)
  iso: US
  eu_member: false
  client_eu_general_government: false
  status: stated
  why: "'UNITED STATES DISTRICT COURT DISTRICT OF CONNECTICUT' (W-DCONN-77 | p.1); 'currently serves over 40,000 residential customers in fifteen states' (W-TXSB-5 | p.3). Private homeowners, outside the EU"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: each contract establishes (fibo-fnd-rel-rel:confers) its commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 41 (a list = several roles, home role first; F13); groups computed from the role(s)
  homeowner:
    role: host
    groups: [demand]
    status: stated
    text: "'residential solar and energy efficiency solutions for low-to-moderate income homeowners' (https://bankruptcy-proxy-api.dowjones.ai/cases/Texas_Southern_Bankruptcy_Court/9--25-bk-90787/PosiGen_PBC/docs/5.pdf | p.3). Representative lessee; not named"
  posigen:
    entity: posigen_pbc
    role: [originator_developer, operator_om]
    groups: [delivery]
    status: stated
    name: PosiGen, PBC (with PosiGen Provider, LLC and PosiGen Developer, LLC)
    text: "'PosiGen developed Solar Systems, leased these systems to homeowners' and 'serviced the Solar Systems and Solar Leases in exchange for the fees pursuant to servicing agreements' (Doc 5 | p.11)"
  genpact:
    entity: genpact_uk
    role: collector_biller
    groups: [collection]
    status: stated
    name: Genpact (UK) Ltd
    text: "'Genpact invoices each of PosiGen's customers' and 'tracks and reconciles all deposits and customer payments' (Doc 5 | p.12)"
  teps:
    role: [securitisation_vehicle, lessor]
    groups: [capital]
    status: inferred
    name: PosiGen tax equity partnerships (TEPs)
    text: "'sold the systems into TEPs'; 'sales of the Solar Leases into the TEPs' (Doc 5 | p.11); non-Debtor 'tax equity partnerships' (p.6). Holder and lessor after the sale (inferred); 'bankruptcy-remote' not stated"
  tep_class_a:
    role: equity_investor
    groups: [capital]
    status: stated
    text: "'capital contributions from the TEP Class A Members' (Doc 5 | p.11). Not named"
  backleverage_entities:
    role: equity_investor
    groups: [capital]
    status: inferred
    name: the "Backleverage Entities" (subsidiaries of PosiGen PBC)
    text: "'Certain subsidiaries of PosiGen PBC, known as the' Backleverage Entities (https://ecf.ctd.uscourts.gov/cgi-bin/show_public_doc?2025cv1841-77= | p.2). Role inferred: holders of PosiGen's side of the pool; what they hold is not stated (source.notes). Alternative securitisation_vehicle"
  brookfield:
    role: [lender, wrapper_creditor]
    groups: [capital]
    status: stated
    name: Brookfield (BID Administrator LLC, BID III PosiGen Aggregator LP, BII BID US Holdings LLC)
    text: "'were funded with approximately $600 million borrowed from Defendant Brookfield' (order | p.2); after default 'Brookfield appointed an independent manager to conduct all business on behalf of the Backleverage Entities' (p.2)"
  cgb:
    entity: connecticut_green_bank
    role: government_financier
    groups: [public, capital, risk]
    status: inferred
    name: Connecticut Green Bank
    text: "'approximately $30 million borrowed from Plaintiff pursuant to a second lien credit agreement' (order | p.2). 'Established by the Connecticut General Assembly in July 2011' (https://www.ctgreenbank.com/about-us/ | About us): a public body that lends, so government_financier by rule B2-R1 (inferred); lender is the alternative by the act"

contract:   # the agreements that establish the commitments
  solar_lease:
    core: contract
    parties: [teps, homeowner]
    status: inferred
    note: "the representative contract: a 'Solar Lease' between PosiGen and a homeowner, sold into a TEP (Doc 5 | p.11); TEP as lessor after the sale is inferred"
  tep_sale_and_servicing:
    core: contract
    parties: [posigen, teps]
    status: stated
    note: "sale of systems and leases into the TEPs and 'servicing agreements by and among PosiGen Provider, LLC (\"Provider\") and the applicable TEP' (Doc 5 | p.11)"
  genpact_servicing:
    core: contract
    parties: [posigen, genpact]
    status: stated
    note: "'the Genpact Servicing Agreement' (Doc 5 | p.12)"
  tep_llc_agreement:
    core: contract
    parties: [tep_class_a, teps]
    status: inferred
    note: "TEP governing documents with Class A Members and 'distribution waterfalls set forth in the applicable agreements' (Doc 5 | p.11-12)"
  backleverage_facility:
    core: contract
    parties: [brookfield, backleverage_entities]
    status: stated
    note: "'the Backleverage Facility' (Doc 5 | p.13, p.26); about $600m (order | p.2)"
  cgb_second_lien:
    core: contract
    parties: [cgb, backleverage_entities]
    status: stated
    note: "'a second lien credit agreement' (order | p.2); 'the CGB 2L Facility' (Doc 5 | p.26)"
  cgb_pbc_loan:
    core: contract
    parties: [cgb, posigen]
    status: stated
    note: "agreements containing the 'PBC Debt Restrictions', secured by 'a first priority lien on, among other things, certain Generac battery storage systems' (order | p.2)"
  bridge_loan:
    core: contract
    parties: [brookfield, posigen]
    status: stated
    note: "'Beginning October 28, 2025, PosiGen PBC began to unilaterally accept a Bridge Loan on a weekly basis from Brookfield' (order | p.3)"

commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: performance_promise
    from: teps
    to: homeowner
    status: inferred
    what: "lease of the installed solar system for the lease term (the lease sold into the TEP, Doc 5 | p.11); lessor inferred to be the TEP after the sale"
    established_by: solar_lease
  c2:
    family: payment_promise
    from: homeowner
    to: teps
    status: stated
    what: "monthly lease payments: 'Those customers send their lease payments directly to the KeyBank Lease Revenue Collection Account' (Doc 5 | p.12), money the TEP documents require to sit in the TEP's own account"
    established_by: solar_lease
  c3:
    family: performance_promise
    from: posigen
    to: teps
    status: stated
    what: "develop and install the systems and sell them, with their leases, into the TEPs: 'sold the systems into TEPs' (Doc 5 | p.11)"
    established_by: tep_sale_and_servicing
  c4:
    family: payment_promise
    from: teps
    to: posigen
    status: stated
    what: "purchase price for the systems and leases ('sales of the Solar Leases into the TEPs' funded PosiGen's operations, Doc 5 | p.11) and residual cash routed 'according to the distribution waterfalls ... prior to the Debtors receiving such funds' (same)"
    established_by: tep_sale_and_servicing
  c5:
    family: agency_promise
    from: posigen
    to: teps
    status: stated
    what: "service the systems and leases, collect lease payments and 'periodically administer the waterfalls required by the various TEPs and distribute the customer collections' (Doc 5 | p.12)"
    established_by: tep_sale_and_servicing
  c6:
    family: payment_promise
    from: teps
    to: posigen
    status: stated
    what: "servicing fees: serviced the systems and leases 'in exchange for the fees pursuant to servicing agreements' (Doc 5 | p.11)"
    established_by: tep_sale_and_servicing
  c7:
    family: agency_promise
    from: genpact
    to: posigen
    status: stated
    what: "invoice customers, monitor payments, track and reconcile deposits, administer sales-tax functions (Doc 5 | p.7, p.12)"
    established_by: genpact_servicing
  c8:
    family: payment_promise
    from: posigen
    to: genpact
    status: unstated
    what: "counter-promise required by duality; source silent (Genpact's service fee)"
    established_by: genpact_servicing
  c9:
    family: funding_promise
    from: tep_class_a
    to: teps
    status: stated
    funding_instrument: equity   # capital contributions of the TEP Class A members (Doc 5 p.11)
    what: "'capital contributions from the TEP Class A Members' (Doc 5 | p.11)"
    established_by: tep_llc_agreement
  c10:
    family: payment_promise
    from: teps
    to: tep_class_a
    status: inferred
    what: "distributions under the TEP 'distribution waterfalls set forth in the applicable agreements' (Doc 5 | p.11); equity residual form"
    established_by: tep_llc_agreement
  c11:
    family: funding_promise
    from: brookfield
    to: backleverage_entities
    status: stated
    funding_instrument: loan   # first-lien backleverage loan
    what: "first-lien backleverage loan of approximately $600m (order | p.2); 'the Backleverage Facility' (Doc 5 | p.13)"
    established_by: backleverage_facility
  c12:
    family: payment_promise
    from: backleverage_entities
    to: brookfield
    status: stated
    what: "interest and principal; 'On or around August 4, 2025, the Backleverage Entities failed to make certain required interest payments to Brookfield' (order | p.2), an event of default"
    established_by: backleverage_facility
  c13:
    family: funding_promise
    from: cgb
    to: backleverage_entities
    status: stated
    funding_instrument: loan   # second lien credit agreement
    what: "approximately $30m under 'a second lien credit agreement' (order | p.2)"
    established_by: cgb_second_lien
  c14:
    family: payment_promise
    from: backleverage_entities
    to: cgb
    status: inferred
    what: debt service on the second-lien loan, ranking behind Brookfield's first lien (follows from c13 and its 'second lien')
    established_by: cgb_second_lien
  c15:
    family: funding_promise
    from: cgb
    to: posigen
    status: stated
    funding_instrument: loan   # loan to PosiGen PBC
    what: "a loan to PosiGen PBC, about '$2 million in outstanding principal' at filing (order | p.3), with debt restrictions and a first lien on Generac battery systems (p.2)"
    established_by: cgb_pbc_loan
  c16:
    family: payment_promise
    from: posigen
    to: cgb
    status: stated
    what: "repayment, accelerated after the August 2025 cross-default: CGB 'was exercising its contractual right to accelerate all obligations' (order | p.2)"
    established_by: cgb_pbc_loan
  c17:
    family: funding_promise
    from: brookfield
    to: posigen
    status: stated
    funding_instrument: loan   # bridge loans
    what: "weekly Bridge Loans from 28 Oct 2025, after Brookfield funded 'enough cash to survive until October 24, 2025' (order | p.2-3)"
    established_by: bridge_loan
  c18:
    family: payment_promise
    from: posigen
    to: brookfield
    status: inferred
    what: repayment of the Bridge Loans (follows from c17; terms not given)
    established_by: bridge_loan

settings:   # the 13 LOD 0 facets, in vocabulary order (payment_basis added 1 Oct, owner ruling)
  payment_basis: {value: asset, status: inferred, why: "No Partner. c2: homeowner pays fixed monthly lease payments for the installed solar system to the TEP (W-TXSB-5 Doc 5 p.11-12); no savings computed."}
  client_sector: {value: private, status: stated, why: "'low-to-moderate income homeowners' (Doc 5 | p.3)"}
  partner_form:
    value: corporate
    status: default
    why: "no ESCO Partner: PosiGen develops, leases and services but guarantees no savings. PosiGen is a standing public benefit corporation, so corporate if it is read as the Partner"
  borrower:
    value: vehicle
    status: stated
    why: "the backleverage loans are taken by 'Certain subsidiaries of PosiGen PBC, known as the' Backleverage Entities (order | p.2), not by PosiGen or the homeowner"
  receivable_holder:
    value: assignee
    status: stated
    why: "'sales of the Solar Leases into the TEPs' (Doc 5 | p.11): the leases, and so the homeowners' payments, belong to the TEPs"
  collection_placement:
    value: operator_own
    status: stated
    why: "payments land in an account 'owned by PosiGen, PBC' (Doc 5 | p.7) that 'is not subject to any deposit account control agreement' (p.12), against the TEP documents. F09's assignee_direct default not used: the source is not silent"
  aggregation:
    value: pool
    status: inferred
    why: "one backleverage facility over the leases of 'over 40,000 residential customers' held in several TEPs (Doc 5 | p.3, p.11)"
  debt_seniority:
    value: subordinated
    status: stated
    why: "CGB's c.$30m is 'pursuant to a second lien credit agreement' (order | p.2), behind Brookfield; a 'DCGB 3L Facility' sits further down (Doc 5 | p.26). Most junior debt in the deal is subordinated (batch-2 touch-up)"
  assignment_recourse:
    value: waiver
    status: generic
    why: "F08 conditional default: receivable_holder = assignee and the source is silent on whether the TEPs bear performance risk. Alternative performance_exposed: lessees could withhold payment if a system fails; not stated"
  savings_basis:
    value: measured
    status: default
    why: no savings are guaranteed or computed; lease payments are fixed. Default kept, no object
  grant_recipient:
    value: none
    status: inferred
    why: "no grant to the homeowner or PosiGen is described; the government support shown is ITCs and SRECs monetised from the TEPs' systems (Doc 5 | p.11), received by the owner vehicle, a recipient the setting cannot name (lod0_gaps)"
  asset_owner:
    value: vehicle
    status: stated
    why: "'sold the systems into TEPs' (Doc 5 | p.11). Alternative lessor: the TEP is also the lessor; vehicle chosen because ownership came by sale into a holding partnership"
  bill_custody: {value: client, status: default, why: not stated}

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments forecast over the EPC + (b) any government financing not repayable by the Partner (e.g. capital grant), else the EPC is ON BALANCE SHEET for government (E15 L2578-2582; the summary box L6932-6943 states the sum without the basis)
    applies_here: false
    this_case: private homeowners in the US; outside the EU
    source: E15 L2576-2582, L5363-5380 (EU vs government financing), L6930-6943; register constraints.entries.C1_eurostat
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}   # trigger widened 1 Oct
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? The private-sector counterpart of C1: when the Partner owns the installed assets during the term and the client pays for their use, the payments may be a lease liability on the client's balance sheet. Corpus: E02 L3293-3295 ('renewed interest for EnPC and EEaaS after leasing has been categorized as on-balance in the IFRS rules')"
    applies_here: true
    this_case: "private homeowner; asset_owner = vehicle (tax-equity partnership), not client: the widened trigger fires (owner ruling 1 Oct). Out of scope as an ESCO deal; recorded for consistency."
    source: gaps G23; E02 L3293-3295; register.yaml L301 ifrs_16 flag
  tep_segregation:
    scope: contractual
    rule: "TEP documents 'required that lease collection be deposited in an account owned by the applicable TEP and prohibited commingling' (W-TXSB-5 | p.12); breached in practice"
    applies_here: true
    source: W-TXSB-5 p.12
  pbc_debt_restrictions:
    scope: contractual
    rule: "CGB's agreements imposed 'restrictions on PosiGen PBC's ability to incur additional indebtedness' (W-DCONN-77 | p.2); the Backleverage default 'triggered events of default under the agreements between Plaintiff and PosiGen PBC' (p.2)"
    applies_here: true
    source: W-DCONN-77 p.2

numbers:   # instance data, not vocabulary
  backleverage_loan_usd: approximately 600m (order p.2)
  cgb_second_lien_usd: approximately 30m (order p.2)
  cgb_pbc_principal_outstanding_usd: approximately 2m at the complaint (order p.3)
  interest_default_date: on or around 2025-08-04 (order p.2)
  brookfield_cash_runway_to: 2025-10-24 (order p.3)
  weekly_bridge_loans_from: 2025-10-28 (order p.3)
  complaint_date: 2025-10-30 (order p.1)
  order_date: 2025-11-12 (order p.1, p.12)
  customers: over 40,000 residential customers in fifteen states (Doc 5 p.3)

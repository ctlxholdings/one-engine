lod0_gaps:   # what the deal needs that LOD 0 lacks
- kind: outside_esco_scope
  description: "No efficiency asset is shown in the pool: all leases described are 'Solar Leases' of 'Solar Systems', and the court calls PosiGen 'a solar energy company'. The company says it provides 'solar and energy efficiency solutions', but no source fetched gives an efficiency share. As shown, this is a residential solar-lease ABS-style structure, outside ESCO scope; the tested items are marked used: false"
  classification: "scope boundary (owner call: whether solar-lease pools enter the ESCO corpus)"
- kind: wrapper_rank_vs_tax_equity
  description: "Brookfield lent to holding subsidiaries and took control on default, the wrapper pattern. Whether its claim was settled before the TEP waterfall (ahead of the Class A tax equity) is not shown; the debtors say TEP cash goes through the TEP waterfalls before reaching PosiGen. Same definition question as sdcl_seit_rcf: ahead of the deal's equity, or ahead of the whole deal waterfall"
  classification: "encoding question (definition touch-up of wrapper_creditor)"
- kind: backleverage_holdings_unstated
  description: "What the Backleverage Entities own (interests in the TEPs, residuals, other assets) is not stated in either primary source"
  classification: "evidence gap"
- kind: tax_credit_recipient_vehicle
  description: "The public support (ITCs, SRECs) accrues to the owner vehicle. grant_recipient allows none, client or partner only; a tax credit is a benefit_promise (forgone charge) by definition, but its recipient here has no value"
  classification: "encoding question (grant_recipient values; likely LOD 1 for tax-equity structures)"
- kind: segregation_breach
  description: "The TEP documents required collections into TEP-owned accounts; in practice they landed in PosiGen's own unrestricted account. collection_placement records one value; the gap between contract and practice is not expressible"
  classification: "below LOD 0 (distress event: servicer commingling, LOD 3 servicer_insolvency)"
- kind: platform_vs_pool_creditor_dispute
  description: "CGB is both a pool-level second-lien lender (c13) and a platform-level lender to PosiGen PBC (c15). Its suit was about Brookfield's platform-level Bridge Loans breaching PBC debt restrictions. LOD 0 records both promises but not the cross-default between them"
  classification: "below LOD 0 (cross-default is a LOD 1 event)"

conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F02
  title: jurisdiction header field; C1 trigger
  convention: 'A `jurisdiction` block (country, EU membership, whether the client is EU general government) sits in the miniature header, not among the settings; C1 applies_when {client_sector: public, jurisdiction: EU}.'
  origin: verdict change 2; findings F02; gaps G27
  applied_here: jurisdiction US; C1 applies_here false
- id: F04
  title: borrower rule for provider-financed deals
  convention: borrower = none only when the source says own funds or equity; when the Partner finances the works and no loan or equity is named, keep the default partner with status default.
  origin: verdict change 4; findings F04; gaps G24
  applied_here: not triggered — named loans to a vehicle, borrower = vehicle (stated)
- id: F06
  title: one_way form (CASE_SPEC)
  convention: 'A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated; one_way: false is reserved for parties whose counter-promise is stated or inferred from a stated fact.'
  origin: verdict rule; findings F06
  applied_here: genpact one_way with unstated fee c8
- id: F08
  title: 'conditional default: assignment_recourse'
  convention: "receivable_holder in {assignee, split} and source silent -> assignment_recourse = waiver, status generic (E06 L503-505; E08 L3222-3226); performance_exposed only when the source shows the assigned leg varying with performance."
  origin: verdict change 3; findings F08; gaps G28
  applied_here: triggered — leases sold into TEPs, recourse silent -> waiver, generic
- id: F09
  title: 'conditional default: collection_placement'
  convention: receivable_holder in {assignee, split} and source silent -> collection_placement = assignee_direct, status generic (E06 L558; E08 Fig 30 L3312-3317).
  origin: verdict change 3; findings F09; gaps G28
  applied_here: not applied — the source states payments land in PosiGen's own account (operator_own, stated)
- id: F21
  title: determination_promise is required
  convention: "A determination_promise is required whenever a payment is computed on savings or completion; from = the party the source names, else the literal 'unstated'."
  origin: verdict rule; findings F21; gaps G08
  applied_here: not triggered — fixed lease payments
- id: EQ
  title: equity = funding_promise with an inferred residual-claim payment_promise back
  convention: "Equity is a funding_promise with an inferred residual-claim payment_promise back (batch-1 eeaas form)."
  origin: batch-1 verdict encoding rules
  applied_here: c9/c10 (TEP Class A)
- id: G23
  title: IFRS16_lease_test rule entry
  convention: "Rule entry IFRS16_lease_test, applies_when {client_sector: private, asset_owner: partner}: whether the client's contract is a service agreement or a lease (IFRS 16)."
  origin: verdict change 6; gaps G23
  applied_here: applies_here false as written; the batch-2 widening would trigger it
- id: B2-R1
  title: grant or loan giver by identity (batch-2 adjudication)
  convention: "A government body that lends or grants takes government_financier; grant_provider only for givers that are neither government nor EU funds."
  origin: batch-2 adjudication; CASE_SPEC_3
  applied_here: "Connecticut Green Bank, established by the General Assembly, lends -> government_financier (inferred)"
- id: B2-T1
  title: definition touch-ups from batch 2 (debt_seniority = rank of the most junior debt in the deal; asset_owner = legal owner)
  convention: "debt_seniority records the rank of the most junior debt in the deal; asset_owner records the legal owner during the term."
  origin: batch-2 verdict, definition touch-ups
  applied_here: CGB second lien -> subordinated; TEPs bought the systems -> vehicle


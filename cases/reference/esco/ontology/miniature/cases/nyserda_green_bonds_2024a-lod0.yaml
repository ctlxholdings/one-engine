  c8:
    family: payment_promise
    from: nyserda
    to: carmel
    status: unstated
    what: "counter-promise required by duality; source silent (standby fee for the backup servicer)"
    established_by: backup_servicing
  c9:
    family: agency_promise
    from: slipstream
    to: nyserda
    status: stated
    what: "'Slipstream closes on the loan, disburses proceeds to the contractor from a cash advance pool provided by NYSERDA' and passes the loan to Concord (GJGNY report | PDF p.23)"
    established_by: origination_agreement
  c10:
    family: payment_promise
    from: nyserda
    to: slipstream

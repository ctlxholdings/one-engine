    what: "origination fees: Table 10 'Origination' $2,391,497 in Jul 2024-Jun 2025 (GJGNY report | PDF p.36). Payee inferred to be Slipstream, the competitively selected originator"
    established_by: origination_agreement
  c11:
    family: performance_promise
    from: contractor
    to: homeowner

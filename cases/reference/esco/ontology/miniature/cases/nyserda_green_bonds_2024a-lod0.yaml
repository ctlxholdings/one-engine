lod0_gaps:   # what the deal needs that LOD 0 lacks
- kind: no_partner_loan_programme
  description: "A public lender lends straight to homeowners; there is no ESCO. Three settings that presume a Partner (partner_form, receivable_holder, assignment_recourse) take values with nothing to describe, as in batch-2 light_motril. receivable_holder in particular has no value for 'the lender itself' when the client's payments are loan repayments"
  classification: "encoding question (boundary of ESCO scope; same as batch-2 light_motril ruling still open)"
- kind: official_statement_not_found
  description: "Searched 5 Oct 2026: the 2024A Official Statement is not on the issuer's funding page (which lists OS for 2013A, 2018A, 2019A, 2020A only); one EMMA attempt (emma.msrb.org search) returned the EMMA terms-of-use acceptance page, which was not accepted on the owner's behalf. Not found; coupons per class, payment dates, the term bond's sinking schedule, reserve rule and the loan pool stay unpublished (red)."
  classification: "evidence gap"
- kind: pledge_vs_assignment
  description: "The loans' cash flows are pledged to a trustee for bondholders, not sold or assigned. LOD 0 can say assignee or partner but not 'pledged as security'. collection_placement has pledged_escrow, but that is where cash lands, not who holds the claim"
  classification: "encoding question (receivable_holder definition; pledge stays partner/lender with the trustee as account_bank_trustee)"
- kind: loan_originator
  description: "Slipstream originates and closes consumer loans for NYSERDA and disburses from a cash pool. originator_developer is defined as finding and developing the project before contract (audit, development contract), which is close but project-side, not loan-side"
  classification: "encoding question (definition touch-up of originator_developer: 'or originates the loans')"
- kind: underwriter
  description: "Ramirez & Co. buys the whole issue at no less than 97% and resells it; no role among the 41 covers an underwriter or placement agent. Left in source.context because the lasting funder is the bondholders"
  classification: "below LOD 0 (issuance mechanics; LOD 1 event)"
- kind: backup_trigger
  description: "When Carmel must take over (servicer default, termination) is not in any fetched document; the Official Statement was not found"
  classification: "evidence gap"
- kind: pool_mix_2024a
  description: "The share of OBR loans and of efficiency vs solar loans in the 2024A pool is not in any fetched document (only programme-to-date counts: 49.0% of loans are efficiency loans)"
  classification: "evidence gap"

conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F02
  title: jurisdiction header field; C1 trigger
  convention: 'A `jurisdiction` block (country, EU membership, whether the client is EU general government) sits in the miniature header, not among the settings; C1 applies_when {client_sector: public, jurisdiction: EU}.'
  origin: verdict change 2; findings F02; gaps G27
  applied_here: jurisdiction US; C1 applies_here false
- id: F04
  title: borrower rule for provider-financed deals
  convention: borrower = none only when the source says own funds or equity; when the Partner finances the works and no loan or equity is named, keep the default partner with status default.
  origin: verdict change 4; findings F04; gaps G24
  applied_here: not triggered — the client takes a named loan, borrower = client (stated)
- id: F06
  title: one_way form (CASE_SPEC)
  convention: 'A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated; one_way: false is reserved for parties whose counter-promise is stated or inferred from a stated fact.'
  origin: verdict rule; findings F06
  applied_here: carmel and bny_mellon one_way with unstated fees c8, c16
- id: F08
  title: 'conditional default: assignment_recourse'
  convention: "receivable_holder in {assignee, split} and source silent -> assignment_recourse = waiver, status generic; performance_exposed only when the source shows the assigned leg varying with performance."
  origin: verdict change 3; findings F08; gaps G28
  applied_here: not triggered — nothing is assigned (pledge)
- id: F09
  title: 'conditional default: collection_placement'
  convention: receivable_holder in {assignee, split} and source silent -> collection_placement = assignee_direct, status generic (E06 L558; E08 Fig 30 L3312-3317).
  origin: verdict change 3; findings F09; gaps G28
  applied_here: not triggered
- id: F21
  title: determination_promise is required
  convention: "A determination_promise is required whenever a payment is computed on savings or completion; from = the party the source names, else the literal 'unstated'."
  origin: verdict rule; findings F21; gaps G08
  applied_here: not triggered — fixed loan instalments
- id: G23
  title: IFRS16_lease_test rule entry
  convention: "Rule entry IFRS16_lease_test, applies_when {client_sector: private, asset_owner: partner}: whether the client's contract is a service agreement or a lease (IFRS 16)."
  origin: verdict change 6; gaps G23
  applied_here: applies_here false (client owns the measures)
- id: B2-R1
  title: grant or loan giver by identity (batch-2 adjudication)
  convention: "A government body that lends or grants takes government_financier; eu_funds for EU structural funds; grant_provider only for givers that are neither government nor EU funds."
  origin: batch-2 adjudication; CASE_SPEC_3
  applied_here: "NYSERDA, a public benefit corporation of New York State, lends to homeowners -> government_financier, not lender"
- id: B2-T1
  title: definition touch-ups from batch 2 (epc_contractor for the Partner or the client; debt_seniority = rank of the most junior debt in the deal)
  convention: "epc_contractor works 'for the Partner or the client'; debt_seniority records the rank of the most junior debt in the deal."
  origin: batch-2 verdict, definition touch-ups
  applied_here: contractor works for the homeowner; one bond class -> senior


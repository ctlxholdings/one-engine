    family: agency_promise
    from: utilities
    to: nyserda
    status: stated
    what: "bill the OBR instalment and pass the money on: 'The utilities then remit repayments to Concord' (GJGNY report | PDF p.23)"
    established_by: obr_collection
  c4:
    family: payment_promise
    from: nyserda
    to: utilities
    status: stated
    what: "'NYSERDA pays fees to utilities for the administration of the OBR program' (GJGNY report | PDF p.35, s.3.6); $169,109 in Jul 2024-Jun 2025 (Table 10, PDF p.36)"
    established_by: obr_collection
  c5:
    family: agency_promise

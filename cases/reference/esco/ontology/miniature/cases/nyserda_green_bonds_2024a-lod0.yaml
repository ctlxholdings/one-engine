# Miniature — NYSERDA Residential Clean Energy and Energy Efficiency Financing Green Revenue Bonds, Series 2024A
# (New York, US) expressed at ESCO LOD 0
#
# Batch 3, RECONCILED by the batch-3 adjudicator from writers P and Q (base P; rulings in batch3/review/decisions.json).
# Writer P's text below. Shape copied from batch2/final/*.yaml (normalised 1 Oct 2026). Evidence is public web documents,
# fetched 1 Oct 2026, cited as '<url> | <page or section>' with an exact quote of 25 words or fewer. PDF page numbers are
# the page of the PDF file (the GJGNY report also prints its own page numbers, which differ). Every fact carries its
# status: stated, inferred (follows from a stated fact — said which), default (source silent), generic (the source's
# general description of the programme, not this bond series), unstated (counter-promise required by duality).
# The representative contract is one On-Bill Recovery (OBR) loan from NYSERDA to a homeowner, pledged to the 2024A bonds.

miniature: nyserda_green_bonds_2024a
lod: 0
case: batch3.nyserda_green_bonds_2024a
case_kind: deal   # adjudicated: one named, signed bond issue ($46.26m, Indenture of Trust, issued 18 Jul 2024); the homeowner loan below it is the representative (generic) contract
in_scope: true
in_scope_why: "The pool finances efficiency: the bonds fund GJGNY loans for 'residential energy efficiency measures, photovoltaic (\"PV\") systems, air source heat pumps' (minutes p.7, Exhibit A); programme to date 24,334 efficiency loans of 49,611 loans (49.0%). Mixed with solar, so in scope. No ESCO: same open boundary as batch-2 light_motril"
tests_unused:   # items still unused after batch 2 that CASE_SPEC_3 names for this case
- item: backup_servicer
  kind: role
  used: true
  reason: "'Carmel Solutions LLC has been authorized to serve as back up loan servicer for all other portfolio loans' (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Board-Governance/Board-and-committee-meetings/AFCMinutes/156th-Audit-and-Finance-Committee-Meeting-Minutes-42024.pdf | p.10, Exhibit A s.6). Vervent covers only series issued before 2023A, so Carmel is the 2024A backup (inferred); Vervent goes to source.context"
- item: collector_biller
  kind: role
  used: true
  reason: "Concord is a third party collecting for NYSERDA: 'Concord is responsible for all aspects of servicing the loan portfolio, including borrower billing, collections' (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/EDPPP/GJGNY/Annual-Report-GJGNY/2025-GJGNY-Annual-Report.pdf | PDF p.23-24, s.3.2). The utilities that bill OBR installments take utility_supplier, as in batch-2 eesl_ujala_onbill"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No separate issuer or trust: NYSERDA itself issues under an Indenture with BNY Mellon and 'will pledge principal and interest payments on, and prepayments of, Loans as security for the Bonds' (minutes | p.7, Exhibit A). The loans stay NYSERDA's; the bonds are limited-recourse revenue bonds of NYSERDA, not notes of a bankruptcy-remote vehicle"
- item: collection_placement=on_bill
  kind: setting_value
  used: true
  reason: "Status generic, not inferred (adjudicated): a programme fact, not shown for Series 2024A. 'The OBR Loan allows consumers to repay through an installment charge on a bill from one of the involved electric or gas utilities' (GJGNY report | PDF p.23, s.3.2). Inferred for 2024A: the minutes record staff weighing 'whether it makes sense to continue to include on-bill recovery (\"OBR\") loans' (minutes | p.4); the final pool mix was not found"
- item: account_bank_trustee
  kind: role
  used: true
  reason: "'an Indenture of Trust (the \"Indenture\"), between the Authority and The Bank of New York Mellon, as trustee' (minutes | p.7, Exhibit A); KBRA counts 'amounts deposited into the reserve account' in the enhancement (KBRA final release). Who holds the reserve account is inferred to be the trustee"

source:   # where the facts come from; context = actors outside the deal boundary; notes = observations that are not gaps
  id: [W-NYS-MIN, W-NYS-GJGNY, W-NYS-BSR, W-KBRA-F, W-KBRA-P]
  documents:
    W-NYS-MIN: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Board-Governance/Board-and-committee-meetings/AFCMinutes/156th-Audit-and-Finance-Committee-Meeting-Minutes-42024.pdf — Minutes of NYSERDA's 156th Audit and Finance Committee meeting, 29 Apr 2024, Resolution No. 503 and Exhibit A (draft Board resolution). Primary"
    W-NYS-GJGNY: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/EDPPP/GJGNY/Annual-Report-GJGNY/2025-GJGNY-Annual-Report.pdf — Green Jobs-Green New York 2025 Annual Report, Final Report, October 2025 (programme description, servicing, OBR, expenditures). Primary"
    W-NYS-BSR: "https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/Publications/Annual-Reports-and-Financial-Statements/2025-03-31-Annual-Bond-Sale-Report-and-Schedule-of-Bonds-Outstanding.pdf — NYSERDA Bond Sales Report, fiscal year ended 31 Mar 2025 (issuance and CUSIP schedule). Primary"
    W-KBRA-F: "https://www.kbra.com/publications/vTtfXxGk/kbra-assigns-ratings-to-new-york-state-energy-research-and-development-authority-residential-clean-energy-and-energy-efficiency-financing-green-revenue-bonds-series-2024a — KBRA final rating release, 18 Jul 2024. Rating-agency release (primary for the structure it states)"
    W-KBRA-P: "https://www.kbra.com/publications/xRNPtSWR/kbra-assigns-preliminary-ratings-to-new-york-state-energy-research-and-development-authority-residential-clean-energy-and-energy-efficiency-financing-green-revenue-bonds-series-2024a — KBRA preliminary rating release, 17 Jun 2024"
  title: NYSERDA Residential Clean Energy and Energy Efficiency Financing Green Revenue Bonds, Series 2024A (Green Jobs-Green New York loan programme)
  publisher: New York State Energy Research and Development Authority; Kroll Bond Rating Agency
  passage: "Minutes Exhibit A ss.1-8 (PDF p.7-10); GJGNY report s.3.2 Residential Financing, s.3.2.2-3.2.4, s.3.6 and Table 10 (PDF p.23-24, 26, 30-31, 35-36); Bond Sales Report p.3 and p.6; KBRA releases (whole text)"
  oracle: none — not a published validation target; acceptance is structural
  context:
  - "Vervent Inc.: 'authorized to serve as backup loan servicer for Loans pledged to all bond series issued prior to Series 2023A Bonds' (W-NYS-MIN | p.10, s.6). Not the 2024A backup, so not a party here"
  - "Adjudicator: writer Q encoded Ramirez as a party (role lender) with a purchase contract; not adopted. The underwriter holds the bonds only between purchase and resale; the lasting funders are the bondholders. Writer Q's determination_promise for the OBR savings cap also not adopted: the instalment is not computed on savings (F21)"
  - "Ramirez & Co., Inc.: underwriter that 'propose to purchase the Bonds from the Authority and offer the Bonds to the public' (W-NYS-MIN | p.8); price 'not be less than 97% of the principal', compensation not to 'exceed 1% of the principal amount' (p.9, s.4). A transient buyer that resells to the bondholders; kept outside the deal boundary (lod0_gaps)"
  - "Public Authorities Control Board, Office of the State Comptroller and the Department of Taxation and Finance approve the issue: 'The bonds would require the approval of' these bodies (W-NYS-MIN | p.4). Approvers, no promise: rule sources, not parties"
  - "RGGI allocations top up the revolving fund: 'The program requires additional RGGI fund allocations to support the loan originations not funded through bond proceeds' (W-NYS-GJGNY | PDF p.30, s.3.2.4). Programme funding one level above the bond deal"
  - "Loan participations sold to community banks via LoanStreet (W-NYS-GJGNY | PDF p.30, s.3.2.3): a parallel funding route, not this series"
  notes:
  - "Pool mix: the programme to date is mixed. 'From October 2010 through June 2025, 24,334 energy efficiency loans closed valued at more than $219.4 million' and 21,522 solar loans 'totaling more than $384.1 million' (W-NYS-GJGNY | PDF p.26, s.3.2.2). The 2024A pool's own split is not in any fetched document"
  - "Whether 2024A holds OBR loans: the minutes record the question, not the answer (W-NYS-MIN | p.4). OBR is the representative contract because CASE_SPEC_3 names it; a Smart Energy Loan (paid 'directly to NYSERDA's loan servicer', PDF p.23) would change collection_placement to operator_own"
  - "Preliminary vs final size: KBRA preliminary 'a $14.85 million term bond and nine serial bonds which total $30.88 million' with 42.77% enhancement; final '$15.38 million term bond' and 42.10% (W-KBRA-P; W-KBRA-F). The final figures match the Bond Sales Report"
  - "NYSERDA is both the homeowner's lender and the bond issuer. Under rule B2-R1 a government body that lends takes government_financier: 'a body corporate and politic, constituting a public benefit corporation' (W-NYS-MIN | p.7)"
  - "No determination_promise: the instalment is a fixed loan payment, not computed on savings or completion (F21 not triggered). Savings are estimated before signing for eligibility only (savings_basis)"
  - "Energy audit: 'a customer must have a qualified energy audit' (W-NYS-GJGNY | PDF p.23). An eligibility condition before the loan; the auditor makes no promise inside this contract, so it is not a party"


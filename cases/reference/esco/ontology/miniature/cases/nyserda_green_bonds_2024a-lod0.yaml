commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: funding_promise
    from: nyserda
    to: homeowner
    status: generic
    funding_instrument: loan   # GJGNY loan
    what: "a GJGNY loan for 'residential energy efficiency measures, photovoltaic (\"PV\") systems, air source heat pumps' (minutes | p.7); sized as 'total project cost minus any NYSERDA, utility, or other available incentives' (GJGNY report | PDF p.23)"

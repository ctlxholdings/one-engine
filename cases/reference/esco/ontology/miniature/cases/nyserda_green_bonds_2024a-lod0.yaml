    what: "counter-promise required by duality; source silent (trustee fees)"
    established_by: indenture

settings:   # the 13 LOD 0 facets, in vocabulary order (payment_basis added 1 Oct, owner ruling)
  payment_basis: {value: asset, status: inferred, why: "No Partner. c12: homeowner pays the contractor's project price from loan proceeds (GJGNY report PDF p.23); loan repayments (c2) do not depend on savings."}
  client_sector: {value: private, status: stated, why: "'one- to four-family residential energy improvements' (GJGNY report | PDF p.23)"}
  partner_form:
    value: corporate
    status: default
    why: "no Partner: no ESCO designs, guarantees or operates; the homeowner borrows from a public lender and hires a contractor. Default kept (as batch-2 light_motril)"
  borrower:
    value: client
    status: stated
    why: "the homeowner takes the loan (GJGNY report | PDF p.23). NYSERDA's own bond debt is funding one level up, recorded in c13-c14"
  receivable_holder:
    value: partner
    status: default
    why: "default; the payee is NYSERDA as lender and the payments are loan repayments, not EPC payments, so the value has no object (lod0_gaps). The pledge to the trustee is security, not an assignment: NYSERDA 'will pledge principal and interest payments ... as security for the Bonds' (minutes | p.7). Alternative assignee if a pledge is read as assignment"
  collection_placement:
    value: on_bill
    status: generic
    why: "programme-level (adjudicated from inferred to generic). OBR: 'repay through an installment charge on a bill from one of the involved electric or gas utilities' (GJGNY report | PDF p.23). Not shown for 2024A: OBR inclusion was an open question in April 2024 (minutes | p.4); KBRA's releases do not split the pool. on_bill was already used in batch 2 (eesl_ujala_onbill), so this choice changes no count"
  aggregation:
    value: pool
    status: stated
    why: "the bonds are 'a consumer solar loan and home improvement loan ABS transaction' over pledged loans (KBRA final release; minutes | p.7)"
  debt_seniority:
    value: senior
    status: inferred
    why: "one class of bonds, serial and term, 'all bonds supported by overall enhancement of 42.10%' (KBRA final release); no subordinate class is mentioned"
  assignment_recourse: {value: not_applicable, status: inferred, why: follows from receivable_holder = partner (nothing assigned; the loans are pledged)}
  savings_basis:
    value: deemed
    status: inferred
    why: "savings are only estimated before signing, for eligibility: 'estimated energy savings over the anticipated life of the improvements must be at least 80% of the total loan payments' (Smart Energy Loans) and OBR 'bill neutrality rules' (GJGNY report | PDF p.24), checked by a 'Web based ProForma tool'. Nothing is measured after; the payment does not depend on savings. Alternative measured (default) if the setting is read as having no object"
  grant_recipient:
    value: client
    status: generic
    why: "the loan finances 'total project cost minus any NYSERDA, utility, or other available incentives, grants, or rebates' (GJGNY report | PDF p.23): incentives go to the customer. Whether a given loan carries one is not stated; no giver is a party here"
  asset_owner:
    value: client
    status: inferred
    why: "a loan, not a lease: the homeowner buys the measures from the contractor with loan proceeds (PDF p.23)"
  bill_custody:
    value: client
    status: inferred
    why: "the homeowner keeps the utility account; the OBR instalment rides on that bill (PDF p.23)"

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments forecast over the EPC + (b) any government financing not repayable by the Partner (e.g. capital grant), else the EPC is ON BALANCE SHEET for government (E15 L2578-2582; the summary box L6932-6943 states the sum without the basis)
    applies_here: false
    this_case: private homeowners in the US; outside the EU
    source: E15 L2576-2582, L5363-5380 (EU vs government financing), L6930-6943; register constraints.entries.C1_eurostat
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: partner}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? The private-sector counterpart of C1: when the Partner owns the installed assets during the term and the client pays for their use, the payments may be a lease liability on the client's balance sheet. Corpus: E02 L3293-3295 ('renewed interest for EnPC and EEaaS after leasing has been categorized as on-balance in the IFRS rules')"
    applies_here: false
    this_case: asset_owner = client (a loan, not a lease)
    source: gaps G23; E02 L3293-3295; register.yaml L301 ifrs_16 flag
  NY_bonds_not_state_debt:
    scope: external-sectoral
    rule: "'The Bonds will not constitute a debt of the State of New York and the State of New York will not be liable thereon' (W-NYS-MIN | p.10, s.8)"
    applies_here: true
    source: W-NYS-MIN p.10
  bond_issue_limits:
    scope: contractual

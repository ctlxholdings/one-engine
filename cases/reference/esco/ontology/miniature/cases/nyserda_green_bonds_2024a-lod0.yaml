parties:   # role from the 41 (a list = several roles, home role first; F13); groups computed from the role(s)
  homeowner:
    role: host
    groups: [demand]
    status: generic
    text: "'GJGNY offers three types of loans for one- to four-family residential energy improvements' (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/EDPPP/GJGNY/Annual-Report-GJGNY/2025-GJGNY-Annual-Report.pdf | PDF p.23, s.3.2). Not named; a representative borrower"
  nyserda:
    entity: nyserda
    role: government_financier
    groups: [public, capital, risk]
    status: stated
    name: New York State Energy Research and Development Authority (NYSERDA)
    text: "'a body corporate and politic, constituting a public benefit corporation' (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/About/Board-Governance/Board-and-committee-meetings/AFCMinutes/156th-Audit-and-Finance-Committee-Meeting-Minutes-42024.pdf | p.7). Lender to homeowners and issuer of the bonds; government_financier by rule B2-R1 (public body that lends)"
  utilities:
    role: [utility_supplier, collector_biller]   # G-B7M-02 (3 Oct): bills the OBR instalment and remits it to Concord for NYSERDA
    groups: [energy, collection]
    status: stated
    name: Central Hudson, Con Edison, LIPA, National Grid-Upstate, NYSEG, RG&E, Orange and Rockland
    text: "'The utilities then remit repayments to Concord, which coordinates data communications with each utility' (GJGNY report | PDF p.23, s.3.2). The homeowner's own utility is one of the seven"
  concord:
    entity: concord_servicing_corporation
    role: collector_biller
    groups: [collection]
    status: stated
    name: Concord Servicing Corporation
    text: "'Concord Servicing Corporation who will act as the loan servicer and will be the custodian of the original promissory notes' (minutes | p.8, Exhibit A)"
  carmel:
    entity: carmel_solutions
    role: backup_servicer
    groups: [collection]
    status: inferred
    name: Carmel Solutions LLC
    text: "'Carmel Solutions LLC has been authorized to serve as back up loan servicer for all other portfolio loans' (minutes | p.10, s.6). 'Other' = loans not pledged to pre-2023A series, so 2024A (inferred)"
  slipstream:
    entity: slipstream_group
    role: originator_developer
    groups: [delivery]
    status: stated
    name: Slipstream Group Incorporated d/b/a Energy Finance Solutions
    text: "'Slipstream reviews applications and originates loans on behalf of NYSERDA pursuant to underwriting criteria established by NYSERDA' (GJGNY report | PDF p.23). A loan originator, the nearest of the 41 (lod0_gaps)"
  contractor:
    role: epc_contractor
    groups: [delivery]
    status: generic
    text: "'disburses proceeds to the contractor from a cash advance pool provided by NYSERDA to Slipstream' (GJGNY report | PDF p.23); 'contracts between customers and contractors' (same page). Works for the client, not a Partner (batch-2 touch-up 'for the Partner or the client')"
  bondholders:
    role: lender
    groups: [capital]
    status: stated
    text: "Buyers of the $46,260,000 Series 2024A bonds (https://www.nyserda.ny.gov/-/media/Project/Nyserda/Files/Publications/Annual-Reports-and-Financial-Statements/2025-03-31-Annual-Bond-Sale-Report-and-Schedule-of-Bonds-Outstanding.pdf | p.3). Not named; 'offer the Bonds to the public' (minutes | p.8)"
  bny_mellon:
    entity: bny_mellon
    role: account_bank_trustee
    groups: [collection]
    status: stated
    name: The Bank of New York Mellon
    text: "'between the Authority and The Bank of New York Mellon, as trustee (the \"Trustee\")' (minutes | p.7, Exhibit A)"


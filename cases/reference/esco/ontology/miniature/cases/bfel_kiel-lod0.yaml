    applies_here: true
    this_case: 'public client in Germany, an EU member at close (2005-08-01). The test is triggered but its outcome is undetermined: the operational payments
      are not published. Only the guarantee (228,000 EUR/yr over a 9-year phase) and the investment (720,000 EUR) are printed.'

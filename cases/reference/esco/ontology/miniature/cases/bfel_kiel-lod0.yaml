source:
  id: DENA
  title: Anwendungsbeispiele von Energiespar-Contracting (dena Kompetenzzentrum Contracting), entry 'Bundesforschungsanstalt für Ernährung und Lebensmittel
    Kiel'
  publisher: Deutsche Energie-Agentur GmbH (dena), Kompetenzzentrum Contracting
  passage: 'https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | entry ''Bundesforschungsanstalt für Ernährung
    und Lebensmittel Kiel'': intro text, Basisdaten, Projektbeteiligte, Weitere Daten, Liegenschaft(en), Maßnahmen, Merkmale. Re-fetched 1 Oct 2026 by the
    reviewer (curl, tags stripped); every quote below asserted as a substring of that text'
  oracle: none external. Internal checks in numbers.checks re-compute the printed percentage, the phase length and the Merkmale size classes from the page's
    own figures
  context:
  - 'Deutsche Energie-Agentur GmbH (dena) is listed under Beratung (''Beratung Deutsche Energie-Agentur GmbH (dena)'', [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/
    | Bundesforschungsanstalt für Ernährung und Lebensmittel Kiel > Projektbeteiligte]). An adviser with no promise stated on the page: context, not a party
    (standing ruling on advisers and energy agencies)'
  - 'End user: a federal research institute; one property of seven buildings (''Die Bundesforschungsanstalt für Ernährung und Lebensmittel (BFEL) ist eine
    Forschungseinrichtung im Geschäftsbereich des Bundesministeriums'', [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/
    | Bundesforschungsanstalt für Ernährung und Lebensmittel Kiel > Liegenschaft(en)]). It signs nothing and promises nothing on the page; the named client
    contracts for it, which the authority definition covers (''for itself or other public bodies''). Not encoded as occupant'
  - dena is also the publisher of the page. No funder, bank, guarantor or verifier is named in the entry; nothing is added
  notes:
  - 'Payment mechanics are not on the page for this entry: no remuneration, schedule, shortfall rule or measurement method. The page''s general text says
    only ''Die Realisierung von Projekten durch einen Energiespar-Contractor führt in der Regel zu höheren Einsparungen, die zusätzlich noch vertraglich
    garantiert werden.'' [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | page intro > ESC für die öffentliche
    Hand]'
  - 'Construction-cost subsidy flag: ''mit Baukostenzuschuss: nein'' [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/
    | Bundesforschungsanstalt für Ernährung und Lebensmittel Kiel > Merkmale]. No subsidy on this project'
  - 'Savings percentage: 228,000 / 548,000 = 41.61% vs 41.6% printed: closes to one decimal'
  - 'The entry''s prose gives the same figure rounded: ''wurden die Energiekosten um 42 Prozent reduziert''; it rounds the printed 41,6 percent'
  - 'Budget relief ''Haushaltentlastung: 77.000 Euro pro Jahr'' [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/
    | Bundesforschungsanstalt für Ernährung und Lebensmittel Kiel > Weitere Daten]. Read as the part of the saving the client keeps after paying the contractor,
    from the page''s own use of the term on another entry: ''Das führt dazu, dass keine Haushaltsentlastung möglich ist, sondern aufgrund des großen Anlagenbestandes
    eine Zuzahlung benötigt wird.''. This reading is inferred, and the difference to the guarantee is a check, not a published payment'

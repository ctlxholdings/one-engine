# Miniature: Bundesforschungsanstalt für Ernährung und Lebensmittel Kiel (Gebäudemanagement Schleswig-Holstein, Zweigniederlassung Kiel / HOCHTIEF Energy Management GmbH), German guaranteed-savings energy-saving contract, expressed at ESCO LOD 0

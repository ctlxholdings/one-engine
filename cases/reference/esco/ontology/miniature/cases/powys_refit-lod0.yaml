  c1:
    family: performance_promise
    from: vital
    to: health_board
    status: stated
    what: "installs 'solar panels, LED lighting, improving insulation, pipework, etc.' [LP | The solution] and guarantees 'double digit carbon and energy savings' [The impact, Anthony Fenn]. Shortfall make-good inside this promise; level and term not printed"
    established_by: epc_contract
  c2:
    family: payment_promise
    from: health_board
    to: vital
    status: inferred
    what: "pays the contractor for the works and service; inferred from the Board securing GBP 4.3m 'including VAT and fees' to carry out the works. Basis, amount and schedule not printed"
    established_by: epc_contract
  c3:
    family: determination_promise
    from: unstated
    to: [health_board, vital]
    status: unstated
    determines: savings   # savings against the guarantee
    what: "establishes the savings against the guarantee (F21); the ITT asked for 'measured and verified' improvements [LP | The solution] but names no verifier"
    established_by: epc_contract
  c4:
    family: funding_promise
    from: salix
    to: health_board
    status: inferred
    what: "provides GBP 4.3m incl. VAT and fees [LP | The solution]. Typed funding on the programme name 'Invest to Save'; loan or grant not stated. Alternative: non-repayable (then benefit_promise, grant_recipient client)"
    established_by: salix_funding
  c5:
    family: payment_promise
    from: health_board
    to: salix
    status: unstated
    what: repayment if c4 is a loan; terms not stated
    established_by: salix_funding


# Miniature — Powys Teaching Health Board (NHS Wales) RE:FIT energy performance contract with Vital Energi, funded by Salix Finance
# ('Invest to Save', GBP 4.3m incl. VAT and fees), tendered 2022, works from late 2024, expressed at ESCO LOD 0.
#
# Batch 5 FINAL, pair D (reviewer rev-D, 1 Oct 2026) from writers D-X and D-Y. Base: Y (fuller reading of the page), with Local
# Partnerships moved to context and the framework flag set from the page's own words. Rulings applied: REVIEW_SPEC_5, RULINGS.md, ENCODING.md.
# Evidence: one public web page, re-fetched 1 Oct 2026 (direct download returns HTTP 403; read through WebFetch asking for the verbatim body),
#   [LP] https://localpartnerships.gov.uk/2026/06/29/refit-case-study/ | <heading: intro, The challenge, The solution, The impact>
# Author 'Huw Russell, Director'; date from the URL (29 June 2026). Quotes are 25 words or fewer. Nothing from memory.


  title: "RE:FIT case study: Powys Teaching Health Board"
  publisher: Local Partnerships (written by Huw Russell, Director)
  passage: "https://localpartnerships.gov.uk/2026/06/29/refit-case-study/ | intro; The challenge; The solution; The impact"
  oracle: "one deal figure: 'Funding of £4.3 million (including VAT and fees) was secured from Salix Finance' [LP | The solution]; savings only 'double digit'"
  context:
  - "Local Partnerships: the ITT was produced 'with the support of Local Partnerships'; a 'Local Partnerships technical reviewer had approved' the HLA and it 'reviewed' the IGP [LP | The solution]. Adviser and framework facilitator; acts are stated, no promise to a deal party is. Context under the ruling on advisers (Y had it as facilitator with a promise)"
  - "Welsh Government Energy Service: 'recommended that Powys speak to Local Partnerships about the Re:fit framework' and Salix [LP | The solution]. Adviser, context"
  - "Welsh Government: 'The funding from the Welsh Government has been very helpful' [LP | The impact, Anthony Fenn]. Source of the money Salix channels; one funding party (Salix) is encoded, the government stays context"
  - "Local contractors were used for the works [LP | The solution]: unnamed subcontractors, below LOD 0"
  notes:
  - "Framework-level figures are not this deal's: 'over 515ktCO2e' and 'over £30m per annum' are the RE:FIT framework since 2016 [LP | intro]"
  - "The GBP 4.3m is the funding secured, gross of VAT and fees; the page does not call it the investment or the contract price"
  - "Dropped from writer X: the phrase 'Asset ownership terms: not addressed' is not on the page (fetch-tool artefact); X's securitisation reason mentioned a 'dena entry' (copy error)"
  - "Not on the page: contract date, term, price or fee mechanism, guarantee level, verifier, loan or grant, rate"


  reason: No vehicle, receivable sale or note issue; the only funder is Salix.
- item: hedge_counterparty
  kind: role
  used: false
  reason: No interest rate or hedge stated; whether the Salix money is a loan is not stated.
- item: authority_guarantor
  kind: role
  used: false
  reason: "Nobody guarantees the Health Board's payments; Salix funds, it does not guarantee."
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: Title not stated (fallback client); no third-party holder.
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The guarantee covers 'performance and savings', but nothing says the Board pays for a non-savings level; forcing performance would invent a fact."


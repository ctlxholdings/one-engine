# Miniature — Odisha greenfield street lighting PPP for 113 Urban Local Bodies (RFP and draft SIOM agreement, 22 May 2018),
# expressed at ESCO LOD 0
#
# Batch 5 FINAL (reviewer rev-E, 1 Oct 2026), reconciled from writers E-X and E-Y. Base: E-Y (it read the RFP body as well as the
# draft agreement); E-X's clause detail on the ULB receivables undertaking, the escrow prefund and the Transaction Advisor's name added.
# Evidence re-fetched 1 Oct 2026 (curl, pdftotext; both issuer URLs return HTTP 200). Cited '<url> | <clause, page>', quotes exact, 25 words or fewer.
#   [RFP]  http://www.ouidf.in/pdf/20180522_RFP_Odisha-113ULBs-Greenfield-PSL-23052018.pdf  (RFP dt. 22.05.2018, 90 pages)
#   [SIOM] http://www.ouidf.in/pdf/20180522_SIOM-Agreement_Odisha-113ULBs-Greenfield-PSL-23052018.pdf  (draft SIOM Agreement, 125 pages)
#   The row's World Bank copies (ppp.worldbank.org) sit behind a bot check (HTTP 403); the issuer's copies carry the same title and date.
# EVIDENCE GRADE: both documents are bidding documents (a draft contract form). No bidder, no signature, no annuity amount ('INR. [●]').
# Every value marked stated is stated in the draft form, not in an executed contract.

miniature: odisha_113ulb_street_lighting
lod: 0
case: batch5.D20
case_kind: programme   # one tender, five cluster contracts for 113 ULBs; encoded as one representative cluster contract (draft form)
in_scope: true
in_scope_why: "The Project SPV installs LED street lighting ('Adoption of LED based energy efficient technology' [RFP | cl.1.2(b), p.11]) and runs it for 7 years from COD for an annuity whose last 25% is released only 'upon verifying adherence of the Project SPV to performance standards set out at Schedule 5' [SIOM | cl.13.2(d), p.34] and which is reduced by availability damages deducted 'from the payments due to the Project SPV' [SIOM | Sch.6 s.2.2, p.98]. Payment on a service level, not on asset alone, so an ESCO deal under ruling 1 (payment_basis != asset). Draft form only"

tests_unused:   # CASE_SPEC_5 list
- item: payment_basis=performance
  kind: setting_value
  used: true
  reason: "Exercised, provisionally (draft form, mixed payment). The annuity is paid quarterly against a statement 'evidencing adherence by the Project SPV of the performance standards set out at Schedule 5' [SIOM | cl.13.2(a), p.33]; the standard is availability ('Non-working lamp hours ... within a limits of 5% (i.e. 95% availability)', Sch.5); a miss costs '3 X % Slippage X Monthly O&M Fee', deducted from the payments [SIOM | Sch.6 s.2.2, p.98]. A level that is not savings (greenfield: no baseline). Strict caveat: the annuity covers 'the portion of equity contribution of the Selected Bidder and O&M fee payments' [RFP | cl.1.3(b), p.12] and 90% of capex is a capital subsidy paid on commissioning (asset). The performance-linked share is the smaller money flow; payment_basis takes the recurring term payment (gaps G-E1). Status inferred"
- item: authority_guarantor
  kind: role
  used: false
  reason: "NOT exercised (both writers said true; overruled). Clause: 'the Authority shall immediately on demand make such payment as if it were the principal obligor' [SIOM | cl.15.2, p.37], for the ULBs' annuity, after escrow falls to 3 months' annuity, capped at 50% of the annual annuity. The guarantor is DMA, which is itself 'the Authority', a signatory and a payer under the same contract (capital subsidy, 25% of every annuity). It backs its own co-obligors, the ULBs it supervises; it is not a body other than the client. Recorded as a risk_promise between client-side parties (c16); no third party guarantees the client's payments"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No notes, pool or receivables vehicle; the Project SPV is the Partner. Assignment needs consent [SIOM | cl.4.3(g)(iii)]"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No hedge and no debt on the Partner side: 'No debt shall be raised to finance the Selected Bidder's contribution' [RFP | cl.1.3(b), p.12]"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "Title to the equipment 'shall vest with the Project SPV during the entire Term' [SIOM | cl.4.5(a), p.22]: the Partner, not a third party"

source:   # where the facts come from; context = actors outside the deal boundary (F23); notes = observations that are not gaps
  id: RFP+SIOM
  title: "Greenfield Street Lighting Project for 113 ULBs in Odisha on PPP basis: Request for Proposal and draft SIOM Agreement (22 May 2018)"
  publisher: "Odisha Urban Infrastructure Development Fund (OUIDF), Housing and Urban Development Department, Government of Odisha, for DMA Odisha and the 113 ULBs"
  passage: "http://www.ouidf.in/pdf/20180522_RFP_Odisha-113ULBs-Greenfield-PSL-23052018.pdf | cl.1.1-1.3, 15.1 (pp.11-14, 30). http://www.ouidf.in/pdf/20180522_SIOM-Agreement_Odisha-113ULBs-Greenfield-PSL-23052018.pdf | Definitions; cl.2.2, 4.3, 4.5, 4.6, 7.1, 10.3, 12.1, 13, 14, 15; Sch.5; Sch.6; Annex 2"
  oracle: "RFP cl.1.3(b): subsidy 90% + bidder equity 10% = 100% of project cost; RFP cl.15.1 'INR 5,000,000 (Rupees Fifty Lakhs)': 50 x 100,000 = 5,000,000 (closes)"
  context:
  - "Deloitte Touché Tohmatsu India LLP is named as 'the Consultant ... appointed by OUIDF' in the Transaction Advisor definition [SIOM | Definitions]; encoded as the verifier (it validates installation), its advisory role on the bid is context"
  - "The electricity distribution company: the ULB 'shall be responsible and make the investments for power supply arrangements till the input of feeder panel' [SIOM | cl.10.3(c)]. The Discom makes no promise in the draft: context"
  - "Government of Odisha / HUDD: hosts OUIDF and authorised it to run the bid [RFP | cl.1.1, p.11]. Rule setter, no promise of its own"
  - "Predecessor five-city project (2016, EESL 26% of the SPV) is a different deal (IFC brief read by E-Y); not encoded"
  notes:
  - "Row check: '90% capital subsidy + 10% bidder equity', 'no debt allowed', 'term 7 years from COD', 'availability above 95%', 'bid security INR 5,000,000' all verified in the issuer's RFP and draft (E-X could not read the RFP and left three of them unverified; E-Y's reading confirmed by the reviewer). 'No guarantor seen' is wrong: cl.15 has an Authority backstop, ruled not an authority_guarantor"
  - "The annuity is defined as 'INR. [●] per month' [SIOM | Definitions] but paid 'on a Quarterly basis' [SIOM | cl.13.1(b)]: a monthly amount paid quarterly; not resolved in the draft"
  - "The escrow account's own text says it 'shall serve to secure the Authority's payment obligations towards the Project SPV' [SIOM | Annex 2, recital C]; Annex 2 has the Authority keep 6 months of annuity in it, cl.2.2(e)(iv) has the ULBs deposit 6 months. The draft is inconsistent on who funds the annuity reserve; both are client-side"

jurisdiction:   # header field, not a setting; dated at financial close
  country: India (Odisha)
  iso: IN
  eu_member: false
  client_eu_general_government_at_close: false
  as_of: "no financial close: RFP of 22 May 2018, draft SIOM '[●] 2018'"
  status: stated
  why: "Government of Odisha bodies [RFP | cover, cl.1.1]. Not EU; C1 does not apply"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: the SIOM Agreement, the Escrow Agreement, the Performance Bank Guarantee, the OUIDF funding, the shareholders' agreement and the advisor's appointment each establish (fibo-fnd-rel-rel:confers) their commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 37 (a list = several roles, home role first); groups computed from the role(s)
  dma:
    entity: government_of_odisha
    role: authority
    groups: [demand, public]
    status: stated
    name: Directorate of Municipal Administration (DMA), Odisha
    text: "'DIRECTORATE OF MUNICIPAL ADMINISTRATION ... (hereinafter referred to as the Authority)' [SIOM | parties, p.1]. Signs, pays its share of the capital subsidy and 25% of each annuity, certifies commissioning, and backstops the ULBs' annuity (c16). Its backstop does not make it an authority_guarantor: it is the contract's own Authority"
  ulbs:
    role: authority
    groups: [demand, public]
    status: stated
    name: the Urban Local Bodies of the cluster ('ULBS REPRESENTING CLUSTER')
    text: "Third signatory group [SIOM | cover]; 113 ULBs in five clusters [RFP | cl.1.2, p.11]; pay 75% of each annuity [SIOM | cl.13.2(c)], supply the power, back the annuity with their receivables [SIOM | cl.10.3]. One party for the cluster's ULBs"
  ouidf:
    entity: ouidf
    role: government_financier
    groups: [public, capital, risk]
    status: stated
    name: Odisha Urban Infrastructure Development Fund (OUIDF)
    text: "set up by the State 'to develop and finance urban infrastructure projects' [RFP | cl.1.1, p.11]; grants to DMA and loans to the ULBs fund the subsidy [RFP | cl.1.3(b), p.12]. Rule B2-R1"
  project_spv:
    role: partner_esco
    groups: [partner]
    status: stated
    name: "Selected Bidder's Project SPV (not named: RFP stage)"
    text: "'The Selected Bidder will be required to create a Project SPV' [RFP | cl.1.3(b), p.12]; supplies, installs, operates and maintains the system for the Term"
  bidder_equity:
    role: equity_investor
    groups: [capital]
    status: stated
    name: the Selected Bidder (not named)
    text: "'The Selected Bidder shall contribute 10% of the Project Cost and shall bring in its entire contribution in the form of equity' [RFP | cl.1.3(b), p.12]"
  escrow_agent:
    role: account_bank_trustee
    groups: [collection]
    status: stated
    name: "a Scheduled Bank (not named)"
    text: "'appoint a Scheduled Bank as the escrow agent for the Project' [SIOM | cl.2.2(b)(i), p.14]"
  pbg_bank:
    role: surety_guarantor
    groups: [risk]
    status: stated
    name: "a Scheduled Bank with a branch in Bhubaneswar (not named)"
    text: "'a bank guarantee from a Scheduled Bank with a branch in Bhubaneswar ... to secure the due performance of the Project SPV's obligations' [SIOM | cl.12.1(a), p.32]"
  transaction_advisor:
    entity: deloitte_india_llp
    role: verifier_mnv
    groups: [verification]
    status: stated
    name: "Transaction Advisor appointed by OUIDF (Deloitte Touché Tohmatsu India LLP per the definition)"
    text: "the Authority gets 'the installation of the Equipment validated from a Transaction Advisor appointed by OUIDF' [SIOM | cl.7.1(a), p.27]"

contract:   # the agreements that establish the commitments
  siom:
    core: contract
    parties: [dma, ulbs, project_spv]
    status: stated
    note: "draft SIOM Agreement, 'executed separately for each of the five Clusters' [SIOM | cover note]; term '7 years from the Project COD' [SIOM | cl.4.6(a)]. Draft form"
  escrow_agreement:
    core: contract
    parties: [dma, ulbs, project_spv, escrow_agent]
    status: stated
    note: "Annex 2 form between Authority, SPV and Escrow Agent; the ULBs execute it too where an agent is appointed for them [SIOM | cl.2.2(e)(ii)-(iii)]"
  performance_bank_guarantee:
    core: contract
    parties: [pbg_bank, dma, project_spv]
    status: stated
    note: "Annex 3 form; 10% of the cluster's Total Capital Expenditure; charges borne by the SPV [SIOM | cl.12.1(a)]"
  ouidf_funding:
    core: contract
    parties: [ouidf, dma, ulbs]
    status: stated
    note: "grants to DMA, loans to the ULBs [RFP | cl.1.3(b)]; the funding documents are not in the bid documents"
  shareholders_agreement:
    core: contract
    parties: [bidder_equity, project_spv]
    status: stated
    note: "execution of the SHA and the share subscription is 'a condition precedent to the effectiveness of the respective SIOM Agreements' [RFP | cl.1.3(e), p.14]; SHA text not read"
  advisor_appointment:
    core: contract
    parties: [ouidf, transaction_advisor]
    status: inferred
    note: "the advisor is 'appointed by OUIDF' [SIOM | cl.7.1(a)]; appointment terms not in the documents"

commitments:   # the arrows of the LOD 0 map; family = one of the 7
  c1:
    family: performance_promise
    from: project_spv
    to: [dma, ulbs]
    status: stated
    what: "supplies, installs and commissions LED street lighting within 4 months of the Effective Date [SIOM | cl.3.1] and operates and maintains it for 7 years from COD at 95% availability and 48-hour fault repair [SIOM | Sch.5]. Delay and performance liquidated damages [SIOM | cl.14.1-14.2; Sch.6] stay inside this promise"
    established_by: siom
  c2:
    family: performance_promise
    from: [dma, ulbs]
    to: project_spv
    status: stated
    what: "grant the exclusive right to the Project [SIOM | cl.4.2(a)], a call-centre space free of cost [SIOM | cl.2.2(c)(i)] and power to the feeder panels [SIOM | cl.10.3(c)]; if power is missing 'the Authority shall continue to make the Annuity Fee for the relevant part' [SIOM | cl.14.2, p.36]"
    established_by: siom
  c3:
    family: payment_promise
    from: [dma, ulbs]
    to: project_spv
    status: stated
    what: "capital subsidy 'equal to an amount that shall reflect 90% of the Total Capital Expenditure' [SIOM | cl.13.1(a)(i), p.33], 30% prefunded in escrow and 70% progressively [SIOM | cl.13.1(a)(ii)], released after validation of installation and commissioning. An asset-type leg (LOD 1 event on completion)"
    established_by: siom
  c4:
    family: payment_promise
    from: ulbs
    to: project_spv
    status: stated
    what: "75% of each quarterly annuity 'within 3 Business Days of receipt of such Payment Statement' [SIOM | cl.13.2(c), p.34]; the annuity covers 'the portion of equity contribution of the Selected Bidder and O&M fee payments' [RFP | cl.1.3(b), p.12]; amount 'INR. [●]'. Default interest 12% a year [SIOM | cl.13.3]"
    established_by: siom
  c5:
    family: payment_promise
    from: dma
    to: project_spv
    status: stated
    what: "the remaining 25% of the annuity 'upon verifying adherence of the Project SPV to performance standards set out at Schedule 5' [SIOM | cl.13.2(d), p.34]; the Authority may set off 25% of the annuity against liquidated damages [SIOM | cl.13.4(a)]; performance damages are 'deducted by the Authority from the payments due' [SIOM | Sch.6 s.2.2]"
    established_by: siom
  c6:
    family: determination_promise
    from: dma
    to: [project_spv, ulbs]
    status: stated
    determines: acceptance   # Equipment Commissioning Certificate (SIOM cl.13.1(b)(ii))
    what: "verifies adherence to Schedule 5 before the 25% release and issues the Equipment Commissioning Certificate [SIOM | cl.13.1(b)(ii), 13.2(d)]; the annuity is based on capex 'as validated by DMA' [RFP | cl.2.4, p.16]; disputes on power availability are 'decided by the Authority' [SIOM | cl.14.2]. F21: c3 on completion, c5 on performance"
    established_by: siom
  c7:
    family: determination_promise
    from: transaction_advisor
    to: dma
    status: stated
    determines: acceptance   # validation for the Equipment Commissioning Certificate (SIOM cl.7.1(a))
    what: "validates the installed equipment 'for issuance of Equipment Commissioning Certificate' [SIOM | cl.7.1(a), p.27], which releases the capital subsidy"
    established_by: advisor_appointment
  c8:
    family: payment_promise
    from: ouidf
    to: transaction_advisor
    status: inferred
    what: "'All fees, costs, charges and expenses ... shall be borne by the Authority/OUIDF' [SIOM | cl.7.1(b), p.27]; OUIDF taken as payer because it appoints the advisor; amount not stated"
    established_by: advisor_appointment
  c9:
    family: benefit_promise
    from: ouidf
    to: dma
    status: stated
    what: "'grants received by the Authority from OUIDF' fund DMA's share of the subsidy [RFP | cl.1.3(b), p.12]; amount not stated"
    established_by: ouidf_funding
  c10:
    family: funding_promise
    from: ouidf
    to: ulbs
    status: stated
    funding_instrument: loan   # loan from OUIDF (RFP cl.1.3(b))
    what: "'contribution by ULBs from loan provided by OUIDF to the ULBs' [RFP | cl.1.3(b), p.12]; amount, tenor and rate not stated"
    established_by: ouidf_funding
  c11:
    family: payment_promise
    from: ulbs
    to: ouidf
    status: inferred
    what: "repayment of the OUIDF loans (counter to c10; terms not stated)"
    established_by: ouidf_funding
  c12:
    family: funding_promise
    from: bidder_equity
    to: project_spv
    status: stated
    funding_instrument: equity   # 10% of project cost as equity (RFP cl.1.3(b))
    what: "10% of the Project Cost as equity; 'No debt shall be raised to finance the Selected Bidder's contribution' [RFP | cl.1.3(b), p.12]"
    established_by: shareholders_agreement
  c13:
    family: payment_promise
    from: project_spv
    to: bidder_equity
    status: inferred
    what: "residual claim of the shareholder; the annuity is designed to return the equity portion [RFP | cl.1.3(b)]"
    established_by: shareholders_agreement
  c14:
    family: agency_promise
    from: escrow_agent
    to: [dma, ulbs, project_spv]
    status: stated
    what: "holds the escrow 'for the sole benefit of the Project SPV' [SIOM | Annex 2, cl.2.2] and releases the subsidy per the payment-statement procedure [SIOM | cl.13.8(d)]; holds the 6-month annuity deposit [SIOM | cl.2.2(e)(iv); Annex 2, cl.1.3.2]"
    established_by: escrow_agreement
  c15:
    family: payment_promise
    from: project_spv
    to: escrow_agent
    status: stated
    what: "the agent's fees 'shall be borne by the Project SPV' [SIOM | cl.13.8(b), p.35]; amount not stated"
    established_by: escrow_agreement
  c16:
    family: risk_promise
    from: dma
    to: project_spv
    status: stated
    cover_kind: guarantee   # the Authority pays as principal obligor (SIOM cl.15.2)
    what: "backstop of the ULBs' annuity: 'the Authority shall immediately on demand make such payment as if it were the principal obligor' [SIOM | cl.15.2, p.37], only after escrow recovery fails and the account 'has depleted to an amount equivalent to 3 Month's Annuity Fee'; capped at 50% of the annual annuity; paid within 30 Business Days of notice [SIOM | cl.15.3]. A co-obligor's backstop inside the client side, not an authority_guarantor (tests_unused)"
    established_by: siom
    covers: [R5a]
  c17:
    family: risk_promise
    from: ulbs
    to: dma
    status: stated
    what: "the ULBs give the Authority 'a legally binding undertaking to have access to their receivables' so it may 'encash the required amount from the receivables of such ULBs' on annuity default [SIOM | cl.10.3(a)-(b), p.29]: the client-side security behind c16 (an intercept of the ULBs' own money)"
    established_by: siom
    covers: [R5a]
  c18:
    family: risk_promise
    from: pbg_bank
    to: dma
    status: stated
    cover_kind: guarantee   # performance bank guarantee (SIOM cl.12.1)
    what: "performance bank guarantee of 10% of the cluster's Total Capital Expenditure, drawable 'on demand upon the Project SPV's failure to honour any of its obligations' [SIOM | cl.12.1(a),(c), p.32]"
    established_by: performance_bank_guarantee
    covers: [R2, R3, R5b]
  c19:
    family: payment_promise
    from: project_spv
    to: pbg_bank
    status: stated
    what: "'The charges for providing the Performance Bank Guarantee shall be borne by the Project SPV' [SIOM | cl.12.1(a), p.32]"
    established_by: performance_bank_guarantee

settings:   # the 13 LOD 0 facets, in vocabulary order
  payment_basis:
    value: performance
    status: inferred
    why: "the term payment (annuity, c4-c5) is gated on Schedule 5 availability and cut by availability damages [SIOM | cl.13.2(d); Sch.6 s.2.2]; no savings or kWh enters it. Inferred, not stated: draft form only, and the deal mixes legs: 90% of capex is an asset-type subsidy on commissioning (c3) and the annuity's capital part returns the 10% equity. Alternative: asset. Chosen on the recurring term payment, as for D21 and D23 (gap G-E1)"
  client_sector:
    value: public
    status: stated
    why: "a state directorate and municipal bodies [SIOM | parties]"
  partner_form:
    value: spv
    status: stated
    why: "'The Selected Bidder will be required to create a Project SPV' [RFP | cl.1.3(b), p.12]"
  borrower:
    value: client
    status: stated
    why: "the ULBs fund their subsidy share 'from loan provided by OUIDF to the ULBs' [RFP | cl.1.3(b)]; the Partner borrows nothing ('No debt shall be raised')"
  receivable_holder:
    value: partner
    status: default
    why: "no assignment; the SPV may not 'transfer, assign or novate' without consent [SIOM | cl.4.3(g)(iii)]"
  collection_placement:
    value: pledged_escrow
    status: inferred
    why: "the subsidy is paid through an escrow that 'shall serve to secure the Authority's payment obligations towards the Project SPV' [SIOM | Annex 2, recital C]; the annuity itself goes 'to the designated account of the Project SPV' [SIOM | cl.13.2(c)], with the escrow as reserve. Inferred: the escrow carries the subsidy and the security, not every payment"
  aggregation:
    value: pool
    status: inferred
    why: "113 ULBs pooled into five clusters under one tender, several public bodies in one contract [RFP | cl.1.2; SIOM | cover note]. Alternative none (each cluster contract stands alone)"
  debt_seniority:
    value: senior
    status: default
    why: "no Partner debt; the ULBs' OUIDF loans carry no stated rank"
  assignment_recourse:
    value: not_applicable
    status: default
    why: "nothing assigned"
  savings_basis:
    value: measured
    status: default
    why: "not applicable (payment_basis performance); vocabulary default"
  grant_recipient:
    value: client
    status: stated
    why: "OUIDF grants go to the Authority [RFP | cl.1.3(b)] (c9)"
  asset_owner:
    value: partner
    status: stated
    why: "'shall vest with the Project SPV during the entire Term' [SIOM | cl.4.5(a), p.22]; vests in the Authority at the end (LOD 1)"
  bill_custody:
    value: client
    status: inferred
    why: "the ULBs provide and pay for power to the feeder panels [SIOM | cl.10.3(c), 14.2]; the Discom bill is not named in terms"

rules:   # beside the tree
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU at close}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments + (b) non-repayable government financing, else ON BALANCE SHEET for government (E15 L2578-2582)
    applies_here: false
    this_case: "public client in India, not EU"
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: [partner, lessor, vehicle]}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? Private counterpart of C1"
    applies_here: false
    this_case: "client is public (asset_owner partner would otherwise trigger it)"
    source: E02 L3293-3295; RULINGS 7

numbers:   # published figures with units; derived values with arithmetic
  rfp_date: 2018-05-22                         # [RFP | cover]
  term_years_from_cod: 7                       # [SIOM | cl.4.6(a)]
  scod_months_from_effective_date: 4           # [SIOM | cl.3.1]
  clusters: 5                                  # [RFP | cl.1.2]
  ulbs: 113                                    # [RFP | cl.1.1-1.2]
  districts: 30                                # [RFP | cl.1.2]
  capital_subsidy_pct_of_project_cost: 90      # [RFP | cl.1.3(b); SIOM | cl.13.1(a)(i)]
  bidder_equity_pct_of_project_cost: 10        # [RFP | cl.1.3(b)]
  availability_pct_min: 95                     # [SIOM | Sch.5]
  fault_repair_hours: 48                       # [SIOM | Sch.5]
  availability_damage: "3 x % slippage x monthly O&M fee, per 1% beyond 2% non-working lamp hours"   # [SIOM | Sch.6 s.2.2]
  delay_damages_inr_lakh_per_week: {weeks_1_to_4: 1, to_120_days: 5}   # [SIOM | Sch.6 s.1]
  bid_security_inr: 5000000                    # [RFP | cl.15.1, p.30]
  performance_bank_guarantee_pct_of_total_capex: 10   # [SIOM | cl.12.1(a)]

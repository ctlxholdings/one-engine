  - {category: R2, driver: null, bearer: [partner_esco, authority], share: shared, status: stated, evidence: "http://www.ouidf.in/pdf/20180522_SIOM-Agreement_Odisha-113ULBs-Greenfield-PSL-23052018.pdf | the Project SPV shall reinstate the Project Street Light Points at its own cost", why: "SIOM cl.4.3(e): the SPV reinstates lost or damaged points at its own cost (recovering from its insurance) and pays O&M shortfall damages (cl.14.2, line 172). The Authority carries named slices: a theft-driven premium increase is refunded (cl.4.3(e)); when power to the feeder panels fails, damages are waived and the annuity keeps running (cl.14.2, line 179); force-majeure restoration cost is shared equally (cl.19.6(a)). Draft B (six R2 rows) merged into one row; draft A had the same split."}
  - {category: R3, driver: null, bearer: [partner_esco], share: sole, status: stated, evidence: "http://www.ouidf.in/pdf/20180522_SIOM-Agreement_Odisha-113ULBs-Greenfield-PSL-23052018.pdf | it shall pay liquidated damages to the Authority", why: "SIOM cl.14.1: the SPV pays delay damages if COD slips, except for client-side and force-majeure causes. Same bearer as the default but stated, so kept (draft B). Draft A's 90/10 overrun split (subsidy = 90% of capex 'as confirmed and approved by respective ULBs and the Authority') not adopted: approval is discretionary, so an overrun is not shown to move to the client."}
  - {category: R5a, driver: null, bearer: [authority, partner_esco], share: shared, status: stated, evidence: "http://www.ouidf.in/pdf/20180522_SIOM-Agreement_Odisha-113ULBs-Greenfield-PSL-23052018.pdf | Authority's guarantee obligations under this Clause 15 shall not exceed", via: [c16, c17], why: "SIOM cl.15: the ULBs guarantee their annuity and DMA (also role authority) pays on demand as principal obligor once escrow drops to 3 months, each capped at 50% of the annual annuity; unpaid annuity above the caps stays with the SPV. The default (lender, because the ULBs borrow from OUIDF) is wrong here: OUIDF funds the subsidy, not the SPV's receivable. Both drafts agree."}
  - {category: R6, driver: law, bearer: [partner_esco, authority], share: shared, status: stated, evidence: "http://www.ouidf.in/pdf/20180522_SIOM-Agreement_Odisha-113ULBs-Greenfield-PSL-23052018.pdf | the Project SPV shall bear any increased cost or loss of operating cash flow", why: "SIOM cl.17.1(c),(f): under a qualifying change in law the SPV bears cost up to the Threshold Limit (10% of the cluster's capex) and the Authority above it; new or changed taxes are 'to the account of and payable by the Authority' (cl.13.5(a)). Both drafts agree on the split (B wrote the tax part as a second row; merged)."}

in_scope_why: 'A named, signed energy-saving contract (''Contracting-Modell: Energiespar-Contracting''; ''Vertragsschluss: 01.05.2005'') in which the contractor
  guarantees a yearly energy-cost saving (''Einspargarantie: 75.000 Euro pro Jahr (22,0 Prozent)''). The client pays for an energy service tied to savings,
  so payment_basis = savings and the deal is in scope (EED Art. 2(27) via E02 L556-560)'

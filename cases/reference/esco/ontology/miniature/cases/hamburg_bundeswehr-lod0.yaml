source:
  id: DENA-ESC
  title: 'Energiespar-Contracting: Anwendungsbeispiele (dena project database, entry "Hamburg - Bundeswehr")'
  publisher: Deutsche Energie-Agentur (dena), Kompetenzzentrum Contracting; re-fetched by the reviewer 1 Oct 2026
  passage: https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | entry "Hamburg - Bundeswehr", blocks Basisdaten, Projektbeteiligte,
    Weitere Daten, Maßnahmen, Merkmale
  oracle: 'none: a project data sheet, not the contract. Printed percentages re-computed in numbers.derived'
  context:
  - 'Deutsche Energie-Agentur GmbH (dena), Berlin: ''Beratung'' [https://www.dena.de/kompetenzzentrum-contracting/energiespar-contracting/anwendungsbeispiele/ | entry
    "Hamburg - Bundeswehr", Projektbeteiligte]. Adviser with no stated promise: context, not a party (ruling)'
  notes:
  - 'The row names the client ''Wehrbereichsverwaltung Nord, Kiel''; the page reads ''Wehrbereichsverwaltung Nord Außenstelle Kiel''. ''Auftraggeber: Bund'' names
    the legal person behind it; not a separate actor'
  - 'The row flagged 14,7 % as inconsistent with the EUR figures. On this entry it is consistent within rounding (numbers.derived). The neighbouring entry ''Hamburg
    - Bundesliegenschaften'' prints ''258.000 Euro pro Jahr (14,7 Prozent)'' on a 691.000 EUR base = 37,3 %: that entry carries the repeated percentage'
  - 'Measures: district-heat purchase terms, heat recovery, one control room for both barracks, pumps and fans, lighting, energy monitoring. No generation plant'
  - 'Payment mechanics, penalties, funding party: not on the page (row caveat confirmed)'

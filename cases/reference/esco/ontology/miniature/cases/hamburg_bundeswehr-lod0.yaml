rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when:
      client_sector: public
      jurisdiction: EU general government at close
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments forecast over the EPC + (b) any government financing not
      repayable by the Partner (an upfront grant or capital contribution at face value), else ON the government balance sheet (E15 L2578-2582)
    applies_here: true
    this_case: 'Applies (public client, Germany EU member at close). Outcome undetermined: operational payments and the discount rate are not published. No non-repayable
      government financing named (Baukostenzuschuss: nein). Undiscounted check only: 149.000 x 12 = 1.788.000 EUR guaranteed vs 1,2 Mio. EUR investment'
    source: 'E15 L2576-2582 (NPV basis); L5424-5429 (Box 7: the Authority''s capital contribution counted as government financing); L5466-5470 (milestone payments
      count); deal figures from the dena entry'
  IFRS16_lease_test:
    scope: accounting
    applies_when:
      client_sector: private
      asset_owner: not client
    rule: Is the client's contract a service agreement or a lease under IFRS 16? Applies when the client is private and someone other than the client owns the installed

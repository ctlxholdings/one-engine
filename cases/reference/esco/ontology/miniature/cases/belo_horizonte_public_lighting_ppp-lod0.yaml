# Miniature — Belo Horizonte public lighting administrative concession (PPP), Município de Belo Horizonte / BH Iluminação Pública S.A.,
# 20 years from 13 July 2016, expressed at ESCO LOD 0
#
# Batch 5 FINAL (reviewer rev-E, 1 Oct 2026), reconciled from writers E-X and E-Y (near-identical). Base: E-X (adds the Termo de Cessão);
# E-Y's verifier contract values and the PPP guarantee-fund decree added.
# Evidence re-fetched 1 Oct 2026 (curl, text extracted). Portuguese quotes kept in Portuguese, 25 words or fewer.
#   [RADAR] https://radarppp.com/resumo-de-contratos-de-ppps/iluminacao-publica-belo-horizonte/  (tracker reproducing Diário Oficial do Município extracts)
#   [BHIP]  https://www.bhip.com.br/consorcio-vence-licitacao-para-operar-rede-publica-de-iluminacao-em-bh/  (news item on the concessionaire's site, from O Tempo)
# EVIDENCE GRADE: secondary. The concession contract AJ 016/2016 was not retrieved; gazette extracts are treated as stated, news-only facts as generic.

miniature: belo_horizonte_public_lighting_ppp
lod: 0
case: batch5.D23
case_kind: deal   # one signed administrative concession, AJ 016/2016
in_scope: true
in_scope_why: "Concession for 'desenvolvimento, modernização, ampliação, eficientização energética, operação e manutenção da Rede Municipal de Iluminação Pública' [RADAR | summary], paid by a monthly 'contraprestação' whose calculation rests on a 'sistema de mensuração de desempenho' audited by an independent verifier [RADAR | entry 22/11/2023]. Efficiency is a stated object; payment is on performance. An ESCO deal under ruling 1"

tests_unused:
- item: payment_basis=performance
  kind: setting_value
  used: true
  reason: "Exercised on secondary evidence. The verifier's contract covers 'a avaliação do sistema de mensuração de desempenho, no cálculo da contraprestação mensal' [RADAR | entry 22/11/2023]: the monthly payment is computed with a performance measurement. No baseline, savings share or per-kWh price appears. Indicators and deductions are in the unread contract; the 45% energy-bill cut [BHIP | para 2] is a design requirement (generic). Status inferred"
- item: authority_guarantor
  kind: role
  used: false
  reason: "Caixa is 'instituição financeira depositária para gerenciar as contas vinculada e reserva' [RADAR | entry 29/12/2016]: a depositary of accounts set up under a contract with the municipality. A reserve the client funds and a bank that holds it is account_bank_trustee, not a guarantor. Municipal Decree 16.107/2015 allows 'constituição de Fundo Garantidor de PPPs' [RADAR | entry 10/10/2015]: a general option, not tied to this contract and not a body promising to pay"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "the SPE is the Partner; no vehicle or notes"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "no financing described"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "title not stated; no third-party holder"

source:
  id: RADAR+BHIP
  title: "Iluminação Pública (Belo Horizonte), Radar PPP; 'Consórcio vence licitação para operar rede pública de iluminação em BH'"
  publisher: "Radar PPP (Diário Oficial extracts); BHIP site (O Tempo)"
  passage: "https://radarppp.com/resumo-de-contratos-de-ppps/iluminacao-publica-belo-horizonte/ | summary; entries 10/10/2015 to 2025. https://www.bhip.com.br/consorcio-vence-licitacao-para-operar-rede-publica-de-iluminacao-em-bh/ | paras 1-6"
  oracle: "two bids printed in both sources: 4,551,740 - 4,158,076 = 393,664 = BHIP's 'R$ 393 mil' (closes)"
  context:
  - "EBP and PBH Ativos: project studies, reimbursed R$7,096,000.00 [RADAR | summary]. Pre-contract"
  - "Câmara Municipal: Lei 10.897/2015 authorises the PPP; Lei 10.894/2015 'institui a Contribuição para Custeio dos Serviços de Iluminação Pública' (COSIP) [RADAR | entries]. Rule sources"
  - "Electricity distributor (not named): its obligations on network operation are ceded to the concessionaire (c9); no promise of its own described"
  - "SUDECAP: intervening municipal body on the Caixa and verifier contracts; part of the client"
  notes:
  - "Row's 'named subcontractors' are the consortium members that form the concessionaire [RADAR | summary]; encoded as equity_investor (inferred), no works contract stated"
  - "Row's 'COSIP linked account': COSIP exists and Caixa manages 'contas vinculada e reserva', but no source links them. Not verified"
  - "Verifier values: AJ 34/2017 R$6,999,997.00 (60 months); DJ 074/2023 adjudicated R$4,249,313.00, extract signed R$3,820,636.90; a 12/07/2024 amendment corrected a value. Unreconciled"


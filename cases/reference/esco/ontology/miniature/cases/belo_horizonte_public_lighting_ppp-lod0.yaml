commitments:
  c1:
    family: performance_promise
    from: bh_ip
    to: municipality
    status: stated
    what: "develops, modernises, expands, makes more efficient, operates and maintains the municipal lighting network for 20 years [RADAR | summary]; about 178,000 points and a technology 'que garanta pelo menos 45% de redução na conta de energia paga pelo município nos primeiros cinco anos' [BHIP | para 2] (generic). Deductions stay inside this promise"
    established_by: concession
  c2:
    family: payment_promise
    from: municipality
    to: bh_ip
    status: stated
    what: "monthly 'contraprestação', winning bid R$4,158,076.00 [RADAR | entry 31/03/2016], computed with the performance measurement system (c3); contract value R$991,782,559.72. 2023 'Aporte de R$ 806.420,36' (LOD 1 event)"
    established_by: concession
  c3:
    family: determination_promise
    from: ernst_young
    to: [municipality, bh_ip]
    status: stated
    determines: other   # performance measurement for the monthly payment (availability, not savings)
    what: "'avaliação do sistema de mensuração de desempenho, no cálculo da contraprestação mensal, na aferição do cumprimento das demais obrigações' [RADAR | entry 22/11/2023] (F21)"
    established_by: verification_contracts
  c4:
    family: payment_promise
    from: municipality
    to: ernst_young
    status: stated
    what: "R$6,999,997.00 for 60 months (AJ 34/2017); R$3,820,636.90 for 60 months (DJ 074/2023) [RADAR | entries]"
    established_by: verification_contracts
  c5:
    family: agency_promise
    from: caixa
    to: [municipality, bh_ip]
    status: stated
    what: "'gerenciar as contas vinculada e reserva' with 'a mesma diligência que empregaria na gerência de seus próprios negócios' [RADAR | entry 29/12/2016]; funding, size and draw rights not stated"
    established_by: depositary_contract
  c6:
    family: payment_promise
    from: municipality
    to: caixa
    status: unstated
    what: "counter-promise required by duality: depositary fee and payer not stated"
    established_by: depositary_contract
  c7:
    family: funding_promise
    from: consortium_members
    to: bh_ip
    status: inferred
    funding_instrument: equity   # equity in the SPE
    what: "equity in the SPE carrying the estimated R$495,940,000.00 investment [RADAR | summary]; equity/debt split and lenders not stated"
    established_by: spe_shareholding
  c8:
    family: payment_promise
    from: bh_ip
    to: consortium_members
    status: inferred
    what: "residual claim of the shareholders"
    established_by: spe_shareholding
  c9:
    family: performance_promise
    from: municipality
    to: bh_ip
    status: stated
    what: "cedes 'as obrigações e prerrogativas firmadas com Empresa Distribuidora e relativas à operação da Rede Municipal de Iluminação Pública' [RADAR | entry 20/05/2017]"
    established_by: cession_term


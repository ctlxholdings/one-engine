# Miniature — Mercy Housing Lakefront retrofit, Chicago (the one completed pilot of the Chicago Multifamily Energy Retrofit Program):
# a 314-unit building retrofit under an energy performance contract, financed by a subordinated loan to the owner from a pilot fund
# whose first-loss reserve the City of Chicago and the MacArthur Foundation guarantee, expressed at ESCO LOD 0.
# Batch 7, group I, reviewer's reconciled file (writers X and Y), deal T03.
#
# Evidence: one local corpus text, Seeley and Bevington, "Making energy efficiency bankable", eceee 2013 Summer Study, paper 3-005-13, cited as
#   der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:<line> | <quote> (line numbers as grep -n counts them).
# The text is set in two columns, so a printed line may hold the end of one column and the start of the other; each quote sits on one column.
# Not under input-licensed/, so quotes may run to 25 words. Every fact carries its status: stated / inferred / default / generic / unstated.
# Status rule for this file: stated = said of the Mercy Housing project or of the pilot fund itself; inferred = taken from the six-step process
# that 'a project was required to follow' (L329-331) and applied to Mercy, the fund's only completed project.

miniature: mercy_housing_lakefront_chicago
lod: 0
case: batch7.T03
case_kind: deal   # one named 314-unit project; the lending framework's parties are not named
in_scope: true
in_scope_why: "A named building retrofit under an energy performance contract with a savings guarantee: der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:350 | '3. A performance guarantee of energy and water savings is'; the owner repays its loan from operating savings (L356-358). Project cost $537 thousand, saving $31 thousand a year (L331-332). Ruling 14: in scope; ESCO reading from payment_basis = savings"

tests_unused:
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "A 'managed credit pool advances funds' (L359-360), but no vehicle buys receivables or issues notes; the SPE appears only in the paper's separate managed-utilities model (L373-383)"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No hedge is mentioned"
- item: authority_guarantor
  kind: role
  used: false
  reason: "The City of Chicago and the MacArthur Foundation guarantee the lenders' first-loss reserve (L387, L322-323), which covers the lenders' loss on loans to owners, not the owner's payments to the ESCo under the contract. Encoded as risk promises to the lenders (government_financier and guarantee_facility, covers R5a)"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "The owner keeps title and the lender takes a 'third or fourth mortgage' (L354). Title held by an SPE belongs to the managed-utilities model (L381-382), not this deal"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The guarantee is of energy and water savings and repayment is 'based on expected operating savings' (L350, L356-357); no availability, output or comfort level is paid for"

single_source_exercised:   # terms in the CASE_SPEC_7 list that this deal uses
- term: debt_seniority=subordinated
  kind: setting_value
  evidence: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:354 | '4. A subordinated loan (third or fourth mortgage) for specified'"
  confirmed: true
  note: "Confirmed as the rank the lending model requires of every qualifying project's loan (L329-331, L354-356); inferred for the Mercy loan, which the paper does not describe. The loan is junior to the owner's existing first and second mortgages, debt outside the retrofit deal (L326-328); the definition's 'most junior debt in the deal' reads it as subordinated. Unlike batch-6 S04 (shareholder loan read from a category label), the source names the rank in terms"

source:
  id: ECEEE13
  title: "Making energy efficiency bankable — 'Energy performance lending' and 'Case study: Retrofit Chicago and the Chicago Infrastructure Trust'"
  publisher: "C. C. Seeley and M. Bevington, eceee 2013 Summer Study proceedings, paper 3-005-13, pp.627-635"
  passage: "L302-370 (energy performance lending and the six-step process, left column; reserve guarantee, Mercy pilot and open issues, right column L322-361); L373-387 (MERP and the pilot fund); L240-249 (EPC obligations); reference to the CCI case study at L537-541"
  oracle: "none, not a published validation target. The reserve ratio and project ratios re-added in numbers.derived"
  documents:
    ECEEE13: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt"
  context:
  - "Clinton Climate Initiative (CCI): 'CCI recruited a syndicate of community development lenders' to set underwriting rules (L383-385); the authors advised owners pro bono (L39-41). No fee, contract or promise to Mercy is stated: context, not a party (batch-5 ruling on advisers). Alternative: facilitator with a benefit_promise"
  - "MERP, 'conceived as a partnership between the Clinton Foundation and the Chicago Department of Housing' for 'privately owned, affordable, multi-unit' properties (L376-378). The Department of Housing is part of the City of Chicago, the same legal person as the guarantor; it makes no separate promise in this deal"
  - "Later Chicago programmes (commercial offices, Chicago Public Buildings Commission, Retrofit Chicago, Chicago Infrastructure Trust) replicated the framework (L336-346): other deals"
  - "The 'qualified energy services company' that performs the investment-grade audit (L347-348) is the project's ESCo; the audit sits inside c1, no separate energy_auditor party"
  - "CCI's 2009 case study 'Mercy Housing Lakefront Chicago, Illinois' (L537-538) is the paper's source for the project figures; not in the corpus"
  notes:
  - "The paper states the lending model as a six-step process (L329-370) and then reports the pilot: 'only an initial pilot was completed, a 314-unit project owned by Mercy Housing' (L329-330, right column). Facts from the six steps are inferred for Mercy. The Mercy loan's amount, rate, tenor and mortgage position, and the names of the ESCo, lenders, originator and M&V provider, are not given"
  - "Payment basis: the ESCo 'is paid for project on completion' (L364), a works price, while the owner repays the lender from operating savings that the ESCo's guarantee backs (L356-358, L368-370). Encoded savings, as espc_us (Montezuma-Cortez); alternative asset"
  - "First-loss reserve: $2.5 million against five lenders' $1 million each (L386-387) = 50 %, the 'fifty percent in the Chicago example' (L349-351). Two guarantors (L322-323); the split between them is not stated"

jurisdiction:
  country: United States
  iso: US-IL
  eu_member: false
  client_eu_general_government_at_close: false
  as_of: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:330 | 'Mercy Housing, which was contracted in November 2008 and'; completed in May 2009 (L331)"
  status: stated
  why: "Chicago, Illinois (L538); a private housing owner. Not an EU member; C1 does not apply"

core_v7:
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: each contract establishes (fibo-fnd-rel-rel:confers) its commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:
  mercy:
    entity: mercy_housing
    role: host
    groups: [demand]
    status: stated
    name: Mercy Housing (owner of the 314-unit project; CCI's case study is titled Mercy Housing Lakefront)
    text: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:329 | 'only an initial pilot was completed, a 314-unit project owned by'; L330 'Mercy Housing'. The owning legal person may be a project entity ('Mercy Housing Lakefront', L538); the paper names Mercy Housing. Private by programme: 'privately owned, affordable, multi-unit' properties (L378)"
  esco:
    role: partner_esco
    groups: [partner]
    status: inferred
    name: ESCo of the pilot (not named)
    text: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:352 | 'provided by the ESCO to the building owner for each quali-'; investment-grade audit 'performed by a qualified energy services company' (L348). Inferred for Mercy from the process the pilot followed"
  subcontractors:
    role: epc_contractor
    groups: [delivery]
    status: inferred
    name: ESCo's subcontractors (not named)
    text: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:362 | '5. The ESCO and its subcontractors under the energy per-' formance-contracting model 'make retrofit improvements' (L363-364)"
  providers_of_capital:
    role: lender
    groups: [capital]
    status: stated
    name: The pilot fund's providers of capital (a syndicate of community development lenders)
    text: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:386 | 'pilot fund consisted of five providers of capital contributing'; '$1 million each' (L387); 'community development lenders' (L384); 'a managed credit pool advances funds' (L359-360). That Mercy's loan came from this fund is inferred (the fund's only completed project)"
  originator:
    role: originator_developer
    groups: [delivery]
    status: inferred
    name: Originator of the loan (not named)
    text: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:356 | 'ing owner through an originator, with repayment based on'; the model is expected 'to be profitable for originators and loan investors alike' (L352-353)"
  verifier:
    role: verifier_mnv
    groups: [verification]
    status: inferred
    name: Independent M&V provider (not named)
    text: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:366 | '6. Independent measurement and verification (M&V) services'; 'provided under contract to validate savings' (L367-368). Who contracts it is not stated"
  city_of_chicago:
    entity: city_of_chicago
    role: government_financier
    groups: [public, capital, risk]
    status: stated
    name: City of Chicago (co-guarantor of the first-loss reserve, from a ratepayer-funded EE programme)
    text: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:322 | 'anteed by the City of Chicago from a ratepayer-funded EE'; the reserve is '$2.5 million' (L387). A public body that guarantees lenders: government_financier (financier or guarantor; batch-6 S01 precedent for a public guarantor)"
  macarthur:
    entity: macarthur_foundation
    role: guarantee_facility
    groups: [public, risk]
    status: stated
    name: MacArthur Foundation (co-guarantor of the first-loss reserve)
    text: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:323 | 'program and the MacArthur Foundation. By thinking about'. Its promise covers part of the lenders' credit loss on loans to clients, the guarantee_facility definition (widened 3 Oct, OI-3). Not grant_provider: nothing here is a grant"

contract:
  epc:
    core: contract
    parties: [esco, mercy]
    status: inferred
    note: "the project 'was contracted in November 2008 and completed in May 2009' (L330-331), stated; that the contract is an EPC with an ESCo guarantee comes from the process (L350-353, L362-365). Terms not published"
  subcontracts:
    core: contract
    parties: [esco, subcontractors]
    status: inferred
    note: "the ESCO 'and its subcontractors' make the improvements (L362-364)"
  loan_agreement:
    core: contract
    parties: [mercy, providers_of_capital]
    status: inferred
    note: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:311 | 'ing owner is the loan obligor and that the ESCO receives funds'; a subordinated loan made to the owner through an originator (L354-356). The Mercy loan's terms are not given"
  origination:
    core: contract
    parties: [originator, providers_of_capital]
    status: inferred
    note: "loans are made 'through an originator' (L356) 'under terms drawn up by the providers of capital' (L358-359); the originator's role and pay are not described"
  reserve_guarantees:
    core: contract
    parties: [city_of_chicago, macarthur, providers_of_capital]
    status: stated
    note: "'a $2.5 million first-loss reserve guar-anteed by the City of Chicago ... and the MacArthur Foundation' (L387, L322-323). The beneficiary, the pilot fund's providers of capital, follows from 'first-loss reserve' and from the credit-enhancement sentence (L323-327). Two guarantors, two promises, one contract"
  mv_contract:
    core: contract
    parties: [verifier, mercy]
    status: inferred
    note: "M&V services 'are provided under contract to validate savings' (L367-368); the owner is the inferred counterparty, since the guarantee and the shortfall payments run to the owner (L368-370)"

commitments:
  c1:
    family: performance_promise
    from: esco
    to: mercy
    status: inferred
    what: "investment-grade audit (L347-348) and retrofit of the 314-unit project, completed May 2009 with electricity use -30 %, gas use -12 %, CO2e -200 t a year (L331-334, stated); a performance guarantee of energy and water savings (L350-353) under which der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:368-370 | 'ESCOs must pay owners in cash for performance shortfalls in an amount sufficient to cover any loan repayments due.' The make-good stays inside this promise (G18)"
    established_by: epc
  c2:
    family: payment_promise
    from: mercy
    to: esco
    status: inferred
    what: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:364 | 'improvements. ESCO is paid for project on completion and'; the ESCo 'receives funds only as payment for completing project milestones' (L311-312). The project cost $537 thousand (L331); whether the price equals the cost is not stated"
    established_by: epc
  c3:
    family: determination_promise
    from: verifier
    to: [mercy, esco]
    status: inferred
    determines: savings   # independent M&V of savings (L366-368)
    what: "'Independent measurement and verification (M&V) services conforming to international standards are provided under contract to validate savings' (L366-368); the validated savings decide the ESCo's shortfall payments (L368-370). Independent of both parties"
    established_by: mv_contract
  c4:
    family: payment_promise
    from: mercy
    to: verifier
    status: unstated
    what: "fee for the M&V service; required by duality, the source gives no payer and no price"
    established_by: mv_contract
  c5:
    family: funding_promise
    from: providers_of_capital
    to: mercy
    status: inferred
    funding_instrument: loan   # subordinated loan (ECEEE13 L354-356)
    what: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:354-356 | 'A subordinated loan (third or fourth mortgage) for specified improvements on qualified projects is made to the building owner through an originator'; 'a managed credit pool advances funds' (L359-360). Amount for Mercy not given; the pilot fund held $5 million of lenders' capital (L386-387)"
    established_by: loan_agreement
  c6:
    family: payment_promise
    from: mercy
    to: providers_of_capital
    status: inferred
    what: "'owner repays lender directly' (L365), 'with repayment based on expected operating savings resulting from reductions in energy use and reflected in the performance guarantee' (L356-358). Schedule and rate not published"
    established_by: loan_agreement
  c7:
    family: performance_promise
    from: originator
    to: providers_of_capital
    status: inferred
    what: "originates the loan to the owner (L355-356) under the providers' terms (L358-359). Beneficiary read as the lenders; the owner is the alternative"
    established_by: origination
  c8:
    family: payment_promise
    from: providers_of_capital
    to: originator
    status: unstated
    what: "the model is expected 'to be profitable for originators' (L352-353), but the payer and the amount are not stated; required by duality"
    established_by: origination
  c9:
    family: risk_promise
    covers: [R5a]
    from: city_of_chicago
    to: providers_of_capital
    status: stated
    cover_kind: guarantee   # guarantee of the first-loss reserve (L322, L387)
    what: "guarantee of the pilot fund's $2.5 million first-loss reserve 'from a ratepayer-funded EE program' (L322, L387): credit enhancement for the lenders' loans to owners, so it covers R5a (client credit). The City's share is not given"
    established_by: reserve_guarantees
  c10:
    family: risk_promise
    covers: [R5a]
    from: macarthur
    to: providers_of_capital
    status: stated
    cover_kind: guarantee   # guarantee of the first-loss reserve (L322-323)
    what: "guarantee of the same first-loss reserve (L322-323); share not given"
    established_by: reserve_guarantees
  c11:
    family: payment_promise
    from: providers_of_capital
    to: city_of_chicago
    status: unstated
    what: "counter-promise required by duality; no guarantee fee is stated"
    established_by: reserve_guarantees
  c12:
    family: payment_promise
    from: providers_of_capital
    to: macarthur
    status: unstated
    what: "counter-promise required by duality; no guarantee fee is stated"
    established_by: reserve_guarantees
  c13:
    family: performance_promise
    from: subcontractors
    to: esco
    status: inferred
    what: "the retrofit works under the ESCo (L362-364)"
    established_by: subcontracts
  c14:
    family: payment_promise
    from: esco
    to: subcontractors
    status: inferred
    what: "price of the subcontracted works; not stated"
    established_by: subcontracts

settings:
  payment_basis:
    value: savings
    status: inferred
    why: "the owner's repayment is 'based on expected operating savings' and the ESCo's savings guarantee pays shortfalls 'sufficient to cover any loan repayments due' (L356-358, L368-370), while the ESCo 'is paid for project on completion' (L364), a works price. Same reading as espc_us; alternative asset"
  client_sector:
    value: private
    status: inferred
    why: "a housing owner in a programme for 'privately owned, affordable, multi-unit' properties (L378); the open-issues paragraph speaks of 'private building owners' (L349)"
  partner_form:
    value: corporate
    status: default
    why: "the ESCo is not named; no vehicle is described"
  borrower:
    value: client
    status: inferred
    why: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:311 | 'ing owner is the loan obligor and that the ESCO receives funds'; 'owner repays lender directly' (L365). Said of the lending model; inferred for the Mercy loan"
  receivable_holder:
    value: partner
    status: inferred
    why: "convention G17: the ESCo's receivable under the EPC is the works price paid on completion (L364); the owner's repayments are its own loan, not an assigned EPC receivable"
  collection_placement:
    value: operator_own
    status: default
    why: "'owner repays lender directly' (L365) is the owner paying its own debt; no escrow or on-bill route is described"
  aggregation:
    value: none
    status: inferred
    why: "one owner, one building, one EPC, one loan. The pilot fund was built to lend to many owners from one pool (L359-360, L386-387), but only this project was completed (L329); alternative pool"
  debt_seniority:
    value: subordinated
    status: inferred
    why: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:354 | '4. A subordinated loan (third or fourth mortgage) for specified'; required of every qualifying project (L329-331); the Mercy loan itself is not described. Alternative senior if the pilot departed from the model"
  assignment_recourse:
    value: not_applicable
    status: inferred
    why: "follows from receivable_holder = partner"
  savings_basis:
    value: measured
    status: inferred
    why: "savings are validated by independent M&V 'conforming to international standards' (L366-368)"
  grant_recipient:
    value: none
    status: inferred
    why: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:352 | 'adoption. The lending model is unsubsidized, but expected to'. The reserve guarantee protects lenders; it pays nothing to the owner or the ESCo"
  asset_owner:
    value: client
    status: inferred
    why: "the owner holds the building and borrows against it (a third or fourth mortgage, L354); the ESCo is paid on completion (L364). Title to the improvements is not discussed"
  bill_custody:
    value: client
    status: inferred
    why: "in the CCI EPC model 'building owners have separate obligations to their utility, their lender, and their contractor' (L240-242)"

rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU general government at close}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: false
    this_case: "private owner in the United States"
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: false
    this_case: "asset_owner client: the owner borrows to buy the works"
    source: "RULINGS.md ruling 7; E02 L3293-3295"
  chicago_pilot_underwriting_process:
    scope: contractual
    applies_when: {borrower: client, debt_seniority: subordinated}
    rule: "a project qualifies for the lenders' underwriting only if it follows the process approved by the providers of capital: owners engage ESCOs; an investment-grade audit by a qualified ESCo; an ESCo savings guarantee; a subordinated loan through an originator, repaid from expected operating savings; works by the ESCO and subcontractors, ESCO paid on completion; independent M&V, with ESCo cash payments for shortfalls sufficient to cover loan repayments (L329-370). EPC liquidated damages are set 'to cover potential savings shortfalls' (L245-246)"
    applies_here: true
    this_case: "the pilot was the only project completed under it (L328-330); the process is why most promises here are inferred, not stated"
    source: "der-vpp/spec-run/esco-moneyflow/input/eceee-making-ee-bankable-2013.txt:330-331 | 'under this model, a project was required to follow a prescribed process approved by the providers of capital.'"

numbers:
  units: "314 (L329)"
  project_cost_usd_thousand: "537 (L331)"
  annual_savings_usd_thousand: "31 (L331-332)"
  electricity_use_reduction_pct: "30 (L332)"
  gas_use_reduction_pct: "12 (L332-334)"
  co2e_reduction_tons_per_year: "200 (L334)"
  contracted_completed: "contracted November 2008, completed May 2009 (L330-331)"
  pilot_fund: "five providers of capital, $1 million each; $2.5 million first-loss reserve (L386-387)"
  loan_loss_reserve_ratio: "fifty percent in the Chicago example (L349-351)"
  mercy_loan_terms: "not published (amount, rate, tenor, mortgage position)"
  derived:
    pilot_fund_size_usd_m: "5 x 1.0 = 5.0 (the paper prints no total)"
    reserve_ratio: "2.5 / 5.0 = 50 %: ties with the printed 'fifty percent' (L349-351)"
    simple_payback_years: "537 / 31 = 17.3 (undiscounted; the paper prints neither payback nor loan tenor; indication only)"
    cost_per_unit_usd: "537,000 / 314 = 1,710"
    savings_per_unit_usd_per_year: "31,000 / 314 = 98.7"
    contract_to_completion_months: "November 2008 to May 2009 = 6"

reciprocity:
  mercy: {gives: [c2, c4, c6], receives: [c1, c3, c5], one_way: false}
  esco: {gives: [c1, c14], receives: [c2, c3, c13], one_way: false}
  subcontractors: {gives: [c13], receives: [c14], one_way: false}
  providers_of_capital: {gives: [c5, c8, c11, c12], receives: [c6, c7, c9, c10], one_way: false}
  originator:
    gives: [c7]
    receives: [c8]
    one_way: true
    reason: "counter-promise (how originators are paid) exists only by duality; the paper says only that the model should be profitable for originators, recorded as c8 unstated (F06)"
  verifier:
    gives: [c3]
    receives: [c4]
    one_way: true
    reason: "counter-promise (payment for M&V) exists only by duality; payer and amount not stated, recorded as c4 unstated (F06)"
  city_of_chicago:
    gives: [c9]
    receives: [c11]
    one_way: true
    reason: "guarantee from a ratepayer-funded EE programme; no fee is stated, recorded as c11 unstated (F06)"
  macarthur:
    gives: [c10]
    receives: [c12]
    one_way: true
    reason: "a foundation's guarantee with no fee stated, recorded as c12 unstated (F06)"

lod0_gaps: []   # none: subordinated loan to the client, client-financed EPC, two guarantors of a lenders' reserve, originator and independent verifier all fit

conventions_applied:
- id: F02
  title: jurisdiction header, dated at close
  convention: "country, EU membership, client EU general government at close"
  origin: RULINGS.md ruling 4
  applied_here: "US-IL, not EU; C1 false"
- id: R14
  title: scope read from payment_basis
  convention: "every efficiency deal counts; ESCO-ness is payment_basis != asset"
  origin: RULINGS.md ruling 14
  applied_here: "in scope; payment_basis savings"
- id: B5-agencies
  title: advisers are context unless they promise
  convention: "advisers and agencies are source.context, not parties, unless the source states a promise by them"
  origin: REVIEW_SPEC_5 rulings
  applied_here: "CCI and MERP in source.context"
- id: F06
  title: one_way form
  convention: "a party whose counter-promise exists only by duality is one_way with a reason and an unstated counter-promise"
  origin: verdict rule
  applied_here: "originator, verifier, city_of_chicago, macarthur (c8, c4, c11, c12 unstated)"
- id: G17
  title: receivable_holder = payments under the EPC

# Miniature — Light Motril, public lighting with interest-subsidised credit (Spain), expressed at ESCO LOD 0
#
# Batch 2 (CASE_SPEC_2.md), reconciled by the adjudicator from writers X (base) and Y; changes listed in source.notes.
# Original writer X. Shape copied from bytom_schools-lod0.yaml (normalised 1 Oct 2026).
# Frame: model/elements.yaml LOD 0 block (41 roles, 7 commitment families, 12 settings; owner rulings 28 Sep 2026).
# Every fact carries its status: stated / inferred / default / generic / unstated. Nothing invented; only the corpus.
# Line numbers refer to corpus input/iea-dsm-financing-options-manual.txt (E08). The case is short and its two
# figures (L1625-1660) carry most of the structure; figure-derived facts are inferred (F18).

miniature: light_motril
lod: 0
case: batch2.light_motril
case_kind: deal   # a named project: Motril city hall, the Andalusian energy agency (A.A.E.), IDAE, ICO-IDAE

tests_unused:   # which of the 22 unused LOD 0 items this case was chosen to test
- item: equipment_supplier
  kind: role
  used: false
  reason: "no supplier is named or described: the measures (invoice optimisation, efficient lighting, flow reduction units, management and control systems, L1602-1606) are implemented by 'installation firms' (L1640-1643), whose role is epc_contractor. Not forced in"
- item: epc_contractor as a separate company (not one of the 22, checked at the spec's request)
  kind: role
  used: true
  reason: "Figure 10 'Subcontractors: Implementation, maintenance and control by installation firms; Technical risks of good function' (L1640-1643); Figure 11 'Implementation costs' to 'Subcontractor' (L1656-1658). They work for the City Hall, not for a Partner (lod0_gaps)"
- item: grant_provider
  kind: role
  used: false
  reason: "the subsidy givers A.A.E. and IDAE are public entities (Figure 10, L1626), so government_financier (rule B2-R1); writer Y had grant_provider"
- item: facilitator (not one of the 22, checked at the spec's request)
  kind: role
  used: true
  reason: "the Andalusian Energy Agency (A.A.E.) is hired 'as a general planer' and is 'Technical partner: Planning and design, coordination as well as quality control and supervision' and 'Financing partner' (L1663-1679)"

source:   # where the facts come from; context = actors outside the deal boundary (F23); notes = observations that are not gaps
  id: E08
  title: Financing of ESCo Projects — Financing Options for Energy-Contracting Projects (IEA DSM Task XVI)
  publisher: Bleyl & Schinnerl, Grazer Energieagentur (IEA DSM Task XVI), ~2008-10; case reported by Andrés L. Sainz, Red Eléctrica de España (L1589-1591)
  passage: "§4.3.2 'Light Motril – EPC of Public Lighting Facilities with Interest-Subsidized Credit, Spain' (corpus input/iea-dsm-financing-options-manual.txt L1585-1689); Figures 10-11 (L1625-1660)"
  oracle: none
  notes:
  - "Adjudication (batch 2): both writers encoded no Partner; kept. The text gives no savings guarantee and no ESCO, the City Hall pays the installers directly (Figure 11 'Implementation costs' to 'Subcontractor', L1656-1658) and borrows the credit; A.A.E. is hired 'as a general planer' (L1665). A.A.E. and IDAE kept as government_financier for the subsidy (X), not grant_provider (Y): both are labelled 'Public entity' (Figure 10, L1626), and C1 applies here (Spanish city hall), so their subsidy must sit where the Eurostat count reads it (E15 L5361-5391; rule B2-R1). X's joint subsidy promise from [aae, idae] split into two benefit promises (Y's form), one per giver"
  - "No ESCO is named. The case is titled an EPC, but the parties are the City Hall, A.A.E. (technical and financing partner), IDAE (subsidy), ICO-IDAE (credit) and installation firms. Figure 10's task list ('1. Audit initial situation 2. Design of measures 3. Project coordination 4. Coordination of subcontractors 5. Operation & maintenance & monitoring', L1632-1639) sits beside 'A.A.E' (L1636) — the same list that Figure 8 gives the ESCo KaWarna (L1536-1546). No party guarantees savings (contrast KaWarna, L1527-1528). Encoded with A.A.E. as facilitator and no partner_esco; A.A.E. as Partner is the alternative (lod0_gaps)"
  - "'Figure 11' labels: 'A.A.E', 'IDAE', 'Subsidy', 'ICO-IDAE', '66% Project Amortization', 'City Hall', 'Implementation costs', 'Subcontractor', 'Client pays energy invoice with a reduction' (L1649-1658). '66%' is read as the credit's share of the project; the label could also be an amortisation share"
  - "'the energy optimization proposals developed between Motril´s city hall, la Sociedad Andaluza de la Energia S.A. and the Public Lighting Director Plan' (L1594-1596): the text names this company and A.A.E. separately and does not say whether they are the same body"

jurisdiction:   # header field, not a setting (F02): drives the C1 trigger
  country: Spain (Andalusia)
  iso: ES
  eu_member: true
  client_eu_general_government: true
  status: stated
  why: "'Motril´s City Hall' (L1595, L1663); a municipality is inside general government; E02 (jrc-epc-in-the-eu-2020-2021.txt L332-333) counts Spain among the Member States"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: the planning engagement, the works subcontracts, the credit and the subsidy each establish (fibo-fnd-rel-rel:confers) their commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 41 (a list = several roles, home role first; F13); groups computed from the role(s)
  city_hall:
    entity: ayuntamiento_motril
    role: authority
    groups: [demand, public]
    status: stated
    name: Motril City Hall
    text: "'The role of Motril´s City Hall in the project: Financing partner; Hiring A.A.E. as a general planer and subcontract other tasks' (L1663-1665); Figure 10 'Public entity ... City Hall' (L1633-1636)"
  aae:
    entity: agencia_andaluza_energia
    role: [facilitator, government_financier]
    groups: [delivery, public, capital, risk]
    status: stated
    name: Andalucia's Energy Agency (A.A.E.)
    text: "'Andalucia´s Energy Agency (A.A.E.) plays a double role: Financing partner; Technical partner: Planning and design, coordination as well as quality control and supervision' (L1666-1679); Figure 10 'Public entity ... A.A.E.' beside 'Subsidy' (L1626-1628). Home role facilitator (general planner, arranges finance); government_financier for the subsidy leg. Alternative partner_esco (source.notes)"
  idae:
    entity: idae
    role: government_financier
    groups: [public, capital, risk]
    status: stated
    name: IDAE
    text: "Figure 10 'Public entity ... Subsidy IDAE' (L1626-1628); Figure 11 'A.A.E / IDAE ... Subsidy' (L1649-1651)"
  ico_idae:
    role: government_financier
    groups: [public, capital, risk]
    status: stated
    name: ICO-IDAE
    text: "Figure 10 'Public entity ... Credit ICO-IDAE' (L1626-1628); the case title says 'Interest-Subsidized Credit' (L1585-1587). A public credit line: government_financier ('Government acting as financier ... loans'); lender is the alternative by the act"
  installation_firms:
    role: epc_contractor
    groups: [delivery]
    status: stated
    text: "'Subcontractors: Implementation, maintenance and control by installation firms; Technical risks of good function' (Figure 10, L1640-1643); not named"

contract:   # the agreements that establish the commitments
  planning_engagement:
    core: contract
    parties: [city_hall, aae]
    status: stated
    note: "'Hiring A.A.E. as a general planer' (L1665)"
  works_subcontracts:
    core: contract
    parties: [city_hall, installation_firms]
    status: inferred
    note: "'Hiring A.A.E. as a general planer and subcontract other tasks' (L1665); Figure 11 'Implementation costs' from the City Hall to the 'Subcontractor' (L1654-1658). That the City Hall, not A.A.E., is the contracting party is read from the sentence and the cash-flow figure"
  credit:
    core: contract
    parties: [ico_idae, city_hall]
    status: inferred
    note: "Figure 10 'Credit ICO-IDAE'; Figure 11 'ICO-IDAE ... 66% Project ... Amortization ... City Hall' (L1653-1655); the City Hall is 'Financing partner' (L1664)"
  subsidy:
    core: contract
    parties: [aae, idae, city_hall]
    status: inferred
    note: "Figure 10 'Subsidy' (L1628); Figure 11 'A.A.E / IDAE ... Subsidy' (L1649-1651); recipient read from Figure 11's layout"

commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: performance_promise
    from: aae
    to: city_hall
    status: stated
    what: "general planning: 'Planning and design, coordination as well as quality control and supervision' (L1678-1679); Figure 10 task list (audit, design, project coordination, coordination of subcontractors, O&M and monitoring, L1632-1639, inferred from its position)"
    established_by: planning_engagement
  c2:
    family: payment_promise
    from: city_hall
    to: aae
    status: unstated
    what: "counter-promise required by duality; source silent ('Hiring A.A.E.', L1665, implies consideration; no fee is stated, and A.A.E. is a public agency that may charge nothing)"
    established_by: planning_engagement
  c3:
    family: performance_promise
    from: installation_firms
    to: city_hall
    status: inferred
    what: "'Implementation, maintenance and control by installation firms'; they carry the 'Technical risks of good function' (Figure 10, L1640-1643): efficient lighting, flow-reduction units, management and control systems (L1602-1606)"
    established_by: works_subcontracts
  c4:
    family: payment_promise
    from: city_hall
    to: installation_firms
    status: inferred
    what: "'Implementation costs' to the 'Subcontractor' (Figure 11, L1656-1658; figure arrow)"
    established_by: works_subcontracts
  c5:
    family: funding_promise
    from: ico_idae
    to: city_hall
    status: inferred
    funding_instrument: loan   # ICO-IDAE credit (L1628)
    what: "'Credit ICO-IDAE' (Figure 10, L1628), interest-subsidised (title, L1585-1587); '66% Project' (Figure 11, L1653) read as the share of the project it finances"
    established_by: credit
  c6:
    family: payment_promise
    from: city_hall
    to: ico_idae
    status: inferred
    what: "'Amortization' (Figure 11, L1655; figure label) — repayment of the credit"
    established_by: credit
  c7:
    family: benefit_promise
    from: aae
    to: city_hall
    status: inferred
    facilitator_task: [arranging_finance]   # financing partner giving the subsidy (L1666-1677)
    what: "'Subsidy' with A.A.E. as 'Financing partner' (L1666-1677; Figure 11 'A.A.E ... Subsidy', L1649-1650); amount not given; the case title's 'Interest-Subsidized Credit' (L1585-1587) suggests the subsidy lowers the interest on c5. Recipient read from the figure"
    established_by: subsidy
  c8:
    family: determination_promise
    from: aae
    to: city_hall
    status: inferred
    what: "'quality control and supervision' (L1679) of the works the City Hall pays for (c4), and 'monitoring' in the Figure 10 task list (L1639). The published achievements (2,786,104 kWh, 599,041 €, L1686-1689) presuppose someone measures them; the source does not name who"
    established_by: planning_engagement
  c9:
    family: benefit_promise
    from: idae
    to: city_hall
    status: inferred
    what: "'Subsidy IDAE' (Figure 10, L1628; Figure 11 'IDAE ... Subsidy', L1650-1651); amount not given; recipient read from the figure"
    established_by: subsidy

settings:   # the 13 LOD 0 facets, in vocabulary order (payment_basis added 1 Oct, owner ruling)
  payment_basis: {value: asset, status: inferred, why: "No Partner. c4: City Hall pays 'Implementation costs' to the installation firms (E08 Fig 11 L1656-1658), funded by credit it repays (c6); A.A.E. fee (c2) unstated."}
  client_sector: {value: public, status: stated, why: "'Motril´s City Hall' (L1663)"}
  partner_form:
    value: corporate
    status: default
    why: "no Partner is named (source.notes); default kept. If A.A.E. is read as the Partner, it is a standing public agency, not a deal SPV, so corporate either way (F22)"
  borrower:
    value: client
    status: inferred
    why: "the credit is the City Hall's: 'Credit ICO-IDAE' and 'Amortization' toward the City Hall (Figures 10-11, L1628, L1653-1655); the City Hall is 'Financing partner' (L1664). Inferred from figure labels"
  receivable_holder:
    value: partner
    status: default
    why: "default; no Partner receives periodic payments here and nothing is assigned. The value has no object in this deal (lod0_gaps)"
  collection_placement: {value: operator_own, status: default, why: not stated}
  aggregation: {value: none, status: inferred, why: "one municipality's public lighting under its Lighting Director Plan (L1594-1596)"}
  debt_seniority: {value: senior, status: default, why: not stated}
  assignment_recourse: {value: not_applicable, status: inferred, why: follows from receivable_holder = partner (nothing assigned)}
  savings_basis:
    value: measured
    status: inferred
    why: "achievements reported as measured quantities: 'Energy Savings 2.786.104 kWh; Economic Savings 599.041€' (L1686-1688)"
  grant_recipient:
    value: client
    status: inferred
    why: "a 'Subsidy' from A.A.E. and IDAE (Figure 10-11) and an 'Interest-Subsidized Credit' to the City Hall (title, L1585-1587); recipient read from the figure: the City Hall"
  asset_owner:
    value: client
    status: inferred
    why: "the City Hall borrows, pays the installation firms directly (Figure 11) and owns the public lighting; no other owner is mentioned"
  bill_custody:
    value: client
    status: inferred
    why: "'Client pays energy invoice with a reduction' (Figure 11, L1653-1654): the City Hall keeps paying its own energy bill"

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments forecast over the EPC + (b) any government financing not repayable by the Partner (e.g. capital grant), else the EPC is ON BALANCE SHEET for government (E15 L2578-2582; the summary box L6932-6943 states the sum without the basis)
    applies_here: true
    this_case: "trigger met (public, EU) but the test has nothing to bite on: there is no Partner and no guaranteed savings; the City Hall borrows the credit itself (borrower client) and owns the assets, so the investment is on its own books whatever the test says. In Eurostat's terms this arrangement is not an EPC at all (no Partner guarantee, E15 L2576-2588)"
    source: E15 L2576-2582, L5363-5380 (EU vs government financing), L6930-6943; register constraints.entries.C1_eurostat
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: partner}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? The private-sector counterpart of C1: when the Partner owns the installed assets during the term and the client pays for their use, the payments may be a lease liability on the client's balance sheet. Corpus: E02 L3293-3295 ('renewed interest for EnPC and EEaaS after leasing has been categorized as on-balance in the IFRS rules')"
    applies_here: false
    this_case: client_sector public
    source: gaps G23; E02 L3293-3295; register.yaml L301 ifrs_16 flag

numbers:   # instance data, not vocabulary
  total_investment_eur: 3081819.28        # 'Total investment mounts mount up to 3,081,819.28 €' (L1680)
  return_of_investment_years: "< 6"       # 'will be obtainded in less than six years' (L1680-1681)
  energy_savings_kwh: 2786104             # L1687 (period not stated)
  economic_savings_eur: 599041            # L1688 (period not stated)
  co2_reduction_t_per_year: 493           # L1689
  figure11_label_pct: 66                  # '66% Project Amortization' (L1653-1655), meaning not stated
  derived:
    payback_if_savings_annual_years: 3,081,819.28 / 599,041 = 5.14 (consistent with '< 6 years' only if the 599,041 € is per year)
    savings_value_per_kwh_eur: 599,041 / 2,786,104 = 0.215 (includes maintenance savings, L1682-1685, so not an energy price)
    credit_amount_if_66pct_eur: 0.66 x 3,081,819.28 = 2,034,000.72 (only if '66%' is the credit share)
    remainder_if_66pct_eur: 0.34 x 3,081,819.28 = 1,047,818.56 (funded by subsidy and/or own funds; not stated)
    total_check: "no components published; the total cannot be checked"

reciprocity:   # gives/receives computed from commitments; one_way per convention F06
  city_hall: {gives: [c2, c4, c6], receives: [c1, c3, c5, c7, c8, c9], one_way: false}
  aae:
    gives: [c1, c7, c8]
    receives: [c2]
    one_way: false
    reason: "its counter-promise c2 is unstated; not one-directional because the planning work is exchanged for the hire (L1665). The subsidy leg c7 is unilateral by nature"
  idae:
    gives: [c9]
    receives: []
    one_way: true
    reason: "benefit promise, unilateral by nature: a public subsidy (Figures 10-11)"
  ico_idae: {gives: [c5], receives: [c6], one_way: false}
  installation_firms: {gives: [c3], receives: [c4], one_way: false}

lod0_gaps:   # what the deal needs that LOD 0 lacks, each with a classification
- kind: epc_without_partner
  description: "the case is titled an EPC but names no ESCO and no savings guarantee; the client finances, contracts the installers and owns the assets, with a public agency as general planner. LOD 0 expresses it (no role or family is missing), but four settings presuppose a Partner (partner_form, receivable_holder, assignment_recourse, and borrower's 'partner' default) and take values with no object. Alternative encoding: A.A.E. as partner_esco (it holds the ESCO task list in Figure 10), which would leave the Partner without a guarantee or a payment stream"
  classification: "encoding question (deal identity: is this an EPC?); evidence gap on who, if anyone, guarantees"
- kind: epc_contractor_for_the_client
  description: "epc_contractor 'Builds and installs the works for the Partner as contractor or subcontractor'; here the installation firms work for the City Hall directly (L1665, Figure 11). The definition's 'for the Partner' does not fit; the role is still the nearest"
  classification: "encoding question (definition: 'for the Partner or the client')"
- kind: role_overlap_government_grant_and_loan
  description: "A.A.E., IDAE and ICO-IDAE are public entities giving a subsidy and a credit. grant_provider and lender fit their acts; government_financier fits both and names government. Encoded government_financier by the more specific definition (as in sittard_cityhall); grant_provider left to non-government givers"
  classification: "encoding question (definition overlap)"

conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F01
  title: C1 rule text states the NPV basis
  convention: 'C1_eurostat: NPV at financial close of guaranteed savings >= NPV of operational payments + non-repayable government financing, else on the government balance sheet (E15 L2578-2582; summary box L6932-6943 omits the basis). Files that computed nominal sums say so; with level annual flows the direction does not change.'
  origin: verdict change 1; findings F01
  applied_here: C1 stated on the NPV basis; nothing to compute (no Partner, no guarantee)
- id: F02
  title: jurisdiction header field; C1 trigger
  convention: 'A `jurisdiction` block (country, EU membership, whether the client is EU general government) sits in the miniature header, not among the settings; C1 applies_when {client_sector: public, jurisdiction: EU}.'
  origin: verdict change 2; findings F02; gaps G27
  applied_here: jurisdiction ES / EU general government; C1 applies_here true
- id: F04
  title: borrower rule for provider-financed deals
  convention: borrower = none only when the source says own funds or equity; when the Partner finances the works and no loan or equity is named, keep the default partner with status default.
  origin: verdict change 4; findings F04; gaps G24
  applied_here: not provider-financed; borrower client (the City Hall's ICO-IDAE credit)
- id: F06
  title: one_way form (CASE_SPEC)
  convention: 'A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated; one_way: false is reserved for parties whose counter-promise is stated or inferred from a stated fact.'
  origin: verdict rule; findings F06
  applied_here: "idae one_way: true (subsidy); aae's planning fee c2 unstated"
- id: F13
  title: aggregation super_esco iff the role; role may be a list
  convention: "aggregation = super_esco iff a party carries aggregator_super_esco. A party's `role` may be a list, home role first, so one party can carry several of the 41 roles."
  origin: verdict rule; findings F13; gaps G11
  applied_here: "aae = [facilitator, government_financier] (the source's 'double role', L1666)"
- id: F18
  title: status discipline
  convention: stated = the source says it of this deal. A value read from a market table, a figure arrow, a bracketed template option or a contradicted AI passage is inferred (alternative in why) or generic, per CASE_SPEC.
  origin: findings F18
  applied_here: "Figures 10-11 labels (credit, amortisation, subsidy, implementation costs) give inferred commitments; the lessons-learned text (L1663-1679) is stated"
- id: F21
  title: determination_promise is required
  convention: "A determination_promise is required whenever a payment is computed on savings or completion; from = the party the source names, else the literal 'unstated'."
  origin: verdict rule; findings F21; gaps G08
  applied_here: "c8 from A.A.E. ('quality control and supervision', L1679)"
- id: IFRS16
  title: IFRS16_lease_test rule entry
  convention: "One rule entry, not a setting: IFRS16_lease_test, applies_when {client_sector: private, asset_owner: partner} — the private counterpart of C1."
  origin: verdict change 6; gaps G23
  applied_here: rule present; does not apply (public client)
- id: B2-R1
  title: grant giver by identity (batch-2 adjudication)
  convention: "A grant or subsidy from general government or a public entity acting for it is given by government_financier (its definition lists grants; it is what the Eurostat thresholds count, E15 L5361-5391); from EU structural funds by eu_funds (F03); grant_provider only for givers that are neither (GEF and other multilateral grant windows, foundations, utility rebate programmes). Corrects F03's last clause ('grant_provider is for national or other non-EU grants')."
  origin: batch-2 adjudication; audit proposal unused/final.json grant_provider (rename_redefine)
  applied_here: "the A.A.E. and IDAE subsidies (public entities, Figure 10) -> government_financier; ICO-IDAE credit likewise"

coverage:   # computed from the blocks above, not typed; below_lod0 is the writer's note
  roles_used: [authority, facilitator, government_financier, epc_contractor]
  roles_count: 4 of 41
  families_used: [payment_promise, performance_promise, funding_promise, benefit_promise, determination_promise]
  families_absent: [risk_promise, agency_promise]
  families_unstated_only: []
  settings_by_status: {stated: 1, inferred: 8, generic: 0, default: 4}
  commitments_by_status: {stated: 1, inferred: 7, generic: 0, unstated: 1}
  one_way_parties: [idae]
  parties_count: 5
  commitments_count: 9
  below_lod0: {lod1_adds: 'events (Lighting Director Plan, audit, design, subsidy grant, credit drawdown, works, acceptance,
      amortisation), the credit''s interest subsidy mechanism', lod2_adds: 'none recoverable from the source (no fee, no guarantee)'}
risk_allocation:   # owner rulings 15-16 (3 Oct): rows the source states or implies; the converter derives the rest (ENCODING.md)
  - {category: R1, driver: technical, bearer: [epc_contractor], share: sole, status: stated, evidence: "der-vpp/spec-run/esco-moneyflow/input/iea-dsm-financing-options-manual.txt:1643 | Technical risks of good function", why: "Figure 10 places 'Technical risks of good function' under the subcontractors (installation firms). Overrides the asset-basis default (client); no savings guarantee is given, only the risk placement. A and B agree. Dropped: R2 on the firms (A stated, B inferred) because Figure 10 lists maintenance under both the firms (L1641) and A.A.E. ('Operation& maintenance& monitoring', L1636-1638), so no single bearer can be read; B's R7 interest_rate shared with the subsidy givers, because the subsidy lowers the City Hall's interest cost by an unstated mechanism and does not move rate risk"}

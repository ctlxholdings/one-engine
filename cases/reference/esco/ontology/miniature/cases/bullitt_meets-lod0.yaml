# Miniature — Bullitt Center MEETS (Metered Energy Efficiency Transaction Structure), Seattle City Light /
# Bullitt Foundation / master tenant, from 1 May 2015 for 20 years, expressed at ESCO LOD 0
#
# Batch 4 FINAL (adjudicated 1 Oct 2026 from writers R and S; base S, master lease from R). Shape copied from batch3/final/*-lod0.yaml. Rulings applied: batch2/review/decisions.json,
# batch3/review/decisions.json (B2-R1, wrapper_creditor ruling, in_scope practice).
# Evidence is a public web document, fetched 1 Oct 2026 (curl to stdout, pdftotext to stdout; nothing saved), cited as
# '<url> | <section>' with exact quotes of 25 words or fewer. The PDF has no printed page numbers in its text layer, so
# sections are named by the paper's own headings.
#   [ACEEE16] https://www.aceee.org/files/proceedings/2016/data/papers/3_433.pdf
#             Egnor (EnergyRM), Hayes (Bullitt Foundation), Jennings (NEEA), Rodenhizer (Seattle City Light) et al.,
#             'Metered Energy Efficiency Transaction Structure in Ultra-Efficient New Construction: Pay-For-Performance at
#             the Bullitt Center in Seattle, WA', ACEEE Summer Study 2016. Written by three of the parties, so a party
#             document; it is not the agreement itself.
# Every fact carries its status: stated / inferred / default / generic / unstated. Nothing from memory.

miniature: bullitt_meets
lod: 0
case: batch4.bullitt_meets
case_kind: deal   # one named, signed three-party agreement (owner, master tenant, utility), 20 years from 1 May 2015
in_scope: true
in_scope_why: "The owner is paid only for metered savings against a dynamic baseline for 20 years: 'the utility pays only for actual savings after they have been achieved and measured against a baseline' [ACEEE16 | Abstract]. That meets the EED test of energy performance contracting, investments 'paid for in relation to a contractually agreed level of energy efficiency improvement' (E02 jrc-epc-in-the-eu-2020-2021.txt L556-560). No ESCO company: the building owner is the savings provider (lod0_gaps)"

tests_unused:   # which still-unused LOD 0 items (and which settings CASE_SPEC_4 names) this case was chosen to test
- item: occupant
  kind: role
  used: true
  reason: "'the master tenant is responsible for paying the retail electric cost of the dynamic baseline consumption' [ACEEE16 | Contracting]. The master tenant is a named contract party distinct from the owner, and the savings value is 'redirected from the tenant to the investor' [ACEEE16 | Contracting]: the split incentive the occupant definition names. The master tenant is not named"
- item: grid_buyer
  kind: role
  used: true
  reason: "The utility buys the building's savings as a supply resource: utilities 'purchase the \"saved\" energy from the efficiency generator (i.e. the building) just as they would purchase electricity from an independent power producer' [ACEEE16 | Background]; 'Pay-for-Performance treats energy efficiency like a generation resource' [ACEEE16 | Pay-For-Performance]. It also takes 132,000 kWh of exported PV [ACEEE16 | Table 2]. The definition says 'surplus energy produced on site'; savings are not produced energy, so a definition touch-up is proposed (lod0_gaps). The PV export alone fits the current text, but its price is not stated. Adjudicated: counted, as with wrapper_creditor in batch 3, because the role is occupied under both the current text (PV export) and the proposed one (savings purchase)"
- item: savings_basis=measured
  kind: setting_value
  used: true
  reason: "'Subtract the actual meter value from the adjusted/corrected dynamic baseline to derive the certified monthly savings in kWh' [ACEEE16 | The DeltaMeter]. Already used in earlier batches; here it carries the payment"
- item: utility_supplier
  kind: role
  used: true
  reason: "CASE_SPEC_4 asks for the utility's role. Seattle City Light supplies the tenant, bills the savings value on the tenant's account ('Assessing charges to the tenant account', [ACEEE16 | Billing Mechanics]) and pays the owner. Home role utility_supplier, second role grid_buyer (F13). Already used in earlier batches"
- item: collection_placement=on_bill
  kind: setting_value
  used: true
  reason: "The tenant pays the savings value on its utility bill, and the utility pays the owner: a stated deal-level use (batch 3 had it only as a programme fact). Already used in batch 2, so no count changes"

source:   # where the facts come from; context = actors outside the deal boundary (F23); notes = observations that are not gaps
  id: ACEEE16
  title: "Metered Energy Efficiency Transaction Structure in Ultra-Efficient New Construction: Pay-For-Performance at the Bullitt Center in Seattle, WA"
  publisher: ACEEE Summer Study on Energy Efficiency in Buildings, 2016 (authors from EnergyRM, Bullitt Foundation, NEEA, Seattle City Light, U. Oregon, U. Washington)
  passage: "https://www.aceee.org/files/proceedings/2016/data/papers/3_433.pdf | Abstract; Introduction; Background; Methods; The DeltaMeter; Contracting (incl. Fig. 2); Pay-For-Performance; Rolling Occupancy; Results (Tables 2 and 3); Billing Mechanics; Lessons Learned"
  oracle: "Table 3 (MEETS cash-flow table) and Table 2 (metering): every published annual total re-computed below"
  context:
  - "Seattle City Council: the 20-year term exceeds the department's budget authority, 'requiring an ordinance to passed by the Seattle City Council prior to implementation' [ACEEE16 | Contracting]. An approver with no promise: a rule source, not a party. The ordinance number is not in the paper (the hunt's 124604 stays unverified and unused)"
  - "NEEA and the University of Oregon ESBL (on contract to NEEA) ran an independent parallel validation of the DeltaMeter [ACEEE16 | The Validation Process]; Cadmus, SBW and UW IDL are third-party reviewers [ACEEE16 | Fig. 1 caption]. Pilot research, no promise to the deal parties"
  - "UNICO: 'the property management company, UNICO, administers a monthly web-based survey to each tenant' [ACEEE16 | Rolling Occupancy]; it feeds baseline adjustments but makes no promise in the MEETS contracts that the paper describes"
  - "The investor: proceeds go 'to the investor (if it is not the utility)' [ACEEE16 | Methods]; at Bullitt the payments go to the Bullitt Foundation, so owner and investor are one party"
  notes:
  - "Tenant pays retail on metered savings plus grid import, not on the whole baseline: Table 3 tenant charges $44,551 / $0.0640 = ~696,000 kWh = 651,518 MEE + 44,400 grid kWh; on-site PV consumed (124,880 kWh) is not charged, since savings are computed 'independently of the on-site photovoltaics (PV) array output' [ACEEE16 | The DeltaMeter]. 'Baseline consumption' in the contract quote therefore means baseline net of on-site PV (LOD 2 formula)"
  - "Year 1 in Tables 2-3 is not the contract year: the table 'includes two billing periods prior to contract execution' [ACEEE16 | Results]; the meter reads run 4 Mar 2015 to 1 Feb 2016, the contract began 1 May 2015"
  - "In year 1 the utility pays the owner more than it bills the tenant for savings: $54,793 out vs $41,657 in (net -$13,136), because of the 2.5c incentive. The abstract's claim that 'over the life of the PPA the utility pays out less than the retail revenue received' cannot be checked from the paper"
  - "Sub-tenants: 'Bullitt Center tenants operate under a fixed tenant energy allowance established by the terms of their lease' [ACEEE16 | Rolling Occupancy]. A second occupant layer below the master tenant with no amounts and no named landlord; not encoded (lod0_gaps)"

jurisdiction:   # header field, not a setting (F02); dated at financial close
  country: United States (Seattle, Washington)
  iso: US
  eu_member: false
  client_eu_general_government: false
  as_of: "contract start 1 May 2015 [ACEEE16 | Results]"
  status: stated
  why: "'a pilot project with the Bullitt Center ... office building in Seattle' [ACEEE16 | Introduction]. Not EU; C1 does not apply"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: the Metered Energy Efficiency Purchase Agreement, the baseline/metering agreement, the retail supply and the PV interconnection each establish (fibo-fnd-rel-rel:confers) their commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 41 (a list = several roles, home role first; F13); groups computed from the role(s)
  master_tenant:
    role: occupant
    groups: [demand]
    status: stated
    text: "'between the Bullitt Foundation as owner, the master tenant, and Seattle City Light' [ACEEE16 | Contracting]; pays 'the retail electric cost of the dynamic baseline consumption' [ACEEE16 | Contracting]. Not named. The client of the deal (it pays the bill), but a tenant, not the owner: occupant, not host"
  bullitt:
    entity: bullitt_foundation
    role: partner_esco
    groups: [partner]
    status: inferred
    name: The Bullitt Foundation
    text: "'the Bullitt Foundation as owner' [ACEEE16 | Contracting]; 'Seattle City Light then provides two payments to the Bullitt Foundation based on the Metered Energy Efficiency' [ACEEE16 | Contracting]. Inferred partner_esco: the owner-investor delivers the savings and is paid on them; it gives no savings guarantee and is not an ESCO company (lod0_gaps). Alternative host (owner), rejected because the host pays the fee or the bill and Bullitt pays neither"
  seattle_city_light:
    entity: city_of_seattle
    role: [utility_supplier, grid_buyer]
    groups: [energy, collection]
    status: stated
    name: Seattle City Light (SCL)
    text: "'Master Tenant pays Seattle City Light prevailing retail rate per kWh' and 'Seattle City Light pays Bullitt an agreed energy rate per kWh' [ACEEE16 | Fig. 2]; buys the saved energy 'just as they would purchase electricity from an independent power producer' [ACEEE16 | Background]. A City department (inferred from the Council ordinance); it buys a resource, it does not grant, so not government_financier"
  energyrm:
    entity: energyrm
    role: verifier_mnv
    groups: [verification]
    status: stated
    name: EnergyRM (Energy Resource Management)
    text: "runs the DeltaMeter and publishes 'the monthly Certified DeltaMeter® Statement'; 'The Statement serves as the basis for billings and payment amongst the parties' [ACEEE16 | The DeltaMeter]"

contract:   # the agreements that establish the commitments
  meets_agreement:
    core: contract
    parties: [bullitt, master_tenant, seattle_city_light]
    status: stated
    note: "The Metered Energy Efficiency Purchase Agreement; 'The term is twenty years, with a three-year pilot phase' [ACEEE16 | Contracting]; began 1 May 2015 [ACEEE16 | Results]; approved by City Council ordinance. Called a 'MEETS Power Purchase Agreement (PPA)' [ACEEE16 | Background]"
  metering_agreement:
    core: contract
    parties: [energyrm, seattle_city_light, bullitt]
    status: inferred
    note: "the baseline 'governed under a separate agreement' [ACEEE16 | Contracting]; variances resolved 'under the metering contract' [ACEEE16 | The DeltaMeter]. Its parties are not named; inferred from who receives EnergyRM's results first: 'EnergyRM first provided its results to SCL, Bullitt, NEEA, and ESBL' [ACEEE16 | The Validation Process]"
  retail_supply:
    core: contract
    parties: [seattle_city_light, master_tenant]
    status: inferred
    note: "ordinary retail service for metered grid import; Table 3 'Tenant Actual Meter Charges' at the 'Retail Electric Rate' [ACEEE16 | Table 3]. That the master tenant holds the account is inferred from Table 3 charging it"
  master_lease:
    core: contract
    parties: [bullitt, master_tenant]
    status: inferred
    note: "implied by 'master tenant' and by the lesson that 'Office leases must assure that the tenants are responsible for paying the retail electric cost of the dynamic baseline consumption' [ACEEE16 | Lessons Learned]; rent and terms not stated (from writer R)"
  pv_interconnection:
    core: contract
    parties: [bullitt, seattle_city_light]
    status: inferred
    note: "the building exports PV to the grid: 'energy exported to the utility (gold)' [ACEEE16 | Results]; 'Exported to SCL kWh' [ACEEE16 | Table 2]. Terms and price not stated"

commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: performance_promise
    from: seattle_city_light
    to: master_tenant
    status: stated
    what: "supplies grid electricity for the building's metered use: 'Utility Power to Bullitt kWh' 44,400 in the year [ACEEE16 | Table 2]; generically, 'the utility sells energy services ... to the building's tenants' [ACEEE16 | Abstract]"
    established_by: retail_supply
  c2:
    family: payment_promise
    from: master_tenant
    to: seattle_city_light
    status: stated
    what: "pays retail for actual metered grid import: 'Tenant Actual Meter Charges' $2,894 in the year [ACEEE16 | Table 3]"
    established_by: retail_supply
  c3:
    family: payment_promise
    from: master_tenant
    to: seattle_city_light
    status: stated
    depends_on_savings: true   # charged on the metered savings (ACEEE16 Table 3)
    what: "pays the retail rate on the metered savings as if no efficiency existed: 'Tenant MEE Charges' $41,657 [ACEEE16 | Table 3]; 'charging the tenant as if no improvements had been made' [ACEEE16 | Pay-For-Performance]. Billed on the tenant's utility account (on_bill)"
    established_by: meets_agreement
  c4:
    family: performance_promise
    from: bullitt
    to: seattle_city_light
    status: stated
    what: "delivers the building's metered savings ('negawatt-hours') for 20 years: the utility purchases 'the \"saved\" energy from the efficiency generator (i.e. the building)' [ACEEE16 | Background]; 651,518 kWh in the year [ACEEE16 | Table 2]. No guarantee of a minimum quantity is stated"
    established_by: meets_agreement
  c5:
    family: payment_promise
    from: seattle_city_light
    to: bullitt
    status: stated
    depends_on_savings: true   # contract rate on the metered savings (ACEEE16 Table 3)
    what: "contract rate on metered savings, $0.0591/kWh: 'Bullitt Contract MEETS Payment' $38,505 [ACEEE16 | Table 3]; the rate is 'designed to differ just enough from the retail electric rate to allow the utility to retain some compensation' [ACEEE16 | Contracting]"
    established_by: meets_agreement
  c6:
    family: payment_promise
    from: seattle_city_light
    to: bullitt
    status: stated
    depends_on_savings: true   # incentive per kWh of metered savings (ACEEE16)
    what: "conservation incentive on metered savings: 'The second is a flat conservation incentive of 2.5¢ per kilowatt-hour' [ACEEE16 | Contracting]; $16,288 in the year [ACEEE16 | Table 3]. Encoded as a price for the savings, not a benefit_promise, because it is paid only per delivered kWh (alternative in lod0_gaps)"
    established_by: meets_agreement
  c7:
    family: determination_promise
    from: energyrm
    to: [seattle_city_light, bullitt, master_tenant]
    status: stated
    determines: savings   # certified monthly savings
    what: "certifies monthly savings against the dynamic baseline; the Certified DeltaMeter Statement 'serves as the basis for billings and payment amongst the parties' [ACEEE16 | The DeltaMeter]; variances over +/-5% are 'analyzed and resolved in coordination with building operators' [ACEEE16 | The DeltaMeter] (F21: c3, c5 and c6 are computed on savings)"
    established_by: metering_agreement
  c8:
    family: payment_promise
    from: unstated
    to: energyrm
    status: unstated
    what: "counter-promise required by duality; source silent (who pays EnergyRM for the DeltaMeter service is not stated)"
    established_by: metering_agreement
  c9:
    family: performance_promise
    from: bullitt
    to: seattle_city_light
    status: stated
    what: "exports surplus PV to the grid: 132,000 kWh 'Exported to SCL' in the year [ACEEE16 | Table 2]"
    established_by: pv_interconnection
  c10:
    family: payment_promise
    from: seattle_city_light
    to: bullitt
    status: unstated
    what: "counter-promise required by duality; source silent (no price or bill credit for exported PV is stated)"
    established_by: pv_interconnection

  c11:
    family: performance_promise
    from: bullitt
    to: master_tenant
    status: inferred
    what: "lets the building to the master tenant; tenants get 'superior comfort and lighting ... without increased cost' [ACEEE16 | Methods] (from writer R)"
    established_by: master_lease
  c12:
    family: payment_promise
    from: master_tenant
    to: bullitt
    status: inferred
    what: "rent under the master lease (implied by 'master tenant'; amount and terms not stated) (from writer R)"
    established_by: master_lease

settings:   # the 13 LOD 0 facets, in vocabulary order (payment_basis added 1 Oct, owner ruling)
  payment_basis: {value: savings, status: stated, why: "c5/c6: Seattle City Light pays Bullitt $0.0591/kWh plus 2.5c/kWh on certified metered savings; 'pays only for actual savings ... measured against a baseline' (ACEEE16 Abstract, Contracting)."}
  client_sector:
    value: private
    status: inferred
    why: "the client is the master tenant of a private office building owned by a private foundation; the tenant is not named, so its sector is inferred"
  partner_form:
    value: corporate
    status: inferred
    why: "the Bullitt Foundation, a standing foundation that owns the building, not a deal SPV (batch-1 touch-up: corporate = any standing legal entity that is not a deal SPV)"
  borrower:
    value: partner
    status: default
    why: "no loan is stated; how the building was financed is not in the paper (F04: keep the default)"
  receivable_holder: {value: partner, status: default, why: "no assignment of the utility's MEETS payments is stated"}
  collection_placement:
    value: on_bill
    status: stated
    why: "the tenant pays the savings value through its utility bill: 'Master Tenant pays Seattle City Light prevailing retail rate per kWh' of Metered Energy Efficiency [ACEEE16 | Fig. 2]; 'Assessing charges to the tenant account currently involves manual energy savings calculations' [ACEEE16 | Billing Mechanics]"
  aggregation:
    value: none
    status: stated
    why: "a single-building pilot: SCL 'has entered into a ... (MEETS) pilot project with the Bullitt Center' [ACEEE16 | Introduction]. Bundling many buildings is only envisaged ('can be \"packaged\" into bundles', [ACEEE16 | Background])"
  debt_seniority: {value: senior, status: default, why: "no debt stated"}
  assignment_recourse: {value: not_applicable, status: default, why: nothing assigned}
  savings_basis:
    value: measured
    status: stated
    why: "'Subtract the actual meter value from the adjusted/corrected dynamic baseline to derive the certified monthly savings in kWh' [ACEEE16 | The DeltaMeter]; 'the utility pays only for actual savings after they have been achieved and measured against a baseline' [ACEEE16 | Abstract]"
  grant_recipient:
    value: none
    status: inferred
    why: "the 2.5c/kWh conservation incentive is paid per metered kWh as part of the price (c6). Alternative partner, if the incentive is read as public support from a City utility. The $84,000 up-front incentive was not taken: Bullitt 'would have received' it under the traditional programme [ACEEE16 | Introduction]"
  asset_owner:
    value: partner
    status: stated
    why: "'the Bullitt Foundation as owner' [ACEEE16 | Contracting]; the efficiency is built into the owner's building. 'partner' because Bullitt carries the Partner role here"
  bill_custody:
    value: client
    status: stated
    why: "'the master tenant is responsible for paying the retail electric cost of the dynamic baseline consumption' [ACEEE16 | Contracting]; tenant actual meter charges in Table 3"

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments + (b) non-repayable government financing, else ON BALANCE SHEET for government (E15 L2578-2582)
    applies_here: false
    this_case: private tenant in the US
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: [partner, lessor, vehicle]}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? Private counterpart of C1 (trigger widened per batch-2 verdict change 2)"
    applies_here: true
    this_case: "triggered formally: the owner holds the efficiency and the tenant pays for it. But the efficiency is part of the building the tenant already leases, so the question folds into the real-estate lease; a US filer would test under ASC 842. The paper says nothing on accounting; not determinable"
    source: E02 L3293-3295; batch2/review/verdict.md change 2

numbers:   # published figures with units; derived values with arithmetic
  term_years: 20                                  # 'twenty years, with a three-year pilot phase' [ACEEE16 | Contracting]
  contract_start: 2015-05-01                      # [ACEEE16 | Results]
  floor_area_sqft: 52000                          # [ACEEE16 | Introduction]
  contract_rate_usd_per_kwh: 0.0591               # [ACEEE16 | Table 3]
  conservation_incentive_usd_per_kwh: 0.025       # [ACEEE16 | Contracting; Table 3]
  table_year: {meter_reads: 2015-03-04 to 2016-02-01, days: 364}   # [ACEEE16 | Table 2]
  baseline_kwh: 820798                            # 'DeltaMeter Baseline' annual [ACEEE16 | Table 2]
  building_use_kwh: 169280                        # 'Bullitt Center Use' annual [ACEEE16 | Table 2]
  metered_energy_efficiency_kwh: 651518           # [ACEEE16 | Table 2]
  solar_production_kwh: 256880                    # [ACEEE16 | Table 2]
  solar_used_on_site_kwh: 124880                  # [ACEEE16 | Table 2]
  grid_import_kwh: 44400                          # 'Utility Power to Bullitt' [ACEEE16 | Table 2]
  exported_to_scl_kwh: 132000                     # [ACEEE16 | Table 2]
  average_retail_rate_usd_per_kwh: 0.0640         # [ACEEE16 | Table 3]; monthly 0.0634 to 0.0674
  tenant_actual_meter_charges_usd: 2894           # [ACEEE16 | Table 3]
  tenant_mee_charges_usd: 41657                   # [ACEEE16 | Table 3]
  tenant_total_usd: 44551                         # [ACEEE16 | Table 3]
  bullitt_contract_payment_usd: 38505             # [ACEEE16 | Table 3]
  bullitt_incentive_usd: 16288                    # [ACEEE16 | Table 3]
  bullitt_total_usd: 54793                        # [ACEEE16 | Table 3]
  traditional_upfront_incentive_forgone_usd: 84000   # [ACEEE16 | Introduction]
  projected_20yr_to_bullitt_usd: {nominal: 1200000, discounted: 740000}   # 'it will receive $1.2 million (in nominal dollars; $740,000 in discounted dollars)' [ACEEE16 | Introduction]
  validation_9_months_kwh: {deltameter: 647626, energyplus: 647297}       # [ACEEE16 | Results]
  derived:
    mee_check: "820,798 - 169,280 = 651,518 kWh (closes); Table 2 monthly MEE column also sums to 651,518"
    use_check: "124,880 solar on site + 44,400 grid = 169,280 kWh (closes); 124,880 + 132,000 exported = 256,880 produced (closes)"
    energy_level: "169,280 / 820,798 = 20.6%, the paper's 'approximately 21% of the energy level of the comparative base case' (closes)"
    bullitt_contract_payment: "651,518 x 0.0591 = 38,504.71 -> $38,505 (closes); the 12 monthly entries sum to $38,503 (monthly rounding)"
    bullitt_incentive: "651,518 x 0.025 = 16,287.95 -> $16,288 (closes); monthly entries sum to $16,289"
    bullitt_total: "38,505 + 16,288 = $54,793 (closes); monthly totals also sum to $54,793"
    tenant_mee: "sum of monthly kWh x monthly retail rate = $41,655 vs $41,657 published (closes within $2, rate rounding); on the average, 651,518 x 0.0640 = $41,697 does not close because rates vary by month (0.0634 to 0.0674); 41,657 / 651,518 = $0.06394/kWh"
    tenant_actual: "3,000 x 0.0634 + 11,100 x 0.0642 + 15,900 x 0.0642 + 14,400 x 0.0674 = 190 + 713 + 1,021 + 971 = $2,895 vs $2,894 published (rounding)"
    tenant_total: "41,657 + 2,894 = $44,551 (closes)"
    utility_spread_on_contract_rate: "0.0640 - 0.0591 = $0.0049/kWh; 41,657 - 38,505 = $3,152 retained in the year (7.6% of MEE charges)"
    utility_net_on_savings_year1: "41,657 billed - 54,793 paid = -$13,136 (the incentive more than consumes the spread)"
    tenant_billed_kwh: "651,518 + 44,400 = 695,918 kWh billed vs 820,798 baseline; the 124,880 kWh of on-site PV used is not charged"
    validation_gap: "647,626 - 647,297 = 329 kWh = 0.05% over nine months ('less than 1%', closes)"
    twenty_year_values: "do not re-compute from published inputs: 54,793 x 20 = $1.10m flat; with the contract part escalated 2%/yr, 38,505 x 24.30 + 16,288 x 20 = $1.26m; flat PV at 3% = $0.82m vs $740,000. The escalation basis is not stated, so left unclosed"

reciprocity:   # gives/receives computed from commitments; one_way per convention F06
  master_tenant: {gives: [c2, c3, c12], receives: [c1, c7, c11], one_way: false}
  bullitt: {gives: [c4, c9, c11], receives: [c5, c6, c7, c10, c12], one_way: false}
  seattle_city_light: {gives: [c1, c5, c6, c10], receives: [c2, c3, c4, c7, c9], one_way: false}
  energyrm:
    gives: [c7]
    receives: [c8]
    one_way: true
    reason: the verifier's fee exists only by duality; recorded as c8 unstated (payer not stated)

lod0_gaps:   # what the deal needs that LOD 0 lacks, each with a classification
- kind: grid_buyer_buys_savings
  description: "The utility buys metered savings as a supply resource under a PPA ('negawatt-hours' from the 'efficiency generator'). grid_buyer is defined as buying 'surplus energy produced on site'. Proposed touch-up: 'Buys surplus energy produced on site, or metered savings as a supply resource.' Without it, SCL is utility_supplier only and grid_buyer rests on the PV export, whose price is unstated"
  classification: "definition touch-up (owner's call); no new term"
- kind: owner_is_the_savings_provider
  description: "No ESCO company. The building owner-investor delivers and is paid for the savings, gives no guarantee, and is paid per metered kWh. partner_esco ('designs, installs, operates and guarantees savings') fits loosely; host does not fit because the owner pays neither fee nor bill"
  classification: "encoding question (who takes the Partner role when the owner self-delivers; same family as the open 'no ESCO' boundary of batch 3)"
- kind: incentive_payment_or_benefit
  description: "The 2.5c/kWh conservation incentive is a utility programme incentive (benefit-like) but is paid only per delivered kWh. Encoded as a payment_promise; benefit_promise with grant_recipient = partner is the alternative"
  classification: "encoding question"
- kind: sub_tenant_layer
  description: "Sub-tenants pay a 'fixed tenant energy allowance' under their leases; the landlord and amounts are not stated, so this second occupant layer is not encoded"
  classification: "evidence gap"

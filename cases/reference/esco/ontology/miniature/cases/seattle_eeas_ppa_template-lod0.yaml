risk_allocation:   # owner rulings 15-16 (3 Oct): rows the source states or implies; the converter derives the rest (ENCODING.md)
  - {category: R1, driver: technical, bearer: [partner_esco], share: sole, status: stated, evidence: "cases/seattle_eeas_ppa_template-lod0.yaml:137", why: "PPA s.4(b): zero or negative avoided energy 'will result in no Efficiency Energy payment for that cycle or debit', and s.4(a) sets a 12.5% floor (case line 130), so the developer carries the shortfall. Equal to the default but stated. A and B agree on the bearer; B's evidence line (s.4(b)) taken over A's (s.10, which is about installation)"}
  - {category: R3, driver: null, bearer: [partner_esco], share: sole, status: stated, evidence: "cases/seattle_eeas_ppa_template-lod0.yaml:88", why: "PPA s.10: selection, design and installation are 'the sole responsibility of the EE Developer'. Equal to the default but stated. B wrote it; A named it in notes only. Dropped: A's inferred R5a on Seattle City Light, because whether SCL must pay the developer when the Participant does not pay SCL is not stated (the Manual has SCL paying 'a portion of those payments', which reads as pass-through)"}

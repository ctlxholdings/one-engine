# Miniature — China Energy Conservation Project (World Bank / GEF / EC), three pilot Energy Management Companies (EMCs), 1998-2006,
# expressed at ESCO LOD 0. Batch 6, pair G, REVIEWED file (reconciles writers X and Y; decisions in ../decisions.json).
#
# Evidence: two World Bank documents, fetched 1 Oct 2026 by the reviewer (curl, pdftotext), quotes matched against the text, <= 25 words.
#   [ICR] https://documents1.worldbank.org/curated/en/766961468217164840/pdf/ICR7010ICR0P0036060Box327353B01public1.pdf
#         Implementation Completion and Results Report No. ICR0000701, 19 Dec 2007 (the writers' document). Cited by PDF page (printed page + 12 in the body).
#   [PAD] https://documents1.worldbank.org/curated/en/463211468743764158/pdf/multi-page.pdf
#         Project Appraisal Document No. 17030-CHA, 26 Feb 1998, added by the reviewer as a second document for the money chain. Cited by PDF page.
#         An appraisal states the PLANNED arrangements; where the ICR confirms they were executed, the fact is stated.
# Every fact carries its status: stated / inferred / default / generic / unstated.
# Programme: one representative EPC (EMC and host enterprise, generic) plus the finance chain above the three EMCs.

miniature: china_ecp_pilot_emcs
lod: 0
case: batch6.S01
case_kind: programme   # one IBRD loan, one GEF grant and one EC grant financing three EMCs that signed 514 EPCs (ICR Annex 2); one representative EPC
in_scope: true
in_scope_why: "EMCs 'design, develop, finance, implement and supervise initial operations of energy efficiency investments' and 'are compensated for this with a share of the energy savings achieved from the investment' [ICR | PDF p.15, s.1.7(a)]. A shared-savings EPC by named energy-service Partners"

tests_unused:
- item: grant_provider
  kind: role
  used: true
  reason: "GEF, a giver that is neither government nor EU funds (B2-R1), gives the grant: 'GLOBAL ENVIRONMENTAL FACILITY GRANT IN THE AMOUNT OF US$ 22.0 MILLION TO THE PEOPLE'S REPUBLIC OF CHINA' [ICR | PDF p.1]. Second deal for the role after hep_croatia (batch 2), independent of it"
- item: grant_recipient=partner
  kind: setting_value
  used: true
  reason: "Three statements, two documents, that the GEF money reached the EMCs as non-repayable money: (1) 'GEF grant of US$15 million was used up by these three pilot EMCos (US$ 5 million for each EMCo)' [ICR | PDF p.50, Annex 6 s.4]; (2) the EMCs' own books carry 'GEF grants' as financing receipts and a 'GEF grant' line in shareholders' funds, apart from paid-in capital [ICR | PDF p.44-45, Table 3.3]; (3) the appraisal routes it 'under subsidiary grant agreements' [PAD | PDF p.13] and allocates US$3.75m to each EMC plus 3.75 unallocated [PAD | PDF p.64, Table C]. The grantee of record is the Government, which passes the grant on (c4, c6)"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No receivables are sold and no notes are issued; the EMCs finance from on-lent IBRD money, grants, equity and own funds [ICR | PDF p.35, Annex 1]"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "The ICR records an exchange-rate study, not a hedge: 'Recruited experts to study the exchange rate risk that was faced by the EMCs concerning the World Bank loan' [ICR | PDF p.40]. No hedge provider named"
- item: authority_guarantor
  kind: role
  used: false
  reason: "The clients are host enterprises, not authorities. The guarantees in the deal back the EMCs' on-lent loan (provincial repayment guarantees, shareholders' counter-guarantees), not a client's payments"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "Title sits with the EMC until it is paid, then with the host (asset_owner partner); no third-party owner"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "Pay is 'a share of the energy savings' [ICR | PDF p.15]: savings, not availability or output"

source:
  id: ICR
  documents:
    ICR: "https://documents1.worldbank.org/curated/en/766961468217164840/pdf/ICR7010ICR0P0036060Box327353B01public1.pdf — World Bank ICR No. ICR0000701, China Energy Conservation Project (IBRD-43040, MULT-28323, EECT-20949), 19 Dec 2007; Annex 6 reproduces the Government's own summary (PDF p.48-52)"
    PAD: "https://documents1.worldbank.org/curated/en/463211468743764158/pdf/multi-page.pdf — World Bank Project Appraisal Document No. 17030-CHA, 26 Feb 1998: financing plan and loan terms (PDF p.5), implementation arrangements (p.13), effectiveness conditions (p.18), EMC legal structure (p.30), EMC financing (p.51), allocation of grant and loan proceeds (p.64)"
  title: China Energy Conservation Project — ICR (2007) and Project Appraisal Document (1998)
  publisher: World Bank (East Asia and Pacific Region)
  passage: "ICR data sheet (PDF p.3-7); s.1.4-1.7 (p.14-15); s.2.1-2.5 (p.17-21); s.3.2-3.3 (p.25-27); s.5 (p.32); Annex 1 (p.35); Annex 2 (p.36-40); Annex 3 Table 3.3 (p.43-45); Annex 6 (p.48-52). PAD p.5, 13, 18, 30, 51, 64"
  oracle: "none, not a published validation target. Annex 1, Tables 2.1-2.4, 3, 3.1-3.3 and PAD Table C re-added in numbers.derived"
  context:
  - "State Economic and Trade Commission (SETC, later NDRC) and its Project Management Office: responsible agency and monitoring unit [PAD | PDF p.5; ICR | PDF p.51]. No payment promise in the EPC: context. The SETC also channelled domestic loans to the EMCs ('Domestic loans (through SETC)' 30.9 in the appraisal plan [PAD | PDF p.5]; 'domestic - special loan(SETC)' rows [ICR | PDF p.44-45]); terms not given: evidence gap, not encoded"
  - "Information dissemination centre (SECIDC/NECIDC) and project management: GEF US$7m and Government US$7m [ICR | PDF p.35]. Separate components with no payment chain to the EPCs: outside the deal boundary"
  - "Second Energy Conservation Project, China National Investment & Guaranty Co. (I&G), EMC Association, DFID/ASTAE grants to new EMCs [ICR | PDF p.19, p.22]: other projects, context"
  - "World Bank as supervisor: 'the Bank provide its no objection to all EMC subprojects unless or until waived by the Bank' [ICR | PDF p.18] (recorded as a rule); third-party reviewers of GEF-funded subprojects [ICR | PDF p.40]: oversight, no promise in the EPC"
  - "Local banks: Liaoning EMC 'secured agreements with local banks to assist in credit assessments of prospective customers' [ICR | PDF p.38]. Credit assessment only, no funding promise stated"
  notes:
  - "Borrower of record vs end borrower: 'Borrower: People's Republic of China' [PAD | PDF p.5]; the money reaches each EMC through 'subsidiary loan agreements between the Ministry of Finance and provincial Finance Bureaus, and between provincial Finance Bureaus and each EMC' [PAD | PDF p.13]. The ICR confirms the agreements were executed: 'executing various subsidiary agreements and setting up disbursement accounts and procedures between the various government entities and EMCs' [ICR | PDF p.17]. Encoded as the full chain IBRD -> MOF -> provincial Finance Bureaus -> EMC"
  - "Form of the grant at the EMC: the appraisal planned 'zero percent nonredeemable preference capital from the Ministry of Finance of about 150 million yuan, which will be financed from European Union and GEF grants' [PAD | PDF p.51]. The ICR books the money as 'GEF grant' and 'EC grant' in shareholders' funds, apart from paid-in capital, and computes the FIRR 'net of GEF and EC grants received' [ICR | PDF p.27]. A non-repayable, non-yielding contribution: benefit_promise, not a funding_promise. If the preference shares carried any claim, a funding_promise from MOF with an inferred residual claim would be the alternative"
  - "The EMCs' shareholders 'are public entities or publicly owned corporations, but the EMC are autonomous from the government' [PAD | PDF p.30]. Kept as equity_investor (and surety_guarantor): they act as owners, not as government lenders or grantors"
  - "Internal inconsistencies, all recomputed in numbers.derived: Annex 6 prints 'US$1.5 million' for the EMC share of GEF where its next sentence and Annex 1 give 15; IBRD use by EMC 21 + 21 + 19.0827 = 61.08 against 60.5 disbursed; Annex 2 labels the appraisal 54.3 'Government financing' where Annex 1 says 'EMC Own Funds'; Annex 6 puts US$2m of GEF technical assistance with the EMCs where Annex 1 puts it under project management; Table 3 gives the three EMCs' 2006 investment as 30.3 where Table 2.3 gives 31.95"
  - "EC grant: the grant 'provided truly critical support to both the groups forming the three new EMCs and the group establishing the new information dissemination center' [ICR | PDF p.17]; the appraisal gives 'ECU 4 million (about US$4.5 million)' [PAD | PDF p.11, p.29] and plans ECU 3.2 million of it as EMC preference capital [PAD | PDF p.51]. Effective date differs: Annex 1 note 'Effective June 1997' vs s.2.1 'July 1997'"

jurisdiction:
  country: China
  iso: CN
  eu_member: false
  client_eu_general_government_at_close: false
  as_of: "IBRD loan effective 12/16/1998, GEF grant effective 12/22/1998 [ICR | PDF p.4, data sheet B]"
  status: stated
  why: "'TO THE PEOPLE'S REPUBLIC OF CHINA' [ICR | PDF p.1]. Not an EU member; C1 does not apply"

core_v7:
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: each contract establishes (fibo-fnd-rel-rel:confers) its commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:
  host_enterprise:
    role: host
    groups: [demand]
    status: generic
    name: Host enterprises (representative client of the three EMCs)
    text: "'energy efficiency investments in other, \"host enterprises.\"' [ICR | PDF p.15]; mostly industrial, building retrofits for Beijing [ICR | PDF p.53-55, Annex 6]. Ownership (state or private) not stated: host by the silent-sector default"
  emc:
    role: partner_esco
    groups: [partner]
    status: stated
    name: "Beijing Yuanshen Energy Conservation Technology Co., Ltd; Liaoning Energy Conservation Technology Development Co., Ltd; Shandong Energy Conservation Engineering Co., Ltd (one party for the three)"
    text: "'Under the full-service energy performance contracting business model, EMCs design, develop, finance, implement and supervise initial operations' [ICR | PDF p.15]; 'for-profit limited liability shareholding companies, established and registered in 1996' [PAD | PDF p.30]"
  gef:
    entity: gef
    role: grant_provider
    groups: [public]
    status: stated
    name: Global Environment Facility (GEF)
    text: "'GEF Grant $22 million' to the People's Republic of China [PAD | PDF p.5; ICR | PDF p.1]. Neither government nor EU funds"
  european_commission:
    entity: european_union
    role: eu_funds
    groups: [public, capital]
    status: stated
    name: European Commission
    text: "'an EC grant of ECU 4 million (about US$4.5 million)' [PAD | PDF p.29]; 'A $4.5 million grant by the European Commission' [ICR | PDF p.17]. EU-budget external-assistance money, not structural funds: eu_funds on a definition touch-up (gaps.json G-B6G-01); not grant_provider, because RULINGS #8 keeps EU money out of it"
  ibrd:
    entity: ibrd
    role: ifi_dfi
    groups: [public, capital]
    status: stated
    name: International Bank for Reconstruction and Development (World Bank)
    text: "'IBRD Loan $63 million' [PAD | PDF p.5]; 60.5 disbursed [ICR | PDF p.4]; 'The IBRD loan provided a source of dedicated financing for scaling up and company growth' [ICR | PDF p.17]"
  mof:
    entity: prc_government
    role: government_financier
    groups: [public, capital, risk]
    status: stated
    name: Ministry of Finance of the People's Republic of China, for the Government (borrower and grant recipient of record)
    text: "'which represents the Government of China (GOC) to sign \"Loan Agreement\" and \"Grant Agreement\" with WB and GEF' [ICR | PDF p.51]; on-lends through provincial Finance Bureaus and passes the grants on under 'subsidiary grant agreements' [PAD | PDF p.13]"
  provincial_finance_bureaus:
    role: government_financier
    groups: [public, capital, risk]
    status: stated
    name: Provincial Finance Bureaus and provincial governments (Beijing, Liaoning, Shandong)
    text: "Second leg of the on-lending, 'between provincial Finance Bureaus and each EMC, with provincial government repayment guarantees' [PAD | PDF p.13]. Public lender and guarantor of the Partner's debt: government_financier"
  chinese_shareholders:
    role: [equity_investor, surety_guarantor]
    groups: [capital, risk]
    status: stated
    name: Shareholders of the three EMCs (public entities or publicly owned corporations, not named)
    text: "'specially formed for the project by Chinese shareholders' [ICR | PDF p.15]; 'willingness of the Chinese shareholders to arrange the counter guarantees necessary for the IBRD loan' [ICR | PDF p.32]"
  equipment_supplier:
    role: equipment_supplier
    groups: [delivery, capital]
    status: generic
    name: Equipment suppliers (not named)
    text: "'contracts with foreign suppliers were executed for some projects, but primarily in niche technology areas, such as heat pumps and chillers' [ICR | PDF p.21]"

contract:
  epc:
    core: contract
    parties: [emc, host_enterprise]
    status: generic
    note: "'according to an energy performance contract executed between the two parties' [ICR | PDF p.15]; 'the standard 2-3 year energy performance contracts' [ICR | PDF p.26]; 514 EPCs [ICR | PDF p.37]. Individual contracts not published"
  gef_grant_agreement:
    core: contract
    parties: [gef, mof]
    status: stated
    note: "'GEF Grant Agreement' signed December 1998 [ICR | PDF p.49]; grant made to the People's Republic of China [ICR | PDF p.1]"
  ec_grant_agreement:
    core: contract
    parties: [european_commission, mof]
    status: inferred
    note: "approved December 1996, effective June 1997 [PAD | PDF p.29]; the counterpart is not named; the Government is inferred because the EMC share reached the EMCs through MOF as preference capital [PAD | PDF p.51] under subsidiary agreements 'similar' to the GEF ones [PAD | PDF p.13]"
  ibrd_loan_agreement:
    core: contract
    parties: [ibrd, mof]
    status: stated
    note: "Loan IBRD-43040; 20 years to maturity, 5 years' grace, LIBOR-based, commitment fee 0.75% [PAD | PDF p.5]; US$63.0m committed, 60.5m disbursed [ICR | PDF p.4]"
  subsidiary_loan_agreements:
    core: contract
    parties: [mof, provincial_finance_bureaus, emc]
    status: stated
    note: "MOF to provincial Finance Bureaus, and Bureaus to each EMC [PAD | PDF p.13]; execution was a condition of effectiveness ('Execution of onlending and subgrant agreements ... are conditions of GEF Grant and IBRD loan effectiveness' [PAD | PDF p.18]) and took place [ICR | PDF p.17]. On-lending rate not published"
  subsidiary_grant_agreements:
    core: contract
    parties: [mof, emc]
    status: stated
    note: "'GEF funds for the EMC Demonstration Component will be provided under subsidiary grant agreements' [PAD | PDF p.13]; executed [ICR | PDF p.17]"
  provincial_guarantees:
    core: contract
    parties: [provincial_finance_bureaus, mof]
    status: stated
    note: "'with provincial government repayment guarantees' [PAD | PDF p.13] (appraisal arrangement). Beneficiary not named; MOF, the first-leg lender, is inferred"
  equity:
    core: contract
    parties: [chinese_shareholders, emc]
    status: stated
    note: "paid-in capital RMB 74.40m (1997) to 124.40m (2006 est.) [ICR | PDF p.45]"
  counter_guarantees:
    core: contract
    parties: [chinese_shareholders, provincial_finance_bureaus]
    status: inferred
    note: "'Final arrangements for company counter-guarantees ... caused this delay' [ICR | PDF p.14]. A counter-guarantee backs a guarantee; the guarantee in the chain is the provinces' [PAD | PDF p.13], so the provinces are the inferred beneficiary"
  equipment_purchase:
    core: contract
    parties: [emc, equipment_supplier]
    status: generic
    note: "goods bought under the Bank's procurement rules [ICR | PDF p.20-21]"

commitments:
  c1:
    family: performance_promise
    from: emc
    to: host_enterprise
    status: generic
    what: "design, finance, implement and supervise initial operations of the efficiency investment [ICR | PDF p.15]; 'EMCo guarantees to realize energy conservation capacity and benefits promised in the contract' [ICR | PDF p.49, Government's summary]. Shortfall make-good inside this promise"
    established_by: epc
  c2:
    family: payment_promise
    from: host_enterprise
    to: emc
    status: generic
    depends_on_savings: true   # a share of the savings achieved (ICR p.15)
    savings_arrangement: shared   # a share of the savings achieved (ICR p.15)
    what: "'a share of the energy savings achieved from the investment' [ICR | PDF p.15] over a 2-3 year contract; 'all contracts include clauses for adjusting repayment due to increases/decreases in energy prices' [ICR | PDF p.29]. Share not published"
    established_by: epc
  c3:
    family: determination_promise
    from: [emc, host_enterprise]
    to: [emc, host_enterprise]
    status: generic
    determines: savings   # energy savings confirmed by both parties (ICR p.40)
    what: "'the energy savings achieved was a key determinant of the remuneration of the EMCs by the host enterprises' [ICR | PDF p.19]; for 357 case-studied projects 'both EMCs and the host enterprises had confirmed their energy savings' [ICR | PDF p.40]. The two parties determine it; no independent verifier named (F21)"
    established_by: epc
  c4:
    family: benefit_promise
    from: gef
    to: mof
    status: stated
    what: "GEF grant US$22.0m to the People's Republic of China, of which US$15.0m for the EMC Demonstration Component [ICR | PDF p.1, p.35]"
    established_by: gef_grant_agreement
  c5:
    family: benefit_promise
    from: european_commission
    to: mof
    status: inferred
    what: "EC grant ECU 4m (about US$4.5m) [PAD | PDF p.29; ICR | PDF p.35]: technical assistance and 'about $ 3 million in small pilot EPC projects' [ICR | PDF p.17]. Recipient of record not named (inferred Government)"
    established_by: ec_grant_agreement
  c6:
    family: benefit_promise
    from: mof
    to: emc
    status: stated
    what: "passes on the GEF EMC share (US$15m, 'US$ 5 million for each EMCo' [ICR | PDF p.50]) and the EC EMC share (ECU 3.2m planned [PAD | PDF p.51]) as zero-percent non-redeemable preference capital [PAD | PDF p.51]; booked by the EMCs as 'GEF grant' 12,380 and 'EC grant' 2,737 (RMB 10,000) [ICR | PDF p.45]. Uses: 'risk coverage to the EMC shareholders' and part-financing of pilot projects [ICR | PDF p.17]"
    established_by: subsidiary_grant_agreements
  c7:
    family: funding_promise
    from: ibrd
    to: mof
    status: stated
    funding_instrument: loan   # IBRD loan
    what: "IBRD loan US$63.0m committed, US$60.5m disbursed [ICR | PDF p.4]"
    established_by: ibrd_loan_agreement
  c8:
    family: payment_promise
    from: mof
    to: ibrd
    status: stated
    what: "repayment over 20 years with 5 years' grace, LIBOR-based interest, commitment fee 0.75% [PAD | PDF p.5]"
    established_by: ibrd_loan_agreement
  c9:
    family: funding_promise
    from: mof
    to: provincial_finance_bureaus
    status: stated
    funding_instrument: loan   # on-lending of the IBRD loan
    what: "first on-lending leg [PAD | PDF p.13]; terms not published"
    established_by: subsidiary_loan_agreements
  c10:
    family: payment_promise
    from: provincial_finance_bureaus
    to: mof
    status: inferred
    what: "repayment of the first leg; follows from c9"
    established_by: subsidiary_loan_agreements
  c11:
    family: funding_promise
    from: provincial_finance_bureaus
    to: emc
    status: stated
    funding_instrument: loan   # on-lending of the IBRD loan to each EMC
    what: "second on-lending leg to each EMC [PAD | PDF p.13]; 'the IBRD loan to the companies' [ICR | PDF p.17]; allocated US$21m per EMC [PAD | PDF p.64]; used 21, 21 and 19.0827 [ICR | PDF p.50]"
    established_by: subsidiary_loan_agreements
  c12:
    family: payment_promise
    from: emc
    to: provincial_finance_bureaus
    status: inferred
    what: "repayment of the on-lent loan; the EMCs' cash flow shows 'repayment of long-term debt -world bank' and a 'WB loan commitment fee' [ICR | PDF p.44]; payee not stated, the second-leg lender inferred. The EMCs bear the exchange-rate risk ('foreign exchange losses', same table)"
    established_by: subsidiary_loan_agreements
  c13:
    family: risk_promise
    covers: [R5b]
    from: provincial_finance_bureaus
    to: mof
    status: stated
    cover_kind: guarantee   # provincial repayment guarantees (PAD p.13)
    what: "'provincial government repayment guarantees' of the on-lent loan [PAD | PDF p.13] (appraisal arrangement); beneficiary inferred"
    established_by: provincial_guarantees
  c14:
    family: funding_promise
    from: chinese_shareholders
    to: emc
    status: stated
    funding_instrument: equity   # paid-in capital
    what: "paid-in capital and 'equity receipts' [ICR | PDF p.44-45]"
    established_by: equity
  c15:
    family: payment_promise
    from: emc
    to: chinese_shareholders
    status: inferred
    what: "residual claim (F07); retained earnings RMB 29.88m in 2006 (est.), no dividend shown [ICR | PDF p.45]"
    established_by: equity
  c16:
    family: risk_promise
    covers: [R5b]
    from: chinese_shareholders
    to: provincial_finance_bureaus
    status: inferred
    cover_kind: guarantee   # counter guarantees (ICR p.32)
    what: "'counter guarantees necessary for the IBRD loan' [ICR | PDF p.32]: stated that they exist; beneficiary (the provincial guarantor) inferred; amount and terms not given"
    established_by: counter_guarantees
  c17:
    family: performance_promise
    from: equipment_supplier
    to: emc
    status: generic
    what: "supply of equipment for subprojects [ICR | PDF p.20-21]"
    established_by: equipment_purchase
  c18:
    family: payment_promise
    from: emc
    to: equipment_supplier
    status: generic
    what: "price of the equipment, from loan, grant and own funds"
    established_by: equipment_purchase

settings:
  payment_basis:
    value: savings
    status: stated
    why: "'compensated for this with a share of the energy savings achieved from the investment' [ICR | PDF p.15]"
  client_sector:
    value: private
    status: default
    why: "host enterprises; ownership not stated (G09). Immaterial to C1 (China not EU); matters for IFRS16 only"
  partner_form:
    value: corporate
    status: stated
    why: "'for-profit limited liability shareholding companies' with 'independent accounting, independent management' [PAD | PDF p.30], each signing many EPCs: standing companies, not deal SPVs"
  borrower:
    value: partner
    status: stated
    why: "'subsidiary loan agreements ... between provincial Finance Bureaus and each EMC' [PAD | PDF p.13]; the Government is borrower of record, the EMC the end borrower (c11)"
  receivable_holder:
    value: partner
    status: default
    why: "no assignment of host payments mentioned"
  collection_placement:
    value: operator_own
    status: default
    why: "not stated for the representative EPC; Liaoning EMC asks clients to 'set up special account' (one EMC's practice) [ICR | PDF p.56]"
  aggregation:
    value: none
    status: inferred
    why: "each EPC is one host site; the loan and grants finance the EMCs as companies (corporate finance of their portfolio), not a pooled financing of contracts or a super-ESCO"
  debt_seniority:
    value: senior
    status: default
    why: "rank not stated; no shareholder loan or mezzanine described"
  assignment_recourse:
    value: not_applicable
    status: inferred
    why: follows from receivable_holder partner
  savings_basis:
    value: measured
    status: inferred
    why: "pay rests on savings 'achieved' and confirmed by EMC and host [ICR | PDF p.19, p.40]; nothing says stipulated at signing"
  grant_recipient:
    value: partner
    status: stated
    why: "see tests_unused: Annex 6 'used up by these three pilot EMCos'; EMC books 'GEF grant'; PAD 'subsidiary grant agreements' and Table C"
  asset_owner:
    value: partner
    status: inferred
    why: "'Once the EMC has been fully compensated, the assets from the investment are retained by the host enterprise' [ICR | PDF p.15]: the EMC holds title until paid. Transfer is LOD 1"
  bill_custody:
    value: client
    status: default
    why: not stated

rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU general government at close}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: false
    this_case: "China, not EU; host private by default"
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: true
    this_case: "the trigger is met on recorded values (private by default, EMC holds title until paid); its OUTCOME is undetermined because the host's accounting framework is not stated; the EMCs had to settle 'how the EPC business model was to be viewed by regulators, auditors and taxation authorities' [ICR | PDF p.18]"
    source: RULINGS.md ruling 7; E02 L3293-3295
  bank_no_objection:
    scope: contractual
    rule: "'the Bank provide its no objection to all EMC subprojects unless or until waived by the Bank' [ICR | PDF p.18]; waived for subprojects under US$1m"

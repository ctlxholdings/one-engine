# Miniature — EERSF (Bulgarian Energy Efficiency and Renewable Sources Fund) credit to ESCO Almina Consult EOOD for the Aitos
# multi-profile hospital, stage I (Bulgaria), expressed at ESCO LOD 0. Batch 6, pair G, REVIEWED file (decisions in ../decisions.json).
#
# Evidence, fetched 1 Oct 2026 by the reviewer (curl, pdftotext, tag-stripped HTML); quotes <= 25 words, matched against the text:
#   [BGEEF]  https://www.bgeef.com/wp-content/uploads/2018/04/info_burgas_aitos_hospital_en.pdf  the fund's one-page project sheet (writers' source)
#   [CITY]   http://citynvest.eu/content/eerfs  CITYnvest description of the fund, figures to end 2014 (writers' source; fund-level, generic)
#   [ALMINA] https://www.seea.government.bg/documents/6-Almina_Consult%202017.pdf  Almina Consult EOOD presentation of its projects, Nov 2017,
#            hosted by the Bulgarian Sustainable Energy Development Agency (SEEA). Added by the reviewer: it lists the Aitos project with the same
#            cost and credit (196 570 / 147 428 BGN) and labels it an ESCO guaranteed-result contract. Bulgarian; translations are the reviewer's.
#   [GUIDE]  https://www.seea.government.bg/documents/Ukazaniia_ESCO.pdf  SEEA guidance on ESCO contracts (generic): defines the abbreviation ДГР.
# Every fact carries its status: stated / inferred / default / generic / unstated.

miniature: eersf_aitos_hospital
lod: 0
case: batch6.S02
case_kind: deal   # one named project credit on the fund's sheet; the fund's terms are programme-level (generic)
in_scope: true
in_scope_why: "An ESCO guaranteed-result contract financed by a revolving fund. The ESCO's own project list labels the Aitos hospital project 'Изплатен ЕSCO проект ДГР' (paid-off ESCO project, guaranteed-result contract) [ALMINA | p.6], with the sheet's cost and credit; under that contract type the contractor's investment and fee 'се възстановяват за сметка на реализираните икономии на енергия' (are recovered from the realised energy savings) [GUIDE | p.17, generic]"

tests_unused:
- item: revolving_fund
  kind: role
  used: true
  reason: "Fits in substance; the definition needs a light touch-up (gaps.json G-B6G-02). Limb by limb: (1) public fund: 'established in 2005 by the Government of Bulgaria to provide revolving finance' [CITY | Organization and Partnerships]; capital 21.5 of 21.9M BGN from GEF and two governments, 0.4 from private donors; but it 'operates as a public private partnership' [CITY | Summary]: publicly established and capitalised, not a government body. (2) finances public agencies' projects by loan: municipalities 53% and 'mainly universities and hospitals' 19% of the book [CITY]; here it lends to the ESCO for a public hospital's project, so it finances the agency's project through its ESCO. (3) recovered from savings: 'As EEFRS is a revolving type fund it has been only relying on revenues from the repayment of the loans' [CITY]; the loan's repayment comes from the ESCO, whose pay under a ДГР comes from savings (inferred chain, not stated for this loan). The corpus source of the role (E05 L10) names 'Bulgaria EERSF' as its example"
- item: borrower
  kind: setting
  used: true
  reason: "partner, stated: the sheet's 'Debtor \"Almina Consult\" Ltd.' [BGEEF | p.1] is the ESCO [ALMINA | p.2], not the 'Beneficiary' hospital. Second case for borrower=partner with a named public-fund lender"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "no receivable sale or note issue; the fund lends and re-lends repayments [CITY]"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "no hedge in any document; the credit is in BGN"
- item: authority_guarantor
  kind: role
  used: false
  reason: "no guarantee of the hospital's payments. The fund's guarantee products cover other lenders' loans [CITY], not this direct credit"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "insulation and windows are fixtures of the hospital building; no third-party owner"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "a guaranteed-result (savings) contract; nothing ties pay to availability or output"

source:
  id: BGEEF
  documents:
    BGEEF: "https://www.bgeef.com/wp-content/uploads/2018/04/info_burgas_aitos_hospital_en.pdf — project sheet on the fund's letterhead, undated; page 1 figures, page 2 photographs. Primary for the loan"
    CITY: "http://citynvest.eu/content/eerfs — CITYnvest (EU H2020 project) page on the fund; secondary, undated, figures to 31 Dec 2014. Fund-level facts, status generic"
    ALMINA: "https://www.seea.government.bg/documents/6-Almina_Consult%202017.pdf — 'Алмина Консулт ЕООД' project presentation, 19 slides, created 2 Nov 2017, on the SEEA (government agency) site. The ESCO's own account; independent of the fund's sheet"
    GUIDE: "https://www.seea.government.bg/documents/Ukazaniia_ESCO.pdf — SEEA, 'Указания за изготвяне на ЕСКО договори' (guidance on drafting ESCO contracts); abbreviation list p.4, payment from savings p.17. Generic"
  title: EERSF credit to Almina Consult for the Aitos hospital (fund sheet), the fund's description, and the ESCO's own project list
  publisher: Bulgarian Energy Efficiency and Renewable Sources Fund; CITYnvest; Almina Consult EOOD via SEEA
  passage: "BGEEF p.1; CITY Summary, Model Description, Organization and Partnerships, Results; ALMINA p.2 and the Aitos slide (p.6); GUIDE p.4, p.17"
  oracle: "none; the sheet's ratio and the fund's capital sums re-computed in numbers.derived; the two Aitos accounts compared"
  context:
  - "Donors that capitalised the fund in 2004-2008: GEF via IBRD 15,5M BGN, Government of Bulgaria 3M, Government of Austria about 3M, private donors 0,4M [CITY | Model Description]. Money inside the fund before this loan, with no promise to it ('Since 2011, all its funds raised through the initial capitalization have been fully invested' [CITY]). Context, as the RGGI top-up in nyserda_green_bonds_2024a. EBRD / Ministry (2013) and KIDSF (2014) EUR 5m each for guarantees and municipal projects: other products"
  - "General Donor Assembly and Management Board: governance; the Board approves 'the financing of the projects' [CITY]. No promise in the loan: context"
  - "Commercial banks co-finance some fund projects; none appears on this sheet (the 25% own share matches the fund-only rule, numbers.derived)"
  notes:
  - "The sheet does not name the creditor in its text; the letterhead is the fund's and the line is 'Project Credit'. The ESCO's list gives the same 'Стойност на кредита: 147 428 лв.' (credit value) without naming the lender. Fund as lender: inferred"
  - "The two accounts of the Aitos project differ: sheet payback 5.6 years, ESCO list 6.8 years ('Срок на откупуване: 6,8 години'); sheet savings electricity 69 452, naphtha/diesel 577 275, wood pellets -171 733 kWh/year and 358 t CO2eq; ESCO list 'Топлинна енергия 213 100 квтч/год.' (heat) and 'около 200 тона' CO2. Same cost and credit. The ESCO list names the building as the children's ward of 'МБАЛ-Айтос' ЕООД (a single-owner limited company); the sheet as the 'Multi-profile hospital ... Aitos Municipality, stage I'. Not reconciled"
  - "Fund payback rule 'maximum payback periods of 5 years' [CITY] against 5.6 (or 6.8) here; loans 'for up to 5 years'. Not explained"
  - "Portfolio shares 53% + 29% + 19% = 101% and '45,8 BGN' missing its 'M' [CITY]: page errors, read as rounding and million"


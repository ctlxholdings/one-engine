# Miniature — Globaluz S.L.: LED lighting at IES Manuel Sanchís Guarner, Silla (Valencia), a 36-month guaranteed-savings
# energy service contract crowd-lent on Ecrowd! (EUR 46,300 from 114 investors), expressed at ESCO LOD 0
#
# Batch 4 FINAL (adjudicated 1 Oct 2026 from writers R and S; base S). Shape copied from batch3/final/*-lod0.yaml. Rulings applied: batch2/review/decisions.json,
# batch3/review/decisions.json.
# Evidence is a public web page, fetched 1 Oct 2026 (WebFetch, then curl to stdout with tags stripped; nothing saved),
# cited as '<url> | <section>' with exact quotes of 25 words or fewer:
#   [ECR] https://www.ecrowdinvest.com/detalles/globaluz-silla-valencia  (Ecrowd project page 'Iluminación LED para el
#         IES Sanchis Guarner - GLOBALUZ-2'; the platform's own listing of the promoter's offer; primary for the offer).
#   [GVA] https://portal.edu.gva.es/iesmanuelsanchisguarner/es/informacio-del-centre-es/  (the school's page on the Generalitat
#         Valenciana education portal; used only for the client's sector; from writer R, re-fetched 1 Oct 2026).
# The page's detail tabs are closed: 'Los detalles solo son accesibles a los inversores que han participado en él' [ECR | tabs].
# So the interest rate, dates, fee and contract terms are not public. Only what the page states is encoded.
# Every fact carries its status: stated / inferred / default / generic / unstated. Nothing from memory.

miniature: globaluz_ecrowd
lod: 0
case: batch4.globaluz_ecrowd
case_kind: deal   # one named, signed energy service contract (Globaluz - IES Manuel Sanchís) financed by one named crowd loan
in_scope: true
in_scope_why: "A guaranteed-savings energy service contract by a registered ESCO: Globaluz signed with the school 'para la externalización del servicio energético durante 36 meses bajo el modelo de ahorros garantizados' [ECR | Descripción del proyecto]. The crowd loan finances the ESCO's investment"

tests_unused:   # which still-unused LOD 0 items this case was chosen to test
- item: crowdfunding_platform
  kind: role
  used: true
  reason: "'Ecrowd es una Plataforma de Financiación Participativa con licencia de la CNMV' [ECR | Garantías adicionales]; 114 retail investors lent EUR 46,300 [ECR | header; Inversores tab]. It distributes the ESCO's debt to retail investors inside a real EPC, the definition exactly"
- item: surety_guarantor
  kind: role
  used: true
  reason: "'cuenta también con el aval personal del administrador y socio principal de Globaluz, S.L.' [ECR | Garantías adicionales del préstamo colectivo]. Not on the spec's list and already used; exercised because the source states it. The guarantor is a natural person, not a bank or parent company (lod0_gaps)"
- item: accreditation_body
  kind: role
  used: false
  reason: "Named only: Globaluz is 'registrado en el Ministerio de Industria y en el I.D.A.E' [ECR | Descripción del proyecto]. The registry keeper makes no promise in this deal: a rule source, in source.context (from writer R)"
- item: esco_association
  kind: role
  used: false
  reason: "Named only: Globaluz is one of the 'socios de la Asociación Nacional de Empresas de Servicios Energéticos (ANESE)' [ECR | Descripción del proyecto]. No promise in this deal: source.context (from writer R)"
- item: bill_custody=provider
  kind: setting_value
  used: true
  reason: "'Globaluz se hace cargo de las facturas energéticas durante ese periodo' [ECR | Descripción del proyecto]. Already used in earlier batches; no count changes"

source:   # where the facts come from; context = actors outside the deal boundary (F23); notes = observations that are not gaps
  id: ECR
  title: "Iluminación LED para el IES Sanchis Guarner - GLOBALUZ-2 (Silla, Valencia)"
  publisher: Ecrowd Invest, Plataforma de Financiación Participativa S.L.
  passage: "https://www.ecrowdinvest.com/detalles/globaluz-silla-valencia | header (Estado, Importe, Interés anual, Cuotas mensuales, Inversores); Descripción del proyecto; Garantías adicionales del préstamo colectivo; Inversores tab"
  secondary:
  - id: GVA
    title: Información del Centro — IES Manuel Sanchis Guarner
    publisher: Generalitat Valenciana, Conselleria de Educación, Cultura y Universidades (education portal)
    passage: "https://portal.edu.gva.es/iesmanuelsanchisguarner/es/informacio-del-centre-es/ | page header (centre code 46007943)"
  oracle: "the Inversores tab lists 114 investors whose amounts sum to the published EUR 46,300 (re-computed below)"
  context:
  - "Ministry of Industry, IDAE and ANESE: Globaluz is 'proveedor de servicios energéticos registrado en el Ministerio de Industria y en el I.D.A.E' and a member of ANESE [ECR | Descripción del proyecto]. A registry and a trade association with no promise in this deal: accreditation_body and esco_association are not used (their status here is the ESCO's standing, not a deal commitment)"
  - "CNMV (licence) and Banco de España (Lemon Way's authorisation) [ECR | Garantías adicionales]: regulators of the platform, no promise in the deal"
  notes:
  - "Interest rate not published: the 'Interés anual:' field is blank [ECR | header]; the start date is not shown either. No interest ladder can close"
  - "Lot name 'GLOBALUZ-2' suggests a second Globaluz project on Ecrowd; not used"
  - "The page says the ESCO pays the school's energy bills for 36 months and makes the investment; how the school pays Globaluz (amount, basis) is not public"

jurisdiction:   # header field, not a setting (F02); dated at financial close
  country: Spain (Silla, Valencia)
  iso: ES
  eu_member: true
  client_eu_general_government: true
  as_of: "signing date not published; loan status 'Préstamo amortizado' [ECR | header]"
  status: inferred
  why: "location 'Silla, ES' [ECR | header] is stated. That the client is general government is inferred: an 'instituto de secundaria' (IES) and 'centro educativo' [ECR | Resumen], i.e. a public secondary school; the loan page does not say 'public', but the school's own page sits under the 'Conselleria de Educación, Cultura y Universidades' [GVA | page header]"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: the energy service contract, the crowd loan, the personal guarantee, the platform terms, the payment-service terms and the energy supply each establish (fibo-fnd-rel-rel:confers) their commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 41 (a list = several roles, home role first; F13); groups computed from the role(s)
  ies_sanchis_guarner:
    entity: ies_manuel_sanchis_guarner
    role: authority
    groups: [demand, public]
    status: inferred
    name: I.E.S. Manuel Sanchís Guarner, Silla (Valencia)
    text: "Globaluz 'ha firmado un contrato con el I.E.S. Manuel Sanchís de Silla (Valencia)' [ECR | Descripción del proyecto]. Inferred authority: a public secondary school (IES); the page does not name the education department as signatory"
  globaluz:
    entity: globaluz_sl
    role: partner_esco
    groups: [partner]
    status: stated
    name: Globaluz, S.L.
    text: "'como proveedor de servicios energéticos registrado'; contract 'bajo el modelo de ahorros garantizados' [ECR | Descripción del proyecto]; 'Promovido por GLOBALUZ, S.L.' [ECR | header]"
  crowd_lenders:
    role: lender
    groups: [capital]
    status: stated
    text: "'Importe : 46.300€'; 'Inversores: 114' [ECR | header]; individual tickets from EUR 50 to EUR 1,000 [ECR | Inversores tab]"
  ecrowd:
    entity: ecrowd_invest
    role: crowdfunding_platform
    groups: [capital]
    status: stated
    name: Ecrowd Invest, Plataforma de Financiación Participativa S.L.
    text: "'Ecrowd es una Plataforma de Financiación Participativa con licencia de la CNMV' [ECR | Garantías adicionales]; 'Ecrowd no ostenta la condición de empresa de servicios de inversión, ni de entidad de crédito' [ECR | same]"
  lemon_way:
    entity: lemon_way
    role: account_bank_trustee
    groups: [collection]
    status: inferred
    name: Lemon Way
    text: "'Todos los movimientos de fondos de inversores en Ecrowd se efectúan mediante la plataforma de pagos Lemon Way' [ECR | Garantías adicionales]. Inferred account_bank_trustee (adjudicated): it holds and moves the investors' and promoter's money in payment accounts; not collector_biller, because it never receives the school's payments. The statement is platform-wide, printed on this loan's page"
  administrator:
    role: surety_guarantor
    groups: [risk]
    status: stated
    text: "'el aval personal del administrador y socio principal de Globaluz, S.L.' [ECR | Garantías adicionales del préstamo colectivo]. Not named on the page"
  energy_supplier:
    role: utility_supplier
    groups: [energy, collection]
    status: inferred
    text: "the school's energy bills ('facturas energéticas') exist and Globaluz takes them over [ECR | Descripción del proyecto]; the supplier is not named. Inferred from the bills"

contract:   # the agreements that establish the commitments
  energy_service_contract:
    core: contract
    parties: [globaluz, ies_sanchis_guarner]
    status: stated
    note: "'externalización del servicio energético durante 36 meses bajo el modelo de ahorros garantizados' [ECR | Descripción del proyecto]. Fee, price and M&V terms not public"
  crowd_loan:
    core: contract
    parties: [crowd_lenders, globaluz]
    status: stated
    note: "'préstamo colectivo' of EUR 46,300, 36 monthly instalments, status 'Préstamo amortizado' [ECR | header; Garantías adicionales]. Rate not published"
  personal_guarantee:
    core: contract
    parties: [administrator, crowd_lenders]
    status: stated
    note: "'aval personal del administrador y socio principal' [ECR | Garantías adicionales]"
  platform_terms:
    core: contract
    parties: [ecrowd, globaluz, crowd_lenders]
    status: inferred
    note: "investors accept Ecrowd's 'condiciones de inversión' [ECR | Garantías adicionales]; the promoter's agreement with Ecrowd is inferred from the listing"
  payment_services:
    core: contract
    parties: [lemon_way, crowd_lenders, globaluz]
    status: inferred
    note: "fund movements through Lemon Way [ECR | Garantías adicionales]; footer link 'Condiciones generales plataforma de pagos Lemonway' [ECR | footer]"
  energy_supply:
    core: contract
    parties: [energy_supplier, ies_sanchis_guarner]
    status: inferred
    note: "the school's supply account; who holds the account is not stated (bill_custody records only who pays)"

commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: performance_promise
    from: globaluz
    to: ies_sanchis_guarner
    status: stated
    what: "replaces the school's lighting with LED and guarantees the savings for 36 months: it takes on 'las inversiones necesarias para lograr el ahorro energético y económico previsto' [ECR | Descripción del proyecto]; savings estimated at 43,730 kWh/yr, 65% [ECR | same]. Own investment inside this promise"
    established_by: energy_service_contract
  c2:
    family: payment_promise
    from: ies_sanchis_guarner
    to: globaluz
    status: inferred
    what: "pays Globaluz for the outsourced energy service over 36 months; amount and basis not public. Inferred from 'externalización del servicio energético' with Globaluz carrying the bills and the investment"
    established_by: energy_service_contract
  c3:
    family: payment_promise
    from: globaluz
    to: energy_supplier
    status: stated
    what: "pays the school's energy bills for the contract term: 'Globaluz se hace cargo de las facturas energéticas durante ese periodo' [ECR | Descripción del proyecto]"
    established_by: energy_supply
  c4:
    family: performance_promise
    from: energy_supplier
    to: ies_sanchis_guarner
    status: inferred
    what: "supplies energy to the school; inferred from the bills. The page also expects 'la mejora en el precio de los kWh de las facturas energéticas' [ECR | Descripción del proyecto]"
    established_by: energy_supply
  c5:
    family: determination_promise
    from: unstated
    to: [globaluz, ies_sanchis_guarner]
    status: unstated
    determines: savings   # savings against the guarantee
    what: "establishes the savings achieved against the guarantee; required by F21 because a guaranteed-savings settlement is computed on savings. Who measures, and how, is not public"
    established_by: energy_service_contract
  c6:
    family: funding_promise
    from: crowd_lenders
    to: globaluz
    status: stated
    funding_instrument: loan   # crowd loan
    what: "EUR 46,300 crowd loan from 114 investors [ECR | header]; 'La financiación servirá para acometer todas las inversiones necesarias' [ECR | Descripción del proyecto]"
    established_by: crowd_loan
  c7:
    family: payment_promise
    from: globaluz
    to: crowd_lenders
    status: stated
    what: "repays in 36 monthly instalments ('Cuotas mensuales: 36' [ECR | header]); repaid in full ('Préstamo amortizado'). Rate not published ('Interés anual:' blank)"
    established_by: crowd_loan
  c8:
    family: risk_promise
    covers: [R5b]
    from: administrator
    to: crowd_lenders
    status: stated
    cover_kind: guarantee   # personal guarantee of the administrator (ECR Garantías adicionales)
    what: "personal guarantee of the crowd loan: 'el aval personal del administrador y socio principal de Globaluz, S.L.' [ECR | Garantías adicionales]"
    established_by: personal_guarantee
  c9:
    family: payment_promise
    from: globaluz
    to: administrator
    status: unstated
    what: "counter-promise required by duality; source silent (no guarantee fee stated; as principal shareholder the guarantor may give it for no fee, its consideration being its stake in Globaluz)"
    established_by: personal_guarantee
  c10:
    family: agency_promise
    from: ecrowd
    to: [globaluz, crowd_lenders]
    status: stated
    what: "places the promoter's loan with retail investors and runs the offer as a licensed participative-finance platform [ECR | Garantías adicionales]; it is not a credit institution and does not lend"
    established_by: platform_terms
  c11:
    family: payment_promise
    from: globaluz
    to: ecrowd
    status: unstated
    what: "counter-promise required by duality; source silent ('En Ecrowd no le cobramos ninguna comisión ni sobre sus inversiones ni sobre los intereses' [ECR | Garantías adicionales]: investors pay nothing, so any platform fee falls on the promoter, not stated)"
    established_by: platform_terms
  c12:
    family: agency_promise
    from: lemon_way
    to: [crowd_lenders, globaluz]
    status: stated
    what: "holds and moves the funds: 'Todos los movimientos de fondos de inversores en Ecrowd se efectúan mediante la plataforma de pagos Lemon Way' [ECR | Garantías adicionales]"
    established_by: payment_services
  c13:
    family: payment_promise
    from: unstated
    to: lemon_way
    status: unstated
    what: "counter-promise required by duality; source silent (Lemon Way's fee and its payer not stated)"
    established_by: payment_services

settings:   # the 13 LOD 0 facets, in vocabulary order (payment_basis added 1 Oct, owner ruling)
  payment_basis: {value: savings, status: inferred, why: "c2 amount and basis not public; c1 contract 'bajo el modelo de ahorros garantizados' ([ECR] Descripción del proyecto, ecrowdinvest.com/detalles/globaluz-silla-valencia)."}
  client_sector:
    value: public
    status: inferred
    why: "an 'instituto de secundaria' (IES) [ECR | Resumen] whose page sits on the Generalitat Valenciana's education portal under the 'Conselleria de Educación, Cultura y Universidades' [GVA | page header]. Inferred: no source says 'public' in words (adjudicated)"
  partner_form:
    value: corporate
    status: inferred
    why: "Globaluz, S.L., a registered ESCO with more than one project on the platform ('GLOBALUZ-2'); no deal SPV is mentioned"
  borrower:
    value: partner
    status: inferred
    why: "the borrower is not named in words (adjudicated, writer R): the loan is 'Promovido por GLOBALUZ, S.L.'; guarantee by 'el administrador y socio principal de Globaluz' [ECR | header; Garantías adicionales]"
  receivable_holder: {value: partner, status: default, why: "no assignment of the school's payments is stated"}
  collection_placement: {value: operator_own, status: default, why: "not stated; Lemon Way handles the investors' funds, not the school's payments"}
  aggregation: {value: none, status: default, why: "one school, one contract"}
  debt_seniority:
    value: senior
    status: default
    why: "one crowd loan; rank not stated. Personally guaranteed, which says nothing on rank"
  assignment_recourse: {value: not_applicable, status: default, why: nothing assigned}
  savings_basis:
    value: measured
    status: default
    why: "guaranteed savings ('ahorros garantizados'), but whether measured or deemed is not public"
  grant_recipient: {value: none, status: default, why: "no grant mentioned"}
  asset_owner:
    value: client
    status: default
    why: "not stated who owns the LED fittings during the 36 months"
  bill_custody:
    value: provider
    status: stated
    why: "'Globaluz se hace cargo de las facturas energéticas durante ese periodo' [ECR | Descripción del proyecto]"

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments + (b) non-repayable government financing, else ON BALANCE SHEET for government (E15 L2578-2582)
    applies_here: true
    this_case: "applies (public school in Spain, inferred) but cannot be evaluated: the school's payments, the guaranteed savings value and the term structure are not public; no government financing is mentioned"
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: [partner, lessor, vehicle]}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? Private counterpart of C1 (trigger widened per batch-2 verdict change 2)"
    applies_here: false
    this_case: public client (C1 instead)
    source: E02 L3293-3295; batch2/review/verdict.md change 2

numbers:   # published figures with units; derived values with arithmetic
  crowd_loan_eur: 46300                 # 'Importe : 46.300€' [ECR | header]
  investors: 114                        # [ECR | header]
  monthly_instalments: 36               # [ECR | header]
  contract_term_months: 36              # [ECR | Descripción del proyecto]
  interest_rate: not published          # 'Interés anual:' blank [ECR | header]
  savings_kwh_per_year: 43730           # [ECR | Descripción del proyecto]
  savings_share_of_current_use: 0.65    # 'un 65% sobre el consumo actual' [ECR | same]
  co2_avoided_t_per_year: 16            # [ECR | same]
  ticket_range_eur: {min: 50, max: 1000}   # [ECR | Inversores tab]
  derived:
    investor_sum: "the 114 listed tickets sum to EUR 46,300 (closes with the header amount)"
    average_ticket: "46,300 / 114 = EUR 406"
    implied_baseline: "43,730 / 0.65 = 67,277 kWh/yr current use; after the works 67,277 - 43,730 = 23,547 kWh/yr (implied, not published)"
    co2_factor: "16,000 kg / 43,730 kWh = 0.37 kg CO2/kWh (implied)"
    term_match: "loan 36 monthly instalments = contract 36 months (the loan is sized to the contract term)"
    instalment: "not computable: rate and start date not published"

reciprocity:   # gives/receives computed from commitments; one_way per convention F06
  ies_sanchis_guarner: {gives: [c2], receives: [c1, c4, c5], one_way: false}
  globaluz: {gives: [c1, c3, c7, c9, c11], receives: [c2, c5, c6, c10, c12], one_way: false}
  crowd_lenders: {gives: [c6], receives: [c7, c8, c10, c12], one_way: false}
  ecrowd:
    gives: [c10]
    receives: [c11]
    one_way: true
    reason: the platform's fee exists only by duality (investors are charged nothing); recorded as c11 unstated
  lemon_way:
    gives: [c12]
    receives: [c13]
    one_way: true
    reason: the payment institution's fee exists only by duality; recorded as c13 unstated
  administrator:
    gives: [c8]
    receives: [c9]
    one_way: true
    reason: the guarantor's consideration exists only by duality; recorded as c9 unstated
  energy_supplier: {gives: [c4], receives: [c3], one_way: false}

lod0_gaps:   # what the deal needs that LOD 0 lacks, each with a classification
- kind: rate_fee_dates_not_public
  description: "The crowd loan's rate and dates and the school's payment to Globaluz are behind the investor login; no ladder can close and C1 cannot be evaluated"
  classification: "evidence gap"
- kind: individual_guarantor
  description: "The surety is a natural person (the administrator and principal shareholder). surety_guarantor reads 'Bank or parent company guaranteeing the Partner's obligations'; a principal shareholder is the parent in substance. Proposed touch-up: 'bank, parent company or principal shareholder'"
  classification: "definition touch-up (minor); no new term"
- kind: platform_vs_payment_institution
  description: "Two parties sit around the crowd loan: Ecrowd places it (crowdfunding_platform) and Lemon Way holds and moves the money. account_bank_trustee is the nearest role for a payment institution holding segregated client funds; collector_biller is the alternative"
  classification: "encoding question"
- kind: determination_unnamed
  description: "A guaranteed-savings contract needs a savings determination (F21), but who measures is not public; c5 from 'unstated'"
  classification: "evidence gap"

conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F02
  title: jurisdiction header field; C1 trigger
  convention: 'A `jurisdiction` block (country, EU membership, whether the client is EU general government) sits in the miniature header; C1 applies_when {client_sector: public, jurisdiction: EU}. Dated at financial close.'
  origin: verdict change 2; findings F02; batch-2 verdict change 3
  applied_here: jurisdiction ES; C1 applies_here true, not computable
- id: F06
  title: one_way form (CASE_SPEC)
  convention: 'A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated.'
  origin: verdict rule; findings F06
  applied_here: "ecrowd, lemon_way, administrator one_way (c11, c13, c9 unstated)"
- id: F21
  title: determination_promise is required
  convention: "A determination_promise is required whenever a payment is computed on savings or completion; from = the party the source names, else the literal 'unstated'."
  origin: verdict rule; findings F21
  applied_here: "c5 from 'unstated' (guaranteed savings, measurer not public)"
- id: F23
  title: deal boundary
  convention: "Funding one level up stays in; actors outside the deal go to source.context."
  origin: verdict rule (batch 1)
  applied_here: "Ministry/IDAE registry, ANESE, CNMV and Banco de España go to context"
- id: B1-own-capital
  title: provider's own capital stays inside its performance_promise
  convention: "Provider's own capital under one service contract is inside its performance_promise; funding_promise needs a distinct claim between distinct parties."
  origin: lod0-validation.md encoding rules
  applied_here: "Globaluz's investment for the school sits in c1; the crowd loan is c6"
- id: IFRS16
  title: IFRS16_lease_test rule entry, trigger widened
  convention: "IFRS16_lease_test applies_when {client_sector: private, asset_owner not client} (batch-2 verdict change 2)."
  origin: verdict change 6; batch-2 verdict change 2
  applied_here: not triggered (public client)
- id: B3-web
  title: web evidence (CASE_SPEC_3/4)
  convention: "Evidence cited '<url> | <page or section>' with exact quotes of 25 words or fewer; news-only facts generic and secondary."
  origin: CASE_SPEC_3, CASE_SPEC_4
  applied_here: the platform's project page (primary for the offer); detail tabs closed to non-participants
- id: B3-scope
  title: in_scope decided from the source (batch-3 ruling)
  convention: "A case counts only if the source shows an efficiency deal; otherwise the file is kept as a witness and its uses do not count."
  origin: batch3/review/decisions.json (posigen_backleverage)
  applied_here: in_scope true (guaranteed-savings ESE contract)

coverage:   # computed from the blocks above, not typed; below_lod0 is the writer's note
  roles_used: [authority, partner_esco, lender, crowdfunding_platform, account_bank_trustee, surety_guarantor, utility_supplier]
  roles_count: 7 of 41
  families_used: [payment_promise, performance_promise, funding_promise, risk_promise, agency_promise, determination_promise]
  families_absent: [benefit_promise]
  families_unstated_only: [determination_promise]
  settings_by_status: {stated: 1, inferred: 4, generic: 0, default: 8}
  commitments_by_status: {stated: 7, inferred: 2, generic: 0, unstated: 4}
  one_way_parties: [ecrowd, lemon_way, administrator]

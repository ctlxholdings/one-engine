numbers:
  capital_investment: "INR 650 million (US$9.8 million) (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:695-696 | 'The ESCO invested INR 650 million (US$9.8 million)')"
  kfw_share: "80 percent of the capital investment (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:697)"
  eesl_equity_share: "20 percent (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:737)"
  annuity: "INR 185 million (US$2.8 million) every year for 7 years (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:738-739); Figure 2 'INR 185 million per year for 7 years (10% interest rate)'"
  interest_rate_stated: "10 percent (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:739-740 | 'reflects an annual interest rate of 10 percent')"
  expected_savings: "50 to 55 percent of baseline consumption (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:741)"
  luminaires: "91,775 LED luminaires (Figure 2); 'its 92,000 lights' (summary); 81,000 of 91,000 destroyed by the cyclone (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:664-666)"
  installation_time: "45 days (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:756); 'six weeks' (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:231-232 | 'The entire replacement was accomplished in six weeks')"
  kfw_figure_label: "'50 million loan' on the KfW arrow of Figure 2; unit and currency not printed"
  derived:
    split: "80% of INR 650m = 520m (KfW); 20% = 130m (EESL equity); 520 + 130 = 650 (ties). At the printed rate 650 / 9.8 = 66.3 INR per US$"
    exchange_rate: "185 / 2.8 = 66.1 INR per US$, against 66.3 from the investment: ties within 0.4%"
    total_annuity: "185 x 7 = INR 1,295 million, 1.99 times the INR 650 million invested"
    interest_check: "an annuity of INR 650m over 7 years at 10% is 650 x 0.10 / (1 - 1.1^-7) = INR 133.5 million per year; the source prints 185. DOES NOT TIE. INR 185m a year over 7 years on INR 650m implies about 20.9% a year. The present value of 185 for 7 years at 10% is INR 900.7m. The annuity may include more than capital repayment (the model separates capital from operation and maintenance, der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:778-779, but does not say the annuity includes the latter); the source does not reconcile it"
    kfw_label: "INR 520m = about US$7.8m at 66.3; the '50 million' label cannot be tied (unit not printed)"
    installation_time: "45 days = 6.4 weeks, against 'six weeks' in the summary: consistent to rounding"
    lights_count: "91,775 vs 92,000: 0.2% apart, rounding"


# Miniature — EESL LED street lighting, Visakhapatnam (Vizag), India: super-ESCO lease repaid by a fixed annuity with a state guarantee, at ESCO LOD 0.
# Batch 7, group J, reviewed final (X and Y reconciled, 3 Oct 2026; decisions in ../decisions.json). Evidence: one World Bank ESMAP report, cited by line of the local text (grep -n numbering), quotes <= 25 words.
# Every fact carries its status: stated / inferred / default / generic / unstated.

miniature: eesl_vizag_led_lease
lod: 0
case: batch7.T06
case_kind: deal   # one city, one retrofit of about 92,000 street lights, one seven-year lease
in_scope: true
in_scope_why: "The in-scope test asks whether a fixed annuity repaid 'from the energy savings' is an ESCO deal. The source calls it 'an annuity-based ESCO model' and says payments 'are based on initially demonstrated and agreed upon energy performance rather than the energy bill', so the annuity is sized on deemed savings: payment_basis savings (savings_basis deemed). Read as a plain fixed price for equipment it would be asset, and the deal would still count under ruling 14 as an efficiency deal. der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:761-762 | 'an annuity-based ESCO model is one such innovation' ; der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:764-765 | 'Payments to the super-ESCO are based on initially demonstrated and agreed upon energy performance rather than the energy bill.'"

tests_unused:
- item: authority_guarantor
  kind: role
  used: true
  reason: "The Andhra Pradesh state government guarantees the municipal corporation's payments to EESL: der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:737-738 | 'the Andrah Pradesh government provided the payment guarantee.' . A state guaranteeing a city's own annuity is the role's public-client case. The earlier batches found no such guarantor of a public client's payments"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "EESL itself owns the luminaires until the lease ends: der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:742-743 | 'ownership of the luminaires will revert to GVMC.' . No third-party owner"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No receivable is sold or issued against; the annuity stays with EESL"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "The KfW loan has no hedge in the text; the currency of the loan is not stated"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "The annuity is fixed and sized on deemed savings: der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:777 | 'Repayments are based on fixed annual payments by the municipal corporation.' . There is no availability or comfort level tied to the amount. The caveat is the service-level agreement (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:774-775), which covers standards and warranties, not the payment"

single_source_exercised:
- term: authority_guarantor
  kind: role
  evidence: "der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:737-738 | 'the Andrah Pradesh government provided the payment guarantee.'"
  status: stated

source:
  id: ESMAP
  title: "Proven Delivery Models for LED Public Lighting, case study 2, Super-ESCO Delivery Model: Energy Efficiency Services Limited in Vizag, India"
  publisher: World Bank ESMAP, 2017
  passage: "Case summary 2 at local text lines 221-236; case study 2 at 660-787; Figure 2 at 700-734; risk table at 1505-1523; later mention at 1573-1574"
  documents:
    ESMAP: "der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt"
  oracle: "none; not a published validation target"
  context:
  - "Ministry of Power and four public companies (NTPC, Power Grid, PFC, REC) hold EESL: Figure 2 shows 'Ministry of Power' ... '60% stake' (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:703-710). EESL's ownership, outside this deal"
  - "Vizag citizens are the beneficiaries of 'Better lighting in Vizag' (Figure 2, der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:729); they are not a party"
  - "Cyclone Hudhud destroyed 81,000 of 91,000 street lights in 2014: der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:664-666 | '81,000 of the 91,000 streetlights in Vizag were' . Context for the emergency procurement"
  - "India's Ministry of Power set EESL up in 2010: der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:223-225 | 'the government of India, through the Ministry of Power, had set up a super‐' ... 'ESCO called Energy Efficiency Services Limited (EESL)'"
  notes:
  - "Figure 2 is read as text with broken letters ('Naonal', 'Installaon'); its figures are read as printed: INR 650 million capital, 91,775 LED luminaires, INR 185 million per year for 7 years (10% interest rate), '50 million loan' from KfW (unit and currency not printed)"
  - "Vizag is the city's short name for GVMC in the text ('Vizag will make the annuity payments'); the lease payer is GVMC (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:738-739)"
  - "The annuity-model features (L762-780) are written as general features of EESL's model. They are applied to Vizag by inference unless the line names Vizag"


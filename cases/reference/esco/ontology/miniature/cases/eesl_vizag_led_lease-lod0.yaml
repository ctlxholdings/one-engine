  classification: encoding question
- kind: partner_is_lessor_and_aggregator
  description: "EESL is Partner, super-ESCO and lessor in one entity. asset_owner takes one value: lessor was chosen (alternative partner) and EESL carries all three roles. Expressible, but the lessor/partner split of title is blurred"
  classification: encoding question
- kind: guarantee_instrument
  description: "the state's payment guarantee has no described instrument, extent or fee; it is attached to the tripartite implementation agreement by inference"
  classification: evidence gap
- kind: annuity_composition
  description: "INR 185m x 7 years does not equal a 10% annuity on INR 650m; what the annuity includes (capital only, or operation and maintenance too) is not stated"
  classification: evidence gap
- kind: title_reversion
  description: "ownership of the luminaires reverts to GVMC when the lease ends and all terms are met"
  classification: below LOD 0 (transfer at the end is a LOD 1 event)


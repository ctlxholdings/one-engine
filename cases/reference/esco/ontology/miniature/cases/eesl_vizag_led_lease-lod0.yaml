commitments:
  c1:
    family: performance_promise
    from: eesl
    to: gvmc
    status: stated
    what: "replaces the city's street lighting with LEDs: 91,775 LED luminaires in Figure 2 (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:722 | '91,775 LED'), 'its 92,000 lights' in the summary (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:228 | 'of its 92,000 lights'), installed in 45 days (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:756 | 'installation was completed in a record 45 days.'); invests INR 650 million and hands the luminaires over when the lease ends (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:742-743 | 'ownership of the luminaires will revert to GVMC.'). The annuity model adds a service-level agreement with technical standards and free replacement warranties (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:774-775 | 'There is a service‐level agreement covering technical standards and free‐replacement warranties.'), a general feature of EESL's model, applied here by inference. Operation and maintenance by EESL is read from the Figure 2 label on the EESL-to-GVMC side, printed with dropped letters as Installaon, operaons, and maintenance (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:717-719), inferred. No savings guarantee is stated. EESL's own 20% capital sits inside this promise"
    established_by: lease_contract
  c2:
    family: payment_promise
    from: gvmc
    to: eesl
    status: stated
    depends_on_savings: false   # a fixed INR 185 million every year (ESMAP L738-739)
    what: "der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:738-739 | 'Over the seven‐year leasing contract, GVMC will pay EESL INR 185 million (US$2.8 million) every year' ; 'from the energy savings' (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:740 | 'Vizag will make the annuity payments from the energy savings,'), expected savings 50 to 55 percent of baseline consumption (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:741 | 'are expected to be between 50 and 55 percent of the baseline consumption.')"
    established_by: lease_contract
  c3:
    family: determination_promise
    from: [eesl, gvmc]
    to: [eesl, gvmc]
    status: inferred
    determines: savings   # savings demonstrated by sampling (ESMAP L767-768)
    what: "savings are 'demonstrated on a sampling basis during the preparation of a detailed project report' (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:767-768 | 'Energy savings are demonstrated on a sampling basis during the preparation of a detailed project report'), and the annuity rests on that agreed performance, not on later bills (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:764-765). For Vizag the usual audit steps 'were skipped or compressed' (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:688-690 | 'the usual project development steps—preparing detailed energy audits, verifying the number of lights,'); the sampling description is a general model feature, applied to Vizag by inference. The determination is made once, up front (deemed), and the performance is 'agreed upon' by both sides (L764), so both are named; who runs the sampling is not stated"
    established_by: lease_contract
  c4:
    family: risk_promise
    covers: [R5a]
    from: ap_government
    to: eesl
    status: stated
    cover_kind: guarantee   # payment guarantee (ESMAP L737-738)
    what: "payment guarantee on the city's annuity: der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:737-738 | 'the Andrah Pradesh government provided the payment guarantee.' ; the model's guarantee is 'required to cover the capital costs' (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:771 | 'A bank or state government guarantee is required to cover the capital costs.') and gives EESL 'a repayment mechanism in case the city defaults' (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:771-773 | 'Ensuring that there is a repayment mechanism in case the city defaults on its payments reduces'). Beneficiary EESL is inferred from that line; extent and form are not described"
    established_by: implementation_agreement
  c5:
    family: payment_promise
    from: eesl
    to: ap_government
    status: unstated
    what: counter-promise required by duality; the source mentions no guarantee fee
    established_by: implementation_agreement
  c6:
    family: funding_promise
    from: kfw
    to: eesl
    status: inferred
    funding_instrument: loan   # KfW loan (ESMAP L697, L737)
    what: "der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:697 | 'A KfW loan financed 80 percent of the capital investment, EESL provided the' remaining 20 percent as equity (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:737 | 'remaining 20 percent as its equity in the project, and the'); Figure 2 labels the arrow '50 million loan', unit not printed. EESL's own 20% sits inside c1 (own capital under one service contract). Inferred: the prose does not name the borrower; the Figure 2 arrow and the 20% equity sentence make it EESL"
    established_by: kfw_loan
  c7:
    family: payment_promise
    from: eesl
    to: kfw
    status: inferred
    what: "repayment of the KfW loan; follows from c6 (a loan is repayable); rate, tenor and currency not published"
    established_by: kfw_loan
  c8:
    family: performance_promise
    from: manufacturers
    to: eesl
    status: stated
    what: "supply of the LED luminaires: der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:750-751 | 'won the bid to supply the LEDs' . Product warranties are stated only for the report's programmes in general (L1532-1533), not for Vizag, so none is recorded here"
    established_by: supply_contracts
  c9:
    family: payment_promise
    from: eesl
    to: manufacturers
    status: inferred
    what: "price of the luminaires, paid out of the INR 650 million investment; price not published"
    established_by: supply_contracts
  c10:
    family: performance_promise
    from: installers
    to: eesl
    status: stated
    what: "der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:751-752 | 'and a couple of smaller companies won the bids to install.'"
    established_by: installation_contracts
  c11:
    family: payment_promise
    from: eesl
    to: installers
    status: inferred
    what: "price of the installation; not published"
    established_by: installation_contracts

settings:
  payment_basis:
    value: savings
    status: inferred
    why: "the annuity is repaid 'from the energy savings' (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:740) and sized on 'initially demonstrated and agreed upon energy performance rather than the energy bill' (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:764-765): deemed savings. Alternative: asset, since the payment is a fixed lease rent and ownership reverts at the end (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:777 | 'Repayments are based on fixed annual payments by the municipal corporation.')"
  client_sector:
    value: public
    status: stated
    why: "a municipal corporation (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:667-668)"
  partner_form:
    value: corporate
    status: inferred
    why: "EESL is a standing government-owned company serving many cities (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:782-784 | 'being government‐owned has allowed EESL to develop a widely accepted')"
  borrower:
    value: partner
    status: inferred
    why: "EESL raised the project money: KfW financed 80% and EESL 20% as equity (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:697 ; der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:737). The loan is to EESL by Figure 2's arrow (the text does not say who borrowed), so inferred. Alternative: none for the city, which pays a lease, not a loan; the 'leasing contract' is the city's side (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:738)"
  receivable_holder:
    value: partner
    status: stated
    why: "'GVMC will pay EESL' (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:738-739); no assignment of the annuity is mentioned; the guarantee is a separate promise (c4)"
  collection_placement:
    value: operator_own
    status: default
    why: "not stated for Vizag; the annuity-model payments are 'fixed annual payments by the municipal corporation' (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:777). Other cases of the same report use escrow and on-bill routes, not this one"
  aggregation:
    value: super_esco
    status: stated
    why: "the report titles the model 'Super‐ESCO Delivery Model' and calls EESL 'a well‐respected super‐' ESCO (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:668-670 | 'a well‐respected super‐'). EESL contracts the manufacturers and installers itself (c8, c10); aggregation = super_esco goes with the role aggregator_super_esco, carried by EESL"
  debt_seniority:
    value: senior
    status: default
    why: not stated
  assignment_recourse:
    value: not_applicable
    status: inferred
    why: follows from receivable_holder = partner
  savings_basis:
    value: deemed
    status: inferred
    why: "savings are 'demonstrated on a sampling basis during the preparation of a detailed project report' (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:767-768) and the annuity does not follow later measurement (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:764-765 : 'removes the measurement and verification challenges'). Model feature, applied to Vizag by inference"
  grant_recipient:
    value: none
    status: default
    why: "no grant is mentioned; KfW is a lender here ('financed 80 percent', der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:697)"
  asset_owner:

  status: stated
  why: "Greater Visakhapatnam Municipal Corporation, Andhra Pradesh, India (der-vpp/spec-run/esco-moneyflow/input/wb-esmap-proven-delivery-models-led-public-lighting-2017.txt:663-668); outside the EU, so C1 does not apply"


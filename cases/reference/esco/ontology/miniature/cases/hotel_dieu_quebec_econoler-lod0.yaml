# Miniature: Hotel-Dieu de Quebec hospital energy programme (Econoler, Canada, 1982-1998), expressed at ESCO LOD 0.
# Batch 7, group M, reviewed final (reconciles writers X and Y, 3 Oct 2026).
#
# Evidence: one local text, the IEPF / Econoler book on PPP financing of energy efficiency (2008), in French.
# ECO = der-vpp/spec-run/esco-moneyflow/input/econoler-ppp-financing-ee-developing-countries-2008.txt. Cited as ECO L<line> | 'quote'.
# Quotes are 8 words or fewer (review rule for this group). Line numbers as grep -n counts them; every line re-opened by the reviewer.
# The book gives the hospital as a one-page box (L4919-4953) and names it as the example of Econoler's guarantee-only projects (L4870-4872).
# No contract, price split or payment schedule is published: most of the money chain is inferred, and said so.
# Every fact carries its status: stated / inferred / default / generic / unstated.

miniature: hotel_dieu_quebec_econoler
lod: 0
case: batch7.T13
case_kind: deal   # one named hospital project delivered in phases; the contract itself is not published
in_scope: true
in_scope_why: "Econoler managed and carried out every technical phase of a series of energy-saving measures ('Econoler a géré et réalisé', ECO L4938) and the hospital is the book's example of projects done with 'uniquement la garantie de performance' (ECO L4870-4871). An efficiency deal (ruling 14); payment_basis savings (inferred), so an ESCO deal"

tests_unused:
- item: borrower=none
  kind: setting_value
  used: true
  reason: "Client-financed, no loan named. The book puts the hospital among projects done on the performance guarantee alone (ECO L4870-4872), the approach used 'sans offrir de financement de projets' (ECO L4677), and says 'plusieurs clients les financent eux-mêmes' (ECO L4898). Inferred, because the box also says the project was to 'réaliser et financer' the measures (ECO L4923); see source.notes"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "What is guaranteed is energy savings ('garanties de performances des économies', ECO L4676), not availability, output or comfort"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "No receivable is sold and no notes are issued; no financing is described for this project"
- item: hedge_counterparty
  kind: role
  used: false
  reason: "No hedge or rate instrument is mentioned for the hospital"
- item: authority_guarantor
  kind: role
  used: false
  reason: "No guarantee of the hospital's payments is described. Nouveler's CAD 5 million guarantee (ECO L4696-4698, L4821-4824) backs Econoler's own financing of its third-party-investor projects, not this project"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "Nothing says anyone but the hospital holds title to the installed measures"

single_source_exercised:
- term: borrower=none
  evidence: "der-vpp/spec-run/esco-moneyflow/input/econoler-ppp-financing-ee-developing-countries-2008.txt:4898 | plusieurs clients les financent eux-mêmes"
  confirmed: "inferred for this hospital: the line is about Econoler's guarantee-only clients in general; the hospital is named as that group's example at L4871 ('voir l’exemple de l’hôpital Hôtel-Dieu'). The box's own wording at L4923 points the other way"

source:
  id: ECO
  title: "IEPF / Econoler book on the role of PPP in energy-efficiency finance (2008), chapter 3 case study Econoler, box 3 on the Hôtel-Dieu de Québec hospital"
  publisher: IEPF with the Agence de l'efficacité énergétique du Québec and Econoler, 2008
  passage: "ECO L4545-4953 (case study: L4549-4668 context, L4687-4749 parties and offer, L4751-4905 implementation and results, L4919-4953 hospital box); L4866-4872 (hospital as guarantee-only example)"
  oracle: "none; not a published validation target"
  context:
  - "Hydro-Québec: its surplus-electricity tariff made the 1984 electric boiler pay ('un tarif avantageux d’Hydro-Québec (1984)', ECO L4933). A tariff the deal uses, not a promise made in it: recorded as a rule"
  - "Federal energy ministry (Énergie, Mines et Ressources Canada): gave the hospital a 1994 energy-efficiency prize (ECO L4948-4952). An award, context"
  - "The hospital's energy management committee, created inside the institution (ECO L4925-4926): part of the client"
  - "Nouveler (parapublic, created by Banque Nationale du Canada, Hydro-Québec and SGF, ECO L4570-4571), ADS (private engineering firm, ECO L4550-4551) and Banque Nationale du Canada: Econoler's shareholders and its bank for third-party-investor projects (ECO L4693-4698, L4827-4829). No promise to the hospital is stated: outside the deal boundary"
  notes:
  - "Financing conflict. The box says the project was to 'évaluer, concevoir, réaliser et financer' the measures (ECO L4923), without saying who financed. The running text names the hospital as the example of guarantee-only projects (ECO L4870-4872), which Econoler did without financing (ECO L4676-4677). The specific pointer is taken: client-financed, borrower none (inferred). If the box is right, borrower = partner and a funding leg from Econoler (or its bank) is added"
  - "The box counts 'quatre phases' (ECO L4924) but lists dated items in 1982, 1984, 1988 and 1994 under 'les trois phases initiales' (ECO L4930-4937). Not reconciled; no figure depends on it"
  - "Savings are given from 1981 (ECO L4942), a year before the first measures (1982, ECO L4931). Taken as printed"
  - "Econoler's generic offer (turnkey project for a management fee, repayment guaranteed in under five years or the balance is Econoler's, ECO L4720-4721, L4734-4736) describes its financed projects; not applied to the hospital"

jurisdiction:
  country: Canada (Quebec)
  iso: CA-QC
  eu_member: false
  client_eu_general_government_at_close: false
  as_of: "phases 1982, 1984, 1988, 1994 (ECO L4931-4937); no single financial close"
  status: stated
  why: "Hôpital Hôtel-Dieu de Québec (ECO L4920), Hydro-Québec tariff (ECO L4933), amounts in CAD (ECO L4939). Not an EU member; C1 does not apply"

core_v7:
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: each contract establishes (fibo-fnd-rel-rel:confers) its commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:
  hospital:
    entity: hopital_hotel_dieu_de_quebec
    role: authority
    groups: [demand, public]
    status: inferred
    name: Hôpital Hôtel-Dieu de Québec
    text: "the project's client (ECO L4920) and the party that realised the savings (ECO L4942-4948). The box never says the hospital is public. Role authority inferred from Econoler's first target market, government institutions (ECO L4784-4787), 'Hôpitaux et écoles' among them (ECO L4794). Alternative host"
  econoler:
    entity: econoler
    role: partner_esco
    groups: [partner]
    status: stated
    name: Econoler
    text: "'Econoler a géré et réalisé' all technical phases, for CAD 4,000,000 (ECO L4938-4939). The 'première entreprise de services éconergétiques' in Canada (ECO L4553), formed by Nouveler and ADS (ECO L4549-4550). Econoler has no entity yet: cases/parties.yaml lists it only as one member of the EEE consortium, a case-local bundle"

contract:
  performance_guarantee_contract:
    core: contract
    parties: [hospital, econoler]
    status: inferred
    note: "the book calls Econoler's guarantee-only deals 'contrats de garanties de performance' (ECO L4899) and names the hospital as the example (ECO L4871). Date, term and price formula are not published. Phases ran 1982 to 1994 (ECO L4931-4937), so there may be one contract per phase; one is written"

commitments:
  c1:
    family: performance_promise
    from: econoler
    to: hospital
    status: stated
    what: "evaluate, design and carry out a series of energy-saving measures in phases (ECO L4923-4924, L4930-4937): six measures (1982), an electric boiler on surplus power (1984), central control (1988), 14 energy-management measures (1994); 'Econoler a géré et réalisé' them (ECO L4938). The savings guarantee sits inside this promise (inferred from ECO L4870-4871; level and terms not published); any shortfall make-good stays here (G18)"
    established_by: performance_guarantee_contract
  c2:
    family: payment_promise
    from: hospital
    to: econoler
    status: inferred
    what: "payment for the works and Econoler's management: 'un coût total de 4 000 000 CAD' (ECO L4939). Amount stated; that the hospital paid it is inferred (client-financed, ECO L4870-4872, L4898). Fixed price, management fee or savings-linked: not stated"
    established_by: performance_guarantee_contract
  c3:
    family: determination_promise
    from: econoler
    to: hospital
    status: inferred
    determines: savings   # evaluation of the programme's results (ECO L4927-4928)
    what: "the programme's results were evaluated with an energy management software, SYNERGIE, which 'a permis l’évaluation des résultats du programme' (ECO L4927-4928). Who ran it is not said; Econoler's offer included a savings evaluation and verification plan (ECO L4815-4817, generic). The performing party determines and the client receives (F21); no independent verifier is named"
    established_by: performance_guarantee_contract

settings:
  payment_basis:
    value: savings
    status: inferred
    why: "the hospital is the example of projects done on 'garanties de performances des économies' (ECO L4676, L4870-4871) and the box reports the result as savings, 'environ 4 800 000 $' (ECO L4947). The price formula is not published. Alternative asset: a fixed price for works with the guarantee as a warranty"
  client_sector:
    value: public
    status: inferred
    why: "a hospital; Econoler targeted government institutions, hospitals and schools first (ECO L4784-4797). The box does not state ownership"
  partner_form:
    value: corporate
    status: inferred
    why: "Econoler is a standing company with more than 1,000 projects (ECO L4866-4867), not a vehicle set up for this hospital"
  borrower:
    value: none
    status: inferred
    why: "guarantee-only project, no financing offered (ECO L4676-4677, L4870-4872); 'plusieurs clients les financent eux-mêmes' (ECO L4898). No lender is named. Contradicted by the box's 'et financer' (ECO L4923); alternatives partner (Econoler financed) or client (the hospital borrowed). See source.notes"
  receivable_holder:
    value: partner
    status: default
    why: "no assignment of the hospital's payments is mentioned"
  collection_placement:
    value: operator_own
    status: default
    why: "not stated"
  aggregation:
    value: none
    status: inferred
    why: "one hospital, one series of measures; Econoler's hundreds of other guarantee-only projects are separate contracts (ECO L4869-4872), not pooled"
  debt_seniority:
    value: senior
    status: default
    why: "no debt in the deal"
  assignment_recourse:
    value: not_applicable
    status: inferred
    why: "nothing assigned (receivable_holder partner)"
  savings_basis:
    value: measured
    status: inferred
    why: "results evaluated with SYNERGIE (ECO L4927-4928) and Econoler's offer carried a savings evaluation and verification plan (ECO L4815-4817); nothing says savings were stipulated at signing"
  grant_recipient:
    value: none
    status: default
    why: "no grant or subsidy is described. The 1994 prize (ECO L4948-4952) is an award, not funding"
  asset_owner:
    value: client
    status: inferred
    why: "client-financed works in the hospital's own building; no lease or Econoler title is mentioned"
  bill_custody:
    value: client
    status: inferred
    why: "the hospital keeps buying its energy: the new electric boiler runs on Hydro-Québec surplus power at a favourable tariff (ECO L4931-4933); no provider-pays arrangement"

rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, client_eu_general_government_at_close: true}
    rule: "NPV at financial close of guaranteed savings over the EPC >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: false
    this_case: "Canada (Quebec), not EU at close"
    source: E15 L2576-2582, L6930-6943; RULINGS.md ruling 3-4
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16, when a private client pays for assets someone else owns"
    applies_here: false
    this_case: "client_sector public and asset_owner client"
    source: RULINGS.md ruling 7; E02 L3293-3295
  hydro_quebec_surplus_tariff:
    scope: external-sectoral
    rule: "the 1984 electric boiler runs on surplus electricity at 'un tarif avantageux d’Hydro-Québec' (ECO L4932-4933). The surplus tariff was reserved to large-enterprise customers (ECO L4637-4651); how the hospital qualified is not said (a group of Gaspé hospitals lobbied for that status, ECO L4651-4656)"
    applies_here: true
    source: ECO L4932-4933, L4637-4656

numbers:
  project_total_cost_cad: "4,000,000 (ECO L4938-4939)"
  savings_1981_1998_cad: "about 4,800,000 (ECO L4942-4948)"
  measures: "six measures (1982), electric boiler on surplus electricity (1984), centralised control (1988), 14 energy-management measures (1994) (ECO L4930-4937)"
  phases: "four stated (ECO L4924); dated items listed under 'les trois phases initiales' (ECO L4930)"
  award: "1994, highest distinction in energy efficiency, federal energy ministry (ECO L4948-4952)"
  econoler_programme_context: "1,000+ third-party-investor projects 1981-1989 plus several hundred guarantee-only (ECO L4866-4872); CAD 135 million invested by Econoler, recurring savings CAD 35 million a year (ECO L4897-4901). Programme level, not this hospital"
  derived:
    savings_over_cost: "4,800,000 / 4,000,000 = 1.20: cumulative savings 1981-1998 exceed the cost by CAD 800,000 (20%). Undiscounted, and the cost is spread over 1982-1994, so it is not a payback. The source prints no ratio; nothing to tie"

reciprocity:
  hospital: {gives: [c2], receives: [c1, c3], one_way: false}
  econoler: {gives: [c1, c3], receives: [c2], one_way: false}

lod0_gaps:
- kind: financing_conflict_in_source
  description: "the box says the project was to 'réaliser et financer' the measures (ECO L4923); the running text lists it as a guarantee-only project (ECO L4870-4872). LOD 0 can write either (borrower none or partner); the source does not settle which"
  classification: "evidence gap"
- kind: phased_project
  description: "four phases over 1982-1994, possibly one agreement per phase; phase contracts and dates are LOD 1 events"
  classification: "below LOD 0"
- kind: guarantee_and_payment_terms_unpublished
  description: "guarantee level, shortfall settlement, payment schedule and who ran SYNERGIE are not published (ECO L4939 gives only the total cost)"
  classification: "evidence gap"

conventions_applied:
- id: F02
  title: jurisdiction header, dated at close
  convention: "country, EU membership, client EU general government at close"
  origin: RULINGS.md ruling 4
  applied_here: "CA-QC, C1 false; phased, no single close"
- id: F21
  title: determination_promise required
  convention: "a payment tied to savings needs a determining party; the performing party determines, the client receives"
  origin: verdict rule
  applied_here: "c3 from Econoler, inferred"
- id: G18
  title: shortfall make-good stays in performance_promise
  convention: "the performing party's own make-good is part of its performance_promise"
  origin: verdict rule; gaps G18
  applied_here: "inside c1; no risk_promise"
- id: B7-ruling14
  title: every efficiency deal counts; ESCO or not is read from payment_basis
  convention: "in_scope true for any efficiency deal; payment_basis != asset marks an ESCO deal"
  origin: RULINGS.md ruling 14
  applied_here: "savings (inferred): ESCO deal"
- id: B7-ruling17
  title: contracts binding and settled by default
  convention: "binding: non_binding or terms_settled: unsettled only when the source says so"
  origin: RULINGS.md ruling 17
  applied_here: "the one contract stays binding and settled"
- id: B7-ruling18
  title: one identity per legal entity
  convention: "entity when already in cases/parties.yaml, entity_new otherwise"
  origin: RULINGS.md ruling 18
  applied_here: "Econoler and the hospital are new entities (the EEE consortium entry is a different legal person)"


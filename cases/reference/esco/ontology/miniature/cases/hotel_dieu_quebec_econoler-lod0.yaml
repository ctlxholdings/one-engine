risk_allocation:   # owner rulings 15-16 (3 Oct): rows the source states or implies; the converter derives the rest (ENCODING.md)
  - {category: R1, driver: technical, bearer: [partner_esco], share: sole, status: inferred, evidence: "der-vpp/spec-run/esco-moneyflow/input/econoler-ppp-financing-ee-developing-countries-2008.txt:4870 | offrant uniquement la garantie de performance", why: "the hospital is named as the example of Econoler's guarantee-only projects (L4870-4872), so the performance of the measures sits with Econoler. Equal to the default for a measured-savings deal; kept because the source supports it for this deal. Inferred, not stated: the box itself does not describe the guarantee"}

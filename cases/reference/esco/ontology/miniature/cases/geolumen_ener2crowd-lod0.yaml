reciprocity:   # gives/receives computed from commitments; one_way per convention F06
  end_client: {gives: [c3], receives: [c1, c2], one_way: false}
  geolumen: {gives: [c1, c2, c5], receives: [c3, c4, c6, c8], one_way: false}
  crowd_lenders: {gives: [c4, c7], receives: [c5, c6, c8], one_way: false}
  ener2crowd: {gives: [c6], receives: [c7], one_way: false}
  lemon_way:
    gives: [c8]
    receives: [c9]
    one_way: true
    reason: the payment institution's fee exists only by duality; recorded as c9 unstated

lod0_gaps:   # what the deal needs that LOD 0 lacks, each with a classification
- kind: not_an_esco_deal
  description: "Vendor credit with a savings-sized fee: title passes at once, the fee is fixed, no savings or performance promise. LOD 0 expresses it fully (equipment_supplier with supplier credit, host, lender, platform), but it is outside ESCO scope by the EED EnPC test. in_scope false"
  classification: "scope boundary (encoding question for the owner: whether 'fee below the old bill' alone ever makes a deal ESCO scope)"
- kind: fee_not_published
  description: "The client's monthly fee and its exact term are not public, so the client leg cannot be laddered against the crowd leg"
  classification: "evidence gap"
- kind: fast_ticket_payer
  description: "The +0.5% Fast Ticket bonus is outside the published 5.00% instalment plan; its payer is not stated"
  classification: "evidence gap"
- kind: savings_share_mismatch
  description: "153,670 / 265,280 = 57.9%, published 59%"
  classification: "evidence gap (source inconsistency; no LOD 0 consequence because no payment depends on it)"
- kind: savings_basis_without_savings_promise
  description: "savings_basis has only measured and deemed. With no savings promise the setting describes nothing and takes measured as a placeholder (same as sdcl_seit_rcf). A not_applicable value, as assignment_recourse has, would say so (raised by writer R)"
  classification: "encoding question for the owner (setting value); recurring, not a new term"
- kind: maturity_mismatch
  description: "3-year crowd loan against a 5-year client credit; the refinancing or own-funds bridge for years 4-5 is timing"
  classification: "below LOD 0 (LOD 1 schedule)"

conventions_applied:   # what this file assumes beyond elements.yaml (owner rules on the vocabulary)
- id: F02
  title: jurisdiction header field; C1 trigger
  convention: 'A `jurisdiction` block (country, EU membership, whether the client is EU general government) sits in the miniature header; C1 applies_when {client_sector: public, jurisdiction: EU}. Dated at financial close.'
  origin: verdict change 2; findings F02; batch-2 verdict change 3
  applied_here: jurisdiction IT; private client; C1 applies_here false
- id: F06
  title: one_way form (CASE_SPEC)
  convention: 'A party whose counter-promise exists only by duality is one_way: true with a reason, and the counter-promise is recorded with status unstated.'
  origin: verdict rule; findings F06
  applied_here: "lemon_way one_way (c9 unstated)"
- id: F21
  title: determination_promise is required
  convention: "A determination_promise is required whenever a payment is computed on savings or completion; from = the party the source names, else the literal 'unstated'."

  - {evidence: "geolumen_ener2crowd-lod0.yaml:135, :274 (50,000 crowd plus 60,000 own funds = 110,000); adjudication n 8", figure: capex_eur, origin: "linked by adjudication (blind pair)", promise: c1, promise_kind: performance_promise, sizes: outlay, period: once, scale: 1, scale_rule: "printed in full (no scale in the key)", scale_status: stated, currency: EUR}
  - {evidence: "geolumen_ener2crowd-lod0.yaml:159, :251 (principal), :254 (rate), :256-257 (term, 4 a year, 12 in all), :258 (instalment), :260 (first and last instalment); loans adjudication n 14", figure: crowd_raise_eur, origin: "linked by adjudication (blind pair)", promise: c4, promise_kind: funding_promise, sizes: principal, contract_type: ANN, rate_key: rate, term_key: term_months, cycle: P3ML0, start: "2020-12-31", first_payment: "2021-03-31", maturity: "2023-12-31", day_count: 30E360, day_count_status: default, instalment_check: quarterly_instalment_eur, repaid_by: c5, scale: 1, period: once}
  engine_inputs:   # R-A38 (2): written by program from numbers.links; edit the links, then re-run
    origin: derived from numbers.links by oe.census.inputs_from_links

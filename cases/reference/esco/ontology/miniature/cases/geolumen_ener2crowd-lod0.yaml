  instalments: {per_year: 4, total: 12, preamortisation: 0}   # [CP | Art. 2]
  quarterly_instalment_eur: 4513        # [E2C | Piano di ammortamento; KIIS]
  amortisation_start: 2020-12-31        # [KIIS | Parte C; CP | Art. 2]

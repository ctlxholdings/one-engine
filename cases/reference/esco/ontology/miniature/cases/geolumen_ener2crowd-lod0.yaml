# Miniature — Geolumen S.r.l.: LED relamping ('Illuminazione Intelligente a LED') at an automotive steel-components plant
# in the Province of Chieti (IT, Dec 2020), crowd-lent on Ener2Crowd (EUR 50,000 from 49 investors), expressed at ESCO LOD 0
#
# Batch 4 FINAL (adjudicated 1 Oct 2026 from writers R and S; base S). Shape copied from batch3/final/*-lod0.yaml. Rulings applied: batch2/review/decisions.json,
# batch3/review/decisions.json (in_scope practice from posigen_backleverage).
# Evidence is public web documents, fetched 1 Oct 2026 (WebFetch, then curl to stdout; PDFs through pdftotext to stdout;
# nothing saved), cited as '<url> | <section>' with exact quotes of 25 words or fewer:
#   [E2C]  https://www.ener2crowd.com/it/progetti/dettaglio/88-illuminazione-intelligente-a-led  (project page; primary for the offer)
#   [KIIS] https://www.ener2crowd.com/it/documenti/progetti/327-7A66235E3DEEE99BA1F391CC438DA591  ('Scheda informativa contenente
#          le informazioni chiave sull'investimento', Milano 03/12/2020, linked from the page's DOCUMENTI tab; primary)
#   [CP]   https://www.ener2crowd.com/it/documenti/progetti/329-D06AE7CBDD3D9972942DD500ACE9DCAE  ('Condizioni particolari di
#          contratto di finanziamento', the loan contract template for this offer, linked from DOCUMENTI; primary)
# Every fact carries its status: stated / inferred / default / generic / unstated. Nothing from memory.

miniature: geolumen_ener2crowd
lod: 0
case: batch4.geolumen_ener2crowd
case_kind: deal   # one named crowd loan to Geolumen for one named relamping project (end client unnamed)
in_scope: true
in_scope_why: "Efficiency deal (LED relamping and telemanagement), asset basis: counts under owner ruling 14 (3 Oct: every efficiency deal counts; ESCO or not is read from payment_basis). Earlier verdict: not an ESCO deal, an instalment sale with supplier credit [KIIS | Parte A d]."

tests_unused:   # which still-unused LOD 0 items this case was chosen to test
- item: crowdfunding_platform
  kind: role
  used: false
  reason: "Structurally it fits: Ener2Crowd places Geolumen's loan with 49 retail investors and keeps 3% of interest for managing repayments [KIIS | Parte E]. Encoded on ener2crowd. Not counted: in_scope false (posigen precedent); globaluz_ecrowd carries the in-scope use"
- item: savings_basis
  kind: setting
  used: false
  reason: "No savings promise exists. Savings are an estimate ('risparmio energetico annuo stimabile pari a 153.670 kWh' [E2C | Benefici ambientali]) used to size the fee; the instalments are fixed. The setting takes its default (measured) with nothing to describe"
- item: equipment_supplier
  kind: role
  used: false
  reason: "Structurally it fits: Geolumen makes and sells lighting telemanagement systems [KIIS | Parte A b] and sells the plant on 5-year deferred payment, supplier credit. Not counted (in_scope false); already used in batch 2, so no count depends on it"

source:   # where the facts come from; context = actors outside the deal boundary (F23); notes = observations that are not gaps
  id: [E2C, KIIS, CP]
  title: "Illuminazione Intelligente a LED - Geolumen S.r.l. (Ener2Crowd lending offer, December 2020)"
  publisher: Ener2Crowd S.r.l. SB (platform), with documents of the proponent Geolumen S.r.l.
  passage: "[E2C] Riepilogo; Il progetto in sintesi; Come si ripaga l'investimento?; Struttura dei costi; Struttura contrattuale; Business plan; Piano di ammortamento; Benefici ambientali. [KIIS] Parti A-E and amortisation note. [CP] Articoli 1-3"
  oracle: "the published quarterly instalment EUR 4,513 at 5.00% over 12 quarters on EUR 50,000 (re-computed below)"
  context:
  - "CONSOB: Ener2Crowd 'è autorizzata ... come fornitore di servizi di crowdfunding con delibera CONSOB 22877 dell'8/11/2023' [E2C | footer]. Authorisation dated 2023, after this 2020 offer; the regime at the time of the offer is not stated. A regulator with no promise: context"
  - "zeroCO2 receives donations under the platform's 'Bosco dell'energia' promotion [E2C | promo box]: a platform marketing scheme, not a deal commitment"
  notes:
  - "The remaining 55% is the proponent's own money: 'IMPORTO DEI FONDI PROPRI IMPEGNATI ... DAL TITOLARE DEL PROGETTO 60.000 €' [KIIS | Parte B]"
  - "Unsecured, no guarantee: 'Contratto di Finanziamento chirografario tra Investitori e Proponente' and 'Non sono previste misure di attenuazione del rischio' [KIIS | Parte C]; 'Il Proponente non ha concesso alcuna Garanzia agli Investitori' [CP | Art. 3]"
  - "Maturity mismatch: the crowd is repaid in 3 years (12 quarters to 31/12/2023) while the client pays over 5 years [KIIS | Parte A d]; Geolumen carries the gap"
  - "Fast Ticket: investors in the first days get '5% + 0,5% Fast Ticket fino al 10/12/2020' [KIIS | Parte C], but the published plan is 'calcolato con un tasso di interesse del 5,00%' [E2C | Piano di ammortamento]. Who pays the extra 0.5% is not stated"

jurisdiction:   # header field, not a setting (F02); dated at financial close
  country: Italy (Province of Chieti; proponent in Benevento; platform in Milan)
  iso: IT
  eu_member: true
  client_eu_general_government: false
  as_of: "KIIS dated 03/12/2020; amortisation from 31/12/2020 [KIIS | Parte C]"
  status: stated
  why: "'presso lo stabilimento di una Società della Provincia di Chieti' [KIIS | Parte A d]: a private company, so C1 does not apply"

core_v7:   # level 2 — what every LOD 0 element is an instance or kind of
  partner: {term: 'vf:Agent', iso: 3.51 partner}
  role:
    term: cmns-cls:Classifier
    iso: 3.30 economic role (Partner Type)
    note: a role is a value the partner exemplifies, never a type of the partner
  commitment: {term: 'vf:Commitment', iso: 3.22 economic commitment}
  contract:
    term: vf:Agreement
    iso: 3.23 economic contract
    note: the supply-and-deferred-payment contract, the crowd loan, the platform terms and the payment-service terms each establish (fibo-fnd-rel-rel:confers) their commitments
  constraint: {term: 'cmns-doc:Specification', iso: 3.14 constraint; external 3.33}
  business_transaction: {term: 'lod0:BusinessTransaction', iso: '3.8'}

parties:   # role from the 41 (a list = several roles, home role first; F13); groups computed from the role(s)
  end_client:
    role: host
    groups: [demand]
    status: stated
    text: "'una Società specializzata nella produzione e nell'assemblaggio di componenti, sottogruppi e moduli in acciaio per il settore automotive' [E2C | In cosa sto per investire]; Province of Chieti. Not named. A private plant owner that pays the fee"
  geolumen:
    entity: geolumen_srl
    role: equipment_supplier
    groups: [delivery, capital]
    status: stated
    name: Geolumen S.r.l.
    text: "'si occupa di produzione e commercializzazione di Sistemi Integrati di Telecontrollo e Telegestione per l'illuminazione' [KIIS | Parte A b]; 'progetta ed installa sistemi illuminanti senza che il cliente sostenga i costi di investimento' [E2C | Come si ripaga]. Not partner_esco: no savings promise, no operation promise, title passes at once"
  crowd_lenders:
    role: lender
    groups: [capital]
    status: stated
    text: "'Investitori 49'; raise EUR 50,000, 'Investimento min/max 300 / 50.000€' [E2C | Riepilogo]; 'Gli investitori sottoscrivono un contratto di finanziamento con Geolumen' [E2C | Struttura contrattuale]"
  ener2crowd:
    entity: ener2crowd
    role: crowdfunding_platform
    groups: [capital]
    status: stated
    name: Ener2Crowd S.r.l. SB
    text: "the loan is made 'tramite il portale www.ener2crowd.com' [CP | preamble]; the 'gestore della piattaforma trattiene per la gestione delle rate di rimborso' a share of interest [CP | Art. 1]"
  lemon_way:
    entity: lemon_way
    role: account_bank_trustee
    groups: [collection]
    status: inferred
    name: Lemon Way
    text: "repayments run through payment accounts: the day counts from when 'Lemon Way accredita il bonifico del Proponente sul proprio Conto di Pagamento' [CP | Art. 1]. The proponent loads 'il proprio portafoglio digitale' at Lemon Way to pay the instalments [CP | Art. 1]. Inferred account_bank_trustee (adjudicated): it holds and disburses the loan-leg money in payment accounts; not collector_biller, because it never receives the client's fee"

contract:   # the agreements that establish the commitments
  supply_contract:
    core: contract
    parties: [geolumen, end_client]
    status: stated
    note: "purchase of the LED plant on deferred payment: 'Il Cliente Finale ha deciso di acquistare l'impianto di illuminazione a LED nel proprio stabilimento attraverso un pagamento dilazionato in 5 anni' [KIIS | Parte A d]. Fee amount not published"
  crowd_loan:
    core: contract
    parties: [crowd_lenders, geolumen]
    status: stated
    note: "'Mutuo di Scopo' [E2C | Struttura contrattuale]; 'chirografario'; 5.00% fixed, 36 months, 12 quarterly French instalments from 31/12/2020 [KIIS | Parte C; CP | Art. 2]"
  platform_terms:
    core: contract
    parties: [ener2crowd, geolumen, crowd_lenders]
    status: stated
    note: "Ener2Crowd's 'Condizioni Generali' govern the loan with the Condizioni Particolari [CP | preamble]; retention on interest [KIIS | Parte E]"
  payment_services:
    core: contract
    parties: [lemon_way, geolumen, crowd_lenders]
    status: inferred
    note: "payment accounts at Lemon Way [CP | Art. 1]; page checkbox 'Contratto Quadro di Servizi di Pagamento con Lemon Way SA' [E2C | invest form]"

commitments:   # the arrows of the LOD 0 map; family = one of the 7; unstated = required by duality, source silent
  c1:
    family: performance_promise
    from: geolumen
    to: end_client
    status: stated
    what: "designs, supplies and installs the LED lighting with the GEOLUMENinside control system and transfers title at once: 'il bene installato diventa fin da subito di proprietà del Cliente' [E2C | Come si ripaga]"
    established_by: supply_contract
  c2:
    family: funding_promise
    from: geolumen
    to: end_client
    status: stated
    funding_instrument: loan   # supplier credit, deferred payment over 5 years (KIIS Parte A d)
    what: "supplier credit: the client pays the EUR 110,000 plant 'attraverso un pagamento dilazionato in 5 anni a Geolumen S.r.l.' [KIIS | Parte A d]; funded by the crowd loan and EUR 60,000 of Geolumen's own funds [KIIS | Parte B]"
    established_by: supply_contract
  c3:
    family: payment_promise
    from: end_client
    to: geolumen
    status: stated
    depends_on_savings: false   # a fixed monthly fee, not computed on savings (E2C)
    what: "pays a monthly fee over 5 years, sized below its current energy cost: 'un canone mensile inferiore al costo energetico attualmente sostenuto' [E2C | Come si ripaga]. Amount not published; fixed, not computed on savings"
    established_by: supply_contract
  c4:
    family: funding_promise
    from: crowd_lenders
    to: geolumen
    status: stated
    funding_instrument: loan   # unsecured purpose loan
    what: "EUR 50,000 unsecured purpose loan; Geolumen must 'utilizzare i fondi ricevuti dagli Investitori esattamente come previsto nel Progetto' [E2C | Struttura contrattuale]"
    established_by: crowd_loan
  c5:
    family: payment_promise
    from: geolumen
    to: crowd_lenders
    status: stated
    what: "'una rata fissa pari a € 4.513 ogni trimestre' [E2C | Piano di ammortamento]; first 31/03/2021, last 31/12/2023 [E2C | Il progetto in sintesi]; late interest 5% [KIIS | Parte C]"
    established_by: crowd_loan
  c6:
    family: agency_promise
    from: ener2crowd
    to: [geolumen, crowd_lenders]
    status: stated
    what: "runs the offer and manages the repayment instalments: the share it keeps is 'per la gestione delle rate di rimborso' [CP | Art. 1]"
    established_by: platform_terms
  c7:
    family: payment_promise
    from: crowd_lenders
    to: ener2crowd
    status: stated
    what: "'TRATTENUTA SUGLI INTERESSI PERCEPITI: 3,00%'; 10% on any late interest [KIIS | Parte E]. Any fee charged to the proponent is not stated"
    established_by: platform_terms
  c8:
    family: agency_promise
    from: lemon_way
    to: [geolumen, crowd_lenders]
    status: stated
    what: "holds the payment accounts through which the proponent pays the instalments to investors [CP | Art. 1]; 'Il processo di pagamento è garantito da LemonWay, Istituto di Pagamento' [E2C | footer]"
    established_by: payment_services
  c9:
    family: payment_promise
    from: unstated
    to: lemon_way
    status: unstated
    what: "counter-promise required by duality; source silent (Lemon Way's fee and payer not stated)"
    established_by: payment_services

settings:   # the 13 LOD 0 facets, in vocabulary order (payment_basis added 1 Oct, owner ruling)
  payment_basis: {value: asset, status: stated, why: "No partner_esco. c3: fixed monthly fee over 5 years for LED equipment owned by the client at once, 'non dipendono direttamente dai risparmi' ([E2C] Come si ripaga; Business plan)."}
  client_sector:
    value: private
    status: stated
    why: "'una Società della Provincia di Chieti' making automotive steel components [KIIS | Parte A d; E2C]"
  partner_form:
    value: corporate
    status: inferred
    why: "the provider is Geolumen S.r.l., 'attiva dal giugno del 2011' [E2C | Analisi creditizia], no SPV. There is no Partner in the ESCO sense; the setting describes the provider"
  borrower:
    value: partner
    status: stated
    why: "'Contratto di Finanziamento chirografario tra Investitori e Proponente' [KIIS | Parte C]; the provider borrows, and in turn gives the client supplier credit (c2)"
  receivable_holder: {value: partner, status: default, why: "no assignment of the client's fee; no security of any kind ('Non sono previste misure di attenuazione del rischio' [KIIS | Parte C])"}
  collection_placement: {value: operator_own, status: default, why: "where the client's fee lands is not stated; Lemon Way handles only the loan leg"}
  aggregation: {value: none, status: default, why: "one plant, one loan"}
  debt_seniority:
    value: senior
    status: inferred
    why: "one unsecured ('chirografario') loan with no stated subordination; unsecured is not subordinated"
  assignment_recourse: {value: not_applicable, status: default, why: nothing assigned}
  savings_basis:
    value: measured
    status: default
    why: "no savings promise exists to measure or deem: 'le rate del finanziamento sono importi fissi e non dipendono direttamente dai risparmi energetici' [E2C | Business plan]; savings are only 'stimabile' [E2C | Benefici ambientali]"
  grant_recipient: {value: none, status: default, why: "no grant mentioned"}
  asset_owner:
    value: client
    status: stated
    why: "'il bene installato diventa fin da subito di proprietà del Cliente' [E2C | Come si ripaga]"
  bill_custody:
    value: client
    status: inferred
    why: "the client keeps a 'costo energetico' against which the fee is compared [E2C | Come si ripaga]; nothing says the provider takes over the bill"

rules:   # beside the tree; C1_eurostat and IFRS16_lease_test appear in every file with applies_here
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU}
    rule: NPV at financial close of guaranteed savings over the EPC >= NPV of (a) the Operational Payments + (b) non-repayable government financing, else ON BALANCE SHEET for government (E15 L2578-2582)
    applies_here: false
    this_case: private client
    source: E15 L2576-2582, L6930-6943
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: [partner, lessor, vehicle]}
    rule: "Is the client's contract a service agreement or a lease under IFRS 16? Private counterpart of C1 (trigger widened per batch-2 verdict change 2)"
    applies_here: false
    this_case: "not triggered: the client owns the plant from installation (a purchase on credit, not a lease)"
    source: E02 L3293-3295; batch2/review/verdict.md change 2


    legs:
    - promise: c1
      leg: outlay
      amount: capex_eur
      evidence: '''Il Capex totale del Progetto è di € 110.000 (IVA esclusa)'' [E2C | Struttura dei costi] (linked by adjudication (blind pair))'
      start_year: 0
    dated_legs:
    - promise: c4
      kind: loan
      contract_type: ANN
      notional: crowd_raise_eur
      rate: rate
      cycle: P3ML0
      start: '2020-12-31'
      first_payment: '2021-03-31'
      maturity: '2023-12-31'
      day_count: 30E360
      repaid_by: c5
      instalment_check: quarterly_instalment_eur
      date_status: derived
      evidence: min = max target [E2C | Riepilogo] and the loan's printed terms (linked by adjudication (blind pair))
      flag: 'ANN schedule by oe.engine.schedule; day count 30E360 (default: not printed)'

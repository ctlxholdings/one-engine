  platform_retention_on_interest: 0.03  # [KIIS | Parte E]
  platform_retention_on_late_interest: 0.10   # [KIIS | Parte E]
  client_deferred_payment_years: 5      # [KIIS | Parte A d]
  baseline_kwh_per_year: 265280         # 'basati sulle bollette fornite' [E2C | Benefici ambientali]
  savings_kwh_per_year: 153670          # estimate [E2C | Benefici ambientali]
  savings_share_published: 0.59         # [E2C | Benefici ambientali]
  co2_avoided_kg_per_year: 66078        # [E2C | Benefici ambientali]
  derived:
    instalment: "50,000 x 0.0125 / (1 - 1.0125^-12) = 4,512.92 -> EUR 4,513 per quarter (closes; quarterly rate 5.00% / 4)"
    total_repaid: "12 x 4,513 = EUR 54,156; interest 54,156 - 50,000 = EUR 4,156 (4,155.04 unrounded)"
    platform_take: "3% x 4,155 = EUR 125 over the life, withheld from investors' interest"
    funding_stack: "50,000 crowd + 60,000 own funds = EUR 110,000 = capex (closes); 50,000 / 110,000 = 45.5%, published '45%' (rounded down)"
    savings_share: "153,670 / 265,280 = 57.9% vs the published 59% (does not close by 1.1 points; the page says the control system adds further savings, which would push the share up, not explain 59% as stated for LED alone)"
    co2_factor: "66,078 / 153,670 = 0.430 kg CO2/kWh (implied)"
    maturity_gap: "crowd repaid over 3 years, client pays over 5 years: Geolumen funds years 4-5 itself"
  links:   # R-A17 (architect, 6 Oct): which recorded figure sizes which promise; configuration, read by oe.census.printability

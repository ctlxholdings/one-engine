# Miniature — Jewish Museum Berlin Foundation EPC with Johnson Controls; 70% of the ESCO's savings revenues bought by the European
# Energy Efficiency Fund (eeef), Germany, financial close 20 Mar 2012, expressed at ESCO LOD 0. Batch 6, pair G, REVIEWED file.
#
# Evidence, fetched 1 Oct 2026 by the reviewer (curl, pdftotext, tag-stripped HTML); quotes <= 25 words, matched against the text:
#   [NEWS] https://www.eeef.lu/news-detail/eeef-finances-the-berlin-jewish-museum-s-retrofit.html  fund press item, 2012 Mar 20 (writers' source)
#   [AR18] https://www.eeef.lu/files/downloads/Impact_Reports/eeef_Annual_Report_2018.pdf  fund annual report 2018 (writers' source); PDF page = printed page
#   [LAW]  https://www.gesetze-im-internet.de/jmbstiftg/BJNR213800001.html  Gesetz zur Errichtung einer "Stiftung Jüdisches Museum Berlin" (JMBStiftG),
#          added by the reviewer for the client's legal status
# Every fact carries its status: stated / inferred / default / generic / unstated.

miniature: jewish_museum_berlin_eeef
lod: 0
case: batch6.S03
case_kind: deal   # one named EPC and one named forfaiting investment, financial close 20.03.2012
in_scope: true
in_scope_why: "Guaranteed-savings EPC: 'Johnson Controls Systems & Service GmbH guaranteed energy savings of net EUR 294,327 per annum (43.2%)' and operates the buildings for 10 years [NEWS]; the fund forfaits 70% of the ESCO's savings revenues"

tests_unused:
- item: receivable_holder=split
  kind: setting_value
  used: true
  reason: "'the EEE F purchases 70% of the Johnson Controls’ energy savings revenues against the Jewish Museum' [NEWS]: part of the stream is sold, so split, stated. That the ESCO keeps the other 30% is not said in words; it follows from the 70% (inferred). The 30% sits with the party that also carries 'maintenance and building operation services for the period of 10 years' [NEWS], the pattern where only the financing share is forfaited (cf. E06 l.642 in the setting's source)"
- item: forfaiter
  kind: role
  used: true
  reason: "The fund buys future payments under the EPC for 'upfront financing to Johnson Controls' [NEWS]; its report types the investment 'Forfaiting loan' [AR18 | PDF p.34] and lists 'Forfaiting structures' among its products [AR18 | PDF p.23]. Fits 'Buys assigned operational payments'. Second deal with a stated forfaiter share after the batch-2 forfaiting_bulgaria (generic)"
- item: assignment_recourse
  kind: setting
  used: true
  reason: "waiver, status default (ENCODING fallback). Neither document says whether the museum waived its defences or whether the fund can claim a savings shortfall from the ESCO. Evidence that would flip it to performance_exposed: a guarantee of performance given to the fund, or the 70% leg varying with measured savings. The fund collecting 'annual audits stating its actual energy consumption' [AR18 | PDF p.62] is impact reporting for the whole portfolio, not a recourse term"
- item: securitisation_vehicle
  kind: role
  used: false
  reason: "The eeef is a SICAV-SIF with share classes and possible fund-level notes [AR18 | PDF p.24, p.47]; nothing ties a note issue to this receivable or calls it bankruptcy-remote"
- item: hedge_counterparty
  kind: role
  used: false
  reason: no hedge in any document
- item: authority_guarantor
  kind: role
  used: false
  reason: "no guarantee of the museum's payments; the federal subsidy to the foundation [LAW | § 3(2)] funds its budget, not this contract"
- item: asset_owner=vehicle
  kind: setting_value
  used: false
  reason: "title not stated; the fund buys revenues, not equipment"
- item: payment_basis=performance
  kind: setting_value
  used: false
  reason: "pay tied to guaranteed EUR savings, not availability or output"

source:
  id: NEWS
  documents:
    NEWS: "https://www.eeef.lu/news-detail/eeef-finances-the-berlin-jewish-museum-s-retrofit.html — eeef news item, 2012 Mar 20. The fund's own announcement, not the contract"
    AR18: "https://www.eeef.lu/files/downloads/Impact_Reports/eeef_Annual_Report_2018.pdf — European Energy Efficiency Fund S.A., SICAV-SIF, Annual Report 2018: deal page p.34, portfolio p.30, products p.23, investees and governance p.22-24, capital p.46-47, impact p.62-63"
    LAW: "https://www.gesetze-im-internet.de/jmbstiftg/BJNR213800001.html — JMBStiftG § 1 (legal form), § 3(2) (annual federal subsidy)"
  title: eeef finances the Berlin Jewish Museum's retrofit; eeef Annual Report 2018; JMBStiftG
  publisher: European Energy Efficiency Fund (eeef); German Federal Ministry of Justice (gesetze-im-internet.de)
  passage: "NEWS whole item; AR18 p.8, 22-24, 30, 34, 46-47, 62-63; LAW §§ 1, 3"
  oracle: "none; the two fund documents' figures are compared in numbers.derived"
  context:
  - "Fund capital: European Commission EUR 125.0m initial capital, EIB 75.0m, Cassa Depositi e Prestiti 59.9m, Deutsche Bank 5.0m [AR18 | PDF p.46]; class C shares are 'the Fund’s first loss' piece [AR18 | PDF p.47]. Fund-level, not tied to this deal: context"
  - "Federal Government: 'erhält die Stiftung einen jährlichen Zuschuss des Bundes' (annual federal subsidy) [LAW | § 3(2)]. Funds the client's budget, not this EPC: context"
  - "European Energy Service Initiative award to JMB and JC [NEWS]: award body, context"
  - "Management Board and Investment Committee of the fund decide investments [AR18 | PDF p.24]: governance, context"
  notes:
  - "Deal size, two versions: EPC 'of EUR 3.1 million' [NEWS] vs 'Total project size' 1.4 and 'eeef investment size' 1.0 (EUR m) after 'In 2015, the project scope was revised' (initial fund investment EUR 1.7m) [AR18 | PDF p.34]. Both kept; the revision's content is not published"
  - "Who is financed: NEWS says 'upfront financing to Johnson Controls'; AR18 lists a '€1.0 m forfaiting loan to the Jewish Museum Berlin Foundation via the ESCO of Johnson Controls' [AR18 | PDF p.30]. Same flow seen from the obligor's side: the fund holds a claim on the museum's payments bought from the ESCO"
  - "AR18 p.34 says the first audit 'was completed in 2017 and 2018 annual primary energy savings equated to 3,856 MWh' and then 'Primary energy savings in 2018 equated to 12,872 MWh': two figures for 2018 on one page. Not resolved"
  - "NEWS prints 'EEE F' once for the eeef (typographical)"


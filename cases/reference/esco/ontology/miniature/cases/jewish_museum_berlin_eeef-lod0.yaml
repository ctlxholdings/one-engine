rules:
  C1_eurostat:
    scope: external-sectoral
    applies_when: {client_sector: public, jurisdiction: EU general government at close}
    rule: "NPV at financial close of guaranteed savings >= NPV of operational payments + non-repayable government financing (upfront grant at face value), else ON the government balance sheet (E15 L2578-2582)"
    applies_here: true
    this_case: "federal public-law foundation in an EU member at close: applies. Outcome undetermined: guaranteed savings are published (294,327 a year, 10 years) but the museum's payments, the discount rate and the post-2015 scope are not. Selling 70% of the payments does not change the test (E15 14.9 counts ceded payments as the authority's)"
    source: E15 L2576-2582, L6930-6943; E15 s.14.9
  IFRS16_lease_test:
    scope: accounting
    applies_when: {client_sector: private, asset_owner: not client}
    rule: "service agreement or lease under IFRS 16"
    applies_here: false
    this_case: "client public, asset_owner client"
    source: RULINGS.md ruling 7; E02 L3293-3295
  savings_guarantee:
    scope: contractual
    rule: "'guaranteed energy savings of net EUR 294,327 per annum (43.2%)' [NEWS]; 'net' not defined"
    applies_here: true
    source: NEWS
  eeef_eligibility:
    scope: external-sectoral
    rule: "investments 'In one of the 28 EU countries', avoiding CO2e emissions 'to at least 20% of baseline' [AR18 | PDF p.23]"
    applies_here: true
    source: AR18 PDF p.23


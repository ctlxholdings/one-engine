    revision: "1.0 / 1.7 = 58.8% (cut 41.2%); 1.4 / 3.1 = 45.2%: the two sizes did not shrink alike"
    guarantee_vs_volume: "294,327 x 10 = 2,943,270 undiscounted = 94.9% of 3.1m; 'net' guarantee alone does not cover the EPC volume"
    implied_base: "294,327 / 0.432 = 681,313 a year if 43.2% is a share of baseline cost (not stated)"
    co2_actual_vs_forecast: "2,936 / 1,812 = 1.62"
    germany_line: "1.0 (museum) + 0.6 (Munich) = 1.6 = AR18 'Germany EUR 1.6m' (ties)"


contract: "v2.5"
id: ci-abidjan-adjame-riz-gros-fcff-2026
title: "Wholesale imported rice, Adjamé (Abidjan) — unlevered FCFF over five annual periods, under a turnover-based minimum tax"
currency: XOF

grid:
  periods: 5
  freq: annual
  why: >-
    FIVE PERIODS. The business owns exactly one durable asset, the truck. The founder puts its
    service life at seven years and bought it two years ago, so five years of that life remain.
    The horizon is set to end precisely where the truck must be replaced. That choice is
    deliberate and it costs something: no capex falls inside the horizon, so these five FCFF
    figures are maintenance-capex-free and must not be extrapolated — a sixth year carries a
    truck purchase whose price nobody in this record has stated. The alternative (running seven
    or ten years and inserting a replacement) would require me to invent a truck price, and I
    would rather end the model at the edge of what the utterance supports than manufacture the
    number. The horizon also matches how far a 4%-gross-spread trade can honestly be projected:
    the founder himself says the competition is fierce and everyone knows the price of rice.
    Past five years the question stops being answerable, not merely uncertain.

    ANNUAL, NOT MONTHLY. The founder lives on a monthly cycle — four thousand bags a month,
    rent a month, wages a month — and those monthly quantities are kept as the natural drivers
    and aggregated up rather than replaced. But the thing he is actually asking about, the
    choice between the ordinary profit tax and the turnover minimum, is settled once a year on
    a full year's turnover against a full year's profit. A monthly grid cannot express that
    comparison at all: one twelfth of a minimum tax is not a thing that exists. A monthly FCFF
    series here would be arithmetically impeccable and economically meaningless, and it would
    silently answer a different question from the one he asked.

    PERIOD DATING AND ITS FRICTION. P1 runs the twelve months from 2026-08-01, P5 ends
    2031-07-31 — i.e. the clock is the truck's clock (bought mid-2024, seven years of service),
    because the truck is what fixes the horizon. The Ivorian exercice fiscal is the calendar
    year, so each modelled period straddles two statutory exercices. I keep the friction
    visible rather than forcing calendar years: under the flat base case the annual tax
    computation is identical either way, and aligning to calendar years would have introduced a
    stub period on the truck instead.

utterance:
  fr: >-
    Je fais le riz en gros à Abidjan, à Adjamé. J'achète le riz importé au port, en sacs de
    cinquante kilos, et je revends aux détaillants du marché. Je tourne à peu près quatre mille
    sacs par mois. Je l'achète à seize mille cinq cents le sac et je le revends à dix-sept mille
    deux cents — c'est un métier où on gagne peu sur beaucoup, la concurrence est féroce et le
    prix du riz, tout le monde le connaît. Le magasin me coûte quatre cent mille francs par
    mois, j'ai trois manutentionnaires à quatre-vingt mille chacun, et le transport du port
    jusqu'au magasin me revient à cent cinquante francs le sac. J'ai un petit camion que j'ai
    payé douze millions il y a deux ans, il me fait bien sept ans. Je suis déclaré, je suis au
    réel. Et voilà ce qui me pèse — mon comptable me dit que même une année où je ne gagne
    presque rien, il y a un minimum à payer, c'est calculé sur le chiffre d'affaires et pas sur
    le bénéfice, et il y a un plancher en dessous duquel on ne descend jamais. Donc chaque année
    je paie le plus élevé des deux, l'impôt normal sur mon bénéfice, ou ce minimum-là.
  en: >-
    I wholesale rice in Abidjan, in Adjamé. I buy imported rice at the port, in fifty-kilo bags,
    and I resell to the market retailers. I turn about four thousand bags a month. I buy it at
    sixteen thousand five hundred a bag and I resell it at seventeen thousand two hundred — it
    is a trade where you earn little on a lot, competition is fierce and everybody knows the
    price of rice. The store costs me four hundred thousand francs a month, I have three
    handlers at eighty thousand each, and transport from the port to the store costs me a
    hundred and fifty francs a bag. I have a small truck I paid twelve million for two years
    ago, it gives me a good seven years. I am registered, I am on the real (actual-profit)
    regime. And here is what weighs on me — my accountant tells me that even in a year when I
    earn almost nothing there is a minimum to pay, it is computed on turnover and not on profit,
    and there is a floor below which you never go. So every year I pay the higher of the two,
    the normal tax on my profit, or that minimum.

inputs:

  bags_per_month:
    value: 4000
    unit: bags/month
    prov: STATED
    source: "« Je tourne à peu près quatre mille sacs par mois. » Taken as the current run-rate. His own « à peu près » is precisely why the forward-volume question below is asked rather than assumed away."
    date: '2026-07-27'

  months_per_year:
    value: 12
    unit: months/year
    prov: DEFAULTED
    source: "Calendar convention — twelve monthly operating cycles per annual period."
    date: '2026-07-27'

  purchase_price_per_bag:
    value: 16500
    unit: XOF/bag
    prov: STATED
    source: "« Je l'achète à seize mille cinq cents le sac. » Landed price at the port, as he buys it."
    date: '2026-07-27'

  sale_price_per_bag:
    value: 17200
    unit: XOF/bag
    prov: STATED
    source: "« je le revends à dix-sept mille deux cents »"
    date: '2026-07-27'

  gross_margin_per_bag:
    value: 700
    unit: XOF/bag
    prov: INFERRED
    source: "17200 − 16500 = 700. Deductively entailed by the two stated prices; no new information enters."
    date: '2026-07-27'

  transport_cost_per_bag:
    value: 150
    unit: XOF/bag
    prov: STATED
    source: "« le transport du port jusqu'au magasin me revient à cent cinquante francs le sac »"
    date: '2026-07-27'

  store_cost_per_month:
    value: 400000
    unit: XOF/month
    prov: STATED
    source: "« Le magasin me coûte quatre cent mille francs par mois »"
    date: '2026-07-27'

  handler_count:
    value: 3
    unit: persons
    prov: STATED
    source: "« j'ai trois manutentionnaires »"
    date: '2026-07-27'

  handler_wage_per_month:
    value: 80000
    unit: XOF/person/month
    prov: STATED
    source: "« trois manutentionnaires à quatre-vingt mille chacun »"
    date: '2026-07-27'

  truck_cost:
    value: 12000000
    unit: XOF
    prov: STATED
    source: "« un petit camion que j'ai payé douze millions »"
    date: '2026-07-27'

  truck_age_years:
    value: 2
    unit: years
    prov: STATED
    source: "« il y a deux ans »"
    date: '2026-07-27'

  truck_useful_life_years:
    value: 7
    unit: years
    prov: STATED
    source: "« il me fait bien sept ans » — read as total service life from purchase. The reading itself is put back to him as a question (truck_life_reading)."
    date: '2026-07-27'

  truck_remaining_life_years:
    value: 5
    unit: years
    prov: INFERRED
    source: "truck_useful_life_years − truck_age_years = 7 − 2 = 5. This is what fixes grid.periods."
    date: '2026-07-27'

  truck_accumulated_depreciation_opening:
    value: 3428571.428571428
    unit: XOF
    prov: INFERRED
    source: "truck_age_years × truck_cost / truck_useful_life_years = 2 × 12000000 / 7. Straight-line over the stated life; no prior beyond the depreciation-method convention."
    date: '2026-07-27'

  depreciation_method:
    value: straight_line
    unit: method
    prov: DEFAULTED
    source: "IAS 16.60 / SYSCOHADA amortissement linéaire — straight-line is the default pattern where the asset's benefits are consumed evenly and no other pattern is indicated. A haulage truck on a fixed daily port-to-store run is the paradigm case."
    date: '2026-07-27'

  days_per_year:
    value: 360
    unit: days/year
    prov: DEFAULTED
    source: "Commercial 360-day convention (twelve 30-day months), consistent with the monthly cycle the founder actually runs on. Used only to turn working-capital day-counts into balances."
    date: '2026-07-27'

  bic_rate:
    value: 0.25
    unit: fraction of taxable profit
    prov: SOURCED
    source: >-
      Standard rate of the impôt sur les bénéfices industriels et commerciaux. Base case takes
      the personne morale rate of 25%, the higher of the two and therefore the conservative
      choice. The rate for a personne physique (entreprise individuelle) is reported as 20% in
      DGI documentation of CGI art. 64; which one applies here is put back to the founder as
      legal_form. See notes — the minimum tax binds under either rate, so this choice does not
      move base-case FCFF.
    authority: "Côte d'Ivoire, Code général des impôts, impôt BIC (art. 64), as reported in PwC Worldwide Tax Summaries, Ivory Coast — Corporate — Taxes on corporate income, https://taxsummaries.pwc.com/ivory-coast/corporate/taxes-on-corporate-income (page states: 25%, subject to a minimum tax; 30% for telecoms/IT; last reviewed 11 March 2026)"
    verified: '2026-07-27'

  imf_rate:
    value: 0.005
    unit: fraction of annual turnover (TTC)
    prov: SOURCED
    source: >-
      Impôt minimum forfaitaire — the tax the founder's accountant described. Assessed on
      turnover, not profit, exactly as he says. Confirmed still in force in 2026: the Loi de
      finances 2026 (n° 2025-987 of 19 December 2025) made no change to it, and Ivorian business
      federations were in July 2026 still lobbying for its removal in the 2027 annexe fiscale —
      which is only coherent if it is levied today.
    authority: "Côte d'Ivoire CGI, impôt minimum forfaitaire (art. 39 et s.). Rate/base per PwC Worldwide Tax Summaries, Ivory Coast — Corporate — Taxes on corporate income, https://taxsummaries.pwc.com/ivory-coast/corporate/taxes-on-corporate-income (last reviewed 11 March 2026): minimum tax 0.5% of total turnover. Continued force corroborated by KOACI, 17 July 2026, « Annexe fiscale 2027 : la CPU-PME soumet 12 propositions à la DGI », https://www.koaci.com/article/2026/07/17/cote-divoire/economie/... (« La confédération a également demandé la suppression de l'Impôt Minimum Forfaitaire (IMF) »)"
    verified: '2026-07-27'

  imf_floor:
    value: 3000000
    unit: XOF/year
    prov: SOURCED
    source: >-
      The « plancher en dessous duquel on ne descend jamais » the founder refers to — the
      minimum de perception of the IMF. His belief and the law agree here. It does not bind in
      his case: 0.5% of his turnover is well above it.
    authority: "PwC Worldwide Tax Summaries, Ivory Coast — Corporate — Taxes on corporate income, https://taxsummaries.pwc.com/ivory-coast/corporate/taxes-on-corporate-income (minimum XOF 3 million; last reviewed 11 March 2026). Raised from XOF 2 million by the annexe fiscale to the 2013 budget."
    verified: '2026-07-27'

  imf_cap:
    value: 35000000
    unit: XOF/year
    prov: SOURCED
    source: "Maximum de perception of the IMF. Does not bind at this turnover; carried because the check that the liability sits inside the statutory band is part of the tax's definition."
    authority: "PwC Worldwide Tax Summaries, Ivory Coast — Corporate — Taxes on corporate income, https://taxsummaries.pwc.com/ivory-coast/corporate/taxes-on-corporate-income (maximum XOF 35 million; last reviewed 11 March 2026)"
    verified: '2026-07-27'

  rni_threshold_turnover:
    value: 500000000
    unit: XOF/year (TTC)
    prov: SOURCED
    source: >-
      Turnover above which a business falls into the régime du réel normal d'imposition. Used to
      test the founder's « je suis au réel » against the law rather than take it on trust: at
      825.6 million XOF of turnover he is above the threshold, so RNI is not a choice he made
      but a regime he is in, and the IMF applies to him. His self-description checks out.
    authority: "Régimes d'imposition, Côte d'Ivoire — microentreprises 50 000 001 to 200 000 000; réel simplifié 200 000 001 to 500 000 000; réel normal above 500 000 000 XOF TTC. Ivoire-Juriste, « Guide complet des régimes d'imposition en Côte d'Ivoire » (October 2025), https://blog.ivoire-juriste.com/2025/10/guide-complet-des-regimes-dimposition-en-cote-divoire-choisir-le-statut-adapte-a-votre-entreprise.html"
    verified: '2026-07-27'

  vat_rate_on_rice:
    value: 0.0
    unit: fraction
    prov: SOURCED
    source: >-
      Rice is exempt from TVA under CGI art. 355-9 as an unprocessed staple foodstuff. The
      annexe fiscale 2021 carved out « riz de luxe » at the reduced 9% rate, but the defining
      inter-ministerial decree was awaited and collection on riz de luxe was suspended; ordinary
      imported bagged rice bought at 16500 XOF for 50 kg — 330 XOF/kg — is not in that category.
      Two consequences carried through the model: (i) turnover TTC equals turnover HT, so the
      IMF base is 825 600 000 with no VAT gross-up; (ii) he recovers no input VAT, so the rent
      and transport figures he quotes are taken as the cash amounts he actually pays.
    authority: "Côte d'Ivoire CGI art. 355-9 (exonérations de TVA — produits alimentaires non transformés de première nécessité, dont le riz); riz de luxe at 9% introduced by the annexe fiscale 2021, collection suspended. Corroborated by PwC Worldwide Tax Summaries, Ivory Coast — Corporate — Other taxes, https://taxsummaries.pwc.com/ivory-coast/corporate/other-taxes (reduced 9% rate for certain rice types; last reviewed 11 March 2026)"
    verified: '2026-07-27'

  patente_ca_rate:
    value: 0.005
    unit: fraction of turnover (HT)
    prov: SOURCED
    source: "Droit sur le chiffre d'affaires of the contribution des patentes — the business licence tax every registered trader in Côte d'Ivoire owes. The founder did not mention it; he did not deny it either, and it is not optional."
    authority: "Côte d'Ivoire, contribution des patentes — droit sur le chiffre d'affaires, 0.5% of prior-year turnover HT. PwC Worldwide Tax Summaries, Ivory Coast — Corporate — Other taxes, https://taxsummaries.pwc.com/ivory-coast/corporate/other-taxes (last reviewed 11 March 2026); Ivoire-Juriste, « Tout savoir sur la contribution des patentes » (November 2025); Profession Juriste, « Tout savoir sur la patente », https://profession-juriste.ci/impot-en-cote-divoire-tout-savoir-sur-la-patente/"
    verified: '2026-07-27'

  patente_ca_floor:
    value: 300000
    unit: XOF/year
    prov: SOURCED
    source: "Minimum de perception of the droit sur le chiffre d'affaires. Does not bind here."
    authority: "Ivoire-Juriste, « Tout savoir sur la contribution des patentes » (November 2025); Profession Juriste, « Tout savoir sur la patente », https://profession-juriste.ci/impot-en-cote-divoire-tout-savoir-sur-la-patente/ (both: « minimum de perception 300 000 FCFA »)"
    verified: '2026-07-27'

  patente_ca_cap:
    value: 1300000
    unit: XOF/year
    prov: SOURCED
    source: >-
      Plafonnement of the droit sur le chiffre d'affaires for the turnover band 500 000 001 to
      1 000 000 000 XOF, which is the band this business sits in. This cap is load-bearing: at
      0.5% uncapped the charge would be several times larger. It is also the single largest
      sourcing risk in the model — PwC states a flat maximum of XOF 3 million rather than the
      banded schedule. See notes.
    authority: "Contribution des patentes, plafonnement du droit sur le chiffre d'affaires by turnover band: <200M → 350 000; 200M–500M → 700 000; 500 000 001–1 000 000 000 → 1 300 000; >1Md → 3 000 000 FCFA. Profession Juriste, « Tout savoir sur la patente », https://profession-juriste.ci/impot-en-cote-divoire-tout-savoir-sur-la-patente/ ; identical schedule in Ivoire-Juriste, « Tout savoir sur la contribution des patentes » (November 2025). Cf. PwC Worldwide Tax Summaries, Ivory Coast — Corporate — Other taxes (« maximum XOF 3 million »), which appears to quote only the top band."
    verified: '2026-07-27'

  patente_vl_rate:
    value: 0.185
    unit: fraction of annual rental value
    prov: SOURCED
    source: "Droit sur la valeur locative of the contribution des patentes. For a tenant the valeur locative is the annual rent paid, which is why it is applied to the store cost."
    authority: "Contribution des patentes — droit sur la valeur locative, 18.5% of the rental value of professional premises (16% in rural zones). PwC Worldwide Tax Summaries, Ivory Coast — Corporate — Other taxes, https://taxsummaries.pwc.com/ivory-coast/corporate/other-taxes (« proportional tax 18.5% based on professional office rental value »; last reviewed 11 March 2026); tenant basis (« si tu es locataire, la valeur locative correspond à ton loyer annuel ») per iambeezy, « Patente en Côte d'Ivoire : guide fiscal 2026 », https://blog.iambeezy.app/fr/declaration-patente-cote-ivoire-guide-fiscal-entrepreneurs-2026/"
    verified: '2026-07-27'

  tse_rate:
    value: 0.001
    unit: fraction of turnover (HT)
    prov: SOURCED
    source: >-
      Taxe spéciale d'équipement, payable monthly by every business on a régime réel. Introduced
      in 2001 as a temporary three-year levy at 0.08% and repeatedly announced as due for
      abolition; it was made permanent by the 2020 finance law and is still levied at 0.1%. A
      second turnover-based charge on a business whose whole complaint is turnover-based
      taxation.
    authority: "PwC Worldwide Tax Summaries, Ivory Coast — Corporate — Other taxes, https://taxsummaries.pwc.com/ivory-coast/corporate/other-taxes (« Special equipment tax — 0.1% of total turnover, paid monthly; permanent tax since FY20 Financial Law »; last reviewed 11 March 2026)"
    verified: '2026-07-27'

  volume_growth_per_year:
    value: 0.0
    unit: fraction/year
    prov: ELICITED
    question: "Sur les deux dernières années, est-ce que vous tournez toujours autour de quatre mille sacs par mois, ou est-ce que ça monte ou ça baisse — et pour l'année qui vient, vous comptez faire combien de sacs par mois ?"
    range: {low: -0.10, high: 0.15}
    materiality: high
    source: "Base case holds the stated run-rate flat over all five periods — the omitting choice: no growth is invented, and no decline either. Every line in this model except depreciation scales with volume, so this is one of the three questions to ask if only three can be asked."
    date: '2026-07-27'

  gross_spread_outlook:
    value: holds_at_700
    unit: categorical
    prov: ELICITED
    question: "Cet écart de sept cents francs entre le prix au port et votre prix de vente, il tient toute l'année ? Sur les douze derniers mois, il est descendu à combien au plus bas, et pendant combien de semaines ?"
    range: {low: "the spread narrows for part of the year, when imports land in volume and retailers can shop around", high: "700 francs holds all year and has held for two years"}
    materiality: high
    source: "Base case runs the spread implied by his own two stated prices, held flat. This is the most exposed number in the whole derivation: 700 XOF on a 17 200 XOF sale is a 4% gross spread in a market he himself describes as one where « tout le monde connaît le prix du riz », and every franc of it drops to EBITDA. He is the only person who knows what the spread did last season."
    date: '2026-07-27'

  transport_charge_scope:
    value: all_in_including_own_truck
    unit: categorical
    prov: ELICITED
    question: "Les cent cinquante francs par sac, c'est ce que vous payez à des transporteurs de la place, ou c'est ce que vous coûte votre propre camion — gasoil, chauffeur, entretien, assurance, vignette ?"
    range: {low: "third-party haulage only — my own truck's fuel, driver, upkeep and insurance are on top and I did not mention them", high: "all-in — the 150 francs is everything it costs me to move a bag from the port to the store, my truck included"}
    materiality: high
    source: >-
      Base case treats the 150 XOF/bag as the complete port-to-store cost. Chosen because it is
      the only reading that requires no invented figure — the alternative reading needs a fuel,
      driver and maintenance number nobody has given. But note the tension the utterance itself
      creates: he owns a truck AND quotes a per-bag transport charge, and those two facts do not
      sit comfortably together. If the 150 is third-party haulage, this model is missing the
      entire running cost of a twelve-million-franc truck.
    date: '2026-07-27'

  shrinkage_rate:
    value: 0.0
    unit: fraction of bags bought
    prov: ELICITED
    question: "Sur cent sacs que vous achetez au port, combien vous en perdez avant de les vendre — sacs déchirés, riz mouillé, vol au magasin ?"
    range: {low: 0.0, high: 0.02}
    materiality: medium
    source: "He listed no losses, so the base case carries none — the omitting choice. Ranked medium rather than low because in a trade where the gross spread is 4% of the sale price, bags lost are lost at full purchase cost and eat the margin far faster than they eat the turnover."
    date: '2026-07-27'

  owner_remuneration_per_month:
    value: 0
    unit: XOF/month
    prov: ELICITED
    question: "Est-ce que vous vous versez un salaire du magasin chaque mois, et de combien ?"
    range: {low: 0, high: 500000}
    materiality: medium
    source: "Nothing was said about his own pay, so the base case charges nothing and FCFF here is a pre-owner-draw figure. He staffs three handlers but names no driver and no manager, which suggests he does that work himself; whatever a replacement for him would cost is a genuine operating cost this model is not carrying."
    date: '2026-07-27'

  handler_cost_basis:
    value: eighty_thousand_is_my_full_cost
    unit: categorical
    prov: ELICITED
    question: "Vos trois manutentionnaires, ils sont déclarés à la CNPS ? Et les quatre-vingt mille, c'est ce qu'ils touchent en main, ou c'est votre coût total avec les charges ?"
    range: {low: "80 000 is what lands in their hand; CNPS employer contributions and the 2.8% employer payroll charge are on top", high: "80 000 is my total monthly cost per handler, everything included"}
    materiality: low
    source: "Base case takes the 80 000 as his full cost per handler, the omitting choice, and avoids inventing a work-injury class rate. Ranked low: the employer charges on three wages of this size are small beside the turnover-based taxes that dominate this business."
    date: '2026-07-27'

  store_charge_scope:
    value: rent_and_all_store_charges
    unit: categorical
    prov: ELICITED
    question: "Les quatre cent mille francs du magasin, c'est le loyer sec, ou ça comprend l'électricité, l'eau et le gardien ?"
    range: {low: "bare rent — power, water and the night guard are on top", high: "everything included in the 400 000"}
    materiality: low
    source: "Base case takes the 400 000 as the complete store cost. It has a second-order effect the reader should see: the same figure is used as the annual valeur locative for the patente, so if it includes utilities the patente base is slightly overstated, and if it is bare rent the store cost is understated."
    date: '2026-07-27'

  legal_form:
    value: personne_morale
    unit: categorical
    prov: ELICITED
    question: "Le magasin, c'est à votre nom en entreprise individuelle, ou c'est une société — une SARL ?"
    range: {low: "entreprise individuelle (personne physique)", high: "société — SARL or SA (personne morale)"}
    materiality: low
    source: "Determines whether the BIC rate is 25% (personne morale) or 20% (personne physique). Base case takes the higher rate, which is conservative. Ranked low on the evidence of this model rather than in principle: the minimum tax exceeds the profit tax under either rate, so the answer does not move base-case FCFF at all. It would matter the moment his margin improved."
    date: '2026-07-27'

  truck_life_reading:
    value: seven_years_total_from_purchase
    unit: categorical
    prov: ELICITED
    question: "Quand vous dites que le camion vous fait bien sept ans — sept ans en tout depuis que vous l'avez acheté, donc il en reste cinq, ou sept ans encore à partir d'aujourd'hui ?"
    range: {low: "seven years in total from purchase — five remain", high: "seven further years from today"}
    materiality: low
    source: "Base case takes the natural reading of the sentence: seven years of service in total, five remaining, which is what sets the horizon. Ranked low for FCFF specifically because the minimum tax binds — depreciation shelters no tax and is added straight back, so its size and duration do not change any FCFF figure below. It would change the horizon, and the horizon is my choice, stated openly above."
    date: '2026-07-27'

  inventory_days:
    value: 7
    unit: days of purchases
    prov: ELICITED
    question: "Combien de sacs dorment en moyenne dans le magasin — l'équivalent de combien de jours de vente ?"
    range: {low: 2, high: 21}
    materiality: low
    source: "Working value of seven days of purchases, chosen to give the balance sheet a plausible opening level. Ranked low for FCFF and the reason is structural, not dismissive: under a flat volume path the LEVEL of working capital never changes, so only ΔNWC enters FCFF and ΔNWC is zero whatever the level. The answer matters enormously for how much cash is tied up in this business and whether growth is self-funding — it just does not move this number."
    date: '2026-07-27'

  receivable_days:
    value: 0
    unit: days of sales
    prov: ELICITED
    question: "Quand un détaillant prend des sacs chez vous, il paie sur place, ou vous lui laissez quelques jours — combien de jours en moyenne ?"
    range: {low: 0, high: 21}
    materiality: low
    source: "Base case takes cash on delivery — the omitting choice, and the one that adds no unstated credit to the market. Same structural reason for the low ranking as inventory_days: flat volumes make the level irrelevant to FCFF."
    date: '2026-07-27'

  payable_days:
    value: 0
    unit: days of purchases
    prov: ELICITED
    question: "Au port, vous payez avant d'enlever le riz, ou l'importateur vous laisse un délai — de combien de jours ?"
    range: {low: 0, high: 30}
    materiality: low
    source: "Base case takes payment on collection — the omitting choice, and the conservative one for the working-capital level since supplier credit would reduce it. Same structural reason for the low ranking."

notes:
  - >-
    THE ACCOUNTANT IS RIGHT, AND ABOUT THE WRONG THING. Everything the founder reports of what
    his accountant told him checks out against the code: there is a minimum, it is computed on
    turnover and not on profit, there is a floor, and the year's liability is the higher of the
    two. But the floor is not what is hurting him. The 3 000 000 minimum de perception sits well
    below the 0.5%-of-turnover branch at his volumes, so it never comes into play. What binds is
    the percentage. If his volumes fell by more than a third the floor would start to matter;
    where he stands today it is a distraction from the real mechanic.
  - >-
    TWO TAXES HE DID NOT MENTION WERE ADDED FROM THE LAW. A registered trader on the régime réel
    normal in Abidjan owes the contribution des patentes and the taxe spéciale d'équipement. He
    named neither. Both are sourced above with authority and date and both are carried as
    operating costs. This is consequential and the reader should see why: their inclusion is
    what tips the comparison onto the minimum-tax side. A reader who strips them out should
    expect the ordinary profit tax to become the binding one, by a narrow margin, and should
    expect the tax line to move.
  - >-
    THE LARGEST SOURCING RISK IN THIS MODEL IS THE PATENTE CAP, NOT THE MINIMUM TAX. Sources
    disagree. PwC's country summary (last reviewed 11 March 2026) states the droit sur le
    chiffre d'affaires as 0.5% with a minimum of XOF 300 000 and a maximum of XOF 3 million.
    Two Ivorian practitioner sources give an identical turnover-banded schedule of caps in which
    this business's band caps the charge lower than PwC's single maximum, and PwC's figure
    matches that schedule's top band exactly — which is why I read PwC as quoting only the top
    of the ladder and used the banded schedule. If the flat maximum is instead the correct
    reading, the patente charge rises and FCFF falls. I could not open the CGI text itself to
    settle it; that is the honest state of the evidence and the reason this is flagged rather
    than buried.
  - >-
    A GOVERNMENT PORTAL IS STALE AND WAS NOT USED. The eRegulations Côte d'Ivoire pages still
    publish a BIC rate of 35% and IMF thresholds of 2 million and 30 million francs. Those are
    figures superseded years ago — the minimum de perception went from 2 million to 3 million,
    and the maximum from 30 million to 35 million, in the annexe fiscale to the 2013 budget.
    Recorded here because it is exactly the failure mode that internal consistency checks cannot
    catch: an official-looking page that would have made every number below tie perfectly around
    a false rate. Currency of the minimum tax itself was re-confirmed two ways — the Loi de
    finances 2026 left it untouched, and Ivorian business federations were still lobbying for
    its abolition in July 2026.
  - >-
    THE DEPRECIATION SHIELD IS WORTH NOTHING HERE. Because the binding tax is a percentage of
    turnover, depreciation reduces a profit tax that is not the one being paid. It is deducted
    to reach EBIT and added back in full, and FCFF reduces exactly to EBITDA less cash tax. Two
    consequences: the truck's useful life does not move any FCFF figure in this model (which is
    why that question is ranked low), and the marginal tax on an additional franc of profit is
    zero for as long as the minimum binds, while an additional franc of turnover carries the
    minimum tax and the equipment tax at their statutory rates.
  - >-
    NO INPUT IN THIS MODEL IS TAGGED ASSUMED. Everything not stated is either something the
    founder holds and can answer, in which case the question is attached and a working value
    carries the arithmetic, or something the law holds, in which case it is sourced with an
    authority and a verification date. I make no claim anywhere that a question to this founder
    would not have helped.
  - >-
    THE THREE QUESTIONS TO ASK IF ONLY THREE CAN BE ASKED are the volume trajectory, the
    durability of the 700-franc spread, and what the 150 francs a bag of transport actually
    covers. The third is the one the utterance itself creates: he owns a truck and also quotes a
    per-bag haulage charge, and if that charge is money paid to outside hauliers then the entire
    running cost of a twelve-million-franc truck — fuel, driver, tyres, insurance, vignette — is
    missing from this cost base. He can settle it in one sentence.
  - >-
    WORKING CAPITAL IS INVISIBLE TO THIS NUMBER AND VERY VISIBLE TO THIS BUSINESS. Under a flat
    volume path the level of stock, receivables and payables never changes, so ΔNWC is zero and
    the level drops out of FCFF entirely. That is why the three working-capital questions carry
    a low materiality ranking. It is not a statement that the answers are unimportant: at
    825.6 million of annual turnover and 4% gross margin, a handful of days of credit to
    retailers represents more cash than a year of EBITDA, and the answers determine whether this
    business can grow without outside money at all.
  - >-
    CAPEX IS ZERO BY CONSTRUCTION AND THAT IS A PROPERTY OF THE HORIZON, NOT OF THE BUSINESS.
    The five periods end where the truck must be replaced. These FCFF figures therefore carry no
    replacement capex and must not be extrapolated or capitalised into a perpetuity without one.
    What a replacement truck would cost, new or used, is a question the founder could answer and
    a future model would need.
  - >-
    ACCOUNTING FRAMEWORK FRICTION, NOTED AND NOT FORCED. The applicable framework in Côte
    d'Ivoire is the OHADA SYSCOHADA révisé, not IFRS. The build here follows the IFRS-shaped
    unlevered construction as instructed; on the facts of this business — one depreciable asset,
    no leases capitalised, no provisions, no financial instruments — nothing turns on the
    difference. A second, real divergence is book versus tax depreciation: Ivorian practice
    amortises matériel de transport faster than the founder's seven-year service estimate, so
    taxable profit and book profit would separate. Under a binding minimum tax that divergence
    changes no cash tax, and it is left unmodelled and flagged rather than approximated.
  - >-
    NOT MODELLED, FLAGGED. As a seller on a real regime, sales to retailers who are not
    themselves on a real regime attract the AIRSI withholding, which he must collect on his
    invoice and remit. It is the buyer's tax credit rather than his cost, so it does not enter
    FCFF, but it is a real compliance and cash-timing exposure in a trade whose customers are
    Adjamé market retailers, and the utterance says nothing about how it is handled.
  - >-
    FCFF HERE IS BEFORE ANY PAY FOR THE FOUNDER. Owner's remuneration is carried at zero because
    none was mentioned. He employs three handlers and names no driver and no manager, which
    suggests he does that work himself. Whatever it would cost to replace his own labour is a
    genuine operating cost this model does not carry, and the direction is one way: charging it
    would reduce every figure below.
  - >-
    THE MODEL IS IN FLAT NOMINAL XOF WITH NO INDEXATION. Prices, wages and rent are held at
    their stated levels for five years. That is the constant-price convention and it is defended
    on the ground that this founder's economics are a spread, not a level: general inflation
    that lifts both his buy and his sell price leaves the spread roughly intact. The exposure it
    hides is asymmetric and worth stating in direction: rent and wages are set in francs and
    ratchet up, while the spread is set by a competitive import market, so unindexed fixed costs
    against a fixed spread erode EBITDA over time rather than leaving it flat.

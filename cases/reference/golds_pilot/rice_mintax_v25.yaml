passage: >-
  UNITS FIRST. This business does not naturally think in revenue and cost of sales; it thinks in
  bags. Everything below is built in bags of fifty kilos and then expressed in francs, and the
  per-bag ladder is carried alongside the annual one because it is the only form in which the
  founder can check my arithmetic against what he knows.


  VOLUME. He turns about four thousand bags a month. Twelve months gives 4 000 × 12 = 48 000
  bags bought per year. The base case carries no shrinkage (that is a question, not a finding),
  so bags lost are zero and bags sold equal bags bought: 48 000. Volume is held flat across all
  five periods; that is a choice, and it is the first question on my list.


  THE TRADE. Revenue is 17 200 × 48 000 = 825 600 000 XOF a year. Cost of goods is 16 500 ×
  48 000 = 792 000 000. Gross margin is the difference, 33 600 000, which is 700 XOF a bag and
  4.07% of turnover. That number is the whole story of this business and the reason the tax
  question matters: he moves eight hundred and twenty-five million francs of rice to keep
  thirty-three million of gross margin.


  OPERATING COSTS, PER BAG WHERE THEY BELONG. Transport from the port is charged per bag: 150 ×
  48 000 = 7 200 000 a year. The store is a monthly fixed cost: 400 000 × 12 = 4 800 000. Three
  handlers at 80 000 each is 3 × 80 000 × 12 = 2 880 000. Owner's remuneration is carried at
  zero because none was mentioned. Those four lines total 14 880 000, or 310 XOF a bag —
  150 of transport and 160 of store-plus-wages.


  THE TWO LEVIES HE DID NOT MENTION. He is registered and on the réel, and his turnover of
  825.6 million puts him above the 500-million threshold, so he is on the régime réel normal.
  Two turnover-based charges follow from that and are not optional. First, the contribution des
  patentes. Its droit sur le chiffre d'affaires is 0.5% of turnover, which would be 4 128 000,
  but the charge is capped by turnover band and his band (500 000 001 to 1 000 000 000) caps it
  at 1 300 000; the 300 000 minimum is far below, so the cap is what binds and the droit is
  1 300 000. Its droit sur la valeur locative is 18.5% of the annual rental value of the
  premises, and for a tenant the valeur locative is the rent: 0.185 × 4 800 000 = 888 000. The
  patente is therefore 1 300 000 + 888 000 = 2 188 000 a year. Second, the taxe spéciale
  d'équipement at 0.1% of turnover: 0.001 × 825 600 000 = 825 600. Together, 3 013 600 a year,
  or 62.78 XOF a bag.


  EBITDA. Total operating costs are 7 200 000 + 4 800 000 + 2 880 000 + 0 + 2 188 000 + 825 600
  = 17 893 600. EBITDA is 33 600 000 − 17 893 600 = 15 706 400, which is 327.22 XOF a bag and
  1.90% of turnover. Read the per-bag ladder: 700 of spread, less 150 transport, less 160
  store and wages, less 45.58 patente, less 17.20 equipment tax, leaves 327.22.


  DEPRECIATION. The truck cost 12 000 000 and gives seven years of service, straight-line:
  12 000 000 / 7 = 1 714 285.71 a year, or 35.71 XOF a bag. Two years are already gone, so
  accumulated depreciation at the start of the horizon is 2 × 1 714 285.71 = 3 428 571.43 and
  the opening net book value is 12 000 000 − 3 428 571.43 = 8 571 428.57. Over the five modelled
  years the charge is 5 × 1 714 285.71 = 8 571 428.57, which takes net book value to zero exactly
  at the end of P5. That is not a coincidence; it is how the horizon was chosen.


  EBIT. 15 706 400 − 1 714 285.71 = 13 992 114.29 a year, or 291.50 XOF a bag. Identical in every
  period, because volumes, prices and costs are flat and depreciation is level.


  THE TAX, WHICH IS THE POINT. Two amounts are computed and the higher is paid — exactly as his
  accountant told him. (a) The ordinary profit tax: BIC at 25% on 13 992 114.29 = 3 498 028.57.
  (b) The impôt minimum forfaitaire: 0.5% of turnover. Because rice is exempt from TVA, turnover
  TTC equals turnover HT, so the base is 825 600 000 and the raw IMF is 4 128 000. That sits
  above the 3 000 000 minimum de perception and far below the 35 000 000 maximum, so the raw
  figure is the liability. Comparing: 4 128 000 against 3 498 028.57. The minimum wins. Tax due
  is 4 128 000, and the founder is paying 629 971.43 a year — 13.12 XOF on every bag — more than
  the profit tax alone would have cost him. Note what this means: the floor he worries about
  (3 000 000) is not what is biting him. The 0.5%-of-turnover branch is. And it binds under the
  20% personne physique rate too, since 20% of 13 992 114.29 is 2 798 422.86, further below
  4 128 000 still.


  NOPAT. This is where the standard construction has to be handled carefully rather than
  applied. NOPAT is normally EBIT × (1 − t), but there is no single t here: the tax actually
  assessed is not a rate on profit at all, it is a rate on turnover. So NOPAT is taken as EBIT
  less the tax actually due: 13 992 114.29 − 4 128 000 = 9 864 114.29, or 205.50 XOF a bag. The
  implied effective rate on EBIT is 4 128 000 / 13 992 114.29 = 29.50%, above the 25% statutory
  rate, and that gap is the whole of the founder's complaint expressed as a number. There is no
  debt anywhere in the utterance, so there is no interest to strip out: the tax computed is
  already the unlevered tax and NOPAT is already the unlevered figure.


  WORKING CAPITAL. Nothing was said about who pays whom when, so three questions are attached
  and the base case runs on working values: seven days of purchases in stock, nothing owed by
  retailers, nothing owed to the port. Inventory is 7 × 792 000 000 / 360 = 15 400 000;
  receivables and payables are zero; net working capital is 15 400 000. That level is already in
  place — the man has been trading for at least two years — and because volumes and prices are
  flat it does not move. So ΔNWC is zero in every period. This is worth stating plainly: FCFF
  here is insensitive to the LEVEL of working capital, and only a change in the level would
  touch it. That is why the three working-capital questions are ranked low against the volume
  and spread questions, and it is not the same as saying they do not matter.


  CAPEX. None inside the horizon, by construction: the truck runs to the end of P5 and its
  replacement falls in the period after. Capex is zero in all five periods.


  FCFF. FCFF = NOPAT + D&A − ΔNWC − capex = 9 864 114.29 + 1 714 285.71 − 0 − 0 = 11 578 400.00
  per year, or 241.22 XOF a bag. Cross-check by the other route: EBITDA − tax − ΔNWC − capex =
  15 706 400 − 4 128 000 − 0 − 0 = 11 578 400.00. The two agree.


  PERIODS 2 TO 5. Every operating and tax line repeats unchanged, because the run-rate is held
  flat: bags 48 000, revenue 825 600 000, cost of goods 792 000 000, gross margin 33 600 000,
  operating costs 17 893 600, EBITDA 15 706 400, depreciation 1 714 285.71, EBIT 13 992 114.29,
  BIC 3 498 028.57, IMF 4 128 000, tax due 4 128 000, NOPAT 9 864 114.29, ΔNWC 0, capex 0, FCFF
  11 578 400.00. The only line that moves is the truck's net book value, which steps down by
  1 714 285.71 a year from 8 571 428.57 at the start of P1 to 6 857 142.86, 5 142 857.14,
  3 428 571.43, 1 714 285.71 and finally zero at the end of P5. Five-year total FCFF is 5 ×
  11 578 400.00 = 57 892 000.00 XOF.


  ONE STRUCTURAL OBSERVATION THE NUMBERS FORCE. Because the binding tax is assessed on turnover
  and not on profit, the depreciation of the truck shelters nothing: it is deducted to get EBIT,
  changes the BIC he does not pay, and is then added straight back. FCFF collapses exactly to
  EBITDA less cash tax. For as long as the minimum binds, an extra franc of profit attracts no
  extra tax, while an extra franc of turnover attracts the IMF and the equipment tax at their
  statutory rates and, above the patente cap, nothing further from the patente. That is a very
  strange incentive structure to run a low-margin wholesale business inside, and it is precisely
  what the founder is describing when he says the minimum weighs on him.


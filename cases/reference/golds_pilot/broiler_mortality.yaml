  feed_vat_rate_2026:
    value: 0.09
    unit: fraction
    prov: SOURCED
    source: >-
      fact_id CI-BA-08. The founder reports "depuis le début de l'année ça a encore monté — le vendeur
      dit qu'ils ont mis une taxe dessus". The dealer is RIGHT and the tax is identifiable: animal feed
      ("aliments pour bétail et animaux de basse-cour"), previously fully VAT-exempt, moved to the
      reduced 9% rate with effect 17 January 2026. This is a fact about the world that corroborates a
      second-hand claim inside the utterance. He is not registered for VAT and, under the entreprenant
      régime, VAT is substituted rather than reclaimable — so the 9% is a dead cost to him, not a
      recoverable input tax. Annex caveat carried forward: CI-BA-08 is flagged as resting on secondary
      sources (teamfrance-export.fr; Deloitte Avocats CI) and not verified against the 2026 annexe
      fiscale primary text, so it is used to BOUND the question below rather than to set a value.
    authority: "Côte d'Ivoire, annexe fiscale à la loi de finances 2026, reduced 9% rate on aliments pour bétail et animaux de basse-cour, effective 17 January 2026 (secondary reporting: teamfrance-export.fr; Deloitte Avocats CI)"
    verified: "2026-07-29"
  feed_price_uplift:
    value: 0
    unit: fraction
    prov: ELICITED
    source: >-
      The utterance is genuinely undetermined here and it matters more than anything else on the cost
      side. He quotes 19,000 / 17,500 / 16,500 and then says "et depuis le début de l'année ça a
      encore monté" — so the quoted prices are either what he pays NOW (uplift already inside them,
      = 0) or what he was paying BEFORE the January step (uplift still to come). Base case is 0, the
      omitting choice, because a quoted price is normally the current one and adding an increase he
      did not quantify would be inventing cost. The upper end of the range is the 9% VAT step from
      feed_vat_rate_2026, which is the identified cause of the rise. Feed is 54% of cash cost, so this
      one answer moves FCFF harder than any other price question in the interview.
    question: "Les dix-neuf mille, dix-sept mille cinq et seize mille cinq que tu m'as donnés — c'est ce que tu as payé à ta dernière livraison, ou c'était le prix avant l'augmentation du début de l'année ?"

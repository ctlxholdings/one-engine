    source: "\"Je n'ai jamais rien payé aux impôts\" — his practice. The 1,500/month to the mairie is a separate object, sits in opex as commune_levy, and is not a payment to the DGI. Used only in the fcff_as_currently_paid column."
    date: "2026-07-29"
  commune_levy_annual:
    value: 18000
    unit: XOF per year
    prov: INFERRED
    derivation: "commune_levy_monthly * 12"
    source: "commune_levy_monthly — what he actually hands over in a year, against a statutory TEE that is roughly twenty times larger"
    date: "2026-07-29"
passage: |
  STEP 0 — WHAT THE PERIOD IS.
  He works in bandes. A bande occupies the shed for 45 days of grow-out and then 14 days empty for
  disinfection, so one cycle is 59 days. Six of those fit in a year (6 x 59 = 354 days, inside 365);
  seven do not (7 x 59 = 413). Six is also what he calls a normal year. So the grid is six periods of
  one batch each, and the horizon is one production year. Every period is identical in physical terms
  — same 500 chicks, same 30 sacks, same 40 deaths — and differs only in the selling price, because
  one batch of the six comes off at the end-of-year fêtes.

  STEP 1 — THE FLOCK, AND WHERE THE BIRDS GO.
  He places 500 day-old chicks. Of those, the base case buries 40 and keeps 6 for the house, leaving
  454 to sell. That reproduces his own spoken count — "j'achète cinq cents poussins, j'en enterre une
  quarantaine, il m'en reste quatre cent cinquante et quelques" — and it closes: 500 = 40 + 6 + 454,
  with nothing left in the shed at the end of the period, because the period boundary sits in the
  middle of the empty fortnight. That last point is worth being explicit about rather than assuming:
  the closing live-bird stock is zero in every period BY CONSTRUCTION, not by luck, and there is
  therefore no carry-over flock to lose weight, get sick or be stolen between periods.

  But his 40 is contradicted by his own description of the dying, and this is the finding of the case.
  He describes the shape day by day: "les premiers jours tu entres le matin et tu en ramasses trois,
  quatre, des fois cinq sous la lampe", then "passé les deux premières semaines ça se calme, après
  c'est un ou deux par semaine jusqu'à la fin". Rebuild it. Four a day (the middle of three-four-five,
  and the number he says first) for the fourteen brooding days is 4 x 14 = 56 birds. Then one and a
  half a week for the remaining 45 - 14 = 31 days is 1.5 x 31 / 7 = 6.642857142857143 birds. Total
  62.642857142857146. His headline is 40. The two accounts of the same flock differ by 57%, and the
  day-by-day figure lands almost exactly on the number he reserves for a BAD batch, "des fois soixante
  quand ça va mal". Twenty-three birds a batch, six batches a year, is 138 head — at 2,500 a head,
  roughly 345,000 XOF of revenue a year that is either there or is not, on a business whose whole
  unlevered cash generation is of that order. The model runs on his 40 because that is what he asserts
  and it is what closes with his "450-odd"; the question stays attached at the top of the ranking.

  Of the 454 sold, he says about twenty "restent petits" and go at 1,500-1,800, mid 1,650. He also
  sells the odd bird that "commence à traîner" at half price, and gives no count for those, so the
  base case carries zero of them and the question is asked instead. That leaves 454 - 20 - 0 = 434 at
  the full head price.

  STEP 2 — DOES THE FLOCK FIT THE BUILDING?
  The shed is 12 x 5 = 60 m2. Five hundred birds is 0.12 m2 a bird. The published density for broilers
  grown to about six weeks in open-sided, naturally ventilated tropical housing — which is what
  parpaings, grillage and tôle describes, with no fan mentioned anywhere — is 0.1 m2 a bird. So 500
  fits, with about 17% of headroom. Now run his own failed experiment through the same test: 700 birds
  in 60 m2 is 0.0857 m2 a bird, which breaches the benchmark. He found that out the hard way — "j'ai
  essayé sept cents une fois, sous les lampes c'était trop serré ; je suis revenu à cinq cents" — and
  the benchmark and the founder agree, independently, on where the building's limit is. The live-weight
  loading at day 45 is 460 birds x 1.25 kg / 60 m2 = 9.58 kg/m2, comfortably under the 30 kg/m2 quoted
  for naturally ventilated houses, though that ceiling assumes stir fans he does not have, so passing
  it is a weak pass and I record it as one.

  On availability: he managed five batches last year, not six — "l'année dernière je n'en ai fait que
  cinq" — and he tells us why in the same breath, "des fois cinquante jours quand ils ne prennent pas
  bien". A 50-day grow-out makes a 64-day cycle and 5.7 batches a year. So six is the good year, not
  the average year, and the base case is running the plant at the top of what he says it does. That is
  a choice, it is visible, and it is not hidden inside a number.

  STEP 3 — THE FEED, AND WHAT THE DEALER'S RATIO IS NET OF.
  He goes through "une trentaine de sacs de cinquante kilos: quatre ou cinq de démarrage, huit de
  croissance, et le reste en finition, seize, dix-sept". Only one combination inside those three ranges
  sums to a round thirty: 5 + 8 + 17. So the split is determined by his own words rather than chosen,
  and it is also the dearer reading. Thirty sacks at 50 kg is 1,500 kg a batch. At 19,000, 17,500 and
  16,500 the feed bill is 5 x 19,000 + 8 x 17,500 + 17 x 16,500 = 95,000 + 140,000 + 280,500 =
  515,500 XOF a batch, which is 54% of everything he spends.

  Now the transformation. A yield ratio is not a balance, so take the 1,500 kg apart. Some falls on
  the floor — "ils grattent dans les mangeoires et ça tombe par terre" — and at a working 6%, the
  middle of the band usually quoted for managed pan and trough feeders, that is 90 kg. Some was eaten
  by birds that then died: 40 birds at a weighted 0.25 kg each, concentrated in the brooding fortnight
  when a chick eats very little, is 10 kg. What is left, 1,500 - 90 - 10 = 1,400 kg, went into the 460
  birds that finished, of which the six kept for the house took 1,400 x 6/460 = 18.26 kg and the 454
  sold took 1,400 x 454/460 = 1,381.74 kg. Those four terms sum back to 1,500 exactly, which is what
  rule (a) asks for and what a bare conversion ratio would have concealed.

  With the balance open, test the dealer's claim. He says "avec deux kilos et demi d'aliment tu fais
  un kilo de poulet", and the founder says "moi je n'ai jamais vérifié". At 1.25 kg a bird — the middle
  of the "un kilo deux, un kilo trois" he quotes — the 460 finished birds carry 575 kg of live weight.
  Feed purchased over live weight finished is 1,500 / 575 = 2.6087. So the operation's true purchased-
  feed ratio is about 4% WORSE than the feed salesman's number, and the salesman's 2.5 is net of
  nothing at all: it silently absorbs the spillage, the feed eaten by the dead, and everything the live
  birds turned into manure and body heat. Measured on feed that actually entered a surviving bird, the
  conversion is 1,400 / 575 = 2.4348. The distance between 2.4348 and 2.6087 is precisely the spillage
  and the mortality feed — which is the useful decomposition, because it tells him whether to change
  his feed or his feeders, and the dealer's single number cannot.

  STEP 4 — THE REST OF THE COST, PER BATCH.
  Chicks: 500 x 600 = 300,000. Feed: 515,500. Gas for brooding: 1.5 bottles x 4,500 = 6,750. Litter:
  3 trips x 2,000 = 6,000. Newcastle, Gumboro and vitamins: 15,000 (his own "mettons", an estimate).
  Then the monthly items. There are twelve months in his year and six batches, so each batch must
  carry two months of them — not the 1.94 months the 59-day cycle would suggest, because the boy is
  paid and the pump is powered through the eleven idle days of the calendar too, and charging these
  over the 45 grow-days alone would understate them by about a quarter. Electricity 8,000 x 2 =
  16,000. The boy 50,000 x 2 = 100,000. The man from the mairie 1,500 x 2 = 3,000. Rent is an explicit
  zero: "le terrain c'est celui de mon père, je ne paie pas de loyer". Disinfectant, the boy's food and
  any equipment replacement are all things he does but never prices, so they carry zero and carry a
  question each. Total cash opex 962,250 XOF a batch, of which chicks and feed alone are 815,500, or
  85%. He is right that "quand tu enlèves les poussins et l'aliment, il ne reste plus grand-chose".

  Depreciation: the shed cost 1,800,000 three years ago. Over an assumed 15-year life that is 120,000
  a year, 20,000 a batch, and the opening book value is 1,800,000 x (1 - 3/15) = 1,440,000, running
  down to 1,320,000 by the end of the horizon. No capex falls in the year, because the only asset he
  priced has twelve years left and the equipment he did not price carries zero.

  STEP 5 — REVENUE.
  A normal batch: 434 head at 2,500 = 1,085,000, plus 20 runts at 1,650 = 33,000, total 1,118,000. The
  festive batch: 434 at 3,100 = 1,345,400, plus the same 33,000 of runts, total 1,378,400 — the runt
  price held flat, because he quotes it without seasonal variation and a small bird is what a festive
  buyer least wants. Five normal batches and one festive gives an annual turnover of 5 x 1,118,000 +
  1,378,400 = 6,968,400 XOF. The six birds kept for the house produce no revenue: they are owner's
  drawings in kind, they never meet a buyer, and the feed they ate stays in cost, which is the honest
  asymmetry rather than an error.

  STEP 6 — TAX. THE PART HE GETS HALF RIGHT.
  He says: "l'élevage ce n'est pas comme le commerce, il y a un forfait pour les agriculteurs, la
  patente ne nous concerne pas." Two claims. On the patente he is RIGHT, and for a better reason than
  he knows: there is a PERMANENT exemption for farmers and livestock raisers who sell only produce
  from their own holding and whose turnover is under the réel normal threshold. He clears both limbs —
  he buys chicks and feed as inputs and sells birds he raised, and 7.0m is a long way under 500m. His
  brother-in-law sells spare parts he did not make, which is négoce, and the exemption does not reach
  him. They are both correct about their own businesses, which is exactly why neither can convince the
  other. On the forfait he is WRONG: bénéfices agricoles is not a separate régime in Côte d'Ivoire, it
  is merged with BIC in one chapter under the same bands and the same rate, aviculture sits inside it,
  and there is no micro-BA abattement.

  So run the band test on the number the model produced. Annual turnover 6,968,400 is above the
  5,000,000 ceiling of the taxe communale de l'entreprenant and inside the 5,000,001-50,000,000 band of
  the taxe d'État de l'entreprenant. The TEE is libératoire — it substitutes for the patente, the
  profits tax and VAT — and it is charged at 4% for commerce and négoce and 5% for everything else. He
  produces rather than resells, so 5%. That gives 0.05 x 6,968,400 = 348,420 XOF a year, allocating
  per batch exactly in proportion to that batch's revenue, which a turnover tax does naturally: 55,900
  on a normal batch and 68,920 on the festive one.

  Three negatives matter as much as that positive. The impôt minimum forfaitaire does NOT apply: it
  reaches the réel normal and réel simplifié régimes only, and its 3,000,000 floor is larger than
  everything this business generates in a year, so a model that applied it would produce an operation
  that cannot exist. The Investment Code does NOT apply, on three independent grounds — Azaguié is not
  a Zone B chef-lieu and "sur la route de Bouaké" is a road rather than an address; his 1,800,000 shed
  is 3.6% of the 50,000,000 SME agrément threshold; and the agricultural incentive articles require 100
  hectares or agro-industrial status and enumerate plantation crops in which poultry appears nowhere.
  And the processing agrément does not apply either, because he sells live at the gate and there is no
  transformation anywhere in the utterance.

  Against 348,420 of statutory tax he actually pays nothing to the DGI, plus 18,000 a year to a man
  from the mairie whose receipt-book he cannot identify. The base case runs on the LAW, because a
  reference solution that capitalises an under-declaration is not a valuation of the business; the
  as-practised number is carried as its own trace column so both objects exist and the gap is
  arithmetic rather than commentary.

  STEP 7 — WORKING CAPITAL, WHICH IS ZERO AT EVERY BOUNDARY AND ENORMOUS IN BETWEEN.
  Take each stock in turn rather than assuming any of them. Receivables: zero, and not by convention —
  "je vends vivant, à la tête, au poulailler ; les revendeuses viennent avec leurs cages", a spot sale
  paid on collection. Live birds: zero at every boundary, because the boundary sits inside the empty
  fortnight. Feed: zero, because he buys by phase within the batch and there are no birds to feed
  during the void, so nothing is held for rodents or mould to work on. Payables: the dealer gives him
  credit on five or six sacks, "et je le paie à la vente" — so the payable is created during the cycle
  and extinguished on day 45, fourteen days before the period ends. Every stock is therefore zero at
  every period end, net working capital is zero throughout, and the change in it is zero throughout.

  That is arithmetically true and operationally misleading, so the intra-cycle number is materialised
  rather than described. Before a single franc comes in he has paid for chicks (300,000), the feed he
  is not given credit on (515,500 - 82,500 = 433,000), gas, litter and vaccines (27,750), and the
  45/59 share of the monthly items that falls before the sale (119,000 x 0.7627 = 90,762.71). That is
  851,512.71 XOF of cash out per cycle before any comes back. He borrowed 500,000 from a microfinance
  for exactly this and it cost him 70,000 over six months, or 14% of principal. The loan covers 59% of
  the peak. The financing cost is excluded from this unlevered build by definition, but the loan is the
  best available world-check that the peak figure is the right order of magnitude, and it is asserted
  as one.

  STEP 8 — THE LADDER.
  Normal batch: revenue 1,118,000 less opex 962,250 gives EBITDA 155,750; less depreciation 20,000
  gives EBIT 135,750; less TEE 55,900 gives NOPAT 79,850; add back depreciation 20,000, less change in
  working capital 0, less capex 0, gives FCFF 99,850.
  Festive batch: revenue 1,378,400 less 962,250 gives EBITDA 416,150; EBIT 396,150; less TEE 68,920
  gives NOPAT 327,230; FCFF 347,230.
  Annual FCFF is 5 x 99,850 + 347,230 = 846,480 XOF on turnover of 6,968,400, a 12.1% asset-side cash
  margin. The one festive batch supplies 41% of the year's free cash flow from 20% of the volume.

  STEP 9 — THE CUMULATIVE TEST AGAINST THE WORLD.
  Over the six periods: 3,000 chicks placed, 240 buried, 36 eaten at home, 2,724 sold; 180 sacks or
  9,000 kg of feed; 18 loads of shavings; 9 gas bottles. Now the lifetime test. At six batches a year
  over a 15-year shed life the building will see 90 batches; three years are gone, so about 72 remain
  and this horizon uses six of them — the horizon fits inside the asset comfortably, which is asserted
  rather than assumed. Spread over 90 batches the shed costs 20,000 a batch, or 44 XOF per bird sold,
  1.8% of a 2,500 head price: cheap, and consistent with a structure a smallholder built himself, and
  a useful reminder that the depreciation line is not where this business lives. Over the same life he
  will buy 135 tonnes of feed at today's prices — some 46m XOF, twenty-six times what the building
  cost. This is a feed business with a shed attached, and the ranking of the questions follows that.

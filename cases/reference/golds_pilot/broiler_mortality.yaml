  investment_code_relief_rate:
    value: 0
    unit: fraction of profits tax relieved
    prov: SOURCED
    source: >-
      No Investment-Code relief, on three independent grounds, any one of which is fatal. (1) LOCATION
      — he is at Azaguié, in Agnéby-Tiassa; "sur la route de Bouaké" is a road, not an address, and
      Zone B is defined by chefs-lieux de région plus Bonoua and Grand-Bassam. Reading "Bouaké" out of
      that phrase and taking Zone B would be the classic error here. (2) SIZE — the agrément regime
      requires 50,000,000 of investment excluding working capital for an SME; his shed cost 1,800,000,
      some 3.6% of the threshold, leaving at best the régime de déclaration, whose advantages are
      confined to the exploitation phase. (3) ACTIVITY — the dedicated agricultural incentive
      apparatus does not reach livestock at all: CGI arts. 12bis/12ter and art. 165 require 100 ha or
      agro-industrial status and enumerate named plantation crops only, in which poultry appears
      nowhere. So the ten-year Zone B category-1 holiday is not in play and neither is any agricultural
      profit reduction.
    authority: "fact_ids CI-BA-06, CI-INV-01, CI-INV-05, CI-V25-28. Ordonnance n°2018-646 du 1er août 2018, arts. 5, 8, 10, 13; CGI arts. 12bis, 12ter, 165"

    source: >-
      feed_kg_per_batch, live_weight_total_kg_per_batch. WHAT THE RATIO IS NET OF — the requirement
      rule (a) puts on any handed-down ratio. This one is net of NOTHING: it is every kilo he buys,
      divided by the live weight of every bird that reached day 45. It already absorbs the spillage on
      the floor, the feed eaten by the forty that died, and everything the surviving birds turned into
      manure, moisture and body heat rather than meat. At 2.609 it sits about 4% ABOVE the dealer's

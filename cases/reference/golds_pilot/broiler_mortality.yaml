contract: "v2.6"
id: broiler_mortality
title: "Azaguié broiler grow-out — unlevered FCFF over one production year, on a batch grid"
currency: XOF

grid:
  periods: 6
  freq: "one bande (batch) = 59 days: 45 days grow-out + 14 days vide sanitaire"
  why: >-
    The period is the BATCH, not the month or the quarter, because the batch is the unit the founder
    actually operates in — "Je travaille par bandes" — and every physical quantity he states is per
    batch: 500 chicks, ~30 sacks of feed, 3 litter trips, 1.5 gas bottles, ~40 deaths, ~454 head sold.
    A monthly grid would have to cut every one of those in half at an arbitrary boundary and would
    invent an inventory of half-grown birds that the batch grid never has to guess at. The period
    length is 59 days because he states both halves of the cycle himself — "Je les garde quarante-cinq
    jours" and "laisser le bâtiment vide deux semaines" — and 45 + 14 = 59.

    The HORIZON is six batches = one production year (354 days of a 365-day year), for four reasons,
    each of which a reader can attack.
    (1) Six is his own normal — "Ça fait six bandes dans l'année quand tout va bien" — and it is the
        largest whole number of 59-day cycles that fits in a year (6 x 59 = 354 <= 365; 7 x 59 = 413,
        which is physically impossible, so seven batches is not a scenario, it is an error). Both of
        those are asserted in `checks`.
    (2) One year is the smallest horizon that contains the whole seasonal price cycle. He prices the
        end-of-year fêtes separately (3,000-3,200 versus 2,500). A horizon of three or four batches
        would either include that batch or exclude it, and would misstate revenue by roughly a fifth
        either way. Six batches contain it exactly once.
    (3) One year is the tax year, and the régime that governs him is decided on ANNUAL turnover. On a
        one-year horizon the band test is answerable exactly once, on a number the model actually
        produces (`sum(trace.revenue)`), rather than smeared across a part-year or extrapolated.
    (4) Past one year I would be forecasting, not modelling. The two costs that dominate this
        operation are both stated to be rising with no stated trajectory — chicks "six cents le
        poussin ; l'année dernière c'était cinq cent cinquante, ça monte tout le temps" and feed
        "depuis le début de l'année ça a encore monté". A second year would either be an identical
        copy of the first, which adds no information while looking like more evidence, or a trended
        one, which adds information I cannot source. I would rather stop where the utterance stops.

    What this horizon deliberately does NOT capture: the shed has roughly twelve years of life left,
    so no replacement capex falls inside the window and capex is zero throughout. That is a real
    property of the answer, not an omission — it is stated in `notes`, the closing book value is
    carried in `trace.shed_book_value`, and `checks` asserts that the horizon fits inside the
    remaining life rather than assuming it.
utterance:
  fr: |
    Je fais du poulet de chair à Azaguié, sur la route de Bouaké. Le terrain c'est celui de mon père,
    je ne paie pas de loyer. J'ai monté le poulailler il y a trois ans, douze mètres sur cinq,
    parpaings, grillage et tôle : un million huit cent mille.

    Je travaille par bandes. J'achète cinq cents poussins d'un jour au couvoir, six cents francs le
    poussin ; l'année dernière c'était cinq cent cinquante, ça monte tout le temps. Je les garde
    quarante-cinq jours, des fois cinquante quand ils ne prennent pas bien, et après il faut tout
    désinfecter et laisser le bâtiment vide deux semaines. Ça fait six bandes dans l'année quand tout
    va bien ; l'année dernière je n'en ai fait que cinq. J'ai essayé sept cents une fois, sous les
    lampes c'était trop serré ; je suis revenu à cinq cents.

    Ce qui coûte, c'est l'aliment. Sur une bande je passe une trentaine de sacs de cinquante kilos :
    quatre ou cinq de démarrage, huit de croissance, et le reste en finition, seize, dix-sept, parce
    qu'à la fin ils mangent comme des ogres. Le démarrage c'est dix-neuf mille le sac, la croissance
    dix-sept mille cinq, la finition seize mille cinq, et depuis le début de l'année ça a encore monté
    — le vendeur dit qu'ils ont mis une taxe dessus. Lui il me fait crédit sur cinq ou six sacs et je
    le paie à la vente. Il répète qu'avec deux kilos et demi d'aliment tu fais un kilo de poulet ; moi
    je n'ai jamais vérifié. Il y a du gâchis aussi, ils grattent dans les mangeoires et ça tombe par
    terre. Quand tu enlèves les poussins et l'aliment, il ne reste plus grand-chose : le gaz pour
    chauffer les poussins les deux premières semaines, une bouteille et demie à quatre mille cinq ; les
    copeaux de la litière, deux mille le voyage, trois voyages par bande ; le Newcastle, le Gumboro et
    les vitamines, mettons quinze mille ; le courant pour la pompe, huit mille par mois.

    La mortalité, c'est le début qui est mauvais. Les premiers jours tu entres le matin et tu en
    ramasses trois, quatre, des fois cinq sous la lampe. Passé les deux premières semaines ça se calme,
    après c'est un ou deux par semaine jusqu'à la fin. En tout j'en perds une quarantaine par bande,
    des fois soixante quand ça va mal. Le calcul est vite fait : j'achète cinq cents poussins, j'en
    enterre une quarantaine, il m'en reste quatre cent cinquante et quelques à vendre. J'en garde cinq
    ou six pour la maison.

    Je vends vivant, à la tête, au poulailler. Les revendeuses viennent avec leurs cages, elles
    soupèsent, elles ne pèsent pas. Deux mille cinq la tête normalement, deux mille trois quand il y a
    beaucoup de poulet dehors, et aux fêtes de fin d'année trois mille, trois mille deux. À
    quarante-cinq jours ils font un kilo deux, un kilo trois, les meilleurs un kilo et demi mais c'est
    rare. Il y en a toujours une vingtaine qui restent petits, ceux-là je les laisse à mille cinq,
    mille huit. Et si j'en vois un qui commence à traîner, je le donne à moitié prix avant qu'il crève.

    J'ai un jeune du village qui dort là-bas et qui donne à manger le matin, cinquante mille par mois
    et il mange sur place. Ce n'est pas déclaré, c'est comme ça partout ici. L'année dernière j'ai pris
    cinq cent mille dans une microfinance sur six mois pour payer une bande, ça m'a coûté soixante-dix
    mille.

    Pour les impôts, honnêtement je ne sais pas. On m'a toujours dit que l'élevage ce n'est pas comme
    le commerce, qu'il y a un forfait pour les agriculteurs et que la patente ne nous concerne pas. Je
    n'ai jamais rien payé aux impôts ; il y a juste un gars de la mairie qui passe avec son carnet, je
    lui donne mille cinq cents par mois sans savoir ce que c'est. Personne ne m'a jamais demandé de
    facture. Mon beau-frère qui vend des pièces détachées paie une patente chaque année et il dit que
    je devrais me mettre en règle ; je ne sais pas qui a raison. Ce qui me gâte les affaires, c'est
    plutôt les cuisses congelées qui viennent de dehors.
  en: |
    I raise broiler chickens at Azaguié, on the Bouaké road. The land is my father's, I pay no rent. I
    put up the shed three years ago, twelve metres by five, breeze blocks, wire mesh and sheet metal:
    one million eight hundred thousand.

    I work in batches. I buy five hundred day-old chicks at the hatchery, six hundred francs a chick;
    last year it was five hundred and fifty, it goes up all the time. I keep them forty-five days,
    sometimes fifty when they aren't coming on well, and afterwards everything has to be disinfected
    and the building left empty for two weeks. That gives me six batches in the year when all goes
    well; last year I only managed five. I tried seven hundred once, under the lamps it was too tight;
    I went back to five hundred.

    What costs is the feed. On one batch I go through about thirty fifty-kilo sacks: four or five of
    starter, eight of grower, and the rest in finisher, sixteen, seventeen, because at the end they eat
    like ogres. Starter is nineteen thousand a sack, grower seventeen thousand five, finisher sixteen
    thousand five, and since the beginning of the year it has gone up again — the dealer says they've
    put a tax on it. He gives me credit on five or six sacks and I pay him at the sale. He keeps saying
    that with two and a half kilos of feed you make a kilo of chicken; me, I've never checked. There's
    waste too, they scratch in the feeders and it falls on the ground. Once you take out the chicks and
    the feed, there isn't much left: the gas for warming the chicks the first two weeks, a bottle and a
    half at four thousand five; the wood shavings for the litter, two thousand a trip, three trips a
    batch; the Newcastle, the Gumboro and the vitamins, say fifteen thousand; electricity for the pump,
    eight thousand a month.

    The dying, it's the beginning that's bad. The first days you come in in the morning and you pick up
    three, four, sometimes five under the lamp. After the first two weeks it settles down, then it's
    one or two a week until the end. All told I lose about forty a batch, sometimes sixty when it goes
    badly. The count is quickly done: I buy five hundred chicks, I bury about forty, that leaves me
    four hundred and fifty odd to sell. I keep five or six for the house.

    I sell live, by the head, at the shed. The resellers come with their cages, they heft them, they
    don't weigh them. Two thousand five a head normally, two thousand three when there's a lot of
    chicken about, and at the end-of-year holidays three thousand, three thousand two. At forty-five
    days they make a kilo two, a kilo three, the best ones a kilo and a half but that's rare. There are
    always about twenty that stay small, those I let go at fifteen hundred, eighteen hundred. And if I
    see one starting to drag, I give it at half price before it dies.

    I have a young man from the village who sleeps out there and feeds them in the morning, fifty
    thousand a month and he eats on site. It isn't declared, that's how it is everywhere here. Last
    year I took five hundred thousand from a microfinance over six months to pay for a batch, it cost
    me seventy thousand.

    On taxes, honestly I don't know. I've always been told that livestock isn't like trade, that
    there's a flat-rate arrangement for farmers and that the patente doesn't concern us. I've never
    paid anything to the tax office; there's just a fellow from the town hall who comes round with his
    book, I give him one thousand five hundred a month without knowing what it is. Nobody has ever
    asked me for an invoice. My brother-in-law who sells spare parts pays a patente every year and he
    says I should get myself in order; I don't know which of us is right. What spoils business for me
    is more the frozen quarters that come in from outside.
inputs:

  # ---------- the shed and the site ----------
  shed_length_m:
    value: 12
    unit: m
    prov: STATED
    source: "\"douze mètres sur cinq\" / \"twelve metres by five\""
    date: "2026-07-29"
  shed_width_m:
    value: 5
    unit: m
    prov: STATED
    source: "\"douze mètres sur cinq\""
    date: "2026-07-29"
  shed_area_m2:
    value: 60
    unit: m2
    prov: INFERRED
    derivation: "shed_length_m * shed_width_m"
    source: "shed_length_m, shed_width_m"
    date: "2026-07-29"
  shed_cost_xof:
    value: 1800000
    unit: XOF
    prov: STATED
    source: "\"parpaings, grillage et tôle : un million huit cent mille\" — the all-in build cost of the shed"
    date: "2026-07-29"
  shed_age_years_at_t0:
    value: 3
    unit: years
    prov: STATED
    source: "\"J'ai monté le poulailler il y a trois ans\""
    date: "2026-07-29"
  shed_useful_life_years:
    value: 15
    unit: years
    prov: ELICITED
    source: >-
      He states the build cost and the build date but not how long he expects it to stand. 15 years is
      the working value: masonry walls outlast that comfortably, sheet-metal roofing in a humid
      Ivorian climate typically does not, and 15 is the conventional blended life for a
      breeze-block-and-tôle agricultural building. It is the middle of the plausible span rather than
      the conservative end, because under the régime that actually governs him (a turnover tax) the
      depreciation charge produces NO tax shield and is added straight back in the FCFF build — so
      this input moves EBIT and book value but does not move FCFF by one franc. That is why it is
      ranked low despite being a large number.
    question: "Le poulailler, la tôle et les parpaings — dans combien d'années tu penses devoir refaire la toiture ou reconstruire ?"
    range: {low: 10, high: 20}
    materiality: low
    date: "2026-07-29"
  shed_opening_nbv:
    value: 1440000
    unit: XOF
    prov: INFERRED
    derivation: "shed_cost_xof * (1 - shed_age_years_at_t0 / shed_useful_life_years)"
    source: "shed_cost_xof, shed_age_years_at_t0, shed_useful_life_years — straight-line, three years elapsed"
    date: "2026-07-29"
  rent_per_batch_xof:
    value: 0
    unit: XOF per batch
    prov: STATED
    source: "\"Le terrain c'est celui de mon père, je ne paie pas de loyer\" — an explicit zero, not a silence"
    date: "2026-07-29"

  # ---------- the cycle ----------
  grow_days:
    value: 45
    unit: days
    prov: STATED
    source: "\"Je les garde quarante-cinq jours\""
    date: "2026-07-29"
  grow_days_slow:
    value: 50
    unit: days
    prov: STATED
    source: "\"des fois cinquante quand ils ne prennent pas bien\" — the slow-batch variant, carried for the availability finding, not used in the base cycle"
    date: "2026-07-29"
  void_days:
    value: 14
    unit: days
    prov: STATED
    source: "\"il faut tout désinfecter et laisser le bâtiment vide deux semaines\""
    date: "2026-07-29"
  cycle_days:
    value: 59
    unit: days
    prov: INFERRED
    derivation: "grow_days + void_days"
    source: "grow_days, void_days"
    date: "2026-07-29"
  days_per_year:
    value: 365
    unit: days
    prov: DEFAULTED
    source: "Calendar year, non-leap. Convention."
    date: "2026-07-29"
  days_per_week:
    value: 7
    unit: days
    prov: DEFAULTED
    source: "Calendar convention."
    date: "2026-07-29"
  batches_per_year:
    value: 6
    unit: batches per year
    prov: STATED
    source: "\"Ça fait six bandes dans l'année quand tout va bien\""
    date: "2026-07-29"
  batches_per_year_physical_max:
    value: 6.186440677966102
    unit: batches per year
    prov: INFERRED
    derivation: "days_per_year / cycle_days"
    source: "days_per_year, cycle_days — the ceiling the 59-day cycle imposes; his six fits, a seventh cannot"
    date: "2026-07-29"
  batches_last_year_actual:
    value: 5
    unit: batches per year
    prov: STATED
    source: "\"l'année dernière je n'en ai fait que cinq\" — his realised count, i.e. 83% availability against his own normal. Carried as the availability finding; the base case runs on 6, which is what he calls normal."
    date: "2026-07-29"
  months_per_batch:
    value: 2
    unit: months per batch
    prov: INFERRED
    derivation: "12 / batches_per_year"
    source: >-
      batches_per_year. The monthly costs (the boy, the pump, the mairie levy) are paid twelve times a
      year whatever the shed is doing, so the full twelve months must be allocated across the six
      batches — two months each — and not 59/30.44 = 1.94 months, which would leave the eleven idle
      days of the year unfunded. Charging these only over the 45 grow-days would understate them by
      about a quarter.
    date: "2026-07-29"
  presale_share_of_cycle:
    value: 0.7627118644067796
    unit: fraction
    prov: INFERRED
    derivation: "grow_days / cycle_days"
    source: "grow_days, cycle_days — the fraction of the cycle that precedes the sale, used only for the intra-cycle cash peak"
    date: "2026-07-29"

  # ---------- the flock: placement, mortality, closure ----------
  chicks_placed_per_batch:
    value: 500
    unit: chicks per batch
    prov: STATED
    source: "\"J'achète cinq cents poussins d'un jour au couvoir\""
    date: "2026-07-29"
  attempted_flock_size:
    value: 700
    unit: chicks per batch
    prov: STATED
    source: "\"J'ai essayé sept cents une fois, sous les lampes c'était trop serré ; je suis revenu à cinq cents\" — his own failed density experiment, used as a world-test on the stocking benchmark"
    date: "2026-07-29"
  chick_price_xof:
    value: 600
    unit: XOF per chick
    prov: STATED
    source: "\"six cents francs le poussin\""
    date: "2026-07-29"
  chick_price_prior_year_xof:
    value: 550
    unit: XOF per chick
    prov: STATED
    source: "\"l'année dernière c'était cinq cent cinquante, ça monte tout le temps\""
    date: "2026-07-29"
  chick_price_inflation_observed:
    value: 0.09090909090909091
    unit: fraction per year
    prov: INFERRED
    derivation: "chick_price_xof / chick_price_prior_year_xof - 1"
    source: "chick_price_xof, chick_price_prior_year_xof — the one price trend he actually quantifies. Recorded, not projected: see grid.why for why the horizon stops before extrapolation starts."
    date: "2026-07-29"
  brooding_days:
    value: 14
    unit: days
    prov: STATED
    source: "\"le gaz pour chauffer les poussins les deux premières semaines\" and \"Passé les deux premières semaines ça se calme\""
    date: "2026-07-29"
  brooding_deaths_per_day_low:
    value: 3
    unit: deaths per day
    prov: STATED
    source: "\"tu en ramasses trois, quatre, des fois cinq sous la lampe\""
    date: "2026-07-29"
  brooding_deaths_per_day_high:
    value: 5
    unit: deaths per day
    prov: STATED
    source: "\"trois, quatre, des fois cinq\""
    date: "2026-07-29"
  brooding_deaths_per_day_mid:
    value: 4
    unit: deaths per day
    prov: INFERRED
    derivation: "(brooding_deaths_per_day_low + brooding_deaths_per_day_high) / 2"
    source: "brooding_deaths_per_day_low, brooding_deaths_per_day_high — and it is also the value he names first in the run, 'quatre'"
    date: "2026-07-29"
  post_brooding_deaths_per_week_low:
    value: 1
    unit: deaths per week
    prov: STATED
    source: "\"après c'est un ou deux par semaine jusqu'à la fin\""
    date: "2026-07-29"
  post_brooding_deaths_per_week_high:
    value: 2
    unit: deaths per week
    prov: STATED
    source: "\"un ou deux par semaine\""
    date: "2026-07-29"
  post_brooding_deaths_per_week_mid:
    value: 1.5
    unit: deaths per week
    prov: INFERRED
    derivation: "(post_brooding_deaths_per_week_low + post_brooding_deaths_per_week_high) / 2"
    source: "post_brooding_deaths_per_week_low, post_brooding_deaths_per_week_high"
    date: "2026-07-29"
  mortality_implied_by_daily_account:
    value: 62.642857142857146
    unit: deaths per batch
    prov: INFERRED
    derivation: "brooding_deaths_per_day_mid * brooding_days + post_brooding_deaths_per_week_mid * (grow_days - brooding_days) / days_per_week"
    source: >-
      brooding_deaths_per_day_mid, brooding_days, post_brooding_deaths_per_week_mid, grow_days,
      days_per_week. THIS IS THE CENTRAL FINDING OF THE CASE. Rebuilding the founder's mortality from
      the shape he describes day by day gives ~63 deaths a batch, not the ~40 he then reports as his
      headline. His two accounts of the same thing differ by more than half. His day-by-day account
      lands almost exactly on the number he calls a BAD batch ("des fois soixante quand ça va mal"),
      which is what you would expect if the vivid morning picture is what he remembers and the round
      "quarantaine" is what he tells people. Materialised as its own input, with its own arithmetic,
      so a checker sees the gap rather than reading about it.
    date: "2026-07-29"
  mortality_headline_per_batch:
    value: 40
    unit: deaths per batch
    prov: STATED
    source: "\"En tout j'en perds une quarantaine par bande\" and \"j'en enterre une quarantaine\""
    date: "2026-07-29"
  mortality_bad_batch:
    value: 60
    unit: deaths per batch
    prov: STATED
    source: "\"des fois soixante quand ça va mal\""
    date: "2026-07-29"
  mortality_per_batch:
    value: 40
    unit: deaths per batch
    prov: ELICITED
    source: >-
      The base case runs on his headline 40, because that is the figure he asserts AND it is the one
      that closes his own count out loud — 500 placed, "une quarantaine" buried, "quatre cent cinquante
      et quelques" left to sell, five or six kept for the house: 500 - 40 - 6 = 454, which is exactly
      "450-odd". So 40 is internally coherent with everything else he says EXCEPT his own day-by-day
      description, which implies ~63 (see mortality_implied_by_daily_account). Only he can settle it,
      because only he has counted the pit. This is the single highest-value question in the interview:
      it moves 23 birds a batch, and every bird is a head price.
    question: "Sur ta dernière bande, tu as compté combien de poulets morts en tout, du premier jour jusqu'à la vente — pas à peu près, le chiffre que tu as ramassé ?"
    range: {low: 40, high: 63}
    materiality: high
    date: "2026-07-29"
  birds_kept_home_per_batch:
    value: 6
    unit: birds per batch
    prov: STATED
    source: "\"J'en garde cinq ou six pour la maison\" — taken at the upper end (6), the conservative reading for revenue since a bird kept is a bird not sold. These are owner's drawings in kind, not a sale: no revenue is recognised for them, but they eat feed and that feed stays in cost."
    date: "2026-07-29"
  birds_finished_per_batch:
    value: 460
    unit: birds per batch
    prov: INFERRED
    derivation: "chicks_placed_per_batch - mortality_per_batch"
    source: "chicks_placed_per_batch, mortality_per_batch — the birds alive at day 45, before the six kept back"
    date: "2026-07-29"
  birds_sold_per_batch:
    value: 454
    unit: birds per batch
    prov: INFERRED
    derivation: "chicks_placed_per_batch - mortality_per_batch - birds_kept_home_per_batch"
    source: "chicks_placed_per_batch, mortality_per_batch, birds_kept_home_per_batch — reproduces his own \"quatre cent cinquante et quelques\""
    date: "2026-07-29"
  runts_per_batch:
    value: 20
    unit: birds per batch
    prov: STATED
    source: "\"Il y en a toujours une vingtaine qui restent petits\""
    date: "2026-07-29"
  culls_per_batch:
    value: 0
    unit: birds per batch
    prov: ELICITED
    source: >-
      "si j'en vois un qui commence à traîner, je le donne à moitié prix avant qu'il crève" — he
      describes the practice and gives no count. Base case is ZERO, the omitting choice, chosen for two
      reasons: he supplies no number at all, and the birds he salvages plausibly overlap the twenty
      runts he has already priced down, so a positive figure risks double-counting a discount he has
      already given me. Zero is therefore the UPPER bound on revenue, and any answer above zero moves
      revenue DOWN, at 1,250 XOF a head foregone.
    question: "Sur une bande, tu en donnes combien à moitié prix parce qu'ils commencent à traîner — et est-ce que ce sont les mêmes que la vingtaine qui restent petits, ou en plus ?"
    range: {low: 0, high: 20}
    materiality: medium
    date: "2026-07-29"
  birds_normal_grade_per_batch:
    value: 434
    unit: birds per batch
    prov: INFERRED
    derivation: "birds_sold_per_batch - runts_per_batch - culls_per_batch"
    source: "birds_sold_per_batch, runts_per_batch, culls_per_batch — the full-price cohort"
    date: "2026-07-29"
  live_weight_low_kg:
    value: 1.2
    unit: kg per bird
    prov: STATED
    source: "\"À quarante-cinq jours ils font un kilo deux, un kilo trois\""
    date: "2026-07-29"
  live_weight_high_kg:
    value: 1.3
    unit: kg per bird
    prov: STATED
    source: "\"un kilo deux, un kilo trois\""
    date: "2026-07-29"
  live_weight_best_kg:
    value: 1.5
    unit: kg per bird
    prov: STATED
    source: "\"les meilleurs un kilo et demi mais c'est rare\" — explicitly rare, so not used in the flock mean"
    date: "2026-07-29"
  live_weight_kg:
    value: 1.25
    unit: kg per bird
    prov: INFERRED
    derivation: "(live_weight_low_kg + live_weight_high_kg) / 2"

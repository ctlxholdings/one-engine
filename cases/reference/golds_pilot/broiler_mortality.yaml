    source: >-
      The impôt minimum forfaitaire is 0.5% of turnover TTC with a 3,000,000 floor and a 35,000,000
      cap — a floor which, on a turnover of ~7.0m, would swamp everything this business earns. It does
      NOT apply: the IMF reaches taxpayers under the régime réel normal and the régime simplifié only,
      and he is under neither. This is the single most dangerous negative in the file, because the
      floor is larger than his annual FCFF and a model that applied it would produce a business that
      cannot exist.
    authority: "fact_ids CI-TAX-02, CI-TAX-03, CI-V25-17, CI-V25-18. DGI — IMF applies to RNI and RSI only; max(BIC, IMF) with floor/cap nested inside the IMF computation, substitution en lieu et place"

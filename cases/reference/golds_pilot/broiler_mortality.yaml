checks:
  # ---- conservation: the flock ----
  - "trace.chicks_placed == trace.birds_died + trace.birds_home + trace.birds_sold + trace.flock_closing"
  - "trace.flock_closing[t] == trace.flock_closing[t-1] + trace.chicks_placed[t] - trace.birds_died[t] - trace.birds_home[t] - trace.birds_sold[t]"
  - "max(trace.flock_closing) == 0"
  - "trace.birds_sold == trace.birds_normal + trace.birds_runt + trace.birds_cull"

  # ---- conservation: the feed transformation (rule a) ----
  - "trace.feed_kg_purchased == trace.feed_kg_spilled + trace.feed_kg_eaten_by_dead + trace.feed_kg_eaten_by_finished"
  - "trace.feed_kg_purchased == sacks_total * sack_weight_kg"
  - "trace.feed_kg_spilled == trace.feed_kg_purchased * feed_spill_rate"
  - "trace.feed_kg_eaten_by_dead == trace.birds_died * avg_intake_per_dead_bird_kg"
  - "feed_to_home_birds_kg + feed_to_sold_birds_kg == feed_eaten_by_finished_birds_kg"
  - "implied_gross_fcr * live_weight_total_kg_per_batch == feed_kg_per_batch"
  - "biological_fcr * live_weight_total_kg_per_batch == feed_eaten_by_finished_birds_kg"
  - "implied_gross_fcr >= biological_fcr"

  # ---- conservation: working capital and the asset base (rule b) ----
  - "cumsum(trace.delta_nwc) == trace.nwc"
  - "trace.nwc[t] == 0"
  - "trace.shed_book_value == shed_opening_nbv - cumsum(trace.depreciation)"
  - "shed_opening_nbv == shed_cost_xof * (1 - shed_age_years_at_t0 / shed_useful_life_years)"

  # ---- conservation: revenue and cost aggregates ----
  - "trace.revenue == trace.revenue_normal + trace.revenue_runt + trace.revenue_cull"
  - "trace.opex == trace.cost_chicks + trace.cost_feed + trace.cost_gas + trace.cost_litter + trace.cost_vet + trace.cost_electricity + trace.cost_labour + trace.cost_commune_levy + trace.cost_disinfectant + trace.cost_worker_food"

  # ---- definition: the ladder ----
  - "trace.ebitda == trace.revenue - trace.opex"
  - "trace.ebit == trace.ebitda - trace.depreciation"
  - "trace.nopat == trace.ebit - trace.tax_statutory"
  - "trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.tax_gap == trace.tax_statutory - trace.tax_as_currently_paid"
  - "trace.fcff_as_currently_paid == trace.fcff + trace.tax_gap"

  # ---- driver-bridge: volumes ----
  - "trace.chicks_placed == chicks_placed_per_batch"
  - "trace.birds_died == mortality_per_batch"
  - "trace.birds_home == birds_kept_home_per_batch"
  - "trace.birds_runt == runts_per_batch"
  - "trace.birds_cull == culls_per_batch"
  - "birds_sold_per_batch == chicks_placed_per_batch - mortality_per_batch - birds_kept_home_per_batch"
  - "birds_finished_per_batch == chicks_placed_per_batch - mortality_per_batch"

  # ---- driver-bridge: prices and revenue ----
  - "trace.price_head == price_head_normal + trace.festive_flag * (price_head_festive - price_head_normal) + trace.glut_flag * (price_head_glut - price_head_normal)"
  - "sum(trace.festive_flag) == festive_batches_per_year"
  - "sum(trace.glut_flag) == glut_batches_per_year"
  - "trace.revenue_normal == trace.price_head * trace.birds_normal"
  - "trace.revenue_runt == runt_price * trace.birds_runt"
  - "trace.revenue_cull == price_head_normal * cull_price_fraction * trace.birds_cull"

  # ---- driver-bridge: costs ----
  - "trace.cost_chicks == chick_price_xof * trace.chicks_placed"
  - "trace.cost_feed == (sacks_starter * price_starter_sack + sacks_grower * price_grower_sack + sacks_finisher * price_finisher_sack) * (1 + feed_price_uplift)"
  - "trace.cost_gas == gas_bottles_per_batch * gas_bottle_price"
  - "trace.cost_litter == litter_trips_per_batch * litter_trip_price"
  - "trace.cost_vet == vet_cost_per_batch"
  - "trace.cost_electricity == electricity_per_month * months_per_batch"
  - "trace.cost_labour == labour_monthly * months_per_batch"
  - "trace.cost_commune_levy == commune_levy_monthly * months_per_batch"
  - "trace.cost_disinfectant == disinfectant_cost_per_batch"
  - "trace.cost_worker_food == worker_food_cost_per_month * months_per_batch"
  - "trace.capex == equipment_capex_per_batch"
  - "trace.depreciation == shed_cost_xof / shed_useful_life_years / batches_per_year"
  - "months_per_batch == 12 / batches_per_year"

  # ---- driver-bridge: tax, and the belief-versus-law gap ----
  - "trace.tax_statutory == tee_rate_applied * trace.revenue"
  - "sum(trace.tax_statutory) == tee_rate_applied * sum(trace.revenue)"
  - "trace.tax_as_currently_paid == tax_actually_paid_to_dgi_annual"
  - "sum(trace.tax_gap) > commune_levy_annual"
  - "trace.payroll_cnps_employer_if_declared == trace.cost_labour * cnps_employer_rate_total"
  - "cnps_employer_rate_total == cnps_pension_employer_rate + cnps_family_employer_rate + cnps_maternity_employer_rate + cnps_at_mp_employer_rate"
  - "labour_monthly < smig_monthly"
  - "labour_monthly < cnps_capped_base_monthly"

  # ---- régime band test, run on the model's own turnover, not asserted ----
  - "sum(trace.revenue) > tce_band_high"
  - "sum(trace.revenue) >= tee_band_low"
  - "sum(trace.revenue) <= tee_band_high"
  - "tee_rate_applied > tee_rate_commerce_negoce"
  - "imf_rate_applicable_to_this_taxpayer == 0"
  - "investment_code_relief_rate == 0"
  - "patente_applicable_to_this_taxpayer == 0"

  # ---- physical closure: rates fit the plant (rule c) ----
  - "cycle_days == grow_days + void_days"
  - "batches_per_year * cycle_days <= days_per_year"
  - "(batches_per_year + 1) * cycle_days > days_per_year"
  - "batches_per_year <= batches_per_year_physical_max"
  - "batches_last_year_actual < batches_per_year"
  - "shed_area_m2 == shed_length_m * shed_width_m"
  - "stocking_area_per_bird_m2 == shed_area_m2 / chicks_placed_per_batch"
  - "stocking_area_per_bird_m2 >= min_area_per_bird_m2"
  - "stocking_area_per_bird_at_attempted_flock_m2 < min_area_per_bird_m2"
  - "live_weight_loading_kg_per_m2 <= max_live_weight_kg_per_m2"

  # ---- physical closure: cumulative quantities against the world (rule d) ----
  - "sum(trace.chicks_placed) == chicks_placed_per_batch * grid.periods"
  - "sum(trace.feed_kg_purchased) == feed_kg_per_batch * grid.periods"
  - "grid.periods == batches_per_year"
  - "shed_useful_life_years * batches_per_year - shed_age_years_at_t0 * batches_per_year >= grid.periods"
  - "trace.peak_cycle_cash_outlay == trace.cost_chicks + trace.cost_feed - feed_credit_value + trace.cost_gas + trace.cost_litter + trace.cost_vet + (trace.cost_electricity + trace.cost_labour + trace.cost_commune_levy) * presale_share_of_cycle"
  - "trace.peak_cycle_cash_outlay[t] >= loan_principal"
  - "presale_share_of_cycle == grow_days / cycle_days"

  # ---- the mortality finding, asserted rather than narrated ----
  - "mortality_implied_by_daily_account == brooding_deaths_per_day_mid * brooding_days + post_brooding_deaths_per_week_mid * (grow_days - brooding_days) / days_per_week"
  - "mortality_implied_by_daily_account > mortality_per_batch"
  - "mortality_implied_by_daily_account > mortality_headline_per_batch"
  - "mortality_per_batch < mortality_bad_batch"

  # ---- non-negativity ----
  - "trace.birds_sold[t] >= 0"
  - "trace.birds_normal[t] >= 0"
  - "trace.flock_closing[t] >= 0"
  - "trace.shed_book_value[t] >= 0"
  - "trace.feed_kg_eaten_by_finished[t] >= 0"
  - "trace.opex[t] >= 0"
  - "trace.tax_statutory[t] >= 0"
  - "trace.capex[t] >= 0"
notes:

  findings:
    - >-
      THE MORTALITY DOES NOT RECONCILE WITH ITSELF, AND THAT IS THE CASE. The founder gives two
      accounts of the same flock. The headline — "une quarantaine" — closes perfectly with everything
      else he says out loud, including the "quatre cent cinquante et quelques" left to sell. The
      day-by-day account — three to five a morning under the lamp for the first fortnight, then one or
      two a week — rebuilds to a figure that sits almost exactly on what he calls a BAD batch. Both are
      materialised as inputs with their own arithmetic (mortality_headline_per_batch,
      mortality_implied_by_daily_account) and the gap is asserted in `checks`, so a reader does not
      have to take my word for it. Direction: the day-by-day reading reduces birds sold, revenue and
      FCFF. I did not average the two, because averaging an assertion with a reconstruction produces a
      number neither the founder nor the arithmetic supports.
    - >-
      THE FEED DEALER'S CONVERSION RATIO FLATTERS HIS OWN PRODUCT. "Avec deux kilos et demi d'aliment
      tu fais un kilo de poulet" is a claim by the man selling the feed, and the founder says outright
      he has never checked it. The founder's own quantities imply a purchased-feed ratio above the
      dealer's figure, and the ratio is net of nothing: it silently swallows the spillage, the feed
      eaten by birds that died, and everything the live birds turned into manure, moisture and heat.
      Decomposing it (implied_gross_fcr versus biological_fcr) is what lets him tell a feed problem
      from a feeder problem, which the dealer's single number structurally cannot.
    - >-
      HE IS RIGHT ABOUT THE PATENTE AND WRONG ABOUT THE FORFAIT, AND SO IS HIS BROTHER-IN-LAW. The
      permanent patente exemption for éleveurs selling only their own produce genuinely reaches him; it
      does not reach a man who resells spare parts he did not make. But there is no forfait agricole in
      Côte d'Ivoire — bénéfices agricoles is merged with BIC under the same bands and the same rate,
      and aviculture sits inside it. The argument between the two of them has no winner because they
      are describing two different businesses.
    - >-
      THE REGIME THAT ACTUALLY GOVERNS HIM IS THE TAXE D'ÉTAT DE L'ENTREPRENANT, AND HE IS PAYING
      ALMOST NONE OF IT. The band test is run in `checks` on the model's own turnover rather than
      asserted. The statutory charge and the as-practised charge are carried as separate trace columns
      (tax_statutory, tax_as_currently_paid) with the difference materialised as tax_gap, so the two
      objects — what the rule says, and what he does — never merge into one number. The base case runs
      on the law.
    - >-
      THREE RELIEFS THAT LOOK AVAILABLE AND ARE NOT, EACH OF WHICH WOULD HAVE PRODUCED A CONFIDENTLY
      WRONG ANSWER. (i) The Investment Code Zone B category-1 holiday: "sur la route de Bouaké" is a
      road, not an address, Azaguié is not a Zone B chef-lieu, and even if it were, a 1,800,000 shed is
      a small fraction of the SME agrément threshold, and the agricultural incentive articles enumerate
      plantation crops in which poultry appears nowhere. (ii) The processing agrément: he sells live at
      the gate, there is no transformation. (iii) A micro-BA abattement by analogy with French practice:
      it does not exist here. All three are recorded as SOURCED zeros rather than as silences.
    - >-
      THE IMPÔT MINIMUM FORFAITAIRE IS THE MOST DANGEROUS ITEM IN THE FILE AND IT DOES NOT APPLY. Its
      floor is larger than everything this operation generates in a year. It reaches the réel normal and
      réel simplifié régimes only, and he is under neither. A model that applied it would tie perfectly
      around a business that cannot exist — which is exactly the failure mode a sourced negative is for.
    - >-
      SIX BATCHES IS THE GOOD YEAR, NOT THE AVERAGE YEAR. He managed five last year and explains why in
      the same breath: fifty-day grow-outs when the birds are not coming on. The base case runs the
      plant at his own stated best, which is a choice made visible rather than absorbed —
      batches_last_year_actual is carried as an input and asserted against batches_per_year in `checks`.
      Direction: fewer batches reduce annual revenue and annual FCFF roughly proportionally, and would
      also change which batch catches the festive price.
    - >-
      THE PERIOD GRID SHOWS ZERO WORKING CAPITAL AND THAT IS TRUE BUT MISLEADING. Every stock is zero
      at every boundary by construction, because the boundary sits inside the empty fortnight and the
      dealer is paid on the sale day. The real financing need is intra-cycle and large; it is
      materialised as trace.peak_cycle_cash_outlay rather than described, and it is checked against the
      microfinance loan he actually took, which does not cover it. Anyone reading ΔNWC = 0 as "this
      business needs no funding" would be reading the grid, not the operation.
    - >-
      UNDER A TURNOVER TAX, DEPRECIATION HAS NO TAX SHIELD. It is deducted to reach EBIT and added
      straight back to reach FCFF, and the tax line never sees it. So the shed's useful life — a large,
      uncertain, superficially important assumption — moves EBIT and book value and moves free cash flow
      not at all. That is why it is ranked LOW among the questions despite being the biggest single
      number in the asset base, and it is worth saying because the instinct is to rank it high.
    - >-
      THIS IS A FEED BUSINESS WITH A SHED ATTACHED. Chicks and feed are the overwhelming majority of
      cash cost; the building is a small per-bird charge. The consequence for the interview is that the
      two highest-ranked questions (the mortality count and whether the quoted feed prices are pre- or
      post-increase) are both about the flock and the feed, not about the asset.
    - >-
      THE THREAT HE NAMES IS NOT IN THE MODEL. "Ce qui me gâte les affaires, c'est plutôt les cuisses
      congelées qui viennent de dehors." Imported frozen chicken parts compete on price with his live
      birds and are the mechanism behind the glut price he quotes. The model carries the glut price and
      asks how often it bites (glut_batches_per_year); it does not model the import trend, because
      nothing in the utterance or the fact base gives a trajectory for it.

  simplifications_and_judgment_calls:
    - >-
      GRID. Period = one bande = 59 days; horizon = six batches = one production year. Fully argued in
      grid.why, including what it deliberately excludes.
    - >-
      THE SACK SPLIT IS DETERMINED, NOT CHOSEN. Of the combinations his three ranges permit, only
      5 + 8 + 17 sums to the round "trentaine" he states. It is also the dearer reading.
    - >-
      MONTHLY COSTS ARE ALLOCATED AT TWELVE MONTHS ACROSS SIX BATCHES, i.e. two months a batch, not
      the 1.94 months the 59-day cycle would give. The boy is paid and the pump is powered through the
      eleven idle days of the calendar as well; the alternative would leave those days unfunded.
    - >-
      BIRDS KEPT FOR THE HOUSE EARN NO REVENUE BUT CARRY THEIR FEED. They are owner's drawings in kind
      and never meet a buyer. The asymmetry is deliberate and is visible in the feed balance
      (feed_to_home_birds_kg). Taken at six rather than five, the conservative end of his range.
    - >-
      MIDPOINTS WHERE HE GIVES A RANGE, WITH THE ARITHMETIC EXPOSED. Festive price, runt price, live
      weight, brooding deaths per day and post-brooding deaths per week are each declared as the two
      stated endpoints plus an INFERRED midpoint with a derivation, so nothing is a bare choice.
    - >-
      THE RUNT PRICE IS HELD FLAT ACROSS THE FESTIVE BATCH. He quotes it without seasonal variation,
      and a small bird is what a festive buyer least wants. Direction if wrong: festive revenue is
      understated slightly.
    - >-
      THE COMMUNE LEVY IS TREATED AS A NON-INCOME LOCAL LEVY IN OPEX, not as a profits tax. He cannot
      identify it and neither can I from the fact base; what is certain is that it is cash out and that
      it is not a payment to the DGI.
    - >-
      TEE AT THE 5% "OTHER ACTIVITIES" BRANCH RATHER THAN 4% COMMERCE. He produces rather than resells.
      This is a characterisation call, it is the one to attack if the tax line looks wrong, and it is
      read consistently with the patente exemption, which turns on the same distinction.
    - >-
      "NOPAT = EBIT − TEE" IS AN ABUSE OF LANGUAGE AND IS FLAGGED AS ONE. The TEE is levied on turnover,
      not on profit. The FCFF build is unaffected — the charge is a real cash tax and belongs above free
      cash flow — but the effective rate on profit is not 5%, and no deduction in this model generates a
      tax shield. The sector's natural description has been kept and the friction named rather than
      forced into a profits-tax shape.
    - >-
      THE UNDECLARED WAGE IS CHARGED AT WHAT HE ACTUALLY PAYS. The base case books the cash wage,
      because that is the cash the business gives up. The statutory CNPS employer charge is materialised
      as its own trace column rather than argued in prose, and it is a FLOOR: the further employer
      levies (ITS withholding, TAP, TFPC) are excluded because the fact base is internally inconsistent
      on their rates and I will not tie arithmetic around a rate I cannot reconcile. Whether the SMIG or
      an agricultural minimum governs a poultry farmhand, and whether board counts towards it, I have
      not resolved and do not assert.
    - >-
      FREE LAND IS AN EXPLICIT ZERO, NOT AN OMISSION, and it is an economic subsidy from his father.
      Direction: a tenant operator on the same shed would earn less asset-side cash than this model
      shows, by whatever the ground rent would be.
    - >-
      FINANCING IS EXCLUDED BY DEFINITION. The microfinance loan and its cost are recorded as inputs
      because they price his liquidity and provide the world-check on the intra-cycle cash trough, but
      no interest is charged anywhere in an unlevered build.
    - >-
      THE 700-BIRD FAILURE IS READ AS A WHOLE-SHED DENSITY BREACH. The alternative reading is that
      "sous les lampes c'était trop serré" refers to the brooder ring rather than the floor as a whole,

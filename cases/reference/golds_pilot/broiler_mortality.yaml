    source: >-
      HIS BELIEF, verbatim: "On m'a toujours dit que l'élevage ce n'est pas comme le commerce, qu'il y
      a un forfait pour les agriculteurs et que la patente ne nous concerne pas." He is HALF right, and
      the two halves have to be separated because they are different objects. On the forfait he is
      WRONG: bénéfices agricoles is not a separate régime in Côte d'Ivoire, it is merged with BIC in a
      single chapter under the same four régime bands and the same rate, aviculture sits inside it, and
      there is no micro-BA forfaitaire abattement — the French analogue does not carry over. So this
      records the world-fact (0 = no such forfait), while the belief itself is preserved in `utterance`
      and in `notes`. On the patente he is RIGHT: see patente_applicable_to_this_taxpayer.
    authority: "fact_id CI-BA-01. DGI, Impôts et taxes en Côte d'Ivoire §1.1; DGI, Le système fiscal ivoirien §b — CGI Livre I, Titre I, Chapitre I, \"Impôts sur les bénéfices industriels et commerciaux et les bénéfices agricoles\", arts. 1-84"
    verified: "2026-07-29"
  patente_applicable_to_this_taxpayer:
    value: 0
    unit: boolean (1 = the patente is due)
    prov: SOURCED
    source: >-
      Zero, on two independent grounds, and he was right for a reason he could not have named. FIRST,
      under ORDINARY law there is a PERMANENT patente exemption for "les agriculteurs et les éleveurs
      qui ne vendent que les récoltes et produits d'élevage provenant de leurs exploitations et qui
      réalisent un chiffre d'affaires annuel inférieur à celui fixé pour relever du régime réel
      normal". He meets both limbs: he sells only birds he raised himself — he buys day-old chicks as
      an input, not finished chickens for resale — and his turnover is ~7.0m against an RNI threshold
      of 500m. SECOND, at his turnover the entreprenant tax substitutes for the patente anyway, so the
      exemption is subsumed. His brother-in-law who "paie une patente chaque année" sells spare parts:
      that is négoce, he resells goods he did not produce, and the exemption does not reach him. They
      are BOTH right about their own businesses, which is why the argument between them has no answer.
    authority: "fact_id CI-BA-02. DGI, Le système fiscal ivoirien §C-1-c, under \"Exonérations permanentes\"; home article CGI art. 280 (item added by annexe fiscale 2020, art. 2). Substitution limb: fact_id CI-TAX-06, CGI art. 73"
    verified: "2026-07-29"

  tee_rate_applied:
    value: 0.05
    unit: fraction of annual turnover TTC
    prov: SOURCED
    source: >-
      The 5% branch — "autres activités" / prestations, i.e. everything that is not commerce or
      négoce. This is a characterisation call and it is the one to attack if you disagree with the tax
      line: he does not buy chickens and resell them, he buys day-old chicks and feed and PRODUCES
      chickens, so the activity is production/élevage and not négoce. Same reasoning as the patente
      exemption above, which is drafted around exactly this distinction ("qui ne vendent que les
      produits d'élevage provenant de leurs exploitations"), so the two provisions are read
      consistently. The TEE is libératoire and expressly substitutes for the profits tax, the patente

    unit: kg feed per kg live weight
    prov: STATED
    source: >-
      "Il répète qu'avec deux kilos et demi d'aliment tu fais un kilo de poulet ; moi je n'ai jamais
      vérifié." This is a BELIEF held by an interested party — the man who sells him the feed — and

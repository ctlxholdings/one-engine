  feed_spill_rate:
    value: 0.06
    unit: fraction of feed purchased
    prov: ELICITED
    source: >-
      "Il y a du gâchis aussi, ils grattent dans les mangeoires et ça tombe par terre" — he confirms
      the loss and gives no size. He CAN answer a proxy question (what he sweeps up at clean-out), so
      it is elicited rather than assumed. Working value 0.06, the middle of the 5-10% band commonly
      cited for pan and tube feeders that are being managed, against a published ceiling of 20% for
      badly set-up systems (feed_spill_rate_benchmark_max). Ranked LOW deliberately and the reason is
      worth stating plainly: because the sack count is a stated quantity rather than one I derived
      from a target weight, spillage does NOT change what he spends — it changes what the feed buys.
      It moves the whole feed balance and the implied biological conversion, and therefore the
      diagnosis, but it does not move FCFF.
    question: "Quand tu nettoies le bâtiment à la fin d'une bande, tu ramasses combien d'aliment par terre — une bassine, un demi-sac, un sac plein ?"
    range: {low: 0.03, high: 0.15}
    materiality: low
    date: "2026-07-29"
  feed_spill_rate_benchmark_max:
    value: 0.20
    unit: fraction of feed purchased
    prov: SOURCED
    source: "Published poultry-extension guidance on feeder management: poorly designed or unmanaged feeding systems lose up to 20% of feed offered; the loss is reduced by feeder height adjustment, anti-swing fixing and a waste lip. Used to bound feed_spill_rate, not to set it."
    authority: "Canadian Poultry Magazine, \"Costs And Impacts Of Feed Wastage\" and \"Minimizing Feed Wastage\" — https://www.canadianpoultrymag.com/costs-and-impacts-of-feed-wastage/"
    verified: "2026-07-29"
  avg_intake_per_dead_bird_kg:
    value: 0.25
    unit: kg per dead bird
    prov: ASSUMED
    source: >-
      The feed a bird ate before it died. Tagged ASSUMED and not ELICITED because no question to this
      founder could recover it — he buries the birds, he does not weigh what they ate. The prior: on
      his own account the deaths are concentrated in the brooding fortnight, when a chick's cumulative
      intake is a fraction of a kilo, with a thin tail dying later having eaten more; against a
      whole-cycle intake of 1,500/460 = 3.26 kg per finished bird, a weighted average of 0.25 kg per
      dead bird is a central figure. It carries 10 kg of a 1,500 kg balance, i.e. 0.7%, so the balance
      is insensitive to it — but rule (a) requires the term to exist and be named rather than be
      swallowed into a yield ratio.
    date: "2026-07-29"

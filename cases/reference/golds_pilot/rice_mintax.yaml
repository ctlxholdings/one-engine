notes:
  - >-
    HEADLINE FINDING, REVISED 2026-08-04 (physics audit F-249, F-253). The MINIMUM tax
    (IMF) wins the higher-of test in every period once handling shrinkage is costed at a
    benchmark-ordinary rate — the opposite of what this file showed when handling loss
    was left at zero. The imf_headroom row, materialised in the trace so it can be
    checked rather than asserted, is now NEGATIVE: EBIT falls 6,699,085.714285714 XOF
    short of the indifference point, 68% below the level at which the normal tax would
    ever bind again at this cost structure. Before shrinkage was costed, the file showed
    the normal tax winning by only 493,714.286 XOF of EBIT — 10.29 XOF/bag, 0.06% of
    COGS — and that margin is fifteen times smaller than the 0.9% shrinkage rate used
    here (§5A, SEC-V26-22 benchmark). The founder's instinct that the minimum «pèse» is
    not just correct, it undersells his position: on any physically ordinary handling-
    loss rate he is not living in the minimum's shadow, he is living inside it, and his
    tax bill is frozen to turnover regardless of how profit moves.
  - >-
    LEGAL FORM UNRESOLVED. The 25% BIC rate is ASSUMED for a taxpayer au réel. Whether he
    is a personne morale or an entreprise individuelle affects both the rate that applies
    and whether his own remuneration is deductible at all. This is the single input with
    the largest unverified leverage on NOPAT, and it is a one-question fix.
  - >-
    OVERHEADS THE FOUNDER DID NOT MENTION. A declared Adjamé wholesaler would normally
    also bear the contribution des patentes (itself partly turnover-based), electricity,
    security, insurance on the truck and the stock, accountancy fees, and some form of
    remuneration for the owner's own labour. None is stated, so none is invented — but
    all of them push in the same direction: real FCFF is lower than modelled, and,
    because they reduce profit without reducing turnover, they also erode the IMF
    headroom and make the minimum-tax branch more likely to bind.
  - >-
    HANDLING SHRINKAGE NOW COSTED; RETAILER CREDIT LOSS STILL OMITTED (F-249, F-250,
    F-253). This note previously named "shrinkage and credit loss" as omitted without
    sizing either. The 2026-08-03 physics audit (F-249) showed the omission was not a
    minor caveat: a physically ordinary handling-loss rate (bags torn, spilled or stolen
    between the port and the retailer) is, on its own, enough to flip the tax branch and
    more than halve FCFF. Handling damage is now an explicit trace line (shrinkage_loss,
    §5A, shrinkage_rate = 0.9%, SEC-V26-22 benchmark) — it is no longer modelled at zero
    ("zero loss, zero treatment" no longer holds for this risk; it still correctly holds
    for FUMIGATION specifically, which the 15-day turn genuinely justifies leaving at
    zero — the two are distinct risks and only one is excused by the short hold).
    RETAILER CREDIT LOSS remains a separate, still-unquantified risk: no benchmark for an
    appropriate bad-debt rate on short (7-day) retail-market credit was available, so
    nothing is invented here. It would erode the now-negative IMF headroom further and
    is a further downside not in this model.
  - >-
    VAT. Rice is assumed VAT-exempt, so turnover TTC equals turnover HT and the IMF base
    is the stated revenue with no gross-up. If in fact he invoices VAT, the IMF base
    would be larger than modelled and the minimum branch correspondingly closer to
    binding. Flagged as an elicitation.
  - >-
    THE 150 XOF/BAG IS READ AS OWN-FLEET RUNNING COST, not a third-party haulage
    invoice — the rate is far above bare fuel for the trip, and he owns a truck sized to
    exactly this task. Two model consequences follow from that single reading: truck
    depreciation is charged separately without double counting, and no supplier payable
    is raised on the freight. If it turns out he pays an outside carrier, the truck's
    role in the business is unexplained and both treatments would need revisiting.
  - >-
    "SEPT ANS" READING. Taken as total service life from purchase, giving five remaining
    years and setting the horizon. If he meant seven MORE years, the horizon lengthens,
    the annual depreciation charge falls, and the renewal capex moves out of the window —
    all three effects push modelled FCFF up. Worth one confirming question.
  - >-
    WORKING-CAPITAL DAYS ARE THE WEAKEST INPUTS. Inventory, receivable and payable days
    are all ASSUMED priors, with the elicitation questions recorded against each input.
    Their leverage is materialised as receivable_day_value in the trace so it can be read
    off directly rather than described. The steady-state model shows zero delta_NWC only
    because volumes and prices are held flat; the LEVEL of working capital already tied
    up is large relative to annual free cash flow, which matters for anyone assessing how
    much of this business is financed by the balance sheet rather than by earnings.
  - >-
    GOING-CONCERN OPENING BALANCE. Opening NWC is set equal to steady-state NWC, so no
    period is charged with building the stock and receivable book that already exist.
    Treating t=0 as a cold start would be the standard error in a business like this and
    would misstate first-period FCFF badly.
  - >-
    BOOK DEPRECIATION USED AS TAX DEPRECIATION. Ivorian tax amortisation rates for light
    commercial vehicles need not equal the founder's own seven-year economic estimate.
    Any divergence shifts tax between periods without changing the undiscounted total, and
    would also change which periods sit closest to the minimum-tax threshold.
  - >-
    NO DEBT ASSUMED, so the unlevered tax equals the actual tax and FCFF equals total cash
    available to all capital providers. This assumption is load-bearing beyond the usual:
    under a turnover-based minimum, interest deductions stop generating any shield at all
    once the minimum branch binds, so a levered version of this business cannot be valued
    by simply applying a constant tax shield.
  - >-
    ANNUAL GRID NETS OUT SEASONALITY. Imported-rice trade in Abidjan is seasonal in both
    liftings and retail offtake, and the founder's own «à peu près» signals month-to-month
    variability. A monthly grid would show working capital swinging with the lifting cycle;
    the annual grid is nonetheless the correct frequency for the question asked, because
    the higher-of tax test is an annual determination and cannot be evaluated monthly.
  - >-
    HORIZON AND TERMINAL VALUE. Five years is the remaining life of the only durable asset,
    which makes it a complete and self-contained operating cycle. No terminal value is
    computed and none should be read into the sum of the FCFF row. The fcff_normalised
    column is the trace row to use for any sustainable-run-rate reading, since it spreads
    the renewal across the life it buys instead of loading it entirely into the last period.
  - >-
    FRICTION NOTED, NOT FORCED. In-store handling wages sit awkwardly between IAS 2 cost of
    purchase and IAS 2.16(b) storage cost — part of the handlers' day is unloading acquired
    goods, part is warehousing goods held for sale. The whole is expensed. With flat stock
    this changes no profit line and only marginally the inventory carrying amount, but the
    judgment is recorded rather than buried.
  - >-
    TRUCK PAYLOAD IS A TOP-OF-RANGE CHOICE (F-251). truck_payload_bags (100 bags, 5.0t)
    sits at the very top edge of the plausible 3-5t range for a «petit camion» at this
    price point. The "truck is not binding" feasibility verdict (~30% rotation headroom,
    §3) holds at this choice and would not hold at a more central 3.5-4t payload
    (near-zero slack). No monetary line depends on this input — it is feasibility-only —
    but the feasibility CONCLUSION is payload-choice-dependent, which the input's own
    ASSUMED tag does not by itself communicate. Not changed: the founder gives no payload
    figure to adjudicate the choice, and moving the value would substitute one arbitrary
    point in the range for another rather than correct an error.
  - >-
    LIFETIME DUTY CYCLE, NOW STATED (F-252). Not given anywhere in the original file
    though computable: roughly 84,000-84,700 km and 16,800-17,000 t moved over the
    truck's full seven-year stated life (§3) — modest for a light commercial truck at
    this class, and it does not itself adjudicate the "sept ans" ambiguity either way.
    No mid-horizon rebuild-capex line exists for major driveline wear components (clutch,
    gearbox, injector pump, leaf springs) across the roughly 3,360 load/unload cycles
    this implies. The ~30% rotation headroom makes a routine-maintenance framing
    plausible (already folded into the 150 XOF/bag running cost), but a lumpy mid-horizon
    repair is not excluded by anything stated here — not modelled, not ruled out.
  - >-
    HANDLER WAGE CHECKED AGAINST THE SMIG FLOOR (F-254). The prior v25 physics audit of
    this gold family flagged the 80,000 XOF/month handler wage against the Ivorian
    minimum wage; no SEC-V26 benchmark existed to re-verify it as of the 2026-08-03
    audit. Checked here: the SMIG (Décret n°2022-986, in force since January 2023,
    unrevised through mid-2026 per Sikafinance/Africarrières reporting) is 75,000
    XOF/month. The STATED 80,000 XOF/month wage is 6.7% above that floor — compliant.
    This finding does not hold as a defect; no change made to wage_per_handler_per_month.

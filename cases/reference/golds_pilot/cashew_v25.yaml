id: ci-bouake-cashew-fcff-2026
title: >-
  Unité de transformation d'anacarde, Bouaké (Côte d'Ivoire) — unlevered FCFF via NOPAT,
  construction year 2026 plus fifteen production years
currency: XOF
grid:
  periods: 16
  freq: annual
  t0_label: "2026 (construction / réalisation du programme d'investissement)"
  t1_label: "2027 (first production year)"
  t_last_label: "2041"

utterance:
  fr: >-
    Je monte une unité de transformation de noix de cajou à Bouaké. L'usine me coûte cent
    quatre-vingts millions à installer — les machines de décorticage, les séchoirs, le bâtiment —
    et sur ce genre d'équipement on compte quinze ans. Je démarre l'année prochaine. Je traiterai
    deux mille tonnes de noix brutes par an, que j'achète aux coopératives à cinq cents francs le
    kilo. Le rendement, c'est vingt-deux kilos d'amande blanche pour cent kilos de noix brutes — le
    reste, c'est la coque. L'amande, je l'exporte à quatre mille cinq cents francs le kilo. J'aurai
    soixante ouvriers à quatre-vingt mille par mois, et le courant, l'eau, les sacs et l'entretien
    me feront dans les cent vingt millions par an. Ce qui a décidé l'investissement, c'est
    l'agrément : j'ai obtenu l'agrément au code des investissements, et il me donne cinq ans
    d'exonération totale d'impôt sur le bénéfice à compter de la première année de production.
    Après ces cinq ans, je repasse au taux normal comme tout le monde, vingt-cinq pour cent. C'est
    pour ça que je me dépêche de démarrer.
  en: >-
    I am setting up a cashew processing unit in Bouaké. The plant costs me one hundred and eighty
    million to install — the shelling machines, the dryers, the building — and on that kind of
    equipment one reckons fifteen years. I start next year. I will process two thousand tonnes of
    raw nuts a year, which I buy from the cooperatives at five hundred francs a kilo. The yield is
    twenty-two kilos of white kernel per hundred kilos of raw nuts — the rest is shell. The kernel
    I export at four thousand five hundred francs a kilo. I will have sixty workers at eighty
    thousand a month, and power, water, bags and maintenance will run me about one hundred and
    twenty million a year. What decided the investment was the approval: I obtained the investment
    code approval, and it gives me five years of total exemption from profits tax starting from the
    first year of production. After those five years I go back to the normal rate like everyone
    else, twenty-five percent. That is why I am hurrying to start.


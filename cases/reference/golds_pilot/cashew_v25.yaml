checks:
  # ---- grid ----
  - grid.periods == horizon_years

  # ---- conservation: mass balance, with the residual named ----
  - rcn_input[t] == kernel_output[t] + shell_and_loss[t]
  - kernel_output[t] == rcn_input[t] * kernel_yield
  - shell_and_loss[t] >= 0
  - rcn_input[t] == rcn_volume_kg for t >= 1
  - rcn_input[first] == 0

  # ---- conservation: PP&E and accumulated depreciation roll-forwards ----
  - ppe_gross[t] == ppe_gross[t-1] + capex[t] - retirements[t]
  - accum_dep[t] == accum_dep[t-1] + dep_total[t] - retirements[t]
  - ppe_net[t] == ppe_gross[t] - accum_dep[t]
  - ppe_net[t] >= 0
  - accum_dep[t] >= 0
  - accum_dep[t] <= ppe_gross[t]
  - sum(capex) == capex_initial + capex_initial * equip_share
  - sum(retirements) == capex_initial * equip_share

  # ---- conservation: working capital roll ----
  - nwc[t] == inv_rcn_close[t] + inv_fg_close[t] + accounts_receivable[t] + vat_receivable[t] - accounts_payable[t]
  - delta_nwc[t] == nwc[t] - nwc[t-1]
  - sum(delta_nwc) == nwc[last]
  - nwc[t] >= 0
  - inv_rcn_close[t] >= 0

  # ---- driver bridges: revenue and cost ----
  - revenue[t] == kernel_output[t] * kernel_price
  - export_duty[t] == revenue[t] * dus_kernel_rate
  - rcn_cost[t] == rcn_input[t] * rcn_price
  - gross_salaries[t] == headcount * monthly_wage * 12 for t >= 1
  - cnps_employer[t] == headcount * 12 * (cnps_pension_rate * monthly_wage + (cnps_family_rate + cnps_at_rate) * cnps_ceiling_monthly) for t >= 1
  - monthly_wage >= smig_monthly
  - monthly_wage >= cnps_ceiling_monthly
  - fdfp[t] == gross_salaries[t] * fdfp_rate
  - cce[t] == gross_salaries[t] * cce_rate for t >= holiday_years + 1
  - cce[t] == 0 for t < holiday_years + 1
  - labour_cost_total[t] == gross_salaries[t] + cnps_employer[t] + fdfp[t] + cce[t]
  - utilities_other[t] == utilities_annual for t >= 1
  - patente[t] == revenue[t] * patente_rate for t >= holiday_years + 1
  - patente[t] == 0 for t < holiday_years + 1

  # ---- definition: earnings ----
  - ebitda[t] == revenue[t] - export_duty[t] - rcn_cost[t] - labour_cost_total[t] - utilities_other[t] - patente[t]
  - dep_total[t] == dep_equipment[t] + dep_building[t]
  - dep_equipment[t] == capex_initial * equip_share * equip_dep_rate for t >= 1
  - dep_building[t] == capex_initial * (1 - equip_share) * building_dep_rate for t >= 1
  - founder_dep_belief[t] == capex_initial / founder_asset_life for t >= 1
  - dep_total[t] > founder_dep_belief[t] for t >= 1
  - ebit[t] == ebitda[t] - dep_total[t]

  # ---- definition: tax, holiday and minimum-tax floor ----
  - imf[t] == revenue[t] * imf_rate for t >= 1
  - imf[t] >= imf_floor for t >= 1
  - imf[t] <= imf_cap for t >= 1
  - bic_before_relief[t] == ebit[t] * bic_rate
  - tax[t] == 0 for t < holiday_years + 1
  - tax[t] == bic_before_relief[t] for t >= holiday_years + 1
  - bic_before_relief[t] >= imf[t] for t >= holiday_years + 1
  - tax_relief[t] == bic_before_relief[t] - tax[t]
  - tax_relief[t] == 0 for t >= holiday_years + 1
  - tax[t] >= 0
  - nopat[t] == ebit[t] - tax[t]

  # ---- driver bridges: working capital components ----
  - inv_rcn_close[t] == rcn_cost[t] * rcn_close_cover_months / 12
  - inv_rcn_peak[t] == rcn_cost[t] * rcn_peak_cover_months / 12
  - rcn_peak_cover_months == 12 - campaign_months
  - inv_rcn_peak[t] >= inv_rcn_close[t]
  - inv_fg_close[t] == (rcn_cost[t] + labour_cost_total[t] + utilities_other[t]) * fg_cover_months / 12
  - accounts_receivable[t] == revenue[t] * dso_days / 365
  - accounts_payable[t] == rcn_cost[t] * dpo_rcn_days / 365 + utilities_other[t] * dpo_other_days / 365
  - vat_receivable[t] == utilities_other[t] * vatable_share * vat_rate * vat_lag_months / 12

  # ---- definition: FCFF ----
  - fcff[t] == nopat[t] + dep_total[t] - delta_nwc[t] - capex[t]
  - fcff[first] == 0 - capex_initial
  - fcff[t] >= 0 for t >= 1

  # ---- the carried columns ----
  - tax_zoneB_ge[t] == 0 for t < zoneB_ge_holiday_years + 1
  - tax_zoneB_ge[t] == tax[t] for t >= zoneB_ge_holiday_years + 1
  - sum(fcff_zoneB_ge) > sum(fcff)
  - subsidy_processing[t] == kernel_output[t] * subsidy_rate
  - fcff_with_subsidy[t] == fcff[t] + subsidy_processing[t] for t < holiday_years + 1
  - fcff_with_subsidy[t] == fcff[t] + subsidy_processing[t] * (1 - bic_rate) for t >= holiday_years + 1
  - sum(fcff_with_subsidy) > sum(fcff)

  # ---- cumulative sanity ----
  - cumsum(fcff)[last] == sum(fcff)
  - cumsum(fcff)[t] >= 0 for t >= 1

notes:

  framework:
    - >-
      The applicable framework is SYSCOHADA révisé (OHADA), not IFRS. Côte d'Ivoire is an OHADA
      member state. The two provisions that bind here are the mandatory calendar fiscal year — which
      is what makes the seasonal inventory offset visible — and component-based depreciation, which
      is what forbids the founder's blended fifteen-year life.

  founder_belief_vs_verified_fact:
    - what_he_believes: "\"cinq ans d'exonération totale d'impôt sur le bénéfice\" — five years."
      what_is_the_case: >-
        Bouaké is Zone B under Ordonnance n°2018-646 (chef-lieu de région Gbêkê, second city, c.
        830 000 inhabitants — Zone B on both the "chefs-lieux de région" and the ">60 000 habitants"
        formulations, so the classification is robust). Zone B exploitation-phase relief runs TEN
        years, and for catégorie 1 — agro-industrie transforming local agricultural raw materials,
        which is exactly cashew processing — at 100%. FIVE years is the ZONE A (Abidjan) duration.
        He has almost certainly imported the Abidjan number, or been agréé as a PME, for which
        Zone B offers 100% over five years as one of two options.
      difference_it_makes: >-
        Modelled at his stated five years in the base, because he holds the arrêté and its content is
        a fact about his operation. The ten-year grande-entreprise reading is carried in full as
        tax_zoneB_ge and fcff_zoneB_ge. The exposure is that PME status under loi n°2014-140 requires
        turnover HT at or below 1 bn XOF, and his projected turnover is nearly double that — he
        breaches the PME ceiling in the very first year the relief is meant to run. Either the
        agrément was issued on a basis his own business plan will not survive, or he is a grande
        entreprise and his relief is twice as long as he thinks. This must be resolved against the
        arrêté itself before any capital is committed.
      behavioural_reading: >-
        His belief still explains his behaviour. "C'est pour ça que je me dépêche de démarrer" is
        rational under either reading, because the clock starts at first production either way. His
        belief affects his timing; it does not affect his cash.

    - what_he_believes: "Relief covers \"l'impôt sur le bénéfice\" — profits tax."
      what_is_the_case: >-
        The code's exoneration list is materially wider and expressly covers the impôt sur les
        bénéfices, the IMPÔT MINIMUM FORFAITAIRE, the contribution des patentes et licences, the
        CONTRIBUTION DES EMPLOYEURS, the IRVM, and the impôt sur le patrimoine foncier. He is
        understating his own relief.
      difference_it_makes: >-
        Patente and the employer contribution are switched off during the holiday and back on at
        t=6; both are visible as zero rows in the trace. CNPS social contributions are NOT taxes and
        are never relieved — a distinction that "exonération totale" invites people to get wrong in
        the opposite direction.

    - what_he_believes: "\"je repasse au taux normal comme tout le monde, vingt-cinq pour cent\""
      what_is_the_case: "Verified correct. The BIC rate of droit commun for resident companies is 25%."
      difference_it_makes: "None. He is right, and the model uses his rate."

    - what_he_believes: "Post-holiday tax is 25% of profit, full stop."
      what_is_the_case: >-
        Côte d'Ivoire runs a minimum tax. The IMF is 0.5% of turnover TTC, floor 3 000 000, cap
        35 000 000, and the company pays the greater of BIC and IMF.
      difference_it_makes: >-
        None to the base FCFF, because at 9 900 000 the IMF is far below the 191 798 000 BIC. But it
        is only knowable by computing it, and it becomes the binding constraint in any year the
        margin compresses — a hard 9.9 M of tax is due at this turnover even on a loss. Carried as
        its own row.

    - what_he_believes: "\"sur ce genre d'équipement on compte quinze ans\", applied to machines, dryers AND the building together."
      what_is_the_case: >-
        The tax-admitted straight-line rates are 10% for matériel et outillage lourd (10 years) and
        5% for immeubles en dur (20 years). SYSCOHADA independently requires component depreciation.
        His single fifteen-year life is wrong in both directions at once.
      difference_it_makes: >-
        The largest structural error in his own model, and it is not the D&A number itself — D&A is
        added back in the FCFF identity, so during a full tax holiday it is cash-irrelevant. It is
        the TIMING. The equipment's ten-year life means its entire depreciation shield is consumed
        across 2027-2036, of which the first five years shelter a tax bill of zero. Half the shield
        is thrown away. Then a 117 M renewal falls due in 2037 — inside the taxpaying period, against
        a business whose only remaining shield is the building. Under his fifteen-year assumption he
        sees neither the renewal nor the shield collapse. Carried as founder_dep_belief, and the
        renewal is visible as capex[11].

    - what_he_believes: "Says nothing about export duty."
      what_is_the_case: >-
        Ordonnance n°2024-993 of 20 November 2024 applies the DUS at 5% to raw nuts in shell only;
        kernels are totally exempt.
      difference_it_makes: >-
        His silence produces the right answer for a reason he has not stated. Carried as an explicit
        zero row, because it is the entire policy rationale for onshore processing and it switches on
        at 5% the moment he diverts unprocessed nuts to export.

    - what_he_believes: "Says nothing about the processing subsidy."
      what_is_the_case: >-
        A transformation incentive of 400 XOF per kg of kernel processed and exported (80 XOF per kg
        of RCN) is available to processors, sized on the official Vietnam-Côte d'Ivoire
        competitiveness gap.
      difference_it_makes: >-
        176 M XOF/yr — comparable to the entire capital cost of his plant, annually. Deliberately
        EXCLUDED from the base and carried as subsidy_processing / fcff_with_subsidy, because it is a
        discretionary budget line rather than a statutory entitlement, the sector envelope is thin
        (order 10 bn XOF/yr against 344 000 t processed in 2024), and national processors have
        publicly petitioned for renewal of the 2022 framework and compensation for supply failures,
        reporting that the associated stock d'amorçage arrives in May when buying is already over.
        Booking it in the base would be modelling a hope; omitting it silently would hide the largest
        upside in the project.

    - what_he_believes: "\"soixante ouvriers à quatre-vingt mille par mois\" — 57.6 M/yr of labour."
      what_is_the_case: >-
        Employer charges are statutory and additive: CNPS retraite 7.7% uncapped at this wage,
        prestations familiales plus maternité 5.75% and accidents du travail 2-5%, both capped at
        70 000 XOF/month, plus FDFP 1.6% and CCE 1.2%.
      difference_it_makes: >-
        True labour cash cost is 17.0-18.2% above his figure. Note the ceiling quirk: the PF/AT
        ceiling of 70 000 sits BELOW the 75 000 SMIG, so it binds on every worker in the country at
        or above minimum wage, including all sixty of his. Only the pension branch runs on the
        uncapped wage. His 80 000 wage is lawful, clearing SMIG by 6.7%.

    - what_he_believes: "\"j'achète aux coopératives à cinq cents francs le kilo\" against a 400 XOF bord-champ floor for 2026."
      what_is_the_case: >-
        Not a contradiction — a different price concept, correctly used. Bord champ is the farmgate
        floor; 500 delivered to a Bouaké factory gate is 400 plus collection, bagging, transport and
        cooperative margin. His number is internally consistent with the published floor.
      difference_it_makes: "None. He is right."

    - what_he_believes: "\"vingt-deux kilos d'amande blanche pour cent kilos de noix brutes\""
      what_is_the_case: >-
        Correct, and he has picked the right one of two commonly confused numbers. Laboratory KOR for
        West African RCN is 45-50 lb/80 kg bag (25-28% theoretical kernel content); realised
        commercial outturn of export-grade kernel is 20-23%. His 22% is a realised outturn, which is
        the correct basis for a revenue build.
      difference_it_makes: "None. Accepted as stated."

  leak_declarations:
    - identity: "MASS — he asserts 100 kg RCN = 22 kg kernel + 78 kg shell (\"le reste, c'est la coque\")."
      leaks_named: >-
        Moisture driven off in conditioning and drying (order 5-8 kg per 100 kg RCN); testa peeled
        off the kernel (2-3 kg); rejects, dust, sweepings, scorched and oil-stained kernel (order
        1 kg); CNSL, not recovered. True shell fraction is nearer 68-72 kg, not 78.
      treatment: >-
        The 78 kg residual is carried as shell_and_loss and explicitly labelled a RESIDUAL, NOT A
        PRODUCT. Byproduct revenue set to ZERO, with reason: a 120 M XOF utilities figure for a
        2 000 t line is consistent with shell being burned in-house as boiler fuel for conditioning
        and drying, which is worth more than selling it at Bouaké gate, and is therefore already
        implicitly priced into his own cost line.
    - identity: "UNITS MADE = UNITS SOLD."
      leaks_named: "Kernel storage loss — insect, rancidity, breakage and handling damage in containerisation."
      treatment: "Set to zero. Reason: immaterial over a one-month finished-goods cycle."
    - identity: "DAYS AVAILABLE = DAYS WORKED (2 000 t/yr implies c. 6.7 t/day over c. 300 days)."
      leaks_named: >-
        Power interruptions, campaign supply gaps, and above all the year-one training curve on
        manual cutting and peeling. Greenfield West African units typically run 55-75% of nameplate
        in year one.
      treatment: >-
        Set to zero because he STATED 2 000 t/yr and is the authority on his own operation. Declared
        because the direction is unambiguously down and this is the likeliest reason year one
        under-delivers. Not quantified into the trace, per his authority over his own volumes.
    - identity: "GRADE HOMOGENEITY — one price applied to all 440 t."
      leaks_named: >-
        A line yields roughly 65-75% whole kernels and 25-35% brokens, splits and pieces; brokens
        realise perhaps 55-75% of the whole-kernel price.
      treatment: >-
        Set to zero, because his realised average selling price is a fact about his operation. But
        4 500 XOF/kg is about USD 7.96/kg against Vietnam WW320 at USD 7.2-7.5/kg FOB and Indian
        W320 at EUR 6.4-6.6/kg — at or above the top of the WHOLE-kernel range, and well above any
        blended realisation. If 4 500 is a market quote he has read rather than a blend he has
        achieved, revenue and everything below it move down proportionally. This is the largest
        unquantified exposure in the model and the first question to put to him.
    - identity: "STOCK ROLL — opening + purchases − consumption = closing, verified to close exactly at 166.667 t."
      leaks_named: >-
        Storage shrinkage on RCN over a seven-month hold: insect damage, mould in a humid climate,
        rodent loss, moisture re-absorption, and outturn degradation with long storage. Typically
        1-3%, and it degrades KOR as well as quantity.
      treatment: >-
        Set to zero, and this is a disclosure rather than a justification: he gave a single realised
        outturn and a single throughput, and I decline to double-count a degradation that may already
        sit inside his 22%. If it does not, kernel output and revenue are overstated by 1-3%.
    - identity: "ASSET RETIREMENT at t=11."
      leaks_named: "Scrap and resale proceeds on the retired shelling line."
      treatment: "Set to zero. Reason: no meaningful resale market for end-of-life decorticating equipment at Bouaké; any residual value is consumed by removal cost."

  judgment_calls:
    - >-
      THE DOMINANT UNSTATED FACT IS WORKING CAPITAL, NOT CAPEX. The buying campaign is a five-month
      window (February to June) and the factory runs twelve months, so twelve months of raw material
      must be bought and financed inside five. The month-by-month roll closes exactly and pins
      closing cover at one month and the June peak at seven. The 31 December balance sheet shows
      83 M of RCN inventory; the business is financing 583 M at the June peak — more than three times
      the entire cost of the factory. Annual unlevered FCFF is correctly built on the closing balance,
      so the peak does not enter the FCFF line, but it is carried as inv_rcn_peak because it is the
      binding constraint on whether this plant runs at all. An analyst reading only the year-end
      accounts would never see it. Hurrying to start does nothing about it.
    - >-
      NATURAL UNIT VERSUS STATUTORY UNIT. The industry's natural period is the CAMPAIGN (February to
      January); the statutory accounting period is the calendar year. The one-month offset between
      them is the entire reason the year-end balance sheet looks benign. Friction recorded rather
      than resolved: the accounts must be kept on the calendar year.
    - >-
      Routine maintenance capex is set to zero because he has already expensed "l'entretien" inside
      the 120 M opex line; charging it twice would be the error. Friction: a real line needs periodic
      sub-renewals (blades, peeling drums, boiler tubes) that sit between his opex line and the
      decennial renewal, and the model forces all of it into one or the other.
    - >-
      The equipment renewal is modelled as placed in service at the start of 2037, giving a flat
      14 850 000/yr of D&A across the whole grid. That seamlessness is an artefact: a real shutdown
      and re-commissioning would cost 2037 throughput, which this model does not charge.
    - >-
      bic_before_relief is computed on holiday-year EBIT, which already excludes the relieved patente
      and CCE. It therefore slightly understates the true all-in value of the relief; the relieved
      patente and CCE are separately visible as zero rows rather than being folded into tax_relief.
    - >-
      Zero IMF is booked at t=0. Ivorian practice exempts newly created companies from the IMF in
      their first fiscal year, but I could not verify the provision, so the 3 000 000 floor is not
      charged rather than invented. Deferred, and immaterial to the FCFF profile.
    - >-
      The patente droit sur la valeur locative and the impôt sur le patrimoine foncier are both on
      the exoneration list and both payable after t=6, but neither is computable without a cadastral
      rental value. Both are of the order of a few hundred thousand XOF against a 782 M EBITDA. I
      exclude them rather than invent a valeur locative.
    - >-
      CONFLICTING SOURCE, RESOLVED: one secondary source gives CNPS prestations familiales as 7%.
      The CNPS employer schedule gives 5% prestations familiales plus 0.75% maternité. I use 5.75%
      as the more granular and more authoritative figure. The difference is c. 1 M XOF/yr.
    - >-
      The accidents-du-travail rate is the only payroll input that is ASSUMED rather than SOURCED.
      The 2-5% band is statutory; the specific risk class for a mechanised nut-processing plant is
      not determinable from the utterance. 3% is a mid-band prior. Range impact is c. ±1.7 M XOF/yr.

  elicitations:
    - "Produce the arrêté d'agrément. What zone, what catégorie, what percentage, what duration, and were you classified PME or grande entreprise? This single document is worth roughly a billion XOF and it settles the base case."
    - "Is 4 500 XOF/kg a blended realisation across your actual grade mix, or a whole-kernel quote? What percentage of output do you expect as wholes versus brokens, and at what discount do brokens sell?"
    - "The devis by lot — what is the actual split between equipment, civil works and installation? The 65/35 assumption drives both the depreciation shield and the 2037 renewal."
    - "Have you been told you will receive the 400 XOF/kg transformation subsidy, in writing, and on what collection timetable? At 176 M XOF/yr it is the largest single swing factor in the project."
    - "What campaign credit line do you have arranged, and at what limit? The June peak is c. 583 M XOF — over three times your capex — and it is the constraint that actually determines whether the plant runs."
    - "What are your export payment terms, your shipping cycle from Bouaké, and your observed VAT refund lag? These set DSO, finished-goods cover and the VAT receivable."

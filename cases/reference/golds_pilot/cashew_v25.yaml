passage: |
  ================================================================================
  0. FRAMEWORK, CALENDAR AND WHAT I AM ACTUALLY BUILDING
  ================================================================================

  The applicable accounting framework is NOT IFRS. Côte d'Ivoire is an OHADA member state, so the
  statutory framework is the SYSCOHADA révisé (Acte uniforme relatif au droit comptable et à
  l'information financière, applicable since 1 January 2018). Two consequences bind this model:
  the fiscal year is the calendar year (1 January - 31 December), and durable assets must be
  depreciated by component over each component's own useful life, not as a single blended block.
  Both matter below.

  The founder speaks in July 2026 and says "Je démarre l'année prochaine". First production is
  therefore 2027. I place the installation spend in 2026 and index it t=0, with production running
  t=1 (2027) through t=15 (2041). Sixteen periods. That horizon is chosen so that three structural
  breaks are all visible inside the grid rather than dumped into a terminal value: the tax cliff at
  t=6, the equipment renewal at t=11, and the post-renewal steady state from t=12.

  I derive unlevered FCFF asset-side:

      FCFF = NOPAT + D&A − ΔNWC − capex,     NOPAT = EBIT − cash tax on EBIT

  Because the build is unlevered there is no interest, so taxable profit equals EBIT and no interest
  tax shield enters. Every financing question — and there is a very large one here, see §6 — is
  deliberately kept out of the asset-side number and flagged separately.

  ================================================================================
  1. THE PHYSICAL BUILD, IN HIS OWN UNITS, WITH THE LEAKS NAMED
  ================================================================================

  He works in tonnes of raw cashew nut (RCN) per year and kilos of white kernel per hundred kilos of
  RCN. I keep those units.

      RCN input          = 2 000 t/yr        = 2 000 000 kg/yr
      Outturn            = 22 kg kernel / 100 kg RCN
      Kernel output      = 2 000 000 × 0.22  = 440 000 kg/yr = 440 t/yr

  CHECKING HIS OUTTURN. 22% is not a number he can be wrong about in the way he can be wrong about
  a statute — it is his plant. But it is checkable against the published range, and it checks out.
  Industry convention distinguishes the laboratory KOR (kernel content of the nut, typically
  45-50 lb per 80 kg bag for West African RCN, i.e. 25-28% theoretical) from the REALISED commercial
  outturn of export-grade kernel actually shipped, which runs 20-23% for industrial lines. His 22% is
  squarely a realised commercial outturn, which is the right basis for a revenue build. He is right,
  and he is using the right one of the two numbers. Noted rather than corrected.

  CONSERVATION IDENTITY 1 — MASS. He asserts: 100 kg RCN = 22 kg kernel + 78 kg shell, "le reste,
  c'est la coque". This asserts a closed system. It is not closed. The leak terms are:

    (a) MOISTURE. RCN arrives at roughly 8-10% moisture and is steam-conditioned or roasted, then
        the kernel is dried to about 5% before peeling. Net water driven off is of the order of
        5-8 kg per 100 kg of RCN. This mass leaves as vapour and is in nobody's sack.
    (b) TESTA. The reddish skin peeled off the kernel, roughly 2-3 kg per 100 kg RCN.
    (c) REJECTS, DUST, SWEEPINGS, SCORCHED AND OIL-STAINED KERNEL. Roughly 1 kg per 100 kg RCN.
    (d) CNSL. Cashew nut shell liquid, extractable from the shell. Not recovered here.

    So the true shell fraction is nearer 68-72 kg per 100 kg RCN, not 78. I therefore keep a single
    explicit residual row, shell_and_loss = 78 kg/100 kg, and state plainly that it is NOT pure
    shell — it is shell plus water plus testa plus rejects. The row is a residual, not a product.

    LEAK SET TO ZERO, WITH REASON: I attribute NO revenue to shell or CNSL. Reason: his utilities,
    water, bags and maintenance figure of 120 M XOF/yr for a 2 000 t line is modest, which is
    consistent with shell being burned in-house as boiler fuel for the steam-conditioning and drying
    stages rather than sold. Burning it is worth more than selling it at Bouaké gate prices, and it
    is already implicitly priced into his 120 M. So zero, and the reason is stated rather than
    assumed away.

  CONSERVATION IDENTITY 2 — UNITS MADE VERSUS UNITS SOLD. I set kernel sold = kernel produced,
  with finished-goods stock as the only buffer (§6). LEAK NAMED: storage losses on kernel (insect,
  rancidity, breakage in handling and containerisation) are real but small on a one-month stock
  cycle; set to zero.

  CONSERVATION IDENTITY 3 — DAYS AVAILABLE VERSUS DAYS WORKED. 2 000 t/yr over roughly 300 operating
  days is 6.7 t/day of RCN. LEAK NAMED: power interruptions, campaign supply gaps, and above all
  the training curve on manual cutting and peeling. Greenfield West African cashew units typically
  run 55-75% of nameplate in their first year. I do NOT haircut year 1, because he STATED 2 000 t/yr
  and he is the authority on his own operation. But the leak is declared, its direction is down, and
  it is the single most likely reason the year-1 line under-delivers.

  CONSERVATION IDENTITY 4 — GRADE. He applies one price, 4 500 XOF/kg, to all 440 t. That treats
  output as grade-homogeneous. It is not: a line produces roughly 65-75% whole kernels (W-grades)
  and 25-35% brokens, splits and pieces, and brokens realise something like 55-75% of the whole-kernel
  price. LEAK NAMED, SET TO ZERO IN BASE, WITH REASON: he said "l'amande, je l'exporte à quatre mille
  cinq cents francs" as a description of what he sells his kernel for, and his realised average price
  is a fact about his operation, not about the world. If instead 4 500 is a W320 quote he has read
  off a market report rather than a blended realisation, revenue is overstated and every line below
  it moves down proportionally. Direction: down. This is the largest single unquantified exposure in
  the model and it should be the first question put to him.

  CROSS-CHECK ON HIS SELLING PRICE. 4 500 XOF/kg at roughly 565 XOF/USD is about USD 7.96/kg. Vietnam
  WW320 was quoted around USD 7.2-7.5/kg FOB in late 2025, and Indian conventional W320 around
  EUR 6.4-6.6/kg in mid-2026. So 4 500 sits at or slightly above the top of the whole-kernel range
  and well above any blended realisation. It is defensible as a whole-kernel number and stretched as
  a blend. This reinforces the grade leak above rather than replacing it.

  CROSS-CHECK ON HIS BUYING PRICE. The official bord-champ floor for the 2026 campaign is 400 XOF/kg
  (down from 425 in 2025, on softer world prices and a dollar that fell from about 620 to 565 XOF).
  He says he buys at 500 from cooperatives. That is not a contradiction: bord champ is the farmgate
  floor, and 500 delivered to a Bouaké factory gate is 400 plus collection, bagging, transport and
  the cooperative's margin. His number is internally consistent with the published floor and is a
  DIFFERENT price concept, correctly used. He is right.

  ================================================================================
  2. REVENUE AND THE EXPORT DUTY THAT DOES NOT BITE
  ================================================================================

      Revenue = 440 000 kg × 4 500 XOF/kg = 1 980 000 000 XOF/yr

  Export duty. Côte d'Ivoire levies a Droit Unique de Sortie on cashew. The founder says nothing
  about it, and a naive model would either ignore it or apply the headline 5%. Both would be wrong
  for the wrong reasons. The verified position: Ordonnance n°2024-993 of 20 November 2024, ratified
  in 2025, applies the DUS at 5% of reference CIF value to RAW NUTS IN SHELL ONLY; kernels are
  totally exempt, precisely in order to push processing onshore. He exports kernel. His DUS is zero.

      export_duty = 1 980 000 000 × 0.0 = 0

  I carry this as an explicit zero row rather than omitting it, because the zero is a verified
  statutory result, not an oversight, and because it is the entire economic reason his business model
  exists. If he ever diverts unprocessed nuts to export, the row switches on at 5%.

  ================================================================================
  3. COSTS — INCLUDING THE PAYROLL CHARGES HE HAS NOT COUNTED
  ================================================================================

  RAW MATERIAL.  2 000 000 kg × 500 XOF/kg = 1 000 000 000 XOF/yr.
  That is 50.5% of revenue. This is a raw-material-dominated business, which is why §6 matters more
  than §4.

  LABOUR. He says "soixante ouvriers à quatre-vingt mille par mois", which is 60 × 80 000 × 12 =
  57 600 000 XOF/yr of gross salary. That is what lands in the workers' hands, not what leaves his
  bank account. Ivorian employer charges are statutory and he does not get to net them out.

  First, is 80 000 lawful? SMIG is 75 000 XOF/month under décret n°2022-986 of 21 December 2022,
  unchanged through 2026. 80 000 > 75 000, so yes. He is compliant, though only by 6.7%.

  Now the employer charges, per worker per month:

    CNPS retraite, employer share      7.70% × 80 000                         =  6 160
      (ceiling 3 375 000/month — nowhere near binding)
    CNPS prestations familiales
      + assurance maternité            5.75% × min(80 000; 70 000) = 5.75% × 70 000 =  4 025
    CNPS accidents du travail          3.00% × min(80 000; 70 000) = 3.00% × 70 000 =  2 100
                                                                              --------
    CNPS total per worker per month                                             12 285

  Note the ceiling quirk, which is real and easy to get wrong in both directions: the PF/maternité/AT
  ceiling is 70 000 XOF/month, which is BELOW the 75 000 SMIG. It therefore binds on every single
  worker in the country earning the minimum wage or more, including all sixty of his. Applying 5.75%
  and 3% to the full 80 000 would overstate these two branches; ignoring the ceiling distinction
  entirely and capping the pension branch too would understate. Only the retraite branch runs on the
  uncapped wage.

    CNPS annual        = 60 × 12 × 12 285                              =   8 845 200
    FDFP (0.4% apprentissage + 1.2% FPC) = 1.6% × 57 600 000           =     921 600
    CCE (contribution à la charge de l'employeur, local staff) = 1.2% × 57 600 000 = 691 200

  The CCE is a TAX, and the investment code's exoneration list explicitly names "la contribution des
  employeurs". So the CCE is relieved during the holiday and payable afterwards. The FDFP levies are
  parafiscal and are not named in the exoneration list; I treat them as payable throughout, which is
  the conservative reading. CNPS social contributions are not taxes at all and are never relieved —
  a point worth stating because "exonération totale" is often heard as covering them.

    Labour cost, holiday years  = 57 600 000 + 8 845 200 + 921 600 + 0        =  67 366 800
    Labour cost, normal years   = 57 600 000 + 8 845 200 + 921 600 + 691 200  =  68 058 000

  So his true labour cash cost is 17.0-18.2% above the 57.6 M he has in mind. In absolute terms this
  is about 10.5 M XOF/yr — small against a 1.98 bn revenue line, but it is exactly the kind of item
  that is invisible until the first CNPS assessment arrives.

  UTILITIES, WATER, BAGS, MAINTENANCE. 120 000 000 XOF/yr as stated. I take his figure. Note he has
  bundled routine maintenance into opex, which is why I set routine maintenance capex to zero in §5
  rather than double-counting it — an explicit choice, not an omission.

  PATENTE. The contribution des patentes et licences is an operating tax, deductible for BIC, and it
  is on the investment code's exoneration list. Droit sur le chiffre d'affaires at 0.5% of turnover
  HT gives 0.5% × 1 980 000 000 = 9 900 000 XOF/yr, zero during the holiday and payable from t=6.
  FRICTION DECLARED: the patente also carries a droit sur la valeur locative on the premises, and
  there is a separate impôt sur le patrimoine foncier. Both are also on the exoneration list, both
  are small relative to a 782 M EBITDA (order of a few hundred thousand XOF), and neither can be
  computed without the cadastral rental value. I exclude them and record them as elicited, rather
  than inventing a valeur locative.

  EBITDA, holiday years (t=1..5):
      1 980 000 000 − 0 − 1 000 000 000 − 67 366 800 − 120 000 000 − 0        = 792 633 200
  EBITDA, normal years (t=6..15):
      1 980 000 000 − 0 − 1 000 000 000 − 68 058 000 − 120 000 000 − 9 900 000 = 782 042 000

  ================================================================================
  4. DEPRECIATION — WHERE HIS FIFTEEN YEARS IS WRONG, AND WHY IT COSTS HIM
  ================================================================================

  He says "sur ce genre d'équipement on compte quinze ans" and applies it to a bundle that he himself
  describes as three different things: "les machines de décorticage, les séchoirs, le bâtiment".
  A shelling line and a shed do not wear out together, and neither SYSCOHADA nor the CGI lets him
  pretend they do.

  The tax-admitted straight-line rates in Côte d'Ivoire are:
      immeubles en dur (solid buildings)            5%   → 20-year life
      matériel et outillage lourd (heavy plant)     10%  → 10-year life

  His 15 years is wrong in BOTH directions simultaneously: too long for the equipment, too short for
  the building. This is not a rounding difference; it inverts the shape of his tax shield.

  Splitting capex (equipment 65% / building 35% — ASSUMED, and the first thing to replace with his
  actual devis):

      Equipment  = 180 000 000 × 0.65 = 117 000 000, at 10% → 11 700 000/yr, running 2027-2036
      Building   = 180 000 000 × 0.35 =  63 000 000, at  5% →  3 150 000/yr, running 2027-2046
      D&A total  = 14 850 000/yr

  Now the finding that matters. The equipment has a TEN-year tax life. Production starts in 2027.
  The equipment is therefore fully written off at 31 December 2036 — accumulated depreciation on it
  reaches 117 000 000 exactly at t=10, and net book value of the whole plant falls to 31 500 000,
  which is nothing but the part-depreciated building.

  Under HIS five-year holiday, the entire equipment shield of 11.7 M/yr is consumed across 2027-2036,
  of which the first five years are years in which he pays no tax at all. Depreciation taken inside a
  tax holiday is depreciation thrown away: it shelters nothing, because there is nothing to shelter.
  He burns half his equipment shield against a zero tax bill.

  And it gets worse at the other end. Because the equipment life is ten years, not fifteen, he faces
  a renewal in 2037 (t=11) — a fresh 117 000 000 of capex landing five years AFTER the tax holiday
  has already expired. Under his own 15-year assumption he would see no renewal at all inside the
  horizon and a smooth 12 000 000/yr shield running to 2041. The reality is a shield that collapses
  to the building alone at the moment he starts paying tax, and a capex hit in the middle of the
  taxpaying period.

  I model the renewal as placed in service at the start of 2037, so equipment depreciation runs
  continuously at 11 700 000/yr and total D&A is a flat 14 850 000/yr across the whole grid. FRICTION
  DECLARED: that seamlessness is an artefact of assuming instantaneous replacement. A real shutdown
  and re-commissioning would cost throughput in 2037, which this model does not charge.

  PP&E roll-forward, with the retirement made explicit:
      ppe_gross[t]  = ppe_gross[t−1] + capex[t] − retirements[t]
      accum_dep[t]  = accum_dep[t−1] + D&A[t]   − retirements[t]
  At t=11 the fully-written-down old equipment is retired at nil net book value: gross falls by
  117 000 000 and accumulated depreciation falls by the same 117 000 000, so net book value is
  untouched by the retirement itself and moves only by the new capex. Gross PP&E is therefore a flat
  180 000 000 throughout, which is a useful sanity anchor. LEAK NAMED: scrap proceeds on the retired
  line are set to zero — decorticating equipment at end of life in Bouaké has essentially no resale
  market, and any residual is consumed by removal cost.

      EBIT, holiday years  = 792 633 200 − 14 850 000 = 777 783 200
      EBIT, normal years   = 782 042 000 − 14 850 000 = 767 192 000

  ================================================================================
  5. TAX — WHAT HE BELIEVES, WHAT THE STATUTE SAYS, AND THE DIFFERENCE
  ================================================================================

  He makes four separable claims. Taken one at a time:

  CLAIM 1: "je repasse au taux normal comme tout le monde, vingt-cinq pour cent."
  VERIFIED CORRECT. The Ivorian BIC rate of droit commun for resident companies is 25%. He is right,
  and I apply 25%. (Non-residents are at 35%, which is not his case.)

  CLAIM 2: "cinq ans d'exonération totale d'impôt sur le bénéfice à compter de la première année
  de production."
  PARTIALLY CORRECT, AND THE ERROR IS PROBABLY IN HIS FAVOUR. Under Ordonnance n°2018-646 of
  1 August 2018 (as amended, notably by Ordonnance n°2024-857 of 30 September 2024), the
  exploitation-phase relief is zoned. Zone A is the District of Abidjan and runs FIVE years. Zone B —
  chefs-lieux de région, plus Bonoua and Grand-Bassam, equivalently agglomerations above 60 000
  inhabitants — runs TEN years. Zone C runs fifteen.

  Bouaké is the country's second city, chef-lieu of the Gbêkê region and of the Vallée du Bandama
  district, with of the order of 830 000 inhabitants. It is Zone B on both published definitions of
  the zone boundary, so the classification is robust to which definition governs. The five-year
  figure he quotes is the ABIDJAN duration. For catégorie 1 activities — which expressly include
  agro-industry transforming local agricultural raw materials, i.e. exactly what he does — Zone B
  relief for a grande entreprise is 100% over ten years.

  So why do I nonetheless run the BASE CASE at five years? Because he says "j'ai obtenu l'agrément" —
  he holds an arrêté, and the content of a document issued to him is a fact about his operation, on
  which he is the authority, not a fact about the world. And 100% over five years is a REAL statutory
  option in Zone B: it is the PME variant (Zone B PME relief is described as 100% for the first five
  years, or 75% partial over ten). At 180 M of investment he sits above the 50 M PME threshold and
  below the 200 M grande-entreprise threshold, so a PME classification at application is exactly what
  one would expect, and it produces precisely the terms he describes. His account is coherent.

  The exposure is that PME status under loi n°2014-140 of 24 March 2014 requires annual turnover HT
  at or below 1 000 000 000 XOF. His projected turnover is 1 980 000 000 — very nearly double the
  ceiling. He will breach PME status in his first full year of production, which is the same year the
  relief is supposed to begin. Either his agrément was issued on a projected-turnover basis that will
  not survive contact with his own business plan, or he was in fact agréé as a grande entreprise, in
  which case his investment programme as filed must exceed the 200 M threshold and his relief runs
  TEN years, not five. I materialise that second reading in full as fcff_zoneB_ge and tax_zoneB_ge
  rather than describing it, because it is worth roughly a billion XOF.

  CLAIM 3: "exonération totale d'IMPÔT SUR LE BÉNÉFICE."
  UNDERSTATED SCOPE. He describes the relief as covering profits tax. The code's exoneration is
  materially wider, expressly covering: l'impôt sur les bénéfices, L'IMPÔT MINIMUM FORFAITAIRE, la
  contribution des patentes et licences, LA CONTRIBUTION DES EMPLOYEURS, l'impôt sur les revenus des
  valeurs mobilières, and l'impôt sur le patrimoine foncier. Two of those are live in this model and
  I have already switched them off during the holiday: the patente (9 900 000/yr) and the employer
  contribution (691 200/yr). He gets more than he thinks. What he does NOT get relieved is CNPS —
  those are social contributions, not taxes, and they run at full rate throughout.

  CLAIM 4, implicit: that after the holiday, tax = 25% of profit.
  INCOMPLETE. Côte d'Ivoire runs a minimum tax. The IMF is 0.5% of turnover TTC, with a floor of
  3 000 000 and a cap of 35 000 000 XOF, and the company pays the GREATER of BIC and IMF. Here:

      IMF  = 0.5% × 1 980 000 000 = 9 900 000        (above the 3 M floor, below the 35 M cap)
      BIC  = 25%  ×   767 192 000 = 191 798 000
      Tax  = max(191 798 000; 9 900 000) = 191 798 000

  The IMF does not bite, because this business is genuinely profitable. But it must be computed to
  know that, and it is the binding constraint in any year the margin compresses — at a 1.98 bn
  turnover the floor is a hard 9.9 M of tax even on a loss. I carry the row.

  Tax schedule applied:
      t = 0..5   (2026-2031):  tax = 0
      t = 6..15  (2032-2041):  tax = 191 798 000

      NOPAT, holiday years = 777 783 200 − 0           = 777 783 200
      NOPAT, normal years  = 767 192 000 − 191 798 000 = 575 394 000

  The value of the relief is visible in tax_relief: 194 445 800 per holiday year, 972 229 000
  cumulative — 5.4 times the entire capital cost of the plant. His statement that the agrément is
  "ce qui a décidé l'investissement" is not rhetoric. It is arithmetically the dominant fact about
  this project. On the ten-year reading it is worth roughly double that again. Note that
  bic_before_relief is computed mechanically on holiday-year EBIT, which already excludes the
  relieved patente and CCE, so it slightly understates the true all-in value of the relief; the
  relieved patente and CCE are separately visible as zeros in their own trace rows.

  ================================================================================
  6. WORKING CAPITAL — THE THING HE NEVER MENTIONS, AND THE BIGGEST NUMBER IN THE MODEL
  ================================================================================

  The founder describes an annual flow business. It is not. Cashew processing in Côte d'Ivoire is a
  SEASONAL PROCUREMENT business wrapped around a year-round factory, and the working capital
  consequence dwarfs his fixed capital.

  The campaign opens in February — the 2026 bord-champ price was announced on 6 February 2026 — and
  buying is effectively finished by June. Five months. He must buy TWELVE months of raw material
  inside a FIVE month window, and finance it until the kernel is shipped and paid for.

  Take the fiscal year as the calendar year (mandatory under SYSCOHADA), purchases uniform across
  Feb-Jun at 2 000/5 = 400 t/month, consumption uniform across all twelve months at 2 000/12 =
  166.667 t/month. Roll the stock, in tonnes:

      opening 1 Jan                                              166.667
      Jan     −166.667                                             0.000   ← minimum, binds
      Feb     +400 −166.667                                      233.333
      Mar                                                        466.667
      Apr                                                        700.000
      May                                                        933.333
      Jun                                                      1 166.667   ← PEAK
      Jul     −166.667                                         1 000.000
      Aug                                                        833.333
      Sep                                                        666.667
      Oct                                                        500.000
      Nov                                                        333.333
      Dec                                                        166.667   ← closing = opening

  CONSERVATION IDENTITY 5 — STOCK ROLL. opening + purchases − consumption = closing:
  166.667 + 2 000 − 2 000 = 166.667. The roll CLOSES EXACTLY. The opening balance is not a free
  parameter: it is pinned at 166.667 t because January's draw must not push stock negative, and any
  larger opening balance is idle capital. Closing cover is therefore exactly ONE month, and the
  June peak is exactly SEVEN months (twelve months bought, five months consumed during the campaign).

  LEAK NAMED ON THIS IDENTITY: storage shrinkage on RCN over a seven-month hold is real — insect
  damage, mould in a humid climate, rodent loss, moisture re-absorption, and the outturn degradation
  that comes with long storage. Typical loss is 1-3% of stored volume, and it degrades KOR as well as
  quantity. I set it to ZERO here, and the reason is a disclosure, not a justification: the founder
  gave a single realised outturn of 22% and a single throughput of 2 000 t, and I decline to
  double-count a degradation that may already be inside his 22%. If it is not already inside it, both
  kernel output and revenue are overstated by 1-3%.

  Now the two numbers, and the gap between them is the whole point:

      Closing RCN inventory (31 Dec)  = 1 000 000 000 × 1/12  =    83 333 333
      PEAK RCN inventory (30 Jun)     = 1 000 000 000 × 7/12  =   583 333 333
      Average across the year         = 1 000 000 000 × 7/2/12=   291 666 667

  The BALANCE SHEET at 31 December shows 83 M. The BUSINESS is financing 583 M at the June peak —
  more than three times the entire cost of the factory. Annual unlevered FCFF is correctly built on
  the closing balance, because that is what flows through an annual cash flow statement, and the
  intra-year peak is a financing question rather than an asset-side one. But it would be malpractice
  to derive this model and not say it out loud: the binding constraint on this business is not the
  180 M of capex, it is a campaign credit line of roughly 583 M that must be available every June and
  repaid by the following January. I carry inv_rcn_peak as its own trace row for that reason.

  FRICTION DECLARED: the natural unit of this industry is the CAMPAIGN (Feb-Jan), not the calendar
  year. The statutory accounts must be kept on the calendar year, so the two are offset by one month,
  and that single month of offset is the only reason the year-end balance sheet looks benign. An
  analyst reading only the 31 December accounts would never see the 583 M.

  Remaining working capital, at the holiday-year cost base:

      Finished goods (1 month at production cost)
        = (1 000 000 000 + 67 366 800 + 120 000 000)/12                    =  98 947 233.33
      Trade receivables = 1 980 000 000 × 30/365                           = 162 739 726.03
      VAT receivable. Exports are zero-rated, so the unit is structurally in permanent VAT credit
        and must claim refunds. RCN from cooperatives is an unprocessed agricultural product and
        bears no VAT, so no input VAT arises on the 1 bn raw material line — the credit arises only
        on the utilities/bags/maintenance base:
        = 120 000 000 × 0.75 × 0.18 × 4/12                                 =   5 400 000.00
      Trade payables = 1 000 000 000 × 7/365 + 120 000 000 × 30/365        =  29 041 095.89
        (RCN buying from cooperatives is effectively cash on delivery — cooperatives cannot carry a
         processor's credit, which is precisely why the June peak has to be bank-financed.)

      NWC, holiday years = 83 333 333.33 + 98 947 233.33 + 162 739 726.03
                           + 5 400 000.00 − 29 041 095.89 = 321 379 196.80
      NWC, normal years  = 321 379 196.80 + 57 600 = 321 436 796.80
        (the 57 600 step is one month of the CCE entering production cost once the holiday ends)

      ΔNWC: t=1 = +321 379 196.80 ; t=6 = +57 600 ; all other periods 0.

  So the year-one FCFF absorbs a 321 M working capital build on top of the 180 M capex already spent
  in t=0. The founder's mental model has neither.

  ================================================================================
  7. CAPEX
  ================================================================================

      t=0  (2026): 180 000 000   installation as stated
      t=11 (2037): 117 000 000   equipment renewal at the end of its 10-year CGI life
      all other periods: 0

  Routine maintenance capex is set to zero BECAUSE he has already expensed "l'entretien" inside the
  120 M opex line. Charging it twice would be the error. FRICTION DECLARED: a real 2 000 t line will
  need periodic sub-renewals — cutting blades, peeling drums, boiler tubes — that sit awkwardly
  between his opex line and my decennial renewal. The model puts all of it in one or the other.

  ================================================================================
  8. FCFF
  ================================================================================

      FCFF = NOPAT + D&A − ΔNWC − capex

      t=0  : 0 + 0 − 0 − 180 000 000                                   = −180 000 000
      t=1  : 777 783 200 + 14 850 000 − 321 379 196.80 − 0             =  471 254 003.20
      t=2-5: 777 783 200 + 14 850 000 − 0 − 0                          =  792 633 200
      t=6  : 575 394 000 + 14 850 000 − 57 600 − 0                     =  590 186 400
      t=7-10:575 394 000 + 14 850 000 − 0 − 0                          =  590 244 000
      t=11 : 575 394 000 + 14 850 000 − 0 − 117 000 000                =  473 244 000
      t=12-15: as t=7-10                                               =  590 244 000

  Cumulative FCFF over the sixteen periods: 9 247 169 203.20 XOF.

  The shape tells the story. Payback on the 180 M of capex is inside the first production year even
  after absorbing a 321 M working capital build. Then four years at 792.6 M. Then the cliff: FCFF
  drops 202 M — 25.5% — in 2032, purely from tax, patente and the CCE switching on. Then a second,
  smaller notch in 2037 when the equipment renewal lands on a business that is now fully taxpaying
  and has almost no depreciation shield left, because the shield was spent inside the holiday.

  His "je me dépêche de démarrer" is rational: every year of delay is a year of the relief window
  burned. But the urgency is aimed at the wrong risk. The relief is worth 972 M (or, on the
  grande-entreprise reading, roughly double). The 583 M June financing peak he has not mentioned is
  the thing that can actually stop the plant, and hurrying to start does nothing about it.

  ================================================================================
  9. TWO MATERIAL ITEMS CARRIED AS SEPARATE COLUMNS RATHER THAN BURIED
  ================================================================================

  (a) THE TEN-YEAR ZONE B READING — tax_zoneB_ge, fcff_zoneB_ge. If he is (or is reclassified as) a
      grande entreprise, the Zone B catégorie-1 relief is 100% over ten years, so the holiday runs
      2027-2036 and tax, patente and CCE all switch on in 2037 — the same year as the equipment
      renewal, compounding both hits into a single period. Cumulative FCFF 10 259 115 203.20.

  (b) THE PROCESSING SUBSIDY — subsidy_processing, fcff_with_subsidy. Côte d'Ivoire pays processors
      a transformation incentive of 400 XOF per kg of kernel processed and exported (equivalently
      80 XOF per kg of RCN), sized on the official Vietnam-Côte d'Ivoire competitiveness gap. On
      440 000 kg that is 176 000 000 XOF/yr — comparable to the entire capex, every single year. It
      is a subvention d'exploitation and is taxable, so it is worth 176 M during the holiday and
      132 M after.

      I EXCLUDE it from the base and carry it separately, for stated reasons: it is a discretionary
      budget line, not a statutory entitlement; total state support to the sector is of the order of
      10 bn XOF/yr against a processing base that reached 344 000 t in 2024, so the envelope is thin
      relative to the entitlement; and national processors have publicly petitioned for renewal of
      the 2022 framework and compensation for supply failures, reporting that the associated
      stock d'amorçage arrives in May when buying is already over. Booking it in the base would be
      modelling a hope. Excluding it silently would hide the largest single upside in the project.
      Its receivability, and the collection lag on a government receivable, are the second question
      to put to him after the grade mix.


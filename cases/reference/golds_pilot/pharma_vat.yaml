passage: |
  ============================================================================
  1. WHAT IS BEING MODELLED, IN THE BUSINESS'S OWN QUANTITIES
  ============================================================================
  This is a pharmaceutical wholesaler ("grossiste en médicaments") in Dakar. The physical operation
  is: buy medicines from importers/laboratories, hold them in a temperature-controlled depot, and run
  refrigerated vans out to dispensaries. The founder's own natural quantities are therefore:

    - the OFFICINE served ("je livre à peu près quatre-vingts officines") — the customer unit;
    - the PURCHASE FRANC — because the trading margin is struck on cost, not on price
      ("ce que j'achète cent, je le revends cent douze");
    - the DELIVERY ROUND run by the two vans — the distribution unit;
    - the DEPOT-MONTH of continuous refrigeration ("le froid qui tourne jour et nuit") — the reason
      the electricity line is a fixed, volume-insensitive cost rather than a variable one.

  I keep these and do not invent SKUs, cartons or pallets: the founder never mentions them, and the
  economics of the business are fully determined by the margin-on-cost and the fixed depot/fleet
  overhead. The one place where the natural description does not map onto a standard line item is
  the VAT: for an exempt trader there is no "TVA collectée / TVA déductible" pair on the balance
  sheet at all — the input tax never becomes a receivable, it dies inside the cost it attaches to.
  I keep it visible as its own line rather than silently burying it.

  Per officine, per year:
    revenue per officine        = 600,000,000 / 80        = 7,500,000
    purchases per officine      = 535,714,285.71 / 80     = 6,696,428.57
    trading margin per officine = 7,500,000 - 6,696,428.57 =   803,571.43

  Delivery capacity cross-check (ASSUMED frequency and working days):
    delivery-stops per year = 80 officines x 52 weekly rounds = 4,160
    van-days available      = 2 vans x 250 working days       =   500
    stops per van-day       = 4,160 / 500                     =  8.32
  Eight-and-a-third stops per van-day is an unremarkable urban round. The stated fleet is therefore
  consistent with the stated customer base, and no growth capex is needed to carry the stated volume.

  ============================================================================
  2. GRID AND HORIZON
  ============================================================================
  Annual periods, t = 0 the current trading year, ten periods (t = 0 ... t = 9). Ten years is the
  natural horizon because it is exactly one full life of the primary asset, the cold-chain fit-out.
  The incumbent fit-out is already 3 years old, so the horizon spans its remaining 7 years plus the
  first 3 years of its successor, and it also captures two complete refrigerated-van replacement
  events. A shorter cut would show the business consuming its cold chain without ever paying to
  renew it; that is the classic way an asset-heavy distributor is made to look more cash-generative
  than it is.

  Prices, volumes and the customer base are held flat in real terms across the ten years: the founder
  gives one level of turnover, one margin, one set of monthly costs, and no growth statement, and the
  depot/fleet as described has no headroom for a materially larger book without further capex
  (ASSUMED — no growth, no inflation; a constant-price model).

  ============================================================================
  3. TRADING MARGIN: REVENUE, PURCHASES, GROSS PROFIT
  ============================================================================
  The margin is on COST, not on price. "Ce que j'achète cent, je le revends cent douze" fixes
      selling price = 1.12 x purchase cost.
  So turnover of 600,000,000 corresponds to goods bought for

      COGS = 600,000,000 / 1.12 = 535,714,285.714285714... = 3,750,000,000 / 7

  and the gross trading margin is

      gross profit = 600,000,000 - 535,714,285.714285714 = 64,285,714.285714286 = 450,000,000 / 7

  which is 10.714% of turnover — the correct restatement of a 12% mark-up on cost. Treating the 12%
  as a margin on SALES would overstate gross profit by 7,714,285.71 a year; the founder pre-empted
  exactly that error with his hundred/hundred-and-twelve illustration.

  With inventory held flat (steady state, section 8), purchases in each period equal COGS in that
  period, so the 535,714,285.71 is simultaneously the cost of goods sold and the annual purchase
  volume on which the mark-up is earned.

  No VAT arises anywhere in this block. The goods are exempt on sale ("je ne facture aucune TVA aux
  pharmacies") and, the exemption attaching to the product itself, they are exempt on purchase too —
  which is why the founder's list of VAT-bearing inputs (rent, electricity, fuel, maintenance,
  equipment) pointedly does not include the medicines.

  ============================================================================
  4. OPERATING COSTS, ANNUALISED FROM THE MONTHLY FIGURES
  ============================================================================
  Payroll (no VAT — wages are outside the scope of the tax):
      8 employees x 110,000 x 12 months                       = 10,560,000

  VAT-bearing services (quoted HT — see the flag in inputs):
      depot rent          1,200,000 x 12                      = 14,400,000
      fuel + maintenance    200,000 x 12                      =  2,400,000
      electricity           700,000 x 12                      =  8,400,000
                                                     subtotal = 25,200,000

  ============================================================================
  5. THE VAT WEDGE ON OPERATING COSTS
  ============================================================================
  This is the founder's whole point, and it has to be modelled, not waved at. Because every sale is
  exempt, the deductible proportion of input VAT is nil: "je ne peux pas la récupérer, justement
  parce que mes ventes sont exonérées. Elle reste chez moi, elle devient un coût sec." Under the
  matching principle, irrecoverable input tax is not a tax asset — it is part of the cost of the
  service it was charged on, and is expensed with it.

      irrecoverable input VAT on opex = 25,200,000 x 0.18     =  4,536,000

      total cash operating cost = 10,560,000 + 25,200,000 + 4,536,000 = 40,296,000

  A model that let him reclaim that VAT would show operating costs of 35,760,000 and would carry a
  4,536,000 VAT receivable that in reality does not exist. Note also what is ABSENT from the balance
  sheet as a result: there is no "TVA à décaisser" and no "crédit de TVA" working-capital line at
  all, because he collects none and reclaims none. For a normal taxable wholesaler that pair would be
  a real working-capital item; here it is structurally zero.

  EBITDA:
      64,285,714.285714286 - 40,296,000 = 23,989,714.285714286
  i.e. a 4.00% EBITDA margin on turnover — thin, as wholesale distribution is, and of which the
  irrecoverable VAT alone consumes 4,536,000.

  ============================================================================
  6. THE CAPITAL BASE, GROSSED UP FOR IRRECOVERABLE VAT
  ============================================================================
  "Et sur le matériel aussi : ... la TVA que j'ai payée dessus, je ne l'ai jamais récupérée non
  plus." Non-refundable purchase taxes form part of the cost of an item of property, plant and
  equipment (IAS 16.16(a)). So the depreciable base is the VAT-inclusive amount, and the VAT is
  recovered — economically — only slowly, through the depreciation charge:

      cold-chain fit-out : 45,000,000 x 1.18 = 53,100,000 capitalised, 10-year life
                           annual depreciation = 53,100,000 / 10 = 5,310,000
                           (of which 810,000 a year is irrecoverable VAT)

      two refrigerated vans: 18,000,000 x 1.18 = 21,240,000 capitalised, 6-year life
                           annual depreciation = 21,240,000 / 6 = 3,540,000
                           (of which 540,000 a year is irrecoverable VAT)

      total depreciation = 5,310,000 + 3,540,000 = 8,850,000 per year, every year of the grid,
      because both assets are replaced the moment they are exhausted.

  Straight-line, nil residual, full-year charge in the year of acquisition, replacement placed in
  service at the start of the period in which the predecessor is exhausted (DEFAULTED conventions).

  Opening net book values at the start of t = 0:
      cold chain : 53,100,000 x (10 - 3)/10 = 37,170,000   [3 years already run]
      vans       : 21,240,000 x ( 6 - 3)/ 6 = 10,620,000   [van age ASSUMED = 3]
      total PPE  =                            47,790,000

  Replacement schedule that follows arithmetically:
      cold chain — 7 years of charge left, so t=0..t=6 exhaust it; NBV hits zero at the end of t=6;
                   renewal capex of 53,100,000 at t=7; the successor then depreciates t=7, t=8, t=9
                   and ends the grid with NBV = 53,100,000 x 7/10 = 37,170,000.
      vans       — 3 years of charge left, so t=0..t=2 exhaust them; renewal of 21,240,000 at t=3;
                   that fleet runs its full six years t=3..t=8; second renewal of 21,240,000 at t=9,
                   ending the grid with NBV = 21,240,000 x 5/6 = 17,700,000.

  VAT content of the capex, kept visible:
      t=3 : 18,000,000 HT + 3,240,000 VAT = 21,240,000 cash out
      t=7 : 45,000,000 HT + 8,100,000 VAT = 53,100,000 cash out
      t=9 : 18,000,000 HT + 3,240,000 VAT = 21,240,000 cash out

  Total irrecoverable VAT running through the P&L each year:
      4,536,000 (opex) + 1,350,000 (inside depreciation) = 5,886,000 a year.
  Set against an EBIT of 15,139,714 that is the single largest identifiable drag in the model: the
  business would earn 21,025,714 of EBIT if it could deduct its input tax like a taxable trader.

  ============================================================================
  7. EBIT, TAX AND NOPAT
  ============================================================================
      EBIT   = 23,989,714.285714286 - 8,850,000 = 15,139,714.285714286  (= 105,978,000 / 7)
      tax    = 15,139,714.285714286 x 0.30      =  4,541,914.285714286
      NOPAT  = 15,139,714.285714286 x 0.70      = 10,597,800.000000000  (exactly)

  The tax is computed on EBIT, unlevered: no borrowing is mentioned anywhere in the utterance, so
  there is no interest and no tax shield to strip out. The irrecoverable VAT is deductible for
  corporate income tax purposes precisely because it has been absorbed into cost — into the service
  expense for the opex portion, into depreciation for the equipment portion — so no separate
  add-back or disallowance is required. Cash tax is assumed settled in the year it accrues.

  Identical in every period, since revenue, costs and total depreciation are all flat.

  ============================================================================
  8. WORKING CAPITAL
  ============================================================================
  The founder says nothing about stock cover, customer terms or supplier terms. For a wholesaler
  these are the largest balance-sheet items, so they must be sized rather than ignored — but sized
  honestly, as flagged priors, with the questions recorded (see inputs).

      inventory   = 535,714,285.714286 x 30/365 = 44,031,311.154599
      receivables = 600,000,000.000000 x 45/365 = 73,972,602.739726
      payables    = 535,714,285.714286 x 45/365 = 66,046,966.731898
      net working capital = 44,031,311.154599 + 73,972,602.739726 - 66,046,966.731898
                          = 51,956,947.162427

  The business is an established going concern already trading at 600,000,000 a year, so this
  balance is already funded at the opening of t = 0: the opening NWC equals the t = 0 closing NWC.
  With flat turnover, flat purchases and unchanged terms, the balance does not move:

      delta NWC = 0 in every period, t = 0 through t = 9.

  This is a real result, not a shortcut: in a flat, no-inflation book the level of working capital
  affects the value of the enterprise only through the capital that had to be sunk before the
  forecast starts, not through the forecast's free cash flow. Only the LEVEL is prior-dependent; the
  FLOW is zero regardless of which day-counts one chooses, so the assumed days do not contaminate
  FCFF. The one small item deliberately left out is the VAT-inclusive element of trade payables on
  rent/utilities, which is immaterial against a 51,956,947 balance and would in any case be constant.

  ============================================================================
  9. FCFF, PERIOD BY PERIOD
  ============================================================================
  FCFF = NOPAT + D&A - delta NWC - capex, with the operating half constant at

      CFO = 10,597,800 + 8,850,000 - 0 = 19,447,800 in every one of the ten periods,

  and all the variation coming from the investing half.

    t=0  cold chain year 4/10, vans year 4/6. No capex.
         19,447,800 - 0 = 19,447,800.   Closing PPE 31,860,000 + 7,080,000 = 38,940,000.
    t=1  no capex. 19,447,800.          Closing PPE 26,550,000 + 3,540,000 = 30,090,000.
    t=2  no capex. 19,447,800.          Vans fully written off: PPE 21,240,000 + 0 = 21,240,000.
    t=3  VAN REPLACEMENT. Cash out 18,000,000 HT + 3,240,000 irrecoverable VAT = 21,240,000.
         19,447,800 - 21,240,000 = -1,792,200.  Closing PPE 15,930,000 + 17,700,000 = 33,630,000.
    t=4  no capex. 19,447,800.          Closing PPE 10,620,000 + 14,160,000 = 24,780,000.
    t=5  no capex. 19,447,800.          Closing PPE  5,310,000 + 10,620,000 = 15,930,000.
    t=6  no capex. 19,447,800.          Cold chain fully written off: PPE 0 + 7,080,000 = 7,080,000.
    t=7  COLD-CHAIN REPLACEMENT. Cash out 45,000,000 HT + 8,100,000 irrecoverable VAT = 53,100,000.
         19,447,800 - 53,100,000 = -33,652,200. Closing PPE 47,790,000 + 3,540,000 = 51,330,000.
    t=8  no capex. 19,447,800.          Vans exhausted again: PPE 42,480,000 + 0 = 42,480,000.
    t=9  SECOND VAN REPLACEMENT, 21,240,000 all-in.
         19,447,800 - 21,240,000 = -1,792,200.  Closing PPE 37,170,000 + 17,700,000 = 54,870,000.

  Ten-year total FCFF = 7 x 19,447,800 - 1,792,200 - 1,792,200 - 33,652,200 = 98,898,000,
  an average of 9,889,800 a year, or 1.65% of turnover. Cross-check by conservation:
      sum NOPAT 105,978,000 + sum D&A 88,500,000 - sum delta NWC 0 - sum capex 95,580,000
      = 98,898,000. Agrees.
  And the PPE roll closes: 95,580,000 of capex less 88,500,000 of depreciation is a 7,080,000 rise
  in net PPE, which is exactly 54,870,000 - 47,790,000.

  Two features of the result deserve to be said plainly. First, the headline 19,447,800 of annual
  operating cash flow is not the business's earning power: averaged over a full asset cycle the
  replacement of the cold chain and the fleet takes half of it. Second, the exemption the founder
  is nominally a beneficiary of is, for him, a cost: it strips the input tax on his rent, power,
  fuel, maintenance and equipment of any deductibility, and because he cannot add it to a price that
  is set by a 12% mark-up convention, it lands entirely on his own margin.


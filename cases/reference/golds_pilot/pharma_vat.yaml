id: dakar-pharma-wholesaler-exempt-vat-fcff-v1
title: "Grossiste pharmaceutique, Dakar — unlevered FCFF with irrecoverable input VAT (exempt supplies)"
currency: XOF
grid:
  periods: 10
  freq: annual

utterance:
  fr: >-
    Je suis grossiste en médicaments à Dakar. J'approvisionne les pharmacies de la région — je livre
    à peu près quatre-vingts officines. Je fais dans les six cents millions de chiffre d'affaires par
    an et je travaille sur une marge de douze pour cent sur le prix d'achat : ce que j'achète cent,
    je le revends cent douze. J'ai un dépôt sous température contrôlée que j'ai équipé pour
    quarante-cinq millions il y a trois ans — les chambres froides et les groupes, ça dure dix ans.
    J'ai deux camionnettes réfrigérées achetées ensemble dix-huit millions, elles font six ans. Huit
    employés à cent dix mille par mois, le dépôt à un million deux cent mille par mois de loyer, le
    carburant et l'entretien des camionnettes deux cent mille par mois, et l'électricité — avec le
    froid qui tourne jour et nuit — sept cent mille par mois. Voilà ma difficulté avec la TVA : les
    médicaments essentiels sont exonérés, donc je ne facture aucune TVA aux pharmacies. Mais la TVA
    que moi je paie sur le loyer du dépôt, sur l'électricité, sur le carburant, sur l'entretien —
    celle-là je ne peux pas la récupérer, justement parce que mes ventes sont exonérées. Elle reste
    chez moi, elle devient un coût sec. Et sur le matériel aussi : quand j'ai acheté les chambres
    froides et les camionnettes, la TVA que j'ai payée dessus, je ne l'ai jamais récupérée non plus.
  en: >-
    I am a pharmaceutical wholesaler in Dakar. I supply the pharmacies of the region — I deliver to
    roughly eighty dispensaries. I do around six hundred million in turnover a year and I work on a
    twelve percent margin on the purchase price: what I buy at a hundred, I resell at a hundred and
    twelve. I have a temperature-controlled warehouse that I fitted out for forty-five million three
    years ago — the cold rooms and the compressor units last ten years. I have two refrigerated vans
    bought together for eighteen million, they last six years. Eight employees at a hundred and ten
    thousand a month, the warehouse at one million two hundred thousand a month in rent, fuel and
    maintenance of the vans two hundred thousand a month, and electricity — with the refrigeration
    running day and night — seven hundred thousand a month. Here is my difficulty with VAT: essential
    medicines are exempt, so I charge no VAT to the pharmacies. But the VAT that I myself pay on the
    warehouse rent, on electricity, on fuel, on maintenance — that one I cannot reclaim, precisely
    because my sales are exempt. It stays with me, it becomes a dead cost. And on the equipment too:
    when I bought the cold rooms and the vans, the VAT I paid on them, I never reclaimed that either.


notes:
  - "The margin is on COST. 'Ce que j'achète cent, je le revends cent douze' fixes revenue = 1.12 x purchases, so COGS = revenue/1.12 and the gross margin is 10.714% of turnover, not 12%. Reading the 12% as a margin on sales is the single most likely way to get this business wrong, and the founder pre-empted it."
  - "Central judgment call — the quoted amounts are treated as VAT-exclusive (HT), with the irrecoverable VAT added on top. The founder's own framing supports this: he describes the VAT as something he pays in addition ('la TVA que moi je paie sur le loyer', 'la TVA que j'ai payée dessus') and as a cost that 'reste chez moi'. If in fact he quotes TTC figures, every VAT-bearing cost and both asset bases here are overstated, and FCFF is understated in the direction of too little cash. This is the first question to put to him."
  - "The exemption is a burden, not a benefit, for this taxpayer. Because output is exempt, the deductible proportion of input tax is nil, so input VAT is absorbed into the cost of the thing it was charged on: into the expense for rent, power, fuel and maintenance (matching), and into the cost of the asset for the cold rooms and vans (IAS 16.16(a), non-refundable purchase taxes). It is then deductible for corporate income tax only through those costs, which is why no separate tax add-back appears. Both channels are materialised as their own trace rows."
  - "A structural consequence worth flagging separately: there is no VAT working-capital line on this balance sheet at all — no output VAT payable and no input VAT credit receivable. A generic wholesale template would create both and would show a recurring VAT credit asset that this business can never realise."
  - "The medicines themselves carry no input VAT. The exemption attaches to the product, so the goods are exempt when bought as well as when sold, and the founder's own enumeration of VAT-bearing inputs excludes them. No gross-up is applied to COGS."
  - "The van vintage is not stated — only the depot fit-out is dated. I have assumed the fleet was acquired with the depot as one set-up, which places van replacements at t=3 and t=9. Wages, prices and the asset costs are unaffected; only the timing of van capex moves if this is wrong, and with it the shape (not the total) of the cash-flow profile."
  - "Working capital is sized on assumed day-counts because none were given, but the assumption does not contaminate FCFF: the business is already trading at scale, turnover and terms are flat, so the balance does not move and delta NWC is zero throughout. Only the pre-forecast capital sunk into stock and customer credit is prior-dependent, and that is outside the FCFF array."
  - "Horizon deliberately set at one full cold-chain life. Cutting the forecast before t=7 would show the business consuming its refrigeration capacity without ever renewing it — the standard way an asset-heavy distributor is made to look more cash-generative than it is. Two van cycles and one cold-chain cycle are captured."
  - "No terminal value, no discounting, and no disposal proceeds are recognised. Residual PPE remains on the books at the end of the grid; the founder said nothing about resale of used cold rooms or vans, and a secondary market for either would raise the final period's cash flow."
  - "Senegal levies a minimum corporate tax assessed on turnover, which can override the profit-based computation when margins are thin. On the profitability derived here the ordinary profit-based computation is the governing one, so no floor is modelled; it would matter if the trading margin or the volume assumption weakened."
  - "Not modelled, and not mentioned by the founder — cold-chain product losses (expiry, breakage, temperature excursions), which in pharmaceutical distribution are a real deduction from a 12% mark-up; insurance on stock and vehicles; a pharmacien responsable or licence cost; and any bad-debt experience on the 80 dispensary accounts. Each of these would reduce FCFF. ELICIT: 'quel pourcentage de la marchandise perdez-vous par an (péremption, casse, rupture de froid) ?' and 'avez-vous des impayés sur les officines ?'"
  - "No debt appears anywhere in the utterance, so the unlevered build needs no interest strip-out and NOPAT equals net operating profit after tax as computed. If the depot fit-out or the vans were in fact financed, the asset-side numbers here are unchanged but the equity-side picture is not."
  - "Growth is held at zero in real terms. The founder gives one level of turnover and no trajectory, and the stated fleet and depot have limited headroom: the delivery-capacity cross-check puts the vans at roughly eight stops per van-day, comfortable today, but a materially larger book would require capex not contemplated here."

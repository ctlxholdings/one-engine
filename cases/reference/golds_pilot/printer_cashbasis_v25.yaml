notes:
  - >-
    THE CENTRAL FINDING, AND IT IS ABOUT TWO DIFFERENT OBJECTS. The founder states as a fact about
    his business that the administration taxes him on collections less disbursements, and that his
    accountant calls this comptabilite de tresorerie. I have recorded that faithfully and modelled it
    in full. Separately, the following are facts about the world, each verified on 2026-07-27 and
    carried in `inputs` with its authority: at 48,000,000 of annual billings he sits inside the
    regime du reel simplifie d'imposition, whose band runs from 15,000,000 to 50,000,000; RSI
    taxpayers file SYSCOHADA financial statements and are not authorised to invoice VAT; the
    Burkinabe CGI brings into charge profits arising from creances acquises et non encore recouvrees
    and refuses deduction for sommes engagees pour l'acquisition des immobilisations, allowing only
    amortissement; and the OHADA systeme minimal de tresorerie, the only cash-based accounting system
    in the SYSCOHADA framework, is closed by AUDCIF art. 13 to entities whose annual receipts exceed
    40,000,000 for artisanal activity. I searched for and did not find any Burkinabe provision
    authorising a cash determination of IBICA for a taxpayer of his size. I therefore run the law as
    the base case and materialise his description as the *_cashbasis rows. I am not asserting that
    his accountant is wrong about what has been filed; I am asserting that what he describes is not
    what the instruments I checked provide, and that the gap is a live exposure rather than a
    modelling nicety.
  - >-
    THE BELIEF IS NOT MERELY WRONG, IT IS WRONG IN THE UNFAVOURABLE DIRECTION -- and this is
    materialised in the trace, not asserted in prose. Over the horizon the two tax bases differ only
    by depreciation taken against capex deducted, so the founder's basis produces the HIGHER lifetime
    tax and the LOWER lifetime FCFF. The deferral he believes he enjoys exists only while the
    receivable book is growing; on his own testimony it is not growing -- "toujours a peu pres
    douze". Direction, for a reader who wants the intuition: a cash basis rewards a business that is
    still building its receivable and still buying machines, and punishes one that has finished doing
    both and is living off assets already paid for. He is the second kind.
  - >-
    THE TRANSIENT HE ACTUALLY FEARS IS NOT IN THIS MODEL. "L'annee ou ils me reglent tout d'un coup,
    je prends l'impot en pleine figure" describes a collapse in the receivable stock, which under a
    cash basis would spike one year's taxable income and, under either basis, would deliver a large
    one-off cash inflow. Nothing in the utterance dates it, sizes it, or says whether it has ever
    happened. I have neither modelled it nor smoothed it away. Direction only: a year in which the
    stock falls releases cash and, on his stated basis, raises that year's tax; the following year
    reverses on both counts. The prerequisite for modelling it is a receivable ageing schedule, which
    is an interview question, not an assumption.
  - >-
    THE BASE CASE IS SYSTEMATICALLY OPTIMISTIC AND THE READER SHOULD KNOW WHICH WAY. Five cost lines
    are carried at zero because the founder did not name them -- consumables and maintenance, other
    overheads, bought-in work, replacement of his own labour, bad debt -- and the revenue line runs
    at his self-described GOOD year. Every one of those choices, if corrected, moves FCFF down. None
    moves it up. The three highest-materiality questions in `inputs` are, in order: what a normal
    (not good) year bills; what basis the DGI has actually assessed him on; and what he spends
    annually on plates, chemicals, spares and repairs. If the founder will answer only three
    questions, those are the three.
  - >-
    HE IS SITTING ON A REGIME CLIFF. At 48,000,000 he is roughly 4% below the 50,000,000 line
    separating the RSI from the regime du reel normal. Crossing it -- one good donor contract --
    changes four things at once: mandatory SYSCOHADA systeme normal, monthly rather than quarterly
    filing, a minimum forfaitaire floor more than three times higher, and entry into the VAT net,
    which means charging output VAT to school and NGO buyers who are highly price-sensitive and
    frequently exempt on donor-funded procurement, in exchange for recovering input VAT on paper.
    Direction only: the recovery of input VAT is a real gain against a real commercial risk on price,
    and the net sign depends on facts about his customers' VAT status that are not in the utterance.
    This cliff is a second reason, alongside the absence of any growth statement, why the model
    projects flat billings rather than growth.
  - >-
    A CONSEQUENCE OF RSI STATUS THAT IS EASY TO DOUBLE-COUNT. Because he can neither charge nor
    recover VAT, his 48,000,000 of billings carries no output VAT and his stated 40% paper-and-ink
    ratio is already a VAT-inclusive cash cost. Neither figure should be grossed up. Part of the
    reason his materials ratio looks high for a jobbing printer is precisely that it contains
    irrecoverable input VAT.
  - >-
    WITHHOLDING AT SOURCE CUTS AGAINST HIS OWN STORY. His customer base -- schools, NGOs, donor
    projects -- consists of debtors established in Burkina Faso, who withhold on payments to
    registered providers and remit the withholding as an advance creditable against the profits tax.
    At annual frequency it nets to zero and it touches no line of FCFF; the model materialises it
    only to assert that it is fully absorbed by the liability rather than stranding him in permanent
    credit. Its analytical significance is qualitative: a meaningful slice of his profits tax is
    already collected at the moment each client pays, so slow payment defers rather less of his tax
    than he believes. A friction I have not resolved: whether printed exercise books delivered to
    specification are a prestation de services (withheld) or a sale of manufactured goods (treated
    differently) is a characterisation question I could not settle from public sources, and the
    absorption check above is a bound, not a determination.
  - >-
    THE VOLUME BUILD I COULD NOT DO. A print shop's natural quantities are impressions, sheets, run
    lengths and square metres, priced per thousand and constrained by press hours. The founder gave
    none of these -- only a single value ratio. So the operating layer here is a value build, and it
    carries two blind spots that a volume build would close: I cannot test whether two presses can
    physically deliver 48,000,000 of work in a year, and I cannot distinguish a bad year caused by
    fewer jobs from one caused by thinner margins on the same jobs. The question that would open this
    up -- how many impressions the offset ran last year and what he charges per thousand -- is worth
    asking alongside the three ranked in `inputs`, and I have deliberately not invented a sheet count
    or an impression rate to fill the hole.
  - >-
    AN INCONSISTENCY IN HIS OWN PRODUCT LIST, WHICH BECAME A QUESTION. He sells baches -- wide-format
    PVC banners -- but names only a sheet-fed offset press and a small digital press, neither of which
    prints PVC. Either there is a machine he did not mention or that work is bought in, and if it is
    bought in there is a cost sitting outside the 40% paper-and-ink ratio. Carried at zero and
    elicited rather than assumed, because he plainly holds the answer.
  - >-
    DEPRECIATION LIVES ARE HIS, NOT THE TAX CODE'S. The Burkinabe CGI allows amortissements computed
    by reference to the usages of each industry rather than a published statutory rate table for
    printing plant, with a degressif option available on qualifying equipment. I have therefore used
    the founder's own ten-year and five-year lives on a straight-line basis and named the convention
    rather than sourcing a rate I could not find. Direction only: a degressif election would
    front-load the deduction and shift tax between periods within the horizon without changing the
    lifetime total materially, since both machines reach nil book value inside the window either way.
  - >-
    OWNER'S LABOUR AND OWNER'S DRAWINGS ARE TWO DIFFERENT THINGS AND BOTH ARE ABSENT. The FCFF above
    is asset-side and pre-distribution, so drawings are correctly excluded; but the founder's own
    labour as the printer is a genuine operating input carried at zero, which flatters the number
    against a third-party operator. I have materialised the replacement cost as a zero-valued elicited
    line rather than a note, so a reader can switch it on. A separate wrinkle worth flagging: an
    individual entrepreneur's own drawings are not deductible for IBICA in any case -- the profit IS
    his income -- so the tax line above would be unaffected by what he pays himself, whereas a salary
    to a hired manager would be deductible.
  - >-
    WHAT I DELIBERATELY DID NOT MODEL. No leverage (none described, and the build is unlevered by
    construction). No growth (no growth statement in the utterance, and the 50,000,000 regime cliff
    makes casual growth a materially different business). No inflation (constant-price convention,
    named; the resulting stream is real and requires a real discount rate). No terminal value (the
    horizon is chosen so both machines end at nil book value). No IUTS: the wage tax on salaries is
    withheld from the employee, not borne by the employer, and does not belong in this cost stack.
    No CNSS employee share, for the same reason.

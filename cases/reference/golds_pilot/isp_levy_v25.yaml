checks:
  - "grid.periods == asset_life_years - asset_age_years"
  - "replacement_period_index == grid.periods - 1"
  - "trace.subscribers_end[t] == trace.subscribers_end[t-1] + trace.subscribers_opening[t] + trace.subscribers_added[t]"
  - "sum(trace.subscribers_opening) == subscribers_today"
  - "trace.subscribers_added == net_adds_per_year"
  - "trace.subscribers_avg == trace.subscribers_end - trace.subscribers_added / 2"
  - "trace.subscribers_end[t] >= 0"
  - "trace.revenue == trace.subscribers_avg * subscription_price_monthly * months_per_year"
  - "trace.bandwidth_cost == bandwidth_cost_monthly * months_per_year"
  - "trace.technician_cost == technicians * technician_wage_monthly * months_per_year"
  - "trace.premises_cost == premises_cost_monthly * months_per_year"
  - "trace.opex == trace.bandwidth_cost + trace.technician_cost + trace.premises_cost"
  - "trace.ebitda == trace.revenue - trace.opex"
  - "trace.depreciation == network_cost / asset_life_years"
  - "sum(trace.nbv_opening) == network_cost - asset_age_years * (network_cost / asset_life_years)"
  - "trace.nbv[t] == trace.nbv[t-1] + trace.nbv_opening[t] + trace.capex[t] - trace.depreciation[t]"
  - "trace.nbv[last] == sum(trace.nbv_opening) + sum(trace.capex) - sum(trace.depreciation)"
  - "trace.nbv[t] >= 0"
  - "trace.capex == 0 for t < replacement_period_index"
  - "trace.capex == replacement_capex for t >= replacement_period_index"
  - "trace.ebit == trace.ebitda - trace.depreciation"
  - "trace.regulatory_fee == regulatory_fee_rate * trace.revenue"
  - "trace.regulatory_fee[t] >= 0"
  - "trace.taxable_profit == trace.ebit - trace.regulatory_fee"
  - "trace.corporate_tax == is_rate * (trace.ebit - trace.regulatory_fee)"
  - "trace.corporate_tax[t] >= 0"
  - "trace.corporate_tax >= imf_rate * trace.revenue"
  - "trace.total_levies == trace.regulatory_fee + trace.corporate_tax"
  - "trace.nopat == trace.ebit - trace.total_levies"
  - "trace.nopat == trace.taxable_profit - trace.corporate_tax"
  - "trace.revenue >= is_regime_threshold_xof"
  - "trace.nwc == trace.subscribers_end * subscription_price_monthly * receivable_months"
  - "trace.nwc[t] >= 0"
  - "trace.delta_nwc == net_adds_per_year * subscription_price_monthly * receivable_months"
  - "cumsum(trace.delta_nwc) == trace.nwc - opening_nwc"
  - "opening_nwc == subscribers_today * subscription_price_monthly * receivable_months"
  - "trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex"

notes:
  - >-
    LE POINT LE PLUS IMPORTANT DE CE DOSSIER — LA DIVERGENCE ENTRE CE QUE LE FONDATEUR CROIT ET CE
    QUE LA REGLE DIT. Le fondateur decrit "deux prelevements empiles : un sur le chiffre d'affaires,
    un sur le benefice", et un seul prelevement sur le chiffre d'affaires. Ce sont deux objets
    distincts et il faut les tenir separes. Fait sur son entreprise : il croit verser une redevance
    de regulation au regulateur. Fait sur le monde, verifie le 2026-07-27 : au Mali, un titulaire de
    licence d'exploitation d'un reseau de telecommunications ouvert au public supporte la TARTOP,
    assise sur son chiffre d'affaires, dont 1 % seulement revient a l'AMRTP — le reste allant au
    Tresor et au fonds d'acces universel — et le total a ete porte a dix points par la decision du
    Conseil des ministres du 5 fevrier 2025. S'ajoute une contribution generale de solidarite de
    0,5 % du chiffre d'affaires hors taxes due par les entreprises soumises a l'IS. Le cas de base
    modelise ce que le fondateur decrit, au taux qui correspond effectivement a la description qu'il
    en fait ; il ne modelise pas ce que la loi pourrait par ailleurs lui reclamer. La direction est
    sans ambiguite : si le perimetre reel de son prelevement sur chiffre d'affaires est plus large
    que ce qu'il croit, le FCFF de chaque periode est plus faible que ce tableau, et l'ecart croit
    avec le chiffre d'affaires. La question qui tranche est posee sous turnover_levy_scope et c'est
    la premiere a poser.
  - >-
    QUALITE DE LA SOURCE LA PLUS FAIBLE. Le taux de la redevance de regulation est le seul chiffre
    statutaire de cette derivation que je n'ai pas pu remonter jusqu'au texte reglementaire. La page
    "Decrets" de l'AMRTP ne sert aucune liste de documents exploitable. Le taux repose sur l'expose
    public de la repartition de la TARTOP par le ministre en charge du secteur, repris de maniere
    concordante par trois organes de presse maliens. Les autres chiffres statutaires — IS a 30 %,
    IMF a 1 % avec plancher de 763 500 F, seuils de regime, TVA a 18 % — proviennent des pages de la
    Direction generale des impots du Mali elle-meme. Un lecteur qui a acces au Journal officiel
    devrait fermer ce point avant d'utiliser le chiffre.
  - >-
    LE CAS DE BASE N'EST PAS CONSERVATEUR, ET C'EST DELIBERE. Sur les deux questions de plus forte
    materialite — le perimetre du prelevement sur chiffre d'affaires et la base TTC ou HT du prix de
    15 000 F — le cas de base retient la lecture litterale des mots du fondateur, qui est dans les
    deux cas la borne haute du FCFF. Ce choix a ete fait pour que le tableau reste une traduction
    fidele de ce qui a ete dit, et non un jugement substitue au sien ; mais il faut lire le
    resultat en sachant que les deux plus grosses incertitudes tirent dans le meme sens, vers le
    bas. Le FCFF presente est un plafond, pas un point median.
  - >-
    LA FRAGILITE STRUCTURELLE DU MODELE EST LE LEVIER D'EXPLOITATION, PAS LA FISCALITE. Le chiffre
    d'affaires croit de 59 % sur l'horizon pendant que les 60 240 000 F de charges d'exploitation ne
    bougent pas d'un franc, parce que l'enonce ne contient aucune charge variable au volume. Trois
    absences sont visibles a l'oeil nu et aucune n'est comblee par un prior silencieux : le forfait
    de capacite ne peut pas absorber 75 % d'abonnes en plus sans palier
    (capacity_headroom_subscribers) ; 150 raccordements par an ne peuvent pas etre gratuits alors
    que les routeurs figurent dans l'investissement initial (connection_cost_per_new_subscriber) ;
    six techniciens pour 2 100 abonnes contre 1 200 est un ratio qui se degrade. Le prelevement sur
    chiffre d'affaires que le fondateur presente comme "la particularite de mon metier" coute en
    realite 0,7 % du chiffre d'affaires net d'economie d'impot — il est vingt fois moins dangereux
    pour ce plan que la saturation de sa capacite.
  - >-
    FRICTION DE VOCABULAIRE ASSUMEE. Le fondateur dit "on change le materiel au bout de huit ans"
    d'un ensemble qui melange des antennes, de la fibre posee dans les immeubles et des routeurs.
    Ces trois familles n'ont pas la meme duree de vie : la fibre passive tient bien au-dela de huit
    ans, un routeur d'acces beaucoup moins. Le modele conserve la description naturelle du
    fondateur — un actif unique, une duree unique de huit ans — plutot que de decouper
    arbitrairement les 90 000 000 F en trois composantes dont les proportions ne sont pas connues.
    La friction est reelle et elle porte sur deux lignes : la dotation annuelle et le montant du
    remplacement. La question qui la resout est posee sous replacement_capex, qui demande
    explicitement s'il y a des elements qu'il ne changera pas.
  - >-
    POSTES EXAMINES ET LAISSES HORS DU TABLEAU, AVEC LEUR MOTIF. Dettes fournisseurs sur la bande
    passante : la charge etant strictement constante, tout delai de reglement produit un solde
    constant et donc une variation nulle a chaque periode — le poste deplacerait le niveau du besoin
    en fonds de roulement sans toucher au FCFF, il n'a donc pas fait l'objet d'une question. Patente
    professionnelle et taxe fonciere : dues au Mali mais non chiffrables sans connaitre la valeur
    locative du local, et non evoquees par le fondateur ; leur omission tire le FCFF vers le haut.
    Contribution speciale de solidarite instituee par l'ordonnance n°2025-007/PT-RM du 7 fevrier
    2025 : elle porte sur les recharges telephoniques et les transactions de monnaie electronique,
    supportees par le consommateur, et non sur un abonnement mensuel a l'internet fixe — elle a ete
    ecartee comme hors perimetre, mais la reponse a turnover_levy_scope devrait le confirmer. TVA
    deductible sur les 90 000 000 F d'investissement initial : hors horizon, l'operation date de
    deux ans.
  - >-
    CE QUE LE MODELE NE PEUT PAS DIRE. La sixieme periode contient un renouvellement complet de
    l'actif mais l'horizon s'arrete la : le tableau montre la facture sans montrer les annees
    d'exploitation qu'elle achete. Un lecteur qui veut une valeur d'entreprise et non un profil de
    flux doit ajouter une valeur terminale a partir de t=6, et cette valeur terminale depend de
    reponses que le fondateur n'a pas encore donnees — au premier chef celle sur la capacite, qui
    determine si le modele economique tient encore a 2 100 abonnes. Le chiffre de 898 668 000 F de
    FCFF cumule est un flux sur six ans, pas une valeur.

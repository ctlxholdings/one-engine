contract: "v2.5"
id: isp_levy_v25
title: "Fournisseur d'acces internet de quartier, Bamako — FCFF sans levier sur la duree de vie residuelle du reseau"
currency: XOF

grid:
  periods: 6
  freq: annual
  why: >-
    Six periodes annuelles, comptees a partir d'aujourd'hui.

    LA DUREE. Cette entreprise est un actif unique et indivisible — antennes, fibre, routeurs — pose
    en une seule fois pour 90 000 000 XOF et dont le fondateur dit lui-meme qu'il se change au bout
    de huit ans. Le reseau a deja deux ans. Il reste donc exactement six ans avant que la totalite
    de l'appareil productif doive etre repose. Six ans est le seul horizon qui fasse tenir un cycle
    d'actif complet a l'interieur de la fenetre : la valeur nette comptable part de 67 500 000 XOF
    et arrive a zero le dernier jour de la periode 6, et le remplacement — le plus gros mouvement de
    tresorerie de tout l'exercice — tombe dans la fenetre au lieu d'etre repousse dans une valeur
    terminale que personne ne verifierait. Un horizon plus court (trois ans, cinq ans) montrerait
    six annees de moisson sans jamais montrer la facture qui les rend possibles, et donnerait un
    FCFF cumule flatteur et faux. Un horizon plus long obligerait a inventer un second cycle : ce
    que le fondateur decide de faire en annee 7, s'il remplace, s'il agrandit, s'il vend, il ne l'a
    pas dit et ne peut pas encore le savoir. C'est le point ou la question cesse d'etre repondable.

    LA FREQUENCE. Le fondateur parle en mois pour ses charges (3 500 000 de bande passante, 120 000
    par technicien, 800 000 de local) mais toutes ces charges sont plates : une maille mensuelle
    n'ajouterait aucune information sur le cote couts. En revanche les deux evenements qui
    structurent le resultat sont annuels et le fondateur les nomme comme tels — le regulateur
    preleve "chaque annee" sa redevance, et il gagne "cent cinquante" abonnes de plus "chaque
    annee". L'impot sur les societes est lui aussi liquide sur un exercice. Une maille mensuelle
    obligerait a inventer un calendrier de versement de la redevance et des acomptes d'IS que
    l'enonce ne contient pas, et introduirait de la fausse precision dans la seule partie du modele
    ou le droit fiscal, et non l'exploitation, commande le rythme. L'annee est la maille naturelle
    de cette affaire.

utterance:
  fr: |
    Je suis fournisseur d'accès internet à Bamako — un petit opérateur de quartier. J'ai monté le
    réseau il y a deux ans : les antennes, la fibre jusqu'aux immeubles, les routeurs, ça m'a coûté
    quatre-vingt-dix millions au total, et ce genre de matériel on le change au bout de huit ans.
    J'ai aujourd'hui mille deux cents abonnés qui paient chacun quinze mille francs par mois, et
    j'en gagne à peu près cent cinquante de plus chaque année. La bande passante que j'achète en
    gros au grossiste national me coûte trois millions cinq cent mille par mois, quel que soit le
    nombre d'abonnés — c'est un forfait de capacité. J'ai six techniciens à cent vingt mille par
    mois, le local et le groupe électrogène me font huit cent mille par mois tout compris.
    Maintenant, la particularité de mon métier : le régulateur des télécoms prélève chaque année une
    redevance de régulation sur mon chiffre d'affaires — un pourcentage de tout ce que j'encaisse,
    que je sois bénéficiaire ou pas. Ça, c'est une charge que je peux déduire. Et après l'avoir
    payée, je paie encore l'impôt sur les sociétés sur le bénéfice qui reste. Donc j'ai deux
    prélèvements empilés : un sur le chiffre d'affaires, un sur le bénéfice.
  en: |
    I am an internet service provider in Bamako — a small neighbourhood operator. I built the network
    two years ago: the antennas, the fibre up to the buildings, the routers; it cost me ninety million
    in total, and that kind of equipment gets replaced after eight years. Today I have one thousand
    two hundred subscribers each paying fifteen thousand francs a month, and I gain roughly one
    hundred and fifty more every year. The bandwidth I buy wholesale from the national wholesaler
    costs me three million five hundred thousand a month, whatever the number of subscribers — it is
    a capacity package. I have six technicians at one hundred and twenty thousand a month, and the
    premises plus the generator come to eight hundred thousand a month all-in. Now, the peculiarity
    of my trade: the telecoms regulator levies every year a regulatory fee on my turnover — a
    percentage of everything I collect, whether I am profitable or not. That is a charge I can
    deduct. And after paying it, I still pay corporate income tax on the profit that remains. So I
    have two stacked levies: one on turnover, one on profit.

inputs:

  network_cost:
    value: 90000000
    unit: XOF
    prov: STATED
    source: >-
      "les antennes, la fibre jusqu'aux immeubles, les routeurs, ca m'a coute quatre-vingt-dix
      millions au total". Cout d'acquisition unique de l'ensemble du reseau.
    date: "2026-07-27"

  asset_life_years:
    value: 8
    unit: annees
    prov: STATED
    source: >-
      "ce genre de materiel on le change au bout de huit ans". Duree d'utilite retenue = cycle de
      remplacement enonce par le fondateur.
    date: "2026-07-27"

  asset_age_years:
    value: 2
    unit: annees
    prov: STATED
    source: '"J''ai monte le reseau il y a deux ans". Age du reseau a la date d''aujourd''hui, t=0.'
    date: "2026-07-27"

  subscribers_today:
    value: 1200
    unit: abonnes
    prov: STATED
    source: '"J''ai aujourd''hui mille deux cents abonnes".'
    date: "2026-07-27"

  subscription_price_monthly:
    value: 15000
    unit: XOF par abonne et par mois
    prov: STATED
    source: >-
      "mille deux cents abonnes qui paient chacun quinze mille francs par mois". Prix mensuel par
      abonne. Voir subscription_price_vat_basis pour la question de savoir si ce montant est un
      produit net ou un montant TTC.
    date: "2026-07-27"

  net_adds_per_year:
    value: 150
    unit: abonnes par an
    prov: STATED
    source: >-
      "j'en gagne a peu pres cent cinquante de plus chaque annee". Il s'agit d'un solde net : le
      verbe "gagner de plus" designe l'accroissement du parc, l'attrition est donc deja deduite.
    date: "2026-07-27"

  bandwidth_cost_monthly:
    value: 3500000
    unit: XOF par mois
    prov: STATED
    source: >-
      "La bande passante que j'achete en gros au grossiste national me coute trois millions cinq
      cent mille par mois, quel que soit le nombre d'abonnes — c'est un forfait de capacite".
      Charge fixe, sans composante variable au volume.
    date: "2026-07-27"

  technicians:
    value: 6
    unit: personnes
    prov: STATED
    source: '"J''ai six techniciens".'
    date: "2026-07-27"

  technician_wage_monthly:
    value: 120000
    unit: XOF par personne et par mois
    prov: STATED
    source: '"six techniciens a cent vingt mille par mois".'
    date: "2026-07-27"

  premises_cost_monthly:
    value: 800000
    unit: XOF par mois
    prov: STATED
    source: >-
      "le local et le groupe electrogene me font huit cent mille par mois tout compris". Le "tout
      compris" est explicite : carburant, entretien du groupe et loyer sont dedans.
    date: "2026-07-27"

  remaining_life_years:
    value: 6
    unit: annees
    prov: INFERRED
    source: >-
      asset_life_years - asset_age_years = 8 - 2 = 6. Deduction pure a partir de deux enonces du
      fondateur, aucune information nouvelle.
    date: "2026-07-27"

  replacement_period_index:
    value: 5
    unit: index de periode, base 0
    prov: INFERRED
    source: >-
      Le materiel se change au bout de huit ans et en a deja deux : le remplacement tombe a la fin
      de la 6e periode de l'horizon. En indexation base 0 la 6e periode porte l'index 5, soit
      grid.periods - 1. Deduit de asset_life_years, asset_age_years et grid.periods.
    date: "2026-07-27"

  opening_nwc:
    value: 18000000
    unit: XOF
    prov: INFERRED
    source: >-
      subscribers_today * subscription_price_monthly * receivable_months = 1 200 * 15 000 * 1 =
      18 000 000. Creances d'abonnement deja en circulation a t=0 : l'affaire tourne depuis deux
      ans, son besoin en fonds de roulement existe donc avant l'ouverture de la grille et seul
      l'increment entre dans le FCFF. Cet input herite de la valeur de travail ELICITED
      receivable_months.
    date: "2026-07-27"

  months_per_year:
    value: 12
    unit: mois par an
    prov: DEFAULTED
    source: "Convention de calendrier : un exercice annuel compte douze mois."
    date: "2026-07-27"

  depreciation_method:
    value: "lineaire sur la duree d'utilite, valeur residuelle nulle"
    unit: convention
    prov: DEFAULTED
    source: >-
      IAS 16.60 et 16.62 — le mode d'amortissement doit refleter le rythme de consommation des
      avantages economiques, et le mode lineaire s'applique lorsque ce rythme est uniforme. Un
      reseau de transmission rend un service sensiblement constant d'une annee sur l'autre, aucun
      element de l'enonce n'indique le contraire. Valeur residuelle nulle par IAS 16.6 en l'absence
      de tout produit de cession enonce — voir equipment_residual_value pour la question posee.
    date: "2026-07-27"

  subscriber_timing_convention:
    value: "arrivees uniformes dans l'annee — parc moyen = parc de fin moins la moitie des ajouts"
    unit: convention
    prov: DEFAULTED
    source: >-
      Convention de mi-periode. Le fondateur decrit un flux regulier d'arrivees ("a peu pres cent
      cinquante de plus chaque annee") et non un evenement date ; le chiffre d'affaires d'un
      exercice se calcule donc sur le parc moyen et non sur le parc de fin. Prendre le parc de fin
      surestimerait le produit, prendre le parc d'ouverture le sous-estimerait.
    date: "2026-07-27"

  capex_timing_convention:
    value: "capex comptabilise en fin de periode, amortissement demarrant a la periode suivante"
    unit: convention
    prov: DEFAULTED
    source: >-
      Convention de fin d'exercice. Le materiel de remplacement est mis en service le dernier jour
      de la periode 6 ; il ne porte donc aucune dotation dans l'horizon, et sa valeur nette
      comptable de cloture est egale a son cout.
    date: "2026-07-27"

  regulatory_fee_rate:
    value: 0.01
    unit: fraction du chiffre d'affaires
    prov: SOURCED
    authority: >-
      Part de 1 % du chiffre d'affaires affectee a l'AMRTP (Autorite malienne de regulation des
      telecommunications/TIC et des Postes) au sein de la TARTOP — Taxe sur l'acces au reseau des
      telecommunications ouvert au public, instituee par la loi de finances applicable depuis
      decembre 2012 et assise sur le chiffre d'affaires de "toute personne detenant une licence
      d'exploitation d'un reseau de telecommunications ouvert au public". Repartition officielle
      donnee par le ministre en charge du secteur : 5 % Tresor / 2 % AGEFAU (Agence de gestion du
      fonds d'acces universel, creee par l'ordonnance n°2016-001/P-RM du 26 janvier 2016 ratifiee
      par la loi n°2017-006 du 18 mai 2017) / 1 % AMRTP, soit 8 % au total ; la part Tresor a ete
      portee de 5 % a 7 % par decision du Conseil des ministres du 5 fevrier 2025, portant le total
      a 10 %. Expose gouvernemental de la repartition :
      https://www.horonyafinance.com/mali-le-gouvernement-donne-les-raisons-de-laugmentation-de-la-taxe-sur-la-fourniture-des-services-de-telecommunications/
      — corrobore par https://www.maliweb.net/ et https://www.journaldumali.com/telecommunications-les-taxes-de-trop/
      RESERVE EXPRESSE, a lire avec ce chiffre : le texte reglementaire lui-meme n'a pas pu etre
      atteint. La page "Decrets" de l'AMRTP (https://amrtp.ml/categorie-decrets/) ne sert aucune
      liste de documents. Le taux repose donc sur l'expose public de la repartition par le
      gouvernement et sa reprise concordante par trois organes de presse maliens, non sur le decret.
      C'est le maillon source le plus faible de cette derivation et il faut le traiter comme tel.
    verified: "2026-07-27"
    source: >-
      Retenu comme le taux de la "redevance de regulation" que le fondateur decrit : c'est la seule
      composante du prelevement sur chiffre d'affaires qui revienne effectivement au regulateur, et
      le fondateur l'attribue explicitement au regulateur ("le regulateur des telecoms preleve
      chaque annee une redevance de regulation"). Les 9 points restants de la TARTOP vont au Tresor
      et au fonds d'acces universel et ne sont pas une redevance de regulation. Voir
      turnover_levy_scope pour la question qui tranche.

  is_rate:
    value: 0.30
    unit: fraction du benefice imposable
    prov: SOURCED
    authority: >-
      Impot sur les societes, Mali — taux de droit commun 30 % du benefice realise. Direction
      generale des impots du Mali, "Les types d'entreprises et les regimes d'imposition",
      https://www.dgi.gouv.ml/les-types-dentreprises-et-les-regimes/ ("30 %" du benefice realise).
      Taux ramene de 35 % a 30 % en 2011 en application de la directive n°08/2008/CM/UEMOA portant
      harmonisation des regimes d'imposition des benefices. Edition du Code general des impots a
      jour au 1er janvier 2026 (integrant l'ordonnance n°2025-006/PT-RM du 7 fevrier 2025 modifiant
      le CGI et la loi n°2025-056 du 18 decembre 2025 portant loi de finances 2026) : taux
      inchange a 30 %.
    verified: "2026-07-27"
    source: >-
      Confirme l'enonce du fondateur ("je paie encore l'impot sur les societes sur le benefice qui
      reste"). Applique au benefice apres deduction de la redevance, conformement a l'ordre
      d'empilement qu'il decrit.

  imf_rate:
    value: 0.01
    unit: fraction du chiffre d'affaires hors taxes
    prov: SOURCED
    authority: >-
      Impot minimum forfaitaire, Mali — 1 % du chiffre d'affaires annuel hors taxes, du contribuable
      au reel ; le contribuable acquitte le plus eleve des deux montants entre l'IS de droit commun
      et l'IMF. Taux porte de 0,75 % a 1 % en 2011. Direction generale des impots du Mali,
      https://www.dgi.gouv.ml/les-types-dentreprises-et-les-regimes/ (1 % du chiffre d'affaires
      annuel, le contribuable payant le montant le plus eleve).
    verified: "2026-07-27"
    source: >-
      Sert de plancher de controle sur la charge d'IS calculee. Le fondateur ne le mentionne pas ;
      il ne mord pas dans le cas de base, mais c'est precisement le regime qui s'appliquerait si sa
      marge se retournait, et son omission serait une erreur silencieuse.

  imf_floor_xof:
    value: 763500
    unit: XOF par an
    prov: SOURCED
    authority: >-
      Montant plancher de l'impot minimum sur le benefice, Mali : a partir de 50 000 000 XOF de
      chiffre d'affaires annuel, l'impot minimum ne peut etre inferieur a 763 500 XOF. Direction
      generale des impots du Mali,
      https://www.dgi.gouv.ml/les-types-dentreprises-et-les-regimes/.
    verified: "2026-07-27"
    source: >-
      Second plancher, non mordant ici : la charge d'IS calculee la depasse de deux ordres de
      grandeur sur toutes les periodes.

  is_regime_threshold_xof:
    value: 50000000
    unit: XOF de chiffre d'affaires annuel
    prov: SOURCED
    authority: >-
      Seuils de regime d'imposition, Mali : impot synthetique en dessous de 50 000 000 XOF de
      chiffre d'affaires annuel, regime du reel simplifie de 50 000 000 a 250 000 000 XOF, regime du
      reel normal au-dela de 250 000 000 XOF. Direction generale des impots du Mali,
      https://www.dgi.gouv.ml/les-types-dentreprises-et-les-regimes/.
    verified: "2026-07-27"
    source: >-
      Verifie que le fondateur relève bien de l'IS et non de l'impot synthetique de 3 % du chiffre
      d'affaires : son produit annuel (229 500 000 XOF des la premiere periode) est tres au-dessus
      du seuil de 50 000 000. Son affirmation "je paie l'impot sur les societes" est donc coherente
      avec le regime que la loi lui impose. Il franchit le seuil du reel normal (250 000 000) au
      cours de la periode 2 : cela change ses obligations declaratives, pas son taux.

  vat_rate:
    value: 0.18
    unit: fraction du prix hors taxes
    prov: SOURCED
    authority: >-
      Taxe sur la valeur ajoutee, Mali — taux normal 18 %, taux reduit 5 %, Code general des impots
      du Mali ; cadre communautaire directive C/DIR1/05/2007 de la CEDEAO sur l'harmonisation des
      legislations de TVA (fourchette 5-20 %). Direction generale des impots du Mali,
      https://www.dgi.gouv.ml/les-impots-a-payer/ (TVA due mensuellement sur les livraisons de biens
      et les prestations de services, tous secteurs). Aucune exoneration propre a la fourniture
      d'acces internet n'a ete trouvee.
    verified: "2026-07-27"
    source: >-
      N'entre dans aucun calcul du cas de base. Sert a chiffrer l'enjeu de la question
      subscription_price_vat_basis : si les 15 000 F sont un prix TTC, le produit net par abonne est
      15 000 / 1,18, et toute la ligne de chiffre d'affaires se deplace.

  indexation_rate:
    value: 0.0
    unit: fraction par an
    prov: ASSUMED
    source: >-
      PRIOR EXPLICITE, ET C'EST UNE PRETENTION QUE J'ASSUME. Le modele tourne en francs courants
      constants : ni le prix de 15 000 F, ni la facture de capacite de 3 500 000 F, ni les salaires,
      ni le local ne sont indexes sur six ans. Je ne peux pas sourcer ce prior : il faudrait une
      trajectoire malienne a six ans du prix de detail du haut debit ET du prix de gros de la
      capacite ET des salaires techniques, et aucune publication ne la donne. Et je ne peux pas
      l'eliciter entierement : le fondateur peut me dire ce qui s'est passe et ce que son contrat
      prevoit (c'est l'objet de contract_price_revision), il ne peut pas me dire ce que fera le prix
      de gros en annee 5. La part sourcable et la part elicitable ont ete extraites ; ce qui reste
      est un prior, et il est ici, visible, plutot que dissous dans les lignes.
    date: "2026-07-27"

  turnover_levy_scope:
    value: "redevance de regulation AMRTP seule"
    unit: perimetre du prelevement sur chiffre d'affaires
    prov: ELICITED
    question: >-
      Quel titre detenez-vous exactement aupres de l'AMRTP — une licence d'exploitation de reseau
      ouvert au public, ou une simple autorisation de fournisseur de services ? Et sur votre dernier
      avis de versement au titre de l'annee ecoulee, quel pourcentage total de votre chiffre
      d'affaires avez-vous effectivement verse ?
    range:
      low: "redevance de regulation AMRTP seule, 1 % du chiffre d'affaires"
      high: "TARTOP complete a 10 % du chiffre d'affaires (7 % Tresor + 2 % AGEFAU + 1 % AMRTP), plus la contribution generale de solidarite de 0,5 %"
    materiality: high
    source: >-
      Choix omettant, et il n'est PAS conservateur — il faut le dire. Le fondateur decrit un seul
      prelevement sur chiffre d'affaires et l'attribue au regulateur ; le cas de base modelise donc
      exactement ce qu'il decrit, au taux qui revient effectivement au regulateur. Mais le droit
      malien met, sur un titulaire de licence de reseau ouvert au public, une charge assise sur le
      chiffre d'affaires bien plus large que ce qu'il decrit. C'est le cas exemplaire de divergence
      entre ce que le fondateur croit — un fait sur son entreprise — et ce que la regle dit — un
      fait sur le monde : ce sont deux objets distincts et ils ne coincident pas ici. La question
      qui les reconcilie n'est pas une question de droit, c'est une question sur SON dossier : quel
      titre il detient, et ce qu'il a effectivement verse. Lui seul detient l'avis de versement.
      Premiere question a poser s'il n'en accorde qu'une.
    date: "2026-07-27"

  subscription_price_vat_basis:
    value: "hors taxes — les 15 000 F constituent le produit net"
    unit: base de facturation
    prov: ELICITED
    question: >-
      Les 15 000 F que l'abonne vous paie chaque mois, est-ce le prix affiche toutes taxes
      comprises, TVA de 18 % incluse, ou bien un prix hors taxes auquel la TVA vient s'ajouter sur
      la facture ?
    range:
      low: "TTC — la TVA de 18 % est dedans, le produit net par abonne est plus faible"
      high: "HT — les 15 000 F sont le produit net et la TVA s'ajoute au-dessus"
    materiality: high
    source: >-
      Lecture litterale du chiffre enonce, choix omettant : aucun retraitement de TVA n'est
      applique. La aussi le choix n'est pas conservateur, et c'est deliberement signale. Le
      fondateur dit deux choses qui tirent en sens contraire — "quinze mille francs par mois" est un
      prix, mais "un pourcentage de tout ce que j'encaisse" suggere un encaissement, donc du TTC. Un
      seul de ces deux objets peut etre la ligne de produits. C'est lui qui sait ce que porte sa
      facture ; personne d'autre. Deuxieme question a poser.
    date: "2026-07-27"

  capacity_headroom_subscribers:
    value: 2100
    unit: abonnes desservis par le forfait de capacite actuel
    prov: ELICITED
    question: >-
      Jusqu'a combien d'abonnes votre forfait de capacite actuel a 3 500 000 F par mois tient-il
      avant que le debit par abonne se degrade aux heures de pointe, et que vous coute le palier
      suivant chez le grossiste national ?
    range:
      low: 1400
      high: 3000
    materiality: high
    source: >-
      Choix omettant, egal au parc de la derniere periode : le forfait est repute suffire sur tout
      l'horizon, ce qui est la lecture litterale de "quel que soit le nombre d'abonnes". Mais ce
      "quel que soit" est une clause tarifaire, pas une loi de la physique — un forfait de capacite
      est un debit achete, et un debit achete sature. Tout le profil de FCFF de ce modele repose sur
      un levier d'exploitation total : le chiffre d'affaires croit de 59 % sur six ans pendant que
      les 60 240 000 F de charges d'exploitation ne bougent pas d'un franc. Si la capacite sature
      avant la fin de l'horizon, un palier d'achat apparait et ce levier se casse. C'est la question
      qui met le plus en cause la FORME de la trajectoire et non seulement son niveau. Lui seul
      connait son debit souscrit, son taux d'occupation en heure de pointe et la grille du
      grossiste.
    date: "2026-07-27"

  replacement_capex:
    value: 90000000
    unit: XOF
    prov: ELICITED
    question: >-
      Si vous deviez racheter aujourd'hui tout le materiel pour repartir a neuf — antennes, fibre
      dans les immeubles, routeurs — combien cela vous couterait-il, et y a-t-il des elements que
      vous ne changerez pas au bout de huit ans ?
    range:
      low: 55000000
      high: 130000000
    materiality: high
    source: >-
      Reconduction a l'identique en valeur nominale du cout de construction enonce (90 000 000 F) :
      c'est le seul chiffre que l'enonce autorise. La fourchette est large dans les deux sens et
      pour des raisons opposees — vers le bas, le materiel radio et les routeurs se sont abaisses en
      prix et la fibre posee dans les immeubles a probablement une duree de vie superieure a huit
      ans, de sorte que "on change le materiel" ne veut sans doute pas dire qu'on repose tout ;
      vers le haut, un parc de 2 100 abonnes au lieu de 1 200 demande plus de capacite installee, et
      le materiel est importe. C'est le plus gros mouvement de tresorerie unique de tout l'horizon.
      Lui seul peut demander un devis a son equipementier.
    date: "2026-07-27"

  connection_cost_per_new_subscriber:
    value: 0
    unit: XOF par nouvel abonne
    prov: ELICITED
    question: >-
      Quand un nouvel abonne arrive, qui paie le materiel chez lui et le raccordement — routeur,
      cable, main-d'oeuvre : vous ou lui ? Et si c'est vous, combien cela vous revient-il par
      abonne ?
    range:
      low: 0
      high: 60000
    materiality: medium
    source: >-
      Choix omettant a zero, fidele a l'enonce : le fondateur enumere ses charges et n'en cite
      aucune qui varie avec le nombre d'abonnes. Mais son enumeration a un trou visible — les
      routeurs figurent dans l'investissement initial de 90 000 000 F, donc chez lui le materiel
      terminal est bien un cout de l'operateur, et 150 raccordements par an ne peuvent pas etre
      gratuits. C'est le seul cout reellement variable au volume que cette affaire puisse avoir. Lui
      seul sait ce qu'il facture au raccordement et ce que lui coute un kit.
    date: "2026-07-27"

  technician_cost_basis:
    value: "cout employeur complet"
    unit: base de la remuneration
    prov: ELICITED
    question: >-
      Les 120 000 F par technicien et par mois, est-ce ce que le technicien recoit en main, ou votre
      cout complet une fois payees les cotisations INPS et les taxes assises sur les salaires ?
    range:
      low: "cout employeur complet — rien a ajouter"
      high: "net verse au technicien — cotisations patronales et taxes sur salaires en sus"
    materiality: medium
    source: >-
      Choix omettant. Le fondateur dit "tout compris" pour le local et le groupe electrogene et ne
      le dit PAS pour les techniciens : la difference de formulation est un signal, pas un hasard.
      Or les charges assises sur les salaires au Mali ne sont pas negligeables — contribution
      forfaitaire a la charge des employeurs 3,5 %, taxe de formation professionnelle 2 %, taxe
      emploi jeunes 2 %, taxe-logement 1 % de la masse salariale brute (Direction generale des
      impots du Mali, https://www.dgi.gouv.ml/les-impots-a-payer/), avant meme les cotisations
      INPS. Lui seul sait ce que porte son bulletin de paie.
    date: "2026-07-27"

  contract_price_revision:
    value: "aucune revision — prix de detail et prix de gros figes sur l'horizon"
    unit: clause contractuelle
    prov: ELICITED
    question: >-
      Avez-vous deja augmente le prix de 15 000 F depuis le lancement il y a deux ans, et votre
      contrat de capacite avec le grossiste national comporte-t-il une clause de revision de prix ?
    range:
      low: "prix de detail fige mais prix de gros revisable a la hausse"
      high: "prix de detail librement revisable et prix de gros contractuellement fige"
    materiality: medium
    source: >-
      Choix omettant, coherent avec le prior indexation_rate = 0. La question est ici parce qu'elle
      extrait de indexation_rate la part que le fondateur detient reellement : ce qu'il a fait de
      son prix depuis deux ans est un fait de son exploitation, et ce que stipule son contrat de
      gros est un document qu'il a en main. Ce qui reste apres cette question — la trajectoire du
      marche a six ans — est irreductiblement un prior et reste etiquete comme tel. Sur six ans, un
      ecart de revision entre les deux cotes du compte de resultat ne se compense pas.
    date: "2026-07-27"

  receivable_months:
    value: 1.0
    unit: mois de chiffre d'affaires en creances
    prov: ELICITED
    question: >-
      Vos abonnes reglent-ils d'avance au debut du mois, ou a terme echu apres consommation ? Et a
      un instant donne, combien de mois d'abonnement vous doit-on en moyenne ?
    range:
      low: -1.0
      high: 2.0
    materiality: low
    source: >-
      Choix conservateur : un mois de chiffre d'affaires immobilise en creances, c'est-a-dire
      facturation a terme echu et encaissement le mois suivant. La borne basse est negative parce
      que le prepaiement est la norme dominante pour un abonnement de quartier a Bamako et
      produirait un besoin en fonds de roulement negatif, donc du FCFF supplementaire. Materialite
      basse et non nulle : le niveau du besoin en fonds de roulement est deja constitue et sort du
      FCFF (voir opening_nwc) ; seul l'increment annuel entre, et il vaut 150 abonnes de plus fois
      le prix, soit un montant modeste au regard du flux.
    date: "2026-07-27"

  equipment_residual_value:
    value: 0
    unit: XOF
    prov: ELICITED
    question: >-
      Quand vous changerez le materiel au bout de huit ans, revendez-vous l'ancien — antennes,
      routeurs, ou meme la ferraille — et si oui pour combien environ ?
    range:
      low: 0
      high: 9000000
    materiality: low
    source: >-
      Choix conservateur et omettant a zero, coherent avec la valeur residuelle nulle retenue pour
      l'amortissement. Le fondateur dit "on le change", pas "on le revend". Un produit de cession
      tomberait au dernier jour de l'horizon, en meme temps que le capex de remplacement, et le
      compenserait partiellement. Lui seul sait s'il existe un marche de l'occasion pour ce
      materiel a Bamako.
    date: "2026-07-27"

passage: |
  DERIVATION A LA MAIN — six periodes annuelles, t=0 a t=5, francs CFA (XOF).

  ETAPE 0 — CE QUE LA GRILLE DOIT PORTER

  Cette affaire est un actif unique de 90 000 000 F pose il y a deux ans pour une duree de huit ans,
  exploite par une equipe fixe et alimente par un forfait de capacite fixe. Tout ce qui bouge est le
  parc d'abonnes. La grille court donc sur les six annees de vie residuelle du reseau, et le
  remplacement — que le fondateur annonce lui-meme — est place a la fin de la sixieme periode, a
  l'interieur de la fenetre.

  ETAPE 1 — LE PARC D'ABONNES

  Le fondateur a 1 200 abonnes aujourd'hui et en gagne environ 150 de plus par an. Ce chiffre est un
  solde net : "gagner de plus" designe l'accroissement du parc, l'attrition est deja dedans. Le parc
  de fin de periode part donc de 1 200 et progresse de 150 par an : 1 350, 1 500, 1 650, 1 800,
  1 950, 2 100.

  Le chiffre d'affaires d'un exercice ne se calcule pas sur le parc de fin. Les 150 arrivees se
  repartissent dans l'annee ; l'abonne qui arrive en octobre ne paie que trois mois. Par convention
  de mi-periode — arrivees uniformes — le parc moyen facture est le parc de fin diminue de la moitie
  des ajouts, soit 75 : 1 275, 1 425, 1 575, 1 725, 1 875, 2 025.

  ETAPE 2 — LE CHIFFRE D'AFFAIRES

  Chaque abonne paie 15 000 F par mois, soit 180 000 F par an. Sur le parc moyen :

    Periode 1 : 1 275 x 180 000 = 229 500 000
    Periode 2 : 1 425 x 180 000 = 256 500 000
    Periode 3 : 1 575 x 180 000 = 283 500 000
    Periode 4 : 1 725 x 180 000 = 310 500 000
    Periode 5 : 1 875 x 180 000 = 337 500 000
    Periode 6 : 2 025 x 180 000 = 364 500 000

  Le produit est comptabilise au fur et a mesure du service rendu — l'acces internet est une
  prestation continue, la contrepartie est satisfaite mois par mois (IFRS 15, obligation de
  prestation remplie progressivement). Les 15 000 F sont pris comme produit net ; si ce sont des
  encaissements TTC, toute cette colonne se deplace vers le bas — c'est la question posee sous
  subscription_price_vat_basis.

  ETAPE 3 — LES CHARGES D'EXPLOITATION

  Toutes les charges enoncees sont mensuelles et fixes. Annualisees :

    Bande passante   : 3 500 000 x 12 =  42 000 000
    Techniciens      : 6 x 120 000 x 12 =  8 640 000
    Local + groupe   :   800 000 x 12 =   9 600 000
    ---------------------------------------------
    Total            :                   60 240 000

  Ce total ne bouge sur aucune des six periodes. C'est le fait le plus important de ce modele et il
  faut le regarder en face : le fondateur ne cite aucune charge qui varie avec le nombre d'abonnes.
  La bande passante est explicitement un forfait "quel que soit le nombre d'abonnes", les
  techniciens sont six, le local est un local. Le levier d'exploitation est donc total. Il est aussi
  fragile — voir capacity_headroom_subscribers et connection_cost_per_new_subscriber.

  ETAPE 4 — L'EXCEDENT BRUT D'EXPLOITATION

  EBITDA = chiffre d'affaires - charges d'exploitation, soit 60 240 000 retires de chaque colonne :

    169 260 000 / 196 260 000 / 223 260 000 / 250 260 000 / 277 260 000 / 304 260 000

  La marge passe de 73,8 % a 83,5 % sur l'horizon, mecaniquement, parce que le denominateur croit et
  que le numerateur de charges ne bouge pas.

  ETAPE 5 — L'AMORTISSEMENT ET LE TABLEAU D'IMMOBILISATIONS

  Le reseau a coute 90 000 000 F pour une duree d'utilite de huit ans. En lineaire sans valeur
  residuelle, la dotation annuelle est 90 000 000 / 8 = 11 250 000 F.

  Deux annuites sont deja passees. La valeur nette comptable a l'ouverture de la grille est donc
  90 000 000 - 2 x 11 250 000 = 67 500 000 F. Cette valeur est injectee dans le tableau a t=0
  (ligne nbv_opening) : c'est un solde d'ouverture, pas un flux de tresorerie, et elle n'apparait
  nulle part dans le FCFF.

  Le tableau se deroule ensuite :

    t=0 :  0 + 67 500 000 - 11 250 000 = 56 250 000
    t=1 : 56 250 000 - 11 250 000 = 45 000 000
    t=2 : 45 000 000 - 11 250 000 = 33 750 000
    t=3 : 33 750 000 - 11 250 000 = 22 500 000
    t=4 : 22 500 000 - 11 250 000 = 11 250 000
    t=5 : 11 250 000 - 11 250 000 + 90 000 000 = 90 000 000

  Les six dotations totalisent exactement 67 500 000 F : l'actif d'origine arrive a zero le dernier
  jour de l'horizon, ce qui est la definition meme de la fenetre choisie. Le materiel de
  remplacement est mis en service ce meme dernier jour ; par convention de fin de periode il ne
  porte aucune dotation dans l'horizon et sort a sa valeur d'acquisition.

  ETAPE 6 — LE RESULTAT D'EXPLOITATION

  EBIT = EBITDA - 11 250 000 :

    158 010 000 / 185 010 000 / 212 010 000 / 239 010 000 / 266 010 000 / 293 010 000

  ETAPE 7 — LES DEUX PRELEVEMENTS EMPILES

  C'est la particularite que le fondateur nomme lui-meme, et l'ORDRE compte.

  Premier etage — la redevance de regulation, assise sur le chiffre d'affaires, due "que je sois
  beneficiaire ou pas". Au taux de 1 % (part revenant a l'AMRTP) :

    2 295 000 / 2 565 000 / 2 835 000 / 3 105 000 / 3 375 000 / 3 645 000

  Elle est deductible — le fondateur le dit, et c'est le traitement normal d'une taxe autre que
  l'impot sur le benefice lui-meme. Elle vient donc en charge AVANT l'assiette de l'IS.

  Benefice imposable = EBIT - redevance :

    155 715 000 / 182 445 000 / 209 175 000 / 235 905 000 / 262 635 000 / 289 365 000

  Second etage — l'impot sur les societes a 30 % de ce qui reste :

    46 714 500 / 54 733 500 / 62 752 500 / 70 771 500 / 78 790 500 / 86 809 500

  Il faut insister sur l'ordre. Si l'on prelevait l'IS sur l'EBIT puis la redevance apres, on
  obtiendrait en premiere periode 47 403 000 F d'IS et un resultat de 108 312 000 F au lieu de
  109 000 500 F. L'ecart est de 688 500 F sur la seule premiere periode, et il est entierement du a
  la deductibilite. L'empilement se resume ainsi : la redevance coute a l'entreprise 1 % du chiffre
  d'affaires diminue de l'economie d'impot qu'elle procure, soit 0,7 % du chiffre d'affaires net.

  Controle de regime : l'impot minimum forfaitaire vaut 1 % du chiffre d'affaires, soit de
  2 295 000 a 3 645 000 F selon la periode, avec un plancher de 763 500 F. L'IS calcule le depasse
  d'un facteur vingt sur toutes les periodes : c'est bien l'IS de droit commun qui gouverne, l'IMF
  ne mord pas. Controle de perimetre : avec 229 500 000 F de produits des la premiere periode,
  l'entreprise est tres au-dessus du seuil de 50 000 000 F sous lequel s'appliquerait l'impot
  synthetique de 3 % du chiffre d'affaires — l'affirmation du fondateur qu'il relève de l'IS est
  conforme au regime que la loi lui impose.

  Prelevements cumules (redevance + IS) :

    49 009 500 / 57 298 500 / 65 587 500 / 73 876 500 / 82 165 500 / 90 454 500

  soit 31,0 % de l'EBIT en premiere periode : l'empilement ajoute environ un point de taux effectif
  a un taux nominal de 30 %, parce que la marge d'exploitation est haute et que l'assiette du
  premier etage (le chiffre d'affaires) est proche de l'assiette du second (le benefice) rapportee
  au taux.

  ETAPE 8 — LE RESULTAT D'EXPLOITATION APRES IMPOT (NOPAT)

  NOPAT = EBIT - redevance - IS, c'est-a-dire le benefice imposable diminue de 30 % :

    109 000 500 / 127 711 500 / 146 422 500 / 165 133 500 / 183 844 500 / 202 555 500

  Aucun interet n'entre dans ce calcul : le fondateur ne mentionne aucune dette, la construction est
  sans levier par definition.

  ETAPE 9 — LE BESOIN EN FONDS DE ROULEMENT

  Le poste de besoin en fonds de roulement de cette affaire est la creance d'abonnement. Le
  fondateur n'a pas dit quand ses abonnes payent ; le cas de base retient un mois de chiffre
  d'affaires en creances, soit le parc de fin de periode multiplie par 15 000 F :

    20 250 000 / 22 500 000 / 24 750 000 / 27 000 000 / 29 250 000 / 31 500 000

  L'affaire tourne depuis deux ans : elle porte deja 1 200 x 15 000 = 18 000 000 F de creances a
  l'ouverture. Ce solde est acquis et ne constitue pas un decaissement de l'horizon. Seul
  l'increment entre dans le FCFF :

    variation = 150 nouveaux abonnes x 15 000 F = 2 250 000 F par periode, identique sur les six.

  Verification par cumul : 2 250 000 x 6 = 13 500 000, et 31 500 000 - 18 000 000 = 13 500 000. Le
  cumul des variations reconstitue bien le solde de cloture diminue du solde d'ouverture.

  Les dettes fournisseurs ont ete examinees et laissees hors du tableau : la bande passante est une
  charge mensuelle strictement constante, un delai de reglement du grossiste — quel qu'il soit —
  produirait un solde constant et donc une variation nulle a chaque periode. Il deplacerait le
  niveau du besoin en fonds de roulement sans toucher au FCFF.

  ETAPE 10 — L'INVESTISSEMENT

  Aucun investissement sur les cinq premieres periodes : le reseau est en place et le fondateur ne
  decrit aucune extension. En fin de sixieme periode, le materiel atteint ses huit ans et doit etre
  remplace. Le cas de base reconduit le cout de construction a l'identique, 90 000 000 F. C'est le
  seul chiffre que l'enonce autorise, et c'est une question posee au fondateur, pas une certitude.

    capex : 0 / 0 / 0 / 0 / 0 / 90 000 000

  ETAPE 11 — LE FLUX DE TRESORERIE DISPONIBLE POUR L'ENSEMBLE DES APPORTEURS

  FCFF = NOPAT + dotations aux amortissements - variation du besoin en fonds de roulement - capex.

    t=0 : 109 000 500 + 11 250 000 - 2 250 000 - 0          = 118 000 500
    t=1 : 127 711 500 + 11 250 000 - 2 250 000 - 0          = 136 711 500
    t=2 : 146 422 500 + 11 250 000 - 2 250 000 - 0          = 155 422 500
    t=3 : 165 133 500 + 11 250 000 - 2 250 000 - 0          = 174 133 500
    t=4 : 183 844 500 + 11 250 000 - 2 250 000 - 0          = 192 844 500
    t=5 : 202 555 500 + 11 250 000 - 2 250 000 - 90 000 000 = 121 555 500

  Cumul sur les six periodes : 898 668 000 F.

  Decomposition de controle par nature de flux. Flux d'exploitation = NOPAT + dotations - variation
  du besoin en fonds de roulement :

    118 000 500 / 136 711 500 / 155 422 500 / 174 133 500 / 192 844 500 / 211 555 500

  Flux d'investissement = - capex :

    0 / 0 / 0 / 0 / 0 / -90 000 000

  Leur somme reproduit le FCFF ligne a ligne, ce qui ferme la derivation.

  LECTURE. La trajectoire monte de 118 000 500 F a 192 844 500 F sur cinq periodes — une progression
  de 63 % portee entierement par le levier d'exploitation, puisque le chiffre d'affaires croit de
  47 % pendant que les charges d'exploitation ne bougent pas — puis retombe a 121 555 500 F en
  sixieme periode sous l'effet du renouvellement de l'actif. Cette derniere colonne est la seule qui
  dise la verite sur le regime de croisiere de cette affaire : les cinq premieres annees sont une
  moisson sur un actif deja paye.


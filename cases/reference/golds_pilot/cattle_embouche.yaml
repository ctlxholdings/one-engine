  # ---------------------------------------------------------------- ELICITED
  poor_doer_sale_price_xof:
    value: 325000
    unit: XOF per head
    prov: ELICITED
    source: "He tells us these animals exist and that he dumps them — \"Il y en a toujours deux ou trois dans le lot qui ne profitent pas ; ceux-la je les brade\" — but never once says what brader fetches. This is the single largest unstated cash number in the model: a quarter of every lot is priced by my guess, not by him. Working value 325,000 is the conservative end of the band: it is the thin-animal price plus a modest allowance for the ~30 kg the animal did put on and for its better condition off the tether, and it deliberately does not credit him with a near-finished price."
    question: "Les deux ou trois qui n'ont pas profite — quand vous les bradez a Niamana, vous touchez combien pour une bete, en gros ?"
    range: {low: 275000, high: 450000}
    materiality: high
    date: "2026-07-29"
  poor_doers_per_lot:
    value: 3
    unit: head per tour
    prov: ELICITED
    source: "\"deux ou trois\" is a range, not a number, and each unit of it swings a full head between the finished price and the dumped price. He holds the answer — he has run at least eight lots. Working value 3, the conservative end of his own range."
    question: "Sur vos quatre derniers lots de douze, combien de betes n'ont pas profite dans chaque lot — deux, ou trois ?"
    range: {low: 2, high: 3}
    materiality: high
    date: "2026-07-29"
  mairie_levy_nature:
    value: "recu de taxe communale, pas d'immatriculation fiscale"
    unit: label
    prov: ELICITED
    source: "\"je ne sais pas trop a quel titre, je paie et on me donne un papier\" — he does not know what he is paying. What is printed on that paper decides whether he is already on a tax register, and therefore whether the impot synthetique is being administered against him or merely owed. STRUCTURAL, not a value: this answer changes the regime, not a number inside it, so it is not wired to a checks entry. The base case charges the tax on the rule regardless of what the paper says, which is the conservative reading."
    question: "Le papier que la mairie vous donne pour les vingt-cinq mille — qu'est-ce qui est ecrit en haut : une patente, une carte de contribuable, ou juste un recu de la commune ?"
    range: {low: "recu de taxe communale (aucune immatriculation fiscale)", high: "patente ou carte de contribuable (deja au registre de la DGI)"}
    materiality: high
    date: "2026-07-29"
  herdsman_months_paid_per_year:
    value: 12
    unit: months per year
    prov: ELICITED
    source: "He gives the rate — \"cinquante mille par mois\" — but not the count. Four months of every year have no animal on the tether. Whether a resident bouvier who is \"nourri et loge sur place\" on a word-of-mouth arrangement draws his wage through those months is a fact about his own household, not about the world. Working value 12: paid year-round, the conservative reading and the one his own framing supports (\"le bouvier, l'eau, le transport, c'est pareil a trois ou a douze\" treats the man as a fixed cost of the yard)."
    question: "Les mois ou il n'y a pas de betes a l'attache, est-ce que vous versez quand meme les cinquante mille au bouvier ?"
    range: {low: 8, high: 12}
    materiality: medium
    date: "2026-07-29"
  sale_transport_cost_per_tour_xof:
    value: 0
    unit: XOF per tour
    prov: ELICITED
    source: "He prices the truck UP from Kolokani in full detail and says nothing at all about how the finished animals get from Kati across to the foirail at Niamana — a real journey across Bamako. His verb is \"on ne descend pas\", which in this trade usually means trekking on the hoof with the drover, and a trek costs him nothing he has not already paid. Working value 0 is the OMITTING choice: I decline to invent a cost he did not mention, and I keep the question attached instead."
    question: "Pour aller de Kati au foirail de Niamana avec les betes finies — c'est a pied avec le bouvier, ou vous louez un camion, et ca vous coute combien pour le lot ?"
    range: {low: 0, high: 120000}
    materiality: medium
    date: "2026-07-29"
  poor_doer_exit_weight_kg:
    value: 285
    unit: kg per head
    prov: ELICITED
    source: "He runs a tape over every animal — \"On passe le ruban\" — so he can read this off. He gives the exit weight of the animals that come on (330-340) and never gives it for the ones that do not. Working value 285 implies 30 kg over the tour, i.e. roughly a third of a good animal's gain: enough that the animal is not literally standing still, low enough to be a failure. It drives no cash (he prices by the head, not the kilo) but it is what closes the liveweight balance and it is the check on whether 'brader' is a price story or a weight story."
    question: "Une bete qui n'a pas profite, quand vous passez le ruban a la fin du tour, il donne quoi — elle a pris combien de kilos par rapport a l'entree ?"
    range: {low: 260, high: 300}
    materiality: medium
    date: "2026-07-29"
  cake_sacks_month1:
    value: 16
    unit: sacks in the first month of a tour
    prov: ELICITED
    source: "\"Le premier mois elles mangent moins ; c'est apres qu'il faut charger\" fixes the direction and not the size of the ramp; he can say how many sacks go out in the adaptation month because he carries them. Working value 16 of the 100: it is the largest integer split that leaves the remaining 84 dividing exactly over the three loaded months (28 each) and that puts the adaptation month inside the sourced Sahelian supplementation band rather than above it. Moves within-tour cash timing and the ration profile, not the tour total, hence the low ranking."
    question: "Le premier mois d'un tour, vous sortez combien de sacs de tourteau, par rapport a un mois plein plus tard ?"
    range: {low: 10, high: 25}
    materiality: low
    date: "2026-07-29"
  roughage_kg_per_tour:
    value: 6000
    unit: kg as-fed per tour
    prov: ELICITED
    source: "The 150,000 of straw is a price, not a quantity, and the gathered straw and bourgou have no price at all — \"j'en ramasse apres la recolte\", \"du bourgou quand j'en trouve\". He knows how many charrettes go into a tour. Working value 6,000 kg (about half bought, half gathered) completes the ration to a physiologically coherent intake. It moves NO cash — the straw outlay is fixed at 150,000 whatever the tonnage, and gathered straw costs only labour already paid — so it is ranked low even though it is the input the whole physical closure rests on."
    question: "Sur un tour, les douze betes mangent combien de charrettes de paille et de bourgou en tout, ce que vous ramassez et ce que vous achetez ensemble — et une charrette, ca pese a peu pres combien ?"
    range: {low: 3000, high: 10000}
    materiality: low
    date: "2026-07-29"

  # ---------------------------------------------------------------- ASSUMED
  traditional_agriculture_carveout_applies:
    value: 0
    unit: boolean
    prov: ASSUMED
    source: "THE ADJUDICATION, and the largest judgement in this document. The sourced rule exempts only exploitation falling within agriculture traditionnelle, and the instrument I could reach does not define the term — so the boundary is a prior I supplied, not a fact I looked up, and it is flagged as one. I set it to 0 (the carve-out does NOT cover him) because what he describes is not extensive husbandry of his own stock: he buys animals he did not breed at one market and sells them at another, keeps them tethered under a purpose-built sheet-metal shelter with concrete troughs, feeds 7.5 tonnes of purchased concentrate per cycle, employs a full-time paid herdsman and finances the cycle with a credit-union loan. That is a capitalised, market-facing production operation. Note what this tag concedes: a question to the DGI or to a Kati assessor could settle it, but no question to THIS FOUNDER could — he has already told us he does not know (\"je ne sais pas trop a quel titre\"), which is why this is ASSUMED and not ELICITED."
    date: "2026-07-29"
  impot_synthetique_applies_flag:
    value: 1
    unit: boolean
    prov: ASSUMED
    source: "Follows from traditional_agriculture_carveout_applies = 0 together with the sourced regime and threshold; carried as its own input because it is the switch the tax line multiplies by, so a reader who disagrees with the adjudication can see exactly which number to move. Set to 1 as the conservative reading — charging a tax he may in practice never be assessed for understates FCFF, which is the safe direction for an asset-side valuation."
    date: "2026-07-29"
  shed_useful_life_years:
    value: 10
    unit: years
    prov: ASSUMED
    source: "A sheet-metal shelter over concrete troughs on a compound: a light construction, not a masonry building. Ten years is the standard working life for that class of structure in a Sahelian yard. This is genuinely a prior — the shed is his first and is only four years old, so no question to him could produce an observed life. Note the low stakes: under a turnover-based tax, depreciation has no cash consequence at all, since it reduces NOPAT and is added straight back."
    date: "2026-07-29"
  concentrate_refusal_rate:
    value: 0.07
    unit: fraction of concentrate offered
    prov: ASSUMED
    source: "Cake and bran fed dry into cement mangers to tethered animals are spilled, blown, trodden and picked over. 7% is a conventional trough-feeding allowance. The utterance itself is evidence the cake is fed coarse and dry — one animal \"s'est etouffee avec le tourteau\". Required by the closure rule: a sack bought is not a kilo eaten, and the difference has to be named rather than silently assumed to be zero."
    date: "2026-07-29"
  roughage_refusal_rate:
    value: 0.20
    unit: fraction of roughage offered
    prov: ASSUMED
    source: "Rice straw offered ad libitum is refused, soiled and used as bedding at a much higher rate than concentrate; 20% is a conventional allowance for stemmy cereal straw in a manger. Same closure rule: the roughage transformation must state what is eaten and what is lost, not just what is bought."
    date: "2026-07-29"
  truck_payload_kg:
    value: 10000
    unit: kg
    prov: ASSUMED
    source: "Payload of the standard rigid livestock lorry used on the Kolokani-Bamako run. Used only to show the claimed load actually fits the vehicle he pays 120,000 for; the check is a wide-margin fit, so a lorry anywhere from 5 to 15 tonnes leaves the conclusion unchanged."
    date: "2026-07-29"
  water_litres_per_head_per_day:
    value: 40
    unit: litres per head per day
    prov: ASSUMED
    source: "Hot-season drinking requirement for a 250-340 kg zebu on a dry concentrate ration, at the top of the usual 25-40 litre range because dry feeding raises water demand. Used to show the well and pump can actually serve the lot."
    date: "2026-07-29"
  pump_capacity_litres_per_day:
    value: 6000
    unit: litres per day
    prov: ASSUMED
    source: "Deliverable output of a small diesel motor-pump on a compound well running a short session each day. Cross-checks against his own cash: 15,000 XOF/month of gasoil is roughly twenty litres of fuel a month, which is well under an hour of pumping a day — consistent with a pump that clears the lot's daily requirement in minutes rather than hours."
    date: "2026-07-29"
  herdsman_minutes_per_head_per_day:
    value: 35
    unit: minutes per head per day
    prov: ASSUMED
    source: "Feeding twice, watering, mucking out and checking one tethered fattening animal. Used to show one man can actually carry the lot he is claimed to carry."
    date: "2026-07-29"
  herdsman_working_minutes_per_day:
    value: 480
    unit: minutes per day
    prov: ASSUMED
    source: "An eight-hour working day for a resident herdsman. Deliberately not stretched: if the labour fit only worked on a twelve-hour day, that would itself be the finding."
    date: "2026-07-29"

  # ---------------------------------------------------------------- DEFAULTED
  days_per_month:
    value: 30
    unit: days
    prov: DEFAULTED
    source: "30/360 day-count convention on a monthly grid. Makes a four-month tour exactly 120 days, which is consistent with his own \"trois mois et demi, quatre mois\"."
    date: "2026-07-29"
  horizon_months:
    value: 24
    unit: months
    prov: DEFAULTED
    source: "Convention: model over a whole number of production cycles and a whole number of tax years, so that no period is truncated mid-cycle and no annual levy is apportioned. The substantive justification for choosing THIS whole number is in grid.why, where it can be disagreed with."
    date: "2026-07-29"
  receivable_days:
    value: 0
    unit: days
    prov: DEFAULTED
    source: "Convention: absent any statement of credit terms, spot markets settle in cash. Both his markets are spot cattle markets and he describes no debtor. Corroborated by his own account of the cash cycle: \"tant qu'elles sont a l'attache je n'ai rien en poche\" — the money is locked in the animal, not in a receivable. Declared explicitly rather than left silent."
    date: "2026-07-29"
  payable_days:
    value: 0
    unit: days
    prov: DEFAULTED
    source: "Same convention on the buy side: cattle at Kolokani, sacks from the feed dealer and the vet are all described without credit. The only credit anywhere in the account is the caisse loan, which is financing and is excluded from the unlevered build by construction. Zero is stated here rather than assumed silently, so a reader can see it was considered."
    date: "2026-07-29"
  inventory_costing_basis:
    value: "cost of purchase plus costs of conversion, with normal loss absorbed by good output"
    unit: policy
    prov: DEFAULTED
    source: "Standard inventory measurement under AUDCIF (and IAS 2 in the same terms): livestock held for sale is carried at purchase cost plus inbound transport, veterinary cost, feed consumed, and the production overhead absorbed while animals are actually on the tether. Overhead in the idle months is unabsorbed capacity and is expensed as incurred, not capitalised into the next lot. Normal mortality is not written off separately: the cost sunk into an animal that dies within the normal loss rate is carried by the surviving units, which is why the value roll-forward has no mortality line while the physical roll-forward does. Selling costs, the mairie levy and depreciation are period costs."
    date: "2026-07-29"

  # ---------------------------------------------------------------- INFERRED
  months_per_round_cycle:
    value: 6
    unit: months
    prov: INFERRED
    derivation: "12 / tours_per_year"
    source: "Placement-to-placement, averaged: two tours inside twelve months. Not to be confused with months_per_tour — the animals are on the tether for four of these six months and the yard is empty for the other two, which is precisely the fact an annual grid destroys."
    date: "2026-07-29"
  idle_months_per_year:
    value: 4
    unit: months per year
    prov: INFERRED
    derivation: "12 - tours_per_year * months_per_tour"
    source: "The months with nothing on the tether. One of them is the sourcing month he names; the rest is him waiting for the dry-season buying window. These months carry the herdsman and the pump and earn nothing, which is where the unabsorbed overhead in the ladder comes from."
    date: "2026-07-29"
  tours_in_horizon:
    value: 4
    unit: tours
    prov: INFERRED
    derivation: "horizon_months / months_per_round_cycle"
    source: "Four complete tours inside the 24-month window, opening and closing with an empty tether."
    date: "2026-07-29"
  days_per_tour:
    value: 120
    unit: days
    prov: INFERRED
    derivation: "months_per_tour * days_per_month"
    source: "The denominator for every daily rate tested against a benchmark below."
    date: "2026-07-29"
  weight_gain_good_kg:
    value: 80
    unit: kg per head per tour
    prov: INFERRED
    derivation: "exit_weight_good_kg - entry_weight_kg"
    source: "335 - 255. Worth noting that this is a CORROBORATION and not just an arithmetic step: he independently states the answer himself — \"Ca fait quatre-vingts kilos\" — so his weights and his gain agree with each other. Implies 666.67 g/day over 120 days, which sits inside the sourced Sahelian band; asserted in checks."
    date: "2026-07-29"
  weight_gain_poor_kg:
    value: 30
    unit: kg per head per tour
    prov: INFERRED
    derivation: "poor_doer_exit_weight_kg - entry_weight_kg"
    source: "285 - 255. Arithmetic over an ELICITED working value, so it inherits that question: if he reads a different figure off the tape, this moves with it."
    date: "2026-07-29"
  heads_grade_a_placed:
    value: 9
    unit: head per tour
    prov: INFERRED
    derivation: "heads_per_lot - poor_doers_per_lot"
    source: "The animals that come on. Arithmetic over an ELICITED working value and inherits that question. Splitting the lot into two grades is a structural choice: a single average animal would price the whole lot at the finished price and quietly delete a loss he explicitly told us about."
    date: "2026-07-29"
  mortality_head_per_tour:
    value: 0.25
    unit: head per tour
    prov: INFERRED
    derivation: "deaths_observed_head / (mortality_observation_years * tours_per_year)"
    source: "2 head over 4 years at 2 tours a year = a quarter of a head per tour, i.e. 2.08% of a 12-head lot. Modelled as a RATE rather than as an integer death in a named tour because nothing in the utterance says which tour, and an expected-value rate reproduces his record exactly over the horizon: one death in 24 months, asserted in checks. Below the 2-5% normal range for feedlot cattle, so it is treated as normal loss and absorbed into the cost of the surviving head rather than written off."
    date: "2026-07-29"
  mortality_head_per_feeding_month:
    value: 0.0625
    unit: head per month on feed
    prov: INFERRED
    derivation: "mortality_head_per_tour / months_per_tour"
    source: "WHAT THE LOSS RATE ACTS ON: the standing lot, and only in the months there is a standing lot. A flat monthly charge is the correct form here precisely because this stock does NOT drain — head count is constant from placement until the whole lot clears on one day — so there is no draining tail for a flat charge to overstate. In the idle months the charge is zero, and it is zero because nothing is at risk, not because the risk was forgotten."
    date: "2026-07-29"
  heads_grade_a_sold_per_tour:
    value: 8.8125
    unit: head per tour
    prov: INFERRED
    derivation: "heads_grade_a_placed - mortality_head_per_tour * heads_grade_a_placed / heads_per_lot"
    source: "Mortality is taken pro rata across the two grades rather than loaded onto one: nothing in the utterance says the animals that die are the ones that were not coming on. His two deaths were a choking and an animal that arrived sick — neither is grade-selective."
    date: "2026-07-29"
  heads_grade_b_sold_per_tour:
    value: 2.9375
    unit: head per tour
    prov: INFERRED
    derivation: "poor_doers_per_lot - mortality_head_per_tour * poor_doers_per_lot / heads_per_lot"
    source: "Same pro-rata treatment on the non-thriving grade."
    date: "2026-07-29"
  heads_sold_per_tour:
    value: 11.75
    unit: head per tour
    prov: INFERRED
    derivation: "heads_grade_a_sold_per_tour + heads_grade_b_sold_per_tour"
    source: "Twelve placed, a quarter of a head lost, 11.75 crossing the scales at Niamana."
    date: "2026-07-29"
  cake_sacks_loaded_month:
    value: 28
    unit: sacks per month
    prov: INFERRED
    derivation: "(cake_sacks_per_tour - cake_sacks_month1) / (months_per_tour - 1)"
    source: "The remaining 84 sacks divided evenly over the three loaded months. Integer by construction, so no rounding enters the ration profile."
    date: "2026-07-29"
  bran_sacks_month1:
    value: 8
    unit: sacks in the first month of a tour
    prov: INFERRED
    derivation: "cake_sacks_month1 * bran_sacks_per_tour / cake_sacks_per_tour"
    source: "Bran is ramped in the same proportion as cake, because they go into the same manger as one concentrate mix — he names them together and never varies their ratio. Lands exactly on 8 sacks."
    date: "2026-07-29"
  bran_sacks_loaded_month:
    value: 14
    unit: sacks per month
    prov: INFERRED
    derivation: "(bran_sacks_per_tour - bran_sacks_month1) / (months_per_tour - 1)"
    source: "Remaining 42 sacks over three loaded months."
    date: "2026-07-29"
  gain_share_month1:
    value: 0.16
    unit: fraction of tour gain
    prov: INFERRED
    derivation: "cake_sacks_month1 / cake_sacks_per_tour"
    source: "Liveweight gain is distributed across the tour in the SAME proportion as the concentrate that produces it, rather than spread evenly. That is the physiologically right link and it makes the gain profile a consequence of the ration profile instead of a second free assumption."
    date: "2026-07-29"
  gain_share_loaded_month:
    value: 0.28
    unit: fraction of tour gain
    prov: INFERRED
    derivation: "cake_sacks_loaded_month / cake_sacks_per_tour"
    source: "Same link, loaded months. 0.16 + 3 * 0.28 = 1.00, so the gain closes exactly over the tour."

    unit: XOF per year
    prov: INFERRED
    derivation: "turnover_per_tour_xof * tours_per_year"
    source: "The tax base. Roughly a fifth of impot_synthetique_threshold_xof, which is what puts him in the synthetique regime rather than the reel simplifie — asserted in checks so the regime choice is tested and not merely stated."
    date: "2026-07-29"
  opening_tax_payable_xof:
    value: 289490.625
    unit: XOF
    prov: INFERRED
    derivation: "impot_synthetique_rate * tours_per_year * (heads_grade_a_sold_per_tour * last_year_finished_price_xof + heads_grade_b_sold_per_tour * poor_doer_sale_price_xof * last_year_finished_price_xof / finished_price_xof)"
    source: "The business does not begin at t=0 — it is four years old, so it opens the horizon owing last year's synthetique, payable 31 March. Sized on the price he says last year actually fetched (450,000, \"le marche n'etait pas bon\"), with the dumped price scaled by the same market factor since a soft market moves both. This is the one place last_year_finished_price_xof is used, and it turns a remark that would otherwise be discarded into the opening balance sheet."
    date: "2026-07-29"
  monthly_depreciation_xof:
    value: 10000
    unit: XOF per month
    prov: ASSUMED
    derivation: "shed_cost_xof / (shed_useful_life_years * 12)"
    source: "Straight-line over the assumed life. Tagged ASSUMED rather than INFERRED because shed_useful_life_years is an unstated prior, and the rule is that the moment a prior enters a derivation the result is ASSUMED however clean the arithmetic looks. The derivation is kept so a checker can still re-run it."
    date: "2026-07-29"
  accumulated_depreciation_opening_xof:
    value: 480000
    unit: XOF
    prov: ASSUMED
    derivation: "monthly_depreciation_xof * shed_age_years_at_t0 * 12"
    source: "Four years already run off the shed before t=0, leaving 720,000 of book value to carry into the horizon. ASSUMED for the same reason as the line above."
    date: "2026-07-29"

passage: |
  1. WHAT THE BUSINESS ACTUALLY IS

  Stripped of the vocabulary, this is a four-month conversion: XOF into a thin animal, XOF into
  concentrate, and a heavier animal out the other end. It is not a herd. Nothing is bred, nothing is
  retained, there is no breeding stock and no biological asset held for its produce — every animal
  that enters is sold within 120 days. So the animal is INVENTORY, carried at cost, and the model is
  a production-and-inventory model, not a herd model. His own accounting says the same thing: "Moi
  je ne compte pas au kilo, je compte a la bete."

  The unit of operation is the tour: 12 head, 4 months, twice a year. Everything below is built at
  tour level and then laid onto the 24 monthly periods.

  2. THE CALENDAR

  t=0 is January of year 1. Tour 1 is placed at the start of April (t=3) because that is his stated
  buying window — "le bon moment pour acheter, c'est la fin de la saison seche" — and clears at the
  end of July (t=6). August (t=7) is the sourcing month he names. Tour 2 is placed in September
  (t=8) and clears at the end of December (t=11). January to March of the following year is idle.
  Year 2 repeats: place t=15, sell t=18, source t=19, place t=20, sell t=23. Four tours; the
  horizon opens and closes on an empty tether.

  3. THE LOT, GRADE BY GRADE

  He describes two populations, and collapsing them would delete a loss he told us about. Of 12
  placed, 3 "ne profitent pas" and 9 come on (poor_doers_per_lot is ELICITED at the conservative end
  of his own "deux ou trois").

  Mortality: 2 head over 4 years at 2 tours a year = 0.25 head per tour = 0.0625 head per month on
  feed, charged flat on the standing lot and charged at ZERO in the idle months because there is
  nothing standing. Head roll-forward within a tour: 12.000 -> 11.9375 -> 11.875 -> 11.8125, then
  11.75 leave for Niamana. Pro rata across grades that is 8.8125 good and 2.9375 non-thriving.
  Across the whole horizon: 48 placed, 47 sold, exactly 1 dead — which reproduces his own record of
  two deaths in four years, on the nose.

  4. THE LIVEWEIGHT TRANSFORMATION, CLOSED

  Per head, entry 255 kg. A good animal exits at 335 kg (+80); a non-thriver at 285 kg (+30, the
  ELICITED working value). The gain is spread across the tour in the same 16:28:28:28 proportion as
  the concentrate that produces it, so a good animal tracks 255 -> 267.8 -> 290.2 -> 312.6 -> 335.0
  and a non-thriver 255 -> 259.8 -> 268.2 -> 276.6 -> 285.0.

  Per tour the mass balance is: 3,060.000 kg placed (12 x 255) + 798.69375 kg gained = 3,789.375 kg
  sold + 69.31875 kg lost with the dead animal. Over 24 months: 12,240 kg placed + 3,194.775 kg
  gained = 15,157.5 kg sold + 277.275 kg dead. It closes to the gram, and it closes because the
  dead animal is carried at the weight it had reached when it died, not at entry weight and not at
  exit weight.

  5. THE FEED TRANSFORMATION, CLOSED — AND THE THING THAT DOES NOT FIT

  A sack bought is not a kilo eaten. Per tour he buys 100 sacks of cake and 50 of bran; at the
  standard 50 kg Malian sack that is 7,500 kg of concentrate OFFERED. At a 7% trough allowance,
  525 kg is spilled, trodden or refused and 6,975 kg is EATEN. Roughage: 6,000 kg offered (the
  ELICITED working value covering both what he buys for 150,000 and what he gathers free), 1,200 kg
  refused at 20%, 4,800 kg eaten. Offered = eaten + refused, both lines, every month.

  Now the test that matters. The sourced Sahelian norm for village cattle fattening is 1.0 to 1.5 kg
  of concentrate per 100 kg of liveweight per day. Against the standing liveweight in each month,
  the top of that band permits 1,402.4221875 kg in month 1, 1,474.605 in month 2, 1,567.5946875 in
  month 3 and 1,659.52125 in month 4 — 6,104.143125 kg over the tour. He feeds 6,975 kg eaten.

  Month 1 fits: 1,116 kg eaten against 1,402.4221875 permitted, comfortably inside the band. Every
  loaded month does not: 1,953 kg eaten against 1,474.605, 1,567.5946875 and 1,659.52125 — over by
  478.395, 385.4053125 and 293.47875 kg respectively, and by 870.856875 kg over the tour. Put in
  per-animal terms, the loaded ration is 5.425 kg of concentrate eaten per head per day on an animal
  averaging around 300 kg, and adding the roughage the whole lot is eating 8.177 kg as-fed per head
  per day, which on a 290 kg average is at the very ceiling of what a bovine can physically ingest.

  I do not absorb this. The money is the money — 1,180,000 XOF per tour leaves his hand whatever the
  sacks weigh — so the cash model runs on his figures unchanged, and the physical inconsistency is
  reported as a finding about the business rather than smoothed into a yield ratio. It has exactly
  three candidate explanations and they are not equivalent: the sacks weigh less than the nominal
  50 kg (most likely for bran, which is bulky); the 100-and-50 covers a 14-head lot or spills over a
  tour boundary; or he is genuinely over-feeding concentrate, which would be self-consistent with
  the poor conversion below and with his own hard-won lesson that "apres quatre mois ca ne rend
  plus, la bete mange autant et ne grossit plus pareil."

  Conversion, for the record: 6,975 kg of concentrate eaten per tour against 798.69375 kg of gain is
  8.73 kg of concentrate per kg of liveweight; 14.74 kg counting the roughage. That is poor-to-
  ordinary for zebu on a cake-and-bran ration, which is the band this operation should be in.

  6. THE PLANT FITS, AND HERE IS THE ARITHMETIC

  Tether and troughs: he has himself run 14 head under this hangar, so capacity is at least 14; the
  model stands 11.9375 at peak. Fits, with headroom.
  Truck: 12 head at 255 kg is 3,060 kg of payload on a lorry rated around 10 tonnes, one trip from
  Kolokani. Fits, and that is why he can quote 120,000 as a lump for "les douze" rather than per
  head.
  Labour: one man, 12 tethered animals, roughly 35 minutes a head a day for two feeds, water and
  mucking = 420 minutes against a 480-minute day. Fits, tightly — which is also why the same man
  cannot absorb a much larger lot without a second pair of hands.
  Water: 12 head at 40 litres a day in the hot season is 480 litres against a small motor-pump that
  clears 6,000 litres a day. Fits with an order of magnitude to spare, and it cross-checks his own
  number: 15,000 XOF a month of gasoil is around twenty litres of fuel, i.e. well under an hour of
  pumping a day, which is what 480 litres actually takes.
  Availability is the honest caveat: nothing here runs at 100%. Breakdowns, the pump failing, the
  bouvier ill, a market day washed out. His own operating answer to that is the two-day rule — "ce
  jour-la on ne descend pas, on revient deux jours apres" — which costs feed, not a cycle. On a
  monthly grid a two-day slip is inside the period and does not move a number; it is stated here so
  that its absence from the arithmetic is a decision and not an oversight.

  7. THE COST OF A TOUR

  At placement (month 1 of the tour): 12 x 275,000 = 3,300,000 for the animals, 120,000 for the
  truck and drover, 12 x 5,000 = 60,000 for the vet's vaccination and deworming round. 3,480,000.
  Feed, month 1: 16 sacks cake x 7,500 = 120,000; 8 sacks bran x 5,000 = 40,000; a quarter of the
  straw at 37,500 and a quarter of the salt and licks at 7,500. 205,000.
  Feed, each loaded month: 28 x 7,500 = 210,000; 14 x 5,000 = 70,000; 37,500 + 7,500. 325,000.
  (Straw and salt are spread evenly, not ramped: the ramp he describes is in the concentrate — "il
  faut charger" — while roughage is the base of the ration from day one.)
  Production overhead absorbed each month on feed: the bouvier at 50,000 and the pump at 15,000 =
  65,000.
  Monthly additions to inventory: 3,750,000 in month 1, then 390,000 in each of months 2, 3 and 4.
  Total inventoriable cost per tour: 4,920,000, which is 418,723.40 per head actually sold — note
  that this is above 4,920,000/12 = 410,000, and the difference IS the dead animal: normal loss is
  absorbed by the surviving units rather than written off, so it reaches the P&L as a higher cost
  per head sold.

  8. THE SALE

  8.8125 finished head at 500,000 = 4,406,250. 2.9375 dumped head at the ELICITED 325,000 =
  954,687.50. Turnover per tour 5,360,937.50; annual 10,721,875.
  Selling costs: 11.75 head x (5,000 broker + 1,500 foirail tax) = 76,375, plus zero for getting
  them to Niamana — the omitting value, with the question attached.
  Gross profit per tour: 5,360,937.50 - 4,920,000 = 440,937.50. That is the whole margin on four
  months' work and 4.9m of tied-up capital, and it is thin because the three non-thrivers cost a
  full lot's share of feed and come back at two-thirds of the finished price.

  9. THE LADDER, PER PERIOD

  Sale months (t=6, 11, 18, 23): revenue 5,360,937.50, less COGS 4,920,000 = gross profit
  440,937.50; less selling 76,375, less unabsorbed overhead 0, less mairie 0 = EBITDA 364,562.50;
  less depreciation 10,000 = EBIT 354,562.50; less impot synthetique at 3% of turnover = 160,828.125
  = NOPAT 193,734.375.
  Months on feed that are not sale months (t=3,4,5,8,9,10,15,16,17,20,21,22): no revenue, no COGS,
  no unabsorbed overhead (the bouvier and pump are absorbed into the animals). EBITDA 0, EBIT
  -10,000, NOPAT -10,000.
  Idle months (t=1,2,7,13,14,19): the bouvier and the pump run against nothing. EBITDA -65,000,
  EBIT -75,000, NOPAT -75,000.
  January (t=0, t=12): the same, plus the mairie's 25,000. EBITDA -90,000, EBIT -100,000, NOPAT
  -100,000.
  Annual: EBIT 324,125. Annual tax 321,656.25. Annual NOPAT 2,468.75. Read that pair again — a 3%
  charge on turnover takes 99.2% of the operating profit, because the purchased animal is 62% of
  revenue and the margin over it is 3%. This is the single most consequential number in the
  document and it is a consequence of the TAX BASE, not of the rate.

  10. WORKING CAPITAL, WHICH IS THE BUSINESS

  Inventory runs 0 -> 3,750,000 -> 4,140,000 -> 4,530,000 -> 0 through each tour. Peak 4,530,000,
  four times, every time from his own pocket or the caisse's.
  Tax payable: the charge accrues with the sale but the cash leaves on 31 March of the following
  year, so the liability is carried in NWC. The horizon OPENS owing 289,490.625 — last year's
  synthetique, sized on the 450,000 he says the market actually paid — which is discharged at t=2.
  Year 1's charge of 321,656.25 is discharged at t=14. Year 2's is still outstanding at t=23.
  NWC = inventory - tax payable. It swings from -321,656.25 to +4,530,000 and back, twice a year.
  There are no receivables and no payables: both his markets are spot and cash, which is exactly
  what "tant qu'elles sont a l'attache je n'ai rien en poche" describes.

  11. CAPEX AND DEPRECIATION

  1,200,000 spent four years before t=0 on a tole hangar and cement mangers, straight-lined over an
  assumed ten years: 10,000 a month, 480,000 already run off, 720,000 of book value carried in.
  Over the horizon another 240,000 is charged, closing at 480,000 of book value — six of ten years
  served. Nothing needs replacing inside 24 months, so capex is zero in every period, and that is a
  derived result rather than an omission: it is the cumulative test of the asset against its life.
  Under a turnover-based tax the depreciation has no cash effect whatever — it comes out of NOPAT
  and goes straight back in on the next line. It is carried anyway because the book value is what
  tells you when the zero-capex assumption expires.

  12. FCFF = NOPAT + D&A - dNWC - capex

  t=0 January: -100,000 + 10,000 - 0 - 0 = -90,000.
  t=1 February: -75,000 + 10,000 = -65,000.
  t=2 March: -75,000 + 10,000 - 289,490.625 = -354,490.625 (last year's tax leaves).
  t=3 April, placement: -10,000 + 10,000 - 3,750,000 = -3,750,000.
  t=4, t=5: -10,000 + 10,000 - 390,000 = -390,000 each.
  t=6 end-July, sale: 193,734.375 + 10,000 - (-4,690,828.125) = 4,894,562.50. The dNWC there is
  4,530,000 of inventory released less 160,828.125 of tax accrued but not yet paid.
  t=7 August, sourcing: -65,000. t=8 to t=11 repeat t=3 to t=6.
  Year 2 is identical except t=14, where the March payment is year 1's larger 321,656.25 rather than
  the inherited 289,490.625, giving -386,656.25 against -354,490.625.

  Year 1 FCFF: 154,634.375. Year 2: 122,468.75. Twenty-four months: 277,103.125.

  13. WHAT THAT NUMBER MEANS

  277,103.125 XOF of unlevered free cash flow over two years, on 21,443,750 of turnover, from an
  operation that at its deepest is 5,039,490.625 in the hole on cumulative cash. The asset side of
  this business, taken exactly as described and taxed as the rule says it should be, very nearly
  does not clear its own overhead. And it is an ASSET-side number: his 1,500,000 at 2% a month sits
  below this line entirely, and it is the reason the founder's lived experience of the business is
  harder than these figures already are.


  # ---------------------------------------------------------------- SOURCED
  accounting_framework:
    value: "AUDCIF (SYSCOHADA revise)"
    unit: framework
    prov: SOURCED
    source: "Fact annex ML-V25-01. Mali is an OHADA member state; the applicable financial-reporting framework is AUDCIF, not IFRS. Inventory is carried at cost (there is no IAS 41 fair-value remeasurement of the livestock), which is also how the founder himself accounts: \"Moi je ne compte pas au kilo, je compte a la bete\"."
    authority: "OHADA, Acte uniforme relatif au droit comptable et a l'information financiere (AUDCIF) / SYSCOHADA revise, adopted 26 January 2017, effective 1 January 2018 — https://www.ohada.org/en/ohada-accounting"
    verified: "2026-07-27"
    fact_id: ML-V25-01
  agricultural_profits_charge_scope:
    value: "livestock is inside the agricultural schedule; the charge falls only on exploitation outside agriculture traditionnelle"
    unit: rule
    prov: SOURCED
    source: "The rule that governs the founder's belief. Mali does levy an impot sur les benefices agricoles, and its base expressly includes \"les produits de l'elevage\" — so 'c'est de l'agriculture' does NOT put him outside the tax net, it puts him in a different schedule. The charge is narrowed by a carve-out: it strikes only profits from exploitation not falling within the framework of agriculture traditionnelle. The instrument I could reach does not define agriculture traditionnelle; that boundary is therefore carried separately as traditional_agriculture_carveout_applies (ASSUMED), not smuggled in here."
    authority: "Republique du Mali, Code General des Impots, chapitre de l'impot sur les benefices agricoles, art. 46 et suivants; Direction Generale des Impots du Mali, 'Les impots a payer' — https://www.dgi.gouv.ml/les-impots-a-payer/"
    verified: "2026-07-29"
  tax_regime:
    value: "impot_synthetique"
    unit: regime
    prov: SOURCED
    source: "The regime that fits an individual operator on this turnover. annual_turnover_xof (10,721,875) is an order of magnitude below impot_synthetique_threshold_xof, and he is an exploitant individuel with no legal form of his own. The synthetique is liberatoire: it discharges the BIC and the direct and indirect taxes of Titles I and II, which is why no separate profits tax, no patente and no VAT is charged anywhere below."
    authority: "Republique du Mali, Code General des Impots, regime de l'Impot Synthetique (Titre III, art. 70 et suivants); Direction Generale des Impots du Mali, 'Les types d'entreprises et les regimes d'imposition' — https://www.dgi.gouv.ml/les-types-dentreprises-et-les-regimes/"
    verified: "2026-07-27"
    fact_id: ML-V25-02
  impot_synthetique_rate:
    value: 0.03
    unit: fraction of annual turnover excluding tax
    prov: SOURCED
    source: "The base is TURNOVER-PROPORTIONAL, not a bracket forfait. This matters more here than anywhere else in the model: a 3% turnover charge against an operation whose purchased animal is roughly six-tenths of its revenue takes essentially the whole operating profit. See notes."
    authority: "Direction Generale des Impots du Mali, 'Les types d'entreprises et les regimes d'imposition' — https://www.dgi.gouv.ml/les-types-dentreprises-et-les-regimes/ ; Republique du Mali, Code General des Impots, art. 70"
    verified: "2026-07-27"
    fact_id: ML-V25-03
  impot_synthetique_threshold_xof:
    value: 50000000
    unit: XOF of annual turnover excluding tax
    prov: SOURCED
    source: "Ceiling of the regime. Declared so the regime choice is checkable against the model's own turnover rather than asserted. Note the annex records a 30,000,000 figure in the CGI text against 50,000,000 on the DGI page; the operation is far below either, so the discrepancy does not bind here — flagged in notes."
    authority: "Direction Generale des Impots du Mali, 'Les types d'entreprises et les regimes d'imposition' — https://www.dgi.gouv.ml/les-types-dentreprises-et-les-regimes/ ; Republique du Mali, Code General des Impots, art. 70"
    verified: "2026-07-27"
    fact_id: ML-V25-04
  vat_rate_on_sales:
    value: 0
    unit: fraction
    prov: SOURCED
    source: "No VAT is charged on the sale of the finished animals: the impot synthetique is liberatoire of the indirect taxes of Titles I and II, so turnover HT equals turnover. This is why no VAT line appears in trace and why the tax base is the gross sale proceeds."
    authority: "Republique du Mali, Code General des Impots — liberatoire scope of the impot synthetique (Titre III, art. 70 et suivants) and exonerations de TVA (art. 195); Direction Generale des Impots du Mali"
    verified: "2026-07-27"
    fact_id: ML-V25-05
  impot_synthetique_payment_month_index:
    value: 2
    unit: 0-based month index within the calendar year
    prov: SOURCED
    source: "31 March of the year following the year of assessment. Expressed as the 0-based index of March within a January-anchored grid year, i.e. t=2 in year 1 and t=14 in year 2. This is what creates the tax payable carried in NWC — the charge accrues with the sale, the cash leaves a quarter into the following year."
    authority: "Republique du Mali, Livre de Procedures Fiscales, art. 259; Direction Generale des Impots du Mali, echeance notice for 31 March — https://www.dgi.gouv.ml/prorogation-du-delai-de-paiement-de-limpot"
    verified: "2026-07-27"
    fact_id: ML-V25-06
  feed_sack_weight_kg:
    value: 50
    unit: kg per sack
    prov: SOURCED
    source: "The trade unit for tourteau de coton in Mali is the 50 kg sack; the same nominal sack is used for son. This is a world fact about packaging, not something only the founder holds, so it is sourced rather than asked. CAVEAT CARRIED: bran is far less dense than cake and a nominal bran sack may weigh materially less than 50 kg. If it does, the concentrate mass in trace is overstated and the conversion ratio in notes improves — direction only."
    authority: "Le Jecom (Bamako), 'Aliment betail : Le prix du sac de 50 kg de tourteaux en hausse' — https://www.lejecom.com/Aliment-betail-Le-prix-du-sac-de-50-kg-de-tourteaux-en-hausse_a2593.html ; corroborated by wholesale listings quoting tourteau de coton per tonne and per 50 kg sack for Mali (espaceagro.com)"
    verified: "2026-07-29"

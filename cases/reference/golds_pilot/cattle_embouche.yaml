  - "bran_sacks_month1 + (months_per_tour - 1) * bran_sacks_loaded_month == bran_sacks_per_tour"
  - "gain_share_month1 + (months_per_tour - 1) * gain_share_loaded_month == 1"

notes:

  - "FINDING — THE FOUNDER IS PROBABLY WRONG ABOUT THE ONE THING HE IS CERTAIN OF. He says flatly:
     'L'elevage, on ne paie pas d'impot la-dessus, c'est de l'agriculture.' The sourced rule says
     livestock IS agriculture for Malian tax purposes — and that is not an exemption, it is a
     schedule. Mali levies an impot sur les benefices agricoles whose base expressly includes les
     produits de l'elevage; what the charge spares is agriculture traditionnelle. So being
     agriculture does not put him outside the net, it changes which door he is inside. His belief is
     recorded as founder_tax_belief_exempt_flag, a fact about the business, and is used nowhere in
     the arithmetic; the arithmetic runs on impot_synthetique_applies_flag, a fact about the world.
     They are different objects and the model keeps them apart, which is the point."

  - "JUDGEMENT CALL — WHERE THE CARVE-OUT ENDS. The instrument I could reach does not define
     agriculture traditionnelle, so traditional_agriculture_carveout_applies is tagged ASSUMED and
     not SOURCED, and it is the weakest load-bearing input in the document. I set it against him
     because the operation he describes is capitalised and market-facing: purchased animals he did
     not breed, bought at one market and sold at another, tethered under a purpose-built shelter
     with cement mangers, on tonnes of purchased concentrate, with a paid full-time herdsman and a
     credit-union facility behind the cycle. If a Kati assessor reads it the other way — village
     embouche at twelve head is traditional husbandry — the tax line falls away and every FCFF
     figure below EBIT rises. Direction only: it is the largest single upside in the model. What
     would change my mind is the text defining the term or an assessment notice for a comparable
     operator; neither is something this founder can supply, which is why it is ASSUMED rather than
     a question."

  - "FINDING — A TURNOVER TAX IS BRUTAL ON THIS SHAPE OF BUSINESS, AND THE RATE IS NOT THE REASON.
     Annual EBIT is 324,125 on annual turnover of 10,721,875. The impot synthetique takes 3% of the
     turnover, 321,656.25, leaving annual NOPAT of 2,468.75. The mechanism is structural, not
     unlucky: the purchased animal alone is about six-tenths of revenue and passes straight through,
     so a levy on the gross proceeds is a levy on somebody else's cattle as much as on his value
     added. Any buy-feed-resell trade with a low margin over a dominant purchased input meets this
     the same way. It is the reason the FCFF headline is small, and it is worth saying plainly that
     the arithmetic here is not fragile — it is the tax BASE that is doing the damage, and a reader
     who wants a different answer should argue about the regime, not about the rate."

  - "FINDING — THE RATION AS STATED DOES NOT FIT THE ANIMALS AS STATED, AND I HAVE NOT ABSORBED IT.
     Taken literally — 150 sacks of 50 kg per tour, twelve head, 120 days — trace.concentrate_eaten_kg
     runs above trace.concentrate_norm_max_kg in every loaded month, where that ceiling is the top of
     the sourced Sahelian supplementation band applied to the standing liveweight in the same month.
     The adaptation month sits comfortably inside the band; the three loaded months do not. Adding
     the roughage, the whole lot is eating at the physiological ceiling for bovine dry-matter intake.
     I have left his money figures untouched, because 1,180,000 XOF per tour leaves his hand whatever
     the sacks weigh, and reported the mismatch instead of smoothing it into a yield ratio. Three
     candidate explanations, not equivalent and worth separating before anyone lends against this:
     the sacks weigh less than nominal (most likely for bran, which is bulky and is the input I could
     not verify separately); the 100-and-50 actually covers a fourteen-head lot or spans a tour
     boundary; or he genuinely over-feeds concentrate. The third would be self-consistent with the
     rest of his account — with the poor conversion, with the animal that choked on cake, and with
     his own conclusion that 'apres quatre mois ca ne rend plus, la bete mange autant et ne grossit
     plus pareil.' If it is the third, the finding is not an error in the model, it is money on the
     floor of his manger."

  - "FINDING — THREE ANIMALS IN TWELVE ARE THE DIFFERENCE BETWEEN A TRADE AND A HOBBY. He mentions
     the non-thrivers in half a sentence and moves on. They eat a full share of a 1,180,000 ration,
     carry a full share of the truck, the vet and the bouvier, and come back at poor_doer_sale_price_xof
     rather than finished_price_xof. Modelled as a separate grade rather than averaged into the lot,
     they are the largest drag on gross profit per tour. This is also why the two highest-ranked
     questions in the interview are both about them — how many, and what they fetch — and why an
     average-animal model of this business would be not merely imprecise but wrong in kind."

  - "FINDING — THE FOUNDER'S OWN DIAGNOSIS OF HIS UNCLE IS CORRECT, AND THE MODEL SHOWS WHY. 'Le
     bouvier, l'eau, le transport, c'est pareil a trois ou a douze.' The herdsman, the pump, the
     mairie levy, the depreciation and the truck are all in the model as fixed per month or per tour,
     not per head. At twelve head that block consumes most of the gross margin; at three head it
     cannot be covered at all. Direction only, no counterfactual number: the scale threshold is real
     and it sits above three."

  - "SIMPLIFICATION — HIS OWN LABOUR IS NOT COSTED. He does the sourcing at Kolokani, the selling at
     Niamana and the judgement that decides which animals are worth having, and takes no wage. NOPAT
     therefore partly remunerates his time rather than his capital. This is conventional for an
     owner-operator unlevered build and it is correct for a valuation of the ASSET, but a reader
     comparing this FCFF against a salaried alternative should know the comparison is not like for
     like."

  - "SIMPLIFICATION — TWO REAL COSTS ARE BORNE BY SOMEBODY ELSE AND PRICED AT ZERO. The yard is 'sur
     la concession de mon pere' and pays no rent; the bouvier is 'nourri et loge sur place' and the
     food and lodging appear nowhere in the 50,000 a month. Both are genuine economic costs of the
     operation, both are related-party subsidies, and both are excluded because no cash moves. If the
     father ever charged rent, or if the herdsman had to be boarded commercially, the fixed block
     would rise. Direction only."

  - "JUDGEMENT CALL — THE FEED PARAGRAPH IS READ PER TOUR, NOT PER YEAR. 'Sur un tour, pour douze
     betes' opens the paragraph, and the straw and the salt sentences fall inside it, so
     straw_purchase_per_tour_xof and salt_and_licks_per_tour_xof are charged twice a year. The
     alternative reading — that the sacks are per tour but the straw and licks are an annual purchase
     made once after the harvest — is grammatically available and he does say he gathers straw
     'apres la recolte'. Under that reading the feed cost falls. Direction only; the per-tour reading
     is the conservative one and it is what the sentence's own scope says."

  - "JUDGEMENT CALL — NORMAL MORTALITY IS ABSORBED, NOT WRITTEN OFF. His loss rate is 2.08% of head
     per tour, below the ordinary 2-5% range for fattening cattle, so it is normal loss: the cost
     already sunk into an animal that dies is carried by the surviving units rather than expensed
     separately. That is why the physical roll-forward (trace.head_on_feed, trace.liveweight_kg) has
     mortality lines and the value roll-forward (trace.inventory_xof) does not, and why the cost per
     head SOLD is above the cost per head PLACED. If mortality ever ran above the normal band the
     excess would have to be expensed as abnormal loss instead."

  - "JUDGEMENT CALL — THE PUMP DIESEL IS CHARGED IN ALL 24 MONTHS. He says 'quinze mille par mois'
     without qualification, so it is charged monthly throughout, including the idle months when there
     is nothing to water and the household would be pumping anyway. This is the literal reading and
     the conservative one. It is a small line and I have not spent an interview question on it; the
     equivalent question about the bouvier, which is more than three times the size, is asked."

  - "SIMPLIFICATION — AVAILABILITY IS ACKNOWLEDGED AND NOT MODELLED. Nothing runs at 100%: pumps
     fail, herdsmen fall ill, the road from Kolokani closes, and the foirail has bad days — he
     describes exactly that ('ce jour-la on ne descend pas, on revient deux jours apres'). On a
     monthly grid a two-day slip is inside the period and moves no number, and his own rule caps the
     slip at two days because 'elles mangent'. A larger disruption — a lost placement window, a
     month's delay in sourcing — would push a tour across a period boundary and is not modelled. The
     capacity checks confirm the plant can deliver the claimed output; they do not claim it never
     stops."

  - "OMISSION CARRIED, NOT CLOSED — GETTING THE ANIMALS TO MARKET. He prices the inbound truck to the
     last franc and says nothing about the outbound leg from Kati to Niamana, which is a real journey
     across Bamako. sale_transport_cost_per_tour_xof runs at the omitting value of zero with the
     question attached rather than being quietly filled in with a guess. If they trek on the hoof
     with the bouvier the zero is right; if he hires a truck it is not."

  - "OMISSION — NO INSURANCE, NO PROVISION, NO CONTINGENCY. There is no livestock insurance in the
     account and none is modelled; the mortality rate IS the provision. There is also no allowance
     for a bad market: he told us one happened last year and priced it, and the model runs on this
     year's realisation. Cattle prices at a Bamako foirail move with the season, the harvest, Tabaski
     and the state of the pastures, and none of that is in here. Direction only: the finished price
     is the largest single number in the model and the horizon is deliberately short because of it."

  - "NOT MODELLED, AND IT IS THE BUTCHER'S PROBLEM NOT HIS — THE CARCASS. He notices the economics
     without doing the arithmetic: 'Le boucher, lui, il ne paie pas le maigre et le gras au meme prix
     au kilo.' He is right, and the reason is that dressing percentage rises with condition, so a
     finished animal yields proportionally more saleable carcass per kilo of liveweight than a thin
     one. That transformation happens after his sale and touches none of his cash, so it is stated
     and not modelled. It does explain why he can price by the head and still be paid for the meat he
     put on, which is his own theory of the business: 'ce qu'il y a en plus, c'est la viande que j'ai
     mise dessus.'"

  - "NOT MODELLED — FEED SUBSTITUTION. He names aliment betail as a fallback 'quand le tourteau
     manque' and bourgou 'quand j'en trouve'. Both are contingent and unpriced, and substituting
     compound feed for cake would change the ration cost. Modelling the fallback would require a
     frequency and a price he did not give and I did not ask for, because on his own telling the
     cake-and-bran ration is the base case and the substitutes are the exception."

  - "STRUCTURAL — THE LOAN IS BELOW THIS LINE. The 1,500,000 at 2% a month over six months is
     financing and is excluded from the unlevered build by construction, as are the fees on it. It is
     declared as an input only so it can be discussed. Two observations, both direction-only: 2% a
     month is a heavy rate against a business with this asset-side margin, and the six-month term
     against a four-month tour means the facility is outstanding through the idle month as well as
     the productive ones. The equity holder's experience of this business is materially harder than
     the FCFF line, and that gap is the interest."

  - "DATA NOTE — THE THRESHOLD DISCREPANCY IN THE SOURCE MATERIAL. The impot synthetique ceiling is
     recorded as 30,000,000 in the CGI text and 50,000,000 on the DGI page. This model does not have
     to resolve it: annual_turnover_xof is below both by a wide margin, so the regime conclusion is
     the same either way. Flagged because it would bind for a larger operator and a reader should not
     inherit the 50,000,000 figure from here without checking it."

  - "DATA NOTE — THE ONE UNVERIFIED PACKAGING FACT. feed_sack_weight_kg is sourced at 50 kg for
     cottonseed cake, which is the Malian trade unit, and the same weight is applied to bran because
     bran moves in the same nominal sack. Bran is much less dense and a bran sack may weigh
     materially less. If it does, the concentrate mass in trace is overstated, the conversion ratio
     improves, and the ration finding above softens without disappearing — the cake alone is enough
     to breach the band in the loaded months. Direction only. This is a world fact and would be
     sourced, not asked, if a Bamako feed dealer's spec sheet were to hand."

  - "DEFERRED — WHAT A SECOND CONVERSATION SHOULD OPEN. Three things are outside the model and outside
     the questions because they change the business rather than a number in it: whether the tether
     could carry the fourteen head he has already run, since the fixed block is the binding
     constraint and the marginal animal is nearly all margin; whether the third tour is really
     impossible or merely awkward, given that his own stated cycle length and sourcing gap leave two
     months of slack a year (asserted in checks); and whether the non-thrivers are a sourcing problem
     he could fix at Kolokani rather than a fact of nature. All three are strategy, not measurement,
     and none of them belongs in a reference derivation of the cash flow as the operation currently
     runs."

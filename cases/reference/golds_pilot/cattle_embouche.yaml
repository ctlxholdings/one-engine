    authority: "FAO, 'Mise au point de techniques d'embouche bovine villageoise dans le bassin arachidier senegalais' — https://www.fao.org/4/v0600t/v0600T0d.htm"
    verified: "2026-07-29"
  adg_benchmark_low_g_per_day:

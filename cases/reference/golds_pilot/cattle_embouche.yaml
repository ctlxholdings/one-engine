    source: "Upper bound of the concentrate supplementation rate used in Sahelian village cattle fattening. This is the benchmark the ration in this model is tested against — see trace.concentrate_norm_max_kg and the finding in notes."
    authority: "FAO, 'Mise au point de techniques d'embouche bovine villageoise dans le bassin arachidier senegalais' — https://www.fao.org/4/v0600t/v0600T0d.htm (concentrate fed at 1 to 1.5 kg per 100 kg liveweight per day)"
    verified: "2026-07-29"
  concentrate_norm_low_kg_per_100kg_lw_day:

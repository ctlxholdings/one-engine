contract: "v2.6"
id: cattle_embouche_kati_ml
title: "Embouche bovine at Kati (Bamako) — 12-head tethered fattening rounds: unlevered FCFF"
currency: XOF

grid:
  periods: 24
  freq: monthly
  why: >-
    MONTHLY, 24 PERIODS (January of year 1 through December of year 2), and both the length and the
    frequency are my choices, not facts about the business.

    Frequency. The founder's unit of account is the tour: "Un tour, ca fait quatre mois." A monthly
    grid is the coarsest resolution that can hold a four-month cycle and still show what happens
    inside it — the ration ramp he states explicitly ("Le premier mois elles mangent moins ; c'est
    apres qu'il faut charger"), the month of sourcing between rounds ("il faut remonter chercher des
    betes qui valent la peine, ca prend un mois"), and above all the working-capital swing, which IS
    this business: "Mon argent est dans les betes : tant qu'elles sont a l'attache je n'ai rien en
    poche." An annual grid nets the purchase against the sale inside one period and reports a
    business that never absorbs capital. That is the single most misleading thing a model of this
    operation can do, so annual is ruled out. A weekly or daily grid would resolve nothing further:
    he places a whole lot on one day and clears it on one day, and every cost he named is quoted per
    month, per tour or per head.

    Horizon. 24 months is chosen to be simultaneously (i) a whole number of production cycles — four
    tours, at two per year as he states, so the horizon opens and closes with an empty tether and no
    stub cycle whose stranded inventory would have to be assumed away; (ii) a whole number of tax
    years, so the annual levies land intact and the impot synthetique's 31 March payment date has
    room to complete one full accrue-then-pay cycle inside the window; and (iii) long enough to
    repeat the seasonal pattern once, which is the minimum needed to show that the pattern is a
    pattern.

    Why not longer. Not the asset: the shed has six of its ten assumed years left at t=23 (see
    trace.book_value_xof), so nothing forces a replacement inside any horizon out to six years. The
    binding constraint is the finished price, which is the largest single number in the model and
    which he has already watched move within his own memory — "cinq cent mille ; l'annee derniere
    c'etait plutot quatre cent cinquante, le marche n'etait pas bon." Nothing in the utterance
    supports a view on Malian cattle prices two harvests out, and a five-year answer would be a view
    on the price dressed up as a view on the operation. The horizon stops where the question stops
    being answerable.

    Calendar anchoring. t=0 is January so that the grid year and the Malian tax year coincide.
    Placements are anchored on the end of the dry season, which is his stated buying window ("Le bon
    moment pour acheter, c'est la fin de la saison seche"): tour 1 is placed in April (t=3) and sold
    at end-July (t=6); after the one sourcing month he names, tour 2 is placed in September (t=8) and
    sold at end-December (t=11); year 2 repeats. The residual January-March idle stretch is the
    arithmetic consequence of two four-month tours plus his sourcing month inside twelve months, and
    it is also his own answer to why three tours do not happen. A reader who disagrees with the
    anchoring should note that it changes WHEN cash moves, not the annual totals.

utterance:
  fr: |
    Je fais l'embouche a Kati, sur la concession de mon pere, a la sortie de Bamako. Des boeufs, des
    taurillons de trois, quatre ans. J'achete maigre, je nourris, je revends gras.

    Un tour, ca fait quatre mois. Trois mois et demi, quatre mois. Je mets douze betes a l'attache —
    la derniere fois j'en avais quatorze. Deux tours dans l'annee. On dit qu'on peut en faire trois,
    mais entre deux tours il faut remonter chercher des betes qui valent la peine, ca prend un mois.

    J'achete a Kolokani. Une bete maigre, c'est deux cent soixante-quinze mille ; il y en a que je
    paie deux cent cinquante, d'autres trois cent mille quand l'animal est bien bati. Le camion pour
    redescendre les douze, cent vingt mille avec le convoyeur. Le bon moment pour acheter, c'est la
    fin de la saison seche : les betes sortent maigres du paturage et tout le monde a besoin d'argent.
    Mais c'est la aussi que la paille est chere.

    A l'attache, c'est du tourteau de coton et du son, de l'aliment betail quand le tourteau manque,
    avec la paille de riz et du bourgou quand j'en trouve. Sur un tour, pour douze betes, il me faut
    cent sacs de tourteau et cinquante sacs de son. Le sac de tourteau est a sept mille cinq cents. Le
    son, cinq mille. La paille, j'en ramasse apres la recolte et j'en achete pour cent cinquante
    mille. Le sel et les pierres a lecher, trente mille. Le premier mois elles mangent moins ; c'est
    apres qu'il faut charger.

    Un taurillon qui rentre a deux cent cinquante, deux cent soixante kilos ressort a trois cent
    trente, trois cent quarante. On passe le ruban, et les gens du boucher savent voir. Ca fait
    quatre-vingts kilos, des fois quatre-vingt-dix quand la bete mange bien, des fois soixante
    seulement. Il y en a toujours deux ou trois dans le lot qui ne profitent pas ; ceux-la je les
    brade.

    Je vends au foirail de Niamana. Une bete finie part a cinq cent mille ; l'annee derniere c'etait
    plutot quatre cent cinquante, le marche n'etait pas bon. Le courtier prend cinq mille par bete, la
    taxe du foirail mille cinq cents. Moi je ne compte pas au kilo, je compte a la bete : ce qu'il y a
    en plus, c'est la viande que j'ai mise dessus. Le boucher, lui, il ne paie pas le maigre et le
    gras au meme prix au kilo.

    Je vends quand la bete est prete, je n'attends pas. Il y a des semaines ou le foirail est plein et
    le prix tombe ; ce jour-la on ne descend pas, on revient deux jours apres. Pas plus : elles
    mangent. Une fois j'ai garde un lot cinq mois pour attendre mieux. Apres quatre mois ca ne rend
    plus, la bete mange autant et ne grossit plus pareil. J'ai mange en tourteau ce que j'avais gagne.

    J'ai un bouvier, cinquante mille par mois, nourri et loge sur place ; il n'y a pas de papier entre
    nous, c'est de la parole. Le hangar en tole et les mangeoires en ciment m'ont coute un million
    deux cent mille il y a quatre ans. Il y a un puits, l'eau ne me coute que le gasoil de la pompe,
    quinze mille par mois. Le veterinaire passe vacciner et deparasiter, cinq mille par bete.

    En quatre ans j'ai perdu deux betes : une s'est etouffee avec le tourteau, l'autre est arrivee
    deja malade. Mon argent est dans les betes : tant qu'elles sont a l'attache je n'ai rien en poche.
    Pour le dernier tour j'ai pris un million cinq cent mille a la caisse, deux pour cent par mois sur
    six mois. Mon oncle fait la meme chose a Fana avec trois betes et il ne s'en sort pas : le
    bouvier, l'eau, le transport, c'est pareil a trois ou a douze.

    L'elevage, on ne paie pas d'impot la-dessus, c'est de l'agriculture. La mairie me demande
    vingt-cinq mille par an pour l'enclos ; je ne sais pas trop a quel titre, je paie et on me donne un
    papier. On m'a dit que si le commerce devient trop gros il faut aller aux impots, mais je suis
    loin de ca.
  en: |
    I do embouche at Kati, on my father's compound, just outside Bamako. Cattle, young bulls of three
    or four years. I buy them thin, I feed them, I sell them fat.

    One round takes four months. Three and a half, four months. I put twelve head on the tether — last
    time I had fourteen. Two rounds in the year. They say you can do three, but between two rounds you
    have to go back up and look for animals worth having, and that takes a month.

    I buy at Kolokani. A thin animal is two hundred and seventy-five thousand; there are some I pay
    two hundred and fifty for, others three hundred thousand when the animal is well built. The truck
    to bring the twelve down, a hundred and twenty thousand with the drover. The good time to buy is
    the end of the dry season: the animals come off the pasture thin and everyone needs money. But
    that's also when straw is expensive.

    On the tether it's cottonseed cake and bran, compound feed when cake is short, with rice straw and
    bourgou when I find any. Over one round, for twelve head, I need a hundred sacks of cake and fifty
    sacks of bran. A sack of cake is at seven thousand five hundred. Bran, five thousand. Straw, I
    gather some after the harvest and I buy a hundred and fifty thousand worth. Salt and licking
    stones, thirty thousand. The first month they eat less; it's afterwards you have to load them up.

    A young bull that comes in at two hundred and fifty, two hundred and sixty kilos goes out at three
    hundred and thirty, three hundred and forty. We run the tape over them, and the butcher's men know
    how to look. That makes eighty kilos, sometimes ninety when the animal eats well, sometimes only
    sixty. There are always two or three in the lot that don't come on; those ones I let go cheap.

    I sell at the Niamana livestock market. A finished animal goes for five hundred thousand; last
    year it was more like four hundred and fifty, the market wasn't good. The broker takes five
    thousand a head, the market tax one thousand five hundred. Me, I don't count by the kilo, I count
    by the animal: what's there on top is the meat I put on him. The butcher, though — he doesn't pay
    the same price per kilo for a thin one and a fat one.

    I sell when the animal is ready, I don't wait. There are weeks when the market is full and the
    price falls; that day you don't bring them down, you come back two days later. No longer than
    that: they're eating. Once I held a lot for five months waiting for better. After four months it
    doesn't pay any more, the animal eats as much and doesn't put on the same. I ate up in cottonseed
    cake what I had gained.

    I have a herdsman, fifty thousand a month, fed and housed on site; there's no paper between us,
    it's on our word. The sheet-metal shelter and the concrete troughs cost me one million two hundred
    thousand four years ago. There's a well, the water costs me only the diesel for the pump, fifteen
    thousand a month. The vet comes to vaccinate and deworm, five thousand a head.

    In four years I've lost two animals: one choked on the cake, the other arrived already sick. My
    money is in the animals: as long as they're on the tether I have nothing in my pocket. For the
    last round I took one million five hundred thousand from the credit union, two percent a month
    over six months. My uncle does the same thing at Fana with three animals and he doesn't get by:
    the herdsman, the water, the transport, it's the same at three as at twelve.

    Livestock, you don't pay tax on that, it's agriculture. The town hall asks me twenty-five thousand
    a year for the pen; I'm not really sure under what heading, I pay and they give me a paper. I've
    been told that if the business gets too big you have to go to the tax office, but I'm a long way
    from that.


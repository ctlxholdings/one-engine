  concentrate_offered_kg_per_tour:
    value: 7500
    unit: kg as-fed per tour
    prov: INFERRED
    derivation: "(cake_sacks_per_tour + bran_sacks_per_tour) * feed_sack_weight_kg"
    source: "150 sacks at 50 kg. This is the number that will not fit — see the concentrate-intensity finding in notes."

  - "max(trace.feed_cost_xof) == cake_sacks_loaded_month * cake_sack_price_xof + bran_sacks_loaded_month * bran_sack_price_xof + (straw_purchase_per_tour_xof + salt_and_licks_per_tour_xof) / months_per_tour"
  - "sum(trace.herdsman_cost_xof) == herdsman_monthly_wage_xof * herdsman_months_paid_per_year * grid.periods / 12"

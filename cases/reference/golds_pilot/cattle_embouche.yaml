  - "trace.head_on_feed[t] == trace.head_on_feed[t-1] + trace.head_placed[t] - trace.head_died[t] - trace.head_sold[t]"
  - "trace.liveweight_kg[t] == trace.liveweight_kg[t-1] + trace.liveweight_placed_kg[t] + trace.liveweight_gain_kg[t] - trace.liveweight_died_kg[t] - trace.liveweight_sold_kg[t]"

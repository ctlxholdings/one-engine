    date: "2026-07-29"
  fridge_replacement_period:
    value: 0
    unit: "0-based period index"
    prov: "DEFAULTED"
    source: "replacement rule: an asset past its useful life is replaced at the earliest period it can be. Both fridges are exactly at end of life at t=0 AND one has already failed destructively (the weekend power cut), so t=0 is the earliest defensible date. Placing it later would understate capex inside the horizon"

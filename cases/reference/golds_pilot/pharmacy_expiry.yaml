contract: "v2.6"
id: "sn_dakar_officine_pharmacie_expiry_24m"
title: "Officine de pharmacie, Parcelles Assainies (Dakar) - unlevered FCFF over 24 months, with the expiry / destruction-record tax wedge"
currency: "XOF"

grid:
  periods: 24
  freq: "monthly"
  why: |
    MONTHLY, because every clock the founder actually runs on is monthly and none of them is
    annual: he buys and sells 'dans le mois'; he pays the grossiste 'a trente jours'; he makes up
    the third-party bordereaux 'en fin de mois' and is settled 'a deux ou trois mois'; rent and
    the five wages are monthly. An annual grid would net the 3.0-month receivable lag against the
    1.0-month payable lag and against 45 days of stock, and the entire working-capital structure
    he spent a third of the interview describing would vanish into a single number. It is also the
    only frequency at which the demand shock he reports ('trois mois sans personne' during the road
    works) is even expressible.
    
    24 PERIODS, because two years is where four separate clocks in this business coincide and past
    which the question stops being answerable:
      (i)  it spans TWO complete annual physical counts - and the count is the only instrument that
           measures the shrinkage this model has to charge. One count gives a number; two give a
           rate, and he gave me exactly two (900,000 and 600,000-and-some).
      (ii) it matches the age of the oldest stock in the back room ('depuis deux ans') and his own
           accumulation window ('un million, un million et demi sur deux ou trois ans'). The expiry
           charge is calibrated on that window; running longer than the window would extrapolate it.
      (iii) both short-lived assets are already past their useful life at t=0 (the two fridges at
           seven years against a seven-year life; the till software at seven years against five), so
           a full replacement cycle for each falls INSIDE the horizon. A shorter horizon would show
           zero capex and a fictitiously high FCFF.
      (iv) the shelving/counter cohort still has 36 months of life at t=0, so depreciation is
           uninterrupted across the whole window and no residual-value guess is needed.
    Past 24 months the two things that decide the answer are both undated: the public price of every
    regulated line is administered (arrete 188/MSHP/DPM), so I cannot forecast price; and the
    procès-verbal de destruction that unlocks the tax deduction has no date at all ('on attend').
    Forecasting further would be forecasting an administrative queue, which is not a business fact.

utterance:
  fr: |
    J'ai une officine aux Parcelles Assainies, à Dakar, ouverte il y a sept ans. Elle est à mon nom :
    chez nous une pharmacie appartient au pharmacien qui la tient. Mon comptable me parle de passer en
    société, je n'ai jamais compris ce que ça changerait.
    
    Le métier n'est pas compliqué. Le grossiste livre, on range sur les rayons, on revend au prix
    marqué sur la boîte — je ne fixe pas les prix, ils sont fixés. Une boîte que je paie huit mille,
    l'affiché c'est dix mille. Sur les crèmes et les compléments je suis plus libre, je prends
    davantage. J'achète pour à peu près huit millions dans le mois, je vends pour dans les dix. Entre
    les deux il y a le loyer, les salaires, le courant, et moi.
    
    Entre cent et cent trente clients dans la journée, six jours sur sept, plus la garde une fois sur
    six. Le panier moyen tourne autour de trois mille cinq cents, mais ça va de cinq cents francs pour
    une plaquette de paracétamol à cinquante mille pour une ordonnance d'hôpital. Un client sur quatre
    ne paie pas au comptoir : bons de l'IPM, mutuelles, assurances des sociétés. Je fais les bordereaux
    en fin de mois, on me règle à deux ou trois mois, et il y en a toujours qu'on rejette — un tampon
    qui manque.
    
    Deux grossistes, un troisième pour ce qu'ils n'ont pas. Ils passent deux fois par jour, je commande
    au fur et à mesure. Je paie à trente jours ; comptant, deux pour cent, mais je n'ai pas toujours de
    quoi.
    
    Sur les rayons j'ai peut-être trois mille cinq cents références. Il y a des produits que je garde
    parce qu'un médecin du quartier les prescrit, sinon le client va ailleurs : ceux-là, deux ou trois
    boîtes dans l'année. Les dates, on devrait les faire tous les mois ; en vrai c'est deux ou trois
    fois par an. Et il y a le froid : une coupure un vendredi soir, et le lundi j'ai vidé le
    réfrigérateur, l'insuline et les vaccins. Six cent mille.
    
    Dans la réserve, derrière, j'ai sept ou huit cartons de périmés, dont certains depuis deux ans. On
    ne peut pas les jeter comme ça : il faut que ce soit détruit devant les gens de la Direction de la
    pharmacie, qui me remettent le papier. J'ai déposé la demande, relancé trois fois ; on m'a dit
    qu'ils feraient ça pour toute la zone. On attend. Chaque année mon comptable me réclame ce
    procès-verbal : sans ça, dit-il, pour l'administration c'est comme si la marchandise était toujours
    là, et je ne peux rien passer dessus. Je ne sais pas si c'est vrai — un confrère à Thiès me dit
    qu'il le passe quand même.
    
    Combien il y a là-dedans ? Je n'ai jamais fait le compte. Il m'a demandé un montant une fois, je ne
    le lui ai jamais donné. À la louche un million, un million et demi sur deux ou trois ans, mais
    c'est à vue de nez.
    
    Chaque fin d'année on ferme deux jours pour compter, et chaque fois il manque quelque chose : la
    dernière fois l'écart était dans les neuf cent mille, l'année d'avant six cent mille et quelques.
    Des boîtes dont la date était passée et qu'on a mises de côté sans le noter ? De la casse ? Quelque
    chose sorti sans passer par la caisse ? Je ne peux pas vous le dire. Pour moi c'est la perte, un
    point c'est tout : je mets tout ensemble. Je ne vais accuser personne. Mais ce qui disparaît, ce
    n'est jamais le sirop à mille francs ; c'est les crèmes, les compléments, les petites boîtes chères
    qui tiennent dans une poche.
    
    Le loyer, quatre cent cinquante mille par mois. Trois personnes au comptoir, cent trente, cent dix
    et cent mille, un gardien à soixante-quinze mille, une dame pour le ménage à quarante mille, plus
    la sécurité sociale par-dessus. Les rayonnages, le comptoir, les deux réfrigérateurs : dans les
    quatre millions à l'ouverture, et le logiciel de caisse huit cent mille. Sur les médicaments il n'y
    a pas de TVA, c'est exonéré, rien à réclamer ni à payer ; sur le loyer et le matériel on me la
    facture, mais je ne sais pas ce que ça devient. L'an dernier ils ont refait la route devant : trois
    mois sans personne. Et les dates continuaient de courir.
  en: |
    I have a pharmacy in Parcelles Assainies, in Dakar, opened seven years ago. It's in my own name:
    here a pharmacy belongs to the pharmacist who runs it. My accountant talks to me about turning it
    into a company; I've never understood what that would change.
    
    The trade isn't complicated. The wholesaler delivers, we put things out on the shelves, we sell at
    the price printed on the box — I don't set the prices, they're set. A box I pay eight thousand for
    is displayed at ten thousand. On creams and supplements I'm freer, I take more. I buy about eight
    million in the month, I sell about ten. Between the two there's the rent, the wages, the
    electricity, and me.
    
    Between a hundred and a hundred and thirty customers in the day, six days out of seven, plus night
    duty one week in six. The average basket works out around three thousand five hundred, but it runs
    from five hundred francs for a strip of paracetamol to fifty thousand for a hospital prescription.
    One customer in four doesn't pay at the counter: IPM vouchers, mutuals, company insurance schemes.
    I make up the statements at the end of the month, they settle at two or three months, and there are
    always some they reject — a missing stamp.
    
    Two wholesalers, and a third for what they don't have. They come round twice a day, I order as I
    go. I pay at thirty days; for cash, two percent, but I don't always have it.
    
    On the shelves I have maybe three thousand five hundred lines. There are products I keep because a
    doctor in the neighbourhood prescribes them, otherwise the customer goes elsewhere: those, two or
    three boxes a year. The dates, we ought to go through them every month; in reality it's two or
    three times a year. And then there's the cold: a power cut on a Friday evening, and on the Monday I
    cleared out the fridge, the insulin and the vaccines. Six hundred thousand.
    
    In the back room I have seven or eight boxes of expired product, some of them there for two years.
    You can't just throw them out: it has to be destroyed in front of the people from the Pharmacy
    Directorate, who give me the paper. I put in the request, chased it three times; I was told they'd
    do it for the whole district. We're waiting. Every year my accountant asks me for that official
    record: without it, he says, as far as the authorities are concerned it's as if the goods were
    still there, and I can't put anything through on them. I don't know whether that's true — a
    colleague in Thiès tells me he puts it through anyway.
    
    How much is in there? I've never counted it up. He asked me for an amount once, I never gave it to
    him. Off the top of my head a million, a million and a half over two or three years, but that's a
    rough guess.
    
    Every year-end we close for two days to count, and every time something is missing: the last time
    the gap was around nine hundred thousand, the year before six hundred thousand-odd. Boxes whose
    date had passed and that were put aside without anyone noting it? Breakage? Something that went out
    without going through the till? I can't tell you. To me it's the loss, full stop: I put it all
    together. I'm not going to accuse anybody. But what disappears is never the thousand-franc cough
    syrup; it's the creams, the supplements, the small expensive boxes that fit in a pocket.
    
    The rent, four hundred and fifty thousand a month. Three people at the counter, a hundred and
    thirty, a hundred and ten and a hundred thousand, a guard at seventy-five thousand, a lady for the
    cleaning at forty thousand, plus social security on top. The shelving, the counter, the two
    fridges: about four million when I opened, and the till software eight hundred thousand. On
    medicines there's no VAT, they're exempt, nothing to claim and nothing to pay; on the rent and the
    equipment they charge it to me, but I don't know what becomes of it. Last year they redid the road
    outside: three months with nobody. And the dates kept on running.


notes:
  - "FINDING - the tax base and the economics point in opposite directions, and that is the whole case. EBIT is negative and taxable profit is over seven million, in both years. Two independent causes, and it is worth separating them because only one is fixable by him: the non-deductibility of an exploitant individuel's own drawings is a consequence of legal form and is his to change; the non-deductibility of the stock losses is a consequence of an administrative queue he does not control. He is paying cash tax on both."
  - "FINDING - the destruction record is an asset sitting in a back room. trace.disallowed_cumulative is a real, quantified, unrecognised deferred tax asset that grows every month the proces-verbal does not arrive, and it is the single largest recoverable item in this file. The founder has never valued the cartons because nobody asked him to in a way he could act on; his accountant asked once, for an amount, and got nothing. The actionable version of that request is: count them at cost, line by line, with dates, and file the inventory WITH the destruction request. That inventory is what turns the cartons into a deduction on the day the Direction arrives."
  - "FINDING - the confrere in Thies is not applying a different rule. He is carrying a reassessment exposure. Recorded as three distinct objects, because they are three distinct objects: what the founder believes (he does not know), what his accountant advises (correct in substance), and what the rule is. See stock_loss_deduction_requires_destruction_record, and the caveat inside it: what was verified is the general justification requirement plus the settled destruction-record doctrine, not a medicine-specific article of the Senegalese CGI. If a reader can pin that article, it should replace my citation."
  - "FINDING - 'je ne sais pas ce que ca devient' has a definite answer and it is bad news. The VAT on rent, power and equipment is irrecoverable because exempt is not zero-rated, and article 380's deduction-preserving list excludes medicines. It is not a timing item and it never comes back. There is one live angle here, though, and it is a question rather than a claim: the medicines exemption runs through a LIMITATIVE list (annex fact SN-TAX-02), so any part of his book that is outside that list - creams, supplements, parapharmacy, the very lines he says he is 'plus libre' on - may be taxable output, which would open a prorata de deduction and start recovering some of the input VAT. Whether it does depends on the composition of his sales, which is the same fact the highest-materiality question asks for. Deferred, and flagged as the reason that question is worth more than it first looks."
  - "FINDING - the binding constraint is footfall, not plant. The counter runs at about a quarter of its dispensing capacity, the shelf is at a normal depth, and the fridges are adequate. Nothing in the physical operation limits this business. That is why the road works were as damaging as they were: with an administered price and a fixed cost block, a demand interruption has nowhere to go. It also means the model's headroom is real - additional volume would drop through at the gross margin, subject to nothing but the counter."
  - "FINDING, and a warning about the direction of the loss lines - the losses are concentrated where the margin is. He says what disappears is never the thousand-franc syrup, it is the creams, the supplements and the small expensive boxes. Those are the same lines that carry the free pricing and the better margin. Both shrinkage and expiry are charged here as an average rate over the whole shelf, which is the only rate the evidence supports, but the true rate on the at-risk sub-population is materially higher and it is eating the best part of the book. A category-level count at the next year-end would settle it."
  - "JUDGMENT CALL - expiry and the count gap are treated as SEPARATE losses, not netted. They could overlap: he asks himself whether the gap is partly 'des boites dont la date etait passee et qu'on a mises de cote sans le noter'. I kept them separate because the back-room cartons are physically present and enumerable while the count gap is stock that is not on the premises at all, and because separate is the conservative treatment. If they do overlap the total loss is overstated. The question that settles it is whether the annual count includes the back room, and it is asked."
  - "JUDGMENT CALL - revenue is built from the drivers (footfall x basket x open days) rather than anchored on his 'dans les dix millions'. The driver route is the one that can be tested against the plant; the round numbers are then used as independent corroboration, and both the revenue and the purchases checks pass with the derived figures sitting modestly above his rounding, in the same direction and by a similar proportion. Anchoring on the round number instead would have produced a model that could not be falsified by anything he said."
  - "JUDGMENT CALL - cold-chain loss is accrued at the observed frequency, one event in seven years, rather than at an assumed annual rate. This is the LOWER choice and it is not the conservative one; it is chosen because it is the only frequency his words evidence and because inventing a higher one would have been inventing. The question is attached with high enough range to matter. Note also the mechanism: the loss came from a GRID failure, not an equipment failure, so the remedy is an inverter or a generator, not the new fridges the model buys at t=0. No such capex is modelled because he never mentions one, and a spend I invented would be worse than a gap I flag."
  - "SIMPLIFICATION - garde nights are modelled at ordinary footfall and ordinary basket. In reality a duty night is likely to have fewer customers with larger, more urgent baskets. Direction unknown on net; the magnitude is small, since the garde adds under 3% of open days."
  - "SIMPLIFICATION - employer social charges are applied at the annex's 17.1% ceiling blend on the full gross wage bill. Because the CSS ceilings bite at 63,000 a month of salary and every one of the five is above that, the true blended rate is LOWER and this line OVERSTATES the charge. Not corrected, because doing so needs the accident-du-travail rate for retail pharmacy, which I could not verify and would not invent."
  - "OMISSION, deliberate and material - other_opex_monthly is zero, and it is certainly wrong. Insurance, the accountant's fee, telephone and internet, the Ordre des pharmaciens, bank charges, packaging and cleaning materials are all absent from the utterance. Every figure in this file overstates FCFF by whatever that block turns out to be. It is left at zero, with a question attached, rather than filled with a plausible-looking number that no reader could challenge."
  - "OMISSION - the TRIMF (taxe representative de l'impot du minimum fiscal), a small annual lump sum on individuals, is not charged. I could not verify its current bands to the standard the rest of the tax block is held to. It is small relative to the IR figure; direction, it would increase tax and reduce FCFF."
  - "SIMPLIFICATION - tax depreciation is taken equal to the IAS 16 accounting charge. Senegal's CGI sets its own amortissement rates, and SYSCOHADA rather than IFRS is the applicable accounting framework in an OHADA state. The method here is the one the brief asked for (IAS/IFRS) and the friction is noted rather than forced. Given both short-lived cohorts are already fully written off at t=0, the exposure is confined to the shelving tail and the two replacement assets."
  - "SIMPLIFICATION - cash tax is accrued evenly across the twelve months of the year it taxes, rather than modelled on the acompte and solde remittance calendar. Remittance timing is a financing question and does not belong in an unlevered build; it would move cash between periods within a year and would not change the horizon total."
  - "NOT MODELLED - no repeat of the road works, and no seasonality. He reports one three-month demand stoppage in the past year and gives no date or probability for another, and Dakar pharmacy demand has seasonal structure he does not describe. Modelling either would be modelling something he did not say. What the episode is used for instead is qualitative and important: it is the proof that this cost block does not flex, and that the expiry clock runs independently of sales - 'et les dates continuaient de courir'."
  - "NOT MODELLED - no price or cost inflation. The model runs in flat nominal XOF. For the regulated part of the book this is close to right, since the public price moves only when the arrete moves; for rent, wages and power it is a simplification, and it flatters the later periods."
  - "NOT MODELLED - the change of legal form is presented as a tax comparison only (trace.tax_cash_societe, trace.fcff_societe) and not as a transaction. An actual incorporation would carry registration and notary cost, a possible transfer of the fonds de commerce, and a pharmacy-law question about which corporate forms may hold an officine and on what terms - none of which is a tax matter and none of which the utterance touches."
  - "ON THE ELICITED LIST, since it is the most useful thing here. If he will answer only three, ask these three: (1) what share of sales is parapharmacy and what do you pay for it - it decides whether the officine covers itself at all, and it also decides whether any input VAT is recoverable through a prorata; (2) what do you actually take out each month - it decides the sign of EBITDA; (3) what share of the grossiste's invoices could you pay cash - a 2% discount on thirty-day terms is available to him today for nothing but liquidity, and it is the one lever in this file that needs no permission from anybody."

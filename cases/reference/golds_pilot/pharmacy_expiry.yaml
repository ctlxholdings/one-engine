  purchases_monthly:
    value: 8715865.079365
    unit: "XOF/month"
    prov: "INFERRED"
    source: "THE TRANSFORMATION CLOSING. Every box bought either is sold, expires, disappears or is destroyed in the fridge; the stock is flat, so purchases must equal the sum of all four. Purchases therefore EXCEED cost of sales by the entire leakage - which is exactly the quantity a yield-style margin ratio would have hidden"

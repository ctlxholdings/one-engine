  expiry_rate_monthly:
    value: 0.002875546354
    unit: "ratio of stock at risk per month"
    prov: "INFERRED"
    source: "expiry is expressed as a RATE ON THE STOCK AT RISK, not as a flat monthly charge, because that is what it physically is - a box expires because it sat, so the charge must scale with what is sitting. It is calibrated at the base stock level; if days_of_stock is revised the charge moves with it"

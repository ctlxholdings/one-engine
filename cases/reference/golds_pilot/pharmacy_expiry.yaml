    materiality: "low"
    date: "2026-07-29"
  max_customers_per_staff_hour:
    value: 12
    unit: "customers/staff-hour"
    prov: "ASSUMED"
    source: "A dispensing envelope: at five minutes per counter transaction including advice, a member of staff can serve 12 an hour sustained. Tagged ASSUMED rather than ELICITED because it is a generic capacity envelope, not a fact about his shop - asking him how fast he serves would get an opinion, not a measurement. Used only as the ceiling in the counter-capacity test"

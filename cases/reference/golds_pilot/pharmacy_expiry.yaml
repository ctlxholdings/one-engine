    source: "same reasoning as expiry - a rate on what is actually on the shelf. His own observation that what disappears is 'les cremes, les complements, les petites boites cheres qui tiennent dans une poche' means the true rate on that sub-population is far higher than this average; see notes"
    derivation: "shrinkage_monthly / inventory_opening"
    date: "2026-07-29"
  coldchain_accrual_monthly:
    value: 7142.857143
    unit: "XOF/month"
    prov: "INFERRED"
    source: "one observed destructive event across the whole seven years he has traded, accrued evenly. The 'rate' here is 100% of the refrigerated sub-stock per event - he emptied the fridge, he did not lose a percentage of it - so the only free parameter is frequency, and the only frequency his words evidence is one in seven years"

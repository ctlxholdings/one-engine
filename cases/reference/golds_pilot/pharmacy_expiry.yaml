    source: "fact SN-V25-15. DECLARED ZERO CHARGE: pharmaceutical products are outside the cash stamp duty, so the cash counter sales carry no droit de timbre. This is the one place where a verified fact removed a cost rather than adding one"
    authority: "Direction generale des Impots et des Domaines du Senegal, position confirmed to the Syndicat des Pharmaciens prives du Senegal and made public 23 February 2026 (Agence de Presse Senegalaise). [fact_id SN-V25-15]"
    verified: "2026-07-29"
  stock_loss_deduction_requires_destruction_record:
    value: 1
    unit: "boolean flag"
    prov: "SOURCED"
    source: "THE RULE OBJECT, kept distinct from the founder's belief and from his accountant's advice. What is verified is the general condition of deduction - a charge is deductible only if it is effective and justified - together with the settled francophone doctrine that destroyed stock is justified by a proces-verbal de destruction drawn up by or before a public authority, and that in its absence the administration reintegrates the amount. For goods inside the monopole pharmaceutique the attesting authority is the Direction de la pharmacie et du medicament, exactly as he describes. CAVEAT, stated because it matters: what I verified is the general justification requirement and the destruction-record doctrine, NOT a medicine-specific article of the Senegalese CGI. His accountant is right in substance; the confrere in Thies who 'le passe quand meme' is running a reassessment exposure, not applying a different rule"
    authority: "Senegal, CGI Livre I, conditions generales de deduction des charges (charges effectives et justifiees), consolidated text 'CGI annote - janvier 2023'; francophone tax doctrine on destruction de stocks (justification by proces-verbal de destruction, or by huissier where no administration attends)"
    verified: "2026-07-29"
  parapharmacy_margin_uplift:
    value: 0
    unit: "ratio of retail price, added to the 20% regulated margin"
    prov: "ELICITED"
    source: "BASE = 0, the OMITTING choice: the whole book is run at the 20% retail margin his one worked box implies, so the extra margin he says he takes on creams and supplements is simply not counted. This is the single most consequential omission in the model - it is what stands between the officine and a positive EBITDA - and it is omitted rather than guessed precisely because he holds the answer and did not give it"
    question: "Out of the ten million you sell in a month, roughly how much is creams, supplements and parapharmacy rather than prescription medicine - and on those, what do you pay for a box you sell at ten thousand?"
    range: {low: 0, high: 0.09}
    materiality: "high"
    date: "2026-07-29"
  days_of_stock:
    value: 45
    unit: "days of cost of sales"
    prov: "ELICITED"
    source: "BASE = 45 days. He does not state a stock figure, but he COUNTS IT every year-end, so the answer exists on paper. 45 days is the officine benchmark that reconciles two things he did state: twice-daily wholesaler delivery, which keeps the fast movers to a few days of cover, against 3,500 references whose tail turns 'deux ou trois boites dans l'annee' and therefore carries months. The choice is corroborated physically - it implies about 2.2 boxes per reference on the shelf, which is what an officine looks like"
    question: "At the last count, when you closed the two days - what was the total value of the stock, at what you paid for it?"
    range: {low: 30, high: 75}
    materiality: "high"
    date: "2026-07-29"
  owner_remuneration_monthly:
    value: 600000
    unit: "XOF/month"
    prov: "ELICITED"
    source: "BASE = 600,000. He lists himself among the things the gross margin has to cover ('il y a le loyer, les salaires, le courant, ET MOI') but never says how much. FCFF is an ASSET-side measure, so it must be struck after a market charge for the pharmacist's labour - otherwise the flow is inflated by unpaid management and the model would value the owner's job, not the business. 600,000 is set as a full-time pharmacien titulaire's cost in Dakar, above the 130,000 senior counter salary by a licensed-professional premium. THIS INPUT DECIDES THE SIGN OF EBITDA"
    question: "In a normal month, how much do you actually take out of the pharmacy for yourself - and if you had to hire a pharmacist to hold the licence and stand where you stand, what would you have to pay them?"
    range: {low: 400000, high: 1500000}
    materiality: "high"
    date: "2026-07-29"
  cash_payment_share:
    value: 0
    unit: "share of purchases settled in cash for the 2% discount"
    prov: "ELICITED"
    source: "BASE = 0, the OMITTING choice, and his own words support it: 'je n'ai pas toujours de quoi'. Taking nothing means the model never books the discount. Note what this input is worth: 2% on thirty days of purchases is one of the largest single levers in the whole build, and it is available to him today at no cost except liquidity"
    question: "In a normal month, what share of the grossiste's invoices do you actually manage to pay cash to take the two percent - none, a quarter, half?"
    range: {low: 0, high: 1}
    materiality: "high"
    date: "2026-07-29"
  pv_arrival_period:
    value: 24
    unit: "0-based period index at which the proces-verbal de destruction is issued"
    prov: "ELICITED"
    source: "BASE = 24, i.e. one past the last modelled period, meaning the record NEVER arrives inside the horizon and no stock loss is ever deducted. This is the omitting choice and it follows his own account: request filed, chased three times, told it would be done for the whole district, 'on attend'. This one index carries the entire tax mechanism of the case - it masks the add-back line"
    question: "Since you filed the request and chased it three times, has anyone at the Direction given you a date - even a verbal one, even a month?"
    range: {low: 0, high: 24}
    materiality: "high"
    date: "2026-07-29"
  bad_debt_rate:
    value: 0.03
    unit: "ratio of credit sales permanently uncollected"
    prov: "ELICITED"
    source: "BASE = 0.03. He says rejections are constant ('il y en a toujours qu'on rejette') but a rejected bordereau is not necessarily a lost one - a missing stamp can be obtained and the claim resubmitted. The 3% is therefore the PERMANENTLY lost slice, deliberately set well below any plausible first-pass rejection rate. He can separate the two; I cannot"
    question: "Out of a month's bordereaux, how much value comes back rejected - and of that, how much do you never get paid at all, even after you chase the stamp?"
    range: {low: 0.01, high: 0.1}
    materiality: "medium"
    date: "2026-07-29"
  electricity_monthly_ht:
    value: 200000
    unit: "XOF/month excl. VAT"
    prov: "ELICITED"
    source: "BASE = 200,000. He names 'le courant' as one of four things the margin must cover but gives no figure. 200,000 is set for a small officine running two medical fridges, air-conditioning and long opening hours on the Senelec professional tariff. It bears 18% irrecoverable VAT on top"
    question: "What does Senelec bill you in a normal month?"
    range: {low: 100000, high: 400000}
    materiality: "medium"
    date: "2026-07-29"
  fridge_share_of_fixtures:
    value: 1200000
    unit: "XOF of the 4,000,000 at opening"
    prov: "ELICITED"
    source: "BASE = 1,200,000 for the two refrigerators, leaving 2,800,000 for shelving and counter. He gave the four million as one lump. The split matters because the two components have different lives - 7 years against 10 - and the fridge half is the part that is already dead at t=0 and has to be replaced inside the horizon"
    question: "Of the four million you spent at opening, how much was the two refrigerators on their own?"
    range: {low: 800000, high: 2000000}
    materiality: "medium"
    date: "2026-07-29"
  other_opex_monthly:
    value: 0
    unit: "XOF/month"
    prov: "ELICITED"
    source: "BASE = 0, the OMITTING choice, and it is knowingly wrong. Insurance, the accountant's fee, the telephone and internet, the Ordre des pharmaciens subscription, bank charges, cleaning materials and packaging are all absent from the utterance and all certainly non-zero. Entering zero keeps the hole visible instead of filling it with an invented number; every figure below is therefore an overstatement of FCFF by whatever this turns out to be"
    question: "What else goes out every month that we have not talked about - the insurance, the accountant, the telephone, the Ordre, the bank?"
    range: {low: 0, high: 300000}
    materiality: "medium"
    date: "2026-07-29"
  quoted_prices_are_vat_exclusive:
    value: 1
    unit: "switch: 1 = the quoted rent and equipment figures are HT and VAT is added, 0 = they are TTC"
    prov: "ELICITED"
    source: "BASE = 1 (HT). 'Sur le loyer et le materiel ON ME LA FACTURE' reads as VAT being billed on top of the figures he quotes. This is the conservative reading - it raises the rent cost and the capitalised asset cost by 18%"
    question: "The four hundred and fifty thousand rent - is that the figure on the line before the TVA, or the total that leaves your account?"
    range: {low: 0, high: 1}
    materiality: "medium"
    date: "2026-07-29"
  other_income_annual:
    value: 0
    unit: "XOF/year"
    prov: "ELICITED"
    source: "BASE = 0, i.e. the officine is his only taxable income. IR is a tax on the PERSON, so any other income he has stacks underneath the pharmacy's profit and pushes it into a higher band. Zero is the plainest reading of the utterance and the LOWER-tax choice, which is why the question is attached"
    question: "Apart from the pharmacy, is there anything else the tax office sees in your name - a property you let, a salary, a share of another business?"
    range: {low: 0, high: 10000000}
    materiality: "medium"
    date: "2026-07-29"
  family_parts:
    value: 1
    unit: "parts (quotient familial)"
    prov: "ELICITED"
    source: "BASE = 1 part, at which the reduction pour charges de famille is nil by construction and the barème applies unmodified. STRUCTURAL, not scalar: a different answer does not scale a number, it introduces the reduction table (rate, floor and ceiling per part) as an additional stage of the tax computation, which is why it is not wired to a check. Direction is unambiguous - more parts means less IR"
    question: "For the impots, how many parts are you counted as - are you married, and how many children still count?"
    range: {low: 1, high: 5}
    materiality: "medium"
    date: "2026-07-29"
  opening_hours_per_day:
    value: 12
    unit: "hours/day"
    prov: "ELICITED"
    source: "BASE = 12 hours, the ordinary Dakar officine pattern (morning and afternoon-evening sessions). Used only to test whether the claimed footfall fits the counter he describes"

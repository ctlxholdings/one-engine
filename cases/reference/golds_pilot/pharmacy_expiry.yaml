passage: |
  STEP 0 - WHAT KIND OF OBJECT THIS IS, AND WHY IT DECIDES EVERYTHING BELOW.
  "Elle est a mon nom : chez nous une pharmacie appartient au pharmacien qui la tient", and his
  accountant is still trying to persuade him to PASS INTO a societe. So this is an entreprise
  individuelle, not a company, and three consequences follow immediately, none of which he knows:
    - the profit is taxed on HIM, under the progressive IR bareme, not at the 30% IS rate;
    - he cannot deduct his own remuneration, because the BIC profit IS his remuneration;
    - the impot minimum forfaitaire does not reach him at all - the instrument is titled
      "reforme de l'impot minimum forfaitaire SUR LES SOCIETES", and he is not one.
  And one eligibility test has to be run rather than assumed. The Contribution Globale Unique would
  sweep all of this into a single 2%-of-turnover payment, which would be far simpler and far cheaper -
  but it is capped at 50,000,000 of goods turnover, and this officine turns over about 129,068,333.
  CGU is out by a factor of about 2.6. Reel regime, IR bareme. That determination is the spine of
  every tax number below.

  STEP 1 - THE PLANT, AND WHETHER THE CLAIMED OUTPUT FITS INSIDE IT.
  Open six days a week - 6 x 52 = 312 days - plus the Sunday of every duty week, one week in six,
  which is 52/6 = 8.666666666667 more. That is 320.666666666667 days a year, or 26.722222222222 a
  month. Footfall: he gives a range, 100 to 130, and the midpoint is 115. Basket 3,500.
    Revenue = 115 x 3,500 x 26.722222222222 = 10,755,694.444444 a month.
  Now the capacity test, because a claimed output that does not fit the plant is a finding and not a
  rounding. Three people at the counter, twelve hours open: 115 / (3 x 12) = 3.194444 customers per
  staff-hour. At five minutes a dispensing transaction a person can sustain about twelve an hour, so
  the counter is running at about a quarter of its capacity. The claimed output fits with very large
  headroom - which is itself the finding: the binding constraint on this business is FOOTFALL, not
  plant. That is also why the road works were so damaging ("trois mois sans personne") and why he has
  no operational lever to absorb such a shock: he cannot serve his way out, and he cannot price his
  way out either, because the price on the box is administered.
  Corroboration, held back deliberately: he says he sells "dans les dix millions". The driver route
  gives 10,755,694, about 7.6% above his round number and comfortably inside it. The two routes were
  built independently and they agree.

  STEP 2 - THE MARGIN, AND WHAT HIS ONE WORKED BOX ACTUALLY TELLS US.
  "Une boite que je paie huit mille, l'affiche c'est dix mille": cost ratio 8,000/10,000 = 0.80, so a
  retail margin of 20% of the public price. He is a price-taker on BOTH sides - the grossiste margin
  and the officine margin are both fixed by arrete 188/MSHP/DPM - so this is not a margin he manages.
  Check it against the instrument: the administered officine margin is 28.9% of the public price for
  ordinary lines and 9% for lines on the social list. His 20% sits between the two, which is exactly
  what a mixed book should produce, and it is NOT equal to either, which is what tells us his one box
  was an illustration and not a rule. His own aggregate - buys about eight million, sells about ten -
  reproduces the same 0.80 independently.
    Cost of goods SOLD = 10,755,694.444444 x 0.80 = 8,604,555.555556 a month.
  Deliberately omitted: "Sur les cremes et les complements je suis plus libre, je prends davantage."
  He takes more and does not say how much more, so the model takes nothing more. That omission is
  carried as parapharmacy_margin_uplift = 0 and it is the highest-materiality question in the file.

  STEP 3 - THE TRANSFORMATION, AND MAKING IT CLOSE.
  A pharmacy transforms nothing, but it does convert boxes bought into boxes gone, and that
  conversion has to sum. Every box he buys ends in exactly one of five states: sold over the counter,
  expired on the shelf, disappeared, destroyed in the fridge, or still sitting there. A margin ratio
  alone would have accounted only for the first and silently discarded the other three. So:
    purchases = cost of goods sold + expiry + shrinkage + cold-chain loss + change in stock.
  The stock is flat (mature business, no growth claimed anywhere in the utterance), so the change is
  zero and purchases must carry the whole leakage. Each leak, in turn, with the quantity it acts on:

    LEAK 1, EXPIRY. He never counted it, but he described the STOCK - "sept ou huit cartons",
    "un million, un million et demi sur deux ou trois ans". A stock divided by the period it took to
    build is a flow: 1,250,000 / 30 months = 41,666.666667 a month. Expressed the way it physically
    works, that is a rate on the stock at risk, 0.002875546354 a month of shelf value: a box expires
    because it SAT, so the charge has to scale with what is sitting, not be a flat monthly toll. Note
    what this rate is net of: it is net of nothing - it is gross expiry at cost, and it does not
    include anything already inside the count gap (see the double-count question in Leak 2).

    LEAK 2, SHRINKAGE. Two observations, 900,000 and "six cent mille et quelques", mean 750,000 a
    year, 62,500 a month, a rate of 0.004313319531 of shelf value. Accrued evenly rather than dumped
    into the December of discovery, because pilferage and breakage happen continuously and the count
    merely reveals them. He refuses to decompose it - "Pour moi c'est la perte, un point c'est tout" -
    so it is carried whole. But his one diagnostic observation matters enormously: what disappears is
    "les cremes, les complements, les petites boites cheres qui tiennent dans une poche" - which is
    precisely the sub-population that is ALSO the free-priced, higher-margin part of the book. The
    loss is concentrated where the profit is.

    LEAK 3, COLD CHAIN. "une coupure un vendredi soir, et le lundi j'ai vide le refrigerateur" -
    600,000. Note the shape of this loss: it is not a percentage of the fridge, it is ALL of the
    fridge. So the loss given the event is 100% and the only free parameter is frequency, and the
    only frequency his words evidence is one event in the seven years he has traded:
    600,000 / 84 = 7,142.857143 a month. Test it against the plant: 600,000 at an average box cost of
    1,866.666667 is about 321 boxes, and two commercial medical fridges hold on the order of 800.
    It fits - the 600,000 could physically have been inside them.

    DECLARED ZERO: returns to the grossiste. He never mentions sending short-dated stock back, and
    describes the date risk as landing wholly on him. Zero, stated, not silent.

    Summing: 41,666.666667 + 62,500 + 7,142.857143 = 111,309.52381 a month of stock loss, and
    purchases = 8,604,555.555556 + 111,309.52381 = 8,715,865.079365. Corroboration: he says "a peu
    pres huit millions". The derived figure is about 8.9% above it - the same direction and roughly
    the same size as the revenue gap, so the two round numbers are internally consistent with each
    other and with the driver build.

  STEP 4 - THE SHELF, AND WHETHER 45 DAYS FITS ON IT.
  Cost run-rate per open day = 115 x 3,500 x 0.80 = 322,000. At 45 days of cover the shelf is
  14,490,000 at cost. Physical test: at 1.5 boxes a customer the average box costs 1,866.666667, so
  the shelf holds about 7,762.5 boxes across 3,500 references - 2.217857 boxes a line. That is what
  an officine actually looks like, and it is the reason 45 days was chosen rather than the 30 days a
  twice-daily delivery cycle would suggest: the fast movers are thin, but a tail of 3,500 lines
  turning "deux ou trois boites dans l'annee" carries months of cover on its own and drags the
  average up. He knows the true number - he closes two days a year to count it - so this stays an
  open question, not a guess dressed as a fact.

  STEP 5 - WORKING CAPITAL, AS A LEVEL AND AS A CHANGE.
  Credit sales: one customer in four, 2,688,923.611111 a month. Collection: the bordereaux are made
  up at month end, so a sale sits on average half a month before it is even billed, then two to three
  months to settlement - 3.0 months in all, giving 8,066,770.833333 of receivables. Payables: thirty
  days of purchases, 8,715,865.079365. Stock 14,490,000. Net working capital 13,840,905.753968, or
  about 1.3 months of turnover locked in the asset side.
  The period-on-period CHANGE is zero throughout, and that is a result and not an assumption: a
  mature officine at flat volume refinances its own cycle every month. What the structure is telling
  us is not in the delta but in the level - and in what would happen to that level in the event he
  has already lived through. During the three months of road works the receivables and the stock
  stayed exactly where they were while the sales that would have drained them stopped, the thirty-day
  payable did not stop, and "les dates continuaient de courir". That is a working-capital event, and
  it is invisible in any annual view.

  STEP 6 - THE COST BLOCK, AND THE VAT HE DID NOT KNOW HE WAS PAYING.
  Rent 450,000. Wages 130,000 + 110,000 + 100,000 + 75,000 + 40,000 = 455,000, plus employer social
  charges at 17.1%, so 532,805. Electricity, which he names but never sizes, taken at 200,000.
  Now the thing he asked about without knowing he was asking: "sur le loyer et le materiel on me la
  facture, mais je ne sais pas ce que ca devient." Here is what becomes of it. His output is exempt.
  Exempt is not zero-rated: article 380's list of exempt operations that PRESERVE the deduction right
  - exports, regime franc, international transport, agricultural supplies, pasteurised milk - does
  not include medicines. So the VAT charged to him on rent, on power and on equipment is not a
  receivable that comes back and it is not a payment he can offset. It is dead money. It raises his
  rent to 531,000 a month, his electricity to 236,000, and - by IAS 2.11 and IAS 16.16(a), which put
  non-refundable taxes into the cost of the asset - it raises the four million of fittings to
  4,720,000 and the till software to 944,000. He has been paying an 18% surcharge on every taxed
  input for seven years and did not know it was permanent.
  And one verified fact that took a cost AWAY rather than adding one: the 1% cash stamp duty
  introduced by loi 2025-17 would have landed on three-quarters of his turnover, but the DGID
  confirmed in February 2026 that pharmaceutical products are outside it. Charged: zero.
  CEL, the patente's successor: 15% of the valeur locative on leased premises = 810,000 a year; plus
  the value-added leg, 1% of value added but never less than 0.15% of turnover. Value added here is
  15,273,952.380952, so 1% is 152,739.52 - below the floor of 193,602.50, which therefore binds. Total
  1,003,602.50 a year, 83,633.541667 a month. The floor binding is not incidental: a pharmacy's value
  added is thin against its turnover, so a turnover-based floor is the operative rule for this trade.
  And the owner. He lists what stands between buying and selling: "le loyer, les salaires, le
  courant, ET MOI". FCFF is an ASSET-side measure, so it has to be struck after a market charge for
  the pharmacist's labour - otherwise the model values his job and calls it a business. 600,000 a
  month, the cost of a pharmacien titulaire in Dakar. He has never said what he takes.
    Opex = 531,000 + 532,805 + 236,000 + 600,000 + 83,633.541667 + 0 = 1,983,438.541667.
    Gross profit 2,151,138.888889, less stock losses 111,309.52381, less bad debts 80,667.708333,
    less opex: EBITDA = -24,276.884921 a month. Marginally NEGATIVE.

  STEP 7 - THE ASSETS, AND THE FACT THAT TWO OF THEM ARE ALREADY DEAD.
  Four million of fittings at opening, split 2,800,000 shelving and counter against 1,200,000 for the
  two fridges, plus 800,000 of till software; all grossed up 18% for the irrecoverable VAT. Seven
  years have passed. On standard lives - 10 years for shop fittings, 7 for commercial refrigeration,
  5 for a point-of-sale package - the shelving has 3 years left and BOTH the fridges and the software
  are at nil book value. The fridges being exactly at end of life is not a modelling artefact: it is
  the same fact the power cut demonstrated physically. So the horizon carries real capex - the
  fridges at t=0 (past life, and one has already failed destructively), the till system at t=12 (a
  system change is taken at a year boundary). Depreciation runs at 44,390.476190 a month in year one
  and 60,123.809524 in year two.
    EBIT = -68,667.361111 a month in year 1, -84,400.694444 in year 2.
  Against-the-world test on the cumulative: 24 months of depreciation totals 1,254,171.43, against an
  opening book value plus new capex of 3,351,200 - so nothing is depreciated past its cost, and the
  shelving cohort still has 12 months of life left at t=23. And 24 months of cold-chain accrual is
  171,428.57, less than one event - the model has not quietly assumed more fridge failures than the
  horizon can hold.

  STEP 8 - THE WEDGE. THIS IS THE CASE.
  Economic EBIT is negative. Taxable profit is large and positive. Two reasons, both structural:
    (i) He is an exploitant individuel, so the 600,000 a month he draws is not a deductible cost. It
        is added back. The BIC profit IS his income.
    (ii) Not one franc of the 111,309.52381 a month of stock loss is deductible. His accountant is
        right: "sans ca ... pour l'administration c'est comme si la marchandise etait toujours la."
        A charge is deductible only if it is effective AND justified, and for destroyed goods the
        justification is the proces-verbal de destruction - which for goods inside the monopole
        pharmaceutique only the Direction de la pharmacie et du medicament can give him. He filed,
        chased three times, was told it would be done for the whole district, and waits. The confrere
        in Thies who "le passe quand meme" has not found a different rule; he has taken a
        reassessment exposure.
    Taxable profit year 1 = (-68,667.361111 + 600,000 + 111,309.52381) x 12 = 7,711,705.952381.
    Taxable profit year 2 = (-84,400.694444 + 600,000 + 111,309.52381) x 12 = 7,522,905.952381.
  IR, band by band, at one part: nil to 630,000; 20% on the next 870,000 = 174,000; 30% on the next
  2,500,000 = 750,000; 35% on the remainder above 4,000,000. Year 1: 2,223,097.083333. Year 2:
  2,157,017.083333. Accrued evenly across the twelve months of the year each relates to.
    Cash tax per month = 185,258.090278 in year 1 and 179,751.423611 in year 2.
    NOPAT = EBIT - cash tax = -253,925.451389 a month in year 1 (-3,047,105.416667 for the year) and
    -264,152.118056 a month in year 2 (-3,169,825.416667 for the year).
  Meanwhile the deductions he has earned and cannot take accumulate: trace.disallowed_cumulative
  reaches 2,671,428.571429 by t=23. That is an unrecognised deferred tax asset, and it is physically
  located in seven or eight cardboard boxes in his back room.

  STEP 9 - FCFF.
    FCFF = NOPAT + D&A - change in NWC - capex.
  Year 1: -3,047,105.416667 + 532,685.714286 - 0 - 1,416,000 = -3,930,419.702381.
  Year 2: -3,169,825.416667 + 721,485.714286 - 0 - 944,000 = -3,392,339.702381.
  Twenty-four-month total: -7,322,759.404762.
  Read it correctly. This does not say the pharmacist is going hungry - he draws 600,000 a month and
  that is inside the model as a cost. It says that AS AN ASSET, after paying a market rate for the
  licensed pharmacist it cannot operate without, this officine does not cover itself, and it then
  pays real cash tax of over two million a year on a base its economics never earned.

  STEP 10 - "JE N'AI JAMAIS COMPRIS CE QUE CA CHANGERAIT."
  Materialised as a checked column rather than left as prose. As a societe the same operation, with
  the same losses and the same missing destruction record, would have the pharmacist's pay become a
  deductible salary. The IS base collapses to 511,705.952381 in year 1 and 322,905.952381 in year 2,
  so IS at 30% is small - and the impot minimum forfaitaire takes over, at 0.5% of turnover, between
  its floor of 500,000 and its cap of 5,000,000: 645,341.666667 a year, flat. trace.tax_cash_societe
  and trace.fcff_societe carry it; the checks prove the IMF genuinely binds rather than assuming it.
  That is what his accountant has been trying to tell him. Two caveats belong with it: the salary he
  would then draw bears IR in his own hands as employment income, so the comparison is asset-side and
  not household-side; and whether an officine may take a corporate form at all, and which one, is a
  question of pharmacy law and of the Ordre, not of tax.


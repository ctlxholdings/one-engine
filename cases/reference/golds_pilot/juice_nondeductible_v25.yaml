contract: "v2.5"
id: "t2_juice_nondeductible"
title: "Unité de jus de mangue, Bouaké (Côte d'Ivoire) — FCFF non levé sur 9 campagnes, et la question du régime d'imposition"
currency: "XOF"

grid:
  periods: 9
  freq: "annual"
  why: >-
    ANNUAL, because the business runs on one cycle a year and the founder describes it that way:
    "je prends cent tonnes DANS LA SAISON". Mango in Côte d'Ivoire is a single annual harvest; the
    purchase, the processing campaign and the yield he quotes are all season-quantities. He gave no
    intra-season timing at all — not the length of the harvest window, not when the supermarkets pay —
    so a monthly grid would be almost entirely fabricated, and would look more precise than the
    evidence supports. The annual grid is therefore the finest frequency the utterance can carry. It
    has one known cost, stated openly in notes and attached to an ELICITED question: it nets the
    harvest cash-out against the year's sales cash-in, so the intra-year cash trough between paying
    the farmers in cash at harvest and collecting from Abidjan retailers is invisible on this grid.
    NINE PERIODS, because the only durable asset in the business fixes the horizon. The line cost
    35,000,000 "il y a un an" against a 10-year life, so 9 years of that life remain. Ending at
    t=8 means the horizon closes exactly when the line's book value reaches zero, i.e. exactly at the
    replacement decision. That is the point past which the question stops being answerable from these
    words: the founder said nothing about replacing the line, nothing about what a replacement would
    cost, and nothing about whether he would still hold the shed or the farmer relationships. Running
    to 10 or 15 years would require me to invent a replacement capex and a terminal value neither he
    nor the world can tell me. A reader who thinks the useful life is really 7 or 15 years, or who
    wants a terminal value, should disagree with this choice explicitly — it is a choice, and it moves
    the NBV roll-forward and the count of periods, though (see notes) under the base-case tax regime
    it does not move the per-period FCFF at all.

utterance:
  fr: |
    J'ai une petite unité de jus de mangue à Bouaké. J'achète la mangue directement aux paysans des
    vergers autour, à la récolte : je prends cent tonnes dans la saison, à cent vingt-cinq francs le
    kilo. Il faut trois kilos de mangue pour faire un litre de jus. Je vends le jus en bouteilles
    d'un litre aux supermarchés et aux boutiques d'Abidjan, à mille deux cents francs la bouteille.
    Les bouteilles, les bouchons et les étiquettes me coûtent deux cents francs par bouteille, et le
    sucre et l'acide citrique cent francs. J'ai la ligne de production que j'ai payée trente-cinq
    millions il y a un an — on me dit dix ans. Trois ouvriers à quatre-vingt-dix mille par mois, le
    hangar à deux cent mille par mois, et le courant et l'eau à trois cent mille par mois. Je suis
    une société déclarée, je paie l'impôt sur le bénéfice. Mais il y a un truc qui me fait mal : les
    paysans ne me donnent aucune facture — ils n'ont pas de registre de commerce, ils veulent le cash
    et c'est tout. Mon comptable me dit que sans facture il ne peut pas passer ces achats en charge
    déductible. Donc pour l'impôt, c'est comme si je n'avais jamais acheté ces mangues : je paie
    l'impôt sur un bénéfice bien plus gros que celui que je fais vraiment. Et ce n'est pas un décalage
    dans le temps — cette déduction-là, je ne la récupère jamais.
  en: |
    I have a small mango-juice unit in Bouaké. I buy the mangoes directly from the farmers in the
    orchards around, at harvest time: I take one hundred tonnes over the season, at one hundred and
    twenty-five francs a kilo. It takes three kilos of mango to make one litre of juice. I sell the
    juice in one-litre bottles to the supermarkets and the small shops in Abidjan, at one thousand
    two hundred francs a bottle. The bottles, the caps and the labels cost me two hundred francs per
    bottle, and the sugar and citric acid one hundred. I have the production line, which I paid
    thirty-five million for a year ago — they tell me ten years. Three workers at ninety thousand a
    month, the shed at two hundred thousand a month, and power and water at three hundred thousand a
    month. I am a registered company, I pay profits tax. But there is one thing that hurts: the
    farmers give me no invoice — they have no trade register entry, they want cash and that is all.
    My accountant tells me that without an invoice he cannot put those purchases through as a
    deductible expense. So for tax it is as if I had never bought those mangoes: I pay tax on a
    profit far bigger than the one I actually make. And it is not a timing difference — that
    deduction, I never get it back.

inputs:

  mango_tonnes_per_season:
    value: 100
    unit: "tonnes/season"
    prov: "STATED"
    source: "\"je prends cent tonnes dans la saison\" / \"I take one hundred tonnes over the season\""
    date: "2026-07-27"

  kg_per_tonne:
    value: 1000
    unit: "kg/tonne"
    prov: "DEFAULTED"
    source: "SI metric tonne = 1000 kg. Standard commercial convention in UEMOA agricultural trade; the founder quotes a per-kilo price in the same sentence, which only reconciles on the metric tonne."
    date: "2026-07-27"

  mango_price_per_kg:
    value: 125
    unit: "XOF/kg"
    prov: "STATED"
    source: "\"à cent vingt-cinq francs le kilo\" / \"at one hundred and twenty-five francs a kilo\""
    date: "2026-07-27"

  yield_kg_per_litre:
    value: 3
    unit: "kg mango/litre juice"
    prov: "STATED"
    source: "\"Il faut trois kilos de mangue pour faire un litre de jus\". Taken as HIS realised press yield, i.e. already net of peel, stone and press losses — it is the number he operates on, not a textbook extraction rate."
    date: "2026-07-27"

  litres_per_bottle:
    value: 1
    unit: "litre/bottle"
    prov: "STATED"
    source: "\"Je vends le jus en bouteilles d'un litre\" — one litre of juice fills exactly one saleable unit, so litres produced and bottles produced are the same number."
    date: "2026-07-27"

  price_per_bottle:
    value: 1200
    unit: "XOF/bottle"
    prov: "STATED"
    source: "\"à mille deux cents francs la bouteille\". Single price for both channels — he quotes one figure for supermarkets and boutiques alike and does not distinguish them."
    date: "2026-07-27"

  packaging_per_bottle:
    value: 200
    unit: "XOF/bottle"
    prov: "STATED"
    source: "\"Les bouteilles, les bouchons et les étiquettes me coûtent deux cents francs par bouteille\". Read as what he actually disburses, i.e. inclusive of any VAT his suppliers charge him — see notes on the VAT dead-weight under the entreprenant regime."
    date: "2026-07-27"

  ingredients_per_bottle:
    value: 100
    unit: "XOF/bottle"
    prov: "STATED"
    source: "\"le sucre et l'acide citrique cent francs\" — elliptical for 'cent francs par bouteille', the unit carried over from the immediately preceding clause."
    date: "2026-07-27"

  workers:
    value: 3
    unit: "persons"
    prov: "STATED"
    source: "\"Trois ouvriers\""
    date: "2026-07-27"

  wage_per_worker_month:
    value: 90000
    unit: "XOF/person/month"
    prov: "STATED"
    source: "\"Trois ouvriers à quatre-vingt-dix mille par mois\""
    date: "2026-07-27"

  shed_rent_month:
    value: 200000
    unit: "XOF/month"
    prov: "STATED"
    source: "\"le hangar à deux cent mille par mois\""
    date: "2026-07-27"

  utilities_month:
    value: 300000
    unit: "XOF/month"
    prov: "STATED"
    source: "\"le courant et l'eau à trois cent mille par mois\""
    date: "2026-07-27"

  months_per_year:
    value: 12
    unit: "months/year"
    prov: "DEFAULTED"
    source: "Calendar convention. The founder quotes labour, shed and utilities MONTHLY and volumes SEASONALLY; annualising the monthly items at 12 treats them as standing costs carried through the whole year, which is the reading the words support — he rents a shed and employs workers, he does not describe demobilising either out of season."
    date: "2026-07-27"

  line_cost:
    value: 35000000
    unit: "XOF"
    prov: "STATED"
    source: "\"la ligne de production que j'ai payée trente-cinq millions\""
    date: "2026-07-27"

  line_life_years:
    value: 10
    unit: "years"
    prov: "STATED"
    source: "\"on me dit dix ans\" — reported hearsay, but adopted: it is also squarely inside the accepted band for plant and machinery (see notes), so nothing turns on whether his informant was right."
    date: "2026-07-27"

  line_age_years:
    value: 1
    unit: "years"
    prov: "STATED"
    source: "\"que j'ai payée trente-cinq millions IL Y A UN AN\""
    date: "2026-07-27"

  opening_nbv:
    value: 31500000.0
    unit: "XOF"
    prov: "INFERRED"
    source: "From line_cost, line_life_years, line_age_years: straight-line over 10 years is 3,500,000/yr; one year already elapsed, so book value entering t=0 is 35,000,000 − 3,500,000. No new information enters — only the straight-line convention already named in depreciation_method."
    date: "2026-07-27"

  depreciation_method:
    value: "straight_line"
    unit: "label"
    prov: "DEFAULTED"
    source: "IAS 16.60/62 — depreciation method reflects the pattern of consumption of economic benefits; straight line is the default where no other pattern is evidenced. The founder gives a life and nothing about a usage pattern, so straight line is the convention, not a claim about the machine."
    date: "2026-07-27"

  founder_belief_tax_base:
    value: "impot_sur_le_benefice"
    unit: "label"
    prov: "STATED"
    source: "\"Je suis une société déclarée, je paie l'impôt sur le bénéfice.\" This is recorded as a fact about what HE BELIEVES governs him. It is a different object from statutory_regime_at_this_turnover below, and the two do not agree."
    date: "2026-07-27"

  founder_belief_mango_nondeductible:
    value: true
    unit: "boolean"
    prov: "STATED"
    source: "\"Mon comptable me dit que sans facture il ne peut pas passer ces achats en charge déductible... cette déduction-là, je ne la récupère jamais.\" Recorded as his accountant's advice and his belief — a permanent (not timing) difference in his own account of it."
    date: "2026-07-27"

  annual_turnover_ttc:
    value: 40000000.0
    unit: "XOF/year"
    prov: "INFERRED"
    source: "bottles_sold × price_per_bottle = (100 × 1000 / 3) × 1200. This is the quantity the regime threshold is tested against, so it is materialised as an input as well as a trace row."
    date: "2026-07-27"

  statutory_regime_at_this_turnover:
    value: "taxe_etat_de_l_entreprenant"
    unit: "label"
    prov: "SOURCED"
    source: >-
      THE FACT ABOUT THE WORLD, and it contradicts founder_belief_tax_base. At an annual turnover TTC
      of 40,000,000 XOF a taxpayer in Côte d'Ivoire — personne physique OR personne morale, so his
      being "une société déclarée" does not change it — falls in the régime de l'entreprenant band
      (5,000,001 to 50,000,000 XOF TTC) and is liable to the taxe d'État de l'entreprenant, a tax on
      TURNOVER. Triangulated across five independent restatements of CGI arts. 72-77, all agreeing on
      the band, on the inclusion of personnes morales, and on the substitution effect. No activity
      exclusion applying to a food-processing unit was found. He is 40,000,000 against a 50,000,000
      ceiling, so the classification is not marginal.
    authority: >-
      Côte d'Ivoire, Code général des Impôts, arts. 72 et suivants (régime de l'entreprenant), art. 73
      (persons subject and the 5,000,001-50,000,000 XOF TTC band), art. 77 (rates), as introduced by
      the annexe fiscale to loi de Finances n° 2020-972 du 23 décembre 2020 (art. 33). Restated at
      https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-la-taxe-detat-de-lentreprenant/
      ("Sont soumises à la taxe d'Etat de l'entreprenant, les personnes physiques ou morales dont le
      chiffre d'affaires annuel, toutes taxes incluses, est compris entre 5 000 001 francs et
      50 000 000 de francs"), at
      https://blog.ivoire-juriste.com/2025/12/tout-savoir-sur-le-regime-de-lentreprenant-en-cote-divoire-taxe-communale-et-taxe-detat.html,
      at https://blog.legafrikcompta.com/regimes-dimposition-en-cote-divoire-re-rme-rsi-et-rni/,
      at https://cabinetldjsarl.com/les-typologies-de-societes-et-leur-regime-dimposition/, and in the
      CCESP (Comité de Concertation État-Secteur Privé) note "Les nouveaux régimes fiscaux en Côte
      d'Ivoire", https://www.ccesp.ci/publications/newsletter/les-nouveaux-regimes-fiscaux-en-cote-divoire
    verified: "2026-07-27"

  tee_substitutes_for_profits_tax:
    value: true
    unit: "boolean"
    prov: "SOURCED"
    source: >-
      THE LOAD-BEARING CONSEQUENCE. The taxe d'État de l'entreprenant is representative of, and
      substitutes for, the patente, the impôt sur les bénéfices AND the TVA; its payment is
      libératoire of other taxes save payroll taxes (ITS, contribution employeur) and withholdings at
      source. Therefore at this turnover there is no profits-tax computation to perform, no taxable
      profit, and DEDUCTIBILITY IS NOT A CATEGORY THAT EXISTS in the base. The founder's entire
      grievance — that the mangoes are permanently non-deductible — is real accounting pain in his
      accountant's file but has NO tax consequence under the regime the law assigns him. Corollary,
      also sourced at the same place: he may not charge VAT and transmits no right to deduct, so he
      bears input VAT on packaging and sugar as a final consumer (already inside the 200/100 XOF he
      quotes), and his 1,200 XOF is simply his price with no VAT layer.
    authority: >-
      Côte d'Ivoire CGI arts. 72 et suivants; restated at
      https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-la-taxe-detat-de-lentreprenant/
      — "Cette taxe se substitue à la patente, à l'impôt sur les bénéfices et à la taxe sur la valeur
      ajoutée" and "Les entreprises appartenant au régime de la taxe d'Etat de l'entreprenant ne sont
      pas autorisées à facturer la taxe sur la valeur ajoutée ni à transmettre un droit à déduction".
      Concordant at
      https://blog.ivoire-juriste.com/2025/12/tout-savoir-sur-le-regime-de-lentreprenant-en-cote-divoire-taxe-communale-et-taxe-detat.html
    verified: "2026-07-27"

  tee_band_upper:
    value: 50000000
    unit: "XOF/year TTC"
    prov: "SOURCED"
    source: "Upper bound of the taxe d'État de l'entreprenant band. Materialised because the whole tax treatment hinges on annual_turnover_ttc sitting below it, and a reader must be able to re-test that."
    authority: "Côte d'Ivoire CGI art. 73 (band 5,000,001 - 50,000,000 XOF TTC), annexe fiscale 2021 (loi n° 2020-972 du 23 décembre 2020, art. 33); https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-la-taxe-detat-de-lentreprenant/"
    verified: "2026-07-27"

  tee_rate:
    value: 0.05
    unit: "fraction of turnover TTC"
    prov: "SOURCED"
    source: >-
      CGI art. 77 sets TWO rates for the taxe d'État de l'entreprenant: 4% for "activités de commerce
      ou de négoce" and 5% for the other/service branch. A unit that BUYS fruit, TRANSFORMS it and
      SELLS bottles is neither pure négoce (it is not buying to resell) nor a prestation de services.
      No source I could reach classifies industrial transformation onto one branch. I run the base
      case at the HIGHER 5% branch — the conservative reading, lower FCFF — and materialise the 4%
      branch as trace.tax_tee_commerce / trace.fcff_tee_commerce so the reader sees both and neither
      is hidden in prose. The classification, not the rate schedule, is the open point.
    authority: "Côte d'Ivoire CGI art. 77 — 4% commerce/négoce, 5% prestations de services, both halved for members of a centre de gestion agréé; https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-la-taxe-detat-de-lentreprenant/ and https://blog.ivoire-juriste.com/2025/10/guide-complet-des-regimes-dimposition-en-cote-divoire-choisir-le-statut-adapte-a-votre-entreprise.html"
    verified: "2026-07-27"

  tee_rate_commerce:
    value: 0.04
    unit: "fraction of turnover TTC"
    prov: "SOURCED"
    source: "The other branch of the same art. 77 schedule, carried as an explicit alternative column rather than as a sentence in notes."
    authority: "Côte d'Ivoire CGI art. 77; https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-la-taxe-detat-de-lentreprenant/"
    verified: "2026-07-27"

  is_rate:
    value: 0.25
    unit: "fraction of taxable profit"
    prov: "SOURCED"
    source: "Used ONLY in the counterfactual column that reproduces the founder's stated position (profits tax with the mangoes added back). Standard rate for industrial and commercial profits; the 30% rate is sector-specific (telecoms/ICT) and does not reach a juice bottler."
    authority: "Côte d'Ivoire impôt sur les bénéfices industriels et commerciaux, 25%; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income, last reviewed 11 March 2026, https://taxsummaries.pwc.com/ivory-coast/corporate/taxes-on-corporate-income"
    verified: "2026-07-27"

  imf_rate:
    value: 0.005
    unit: "fraction of turnover"
    prov: "SOURCED"
    source: "Impôt minimum forfaitaire, general rate. Counterfactual column only. The reduced 0.1% / 0.15% rates are sector-specific (petroleum, utilities, banks/insurance) and do not apply here."
    authority: "Côte d'Ivoire impôt minimum forfaitaire, 0.5% of turnover; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income, last reviewed 11 March 2026, https://taxsummaries.pwc.com/ivory-coast/corporate/taxes-on-corporate-income"
    verified: "2026-07-27"

  imf_floor:
    value: 3000000
    unit: "XOF/year"
    prov: "SOURCED"
    source: "Counterfactual column only. At this turnover the floor binds over the 0.5% computation by a wide margin, which is why it must be materialised rather than assumed away."
    authority: "Côte d'Ivoire impôt minimum forfaitaire, minimum XOF 3 million; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income, last reviewed 11 March 2026, https://taxsummaries.pwc.com/ivory-coast/corporate/taxes-on-corporate-income"
    verified: "2026-07-27"

  imf_ceiling:
    value: 35000000
    unit: "XOF/year"
    prov: "SOURCED"
    source: "Counterfactual column only; not binding here, carried so the bounds check on trace.imf_reel is complete."
    authority: "Côte d'Ivoire impôt minimum forfaitaire, maximum XOF 35 million; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income, last reviewed 11 March 2026, https://taxsummaries.pwc.com/ivory-coast/corporate/taxes-on-corporate-income"
    verified: "2026-07-27"

  invoice_substantiation_rule:
    value: "facture_normalisee_required_for_deduction"
    unit: "label"
    prov: "SOURCED"
    source: >-
      The accountant's advice is broadly right ABOUT THE PROFITS-TAX WORLD: expenses not supported by
      a compliant facture normalisée are reintegrated into taxable income and the corresponding VAT
      is refused. Cash purchases from unregistered orchard farmers cannot produce such an invoice.
      Recorded because it is what makes the counterfactual column behave as the founder describes.
      I could NOT find a Côte d'Ivoire relief allowing deduction of purchases from unregistered
      agricultural producers on a bordereau or self-billing basis; that is a gap in my research, not
      a finding that no such relief exists (see notes).
    authority: "Côte d'Ivoire CGI arts. 384 et suivants (facture normalisée / facture normalisée électronique) and the reintegration consequence; DGI note de service on the FNE, https://www.dgi.gouv.ci/assets/documents/pdf/note_service/note_service_03619_0001_16092024131912.pdf ; practitioner restatement at https://www.gedbered.com/blog/fne-facture-normalisee-electronique-guide-complet.html"
    verified: "2026-07-27"

  tax_regime_actually_filed:
    value: "taxe_etat_de_l_entreprenant"
    unit: "label"
    prov: "ELICITED"
    source: >-
      He holds this answer: it is on his own filings. The base case runs on the regime the LAW assigns
      him (statutory_regime_at_this_turnover), not on the regime he believes he is in, because a
      valuation of the asset should be built on the tax the business is required to pay. But which
      one he is actually filing is a fact about his operation, and only he can settle it. The
      counterfactual (his stated position) is fully materialised as trace.tax_reel / trace.fcff_reel,
      so whichever way he answers, the reader has the number.
    date: "2026-07-27"
    question: "Sortez votre dernier avis d'imposition et la déclaration que votre comptable a déposée pour le dernier exercice — est-ce une déclaration de taxe d'État de l'entreprenant, ou une déclaration de résultats (liasse fiscale) avec impôt sur le bénéfice ?"
    range:
      low: "taxe d'État de l'entreprenant (turnover tax, deductibility irrelevant)"
      high: "régime réel, impôt sur les bénéfices filed with the mangoes added back"
    materiality: "high"

  maintenance_capex_annual:
    value: 0
    unit: "XOF/year"
    prov: "ELICITED"
    source: >-
      The omitting choice. He listed his costs and named no repairs, no spare parts, no servicing — so
      zero is the value faithful to the utterance, and it keeps the base case from containing a number
      he never gave. It is almost certainly wrong: a pasteuriser, a pump and a filler run nine more
      seasons with zero spend is not a thing that happens. This flows one-for-one into FCFF, which is
      why it is ranked high.
    date: "2026-07-27"
    question: "Sur la dernière campagne, combien avez-vous dépensé pour garder la ligne en marche — pièces de rechange, réparations, entretien du pasteurisateur et de la remplisseuse ?"
    range:
      low: 0
      high: 3500000
    materiality: "high"

  mango_usable_share:
    value: 1.0
    unit: "fraction"
    prov: "ELICITED"
    source: >-
      The omitting choice: his words carry 100 tonnes bought straight into 100 tonnes pressed. But
      mango bought at the orchard in the heat of the harvest and trucked to Bouaké does not all reach
      the press. Any loss here cuts bottles, and therefore revenue, one-for-one, while leaving the
      mango cost untouched — so it hits FCFF harder than its size suggests. Only he knows his rate.
    date: "2026-07-27"
    question: "Sur les cent tonnes que vous achetez aux paysans, combien de kilos arrivent réellement dans la presse — combien perdez-vous en pourriture, en écarts de triage ou en casse entre le verger et l'usine ?"
    range:
      low: 0.85
      high: 1.0
    materiality: "high"

  cga_member_reduction:
    value: 0.0
    unit: "fraction of the TEE rate waived"
    prov: "ELICITED"
    source: >-
      The conservative choice: assume no reduction, full rate. CGI art. 77 halves the taxe d'État de
      l'entreprenant for members of a centre de gestion agréé who adhere in time. Whether he is a
      member is a fact about his own business and he can answer it in one word; it is also the single
      cheapest action available to him if the answer is no. Categorical in substance, coded 0/0.5.
    date: "2026-07-27"
    question: "Êtes-vous adhérent d'un centre de gestion agréé (CGA), et depuis quand — votre adhésion était-elle enregistrée avant le 31 janvier de l'exercice ?"
    range:
      low: 0.0
      high: 0.5
    materiality: "medium"

  receivable_days:
    value: 0
    unit: "days"
    prov: "ELICITED"
    source: >-
      The omitting choice, and it is the one that sets ΔNWC to zero throughout. He said nothing about
      terms. Supermarkets in Abidjan do not generally pay on delivery, so this is optimistic; it costs
      nothing in steady-state FCFF (a constant receivable balance produces no ΔNWC once established)
      but it removes a real one-off cash absorption in the first modelled season, and it is what makes
      the annual grid safe. Ranked medium for that reason, not high.
    date: "2026-07-27"
    question: "Quand vous livrez une palette à un supermarché d'Abidjan, au bout de combien de jours l'argent arrive-t-il réellement sur votre compte — et les boutiques, elles, paient-elles comptant ?"
    range:
      low: 0
      high: 90
    materiality: "medium"

  finished_goods_carryover_bottles:
    value: 0
    unit: "bottles"
    prov: "ELICITED"
    source: "The omitting choice: everything bottled in a season is sold in that season, so production equals sales and the finished-goods roll-forward closes at zero. He never mentioned stock. If juice is bottled at harvest and drawn down through the year, a real closing stock exists and the first-season cash absorption is larger."
    date: "2026-07-27"
    question: "À la fin de la campagne, quand vous avez fini de presser, combien de bouteilles restent-il dans le magasin, non encore vendues ?"
    range:
      low: 0
      high: 10000
    materiality: "medium"

  payable_days_inputs:
    value: 0
    unit: "days"
    prov: "ELICITED"
    source: "The omitting choice for the packaging and sugar suppliers. For the FARMERS it is not elicited at all but INFERRED from \"ils veulent le cash et c'est tout\" — that leg is zero on his own words. Ranked low because a supplier credit only shifts timing within a year on an annual grid."
    date: "2026-07-27"
    question: "Vos fournisseurs de bouteilles, de bouchons, d'étiquettes et de sucre — vous les payez à la commande, à la livraison, ou à trente jours ?"
    range:
      low: 0
      high: 60
    materiality: "low"

  harvest_window_months:
    value: 3
    unit: "months"
    prov: "ELICITED"
    source: >-
      Does not enter the annual arithmetic — carried because it governs whether the annual grid is
      adequate at all. The shorter the window, the deeper and sharper the intra-year cash trough
      between paying 12,500,000 XOF cash to farmers and collecting from Abidjan. A working value of
      three months reflects a typical single mango harvest; it is his season and he can state it.
    date: "2026-07-27"
    question: "Sur combien de semaines s'étale la récolte pendant laquelle vous achetez vos cent tonnes — et est-ce que vous pressez tout pendant cette période, ou est-ce que vous étalez la production ?"
    range:
      low: 1
      high: 6
    materiality: "low"

  price_vat_basis:
    value: "prix_sans_tva_regime_entreprenant"
    unit: "label"
    prov: "ELICITED"
    source: >-
      Under the base-case regime this is settled by the law rather than by him — an entreprenant may
      not charge VAT, so 1,200 XOF is simply the price and turnover TTC equals turnover. The question
      still needs asking, because if tax_regime_actually_filed comes back "régime réel" then 1,200
      would carry 18% VAT and the revenue line would have to be restated net. The two questions should
      be put together.
    date: "2026-07-27"
    question: "Les mille deux cents francs que vous facturez au supermarché — c'est le prix tout compris que le supermarché vous paie, ou est-ce que vous ajoutez la TVA par-dessus sur la facture ?"
    range:
      low: "1,200 XOF is the all-in price, no VAT line"
      high: "1,200 XOF is net and VAT is added on top"
    materiality: "medium"

passage: |
  STEP 0 — WHAT KIND OF BUSINESS THIS IS, AND WHY THE TAX QUESTION COMES FIRST.

  This is a seasonal agro-processing unit: one annual purchase of raw fruit, one processing campaign,
  a single product sold at a single price into two retail channels. Every operating quantity the
  founder gives is either a season-quantity (100 tonnes) or a monthly standing cost (wages, shed,
  power and water). The natural period is therefore the season, i.e. the year, and I model in HIS
  units throughout: kilos of mango, litres of juice, one-litre bottles.

  Before any arithmetic, one fact about the world has to be settled, because it decides whether half
  of what the founder is worried about is even a live question. He says: "Je suis une société
  déclarée, je paie l'impôt sur le bénéfice." That is a statement about what he believes governs him.
  What governs him is a separate object. I compute his turnover first (Step 3), get 40,000,000 XOF,
  and test it against the Ivorian regime bands. At 40,000,000 XOF TTC he sits inside the band
  5,000,001 - 50,000,000 for the taxe d'État de l'entreprenant (CGI arts. 72-77) — a band that
  applies to "les personnes physiques OU MORALES", so being a declared company does not lift him out
  of it. And that tax "se substitue à la patente, à l'impôt sur les bénéfices et à la taxe sur la
  valeur ajoutée". It is levied on TURNOVER.

  The consequence is blunt. Under the regime the law assigns him there is no taxable profit, and
  therefore no such thing as a deductible or a non-deductible purchase. His grievance — that the
  mangoes are permanently lost as a deduction — is a real and painful feature of the file his
  accountant is keeping, but it has no tax consequence in the regime that actually governs a business
  of this size. I carry his own stated position as a full parallel column anyway (Step 8), because
  only he can tell me what is actually being filed, and because the reader should be able to see both
  worlds side by side rather than take my word for which one he lives in.

  STEP 1 — THE HORIZON.

  The line cost 35,000,000 XOF a year ago against a ten-year life. Nine years of that life remain, so
  the grid is nine annual periods, t=0 the coming campaign through t=8 the campaign in which the line
  reaches zero book value. The horizon closes exactly at the replacement decision, which is the last
  point at which the founder's words still determine the answer.

  STEP 2 — PHYSICAL VOLUMES, IN HIS UNITS.

  Mango bought per season: 100 tonnes × 1,000 kg/tonne = 100,000 kg.
  Mango reaching the press: 100,000 kg × 1.00 = 100,000 kg (base case; the usable share is ELICITED —
  see the question, this is the omitting choice, not a finding that nothing is lost).
  Spoilage/rejects: 100,000 − 100,000 = 0 kg.
  Mango is perishable and bought "à la récolte"; nothing in his words suggests he holds fruit across a
  year-end, and fruit stored a year is fruit thrown away, so closing raw-material stock is zero and
  the mango roll-forward closes on itself each season.

  Juice: 100,000 kg ÷ 3 kg per litre = 33,333.333333333333 litres.
  Bottles: one litre per bottle, so 33,333.333333333333 bottles produced.
  The one-third of a bottle is a modelling artefact of an exactly-stated 3:1 ratio against an exactly-
  stated 100 tonnes; it is carried at full precision in trace rather than rounded, so that every
  driver check reproduces exactly. Nothing in the utterance permits a cleaner integer split.
  Bottles sold: 33,333.333333333333 (base case carryover stock is zero — ELICITED).
  Closing finished-goods stock: 0 bottles.

  STEP 3 — REVENUE.

  33,333.333333333333 bottles × 1,200 XOF = 40,000,000 XOF per season.
  Under the entreprenant regime he may not charge VAT, so this figure is simultaneously his revenue
  and his chiffre d'affaires TTC — which is the number the regime threshold is tested on, and it sits
  20% below the 50,000,000 ceiling.

  STEP 4 — CASH OPERATING COSTS.

  Mango:        100,000 kg × 125 XOF/kg          = 12,500,000
  Packaging:    33,333.333333333333 × 200 XOF     =  6,666,666.666666667
  Sugar + acid: 33,333.333333333333 × 100 XOF     =  3,333,333.333333333
  Labour:       3 × 90,000 × 12                   =  3,240,000
  Shed:         200,000 × 12                      =  2,400,000
  Power+water:  300,000 × 12                      =  3,600,000
                                                    -----------
  Total cash operating cost                       = 31,740,000

  Two matching notes. First, the packaging and consumables are costed on bottles PRODUCED, not sold;
  in the base case those are the same number, but the roll-forward is built so they can diverge the
  moment the carryover question is answered. Second, the labour, shed and utility costs are quoted
  monthly and annualised at twelve. He describes a shed he rents and workers he employs, not a crew he
  demobilises out of season — so these are standing costs of the whole year, even though the pressing
  campaign occupies only part of it. This is the one place where his natural description (a seasonal
  campaign) and the standard line item (annual fixed cost) do not sit flush, and I have kept the
  annual reading rather than pro-rating something he did not say.

  STEP 5 — EBITDA AND DEPRECIATION.

  EBITDA = 40,000,000 − 31,740,000 = 8,260,000 per season.
  Depreciation = 35,000,000 ÷ 10 = 3,500,000 per year, straight line.
  EBIT = 8,260,000 − 3,500,000 = 4,760,000 per season.

  The book value roll-forward runs from an opening 31,500,000 (cost less the one year already
  elapsed) down by 3,500,000 a year to exactly zero at the close of t=8:
  opening balances 31,500,000 / 28,000,000 / 24,500,000 / 21,000,000 / 17,500,000 / 14,000,000 /
  10,500,000 / 7,000,000 / 3,500,000, closing one step behind, ending at 0.

  STEP 6 — TAX, BASE CASE.

  Taxe d'État de l'entreprenant = turnover × rate × (1 − CGA reduction)
                                = 40,000,000 × 0.05 × (1 − 0) = 2,000,000 per season.

  The 5% branch of the CGI art. 77 schedule is used. The schedule has two branches — 4% for commerce
  and négoce, 5% for the other branch — and a unit that buys fruit, transforms it and sells bottles is
  cleanly neither. I take the higher branch as the conservative reading and carry the lower one as an
  explicit alternative column (trace.tax_tee_commerce, trace.fcff_tee_commerce) rather than describing
  it in a sentence.

  STEP 7 — NOPAT, WORKING CAPITAL, CAPEX, FCFF.

  NOPAT = EBIT − tax = 4,760,000 − 2,000,000 = 2,760,000.
  ΔNWC = 0: receivables, payables and stocks are all zero in the base case (each an ELICITED question
  with its working value set to the omitting choice), so the net working capital level is zero
  throughout and its change is zero throughout.
  Capex = 0: the line was bought before t=0 and is not replaced inside the horizon by construction;
  maintenance capex is ELICITED and set to zero because he named none.

  FCFF = NOPAT + D&A − ΔNWC − capex = 2,760,000 + 3,500,000 − 0 − 0 = 6,260,000 per season,
  flat across all nine periods.

  Cross-check by the other route: FCFF = EBITDA − tax − ΔNWC − capex = 8,260,000 − 2,000,000 =
  6,260,000. The two agree, and the agreement exposes something worth saying plainly: under a
  TURNOVER tax the depreciation charge cancels out of free cash flow entirely. It is subtracted to get
  to EBIT and added back after tax, and because the tax does not depend on profit there is no
  depreciation tax shield in between. The 35,000,000 line generates no tax benefit at all in the base
  case. Its economics enter this model only through the horizon it sets.

  STEP 8 — THE FOUNDER'S OWN WORLD, CARRIED IN PARALLEL.

  If, contrary to the regime the law assigns him, the profits tax is what is actually being filed —
  which is what he says, and what his accountant appears to be computing — the column runs:

  Taxable profit = EBIT + mango added back = 4,760,000 + 12,500,000 = 17,260,000.
  Impôt sur les bénéfices at 25%          =  4,315,000.
  Impôt minimum forfaitaire = greater of 0.5% × 40,000,000 = 200,000 and the 3,000,000 floor, so
                                             3,000,000, well under the 35,000,000 ceiling.
  Tax due = greater of the two             =  4,315,000.
  NOPAT                                    =  4,760,000 − 4,315,000 = 445,000.
  FCFF                                     =    445,000 + 3,500,000 = 3,945,000 per season.

  Note what this column shows about his own diagnosis. He says the non-deduction makes him pay tax on
  a profit far bigger than the one he makes, and on this arithmetic he is exactly right: the add-back
  is larger than his entire operating profit, so he would be taxed on roughly three and a half times
  what he earns. His description of the mechanism is accurate. What appears to be wrong is the premise
  that this mechanism governs him at all. Two further points belong to this column and not to the base
  case: at the réel he could reclaim the input VAT embedded in the 200 and 100 XOF he pays for
  packaging and consumables, and his 1,200 XOF price would have to be restated net of VAT — both
  omitted here, in opposite directions, and both attached to the ELICITED price_vat_basis question.

  STEP 9 — WHAT THE ANSWER DEPENDS ON.

  The per-period FCFF of 6,260,000 XOF rests on nine identical seasons with no growth, no price
  movement, no mango price movement, no maintenance spend and no working capital. The first four are
  the utterance's own silence, carried faithfully; the last two are ELICITED and carry their questions.
  If only three questions can be put to this founder, they are, in order: what is actually being filed
  with the tax office; what does he really spend keeping the line running; and how much of the hundred
  tonnes actually reaches the press.


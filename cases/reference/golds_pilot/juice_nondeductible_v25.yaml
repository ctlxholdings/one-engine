checks:
  - "grid.periods == line_life_years - line_age_years"
  - "trace.mango_purchased_kg == mango_tonnes_per_season * kg_per_tonne"
  - "trace.mango_processed_kg == trace.mango_purchased_kg * mango_usable_share"
  - "trace.mango_spoiled_kg == trace.mango_purchased_kg - trace.mango_processed_kg"
  - "trace.mango_close_kg == trace.mango_close_kg[t-1] + trace.mango_purchased_kg - trace.mango_processed_kg - trace.mango_spoiled_kg"
  - "trace.mango_close_kg[t] >= 0"
  - "trace.mango_spoiled_kg[t] >= 0"
  - "trace.bottles_produced == trace.mango_processed_kg / yield_kg_per_litre / litres_per_bottle"
  - "trace.fg_close_bottles == trace.fg_close_bottles[t-1] + trace.bottles_produced - trace.bottles_sold"
  - "trace.fg_close_bottles[t] >= 0"
  - "trace.revenue == trace.bottles_sold * price_per_bottle"
  - "trace.revenue[first] == annual_turnover_ttc"
  - "annual_turnover_ttc <= tee_band_upper"
  - "trace.mango_cost == trace.mango_purchased_kg * mango_price_per_kg"
  - "trace.packaging_cost == trace.bottles_produced * packaging_per_bottle"
  - "trace.ingredients_cost == trace.bottles_produced * ingredients_per_bottle"
  - "trace.labour_cost == workers * wage_per_worker_month * months_per_year"
  - "trace.rent_cost == shed_rent_month * months_per_year"
  - "trace.utilities_cost == utilities_month * months_per_year"
  - "trace.cash_opex == trace.mango_cost + trace.packaging_cost + trace.ingredients_cost + trace.labour_cost + trace.rent_cost + trace.utilities_cost"
  - "trace.ebitda == trace.revenue - trace.cash_opex"
  - "trace.depreciation == line_cost / line_life_years"
  - "trace.ebit == trace.ebitda - trace.depreciation"
  - "trace.nbv_close == trace.nbv_open - trace.depreciation"
  - "trace.nbv_open == opening_nbv - cumsum(trace.depreciation) + trace.depreciation"
  - "trace.nbv_close == opening_nbv - cumsum(trace.depreciation)"
  - "trace.nbv_close[t] >= 0"
  - "trace.nbv_close[last] == 0"
  - "sum(trace.depreciation) == opening_nbv"
  - "opening_nbv == line_cost - line_cost / line_life_years * line_age_years"
  - "trace.capex == maintenance_capex_annual"
  - "trace.delta_nwc == trace.nwc - trace.nwc[t-1]"
  - "cumsum(trace.delta_nwc) == trace.nwc"
  - "trace.nwc[t] >= 0"
  - "trace.tax_tee == trace.revenue * tee_rate * (1 - cga_member_reduction)"
  - "trace.nopat == trace.ebit - trace.tax_tee"
  - "trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex"
  - "trace.fcff == trace.ebitda - trace.tax_tee - trace.delta_nwc - trace.capex"
  - "trace.tax_tee_commerce == trace.revenue * tee_rate_commerce * (1 - cga_member_reduction)"
  - "trace.fcff_tee_commerce == trace.ebitda - trace.tax_tee_commerce - trace.delta_nwc - trace.capex"
  - "trace.taxable_profit_reel == trace.ebit + trace.mango_cost"
  - "trace.is_reel == trace.taxable_profit_reel * is_rate"
  - "trace.imf_reel >= trace.revenue * imf_rate"
  - "trace.imf_reel >= imf_floor"
  - "trace.imf_reel <= imf_ceiling"
  - "trace.tax_reel >= trace.is_reel"
  - "trace.tax_reel >= trace.imf_reel"
  - "trace.nopat_reel == trace.ebit - trace.tax_reel"
  - "trace.fcff_reel == trace.nopat_reel + trace.depreciation - trace.delta_nwc - trace.capex"

notes:
  - >-
    THE CENTRAL FINDING. The founder's premise about the tax that governs him appears to be wrong, and
    it is the most consequential thing in this file. He says he is a declared company paying profits
    tax. At 40,000,000 XOF of annual turnover he falls in the taxe d'État de l'entreprenant band
    (5,000,001 - 50,000,000 XOF TTC, CGI arts. 72-77), which applies to personnes physiques and
    personnes morales alike, and which substitutes for the patente, the impôt sur les bénéfices AND
    the TVA. Under that regime the tax base is turnover. There is no taxable profit, so there is no
    deductible expense and no non-deductible expense — the category his accountant is reasoning in
    does not exist there. His pain is real in his books; the belief that it costs him tax is the part
    that does not survive contact with the rule. This is why the utterance's central complaint does
    not appear as a tax adjustment in the base case, and why I have made his own position an explicit
    parallel column rather than silently overriding him.
  - >-
    THE FOUNDER'S DIAGNOSIS IS INTERNALLY CORRECT. Where he describes the mechanism — that adding the
    mango purchases back produces a taxable profit far larger than his real one, and that it is a
    permanent difference and not a timing one — he is right on both counts, and the parallel column
    reproduces exactly that. A non-deductible expense is a permanent difference under IAS 12: it never
    reverses and it generates no deferred tax asset. So the failure is not in his reasoning. It is one
    level up, in which regime he is reasoning inside.
  - >-
    THE OPTION QUESTION, DEFERRED. If he genuinely wants the réel — and there is a commercial reason
    he might, since an entreprenant cannot invoice VAT and transmits no deduction right, which makes
    him a less attractive supplier to VAT-registered supermarkets — I could not establish that the
    route is open to him. The documented option from the microenterprise regime up to the réel
    simplifié requires a minimum turnover of 100 million XOF, and I found no documented option from
    the entreprenant regime directly to a réel. I have not resolved whether a taxpayer at 40 million
    can elect into the réel at all. This should be put to a Côte d'Ivoire tax practitioner before any
    action; it is the one place where I would not want a reader to act on my research alone.
  - >-
    A RESEARCH GAP, STATED AS A GAP. I looked for, and did not find, a Côte d'Ivoire mechanism that
    lets a processor deduct purchases from unregistered agricultural producers on a bordereau,
    self-billing or attestation basis — the kind of relief several neighbouring systems provide,
    precisely because smallholder sourcing without invoices is the normal condition of West African
    agro-processing. Absence of evidence here is not evidence of absence; my searches did not reach
    the underlying CGI text on this point. If such a mechanism exists, it changes the parallel column
    materially. It changes nothing in the base case, where deductibility is not a category.
  - >-
    DEPRECIATION HAS NO CASH CONSEQUENCE IN THE BASE CASE. Under a turnover tax there is no
    depreciation tax shield: the charge is deducted to reach EBIT and added straight back after tax,
    and the tax in between does not see it. The 35,000,000 XOF line therefore contributes nothing to
    free cash flow through the tax line over these nine years. It enters this model only by fixing the
    horizon. In the parallel réel column it does real work, because there it is deductible. A reader
    who wants to argue about the ten-year life should note that the argument only bites in that column
    and on the number of periods.
  - >-
    VAT IS ABSENT FROM THE BASE CASE BY OPERATION OF THE REGIME, NOT BY OMISSION. An entreprenant may
    not charge VAT and is treated as the final consumer for VAT purposes. So the 1,200 XOF he quotes
    is simply his price, revenue equals turnover TTC, and the input VAT embedded in the 200 XOF of
    packaging and the 100 XOF of consumables is an unrecoverable cost already sitting inside the
    figures he gave me. That is a genuine dead-weight of the regime and it is captured, correctly, as
    part of his stated unit costs. In the parallel réel column the opposite would hold in both
    directions — recoverable input VAT, and a 1,200 XOF price that would have to be restated net —
    and neither adjustment has been made there. Both are attached to the price_vat_basis question.
  - >-
    WHAT THE ANNUAL GRID HIDES. He pays the farmers cash, in a compressed harvest window, for the
    entire season's raw material, and he collects from Abidjan retailers afterwards. On an annual grid
    those two flows net inside a single period and the intra-year cash trough is invisible. This does
    not bias the FCFF number, but it does mean this file says nothing about whether he can fund the
    harvest — which for a business of this shape is often the binding constraint, and is a working
    capital question rather than a profitability one. The receivable_days and harvest_window_months
    questions are the way into it; a monthly grid would be the way to answer it, and would require
    facts he has not yet given.
  - >-
    SIMPLIFICATIONS, NAMED. Nine identical seasons: no volume growth, no price escalation, no mango
    price movement, no wage or utility inflation. None of these is a view I hold; each is the
    utterance's silence carried forward unchanged rather than filled in. In a market where the farmgate
    mango price moves with the harvest and the retail price is negotiated with each chain, holding all
    of them flat for nine years is the largest single simplification in this file, and it is the one I
    would revisit first after the three high-materiality questions are answered.
  - >-
    NO TERMINAL VALUE. The horizon deliberately ends at the replacement decision and no continuing
    value is computed, because doing so would require a replacement capex figure and a view on whether
    the shed, the workers and the farmer relationships continue — none of which the founder addressed.
    A reader wanting an enterprise value must supply those separately; this file gives the nine years
    the words actually support.
  - >-
    ONE FRICTION KEPT RATHER THAN FORCED. He describes a seasonal campaign but quotes labour, shed and
    utilities monthly. I annualised at twelve because he describes standing arrangements, not seasonal
    ones. If in fact he stands the workers down and gives up the shed out of season, the fixed cost
    block is overstated. That reading is available to a reader and is not what his words say; I have
    not built it, and I have not hidden that I chose.
  - >-
    THE 4% / 5% CLASSIFICATION. CGI art. 77 gives two rates and no branch that obviously fits an
    industrial transformer of agricultural produce. I ran the higher one and materialised the lower
    one as its own checked column rather than describing it. This is a legal classification question
    for a local practitioner, not something the founder can settle and not something I could source.

checks:
  - "sum(trace.days) == days_per_year"
  - "trace.loaves_baked == loaves_baked_per_day * trace.days"
  - "trace.loaves_sold == loaves_sold_per_day * trace.days"
  - "trace.loaves_sold[t] <= trace.loaves_baked[t]"
  - "trace.flour_sacks_consumed * flour_sack_weight_kg * 1000 == trace.loaves_baked * flour_grams_per_loaf"
  - "flour_price_per_gram * flour_sack_weight_kg * 1000 == flour_sack_price_xof"
  - "flour_cost_per_loaf == flour_grams_per_loaf * flour_price_per_gram"
  - "flour_sacks_per_day * flour_sack_weight_kg * 1000 == loaves_baked_per_day * flour_grams_per_loaf"
  - "gross_margin_per_loaf == price_per_loaf - flour_cost_per_loaf"
  - "trace.revenue == price_per_loaf * trace.loaves_sold"
  - "trace.flour_cost == flour_cost_per_loaf * trace.loaves_baked"
  - "trace.gross_margin == trace.revenue - trace.flour_cost"
  - "sum(trace.wages) == bakers_headcount * baker_wage_monthly * grid.periods"
  - "sum(trace.rent) == rent_monthly * grid.periods"
  - "sum(trace.payroll_charges) == payroll_charges_monthly * grid.periods"
  - "sum(trace.fuel_and_utilities) == fuel_and_utilities_monthly * grid.periods"
  - "sum(trace.minor_inputs) == minor_inputs_monthly * grid.periods"
  - "sum(trace.owner_labour) == owner_labour_charge_monthly * grid.periods"
  - "cnps_employer_charge_per_baker_monthly == cnps_pension_rate_employer * baker_wage_monthly + (cnps_family_rate_employer + cnps_maternity_rate_employer + cnps_at_mp_rate_employer_min) * cnps_capped_base_monthly"
  - "baker_wage_monthly >= smig_monthly"
  - "baker_wage_monthly <= cnps_pension_ceiling_monthly"
  - "trace.opex_total == trace.flour_cost + trace.wages + trace.payroll_charges + trace.rent + trace.fuel_and_utilities + trace.minor_inputs + trace.owner_labour"
  - "trace.ebitda == trace.revenue - trace.opex_total"
  - "sum(trace.depreciation) * equipment_remaining_life_years == equipment_opening_nbv"
  - "trace.ebit == trace.ebitda - trace.depreciation"
  - "sum(trace.revenue) >= tee_band_low"
  - "sum(trace.revenue) <= tee_band_high"
  - "tax_rate_applied <= tee_rate_services"
  - "trace.tax == trace.revenue * tax_rate_applied"
  - "sum(trace.tax) == sum(trace.revenue) * tax_rate_applied"
  - "trace.nopat == trace.ebit - trace.tax"
  - "trace.flour_consumed == trace.flour_cost"
  - "flour_inventory_opening == flour_cover_days * loaves_baked_per_day * flour_cost_per_loaf"
  - "trace.flour_inventory[first] == flour_inventory_opening + trace.flour_purchases[first] - trace.flour_consumed[first]"
  - "trace.flour_inventory[t] == trace.flour_inventory[t-1] + trace.flour_purchases[t] - trace.flour_consumed[t] for t >= 1"
  - "sum(trace.flour_inventory) == flour_cover_days * loaves_baked_per_day * flour_cost_per_loaf * grid.periods"
  - "sum(trace.receivables) == receivable_days * price_per_loaf * loaves_sold_per_day * grid.periods"
  - "sum(trace.payables) == payable_days * flour_cost_per_loaf * loaves_baked_per_day * grid.periods"
  - "nwc_opening == flour_inventory_opening + receivable_days * price_per_loaf * loaves_sold_per_day - payable_days * flour_cost_per_loaf * loaves_baked_per_day"
  - "trace.nwc == trace.flour_inventory + trace.receivables - trace.payables"
  - "trace.delta_nwc[first] == trace.nwc[first] - nwc_opening"
  - "trace.delta_nwc[t] == trace.nwc[t] - trace.nwc[t-1] for t >= 1"
  - "cumsum(trace.delta_nwc) == trace.nwc - nwc_opening"
  - "trace.equipment_nbv[first] == equipment_opening_nbv + trace.capex[first] - trace.depreciation[first]"
  - "trace.equipment_nbv[t] == trace.equipment_nbv[t-1] + trace.capex[t] - trace.depreciation[t] for t >= 1"
  - "trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex"
  - "sum(trace.fcff) == sum(trace.ebitda) - sum(trace.tax) - sum(trace.delta_nwc) - sum(trace.capex)"
  - "trace.flour_inventory[t] >= 0"
  - "trace.equipment_nbv[t] >= 0"
  - "trace.capex[t] >= 0"
  - "trace.revenue[t] >= 0"
  - "trace.tax[t] >= 0"
  - "trace.loaves_baked[t] >= 0"
  - "trace.nwc[t] >= 0"

notes:
  - "BASE-CASE RULE, stated once and applied without exception. No unstated quantity enters this arithmetic with a non-zero value. Every ELICITED input runs at its omitting value — zero for costs the founder never mentioned, and the utterance's most direct reading for quantities he did mention. The consequence is that the FCFF reported here is an explicit UPPER BOUND on the asset-side cash this bakery generates, not a point estimate. Converting it into a point estimate requires four answers, and they are ranked in the materiality fields rather than guessed at here."
  - "THE THREE (FOUR) QUESTIONS. If the founder will answer only a handful, ask, in this order: how many of the five hundred loaves actually sell at 250 (loaves_sold_per_day); who owns the oven — is it in the rent or is it his (equipment_opening_nbv); what the oven's fuel and the shop's utilities cost him each month (fuel_and_utilities_monthly); and what he takes out of the till for himself, or what a replacement for him would cost (owner_labour_charge_monthly). Every one of those can move the result by more than the entire tax line."
  - "FLOUR IS NOT INGREDIENTS. « La farine me coûte cent cinquante francs par pain » is flour and only flour, and I have not silently widened it into a total ingredient cost. Yeast, salt, améliorant and packaging sit in minor_inputs_monthly at zero with a question attached. Widening the founder's word would have been the single easiest way to make this model look complete and be wrong."
  - "PRODUCT IDENTIFICATION. The stated price is not one of the two Ivorian administered points, and the loaf cannot be the homologated 174 g baguette, because a baked loaf never weighs less than the flour it contains and this one carries 250 g of flour. The founder is therefore selling a heavier, non-standard loaf. Direction of the residual risk: if the product does fall under an administered schedule, the top line is set by a ministry rather than by him, and the exposure is downward."
  - "THE TAX IS ON TURNOVER, NOT ON PROFIT — and this changes the shape of the model, not just a number. NOPAT here is EBIT minus a levy computed on a different base, so it is not EBIT × (1 − t). Two consequences a reader should carry: the tax line is completely invariant to every unanswered cost question, so answering them moves FCFF one-for-one with no tax relief; and depreciation carries no tax shield at all, so if the oven turns out to be owned, its capex bites FCFF fully while its depreciation buys nothing back. I have kept the natural description — a turnover levy — rather than forcing it into an effective-rate-on-EBIT shape, because the effective shape would mislead about exactly these two properties."
  - "REGIME PROXIMITY. Annual turnover sits below tee_band_high but not comfortably below it. Growth in a second year would cross the boundary and move the business out of the régime de l'entreprenant into the régime des microentreprises — a different regime at a higher rate on a larger base. That is a reason not to extend the horizon, not a forecast."
  - "FOUNDER BELIEF VERSUS WORLD RULE, kept as two objects. The utterance contains no mention of tax, of registration, or of social security. The model applies the statutory taxe d'État de l'entreprenant because a buyer of this asset would be taxed on it regardless of the seller's current practice — that is a fact about the world. Whether this founder is registered and pays it is a fact about his business, and it is asked (tax_rate_applied). Likewise on labour: what he pays his bakers is recorded from his own words at zero employer charges, while what the CNPS rules would cost on a declared baker is computed separately and asserted in the checks, without being charged. Neither object was allowed to overwrite the other."
  - "LABOUR SANITY. The stated wage clears the statutory minimum, and it sits far below the pension contribution ceiling while sitting above the ceiling that caps the family, maternity and accident branches — which is why the statutory employer charge is not a flat percentage of the wage and had to be computed branch by branch."
  - "RENT DOMINANCE. Rent is by far the largest fixed commitment in this business and absorbs the majority of gross margin in every month of the grid. It is also the fact that makes the oven-ownership question credible rather than pedantic: a rent at this level, measured against this turnover, is what a fitted bakery costs, not bare premises. The lease term and the rent-revision basis are DEFERRED — they do not move a number inside a twelve-month grid, but they would be the first thing to establish before extending it."
  - "WORKING CAPITAL IS STRUCTURALLY FLAT HERE, and the roll-forward is materialised anyway. With constant daily volumes and constant payment terms, inventory, receivables and payables are levels rather than movements, so ΔNWC contributes nothing. That is a derived result, not an assumption of convenience, and it stops holding the moment volumes move or the reseller-credit answer comes back positive — which is why every stock is carried as its own row with its own conservation assertion rather than collapsed away."
  - "MONTH LENGTH IS A REAL DRIVER, not a rounding artefact. Because output is per day and the two named fixed costs are per month, the shortest month is structurally the weakest and the annual average overstates the cushion available in it. This is the main thing the monthly grid buys over an annual one."
  - "SOURCE CONFLICTS I DID NOT PAPER OVER. (1) Secondary sources disagree on the régime des microentreprises rate — one reports 6% reduced to 4% for CGA members, another 7% reduced to 5%. I did not resolve it and did not rely on it, because this business sits below that band; the microenterprise regime is referenced only directionally. (2) One source states that the entreprenant regime dispenses the taxpayer from charges patronales, while another limits the libératoire effect to taxes other than payroll tax. I did not resolve it and did not rely on it: CNPS contributions are social-security obligations under labour law rather than taxes, and in any case they are elicited-at-zero in the base case. (3) The classification of an artisanal boulangerie as commerce/négoce versus prestation de services is not settled by anything I could verify to the article; it sits inside the elicited tax_rate_applied rather than being asserted."
  - "DEFERRED. The within-year cash timing of the tax (statutory instalments of one twelfth of the annual tax, against the accrual basis run here — identical totals, different intra-year profile); any adjustment to payment schedules made by the 2026 annexe fiscale (loi de finances n°2025-987 du 19 décembre 2025), which I confirmed exists and modifies payment timing but did not trace to the article; VAT treatment of bread and flour, which is moot under this regime since the taxpayer can neither invoice nor deduct VAT; the lease term and rent-revision basis; seasonality of bread demand (Ramadan, school terms, rainy season), which the founder did not mention and I did not invent."
  - "WHAT WOULD CHANGE MY MIND ON THE HORIZON. If equipment_opening_nbv comes back positive, the twelve-month annual grid is the wrong instrument: the right horizon becomes the oven's remaining life, capex and depreciation become live rows, and the whole document should be rebuilt rather than patched. If the country answer is not Côte d'Ivoire, every sourced statutory input must be replaced before the FCFF is quoted to anyone."
  - "WEAKEST LINK IN THE SOURCED BLOCK. The flour sack price is press reporting rather than a statistical series, and it is dated. It is deliberately confined to the physical cross-check and touches nothing in the FCFF path — but a reader should not treat the 250 g-per-loaf figure with the same confidence as the statutory rates, which are traceable to the CGI article."

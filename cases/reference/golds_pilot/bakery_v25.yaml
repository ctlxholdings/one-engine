passage: |
  0. WHAT THE UTTERANCE FIXES, AND WHAT IT DOES NOT

  Five sentences give me six numbers and one operating fact: 500 loaves baked a day, 250 XOF a loaf,
  150 XOF of flour a loaf, two bakers at 100 000 XOF a month each, 800 000 XOF of rent a month, and
  seven days of operation a week. That is enough to build a complete unlevered cash flow, and it is
  emphatically not enough to build a TRUE one. What is missing is not exotic: it is the fuel that
  fires the oven, the yeast and salt that are not flour, whatever the founder takes out for himself,
  and the question of whether the oven is his or the landlord's. I have not filled any of those gaps
  with a number of my own invention. Each is carried at its omitting value with the question I would
  ask attached to it, which makes the FCFF derived below an explicit UPPER BOUND on what this asset
  generates. A reader who wants a point estimate needs four answers, and they are ranked.

  1. THE GRID AND THE PHYSICAL LAYER

  Twelve monthly periods, t = 0 (January) to t = 11 (December), of a non-leap civil year. Because the
  founder works every day, operating days equal calendar days:

    days = 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31; total 365.

  Loaves baked per month = loaves_baked_per_day × days = 500 × days:

    t=0  500 × 31 = 15 500
    t=1  500 × 28 = 14 000
    t=2  500 × 31 = 15 500
    t=3  500 × 30 = 15 000
    t=4  500 × 31 = 15 500
    t=5  500 × 30 = 15 000
    t=6  500 × 31 = 15 500
    t=7  500 × 31 = 15 500
    t=8  500 × 30 = 15 000
    t=9  500 × 31 = 15 500
    t=10 500 × 30 = 15 000
    t=11 500 × 31 = 15 500
    total 500 × 365 = 182 500 loaves in the year.

  Loaves SOLD are carried separately from loaves BAKED, because flour is consumed against the bake
  and revenue is earned against the sale, and the founder's sentence fixes the first without strictly
  fixing the second. In the base case loaves_sold_per_day = loaves_baked_per_day = 500, so the two
  rows coincide period by period; the structure is kept apart so that the day-old-bread question can
  be answered without rebuilding the model.

  The business's own purchasing unit is the 50 kg sack, so the trace also carries sacks consumed:

    flour_sacks_consumed = loaves_baked × flour_grams_per_loaf / 50 000
    t=0  15 500 × 250 / 50 000 = 77.5 sacks
    t=1  14 000 × 250 / 50 000 = 70 sacks
    30-day months: 15 000 × 250 / 50 000 = 75 sacks
    31-day months: 77.5 sacks
    which is 2.5 sacks a day, every day.

  2. THE PHYSICAL CROSS-CHECK ON THE FLOUR NUMBER

  The founder gives flour as money per loaf, not as weight. Converting: a 50 kg sack at 30 000 XOF is
  30 000 / 50 000 g = 0.6 XOF per gram, so 150 XOF of flour is 150 / 0.6 = 250 g of flour in each
  loaf, and 500 loaves a day is 125 kg, or 2.5 sacks a day.

  That figure is testable, and it produces a hard deduction. The Ivorian administered bread standard
  is a baguette of 174 g BAKED at 150 XOF. A baked loaf always weighs more than the flour it was made
  from — dough is flour plus water, and baking drives off part of that water but never adds mass
  below the flour weight. A 174 g baked loaf therefore cannot contain 250 g of flour. The founder's
  product is not the homologated standard baguette. That conclusion needs no assumption about
  hydration or baking loss; it follows from the inequality alone, and it is consistent with the other
  visible fact — he charges 250 XOF where the administered points are 150 and 200.

  Two things follow. First, the model is internally coherent: a loaf carrying 250 g of flour and
  selling for 250 XOF is a large loaf priced roughly two thirds above the standard baguette, which is
  what a heavier product should look like. Second, the price is probably outside the administered
  schedule rather than in breach of it — but only the founder can confirm that, by telling me what
  his loaf weighs.

  3. REVENUE

  revenue = price_per_loaf × loaves_sold = 250 × loaves_sold.

    31-day month: 250 × 15 500 = 3 875 000 XOF
    30-day month: 250 × 15 000 = 3 750 000 XOF
    February    : 250 × 14 000 = 3 500 000 XOF

  Seven 31-day months, four 30-day months, one February:
    7 × 3 875 000 = 27 125 000
    4 × 3 750 000 = 15 000 000
    1 × 3 500 000 =  3 500 000
    annual revenue = 45 625 000 XOF, which is 250 × 500 × 365.

  Under IAS 18/IFRS 15 logic revenue is recognised when the loaf passes over the counter; with cash
  sale and same-day consumption, recognition and collection coincide, so there is no revenue-timing
  adjustment to make.

  4. FLOUR

  flour_cost = flour_cost_per_loaf × loaves_baked = 150 × loaves_baked.

    31-day month: 150 × 15 500 = 2 325 000 XOF
    30-day month: 150 × 15 000 = 2 250 000 XOF
    February    : 150 × 14 000 = 2 100 000 XOF
    annual: 7 × 2 325 000 + 4 × 2 250 000 + 2 100 000 = 16 275 000 + 9 000 000 + 2 100 000
          = 27 375 000 XOF, which is 150 × 500 × 365.

  Cost matching: because everything baked is sold the same day in the base case, flour consumed
  equals flour expensed, and the only flour on the balance sheet is the day's cover.

  Gross margin (revenue less flour only):
    31-day month: 3 875 000 − 2 325 000 = 1 550 000
    30-day month: 3 750 000 − 2 250 000 = 1 500 000
    February    : 3 500 000 − 2 100 000 = 1 400 000
    annual: 45 625 000 − 27 375 000 = 18 250 000 XOF, which is 100 × 500 × 365.

  Flour alone is 60% of the selling price. That is the dominant economic fact about this business and
  it is why the flour question — what he actually pays for a sack, and whether 150 XOF still holds —
  sits underneath everything else.

  5. LABOUR AND RENT

  wages = bakers_headcount × baker_wage_monthly = 2 × 100 000 = 200 000 XOF every month, 2 400 000
  over the year. The wage clears the statutory floor: 100 000 against a SMIG of 75 000.

  payroll_charges = 0 in the base case. The world's rule, if these bakers are declared, is
  computable from the sourced CNPS rates: pension runs on the full wage because the wage is far
  below the pension ceiling, so 0.077 × 100 000 = 7 700; family benefits, maternity and occupational
  accidents run on a base capped at 70 000, so (0.05 + 0.0075 + 0.02) × 70 000 = 0.0775 × 70 000
  = 5 425; total 13 125 XOF per baker per month. That figure is recorded as an input and asserted in
  the checks, and it is deliberately NOT charged: the founder said what he pays, and whether the
  statutory charge also lands on him is his fact to state, not mine to assume.

  rent = 800 000 XOF every month, 9 600 000 over the year. Against annual revenue of 45 625 000 that
  is 9 600 000 / 45 625 000 = 0.2104…, i.e. rent absorbs about 21% of the top line. That is very
  heavy for a food business paying for bare premises, and it is the observation that makes the
  ownership of the oven a live question rather than a formality: a rent at this level is what a
  FITTED bakery costs.

  6. THE COSTS THE FOUNDER DID NOT NAME

  fuel_and_utilities = 0, minor_inputs = 0, owner_labour = 0, payroll_charges = 0, for every period.
  These are not judgments that the costs are nil. They are the omitting values that keep the
  arithmetic complete without smuggling in invented numbers, and each carries its question in the
  input record. The consequence is stated plainly: EBITDA, NOPAT and FCFF below are all upper bounds,
  and the gap between them and the truth is exactly the sum of four answers the founder can give in
  two minutes.

  7. EBITDA

  opex_total = flour_cost + wages + payroll_charges + rent + fuel_and_utilities + minor_inputs
             + owner_labour
             = flour_cost + 200 000 + 0 + 800 000 + 0 + 0 + 0
             = flour_cost + 1 000 000.

    31-day month: 2 325 000 + 1 000 000 = 3 325 000
    30-day month: 2 250 000 + 1 000 000 = 3 250 000
    February    : 2 100 000 + 1 000 000 = 3 100 000

  ebitda = revenue − opex_total:
    31-day month: 3 875 000 − 3 325 000 = 550 000
    30-day month: 3 750 000 − 3 250 000 = 500 000
    February    : 3 500 000 − 3 100 000 = 400 000
    annual: 7 × 550 000 + 4 × 500 000 + 400 000 = 3 850 000 + 2 000 000 + 400 000 = 6 250 000 XOF.

  This is where the monthly grid earns its keep. February produces 400 000 against a 31-day month's
  550 000 — the same 1 000 000 of fixed cost spread over three fewer selling days. An annual view
  would report 6 250 000 and hide the fact that the business's cushion in its weakest month is a
  quarter thinner than in its strongest.

  8. DEPRECIATION AND EBIT

  depreciation = equipment_opening_nbv / (equipment_remaining_life_years × 12) = 0 / 120 = 0 in every
  period, because the base case records no owned equipment. Under IAS 16 a depreciable amount is
  allocated over the asset's useful life; with no asset recognised there is nothing to allocate.

  ebit = ebitda − depreciation = ebitda.

  9. TAX

  Regime determination, in order.
  (a) The currency is XOF, so the jurisdiction is one of the eight WAEMU states; the base case takes
      Côte d'Ivoire and every statutory figure below is Ivorian.
  (b) Annual turnover is 45 625 000 XOF. Because a taxpayer under the régime de l'entreprenant may
      neither invoice nor deduct VAT, the price the founder receives IS the turnover TTC, so no
      gross-up or strip-out is needed: the tax base is the revenue line as computed.
  (c) 45 625 000 falls between 5 000 001 and 50 000 000, so the taxe d'État de l'entreprenant applies
      (CGI arts. 72 et suivants). This is asserted as an executable check on both band edges rather
      than claimed in prose.
  (d) A bakery produces and sells a good, so the commerce/négoce rate of 4% applies rather than the
      5% services rate. This tax is libératoire: it stands in place of the impôt sur les bénéfices,
      the contribution des patentes et licences, and VAT.

  tax = tax_rate_applied × revenue = 0.04 × revenue, accrued against the period that earned the
  turnover:
    31-day month: 0.04 × 3 875 000 = 155 000
    30-day month: 0.04 × 3 750 000 = 150 000
    February    : 0.04 × 3 500 000 = 140 000
    annual: 0.04 × 45 625 000 = 1 825 000 XOF.

  A friction worth naming rather than smoothing over. The brief asks for NOPAT, and NOPAT normally
  means EBIT × (1 − t). Here the tax is not a function of EBIT at all — it is a levy on turnover. So
  NOPAT is EBIT minus a tax computed on a different base, and the effective burden on operating
  profit is far heavier than 4% suggests: 1 825 000 of tax against 6 250 000 of EBIT. It also means
  the tax line is INVARIANT to every cost question in section 6 — answering the fuel question changes
  EBIT and FCFF but leaves the tax untouched — and that depreciation, if the oven turns out to be
  owned, carries no tax shield whatever. I have kept the natural description (a turnover levy) rather
  than forcing it into an effective-rate-on-profit shape.

  A second friction, on timing rather than amount. The statutory payment basis is one twelfth of the
  annual tax each month, not 4% of the month's own turnover. I have run the ACCRUAL basis, matching
  the charge to the turnover that generated it, because that is what NOPAT means; the two bases give
  identical totals over the twelve periods and differ only in within-year timing. The instalment
  timing is deferred rather than modelled.

  nopat = ebit − tax:
    31-day month: 550 000 − 155 000 = 395 000
    30-day month: 500 000 − 150 000 = 350 000
    February    : 400 000 − 140 000 = 260 000
    annual: 6 250 000 − 1 825 000 = 4 425 000 XOF
    (cross-check: 7 × 395 000 + 4 × 350 000 + 260 000 = 2 765 000 + 1 400 000 + 260 000 = 4 425 000).

  10. WORKING CAPITAL

  Three components, each driven by an elicited term.

  Flour inventory. flour_cover_days = 1, so the stock is one day of production at cost:
  1 × 500 × 150 = 75 000 XOF. Daily production is constant regardless of month length, so the stock
  is 75 000 in every period, and the opening balance of the going concern is the same 75 000.
  The roll-forward is therefore flat: purchases equal consumption in every month.
    flour_consumed = flour_cost (the value of flour used in the bake)
    flour_purchases = flour_consumed + change in inventory = flour_consumed + 0 = flour_cost
    flour_inventory[t] = flour_inventory[t−1] + purchases[t] − consumed[t] = 75 000 throughout.

  Receivables. receivable_days = 0, so receivables = 0 × daily revenue = 0 in every period.
  Payables. payable_days = 0, so payables = 0 × daily flour cost = 0 in every period.

  nwc = flour_inventory + receivables − payables = 75 000 + 0 − 0 = 75 000 in every period.
  nwc_opening = 75 000.
  delta_nwc[0] = 75 000 − 75 000 = 0, and delta_nwc[t] = 0 for every later t.

  So ΔNWC contributes nothing to cash flow across the grid. That is a structural result of a flat
  daily operation, not a convenience: with constant volumes and constant terms, working capital is a
  level and not a movement. It would stop being flat the moment volumes moved, terms changed, or the
  reseller-credit question came back positive — which is why the roll-forward is materialised in full
  rather than collapsed to a zero row.

  11. CAPEX

  capex = 0 in every period, and equipment_nbv = 0 throughout:
    equipment_nbv[0] = equipment_opening_nbv + capex[0] − depreciation[0] = 0 + 0 − 0 = 0
    equipment_nbv[t] = equipment_nbv[t−1] + capex[t] − depreciation[t] = 0.
  This is the direct consequence of the base-case reading that the oven and the fit-out come with the
  local. It is the most consequential single omission in the document and it is flagged as such.

  12. FCFF

  FCFF = NOPAT + D&A − ΔNWC − capex. With depreciation, ΔNWC and capex all zero, FCFF equals NOPAT
  period by period:

    t=0  Jan  395 000 + 0 − 0 − 0 = 395 000
    t=1  Feb  260 000 + 0 − 0 − 0 = 260 000
    t=2  Mar  395 000
    t=3  Apr  350 000
    t=4  May  395 000
    t=5  Jun  350 000
    t=6  Jul  395 000
    t=7  Aug  395 000
    t=8  Sep  350 000
    t=9  Oct  395 000
    t=10 Nov  350 000
    t=11 Dec  395 000

  Annual unlevered free cash flow = 4 425 000 XOF, on turnover of 45 625 000 XOF — a 9.7% unlevered
  cash margin, before any of the four unanswered cost questions. Expressed in the founder's own
  units, the business converts 100 XOF of flour margin per loaf into roughly 24 XOF of after-tax
  asset cash flow per loaf (4 425 000 / 182 500 = 24.24…), and every 100 XOF a month of unnamed cost
  takes 100 XOF a month straight out of that, because the turnover tax gives no relief.

  Presented as the crossfoot the whole derivation must satisfy:
    revenue           45 625 000
    − flour           27 375 000
    − wages            2 400 000
    − rent             9 600 000
    − other named cost         0   (fuel, minor inputs, owner labour, payroll charges: all elicited)
    = EBITDA           6 250 000
    − depreciation             0
    = EBIT             6 250 000
    − tax (4% of turnover) 1 825 000
    = NOPAT            4 425 000
    + depreciation             0
    − ΔNWC                     0
    − capex                    0
    = FCFF             4 425 000


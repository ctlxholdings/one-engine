contract: "v2.5"
id: "bakery_xof_ci_12m_unlevered_fcff"
title: "Artisanal bakery, XOF (Côte d'Ivoire base case) — unlevered FCFF over 12 monthly periods, built as an explicit upper bound with every unstated quantity carried at zero and its question attached"
currency: "XOF"

grid:
  periods: 12
  freq: "monthly"
  why: |
    Twelve periods, monthly, covering one civil year (1 January to 31 December, 365 operating days).

    FREQUENCY. The founder's production cycle is daily — « Je fais cinq cents pains par jour »,
    « Je travaille tous les jours » — but every cost he names is quoted per month: « cent mille par
    mois », « huit cent mille par mois ». Monthly is therefore the coarsest period that preserves the
    daily production count exactly (a calendar month is a whole number of operating days for a
    seven-day-a-week baker) and the finest that does not force me to invent a daily split of rent and
    wages that the founder never gave. It also makes visible something an annual grid hides: because
    output is uniform per DAY while rent and wages are uniform per MONTH, month length drives the
    result. A 28-day February earns three fewer days of gross margin against exactly the same monthly
    fixed cost as a 31-day January. That swing is real cash, not a presentational artefact, and a
    lender or buyer looking at the worst month rather than the average month sees a different business.

    HORIZON. Twelve months, for three reasons.
    (i) The tax that governs this business is assessed on ANNUAL turnover, and the regime itself is
        selected by an annual band (tee_band_low to tee_band_high, in XOF TTC). A horizon shorter than
        twelve months cannot test which regime applies, and the regime is the single largest statutory
        fact in this model. Twelve months is therefore the MINIMUM horizon at which the tax line is
        even well defined.
    (ii) Nothing in the utterance supports any path beyond one year. There is no growth statement, no
        price trajectory, no lease term, no asset age, no seasonality, no financing. A second year
        would be forecast, not derivation, and the brief is to reason only from the founder's words
        plus standard professional knowledge.
    (iii) Both ends of this P&L are set OUTSIDE the business and revised without notice. The retail
        bread price in Côte d'Ivoire is administered by ministerial decision (see
        homologated_baguette_price_xof), and flour is an imported commodity whose 50 kg sack has moved
        by a multiple within two decades (see flour_sack_price_xof). Extending the grid means
        forecasting an administered price and a wheat commodity price. The founder's words license
        neither.

    WHY NOT LONGER. The one respectable argument for a ten-year grid is the life of a bakery oven.
    But the founder names no asset at all, and whether he even owns an oven is an OPEN question in
    this model (equipment_opening_nbv, ranked high). If that question comes back « le four est à
    moi », the correct horizon becomes the oven's remaining life and this grid must be rebuilt from
    the start — which is precisely why that question is ranked where it is. A second reason not to
    extend: annual turnover lands below tee_band_high but not far below it, so any growth in a second
    year would change the tax REGIME, not merely the tax. An analyst cannot extrapolate across a
    regime boundary blind.

    WHY NOT SHORTER OR FINER. A daily grid would require splitting rent and wages across days, which
    is an invention; a weekly grid would straddle month boundaries and misstate the fixed-cost
    accrual; an annual grid would erase the February effect and could not show the working-capital
    roll-forward. Monthly is the only frequency the utterance actually supports.

utterance:
  fr: |
    Moi je tiens une boulangerie. Je fais cinq cents pains par jour, vendus à deux cent
    cinquante francs pièce. La farine me coûte cent cinquante francs par pain. Je paie
    deux boulangers à cent mille par mois. Le loyer du local est à huit cent mille par
    mois. Je travaille tous les jours.
  en: |
    I run a bakery. I make five hundred loaves a day, sold at two hundred fifty francs
    each. Flour costs me one hundred fifty francs per loaf. I pay two bakers a hundred
    thousand a month each. The shop rent is eight hundred thousand a month. I work every
    day.

inputs:

  loaves_baked_per_day:
    value: 500
    unit: "loaves/day"
    prov: "STATED"
    source: "« Je fais cinq cents pains par jour » — this is the quantity BAKED, which is what flour is consumed against."
    date: "2026-07-27"

  price_per_loaf:
    value: 250
    unit: "XOF/loaf"
    prov: "STATED"
    source: "« vendus à deux cent cinquante francs pièce »"
    date: "2026-07-27"

  flour_cost_per_loaf:
    value: 150
    unit: "XOF/loaf"
    prov: "STATED"
    source: "« La farine me coûte cent cinquante francs par pain » — literally FLOUR only. The founder did not say ingredients, and I have not read it as ingredients; yeast, salt, improver, water and packaging are carried separately at minor_inputs_monthly."
    date: "2026-07-27"

  bakers_headcount:
    value: 2
    unit: "persons"
    prov: "STATED"
    source: "« Je paie deux boulangers »"
    date: "2026-07-27"

  baker_wage_monthly:
    value: 100000
    unit: "XOF/person/month"
    prov: "STATED"
    source: "« deux boulangers à cent mille par mois » — read as per baker, not as a shared pot; the parallel English the founder supplied disambiguates it as « a hundred thousand a month each »."
    date: "2026-07-27"

  rent_monthly:
    value: 800000
    unit: "XOF/month"
    prov: "STATED"
    source: "« Le loyer du local est à huit cent mille par mois »"
    date: "2026-07-27"

  operating_days_per_week:
    value: 7
    unit: "days/week"
    prov: "STATED"
    source: "« Je travaille tous les jours » — every calendar day is an operating day, so no rest-day or holiday deduction is applied to production."
    date: "2026-07-27"

  days_per_year:
    value: 365
    unit: "days/year"
    prov: "DEFAULTED"
    source: "Convention: the accounting and tax period is the calendar year, and a non-leap civil year is taken. Named rule — calendar-year accounting period. A leap year would add exactly one 500-loaf day to period t=1."
    date: "2026-07-27"

  gross_margin_per_loaf:
    value: 100
    unit: "XOF/loaf"
    prov: "INFERRED"
    source: "price_per_loaf − flour_cost_per_loaf = 250 − 150. No new information enters; it is a subtraction of two stated figures. Note this is a FLOUR margin, not a contribution margin, because it carries no fuel, no minor ingredients and no packaging."
    date: "2026-07-27"

  flour_sack_weight_kg:
    value: 50
    unit: "kg/sack"
    prov: "SOURCED"
    authority: "Standard commercial unit for wheat flour in the WAEMU market; Ivorian bakery-sector price reporting quotes flour exclusively in « sacs de 50 kg » — choco.ci, « Consommation / Prix du pain en Côte d'Ivoire », http://choco.ci/news/single/9-consommation-prix-du-pain-en-cote-divoire-comment-des-boulangers-rusent-pour-se-faire-beaucoup-dargent"
    source: "Used only to convert a money-per-loaf figure into a physical grams-per-loaf figure for a plausibility check. It does not enter revenue, cost, tax or FCFF."
    verified: "2026-07-27"

  flour_sack_price_xof:
    value: 30000
    unit: "XOF/sack of 50 kg"
    prov: "SOURCED"
    authority: "choco.ci, « Consommation / Prix du pain en Côte d'Ivoire: comment des boulangers rusent pour se faire beaucoup d'argent » — the 50 kg sack moved from 11 500 XOF in the 2000s to 22 000 XOF in 2022 and approaches 30 000 XOF after the Russia–Ukraine shock. http://choco.ci/news/single/9-consommation-prix-du-pain-en-cote-divoire-comment-des-boulangers-rusent-pour-se-faire-beaucoup-dargent"
    source: "Press benchmark rather than a statistical-office series — this is the weakest-authority sourced input in the document and I am flagging it as such. It is used ONLY for the physical cross-check on flour_cost_per_loaf; nothing in the FCFF path depends on it."
    verified: "2026-07-27"

  flour_price_per_gram:
    value: 0.6
    unit: "XOF/g"
    prov: "INFERRED"
    source: "flour_sack_price_xof / (flour_sack_weight_kg * 1000) = 30000 / 50000. Deduction from two recorded inputs; no unrecorded prior."
    date: "2026-07-27"

  flour_grams_per_loaf:
    value: 250
    unit: "g/loaf"
    prov: "INFERRED"
    source: "flour_cost_per_loaf / flour_price_per_gram = 150 / 0.6. Deduction from recorded inputs; the point of computing it is that it is physically testable — see the cross-check in passage."
    date: "2026-07-27"

  flour_sacks_per_day:
    value: 2.5
    unit: "sacks of 50 kg/day"
    prov: "INFERRED"
    source: "loaves_baked_per_day * flour_grams_per_loaf / (flour_sack_weight_kg * 1000) = 500 * 250 / 50000. This is the business's own natural purchasing unit — the founder buys sacks, not grams."
    date: "2026-07-27"

  homologated_baguette_price_xof:
    value: 150
    unit: "XOF/baguette"
    prov: "SOURCED"
    authority: "Government of Côte d'Ivoire, Conseil des ministres decision announced 30 March 2022: two homologated bread standards fixed — 174 g at 150 FCFA and 232 g at 200 FCFA. Portail officiel du Gouvernement, https://www.gouv.ci/actualite/prix-de-la-baguette-de-pain-desormais-deux-poids-fixes-dont-174-g-pour-150-fcfa-et-232g-pour-200-fcfa-2460"
    source: "Recorded because the founder's stated price is not one of the homologated points, which is a real regulatory and product-identification fact about this business."
    verified: "2026-07-27"

  homologated_baguette_weight_g:
    value: 174
    unit: "g (baked weight)"
    prov: "SOURCED"
    authority: "Same decision as homologated_baguette_price_xof — Conseil des ministres, Côte d'Ivoire, 30 March 2022, baguette standard fixed at 174 g for 150 FCFA. https://www.gouv.ci/actualite/prix-de-la-baguette-de-pain-desormais-deux-poids-fixes-dont-174-g-pour-150-fcfa-et-232g-pour-200-fcfa-2460"
    source: "Used for the deduction in passage that the founder's product cannot be the homologated standard baguette."
    verified: "2026-07-27"

  tee_band_low:
    value: 5000001
    unit: "XOF/year, turnover TTC"
    prov: "SOURCED"
    authority: "Côte d'Ivoire, Code général des impôts, articles 72 et suivants (régime de l'entreprenant), introduced by the annexe fiscale to loi de finances n°2020-972 du 23 décembre 2020. Below 5 000 000 XOF the taxpayer falls under the taxe communale de l'entreprenant instead. Sources: https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-la-taxe-detat-de-lentreprenant/ and https://blog.ivoire-juriste.com/2025/12/tout-savoir-sur-le-regime-de-lentreprenant-en-cote-divoire-taxe-communale-et-taxe-detat.html"
    source: "Lower bound of the taxe d'État de l'entreprenant band; asserted against this model's own annual turnover in checks."
    verified: "2026-07-27"

  tee_band_high:
    value: 50000000
    unit: "XOF/year, turnover TTC"
    prov: "SOURCED"
    authority: "Côte d'Ivoire, CGI articles 72 et suivants (régime de l'entreprenant): the taxe d'État de l'entreprenant applies to annual turnover TTC between 5 000 001 and 50 000 000 XOF; above that the taxpayer moves to the régime des microentreprises. Confirmed by three independent secondary sources: https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-la-taxe-detat-de-lentreprenant/ , https://blog.ivoire-juriste.com/2025/12/tout-savoir-sur-le-regime-de-lentreprenant-en-cote-divoire-taxe-communale-et-taxe-detat.html , https://www.gedbered.com/blog/regimes-fiscaux-2026-impot-entreprise.html"
    source: "Upper bound of the band. This model's annual turnover sits below it, which is what selects the regime; the test is written as an executable check rather than asserted in prose."
    verified: "2026-07-27"

  tee_rate_commerce_negoce:
    value: 0.04
    unit: "fraction of annual turnover TTC"
    prov: "SOURCED"
    authority: "Côte d'Ivoire, CGI articles 72 et suivants: taxe d'État de l'entreprenant at 4% of annual turnover TTC for commerce and négoce activities, halved for members of a centre de gestion agréé; libératoire of the impôt sur les bénéfices, of the contribution des patentes et licences and of VAT (the taxpayer may neither invoice nor deduct VAT); paid in monthly instalments of one twelfth of the annual tax by the 10th of each month. https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-la-taxe-detat-de-lentreprenant/ and https://blog.ivoire-juriste.com/2025/12/tout-savoir-sur-le-regime-de-lentreprenant-en-cote-divoire-taxe-communale-et-taxe-detat.html"
    source: "The rate for a taxpayer selling goods. A bakery produces and sells a good, so this is the rate the base case applies through tax_rate_applied."
    verified: "2026-07-27"

  tee_rate_services:
    value: 0.05
    unit: "fraction of annual turnover TTC"
    prov: "SOURCED"
    authority: "Same instrument and articles as tee_rate_commerce_negoce — Côte d'Ivoire CGI arts. 72 et suivants: 5% for prestations de services. https://profession-juriste.ci/les-regimes-dimposition-en-cote-divoire-la-taxe-detat-de-lentreprenant/"
    source: "Recorded because the classification of an artisanal boulangerie as commerce/négoce rather than prestation de services is not settled by anything I could verify; it is the upper end of the elicited tax_rate_applied."
    verified: "2026-07-27"

  smig_monthly:
    value: 75000
    unit: "XOF/month"
    prov: "SOURCED"
    authority: "Côte d'Ivoire, décret n°2022-986 du 21 décembre 2022 raising the salaire minimum interprofessionnel garanti from 60 000 to 75 000 FCFA with effect 1 January 2023; still in force in 2026. https://www.cleiss.fr/docs/cotisations/cotedivoire.html"
    source: "Used as a labour-law plausibility test on baker_wage_monthly, asserted as an executable check."
    verified: "2026-07-27"

  cnps_pension_rate_employer:
    value: 0.077
    unit: "fraction of gross salary"
    prov: "SOURCED"
    authority: "CNPS Côte d'Ivoire employer contribution rates in force 1 January 2025, tabulated by CLEISS (Centre des liaisons européennes et internationales de sécurité sociale), « Les cotisations en Côte d'Ivoire »: retraite 7,70% employeur / 6,30% salarié, ceiling 3 375 000 XOF per month. https://www.cleiss.fr/docs/cotisations/cotedivoire.html"
    source: "Part of the statutory employer cost of a declared baker. Not charged in the base case — see payroll_charges_monthly."
    verified: "2026-07-27"

  cnps_family_rate_employer:
    value: 0.05
    unit: "fraction of capped base"
    prov: "SOURCED"
    authority: "CLEISS, « Les cotisations en Côte d'Ivoire », rates in force 1 January 2025: prestations familiales 5% employer only, ceiling 70 000 XOF per month. https://www.cleiss.fr/docs/cotisations/cotedivoire.html"
    source: "Part of the statutory employer cost of a declared baker."
    verified: "2026-07-27"

  cnps_maternity_rate_employer:
    value: 0.0075
    unit: "fraction of capped base"
    prov: "SOURCED"
    authority: "CLEISS, « Les cotisations en Côte d'Ivoire », rates in force 1 January 2025: maternité 0,75% employer only, ceiling 70 000 XOF per month. https://www.cleiss.fr/docs/cotisations/cotedivoire.html"
    source: "Part of the statutory employer cost of a declared baker."
    verified: "2026-07-27"

  cnps_at_mp_rate_employer_min:
    value: 0.02
    unit: "fraction of capped base"
    prov: "SOURCED"
    authority: "CLEISS, « Les cotisations en Côte d'Ivoire », rates in force 1 January 2025: accidents du travail et maladies professionnelles 2% to 5% employer only depending on sector risk class, ceiling 70 000 XOF per month. https://www.cleiss.fr/docs/cotisations/cotedivoire.html"
    source: "The bottom of the statutory 2–5% range is taken, because the exact risk class assigned to a boulangerie is not something I could verify; taking the bottom keeps the recorded statutory employer cost a lower bound rather than an inflated one."
    verified: "2026-07-27"

  cnps_capped_base_monthly:
    value: 70000
    unit: "XOF/month"
    prov: "SOURCED"
    authority: "CLEISS, « Les cotisations en Côte d'Ivoire »: the monthly contribution ceiling for prestations familiales, maternité and accidents du travail is 70 000 XOF; the pension ceiling is separate at 3 375 000 XOF. https://www.cleiss.fr/docs/cotisations/cotedivoire.html"
    source: "The ceiling binds here, because baker_wage_monthly exceeds it — which is exactly why the employer charge is not a flat percentage of the wage."
    verified: "2026-07-27"

  cnps_pension_ceiling_monthly:
    value: 3375000
    unit: "XOF/month"
    prov: "SOURCED"
    authority: "CLEISS, « Les cotisations en Côte d'Ivoire »: pension contribution ceiling equal to 45 times the monthly SMIG, i.e. 3 375 000 XOF. https://www.cleiss.fr/docs/cotisations/cotedivoire.html"
    source: "Recorded for completeness; it does not bind, since baker_wage_monthly is far below it, so the pension contribution runs on the full wage."
    verified: "2026-07-27"

  cnps_employer_charge_per_baker_monthly:
    value: 13125
    unit: "XOF/person/month"
    prov: "INFERRED"
    source: "cnps_pension_rate_employer * baker_wage_monthly + (cnps_family_rate_employer + cnps_maternity_rate_employer + cnps_at_mp_rate_employer_min) * cnps_capped_base_monthly = 0.077*100000 + 0.0775*70000 = 7700 + 5425. Deduction from recorded sourced rates and a stated wage. This is what the world's rule says a declared baker costs on top of the wage; it is NOT charged in the base case, because whether these bakers are declared is a fact about this business that only the founder holds."
    date: "2026-07-27"

  flour_inventory_opening:
    value: 75000
    unit: "XOF"
    prov: "INFERRED"
    source: "flour_cover_days * loaves_baked_per_day * flour_cost_per_loaf = 1 * 500 * 150. The business is a going concern at t=0, so it already holds this stock; it is an opening balance, not a period-0 investment."
    date: "2026-07-27"

  nwc_opening:
    value: 75000
    unit: "XOF"
    prov: "INFERRED"
    source: "flour_inventory_opening + receivables (receivable_days = 0) − payables (payable_days = 0) = 75000 + 0 − 0. Opening operating working capital of the going concern."
    date: "2026-07-27"

  country:
    value: "Côte d'Ivoire"
    unit: "jurisdiction"
    prov: "ELICITED"
    source: "The currency XOF narrows this to the eight WAEMU states but no further. Base case takes Côte d'Ivoire — the largest XOF economy, and the one whose small-business tax regime I could verify to the article across three independent sources. Every statutory input in this document is Ivorian; none of them survives a change of country, which is why the question is asked first. Ranked medium rather than high on the NUMBER because small-business regimes across the XOF states are all turnover-based and cluster in a narrow band of rates, so the FCFF swing is second-order next to the omitted-cost questions; it is nonetheless the question on which the VALIDITY of six sourced inputs rests."
    date: "2026-07-27"
    question: "Votre boulangerie, elle est dans quel pays et dans quelle ville ?"
    range:
      low: "Côte d'Ivoire"
      high: "un autre État de l'UEMOA — Sénégal, Mali, Burkina Faso, Niger, Togo, Bénin ou Guinée-Bissau — avec un régime des petites entreprises différent"
    materiality: "medium"

  tax_rate_applied:
    value: 0.04
    unit: "fraction of annual turnover TTC"
    prov: "ELICITED"
    source: "Base case applies tee_rate_commerce_negoce, on the ground that a bakery sells a good it produces rather than supplying a service, and that annual turnover falls inside the taxe d'État de l'entreprenant band. But the DGI's actual classification of this taxpayer, and whether he is a member of a centre de gestion agréé (which halves the rate), are printed on his registration papers and his avis d'imposition — he holds the answer, I do not. The base-case figure is the middle of the plausible span and the one the statutory text most directly supports."
    date: "2026-07-27"
    question: "Sous quel régime êtes-vous inscrit à la DGI, et qu'est-ce qui est écrit sur votre avis d'imposition — taxe d'État de l'entreprenant ou impôt des microentreprises, et est-ce que vous êtes adhérent d'un centre de gestion agréé ?"
    range:
      low: 0.02
      high: 0.05
    materiality: "medium"

  loaves_sold_per_day:
    value: 500
    unit: "loaves/day"
    prov: "ELICITED"
    source: "« Je fais cinq cents pains par jour, vendus à deux cent cinquante francs pièce » fixes the quantity BAKED and the price of a loaf that sells. It does not entail that all five hundred sell. Base case takes the utterance's most direct reading — 500 baked, 500 sold — which is also the omitting choice for waste and therefore an upper bound on revenue. Waste is unusually expensive in this business because the flour is already spent when the loaf fails to sell, so every unsold loaf costs the full price_per_loaf of revenue with no cost relief."
    date: "2026-07-27"
    question: "Sur les cinq cents pains que vous cuisez chaque jour, combien sont réellement vendus à 250 francs, et qu'est-ce que vous faites de ceux qui restent le soir ?"
    range:
      low: 450
      high: 500
    materiality: "high"

  equipment_opening_nbv:
    value: 0
    unit: "XOF"
    prov: "ELICITED"
    source: "The founder names no asset. He does name a rent of 800 000 XOF per month for « le local » — which, measured against the turnover this model derives, is an extremely heavy rent for bare premises and is entirely consistent with a fitted bakery where the four and the agencements come with the lease. Base case therefore carries no owned equipment: the omitting choice, which makes both depreciation and capex zero and makes the FCFF below an upper bound. This is the single question I would ask first if I could only ask one, because it does not merely change a number — if the answer is « le four est à moi », the correct HORIZON changes too and the grid has to be rebuilt on the oven's remaining life."
    date: "2026-07-27"
    question: "Les 800 000 francs de loyer, est-ce que ça comprend le four et le matériel, ou est-ce que le four vous appartient — et s'il vous appartient, il vaut combien aujourd'hui ?"
    range:
      low: 0
      high: 15000000
    materiality: "high"

  equipment_remaining_life_years:
    value: 10
    unit: "years"
    prov: "ELICITED"
    source: "Keeps the depreciation formula well defined. With equipment_opening_nbv at zero it multiplies a zero and moves nothing today, which is why it is ranked low — but it inherits the materiality of equipment_opening_nbv the moment that question comes back « il est à moi ». The founder knows his oven's age and how much longer he expects to run it; I do not, and no published table can tell me about HIS oven."
    date: "2026-07-27"
    question: "Votre four, il a quel âge, et vous comptez le faire tourner encore combien d'années avant de devoir le remplacer ?"
    range:
      low: 5
      high: 15
    materiality: "low"

  owner_labour_charge_monthly:
    value: 0
    unit: "XOF/month"
    prov: "ELICITED"
    source: "« Je travaille tous les jours » — the founder supplies daily labour to this business and charges nothing for it in his own account. For an ASSET-side cash flow that is a real omission: a buyer of the bakery would have to pay someone to do what he does. Base case carries zero, the omitting choice, so the reader can see exactly how much of the headline FCFF is in fact the founder's unpaid wage rather than a return on the asset."
    date: "2026-07-27"
    question: "Chaque mois, vous prenez combien dans la caisse pour vous — et si vous n'étiez pas là tous les jours, il faudrait payer qui, et combien, pour vous remplacer ?"
    range:
      low: 0
      high: 200000
    materiality: "high"

  fuel_and_utilities_monthly:
    value: 0
    unit: "XOF/month"
    prov: "ELICITED"
    source: "An oven baking five hundred loaves every day of the year consumes wood, gas or electricity, and the shop consumes water and light. The founder named none of it. Base case carries zero — the omitting choice — because inventing a fuel bill would bury the most consequential thing this utterance does not contain. The founder pays this bill and can state it to the franc."
    date: "2026-07-27"
    question: "Votre four marche au bois, au gaz ou à l'électricité, et vous payez combien par mois pour ça — plus l'eau et l'électricité de la boutique ?"
    range:
      low: 100000
      high: 800000
    materiality: "high"

  minor_inputs_monthly:
    value: 0
    unit: "XOF/month"
    prov: "ELICITED"
    source: "flour_cost_per_loaf is flour and nothing else, by the founder's own words. Yeast, salt, améliorant, water and packaging are real recurring purchases that he did not mention. Base case carries zero, the omitting choice; he buys these and knows the monthly figure."
    date: "2026-07-27"
    question: "En dehors de la farine, vous achetez quoi chaque mois pour faire le pain — levure, sel, améliorant, sachets — et ça vous fait combien ?"
    range:
      low: 50000
      high: 400000
    materiality: "medium"

  payroll_charges_monthly:
    value: 0
    unit: "XOF/month"

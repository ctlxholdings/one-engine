contract: "v2.5"
id: "ci_cashew_bouake_fcff_v25"
title: "Cashew shelling unit at Bouake, Cote d'Ivoire - unlevered FCFF over the plant's stated fifteen-year life, with the investment-code holiday the founder relies on tested against the instrument"
currency: "XOF"

grid:
  periods: 16
  freq: "annual"
  why: >
    Sixteen annual periods: one construction period (t=0, calendar 2026) followed by fifteen
    production periods (t=1..15, calendar 2027-2041).
    ANNUAL, because every quantity the founder supplied is already annual or trivially annualised
    (two thousand tonnes a year, one hundred and twenty million a year, eighty thousand a month
    times twelve), and because the two clocks that actually govern this business are annual: the
    Ivorian tax year, on which the exemption he is counting on is measured, and the cashew campaign,
    which the Conseil du coton, de l'anacarde et du karite opens in early February each year. A
    monthly grid would need a campaign purchasing profile and a shipment calendar he has not given;
    it would manufacture precision rather than add it.
    FIFTEEN PRODUCTION YEARS, because that is the life he himself puts on the plant - on ce genre
    d'equipement on compte quinze ans. The horizon is the asset. Beyond it the plant has to be
    rebuilt and he has told us nothing about that, so the question stops being answerable.
    A SEPARATE PERIOD 0, because he cannot install the plant and shell nuts in the same instant. He
    says he starts next year; today is 27 July 2026, so production begins in 2027 and the one
    hundred and eighty million goes out before it. Folding the capex into the first production year
    would hide that ordering, which is the only reason the first cash flow is negative.
    AND THE HORIZON MUST RUN PAST YEAR FIVE. The entire investment case he describes rests on a
    profit-tax holiday - ce qui a decide l'investissement, c'est l'agrement. A five-year view, or
    even a ten-year view, would answer a flattering question: it would show the business only while
    it pays no tax. Fifteen years is the shortest horizon on which the reader can see both the
    sheltered years and the taxed ones, which is the only way to see whether the plant is a business
    or a tax structure.

utterance:
  fr: |
    Je monte une unite de transformation de noix de cajou a Bouake. L'usine me coute cent
    quatre-vingts millions a installer - les machines de decorticage, les sechoirs, le batiment - et
    sur ce genre d'equipement on compte quinze ans. Je demarre l'annee prochaine. Je traiterai deux
    mille tonnes de noix brutes par an, que j'achete aux cooperatives a cinq cents francs le kilo.
    Le rendement, c'est vingt-deux kilos d'amande blanche pour cent kilos de noix brutes - le reste,
    c'est la coque. L'amande, je l'exporte a quatre mille cinq cents francs le kilo. J'aurai
    soixante ouvriers a quatre-vingt mille par mois, et le courant, l'eau, les sacs et l'entretien
    me feront dans les cent vingt millions par an. Ce qui a decide l'investissement, c'est
    l'agrement : j'ai obtenu l'agrement au code des investissements, et il me donne cinq ans
    d'exoneration totale d'impot sur le benefice a compter de la premiere annee de production. Apres
    ces cinq ans, je repasse au taux normal comme tout le monde, vingt-cinq pour cent. C'est pour ca
    que je me depeche de demarrer.
  en: |
    I am setting up a cashew processing unit in Bouake. The plant costs me one hundred and eighty
    million to install - the shelling machines, the dryers, the building - and on that kind of
    equipment you reckon fifteen years. I start next year. I will process two thousand tonnes of raw
    nuts a year, which I buy from the cooperatives at five hundred francs a kilo. The yield is
    twenty-two kilos of white kernel per hundred kilos of raw nuts - the rest is shell. The kernel I
    export at four thousand five hundred francs a kilo. I will have sixty workers at eighty thousand
    a month, and power, water, bags and maintenance will run me around one hundred and twenty
    million a year. What decided the investment was the approval: I obtained approval under the
    investment code, and it gives me five years of complete exemption from profit tax starting from
    the first year of production. After those five years I go back to the normal rate like everyone
    else, twenty-five percent. That is why I am hurrying to start.


    source: "The regulator fixes mandatory floor prices along the raw-nut chain: 400 bord champ, 425 magasin interieur, 454 magasin usine, 484 magasin portuaire. His stated purchase price of 500 XOF per kg from cooperatives sits ABOVE every one of those floors, so the input cost in this model is not an optimistic one; it is at or above the regulated minimum for delivery to a factory warehouse. Recorded as a cross-check on raw_nut_price, not as a substitute for it."
    authority: "Conseil du coton, de l'anacarde et du karite (CCA), prix planchers obligatoires de la noix de cajou brute for the campaign, announced 17 February 2026; campaign opened 9 February 2026 with 9 February to 15 March reserved exclusively for local processors. Reported at https://www.koaci.com/article/2026/02/17/cote-divoire/economie/"
    verified: "2026-07-27"

  campaign_window_months:
    value: 5
    unit: "months per year"
    prov: SOURCED
    source: "The Ivorian raw cashew campaign opens in early February (9 February for the current campaign) and the buying season runs roughly February to June. A plant that shells twelve months a year on a five-month buying window MUST carry raw stock - which is why a zero-inventory base case is not physically available to this business, and why raw_nut_stock_kg below is elicited with a non-zero working value."
    authority: "Conseil du coton, de l'anacarde et du karite (CCA), opening of the campaign on 9 February 2026, with the period 9 February to 15 March reserved for local processors. Reported at https://www.koaci.com/article/2026/02/17/cote-divoire/economie/"
    verified: "2026-07-27"

  vat_standard_rate:
    value: 0.18
    unit: "fraction"
    prov: SOURCED
    source: "Standard Ivorian VAT. Recorded to justify its ABSENCE from the cash flows: exports are not taxed at output, the investment code suspends VAT on qualifying capital goods during the investment phase, and input VAT on the remaining purchases is recoverable, so VAT is treated as cash-neutral over an annual grid."
    authority: "PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Other taxes, VAT at 18 percent. https://taxsummaries.pwc.com/ivory-coast/corporate/other-taxes - last reviewed 11 March 2026. Investment-phase VAT suspension: PwC, Tax credits and incentives, same site."
    verified: "2026-07-27"

  # ---------------------------------------------------------------- ELICITED
  export_logistics_cost_per_kg:
    value: 0
    unit: "XOF per kg of kernel"
    prov: ELICITED
    source: "Working value 0, i.e. the 4500 is taken as landing net at the factory gate in Bouake. That is the reading his words support - je l'exporte a quatre mille cinq cents francs le kilo, with no mention of freight - and it is the omitting choice: it adds no cost the utterance does not contain. It is NOT the conservative choice, and that is exactly why the question matters. Bouake is roughly 350 km inland from the port of Abidjan, so vacuum packing, inland haulage, port handling and ocean freight sit somewhere in this chain, and whether they sit inside or outside his 4500 changes the answer more than anything else he could tell us."
    question: "Your four thousand five hundred francs a kilo - is that what lands in your account at the factory gate in Bouake, or is it the price at the port in Abidjan, or the price delivered to the buyer overseas? And if it is not the factory gate, who pays the packing, the trucking to Abidjan, the port charges and the sea freight?"
    range: {low: 0, high: 400}
    materiality: high
    date: "2026-07-27"

  throughput_ramp_first_year:
    value: 1.0
    unit: "fraction of nameplate throughput achieved in the first production year"
    prov: ELICITED
    source: "Working value 1.0, i.e. his own stated two thousand tonnes from year one, taken as given. It is the figure he supplied, so it is the non-inventing choice; it is also the optimistic end of the plausible span, because a new shelling line with sixty newly trained cutters does not usually reach nameplate in its first twelve months. Kept at 1.0 so the base case remains his case, with the question attached."
    question: "In your very first year, 2027, how many tonnes of raw nuts do you actually expect to put through the line - the full two thousand, or less while the cutters are being trained and the dryers are being tuned? And how long before you are at two thousand?"
    range: {low: 0.5, high: 1.0}
    materiality: high
    date: "2026-07-27"

  raw_nut_stock_kg:
    value: 500000
    unit: "kg of raw nuts held at each year end"
    prov: ELICITED
    source: "Working value 500000 kg, a quarter of annual throughput. The omitting choice - zero stock - is not available here: the campaign opens in February (SOURCED above) and he shells twelve months a year, so a plant with no raw nuts on 31 December cannot run in January. A quarter of annual throughput is about the smallest stock consistent with the continuous operation he describes, which makes it the conservative end of the physically possible range rather than a midpoint. The upper bound of the range is the whole crop bought forward during the campaign, which is what many Ivorian processors actually do and which would nearly quadruple the working-capital call."
    question: "Do you buy your two thousand tonnes during the campaign and store them, or do you buy month by month through the year? Concretely - on 31 December, how many tonnes of raw nuts do you expect to have sitting in the warehouse?"
    range: {low: 0, high: 2000000}
    materiality: high
    date: "2026-07-27"

  shell_revenue_per_kg:
    value: 0
    unit: "XOF per kg of shell"
    prov: ELICITED
    source: "Working value 0, the omitting choice. He says le reste, c'est la coque and stops there, so the base case gives the shell no value. But the plant throws off 1560 tonnes of shell a year, and shell is burned as boiler fuel, pressed for cashew nut shell liquid, or sold as cake - so zero is a choice, not a fact."
    question: "The coque - the fifteen hundred odd tonnes of shell you will have every year - what happens to it? Do you burn it in your own dryers, give it away, pay to have it removed, or sell it, and if you sell it, at what price a kilo?"
    range: {low: 0, high: 40}
    materiality: medium
    date: "2026-07-27"

  non_production_payroll_per_year:
    value: 0
    unit: "XOF per year"
    prov: ELICITED
    source: "Working value 0, the omitting choice. He named sixty ouvriers and nobody else. A 2000-tonne shelling unit normally also carries a plant manager, a quality controller who grades and certifies the kernel for export, an accountant, storekeepers and night security - none of whom are ouvriers and none of whom appear in his eighty thousand a month."
    question: "Besides the sixty workers on the line, who else will be on the payroll - a plant manager, a quality controller for the export grading, an accountant, storekeepers, night guards - and what will you pay each of them a month?"
    range: {low: 0, high: 60000000}
    materiality: medium
    date: "2026-07-27"

  receivable_months:
    value: 1
    unit: "months of revenue outstanding at each year end"
    prov: ELICITED
    source: "Working value one month. Kernel is exported, so cash follows the container rather than the shipment: even documents-against-payment terms leave a few weeks of value afloat, and this line also absorbs the finished kernel sitting in the warehouse waiting for a container, which is not modelled separately. One month is the shorter end of the plausible span, so it is the conservative-toward-the-founder choice on working capital."
    question: "When you ship a container of kernel, when does the money actually reach your bank - against documents at the port, thirty days after shipment, sixty? And do your buyers open letters of credit or pay on open account?"
    range: {low: 0, high: 3}
    materiality: medium
    date: "2026-07-27"

  payable_months:
    value: 0
    unit: "months of raw-nut purchases outstanding at each year end"
    prov: ELICITED
    source: "Working value zero, i.e. cash on delivery to the cooperatives. This is the omitting and the conservative choice - it grants the business no supplier financing at all - and it matches how the regulated campaign works in practice, where producers and their cooperatives are paid promptly against the mandatory floor price."
    question: "When a cooperative delivers you a lorry of raw nuts, do you pay them on the spot, or do they carry you for a few weeks? If they carry you, how many days on average?"
    range: {low: 0, high: 2}
    materiality: low
    date: "2026-07-27"

  exemption_clock_slippage_periods:
    value: 0
    unit: "annual periods"
    prov: ELICITED
    source: "Working value 0, i.e. the exemption clock starts exactly with the first production year, as he says. This is his own claim and therefore the non-inventing choice. But the instrument ties the benefit period to a date fixed in the approval decision, not to the day the first nut is shelled - and his own remark, c'est pour ca que je me depeche de demarrer, suggests he suspects the clock may already be running. Every period of slippage is a fully exempt year converted into a taxed one."
    question: "Take out the arrete d'agrement and read me two things - the date it fixes for the start of the exemption period, and the year-by-year schedule of exemption it sets out. Does the clock run from the date of the arrete, or from the date CEPICI notifies your entry into operation?"
    range: {low: 0, high: 2}
    materiality: high
    date: "2026-07-27"

  # ---------------------------------------------------------------- ASSUMED
  cnps_work_injury_rate:
    value: 0.03
    unit: "fraction of capped monthly wage"
    prov: ASSUMED
    source: "The statutory band is 2 to 5 percent and is SOURCED above; the point inside the band is set by the CNPS sector risk classification, and no published schedule assigning a class to cashew shelling was found. 3 percent is taken as a mid-band industrial rate. Flagged as ASSUMED and not ELICITED because a founder who has not yet registered his workforce with the CNPS cannot state the rate his activity will be classed at - the answer lives with the CNPS, in the world, and I could not look it up."
    date: "2026-07-27"

  # ---------------------------------------------------------------- DEFAULTED
  months_per_year:
    value: 12
    unit: "months"
    prov: DEFAULTED
    source: "Calendar convention. Used to annualise the monthly wage and to convert the elicited receivable and payable months into balances."
    date: "2026-07-27"

  depreciation_method:
    value: "straight_line_no_residual"
    unit: "label"
    prov: DEFAULTED
    source: "IAS 16 permits any systematic allocation; straight line with nil residual value is the default convention where none is stated, and it is the only one consistent with the founder's flat on compte quinze ans. Full year of depreciation in the first production year, no half-year convention, because the grid's period 0 already carries the installation."
    date: "2026-07-27"

  capex_timing:
    value: "all_in_period_zero"
    unit: "label"
    prov: DEFAULTED
    source: "The utterance gives no phasing of the 180 million. It is placed entirely in the construction period, which is the standard convention where a single install cost is quoted and production is stated to begin the following year."
    date: "2026-07-27"

  sales_equal_production:
    value: "yes"
    unit: "label"
    prov: DEFAULTED
    source: "Revenue is recognised on the kernel produced in each annual period. Under IFRS 15 revenue arises on transfer of control at shipment; over an annual grid, with steady-state operation and no stated stock policy for finished goods, production equals sales. The kernel actually sitting in the warehouse awaiting a container is carried in receivables instead - see receivable_months. Splitting production from sales would require a shipment calendar the utterance does not contain."
    date: "2026-07-27"

  tax_base_is_ebit:
    value: "yes"
    unit: "label"
    prov: DEFAULTED
    source: "Standard unlevered convention: NOPAT is EBIT less tax computed on EBIT, so the answer is independent of how the plant is financed. The BIC actually assessed would be on taxable profit after finance costs and after tax depreciation rates that differ between the building and the machinery."
    date: "2026-07-27"

passage: |
  ---------------------------------------------------------------------------------------------
  STEP 0 - WHAT KIND OF BUSINESS THIS IS, AND WHAT THE NATURAL UNITS ARE
  ---------------------------------------------------------------------------------------------
  This is a cashew shelling unit: raw nuts in at one end, white kernel out at the other, shell as the
  by-product. The trade does not think in tonnes of output; it thinks in THROUGHPUT of raw nuts and
  in OUTTURN - kilos of kernel recovered per hundred kilos of raw nuts, what the industry calls the
  kernel outturn ratio, KOR. The founder gives both directly: two thousand tonnes of raw nuts a
  year, twenty-two kilos of kernel per hundred kilos. I keep those as the primary quantities and
  derive everything else from them, rather than starting from a tonnage of kernel.

  Note one friction up front and carry it: the trade does not sell "kernel", it sells GRADES -
  whole white wholes (W240, W320), butts, splits, pieces, scorched - and they price very differently.
  He gives a single 4500 francs a kilo. I take that as a blended realised price across whatever mix
  the line produces. That is the honest reading of his words, but it is a simplification of how the
  product is actually sold, and it is why the price basis question below is the first one I would ask.

  ---------------------------------------------------------------------------------------------
  STEP 1 - THE GRID
  ---------------------------------------------------------------------------------------------
  Sixteen annual periods. t=0 is calendar 2026: the plant is installed, nothing is produced. t=1 to
  t=15 are calendar 2027 to 2041: fifteen production years, which is the life he puts on the
  equipment. Reasoning: he speaks on 27 July 2026 and says he starts next year, so first production
  is 2027; and installation must precede it.

  ---------------------------------------------------------------------------------------------
  STEP 2 - PHYSICAL FLOWS (per production year, t=1..15; all zero at t=0)
  ---------------------------------------------------------------------------------------------
  Raw nuts processed        = 2000 tonnes = 2,000,000 kg
  Kernel recovered          = 2,000,000 x 0.22                     = 440,000 kg   (440 tonnes)
  Shell                     = 2,000,000 x (1 - 0.22) = 2,000,000 x 0.78
                                                                   = 1,560,000 kg (1,560 tonnes)
  Mass balance: 440,000 + 1,560,000 = 2,000,000 kg. Nothing is created or lost - this is the first
  conservation check in the list below.

  ---------------------------------------------------------------------------------------------
  STEP 3 - REVENUE (per production year)
  ---------------------------------------------------------------------------------------------
  Kernel revenue            = 440,000 kg x 4,500 XOF/kg            = 1,980,000,000 XOF
  Shell revenue             = 1,560,000 kg x 0 XOF/kg              =             0 XOF
  Total revenue                                                    = 1,980,000,000 XOF

  The shell is given no value because he gives it none. The question is attached, not the guess.

  There is no export duty in this line and that is not an omission. Cote d'Ivoire taxes exports of
  RAW cashew nuts (droit unique de sortie, 5 percent since the November 2024 ordinance) precisely in
  order NOT to tax exports of processed kernel, which is exempt. He exports kernel. The DUS is nil.
  VAT likewise does not appear: exports are not taxed at output, the investment code suspends VAT on
  the qualifying capital goods during installation, and input VAT elsewhere is recoverable, so over
  an annual grid VAT is cash-neutral.

  Cross-check on the purchase side before leaving revenue: the regulator (Conseil du coton, de
  l'anacarde et du karite) fixes mandatory floor prices for raw nuts - 400 bord champ, 425 magasin
  interieur, 454 magasin usine, 484 magasin portuaire for the current campaign. His 500 francs to the
  cooperatives is above all of them. His raw-material cost is therefore not an optimistic number.

  ---------------------------------------------------------------------------------------------
  STEP 4 - OPERATING COSTS (per production year)
  ---------------------------------------------------------------------------------------------
  (a) Raw nuts
      2,000,000 kg x 500 XOF/kg                                    = 1,000,000,000 XOF

  (b) Gross wages
      60 workers x 80,000 XOF/month x 12 months                    =    57,600,000 XOF
      (80,000 is above the SMIG of 75,000, so the payroll is lawful as described and the social
      contributions are computed on the actual wage, not on a statutory floor.)

  (c) Employer social contributions and payroll taxes - which he does not mention at all, and which
      no employer of sixty people escapes. Per worker per month:
        CNPS family benefits + maternity   5.75% x 70,000 (the branch ceiling BINDS,
                                           since 80,000 > 70,000)                =  4,025
        CNPS work injury                   3.00% x 70,000 (ceiling binds; the statutory
                                           band is 2-5% by sector risk class)     =  2,100
        CNPS employer pension              7.70% x 80,000 (its ceiling, 3,375,000
                                           a month, does not bind)                =  6,160
        -------------------------------------------------------------------------------
        CNPS per worker per month                                                 = 12,285
      Annualised: 12,285 x 60 x 12                                 =     8,845,200 XOF
      Employer payroll TAXES, on gross payroll without ceiling:
        contribution a la charge de l'employeur (local staff) 2.8%
        + taxe d'apprentissage 0.4% + taxe additionnelle FPC 1.2%  = 4.4%
        4.4% x 57,600,000                                          =     2,534,400 XOF
      Total employer charges                                       =    11,379,600 XOF
      Fully loaded labour cost = 57,600,000 + 11,379,600           =    68,979,600 XOF

  (d) Power, water, bags, maintenance - his own figure                120,000,000 XOF

  (e) Non-production payroll (managers, quality control, security)              0 XOF
      Working value zero. Question attached.

  (f) Export logistics                                                          0 XOF
      Working value zero: the 4,500 is taken as netting at the factory gate. Question attached, and
      it is the biggest question in this file.

  (g) Contribution des patentes - the Ivorian business licence tax, a TURNOVER levy. Its turnover
      leg is 0.5% of revenue, i.e. 0.5% x 1,980,000,000 = 9,900,000, but it is capped at 3,000,000,
      and the cap binds. So the charge is 3,000,000 a year - EXCEPT that the investment-code
      exemption covers the patente as well as the profit tax, so it is nil while the relief runs.
      Nil for t=0..5, 3,000,000 for t=6..15.

  Total operating costs
      t = 1..5 : 1,000,000,000 + 57,600,000 + 11,379,600 + 0 + 120,000,000 + 0 + 0
               = 1,188,979,600 XOF
      t = 6..15: the same plus the patente of 3,000,000
               = 1,191,979,600 XOF

  ---------------------------------------------------------------------------------------------
  STEP 5 - EBITDA
  ---------------------------------------------------------------------------------------------
      t = 1..5 : 1,980,000,000 - 1,188,979,600  =  791,020,400 XOF
      t = 6..15: 1,980,000,000 - 1,191,979,600  =  788,020,400 XOF
      t = 0    : 0

  Sanity, in the units the trade uses: 440 tonnes of kernel carry a raw-nut bill of one billion
  francs, so the raw nut is roughly 2,273 francs per kilo of kernel produced against a kernel price
  of 4,500. The gross margin of this business is the outturn. A one-point fall in the outturn, from
  22 to 21 kilos per hundred, would cost twenty tonnes of kernel a year against an unchanged raw-nut
  bill. That is the physical fact this whole model rests on.

  ---------------------------------------------------------------------------------------------
  STEP 6 - CAPITAL AND DEPRECIATION
  ---------------------------------------------------------------------------------------------
  Capex 180,000,000 XOF, all at t=0.
  Depreciation, straight line over fifteen years, nil residual: 180,000,000 / 15 = 12,000,000 a year
  for t=1..15, nil at t=0.
  Net book value rolls 180,000,000 at t=0, falling by 12,000,000 a period, reaching exactly 0 at
  t=15. The plant is fully written off at the horizon, which is why the horizon is fifteen years.
  Note the friction: for tax purposes the building and the shelling machines would carry different
  statutory rates. A single fifteen-year composite life is used because that is what he stated, and
  because the first five years are exempt anyway, so the timing difference has little to bite on.

  ---------------------------------------------------------------------------------------------
  STEP 7 - EBIT
  ---------------------------------------------------------------------------------------------
      t = 1..5 :  791,020,400 - 12,000,000 = 779,020,400 XOF
      t = 6..15:  788,020,400 - 12,000,000 = 776,020,400 XOF
      t = 0    : 0

  ---------------------------------------------------------------------------------------------
  STEP 8 - TAX. THE PART HE IS WRONG ABOUT.
  ---------------------------------------------------------------------------------------------
  What he BELIEVES (a fact about his business): five years of total exemption from the first
  production year, then the normal 25 percent like everyone else.

  What the INSTRUMENT says (a fact about the world). Three sourced steps:
    (1) ZONE. The investment code divides the country into three zones. Zone A is the district of
        Abidjan; Zone B is the chefs-lieux de regions plus Bonoua and Grand-Bassam; Zone C is
        everything else. BOUAKE IS THE CHEF-LIEU OF THE GBEKE REGION. Bouake is Zone B. This matters
        because the relief is not a national headline number - it is zoned, and the headline
        five-year figure is the ZONE A figure.
    (2) CATEGORY. Agro-industrial processing of a local raw material is Category 1, the priority
        category, which receives EXEMPTIONS. Category 2 receives tax credits instead. Shelling
        Ivorian raw nuts is squarely Category 1.
    (3) DURATION. Zone B is a TEN-YEAR zone. For Zone B, Category 1, under the approval regime:
        100 percent exemption from profit tax, business licence tax, property tax, the employer
        contribution on salary and dividend tax for the FIRST FIVE YEARS, and then the same taxes
        remain relieved for a FURTHER FIVE YEARS - at 75 percent for an SME, at a lower percentage
        for a large company.

  So his first five years are right, and his year six is wrong. He does not go back to the full rate
  in 2032; on the instrument's own terms he has five more years of relief after that. He has
  UNDERSTATED his own incentive.

  There is a second, sharper thing sitting underneath. His investment programme is 180,000,000. The
  approval regime asks 200,000,000 from a large company and 50,000,000 from an SME. 180 million is
  below the large-company threshold. So his approval can only have been granted on the SME
  threshold - and an SME, on the definition the approval file itself uses, is an enterprise with
  fewer than two hundred permanent staff AND turnover below one billion francs. He passes the
  headcount test with sixty workers. He fails the turnover test from his very first year, at
  1,980,000,000. That tension does not resolve itself from anything he said, and it is why the
  question about the arrete d'agrement is one of the three I would ask first.

  Because of that, the base case runs HIS schedule, not the instrument's - it is the conservative
  one, and it does not rest on a classification I cannot verify. The instrument's schedule and the
  no-relief downside are both carried as separate, fully checked columns in the trace.

  BASE CASE (his belief): profit tax = 0 for t=0..5; 25% of EBIT for t=6..15.
      t = 6..15: 0.25 x 776,020,400 = 194,005,100 XOF

  ENTITLEMENT CASE (Zone B / Category 1 / SME, as sourced): relief fraction 1.00 for t=0..5, 0.75
  for t=6..10, 0 from t=11.
      t = 6..10: 0.25 x 776,020,400 x (1 - 0.75) = 0.0625 x 776,020,400 =  48,501,275 XOF
      t = 11..15: 0.25 x 776,020,400                                    = 194,005,100 XOF

  NO-RELIEF CASE (the approval fails or is withdrawn): 25% of EBIT from the first production year.
      t = 1..5 : 0.25 x 779,020,400 = 194,755,100 XOF
      t = 6..15: 0.25 x 776,020,400 = 194,005,100 XOF

  The minimum tax. Cote d'Ivoire levies an impot minimum forfaitaire of 0.5 percent of turnover,
  floored at 3,000,000 and capped at 35,000,000. On revenue of 1,980,000,000 that is 9,900,000 a
  year - between the floor and the cap, so neither binds. It is carried as its own row so it can be
  compared. In every taxed year the profit tax of roughly 194 million dwarfs it, so the minimum tax
  never becomes the binding charge and drops out of the cash flow. Whether it survives the
  investment-code exemption in the relieved years is not settled by the sources I could reach; that
  is recorded in the notes rather than guessed at.

  NOPAT = EBIT - profit tax:
      Base case:  t=1..5  779,020,400 ; t=6..15  776,020,400 - 194,005,100 = 582,015,300
      Entitlement: t=1..5 779,020,400 ; t=6..10  776,020,400 -  48,501,275 = 727,519,125 ;
                   t=11..15 582,015,300
      No relief:  t=1..5  779,020,400 - 194,755,100 = 584,265,300 ; t=6..15 582,015,300

  ---------------------------------------------------------------------------------------------
  STEP 9 - WORKING CAPITAL
  ---------------------------------------------------------------------------------------------
  This is where a cashew processor differs from a generic factory, and where the founder said
  nothing at all. The campaign opens in early February and the buying season runs roughly five
  months; he shells for twelve. A plant that holds no raw nuts on 31 December cannot run in January.
  So zero working capital is not a permissible default here - it would contradict his own stated
  throughput.

      Raw nut inventory at each year end
          500,000 kg (a quarter of annual throughput) x 500 XOF/kg   =  250,000,000 XOF
      Trade receivables
          one month of revenue: 1,980,000,000 / 12                   =  165,000,000 XOF
          (this line also absorbs the kernel sitting in the warehouse waiting for a container,
           which is not modelled as separate finished-goods stock)
      Trade payables
          zero months of raw-nut purchases - cash on delivery         =            0 XOF
      Net working capital, t=1..15                                    =  415,000,000 XOF
      Net working capital, t=0                                        =            0 XOF

  The whole call therefore lands in the first production year: change in NWC is 415,000,000 at t=1
  and nil in every other period. It is NOT released at the horizon, because ending the model at
  fifteen years is a statement about the asset's life, not an assertion that the business is
  liquidated and its stock sold off.

  ---------------------------------------------------------------------------------------------
  STEP 10 - FCFF = NOPAT + D&A - change in NWC - capex
  ---------------------------------------------------------------------------------------------
  BASE CASE
      t = 0    :         0 +          0 -           0 - 180,000,000 = -180,000,000
      t = 1    : 779,020,400 + 12,000,000 - 415,000,000 -         0 =  376,020,400
      t = 2..5 : 779,020,400 + 12,000,000 -           0 -         0 =  791,020,400
      t = 6..15: 582,015,300 + 12,000,000 -           0 -         0 =  594,015,300

  Fifteen-year total, undiscounted: 9,300,255,000 XOF against an outlay of 180,000,000.

  ENTITLEMENT CASE differs only from t=6: 727,519,125 + 12,000,000 = 739,519,125 for t=6..10, then
  594,015,300 for t=11..15. Fifteen-year total 10,027,774,125 XOF.

  NO-RELIEF CASE: -180,000,000 at t=0; 181,265,300 at t=1; 596,265,300 for t=2..5; 594,015,300 for
  t=6..15. Fifteen-year total 8,326,479,500 XOF.

  ---------------------------------------------------------------------------------------------
  STEP 11 - WHAT THE NUMBERS SAY, AND WHAT THEY DO NOT
  ---------------------------------------------------------------------------------------------
  The plant pays for itself out of the first production year even after funding its entire working
  capital, and the tax holiday is worth roughly a tenth of the fifteen-year cash flow - the gap
  between the base case and the no-relief case. That is a real benefit, but it is NOT what decided
  this investment, whatever he says: on these inputs the unit is comfortably cash-generative with no
  relief at all. The holiday changes the ranking of the project; it does not create it.

  What would change it is the price basis. If the 4,500 is a delivered price rather than a factory-
  gate price, several hundred million francs a year of logistics sit inside it, and that is a far
  larger number than the entire tax question. This is why the price-basis question outranks
  everything else in the elicitation list.


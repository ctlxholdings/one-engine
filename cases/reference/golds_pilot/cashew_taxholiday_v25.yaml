checks:
  - "trace.raw_nuts_processed == trace.kernel_output + trace.shell_output"
  - "trace.kernel_output == kernel_outturn * trace.raw_nuts_processed"
  - "trace.raw_nuts_processed == raw_nut_throughput_per_year * throughput_ramp_first_year for t >= production_start_index"
  - "trace.raw_nuts_processed[first] == 0"
  - "trace.kernel_revenue == kernel_price * trace.kernel_output"
  - "trace.shell_revenue == shell_revenue_per_kg * trace.shell_output"
  - "trace.revenue == trace.kernel_revenue + trace.shell_revenue"
  - "trace.raw_nut_cost == raw_nut_price * trace.raw_nuts_processed"
  - "trace.gross_wages == workers * monthly_wage * months_per_year for t >= production_start_index"
  - "trace.gross_wages[first] == 0"
  - "trace.payroll_charges == cnps_family_rate * cnps_ceiling_monthly * workers * months_per_year + cnps_work_injury_rate * cnps_ceiling_monthly * workers * months_per_year + cnps_pension_employer_rate * trace.gross_wages + employer_payroll_tax_rate * trace.gross_wages for t >= production_start_index"
  - "trace.payroll_charges[first] == 0"
  - "trace.non_production_payroll == non_production_payroll_per_year for t >= production_start_index"
  - "trace.other_opex == other_opex_per_year for t >= production_start_index"
  - "trace.export_logistics_cost == export_logistics_cost_per_kg * trace.kernel_output"
  - "trace.patente == 0 for t < first_taxed_period_index"
  - "trace.patente == patente_annual for t >= first_taxed_period_index"
  - "trace.opex_total == trace.raw_nut_cost + trace.gross_wages + trace.payroll_charges + trace.non_production_payroll + trace.other_opex + trace.export_logistics_cost + trace.patente"
  - "trace.ebitda == trace.revenue - trace.opex_total"
  - "trace.depreciation == capex_total / asset_life_years for t >= production_start_index"
  - "trace.depreciation[first] == 0"
  - "sum(trace.depreciation) == capex_total"
  - "sum(trace.capex) == capex_total"
  - "trace.capex[first] == capex_total"
  - "trace.book_value[t] == trace.book_value[t-1] + trace.capex[t] - trace.depreciation[t]"
  - "trace.book_value[last] == 0"
  - "trace.book_value[t] >= 0"
  - "trace.ebit == trace.ebitda - trace.depreciation"
  - "trace.imf_reference == imf_rate * trace.revenue"
  - "trace.raw_nut_inventory == raw_nut_stock_kg * raw_nut_price for t >= production_start_index"
  - "trace.raw_nut_inventory[first] == 0"
  - "trace.raw_nut_inventory[t] >= 0"
  - "trace.receivables == receivable_months * trace.revenue / months_per_year"
  - "trace.payables == payable_months * trace.raw_nut_cost / months_per_year"
  - "trace.nwc == trace.raw_nut_inventory + trace.receivables - trace.payables"
  - "trace.nwc[t] >= 0"
  - "cumsum(trace.delta_nwc) == trace.nwc"
  - "sum(trace.delta_nwc) == trace.nwc[last]"
  - "trace.profit_tax == 0 for t < first_taxed_period_index"
  - "trace.profit_tax == statutory_cit_rate * trace.ebit for t >= first_taxed_period_index"
  - "trace.profit_tax >= trace.imf_reference for t >= first_taxed_period_index"
  - "trace.nopat == trace.ebit - trace.profit_tax"
  - "trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex"
  - "trace.code_relief_fraction == 1 for t < first_taxed_period_index"
  - "trace.code_relief_fraction == 0 for t >= code_full_tax_start_index"
  - "sum(trace.code_relief_fraction) == first_taxed_period_index + (code_full_tax_start_index - first_taxed_period_index) * code_partial_relief_rate"
  - "trace.profit_tax_entitlement == statutory_cit_rate * trace.ebit * (1 - trace.code_relief_fraction)"
  - "trace.nopat_entitlement == trace.ebit - trace.profit_tax_entitlement"
  - "trace.fcff_entitlement == trace.nopat_entitlement + trace.depreciation - trace.delta_nwc - trace.capex"
  - "trace.profit_tax_no_relief == statutory_cit_rate * trace.ebit"
  - "trace.nopat_no_relief == trace.ebit - trace.profit_tax_no_relief"
  - "trace.fcff_no_relief == trace.nopat_no_relief + trace.depreciation - trace.delta_nwc - trace.capex"
  - "trace.fcff_entitlement[t] >= trace.fcff[t]"
  - "trace.fcff[t] >= trace.fcff_no_relief[t]"
  - "trace.revenue[t] >= 0"
  - "trace.opex_total[t] >= 0"

notes:
  - finding_founder_is_wrong_about_his_own_relief: >
      The single most consequential thing in this file is that the founder has MISSTATED the relief
      he holds - in his own disfavour. He says five years of total exemption and then the normal
      rate. Bouake is the chef-lieu of the Gbeke region, which places it in ZONE B of the investment
      code, and cashew shelling from local raw material is a CATEGORY 1 (priority) activity. Zone B,
      Category 1, under the approval regime, is a TEN-YEAR benefit: total exemption for five years,
      then the same taxes still relieved at a reduced percentage for five more. He is right about
      years one to five and wrong about year six onwards. This is exactly the class of error an
      internal consistency check cannot catch - the arithmetic ties perfectly around the wrong
      statutory schedule - which is why the instrument's own schedule is carried as its own trace
      column (fcff_entitlement) rather than described in prose.
  - judgment_call_base_case_runs_his_belief_not_the_instrument: >
      The headline fcff runs HIS five-year schedule, not the instrument's ten-year one. Three
      reasons. It is conservative - it grants less relief, not more. It does not depend on a size
      classification I could not verify. And it keeps the base case anchored to what he actually
      told me, so the divergence between the columns is visible rather than absorbed. A reader who
      concludes the instrument governs should read fcff_entitlement as the answer. Both are checked.
  - finding_the_approval_itself_sits_on_a_threshold_tension: >
      His programme is 180 million. The approval regime asks 200 million of a large company and 50
      million of an SME, so an approval at 180 million must have been granted on the SME branch. But
      the SME definition used in the approval file requires turnover below one billion, and this
      unit turns over nearly two billion from its first production year. Either the classification
      was made on the investment programme alone and will be tested later, or something in his file
      differs from what he described. This is not resolvable from the utterance, it is the reason
      the arrete d'agrement question is high materiality, and it is why the no-relief column
      (fcff_no_relief) is carried at all - it is the shape of the downside, not a sensitivity.
  - judgment_call_the_clock_may_already_be_running: >
      He says the exemption runs from the first year of production. The instrument ties the benefit
      period to a date fixed in the approval decision. His own closing remark - that is why I am
      hurrying to start - suggests he half suspects the clock is not waiting for him. Each period of
      slippage converts a fully exempt year into a taxed one. Elicited, with a working value of nil
      slippage so the base case remains his case.
  - simplification_scenarios_vary_only_the_profit_tax: >
      The three columns differ ONLY in the profit-tax line. Everything above EBIT is held at the
      base schedule in all three, including the patente relief and including the employer
      contribution on salary, which the Zone B Category 1 exemption also covers. Charging those
      payroll levies in full in every year and in every column is deliberate: it isolates the
      profit-tax question, which is the one the founder raised, and it is conservative - it slightly
      understates the cash flow of the relieved years in all three columns.
  - simplification_no_finished_goods_inventory: >
      Kernel awaiting a container is real, and it is not modelled as its own stock. Doing so
      properly would require splitting production from sales and valuing the stock at absorbed
      conversion cost, which the utterance does not support. The pipeline is carried in receivables
      instead, which is where the cash actually is. The friction is noted rather than forced.
  - simplification_working_capital_is_not_released_at_the_horizon: >
      The model ends at fifteen years because that is the life he puts on the plant, not because the
      business stops. Nothing is liquidated at t=15, so the 415 million of working capital is not
      recovered in the last period. Direction: this understates the fifteen-year total for a reader
      who does intend to treat the horizon as an exit.
  - simplification_no_replacement_or_overhaul_capex: >
      He puts one flat fifteen-year life on machines, dryers and building together and says
      maintenance is inside his 120 million a year. So no mid-life replacement or major overhaul is
      modelled. A shelling line with cutting, drying, peeling and grading stages would in practice
      need component replacement well inside fifteen years. Direction: capex is understated and the
      later years are flattered.
  - omission_patente_rental_value_leg: >
      Only the turnover leg of the contribution des patentes is modelled, at its statutory cap. The
      second leg, a proportional charge on the rental value of the professional premises, is
      omitted because the assessed rental value of a plant that does not yet exist is not knowable
      from anything said, and it is set by the tax office rather than by the founder. Direction:
      operating cost is understated from the seventh period.
  - unresolved_whether_the_minimum_tax_survives_the_exemption: >
      The impot minimum forfaitaire is carried as trace.imf_reference and is dominated by the profit
      tax in every taxed year, so it never becomes the binding charge in the base case. The
      remaining question is whether it survives the investment-code exemption during the relieved
      years. The code text I could reach describes the exemption as covering the profit tax
      including the minimum tax, but I could not verify that against the operative article of the
      current consolidated instrument. If it does NOT survive, the relieved years carry a charge of
      the size shown in the imf_reference row. Flagged rather than silently resolved.
  - sector_friction_grades_and_the_single_price: >
      Cashew kernel is sold by grade - wholes, butts, splits, pieces, scorched - at materially
      different prices. He gives one figure. It is treated as a blended realised price, which is the
      honest reading, but the split of 440 tonnes across grades is a real operating variable he
      controls (through cutting technique and drying) and that a buyer will price. Kept as a
      described friction rather than forced into a grade schedule that would be invented.
  - sector_friction_the_outturn_is_the_business: >
      With raw nuts at 500 a kilo and 22 percent recovery, the raw nut alone costs about 2,273 francs
      per kilo of kernel sold at 4,500. The entire gross margin of the operation is the outturn ratio
      and the raw-nut price, both of which move with the campaign. The regulator sets mandatory floor
      prices each season and his 500 already sits above every one of them, so the raw-material line
      is at or above the regulated minimum rather than below it. Direction: in a tight campaign the
      purchase price moves up against a kernel price set in a different, dollar-denominated market.
  - excluded_by_construction: >
      No financing, no interest, no debt - the build is unlevered by definition. No discounting and
      no terminal value - the question asked was the cash flow, not the value. No inflation - every
      figure he gave is in current francs and he gave no escalation, so the model runs flat in
      nominal terms, which for a fifteen-year horizon is a material simplification in its own right
      and is flagged here rather than assumed away silently.
  - the_three_questions_to_ask_if_he_will_only_answer_three: >
      Ranked by materiality across the whole elicitation list - (1) is the 4,500 a factory-gate price
      or a delivered one, (2) what does the arrete d'agrement actually say about the start date and
      the year-by-year schedule, (3) will the line really run 2,000 tonnes in its first year. The
      raw-nut stocking policy is a close fourth and moves the first year rather than the shape.

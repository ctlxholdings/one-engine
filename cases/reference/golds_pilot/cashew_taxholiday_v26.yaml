  # ---------- ELICITED: the founder holds these answers ----------
  total_workforce_headcount:
    value: 266.66666666666666
    unit: workers employed
    prov: ELICITED
    question: "Are the sixty workers at eighty thousand your entire workforce, or are they your permanent staff, with seasonal peelers and graders taken on during the processing season on top?"
    range: {low: 60, high: 400}
    materiality: high
    source: "Base case runs on rcn_throughput_t_per_year / tonnes_rcn_per_direct_job = 2000 / 7.5 = 266.67, the headcount a real Ivorian plant of this type actually carries - NOT on the founder's sixty. This is the only place in the model where I override a stated figure, and I do it because sixty is not a cost estimate, it is a claim about physics: sixty workers producing 440 t of peeled, graded, export-packed kernel over 250 operating days is 29.33 kg of finished kernel per worker per day, when a skilled peeler manages 6-8 kg/day at the peeling station alone, before anyone shells, dries, grades or packs. His own capex forecloses the escape route: 180,000,000 XOF cannot buy automatic peeling, so the peeling must be by hand, and by hand it takes hundreds of people. 266.67 is chosen over a bottom-up build of ~368 because it is the lower, sourced, whole-plant figure and therefore the more conservative statement of the problem. His sixty is preserved and costed in trace.labour_cost_as_stated and the gap is materialised."
  processor_subsidy_received_xof_per_kg:
    value: 0
    unit: XOF per kg of exported kernel
    prov: ELICITED
    question: "Are you registered for the State's support of four hundred francs a kilo on exported kernel, and has it actually been paid out to processors in the last two campaigns?"
    range: {low: 0, high: 400}
    materiality: high
    source: "Base case takes zero - the omitting choice, because he never mentions it and because arrears on this scheme are the norm rather than the exception. The rate itself is SOURCED (processor_subsidy_rate_xof_per_kg = 400); what is elicited is whether it reaches him and when."

contract: "v2.6"
id: cashew_taxholiday_bouake_v26
title: "Cashew shelling unit, Bouake (Cote d'Ivoire) - unlevered FCFF over the 15-year life of the plant"
currency: XOF

grid:
  periods: 16
  freq: annual
  why: >
    Sixteen ANNUAL periods: t=0 = 2026, the construction year the founder is standing in
    ("je demarre l'annee prochaine", said in July 2026), and t=1..15 = 2027..2041, the fifteen
    production years he himself puts on the equipment ("sur ce genre d'equipement on compte
    quinze ans"). Three things fix this choice. (1) The asset. Fifteen years is his own stated
    life; ending there makes the horizon exhaust the asset exactly - book value is zero at
    t=last - so no terminal value has to be invented, and the question of whether he re-equips
    in 2042 is a different question he has not answered. (2) The relief. The Zone B / categorie 1
    schedule runs ten years (five full, five at half) and only then reverts to 25%; a horizon
    shorter than eleven periods would never show the normal-tax steady state and would flatter
    the investment, which is precisely the error the founder is already making. (3) The cycle.
    ANNUAL, not monthly, because the operating cycle that governs this business is the cashew
    CAMPAIGN - one buying window per year (opened 9 February 2026, ~5 months) feeding twelve
    months of processing. A monthly grid would be the physically truthful frame for working
    capital, but 180 monthly periods cannot be derived by hand; instead the intra-year campaign
    profile is carried explicitly inside each annual period as average stock, peak stock and
    average residence time (see trace.rcn_avg_stock_t, trace.rcn_peak_stock_t), so the
    seasonality is not lost, only summarised. A reader who thinks the plant should be judged on
    a 10-year horizon (the relief window) or a 20-year one (the building) will get different
    numbers, and should say so.

utterance:
  fr: >
    Je monte une unite de transformation de noix de cajou a Bouake. L'usine me coute cent
    quatre-vingts millions a installer - les machines de decorticage, les sechoirs, le batiment -
    et sur ce genre d'equipement on compte quinze ans. Je demarre l'annee prochaine. Je traiterai
    deux mille tonnes de noix brutes par an, que j'achete aux cooperatives a cinq cents francs le
    kilo. Le rendement, c'est vingt-deux kilos d'amande blanche pour cent kilos de noix brutes -
    le reste, c'est la coque. L'amande, je l'exporte a quatre mille cinq cents francs le kilo.
    J'aurai soixante ouvriers a quatre-vingt mille par mois, et le courant, l'eau, les sacs et
    l'entretien me feront dans les cent vingt millions par an. Ce qui a decide l'investissement,
    c'est l'agrement : j'ai obtenu l'agrement au code des investissements, et il me donne cinq
    ans d'exoneration totale d'impot sur le benefice a compter de la premiere annee de
    production. Apres ces cinq ans, je repasse au taux normal comme tout le monde, vingt-cinq
    pour cent. C'est pour ca que je me depeche de demarrer.
  en: >
    I am setting up a cashew processing unit in Bouake. The plant costs me one hundred and eighty
    million to install - the shelling machines, the dryers, the building - and on that kind of
    equipment you reckon fifteen years. I start next year. I will process two thousand tonnes of
    raw nuts a year, which I buy from the cooperatives at five hundred francs a kilo. The yield
    is twenty-two kilos of white kernel per hundred kilos of raw nuts - the rest is shell. The
    kernel I export at four thousand five hundred francs a kilo. I will have sixty workers at
    eighty thousand a month, and power, water, bags and maintenance will run me around one
    hundred and twenty million a year. What decided the investment was the approval: I obtained
    approval under the investment code, and it gives me five years of complete exemption from
    profit tax starting from the first year of production. After those five years I go back to
    the normal rate like everyone else, twenty-five percent. That is why I am hurrying to start.

inputs:

  # ---------- STATED: the founder's own words ----------
  capex_total_xof:
    value: 180000000
    unit: XOF
    prov: STATED
    source: "\"L'usine me coute cent quatre-vingts millions a installer - les machines de decorticage, les sechoirs, le batiment\""
    date: "2026-07-27"
  asset_life_years:
    value: 15
    unit: years
    prov: STATED
    source: "\"sur ce genre d'equipement on compte quinze ans\""
    date: "2026-07-27"
  rcn_throughput_t_per_year:
    value: 2000
    unit: tonnes of raw cashew nut processed per year
    prov: STATED
    source: "\"Je traiterai deux mille tonnes de noix brutes par an\" - note this is PROCESSED, not purchased; purchases must exceed it by the storage loss"
    date: "2026-07-27"
  rcn_price_xof_per_kg:
    value: 500
    unit: XOF per kg of raw nut
    prov: STATED
    source: "\"que j'achete aux cooperatives a cinq cents francs le kilo\""
    date: "2026-07-27"
  kernel_recovery_fraction:
    value: 0.22
    unit: kg white kernel per kg raw nut
    prov: STATED
    source: "\"vingt-deux kilos d'amande blanche pour cent kilos de noix brutes\". Read as INDUSTRIAL RECOVERY, i.e. total white kernel actually shipped (wholes plus pieces), net of cutting breakage, scorching, peeling fines, grading rejects and kernel drying loss - not as the kernel physically present in the nut. See lab_kor_fraction and process_efficiency."
    date: "2026-07-27"
  kernel_price_xof_per_kg:
    value: 4500
    unit: XOF per kg of white kernel
    prov: STATED
    source: "\"L'amande, je l'exporte a quatre mille cinq cents francs le kilo\""
    date: "2026-07-27"
  workers_stated:
    value: 60
    unit: workers
    prov: STATED
    source: "\"J'aurai soixante ouvriers\""
    date: "2026-07-27"
  worker_wage_monthly_xof:
    value: 80000
    unit: XOF per worker per month, gross
    prov: STATED
    source: "\"soixante ouvriers a quatre-vingt mille par mois\""
    date: "2026-07-27"
  other_opex_xof_per_year:
    value: 120000000
    unit: XOF per year
    prov: STATED
    source: "\"le courant, l'eau, les sacs et l'entretien me feront dans les cent vingt millions par an\". F-210 note, 2026-08-04: 'l'entretien' (maintenance) is read as bundling any RCN-store fumigation/treatment cost implied by rcn_storage_loss_rate_per_month - see that input's source for the order-of-magnitude check. It excludes, on the founder's own wording, export logistics, insurance, certification, security and administration."
    date: "2026-07-27"
  founder_belief_exempt_years:
    value: 5
    unit: years of total exemption believed to run from first production year
    prov: STATED
    source: "\"il me donne cinq ans d'exoneration totale d'impot sur le benefice a compter de la premiere annee de production\" - recorded as a fact about what the founder BELIEVES. The rule says otherwise on both the duration and the anchor: see code_partial_relief_years and relief_start_period_index."
    date: "2026-07-27"
  founder_belief_post_relief_rate:
    value: 0.25
    unit: fraction, believed rate from year 6
    prov: STATED
    source: "\"Apres ces cinq ans, je repasse au taux normal comme tout le monde, vingt-cinq pour cent\" - a belief. The law gives him a further five years at half rate before 25% returns."
    date: "2026-07-27"

  # ---------- SOURCED: facts about the world (annex + own research) ----------
  investment_zone:
    value: B
    unit: label
    prov: SOURCED
    source: "Bouake is a chef-lieu de region and therefore Zone B, not Zone A. fact_id CI-INV-01 / CI-V25-22. The founder never states his zone; it is inferred from the town he names and then verified."
    authority: "Ordonnance n.2018-646 du 1er aout 2018 portant Code des Investissements, art. 8 (zones); CEPICI zone schedule"
    verified: "2026-07-26"
  investment_category:
    value: 1
    unit: label
    prov: SOURCED
    source: "Cashew shelling is agro-industrie, expressly within categorie 1 (\"l'agriculture, l'agro-industrie, la sante et l'hotellerie\"). fact_id CI-INV-02 / CI-V25-23."
    authority: "Ordonnance n.2018-646, art. 5"
    verified: "2026-07-26"
  code_full_exemption_years:
    value: 5
    unit: years at 100% relief
    prov: SOURCED
    source: "Zone B / categorie 1: \"une exoneration d'une duree de dix ans, totale sur les cinq premieres annees\". fact_id CI-INV-03 / CI-V25-24."
    authority: "Ordonnance n.2018-646, arts. 11 (declaration) & 17 (agrement)"
    verified: "2026-07-26"
  code_partial_relief_years:
    value: 5
    unit: years at partial relief
    prov: SOURCED
    source: "\"...de cinquante pour cent sur les cinq annees suivantes\" - the relief runs TEN years, not five. This is the founder's largest legal error and it is in his favour. fact_id CI-INV-03 / CI-V25-25."
    authority: "Ordonnance n.2018-646, arts. 11 & 17"
    verified: "2026-07-26"
  code_partial_relief_rate:
    value: 0.5
    unit: fraction of the profit tax relieved in years six to ten
    prov: SOURCED
    source: "50% for a grande entreprise, 75% for a PME. This business is a grande entreprise because its turnover (1.98 bn) exceeds the PME ceiling of 1 bn, notwithstanding its small headcount - so 50%, giving an effective 12.5%. fact_id CI-INV-03 / CI-V25-26 / CI-V25-29."
    authority: "Ordonnance n.2018-646, arts. 11 & 17; CEPICI, Fiche de renseignements - regime d'agrement a l'investissement, note 2 (PME definition)"
    verified: "2026-07-26"
  relief_covers_imf:
    value: true
    unit: boolean
    prov: SOURCED
    source: "\"y compris l'impot minimum forfaitaire\" - express. Strictly zero profit tax in the fully exempt years is legally correct; the IMF does not claw anything back. fact_id CI-INV-04."
    authority: "Ordonnance n.2018-646, arts. 11 & 17"
    verified: "2026-07-26"
  agrement_threshold_large_company:
    value: 200000000
    unit: XOF of investment, HT, excluding working capital
    prov: SOURCED
    source: "Threshold for a grande entreprise to take the AGREMENT route; PME threshold is 50,000,000. Below it the investor falls to the regime de DECLARATION, whose advantages are restricted to the exploitation phase (art. 10) - i.e. the profit-tax holiday survives but the investment-phase customs/VAT exemption on the equipment does not. fact_id CI-INV-05 / CI-V25-27."
    authority: "Ordonnance n.2018-646, arts. 1(m), 13, 10"
    verified: "2026-07-26"
  pme_turnover_ceiling:
    value: 1000000000
    unit: XOF of annual turnover
    prov: SOURCED
    source: "A PME is an enterprise with fewer than 200 employees AND turnover at or below 1 bn. This plant fails the second limb. fact_id CI-V25-29."
    authority: "CEPICI, Fiche de renseignements - regime d'agrement a l'investissement, note 2"
    verified: "2026-07-27"
  rni_threshold_turnover:
    value: 500000000
    unit: XOF of annual turnover TTC
    prov: SOURCED
    source: "Above 500,000,001 XOF TTC the taxpayer is in the reel normal d'imposition. At 1.98 bn this business is squarely RNI - not TEE, not microentreprise, not RSI - so BIC/IS and the IMF are the operative taxes. fact_id CI-TAX-05 / CI-V25-49."
    authority: "Code general des impots, art. 73 and the regimes d'imposition schedule; DGI"
    verified: "2026-07-26"
  is_rate:
    value: 0.25
    unit: fraction of taxable profit
    prov: SOURCED
    source: "General BIC/IS rate, identical for personnes physiques and morales. The founder's \"vingt-cinq pour cent\" is right about the rate and wrong only about when it starts. fact_id CI-TAX-01 / CI-V25-16."
    authority: "DGI, Le systeme fiscal ivoirien; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income, https://taxsummaries.pwc.com/ivory-coast/corporate/taxes-on-corporate-income"
    verified: "2026-07-26"
  imf_rate:
    value: 0.005
    unit: fraction of turnover TTC
    prov: SOURCED
    source: "Impot minimum forfaitaire, substituted en lieu et place of the BIC where it is higher. fact_id CI-TAX-02 / CI-V25-17."
    authority: "DGI; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income"
    verified: "2026-07-26"
  imf_floor:
    value: 3000000
    unit: XOF per year
    prov: SOURCED
    source: "Floor nested inside the IMF computation. fact_id CI-TAX-02 / CI-V25-18."
    authority: "DGI; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income"
    verified: "2026-07-26"
  imf_cap:
    value: 35000000
    unit: XOF per year
    prov: SOURCED
    source: "Cap nested inside the IMF computation. fact_id CI-TAX-02 / CI-V25-19."
    authority: "DGI; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income"
    verified: "2026-07-26"
  patente_ca_rate:
    value: 0.005
    unit: fraction of turnover
    prov: SOURCED
    source: "Droit sur le chiffre d'affaires of the contribution des patentes. fact_id CI-TAX-07 / CI-V25-20."
    authority: "Code general des impots, contribution des patentes; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Other taxes, https://taxsummaries.pwc.com/ivory-coast/corporate/other-taxes"
    verified: "2026-07-26"
  patente_ca_cap:
    value: 3000000
    unit: XOF per year
    prov: SOURCED
    source: "Cap on the droit sur CA in the turnover band above 1 bn (the band this plant sits in; the 1,300,000 cap belongs to the 500m-1bn band). fact_id CI-V25-21 / CI-V25-53."
    authority: "Contribution des patentes, plafonnement du droit sur le chiffre d'affaires by turnover band; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Other taxes"
    verified: "2026-07-26"
  patente_vl_rate:
    value: 0.185
    unit: fraction of annual rental value
    prov: SOURCED
    source: "Droit sur la valeur locative, 18.5% (16% in rural zones). fact_id CI-TAX-07 / CI-V25-54."
    authority: "Code general des impots, contribution des patentes; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Other taxes"
    verified: "2026-07-26"
  tse_rate:
    value: 0.001
    unit: fraction of turnover HT
    prov: SOURCED
    source: "Taxe speciale d'equipement, 0.1% of turnover, paid monthly. Not in the investment-code exemption list, so it is charged in every period including the holiday. fact_id CI-V25-55."
    authority: "PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Other taxes, https://taxsummaries.pwc.com/ivory-coast/corporate/other-taxes"
    verified: "2026-07-26"
  dus_rate_on_kernel_exports:
    value: 0
    unit: fraction of export value
    prov: SOURCED
    source: "The droit unique de sortie on cashew applies ONLY to raw nut in shell; processed kernel is exempt. This is the whole fiscal point of shelling in-country and it works in the founder's favour; he does not mention it. fact_id CI-SEC-01 / CI-V25-36."
    authority: "Ordonnance n.2024-993 (DUS anacarde); Ministere des Finances et du Budget, coverage of the ratification"
    verified: "2026-07-26"
  cnps_pension_employer_rate:
    value: 0.077
    unit: fraction of gross salary
    prov: SOURCED
    source: "Retraite, employer share 7.70%; ceiling 3,375,000 XOF/month, not binding at an 80,000 wage. fact_id CI-V25-32 / CI-TAX-08."
    authority: "CLEISS, Le regime ivoirien de securite sociale - les cotisations, situation au 1er janvier 2025, https://www.cleiss.fr/docs/cotisations/cotedivoire.html"
    verified: "2026-07-27"
  cnps_family_rate:
    value: 0.0575
    unit: fraction of capped monthly wage
    prov: SOURCED
    source: "Prestations familiales 5% + maternite 0.75%, employer only, on the capped base. fact_id CI-V25-30."
    authority: "CLEISS, Le regime ivoirien de securite sociale - les cotisations, 1er janvier 2025"
    verified: "2026-07-27"
  cnps_ceiling_monthly:
    value: 70000
    unit: XOF per worker per month
    prov: SOURCED
    source: "Monthly ceiling for prestations familiales, maternite and accidents du travail. Note it is BELOW the 80,000 wage, so the capped base is 70,000, not 80,000. fact_id CI-V25-31 / CI-TAX-08."
    authority: "CLEISS, Le regime ivoirien de securite sociale - les cotisations, 1er janvier 2025"
    verified: "2026-07-27"
  employer_payroll_tax_rate:
    value: 0.044
    unit: fraction of gross payroll
    prov: SOURCED
    source: "Contribution a la charge de l'employeur 2.8% (local staff) + taxe d'apprentissage 0.4% + taxe a la formation professionnelle continue 1.2% = 4.4%. fact_id CI-V25-35 / CI-TAX-08. Charged in every period here (see notes) even though the code exempts the 2.8% limb during the relief years - the conservative treatment."
    authority: "PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Other taxes; FDFP"
    verified: "2026-07-27"
  smig_monthly:
    value: 75000
    unit: XOF per month
    prov: SOURCED
    source: "Legal minimum wage since 1 January 2023, still in force. The founder's 80,000 clears it by 5,000 - his wage is legal, but only just, and it leaves no room for a statutory uplift. fact_id CI-V25-09 / CI-TAX-09."
    authority: "Decret n.2022-986 du 21 decembre 2022"
    verified: "2026-07-27"
  vat_standard_rate:
    value: 0.18
    unit: fraction
    prov: SOURCED
    source: "Standard VAT. Exports of kernel are zero-rated, so output VAT is nil and input VAT on power, bags and maintenance accumulates as a credit against the DGI. fact_id CI-V25-39 / CI-TAX-10."
    authority: "Code general des impots; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Other taxes"
    verified: "2026-07-27"
  cca_floor_price_magasin_usine:
    value: 454
    unit: XOF per kg of raw nut, delivered to the factory store
    prov: SOURCED
    source: "Mandatory floor price magasin-usine for the campaign announced 17 February 2026 (bord-champ minimum 400). The founder's 500 sits above the floor and inside the 450-500 delivered band, so his purchase price is the one number in his plan that benchmarks cleanly. fact_id CI-V25-37 / CI-SEC-02."
    authority: "Conseil du coton, de l'anacarde et du karite (CCA), prix planchers obligatoires, campagne 2026"
    verified: "2026-07-27"
  campaign_window_months:
    value: 5
    unit: months per year in which raw nut can be bought
    prov: SOURCED
    source: "The 2026 campaign opened 9 February, with 9 February to 15 March reserved for local processors. Raw nut is a single-harvest crop: a plant running twelve months must buy its whole year's feed inside this window and store it. This one fact generates the entire working-capital and storage-loss structure of the model. fact_id CI-V25-38."
    authority: "Conseil du coton, de l'anacarde et du karite (CCA), ouverture de la campagne 2026, 9 fevrier 2026"
    verified: "2026-07-27"
  lab_kor_fraction:
    value: 0.265
    unit: kg of white kernel per kg of raw nut, laboratory cut-test
    prov: SOURCED
    source: "Ivorian lab KOR 46-48 lbs per 80 kg bag, i.e. 26-27%; 0.265 is the midpoint. This is what is PHYSICALLY IN the nut; the founder's 22% is what comes OUT of the factory. fact_id CI-SEC-04."
    authority: "World Bank ICR (Cote d'Ivoire cashew); cashew trade references"
    verified: "2026-07-26"
  shell_fraction_of_rcn:
    value: 0.66
    unit: kg shell per kg raw nut
    prov: SOURCED
    source: "Shell removed is 640-720 g per kg of raw nut; 0.66 sits at the lower-middle of that band, chosen so the six-stream balance closes at exactly 1.000 with defensible values for the other five. CNSL is 18-26% of the SHELL, i.e. a sub-fraction of this stream, not an additional one."
    authority: "Agriculture.Institute, Cashew Nut Processing - From Raw Nut to Edible Kernel, https://agriculture.institute/post-harvest-mgt-value-addition/cashew-nut-processing-edible-kernel/ ; UNIDO, Cashew Nut Processing manual - the basics, https://www.unido.org/sites/default/files/2013-07/Cashew_nuts_final_presentation_PP_0.pdf"
    verified: "2026-07-27"
  manual_peeling_kg_per_person_day:
    value: 7
    unit: kg of kernel peeled per person per day
    prov: SOURCED
    source: "Skilled labour peels 6-8 kg of kernel per day; 7 is the midpoint. Peeling is the labour bottleneck of a semi-mechanised line and is what makes the founder's headcount impossible."
    authority: "Agriculture.Institute / cashewplus.com cashew processing references (manual peeling 6-8 kg/person/day; manual grading 20-50 kg/person/day; pneumatic peelers to 300 kg/hour)"
    verified: "2026-07-27"
  tonnes_rcn_per_direct_job:
    value: 7.5
    unit: tonnes of annual raw-nut capacity per direct job
    prov: SOURCED
    source: "ECOCAJOU, Odienne: 15,000 t/year of raw nut capacity, 2,000 direct jobs at full regime (840 employed at inauguration). 15,000/2,000 = 7.5. A real, contemporary, Ivorian plant - the best available benchmark for how many people a cashew line of this type actually needs."
    authority: "AIP (Agence Ivoirienne de Presse), 'La capacite de transformation de l'anacarde s'accroit de 15 000 tonnes a Odienne', inauguration 19 June 2024, https://www.aip.ci/74850/cote-divoire-aip-la-capacite-de-transformation-de-lanacarde-saccroit-de-15-000-tonnes-a-odienne/"
    verified: "2026-07-27"
  capex_benchmark_low_xof_per_t:
    value: 250000
    unit: XOF of capex per tonne of annual capacity
    prov: SOURCED
    source: "Observed Ivorian range 250,000-833,000 XOF per tonne of annual capacity (Toumodi 250k, Kpouebo 401k, Attinguie 533k, Boundiali 833k); 250,000 is the CHEAPEST point observed. ECOCAJOU Odienne independently gives 10.2 bn for 15,000 t = 680,000/t. Sub-scale lines cost MORE per tonne, not less. fact_id CI-SEC-05."
    authority: "Ecofin / AgriTech reporting on Ivorian cashew units; AIP on ECOCAJOU Odienne (10.2 bn FCFA for 15,000 t)"
    verified: "2026-07-26"
  kernel_rcn_price_ratio_working_high:
    value: 6
    unit: ratio of kernel price to raw-nut price
    prov: SOURCED
    source: "The working kernel:RCN price ratio in the trade is 5-6x; Vietnamese WW320 FOB was USD 7.2-7.5/kg at Dec-2025 and African origin trades at a DISCOUNT to Vietnam, not a premium. fact_id CI-SEC-06."
    authority: "Cashew trade quotes / African Cashew Alliance market reporting"
    verified: "2026-07-26"
  processor_subsidy_rate_xof_per_kg:
    value: 400
    unit: XOF per kg of exported kernel
    prov: SOURCED
    source: "State support to processors of 400 FCFA per kg of exported kernel, explicitly described as the official competitiveness gap against Vietnam. Its existence is itself evidence that Ivorian shelling does not clear on unsubsidised prices. fact_id CI-SEC-03. Whether THIS founder receives it is a separate, elicited question."
    authority: "Ivorian cashew sector reporting (CCA / Conseil coton-anacarde processor support scheme)"
    verified: "2026-07-26"
  rcn_bulk_density_kg_per_m3:
    value: 600
    unit: kg per cubic metre, loose
    prov: SOURCED
    source: "Measured bulk density of raw cashew nut 592-626 kg/m3 over 5-9% moisture; 600 is the working value. Used to size the store the campaign forces him to build."
    authority: "Physical properties of raw cashew nut, Journal of Agricultural Engineering Research / Taylor & Francis, Physical, morphological and mechanical properties of raw and steamed cashew nuts, https://www.tandfonline.com/doi/full/10.1080/10942912.2024.2304271"
    verified: "2026-07-27"
  container_payload_t_kernel:
    value: 15.6
    unit: tonnes of kernel per 20-foot container
    prov: SOURCED
    source: "Kernel ships in 22.68 kg (50 lb) vacuum cartons, ~700 cartons per 20-foot container, 15.5-15.7 t loaded. Used for the cumulative logistics test."
    authority: "Cashew Export Promotion Council of India, packing standards (11.34 kg tins, 2 per 22.68 kg carton); trade loading practice ~700 cartons per 20ft"
    verified: "2026-07-27"
  export_distance_km_roundtrip:
    value: 720
    unit: km per round trip, factory to Abidjan port and back
    prov: SOURCED

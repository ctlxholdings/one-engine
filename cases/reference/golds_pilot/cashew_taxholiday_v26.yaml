    value: 1
    unit: fraction of input VAT actually recovered
    prov: ELICITED
    question: "Of the VAT credits you have claimed, have you ever had the DGI refuse or write down the amount, rather than simply pay it late?"
    range: {low: 0, high: 1}
    materiality: medium
    source: "Base case 1.0 - full recovery, the omitting choice. Exports are zero-rated, so there is no output VAT to absorb the input VAT on power, bags and maintenance; the credit must be refunded in cash or it becomes a permanent cost. F-214 correction, 2026-08-04: the question previously also asked 'how long did that refund take' (timing/lag), but vat_credit_recovery_fraction is a completeness fraction only (0 to 1) - no working-capital line in this file models a VAT-refund delay, unlike receivable_days for trade receivables, so a timing answer had nowhere to land and would have silently been discarded. The question is narrowed to the half it can actually feed: whether the credit is eventually recovered in full, not when. Refund lags are the standard complaint of Ivorian exporters, but modelling that delay would require a new working-capital mechanism (a vat_refund_lag_days line alongside a vat_receivable stock) that does not exist here and is not added by this fix; if it is added later, that is the place for the timing half of the original question to return."

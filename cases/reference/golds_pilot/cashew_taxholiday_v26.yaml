    source: "Base case zero, matching his words - this is his STATED omission, an explicit belief-vs-physics pair of the same kind as founder_belief_exempt_years next to code_full_exemption_years elsewhere in this file: what he implies (nothing set aside) is a fact about his plan, kept as the base case even though it is not what the physics argues. F-213 correction, 2026-08-04: the ELICIT range itself was wrong - a floor of 0 XOF is what the original range asserted was the low end of the physically plausible outcomes, but STEP 4's own machine-hour arithmetic (29,833 hours over 15 years) makes a true zero-spend outcome physically unavailable: at least one boiler retube AND one sheller rebuild are required, not one or the other, so the old 36,000,000 ceiling may also have undercounted. No cashew-specific overhaul-cost benchmark exists to price either bound precisely (order-of-magnitude only, a supplied prior, matching the treatment already used for testa_fraction_of_rcn and rcn_storage_loss_rate_per_month before their own sourcing): the floor is raised to 8,000,000 (order of magnitude for a boiler retube alone) and the ceiling to 60,000,000 (room for both named items). The base-case VALUE stays at 0 because it still records what the founder said, not what the range now argues is physically likely; a reader who wants the physically-argued case should substitute a value inside the corrected range and re-run, exactly as with total_workforce_headcount. Zero is what he said; it is unlikely to be what happens."

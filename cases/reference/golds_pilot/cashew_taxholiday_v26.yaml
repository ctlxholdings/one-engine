    source: "Base case is set equal to the peak stock the campaign calendar forces on him, so the check binds exactly and any smaller answer breaks it. He has not costed a store: the peak needs about 1,667 m2 of gross covered floor, a building of roughly 60 x 30 m, and that is before the process hall, the boiler, the dryers and the packing room. If the honest answer is 200 t he cannot buy a year's feed in the campaign at all and the 2,000 t plan collapses to whatever he can store."

passage: >
  STEP 0 - WHO IS THIS TAXPAYER, AND UNDER WHICH RULE. Before any arithmetic, three
  determinations, because the founder gets two of them wrong and they change the answer more
  than any operating assumption.

  (i) REGIME. Turnover is 440 t of kernel at 4,500 XOF/kg = 1,980,000,000 XOF. That is far above
  the 500,000,001 XOF TTC entry to the reel normal, so this is an RNI taxpayer: BIC/IS at 25%,
  with the impot minimum forfaitaire at 0.5% of turnover substituting where it is higher. It is
  not a TEE and not a microentreprise; those bands stop at 50 m and 200 m.

  (ii) SIZE. 1.98 bn also exceeds the 1 bn PME turnover ceiling. Sixty workers - or even 267 -
  would satisfy the headcount limb of the PME test, but the turnover limb fails, so this is a
  GRANDE ENTREPRISE. That matters because the second half of the investment-code relief is 50%
  for a large company and 75% for a PME.

  (iii) RELIEF. Bouake is a chef-lieu de region, therefore Zone B. Cashew shelling is
  agro-industrie, therefore categorie 1. Zone B / categorie 1 gives "une exoneration d'une duree
  de DIX ans, totale sur les cinq premieres annees, de cinquante pour cent sur les cinq annees
  suivantes". The founder says five years and then straight back to 25%. He is WRONG, and wrong
  in his own favour: he has five further years at an effective 12.5% that he is not counting.
  The relief expressly covers the IMF, so zero really means zero in the exempt years. Against
  that, two things cut the other way. First, he believes the clock starts at first production;
  the code anchors it to achevement des travaux / the certificat d'agrement a l'exploitation,
  and on the conservative reading adopted here it starts in the construction year, so one full
  exempt year is spent before a franc of profit exists and only four production years are
  tax-free. Second, and more seriously, his 180,000,000 of capex is BELOW the 200,000,000
  threshold a grande entreprise must clear to take the agrement route at all - so the agrement
  he says he has obtained may in fact be a regime de declaration. The good news is that the
  exploitation-phase exemption schedule is the same under both (arts. 11 and 17); what he would
  lose is the investment-phase duty and VAT exemption on the equipment. That risk is recorded,
  not modelled.

  STEP 1 - THE TRANSFORMATION, CLOSED. The founder gives a ratio and calls the remainder shell:
  "vingt-deux kilos d'amande blanche pour cent kilos de noix brutes - le reste, c'est la coque".
  A ratio is not a balance. Per 100 kg of raw nut delivered, the six streams are: white kernel
  shipped 22.00 kg; shell 66.00 kg; testa stripped at peeling 0.75 kg (SEC-V26-05 midpoint,
  corrected 2026-08-04 from an earlier 1.60 kg that sat 1.6-3.2x above that band's top, F-209);
  kernel process losses (scorched, stained and undersized kernel rejected at grading, plus cutting
  and peeling fines) 2.60 kg; cleaning rejects (foreign matter, dust, immature and void nuts)
  2.00 kg; net water evaporated 6.65 kg, the residual that absorbed the testa correction and still
  sits inside SEC-V26-05's 4-8% moisture band. They sum to exactly 100.00. So "le reste, c'est la coque" overstates the
  shell by 12 kg in every 100: the actual shell stream is 66%, not 78%, and the missing 12% is
  water, dirt, skin and broken kernel. On 2,000 t/year that is 1,320 t of shell, not 1,560 t -
  a 240 t/year error in a stream he must physically move off the site or burn.
  What is his 22% NET OF? The Ivorian laboratory cut-test KOR is 26-27%; take 26.5%. His 22% is
  22.0/26.5 = 83.02% of what is physically in the nut. So the ratio is net of cutting breakage,
  scorching, peeling loss, grading rejects and kernel drying-down - roughly one kernel in six
  never reaches a carton. This is the correct industrial figure and he is right to use it; the
  point is that it silently discards 78 kg of matter per 100, and 66 of those 78 have value.

  STEP 2 - THE STOCK, AND WHAT IT LOSES. Raw cashew is a single-harvest crop. The 2026 campaign
  opened on 9 February with 9 February to 15 March reserved for local processors; the buying
  window is about five months. A plant that processes twelve months must buy twelve months of
  feed in five and store the difference. Rolling the year month by month at 400 t/month of
  purchases against 166.667 t/month of consumption, with a two-month bridging stock at each end,
  gives month-end stocks of 166.7, 400, 633.3, 866.7, 1100, 1333.3, 1166.7, 1000, 833.3, 666.7,
  500 and 333.3 t. Mean 750 t; peak 1,333.3 t at the end of June; average residence 4.5 months.
  These three numbers do all the work below.
  Loss. The stock leaks - Plodia and Cryptolestes through the stem end, rodents, mould, handling.
  The rate is applied to the QUANTITY AT RISK, which is the 750 t average, not the 2,000 t
  throughput and not the 1,333 t peak: 750 t x 0.25%/month x 12 months = 22.5 t/year in a steady
  year, and 687.5 t x 0.03 = 20.625 t in the eleven-month first year. Deliberately excluded from
  this rate is drying-down: water leaving the nut raises KOR and destroys no kernel, so charging
  it as loss would double-count against the moisture stream in Step 1.
  Consequence: he must BUY more than he processes. In a steady year, purchases = 2,000 processed
  + 22.5 lost + nil net stock change = 2,022.5 t, costing 1,011,250,000 XOF. In the first year he
  must additionally BUILD the 333.333 t bridging stock, so purchases are 1,833.333 + 20.625 +
  333.333 = 2,187.292 t. In the final year he runs the store down and buys 1,689.167 t. Over the
  horizon: 30,168.958 t bought, 29,833.333 t processed, 335.625 t lost, closing at zero.
  Two other stocks. Finished kernel: fourteen days of production, about one container in build
  and one awaiting documents, carried at cash production cost; its own loss rate is taken as ZERO
  and that is a claim, not silence - kernel is vacuum-packed under CO2 in sealed 22.68 kg cartons
  and turns over in a fortnight. Shell: ZERO stock carried, because the base case sells it for
  nothing and it leaves continuously as boiler fuel or waste; if he sells it, a stock and a loss
  rate both appear.

  STEP 3 - DOES THE CLAIMED OUTPUT FIT THE PLANT? Take each resource in its own units.
  TIME. 365 days less 52 Sundays less 13 jours feries = 300 scheduled days. Availability 0.8333 -
  one scheduled day in six lost to CIE load-shedding, water cuts, boiler and dryer servicing,
  blade changes and illness - gives 250 effective processing days. 2,000 t over 250 days is
  8,000 kg of raw nut a day, or 1,000 kg an hour on a single 8-hour shift. That is a substantial
  but ordinary line rate; the plant is not being asked to do anything exotic per hour.
  PEOPLE. This is where it fails. 250 days at 8,000 kg/day yields 1,760 kg of finished kernel a
  day. Divided over sixty workers that is 29.33 kg of export-graded kernel per worker per day.
  A skilled hand-peeler manages 6-8 kg/day at the peeling bench alone - and the same sixty people
  would still have to clean, calibrate, steam, cut, dry, peel, grade, weigh and pack. The claimed
  output is roughly four times what sixty people could do if every one of them peeled and nobody
  did anything else. The escape route would be automatic peeling (pneumatic peelers run to
  300 kg/hour), but automatic peeling costs far more than the whole 180,000,000 he has budgeted,
  so his own capex figure forecloses it. The benchmark confirms the arithmetic from the other
  side: ECOCAJOU at Odienne carries 2,000 direct jobs on 15,000 t of capacity - 7.5 t per job -
  which puts a 2,000 t line at 266.67 people, four and a half times his sixty. THIS IS A FINDING
  ABOUT THE BUSINESS, NOT A ROUNDING. The base case is therefore costed at 266.67 workers; his
  sixty is preserved, costed and differenced in trace.labour_cost_as_stated and
  trace.labour_cost_gap, and trace.jobs_shortfall carries the missing 206.67 people explicitly.
  SPACE. The store must hold the 1,333.3 t June peak. At 600 kg/m3 loose, 80% packing efficiency
  in 80 kg jute bags, 2.5 m of palletised stack and two-thirds floor utilisation after aisles,
  that is 800 kg per gross m2, so 1,666.67 m2 of covered floor - a shed of about 60 x 30 m,
  before the process hall, boiler, dryers and packing room. Nothing in "les machines de
  decorticage, les sechoirs, le batiment" at 180,000,000 pays for that.
  MONEY (as a physical constraint). 2,022.5 t at 500 XOF/kg is 1,011,250,000 XOF of nut, of which
  essentially all must be paid cash inside a five-month window, because cooperatives do not lend.
  That is 5.6 times his entire fixed investment, and he does not mention it.

  STEP 4 - CUMULATIVE TESTS AGAINST THE WORLD. Over the sixteen periods the derivation implies:
  29,833.33 t of nut processed; 6,563.33 t of kernel shipped; 19,690.0 t of shell produced;
  335.625 t lost in store; 3,729.17 operating days; 29,833.33 machine-hours on the cutting,
  drying and steam plant; and 420.73 twenty-foot containers exported, which at 720 km round trip
  to Abidjan is roughly 302,900 truck-km of outbound haulage. F-212, 2026-08-04: this haulage is
  now costed - see trace.export_logistics_cost_xof - at 13,464,000 XOF/yr in a steady year
  (440 t x 720 km x 42.5 XOF/t-km, SEC-V26-13 midpoint), inside the audit's own 8-19 Mn XOF/yr
  estimate; it was self-disclosed as DEFERRED and uncosted before this fix. The machine-hours
  figure is the one that bites: 29,833 hours is a full industrial life for cashew cutting and
  peeling equipment, and reaching the end of year 15 on the original plant with zero replacement
  capex - which is what "on compte quinze ans" plus a flat 120,000,000 of maintenance asserts -
  requires at least one boiler retube and one sheller rebuild that are not in the budget.

  STEP 5 - THE INCOME LADDER, PER PERIOD. t=0 (2026) is construction: capex 180,000,000, no
  revenue, no payroll, FCFF = -180,000,000. t=1 (2027) is eleven-twelfths of a year because the
  store starts empty and the campaign does not open until 9 February. t=2..15 are full years.
  REVENUE. Kernel = processed x 0.22. Steady year: 2,000 x 0.22 = 440 t at 4,500,000 XOF/t =
  1,980,000,000. First year: 1,833.333 x 0.22 = 403.333 t = 1,815,000,000. Shell revenue nil and
  subsidy nil in the base case, both elicited. No DUS is charged: the export duty on cashew falls
  on raw nut in shell only and kernel is exempt - the single largest fiscal advantage of shelling
  in-country, and he never mentions it.
  RAW NUT EXPENSE. Accrual, so the charge is nut CONSUMED (processed + storage loss), not nut
  bought; the difference is inventory and flows through working capital. Steady year 2,022.5 t x
  500,000 = 1,011,250,000. First year 1,853.958 t x 500,000 = 926,979,166.67.
  LABOUR. 266.6667 x 80,000 x 12 = 256,000,000 gross. CNPS retraite 7.7% on gross = 19,712,000.
  The capped base is 266.6667 x 70,000 x 12 = 224,000,000 - note the 70,000 ceiling bites below
  the 80,000 wage - giving prestations familiales and maternite at 5.75% = 12,880,000 and
  accidents du travail at 5% = 11,200,000. Employer payroll taxes 4.4% on gross = 11,264,000.
  Total 311,056,000. At the founder's sixty the same build gives 69,987,600, so his labour line
  understates by 241,068,400 a year - and even his own sixty-worker figure understates itself by
  21.5%, because he quotes gross wages and forgets that CNPS and the payroll taxes ride on top.
  OTHER OPEX. 120,000,000 as stated, flat, including the first year. Of the founder's four cost
  estimates this is the only one that benchmarks plausibly: 60,000 XOF per tonne of nut, with
  shell firing the boiler so thermal energy is nearly free. It excludes, on his own wording,
  insurance, certification, security and administration.
  EXPORT LOGISTICS (F-212, 2026-08-04). STEP 4 computed the haulage volume - 420.73
  containers/yr, 302,900 truck-km/yr at 720 km round trip - but left it uncosted, self-disclosed
  as DEFERRED. Costed here at trace.kernel_t x export_distance_km_roundtrip x
  export_logistics_rate_xof_per_tonne_km (SEC-V26-13 midpoint, 42.5 XOF/tonne-km): steady year
  440 t x 720 km x 42.5 = 13,464,000; first year 403.333 t x 720 km x 42.5 = 12,342,000. A new
  expense line, not folded into other_opex, because "le courant, l'eau, les sacs et l'entretien"
  does not reach outbound trucking.
  OTHER TAXES. Patente droit sur CA = 0.5% of 1,980,000,000 = 9,900,000, capped at 3,000,000 in
  the above-1bn band; valeur locative nil pending assessment. Patente is inside the investment
  code exemption, so it is nil in t=0..4, half (1,500,000) in t=5..9 and full (3,000,000) from
  t=10. The taxe speciale d'equipement at 0.1% of turnover is NOT in the exemption list and is
  charged throughout: 1,815,000 in the first year, 1,980,000 thereafter.
  EBITDA. Steady exempt year: 1,980,000,000 - 1,011,250,000 - 311,056,000 - 120,000,000 -
  1,980,000 - 13,464,000 = 522,250,000. First year: 442,807,833.33. Half-relief years
  520,750,000; full-rate years 519,250,000.
  DEPRECIATION. 180,000,000 straight line over the founder's own fifteen years = 12,000,000 a
  year from t=1, book value reaching exactly zero at t=15.
  EBIT. 510,250,000 in a steady exempt year; 430,807,833.33 in the first; 508,750,000 in
  t=5..9; 507,250,000 from t=10.
  TAX. Effective rate = 25% x (1 - relief). Relief is 1.0 in t=0..4, 0.5 in t=5..9, 0 from t=10,
  so the rate array is nought for five periods, 12.5% for five and 25% for six. Tax is
  63,593,750 in each of t=5..9 and 126,812,500 in each of t=10..15. The IMF is computed but never
  binds: 0.5% of 1,980,000,000 is 9,900,000, inside the 3 m floor and 35 m cap, against a gross
  BIC of 127,562,500 - so max(BIC, IMF) is always the BIC, and in the exempt years the relief
  covers the IMF anyway. That margin is real but not structural - see the price-pair note below
  (F-215) for how close the model's own flagged kernel-price uncertainty comes to closing it.
  Note what the holiday costs him: the depreciation shield is worth nothing in years where the
  rate is zero, so 48,000,000 of allowances are consumed against exempt profit.
  NOPAT. 430,807,833.33 (t=1); 510,250,000 (t=2..4); 445,156,250 (t=5..9); 380,437,500 (t=10..15).

  STEP 6 - WORKING CAPITAL. Four components, all at period end. Raw nut inventory: 333.333 t x
  500,000 = 166,666,666.67, held t=1..14, released at t=15. Finished kernel: cash production cost
  x 14/365, about 55.4 m in a steady year. Receivables: revenue x 30/365 = 162,739,726.03 in a
  steady year. Payables: (labour + other opex) x 30/365 = 35,429,260.27; nothing on raw nut,
  because the cooperatives are paid cash. Net working capital settles at about 349.4 m and is
  released in full at t=15 as the operation reaches the end of the asset life. The shape is what
  matters: 332,574,125.11 of it is absorbed in the FIRST production year, which is 1.85 times the
  entire fixed investment, and it is absorbed in the same five months in which the whole nut
  purchase must be paid. Working capital, not capex, is the financing problem in this business.

  STEP 7 - FCFF = NOPAT + D&A - dNWC - capex. t=0: 0 + 0 - 0 - 180,000,000 = -180,000,000.
  t=1: 430,807,833.33 + 12,000,000 - 332,574,125.11 = 110,233,708.22. t=2: 510,250,000 +
  12,000,000 - 16,800,278.54 = 505,449,721.46. t=3 and t=4: 522,250,000 each. t=5:
  445,156,250 + 12,000,000 - 57,534.25 = 457,098,715.75; t=6..9: 457,156,250 each. t=10:
  380,437,500 + 12,000,000 - 57,534.25 = 392,379,965.75; t=11..14: 392,437,500 each. t=15:
  380,437,500 + 12,000,000 + 349,489,472.15 released = 741,926,972.15. Total across the horizon
  6,469,964,083.33 XOF. F-212, 2026-08-04: export logistics, previously self-disclosed as
  DEFERRED and uncosted, now removes 172,227,000 XOF from the horizon total (12.3-13.5 Mn XOF/yr)
  against the earlier, uncosted trace - the numbers above supersede a prior, higher total that
  omitted this line. The investment still pays back inside the second production year even after
  the labour is corrected; the holiday is worth real money but it is not what makes this work,
  and the founder's haste to start is aimed at the wrong deadline - the ten-year Zone B schedule
  is more generous than he thinks, while the capex, the store, the payroll and the outbound
  haulage are all wrong or missing by multiples.


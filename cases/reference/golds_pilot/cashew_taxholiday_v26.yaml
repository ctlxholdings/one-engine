checks:
  # ---- (a) transformation closes ----
  - "kernel_recovery_fraction + shell_fraction_of_rcn + testa_fraction_of_rcn + kernel_process_loss_fraction + cleaning_reject_fraction + water_loss_fraction == 1"
  - "trace.rcn_processed_t == trace.kernel_t + trace.shell_t + trace.testa_t + trace.kernel_loss_t + trace.cleaning_reject_t + trace.water_loss_t"
  - "trace.kernel_t == kernel_recovery_fraction * trace.rcn_processed_t"
  - "trace.shell_t == shell_fraction_of_rcn * trace.rcn_processed_t"
  - "trace.testa_t == testa_fraction_of_rcn * trace.rcn_processed_t"
  - "trace.kernel_loss_t == kernel_process_loss_fraction * trace.rcn_processed_t"
  - "trace.cleaning_reject_t == cleaning_reject_fraction * trace.rcn_processed_t"
  - "trace.water_loss_t == water_loss_fraction * trace.rcn_processed_t"
  - "kernel_recovery_fraction == process_efficiency * lab_kor_fraction"
  - "sum(trace.rcn_processed_t) == rcn_throughput_t_per_year * (year1_utilisation_fraction + grid.periods - 2)"

  # ---- (b) every stock declares its loss ----
  - "trace.rcn_stock_close_t == trace.rcn_stock_close_t[t-1] + trace.rcn_purchased_t - trace.rcn_processed_t - trace.rcn_storage_loss_t"
  - "trace.rcn_avg_stock_t == trace.rcn_processed_t * avg_residence_months / 12"
  - "trace.rcn_storage_loss_t == trace.rcn_avg_stock_t * rcn_storage_loss_rate_per_month * 12"
  - "trace.rcn_peak_stock_t == trace.rcn_avg_stock_t * peak_to_average_stock_ratio"
  - "trace.rcn_stock_close_t <= rcn_throughput_t_per_year * closing_rcn_stock_months / 12"
  - "trace.rcn_stock_close_t[last] == 0"
  - "sum(trace.rcn_purchased_t) == sum(trace.rcn_processed_t) + sum(trace.rcn_storage_loss_t)"
  - "min(trace.rcn_stock_close_t) >= 0"
  - "trace.rcn_inventory_value == trace.rcn_stock_close_t * rcn_price_xof_per_kg * 1000"
  - "min(trace.fg_inventory_value) >= 0"

  # ---- (c) every rate fits the thing that produces it ----
  - "trace.operating_days == trace.rcn_processed_t * 1000 / daily_rcn_rate_kg"
  - "operating_days_per_year_full == scheduled_days_per_year * plant_availability"
  - "daily_rcn_rate_kg * operating_days_per_year_full == rcn_throughput_t_per_year * 1000"
  - "trace.operating_days[t] == operating_days_per_year_full for t >= 2"
  - "trace.machine_hours == trace.operating_days * shift_hours_per_day"
  - "trace.rcn_peak_stock_t <= rcn_store_capacity_t"
  - "trace.warehouse_floor_required_m2 == trace.rcn_peak_stock_t * 1000 / warehouse_areal_capacity_kg_per_m2"
  - "trace.jobs_required == trace.rcn_processed_t / tonnes_rcn_per_direct_job"
  - "trace.jobs_shortfall == trace.jobs_required - trace.jobs_stated"
  - "trace.jobs_stated[t] == workers_stated for t >= 1"
  - "trace.kernel_kg_per_stated_worker_day * workers_stated * trace.operating_days == trace.kernel_t * 1000"
  - "trace.kernel_kg_per_stated_worker_day >= manual_peeling_kg_per_person_day for t >= 1"
  - "capex_per_tonne_capacity * rcn_throughput_t_per_year == capex_total_xof"
  - "capex_benchmark_gap_xof == capex_benchmark_low_xof_per_t * rcn_throughput_t_per_year - capex_total_xof"
  - "kernel_rcn_price_ratio * rcn_price_xof_per_kg == kernel_price_xof_per_kg"
  - "rcn_price_xof_per_kg >= cca_floor_price_magasin_usine"
  - "worker_wage_monthly_xof >= smig_monthly"

  # ---- (d) cumulative quantities against the world ----
  - "cumsum(trace.machine_hours)[last] == sum(trace.operating_days) * shift_hours_per_day"
  - "cumsum(trace.kernel_t)[last] == sum(trace.rcn_processed_t) * kernel_recovery_fraction"
  - "sum(trace.export_containers) * container_payload_t_kernel == sum(trace.kernel_t)"
  - "trace.export_containers == trace.kernel_t / container_payload_t_kernel"
  - "sum(trace.depreciation) == capex_total_xof"
  - "grid.periods == relief_start_period_index + asset_life_years + 1"

  # ---- regime, relief and tax ----
  - "trace.revenue[t] >= rni_threshold_turnover for t >= 1"
  - "trace.revenue[t] >= pme_turnover_ceiling for t >= 1"
  - "agrement_threshold_large_company >= capex_total_xof"
  - "partial_relief_start_index == relief_start_period_index + code_full_exemption_years"
  - "full_rate_start_index == partial_relief_start_index + code_partial_relief_years"
  - "trace.relief_fraction[t] == 1 for t < partial_relief_start_index"
  - "trace.relief_fraction[t] == 0 for t >= full_rate_start_index"
  - "sum(trace.relief_fraction) == code_full_exemption_years + code_partial_relief_rate * code_partial_relief_years"
  - "trace.tax_rate == is_rate * (1 - trace.relief_fraction)"
  - "trace.tax == trace.tax_rate * trace.ebit"
  - "trace.bic_gross == is_rate * trace.ebit"
  - "trace.imf_computed[t] == imf_rate * trace.revenue[t] for t >= 1"
  - "trace.imf_computed[first] == imf_floor"
  - "trace.imf_computed <= imf_cap"
  - "trace.bic_gross[t] >= trace.imf_computed[t] for t >= 1"
  - "trace.patente_ca_uncapped == patente_ca_rate * trace.revenue"
  - "trace.patente_gross <= patente_ca_cap + patente_vl_rate * patente_rental_value_xof"
  - "trace.patente_due == trace.patente_gross * (1 - trace.relief_fraction)"
  - "trace.tse == tse_rate * trace.revenue"
  - "trace.export_duty == dus_rate_on_kernel_exports * trace.revenue"
  - "trace.other_taxes == trace.patente_due + trace.tse + trace.export_duty"

  # ---- driver bridges ----
  - "trace.revenue == kernel_price_xof_per_kg * trace.kernel_t * 1000 + shell_price_xof_per_t * trace.shell_t + processor_subsidy_received_xof_per_kg * trace.kernel_t * 1000 - kernel_price_net_deduction_xof_per_kg * trace.kernel_t * 1000"
  - "trace.rcn_expense == rcn_price_xof_per_kg * 1000 * (trace.rcn_processed_t + trace.rcn_storage_loss_t)"
  - "trace.gross_wages[t] == total_workforce_headcount * worker_wage_monthly_xof * 12 for t >= 1"
  - "trace.gross_wages[first] == 0"
  - "trace.cnps_capped_base[t] == total_workforce_headcount * cnps_ceiling_monthly * 12 for t >= 1"
  - "trace.labour_cost == trace.gross_wages * (1 + cnps_pension_employer_rate + employer_payroll_tax_rate) + trace.cnps_capped_base * (cnps_family_rate + cnps_at_mp_rate)"
  - "trace.labour_cost_as_stated * total_workforce_headcount == trace.labour_cost * workers_stated"
  - "trace.labour_cost_gap == trace.labour_cost - trace.labour_cost_as_stated"
  - "trace.other_opex[t] == other_opex_xof_per_year for t >= 1"
  - "trace.irrecoverable_input_vat == (1 - vat_credit_recovery_fraction) * vatable_opex_fraction * trace.other_opex * vat_standard_rate"
  - "trace.receivables[t] == trace.revenue[t] * receivable_days / 365 for t < terminal_release_index"
  - "trace.receivables[last] == 0"
  - "trace.payables[t] == (trace.labour_cost[t] + trace.other_opex[t]) * supplier_payable_days / 365 + trace.rcn_expense[t] * rcn_payable_days / 365 for t < terminal_release_index"
  - "trace.payables[last] == 0"
  - "trace.fg_inventory_value[t] == (trace.rcn_expense[t] + trace.labour_cost[t] + trace.other_opex[t] + trace.other_taxes[t]) * fg_stock_days / 365 for t < terminal_release_index"
  - "trace.fg_inventory_value[last] == 0"
  - "trace.overhaul_capex[t] == 0 for t < overhaul_index"
  - "sum(trace.overhaul_capex) == midlife_overhaul_capex_xof"
  - "trace.capex == trace.initial_capex + trace.overhaul_capex"
  - "sum(trace.initial_capex) == capex_total_xof"
  - "trace.depreciation[t] == capex_total_xof / asset_life_years for t >= 1"
  - "trace.export_logistics_cost_xof == trace.kernel_t * export_distance_km_roundtrip * export_logistics_rate_xof_per_tonne_km"

  # ---- definition: the ladder ----
  - "trace.ebitda == trace.revenue - trace.rcn_expense - trace.labour_cost - trace.other_opex - trace.other_taxes - trace.irrecoverable_input_vat - trace.export_logistics_cost_xof"
  - "trace.ebit == trace.ebitda - trace.depreciation"
  - "trace.nopat == trace.ebit - trace.tax"
  - "trace.nwc == trace.rcn_inventory_value + trace.fg_inventory_value + trace.receivables - trace.payables"
  - "cumsum(trace.delta_nwc) == trace.nwc"
  - "trace.delta_nwc == trace.nwc - trace.nwc[t-1]"
  - "trace.nwc[last] == 0"
  - "trace.book_value == trace.book_value[t-1] + trace.capex - trace.depreciation"
  - "trace.book_value[last] == 0"
  - "trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex"

  # ---- non-negativity ----
  - "min(trace.kernel_t) >= 0"
  - "min(trace.book_value) >= 0"
  - "min(trace.revenue) >= 0"
  - "min(trace.tax) >= 0"
  - "min(trace.rcn_purchased_t) >= 0"
  - "min(trace.export_logistics_cost_xof) >= 0"

notes:
  - "HEADLINE JUDGMENT CALL. The fcff array is costed at 266.67 workers, not the sixty the founder states. This is the one place a stated figure is overridden, and the reason is that sixty is not a cost estimate but a physical claim, and the claim fails: 29.33 kg of export-graded kernel per worker per day against a skilled hand-peeler's 6-8 kg/day at the peeling bench alone. His own capex closes the only escape - automatic peeling costs far more than 180,000,000 - so the peeling must be manual and manual peeling needs hundreds of hands. The stated case is preserved and fully costed in trace.labour_cost_as_stated, and the difference in trace.labour_cost_gap, so a reader who disagrees can substitute one row and re-run. The direction is unambiguous: on his own headcount FCFF is higher in every period."
  - "THE CAPEX IS THE DEEPEST PROBLEM AND IT IS NOT MODELLED AWAY. capex_per_tonne_capacity is 90,000 XOF per tonne of annual capacity against a cheapest observed Ivorian point of 250,000 and a directly comparable plant (ECOCAJOU Odienne, 15,000 t for 10.2 bn) at 680,000; sub-scale lines cost more per tonne, not less. The model runs on his 180,000,000 because that is what he said, which means the depreciation charge, the book value and the capex outflow are all almost certainly too small, and FCFF is correspondingly too high in the early years. The gap is materialised in capex_benchmark_gap_xof so it cannot hide."
  - "THE FOUNDER IS WRONG ABOUT HIS OWN RELIEF, IN HIS FAVOUR. He describes five years of exemption and then 25%. Zone B / categorie 1 gives ten years - five full, five at half - and because his turnover puts him above the PME ceiling the half is 50%, not 75%, giving an effective 12.5% in years six to ten. What he believes is a fact about his business; what Ord. 2018-646 says is a fact about the world; they are different objects and both are recorded."
  - "HE MAY NOT HOLD THE AGREMENT HE THINKS HE HOLDS. A grande entreprise needs 200,000,000 XOF HT of investment excluding working capital to take the agrement route; he has 180,000,000, and he cannot use the 50,000,000 PME threshold because his turnover exceeds 1 bn. He may therefore be under the regime de declaration. The exploitation-phase exemption schedule is the same under both (arts. 11 and 17), so the tax holiday in this model survives either way; what would be lost is the investment-phase customs and VAT exemption on the equipment, which would raise the cash cost of the plant. Whether his 180,000,000 is HT or TTC is unresolved and pushes the same direction."
  - "THE RELIEF CLOCK MAY ALREADY BE RUNNING. He believes it starts at first production; the code anchors it to achevement des travaux / the certificat d'agrement a l'exploitation. The base case takes the conservative reading and starts it in the construction year, which costs him one of the five full-exemption years. If the certificate is dated 2027 he gains a year of full exemption; the direction is favourable and the answer is on his file, not in the law."
  - "THE PRICE PAIR DOES NOT BENCHMARK, AND THE MISPRICING IS LARGE ENOUGH TO FLIP THE TAX BRANCH ON ITS OWN. His purchase price of 500 sits correctly above the CCA floor of 454 magasin-usine. His kernel price of 4,500 does not: kernel_rcn_price_ratio is 9x against a working trade ratio of 5-6x, and 4,500 XOF/kg is at the top of the Vietnamese WW320 FOB range for an origin that trades at a discount to Vietnam. The existence of a 400 FCFA/kg State support to processors, described as the official competitiveness gap against Vietnam, is itself evidence that Ivorian shelling does not clear at unsubsidised prices. The model runs his stated price because it is his contract to know; the direction of any correction is downward and it lands directly on FCFF. F-215, 2026-08-04: the checks formula that asserts BIC always beats the IMF (trace.bic_gross[t] >= trace.imf_computed[t]) is arithmetically true here, but only ~13x clear of its own crossover (EBIT = 0.02 x revenue = 39,600,000 against an actual full-rate EBIT of 507,250,000) - and correcting kernel_rcn_price_ratio to the sourced trade ceiling of 6x (4,500 to 3,000 XOF/kg, a 33% cut) removes about 660,000,000 XOF/yr of revenue at unchanged cost, taking steady-state EBIT negative and flipping the operative tax from the profit-tax branch (BIC) to the turnover-based minimum forfaitaire (IMF) entirely. This model does not re-price the kernel - it stays on the founder's stated 4,500, per the paragraph above - but a reader treating 'the IMF never binds' as a structural property of this business rather than a contingent fact of its current, disputed price is reading the checks formula wider than it is licensed to be read."
  - "WORKING CAPITAL, NOT CAPEX, IS THE BINDING CONSTRAINT. The campaign forces a year's feed to be bought in five months, in cash, from cooperatives that do not lend. The first production year absorbs more net working capital than the entire fixed investment. He does not mention campaign finance at all. This is the single largest omission in the plan after the headcount."
  - "\"LE RESTE, C'EST LA COQUE\" IS WRONG BY TWELVE POINTS. Shell is 66% of the raw nut, not 78%; the other twelve points are water, cleaning rejects, testa and broken kernel. It matters twice: the shell tonnage he must move or burn is smaller than he thinks, and the streams he has not named (testa, fines, rejects) are not nothing."
  - "SIMPLIFICATIONS, EACH DELIBERATE. (1) IAS 16 requires component depreciation and a building does not have the same life as a sheller; the founder's single fifteen-year life is kept because splitting it needs a capex breakdown he has not given, and because the shield is worthless in the exempt years anyway. (2) The 4.4% employer payroll tax is charged in all periods although the code exempts its 2.8% limb during the relief years - the conservative treatment. (3) Other opex is held flat at 120,000,000 including the eleven-month first year, although power and water would scale down. (4) Finished goods are carried at cash production cost, excluding depreciation, which IAS 2 would include. (5) All 266.67 workers are paid the same 80,000, although management would earn multiples of it - this understates payroll. (6) Working capital is released in full in the terminal period as a wind-down convention; no terminal value is taken."
  - "DEFERRED AND NOT PRICED. Insurance; food-safety certification and residue testing; site security; administration and management above the shop floor; CCA and ARECA sector levies on kernel exports; and the mid-life overhaul that 29,833 machine-hours makes near-certain. Every one of these is a cost, so every one pushes FCFF down further. (Export logistics - Bouake-Abidjan haulage, about 421 containers over the horizon - was in this list through 2026-08-03; F-212 costed it 2026-08-04 via export_logistics_rate_xof_per_tonne_km x export_distance_km_roundtrip x trace.kernel_t, removing 172,227,000 XOF from the horizon FCFF total.)"
  - "WHAT WOULD CHANGE THE ANSWER MOST. In order: the true workforce, whether the 400 F/kg processor support is actually received, how much nut he can physically store, and the date on his certificat d'agrement. If the founder will answer only three questions, those are the first three."

passage: |
  ==========================================================================
  0. WHAT THE BUSINESS PHYSICALLY IS, AND HOW THE GRID FOLLOWS FROM IT
  ==========================================================================
  The founder is building a single-line raw-cashew-nut (RCN) shelling and drying
  unit in Bouaké. Physically the operation is a mass-conversion process, and the
  natural quantities are the ones he uses himself: tonnes of raw nut put through
  the line per year, kilos of white kernel out, and the shell residue. I keep
  those units and only convert to francs at the two prices he gives.

  Timing. He speaks while the plant is being installed and says «Je démarre
  l'année prochaine». So there is one period in which the 180 million is spent
  and nothing is produced, and then the production years begin. The equipment
  life he quotes — «sur ce genre d'équipement on compte quinze ans» — sets the
  natural horizon: fifteen production years, at the end of which the installed
  base is exactly consumed. Hence the grid:

      t = 0  : build/installation year (capex, no production)
      t = 1  : production year 1   (first year of the tax exemption)
      ...
      t = 5  : production year 5   (last year of the tax exemption)
      t = 6  : production year 6   (first taxed year, 25%)
      ...
      t = 15 : production year 15  (asset fully depreciated at close)

      grid.periods = 16, annual.

  Note the indexing trap: the exemption runs "five years from the first year of
  production", i.e. production years 1 through 5, which are array positions
  t = 1..5. The first taxed array position is t = 6, not t = 5.

  ==========================================================================
  1. THE MASS BALANCE (per production year)
  ==========================================================================
  Throughput, in his own unit:
      2 000 tonnes of raw nut per year = 2 000 × 1 000 = 2 000 000 kg/yr.

  Outturn. He gives the yield in the trade's own form — kilos of white kernel
  per hundred kilos of raw nut: «vingt-deux kilos d'amande blanche pour cent
  kilos de noix brutes». That is an outturn ratio of 22/100 = 0.22. (For
  orientation, 22% by weight is a sound commercial outturn for Ivorian nut; the
  trade would normally quote it as a KOR in pounds per 80 kg bag, but the
  founder has already given it as a clean mass ratio, so I use it as such and do
  not reconstruct a KOR.)

      Kernel out = 2 000 000 kg × 0.22 =   440 000 kg/yr  (= 440 t)
      Shell out  = 2 000 000 kg × 0.78 = 1 560 000 kg/yr  (= 1 560 t)
      Check:       440 000 + 1 560 000 = 2 000 000 kg  ✔ mass conserved.

  The shell is a genuine physical output — 78% of everything that enters the
  factory leaves as shell — and in the sector it is either burnt under the
  dryers or sold for CNSL extraction. The founder gives it no price and no
  outlet; he calls it simply «le reste». I therefore carry it as a real tonnage
  in the trace but at zero francs. This is the main place where the sector's
  natural description does not map onto a standard line item: the model has a
  1 560 t/yr output stream with no revenue line, and I leave that friction
  visible rather than dropping the stream or inventing a price for it.

  ==========================================================================
  2. REVENUE (per production year, t = 1..15)
  ==========================================================================
  Only the kernel is sold. Revenue recognition (IFRS 15): control of the kernel
  passes on export shipment; with annual periods and a flat programme, the
  shipped quantity equals the produced quantity each year.

      Revenue = 440 000 kg × 4 500 XOF/kg = 1 980 000 000 XOF/yr.

  In the build year t = 0 there is no production and no revenue: 0.

  ==========================================================================
  3. CASH OPERATING COSTS (per production year)
  ==========================================================================
  (a) Raw nut. The purchase is matched to the period in which the nut is
      processed and the kernel sold (cost matching); the timing difference
      between the campaign purchase and the sale is handled in working capital,
      not in the P&L.

          RCN cost = 2 000 000 kg × 500 XOF/kg = 1 000 000 000 XOF/yr.

      Sanity read: 1 kg of kernel absorbs 1/0.22 = 4.545454… kg of raw nut, so
      the raw-nut cost embedded in each kilo of kernel is 500 / 0.22 =
      2 272.727272… XOF/kg against a 4 500 XOF/kg sale price. The gross material
      margin per kilo of kernel is therefore 2 227.272727… XOF, i.e. 980 000 000
      XOF a year over the whole 440 t. That is the economic engine of the unit,
      and it is what the rest of the cost base has to be paid out of.

  (b) Labour.
          60 workers × 80 000 XOF/month × 12 months = 57 600 000 XOF/yr.

      This is the gross wage the founder quotes. Employer social contributions
      are not mentioned and are not added (see notes).

  (c) Power, water, bags, maintenance. Stated as a single annual block:
          120 000 000 XOF/yr.
      Note that «l'entretien» sits inside this block, which is why no separate
      maintenance capex is carried.

  (d) Total cash operating cost per production year:
          1 000 000 000 + 57 600 000 + 120 000 000 = 1 177 600 000 XOF/yr.

  ==========================================================================
  4. EBITDA (per production year)
  ==========================================================================
      EBITDA = 1 980 000 000 − 1 177 600 000 = 802 400 000 XOF/yr.

  At t = 0 both revenue and cash opex are zero, so EBITDA = 0.

  ==========================================================================
  5. CAPEX AND DEPRECIATION
  ==========================================================================
  Capex. The full 180 000 000 XOF is incurred in the build year, t = 0. It is
  one indivisible installed asset in his description — «les machines de
  décorticage, les séchoirs, le bâtiment» — bought and installed as a unit.

  Depreciation. IAS 16.55: depreciation begins when the asset is available for
  use, which is the start of production, t = 1 — not t = 0. Straight-line over
  the stated 15-year life to a nil residual:

      Annual depreciation = 180 000 000 / 15 = 12 000 000 XOF/yr, for t = 1..15.
      Depreciation at t = 0 = 0.

  Roll-forward of the asset:
      Gross PPE: 180 000 000 from t = 0 onward (no additions, no disposals).
      Accumulated depreciation: 0 at t = 0, then +12 000 000 a year, reaching
        12 000 000 × 15 = 180 000 000 at t = 15.
      Net book value: 180 000 000 at t = 0, 168 000 000 at t = 1, …, and exactly
        0 at t = 15. The horizon and the asset life close together, which is what
        makes 16 periods the right window: nothing is left stranded at the end
        and no replacement decision has to be invented inside it.

  Friction worth flagging: IAS 16.43 would require the building to be
  componentised away from the shelling machines and dryers, because a building
  plainly outlives a shelling line. The founder gives one number and one life
  («sur ce genre d'équipement on compte quinze ans»), covering the lot. I follow
  his single life rather than splitting the 180 million on a made-up ratio; the
  consequence is discussed directionally in the notes.

  ==========================================================================
  6. EBIT
  ==========================================================================
      EBIT = EBITDA − depreciation
           = 802 400 000 − 12 000 000 = 790 400 000 XOF/yr, for t = 1..15.
      EBIT at t = 0 = 0 − 0 = 0.

  ==========================================================================
  7. TAX — THE INVESTMENT-CODE HOLIDAY
  ==========================================================================
  This is the feature the founder says decided the whole investment, so it has
  to be got exactly right. He holds an «agrément au code des investissements»
  giving «cinq ans d'exonération totale d'impôt sur le bénéfice à compter de la
  première année de production», after which he returns to the ordinary 25%
  rate. Two consequences:

    (i) The exemption is total on the profit tax, and it is anchored to the
        first year of PRODUCTION, not to the year of approval or of spending.
        So the build year t = 0 is irrelevant to the count, and the exempt
        window is production years 1..5, i.e. t = 1..5.
    (ii) From production year 6 — t = 6 — the ordinary rate applies to the full
         operating profit.

  Because this is an unlevered, asset-side build, tax is computed on EBIT, not
  on a post-interest profit: the tax shield of any debt is deliberately excluded
  from FCFF and belongs in the discount rate.

      t = 0..5 : tax = 0
                 (t = 0 has zero EBIT anyway; t = 1..5 are exempt by the agrément)
      t = 6..15: tax = 790 400 000 × 0.25 = 197 600 000 XOF/yr

  Over the horizon the holiday shelters five years of profit that would
  otherwise have been taxed, and ten years are taxed: cumulative tax =
  197 600 000 × 10 = 1 976 000 000 XOF.

  ==========================================================================
  8. NOPAT
  ==========================================================================
      NOPAT = EBIT − tax on EBIT.

      t = 0     : 0 − 0 = 0
      t = 1..5  : 790 400 000 − 0           = 790 400 000 XOF/yr
      t = 6..15 : 790 400 000 − 197 600 000 = 592 800 000 XOF/yr

  ==========================================================================
  9. WORKING CAPITAL
  ==========================================================================
  Nothing at all is stated about receivables, stock or supplier terms, yet
  ΔNWC is a required limb of the unlevered build and for a seasonal agro-
  processor it is not a rounding item. I therefore supply flagged priors and
  keep them simple and auditable — month-fractions rather than day counts, so
  every figure lands on an exact franc.

  (a) Trade receivables. Kernel is exported; export terms of about one month:
          AR = 1 980 000 000 × 1/12 = 165 000 000 XOF.

  (b) Inventory. This is the structurally large item, and it is a genuine
      feature of the physical operation rather than an accounting artefact:
      the Ivorian raw-nut campaign is concentrated in a few months while the
      line shells all year, so the unit must sit on raw nut for most of the
      year, plus kernel awaiting shipment. Three months of the full cash
      operating cost base:
          Inventory = 1 177 600 000 × 3/12 = 294 400 000 XOF.

  (c) Trade payables. Cooperatives are paid at delivery — they have to pay
      planters — so raw-nut purchases carry no payable (rcn_payable_months = 0).
      Utilities, water, bags and maintenance are billed on about a month:
          AP = 120 000 000 × 1/12 = 10 000 000 XOF.

  (d) Net working capital in every production year:
          NWC = 165 000 000 + 294 400 000 − 10 000 000 = 449 400 000 XOF.

      NWC at t = 0 = 0 (nothing is bought, sold or stocked in the build year).

  Movement. Because the operating programme is flat, the whole investment in
  working capital is made once, in the first production year, and then stands
  still:
          ΔNWC at t = 0  : 0
          ΔNWC at t = 1  : 449 400 000 − 0 = 449 400 000  (a cash outflow)
          ΔNWC at t = 2..15 : 0

  It is not released at t = 15: the horizon ends because the machines are worn
  out, not because the founder says he liquidates. Carrying a release would be
  asserting a wind-up he never described.

  ==========================================================================
  10. THE UNLEVERED BUILD, PERIOD BY PERIOD
  ==========================================================================
      FCFF = NOPAT + D&A − ΔNWC − capex

  t = 0 — build year (2026 in his calendar)
      NOPAT 0 + D&A 0 − ΔNWC 0 − capex 180 000 000
      FCFF = −180 000 000 XOF.
      The entire outlay lands here, unshielded, because there is no profit yet
      to shield and — a point worth naming — because the tax holiday consumes
      itself over the five years when the depreciation shield is worth nothing
      anyway. The agrément and the depreciation shield overlap and partly
      cancel each other in value terms; the agrément still dominates, because
      12 000 000 of annual depreciation is small against 802 400 000 of EBITDA.

  t = 1 — production year 1 (exempt)
      NOPAT 790 400 000 + D&A 12 000 000 − ΔNWC 449 400 000 − capex 0
      FCFF = 353 000 000 XOF.
      The first production year is much the weakest of the operating years, not
      because it earns less — it earns the same as years 2-5 — but because the
      whole working-capital stock has to be funded in it.

  t = 2..5 — production years 2 to 5 (exempt)
      NOPAT 790 400 000 + D&A 12 000 000 − 0 − 0
      FCFF = 802 400 000 XOF/yr.
      In these four years FCFF equals EBITDA exactly, and that is not a
      coincidence: with no tax, no capex and no working-capital movement, the
      depreciation deducted at the EBIT line is added straight back, so the
      whole D&A line washes out and cash equals EBITDA.

  t = 6..15 — production years 6 to 15 (taxed at 25%)
      NOPAT 592 800 000 + D&A 12 000 000 − 0 − 0
      FCFF = 604 800 000 XOF/yr.
      The step down from 802 400 000 to 604 800 000 at t = 6 is exactly the
      197 600 000 of profit tax that the agrément had been suppressing. That
      cliff — a 24.6% drop in asset-side cash flow in a single year, with no
      change whatever in the physical operation — is the single most important
      structural feature of this business's cash profile, and it is precisely
      why the founder says «je me dépêche de démarrer»: every year of delay
      shifts one exempt year out of the window and does not shift the cliff.

  Cross-check by cash-flow statement construction. Split the same numbers into
  operating and investing cash flow:
      CFO = NOPAT + D&A − ΔNWC        CFI = −capex
      t = 0 : CFO 0,           CFI −180 000 000  → FCFF −180 000 000  ✔
      t = 1 : CFO 353 000 000, CFI 0             → FCFF  353 000 000  ✔
      t = 2..5 : CFO 802 400 000, CFI 0          → FCFF  802 400 000  ✔
      t = 6..15: CFO 604 800 000, CFI 0          → FCFF  604 800 000  ✔
  The two routes agree line for line, which is the point of carrying both.

  Cumulative over the 16 periods:
      −180 000 000 + 353 000 000 + 4 × 802 400 000 + 10 × 604 800 000
      = −180 000 000 + 353 000 000 + 3 209 600 000 + 6 048 000 000
      = 9 430 600 000 XOF.

  Reconciled independently from the aggregate identity:
      Σ NOPAT = 5 × 790 400 000 + 10 × 592 800 000
              = 3 952 000 000 + 5 928 000 000 = 9 880 000 000
      Σ D&A   = 180 000 000
      less closing NWC not released = 449 400 000
      less total capex               = 180 000 000
      → 9 880 000 000 + 180 000 000 − 449 400 000 − 180 000 000 = 9 430 600 000 ✔

  The whole 180 000 000 outlay is recovered inside the first production year on
  a pure cash basis (353 000 000 > 180 000 000), i.e. simple payback lands
  before the end of t = 1. That is a plausible-looking result for a well-sited
  Ivorian sheller with a 22% outturn and a 4 500/500 price pair, but it rests
  entirely on those two prices holding, and neither is contracted in the
  founder's account — see the notes.


checks:
  # --- conservation -------------------------------------------------------
  - "trace.gross_ppe[t] == trace.gross_ppe[t-1] + trace.capex[t]"
  - "trace.accum_dep[t] == trace.accum_dep[t-1] + trace.depreciation[t]"
  - "trace.net_ppe[t] == trace.net_ppe[t-1] + trace.capex[t] - trace.depreciation[t]"
  - "trace.net_ppe[t] == trace.gross_ppe[t] - trace.accum_dep[t]"
  - "sum(trace.depreciation) == plant_capex - residual_value"
  - "trace.accum_dep[last] == plant_capex - residual_value"
  - "trace.net_ppe[last] == residual_value"
  - "trace.gross_ppe[last] == plant_capex"
  - "sum(trace.capex) == plant_capex"
  - "trace.capex[first] == plant_capex"
  - "cumsum(trace.delta_nwc) == trace.nwc"
  - "trace.delta_nwc[t] == trace.nwc[t] - trace.nwc[t-1]"
  - "trace.rcn_processed_kg[t] == trace.kernel_kg[t] + trace.shell_kg[t]"
  - "kernel_yield_ratio + shell_ratio == 1"
  - "sum(trace.fcff) == sum(trace.nopat) + sum(trace.depreciation) - trace.nwc[last] - sum(trace.capex)"

  # --- definition ---------------------------------------------------------
  - "trace.cash_opex == trace.rcn_cost + trace.labour_cost + trace.other_opex"
  - "trace.ebitda == trace.revenue - trace.cash_opex"
  - "trace.ebit == trace.ebitda - trace.depreciation"
  - "trace.nopat == trace.ebit - trace.tax"
  - "trace.nwc == trace.accounts_receivable + trace.inventory - trace.accounts_payable"
  - "trace.cfo == trace.nopat + trace.depreciation - trace.delta_nwc"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex"

  # --- driver-bridge ------------------------------------------------------
  - "trace.rcn_processed_kg == rcn_throughput_kg_per_year * capacity_ramp for t >= first_production_period_index"
  - "trace.rcn_processed_kg == 0 for t < first_production_period_index"
  - "trace.kernel_kg == trace.rcn_processed_kg * kernel_yield_ratio"
  - "trace.shell_kg == trace.rcn_processed_kg * shell_ratio"
  - "trace.revenue == trace.kernel_kg * kernel_export_price + trace.shell_kg * shell_price"
  - "trace.rcn_cost == trace.rcn_processed_kg * rcn_purchase_price"
  - "trace.labour_cost == workers_count * monthly_wage * months_per_year for t >= first_production_period_index"
  - "trace.labour_cost == 0 for t < first_production_period_index"
  - "trace.other_opex == other_opex_annual for t >= first_production_period_index"
  - "trace.other_opex == 0 for t < first_production_period_index"
  - "trace.depreciation == (plant_capex - residual_value) / asset_life_years for t >= first_production_period_index"
  - "trace.depreciation == 0 for t < first_production_period_index"
  - "trace.capex == 0 for t >= first_production_period_index"
  - "trace.tax == 0 for t < first_taxed_period_index"
  - "trace.tax == trace.ebit * tax_rate for t >= first_taxed_period_index"
  - "sum(trace.tax) == trace.ebit[last] * tax_rate * (grid.periods - first_taxed_period_index)"
  - "trace.accounts_receivable == trace.revenue * receivable_months / months_per_year"
  - "trace.inventory == trace.cash_opex * inventory_months / months_per_year"
  - "trace.accounts_payable == trace.other_opex * payable_months / months_per_year + trace.rcn_cost * rcn_payable_months / months_per_year + trace.labour_cost * labour_payable_months / months_per_year"
  - "first_taxed_period_index == first_production_period_index + tax_holiday_years"
  - "grid.periods == first_production_period_index + asset_life_years"

  # --- non-negativity -----------------------------------------------------
  - "trace.net_ppe[t] >= 0"
  - "trace.accum_dep[t] >= 0"
  - "trace.accum_dep[t] <= plant_capex"
  - "trace.inventory[t] >= 0"
  - "trace.accounts_receivable[t] >= 0"
  - "trace.accounts_payable[t] >= 0"
  - "trace.nwc[t] >= 0"
  - "trace.tax[t] >= 0"
  - "trace.ebitda[t] >= 0"
  - "trace.kernel_kg[t] >= 0"
  - "trace.shell_kg[t] >= 0"
  - "trace.fcff[t] >= 0 for t >= first_production_period_index"

notes:
  - "Horizon choice. The window is the founder's own asset life (15 production years) plus the build year in which the 180 million is spent, giving 16 annual periods. That makes the horizon self-closing: net book value reaches exactly zero at the final period, so nothing is stranded and no replacement or terminal-value judgment has to be smuggled inside the window."
  - "Indexing of the tax holiday. The exemption is anchored to the first year of PRODUCTION, not to approval or to the spending year. With t=0 as the build year, exempt periods are t=1..5 and the first taxed period is t=6. Anchoring the holiday to t=0 instead would wrongly burn one exempt year on a year with no profit and would advance the tax cliff by a period."
  - "Tax base is EBIT, not post-interest profit. This is an asset-side, unlevered build by construction: financing structure, interest and any debt tax shield are excluded from FCFF and belong in the discount rate. The founder mentions no debt in any case."
  - "The shell stream. 78% of everything entering the factory (1 560 t/yr) leaves as shell, and it is carried in the trace as a real tonnage at zero francs because the founder gives it no outlet and no price. In practice Ivorian shellers either burn it under the dryers — which may be part of why the utilities block is only 120 million — or sell it for CNSL. Direction: any monetisation of shell or CNSL would raise revenue, EBITDA and FCFF in every production year; treating it as free dryer fuel is already implicitly reflected in the stated utilities figure. Question to elicit: is the shell sold, and at what price?"
  - "Componentisation of the 180 million. IAS 16.43 would separate the building from the shelling machines and dryers, since a building plainly outlives a shelling line, and would also carve out any land as non-depreciable. The founder gives one cost and one 15-year life covering machines, dryers and building together, and I follow his figure rather than inventing a split. Direction: lengthening the building's life would lower annual depreciation, which leaves FCFF completely unchanged during the exempt years (depreciation is added straight back and shields no tax there) and lowers FCFF slightly in the taxed years, where the lost depreciation shield is real. The effect is second-order because depreciation is small relative to EBITDA."
  - "Working capital is entirely an analyst construct here — nothing in the utterance touches receivables, stock or supplier terms — and it is flagged ASSUMED throughout. It matters most in the first production year, which is where the whole stock has to be funded and which is consequently the weakest operating year in the series despite earning the same profit as the four years after it. The inventory prior is the one that most deserves testing, because the Ivorian raw-nut campaign is genuinely concentrated (roughly February to May) against year-round shelling: direction, a longer average holding period pushes more cash out in the first production year and leaves the steady-state years untouched. Questions to elicit: export payment terms; whether the campaign is bought in one wave or several; whether cooperatives are truly paid at delivery."
  - "No working capital is released at the end of the horizon. The window closes because the machines are worn out, not because the founder describes a wind-up, so the unit is treated as a going concern past t=15. Direction: modelling a liquidation instead would add a one-off inflow in the final period."
  - "No residual or salvage value is taken on the plant at the end of the 15 years, and no replacement capex falls inside the window. Routine upkeep is not double-counted because «l'entretien» is already inside the stated 120 million operating block."
  - "No ramp-up. The founder states a flat 2 000 t/yr with no first-year learning curve, commissioning downtime or seasonal shutdown, and I follow him, but full nameplate utilisation from the very first production year is a prior rather than an entailment. Direction: any first-year shortfall would reduce the earliest and least discounted cash flows, which are the ones the payback rests on."
  - "Minimum tax not modelled. Côte d'Ivoire levies a minimum lump-sum profit tax alongside the ordinary rate, and whether an investment-code agrément displaces it is a question of the specific arrêté. The founder's words are unambiguous on their face — «exonération totale d'impôt sur le bénéfice» — so the exempt years are carried at strictly zero. Question to elicit: does the agrément cover the impôt minimum forfaitaire as well as the ordinary profit tax, and does it extend to any other levies?"
  - "VAT is excluded as cash-neutral. Kernel exports are zero-rated and input VAT on utilities and consumables is in principle recoverable, so no VAT flows are carried. In practice refund delays at the tax administration can tie up cash. Direction: slow refunds would add a working-capital drag not captured here."
  - "Employer social contributions are not added to payroll. The founder quotes 80 000 per worker per month as the wage; CNPS employer charges are not mentioned. Direction: including them would raise the labour line and reduce EBITDA and FCFF in every production year, though labour is a small share of a cost base dominated by raw nut. Question to elicit: is 80 000 the gross wage or the fully loaded cost per worker?"
  - "Book depreciation is used as tax depreciation. During the exemption the distinction is worthless anyway, and after it the founder gives no separate fiscal schedule. Ivorian tax-depreciation rates would in reality differ from the 15-year book life, shifting the timing but not the total of the shield in the taxed years."
  - "Prices are held flat in nominal terms and no inflation is applied to costs. Both prices are volatile: the export kernel price is set in a dollar-denominated world market and the campaign price for raw nut is administratively influenced and moves year to year. Direction: because raw nut is by far the largest cost, the unit's cash flow is far more sensitive to the spread between the two prices than to the level of either, and the model as built asserts a constant spread for fifteen years — which is the single most fragile assertion in the whole derivation, more so than anything in working capital."
  - "Annual periodicity suppresses within-year seasonality. The real cash profile of a sheller is lumpy — a large concentrated outflow during the buying campaign, receipts spread across the shipping year — and only the average of that is visible at annual granularity, via the inventory prior. A monthly or quarterly grid would show a materially harsher intra-year financing requirement, which is what the unit's working-capital line of credit would actually have to cover."
  - "Judgment call logged — the tax cliff at the first taxed period is the dominant structural feature of the cash profile and is left fully visible in the series rather than smoothed by any averaging of the tax rate across the horizon. Averaging would have made the model tidier and materially less useful, since the founder's own stated reason for hurrying («c'est pour ça que je me dépêche de démarrer») is exactly the timing of that cliff."
  - "★ MATERIAL DEFECT FOUND BY PHYSICAL AUDIT 2026-07-26 -- THE HOLIDAY IS UNDERSTATED, AND IT IS THIS GOLD'S DECLARED SUBJECT. NOT REPAIRED IN PLACE; SEE WHY. The founder states five years of total exemption and then a return to the normal 25%. Verified against the Ivorian investment code (Ordonnance 2018-646, Arts. 11 and 17), that is only the FIRST TRANCHE of the relief actually available: cashew shelling is categorie 1 (agro-industrie), Bouake is a chef-lieu de region and therefore ZONE B, and zone B categorie 1 grants 'une exoneration d'une duree de dix ans, totale sur les cinq premieres annees, de cinquante pour cent sur les cinq annees suivantes'. So periods 6 through 10 should bear tax at an EFFECTIVE 12.5%, not the full 25% modelled, and the founder's own belief about his position is wrong. Materiality: roughly half a billion XOF of additional lifetime FCFF. TWO FURTHER FINDINGS from the same audit, both retained as flags rather than changes: the stated capex is 3-9x below every real Ivorian shelling-plant benchmark per tonne of annual capacity, which is what produces the sub-one-year payback this gold's passage wrongly endorses as 'plausible-looking'; and the implied kernel-to-raw-nut price ratio of about 9x, against a real working ratio of 5-6x, yields an EBITDA margin far above what the sector sustains -- the State pays processors a per-kilo subsidy expressly to close a competitiveness gap that this model shows as a large surplus. WHY NOT REPAIRED HERE: correcting the holiday moves tax, NOPAT, CFO and FCFF across five periods together and breaks the dependent lifetime-tax check -- a coupled-block hand-edit of a generated gold, which the library forbids. The clean repair is to RE-AUTHOR from an utterance carrying the real two-step profile (0% for five years, then 12.5% for five, then 25%), which is a RICHER mechanism than the binary this gold currently isolates: it gives an engine two rate steps to get right instead of one. Queued as a SPAWN. TWO ATTACKS ON THE MECHANISM FAILED ON THE MERITS AND THE GOLD IS VINDICATED ON BOTH: the minimum forfaitaire IS expressly displaced during the exemption ('y compris l'impot minimum forfaitaire'), so strictly zero tax in exempt years is legally correct and not merely a reading; and the holiday-versus-depreciation interaction is provably FCFF-neutral inside this window, since each taxed period receives the same allowance under either treatment. The 0-based indexing this gold advertises as its hard part -- build year at index 0, exempt 1 through 5, first taxed at 6 -- was independently confirmed correct."

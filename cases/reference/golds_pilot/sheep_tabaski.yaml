    prov: SOURCED
    source: "CONTINGENT ONLY — materialised as trace.contingent_social_charges, never in FCFF. The lad is paid monthly, works morning and evening and is by any ordinary reading an employee; nothing in the utterance suggests he is declared. Modelled at zero because that is how the business runs, and surfaced as a checked column because an unrecognised liability that appears only in prose is one a reader cannot act on (fact_id SN-TAX-08, SN-V25-18)."
    authority: "Sénégal — IPRES retraite régime général 8,4% employeur (plafond 432 000 XOF/mois), Caisse de Sécurité sociale prestations familiales 7% et accidents du travail 1–5% (plafond 63 000 XOF/mois), CFCE 3%; CLEISS, régime de sécurité sociale du Sénégal."

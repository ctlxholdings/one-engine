  haulm_storage_loss_monthly:
    value: 0.02
    unit: ratio/month on OPENING stock
    prov: ELICITED
    source: "The haulm is bought in December and fed out to May, then again from December for the second campaign — up to five months in store, exposed to leaf shatter, termites, rodents and wind. 2% per month is applied to the stock ACTUALLY AT RISK, so the monthly charge falls as the store drains (12.4 kg in the first month, 1.08 kg in the twelfth); a flat per-month charge would overstate the tail. Wired: trace.haulm_loss_kg."
    question: "Sur les bottes que vous achetez en décembre, quand vous arrivez au mois de mai, combien est perdu — mangé par les bestioles, gâté, ou tout simplement parti ?"

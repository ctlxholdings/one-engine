    FCFF = -201,812.500000. Cash actually out: 215,312.500000.

  t=7 to t=12  JULY–DECEMBER 2026 — the dead season.
    The carried ram eats every month. One baptism animal is finished and sold at t=9, a second
    bought at t=10. Revenue at t=9 is 0.926859 head x 75,000 = 69,514.453125 against a cost of

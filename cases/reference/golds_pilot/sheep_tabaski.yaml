contract: "v2.6"
id: sheep_tabaski_ndande
title: "Embouche ovine for Tabaski — Ndande (Kébémer, Senegal): unlevered FCFF over two feast cycles"
currency: XOF

grid:
  periods: 18
  freq: monthly
  why: |
    Monthly, 18 periods, December 2025 (t=0) through May 2027 (t=17). Tabaski 1 falls at t=5
    (28 May 2026), Tabaski 2 at t=17 (mid-May 2027).

    WHY MONTHLY. The founder's own unit of work is "les quatre mois avant la fête" — a four-month
    fattening window inside a twelve-month year. An annual grid would destroy three things at once:
    (i) the fattening window itself, which is the only period in which this business does anything;
    (ii) the feed-credit swing — the concentrate is taken on credit and "payable après la fête", so
    on an annual grid the payable opens and closes inside one period and the model would show this
    business as having no working capital at all, when working capital IS the mechanism; and
    (iii) the carried-over animal, whose whole cost is that it eats for eleven months between two
    revenue events. Weekly or daily would be spurious: nothing in the utterance is stated at finer
    than month resolution, and the founder dates everything by month ("en janvier", "au mois de
    février", "fin mai").

    WHY THIS START. t=0 is December, the month after the groundnut harvest, because that is when
    the roughage is bought — "la fane je l'achète en bottes après la récolte". Starting in January
    with the ram purchase would leave a 40,000 cash outflow and a five-month roughage store outside
    the frame, and the store's drawdown is one of the two physical stocks in this business.

    WHY THIS END. The horizon ends AT Tabaski 2 rather than at a calendar year-end, because that is
    the point at which every stock this operation carries is resolved: the second cohort is sold,
    the roughage store is nearly empty, and — decisively — the unsold ram from Tabaski 1 is
    disposed of. The founder states the only two exits for that animal: "tu le vends au prix
    ordinaire ou tu le gardes jusqu'à l'autre Tabaski, et il mange presque une année." A 12-month
    horizon would stop with a live, unpriced, still-eating animal on the books and would flatter
    FCFF by omitting most of the cost of holding it. 18 months carries it to its own resolution.

    WHY NOT LONGER. Two reasons, both from the utterance. First, past Tabaski 2 the founder's plan
    is an aspiration, not an observation: "l'année prochaine, inchallah, j'en fais huit et je
    descends moi-même à Dakar. Si je fais deux cent cinquante mille la tête" — a scale he has never
    run, through a channel he has never used, at a price he has only heard about ("on a vu ça à la
    télé"). A model that ran to a third cycle would be modelling a wish. Second, the grid's own
    validity expires: the feast recedes about eleven days a year, so within two or three more
    cycles Tabaski walks out of May and out of its present relation to the groundnut harvest, which
    is what sets the roughage price ("quand elle tombe juste après la récolte, la fane est là et ne
    coûte presque rien; plus tard, tu paies tout"). Over THIS horizon the recession moves the feast
    from end-May to mid-May — the same month — so a monthly grid holds. Two cycles further out it
    would not.

    WHAT IS OBSERVED AND WHAT IS PROJECTED. The statement date is 29 July 2026, so t=0..t=7
    (Dec 2025 – Jul 2026) are historical: the purchase, the campaign, the Tabaski-1 sales and the
    ram that "est encore là" are things that happened. t=8..t=17 (Aug 2026 – May 2027) are
    projected. A reader should weight the two halves differently, and the split is stated here
    rather than buried.

utterance:
  fr: |
    Je fais l'embouche à Ndande, du côté de Kébémer. Des béliers pour la Tabaski, c'est tout. Je n'ai
    pas de champ — mon père en avait, moi non. Quand on m'appelle pour la maçonnerie j'y vais, mais le
    vrai travail c'est les quatre mois avant la fête.

    J'achète les jeunes béliers au louma en janvier, quand la fête tombe en mai. Des bali-bali d'un an,
    un an et demi, dans les vingt-cinq, trente kilos. Cinquante mille la bête, des fois quarante-cinq ;
    cette année j'en ai payé un soixante mille parce qu'il était déjà gros. Le ladoum, ce n'est pas pour
    moi : un agneau ladoum c'est déjà trois cent mille.

    Le tourteau d'arachide, le sac de cinquante kilos, quinze mille en ce moment, l'année dernière
    c'était douze. Un bélier me fait un sac et demi sur les quatre mois, et avec la fane il mange plus
    d'un kilo par jour. La fane je l'achète en bottes après la récolte, quarante mille pour tout le lot,
    plus le son de mil. Le sel et le déparasitage, mets quatre mille par bête. L'aliment, le vendeur me
    le donne à crédit, payable après la fête : le sac à seize mille cinq cents au lieu de quinze mille.

    En quatre mois le bélier prend ses dix, douze kilos, il arrive à quarante, quarante-cinq pour les
    beaux. Et plus la fête approche, plus il vaut. C'est ça qu'il faut comprendre : mon mouton grossit
    et le prix monte en même temps, tu ne peux pas les séparer. Au mois de février le même animal,
    personne ne te regarde. Hors fête le boucher te compte au poids et il ne monte pas ; à la Tabaski
    personne ne pèse rien, on regarde la bête, les cornes, la robe.

    Cette année j'en ai fait six. Ce que j'achète, je le vends, c'est ma règle. Le coxeur est passé
    trois jours avant, il m'en a pris trois d'un coup à cent dix mille, cash, et il est monté. Deux
    autres je les ai vendus au foirail, cent vingt et cent trente-cinq mille. Il m'en restait un la
    veille au soir. Celui-là est encore là. Il mange. Ma fille lui a donné un nom, c'est mauvais signe.

    Parce qu'après la fête, c'est fini. Ce n'est pas que ça descend doucement — le lendemain matin
    personne ne veut plus de bélier. Celui qui te reste, tu le vends au prix ordinaire ou tu le gardes
    jusqu'à l'autre Tabaski, et il mange presque une année. Mon voisin Assane, l'an dernier, la veille
    il demandait cent quatre-vingt mille ; le soir il a lâché à cent trente-cinq, il n'allait pas les
    ramener à la maison. La nuit d'avant, moi, je ne dors pas.

    Entre deux Tabaski je fais tourner deux, trois bêtes pour les baptêmes, je vends au boucher. Là
    c'est soixante-quinze, quatre-vingt mille, et encore. Ça fait vivre, ça ne fait pas gagner.

    Il faut compter qu'il y en a un sur dix qui peut ne pas arriver à la fête. En quatre ans j'en ai
    perdu deux, un ballonnement, en deux jours il était mort.

    L'enclos et le hangar m'ont fait deux cent cinquante mille il y a trois ans. Un jeune du quartier
    m'aide matin et soir, dix mille par mois. Pour le foirail on loue une camionnette à trois, quinze
    mille chacun.

    La fête recule d'à peu près onze jours chaque année. Cette année c'était fin mai, l'année prochaine
    ce sera vers le milieu du mois. Quand elle tombe juste après la récolte, la fane est là et ne coûte
    presque rien ; plus tard, tu paies tout.

    Je ne paie rien là-dessus. C'est de l'élevage. Personne ici ne paie rien sur des moutons. Il paraît
    qu'il faut une patente quand on fait du commerce, mais moi je ne fais pas du commerce. L'année
    dernière la mairie est passée demander des papiers à ceux qui vendaient au bord de la route.

    À Dakar on parle de béliers à quatre cent mille, cinq cent mille ; le ladoum, on a vu ça à la télé,
    un million et plus. Mes bêtes sont bonnes aussi, waay. L'année prochaine, inchallah, j'en fais huit
    et je descends moi-même à Dakar. Si je fais deux cent cinquante mille la tête, tu vois ce que ça
    donne. Le coxeur, lui, il prend et il monte ; ce qu'il en fait là-haut, ça ne me regarde pas.
  en: |
    I do fattening at Ndande, over towards Kébémer. Rams for Tabaski, that's all. I have no field — my
    father had one, I don't. When they call me for masonry work I go, but the real work is the four
    months before the feast.

    I buy the young rams at the louma in January, when the feast falls in May. Bali-bali of a year, a
    year and a half, around twenty-five, thirty kilos. Fifty thousand a head, sometimes forty-five;
    this year I paid sixty thousand for one because he was already big. The ladoum is not for me: a
    ladoum lamb is already three hundred thousand.

    Groundnut cake, the fifty-kilo sack, fifteen thousand at the moment, last year it was twelve. A ram
    gets through a sack and a half over the four months, and with the haulm he eats more than a kilo a
    day. The haulm I buy in bales after the harvest, forty thousand for the whole lot, plus millet
    bran. Salt and the deworming, put four thousand a head. The feed, the seller gives it to me on
    credit, payable after the feast: the sack at sixteen thousand five hundred instead of fifteen
    thousand.

    In four months the ram puts on his ten, twelve kilos, he gets to forty, forty-five for the good
    ones. And the closer the feast gets, the more he is worth. That's what you have to understand: my
    sheep is growing and the price is going up at the same time, you can't separate them. In February
    the same animal, nobody looks at you. Outside the feast the butcher counts you by weight and he
    doesn't go higher; at Tabaski nobody weighs anything, they look at the animal, the horns, the coat.

    This year I did six. What I buy, I sell — that's my rule. The coxeur came by three days before, he
    took three off me in one go at a hundred and ten thousand, cash, and went up to town. Two others I
    sold at the foirail, a hundred and twenty and a hundred and thirty-five thousand. I still had one
    left on the eve. That one is still here. He eats. My daughter has given him a name, which is a bad
    sign.

    Because after the feast, it's over. It isn't that it comes down slowly — the next morning nobody
    wants a ram any more. The one you're left with, you sell him at the ordinary price or you keep him
    until the next Tabaski, and he eats for almost a year. My neighbour Assane, last year, on the eve
    he was asking a hundred and eighty thousand; that evening he let them go at a hundred and
    thirty-five, he wasn't going to take them back home. The night before, me, I don't sleep.

    Between two Tabaskis I turn over two, three animals for baptisms, I sell to the butcher. There it's
    seventy-five, eighty thousand, and even then. It keeps you alive, it doesn't make you money.

    You have to reckon that one in ten may not make it to the feast. In four years I've lost two,
    bloat, in two days he was dead.

    The pen and the shelter came to two hundred and fifty thousand three years ago. A young lad from
    the neighbourhood helps me morning and evening, ten thousand a month. For the foirail we rent a
    pickup three of us together, fifteen thousand each.

    The feast moves back about eleven days every year. This year it was end of May, next year it'll be
    around the middle of the month. When it falls just after the harvest the haulm is there and costs
    almost nothing; later than that, you pay for everything.

    I don't pay anything on this. It's livestock. Nobody here pays anything on sheep. They say you need
    a patente when you're in trade, but me, I'm not in trade. Last year the town hall came round asking
    for papers from the ones selling by the roadside.

    In Dakar they talk about rams at four hundred thousand, five hundred thousand; the ladoum, we saw
    it on television, a million and more. My animals are good too, waay. Next year, inchallah, I'm
    doing eight and going down to Dakar myself. If I make two hundred and fifty thousand a head, you
    see what that gives. The coxeur, he takes them and he goes up; what he does with them up there is
    no business of mine.

inputs:

  # ---- scale, animals, cohorts ----
  heads_bought_c1:
    value: 6
    unit: head
    prov: STATED
    source: "\"Cette année j'en ai fait six.\" Independently corroborated by his own sale tally: 3 to the coxeur + 2 at the foirail + 1 left over = 6."
    date: "2026-07-29"
  heads_bought_c2:
    value: 6
    unit: head
    prov: ELICITED
    source: "Base holds the scale he has actually executed. He states an intention of eight — \"l'année prochaine, inchallah, j'en fais huit\" — but conditions it on a Dakar channel he has never used and a price he has only seen on television. Modelling the eight would be modelling the plan, not the business. Wired: sum(trace.head_bought)."
    question: "Pour janvier prochain, avez-vous déjà mis l'argent de côté pour acheter huit béliers au lieu de six — et est-ce que l'enclos en tient huit ?"
    range: {low: 6, high: 8}
    materiality: high
    date: "2026-07-29"
  premium_heads_c1:
    value: 1
    unit: head
    prov: STATED
    source: "\"cette année j'en ai payé UN soixante mille parce qu'il était déjà gros\" — one head, explicitly singular."
    date: "2026-07-29"
  ram_price_standard:
    value: 50000
    unit: XOF/head
    prov: STATED
    source: "\"Cinquante mille la bête, des fois quarante-cinq.\" The 50,000 is his headline figure; the 45,000 is his own stated downside and is not the modal price."
    date: "2026-07-29"
  ram_price_premium:
    value: 60000
    unit: XOF/head
    prov: STATED
    source: "\"j'en ai payé un soixante mille\""
    date: "2026-07-29"
  purchase_cost_c1:
    value: 310000
    unit: XOF
    prov: INFERRED
    derivation: "(heads_bought_c1 - premium_heads_c1) * ram_price_standard + premium_heads_c1 * ram_price_premium"
    source: "Five head at the standard price plus the one premium head he identifies."
    date: "2026-07-29"
  purchase_cost_c2:
    value: 300000
    unit: XOF
    prov: INFERRED
    derivation: "heads_bought_c2 * ram_price_standard"
    source: "Cycle 2 priced at the standard rate throughout: the premium head was a one-off he explains by that animal's condition, not a recurring mix."
    date: "2026-07-29"
  unsold_heads_c1:
    value: 1
    unit: head
    prov: STATED
    source: "\"Il m'en restait un la veille au soir. Celui-là est encore là. Il mange.\""
    date: "2026-07-29"
  baptism_heads_per_year:
    value: 2
    unit: head/year
    prov: ELICITED
    source: "Low end of his stated \"deux, trois\", taken because he immediately qualifies the trade as marginal — \"ça fait vivre, ça ne fait pas gagner\". Wired: sum(trace.head_bought)."
    question: "Entre cette Tabaski et la prochaine, vous en avez fait tourner combien pour les baptêmes — deux, ou trois ?"
    range: {low: 2, high: 3}
    materiality: low
    date: "2026-07-29"
  baptism_hold_months:
    value: 3
    unit: month
    prov: ELICITED
    source: "Never stated. \"Je fais tourner\" implies a short cycle; 3 months is the mid-point of a plausible turn and is the value at which the arithmetic reproduces his own verdict on the trade. Wired: sum(trace.head_fed_baptism)."
    question: "Une bête que vous prenez pour un baptême, vous la gardez combien de temps avant de la vendre au boucher ?"
    range: {low: 2, high: 5}
    materiality: medium
    date: "2026-07-29"

  # ---- mortality (stock loss on the live animals) ----
  mortality_rate_cycle:
    value: 0.10
    unit: ratio per 4-month campaign
    prov: STATED
    source: "\"Il faut compter qu'il y en a un sur dix qui peut ne pas arriver à la fête.\" His own long-run tally is close: \"en quatre ans j'en ai perdu deux\"."
    date: "2026-07-29"
  fattening_months:
    value: 4
    unit: month
    prov: STATED
    source: "\"le vrai travail c'est les quatre mois avant la fête\"; \"un sac et demi sur les quatre mois\"."
    date: "2026-07-29"
  mortality_rate_monthly_finishing:
    value: 0.025
    unit: ratio/month on head at risk
    prov: INFERRED
    derivation: "mortality_rate_cycle / fattening_months"
    source: "His one-in-ten is a whole-campaign figure. Spread as a monthly hazard on the head ACTUALLY AT RISK, which falls as animals die: compounding over four months gives a cumulative loss of 9.63%, not 10%. The 0.37pp gap is the difference between a rate on a draining stock and a flat charge, and it is stated here rather than absorbed."
    date: "2026-07-29"
  mortality_rate_monthly_maintenance:
    value: 0.005
    unit: ratio/month on head at risk
    prov: ELICITED
    source: "Both losses he reports were bloat — \"un ballonnement\" — which is a concentrate-fed finishing disease, so the out-of-window hazard on a maintenance animal is materially lower but not zero. 0.005 is a fifth of the finishing hazard. Wired: trace.head_died for t >= credit_settle_c1_index."
    question: "Les années où vous avez gardé un bélier jusqu'à la Tabaski suivante, ou les bêtes de baptême — en avez-vous perdu en dehors des quatre mois avant la fête ?"
    range: {low: 0, high: 0.025}
    materiality: low
    date: "2026-07-29"
  mortality_c1_actual:
    value: 0
    unit: head
    prov: STATED
    source: "Declared zero, not assumed zero. Cycle 1 is observed and his own tally closes exactly — 6 bought, 3 + 2 + 1 accounted for at the feast — and he reports no death this year; his two deaths are spread over four years. Rule: a stock that carries zero loss must say zero and say why."
    date: "2026-07-29"

  # ---- weights and growth ----
  entry_weight_low:
    value: 25
    unit: kg
    prov: STATED
    source: "\"dans les vingt-cinq, trente kilos\""
    date: "2026-07-29"
  entry_weight_high:
    value: 30
    unit: kg
    prov: STATED
    source: "\"dans les vingt-cinq, trente kilos\""
    date: "2026-07-29"
  entry_weight_kg:
    value: 27.5
    unit: kg
    prov: INFERRED
    derivation: "(entry_weight_low + entry_weight_high) / 2"
    source: "Mid-point of the stated band; he gives no distribution within it."
    date: "2026-07-29"
  weight_gain_cycle_low:
    value: 10
    unit: kg
    prov: STATED
    source: "\"le bélier prend ses dix, douze kilos\""
    date: "2026-07-29"
  weight_gain_cycle_high:
    value: 12
    unit: kg
    prov: STATED
    source: "\"le bélier prend ses dix, douze kilos\""
    date: "2026-07-29"
  weight_gain_cycle:
    value: 10
    unit: kg
    prov: STATED
    source: "Low end of his stated band, taken deliberately: the ration he describes (0.616 kg/day of cake plus roughage to a little over a kilo total) carries enough energy for the ten and not for the twelve. Taking the twelve would require intake he does not describe or grazing he does not have — \"je n'ai pas de champ\"."
    date: "2026-07-29"
  exit_weight_kg:
    value: 37.5
    unit: kg
    prov: INFERRED
    derivation: "entry_weight_kg + weight_gain_cycle"
    source: "Entry plus gain. Note this does NOT reproduce his stated exit weight — see stated_exit_weight_high and the closure finding in notes."
    date: "2026-07-29"
  stated_exit_weight_high:
    value: 45
    unit: kg
    prov: STATED
    source: "\"il arrive à quarante, quarante-cinq pour les beaux\". Carried solely to assert the closure gap: 30 + 12 = 42 < 45, so his own three numbers cannot all hold for the same animal."
    date: "2026-07-29"
  days_per_month:
    value: 30.4375
    unit: day/month
    prov: DEFAULTED
    source: "Gregorian mean month, 365.25 / 12. Convention named because every daily rate in this model is converted through it."
    date: "2026-07-29"
  adg_g_per_day:
    value: 82.135523613963
    unit: g/day
    prov: INFERRED
    derivation: "weight_gain_cycle * 1000 / (fattening_months * days_per_month)"
    source: "Average daily gain implied by his own stated gain over his own stated window."
    date: "2026-07-29"
  adg_benchmark_semi_intensive_low:
    value: 40
    unit: g/day
    prov: SOURCED
    source: "Lower bound of the semi-intensive/extensive regime for Sahelian rams. Used to bracket the ADG this model implies (fact_id SN-OV-05)."
    authority: "STAMP-Mali fiche technique; Nantoumé et al. 2012, LRRD 24(11); Buldgen et al. 1992, Rev. Élev. Méd. Vét. Pays Trop. 45:321–328; CIRDES/RECA-Niger; Sanon & Traoré 2014, LRRD 26(10). Two regimes reported and explicitly not to be averaged: intensive short-cycle (75–120 d) 75–175 g/day; semi-intensive/extensive 40–85 g/day."
    verified: "2026-07-29"
  adg_benchmark_intensive_high:
    value: 175
    unit: g/day
    prov: SOURCED
    source: "Upper bound of the intensive short-cycle regime (fact_id SN-OV-05)."
    authority: "As adg_benchmark_semi_intensive_low: STAMP-Mali; Nantoumé et al. 2012 LRRD 24(11) (Kayes 147–175 g/day over 75 d); CRRA Sotuba 81–134 g/day over 90 d."
    verified: "2026-07-29"

  # ---- concentrate feed ----
  sack_weight_kg:
    value: 50
    unit: kg/sack
    prov: STATED
    source: "\"le sac de cinquante kilos\""
    date: "2026-07-29"
  sack_price_cash:
    value: 15000
    unit: XOF/sack
    prov: STATED
    source: "\"quinze mille en ce moment\" — the cash price, and therefore the cash-equivalent cost of the feed under IAS 2.18."
    date: "2026-07-29"
  sack_price_credit:
    value: 16500
    unit: XOF/sack
    prov: STATED
    source: "\"le sac à seize mille cinq cents au lieu de quinze mille\", payable after the feast."
    date: "2026-07-29"
  sack_price_prior_year:
    value: 12000
    unit: XOF/sack
    prov: STATED
    source: "\"l'année dernière c'était douze\". Carried to record the observed input inflation, which the base case does NOT project forward."
    date: "2026-07-29"
  feed_price_inflation_observed:
    value: 0.25
    unit: ratio year-on-year
    prov: INFERRED
    derivation: "(sack_price_cash - sack_price_prior_year) / sack_price_prior_year"
    source: "The one price change he actually observed. Held out of the forecast — the model runs in constant current-year prices on both sides — and reported as a finding."
    date: "2026-07-29"
  concentrate_price_cash_per_kg:
    value: 300
    unit: XOF/kg
    prov: INFERRED
    derivation: "sack_price_cash / sack_weight_kg"
    source: "Cash-equivalent price at which inventory is recognised."
    date: "2026-07-29"
  concentrate_price_credit_per_kg:
    value: 330
    unit: XOF/kg
    prov: INFERRED
    derivation: "sack_price_credit / sack_weight_kg"
    source: "Deferred-settlement price. The 30 XOF/kg spread is the financing element, not a cost of inventory."
    date: "2026-07-29"
  sacks_per_head_cycle:
    value: 1.5
    unit: sack/head/campaign
    prov: STATED
    source: "\"Un bélier me fait un sac et demi sur les quatre mois\""
    date: "2026-07-29"
  concentrate_kg_per_head_cycle:
    value: 75
    unit: kg/head/campaign
    prov: INFERRED
    derivation: "sacks_per_head_cycle * sack_weight_kg"
    source: "His sack-and-a-half in kilograms."
    date: "2026-07-29"
  concentrate_kg_per_head_month:
    value: 18.75
    unit: kg/head/month
    prov: INFERRED
    derivation: "concentrate_kg_per_head_cycle / fattening_months"
    source: "Spread evenly over the four-month window; he describes no step-up. Equals 0.616 kg/day."
    date: "2026-07-29"
  total_intake_kg_per_head_day:
    value: 1.1
    unit: kg/head/day
    prov: ELICITED
    source: "He states a floor, not a value — \"avec la fane il mange plus d'un kilo par jour\". 1.1 is the minimal reading of \"plus d'un kilo\", i.e. the choice that adds least to what he said. It sets the roughage draw, and through it the size and drawdown of the haulm store. Wired: roughage_kg_per_head_month, trace.haulm_fed_kg."
    question: "La fane et le son — un bélier vous mange combien de bottes dans une semaine ?"
    range: {low: 1.0, high: 1.5}
    materiality: medium
    date: "2026-07-29"
  total_intake_kg_per_head_month:
    value: 33.48125
    unit: kg/head/month
    prov: INFERRED
    derivation: "total_intake_kg_per_head_day * days_per_month"
    source: "Total dry-matter intake per finishing head-month."
    date: "2026-07-29"
  roughage_kg_per_head_month:
    value: 14.73125
    unit: kg/head/month
    prov: INFERRED
    derivation: "total_intake_kg_per_head_month - concentrate_kg_per_head_month"
    source: "THE RATION CLOSES: total intake less the concentrate he specifies leaves the haulm-and-bran fraction. Concentrate 18.75 kg + roughage 14.73125 kg = 33.48125 kg per finishing head-month, 56% concentrate by mass. Nothing is left unaccounted."
    date: "2026-07-29"
  maintenance_concentrate_fraction:
    value: 0.5
    unit: ratio of finishing rate
    prov: ELICITED
    source: "Never stated. Half the finishing rate is a middle choice: the carried ram is off the finishing programme but he insists it still eats — \"il mange\". Roughage is held at the finishing rate, so the maintenance ration totals 24.1 kg/month (0.79 kg/day), which is a coherent maintenance intake for a 40 kg ram. Wired: concentrate_kg_per_head_month_maintenance, trace.concentrate_kg."
    question: "Le bélier qui vous reste — il reçoit combien de tourteau par mois maintenant, par rapport à un bélier dans les quatre mois avant la fête ?"
    range: {low: 0, high: 1.0}
    materiality: medium
    date: "2026-07-29"
  concentrate_kg_per_head_month_maintenance:

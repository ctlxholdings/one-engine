passage: |
  ==================================================================================================
  0. WHAT THIS BUSINESS IS, IN ITS OWN UNITS
  ==================================================================================================
  The natural quantities here are the HEAD and the CAMPAIGN, not the tonne or the year. A campaign
  is: buy young bali-bali rams at the louma in January, feed them four months, sell them in the
  three days around Tabaski. Between campaigns he turns over a couple of animals for baptisms. The
  plant is an enclosure and a shelter; the only machine is a hired pickup, twice.

  Two things about this operation resist standard line items, and I keep the founder's description
  rather than force them:

  (i) GROWTH AND PRICE ARE ONE MOVEMENT. He says so directly: "mon mouton grossit et le prix monte
  en même temps, tu ne peux pas les séparer." A conventional model would split revenue into
  volume x price and let each move. Here the two are the same seasonal fact, and the split is
  false. So Tabaski revenue is modelled per HEAD at the prices he actually realised, and weight
  enters only where he says weight is what is paid for — the butcher, outside the feast ("hors
  fête le boucher te compte au poids"). At the feast, "personne ne pèse rien, on regarde la bête,
  les cornes, la robe."

  (ii) THE PRICE DOES NOT DECAY, IT VANISHES. "Ce n'est pas que ça descend doucement — le lendemain
  matin personne ne veut plus de bélier." This is not a demand curve; it is a fixed-date religious
  obligation. So there is no price path after t=5. The animal that did not sell has exactly two
  exits, and the model takes the one he took: hold to the next feast, twelve months away.

  ==================================================================================================
  1. PHYSICAL CLOSURE (a) — THE RATION BALANCES
  ==================================================================================================
  He gives two feed facts. A ram gets through 1.5 sacks of groundnut cake over the four months, and
  the sack is 50 kg. So the concentrate is 1.5 x 50 = 75 kg per head per campaign, and over four
  months 75 / 4 = 18.75 kg per head-month, which at 30.4375 days is 0.616016 kg/day.

  Second fact: "avec la fane il mange plus d'un kilo par jour." That is a FLOOR, not a value. Taking
  the minimal reading of "plus d'un kilo" — 1.1 kg/day — total intake is 1.1 x 30.4375 = 33.48125 kg
  per head-month. The balance closes:

      concentrate   18.75000 kg/head-month   (56.0%)
      roughage      14.73125 kg/head-month   (44.0%)   <- groundnut haulm + millet bran
      ------------------------------------------------
      total         33.48125 kg/head-month  (100.0%)

  Nothing is discarded into a yield ratio. The roughage figure is not an assumption laid on top of
  his words; it is what his own two statements leave over when they are made to sum.

  A TRANSFORMATION THIS MODEL DELIBERATELY DOES NOT CLOSE, and says so: feed into carcass. He sells
  LIVE animals — to the coxeur, at the foirail, to the butcher. Dressing-out yield, offal and the
  fifth quarter belong to whoever slaughters, not to him. Closing that balance would import a
  transformation that happens outside his boundary and would make the model appear to know
  something it does not.

  The conversion he does own is feed into liveweight. Over the campaign a head takes 4 x 33.48125 =
  133.925 kg of dry matter for 10 kg of gain — a conversion ratio around thirteen to one. That is
  high against concentrate-fed feedlot lambs and entirely ordinary for a roughage-heavy Sahelian
  ration, which is what he describes. It is also why the low end of his stated gain is the one this
  model runs on (see section 2).

  ==================================================================================================
  2. GROWTH — AND WHERE HIS OWN THREE NUMBERS DO NOT MEET
  ==================================================================================================
  He gives entry weight 25-30 kg, gain 10-12 kg, exit weight 40-45 kg "pour les beaux". Take the
  mid-point entry, 27.5 kg, and the low gain, 10 kg: exit 37.5 kg.

  Now test his numbers against each other. The most generous combination he permits is 30 kg entry
  plus 12 kg gain = 42 kg. His stated top exit weight is 45 kg. THE THREE STATEMENTS DO NOT CLOSE:
  no animal that starts inside his entry band and gains inside his gain band arrives at 45 kg. The
  40 kg is reachable; the 45 is not. This is a finding about the description, not a rounding, and it
  is asserted in checks rather than smoothed away. The likeliest reading is that "quarante-cinq pour
  les beaux" describes the exceptional animal — the one he paid 60,000 for because "il était déjà
  gros" — and not the cohort.

  Average daily gain implied: 10,000 g / (4 x 30.4375 days) = 82.135524 g/day. That sits inside the
  published Sahelian bands — above the semi-intensive floor of 40 g/day, well below the intensive
  ceiling of 175 g/day — which is exactly where a concentrate-supplemented but not full-feedlot
  operation should sit. The claimed gain fits the claimed ration.

  ==================================================================================================
  3. PHYSICAL CLOSURE (b) — EVERY STOCK DECLARES ITS LOSS
  ==================================================================================================
  There are three stocks. Each states its loss rate and what that rate acts on.

  LIVE ANIMALS. He states one in ten will not make it to the feast. That is a whole-campaign figure,
  so it becomes a monthly hazard of 0.10 / 4 = 0.025 applied to the head ACTUALLY ALIVE at the start
  of each month. Because the stock drains, four months of compounding gives a cumulative loss of
  9.6312%, not 10.0000%. The 0.37 percentage-point gap is precisely the difference between a rate on
  a draining stock and a flat charge, and it is stated rather than absorbed. Outside the finishing
  window the hazard is lower — both his losses were bloat, a concentrate disease — so a maintenance
  hazard of 0.005/month is carried and flagged as a question for him.

      CYCLE 1 CARRIES ZERO MORTALITY, AND SAYS WHY. It is observed, not forecast: he bought six and
      his own tally at the feast is three plus two plus one. Nobody died this year. His two losses
      are spread across four years. Silence would have been the failure; the zero is declared.

  THE HAULM STORE. Bought in bales in December, fed out through May, and in the second cycle bought
  again in December. Up to five months in store against leaf shatter, termites, rodents and wind.
  2% per month, applied to the OPENING stock, so the charge falls as the store empties: 12.400 kg in
  the first month, 1.085 kg in the twelfth. A flat monthly charge would have overstated the tail by
  a factor of eleven. Over the horizon: 1,240.000 kg bought, 950.586975 kg fed, 115.974598 kg lost,
  173.438427 kg still in store at the end. Those four numbers sum, and the sum is asserted.

  RECEIVABLES ARE ZERO, AND THAT IS DECLARED TOO. The coxeur paid "cash"; the foirail is a cash
  market; the butcher pays on the spot. No sale in this business is on terms, so there is nothing to
  leak. Zero, with a reason.

  ==================================================================================================
  4. PHYSICAL CLOSURE (c) — THE CLAIMED OUTPUT FITS THE PLANT
  ==================================================================================================
  THE PEN. Peak occupancy in this model is 6.960693 head, at t=13 and t=14, when the second cohort
  arrives while the carried ram is still there. He plans eight, which implies he believes eight fit.
  6.96 <= 8: the base case fits, and the constraint binds only on his expansion.

  THE HELPER. "Matin et soir", two sessions. At an hour each and a routine fifteen minutes per head
  per day for feeding, watering, mucking out and inspection, peak demand is 6.960693 x 15 = 104.41
  minutes against 120 minutes available. It fits, with about a quarter of an hour of slack — which
  means that at the eight head he plans, the two hours are fully consumed and any illness, funeral
  or competing job breaks the routine outright. He has no second helper.

  THE PICKUP. He hires a bâchée three ways for the foirail. He takes two head; if all three renters
  bring the same, that is 6 head at 37.5 kg = 225 kg against a one-tonne payload, and roughly 1.8 m2
  of floor for animals of this size against a bed of about 2.7 m2. Both fit comfortably. The vehicle
  is not the constraint in this business.

  AVAILABILITY. There is no machine here to break down, and that is the point: the availability
  constraint in this operation is not mechanical, it is CALENDRICAL. Demand exists for about three
  days a year. Nothing runs at 100%, and this runs at roughly 1%. The helper can fall ill and the
  animals still eat; the feast cannot be rescheduled.

  ==================================================================================================
  5. ACCOUNTING POLICY, AND THREE PLACES IT MATTERS
  ==================================================================================================
  MEASUREMENT OF THE ANIMALS. Live rams held for sale are biological assets. Under IAS 41 they would
  be carried at fair value less costs to sell, with the gain recognised AS IT ACCRUES — which is
  literally the founder's own account of his business, growth and price moving together. I measure
  at COST instead, and state the trade: cost keeps the cash and the physical stock aligned and makes
  every step re-checkable, and the choice is FCFF-NEUTRAL because a fair-value gain is non-cash and
  reverses at sale. His remark that "au mois de février le même animal, personne ne te regarde"
  is also a plain statement that the feast-market price does not exist between feasts. IAS 2.23
  specific identification is used rather than weighted average: these animals are not
  interchangeable — he prices one at 60,000 because of its condition, and one of them has a name.

  RAMS ARE INVENTORY, NOT CAPEX. They are bought to be sold within four months. They flow through
  working capital, and capex over this horizon is zero. Only the pen and shelter are PP&E.

  THE FEED CREDIT IS FINANCING, NOT COST. He is offered the sack at 15,000 cash or 16,500 payable
  after the feast. Under IAS 2.18 the difference between the normal-credit price and the deferred
  price is a financing element and is recognised as interest, not in the cost of inventories. So
  inventory and the payable are both carried at the 15,000-equivalent (300 XOF/kg), and the
  1,500-a-sack spread is interest. BECAUSE FCFF IS UNLEVERED, THAT INTEREST IS EXCLUDED FROM IT. It
  is not thereby hidden: it is materialised as trace.implicit_interest and rolled into
  trace.cash_out_total, so the difference between the unlevered measure and the money that actually
  leaves his hand is visible on the face of the trace. Over the horizon it is 28,583.978169.

  THE HELPER'S WAGE IS ABSORBED ONLY UP TO NORMAL CAPACITY. Under IAS 2.13 fixed production overhead
  is allocated on the normal level of activity, and unallocated overhead is expensed as incurred. He
  pays the same 10,000 whether six rams are in the pen or one. Normal capacity is six. So in the
  empty months only a sixth or a third of the wage attaches to the animals and the rest is expensed
  — which is both the correct treatment and the one that stops the carried ram from absorbing an
  entire year of wages it did not cause. Transport to the foirail is a SELLING cost and is expensed
  under IAS 2.16(d), never capitalised into the animals.

  ==================================================================================================
  6. TAX — WHERE HIS BELIEF AND THE LAW AGREE, AND WHERE THEY MIGHT NOT
  ==================================================================================================
  He says: "Je ne paie rien là-dessus. C'est de l'élevage. Personne ici ne paie rien sur des moutons.
  Il paraît qu'il faut une patente quand on fait du commerce, mais moi je ne fais pas du commerce."

  The outcome is right. The reasoning is not the law's, and the difference matters.

    INCOME TAX. Livestock profits are bénéfices de l'exploitation agricole (CGI art. 153), and
    cultivateurs are exempt on the livestock they raise (art. 154). He is a natural person, so the
    30% corporate rate and its minimum-tax floor never reach him. Rate applied: ZERO.

    CEL (the patente's successor). He half-knows this one. The exemption does not turn on whether he
    is a trader — it names fattening in terms: cultivateurs are exempt for livestock they raise,
    maintain, or "qu'ils y engraissent" (art. 322.3°, loi 2018-10). That is embouche, his word for
    what he does. Rate applied: ZERO, on a better ground than the one he offers.

    VAT. Agriculture is hors champ (art. 352) — outside the field of application entirely, which is
    stronger than exempt. No output tax, no input credit, and every price he quotes is what he pays.

    PROPERTY TAX. Buildings housing animals are exempt (arts. 285.7°, 298.5°). The pen bears nothing.

  SO THE TAX LINE IS ZERO IN EVERY PERIOD, AND NOPAT EQUALS EBIT. One consequence worth naming: with
  tax at zero, depreciation is FCFF-neutral — it is subtracted in NOPAT and added straight back — so
  the useful life of the pen moves EBIT and book value and moves free cash flow not at all.

  THE ONE OPEN QUESTION. Art. 322.3° names FATTENING; art. 154 says "le bétail qu'ils y ÉLÈVENT" —
  raise. The asymmetry is in the code, not in my reading of it. Whether four-month embouche of
  animals bought at the louma is élevage or purchase-and-resale is the single thing that could move
  this line, and his own words cut both ways: "moi je ne fais pas du commerce" against "ce que
  j'achète, je le vends, c'est ma règle" — which is, on its face, a description of trading. If it
  resolved to BIC, the synthetic CGU at 2% of turnover is what would reach him; that is carried as
  trace.contingent_cgu and never enters FCFF. Note also that the CGU's list of represented taxes is
  drawn on the BIC and never names the BA, so even then the answer is not automatic.

  TWO RULES HE HAS NOT HEARD OF, RECORDED BECAUSE A FALSE ZERO SURVIVES EVERY ARITHMETIC CHECK.
  First, since October 2025 there is a 1% stamp on cash payments; the coxeur paid him 330,000 in
  cash. Applied at zero — he is outside the VAT field, unregistered, issues no invoice and receives
  rather than makes the payment — with the reasoning set out so a reader can disagree. Second, an
  employer owes roughly 17.1% of gross to IPRES and the CSS. The lad is paid monthly and works
  morning and evening. Nothing suggests he is declared. Modelled at zero because that is how the
  business runs, and materialised as trace.contingent_social_charges so the exposure is a column a
  reader can act on rather than a sentence.

  ==================================================================================================
  7. THE DERIVATION, PERIOD BY PERIOD
  ==================================================================================================
  t=0  DECEMBER 2025 — the harvest lot.
    Buys the haulm: 620 kg for 40,000, so 64.516129 XOF/kg. Pays the helper 10,000; there are no
    animals yet, so under IAS 2.13 none of it is absorbed and all 10,000 is expensed. Depreciation
    2,083.333333. EBITDA -10,000; EBIT -12,083.333333; tax 0; NOPAT -12,083.333333.
    NWC = 40,000 (the haulm store) + 0 livestock - 0 payable = 40,000. Delta NWC = 40,000.
    FCFF = -12,083.333333 + 2,083.333333 - 40,000 - 0 = -50,000. Cash agrees: 0 in, 50,000 out.

  t=1  JANUARY 2026 — the louma.
    Six rams: five at 50,000 and the one he paid 60,000 for = 310,000. Salt and deworming 6 x 4,000
    = 24,000. Helper 10,000, fully absorbed now that the pen is at normal capacity. Inventory
    additions 344,000. The store loses 2% of 620 = 12.400 kg (800 XOF); no feeding yet — he buys at
    the louma late in the month and the four-month programme runs February to the feast.
    EBIT -2,883.333333. Delta NWC 343,200. FCFF = -344,000.

  t=2, t=3, t=4  FEBRUARY–APRIL 2026 — the campaign.
    Each month: concentrate 6 x 18.75 = 112.5 kg, taken on credit, recognised at the cash-equivalent
    300 XOF/kg = 33,750 into both inventory and the payable. Roughage 6 x 14.73125 = 88.3875 kg
    drawn from the store at 64.516129 = 5,702.419355. Helper 10,000, absorbed. Additions
    49,452.419355 a month. Store loss falls as the store drains: 12.152, 10.141210, 8.170636 kg.
    No revenue, no mortality (cycle 1 is observed). EBIT about -2,900 a month, being the store loss
    and depreciation. THE ONLY CASH THAT MOVES IS THE WAGE: FCFF = -10,000 in each of the three
    months. This is the whole point of the feed credit — it carries the campaign.

  t=5  MAY 2026 — TABASKI 1 (28 May).
    Final month of feed on the same terms. Then the sales, all in a three-day window:
        coxeur, three days before, cash        3 x 110,000 = 330,000
        foirail                                     120,000 + 135,000 = 255,000
        ------------------------------------------------------------------
        revenue                                                585,000  (5 head, 117,000 average)
        one head unsold

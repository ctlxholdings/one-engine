  haulm_lot_kg:
    value: 620
    unit: kg/lot
    prov: ELICITED
    source: "He prices the lot but never quantifies it. 620 kg is the smallest lot that keeps the store non-negative right through to the next harvest on the base ration — so the base is the tightest lot consistent with the operation running at all, and any smaller answer is a finding that he runs short. Wired: haulm_price_per_kg, sum(trace.haulm_bought_kg)."
    question: "Les quarante mille de fane, ça fait combien de bottes — et une botte, elle pèse combien à peu près ?"
    range: {low: 400, high: 1000}
    materiality: medium
    date: "2026-07-29"
  haulm_price_per_kg:
    value: 64.516129032258
    unit: XOF/kg
    prov: INFERRED

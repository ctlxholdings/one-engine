      FCFF                          59,130.079894

  Fifty-nine thousand francs of unlevered free cash flow on 1.46 million of turnover — four percent
  — from an operation that at its deepest point has half a million tied up, AND BEFORE ANY CHARGE
  FOR HIS OWN LABOUR, which is why that charge is materialised as its own column at zero rather than
  left unsaid.

  NOW THE NUMBER THAT EXPLAINS IT. Split the second feast's sales:
      the six-head cohort:  cost 474,632.596   proceeds 634,388.899   margin  +159,756.303
      the carried ram:      cost 147,371.796   proceeds 101,575.500   margin   -45,796.295

  THE ONE RAM HE DID NOT SELL ON THE NIGHT DESTROYS 45,796 FRANCS — seventy-seven percent of
  everything the business generates over eighteen months. It cost 90,302 at the feast it missed;
  twelve months of feed, salt and its share of the wage took it to 147,372; and it comes back to
  market at the same 117,000 the fresh animals fetch, with a quarter of an expected animal lost to
  hazard along the way. Nothing about this is a modelling artefact — it is arithmetic on his own
  numbers, and it is why he says "la nuit d'avant, moi, je ne dors pas."

  The published work says the same thing from the other side: holding feed and costs fixed, selling
  at the ordinary price instead of the Tabaski price turns the result negative in three of four
  scenarios. That is the referee for this mechanism, and this model reproduces it independently
  from a single founder's account of a single year.

  Two more totals worth stating because they are the same size as the answer. The trade credit cost
  28,583.978169 over the horizon — excluded from FCFF because FCFF is unlevered, but roughly half of
  it. And if the regime question resolved the wrong way, the CGU at 2% of turnover would take
  29,199.866117. Either one is half this business's free cash flow. Neither is in the headline.

  ==================================================================================================
  9. PHYSICAL CLOSURE (d) — CUMULATIVE QUANTITIES TESTED AGAINST THE WORLD
  ==================================================================================================
  CONCENTRATE. 1,136.210753 kg over the horizon, or 22.724215 fifty-kilo sacks. Test it against his
  own rule of thumb: a sack and a half a head. Thirteen head entered a campaign over this horizon
  (six, six, and the carried one), which caps campaign concentrate at 13 x 75 = 975 kg. Actual
  concentrate taken on credit: 952.799272 kg. It sits under the cap and above the cap net of his
  own mortality rate. His rule of thumb and eighteen months of month-by-month feeding agree.

  HAULM. 1,240 kg bought, 950.586975 fed, 115.974598 lost in store, 173.438427 remaining. Sums.

  THE PLANT'S REMAINING LIFE. The pen was three years old at t=0 and has a ten-year life, so 84
  months remain against an 18-month horizon. No replacement falls inside the frame and capex is
  legitimately zero — which is a statement I can only make by computing it. Book value runs from
  172,916.666667 down to 137,500 and never approaches zero.

  HEAD. Fourteen animals entered, 13.144013 were sold and 0.855987 died; nothing is left alive at
  the horizon end. Cumulative mortality is 6.11% of head bought, below his one-in-ten, because more
  than half the horizon's animal-months are outside the finishing window where his hazard applies.

  THE TRIPS. Two pickup hires in eighteen months, one per feast. At 6 head across three renters that
  is 225 kg against a tonne. This operation is nowhere near any physical limit except one: the
  three days in the year when anyone wants what it produces.


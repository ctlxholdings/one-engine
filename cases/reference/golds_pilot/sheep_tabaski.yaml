  # ---- tax and regime ----
  regime_basis:
    value: "BA"
    unit: regime label
    prov: ELICITED
    source: "STRUCTURAL, and wired through income_tax_rate (trace.tax) and the contingent CGU column (trace.contingent_cgu), so a different answer produces different numbers in both. The exposure is an asymmetry in the code itself: for the CEL, art. 322.3° exempts cultivateurs for livestock \"qu'ils y engraissent\" — fattening, named explicitly. For income tax, art. 154 exempts them on \"le bétail qu'ils y élèvent\" — raise, not fatten. Whether four-month embouche of bought-in animals is élevage or purchase-resale is the single open question in his position, and his own words cut both ways: \"moi je ne fais pas du commerce\" against \"ce que j'achète, je le vends, c'est ma règle\"."
    question: "Les béliers, vous les achetez tous au louma — ou est-ce qu'il y a des brebis chez vous qui mettent bas et que vous élevez depuis la naissance ?"
    range: {low: "BA — bénéfices de l'exploitation agricole, exonéré (CGI art. 154)", high: "BIC — achat-revente, CGU à 2% du chiffre d'affaires"}
    materiality: high
    date: "2026-07-29"
  income_tax_rate:
    value: 0.0
    unit: ratio of EBIT
    prov: SOURCED
    source: "The founder's belief and the law agree on the outcome and disagree on the reason. He says \"Je ne paie rien là-dessus. C'est de l'élevage.\" The law's route is: profits from livestock are bénéfices de l'exploitation agricole (art. 153), and cultivateurs are exempt from income tax on the livestock they raise (art. 154). He is a natural person, so the 30% IS and the minimum-tax floor that goes with it do not reach him at all (fact_id SN-TAX-11, SN-TAX-13)."
    authority: "Sénégal, Code général des impôts, art. 153 (les bénéfices de l'élevage constituent des bénéfices de l'exploitation agricole) et art. 154 (exonération d'impôt sur le revenu pour \"le bétail qu'ils y élèvent\"), édition annotée janvier 2023."
    verified: "2026-07-29"
  cel_rate:
    value: 0.0
    unit: ratio
    prov: SOURCED
    source: "The most on-point provision in his whole position, and the one he half-knows: \"il paraît qu'il faut une patente quand on fait du commerce, mais moi je ne fais pas du commerce\". He is right that he owes no CEL, but not for the reason he gives — the exemption does not turn on whether he is a trader, it names fattening in terms (fact_id SN-TAX-12)."
    authority: "Sénégal, CGI art. 322.3°, loi n° 2018-10 du 30 mars 2018 instituant la contribution économique locale en remplacement de la patente — exonération des cultivateurs pour le bétail qu'ils élèvent, entretiennent ou \"qu'ils y engraissent\"."
    verified: "2026-07-29"
  vat_rate_applicable:
    value: 0.0
    unit: ratio
    prov: SOURCED
    source: "Agriculture is outside the field of application of VAT entirely — stronger than exempt, because there is no exempt-supply machinery to argue about. Consequence for this model: no VAT on his sales, no input VAT to recover, and every input price he quotes is simply the price he pays, with any embedded tax irrecoverable and therefore part of cost (fact_id SN-TAX-14)."
    authority: "Sénégal, CGI art. 352, loi n° 2015-06 du 23 mars 2015 — l'agriculture est hors du champ d'application de la TVA."
    verified: "2026-07-29"
  property_tax_rate:
    value: 0.0
    unit: ratio
    prov: SOURCED
    source: "The pen and the shelter bear no property tax (fact_id SN-TAX-15)."
    authority: "Sénégal, CGI arts. 285.7° et 298.5° — exonération de contribution foncière des propriétés bâties et non bâties pour les bâtiments et terrains servant au logement des animaux."
    verified: "2026-07-29"
  cash_stamp_duty_rate_statutory:
    value: 0.01
    unit: ratio of a cash payment
    prov: SOURCED
    source: "A live world-fact that touches him: the coxeur paid him 330,000 in cash. Recorded because a rule he has never heard of is exactly the kind that survives every internal consistency check (fact_id SN-V25-14)."
    authority: "Sénégal, loi n° 2025-17 du 27 septembre 2025 modifiant certaines dispositions de la loi n° 2012-31 portant Code général des impôts, JO du 2 octobre 2025 — droit de timbre de 1% sur les paiements en espèces."
    verified: "2026-07-29"
  cash_stamp_duty_rate_applied:
    value: 0.0
    unit: ratio
    prov: SOURCED
    source: "Applied at zero. The duty attaches to cash settlement of invoiced receipts by persons within the tax net; he is outside the field of VAT, is unregistered, issues no invoice and receives the cash rather than paying it. Recorded as belief-versus-law: what he believes is a fact about his business; what the instrument says is a fact about the world; here they coincide, and the reasoning is set out so a reader can disagree with it."
    authority: "Sénégal, loi n° 2025-17 du 27 septembre 2025, lue avec CGI art. 352 (agriculture hors champ de la TVA)."
    verified: "2026-07-29"
  cgu_rate_if_bic:
    value: 0.02
    unit: ratio of turnover
    prov: SOURCED
    source: "CONTINGENT ONLY — materialised as trace.contingent_cgu, never in FCFF. This is what would reach him if the regime question above resolved the other way. Note the structural point: the CGU is defined as representative of the BIC profits tax and the BA is never listed among the taxes it replaces, so whether it can reach a BA taxpayer at all is open on the text (fact_id SN-TAX-10, SN-TAX-16). His turnover is far below the 50,000,000 ceiling, so the threshold is not the issue; the classification is."
    authority: "Sénégal, DGID — contribution globale unique, 2% du chiffre d'affaires pour le commerce, seuil de chiffre d'affaires 50 000 000 XOF; CGI arts. 134–136 pour la liste limitative des impôts représentés."
    verified: "2026-07-29"
  employer_social_charge_rate:

  8. THE TOTALS, AND THE NUMBER THE WHOLE THING TURNS ON
  ==================================================================================================
  Over eighteen months:
      revenue                    1,459,993.305869
      EBITDA                        70,319.655844
      depreciation                  37,500.000000
      EBIT = NOPAT                  32,819.655844
      tax                                    0.000
      add back D&A                  37,500.000000

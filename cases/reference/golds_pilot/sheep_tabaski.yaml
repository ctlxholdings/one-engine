notes: |
  ------------------------------------------------------------------------------------------------
  FINDINGS
  ------------------------------------------------------------------------------------------------
  F1. HIS THREE WEIGHT STATEMENTS DO NOT CLOSE. Entry 25-30 kg, gain 10-12 kg, exit "quarante,
  quarante-cinq pour les beaux". The most generous admissible combination reaches 42 kg, so the 45
  is not attainable by any animal that starts and grows inside his own bands. Asserted in checks
  rather than smoothed. Most likely it describes the exceptional animal — the one he bought at
  60,000 because "il était déjà gros" — and not the cohort. Reported as a finding about the
  description, not corrected in his favour.

  F2. THE UNSOLD RAM IS THE BUSINESS'S DOMINANT RISK, AND IT IS ALREADY REALISED. Its accumulated
  cost and its expected proceeds are both on the face of the trace, and the gap between them is of
  the same order as the entire horizon's free cash flow. This is not a scenario; it is the base
  case, because he is holding the animal. The mechanism is structural, not a soft price decline:
  "le lendemain matin personne ne veut plus de bélier."

  F3. AND IT MAY BE WORSE THAN MODELLED. "Ma fille lui a donné un nom, c'est mauvais signe." He is
  telling us the animal is becoming a household member and may never be sold at all. The base case
  assumes he sells it at the next Tabaski. If he does not, the model's treatment is optimistic in
  the direction of the whole loss, not part of it. Not quantified, because the right response is to
  ask him.

  F4. THE COXEUR DISCOUNT IS INSURANCE, AND HE BOUGHT IT. coxeur_discount_per_head is the price of
  selling three days early for cash. It is the same mechanism as his neighbour's collapse from
  180,000 to 135,000 on the eve, in its mild and voluntary form. Reading the two together: this
  business's real product is not a ram, it is timing, and he pays a knowable premium to lay off an
  unknowable one. That is a rational trade and the model should not present it as a loss.

  F5. THE BAPTISM TRADE DOES NOT COVER ITSELF. On his low-end stated price, with his own mortality
  rate over the hold and its share of the helper's wage, both baptism animals close below cost —
  the trace carries the revenue and the cost side by side. He describes it as "ça fait vivre, ça ne
  fait pas gagner"; on these numbers it is nearer the boundary than that. It is not eliminable: it
  is what keeps the pen occupied and the helper employed between feasts, and its true justification
  is the option value of being in the market, not its margin. Direction: a higher hold price or a
  shorter hold both improve it, and both are questions for him.

  F6. THE ROUGHAGE STORE HAS ALMOST NO RESERVE AT THE SEASONAL LOW. trace.haulm_stock_kg bottoms out
  just before the new harvest lot arrives, at a level under two months of the then-current draw and
  with the next cohort about to be bought. A late harvest, a poor haulm year, or an early feast puts
  him into the spot market for roughage exactly when he is least able to pay. He names the mechanism
  himself — "quand elle tombe juste après la récolte, la fane est là et ne coûte presque rien; plus
  tard, tu paies tout" — but appears to treat the store as sufficient rather than tight.

  F7. HIS TAX POSITION IS CORRECT AND HIS REASONING IS NOT. He believes he owes nothing because he
  is not a trader. The law reaches the same zero by three separate routes that have nothing to do
  with whether he trades: art. 154 for income tax, art. 322.3° for the CEL — which names embouche
  explicitly — and art. 352 putting agriculture outside VAT altogether. The gap matters because a
  right answer held for a wrong reason does not survive a challenge. If the mairie comes round as
  it did to "ceux qui vendaient au bord de la route", "je ne fais pas du commerce" is not the
  defence; art. 322.3° is.

  F8. AND THERE IS ONE GENUINE OPEN QUESTION IN IT. The CEL exemption says fattening; the income-tax
  exemption says raising. He buys in and sells on within four months and describes his own rule as
  "ce que j'achète, je le vends". Whether that is élevage or achat-revente is the only thing that
  could move the tax line, it is not settled by the text I can reach, and it is the highest-
  materiality question in the input list. The contingent CGU column shows what would be at stake.

  F9. THE HELPER IS AN UNDECLARED EMPLOYEE AND AN UNDERPAID ONE. Morning and evening, every month,
  for a monthly wage. The employer's social charges on that wage are carried as a contingent column.
  I deliberately did NOT record a guaranteed-minimum-wage figure as SOURCED: the published figures I
  could reach for Senegal's SMIG and SMAG disagree materially with one another, and a statutory rate
  I cannot pin is worse than none — that is precisely the error that ties perfectly around a false
  number. What can be said without a citation is that the wage is far below every figure in
  circulation, on any of them. The exposure is real and its size is not established here.

  F10. INPUT INFLATION IS OBSERVED AND NOT PROJECTED. He watched the sack go from 12,000 to 15,000
  in a year (feed_price_inflation_observed). The model runs both sides in constant current prices,
  which is the standard convention and is stated once rather than assumed silently. Direction: if
  input prices keep moving as observed while the Tabaski price is held at what he realised, the
  second cycle in this model is optimistic. He cannot answer what next year's sack costs, and I
  could not source a forward price for Senegalese groundnut cake, so the honest treatment is to name
  the direction and leave the base flat.

  F11. THE DAKAR PLAN HAS NO EVIDENCE UNDER IT. Four hundred and five hundred thousand francs, and a
  million for the ladoum, are things he has heard — "on a vu ça à la télé". He has never sold in
  Dakar, has no channel there, and the coxeur's own margin on the road to town is invisible to him
  by his own admission: "ce qu'il en fait là-haut, ça ne me regarde pas." Excluding it from the base
  is not scepticism about the price; it is that between his 117,000 at the foirail and a Dakar
  headline there sits transport, feed on the road, market fees, shrink, a place to keep the animals,
  and the risk of arriving with eight rams and no buyer. None of that is in the utterance.

  F12. A PUBLISHED BAND IN THE SECTOR LITERATURE DOES NOT HOLD TOGETHER, AND I PREFER HIS NUMBERS.
  One cached row gives feed cost per head per cycle as roughly 5,500-11,000 XOF while citing, in the
  same breath, Bamako concentrate figures around 21,000 and cowpea-hay figures around 39,000-53,000.
  Those cannot all be the same quantity. His own concentrate spend per head per campaign sits close
  to the Bamako concentrate cell, which is the like-for-like comparison, and nowhere near the
  headline band. Flagged rather than reconciled: where a cached summary and its own underlying
  citations disagree, I use the citations.

  ------------------------------------------------------------------------------------------------
  JUDGMENT CALLS WHERE THE UTTERANCE WAS SILENT OR AMBIGUOUS
  ------------------------------------------------------------------------------------------------
  J1. HORIZON AND FREQUENCY are mine, argued in grid.why, and a reader can disagree with them there.
  The single most consequential choice in this document is ending AT the second Tabaski so the
  carried ram is resolved inside the frame.

  J2. SECOND CYCLE AT SIX HEAD, NOT EIGHT. He states the eight. I model the six he has run. See F11.
  Carried as the highest-materiality question after the regime.

  J3. THE CARRIED RAM IS HELD, NOT DUMPED. He names two exits and has taken the holding one. See F3.

  J4. PURCHASE TIMING CONVENTION. Rams are treated as arriving at the end of the purchase month, so
  the four-month feeding programme runs whole months to the feast and matches his "quatre mois"
  exactly. The real louma purchase is spread across January and the animals eat something that
  month. The friction is stated rather than papered over; it shifts a fraction of a month of feed,
  not a cycle.

  J5. THE ELEVEN-DAY RECESSION IS ABSORBED INTO THE PURCHASE DATE, NOT THE FATTENING WINDOW, because
  he anchors the buy to the feast rather than to the calendar. It does one piece of real work in the
  model: at a mid-May feast the "payable après la fête" settlement falls inside May instead of
  spilling into June. On a monthly grid nothing else about it is visible, which is one of the
  reasons the horizon stops where it does.

  J6. LOW END OF THE STATED GAIN. Ten kilos, not twelve, on the energy content of the ration he
  describes and because he has no field to graze. Stated as a decision in the input's source.

  J7. LOW END OF THE STATED BAPTISM PRICE. Seventy-five, not eighty, because "et encore" is a
  qualifier on the whole range and because outside the feast "le boucher te compte au poids et il ne
  monte pas".

  J8. MEASUREMENT AT COST RATHER THAN IAS 41 FAIR VALUE. Argued in the passage; FCFF-neutral either
  way. The IAS 41 presentation is arguably the technically preferable one and would put income into
  February-April, which is where his own description puts it. Cost is chosen for transparency, and
  the choice is disclosed rather than defaulted.

  J9. THE FEED-CREDIT PREMIUM IS INTEREST, NOT COST OF INVENTORY (IAS 2.18), AND IS THEREFORE
  EXCLUDED FROM UNLEVERED FCFF. This is the single largest presentational judgment in the document
  and it flatters FCFF. It is also correct: FCFF is defined before financing. The amount is
  materialised as its own trace row and folded into trace.cash_out_total so the gap between the
  unlevered measure and the cash that actually leaves is visible on the face of the model, not
  argued in prose. Simplification inside it: the interest is recognised at settlement rather than
  accrued month by month over the financing period. Since it never enters FCFF, only its own row's
  period placement is affected.

  J10. OVERHEAD ABSORPTION AT NORMAL CAPACITY (IAS 2.13) with normal capacity set to his six-head
  campaign. Without this the carried ram would absorb a year of wages it did not cause and the
  finding in F2 would be an artefact of the allocation rather than a fact about the animal.

  J11. DEPRECIATION IS NOT ABSORBED INTO INVENTORY. Strict IAS 2.12 would allocate the pen's
  depreciation as a production overhead. It is expensed as incurred instead. The departure affects
  neither FCFF nor cumulative EBIT — it is released within the same cycle — only the intra-cycle
  split, and it keeps the fixed-asset line readable. Named because a silent departure is worse than
  a declared one.

  J12. FRACTIONAL HEAD ARE EXPECTATIONS, NOT FORECASTS. Cycle 2 and the carried ram carry expected
  mortality, so head counts are non-integer. Nobody is claiming that six-tenths of an animal dies.
  Cycle 1 is integral because it is observed.

  J13. THE BAPTISM ANIMALS ARE SPREAD EVENLY across the inter-feast period (bought t=6 and t=10) for
  want of any timing in the utterance. Baptisms are not seasonal in the way Tabaski is, so an even
  spread is the neutral choice; a different pattern moves cash between months and not the total.

  J14. THE CARRIED RAM'S MAINTENANCE RATION halves the concentrate and holds the roughage at the
  finishing rate, giving a coherent maintenance intake. Both halves of that are mine; the concentrate
  fraction is carried as a question to him.

  J15. HIS OWN LABOUR AND HIS MASONRY INCOME ARE BOTH OUT. The masonry is a separate activity of the
  proprietor and is not an asset of this business. His unpaid time in the pen is a real economic cost
  and is excluded from FCFF because FCFF is an entity measure struck before any return to the owner
  — but the exclusion is materialised as a zero column and a question rather than left implicit,
  because he himself frames the two as competing for the same four months.

  J16. RECEIVABLES AND CAPEX ARE BOTH ZERO WITH REASONS, not by omission. Every sale in the
  utterance is a spot cash sale; the pen has 84 months of life against an 18-month horizon.

  ------------------------------------------------------------------------------------------------
  DEFERRED
  ------------------------------------------------------------------------------------------------
  D1. NO TERMINAL VALUE. The horizon ends at a feast with every stock resolved and the plant
  two-thirds through its life. A going-concern value would require a view on the third cycle, which
  is the one the evidence does not support. Deliberately not supplied.

  D2. NO LEVERED VIEW. The only finance in this business is the feed seller's trade credit. Its cost
  is materialised; the bridge from FCFF to what reaches him is one subtraction, and it is left to the
  reader rather than presented as a second answer.

  D3. THE LADOUM SEGMENT IS OUT because he puts himself out of it: "Le ladoum, ce n'est pas pour moi:
  un agneau ladoum c'est déjà trois cent mille." The 300,000 lamb price is recorded here as his
  statement of why he is not in that market, and is not used anywhere in the build.

  D4. NO PRICE PATH WITHIN THE FEAST WEEK. The coxeur's price three days out and the foirail's price
  on the day are both realised observations and both sit in the same period. A daily grid across the
  feast week would be the natural way to model the panic-sell dynamic he describes in his neighbour,
  and there is not enough in the utterance to build one honestly.

  D5. THE 2027 FEAST DATE is treated as mid-May on his own statement and the published calendar; the
  exact day would matter only on a finer grid than this one.

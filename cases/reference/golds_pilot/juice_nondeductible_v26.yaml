contract: "v2.6"
id: juice_nondeductible_bouake_v26
title: "Mango-juice unit, Bouake (Cote d'Ivoire) - unlevered FCFF over the remaining life of the production line, with the undocumented-fruit-purchase reintegration"
currency: XOF

grid:
  periods: 9
  freq: "annual (campaign year: one mango campaign plus the twelve months of sales that drain it)"
  why: >-
    The horizon is set by the only durable asset. The founder bought the line one year ago against a
    stated ten-year life, so nine campaign-years of that life remain; the model runs t=0..t=8 and the
    line's net book value reaches exactly zero at t=8. Stopping there is a choice, and it is the
    choice that keeps the question answerable: continuing past t=8 requires a replacement decision the
    founder has not made and a machine price at a date nine years out that I cannot source, so a
    tenth period would be invention rather than derivation. Shortening it would truncate an asset that
    is demonstrably not worn out.
    The period length is one year because that is the length of this business's actual cycle, not a
    convention. The fruit arrives in a single window (Ivorian mango harvest runs roughly mid-April to
    early July), the entire year's production is made inside that window, and the bottles are then
    sold over the following twelve months; a period shorter than the full cycle would cut a purchase
    campaign away from the sales that pay for it. Every tax that matters here - the profits tax, the
    minimum tax, the patente, and the taxe d'Etat de l'entreprenant that I find he is statutorily in
    the band for - is assessed annually, and the founder's whole question (a permanent
    non-deduction) is an annual computation.
    A monthly grid would be more faithful to the cash trough the campaign creates - he pays 12.5m XOF
    in cash for fruit inside about twelve weeks and recovers it over the following year - but it would
    need 108 periods and would not change a single annual figure below, because the working-capital
    position is already funded and does not move in steady state. I record the trough as a finding
    instead. A reader who thinks the financing question dominates the asset-side question should
    rebuild this monthly; that is a legitimate disagreement with my choice, and it is why the choice
    is written down.

utterance:
  fr: >-
    J'ai une petite unite de jus de mangue a Bouake. J'achete la mangue directement aux paysans des
    vergers autour, a la recolte : je prends cent tonnes dans la saison, a cent vingt-cinq francs le
    kilo. Il faut trois kilos de mangue pour faire un litre de jus. Je vends le jus en bouteilles
    d'un litre aux supermarches et aux boutiques d'Abidjan, a mille deux cents francs la bouteille.
    Les bouteilles, les bouchons et les etiquettes me coutent deux cents francs par bouteille, et le
    sucre et l'acide citrique cent francs. J'ai la ligne de production que j'ai payee trente-cinq
    millions il y a un an - on me dit dix ans. Trois ouvriers a quatre-vingt-dix mille par mois, le
    hangar a deux cent mille par mois, et le courant et l'eau a trois cent mille par mois. Je suis
    une societe declaree, je paie l'impot sur le benefice. Mais il y a un truc qui me fait mal : les
    paysans ne me donnent aucune facture - ils n'ont pas de registre de commerce, ils veulent le cash
    et c'est tout. Mon comptable me dit que sans facture il ne peut pas passer ces achats en charge
    deductible. Donc pour l'impot, c'est comme si je n'avais jamais achete ces mangues : je paie
    l'impot sur un benefice bien plus gros que celui que je fais vraiment. Et ce n'est pas un decalage
    dans le temps - cette deduction-la, je ne la recupere jamais.
  en: >-
    I have a small mango-juice unit in Bouake. I buy the mangoes directly from the farmers in the
    orchards around, at harvest time: I take one hundred tonnes over the season, at one hundred and
    twenty-five francs a kilo. It takes three kilos of mango to make one litre of juice. I sell the
    juice in one-litre bottles to the supermarkets and the small shops in Abidjan, at one thousand
    two hundred francs a bottle. The bottles, the caps and the labels cost me two hundred francs per
    bottle, and the sugar and citric acid one hundred. I have the production line, which I paid
    thirty-five million for a year ago - they tell me ten years. Three workers at ninety thousand a
    month, the shed at two hundred thousand a month, and power and water at three hundred thousand a
    month. I am a registered company, I pay profits tax. But there is one thing that hurts: the
    farmers give me no invoice - they have no trade register entry, they want cash and that is all.
    My accountant tells me that without an invoice he cannot put those purchases through as a
    deductible expense. So for tax it is as if I had never bought those mangoes: I pay tax on a
    profit far bigger than the one I actually make. And it is not a timing difference - that
    deduction, I never get it back.

inputs:

  fruit_purchased_kg_per_season:
    value: 100000
    unit: kg of fresh mango per campaign
    prov: STATED
    source: "\"je prends cent tonnes dans la saison\" / \"I take one hundred tonnes over the season\""
    date: 2026-07-27

  mango_price_xof_per_kg:
    value: 125
    unit: XOF per kg
    prov: STATED
    source: "\"a cent vingt-cinq francs le kilo\". Corroborated by the sector benchmark below."
    date: 2026-07-27

  mango_farmgate_benchmark_xof_per_kg:
    value: 122.5
    unit: XOF per kg
    prov: SOURCED
    source: "Cross-check on the founder's 125 XOF/kg: the official bord-champ reference is 2,450 FCFA per ~20 kg crate. His price is 2% above bord-champ, consistent with buying at the orchard and carrying the fruit himself. Not used in the arithmetic; used to accept mango_price_xof_per_kg as sound."
    authority: "Inter-Mangue official bord-champ price, 2,450 FCFA/caisse (~20 kg) = 122.5 XOF/kg; 220 XOF/kg at a conditioning station. Reported by AIP (Agence Ivoirienne de Presse). Annex fact CI-SEC-07."
    verified: 2026-07-26
    fact_id: CI-SEC-07

  mango_kg_per_litre:
    value: 3
    unit: kg of purchased fresh mango per litre of bottled juice
    prov: STATED
    source: "\"Il faut trois kilos de mangue pour faire un litre de jus\". This is a RATIO the founder hands me, and it is net of everything the fruit loses: see reject_rate, peel_fraction, stone_fraction, finisher_recovery and line_loss_rate below, which decompose it into a balance that sums to 3.000 kg exactly. Roughly two of the three kilos never reach a bottle."
    date: 2026-07-27

  bottle_price_xof:
    value: 1200
    unit: XOF per 1-litre bottle
    prov: STATED
    source: "\"a mille deux cents francs la bouteille\""
    date: 2026-07-27

  bottle_size_l:
    value: 1
    unit: litre per bottle
    prov: STATED
    source: "\"bouteilles d'un litre\""
    date: 2026-07-27

  packaging_cost_per_bottle_xof:
    value: 200
    unit: XOF per bottle produced
    prov: STATED
    source: "\"Les bouteilles, les bouchons et les etiquettes me coutent deux cents francs par bouteille\". Charged on bottles PRODUCED, not sold: the empty is consumed at filling, so a bottle later broken or expired has already consumed its packaging."
    date: 2026-07-27

  ingredient_cost_per_bottle_xof:
    value: 100
    unit: XOF per bottle produced
    prov: STATED
    source: "\"le sucre et l'acide citrique cent francs\". See sugar_dose_kg_per_bottle: at a physically drinkable dose this cash figure is about twice the dose-implied cost, which is a finding, not a correction - the cash figure is his and the model uses it."
    date: 2026-07-27

  line_cost_xof:
    value: 35000000
    unit: XOF
    prov: STATED
    source: "\"la ligne de production que j'ai payee trente-cinq millions\""
    date: 2026-07-27

  line_life_years:
    value: 10
    unit: years
    prov: STATED
    source: "\"on me dit dix ans\". Taken as both the accounting and the tax life; 10%/yr straight-line on industrial plant is inside the ordinary Ivorian amortissement lineaire range, so no book/tax timing difference is created."
    date: 2026-07-27

  line_age_years:
    value: 1
    unit: years
    prov: STATED
    source: "\"il y a un an\" - the line is one year old at t=0, so nine years of life remain."
    date: 2026-07-27

  workers:
    value: 3
    unit: persons
    prov: STATED
    source: "\"Trois ouvriers\""
    date: 2026-07-27

  wage_per_worker_month_xof:
    value: 90000
    unit: XOF per worker per month
    prov: STATED
    source: "\"a quatre-vingt-dix mille par mois\". Taken as gross salary, twelve months a year - he states a monthly rate with no seasonal qualifier, and the workers are on the payroll through the nine months in which there is no fruit."
    date: 2026-07-27

  shed_rent_per_month_xof:
    value: 200000
    unit: XOF per month
    prov: STATED
    source: "\"le hangar a deux cent mille par mois\""
    date: 2026-07-27

  utilities_per_month_xof:
    value: 300000
    unit: XOF per month
    prov: STATED
    source: "\"le courant et l'eau a trois cent mille par mois\""
    date: 2026-07-27

  smig_monthly:
    value: 75000
    unit: XOF per month
    prov: SOURCED
    source: "Compliance floor only. The stated 90,000 XOF exceeds it, so the wage is lawful and needs no adjustment; asserted in checks."
    authority: "Cote d'Ivoire, decret n. 2022-986 du 21 decembre 2022, SMIG raised to 75,000 FCFA from 1 January 2023, still in force in 2026. Annex fact CI-V25-09 / CI-TAX-09."
    verified: 2026-07-27
    fact_id: CI-V25-09

  bottles_produced_per_season:
    value: 33333
    unit: filled 1-litre bottles per campaign
    prov: INFERRED
    source: "floor(fruit_purchased_kg_per_season / mango_kg_per_litre) = floor(100000/3) = 33333. The division does not close on a whole bottle: 1 kg of fruit is left over at the end of the campaign as a part-batch that cannot fill a bottle, carried explicitly as trace.fruit_unconverted_kg so the mass balance closes on 100,000 kg exactly rather than on a rounded 33,333.33."
    date: 2026-07-27

  nbv_opening_xof:
    value: 31500000
    unit: XOF
    prov: INFERRED
    source: "line_cost_xof - line_cost_xof/line_life_years * line_age_years = 35,000,000 - 3,500,000 = 31,500,000. No new information: cost, life and age are all stated."
    date: 2026-07-27

  reintegration_basis:
    value: 12500000
    unit: XOF per year
    prov: INFERRED
    source: "The whole mango spend is reintegrated, because the whole mango spend is undocumented: \"les paysans ne me donnent aucune facture\" applies to all of it, and the fruit is bought from one homogeneous class of supplier. mango_price_xof_per_kg * fruit_purchased_kg_per_season = 12,500,000."
    date: 2026-07-27

  invoice_substantiation_rule:
    value: facture_normalisee_required_for_deduction
    unit: label
    prov: SOURCED
    source: "The founder's accountant is right on the current facts: a purchase with no compliant invoice is not deductible, and the reintegration is permanent, not a timing difference - he never recovers it, exactly as he says. What he is NOT right about is that nothing can be done: see bapa_available."
    authority: "Cote d'Ivoire CGI arts. 384 et suivants (facture normalisee / facture normalisee electronique) and the reintegration consequence; DGI note de service on the FNE. Annex fact CI-V25-46."
    verified: 2026-07-27
    fact_id: CI-V25-46

  bapa_available:
    value: true
    unit: boolean
    prov: SOURCED
    source: "FINDING, not used in the base arithmetic. The DGI's own electronic-invoicing platform issues a buyer-created agricultural reception document that has the value of a purchase invoice - precisely the instrument for buying from farmers with no trade-register entry. If it is open to him, the reintegration disappears prospectively; the base case does NOT assume it, because eligibility and the accompanying withholding are not established from his words. Its value is quantified in trace.invoice_cost."
    authority: "DGI Cote d'Ivoire, plateforme Facture Normalisee Electronique (FNE), FAQ: document types include \"Le bordereau electronique de reception de produits agricoles (valeur de facture d'achat)\" and \"Le recu electronique de reception de produits agricoles (valeur de facture d'achat)\" - https://www.fne.dgi.gouv.ci/faq.php ; FNE legal basis CGI arts. 384, 385 et suivants and LPF arts. 144 et suivants."
    verified: 2026-07-27

  is_rate:
    value: 0.25
    unit: fraction of taxable profit
    prov: SOURCED
    source: "Applied to the reintegrated taxable profit. The 25% rate does not vary by legal form, so his description of himself as a societe does not change it."
    authority: "Cote d'Ivoire, impot BIC/IS at 25% (30% telecom/ICT, 35% non-resident); DGI, Le systeme fiscal ivoirien; PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income. Annex facts CI-V25-45 / CI-TAX-01."
    verified: 2026-07-27
    fact_id: CI-V25-45

  imf_rate:
    value: 0.005
    unit: fraction of turnover TTC
    prov: SOURCED
    source: "The minimum tax is computed on turnover INCLUDING taxes, which is why revenue_ttc is materialised separately from revenue."
    authority: "PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income, minimum tax 0.5% of total turnover. Annex fact CI-V25-17 / CI-TAX-02."
    verified: 2026-07-27
    fact_id: CI-V25-17

  imf_floor:
    value: 3000000
    unit: XOF per year
    prov: SOURCED
    source: "This is the single most consequential number in the whole computation and the founder does not mention it. At his turnover 0.5% of CA TTC is only ~234k, so the IMF is the floor, and the floor is what he pays whenever his profits tax would be smaller. It is what makes his grievance far smaller than he believes."
    authority: "PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income, minimum tax floor XOF 3 million. Annex fact CI-V25-18 / CI-TAX-02."
    verified: 2026-07-27
    fact_id: CI-V25-18

  imf_ceiling:
    value: 35000000
    unit: XOF per year
    prov: SOURCED
    source: "Not binding at this scale; carried so the min/max nesting of the IMF computation is materialised and checkable rather than assumed away."
    authority: "PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Taxes on corporate income, minimum tax ceiling XOF 35 million. Annex fact CI-V25-19 / CI-TAX-02."
    verified: 2026-07-27
    fact_id: CI-V25-19

  imf_rule_shape:
    value: max_of_bic_and_imf
    unit: label
    prov: SOURCED
    source: "The floor and cap sit INSIDE the IMF computation and the IMF then substitutes for the profits tax (\"en lieu et place\"); it is not a credit. Implemented as tax = max(bic, min(max(rate*CA_TTC, floor), ceiling))."
    authority: "DGI, IMF rule shape; annex fact CI-TAX-03."
    verified: 2026-07-26
    fact_id: CI-TAX-03

  vat_rate:
    value: 0.18
    unit: fraction
    prov: SOURCED
    source: "Processed fruit juice is standard-rated - it is not an unprocessed staple. Used to build revenue_ttc for the IMF base, and to size the input VAT that becomes an irrecoverable cost under the entreprenant regime."
    authority: "Cote d'Ivoire CGI, VAT 18%; processed fruit juice standard-rated. Annex facts CI-TAX-10 and CI-V25-39."
    verified: 2026-07-26
    fact_id: CI-TAX-10

  tee_band_lower:
    value: 5000001
    unit: XOF per year, turnover TTC
    prov: SOURCED
    source: "Lower edge of the regime de l'entreprenant band; asserted against revenue_ttc in checks."
    authority: "Cote d'Ivoire CGI art. 73 (band 5,000,001 - 50,000,000 XOF TTC), annexe fiscale 2021 (loi n. 2020-972 du 23 decembre 2020). Annex facts CI-V25-05 / CI-TAX-05."
    verified: 2026-07-27
    fact_id: CI-V25-05

  tee_band_upper:
    value: 50000000
    unit: XOF per year, turnover TTC
    prov: SOURCED
    source: "Upper edge of the band. His turnover TTC of 46.76m sits inside it with about 7% of headroom - and it sits inside it on EITHER reading of whether his 1,200 XOF price is net or gross of VAT, so the regime finding does not depend on that open question."
    authority: "Cote d'Ivoire CGI art. 73; annexe fiscale 2021 (loi n. 2020-972 du 23 decembre 2020, art. 33). Annex fact CI-V25-42 / CI-TAX-05."
    verified: 2026-07-27
    fact_id: CI-V25-42

  statutory_regime_at_this_turnover:
    value: taxe_etat_de_l_entreprenant
    unit: label
    prov: SOURCED
    source: "ESTABLISHED FROM HIS OWN NUMBERS, not assumed: 100 t / 3 kg per litre = 33,333 bottles, less warehouse loss, at 1,200 XOF = 39.63m XOF, or 46.76m TTC. That falls in the 5,000,001-50,000,000 TTC band, so the DEFAULT regime for this turnover is the regime de l'entreprenant, in which a turnover tax substitutes for the profits tax and there are no deductible charges to argue about. He nonetheless describes himself as filing under the profits tax with an accountant who computes charges deductibles - which is only meaningful in a reel regime, and is the internal evidence that he has OPTED out of the default. Both objects are recorded: what he believes about his business, and what the rule says about the world. The base case runs on what he actually files; the alternative is materialised in trace.fcff_tee."
    authority: "Cote d'Ivoire, CGI arts. 72 et suivants (regime de l'entreprenant), art. 73 (persons subject and the 5,000,001-50,000,000 XOF TTC band), art. 77 (rates), introduced by the annexe fiscale to loi de finances n. 2020-972 du 23 decembre 2020. Annex fact CI-V25-40."
    verified: 2026-07-27
    fact_id: CI-V25-40

  tee_substitutes_for_profits_tax:
    value: true
    unit: boolean
    prov: SOURCED
    source: "The substitution is what makes the founder's entire grievance regime-dependent: under the TEE there is no deductible-charge computation at all, so an unsupported purchase costs nothing in tax."
    authority: "Cote d'Ivoire CGI arts. 72 et suivants; \"Cette taxe se substitue a la patente, a l'impot sur les benefices et a la TVA\". Annex facts CI-V25-41 / CI-TAX-06."
    verified: 2026-07-27
    fact_id: CI-V25-41

  tee_rate:
    value: 0.05
    unit: fraction of turnover TTC
    prov: SOURCED
    source: "5% is the residual rate (prestations de services and other activities); 4% applies to commerce/negoce, i.e. buying and reselling. A unit that transforms fruit into juice is not negoce, so 5% is the correct reading and also the conservative one. The classification is not perfectly settled in the published guidance; the rate is wired into trace.tax_tee, so a reader who takes the 4% view gets a different number mechanically."
    authority: "Cote d'Ivoire CGI art. 77 - 4% commerce/negoce, 5% prestations de services, both halved for members of a centre de gestion agree. Annex facts CI-V25-43 / CI-V25-44 / CI-TAX-06."
    verified: 2026-07-27
    fact_id: CI-V25-43

  patente_ca_rate:
    value: 0.005
    unit: fraction of turnover HT
    prov: SOURCED
    source: "Droit sur le chiffre d'affaires. At his turnover this yields ~198k, below the floor, so the floor governs."
    authority: "Cote d'Ivoire, contribution des patentes - droit sur le chiffre d'affaires, 0.5% of turnover HT. PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Other taxes. Annex facts CI-V25-51 / CI-V25-20 / CI-TAX-07."
    verified: 2026-07-27
    fact_id: CI-V25-51

  patente_ca_floor:
    value: 300000
    unit: XOF per year
    prov: SOURCED
    source: "Binding here. A cost the founder does not mention and which follows necessarily from his being a declared taxpayer in a reel regime."
    authority: "Contribution des patentes, minimum du droit sur le chiffre d'affaires. Annex fact CI-V25-52."
    verified: 2026-07-27
    fact_id: CI-V25-52

  patente_vl_rate:
    value: 0.185
    unit: fraction of annual rental value
    prov: SOURCED
    source: "Droit sur la valeur locative, applied to the shed rent he states (2,400,000/yr) as the natural measure of valeur locative."
    authority: "Contribution des patentes - droit sur la valeur locative, 18.5% of the rental value of professional premises (16% in rural zones). PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Other taxes. Annex facts CI-V25-54 / CI-TAX-07."
    verified: 2026-07-27
    fact_id: CI-V25-54

  cnps_pension_rate_employer:
    value: 0.077
    unit: fraction of gross salary
    prov: SOURCED
    source: "Uncapped at this wage (the pension ceiling is 3,375,000/month, far above 90,000)."
    authority: "CLEISS, Les cotisations en Cote d'Ivoire, rates in force 1 January 2025: retraite 7.70% employer. Annex facts CI-V25-32 / CI-V25-10 / CI-TAX-08."
    verified: 2026-07-27
    fact_id: CI-V25-32

  cnps_family_rate_employer:
    value: 0.05
    unit: fraction of capped base
    prov: SOURCED
    source: "Applied to the 70,000 XOF/month capped base, not to the 90,000 gross - the cap bites here and a model that ignored it would overstate the charge."
    authority: "CLEISS, Les cotisations en Cote d'Ivoire, 1 January 2025: prestations familiales 5% employer only, ceiling 70,000 XOF/month. Annex fact CI-V25-11."
    verified: 2026-07-27
    fact_id: CI-V25-11

  cnps_maternity_rate_employer:
    value: 0.0075
    unit: fraction of capped base
    prov: SOURCED
    source: "Same capped base of 70,000 XOF/month."
    authority: "CLEISS, Les cotisations en Cote d'Ivoire, 1 January 2025: maternite 0.75% employer only, ceiling 70,000 XOF/month. Annex fact CI-V25-12."
    verified: 2026-07-27
    fact_id: CI-V25-12

  cnps_at_rate_employer:
    value: 0.02
    unit: fraction of capped base
    prov: SOURCED
    source: "Bottom of the 2-5% risk-class band. Chosen as the low end deliberately: a food-processing unit is not a high-risk class, and taking the low end is the conservative choice against overstating an unstated cost."
    authority: "CLEISS, Les cotisations en Cote d'Ivoire, 1 January 2025: accidents du travail et maladies professionnelles 2% to 5% employer only depending on sector risk class, ceiling 70,000 XOF/month. Annex facts CI-V25-13 / CI-V25-33."
    verified: 2026-07-27
    fact_id: CI-V25-13

  cnps_capped_base_monthly:
    value: 70000
    unit: XOF per worker per month
    prov: SOURCED
    source: "Ceiling for prestations familiales, maternite and accidents du travail."
    authority: "CLEISS, Les cotisations en Cote d'Ivoire: monthly contribution ceiling 70,000 XOF. Annex facts CI-V25-14 / CI-V25-31."
    verified: 2026-07-27
    fact_id: CI-V25-14

  employer_payroll_tax_rate:
    value: 0.028
    unit: fraction of gross payroll
    prov: SOURCED
    source: "DISCREPANCY REPORTED, and I prefer what I can reconcile. The annex row CI-V25-35 carries the value 0.044 but quotes its own authority as saying \"Payroll taxes: 2.8 percent of total taxable remuneration for local employees, 12 percent for expatriates\". The value contradicts the quotation it is built on. I use 2.8%, which reconciles to the standard build of contribution a la charge de l'employeur plus taxe d'apprentissage plus formation professionnelle continue for local staff, and I flag the row."
    authority: "PwC Worldwide Tax Summaries, Ivory Coast - Corporate - Other taxes: payroll taxes 2.8% of total taxable remuneration for local employees. Annex row CI-V25-35 (value 0.044 not adopted; its own quotation says 2.8%). Cf. CI-TAX-08 (TAP 0.4% + TFPC 1.2%)."
    verified: 2026-07-27
    fact_id: CI-V25-35

  mango_flesh_fraction_literature:
    value: 0.675
    unit: fraction of whole fruit (midpoint of the published 0.60-0.75 range)
    prov: SOURCED
    source: "Used to validate, not to drive: my derived pulp recovery of 62.04% of purchased fruit must sit inside the published flesh and industrial-pulp-recovery ranges, and it does. Reference point only; the balance is driven by peel_fraction and stone_fraction."
    authority: "Frontiers in Plant Science (2019), \"Chemical Composition of Mango (Mangifera indica L.) Fruit\": mango consists of 60-75% flesh, 14-22% seed, 11-18% peel; industrial processing yields 60-75% pulp with 25-40% as by-product. https://www.frontiersin.org/journals/plant-science/articles/10.3389/fpls.2019.01073/full"
    verified: 2026-07-27

  peel_fraction:
    value: 0.17
    unit: fraction of fruit entering the line, peel with adhering flesh
    prov: ASSUMED
    source: "Prior. Inside the published 11-18% peel range and at its upper end, because the figure is peel WITH the flesh that stays attached to it in a small hand-fed unit rather than clean peel. Nobody in this business could state it: the founder does not weigh his peel, and the world publishes ranges, not this plant's number - so it is ASSUMED rather than ELICITED, and that is a claim I am making deliberately."
    date: 2026-07-27

  stone_fraction:
    value: 0.17
    unit: fraction of fruit entering the line, stone with adhering flesh
    prov: ASSUMED
    source: "Prior. Published seed fraction is 14-22%; 17% with adhering flesh is mid-range. Same reasoning as peel_fraction: a published range exists, this plant's number does not."
    date: 2026-07-27

  finisher_recovery:
    value: 0.545
    unit: fraction of pulp recovered as strained juice
    prov: ASSUMED
    source: "Prior, and it is the residual that makes the founder's own 3 kg/litre close. Given 6% reception reject, 17% peel and 17% stone, pulp is 62.04% of purchased fruit; to land on one litre of bottled juice per 3 kg the finisher and filtration stage must retain about 45.5% of the pulp as fibrous pomace. That is a low recovery by industrial standards and a plausible one for a small unit with a coarse finisher - and it is a consequence of the founder's ratio, not an independent guess."

checks:
  # --- conservation: the fruit transformation must close, not merely have a yield ratio
  - "trace.fruit_purchased_kg == trace.reject_kg + trace.peel_kg + trace.stone_kg + trace.pomace_kg + trace.line_loss_kg + trace.bottled_juice_kg + trace.fruit_unconverted_kg"
  - "trace.fruit_purchased_kg == trace.reject_kg + trace.fruit_to_line_kg + trace.fruit_unconverted_kg"
  - "trace.fruit_converted_kg == trace.fruit_purchased_kg - trace.fruit_unconverted_kg"
  - "trace.fruit_to_line_kg == trace.peel_kg + trace.stone_kg + trace.pulp_kg"
  - "trace.pulp_kg == trace.finisher_juice_kg + trace.pomace_kg"
  - "trace.finisher_juice_kg == trace.bottled_juice_kg + trace.line_loss_kg"
  - "trace.waste_kg == trace.reject_kg + trace.peel_kg + trace.stone_kg + trace.pomace_kg + trace.line_loss_kg"
  - "trace.byproduct_kg == trace.peel_kg + trace.stone_kg + trace.pomace_kg"
  - "trace.fruit_converted_kg == trace.waste_kg + trace.bottled_juice_kg"
  # --- conservation: the bottle must close on its contents
  - "trace.bottle_contents_kg == trace.bottled_juice_kg + trace.sugar_kg + trace.citric_kg"
  - "trace.bottle_contents_kg == trace.bottles_produced * bottle_net_mass_kg"
  # --- conservation: the finished-goods stock roll-forward
  - "trace.fg_bottles_close[t] == trace.fg_bottles_close[t-1] + trace.bottles_produced[t] - trace.bottles_sold[t] - trace.bottles_lost[t]"
  - "trace.bottles_sold == trace.bottles_produced - trace.bottles_lost"
  # --- conservation: the fixed-asset roll-forward
  - "trace.book_value[first] == nbv_opening_xof - trace.depreciation[first]"
  - "trace.book_value[t] == trace.book_value[t-1] - trace.depreciation[t] for t >= 1"
  - "sum(trace.depreciation) == nbv_opening_xof"
  - "trace.book_value[last] == 0"
  # --- conservation: working capital
  - "cumsum(trace.delta_nwc) == trace.nwc - trace.nwc_prior"
  - "trace.nwc == trace.receivables + trace.inventory_fg + trace.inventory_packaging - trace.payables"
  # --- conservation: cumulative physical quantities against the world (rule d)
  - "trace.cum_fruit_kg == cumsum(trace.fruit_purchased_kg)"
  - "trace.cum_bottles == cumsum(trace.bottles_produced)"
  - "trace.cum_pulper_hours == cumsum(trace.pulper_hours)"
  - "trace.cum_waste_kg == cumsum(trace.waste_kg)"
  - "trace.cum_fruit_kg[last] == fruit_purchased_kg_per_season * grid.periods"
  - "trace.cum_pulper_hours[last] <= line_design_hours"
  # --- capacity: the claimed output must fit inside the plant described (rule c)
  - "trace.pulper_hours == trace.fruit_to_line_kg / pulper_rate_kg_per_hour"
  - "trace.filler_hours == trace.bottles_produced * bottle_size_l / filler_rate_l_per_hour"
  - "trace.crew_hours == trace.fruit_purchased_kg / (workers * sort_rate_kg_per_hour_per_worker)"
  - "trace.campaign_available_hours == campaign_days * working_day_fraction * hours_per_working_day * availability"
  - "trace.pulper_hours <= trace.campaign_available_hours"
  - "trace.filler_hours <= trace.campaign_available_hours"
  - "trace.crew_hours <= trace.campaign_available_hours"
  # --- driver-bridge: physical
  - "trace.bottles_produced * mango_kg_per_litre == trace.fruit_converted_kg"
  - "trace.reject_kg == reject_rate * trace.fruit_converted_kg"
  - "trace.peel_kg == peel_fraction * trace.fruit_to_line_kg"
  - "trace.stone_kg == stone_fraction * trace.fruit_to_line_kg"
  - "trace.finisher_juice_kg == finisher_recovery * trace.pulp_kg"
  - "trace.line_loss_kg == line_loss_rate * trace.finisher_juice_kg"
  - "trace.sugar_kg == sugar_dose_kg_per_bottle * trace.bottles_produced"
  - "trace.citric_kg == citric_dose_kg_per_bottle * trace.bottles_produced"
  - "trace.avg_fg_bottles == trace.bottles_produced * (1 - campaign_days / days_per_year) / 2"
  - "trace.bottles_lost == fg_loss_rate_pa * trace.avg_fg_bottles"
  # --- driver-bridge: revenue and cost
  - "trace.revenue == bottle_price_xof * price_net_factor * trace.bottles_sold"
  - "trace.revenue_ttc == trace.revenue * (1 + vat_rate)"
  - "trace.byproduct_revenue == byproduct_price_xof_per_kg * trace.byproduct_kg"
  - "trace.mango_cost == mango_price_xof_per_kg * trace.fruit_purchased_kg"
  - "trace.packaging_cost == packaging_cost_per_bottle_xof * trace.bottles_produced"
  - "trace.ingredient_cost == ingredient_cost_per_bottle_xof * trace.bottles_produced"
  - "trace.wages == workers * wage_per_worker_month_xof * months_per_year"
  - "trace.social_charges == workers_declared_flag * workers * months_per_year * (cnps_pension_rate_employer * wage_per_worker_month_xof + (cnps_family_rate_employer + cnps_maternity_rate_employer + cnps_at_rate_employer) * cnps_capped_base_monthly + employer_payroll_tax_rate * wage_per_worker_month_xof)"
  - "trace.rent == shed_rent_per_month_xof * months_per_year"
  - "trace.utilities == utilities_per_month_xof * months_per_year"
  - "trace.maintenance == maintenance_rate * line_cost_xof"
  - "trace.patente == max(patente_ca_rate * trace.revenue, patente_ca_floor) + patente_vl_rate * trace.rent"
  - "trace.freight_cost == freight_per_bottle_xof * trace.bottles_sold"
  - "trace.bad_debt == bad_debt_rate * trace.revenue"
  - "trace.depreciation == line_cost_xof / line_life_years"
  - "wage_per_worker_month_xof >= smig_monthly"
  # --- driver-bridge: working capital
  - "trace.receivables == trace.revenue_ttc * receivable_days / days_per_year"
  - "trace.inventory_fg == trace.avg_fg_bottles * (mango_price_xof_per_kg * mango_kg_per_litre + packaging_cost_per_bottle_xof + ingredient_cost_per_bottle_xof)"
  - "trace.inventory_packaging == (trace.packaging_cost + trace.ingredient_cost) * packaging_stock_days / campaign_days"
  - "trace.payable_base == trace.packaging_cost + trace.ingredient_cost + trace.utilities + trace.maintenance"
  - "trace.payables == trace.payable_base * payable_days / days_per_year"
  # --- definition: the ladder to FCFF
  - "trace.opex == trace.mango_cost + trace.packaging_cost + trace.ingredient_cost + trace.wages + trace.social_charges + trace.rent + trace.utilities + trace.maintenance + trace.patente + trace.freight_cost + trace.bad_debt"
  - "trace.ebitda == trace.revenue + trace.byproduct_revenue - trace.opex"
  - "trace.ebit == trace.ebitda - trace.depreciation"
  - "trace.taxable_profit == trace.ebit + trace.reintegration"
  - "trace.reintegration == trace.mango_cost"
  - "trace.bic == is_rate * trace.taxable_profit"
  - "trace.imf == min(max(imf_rate * trace.revenue_ttc, imf_floor), imf_ceiling)"
  - "trace.tax == max(trace.bic, trace.imf)"
  - "trace.nopat == trace.ebit - trace.tax"
  - "trace.cfo == trace.ebitda - trace.tax - trace.delta_nwc"
  - "trace.cfi == 0 - trace.capex"
  - "trace.fcff == trace.cfo + trace.cfi"
  - "trace.fcff == trace.nopat + trace.depreciation - trace.delta_nwc - trace.capex"
  - "fcff == trace.fcff"
  # --- definition: what the missing invoices actually cost, and the founder's overstatement
  - "trace.bic_if_deductible == is_rate * trace.ebit"
  - "trace.tax_if_deductible == max(trace.bic_if_deductible, trace.imf)"
  - "trace.fcff_if_deductible == trace.ebit - trace.tax_if_deductible + trace.depreciation - trace.delta_nwc - trace.capex"
  - "trace.invoice_cost == trace.tax - trace.tax_if_deductible"
  - "trace.invoice_cost <= is_rate * trace.reintegration"
  - "trace.fcff_if_deductible - trace.fcff == trace.invoice_cost"
  # --- definition: the alternative statutory regime, materialised rather than asserted
  - "trace.revenue_ttc >= tee_band_lower"
  - "trace.revenue_ttc <= tee_band_upper"
  - "trace.tee_irrecoverable_vat == vat_rate * (trace.packaging_cost + trace.ingredient_cost + trace.utilities + trace.maintenance)"
  - "trace.opex_tee == trace.opex - trace.patente + trace.tee_irrecoverable_vat"
  - "trace.ebit_tee == trace.revenue + trace.byproduct_revenue - trace.opex_tee - trace.depreciation"
  - "trace.tax_tee == tee_rate * trace.revenue"
  - "trace.fcff_tee == trace.ebit_tee - trace.tax_tee + trace.depreciation - trace.delta_nwc - trace.capex"
  # --- non-negativity
  - "trace.book_value >= 0"
  - "trace.inventory_fg >= 0"
  - "trace.fg_bottles_close >= 0"
  - "trace.bottles_sold >= 0"
  - "trace.bottled_juice_kg >= 0"
  - "trace.pomace_kg >= 0"
  - "trace.pulp_kg >= 0"
  - "trace.nwc >= 0"
  - "trace.tax >= imf_floor"
  - "trace.taxable_profit >= trace.ebit"

notes:
  - "HEADLINE FINDING. The founder is asking the right question about the wrong number. He believes the missing invoices cost him 25% of 12,500,000 = 3,125,000 a year. They do not: because the minimum tax would take 3,000,000 from him even with the deduction, the true annual cost is the 727,667 carried in trace.invoice_cost. He is aggrieved by roughly four times the amount he is actually losing. Nothing internal to a model can catch this - it needs the statutory floor, which he never mentions."
  - "SECOND FINDING, ON REGIME. His turnover including tax, 46.76m XOF, sits inside the 5,000,001-50,000,000 band whose default regime is the regime de l'entreprenant, where a turnover tax substitutes for the profits tax, the patente and VAT and where deductibility is not a concept. He is not in it, and the internal evidence for that is his own sentence about his accountant computing charges deductibles. I record both objects as different objects: his belief about his business, and the rule about the world. The materialised comparison shows the two regimes land within 4% of each other and that the reel is marginally better, because the entreprenant regime would turn 2,573,982 of recoverable input VAT into cost with no way to pass it on to VAT-registered supermarket customers. The choice his accountant made is defensible; what is not established is whether it was made deliberately."
  - "THIRD FINDING, AND THE ACTIONABLE ONE. The accountant's advice is correct on today's facts but may be incomplete on the law. The DGI's electronic invoicing platform issues a buyer-created agricultural reception document explicitly carrying the value of a purchase invoice - the instrument designed for exactly this situation, buying from producers with no trade-register entry. If it is open to him, the reintegration ends prospectively and trace.invoice_cost goes to zero. I have deliberately NOT assumed it in the base case: eligibility, the mechanics for a taxpayer of his size, and any accompanying withholding on payments to unregistered suppliers are not established from his words and I could not settle them from published sources. This is the first thing I would put to his accountant."
  - "PHYSICAL FINDING - THE RATIO HIDES THE MAJORITY OF THE MASS. His 3 kg/litre is net of a 6% reception reject, 17% peel, 17% stone, a 45.5% finisher retention and a 3% line loss. Two of every three kilos he pays for never reach a bottle, and 60.2 tonnes a year of peel, stone and pressed fibre leaves the plant inside a twelve-week window. It is valued at zero here because he says nothing about it; the sign of its true value is unknown to me - it could be a small revenue as cattle feed or orchard compost, or a disposal cost."
  - "PHYSICAL FINDING - THE PLANT IS FRUIT-LIMITED, NOT CAPACITY-LIMITED. The binding stage is the three-person crew at 166.7 hours a campaign against 316.8 available; the machine needs only 94. The line runs about 94 hours in a year of 8,760 and about 846 hours over the whole nine-year horizon, which is roughly 4% of what stainless food machinery is built to deliver. The ten-year life is therefore a calendar convention, not a wear-out figure, and the real threat to the asset is nine months a year standing wet and idle in a hot shed. Direction only: better idle-period care lengthens the asset's life, and any lengthening raises the answer, because the machine is nowhere near its throughput limit."
  - "PHYSICAL FINDING - THE FIXED COSTS ARE STANDING CHARGES. Wages plus social charges, rent, and power and water total 9,775,500 a year against about three months of activity. Power and water in particular are charged at 300,000 a month against roughly 94 productive hours a year, which means the great majority of it cannot be process load - it is subscription, lighting, and whatever runs year-round. Worth verifying against a CIE bill before anyone treats it as variable."
  - "INTERNAL TENSION I DID NOT RESOLVE. The stated ingredient cost of 100 XOF a bottle is about twice what sugar and citric acid cost at a physically drinkable dose. I did not adjust the cost - it is his cash and cash is what the model needs - and I did not adjust the dose to fit the cost, because at a dose that consumed the whole 100 XOF the drink would be far outside a saleable Brix. Both numbers are kept and the friction is reported rather than smoothed."
  - "SIMPLIFICATION - THE ACCOUNTING YEAR. I run a campaign year, opening at the start of the fruit intake, which is why the finished-goods stock closes each period at zero and the roll-forward is exact. If his fiscal year is instead the calendar year, the year-end balance sheet carries stock and the average is somewhat different; FCFF is unaffected either way, because in steady state the change in working capital is zero on either phasing. I value the finished-goods stock at the average rather than the year-end level deliberately: the average is the capital actually employed, and a year-end snapshot of zero would understate it."
  - "SIMPLIFICATION - INVENTORY VALUATION. Finished goods are carried at direct materials only (675 XOF a bottle). Full absorption under IAS 2 would add production labour and overhead - but IAS 2 also requires allocation on NORMAL capacity and expenses the unallocated fixed overhead of an under-utilised plant, and this plant runs at about a third of its campaign capacity and a twentieth of its annual capacity. Rather than construct a normal-capacity allocation on a plant whose utilisation is this far from normal, I value at direct materials and flag it. It affects the balance sheet, not FCFF."
  - "SIMPLIFICATION - WORKING CAPITAL IS ALREADY FUNDED. The line has run a campaign, so the position exists at t=0 and the forecast is not charged with building it. This is why the change in net working capital is zero throughout and why the receivable and payable questions rank LOW on materiality for this answer despite being large numbers. I also do not release working capital at t=8: nothing in the utterance says the business stops when the machine does. A reader who assumes liquidation at the end of the horizon would add the release; a reader who assumes continuation would add replacement capex. Both are decisions outside the horizon I chose, which is why I chose it there."
  - "NO DEBT ANYWHERE IN THE UTTERANCE. The cash tax is therefore already the unlevered tax and no interest shield needed stripping out of NOPAT. If the 35,000,000 line was in fact bought on credit, the FCFF is unchanged by construction but the equity story is not."
  - "DEFERRED - PENALTY EXPOSURE. Undocumented purchases attract not only reintegration but a penalty regime under the invoicing rules. I have not quantified it because I could not establish, from published sources, how it would be applied to a buyer purchasing from unregistered farmers. Direction only: it is a downside risk to the tax line, not an upside."
  - "DEFERRED - THE VARIABLE MINIMUM-TAX TRIGGER. There is a second limb of the minimum tax keyed to cumulative taxes falling below a threshold, with an uplift coefficient, and the published drafting of it is ambiguous. I have applied only the ordinary minimum tax. Direction only: if the second limb reaches him, the tax line rises and the answer falls."
  - "DEFERRED - INSURANCE AND LISTING FEES. A 35,000,000 asset and a stock of bottled food would normally be insured, and Abidjan supermarket chains commonly charge listing or referencing fees. Neither is in the utterance and neither is set out in a source I could verify for a supplier of this size, so both are omitted and named here rather than buried."
  - "THE THREE QUESTIONS TO ASK IF HE WILL ONLY ANSWER THREE. (1) Is the 1,200 francs net of TVA or the total the supermarket pays - it moves revenue by 15%. (2) Who pays to move the bottles to Abidjan - about 50 tonnes a year over 350 km is not a rounding. (3) Did anyone actually choose the reel regime, or was it simply assumed - it is the only question here whose answer changes which taxes exist rather than how large one is."

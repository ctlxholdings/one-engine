  mango_stock_loss_rate:
    value: 0
    unit: fraction per period
    prov: DEFAULTED
    source: "DECLARED ZERO, WITH THE REASON. Fresh mango is not a stock that can be carried: at Bouake ambient temperatures a ripe mango holds a few days, and he buys \"a la recolte\" and processes inside the campaign. There is therefore no fruit inventory at any period end and no carrying loss to charge - the loss that does occur, on the one to three days between the orchard and the pulper, is already inside reject_rate and is not counted twice. Silence would have been the failure; the number is zero and this is why."
    date: 2026-07-27

  packaging_stock_loss_rate:
    value: 0
    unit: fraction per period
    prov: DEFAULTED
    source: "DECLARED ZERO, WITH THE REASON. Empty bottles do break and labels do spoil in store, but the founder quotes packaging at 200 XOF per bottle FILLED, which is a cost per good output and is therefore already net of whatever he breaks on the way there. Charging a separate loss on the empties would double-count his own figure."
    date: 2026-07-27

passage: >-
  STEP 1 - WHAT THE FRUIT ACTUALLY BECOMES. The founder hands me one ratio, three kilos of mango to
  the litre, and that ratio is the whole of his physical model. It is not a balance. A balance has to
  say where the other two kilos go, and in this business they are the majority of the mass, so I
  build it explicitly on a basis of 3.000 kg of purchased fruit per bottle.
  Of every 3.000 kg he pays for, 0.180 kg (6%) never reaches the line: mango is picked ripe, travels
  to Bouake unrefrigerated and waits a day or two, and what arrives rotten, bruised, immature or
  crushed is sorted out at reception. 2.820 kg goes onto the line. Of that, peel with the flesh that
  stays attached to it is 0.4794 kg (17%) and the stone - endocarp plus kernel - with its adhering
  flesh is another 0.4794 kg (17%), leaving 1.8612 kg of pulp. Both fractions sit inside the
  published composition of mango fruit (60-75% flesh, 14-22% seed, 11-18% peel), and the implied pulp
  recovery of 62.0% of purchased weight sits inside the published industrial range of 60-75%.
  The pulp is then strained. At a finisher recovery of 54.5% it yields 1.014354 kg of juice and
  retains 0.846846 kg as fibrous pomace; 3% of the juice, 0.03043062 kg, is then lost between
  finisher and capped bottle to CIP flush, first and last runnings, foam and fill rejects. What
  reaches the bottle is 0.98392338 kg of mango juice.
  The balance closes exactly: 0.180 + 0.4794 + 0.4794 + 0.846846 + 0.03043062 + 0.98392338 = 3.000000
  kg. So the founder's ratio is net of 67.2% of the mass he pays for. He buys 100 tonnes of fruit and
  32.80 tonnes of it reaches a bottle. The 54.5% finisher recovery is low by industrial standards, and
  I want to be plain that it is the residual: it is what the founder's own 3 kg/litre requires once
  reject, peel and stone are set at literature-consistent values. If his true finisher recovery is
  better than that, then either his reject rate is far worse than 6% or his ratio is not 3 kg/litre.
  STEP 2 - THE BOTTLE. Filling the litre needs mango juice plus what he adds. Against a net fill of
  1.055 kg, the 0.98392338 kg of juice leaves 0.07107662 kg, of which citric acid takes 0.0012 kg
  (1.2 g/litre, the dose that drops the pH below 4 so a simple pasteurisation is sufficient - which is
  what lets him hold stock at ambient for nine months) and sugar takes the remaining 0.06987662 kg.
  Juice + sugar + acid = 1.055 kg exactly. That dose is a finding rather than a comfort: at roughly
  700 XOF/kg wholesale sugar it costs about 49 XOF and the acid about 3 XOF, against the 100 XOF a
  bottle he states. His cash figure is roughly double the dose. It is his cash and the model uses it,
  but either he buys sugar at or near the administered retail reference of 825 XOF/kg, or the 100 XOF
  also carries a preservative or antioxidant he did not itemise, or the drink is sweeter than a
  drinkable Brix allows. At this dose the finished juice runs around 18-19 degrees Brix, which is at
  the top of the commercial band, so there is not much room to move upward.
  STEP 3 - BOTTLES AND THE INTEGER. 100,000 kg at 3 kg/litre is 33,333.33 litres, and a third of a
  litre does not fill a bottle. Production is 33,333 bottles; 99,999 kg of fruit is converted and
  1 kg is left in the tank at the end of the campaign as a part-batch that goes out as loss. I carry
  that 1 kg as its own line rather than rounding it away, so the season balance closes on 100,000 kg
  and not on a tidy fiction. Scaled up: reject 5,999.94 kg, peel 15,979.8402 kg, stone 15,979.8402
  kg, pomace 28,227.917718 kg, line loss 1,014.34385646 kg, bottled juice 32,797.11802554 kg,
  unconverted 1 kg - summing to 100,000.00 kg.
  STEP 4 - THE STOCK, AND WHAT LEAKS FROM IT. Two stocks exist and both have to declare themselves.
  Fresh fruit: zero carried, and the reason is physical rather than financial - a ripe mango at
  Bouake ambient does not keep, he buys at harvest and processes inside the campaign, so there is no
  fruit inventory at any period end. The loss that does occur is on the day or two between the
  orchard and the pulper and is already inside the 6% reception reject; charging it again would be
  double counting.
  Finished bottles: a real stock, and the interesting one. The whole year is made in 84 days and sold
  over 365, so the stock builds through the campaign and drains through the following nine months.
  With production uniform across the campaign and sales uniform across the year, the average stock is
  production x (1 - 84/365) / 2 = 33,333 x 0.3849315 = 12,830.92 bottles, and it returns to zero at
  the end of the campaign year. That average, not the year-end snapshot of zero, is the capital
  actually tied up, and it is what I put into working capital.
  The loss rate then has to act on the quantity at risk, which falls as the store drains. At 0.2% per
  bottle-month the exposure of 12,830.92 bottle-years costs 307.94 bottles a year. A flat 2.4% charge
  on the 33,333 produced would have given 800 and would have been wrong in exactly the way this rule
  is written to catch: it would tax bottles that had already been sold. Bottles sold are therefore
  33,333 - 307.94 = 33,025.06.
  STEP 5 - DOES THE CLAIMED OUTPUT FIT THE PLANT? Three capacities, each in its own units, against
  the campaign.
  The line: 93,999.06 kg of fruit reaches the pulper at a rated 1,000 kg/h, so 93.999 hours. The
  filler: 33,333 litres at 500 L/h, so 66.666 hours. The crew: three workers receiving, sorting,
  washing and feeding at 200 kg/h each, so 100,000 kg / 600 kg/h = 166.667 hours. The binding stage is
  the CREW, not the machine - the people are slower than the equipment they feed.
  Against that, the campaign offers 84 calendar days, six days in seven, eight hours a day, at 55%
  availability once grid outages, breakdowns, the daily clean-down and days when the fruit does not
  arrive are taken out: 84 x 0.857143 x 8 x 0.55 = 316.8 productive hours. The binding 166.67 hours
  fits inside 316.8 with 90% headroom, and the machine's 94 hours fit with more than three times over.
  The claimed output fits the plant described, comfortably.
  What that headroom actually means is the finding. Spread across the campaign it is 1,190 kg of
  fruit a day, about two hours of line time a day. The line runs about 94 hours in a year of 8,760.
  Three workers are paid for 36 worker-months and the whole year's production consumes about 63
  worker-days of line work. The shed is rented for twelve months and used for three. So the
  employment cost of 3,775,500 XOF, the rent of 2,400,000 and the utilities of 3,600,000 are standing
  charges, not variable costs: 9,775,500 XOF a year of capacity that the fruit supply does not use.
  The binding constraint on this business is not machinery, labour or space - it is the 100 tonnes of
  mango, and everything else is oversized against it.
  STEP 6 - THE CUMULATIVE TEST. Over the nine years the model runs: 900 tonnes of fruit bought,
  299,997 bottles filled, 604,816.94 kg of wet residue produced, 845.99 hours on the pulper and
  599.99 hours on the filler. Set the 846 hours against what a stainless food line is built to deliver
  - on the order of 20,000 operating hours - and it is 4.2% of the machine's mechanical life. The
  ten-year life the founder was told is therefore not a wear-out figure; on hours the machine is
  barely started. What will actually end it is calendar: nine months a year standing wet and idle in a
  hot shed, seals perishing, pumps seizing, gaskets hardening, stainless pitting where the clean-down
  was imperfect. I keep the ten years because it is what he was told and it is a defensible tax and
  book convention, but the reader should know it is a corrosion-and-idleness life, not a throughput
  life, and that the risk to it is how the plant is looked after between campaigns. One number makes
  the point: at 94 productive hours a year the depreciation alone is about 37,000 XOF for every hour
  the line runs.
  The 60.2 tonnes a year of peel, stone and pomace also has to go somewhere, in a twelve-week window,
  in the heat. Mango by-product has established uses as cattle feed and orchard compost. I value it at
  zero because he says nothing about it, but zero is a choice about revenue, not a statement that the
  material does not exist.
  STEP 7 - REVENUE. 33,025.05787397260 bottles at 1,200 XOF is 39,630,069.44876712 XOF. The base case
  treats the 1,200 as net of VAT, so turnover including tax is 46,763,481.9495452 XOF. That gross
  figure matters twice: it is the base for the minimum tax, and it is what decides which regime he is
  in.
  STEP 8 - COSTS. Fruit 100,000 kg x 125 = 12,500,000. Packaging 33,333 x 200 = 6,666,600, charged on
  bottles produced because the empty is consumed at filling. Sugar and acid 33,333 x 100 = 3,333,300.
  Wages 3 x 90,000 x 12 = 3,240,000, and 90,000 clears the 75,000 SMIG.
  Two costs he did not mention follow necessarily from what he did say. First, employer social
  charges: a declared societe pays CNPS pension at 7.70% of the 90,000 gross (6,930), plus family
  allowances at 5%, maternity at 0.75% and work-injury at 2% on the capped base of 70,000 (5,425 in
  total - the cap bites, and a model that applied those rates to the full 90,000 would overstate
  them), plus employer payroll taxes at 2.8% of gross (2,520). That is 14,875 per worker per month,
  535,500 a year for three. Second, the patente: the droit sur le chiffre d'affaires at 0.5% of
  39,630,069 is 198,150, below the 300,000 floor, so the floor governs; the droit sur la valeur
  locative at 18.5% of the 2,400,000 shed rent is 444,000. Patente 744,000.
  Shed 2,400,000, power and water 3,600,000, maintenance and CIP consumables at 2% of the line cost
  700,000. Outbound freight to Abidjan and bad debts are both set to zero - the omitting choice, with
  the questions attached, because he gave what reads as a complete cost list. Total cash operating
  cost 33,719,400 XOF.
  STEP 9 - DOWN TO EBIT. EBITDA = 39,630,069.44876712 - 33,719,400 = 5,910,669.44876712.
  Depreciation is 35,000,000 / 10 = 3,500,000 a year, straight line, book equal to tax, on an opening
  net book value of 31,500,000 that runs to exactly zero at t=8. EBIT = 2,410,669.44876712.
  STEP 10 - THE TAX, WHICH IS WHERE HIS QUESTION LIVES. His accountant is right on the current facts:
  a purchase with no compliant invoice is not deductible, and the reintegration is permanent, not a
  timing difference. So the whole 12,500,000 of fruit is added back and taxable profit is
  2,410,669.44876712 + 12,500,000 = 14,910,669.44876712. Profits tax at 25% is 3,727,667.36219178.
  Then the minimum tax. At 0.5% of turnover including tax it is 233,817.41, which is below the
  3,000,000 floor, so the minimum tax is 3,000,000; the 35,000,000 cap does not reach. The rule is
  substitution, not credit: he pays the greater of the two, which is 3,727,667.36219178.
  STEP 11 - WHAT THE INVOICE PROBLEM ACTUALLY COSTS. This is the number the founder does not have.
  He believes the lost deduction costs him 25% of 12,500,000, which is 3,125,000 a year. It does not.
  If the fruit were fully deductible his profits tax would be 25% of 2,410,669.45 = 602,667.36 - and
  that is BELOW the 3,000,000 minimum, so he would pay 3,000,000 anyway. The true cost of the missing
  invoices is 3,727,667.36 - 3,000,000 = 727,667.36 a year, not 3,125,000. The minimum tax was going
  to take the first three million from him whatever his accountant did with the mangoes. His grievance
  is real and it is a quarter of the size he thinks it is, and I carry both figures as trace rows so
  the comparison is checked rather than asserted.
  STEP 12 - AND THE LARGER FINDING, WHICH IS THE REGIME. His turnover including tax is 46.76m XOF,
  inside the 5,000,001 - 50,000,000 band in which the default regime is the regime de l'entreprenant,
  where a turnover tax substitutes for the profits tax, the patente and VAT alike - and where there is
  no deductible-charge computation at all, so an unsupported purchase costs nothing. He is evidently
  not in it: an accountant computing charges deductibles is an accountant working in a regime du reel.
  So the founder's belief about his own affairs and the default rule of the world are two different
  objects, and I record both.
  What the arithmetic then says is more interesting than a simple "he is in the wrong regime". Under
  the entreprenant regime he would pay 5% of turnover, 1,981,503.47, and save the 744,000 patente -
  but he would lose the right to recover input VAT, and at 18% on packaging, ingredients, utilities
  and maintenance that is 2,573,982 a year of tax that turns into cost. He cannot pass it on: his
  supermarket customers recover the VAT he charges them today, so a switch to a VAT-free 1,200 leaves
  them indifferent and he cannot raise the price to compensate. The two regimes land within 4% of each
  other, with the reel slightly ahead - 2,183,002.09 of FCFF against 2,099,183.98. His accountant's
  choice of the reel is defensible, and the reason is the input-VAT cascade on a business whose
  largest input, the fruit, carries no VAT to lose.
  STEP 13 - NOPAT, WORKING CAPITAL AND FCFF. NOPAT = EBIT - tax = 2,410,669.44876712 -
  3,727,667.36219178 = -1,316,997.91342466. There is no debt anywhere in the utterance, so the cash
  tax is already the unlevered tax and no interest shield has to be stripped out. The operation earns
  a positive operating profit and a negative after-tax operating profit: the tax bill exceeds the
  economic profit that produced it.
  Working capital: receivables at 45 days of gross turnover 5,765,360.79; finished-goods stock at the
  average 12,830.92 bottles valued at direct materials of 675 XOF a bottle (375 of fruit, 200 of
  packaging, 100 of ingredients) = 8,660,872.29; packaging and ingredient stock at 30 days of
  campaign-rate usage 3,571,428.57; less payables of 1,175,334.25 at 30 days on everything except the
  farmers, who take cash. Net working capital 16,822,327.41 XOF - about 2.8 times EBITDA, and heavy
  precisely because the largest single input is paid in cash inside a twelve-week window against sales
  that take a year to come back. That position is already funded: the line has been running a year and
  a campaign has already been through it. So the change in net working capital is zero in every period
  of the forecast, and the FCFF is not burdened with building a position that already exists. I do not
  release it at t=8 either, because nothing in the utterance says the business stops.
  Capex is zero throughout: the line was bought before the horizon opens and the horizon closes when
  it is written down.
  FCFF = NOPAT + D&A - change in NWC - capex = -1,316,997.91342466 + 3,500,000 - 0 - 0 =
  2,183,002.08657534 XOF a year, flat across all nine periods, 19,647,018.78 XOF cumulative. The same
  number from the other direction: EBITDA 5,910,669.45 less cash tax 3,727,667.36 less nil working
  capital movement = 2,183,002.09, with nil investing flow. The entire free cash flow of this business
  is, to within a rounding, its depreciation charge: it is converting a machine into cash and
  distributing it, and the operating business underneath is running at an after-tax loss.


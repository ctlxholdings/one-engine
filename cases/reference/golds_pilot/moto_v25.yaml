contract: "v2.5"
id: "bj-cotonou-zemidjan-moto-taxi-fcff-2026-07"
title: "Zémidjan (moto-taxi), Cotonou — unlevered FCFF over the four-year life of one motorcycle"
currency: "XOF"

grid:
  periods: 4
  freq: "annual"
  why: |
    The horizon is one full life of one motorcycle: four years, t=0 being the year the moto is
    bought and put to work, t=3 the year it is retired. Three things fix this and nothing else in
    the utterance does.

    (1) The moto is the only durable asset in the business and the founder himself pins its life —
    "elle me tient quatre bonnes années". That statement is simultaneously the useful-life
    assumption, the depreciation schedule and the end of the answerable horizon. Past year four the
    cash flows depend entirely on a replacement decision he has not described: same moto rebuilt,
    new moto at an unknown price, exit the trade. Extending to five or ten years would not be a
    longer answer, it would be a different and unsourced one.

    (2) Starting the clock at acquisition rather than "today" is what makes the number an ASSET-SIDE
    number. The 600,000 outlay and the four years of service it buys are one economic object; a
    going-concern snapshot that omits the capex would report a cash flow the moto did not earn.

    (3) Annual, not monthly, and not daily. Every tax that bites is assessed annually — the TPS is
    declared and settled by 30 April on the preceding year's receipts (CGI art. 184), and Cotonou
    bills the taxi-moto exploitation tax as an annual amount. Depreciation is annual. A monthly grid
    would have to carry Cotonou's two rainy seasons, the lumpiness of tyre and chain replacement,
    and the ageing curve of the machine month by month — none of which is in the utterance, so a
    monthly view would manufacture twelve times as many numbers with no more information behind
    them. The founder's own cycle (twenty courses a day, six days a week) is honoured by building
    every operating quantity at daily scale and annualising through a stated working-day count,
    rather than by making the reporting period daily.

    A reader who disagrees should disagree here: a four-year annual grid answers "what does this
    600,000 franc machine earn over its life", and it cannot answer "what does this man earn in
    January".

utterance:
  fr: |
    Moi je fais zémidjan à Cotonou. J'ai acheté ma moto six cent mille francs, elle me tient quatre
    bonnes années. Je fais vingt courses par jour, en moyenne. Y a le court à 200, le moyen à 300,
    le long à 500. L'essence c'est 725 le litre, je consomme deux litres et demi par cent bornes.
    Je travaille tous les jours, sauf dimanche.
  en: |
    I run a moto-taxi in Cotonou. I bought my moto for 600,000 francs; it lasts me a good four years.
    About twenty trips a day on average. Short trips 200, medium 300, long 500. Fuel is 725 a litre,
    the bike does two and a half litres per hundred kilometres. I work every day except Sunday.

inputs:

  moto_cost:
    value: 600000
    unit: "XOF"
    prov: "STATED"
    source: "\"J'ai acheté ma moto six cent mille francs\" — the acquisition cost of the only durable asset."
    date: "2026-07-27"

  moto_life_years:
    value: 4
    unit: "years"
    prov: "STATED"
    source: "\"elle me tient quatre bonnes années\" — the founder's own useful-life statement for the moto."
    date: "2026-07-27"

  trips_per_day:
    value: 20
    unit: "courses/day"
    prov: "STATED"
    source: "\"Je fais vingt courses par jour, en moyenne\" — note he says en moyenne, so this is already an average across good and bad days."
    date: "2026-07-27"

  fare_short:
    value: 200
    unit: "XOF/course"
    prov: "STATED"
    source: "\"Y a le court à 200\""
    date: "2026-07-27"

  fare_medium:
    value: 300
    unit: "XOF/course"
    prov: "STATED"
    source: "\"le moyen à 300\""
    date: "2026-07-27"

  fare_long:
    value: 500
    unit: "XOF/course"
    prov: "STATED"
    source: "\"le long à 500\""
    date: "2026-07-27"

  fuel_price_per_litre:
    value: 725
    unit: "XOF/litre"
    prov: "STATED"
    source: "\"L'essence c'est 725 le litre\". Corroborated against the administered pump price — see official_pump_price_essence_super; the match tells us he buys at a formal station, not informal roadside fuel."
    date: "2026-07-27"

  fuel_consumption_l_per_100km:
    value: 2.5
    unit: "litres/100 km"
    prov: "STATED"
    source: "\"je consomme deux litres et demi par cent bornes\" — bornes is Beninese/French colloquial for kilometres."
    date: "2026-07-27"

  rest_days_per_week:
    value: 1
    unit: "days/week"
    prov: "STATED"
    source: "\"Je travaille tous les jours, sauf dimanche\" — one rest day, Sunday."
    date: "2026-07-27"

  working_days_per_week:
    value: 6
    unit: "days/week"
    prov: "INFERRED"
    source: "7 calendar days per week less rest_days_per_week = 1. No new information: it is a restatement of \"tous les jours, sauf dimanche\"."
    date: "2026-07-27"

  calendar_working_days_per_year:
    value: 313
    unit: "days/year"
    prov: "DEFAULTED"
    source: "Convention: a 365-day calendar year contains 52 Sundays (52 x 7 = 364 days, the odd day counted as a working day), so 365 - 52 = 313 non-Sunday days. Chosen over the naive 365 x 6/7 = 312.857... because an integer day count keeps the per-course arithmetic exact. Leap years and the years that carry a 53rd Sunday are ignored — the ±1 day effect is below the resolution of everything else here."
    date: "2026-07-27"

  wheels:
    value: 2
    unit: "wheels"
    prov: "INFERRED"
    source: "\"ma moto\" plus \"je fais zémidjan\". In Cotonou usage a zémidjan is a two-wheel motorcycle; a three-wheel passenger vehicle is a tricycle and is named as such. This inference is load-bearing for tax: see tvm_two_wheel_tax and municipal_taxi_tax_per_year, both of which turn on the wheel count."
    date: "2026-07-27"

  days_lost_per_year:
    value: 0
    unit: "days/year"
    prov: "ELICITED"
    source: "Base case takes his words literally — he asserts a six-day week with no exception, so the omitting choice is zero days lost. This is deliberately NOT the conservative choice; the correction is carried by the question, not buried in the number, because there is no honest way to guess how many days this particular man loses."
    date: "2026-07-27"
    question: "Sur les douze derniers mois, combien de jours tu n'as pas travaillé du tout — malade, moto au garage, funérailles, fête ?"
    range: {low: 0, high: 45}
    materiality: "medium"

  trips_short_per_day:
    value: 7
    unit: "courses/day"
    prov: "ELICITED"
    source: "He gave three fare tiers and a total of twenty courses but never the mix, and the mix is the single largest determinant of revenue. Base case uses the integer split 7 / 7 / 6 rather than an even 20/3 split: the utterance permits it, it keeps every downstream figure exact rather than a repeating decimal, and loading the odd course onto the two cheaper tiers is the conservative ordering."
    date: "2026-07-27"
    question: "Sur tes vingt courses d'une journée normale, combien sont des petites courses à 200 francs ?"
    range: {low: 3, high: 12}
    materiality: "high"

  trips_medium_per_day:
    value: 7
    unit: "courses/day"
    prov: "ELICITED"
    source: "Same gap as trips_short_per_day. Base case 7 completes the 7 / 7 / 6 split. Ranked below the short-trip count because moving one course between the 200 and 300 tiers is a 100-franc swing, whereas moving one course out of the 500 tier is a 300-franc swing."
    date: "2026-07-27"
    question: "Et sur ces mêmes vingt courses, combien sont à 300 francs ?"
    range: {low: 3, high: 10}
    materiality: "medium"

  trips_long_per_day:
    value: 6
    unit: "courses/day"
    prov: "INFERRED"
    source: "Residual: trips_per_day (20, STATED) - trips_short_per_day - trips_medium_per_day = 20 - 7 - 7 = 6. Deductive given the total and the other two counts; it inherits their uncertainty but adds none of its own."
    date: "2026-07-27"

  km_per_trip_short:
    value: 2.5
    unit: "km/course"
    prov: "ELICITED"
    source: "Fuel is priced per kilometre but the founder priced his work per course, so the bridge between the two — how far a course actually is — is missing entirely. Base case 2.5 km for a 200-franc hop, which implies roughly 80 XOF/km, consistent with short fares being the dearest per kilometre. He can answer this precisely by naming endpoints."
    date: "2026-07-27"
    question: "Une course à 200 francs, c'est d'où à où ? Donne-moi un départ et une arrivée typiques dans Cotonou."
    range: {low: 1, high: 4}
    materiality: "medium"

  km_per_trip_medium:
    value: 4.5
    unit: "km/course"
    prov: "ELICITED"
    source: "Same missing bridge. Base case 4.5 km for a 300-franc course, implying about 67 XOF/km — a declining per-kilometre gradient across the three tiers, which is how distance-banded fares normally behave."
    date: "2026-07-27"
    question: "Et une course à 300 francs, d'où à où ?"
    range: {low: 3, high: 7}
    materiality: "medium"

  km_per_trip_long:
    value: 9
    unit: "km/course"
    prov: "ELICITED"
    source: "Same missing bridge, and the widest plausible span of the three because Cotonou is roughly 12 km across, so a 500-franc course can be anything from a long in-town run to a cross-city crossing. Base case 9 km, implying about 56 XOF/km. Ranked highest of the three because it multiplies the largest per-course distance by a tier the founder did not size."
    date: "2026-07-27"
    question: "Et une course à 500 francs, d'où à où — jusqu'à quel quartier ça t'emmène ?"
    range: {low: 6, high: 15}
    materiality: "high"

  empty_running_uplift:
    value: 0.30
    unit: "ratio of empty km to loaded km"
    prov: "ELICITED"
    source: "A moto-taxi burns fuel between fares — repositioning after a drop-off, cruising a carrefour for the next passenger, riding to and from home. None of that is in the course count, but all of it is in the fuel bill. Base case 0.30, i.e. thirty empty kilometres for every hundred carrying a passenger. He can answer this from his own riding day even though he does not track odometer readings."
    date: "2026-07-27"
    question: "Quand tu déposes un client, tu roules combien à vide avant de charger le suivant — à peu près un quart de la distance en plus, la moitié en plus, ou davantage ?"
    range: {low: 0.15, high: 0.60}
    materiality: "medium"

  fuel_tank_litres:
    value: 4
    unit: "litres"
    prov: "ELICITED"
    source: "The only stock this business carries is the fuel standing in the tank; it is the entire working capital. Base case 4 litres, a typical small-displacement moto tank held part-full as most zem riders buy in small amounts. Immaterial to FCFF but materialised rather than assumed away, so the working-capital line is derived rather than asserted at zero."
    date: "2026-07-27"
    question: "Tu mets combien de litres dans le réservoir d'un coup, et tu roules avec combien dedans en général ?"
    range: {low: 2, high: 7}
    materiality: "low"

  maintenance_cost_per_month_new:
    value: 20000
    unit: "XOF/month"
    prov: "ELICITED"
    source: "The founder listed the moto and the fuel and stopped. He said nothing about vidange, tyres, chain, brakes, punctures or the mechanic, and at the mileage his own numbers imply these are not a rounding error. Base case 20,000 XOF/month for a machine in its first year, built up from a plausible consumables pattern at this mileage (oil changes at short intervals, a rear tyre several times a year, a chain kit, brakes and tubes). Flagged rather than assumed because he, and only he, knows what he actually hands the mechanic."
    date: "2026-07-27"
    question: "Dans un mois normal, tu dépenses combien sur la moto elle-même — vidange, pneus, chaîne, freins, crevaisons, le mécanicien — tout compris ?"
    range: {low: 8000, high: 45000}
    materiality: "high"

  maintenance_escalation_per_year:
    value: 0.25
    unit: "fraction of year-1 monthly maintenance added per year of age"
    prov: "ELICITED"
    source: "\"Quatre bonnes années\" is a claim about how long the machine keeps working, not a claim that it costs the same to keep working in year four as in year one. Base case adds 25% of the year-1 monthly bill for each year of age (linear, so year 4 runs at 1.75x year 1). He can answer from what he now pays versus what he paid when it was new."
    date: "2026-07-27"
    question: "Et aujourd'hui, avec la moto qui a vieilli, tu dépenses combien de plus par mois qu'au début — un quart de plus, la moitié en plus, le double ?"
    range: {low: 0.0, high: 0.60}
    materiality: "medium"

  salvage_value:
    value: 0
    unit: "XOF"
    prov: "ELICITED"
    source: "\"Elle me tient quatre bonnes années\" says when it stops serving him, not what it is worth when it does. Base case 0 — the omitting choice, and the conservative one for FCFF; it also makes the closing book value zero, so no disposal gain or loss arises."
    date: "2026-07-27"
    question: "Au bout des quatre ans, tu revends la moto ou elle finit en pièces ? Tu en tires combien ?"
    range: {low: 0, high: 150000}
    materiality: "low"

  tps_registered:
    value: 1
    unit: "flag (1 = within the TPS net, 0 = outside it)"
    prov: "ELICITED"
    source: "The law is clear and is recorded under tps_rate; whether this particular man is inside its net is a fact about his business that only he holds. Base case 1 — the law is applied as written, which is also the conservative choice on cash tax. Recorded as ELICITED rather than SOURCED precisely because the rule and the man's situation are two different objects."
    date: "2026-07-27"
    question: "Est-ce que tu es enregistré aux impôts — tu as un IFU et tu déclares chaque année, ou bien tu ne payes que la taxe de la mairie sur ta plaque zémidjan ?"
    range: {low: "informel — seulement la taxe communale d'exploitation", high: "immatriculé IFU — TPS déclarée et payée"}
    materiality: "medium"

  business_is_new:
    value: 0
    unit: "flag (1 = activity created with this moto, 0 = pre-existing activity)"
    prov: "ELICITED"
    source: "Matters because CGI art. 180-3 exempts a newly and regularly created business from the TPS for its first twelve months. \"J'ai acheté ma moto\" says he bought this machine, not that he started the trade with it. Base case 0 — the exemption is not taken, the conservative choice."
    date: "2026-07-27"
    question: "C'est ta première moto en zémidjan, ou tu en as déjà usé d'autres avant celle-là ?"
    range: {low: "moto de remplacement — activité déjà ancienne", high: "première moto — activité créée en même temps"}
    materiality: "low"

  insurance_cost_per_year:
    value: 0
    unit: "XOF/year"
    prov: "ELICITED"
    source: "Third-party motor liability cover is legally compulsory for him (see insurance_obligation_authority in notes and the CIMA citation below), but he did not mention it among his costs and a large share of the Cotonou zem fleet rides uninsured. Base case 0 — the omitting choice, consistent with his silence. Note that a zero here is not a saving; it is an unpriced liability sitting outside the cash flow."
    date: "2026-07-27"
    question: "Tu as une assurance sur la moto — tu payes une prime chaque année, c'est combien ?"
    range: {low: 0, high: 30000}
    materiality: "low"

  tps_rate:
    value: 0.05
    unit: "fraction of annual receipts"
    prov: "SOURCED"
    source: "Benin's Taxe Professionnelle Synthétique is assessed as a flat percentage of annual RECEIPTS, not of profit, and it is libératoire of the impôt sur les bénéfices d'affaires, the patente, the licence and the versement patronal (art. 178). Verified directly in the code text, not from the tax administration's public summary page, which still displays the superseded pre-2024 bracket table (10,000 / 35,000 / 75,000 ... by turnover band). That stale table would have given 35,000 francs on these receipts instead of 101,725 — a live example of a wrong number that ties perfectly."
    authority: "République du Bénin, Code Général des Impôts, édition 2026 (intégrant la loi de finances pour la gestion 2026, loi n°2025-22 du 8 décembre 2025), Livre 1, Titre 3, Chapitre 1, Article 183-1 (modifié par la loi de finances pour 2024). https://api.impots.bj/media/6984ebbbb7bc0_B%C3%A9nin-Code%20G%C3%A9n%C3%A9ral%20des%20Imp%C3%B4ts%202026.pdf — identical text in the 2025 edition at https://finances.bj/wp-content/uploads/2025/01/Benin-Code-General-des-Impots-2025.pdf"
    verified: "2026-07-27"

  tps_minimum:
    value: 10000
    unit: "XOF/year"
    prov: "SOURCED"
    source: "\"Le montant de l'impôt ne peut être inférieur à dix mille (10 000) francs CFA.\" A floor, not a ceiling; it does not bind at this level of receipts but is carried so the check can fail if receipts collapse."
    authority: "Code Général des Impôts du Bénin, édition 2026, Article 183-2."
    verified: "2026-07-27"

  redevance_ortb:
    value: 4000
    unit: "XOF/year"
    prov: "SOURCED"
    source: "\"Il est perçu en sus du montant de l'impôt, un prélèvement d'une redevance de 4.000 FCFA au profit de la société nationale de radiodiffusion et télévision.\" Levied on the same assessment as the TPS and collected with it, so it sits on the tax line rather than in opex."
    authority: "Code Général des Impôts du Bénin, édition 2026, Article 183-3."
    verified: "2026-07-27"

  municipal_taxi_tax_per_year:
    value: 4800
    unit: "XOF/year"
    prov: "SOURCED"
    source: "CGI art. 177 empowers each commune to levy a tax on two- to four-wheel city taxis at a tariff between 0 and 5,000 francs per taxi per month. Cotonou has set its annual taxe d'exploitation at 4,800 francs for two-wheel taxi-motos (7,200 for three-wheelers), i.e. 400 francs a month, inside the statutory band. The founder rides a two-wheeler (see wheels), so 4,800 applies."
    authority: "Statutory basis: Code Général des Impôts du Bénin, édition 2026, Article 177-1 and 177-2 (\"Le tarif de cette taxe est fixé de 0 à 5 000 francs CFA par taxi et par mois\"). Tariff in force: Mairie de Cotonou, taxe annuelle d'exploitation des taxis-motos, announced by the Secrétariat Exécutif — 4 800 FCFA (deux roues) / 7 200 FCFA (trois roues), campaigns of Nov 2024 and Apr 2025, e.g. https://beninwebtv.bj/cotonou-une-operation-de-controle-de-taxe-annoncee-contre-les-zem/"
    verified: "2026-07-27"

  taxi_card_registration_fee:
    value: 300
    unit: "XOF/year"
    prov: "SOURCED"
    source: "Registration fee charged alongside the Cotonou exploitation tax when the carte de droit taxi is issued or renewed. Treated as annual and recurring, which is the conservative reading; if it is a one-off it belongs only in t=0."
    authority: "Mairie de Cotonou, taxe annuelle d'exploitation des taxis-motos — \"frais d'enregistrement de 300 FCFA\", https://beninwebtv.bj/cotonou-une-operation-de-controle-de-taxe-annoncee-contre-les-zem/"
    verified: "2026-07-27"

  tvm_two_wheel_tax:
    value: 0
    unit: "XOF/year"
    prov: "SOURCED"
    source: "The Taxe sur les Véhicules à Moteur does NOT reach a two-wheeler. Art. 166 defines its scope as \"les véhicules à moteur d'au moins trois roues\" — at least three wheels. A three-wheel zem tricycle would pay 15,000 francs a year under art. 168-3; a two-wheel moto pays nothing. Carried explicitly as a zero so the sourced fact is load-bearing in the compliance-cost check rather than silently dropped."
    authority: "Code Général des Impôts du Bénin, édition 2026, Articles 166 (champ) and 168-3 (tarif trois roues)."
    verified: "2026-07-27"

  vat_rate_applicable:
    value: 0.0
    unit: "fraction"
    prov: "SOURCED"
    source: "Fares are received VAT-free. Art. 229-1 exempts from TVA the sales and services of persons whose annual turnover does not exceed the assujettissement threshold of art. 228 (fixed by ministerial arrêté, at the 50 million franc level that also bounds the TPS regime). Receipts here are around two million francs, two orders of magnitude below. Gross fares therefore equal net revenue."
    authority: "Code Général des Impôts du Bénin, édition 2026, Articles 226, 228 and 229-1 (modifié par les lois de finances pour 2023 et 2025)."
    verified: "2026-07-27"

  official_pump_price_essence_super:
    value: 725
    unit: "XOF/litre"
    prov: "SOURCED"
    source: "The administered retail price of essence (super) at Benin service stations, raised by 30 francs with effect from 1 May 2026 (gasoil 750, pétrole lampant 1,040). It matches the founder's stated 725 exactly, which is itself a finding: he is buying at the formal pump, not from the informal roadside trade whose price floats below the administered one."
    authority: "Government of Benin fuel price adjustment effective 1 May 2026, reported at https://www.koaci.com/article/2026/05/04/benin/politique/benin-hausse-des-prix-du-carburant-a-la-pompe-depuis-le-1er-mai_196366.html and https://fr.allafrica.com/stories/202605020023.html"
    verified: "2026-07-27"

  smig_monthly:
    value: 52000
    unit: "XOF/month"
    prov: "SOURCED"
    source: "Benin's guaranteed interprofessional minimum wage, in force since 1 January 2023 for a 40-hour week. Used only for the memo column that prices the founder's own labour; it does not enter the headline FCFF."
    authority: "SMIG de la République du Bénin, 52 000 F CFA pour une durée de travail de 40 heures par semaine, en vigueur depuis le 1er janvier 2023 — Centre des Liaisons Européennes et Internationales de Sécurité Sociale (CLEISS), fiche Bénin, https://www.cleiss.fr/docs/cotisations/benin.html"
    verified: "2026-07-27"

passage: |
  ================================================================================
  0. WHAT IS BEING VALUED, AND THE SHAPE OF THE ANSWER
  ================================================================================
  One man, one motorcycle, Cotonou. The asset is a 600,000-franc moto with a stated four-year
  working life. The question is the unlevered free cash flow that asset throws off over that life,
  built the standard way:

      FCFF = NOPAT + D&A - change in net working capital - capex

  Four annual periods. t=0 is the year the moto is bought and worked; t=3 is its last year. The
  600,000 falls in t=0 and the machine earns from t=0, which is the convention for an asset bought
  at the start of a period and put to work immediately.

  One structural warning up front, because it changes how the tax line must be read. Benin does not
  tax a business of this size on its profit. The Taxe Professionnelle Synthétique is assessed on
  RECEIPTS at 5%, and it is libératoire — it discharges the profits tax, the patente, the licence
  and the versement patronal in one payment (CGI art. 178, art. 183). So NOPAT here is EBIT less an
  operating tax that does not move with EBIT at all. The textbook form EBIT x (1 - t) has no
  meaning in this jurisdiction at this scale; there is no marginal rate on profit to apply. NOPAT
  is computed as EBIT minus the actual cash tax assessed.

  ================================================================================
  1. THE OPERATING DAY, IN HIS UNITS
  ================================================================================
  He counts in courses, not passenger-kilometres, and in days, not shifts. Keep that.

  Working days. "Tous les jours, sauf dimanche" gives six days a week. Annualising: a 365-day year
  holds 52 Sundays (52 x 7 = 364, the odd day counted as a working day), so 365 - 52 = 313 non-Sunday
  days. He named no days off beyond Sunday, so the base case charges none:

      days_worked = 313 - 0 = 313 days, every year.

  This is where the first question sits. Nobody rides 313 days out of 313 for four years. But the
  size of the shortfall is a fact about him, so it is asked, not guessed (days_lost_per_year).

  The twenty courses. He gave three fare tiers and a daily total, and never the mix — and the mix
  runs from 20 x 200 = 4,000 francs a day to 20 x 500 = 10,000. That is a two-and-a-half-fold range
  on the top line, from the same twenty courses. The base case takes the split 7 short / 7 medium /
  6 long. Twenty does not divide by three, and rather than carry 6.6666... courses through every
  line, an exact integer split is used that the utterance permits, with the odd course pushed down
  to the cheaper tiers.

      trips_long_per_day = 20 - 7 - 7 = 6

  Annual course counts:
      short   7 x 313 = 2,191
      medium  7 x 313 = 2,191
      long    6 x 313 = 1,878
      total                  6,260   (cross-check: 20 x 313 = 6,260, ties)

  ================================================================================
  2. REVENUE
  ================================================================================
  Fares are cash on completion and carry no VAT (art. 229-1: below the art. 228 threshold), so
  gross fares are net revenue.

      2,191 x 200 =   438,200
      2,191 x 300 =   657,300
      1,878 x 500 =   939,000
                    ---------
      revenue     = 2,034,500 XOF per year, flat across all four periods.

  Daily cross-check: 7x200 + 7x300 + 6x500 = 1,400 + 2,100 + 3,000 = 6,500 francs a day;
  6,500 x 313 = 2,034,500. Ties.

  Revenue is held flat over the four years. He gave no fare escalation, no volume trend, and no
  basis for either. Holding it flat is a choice, not a forecast, and it is the choice that adds
  nothing he did not say.

  ================================================================================
  3. FUEL — CROSSING FROM COURSES TO KILOMETRES
  ================================================================================
  This is the join that the utterance does not make. He prices his work per course; his fuel burns
  per kilometre. Two things are needed to bridge them, and he supplied neither: how far a course is,
  and how much he rides with nobody on the back.

  Loaded kilometres, per year, at the base-case distances (2.5 / 4.5 / 9 km):

      short   2,191 x 2.5 =  5,477.5
      medium  2,191 x 4.5 =  9,859.5
      long    1,878 x 9   = 16,902.0
                            --------
      km_loaded           = 32,239.0 km per year

  Daily cross-check: 7x2.5 + 7x4.5 + 6x9 = 17.5 + 31.5 + 54 = 103 km loaded per day;
  103 x 313 = 32,239. Ties.

  Empty running. Repositioning after a drop-off, cruising a carrefour, riding home. At a 30% uplift:

      km_total = 32,239.0 x 1.30 = 41,910.7 km per year
                                 = 133.9 km per working day

  Fuel consumed, at his stated 2.5 litres per 100 km:

      litres = 41,910.7 x 2.5 / 100 = 1,047.7675 litres per year
                                    = 3.3475 litres per working day

  Fuel cost, at his stated 725 francs a litre:

      fuel_cost = 1,047.7675 x 725 = 759,631.4375 XOF per year
                                   = 2,426.9375 XOF per working day

  Sense check against revenue: 759,631.44 on 2,034,500 is 37.3% of the top line going into the
  tank, which is where a zem's fuel share normally sits. And the 725 is not his estimate of a market
  price — it is the administered pump price for essence super in force since 1 May 2026. He is
  quoting the formal price exactly, which tells us he fills at a station.

  Fuel is held flat across the four periods: same distances, same days, same administered price.

  ================================================================================
  4. MAINTENANCE — THE COST HE DID NOT MENTION
  ================================================================================
  He listed the moto and the fuel and stopped. But a machine covering roughly 42,000 km a year eats
  oil, tyres, chains, brakes and tubes, and the four-year life he claims is a claim about how long
  it keeps running, not about it running for free. Base case: 20,000 francs a month when new, rising
  linearly by 25% of that figure for each year of age.

      year 1 (t=0):  12 x 20,000 x (1 + 0.25 x 0) = 240,000
      year 2 (t=1):  12 x 20,000 x (1 + 0.25 x 1) = 300,000
      year 3 (t=2):  12 x 20,000 x (1 + 0.25 x 2) = 360,000
      year 4 (t=3):  12 x 20,000 x (1 + 0.25 x 3) = 420,000

  ================================================================================
  5. COMPLIANCE COSTS — WHAT IT COSTS TO BE ALLOWED TO RIDE
  ================================================================================
  Three separate instruments were checked, and one of them turns out to be zero:

    - Cotonou taxe d'exploitation on taxi-motos: 4,800 francs a year for a two-wheeler. The
      statutory hook is CGI art. 177, which lets a commune set a tax on two- to four-wheel city
      taxis at 0 to 5,000 francs per taxi per month; Cotonou has set 400 a month.
    - Carte de droit taxi registration: 300 francs.
    - Taxe sur les Véhicules à Moteur: ZERO. Art. 166 restricts the TVM to vehicles of AT LEAST
      THREE WHEELS. A tricycle zem would pay 15,000 a year under art. 168-3; a two-wheel moto is
      outside the charge altogether. This is exactly the kind of fact that would otherwise be
      guessed wrong in either direction, and it is worth 15,000 a year.
    - Insurance: legally compulsory on him, carried at zero in the base case because he did not
      mention it. See notes — a zero here is a liability, not a saving.

      compliance_cost = 4,800 + 300 + 0 + 0 = 5,100 XOF per year.

  These are levies on the right to operate, not taxes on income, so they sit in opex above EBIT.

  ================================================================================
  6. THE OPERATING LADDER, PER PERIOD
  ================================================================================
                             t=0            t=1            t=2            t=3
    revenue            2,034,500.00   2,034,500.00   2,034,500.00   2,034,500.00
    fuel                 759,631.44     759,631.44     759,631.44     759,631.44
    maintenance          240,000.00     300,000.00     360,000.00     420,000.00
    compliance             5,100.00       5,100.00       5,100.00       5,100.00
                       ------------   ------------   ------------   ------------
    opex               1,004,731.44   1,064,731.44   1,124,731.44   1,184,731.44
    EBITDA             1,029,768.56     969,768.56     909,768.56     849,768.56

  (Figures shown here are rounded for reading; the trace carries them at full precision, all ending
  .5625 or .4375, and every check reproduces them exactly.)

  Depreciation. IAS 16: straight line over the useful life the founder himself states, residual
  equal to the salvage value carried, which is zero in the base case:

      depreciation = (600,000 - 0) / 4 = 150,000 per year

  A units-of-production basis would be equally defensible for a machine whose life is really
  governed by kilometres — and here it would give the identical answer, because base-case usage is
  flat at 41,910.7 km every year. The two methods only diverge once the days-lost question is
  answered.

    EBIT                 879,768.56     819,768.56     759,768.56     699,768.56

  Book value roll-forward, so the capex and the depreciation charge are visibly the same object:

    opening                    0.00     450,000.00     300,000.00     150,000.00
    + capex              600,000.00           0.00           0.00           0.00
    - depreciation       150,000.00     150,000.00     150,000.00     150,000.00
    closing              450,000.00     300,000.00     150,000.00           0.00

  ================================================================================
  7. TAX
  ================================================================================
  TPS on receipts, not on profit:

      5% x 2,034,500 = 101,725 XOF, against a statutory floor of 10,000 (art. 183-2), so the
      percentage governs and the floor does not bind.

  Plus the ORTB levy collected on the same assessment (art. 183-3):

      tax = 101,725 + 4,000 = 105,725 XOF per year, every year.

  Charged from t=0. The twelve-month exemption for a newly and regularly created business
  (art. 180-3) is available but not taken, because nothing he said establishes that the trade
  itself began with this machine.

    NOPAT = EBIT - tax
                         774,043.56     714,043.56     654,043.56     594,043.56

  ================================================================================
  8. WORKING CAPITAL
  ================================================================================
  There is almost none, and that is a real finding rather than a shortcut. Fares are handed over in
  cash at the end of each ride, so there are no receivables. Fuel is paid for at the pump, so there
  are no payables. There is no inventory except the fuel standing in the tank:

      NWC = 4 litres x 725 = 2,900 XOF, constant.

      change in NWC = +2,900 at t=0, then zero.

  Not released at the end of the horizon: the horizon closes because the moto reaches the end of
  its life, not because the man stops trading.

  ================================================================================
  9. FCFF
  ================================================================================
      FCFF = NOPAT + depreciation - change in NWC - capex + disposal proceeds

    t=0:  774,043.5625 + 150,000 - 2,900 - 600,000 + 0 =  321,143.5625
    t=1:  714,043.5625 + 150,000 -     0 -       0 + 0 =  864,043.5625
    t=2:  654,043.5625 + 150,000 -     0 -       0 + 0 =  804,043.5625
    t=3:  594,043.5625 + 150,000 -     0 -       0 + 0 =  744,043.5625

  Reconciled through the cash-flow statement, which must give the same numbers:

    CFO = NOPAT + depreciation - change in NWC
            921,143.5625     864,043.5625     804,043.5625     744,043.5625
    CFI = disposal proceeds - capex
           -600,000.0000              0                0                0
    CFO + CFI    321,143.5625     864,043.5625     804,043.5625     744,043.5625   ties.

  Cumulative FCFF over the moto's life: 2,733,274.25 XOF on a 600,000 franc machine.

  ================================================================================
  10. THE MEMO COLUMN — WHOSE RETURN IS THIS?
  ================================================================================
  The number above is arithmetically correct and economically misleading if read as a return on the
  moto, because the only labour in the business is the founder's and it is unpaid. Nothing in the
  cash flow charges for a man riding twelve-hour days six days a week; the residual therefore mixes
  the return on a 600,000 franc asset with the wage of the person operating it, and does not
  separate them.

  The memo column charges his labour at Benin's SMIG, 52,000 a month:

      owner_labour_cost = 12 x 52,000 = 624,000 per year

  Because the tax is assessed on receipts and not on profit, charging a wage does not change the tax
  line at all, so the memo column is simply FCFF less the wage:

    t=0:  321,143.5625 - 624,000 = -302,856.4375
    t=1:  864,043.5625 - 624,000 =  240,043.5625
    t=2:  804,043.5625 - 624,000 =  180,043.5625
    t=3:  744,043.5625 - 624,000 =  120,043.5625
                                    -------------
    cumulative                        237,274.25

  On a 600,000 franc asset, over its whole life, once the driver is paid the legal minimum. And the
  SMIG is defined for a 40-hour week against a six-day, long-hour one, so even that flatters the
  asset. The headline FCFF is overwhelmingly this man's wage, not his machine's return, and any
  reader using it to price the moto needs to see both columns.


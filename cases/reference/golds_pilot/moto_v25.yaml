notes:
  - |
    THE TAX IS NOT A PROFITS TAX, AND THAT CHANGES THE SHAPE OF NOPAT. Benin's Taxe Professionnelle
    Synthétique is levied on annual RECEIPTS at 5% (CGI art. 183-1) and is libératoire of the
    impôt sur les bénéfices d'affaires, the patente, the licence and the versement patronal
    (art. 178). There is therefore no marginal rate on profit in this jurisdiction at this scale, and
    the familiar EBIT x (1 - t) construction is not available. NOPAT is computed as EBIT less the cash
    tax actually assessed. The consequence for the reader: this business's tax bill does not fall when
    its margin falls. A bad year is taxed at the same absolute amount as a good one, which makes the
    downside steeper than a profits-taxed comparator would suggest.
  - |
    A SOURCED FACT THAT CONTRADICTS THE TAX ADMINISTRATION'S OWN PUBLIC PAGE. The Direction Générale
    des Impôts still publishes a TPS barème by turnover band (10,000 / 35,000 / 75,000 / 150,000 /
    250,000 / 350,000 francs). That table was superseded by the loi de finances pour 2024, which
    replaced it with a flat 5% of receipts plus a 4,000 franc ORTB levy and a 10,000 franc floor. The
    code text was read directly, in both the 2025 and 2026 editions, and both carry the amended
    art. 183. Using the published summary instead of the code would have produced a tax charge that
    reconciles perfectly against a wrong number — precisely the error class that survives every
    internal consistency check.
  - |
    THE TVM DOES NOT APPLY, AND THE WHEEL COUNT IS WHY. Art. 166 restricts the Taxe sur les Véhicules
    à Moteur to vehicles of at least three wheels. A two-wheel zémidjan is outside the charge; a
    three-wheel tricycle zem would pay 15,000 francs a year under art. 168-3 and would also face
    Cotonou's higher 7,200 franc municipal tariff instead of 4,800. The two-wheel reading rests on an
    inference from "ma moto" plus "zémidjan" rather than on anything he said about wheels. If that
    inference is wrong, compliance cost and hence opex rise, in a direction that reduces FCFF.
  - |
    COMPULSORY INSURANCE IS CARRIED AT ZERO, AND THAT ZERO IS A LIABILITY RATHER THAN A SAVING.
    Benin is a CIMA member state, and CIMA Code des assurances art. 200 requires any person other
    than the State whose civil liability may be engaged by damage caused by a véhicule terrestre à
    moteur to hold third-party cover in order to put that vehicle on the road; a motorcycle is such a
    vehicle. The founder did not mention a premium among his costs, and a large part of the Cotonou
    zem fleet operates without one, so the base case follows his silence. The effect on FCFF is small
    and its direction is downward once a premium is paid. The effect on the risk profile is not small:
    an uninsured moto-taxi carries an unpriced, uncapped exposure on every course, in a trade with a
    known injury rate. This belongs in a risk register, not in a cash-flow line.
  - |
    THE HEADLINE FCFF IS MOSTLY WAGES. The only labour input is the founder's own and it is unpaid,
    so the residual conflates the return on a 600,000 franc asset with the earnings of the man riding
    it. The trace carries fcff_after_owner_labour, which charges his time at the statutory SMIG, as a
    checked memo column so the two can be separated. Because the tax is assessed on receipts, the
    wage charge does not disturb the tax line, and the memo column is a clean subtraction. Two further
    cautions on that column, both directional: the SMIG is defined for a 40-hour week whereas he works
    six long days, so the charge understates his labour; and no allowance is made for the fact that
    his labour is also what keeps the asset earning at all, so the memo column should be read as a
    floor on the asset's contribution rather than a measurement of it.
  - |
    THE MILEAGE THE ELICITED DISTANCES IMPLY IS AGGRESSIVE AGAINST THE STATED FOUR-YEAR LIFE. The
    trace row km_cumulative shows what the base-case distances, the empty-running uplift and a
    313-day year add up to over the moto's life. That total sits well above what a low-cost imported
    motorcycle in this market typically covers before a major rebuild. Two readings, and only the
    founder can settle which: either the per-course distances are shorter than the base case, which
    would lower fuel and maintenance and raise FCFF; or the machine really does cover that ground and
    the "quatre bonnes années" are bought with rebuild spending that the maintenance line does not yet
    carry, which would lower FCFF. This tension is the reason km_per_trip_long and
    maintenance_cost_per_month_new carry the highest materiality of any question asked here.
  - |
    IF THE FOUNDER WILL ONLY ANSWER THREE QUESTIONS, ASK THESE THREE, in this order: the split of
    the twenty courses across the 200 / 300 / 500 tiers; what he actually spends on the mechanic in a
    normal month; and where a 500-franc course starts and ends. The first sets the top line, the
    second sets the largest cost he never mentioned, and the third sets the kilometre bridge on which
    both the fuel bill and the maintenance profile hang. Everything else in the question list moves
    the answer by less.
  - |
    WORKING CAPITAL IS GENUINELY NEAR-NIL, WHICH IS A FINDING RATHER THAN A SIMPLIFICATION. Fares are
    handed over in cash at the end of each ride, so no receivables arise. Fuel is bought at the pump
    for cash, so no payables arise. There are no spare parts held in stock — they are bought at the
    mechanic's when needed. The only stock is the fuel standing in the tank, and it is materialised
    rather than assumed away so that the working-capital roll-forward is derived. It is not released
    at the end of the horizon, because the horizon closes when the machine dies, not when the man
    stops trading.
  - |
    ACCOUNTING FRAMEWORK FRICTION. The method brief specifies IAS/IFRS, but Benin is an OHADA member
    and the applicable framework is the SYSCOHADA révisé (AUDCIF). For a business whose entire
    balance sheet is one depreciable asset and one tank of fuel, with no financial instruments, no
    leases and no provisions, the two frameworks give the same answer, so nothing turns on it here.
    A second and larger friction is worth stating plainly: an operator at this scale keeps no books at
    all, and CGI art. 184 nonetheless requires a TPS declaration accompanied by états financiers. The
    accrual statements above are an analyst's construct laid over a cash trade. Apart from
    depreciation, the accrual and cash views of this business coincide exactly.
  - |
    DEPRECIATION METHOD. Straight line over the founder's own stated life, with residual set equal to
    the carried salvage value. A units-of-production basis would arguably suit a machine whose life is
    really governed by kilometres rather than by calendar time — and in the base case it gives an
    identical schedule, because usage is flat at the same kilometres every year. The two methods only
    separate once days_lost_per_year is answered and the annual kilometre profile stops being flat.
  - |
    DEFERRED, AND WHY. No seasonality: Cotonou has two rainy seasons that change both demand and
    riding conditions, and nothing in the utterance sizes either, so an annual grid was chosen rather
    than a monthly one built on invented shape. No fare or fuel price path: fares are held at the
    three stated tiers and fuel at the administered price in force, because he gave no escalation and
    the pump price is set administratively rather than by a trend. No accident, theft or impoundment
    loss. No union or association dues, which many zem riders pay to a syndicat and which were not
    mentioned. No financing: the build is unlevered by construction, and he said nothing about how the
    600,000 was funded. No replacement decision beyond year four, which is the horizon's boundary
    rather than an omission. The AIB advance-tax credits that are imputable against the TPS are
    ignored, which overstates the tax charge and is therefore conservative.
  - |
    ONE INPUT IS DELIBERATELY ANTI-CONSERVATIVE AND FLAGGED AS SUCH. days_lost_per_year is carried at
    zero, meaning the base case has him riding all 313 non-Sunday days for four consecutive years.
    That is what his words assert and it is certainly generous. It is left at zero rather than nudged
    to a guess because the alternative would be to convert a question he can answer into a silent
    prior, which is the one substitution this exercise forbids. The reader should treat every revenue
    and fuel figure above as scaling with whatever fraction of 313 days he actually works.

notes: |
  FINDING — THIS BUSINESS HAS NO ASSET SIDE EXCEPT WORKING CAPITAL. The most consequential
  reading in the whole solution is four words long: "Je paie le magasin". He calls the warehouse
  "mon magasin", which invites the assumption that he owns it, and then in the next breath prices
  it at 30,000 a month, which settles that he rents it. Combined with bought-in transport and
  working alone, that leaves the operation with no fixed assets at all: capex is zero, D&A is
  zero, and the unlevered build collapses to NOPAT minus the working capital movement. Anyone
  modelling this as a warehouse business with a depreciating building would produce a different
  and wrong number while ticking every internal consistency check, which is precisely the class
  of error internal checks cannot catch.

  FRICTION — THE ACCOUNTING REFUSES TO CAPITALISE THE ONE THING HE ACTUALLY DOES. Economically,
  storage is not an overhead here; it is the production process. He manufactures a 5,425 XOF per
  bag price gain out of seven months of holding, and the rent is the direct input to that
  manufacture. The cost-of-inventories rules disagree: transport in is capitalised into the bags
  (AUDCIF coût d'acquisition, IAS 2.11) but storage costs of a merchant are expensed as incurred
  (IAS 2.16(b) and the equivalent AUDCIF position), because the exclusion is drafted around
  production stages and a trader is deemed not to have one. The natural description and the line
  items do not align and the friction is left visible rather than forced. Over the full campaign
  the treatment does not change the total; it changes the monthly profile of EBIT and the
  carrying value of the stock. Direction, if one preferred the economic view: costs would shift
  out of the wait and into the sale months, and the inventory position would carry higher.

  FRICTION — LEASE ACCOUNTING. Under IFRS 16 a warehouse lease running longer than twelve months
  would be capitalised as a right-of-use asset with a matching lease liability, converting rent
  into depreciation plus interest and pushing the cash payment below the FCFF line entirely —
  which would raise reported FCFF while the actual cash position was unchanged and would require
  the lease liability to be carried as debt. That is not the framework here: Mali applies AUDCIF
  / SYSCOHADA révisé, under which a location simple is expensed, and IFRS 16 itself exempts
  short-term leases. Rent is expensed. Flagged because what changes between the two treatments
  is the presentation and the debt classification, not the cash, and a reader comparing this to
  an IFRS-16 model of the same trade would otherwise be comparing two different objects.

  FRICTION — NOPAT DOES NOT MEAN WHAT IT USUALLY MEANS HERE. The impôt synthétique is assessed on
  TURNOVER at 3 %, not on profit. NOPAT = EBIT x (1 - t) is therefore inapplicable, and the
  statutory charge is subtracted from EBIT directly. Two consequences follow that matter beyond
  this model. First, the effective burden on EBIT is an output of the levy meeting this
  particular margin rather than a legislated rate, and it rises without limit as the trading
  spread thins — a turnover levy is a regressive instrument against a low-margin trade, and this
  trade's margin is entirely a price spread that can compress. Second, a turnover base admits no
  interest deduction, so this business has no interest tax shield at all: its unlevered and
  levered tax charges are identical, and the customary FCFF-versus-FCFE tax adjustment is empty.

  JUDGMENT CALL — TAX CASH TIMING. The impôt synthétique is declared and paid on 31 March
  following the taxable year. This campaign's turnover arises in June-August of the grid's second
  calendar year, so its statutory settlement date falls beyond t=11 on any harvest-anchored
  twelve-month horizon. Three options existed: extend the grid to seventeen mostly-dead months;
  carry a tax payable inside NWC, which pushes a real and certain outflow out of the horizon and
  flatters the campaign; or charge and disburse the levy with the revenue that triggers it, which
  is the progressive recognition a turnover-based levy attracts in any case. The third was taken.
  Direction of the resulting error: the modelled cash tax is EARLIER than statute requires, so
  the intra-campaign cash profile in the selling months is understated relative to the legal
  position. The campaign total is unaffected. What would change this call: a founder who runs
  this trade every year in steady state, in which case the prior campaign's liability falling due
  on 31 March inside the grid is the better placement, and the two treatments converge.

  JUDGMENT CALL — WHOSE LABOUR IS IN THIS NUMBER. "Je travaille seul." A sole proprietor's own
  labour is not an employee cost, and what he takes out to live on is a drawing against equity,
  not an operating expense. So no wage line appears and the FCFF above still contains his
  implicit wage: it is not a clean return to capital, and it should not be compared to the FCFF of
  a business that pays a manager. Direction: a true return to capital alone would be lower.
  Deliberately not quantified — nobody, including him, was asked what a year of his work is
  worth, and inventing that number would be exactly the silent guess this method exists to
  prevent.

  ON THE PROVENANCE MIX — THERE ARE NO ASSUMED INPUTS IN THIS SOLUTION, AND THAT IS A CLAIM.
  Every input is STATED, INFERRED from what was stated, SOURCED from a published rule, DEFAULTED
  to a named convention, or ELICITED with the question attached. Nothing was quietly invented.
  That is not a boast about the analysis; it is a property of the business. A one-man,
  one-commodity, one-cycle trade has almost no room for a prior that nobody could state — every
  gap is either a rule that lives in the world and can be looked up, or a fact that lives in his
  magasin and can be asked. The one place where a genuine ASSUMED input would have been
  unavoidable is deliberately excluded: whether next lean season's price will again be 20,000 is
  knowable to no one, and that is the principal reason the horizon stops at one campaign rather
  than running five.

  ON THE BELIEF-VERSUS-RULE SPLIT, TWICE. First, storage loss. He says he sells the two hundred
  bags; the published post-harvest literature does not agree that a Sahelian cereal store loses
  nothing over seven months, and the APHLIS whole-chain figure recorded under
  bags_lost_in_storage is why. His account of his own magasin is a fact about his business and
  the base case runs on it. The published loss profile is a fact about the world and it is a
  different object. They are kept apart and the question is ranked first. Second, tax. The 3 %
  rate and the 50,000,000 ceiling are facts about the world, verified against the DGI; whether
  this particular trader is registered and assessed is a fact about his business that only he can
  supply. A founder can be entirely right about his own operation and entirely wrong about the
  rule that governs it, and the reverse, so the two are recorded as separate inputs.

  RESIDUAL VERIFICATION GAP, STATED RATHER THAN HIDDEN. The impôt synthétique rate, threshold,
  libératoire scope and 31 March deadline were verified against the Direction Générale des Impôts
  du Mali directly and against its 2026 échéance notice. The precise CGI article numbering could
  not be pinned to a single article from a primary text within this exercise — the numbering
  shifted when the threshold was raised from 30 to 50 million XOF, and secondary sources cite
  different articles — so the authority is given as "art. 70 et suivants" plus the administration's
  own published statement, which is the stronger evidence of the operative rule in any case.
  Likewise, the VAT conclusion rests on the verified libératoire scope of the synthétique, with
  the separate cereals exemption in the CGI's exemption list carried as a secondary and less
  precisely verified ground. Both are flagged because a statutory claim taken on trust is the one
  error that survives every internal check: the arithmetic would tie perfectly around a false rate.

  CORROBORATION OF THE STATED PRICES. His purchase price per bag and his lean-season selling
  price both sit on top of independently published Malian market observations for sorghum in
  100 kg bags — the OMA / APCAM market reporting relayed via ORTM gives the same harvest-period
  bag price, and Bamako lean-season retail sorghum at the same per-kilo level his selling price
  implies. He is quoting the market, not a rounded recollection. This raises confidence in the
  two price inputs specifically. It does not raise confidence in the volume inputs, which are the
  ones carrying the high-materiality questions.

  ON THE BAG. He counts in "sacs" and every price and cost in this model is already per bag, so
  no figure below depends on what a sac weighs. The corroborating market data is quoted per
  100 kg bag and his prices match it at that size, which is the natural West African cereal
  trading unit. Recorded for the reader's orientation only, and kept out of the inputs precisely
  because it enters no derivation.

  WHAT IS DEFERRED. Financing is excluded by construction, this being an unlevered measure — how
  the November trough is funded (own savings, supplier credit, a warrantage loan against the
  stock) belongs to FCFE, not here. But there is a boundary case worth naming: if credit-priced
  grain carries a higher purchase price than cash-priced grain, then the funding decision changes
  FCFF and not merely FCFE, which is one of two reasons the purchase payment terms are ranked
  high. No scaling, no second campaign, no price path and no terminal value are modelled, for the
  reasons given in the grid rationale.

  IF THE FOUNDER WILL ONLY ANSWER THREE QUESTIONS, ASK THESE. How many of the two hundred bags
  actually survive to June. Whether he is registered with the DGI and pays the impôt synthétique.
  Whether the two hundred bags are paid for in cash in November. The first two move the number;
  the third moves the shape of the year, which for a business that lives eight months in deficit
  is the same thing as moving the number.

  # ── as literally published: unbalanced worksheet columns ────────────────
  worksheet_columns_as_printed_usd:
    income_statement_columns:
      debit: {gas_expense: 53, advertising_expense: 35, depreciation_expense_equipment: 35, supplies_expense: 85, salaries_expense: 420, total_debits: 628}
      credit: {lawn_mowing_revenue: 2350, total_credits: 2350}

id: ext_table_olive_establish_ucd2023
title: "UC Davis 2023 Sample Costs to Establish a Modern Table Olive Orchard and Produce Table Olives, Central Valley — the full 6-year establishment-and-ramp schedule (Table 1) plus the mature year-8+ budget (Table 3)"

meta:
  source:
    - "Elizabeth Fichtner, Daniel A. Sumner, Jeremy Murdock et al. (University of California Cooperative Extension, Agricultural and Resource Economics, UC Davis), '2023 Sample Costs to Establish an Orchard and Produce Table Olives — Modern Planting, San Joaquin Valley/Central Valley', November 2023. TABLE 1 'Costs per acre to establish a modern table olive orchard' (pp.12-13, the 1st-6th year columns and both accumulated rows); Table D 'Annual Table Olive Yield' (p.6); Harvest/Yield/Returns text (p.6); Establishment Cost text (p.9); TABLE 3 'Costs and returns per acre to produce table olives' (pp.15-16, the year 8+ mature year). https://coststudyfiles.ucdavis.edu/uploads/pub/2023/11/30/2023moderntableolivedraft11302023.pdf"
  accessed: "2026-08-12"
  licence: >
    "(c) 2023 The Regents of the University of California, Division of Agriculture
    and Natural Resources." UC ANR cost studies are published free of charge for
    public use; no open licence statement is printed in the document. Transcribed
    here, with full citation, for engine-verification/research use only.
  kind: trade_case
  unit_of_analysis: "one planted acre (the study farm is 45 acres, 40 planted to olives)"
  mechanism: grow_then_sell
  # ── HAND-HARVESTED 2026-08-12, cycle-time/residence batch ────────────────
  # L3: revenue in EVERY year is one quantity x one price -- tons/acre from
  # Table D times the study's single $1,150/ton price -- so INCOME/ACRE FROM
  # PRODUCTION is fully re-derivable, unlike landbank_beef's 4-line income sum.
  resolution: L3
  basis: "per planted acre, 242 trees/acre, hedgerow (modern) table olive planting, Manzanillo, $1,150/ton"
  # SIX periods -- the reason this gold was harvested. Years 1-6 of the orchard,
  # each with its own cost stack, its own yield, its own income and its own
  # closing accumulated balance. The whole opening + movement = closing
  # roll-forward is checkable SIX times over, twice (once on the cash-cost
  # ladder, once on the total-cost ladder). The 7th "period" (Table 3, the
  # year-8+ mature steady state) is transcribed in expected_mature_year8plus
  # but is a steady state, not a 7th step of the same roll-forward.
  periods: 6
  jurisdiction: US
  currency: USD

inputs:
  planting:
    trees_per_acre: 242              # Table 1, "Trees: 242 Per Acre"
    orchard_acres_planted: 40        # p.9: 40 acres planted, 45-acre farm
    price_usd_per_ton: 1150          # p.6 Returns; also Table 1 header
  # ── THE CYCLE ITSELF: a 3-year gap with no crop at all, then a 6-year
  #    climb to a plateau the study holds for a further 40 years ────────────
  years_to_first_crop: 3             # p.6: "Table olives begin bearing an
  #                                    economic crop in the third year after
  #                                    planting"; p.9: "production begins the
  #                                    3rd year"
  years_to_maximum_yield: 8          # p.6: "a maximum yield of 7.0 tons is
  #                                    reached in the 8th year"
  producing_life_years_after_establishment: 40   # p.9: establishment cost
  #                                    "amortized beginning in the fourth year
  #                                    over the remaining 40 years"
  yield_tons_per_acre_by_year:       # Table D, p.6 (years 3-8+); years 1-2
    "1": 0                           # print blank in Table 1 = no crop
    "2": 0
    "3": 2.0
    "4": 3.5
    "5": 4.5
    "6": 5.5
    "7": 6.0
    "8plus": 7.0

  # ── Table 1, year by year, EXACTLY as printed (blank = the line is not
  #    charged that year) ────────────────────────────────────────────────────
  costs_by_year_usd:
    year1:
      total_pre_plant: 1315          # laser level 500 + rip 600 + stubble disc
      #                                80 + pull ridges 20 + finish disc 40 +
      #                                triplane 75
      total_planting: 5520           # survey 35 + trellis&planting 2100 +
      #                                trees 1210 + drip install 2100 + wrap 75
      total_cultural: 849
      total_harvest: 0
      interest_on_operating_capital: 457
      total_operating: 8141
      total_cash_overhead: 588
      total_cash: 8728
      capital_recovery: 2120
      total_cost: 10849
    year2:
      total_planting: 10             # replant 3% in 2nd year, labour only
      total_cultural: 957
      total_harvest: 0
      interest_on_operating_capital: 31
      total_operating: 997
      total_cash_overhead: 588
      total_cash: 1585
      capital_recovery: 2120
      total_cost: 3706
    year3:
      total_cultural: 1261
      total_harvest: 1240            # hand harvest 1200 + haul 40
      interest_on_operating_capital: 45
      total_operating: 2546
      total_cash_overhead: 588
      total_cash: 3134
      capital_recovery: 2127
      total_cost: 5261
    year4:
      total_cultural: 1545
      total_harvest: 2170            # hand harvest 2100 + haul 70
      interest_on_operating_capital: 66
      total_operating: 3781
      total_cash_overhead: 703
      total_cash: 4484
      capital_recovery: 2963
      total_cost: 7447
    year5:
      total_cultural: 2077
      total_harvest: 1515            # mechanical 1425 + haul 90
      interest_on_operating_capital: 79
      total_operating: 3671
      total_cash_overhead: 703
      total_cash: 4375
      capital_recovery: 2963
      total_cost: 7338
    year6:
      total_cultural: 1777
      total_harvest: 1685            # mechanical 1575 + haul 110
      interest_on_operating_capital: 74
      total_operating: 3536
      total_cash_overhead: 703
      total_cash: 4240
      capital_recovery: 2945         # SEE NOTES -- this printed figure does
      #                                NOT equal its own 7 components (2,963)
      total_cost: 7203
  # capital-recovery components, printed identically in all six columns except
  # for the two lines that change; transcribed once because the year-6 total is
  # the gold's one real internal contradiction (see notes)
  capital_recovery_components_usd:
    shop_building: 283
    orchard_establishment_amortised_from_year4: 836
    fuel_tank: 25
    land: 1260
    well_pump_filter: 467
    shop_tools: 32
    equipment_years1_2: 53
    equipment_years3plus: 60

  # ── Table 3, the mature (year 8+) steady state, 7 tons/acre ──────────────
  mature_year8plus:
    yield_tons_per_acre: 7
    price_usd_per_ton: 1150
    operating_cost_components_usd:
      herbicide: 121
      fungicide: 125
      insecticide: 117
      custom: 2525               # hedging 125 + skirting 75 + hand prune 250 +
      #                            shred 100 + PCA 35 + mech harvest 750 +
      #                            hand harvest 1,050 + hauling 140
      irrigation_water: 563
      fertilizer: 100
      labor: 360
      machinery: 115
      interest_on_operating_capital: 75
    cash_overhead_components_usd:
      liability_insurance: 16
      office_expense: 75
      sanitation_fee: 14
      regulatory_compliance_fees: 40
      crop_insurance: 137
      property_taxes: 288
      property_insurance: 20
      investment_repairs: 251
    non_cash_overhead_capital_recovery_usd:
      buildings: 283
      fuel_tank: 25
      land: 1260
      shop_tools: 32
      well_pump_filter: 467
      orchard_establishment_modern: 836
      equipment: 60
    # the harvest split that ties the mature budget back to the p.6 text
    harvest_split_check: "p.6: shaker removes 75% of the crop for $750/acre;
      the remaining 25% is handpicked at $600/ton. 25% of 7 tons = 1.75 tons,
      and Table 3 prints exactly 'Hand Harvest 1.75 Ton @ 600.00 = 1,050'."

  # the 17 genuine per-acre cost lines of the MATURE year (Table 3), for any
  # engine that wants a single-period cost_of_sales rather than the schedule
  costs:
    herbicide: 121
    fungicide: 125
    insecticide: 117
    custom_operations: 2525
    irrigation_water: 563
    fertilizer: 100
    labor: 360
    machinery: 115
    interest_on_operating_capital: 75
    liability_insurance: 16
    office_expense: 75
    sanitation_fee: 14
    regulatory_compliance_fees: 40
    crop_insurance: 137
    property_taxes: 288
    property_insurance: 20
    investment_repairs: 251
  revenue: 8050                     # mature year: 7 tons x $1,150

expected:
  # ── the six-period roll-forward, cash ladder (Table 1, top block) ─────────
  income_per_acre_by_year_usd:
    year3: 2300                     # 2.0 t x 1,150
    year4: 4025                     # 3.5 t x 1,150
    year5: 5175                     # 4.5 t x 1,150
    year6: 6325                     # 5.5 t x 1,150
  net_cash_cost_per_acre_by_year_usd:
    year1: 8728
    year2: 1585
    year3: 834                      # 3,134 - 2,300
    year4: 459                      # 4,484 - 4,025
  profit_per_acre_above_cash_costs_by_year_usd:
    year5: 800                      # 5,175 - 4,375
    year6: 2085                     # 6,325 - 4,240
  accumulated_net_cash_costs_per_acre_usd:
    year1: 8728
    year2: 10313
    year3: 11147                    # = the study's ESTABLISHMENT COST
    year4: 11606
    year5: 10806
    year6: 8721
  establishment_cost_per_acre_usd: 11147
  establishment_cost_40_acres_usd: 445880     # p.9, = 11,147 x 40 exactly
  # ── the same six periods on the FULL-cost ladder (Table 1, lower block) ──
  total_cost_per_acre_by_year_usd:
    year1: 10849
    year2: 3706
    year3: 5261
    year4: 7447
    year5: 7338
    year6: 7203
  total_net_cost_per_acre_by_year_usd:
    year1: 10849
    year2: 3706
    year3: 2961                     # 5,261 - 2,300
    year4: 3422                     # 7,447 - 4,025
    year5: 2163                     # 7,338 - 5,175
    year6: 878                      # 7,203 - 6,325
  total_accumulated_net_cost_per_acre_usd:
    year1: 10849
    year2: 14555
    year3: 17516
    year4: 20938
    year5: 23101
    year6: 23979
  # ── the mature steady state (Table 3) ────────────────────────────────────
  expected_mature_year8plus:
    total_gross_returns_usd: 8050
    total_operating_costs_per_acre_usd: 4101
    total_operating_costs_per_ton_usd: 586        # 4,101 / 7 = 585.86
    net_returns_above_operating_costs_usd: 3949   # 8,050 - 4,101
    total_cash_overhead_per_acre_usd: 840         # see notes: components sum
    #                                               to 841 as displayed
    total_cash_overhead_per_ton_usd: 120
    total_cash_costs_per_acre_usd: 4941
    total_cash_costs_per_ton_usd: 706
    net_returns_above_cash_costs_usd: 3109        # 8,050 - 4,941
    total_non_cash_overhead_per_acre_usd: 2963
    total_non_cash_overhead_per_ton_usd: 423
    total_cost_per_acre_usd: 7904
    total_cost_per_ton_usd: 1129
    net_returns_above_total_cost_usd: 146         # 8,050 - 7,904
    total_non_cash_overhead_investment_per_producing_acre_usd: 39354

# the mature-year (Table 3) figures are the ones that map onto a single-period
# revenue/cost_of_sales/gross_margin contract; the six establishment years are
# a SCHEDULE and are checked row by row in `expected` above, not through the
# single-period mapping.
mapping:
  expected_mature_year8plus.total_gross_returns_usd: revenue
  expected_mature_year8plus.total_cost_per_acre_usd: cost_of_sales
  expected_mature_year8plus.net_returns_above_total_cost_usd: gross_margin

tolerance:
  abs: 1.5
  why: >
    every figure in Tables 1 and 3 is printed as a whole dollar, so 0.5 is the
    display rounding; the study's own column sums carry a further +/-1 of
    accumulated display rounding (year 2 operating 997 vs 998 by hand, year 5
    cash 4,375 vs 4,374, year 6 cash 4,240 vs 4,239, mature cash overhead 840
    vs 841) because it sums unrounded cells and prints rounded ones. 1.5
    absorbs exactly that and nothing more -- it is deliberately too tight to
    hide the two REAL errors this gold records (the $18 capital-recovery gap
    in year 6 and the $33 land-value addition), which are transcribed as
    printed rather than corrected.

notes: |
  WHY THIS ONE WAS HARVESTED: it is a SIX-PERIOD schedule with a real
  years-to-bearing gap. Years 1 and 2 produce nothing at all, year 3 produces
  2.0 tons, and the yield climbs 2.0 -> 3.5 -> 4.5 -> 5.5 -> 6.0 -> 7.0 tons
  before flattening for a further 40 years. Both accumulated rows are genuine
  roll-forwards -- opening balance + this year's movement = closing balance --
  and each is checkable six times. Almost every other gold in this repo is a
  single-period snapshot.

  RE-DERIVED THE WHOLE CHAIN BY HAND. What ties EXACTLY:
    - Year 1 operating: 1,315 + 5,520 + 849 + 457 = 8,141 exact. Cash:
      8,141 + 588 = 8,728 exact.
    - Year 3 operating: 1,261 + 1,240 + 45 = 2,546 exact; cash 3,134 exact.
    - Year 4 operating: 1,545 + 2,170 + 66 = 3,781 exact; cash 4,484 exact.
    - Income every year = tons (Table D) x $1,150: 2.0 -> 2,300; 3.5 -> 4,025;
      4.5 -> 5,175; 5.5 -> 6,325. All four exact, and Table D sits on a
      different page from Table 1 -- two unrelated pages reconciling.
    - Net cash cost / profit above cash cost: 3,134-2,300=834, 4,484-4,025=459,
      5,175-4,375=800, 6,325-4,240=2,085. All four exact.
    - ACCUMULATED NET CASH COSTS, the roll-forward: 8,728 -> +1,585 = 10,313
      -> +834 = 11,147 -> +459 = 11,606 -> -800 = 10,806 -> -2,085 = 8,721.
      All five steps exact, and the year-3 closing balance (11,147) is quoted
      independently on p.9 as the establishment cost, where 11,147 x 40 acres
      = 445,880 is also printed -- exact.
    - TOTAL ACCUMULATED NET COST, the second roll-forward: 10,849 -> 14,555 ->
      17,516 -> 20,938 -> 23,101 -> 23,979. All five steps exact.
    - Mature year (Table 3): operating components sum to 4,101 exact
      (121+125+117+2,525+563+100+360+115+75); 4,101/7 = 585.86 -> 586 exact;
      8,050-4,101 = 3,949 exact; 4,101+840 = 4,941 exact; 4,941+2,963 = 7,904
      exact; 8,050-7,904 = 146 exact. Custom sub-lines 125+75+250+100+35+750+
      1,050+140 = 2,525 exact. Hand harvest 1.75 t x $600 = 1,050, and 1.75 t
      is exactly the 25% of a 7-ton crop the p.6 text says is handpicked --
      another two-pages-apart reconciliation.
    - Non-cash overhead investment: 3,000+274+18,000+250+6,220+11,147+463 =
      39,354 exact.

  DISPLAY-ROUNDING GAPS (+/-1, not errors): year-2 operating hand-sums to 998
  vs 997 printed; year-5 cash to 4,374 vs 4,375; year-6 cash to 4,239 vs
  4,240; Table 3 cash overhead to 841 vs 840. The study sums unrounded cells
  and prints rounded ones, so a $1 gap on a column of ~8 rounded lines is
  expected, and every DOWNSTREAM figure uses the printed value consistently.

  TWO GENUINE SELF-CONTRADICTIONS, transcribed as printed and NOT corrected:
    1. Table 1, year 6, TOTAL CAPITAL RECOVERY COST prints 2,945. Its own
       seven components in that same column are 283 + 836 + 25 + 1,260 + 467 +
       32 + 60 = 2,963 -- identical to the years 4 and 5 columns, which BOTH
       print 2,963. And the row immediately below, TOTAL COST/ACRE FOR THE
       YEAR, prints 7,203 = 4,240 + 2,963, i.e. the rest of the table uses
       2,963 and only this one cell says 2,945. An $18 typo in a printed
       subtotal that nothing downstream inherits.
    2. p.9, Land: "the producing acreage is estimated to be worth 29,114 per
       acre. It is the crop land value plus the establishment cost ($18,000 +
       $11,147 = $29,114)." 18,000 + 11,147 = 29,147, not 29,114 -- a digit
       transposition in the source's own printed addition. Both operands are
       independently confirmed elsewhere in the document (Table 3 prints Land
       at 18,000 per producing acre; Table 1 year 3 accumulated prints
       11,147), so the two inputs are right and only the sum is wrong. The
       29,114 figure is not used in any table, so nothing downstream inherits
       it either.

  GAPS (the source does not print these, so they are not asserted here): no
  NPV/IRR of the establishment schedule; no year-7 column in Table 1 (the
  schedule stops at year 6 and jumps to the year-8+ steady state in Table 3);
  and no tree-mortality/replant assumption beyond the "3% in 2nd year" replant
  labour line.

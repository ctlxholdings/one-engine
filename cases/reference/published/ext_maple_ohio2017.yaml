id: ext_maple_ohio2017
title: "Ohio State University Extension — 2017 Maple Syrup Business Planning Guide, Vacuum Tubing System (1,000 taps, oil-fired evaporator, 400 gallons syrup)"

meta:
  source:
    - "Les Ober, Program Coordinator Agriculture & Natural Resources, The Ohio State University Extension (Geauga County), '2017 Maple Syrup Business Planning Guide — Vacuum Tubing Systems': https://holmes.osu.edu/sites/holmes/files/imce/Program_Pages/Maple/OMD2020Handouts/2017%20Financial%20Analysis%20Guide%20for%20Maple%20Syrup.pdf"
    - "Companion 'Bucket System' version of the same guide (250 gallons syrup, same publisher/year), used only as a cross-check in these notes: https://farmoffice.osu.edu/sites/aglaw/files/site-library/farmmgtpdf/enterprisebudgets/2017MapleSyrupBudgetBucketSystem.pdf"
  accessed: 2026-08-11
  licence: public/extension
  kind: trade_case
  unit_of_analysis: "per season, whole operation (1,000 taps, vacuum tubing collection, oil-fired 3x10 evaporator, 400 gallons of finished syrup)"
  mechanism: make_to_order
  mechanism_note: "sap is TAPPED (a renewable annual harvest, not a depleting stock, so not 'extract') then BOILED DOWN through a defined process (sap:syrup ratio, evaporator throughput) into a finished, canned product — a recipe/process converts raw material into a new good, which is the create x physical / assemble transformation. The tapping side alone would look more like grow_then_sell; this gold's cost structure is dominated by the processing (evaporator fuel, canning, equipment) side, so make_to_order is the better fit for the mechanism this gold exercises."
  # ── HAND-LABELLED 2026-08-12 ─────────────────────────────────────────
  resolution: L2          # revenue is TWO lines at TWO different prices
  #                          (retail half + bulk half) — not one sale
  basis: "per season, one operation (1,000 taps, 400 gallons syrup, oil fuel scenario)"
  periods: 1
  jurisdiction: US
  currency: USD

inputs:
  taps: 1000
  collection_system: "vacuum tubing"
  yield_gal_syrup_per_tap: 0.400
  total_syrup_gallons: 400
  evaporator: "3x10, oil-fired, rated 100 gallons-sap-per-hour (2% sap), draws off 2.3 gallons syrup/hour"
  fuel_choice_for_this_transcription: "oil (the source also prices an all-wood alternative; both columns are priced per unit below where they differ)"
  revenue:
    retail_half: {gallons: 200, price_usd_per_gal: 50.00, total_usd: 10000, note: "printed unit price in the extracted table read '$30.00', which does NOT reconcile against the printed $10,000 retail total (200gal x $30=$6,000 <> $10,000); $50.00/gal DOES reconcile exactly (200x50=10,000) and matches the Bucket System companion document's retail price for the same publisher/year — treating $50.00 as correct and $30.00 as a PDF-extraction misread, flagged explicitly in notes"}
    bulk_half: {gallons: 200, price_usd_per_lb: 2.60, price_usd_per_gal: 28.60, total_usd: 5720}
  variable_costs_per_gal_and_per_season_oil:
    evaporator_fuel: {per_gal_usd: 7.82, per_season_usd: 2880.00, basis: "9 gal fuel oil/hr x $2.00/gal / 2.32 gal-syrup/hr drawoff = $7.82/gal-syrup (physically derived rate, per footnote 1)"}
    fuel_diesel_gasoline: {per_gal_usd: 0.50, per_season_usd: 200.00}
    utilities: {per_gal_usd: 1.50, per_season_usd: 600.00}
    canning_supplies: {per_gal_usd: 4.00, per_season_usd: 1600.00, basis: "50% of crop canned in gallon containers, current case-lot plastic container prices"}
    repairs: {per_gal_usd: 1.25, per_season_usd: 500.00}
    labor_operate_tubing_system: {hours: 80, rate_usd_per_hour: 11.00, per_gal_usd: 2.20, per_season_usd: 880.00}
    marketing: {per_gal_usd: 0.37, per_season_usd: 148.00}
    interest: {per_gal_usd: 1.65, per_season_usd: 660.00, basis: "$0.15/lb based on Cornell University Maple Enterprise Business Summary"}
    miscellaneous: {per_gal_usd: 0.25, per_season_usd: 100.00}
  fixed_costs_per_gal_and_per_season_oil:
    equipment_expense: {per_gal_usd: 9.51, per_season_usd: 3565.00}
    operator_labor_sugarhouse_mgt: {hours: 163, rate_usd_per_hour: 15.00, per_gal_usd: 6.00, per_season_usd: 2400.00, breakdown: "processing 123 hrs + setup/cleanup 20 hrs + canning 20 hrs = 163 hrs total"}
    insurance_product_liability: {per_gal_usd: 0.50, per_season_usd: 200.00}
  equipment_investment_table:
    tubing_system: {total_usd: 10000, life_yr: 5, seasonal_usd: 1000}
    vacuum_system_pump_extractor: {total_usd: 6000, life_yr: 10, seasonal_usd: 600}
    storage_tanks: {total_usd: 2800, life_yr: 20, seasonal_usd: 140}
    evaporator_3x10_oil_fired: {total_usd: 20000, life_yr: 20, seasonal_usd: 1000}
    building_20yr: {total_usd: 15000, life_yr: 20, seasonal_usd: 750}
    filter_press_and_canning_tank: {total_usd: 3500, life_yr: 20, seasonal_usd: 175}
    miscellaneous: {total_usd: 1400, life_yr: 10, seasonal_usd: 140}
    total_usd: 58700
    total_seasonal_depreciation_usd: 3805
  # ── HAND-LABELLED 2026-08-12 ─────────────────────────────────────────
  # The 12 genuine cost lines (9 variable + 3 fixed), using the season-total
  # `per_season_usd` cells above (the per-gallon rates are the SAME costs at
  # a different unit, not additional lines — using them too would double
  # count). EXCLUDED: `equipment_investment_table` (capex/stock, not a
  # period cost — its depreciation is already the `equipment_expense` fixed
  # line, even though that line's own dollar figure doesn't equal the
  # table's own seasonal-depreciation total; see notes below, an existing,
  # already-flagged finding in this file).
  costs:
    evaporator_fuel: 2880.00
    fuel_diesel_gasoline: 200.00
    utilities: 600.00
    canning_supplies: 1600.00
    repairs: 500.00
    labor_operate_tubing_system: 880.00
    marketing: 148.00
    interest: 660.00
    miscellaneous: 100.00
    equipment_expense: 3565.00
    operator_labor_sugarhouse_mgt: 2400.00
    insurance_product_liability: 200.00

expected:
  total_receipts_usd: {value: 15720, label_as_printed: "Receipts", composition_as_printed: "10000 (retail) + 5720 (bulk) = 15720"}
  total_variable_cost_oil:
    per_gal_usd: 19.54
    per_season_usd: 7568.00
    label_as_printed: "Total Variable Cost"
    composition_as_printed: "per-season: 2880+200+600+1600+500+880+148+660+100 = 7568 exact"
  total_fixed_cost_oil:
    per_gal_usd: 16.01
    per_season_usd: 6165.00
    label_as_printed: "Total Fixed Cost"
    composition_as_printed: "per-season: 3565+2400+200 = 6165 exact"
  total_cost_oil:
    per_gal_usd: 35.55
    per_season_usd: 13733.00
    label_as_printed: "Total Cost"
    composition_as_printed: "19.54+16.01=35.55 (per gal); 7568+6165=13733 (per season), both exact"
  return_above_total_cost_oil: {value: 1987.00, label_as_printed: "Return above Total Cost", composition_as_printed: "15720 - 13733 = 1987"}
  return_above_variable_costs_oil: {value: 8152.00, label_as_printed: "Return above Variable Costs", composition_as_printed: "15720 - 7568 = 8152"}
  return_to_labor_and_management_oil:
    value: 4387.00
    label_as_printed: "Return to Labor & Management"
    composition_as_printed: "= receipts minus total expenses EXCEPT operator labor/mgmt = 15720 - (13733-2400) = 15720-11333 = 4387"
  wood_fired_alternative_totals_same_document:
    total_variable_cost_per_season: 8488.00
    total_fixed_cost_per_season: 6165.00
    total_cost_per_season: 14653.00
    return_above_total_cost: 1067.00
    return_above_variable_costs: 7232.00
    return_to_labor_and_management: 3467.00
    note: "not the primary transcription (kept to one fuel scenario); included as a same-source cross-check value only"

# cost_of_sales is deliberately NOT mapped: `total_variable_cost_oil` /
# `total_fixed_cost_oil` / `total_cost_oil` above are all {per_gal_usd,
# per_season_usd} pairs with no single `value`, by design (this source
# genuinely prints costs in two units at once) — revenue and the full-cost
# margin are enough to check the cost build-up indirectly.
mapping:
  total_receipts_usd: revenue
  return_above_total_cost_oil: gross_margin

# HALF A DOLLAR, deliberately tight (every season-total figure prints as a
# whole dollar and the headline totals reconcile EXACTLY per the notes
# below, despite two flagged line-level oddities that do not affect them).
tolerance:
  abs: 0.5
  why: >
    every season-total figure is printed with zero decimal places, so 0.5
    is exactly the display rounding; the four headline totals and three
    return figures all reproduce exactly by hand, so any gap would be real

notes: |
  Fully re-derived by hand. The four HEADLINE totals and three RETURN figures all reconcile
  EXACTLY, and reconciling them is what surfaced two genuine internal inconsistencies in this
  Ohio State spreadsheet-turned-PDF, both worth flagging precisely (not embarrassing — this is
  the kind of finding this harvest is explicitly looking for):

  1. RETAIL PRICE MISREAD, RESOLVED BY ARITHMETIC: the PDF-extraction text showed "$30.00" next to
     "1/2 retail," but 200 gal x $30.00 = $6,000, which contradicts the document's own printed
     component total of "$10,000 retail." 200 gal x $50.00 = $10,000 exactly, and $50.00/gal is
     also the retail price printed in the companion Bucket-System document from the same
     publisher/year. I've transcribed $50.00 as the correct retail price (backed by two
     independent arithmetic/cross-document checks) and flag $30.00 as a probable PDF-text-
     extraction artifact, not a source error — I cannot fully rule out a genuine typo in the
     original spreadsheet without the native Excel file, so treat the $50.00 figure as
     HIGH-CONFIDENCE-BUT-NOT-CERTAIN.

  2. GENUINE CROSS-SCENARIO INCONSISTENCY IN THE SOURCE: "Evaporator Fuel" prints the IDENTICAL
     per-season dollar total ($2,880 oil / $3,800 wood) in BOTH this 400-gallon Vacuum Tubing
     budget AND the companion 250-gallon Bucket System budget, despite the two scenarios producing
     different total syrup volumes. The stated "Per Gal./Syrup" rate ($7.82 oil, described in a
     footnote as a physically-derived constant of the evaporator: 9 gal oil/hr x $2/gal / 2.32 gal
     syrup/hr = $7.82) does NOT multiply out to either scenario's printed per-season total (7.82 x
     400 = $3,128, not $2,880; 7.82 x 250 = $1,955, not $2,880 either — the SAME $2,880 appears in
     both documents regardless of scale). This looks like a template copy/paste that was not
     recalculated when the preparer adapted one fuel-cost scenario into the other. Similarly,
     "Equipment Expense" per-season ($3,565) does not equal the Equipment Investment table's own
     stated seasonal depreciation total ($3,805) — a $240 gap I could not further explain from the
     printed material. IMPORTANT: despite these two line-item inconsistencies, the SECTION
     subtotals (Total Variable Cost, Total Fixed Cost) and everything downstream (Total Cost, all
     three Return figures) are perfectly self-consistent — i.e. the "Evaporator Fuel" and
     "Equipment Expense" dollar figures I've transcribed are exactly what the season-total columns
     used to build Total Variable/Fixed Cost, so the headline "answer" a checker would validate
     against is NOT affected by the inconsistency; only a fully bottom-up rebuild from the
     PHYSICAL derivation (taps -> hours -> gallons -> fuel) would diverge from the printed line.

  Both findings are documented here so an engine check knows exactly which numbers are safe to
  treat as ground truth (the season-total columns, fully self-consistent) versus which numbers
  carry an unresolved scaling question (the per-gallon derived rates, which don't cleanly imply
  the season totals via simple multiplication by gallons).

    year_4_at_70pct: {value: 10500, composition: "15,000 x 70%"}
    year_5_at_80pct: {value: 12000, composition: "15,000 x 80%"}
    year_7_and_10_at_100pct: {value: 15000, composition: "15,000 x 100%"}
  # ══ THE PRICE — §III.A.3, p.47-6. A SERVICE CHARGE, not a product price ══

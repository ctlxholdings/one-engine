    utilities_per_year: {value: 76400, unit: ETB, composition_as_printed: "electricity 160,000 kWh at about Birr 76,000 + water 300 tonnes at about Birr 400"}
    total_manpower_per_year: {value: 232200, unit: ETB, composition_as_printed: "sub-total of 15 salary lines 185,760 + employees' benefit at 25% = 46,440"}
    training_one_off: {value: 25000, unit: ETB}
  financing_assumptions_as_printed:
    construction_period_years: 2

  # operating costs 400.00, Total Production Cost 1,336.90); a total would
  # double-count against its own parts. Every figure is repeated verbatim from
  # `expected.annual_production_cost_table` below; nothing new is read out of
  # the source here.
  #
  # BASIS: ETB THOUSAND, TABLE YEAR 3 = the FIRST OPERATING YEAR at 60% of
  # capacity — exactly the year `meta.basis` names and the year the mapped
  # cost total (`total_production_cost_year_3`) is printed for. Years 4, 7 and
  # 10 are printed too and stay in `expected`; putting more than one year's
  # column here would charge four years of cost against a one-period template.
  #
  # ALL EIGHT LINES ARE INCLUDED, INCLUDING DEPRECIATION AND FINANCE, because
  # the figure `mapping` binds to `cost_of_sales` is the source's TOTAL
  # PRODUCTION COST, which the source itself builds as operating costs +
  # depreciation + cost of finance. Stopping at the six operating lines would
  # produce a number the source never struck against the total this gold
  # checks. (No cotton appears because none is bought: this is a tolling
  # service, and the 200.00 "Raw Material and Inputs" line at full capacity is
  # exactly the Birr 200,000 of steel bands, hessian and rope of §IV.A.)
  #
  # HAND CHECK: 120.00 + 74.50 + 45.80 + 67.20 + 27.90 + 64.66 + 518.80 +
  # 418.10 = 1,336.96, against the source's printed Total Production Cost of
  # 1,336.90 — 0.06 OVER, NOT exact. The gap is the source's own, and it is
  # already identified in the notes below: the six operating lines sum to
  # 400.06 against a printed subtotal of 400.00 (Birr 60), and the Total
  # Production Cost line is then built on the PRINTED 400.00, so the error
  # stops there. Every figure kept exactly as printed; nothing reconciled.
  costs:

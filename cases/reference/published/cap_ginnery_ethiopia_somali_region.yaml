id: cap_ginnery_ethiopia_somali_region
title: "Ethiopian regional investment project profile No.47 — cotton ginning plant, Somali Region (Afder/Gode): 15,000 t/yr of baled lint on 250 days x one 8-hour shift, ramped 60% -> 70% -> 80% -> 100%, run as a TOLLING service at Birr 20/quintal"

# ── WHY THIS FILE EXISTS ────────────────────────────────────────────────
# A THROUGHPUT CEILING ON A SERVICE, NOT A PRODUCT. The ginnery never owns
# the cotton: "The ginnery is a service giving enterprise. A present service
# charge for ginning (baling) cotton in the region ranges between Birr 30-40
# per quintal. However, in order to be more competitive the envisaged plant
# service charge is set at Birr 20 per quintal." So the capacity being sold
# is MACHINE TIME, and the profile prints every factor of it separately:
#       15,000 t/yr  ·  250 days/yr  ·  1 shift of 8 hours  ·  60 t/day
#       ·  177 bales/day  ·  60/70/80/100% production programme
# Four of those five reconcile exactly with each other. The fifth — the bale
# COUNT — does not, and the gap is 6%. See notes.
#
# It is also the harvest's cleanest demonstration that a published capacity
# ramp DRIVES the cost lines: every variable cost row in Table 7.2 is the
# full-capacity figure times the printed 60% / 70% / 100%, to the birr.

meta:
  source:
    - "Federal Democratic Republic of Ethiopia — regional investment project profile series, '47. PROFILE ON COTTON GINNING PLANT' (Somali Region; the series is published by the Ethiopian Investment Agency / regional bureaux and mirrored by Ethiopian diplomatic missions). §I Summary p.47-3 (15,000 tonnes of ginned cotton; investment Birr 5.66m of which Birr 2.25m plant and machinery; 33 jobs; IRR 28%; NPV Birr 7m at 10.5%); §III.A pp.47-4 to 47-6 (market study; Table 3.1 state-farm raw cotton production 1985/86-1994/95; Table 3.2 projected demand 2001-2015); §III.A.3 p.47-6 (pricing: Birr 20/quintal service charge); §III.B pp.47-7 (PLANT CAPACITY AND PRODUCTION PROGRAMME — the 41,460 bales / 750 lbs / 15,000 tonnes capacity statement, the 60/70/80/100% programme, 250 days, single 8-hour shift, 60 t and 177 bales per day); §IV pp.47-7/8 (auxiliary materials Birr 200,000; utilities 80 kW / 160,000 kWh / Birr 76,400); §V.B pp.47-11/12 (machinery list Table 6.1; land, building and civil works); §VI Table 6.1 p.47-13 (manpower, 33 persons, Birr 232,200); §VII pp.47-14 to 47-17 (Table 7.1 initial investment; Table 7.2 ANNUAL PRODUCTION COST for years 3/4/7/10 — the table this gold checks; break-even 24%; payback 6 years; IRR 28%; NPV Birr 7m). https://ethiopianembassy.be/wp-content/uploads/Cotton_Ginning.pdf"
  accessed: "2026-08-12"
  licence: >
    Government of Ethiopia investment-promotion project profile, publicly hosted by the Embassy of
    the Federal Democratic Republic of Ethiopia (Brussels) on its own domain. No explicit reuse
    licence is stated in the document. Figures transcribed here, with full citation, for
    engine-verification/research use only.
  kind: trade_case
  # L2, NOT L3, and the reason matters: the profile prints a SERVICE PRICE
  # (Birr 20/quintal) and a QUANTITY (15,000 t = 150,000 quintals at full
  # capacity), but it NEVER prints the revenue line those two make, and it
  # never prints an income statement. Only the COST side is published as a
  # computed table. So this gold checks the cost cascade and the capacity
  # ramp that drives it, and records the revenue as DERIVED. A gold must
  # check what the source computed, and revenue is not it.
  resolution: L2
  basis: "one ginnery, one operating year — the FIRST OPERATING YEAR, which the profile numbers 'Year 3' because it assumes a 2-year construction period; that year runs at 60% of capacity. Years 4, 7 and 10 (70%, 100%, 100%) transcribed alongside from the same table."
  periods: 1
  mechanism: capacity_service
  cell: "rent_use x physical (Physical Landlord) — the customer's cotton is ginned for a fee; the ginnery sells the USE of its gin stands and keeps them"
  transformation: >
    separate — seed cotton is split into lint (baled, to spinners) and cottonseed (bagged in hessian,
    to oil mills), which is the definition of ginning ("Cotton ginning is the process of separating
    cotton seed from the lint", §II). BUT PERFORMED AS A SERVICE, which changes what the separate
    means for the accounts: because the customer owns both output streams, the ginnery has NO
    joint-cost allocation to make and NO co-product revenue. This is visible in the numbers — Table
    7.2's "Raw Material and Inputs" at full capacity is Birr 200,000, which is EXACTLY the stated
    cost of auxiliary materials (steel bands, hessian, rope; §IV.A), i.e. not one birr of cotton is
    purchased. A `separate` with the separation sold and the separands given back. This corpus's
    other ginning gold (sep_msucot24_cotton_ginning.yaml) is the OTHER side of the same gate — the
    farmer's, who owns the lint and the seed and prices both.
  jurisdiction: ET
  currency: ETB
  trade: "saw-gin cotton ginnery, Afder or Gode Zone, Somali Region, Ethiopia; 3,000 sq.m site, 33 employees"

inputs:
  # ══ THE CEILING — §III.B.1 and §III.B.2, p.47-7, five factors printed ══
  capacity:
    annual_lint_capacity_tonnes:
      value: 15000
      unit: "tonnes/yr of baled lint"
      label_as_printed: "This corresponds to annual lint cotton baling of 15,000 tonnes"
    annual_capacity_bales:
      value: 41460
      unit: "bales/yr"
      label_as_printed: "the envisaged cotton ginnery will have an annual capacity of 41,460 bales, each bale having an average weight of 750 lbs"
      note: "DOES NOT RECONCILE with 15,000 t at 750 lbs/bale, nor with the daily programme. See notes — this is the one factor of the five that is out."
    average_bale_weight_lbs: {value: 750, unit: "lbs/bale", label_as_printed: "each bale having an average weight of 750 lbs"}
    working_days_per_year: {value: 250, unit: "days/yr", label_as_printed: "The envisaged ginning plant will operate 250 days per year"}
    shift_hours_per_day: {value: 8, unit: "hours/day", label_as_printed: "in a single shift of eight hours a day"}
    daily_output_tonnes: {value: 60, unit: "tonnes/day", label_as_printed: "The ginnery will produce 60 tonnes of baled lint cotton each day"}
    daily_output_bales: {value: 177, unit: "bales/day", label_as_printed: "which is about 177 bales"}
    annual_operating_hours:
      value: 2000
      unit: "hours/yr"
      composition: "DERIVED: 250 days x 8 h. Not printed as a figure, but CONFIRMED independently by the profile's own utilities line — 80 kW 'is equivalent to 160,000 Kwh' (§IV.B), and 160,000 / 80 = 2,000 h exactly."
  # ══ THE RAMP — §III.B.2, p.47-7 ══
  production_programme_pct:
    operating_year_1_table_year_3: {value: 60, unit: "%", label_as_printed: "The plant is assumed to start production at 60% in the first year"}
    operating_year_2_table_year_4: {value: 70, unit: "%"}

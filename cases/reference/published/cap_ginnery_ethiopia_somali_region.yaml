    first_operating_year_at_60pct: 1800000

mapping:
  total_production_cost_year_3: cost_of_sales

tolerance:
  abs: 0.06
  why: >
    Birr 60, on a Total Production Cost of Birr 1,336,900 — 0.0045%. Table 7.2 is printed to two
    decimals of a Birr-thousand and the CHECKED figure (Total Production Cost, year 3) re-adds
    EXACTLY from its three components. The threshold is set by the single largest genuine gap in
    the table's own addition chain: the year-3 operating-cost subtotal is short by 0.06 (400.06
    computed against 400.00 printed), and year 7/10 is over by 0.05. 0.06 clears both and nothing
    else — the cost-line ramp ratios, the investment table, the civil works and the entire manpower
    table all reconcile to zero.

notes: |
  THE CEILING AND ITS FIVE FACTORS — FOUR AGREE, ONE DOES NOT. The profile states its capacity five
  different ways in two paragraphs, and the reconciliation is worth doing in full because it shows
  exactly which figure to trust:

      (a) 15,000 tonnes/yr of baled lint
      (b) 60 tonnes/day
      (c) 250 working days/yr, single 8-hour shift
      (d) 177 bales/day
      (e) 41,460 bales/yr, at an average 750 lbs each

    (b) x (c):  60 t/day x 250 days = 15,000 t/yr   -> agrees with (a) EXACTLY
    (b) / (d):  60,000 kg / 177 bales = 339.0 kg/bale = 747.4 lbs -> agrees with the stated 750 lbs
                to within 0.3%
    (d) x (c):  177 bales/day x 250 days = 44,250 bales/yr -> DISAGREES with (e) by 2,790 bales, 6.7%
    (e) x 750 lbs: 41,460 x 750 x 0.45359 kg = 14,104.9 t -> DISAGREES with (a) by 895 t, 6.0%
    (a) at 750 lbs/bale would need 44,092 bales -> the figure (d) and (c) between them imply

  So the tonnage / daily-rate / days / hours set is internally consistent to four decimal places,
  and the annual BALE COUNT (41,460) is the outlier — most likely computed at a different assumed
  bale weight (15,000 t / 41,460 = 361.8 kg = 797.6 lbs, an 800-lb bale) and never reconciled with
  the 750 lbs printed beside it. RECORDED, NOT CORRECTED. An engine that sized this business in
  bales would be 6% out; in tonnes it would be right.

  A FIFTH FACTOR CONFIRMS THE HOURS FROM AN UNRELATED TABLE. §IV.B says the plant needs "A total
  power of 100KVA or about 80 Kw ... This is equivalent to 160,000 Kwh". 160,000 / 80 = 2,000 hours
  = 250 days x 8 hours, exactly the operating pattern stated three pages earlier in a different
  section. Two independent statements of the same operating year, agreeing to the hour. That
  agreement is what makes the 41,460 outlier identifiable as the error rather than the tonnage.

  THE SHORT SIDE HERE IS A RAMP, NOT A DEMAND SHORTFALL — and the distinction is printed. The plant
  runs at 60% / 70% / 80% of its ceiling for three years before reaching 100%. But the market study
  (Table 3.2) shows UNSATISFIED lint demand of 18,806 t in 2001 rising to 30,781 t from 2003 — one
  to two times the ginnery's entire 15,000 t capacity, every year, forever. Demand is not the
  binding term at any point; the ramp is a commissioning/learning derate. Contrast
  cell_hotel_home2suites_graham.yaml (demand binds at 74% of a fixed room count) and
  cap_cement_dangote_fy2023.yaml (demand binds at 46.5% of nameplate): same arithmetic shape, three
  different reasons, and only one of the three is `sold = min(demand, available)`.

  THE PRICE IS A DELIBERATE UNDERCUT, AND IT IS THE ONLY REVENUE FACT IN THE DOCUMENT. §III.A.3:
  the prevailing regional ginning charge is Birr 30-40/quintal and the profile sets its own at
  Birr 20 "in order to be more competitive" — a 33-50% discount to market, chosen and stated, with
  no volume justification offered for why undercutting is needed in a market with twice as much
  unsatisfied demand as the plant can serve. At Birr 20 x 150,000 quintals the ginnery bills
  Birr 3.0m a year against Birr 1.5m of full-capacity production cost; at the market's Birr 30 it
  would bill Birr 4.5m. The profile prints neither figure.

  ARITHMETIC VERIFIED BY HAND — what reconciles EXACTLY:
    - Total Production Cost = operating + depreciation + finance, all four printed columns
    - five variable cost lines against the printed 60% and 70% ramp (see expected)
    - full-capacity raw material 200.00 against the stated Birr 200,000 auxiliary materials
    - full-capacity utilities 76.40 against the stated Birr 76,400
    - Table 7.1 investment column: six items to 5,542.50, plus working capital to 5,657.10
    - civil works: three sheds + 10% contingency to 1,364,000
    - land: 3,000 sq.m x Birr 1.2 x 95 years = 342,000
    - manpower: all 15 lines, the 185,760 sub-total, the 25% benefit, the 232,200 total
    - market study: 59,876 x 50% = 29,938; 59,876 x 80% = 47,901; and all fifteen rows of
      Table 3.2's demand-less-production subtraction
    - Table 3.1's ten annual raw-cotton row sums and their x0.35 lint conversions (e.g. 1985/86:
      0.069 + 41.56 + 4.97 + 40.9 = 87.499, x0.35 = 30.62)

  ARITHMETIC VERIFIED BY HAND — what does NOT:
    1. THE ANNUAL BALE COUNT, 6-7% out both ways (worked above).
    2. TABLE 7.2's OPERATING SUBTOTAL, twice: year 3 components sum to 400.06 against a printed
       400.00; years 7/10 sum to 623.55 against a printed 623.60. Birr 60 and Birr 50. Note that
       the Total Production Cost line uses the PRINTED subtotal, so the error stops there.
    3. TABLE 3.1's COLUMN AVERAGES DO NOT SUM TO ITS ROW AVERAGE. The four column averages
       (1.98 + 26.48 + 5.03 + 17.06) come to 50.55; the printed total average is 50.34. Cause
       identified: the Abobo column contains a "-" for 1991/1992 and its average is taken over 9
       years (17.815/9 = 1.98) while every other column and the total are over 10 (17.815/10 =
       1.78). The 50.34 total is right — it is the mean of the ten printed row totals.
    4. THE TEXT AND THE TABLE DISAGREE ON THE SAME AVERAGE. §III.A.1 says "The annual average
       production over the period 1985/86 to 1994/95 is about 50,353 tonnes ... converted to lint
       cotton ... is 17,624 tonnes"; Table 3.1 prints 50.34 ('000 t) and 17.62. 50,353 x 0.35 =
       17,623.6, so the TEXT is internally consistent at 50,353 and the TABLE at 50,340 — two
       versions of one number, 13 tonnes apart.
    5. A DECIMAL POINT FOR A COMMA in Table 3.2's 2003 row: "30.781" where every other row of the
       same column reads 30,781.
    6. TWO TABLES ARE BOTH NUMBERED "Table 6.1" — the machinery list (§V.B.1, p.47-11) and the
       manpower table (§VI.A, p.47-13). A citation hazard, not an arithmetic one, but recorded
       because this gold's `meta.source` has to disambiguate them by section.

  WHAT CANNOT BE CHECKED AT ALL, AND WHY THIS GOLD IS L2. The profile computes four headline
  results — IRR 28%, NPV Birr 7m at 10.5%, break-even 24%, payback 6 years — and publishes NO income
  statement, NO sales line and NO profit line. §VII.C.1 says only "According to the income statement
  of the project, profit will start generating in the first year of operation", referring to a
  statement that is not in the document. None of the four can be re-derived from the printed pages:
  the break-even formula is even printed (Fixed Cost / (Sales - Variable Cost) = 24%) without either
  of its two inputs. They are transcribed in `expected` as the source's own claims and deliberately
  left out of `mapping` — an unverifiable printed result is a fact about the document, not a test
  of an engine. The one revenue figure this gold carries (Birr 3.0m at full capacity) is marked
  DERIVED for the same reason.

  ONE ANOMALY IN THE COST TABLE WORTH A LATER LOOK. Depreciation is flat at Birr 518,800 for years
  3, 4 and 7 and then drops to Birr 308,800 by year 10 — a straight-line schedule with one asset
  class (Birr 210,000/yr worth) falling out between years 7 and 10, consistent with a 10-year
  vehicle or office-equipment life against a longer building/machinery life. The profile never
  states its depreciation rates, so this is inference, not a check, and is not in `expected`.

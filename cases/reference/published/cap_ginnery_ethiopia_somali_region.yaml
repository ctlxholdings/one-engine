      label_as_printed: "the envisaged plant service charge is set at Birr 20 per quintal"
      market_rate_as_printed: "Birr 30-40 per quintal — the profile deliberately undercuts the prevailing market by 33-50% 'in order to be more competitive'"
  # ══ DEMAND SIDE — §III.A, pp.47-4 to 47-6 ══
  market:
    spinning_capacity_at_full_operation: {value: 59876, unit: "tonnes/yr", label_as_printed: "the annual cotton consumption capacity of spinning plants in Ethiopia when they operate at full capacity is 59876 tonnes", cited: "Chemonics International Inc. textile sector survey, 1996"}

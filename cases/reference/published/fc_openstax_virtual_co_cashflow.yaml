      accounts_receivable_change_as_labeled: 1180        # printed "decrease"; see notes ERROR 3 -- must be applied as -1,180 to reconcile
      accounts_receivable_change_sign_as_printed: "decrease (label) but arithmetically must act as an increase/subtraction to reach the printed total"
      prepaid_insurance_decrease: 1200

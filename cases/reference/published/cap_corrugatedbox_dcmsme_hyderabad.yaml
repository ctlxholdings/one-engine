    total_cost_row_G:           [39.598, 118.79, 141.170, 162.366, 177.801, 178.069, 178.406, 178.777]
    gross_profit_row_I:         [1.402, 4.21, 6.43, 9.834, 6.699, 6.431, 6.094, 5.723]
    interest_term_loan_row_J:   [0.102, 0.309, 0.28, 0.21, 0.14, 0.07, 0.00, 0.00]
    interest_wc_loan_row_K:     [0.500, 2.109, 2.29, 2.50, 2.60, 2.60, 2.60, 2.60]
    depreciation_row_L:         [0.00, 0.30, 0.267, 0.239, 0.213, 0.190, 0.171, 0.154]
    operating_profit_row_M:     [0.80, 1.502, 3.593, 6.885, 3.746, 3.59, 3.323, 2.969]
    provision_for_tax_row_N:    [0.20, 0.375, 0.90, 1.72, 0.936, 0.89, 0.83, 0.641]

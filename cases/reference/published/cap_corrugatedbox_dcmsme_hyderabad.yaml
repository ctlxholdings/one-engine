  # ── HEADLINE RATIOS the source computes for itself (p.7) ──
  break_even_point_pct: {value: 43.19, unit: "%", label_as_printed: "Break Even Point (B.E.P) is 43.19%"}
  dscr: {value: 1.90, label_as_printed: "Debt Service Coverage Ratio (DSCR) is 1.90"}
  working_capital_one_cycle:
    value: 19.81
    unit: "INR crore"
    composition_as_printed: "Raw Material (1 month) 9.64 + Work in Progress (1 week) 1.94 + Finished Goods (1 week) 1.98 + Bills Receivable (15 days) 6.25"
    hand_check: "9.64 + 1.94 + 1.98 + 6.25 = 19.81 — EXACT"

mapping:
  # MIXED BASIS (2026-08-20). Revenue COMPUTES raw INR (MT x Rs.41,000/MT),
  # so it needs p.39's column scale ("Rs. in crore") declared; the cost lines
  # were TRANSCRIBED at the printed crore values and flow through unchanged,
  # so their comparison is printed-vs-printed — scale would double convert.
  # The scale is the source's own column header, not a judgement.
  sales_year_5: {canon: revenue, scale: 1.0e7}
  total_cost_of_production_year_5: cost_of_sales

tolerance:
  abs: 0.002
  why: >
    Rs 0.002 crore = Rs 20,000, i.e. 0.001% of the Rs 184.50 crore Sales line. Every figure in the
    p.39 table is printed to three decimals of a crore, and EVERY subtotal in the CHECKED YEAR
    (year 5) re-adds EXACTLY by hand — D = 175.412, E = 2.389, G = 177.801, I = 6.699, M = 3.746,
    O = 2.810, and Sales = 45,000 MT x Rs 41,000 = 184.50 to the rupee. There is no display-rounding
    chain to absorb in this year, so any gap at all must surface as a divergence. The threshold is
    set at 0.002 rather than 0 only to absorb the third-decimal display (0.0005 crore per addend,
    four addends). Years 3, 6 and 8 contain genuine printed arithmetic ERRORS (see notes) — they are
    transcribed but deliberately NOT in `mapping`, because a gold must not ask the engine to
    reproduce a mistake.

notes: |
  THE CEILING CONTRADICTION, AND HOW THE ARITHMETIC SETTLES IT. The document states its installed
  capacity FOUR times and the numbers differ by a factor of ten:

      p.7  Executive Summary   "Total Installed capacity of the proposed unit is 6000 MT per annum"
      p.16 Market Potential    "the installed capacity of the unit is proposed to be as 6,000 MT
                                per annum, which is very less as compared to the prevailing market
                                demand"
      p.38 Basis & Presumptions "Installed capacity is estimated at 60000MT per annum"
      p.39 row A                "6000MT" in all eight year-columns

  Three-to-one on the page count says 6,000. The arithmetic says 60,000, and says it without any
  room for argument. Dividing each printed Sales figure by the printed price of Rs 41,000/MT gives
  the tonnage the model actually sold, and every one lands on a clean multiple of 60,000:

      2022-23  Rs 123.00 cr / 41,000  =  30,000 MT  =  60,000 x 50%   <- the printed 50% row
      2023-24  Rs 147.60 cr / 41,000  =  36,000 MT  =  60,000 x 60%   <- the printed 60% row
      2024-25  Rs 172.20 cr / 41,000  =  42,000 MT  =  60,000 x 70%   <- the printed 70% row
      2025-26  Rs 184.50 cr / 41,000  =  45,000 MT  =  60,000 x 75%   <- the printed 75% row
      2021-22  Rs  41.00 cr / 41,000  =  10,000 MT  =  60,000 x 50% x 4/12

  At 6,000 MT the terminal-year Sales line could not exceed Rs 18.45 crore; it is printed as Rs
  184.50 crore. The whole Rs 23 crore investment, the Rs 19.81 crore working capital and the 100-job
  headcount are all sized for the larger plant. CONCLUSION RECORDED: 6,000 MT is a dropped zero,
  repeated three times because the executive summary and market section were written from the same
  wrong figure; 60,000 MT is what the model runs on. The 2021-22 column is the neatest single proof
  of the whole reading — 10,000 MT is not a round percentage of anything, but it IS 50% of 60,000
  prorated over the four months from the stated December 2021 start (p.38, item 5), to the tonne.

  THE SHORT SIDE, exercised in all eight years. The unit NEVER reaches its ceiling:

      ceiling      60,000 MT/yr  (200 MT/day x 300 days, three shifts)
      best year    45,000 MT/yr  (75%, year 5 onwards) — 15,000 MT/yr of the plant stands idle
      first year   10,000 MT/yr  (16.7% of the annual ceiling)

  and the source gives no demand-side reason for stopping at 75% — p.16 says the opposite, that
  capacity is "very less as compared to the prevailing market demand". So the 75% terminal ceiling
  is an ENGINEERING derate (changeovers, maintenance, the stated 1-1.5% wastage), not a demand
  shortfall: an availability haircut on the nameplate, distinct from `sold = min(demand, available)`
  where demand binds. Worth separating in an engine — this case and
  cell_hotel_home2suites_graham.yaml (where DEMAND binds at 74%) look identical in the arithmetic
  and are different physics.

  A SECOND, INDEPENDENT CEILING FACTOR THAT DOES NOT AGREE. The p.36 electricity line reads
  "Power: 200KW x 24 hrs. x 50% utilization x 25days per Month x 12 Months = 720000 units", billed
  at Rs 6.00 = Rs 43,20,000, plus water Rs 1,80,000 = Rs 45,00,000 total. Re-computed by hand:
  200 x 24 x 0.50 x 25 x 12 = 720,000 kWh EXACT, x Rs 6 = Rs 43,20,000 EXACT, + Rs 1,80,000 =
  Rs 45,00,000 EXACT. Three checks, all clean. And 25 days x 12 = 300 days, corroborating p.38's
  working-day figure from an entirely different table. BUT: "24 hrs x 50% utilization" means the
  plant draws power for 12 effective hours a day, which contradicts p.38's "three shifts per day"
  (24 hours). The 50% here is the year-1/2 CAPACITY utilisation being applied to RUNNING HOURS —
  two different quantities sharing a number. Confirmed by the p.39 utilities row: year 2 (50%)
  prints 0.45 crore = exactly the Rs 45,00,000 of the p.36 table, and the row then scales strictly
  with capacity utilisation (0.54 at 60%, 0.630 at 70%, 0.675 at 75%). So the model treats
  electricity as fully variable with output, which is defensible, but the p.36 line's arithmetic
  reads as an hours calculation and is not one.

  ARITHMETIC VERIFIED BY HAND — what reconciles EXACTLY:
    - Sales row H, all eight years, against capacity x utilisation x Rs 41,000 (see above)
    - SUB TOTAL (D), all eight years: e.g. y5 173.57 + 0.675 + 1.122 + 0.045 = 175.412
    - SUB TOTAL (E) in seven of eight years: e.g. y5 1.984 + 0.405 = 2.389
    - Total cost G in seven of eight years: e.g. y5 175.412 + 2.389 + 0.00 = 177.801
    - Gross profit I = H - G in all eight years
    - Operating profit M = I - J - K - L in six of eight years
    - Net profit O = M - N in all eight years
    - Salary table p.35: 4 x 50,000 x 12 = 24,00,000; 20 x 25,000 x 12 = 60,00,000; 15 x 18,000 x 12
      = 32,40,000; 10 x 8,000 x 12 = 9,60,000; 5 x 6,000 x 12 = 3,60,000; sum 1,29,60,000;
      perquisites @15% = 19,44,000; total Rs 1,49,04,000 — EXACT, and equal to the p.39 year-2
      salaries cell of 1.49 crore, and to 1/3 of that (0.497) in the four-month year 1
    - Working capital: 9.64 + 1.94 + 1.98 + 6.25 = 19.81 EXACT
    - The 10%-a-year salary/wage escalation of p.38 item 6 holds from year 2 in six of seven steps
    - Direct wages and salaries do NOT scale with capacity utilisation — they are fixed from the
      p.35 headcount, which is why the unit still clears a profit at 50% of nameplate

  ARITHMETIC VERIFIED BY HAND — what does NOT reconcile. Five genuine printed errors, kept and
  named rather than smoothed over:

    1. YEAR 3 (2023-24), SUB TOTAL (E) IS WRONG: 1.64 + 0.324 = 1.964, printed 1.85 (short by
       0.114 crore).
    2. YEAR 3, TOTAL COST G IS WRONG BY MORE THAN THAT: 137.352 + 1.85 + 0.00 = 139.202 (or
       139.316 using the corrected E), printed 141.170 — over by 1.968 crore. Both the E error and
       the G error are in the same column, and they do not cancel; the printed Gross Profit (6.43)
       is consistent with the WRONG G, so the mistake propagates all the way to net profit. Year 3
       is transcribed and excluded from `mapping` for this reason.
    3. YEARS 2 AND 6, OPERATING PROFIT M: y2 4.21 - 0.309 - 2.109 - 0.30 = 1.492, printed 1.502
       (+0.010); y6 6.431 - 0.07 - 2.60 - 0.190 = 3.571, printed 3.59 (+0.019).
    4. YEAR 8, TAX IS NOT 25%: 0.641 / 2.969 = 21.6%, against the stated 25% (which would be
       0.742). Every other year is within 0.05pp of 25%.
    5. THE RAW-MATERIAL UNIT RATE CHANGES FOR TWO YEARS AND CHANGES BACK. Dividing the raw-material
       row by the tonnage: y1 Rs 38,570/MT, y2 Rs 38,570/MT, y3 Rs 37,736/MT, y4 Rs 37,736/MT,
       y5-y8 Rs 38,571/MT. No stated reason; p.38 item 8 says only "Cost of raw materials is worked
       out at prevailing market rates". Recorded because it silently inflates the year-3 and year-4
       margins by ~Rs 3.0 and ~Rs 3.5 crore respectively — which is most of what makes year 4 the
       most profitable year in the table (Gross Profit 9.834 crore against 6.699 in the higher-volume
       year 5).
    6. THE FIXED-CAPITAL TABLE (p.37) DOES NOT ADD. Components 0.10 + 2.95 + 0.105 + 0.06 + 19.81
       = 23.025, against a printed Total of 22.855; the Bank column DOES add exactly (0.01 + 2.21 +
       0.080 + 0.04 + 14.86 = 17.20) and the promoter column does not (its "Other Fixed Assets"
       cell reads 0.25 against a total of 0.105 and a bank share of 0.080 — plainly 0.025 with a
       lost decimal). The Executive Summary's "Rs.23 crore" agrees with the component sum, not with
       the printed total. Excluded from `expected` entirely.

  ONE STRUCTURAL OBSERVATION AN ENGINE SHOULD SEE. Raw material is Rs 38,570 per MT against a
  selling price of Rs 41,000 per MT — 94.1% of revenue before a single rupee of labour, power,
  interest or depreciation. The whole eight-year projection lives in the remaining 5.9%, which is
  why the terminal-year net margin is 1.5% (2.81 / 184.50) and why the model needs Rs 19.81 crore of
  working capital against Rs 3.02 crore of fixed capital — 87% of the investment is inventory and
  receivables, not plant. A capacity-ceiling engine that models only the physical ceiling and not
  the working-capital ceiling would size this business wrong by a factor of six.

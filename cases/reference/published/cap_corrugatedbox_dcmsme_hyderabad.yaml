  sales_year_5:
    value: 184.50
    unit: "INR crore"
    label_as_printed: "H Sales, 2025-26 (p.39)"
    composition: "45,000 MT (= 60,000 x 75%) x Rs 41,000/MT = Rs 1,845,000,000 = 184.50 crore — EXACT"
  total_cost_of_production_year_5:
    value: 177.801
    unit: "INR crore"
    label_as_printed: "G Total cost of Production, 2025-26"
    composition_as_printed: "SUB TOTAL (D) 175.412 + SUB TOTAL (E) 2.389 + F Selling Expenses 0.00"
    hand_check: "D: 173.57 + 0.675 + 1.122 + 0.045 = 175.412 EXACT; E: 1.984 + 0.405 = 2.389 EXACT; G = 177.801 EXACT"

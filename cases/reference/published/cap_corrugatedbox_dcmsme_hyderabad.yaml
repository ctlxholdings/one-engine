id: cap_corrugatedbox_dcmsme_hyderabad
title: "DC-MSME (Govt of India) Detailed Project Report — corrugated paper board & boxes, Hyderabad: 60,000 MT/annum nameplate, 300 days x 3 shifts, ramped 50% -> 60% -> 70% -> 75% capacity utilisation over eight years (checked year: 2025-26, the first 75% steady-state year)"

# ── WHY THIS FILE EXISTS ────────────────────────────────────────────────
# THE CLEANEST THROUGHPUT-CEILING GRAMMAR IN THE HARVEST. This DPR prints,
# as five separate lines, every factor a ceiling needs and almost no source
# gives together:
#     installed capacity (MT/annum) · working days (300) · shifts (3/day)
#     · capacity utilisation (%, a different value each year) · price (Rs/MT)
# and then a sales line that is EXACTLY capacity x utilisation x price. The
# unit never touches its ceiling: it starts at 50% and stops rising at 75%,
# so the short side is exercised in every one of the eight printed years.
#
# AND THE DOCUMENT CONTRADICTS ITSELF ABOUT ITS OWN CEILING — 6,000 MT in
# three places, 60,000 MT in a fourth — with the arithmetic settling it. That
# is the second reason this file exists; see notes.

meta:
  source:
    - "Office of the Development Commissioner (MSME), Ministry of Micro, Small and Medium Enterprises, Government of India — Shri C.S.S. Rao, IEDS, Joint Director, MSME-Development Institute, Hyderabad: 'Action Plan for Reduction of Imports & Project Report for Manufacture of Corrugated Paper Board and Boxes'. p.7 (Executive Summary: 'Total Installed capacity of the proposed unit is 6000 MT per annum', total investment Rs.23 crore, BEP 43.19%, DSCR 1.90); p.16 (Market Potential: 'the installed capacity of the unit is proposed to be as 6,000 MT per annum'); p.35 (labour and salary tables); p.36 (utilities: the 200KW power line); p.37 (Source of Finance); p.38 ('E. Basis and Presumptions' — the 60000MT capacity, 300 days, three shifts, the year-by-year capacity-utilisation ramp, Rs.41,000/MT selling price, 14% interest, 25% income tax); p.39 ('Financial Analysis — Estimated Cost of Production and Profitability', the eight-year table this gold checks); p.40 (Cash Flow Statement); p.41 (DSCR Statement). https://dcmsme.gov.in/Corrugated%20Paper%20Board%20&%20Boxes%20by%20CSS%20Rao.pdf"
  accessed: "2026-08-12"
  licence: >
    Publication of the Office of the Development Commissioner (MSME), Ministry of MSME, Government
    of India, hosted on the Ministry's own domain (dcmsme.gov.in) as a public enterprise-promotion
    document. No explicit reuse licence is stated in the document. Figures transcribed here, with
    full citation, for engine-verification/research use only — the same treatment this corpus gives
    other government/agency project profiles already in `cases/golds/` (FAO, IFAD, GIZ, Land Bank).
  kind: trade_case
  # L3: the source prints a QUANTITY (capacity x utilisation, in MT) and a
  # PRICE (Rs 41,000/MT) as two separate figures and multiplies them into a
  # Sales line, in each of eight years. That is the full quantity-x-price
  # grammar, with a capacity ceiling stated strictly ABOVE the quantity in
  # every year -- exactly the shape of cell_hotel_home2suites_graham.yaml,
  # here in manufacturing rather than lodging.
  resolution: L3
  basis: "per unit, one operating year — YEAR 5 of the printed eight-year projection (FY 2025-26), the FIRST year at the terminal 75% capacity utilisation and therefore the steady state; all eight years transcribed below"
  periods: 1
  mechanism: make_to_order
  cell: "create x physical (Manufacturer)"
  transformation: "assemble — kraft paper reels are corrugated, pasted into board and slotted/stitched into boxes. The source's own wastage assumption is 1 to 1.5% (p.38, presumption 9), which is a yield loss on an assemble, not a separate."
  jurisdiction: IN
  currency: INR
  trade: "semi-automatic corrugated paper board and box manufacturing unit, Hyderabad, Telangana; 500 sq.m leasehold land, 400 sq.m built-up; 100 direct + 50 indirect jobs"

inputs:
  # ══ THE CEILING, and every factor it is built from — all printed
  # separately on p.38 ('E. Basis and Presumptions') ══
  capacity:
    installed_capacity_mt_per_annum:
      value: 60000
      unit: "MT/annum"
      label_as_printed: "Installed capacity is estimated at 60000MT per annum"
      cited: "p.38, Basis and Presumptions, item 1"
      contradicted_by: "'6000 MT per annum' on p.7 (Executive Summary) and '6,000 MT per annum' on p.16 (Market Potential), and '6000MT' in row A of the p.39 table itself. THE ARITHMETIC SETTLES IT AT 60,000 — see notes. Kept as 60000 here because that is the number the source's own financial model demonstrably runs on."
    working_days_per_year:
      value: 300
      unit: "days/yr"
      label_as_printed: "The units presumed to work three shifts per day and 300 days in a year"
      cited: "p.38, item 2"
      corroborated_by: "the p.36 power line bills '25days per Month x 12 Months' = 300 days — the same figure reached independently"
    shifts_per_day:
      value: 3
      unit: "shifts/day"
      label_as_printed: "three shifts per day"
      cited: "p.38, item 2"
    implied_daily_rate:
      value: 200
      unit: "MT/day"
      composition: "DERIVED: 60,000 MT/annum / 300 days = 200 MT/day = 66.67 MT/shift across three shifts. Not printed; both factors are the source's own."
  # ══ THE UTILISATION RAMP — the short side, stated as a percentage, p.38 item 3 ══
  capacity_utilisation_pct:
    year_1_2021_22: {value: 50, unit: "%", note: "the p.38 ramp says 50% for year 1, but commercial production starts December 2021 (p.38, item 5) so only 4 of the 12 months of Indian FY2021-22 are worked — the p.39 Sales line proves the model applies 50% x 4/12. See notes."}
    year_2_2022_23: {value: 50, unit: "%"}
    year_3_2023_24: {value: 60, unit: "%"}
    year_4_2024_25: {value: 70, unit: "%"}
    year_5_onwards: {value: 75, unit: "%", label_as_printed: "4th year onwards - 75%"}
  # ══ QUANTITY ACTUALLY MADE AND SOLD — DERIVED from the two printed
  # factors above, and independently CONFIRMED by dividing each printed
  # Sales figure by the printed price (see notes; all eight agree exactly) ══
  quantity_mt:
    year_1: {value: 10000, composition: "60,000 x 50% x 4/12 (Dec-Mar part year)"}
    year_2: {value: 30000, composition: "60,000 x 50%"}
    year_3: {value: 36000, composition: "60,000 x 60%"}
    year_4: {value: 42000, composition: "60,000 x 70%"}
    year_5_to_8: {value: 45000, composition: "60,000 x 75%"}
  price:
    selling_price_per_mt:
      value: 41000
      unit: "INR/MT"
      label_as_printed: "Selling price calculated at Rs.41,000/MT"
      cited: "p.38, item 16"
  # engine convention: quantity x price, for the checked year (year 5, FY2025-26)
  sale: {quantity: 45000, unit: MT, price: 41000}

  # ══ YEAR-5 COST LINES, as printed on p.39 (Rs. in crore) ══
  costs:
    raw_material_and_consumables: 173.57
    utilities: 0.675
    wages_direct: 1.122
    repair_and_maintenance: 0.045
    salaries: 1.984
    other_administrative_expenses: 0.405
    selling_expenses: 0.00
  finance_and_depreciation_year_5:
    interest_on_term_loan: 0.14
    interest_on_working_capital_loan: 2.60
    depreciation: 0.213
  tax_rate_pct: {value: 25, label_as_printed: "Income tax calculated at 25%", cited: "p.38, item 17"}


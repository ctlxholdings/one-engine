id: agro_palmoil_okomu_ng_2022
title: "The Okomu Oil Palm Company Plc (Nigeria) — FY2022 (year ended 31 December 2022): hectares under palm and rubber, FFB harvested, CPO and rubber cake sold, against a NATURE-OF-EXPENSE income statement with NO cost of sales line"

meta:
  source:
    - "The Okomu Oil Palm Company Plc, 'Annual Report and Accounts 2022' (RC 30894, 43rd Annual General Meeting), year ended 31 December 2022: p.12 Directors' Report 'Operational Performance by Sector' (oil palm area 19 060 ha all mature, FFB production 247 175 t, average FFB yield 12.97 t/ha, rubber area 6 025 ha all mature, dry rubber -8.96% YoY, factory processing of dry rubber -12% YoY, gross earnings N59.32 billion); p.33 Statement of Profit or Loss and Other Comprehensive Income; p.34-35 Statement of Financial Position; p.36 Statement of Changes in Equity; p.37 Statement of Cash Flows; note 7.4 'Analysis of production' (FFB harvested 248 975 t, palm oil sold 49 754 t, cup lumps harvested 7 492 t, rubber cake sold 8 409 t, palm plantation 19 060 ha, rubber plantation 7 335 ha) and the level-3 fair value inputs for produce growing on bearer plants. https://www.okomunigeria.com/wp-content/uploads/2023/05/2023-05-01-Okomu-Annual-Report-and-Accounts-1.pdf"
  accessed: "2026-08-12"
  licence: >
    Public regulatory disclosure by a Nigerian Exchange-listed company (NGX: OKOMUOIL), published on
    the company's own site and lodged with the exchange. No explicit reuse licence stated. Figures
    transcribed for verification/testing only.
  kind: trade_case
  # ── HAND-HARVESTED 2026-08-12 FOR THE PHYSICS→STATEMENTS SHAPE, AND
  # DELIBERATELY KEPT FOR A SECOND REASON: THE INCOME STATEMENT IS THE
  # WRONG SHAPE FOR OUR COMPARISON LAYER. See notes — this is a producer
  # with NO cost of sales and NO gross profit line anywhere. It is an
  # IAS 1 "nature of expense" presentation. Any layer that assumes
  # revenue -> cost of sales -> gross margin CANNOT run this file, and
  # that refusal is the point.
  resolution: L2
  basis: "The Okomu Oil Palm Company Plc, single entity (no group; the company reports standalone statements only), one financial year (FY ended 31 December 2022), with the FY2021 comparative column from the same statements"
  periods: 1
  mechanism: grow_then_sell   # create x physical, transformation "grow"
  # SECOND LEG, DECLARED: Okomu also PROCESSES — its stated principal
  # activity is "the cultivation of oil palm, PROCESSING of fresh fruit
  # bunches into crude palm oil for resale, rubber plantation, and
  # PROCESSING of rubber lumps to rubber cake for export". Two crops, two
  # mills, one tag. The rubber leg is entirely export; the palm leg is
  # entirely domestic.
  jurisdiction: NG
  currency: NGN
  trade: "integrated oil palm and rubber plantation with its own palm oil mill and rubber factory, Okomu-Udo, Edo State, Nigeria; RSPO-certified"


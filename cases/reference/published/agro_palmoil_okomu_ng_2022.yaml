mapping:
  # DELIBERATELY NO gross_margin AND NO cost_of_sales ENTRY — neither line
  # exists in this source. Forcing one would require me to invent a
  # functional split of a nature-of-expense statement.
  total_assets: total_assets
  total_liabilities: total_liabilities
  total_equity: total_equity
  cash_and_cash_equivalents_at_31_december: cash_closing

tolerance:
  abs: 3
  why: >
    THREE THOUSAND NAIRA, not one, and the reason is measured rather than assumed: this source's
    balance sheet and income statement re-add EXACTLY to the naira thousand, but its cash flow
    statement and its other-comprehensive-income line do NOT. Three separate gaps were found by
    hand and none is explained by the document — the operating sub-total is out by 3 (25 392 080
    computed against 25 392 083 printed), the net movement in cash is out by 1, the closing cash
    line is out by 2, and OCI is out by 1. The same finance cost is printed as 1 071 272 in the
    income statement and 1 071 273 in the cash flow. These are almost certainly rounding of figures
    carried at full naira and presented in thousands, but the document never says so. 3 is the
    LARGEST observed gap, so it is the smallest honest ruler: tighter and this gold reports a
    divergence that is the source's own arithmetic, looser and it stops being able to see a real
    one. Every physical figure is a whole tonne or hectare except the 12.97 t/ha yield (2 dp).

arithmetic_check:
  every_subtotal_re_added_by_hand: true
  re_adds_exactly:
    income_statement: "59 323 723 + 1 777 763 - 11 752 940 - 10 331 079 - 3 730 938 - 10 953 829 - 1 071 272 + 4 966 + 251 041 = 23 517 435 ✓ | 23 517 435 - 7 286 629 = 16 230 806 ✓ | 16 230 806 - 32 426 = 16 198 380 ✓"
    balance_sheet: "NCA 38 068 029 + 18 399 054 + 536 639 + 63 415 = 57 067 137 ✓ | CA 5 729 107 + 630 341 + 1 400 614 + 1 833 510 + 5 837 581 = 15 431 153 ✓ | 57 067 137 + 15 431 153 = 72 498 290 ✓ | equity 476 955 + 1 867 096 + 31 972 743 - 282 928 = 34 033 866 ✓ | NCL 9 153 938 + 1 882 958 + 2 047 476 + 11 460 075 = 24 544 447 ✓ | CL 6 377 222 + 79 032 + 820 682 + 706 699 + 5 936 342 = 13 919 977 ✓ | liabilities 24 544 447 + 13 919 977 = 38 464 424 ✓ | 34 033 866 + 38 464 424 = 72 498 290 = total assets ✓"
    cash_flow_partial: "investing -368 419 - 10 222 517 + 4 966 = -10 585 970 ✓ | financing -524 065 - 67 548 - 24 919 - 16 216 470 = -16 833 002 ✓ | 25 392 083 - 129 545 - 1 961 174 = 23 301 364 ✓"
  does_not_re_add:
    oci_off_by_1: "-46 322 remeasurement loss on defined benefit plan + 13 897 income tax effect = -32 425, PRINTED -32 426. Off by 1 (N1 thousand)."
    cash_flow_operating_subtotal_off_by_3: "23 517 435 + 3 730 938 - 251 041 + 70 784 + 217 328 - 698 547 + 32 429 + 1 071 273 - 4 966 - 1 721 182 - 722 819 - 1 011 374 - 396 164 + 1 557 986 = 25 392 080, PRINTED 25 392 083. Off by 3 (N3 thousand)."
    net_movement_off_by_1: "23 301 364 - 10 585 970 - 16 833 002 = -4 117 608, PRINTED -4 117 609. Off by 1."
    closing_cash_off_by_2: "9 955 188 - 4 117 609 = 5 837 579, PRINTED 5 837 581. Off by 2. The printed 5 837 581 ties EXACTLY to the balance sheet cash line, so the balance sheet is right and the cash flow statement drifts."
    finance_cost_inconsistent_across_statements: "1 071 272 in the income statement, 1 071 273 in the cash flow statement's add-back. Off by 1, in one document, for the same line."
  physics_that_closes:
    ffb_yield: "247 175 tonnes / 19 060 hectares = 12.968 t/ha, and the source prints 12.97 t/ha ✓ EXACT to the printed precision. This settles which of the two FFB tonnages the yield was struck on: the Directors' Report's 247 175, NOT note 7.4's 248 975 (which would give 13.06 t/ha)."
    ffb_growth: "248 975 / 222 241 = 1.1203, i.e. +12.0%; the Directors' Report prints '11% higher' against the 247 175 figure. Using the SAME source for both legs: no prior-year Directors'-Report FFB figure is printed, so the 11% cannot be independently re-derived. Recorded, not resolved."
    revenue_growth: "59 323 723 / 37 394 507 = 1.5865, i.e. +58.6%; the source prints 59% ✓ (and 'gross earnings of N59.32 billion, which is 59% higher' — the same rounding)."
  physics_that_does_not_close:
    two_ffb_tonnages: "247 175 t (Directors' Report p.12) vs 248 975 t (note 7.4). 1 800 t apart. The yield identity above picks out 247 175 as the number the 12.97 t/ha was computed from, but the audited note says 248 975. BOTH kept as printed; NEITHER is in `expected`, because choosing one would be my judgement standing in for the source's."
    two_rubber_areas: "6 025 ha (Directors' Report p.12, described as 'a total of 6,025ha of rubber... of which all areas were mature') vs 7 335 ha (note 7.4, 'Rubber plantation covers a total of 7,335 hectares'). 1 310 ha apart, 21.7%. The most plausible reading is mature-tapped area versus total planted area including immature — but the Directors' Report explicitly says ALL areas were mature, which forecloses that reading. Unresolved, both kept."
    palm_oil_extraction_rate_cannot_be_computed: "49 754 t of palm oil SOLD against 247 175 t of FFB harvested = 20.1%, which sits in the plausible band for oil extraction rate (18-23%) but is NOT one: it pairs a SALES volume against a PRODUCTION volume, across a stock. The source publishes no CPO production tonnage, no closing CPO stock, and no extraction rate. Recorded as a gap; do not read 20.1% as an OER."
    rubber_conversion_cannot_be_computed: "8 409 t of rubber cake SOLD against 7 492 t of cup lumps HARVESTED — MORE OUTPUT THAN INPUT, which is impossible as a conversion and proves these two figures are not two ends of one process in one period. Stock drawdown, purchased third-party lumps, or a different dry-rubber basis would all explain it; the source explains nothing. A clean example of two printed physical figures that must NOT be divided."

notes: |
  READ THIS FIRST — THIS GOLD IS SHAPED TO FAIL A KNOWN ASSUMPTION. Our comparison layer assumes
  revenue -> cost of sales -> gross margin. Okomu is a producer, a plantation and two factories,
  the most manufacturer-like business imaginable — and its income statement has NO cost of sales
  line and NO gross profit line. It presents expenses BY NATURE (raw materials and consumables,
  employee benefits, depreciation and amortisation, other expenses), which IAS 1 permits and which
  is common across Nigerian and francophone African filers. There is no way to derive a gross
  margin from this document without inventing a functional split of the wage bill and the
  depreciation charge. So `mapping` here carries NO `gross_margin` and NO `cost_of_sales` entry.
  If the runner refuses this file for that reason, the refusal is the finding: the assumption is
  not "a bank/insurer problem", it is a PRESENTATION-FORMAT problem that bites a plantation
  company, and it will bite every nature-of-expense filer in Africa the same way. This file exists
  partly to make that visible in the ledger rather than in a conversation.

  THE SOURCE'S OWN ARITHMETIC DOES NOT FULLY RE-ADD, and the brief said to say so rather than
  repair it. Four separate small gaps were found by re-adding every subtotal by hand: OCI is out
  by 1, the cash flow's operating sub-total by 3, the net movement in cash by 1, and closing cash
  by 2 — all in thousands of naira, all almost certainly presentation rounding of full-naira
  underlying figures, and none acknowledged anywhere in the document. The same finance cost line
  is even printed as two different numbers in two statements (1 071 272 and 1 071 273). The
  balance sheet and income statement, by contrast, re-add exactly everywhere. That asymmetry is
  what set `tolerance.abs: 3` — the largest gap actually observed, measured rather than guessed.

  AND THE PHYSICS DOES NOT FULLY RE-ADD EITHER — twice over, in ways that are more interesting than
  the money. The Directors' Report and the audited notes give DIFFERENT FFB tonnages (247 175 vs
  248 975) and DIFFERENT rubber areas (6 025 vs 7 335 ha) for the same year in the same document.
  The FFB disagreement is resolvable in one direction only: 247 175 / 19 060 ha = 12.968, which is
  exactly the printed 12.97 t/ha yield, so the Directors' Report figure is the one the yield was
  struck on — but the AUDITED note says otherwise, and the audited note is the higher-authority
  document. Both are kept, neither is promoted into `expected`. The rubber disagreement has no such
  tiebreak: the usual explanation (mature vs total planted) is explicitly foreclosed by the
  Directors' Report's own statement that all rubber areas were mature.

  TWO PHYSICAL PAIRS THAT LOOK DIVISIBLE AND ARE NOT. (1) 49 754 t of palm oil sold against
  247 175 t of FFB harvested gives 20.1%, which lands squarely inside the normal oil extraction
  rate band and is therefore dangerously plausible — but it divides a SALES volume by a PRODUCTION
  volume across an unpublished stock, and the source publishes no CPO production figure at all.
  (2) 8 409 t of rubber cake SOLD against 7 492 t of cup lumps HARVESTED gives more output than
  input, which is physically impossible as a conversion and proves the pairing is invalid. These
  are recorded because a compiler that reaches for "quantity in, quantity out, therefore yield"
  will produce a confident wrong answer on the first and an impossible one on the second.

  THE BEARER PLANT / BIOLOGICAL ASSET SPLIT IS WORTH THE FILE ON ITS OWN. Under IAS 16 as amended,
  the oil palms and rubber trees themselves are BEARER PLANTS carried at cost less depreciation
  (N18 399 054 thousand, a non-current asset), while the FRUIT growing on them is a BIOLOGICAL
  ASSET at fair value (N536 639 thousand non-current, N630 341 thousand current). The tree is
  property; the fruit on the tree is a biological asset; the harvested fruit is inventory. Note 7.4
  publishes the level-3 inputs behind that fair value in physical units — 1 679 tons of palm fruit
  growing on bearing plants at an estimated cost-plus-margin of N309 339 per ton, and 182 tons of
  untapped latex at N94 525 per ton. That is a complete, checkable valuation model in physical
  quantities, sitting alongside the statements it feeds, which is precisely the physics-to-money
  seam this corpus is short of.

  WHAT THE SOURCE DOES NOT PUBLISH, recorded as gaps: no mill capacity of any kind (no tonnes of
  FFB per hour, no CPO capacity, no rubber factory capacity), so no utilisation is computable — a
  sharp contrast with the Astral and Zambia Sugar files harvested alongside this one, both of which
  print ceilings. No CPO production tonnage (only sales). No planting-year or age profile, despite
  "all areas mature" being load-bearing for the yield. No headcount. No cost per hectare or per
  tonne — the nature-of-expense presentation means even the raw materials line covers both crops
  and both factories with no split. Revenue is split only once and only in prose: N53.7 billion of
  the N59.32 billion gross earnings came from palm products, leaving roughly N5.6 billion from
  rubber, which the document never states directly.

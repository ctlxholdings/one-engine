mapping:
  # both sides of the checked year, against figures the source prints itself
  # (income total and expenditure total), so a cost error surfaces as well as
  # a revenue error
  # MIXED BASIS (2026-08-20). Revenue COMPUTES raw INR (lakh quintals x
  # Rs/quintal), so it needs Annexure II's "INR lakh" scale declared; the
  # cost lines were TRANSCRIBED at the printed lakh values and flow through
  # unchanged, so their comparison is printed-vs-printed — scale would double
  # convert. The scale is the source's own column header, not a judgement.
  total_income_year_2: {canon: revenue, scale: 1.0e5}
  total_operating_expenditure_year_2: cost_of_sales

tolerance:
  abs: 0.02
  why: >
    Rs 0.02 lakh = Rs 2,000, on an income line of Rs 22,884 lakh (Rs 2.29 billion) — 0.00009%. Every
    figure in Annexure II is printed to two decimals of a lakh and every subtotal in the CHECKED
    YEAR re-adds EXACTLY by hand: income 22,884.00, operating expenditure 15,625.00, interest
    1,888.71, depreciation 2,415.43, total expenditure 19,929.14, profit 2,954.86. Year 1 carries a
    single 0.01 gap (Rs 1,000) from display rounding of the 3.375-lakh-tonne crush; 0.02 clears that
    and nothing more. The molasses income line and the off-season energy line are off by 360.00 and
    18.00 lakh respectively — those are the source's own errors, are named in notes, and are
    deliberately NOT absorbed by this threshold: they are meant to be visible.

notes: |
  THE BOTTLENECK, AND THE SOURCE WALKS THROUGH IT. This is the case the brief asked for — a
  multi-stage operation where one stage binds the whole line — and the finding is that the DPR
  prints the binding stage and then ignores it.

    the MILL's ceiling      2,500 TCD x 160 days = 400,000 t of cane a season
    the CANE's ceiling      337,480 t of marketable surplus in 2016-17, the latest year printed
                            (§8.5 table, p.12: production 975,000 t less present consumption/
                            utilization 637,520 t = 337,480 t, re-added by hand, exact)
    what the model crushes  337,500 t in year 1  — the cane constraint, to within 20 tonnes
                            400,000 t in years 2-10 — 18.5% MORE cane than the document ever
                            shows existing

  Year 1 is labelled "90% utilisation over 150 days", which is presented as a start-up ramp. It is
  not: 2,500 x 150 x 0.90 = 337,500 t, and the marketable surplus is 337,480 t. The ramp is the
  cane supply wearing a mill's clothes. From year 2 the model raises days to 160 and utilisation to
  100% and never revisits supply — the p.13 forward table gives cane PRODUCTION out to 2019-20
  (962,500 / 975,000 / 987,500 t) but drops the consumption and surplus columns entirely, so
  nothing in the document demonstrates that 400,000 t is available. Every rupee of the eight-year
  DSCR and the IRR rests on 62,500 t of cane a year that is asserted rather than shown. This is
  exactly `sold = min(demand, available)` inverted — here it is the INPUT side, `crushed =
  min(mill_capacity, cane_available)` — and the source computes the max, not the min.

  THE DPR IS ABOUT AN EXPANSION IT NEVER MODELS. The title, §1.2, §7, §11.3 and §19 all describe
  modernisation from 2,500 TCD to 5,000 TCD with a 25 MW cogeneration plant, and §11.3 (p.21) gives
  the expanded plant's design parameters ("Actual crushing capacity of the sugar plant will be 5000
  TCD on 22 hrs. basis (230 TCH)"). Annexure II — the only place the money is computed — holds
  Capacity at 2,500 TCD in all ten year-columns and crushes 400,000 t, exactly half of what 5,000
  TCD over 160 days would give (800,000 t). The Rs 21,891.59 lakh of capital expenditure is
  justified by an IRR computed on the OLD plant's throughput. Either the annexure is the pre-
  expansion base case mislabelled as the project case, or the capacity row was never updated. The
  document does not say which. RECORDED AS AN OPEN CONTRADICTION, not resolved.
  (Aside: 5,000 TCD / 22 hrs = 227.3 TCH, printed as 230 TCH — the design parameter's own two
  factors are 1.2% apart.)

  ARITHMETIC VERIFIED BY HAND — what reconciles EXACTLY. Everything driven by a printed rate times
  a printed quantity:
    - crush = capacity x days x utilisation, both years
    - sugar = crush x recovery, both years (in QUINTALS — see the unit error below)
    - sugar income = sugar x Rs 3,500/qtl, both years (17,150.00 / 14,175.00)
    - cane cost = Rs 2,670/MT x crush, both years (10,680.00 / 9,011.25) — this is the line that
      proves year 1's crush is 337,500 t and not the displayed 3.38 lakh
    - harvesting Rs 550/MT, manufacturing Rs 60/MT, packing Rs 500/MT-of-sugar — all six cells exact
    - season cogen income = printed units x Rs 5.00, both years
    - income totals, operating-expenditure totals, total expenditure, profit — both years
    - depreciation, both classes, year 1 and year 2
    - all eight annual DSCRs, and the aggregate 8-year average of 2.24
    - the ten-year molasses QUANTITY row against the stated 4.5% on cane

  ARITHMETIC VERIFIED BY HAND — what does NOT reconcile. Six findings, all kept:

    1. THE SUGAR ROW'S UNIT IS WRONG BY A FACTOR OF TEN. Row 6 reads "Sugar Prod. — Lakh tonnes —
       4.90". 4.90 lakh tonnes is 490,000 t of sugar from 400,000 t of cane, i.e. a recovery of
       122.5%. The value is in lakh QUINTALS (49,000 t). Proven twice over by the sugar income
       (4.90 x Rs 3,500/qtl = 17,150.00 exactly) and by packing material (49,000 MT x Rs 500 =
       245.00 exactly). The number is right; the label is not.

    2. THE MOLASSES INCOME AND THE MOLASSES QUANTITY DISAGREE BY 67%. The quantity row is computed
       at 4.5% on cane (0.18 lakh t = 18,000 t) and says so. The income row says Rs 3,000/MT.
       18,000 x 3,000 = Rs 540 lakh. The printed income is Rs 900 lakh. Working backwards, Rs 900
       lakh at Rs 3,000/MT needs 30,000 t = 7.5% on cane; year 1 confirms it independently
       (337,500 x 7.5% x 3,000 = Rs 759.375 lakh, printed 759.38). So the income is built on 7.5%
       and the quantity row on 4.5% — the model earns molasses revenue on tonnage it never shows
       producing. Rs 360 lakh a year, 1.6% of total income, and it flows straight to profit.

    3. THE OFF-SEASON POWER UNITS LOOK LIKE A DIGIT TRANSPOSITION. §11.3 (x), p.21, sets the
       off-season at 90 days; the export is 15 MW. 15,000 kW x 90 days x 24 h = 32,400,000 kWh =
       324.00 lakh units. The annexure prints 342.00 lakh units in every one of the ten years, and
       bills all of it at Rs 5.00 (= Rs 1,710 lakh). Rs 90 lakh a year of revenue on 18 lakh units
       that the stated 90-day off-season cannot generate.

    4. THE SEASON POWER HOURS ARE NOT CONSTANT AND ARE NEVER STATED. 604.80 lakh units / 18,000 kW
       / 160 days = 21.0 h/day exactly in years 2-10; year 1's 561.60 lakh units / 18,000 kW / 150
       days = 20.8 h/day. Neither figure appears anywhere in the document, and the off-season line
       implies 24 h/day for the same plant. A capacity model reading this DPR has to infer the
       running hours from the energy, which is the wrong direction.

    5. THE FOURTH INTEREST LINE IS PRINTED AND THEN DROPPED. Annexure II lists four interest rows —
       working capital 10.50%, NCDC term loan 11.10%, SDF loan for MCE 4.25%, SDF loan for Cogen
       4.25% — and the "Total Interest" line equals the first THREE in every one of the ten years
       (year 2: 510.21 + 1,214.98 + 163.52 = 1,888.71 exactly; adding the cogen 212.08 would give
       2,100.79). Total Expenditure then uses the understated total. Cumulative understatement over
       years 2-6: Rs 530.20 lakh of interest that is disclosed but not charged. The debt-service
       block does the same thing (the "Intt. on loans" row is NCDC + SDF-MCE only), so the DSCRs
       inherit it too.

    6. THE PRINTED IRR DOES NOT REPRODUCE. Solving the annexure's own Cash availability row
       (-21,891.59 then the ten annual figures) gives 26.60%; the document prints 24.21%. A 2.39
       percentage-point gap, in the FAVOURABLE direction for the printed figure being conservative,
       so it does not look like an attempt to flatter the project. The cause is not visible in the
       pages read — the most likely candidate is a two-year construction period spreading the
       outflow (the DPR states a 2-year moratorium on principal), which the row as laid out does not
       show. UNRESOLVED, and the reason `irr_as_printed` is transcribed with its check written in
       rather than mapped.
    (Also: the "Cumulative Cash Accruals" row nets debt service in year 1 and then stops doing so
    from year 2 — 4,279.67 = 5,658.17 - 1,378.50, but 11,028.46 = 4,279.67 + 6,748.79 with no
    deduction. Minor, and it feeds nothing this gold checks.)

  THE DEPRECIATION RATE CHANGES AND THE ASSUMPTION COLUMN DOES NOT. Plant & machinery is stated at
  15%. Years 1-2 follow it exactly (18,231.59 x 15% = 2,734.74; then x 0.85 = 2,324.53). From year
  3 every step is x 0.90, i.e. a 10% written-down rate (2,324.53 x 0.9 = 2,092.08 against a printed
  2,092.07, and so on to year 10). Civil works, stated at 10%, follows 10% throughout. Recorded
  because an engine reading the assumption column would compute a different tax shield from year 3
  onward than the document does.

  WHAT IS DELIBERATELY NOT TRANSCRIBED: §11.3's full cogeneration heat-and-mass balance (boiler 130
  TPH at 87 ata / 515 C, steam-to-bagasse 2.45, actual steam rates per turbine stage, captive loads
  of 7,943 kW in season / 2,159 kW off-season). It is printed and internally detailed, but checking
  it requires a steam-cycle model this corpus does not have, and none of it feeds the throughput
  ceiling this gold exists to test. The distillery (30 KLPD) is likewise mentioned in the design
  parameters and generates no line in Annexure II at all.

  BASIS FINDING, surfaced when the cost lines were added (2026-08-12), and it is TWO problems
  stacked, neither of them the engine's. Everything in `expected` — and now everything in
  `inputs.costs` — is in INR LAKH, because that is the unit of Annexure II. `inputs.sale` is not:
  it is 490,000 quintals at Rs 3,500.00 per quintal, i.e. ABSOLUTE RUPEES, and multiplies out to
  1,715,000,000, not 17,150. So (a) an L3 runner deriving revenue from `sale` produces a figure
  100,000x the one `mapping` checks it against, purely a lakh-versus-rupee seam; and (b) even once
  that is scaled, 17,150 lakh is the SUGAR STREAM ALONE, while the mapped `total_income_year_2` is
  22,884 lakh — the sum of FOUR separately priced outputs (sugar 17,150, season power 3,024,
  off-season power 1,710, molasses 900, plus other income 100). A one-line `sale:` block cannot
  express a four-output `separate`; that is a schema observation, not an arithmetic one, and it is
  the reason the revenue side of this gold diverges while the cost side reconciles exactly. NOTHING
  IS CHANGED HERE TO HIDE EITHER: no figure in `sale`, `expected` or `costs` has been touched.

    molasses_pct_on_cane_the_income_actually_uses: {value: 7.5, unit: "%", composition: "DERIVED from the printed income and rate — the two disagree. See notes."}
    bagasse_pct_on_cane: {value: 32.20, unit: "%", cited: "§11.3 (ii), p.21"}
  prices:

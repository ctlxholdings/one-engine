    power_exported: {value: 5.00, unit: "INR/kWh", label_as_printed: "5.00/ unit", note: "same tariff in season and off-season; exported to the MSETCL 132 kV grid"}
  cost_rates:
    sugarcane: {value: 2670, unit: "INR/MT of cane", label_as_printed: "Rs.2670/MT"}
    harvesting_and_transport: {value: 550, unit: "INR/MT of cane", label_as_printed: "Rs.550/MT"}
    manufacturing_expense: {value: 60, unit: "INR/MT of cane", label_as_printed: "Rs.60/MT"}
    packing_material: {value: 500, unit: "INR/MT of SUGAR", label_as_printed: "Rs.500/MT", note: "the unit is not stated in the table, but 245.00 lakh / 500 = 49,000 MT = the sugar tonnage, not the cane tonnage — so it is per MT of sugar. Independently confirms the sugar output."}
  # engine convention: quantity x price, for the CHECKED year (year 2)
  sale: {quantity: 490000, unit: quintal_of_sugar, price: 3500.00}

  # THE RUNNER'S COST LINES — Annexure II's own EIGHT operating-expenditure
  # rows for the checked year, transcribed line by line and NOT as the printed
  # 15,625.00 total (a total would double-count against its own parts). Every
  # figure is repeated verbatim from `expected.operating_expenditure_year_2`
  # below; nothing new is read out of the source here.
  #
  # BASIS: INR LAKH, YEAR 2 of the ten-year projection — the first full-
  # capacity year (160 days, 100% utilisation), which is the year `meta.basis`
  # names and the same year and unit as the revenue this gold maps
  # (total_income_year_2 = 22,884.00 INR lakh). The per-MT rate rows in
  # `inputs.cost_rates` (Rs 2,670/MT cane, Rs 550/MT harvesting, Rs 60/MT
  # manufacturing, Rs 500/MT sugar packing) are the FACTORS behind four of
  # these eight lines, not lines themselves — including them alongside would
  # charge the same cost twice, once as a rate and once extended.
  #
  # DELIBERATELY EXCLUDED: interest (1,888.71) and depreciation (2,415.43).
  # The source strikes its own operating-expenditure subtotal at 15,625.00 and
  # only then adds those two to reach Total Expenditure 19,929.14; the figure
  # `mapping` binds to `cost_of_sales` is the operating subtotal, so the two
  # below-the-line blocks stay out. (Both carry findings of their own — the
  # fourth interest line is printed and then dropped, and the depreciation
  # rate silently changes from 15% to 10% WDV at year 3 — see notes.)
  #
  # HAND CHECK: 10,680.00 + 2,200.00 + 240.00 + 750.00 + 245.00 + 1,260.00 +
  # 100.00 + 150.00 = 15,625.00 — EXACT against the printed Total.
  costs:
    sugarcane: 10680.00
    harvesting_and_transport: 2200.00
    manufacturing_expense: 240.00
    repair_and_maintenance: 750.00
    packing_material: 245.00
    salary_and_wages: 1260.00
    power_and_fuel: 100.00

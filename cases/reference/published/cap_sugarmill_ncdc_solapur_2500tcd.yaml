  # separately with its own unit column ══
  capacity:
    crushing_capacity_tcd:
      value: 2500
      unit: "TCD (tonnes cane per day)"
      label_as_printed: "1  Capacity  TCD  2500  (the same value in all ten year-columns)"
      note: "CONTRADICTS THE DPR'S OWN TITLE, which is an expansion from 2500 TCD to 5000 TCD. The viability annexure never crushes at the expanded capacity. See notes."
    crushing_days:
      year_1: {value: 150, unit: "days", label_as_printed: "2  Days  No.  150"}
      year_2_to_10: {value: 160, unit: "days", label_as_printed: "160"}
      corroborated_by: "§11.3 design parameter (iv), p.21: 'The gross season will be of 160 days'"
    utilisation_pct:
      year_1: {value: 90, unit: "%", label_as_printed: "3  Utilisation  %  90"}
      year_2_to_10: {value: 100, unit: "%", label_as_printed: "100"}
    season_ceiling_tonnes:
      value: 400000
      unit: "tonnes cane"
      composition: "DERIVED: 2,500 TCD x 160 days x 100% = 400,000 t = 4.00 lakh tonnes — which is EXACTLY the printed Crushing row for years 2-10. All three factors are the source's own."
  # ══ THE ACTUAL, and the SUPPLY that should bound it ══
  crushing_lakh_tonnes:
    year_1: {value: 3.38, unit: "lakh tonnes", label_as_printed: "4  Crushing  Lakh tonnes  3.38", true_underlying_value: 3.375, why: "2,500 x 150 x 0.90 = 337,500 t = 3.375 lakh t; the printed 3.38 is a 2-decimal display. The cane-cost line proves the underlying figure: Rs 2,670/MT x 337,500 t = Rs 901.125 lakh... = 9,011.25 lakh EXACTLY as printed, which 3.38 lakh t would not give."}

id: cap_sugarmill_ncdc_solapur_2500tcd
title: "NCDC (Govt of India) sample Detailed Project Report — cooperative sugar mill, Solapur, Maharashtra: capacity 2,500 TCD x 160 crushing days x utilisation %, printed as four separate rows, with cane SUPPLY (not the mill) as the real bottleneck"

# ── WHY THIS FILE EXISTS ────────────────────────────────────────────────
# THE CEILING, PRINTED AS ITS OWN THREE FACTORS. Annexure II of this DPR
# opens with four consecutive rows:
#       1  Capacity      TCD          2500  2500  2500 ...
#       2  Days          No.           150   160   160 ...
#       3  Utilisation   %              90   100   100 ...
#       4  Crushing      Lakh tonnes  3.38  4.00  4.00 ...
# The ceiling and its multiplicands are separated, labelled, and multiplied
# by the source itself — which almost nothing published does. A season's
# crush is capacity x days x utilisation, and the source shows all four.
#
# AND THE BOTTLENECK IS SOMEWHERE ELSE. The same document's raw-material
# section (p.12) prints a marketable cane surplus of 337,480 t — 16% SHORT
# of the 400,000 t the mill crushes from year 2 onward. Year 1 crushes
# 337,500 t, within 20 tonnes of that surplus. From year 2 the model steps
# straight over the constraint it printed. That is the bottleneck case the
# brief asked for, and here the SOURCE ITSELF violates it. See notes.

meta:
  source:
    - "National Cooperative Development Corporation (NCDC), Government of India, 'Detailed Project Report (DPR) on Modernization cum Expansion of Sugar Plant from 2500 TCD to 5000 TCD' (sample DPR for cooperative sugar mills; the borrower is anonymised as 'XYZ Cooperative Sugar Mill', Dist. Solapur, Maharashtra). §1.2 and §7 (history: 1250 TCD in 1980-81, modernised to 2500 TCD in 1999-2000); §8.5, p.12 (Table: area under cane, yield, total production, present consumption/utilization, MARKETABLE SURPLUS, 2014-15 to 2016-17) and p.13 (area/yield/production projection 2017-18 to 2019-20); §11.3, p.21 (Design Parameters: 5000 TCD on 22 hrs basis = 230 TCH, bagasse 32.20% on cane, gross season 160 days, off-season 90 days); §19.1, p.38 (Salient features of the cash-flow projections: the 8-year summary table); ANNEXURE II, pp.43+ ('Profitability projections of XYZ Cooperative Sugar Mill', the 10-year line-by-line projection this gold checks). https://www.ncdc.in/documents/downloads/211508052025.Sample-DPR_Modernisation-and-expansionof-sugar-plant.pdf"
  accessed: "2026-08-12"
  licence: >
    Publication of the National Cooperative Development Corporation, a statutory corporation under
    the Ministry of Cooperation, Government of India, hosted on the Corporation's own domain
    (ncdc.in) as a public sample document for cooperative borrowers. No explicit reuse licence is
    stated. Figures transcribed here, with full citation, for engine-verification/research use only.
  kind: trade_case
  # L3: the source prints a QUANTITY (sugar, 4.90 lakh quintals) and a PRICE
  # (Rs 3,500/quintal) as separate figures and multiplies them into an income
  # line that re-computes EXACTLY -- and it does the same for molasses,
  # season power and off-season power. Four priced output streams from one
  # input, each with its own printed quantity and its own printed rate.
  resolution: L3
  basis: "one cooperative sugar mill, one crushing season — YEAR 2 of the printed 10-year projection, the first FULL-CAPACITY year (160 days, 100% utilisation) and the steady state repeated in years 2-10; year 1 (150 days, 90%) transcribed alongside because it is the only year that respects the cane constraint"
  periods: 1
  mechanism: separate
  cell: "create x physical (Manufacturer)"
  transformation: "separate — one input stream (cane) is split into FOUR separately priced outputs: sugar, molasses, in-season exported power and off-season exported power, the last two burnt from the bagasse the same cane yields (32.20% on cane, p.21). A textbook joint-product split with the joint costs (cane at Rs 2,670/MT, harvesting and transport at Rs 550/MT) charged wholly against tonnes of CANE, never allocated across the four outputs."
  jurisdiction: IN
  currency: INR
  trade: "cooperative sugar mill with 25 MW bagasse cogeneration and a 30 KLPD distillery, Dist. Solapur, Maharashtra"


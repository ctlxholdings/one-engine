# Transcribed EXACTLY as published. Narrower in scope than the other nine
# golds in this batch -- a depreciation-method comparison, not a full
# journal-to-statements cycle -- included because CLAUDE.md's brief names
# "anything with depreciation" as an explicit mechanism-spread target and
# this is OpenStax's own worked multi-method comparison (parallel in shape
# to the inventory-costing case, one mechanism, several methods, one
# answer key). Flagged with reaches: schedule (below p_and_l) rather than
# overstated as a full-cycle case.

meta:
  source: >
    OpenStax, "Principles of Accounting, Volume 1: Financial Accounting",
    Section 11.3 "Explain and Apply Depreciation Methods to Allocate
    Capitalized Costs" -- "Your Turn: Calculating Depreciation Costs"
    (Liam's silk-screen-printing machine, three depreciation methods) AND
    the adjoining "Recording the Initial Purchase of an Asset" narrative
    (same person/equipment, a DIFFERENT stated purchase price -- see
    notes).
    https://openstax.org/books/principles-financial-accounting/pages/11-3-explain-and-apply-depreciation-methods-to-allocate-capitalized-costs
  accessed: "2026-08-11"
  licence: >
    Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
    (CC BY-NC-SA 4.0); see fc_openstax_clipem_cliff_barbershop.yaml for the
    full verification note (same title, not repeated here).
  kind: full_cycle
  reaches: schedule
  reaches_note: >
    Reaches a verified depreciation-expense schedule (three methods x two
    years = six figures, each with its own journal entry) but NOT a
    formatted income statement, balance sheet, or cash flow statement --
    the narrowest-scope gold in this batch, included for mechanism
    coverage (depreciation) rather than cycle depth. Do not treat
    `reaches: schedule` as satisfying a "full cycle" test on its own.
  mechanism: make_to_order
  mechanism_note: >
    Liam runs a clothing silk-screen-printing shop (custom print runs per
    order/press) -- closest of the brief's mechanism vocabulary to
    make_to_order, though the source itself never frames Liam's business
    beyond "clothing items" produced by "presses."
  # ── HAND-LABELLED 2026-08-12 so the gold runner can execute this file ───
  # T: three DEPRECIATION METHODS on the same asset are alternatives, not
  # events that all happened -- an asset is depreciated by one method. This
  # file journals only Year 1's STRAIGHT-LINE entry: it is the one method
  # the source gives an explicit `journal_entry_each_year` for (copied, not
  # invented), and Year 1 alone needs no combining arithmetic on my part
  # (unlike summing both years). The $5,000/$1,000-cash/$4,000-note
  # "alternate initial purchase" fact is NOT combined with this -- the
  # source's own text states two irreconcilable cost bases ($10,000 vs
  # $5,000) for what reads as the same machine (see notes below), and
  # merging them would fabricate a reconciliation the source never makes.
  # No revenue or other cost exists anywhere in this gold, so this is
  # mapped to `operating_costs`, not `net_profit` (see the furniture-
  # direct gold in this batch for the same reasoning).
  resolution: T
  periods: 1
  currency: USD
  jurisdiction: US

inputs:
  owner: "Liam"
  business: "silk-screen printing (clothing items)"
  asset: "silk screen machine"

  # ── added for the T-journal reader — Year 1 straight-line only; see
  #    meta above for why the other two methods and Year 2 are not also
  #    journalled ──────────────────────────────────────────────────────
  accounts:
    accumulated_depreciation: asset
  journal:
    - {desc: "Year 1 depreciation expense, straight-line method",
       amount: 1800, debit: EXPENSE, credit: accumulated_depreciation,
       period: 0}

  your_turn_exercise_facts:
    purchase_cost_usd: 10000
    estimated_useful_life_years: 5
    estimated_useful_life_presses: 100000
    estimated_salvage_value_usd: 1000
    year_1_clothing_items_produced: 20000
    year_2_clothing_items_produced: 30000
    journal_entry_date_used_in_solution: "Jan. 1, 2019 (for both Year 1 and Year 2 entries, as printed)"

notes: |
  INCONSISTENCY -- the SAME section (11.3), about the SAME owner and asset
  (Liam's silk-screening machine), states two different purchase prices in
  two different paragraphs. The "Your Turn" exercise (used for `expected`
  below) gives $10,000 cost / $1,000 salvage / 5-year or 100,000-press
  life. A few paragraphs later, under "Recording the Initial Purchase of
  an Asset," the source states, verbatim: "Applying this to Liam's
  silk-screening business, we learn that he purchased his silk-screening
  machine for $5,000 by paying $1,000 cash and the remainder in a note
  payable over five years" -- with a journal entry debiting Equipment
  $5,000 and crediting Cash $1,000 / Notes Payable $4,000. The two
  fragments are never reconciled and cannot both describe the same
  purchase at face value ($10,000 vs $5,000 cost). Recorded here as two
  separate, internally-consistent-on-their-own facts about the same
  named character, not merged. The $5,000/$1,000-cash/$4,000-note journal
  entry is recorded in `expected.alternate_initial_purchase_entry_usd` for
  completeness, clearly separated from the $10,000 depreciation schedule.

  Each of the six depreciation figures below was independently recomputed
  from the stated facts and matches the source exactly:
  Straight-line: (10,000-1,000)/5 = 1,800/year, both years (constant).
  Units-of-production: (10,000-1,000)/100,000 = $0.09/press; Year 1 =
  0.09 x 20,000 = 1,800; Year 2 = 0.09 x 30,000 = 2,700.
  Double-declining-balance: Year 1 = (10,000/5) x 2 = 4,000 (salvage value
  is correctly excluded from the DDB rate base, per GAAP); Year 2 =
  ((10,000-4,000)/5) x 2 = 2,400.
  Note Year 1 straight-line and Year 1 units-of-production both land on
  exactly $1,800 -- a coincidence of this specific fact pattern (20,000 of
  100,000 total presses = 20% of the depreciable base, and 1/5 years is
  also 20%), not a general property of the two methods; Year 2 already
  diverges (2,700 vs a hypothetical straight-line 1,800).

# which of the source's own names we check against which of ours
mapping:
  year_1_straight_line_expense: operating_costs

# whole dollars; (10,000-1,000)/5 = 1,800 exactly, no rounding anywhere
# in this chain
tolerance:
  abs: 0.01
  why: >
    OpenStax prints whole dollars and (cost - salvage) / life divides
    evenly here (9,000/5 = 1,800 exactly), so any divergence is real
    rather than display rounding

expected:
  # added top-level pointer for `mapping:` — mirrors
  # depreciation_schedule_usd.straight_line.year_1_expense below, the
  # only one of six published figures this gold journals (see meta)
  year_1_straight_line_expense: 1800

  depreciation_schedule_usd:
    straight_line:
      formula: "(cost - salvage) / useful_life_years"
      year_1_expense: 1800
      year_2_expense: 1800
      journal_entry_each_year: {debit_depreciation_expense: "1,800 (both years)", credit_accumulated_depreciation: "1,800 (both years)"}
    units_of_production:
      rate_per_press: 0.09
      formula_rate: "(cost - salvage) / useful_life_presses"
      year_1_expense: 1800
      year_1_computation: "0.09 x 20,000 presses"
      year_2_expense: 2700
      year_2_computation: "0.09 x 30,000 presses"
    double_declining_balance:
      year_1_expense: 4000
      year_1_computation: "(10,000 / 5) x 2, salvage value excluded from the rate base"
      year_2_expense: 2400
      year_2_computation: "((10,000 - 4,000) / 5) x 2, applied to remaining book value"

  alternate_initial_purchase_entry_usd:
    source_quote: "he purchased his silk-screening machine for $5,000 by paying $1,000 cash and the remainder in a note payable over five years"
    debit_equipment: 5000
    credit_cash: 1000
    credit_notes_payable: 4000

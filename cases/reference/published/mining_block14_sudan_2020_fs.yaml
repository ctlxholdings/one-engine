    document; retrieved from the minedocs.com public mirror of SEDAR filings.
  kind: trade_case
  mechanism: extract
  # ── HAND-LABELLED 2026-08-12, same convention as mining_mt_todd_2024_fs ─────
  # L4 for the same reason that gold is: this is not one number to check, it is
  # a chain where each stage's output is the next stage's input, and the source
  # prints BOTH ends of every stage for eighteen periods:
  #   reserve -> annual ore tonnes + grade (Table 1.5 / 22.4)
  #     -> mill feed split three ways by ore type (oxide / transition / fresh)
  #     -> a DIFFERENT design recovery per ore type (90.5 / 85.5 / 83.7%)
  #     -> recovered ounces -> gold + silver revenue at a fixed price
  #     -> less selling costs -> less a 7% gross-revenue royalty
  #     -> less mining, rehandle, fixed process, variable process, G&A
  #     -> operating profit -> less sustaining capex -> pre-tax cash flow
  #     -> less depreciation -> taxable profit -> 15% Sudan tax
  #     -> after-tax cash flow -> NPV5% and IRR.
  # The availability content the harvest brief asks for sits at the top of that
  # chain and is printed as three separate numbers that must be composed:
  # plant capacity 6,036,000 tpa, plant availability 91.3%, crushing plant
  # UTILIZATION 85.0% — three different derating conventions in one table.
  resolution: L4
  basis: "whole project, life of mine, 100% equity (the report states explicitly: 'The financial assessment of the project is carried out on a 100% equity basis and the debt and equity sources of capital funds are ignored')"
  periods: 18   # the financial model's own columns: -3, -2, -1, then 1 to 15
  jurisdiction: SD   # Republic of the Sudan. Matters because the fiscal terms
  #                    are Sudanese and are printed as such: a 7% royalty
  #                    CHARGED AGAINST REVENUE (not against profit) plus a 15%
  #                    income tax on profit after depreciation.
  currency: USD   # "Unless otherwise stated, all currencies refer to US$";
  #                 base date 3rd Quarter 2020, money terms August 2020, and
  #                 "No provision has been made for the effects of inflation."


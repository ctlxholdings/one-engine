      and others, for Orca Gold Inc. (Vancouver), "Feasibility Study — NI 43-101 Technical Report,
      Block 14 Gold Project, Republic of the Sudan", document 3209-000-GEREP-0001_1b. Report date
      14 September 2020; effective date 31 August 2020.
      https://minedocs.com/20/Block14_FS_08312020.pdf

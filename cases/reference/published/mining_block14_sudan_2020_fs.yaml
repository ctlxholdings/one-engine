  ── DOES NOT RECONCILE ──────────────────────────────────────────────────────
  (13) THE PRINTED RECOVERED OUNCES DO NOT PRODUCE THE PRINTED REVENUE AT THE PRINTED PRICE.
        Y1: 193 koz x $1,350 = $260,550k, but printed gold revenue is $258,855k.
            Implied ounces = 258,855/1,350 = 191.74 koz.
        LOM: 2,341 koz x $1,350 = $3,160,350k against a printed $3,144,436k.
            Implied ounces = 2,329.2 koz, i.e. 11.8 koz (0.50%) fewer than the schedule prints.
      Two readings are possible and the report supports neither explicitly: an unstated payable
      factor of ~99.5%, or a rounded ounces row sitting beside an unrounded revenue row. The
      report's own Table 22.1 lists NO payable percentage — only a $4/oz refining charge, which is
      already accounted for separately as Selling Costs (check 4). Recomputing Year 1 from the
      ore-type split instead (oxide 3,778.5 kt @1.4 g/t x 90.5%, transition 878.5 @1.3 x 85.5%,
      fresh 143.0 @1.7 x 83.7%) gives 191.9 koz — which matches the REVENUE line, not the ounces
      line. So the revenue is right and the printed "Total Recovered Au ozs" row is the rounded one.
  (14) THE LOM OPERATING PROFIT IS US$4,938k HIGHER THAN ITS OWN COST LINES ALLOW:
        3,167,254 - 14,144 - 221,708 - 549,366 - 34,929 - 133,776 - 518,247 - 137,057 = 1,558,027
        printed operating profit                                                       = 1,562,965
        difference                                                                     =     4,938
      That is exactly the Year -1 mining cost. The annual columns are internally consistent (Year 1

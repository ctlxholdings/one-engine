  ── GAPS, STATED RATHER THAN FILLED ─────────────────────────────────────────
  NO SILVER PRICE IS PRINTED. Table 22.1 lists a gold price and nothing else. The silver revenue
  line implies 22,818/1,195 = US$19.09/oz LOM (Y1: 503/26 = $19.35; Y2: 1,500/79 = $18.99), which is
  consistent with an assumed ~US$19/oz less payable/refining, but the number is MY division of two
  printed totals and is deliberately kept out of `inputs`. Silver contributes 0.72% of gross revenue,
  so the omission is immaterial to the NPV and material to the completeness of the input set.
  NO DEGRADATION OR AVAILABILITY RAMP is modelled: the plant availability is a single flat 91.3% for
  all fourteen operating years, exactly as IRENA treats its capacity factors
  (energy_irena_solar_pv_2023.yaml records the same absence). The only ramp is in THROUGHPUT
  (4,800 then 5,800 then 6,000 kt), which the report attributes to mine sequencing, not to the plant.

  ── WHY THIS PROJECT, and what it costs the gold ────────────────────────────
  Sudan is the point. The corpus holds an Australian mining gold (mining_mt_todd_2024_fs) and this
  harvest adds a Canadian one (mining_spanish_mountain_2021_pfs); Block 14 is the AFRICAN case, and
  its fiscal terms are structurally different from both — a 7% royalty charged against GROSS REVENUE
  (before any cost, checked exactly in (3)) rather than the profit-based Northern Territory royalty
  in the Mt Todd gold, and a flat 15% income tax. That combination — a top-line royalty plus a low
  flat tax — is common across African mining codes and appears nowhere else in this corpus. The cost
  is that the project was never built: Orca Gold was acquired by Perseus Mining in 2022 and Sudan
  entered civil war in April 2023, so no actual-versus-forecast comparison will ever exist. This is a
  FORECAST gold, like every feasibility study in the corpus, and the arithmetic it tests is the
  model's internal consistency, not its predictive accuracy.

      used: 1.15 Mine production schedule, Table 1.5 (p.11-12); 1.16 Recovery methods (p.12);
      1.21 Economic analysis, Table 1.15 and Table 1.16 (p.20-21); 17 Recovery Methods, Table 17.1
      Key Process Design Criteria (p.185); 18 Infrastructure (power, p.~240); 22 Economic Analysis,
      Table 22.1 Model Inputs (p.273), Table 22.4 and Table 22.5 Financial Model (Operations)
      (p.276-277), Table 22.6 Financial Model Summary (p.278), Table 22.7 Cash Cost and Unit Cost

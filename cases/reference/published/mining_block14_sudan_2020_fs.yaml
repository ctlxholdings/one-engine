  gross_margin: expected.financial_model_summary.operating_profit_usd_m
  # 3,167 - 1,604 = 1,563, which is exactly the printed operating profit. The
  # binding is safe at the LOM level; it is NOT safe year by year, because the
  # annual operating-profit row and the annual operating-cost rows do not close
  # against each other in Year -1 — see notes, finding (5).

tolerance:
  abs: 2.0
  rel: 0.001
  why: >
    The financial model is printed in US$'000 to the unit (259,359; 136,057; 723,008), so any
    genuine agreement should land within a couple of thousand dollars on a hundred-million-dollar
    line — 0.001 relative is the working band and abs 2.0 (US$2,000) is the floor for the small
    lines. This is deliberately tighter than mining_mt_todd_2024_fs's US$3 million, because that
    gold checks a schedule printed in millions and this one is printed in thousands. The band is
    NOT wide enough to swallow the five reconciliation failures recorded in notes; those are the
    point of the gold, not noise to be tuned away.

notes: |
  RE-DERIVED BY HAND, using only the report's own printed figures and its own printed rates.
  Twenty checks. Fifteen close, five do not — and three of the five are provable internal
  contradictions, not rounding.

  ── THE AVAILABILITY CHAIN, which is why this gold was harvested ─────────────
  (A) 6,036,000 tpa at 91.3% availability implies 8,760 x 0.913 = 7,997.9 operating hours and a
      design instantaneous rate of 6,036,000 / 7,997.9 = 754.7 t/h. The report's power sections
      independently state "overall plant availability of 8,000 hr/yr" and "utilization, nominally
      8,000 h/y", which is 8,000/8,760 = 91.32%. THE THREE STATEMENTS AGREE. (Contrast
      mining_spanish_mountain_2021_pfs.yaml in this same harvest, where the equivalent three
      statements do not.)
  (B) THE SCHEDULE NEVER RUNS AT THE DESIGN CAPACITY. Table 17.1's plant capacity is 6,036,000 tpa;
      the financial model's steady-state years are all exactly 6,000.0 kt. The 36,000 t/yr gap
      (0.6%) is never explained. It is small, and it is systematic across eleven consecutive years,
      which is the signature of a rounded planning number rather than a physical derate.
  (C) THREE DIFFERENT DERATING CONVENTIONS SIT IN ONE TABLE: plant availability 91.3% (a fraction
      of calendar time), crushing plant UTILIZATION 85.0% (a fraction of available time, per OMC),
      and design recoveries 90.5/85.5/83.7% (a fraction of contained metal). All three are
      percentages, none is the same kind of thing, and Table 17.1 stacks them in adjacent rows.
      A model that reads the column and multiplies is wrong; a model that reads the ROW LABELS is
      right. That distinction is the whole content of this block.
  (D) Production period: 4,800 + 5,800 = 10,600 kt in the two ramp years, leaving 69,343.2 kt at
      6,000 kt/y = 11.56 years, plus 2 = 13.56 -> printed "Production Period 13.6 Years".
      RECONCILES.

  ── RECONCILES ──────────────────────────────────────────────────────────────
  (1) Mine schedule column sums, to the last printed digit:
        ore   350.6+7,464.9+9,835.4+9,936.9+10,327.2+12,171.3+12,176.5+13,051.6+4,628.8 = 79,943.2
        waste 936.3+14,252.3+14,987.4+19,256.4+24,520.5+21,650.7+14,234.4+8,088.1+1,322.0 = 119,248.1
      Strip ratios: 119,248.1/79,943.2 = 1.4917 -> "1.49:1"; Year 1 14,252.3/7,464.9 = 1.909 ->
      "1.91:1"; Year -1 936.3/350.6 = 2.670 -> "2.67:1". Total mined 79.9+119.3 = 199.2 Mt.
  (2) Processing schedule sums: 4,800 + 5,800 + (6,000 x 11) + 3,343.1 = 79,943.1 against a printed
      79,943.2 (0.1 kt, i.e. 1.3 ppm). Ore-type split 14,782.8+18,635.3+46,525.1 = 79,943.2 EXACT.
  (3) THE ROYALTY IS EXACTLY 7% OF REVENUE, EVERY YEAR, TO THE DOLLAR:
        Y1 259,359 x 0.07 = 18,155.1 -> printed 18,155
        Y2 308,736 x 0.07 = 21,611.5 -> printed 21,612
        Y5 340,432 x 0.07 = 23,830.2 -> printed 23,830
        LOM 3,167,254 x 0.07 = 221,707.8 -> printed 221,708
      This is the cleanest single formula test in the file: a gross-revenue royalty, not a profit
      royalty, applied before any cost.
  (4) SELLING COSTS ARE US$4/oz ON GOLD PLUS SILVER OUNCES, NOT ON GOLD ALONE:
        Y1 (193 + 26) koz x $4 = $876,000 -> printed 876. EXACT.
        Y2 (229 + 79) x 4 = 1,232 -> printed 1,229 (the koz rows are rounded).
      Table 22.1 calls this line "Refinery Charges & Shipping US$4 /oz" and never says which ounces;
      the Y1 identity settles it.
  (5) Operating profit, Year 1, from the printed lines:
        259,359 - 876 - 18,155 - 55,945 - 464 - 9,868 - 27,885 - 10,110 = 136,056 -> printed 136,057
      RECONCILES (1 unit rounding).
  (6) Net cash flow before tax = operating profit less sustaining capex:
        Y1 136,057 - 18,816 = 117,241 -> printed 117,242
        LOM 1,562,965 - 321,222 - 178,590 = 1,063,153 -> printed 1,063,153. EXACT.
  (7) Tax is exactly 15% of taxable profit:
        Y1 103,050 x 0.15 = 15,457.5 -> printed 15,457
        Y2 122,273 x 0.15 = 18,340.95 -> printed 18,341
      And after-tax LOM 1,063,153 - 150,830 = 912,323 -> printed 912,324 (1 unit).
  (8) THE TWO NPVs AND BOTH IRRs REPRODUCE EXACTLY, once the report's own discounting convention
      ("Discounting has been applied from the first year of operation") is read as: the three
      pre-production years are collapsed to a single US$321,222k outflow at t=0, and Years 1-15 are
      discounted at t=1..15 at 5%:
        pre-tax  NPV = 723,009  -> printed 723,008
        post-tax NPV = 606,781  -> printed 606,781. EXACT to the dollar-thousand.
        pre-tax  IRR = 38.48%   -> printed 38.5%
        post-tax IRR = 33.32%   -> printed 33.3%
      The IRR row of Table 22.5 shows exactly this collapse — it prints "(321,222)" in a single
      cell to the left of Year 1 while the cash-flow row above it keeps the three-year phasing.
  (9) Average annual production: (193+229+230+235+251+227+232)/7 = 228.1 -> printed 228 koz/y for
      Years 1-7; 2,341/14 operating years = 167.2 -> printed 167 koz/y average. BOTH RECONCILE, and
      they confirm the schedule has FOURTEEN operating years even though the summary says 13.6.
  (10) LOM average recovery: 79,943.2 kt at 1.11 g/t contains 88,737 kg = 2,852,663 oz; recovered
      2,341 koz is 82.06% -> printed 82.0%. RECONCILES.

id: ext_machinery_rental_iowa2024
title: "Iowa State Ag Decision Maker — 2024 Iowa Farm Custom Rate Survey, worked machinery-rental-rate example (tandem disk, with and without tractor)"

meta:
  source:
    - "Iowa State University Extension and Outreach, '2024 Iowa Farm Custom Rate Survey', Ag Decision Maker File A3-10 / FM 1698 (Revised March 2024), p.6, box 'Estimating a machinery rental rate for items not surveyed' worked 'Example: Tandem Disk' (prepared by Alejandro Plastina, Ann Johanns, Kwanele Magwaba): https://www.extension.iastate.edu/agdm/crops/pdf/a3-10.pdf"
    - "Same document, p.2, table 'Tillage', row 'Disking, tandem / acre' — source of the $17.40 average custom charge used as input 1 of the worked example: https://crops.extension.iastate.edu/files/inline-files/a3-10.pdf (this mirror returned the PDF successfully; the extension.iastate.edu path 403'd to automated fetchers)"
  accessed: 2026-08-11
  licence: public/extension
  kind: trade_case
  unit_of_analysis: "per acre, machinery-rental-rate worked example (tandem disk, no operator/fuel/labor included in the derived rental value)"
  mechanism: rent_asset
  # ── HAND-LABELLED 2026-08-12, FLAG FOR REVIEW ────────────────────────
  # This source is NOT a farm P&L — it is a worksheet that decomposes one
  # market rate (custom charge) into an ownership-cost share, with no cost
  # buildup and no separate sale at all. To run it through the trade_case
  # (revenue - costs = margin) shape without inventing any number, the
  # worksheet's own three computed steps are read as: step3 ("rental value,
  # for tractor and implement", $10.44/acre) = revenue for renting out the
  # equipment for one acre; step4 ("tractor rental value", $3.20/acre) =
  # the cost of the tractor portion of that same package; step5
  # ("implement rental value, without tractor", $7.24/acre) = what's left
  # as the implement owner's own net rental value — which is exactly
  # step3 minus step4, i.e. the source's OWN subtraction, not one I
  # introduced. This is the biggest interpretive leap of the ten files in
  # this batch (the other nine are read directly off a genuine sale or
  # cost table); flagging it explicitly rather than presenting it as a
  # plain transcription. `mechanism: rent_asset` above was already the
  # original author's own tag before I touched this file, which is what
  # made this reading available at all.
  resolution: L2
  basis: "per acre, one implement-rental transaction (tandem disk)"
  periods: 1
  jurisdiction: US
  currency: USD

inputs:
  survey_basis:
    respondents: 130
    custom_rates_reported: 2805
    mailed_to: 394
    emailed_to: 407
    survey_month: "mid-February 2024"
    diesel_price_assumed_usd_per_gallon: 3.92
  step1_custom_charge_usd_per_acre:
    value: 17.40
    source_table_row: "Tillage — Disking, tandem / acre — Average Charge"
    note: "custom charge INCLUDES labor, fuel, and tractor; this is the survey average of 39 responses (range $9.00-$31.00/acre, median $18.00/acre — not itself used in the worked example, printed for context)"
  step2_pct_of_custom_charge_for_ownership:
    value_pct: 60
    basis: "worksheet instruction: use 60% for tillage operations (65% for planting and harvesting) to represent the share of the custom charge attributable to interest, insurance, depreciation, and repairs — i.e. excluding fuel and labor"
  step4_tractor_rental_inputs:
    tractor_hp: 150
    rate_usd_per_hp_hour: 0.32
    acres_covered_per_hour: 15
    rate_usd_per_hp_hour_source: "same document p.6, table 'Machine Rental (operator, tractor, and fuel not included)', row 'Tractor / horsepower / hour', Average Charge"
    acres_per_hour_source: "AgDM File A3-24 'Estimating the Field Capacity of Farm Machines' (cited in the worksheet footnote, not independently re-verified in this transcription)"
  # ── HAND-LABELLED 2026-08-12 ─────────────────────────────────────────
  # `revenue` (step3, $10.44) is read via `mapping` below, not restated
  # here. `costs` is the ONE genuine cost line under this reading: the
  # tractor-rental portion (step4, $3.20) that the combined rental value
  # is split against. No number here is new — see the meta-block flag above
  # for the interpretive choice this rests on.
  costs:
    tractor_rental_value: 3.20

expected:
  step3_rental_value_with_tractor_usd_per_acre:
    value: 10.44
    label_as_printed: "3. Rental value, for tractor and implement (1 x 2)"
    composition_as_printed: "17.40 x 60% = 10.44"
  step4_tractor_rental_value_usd_per_acre:
    value: 3.20
    label_as_printed: "4. Tractor rental value, if tractor is not provided"
    composition_as_printed: "150 hp x $0.32 per hp-hour rental rate / 15 acres/hour = 3.20"
  step5_implement_rental_value_without_tractor_usd_per_acre:
    value: 7.24
    label_as_printed: "5. Implement rental value, without tractor (3 minus 4)"
    composition_as_printed: "10.44 - 3.20 = 7.24"

# SPOT-CHECK VERDICT (central audit, 2026-08-12): this gold MATCHES but
# TESTS ALMOST NOTHING, and the labelling agent flagged it itself. The source
# is a rate-decomposition worksheet, not a trading enterprise: 10.44 is one
# rental rate WITH a tractor, 3.20 is the tractor's share of it, 7.24 is the
# remainder. Mapping those onto revenue / cost_of_sales / gross_margin makes
# the engine perform 10.44 - 3.20 and calls the subtraction a match.
# Arithmetically true, semantically empty — a calculator passes this too.
# Kept for provenance, DOWNGRADED to weight: none. A gold's value is what a
# divergence would have told us, and here it would have told us nothing.
weight: none
mapping:
  step3_rental_value_with_tractor_usd_per_acre: revenue
  step4_tractor_rental_value_usd_per_acre: cost_of_sales
  step5_implement_rental_value_without_tractor_usd_per_acre: gross_margin

# HALF A CENT, deliberately tight (every step in this worksheet is exact
# with no rounding gaps at all per the hand re-derivation below).
tolerance:
  abs: 0.005
  why: >
    every figure is printed to the cent and all three steps are exact
    (17.40x60%=10.44; 150x0.32/15=3.20; 10.44-3.20=7.24), so half a cent
    is exactly the display rounding and any gap would be real

notes: |
  Fully re-derived by hand; every step is exact with no rounding gaps:
    - Step 3: 17.40 x 0.60 = 10.44 exact.
    - Step 4: 150 x 0.32 = 48; 48 / 15 = 3.20 exact.
    - Step 5: 10.44 - 3.20 = 7.24 exact.

  This is a genuinely different KIND of "known answer" than the crop/livestock budgets in this
  batch: it is not a farm's own cost-and-return statement, but a WORKSHEET METHOD the extension
  service publishes for a THIRD PARTY (a machinery owner who wants to rent out an implement) to
  convert a market custom-hire rate into an implied rental value. The "answer" is the worked
  numeric example the document itself prints ($10.44/acre with tractor, $7.24/acre implement-only)
  rather than a survey statistic. This is the cleanest rent_asset case found in the harvest: the
  full derivation chain (custom charge -> ownership-cost share -> tractor value -> implement-only
  value) is shown end to end with every intermediate number visible, unlike the raw survey rate
  tables elsewhere in the same document (pp.2-6), which report averages/medians/ranges but no
  worked per-case arithmetic.

  The custom-rate table this worked example draws its $17.40 starting point from (p.2, "Disking,
  tandem / acre": Average Charge $17.40, Median $18.00, Range $10.00-$25.00, 39 responses) is
  itself a genuine SURVEY AVERAGE, not a computed cost build-up — cross-checked and the p.6
  worksheet box cites the identical $17.40 average. Flagging this distinction because a reader
  could mistake $17.40 for a "cost of production" figure when it is actually a market-price survey
  statistic that the worksheet then converts into an ownership-cost estimate via the 60% rule of
  thumb.

  Iowa State does not disclose the derivation of the "60% for tillage / 65% for planting and
  harvesting" split itself (it is presented as a rule of thumb, not derived from data in this
  document), so that ratio is transcribed as an ASSUMED framework constant, not a computed value.

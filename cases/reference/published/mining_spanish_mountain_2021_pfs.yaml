# respelled into the corpus orientation 2026-08-13 ({source name: canon},
# a dotted path into the nested table; row 17 is the printed LOM row) —
# the SAME two figures the inverted form named, nothing re-claimed
mapping:
  cash_flow_summary.rows.17.3: {canon: revenue, scale: 1000000}
  #   ^ LOM Net Revenue, printed in C$M (4,357); scale is the unit
  #     conversion C$M -> CAD, part of the reading, not a number authored
  cash_flow_summary.rows.17.4: {canon: cost_of_sales, scale: 1000000}
  #   ^ LOM Operating Costs, C$M (1,859)
  # No gross_margin binding. The report's "Pre-Tax Cash Flow" (C$1,471M) is
  # revenue less operating costs LESS CAPITAL, which is a cash flow and not a
  # gross margin; revenue less operating costs alone (4,357 - 1,859 = C$2,498M)
  # is a figure the report never prints and never names. Binding an unnamed
  # subtraction to CANON `gross_margin` would assert a line the source does not
  # have — the same discipline energy_irena_solar_pv_2023.yaml applies to LCOE.

tolerance:
  abs: 1.0
  rel: 0.005
  why: >
    Table 22-3 is printed in whole C$ millions (285, 124, 54, 107), so a one-million absolute band
    is exactly the last printed digit and any true agreement must land inside it — which it does:
    fourteen of the fifteen annual pre-tax cash flows reproduce to the unit from the printed rows,
    and the two NPVs reproduce to C$0.2M against printed 848 and 655. The 0.5% relative band exists
    for the two LOM column totals that miss their own row sums by one unit (operating costs, taxes)
    and the silver total that misses by two. Tolerance is NOT set wide enough to hide the two hard
    findings in notes (the availability sentence, and the strip ratio printed two ways).

notes: |
  RE-DERIVED BY HAND. Twenty-two checks. Seventeen close, five do not.

  ── (1) THE AVAILABILITY CONTRADICTION — THE REASON THIS GOLD WAS HARVESTED ──
  The report states, twice and verbatim: "treat 20,000 tonnes/day (or 913 tonnes/hour) based on an
  availability of 8,059 hours per annum or 92%."
      8,059 h / 8,760 h = 92.00%  -- so the two halves of that clause agree with each other
      7,300,000 t/a / 8,059 h     = 905.8 t/h   -- NOT the 913 t/h printed in the same sentence
      8,760 h x 0.913 (Table 17-1's Mill Availability) = 7,997.9 h
      7,300,000 t/a / 7,997.9 h   = 912.7 t/h   -> 913 t/h   EXACTLY THE PRINTED FIGURE
  So the 913 t/h is computed from the 91.3% mill availability in Table 17-1, and the "8,059 hours
  per annum or 92%" in the same breath is a different number that does not produce it. The 0.7pp
  difference is small in isolation and is a 7.3 t/h error in the equipment sizing basis — the
  difference between specifying apron feeders and a SAG feed conveyor at 906 t/h or at 913 t/h.
  Both figures are transcribed above as printed; neither is corrected.

  ── (2) THE CRUSHING SIDE, BY CONTRAST, RECONCILES PERFECTLY ────────────────
      6,132 h/a / 8,760 h = 70.00%          -> printed "6,132 h/a or 70% availability"
      1,190 t/h x 6,132 h = 7,297,080 t/a   -> the 7,300,000 t/a target, to 0.04%
  The crusher is sized on ITS OWN availability and its own feed rate and the two close. The
  contradiction in (1) is confined to the mill statement. This is worth recording because it rules
  out "the whole report uses one loose convention": the same engineers got the adjacent circuit
  exactly right on the same page.

  ── (3) THE MINE SCHEDULE COLUMNS ──────────────────────────────────────────
    pit-to-stockpile   162+2,363+2,758+949+934                 =  7,166  -> printed 7,166  EXACT
    stockpile-to-mill  600+4,241+2,325                          =  7,166  -> printed 7,166  EXACT
      (the stockpile balances to the tonne over 14 years — a real conservation check, and it passes)
    pit-to-mill        6,000 + 7,300x7 + 6,700 + 7,300x3 + 3,059 = 88,759 -> printed 88,760 (1 kt)
    total-to-mill      6,000 + 7,300x12 + 2,325                  = 95,925 -> printed 95,927 (2 kt)
    waste rock         column sum                                = 382,908 -> printed 382,907 (1 kt)
    total mined        column sum                                = 478,833 -> printed 478,834 (1 kt)
    total moved        478,834 + 7,166 (stockpile rehandle)      = 486,000 -> printed 486,000 EXACT
  Annual strip ratios all reproduce: Y1 23,185/(6,000+2,363) = 2.77 -> 2.8; Y6 41,795/7,300 = 5.72
  -> 5.7; Y13 3,702/3,059 = 1.21 -> 1.2; Y-1 11,845/162 = 73.1 -> 73.0.

  ── (4) DOES NOT RECONCILE: THE TOTAL STRIP RATIO IS PRINTED TWO DIFFERENT WAYS
      Table 16-7 total row:  3.7        Table 22-2 summary:  4.0
      From the schedule:     382,907 / (88,760 + 7,166 = 95,926 kt of ore mined) = 3.99
  Table 22-2's 4.0 is the correct one; Table 16-7's 3.7 does not follow from any pairing of that
  table's own totals. Both are kept as printed.

  ── (5) THE ANNUAL GOLD SERIES IS CONSISTENT WITH THE GRADES, AND WITH ITSELF
  The koz series sums exactly to its printed LOM total:
      137+179+201+193+177+211+134+162+129+134+150+174+99+20 = 2,100  -> printed 2,100  EXACT
  It also tracks the grade sequence without a single inversion, which is what confirms the
  year-by-year alignment: the two years sharing a 0.65 g/t grade (Y7 and Y10) BOTH print 134 koz,
  and the ordering 0.34 < 0.50 < 0.63 < 0.65 < 0.72 < 0.77 < 0.82 < 0.83 < 0.84 < 0.90 < 0.93 <
  0.97 maps monotonically onto 20 < 99 < 129 < 134 < 150 < 162 < 174 < 177 < 179 < 193 < 201 < 211.
  (Y1 is the exception and it should be: 0.79 g/t but only 6,000 kt of ramp-up feed, giving 137.)
  Silver misses: 64+67+72+64+68+73+65+66+61+65+65+66+60+18 = 874 against a printed 876 (2 koz, or
  0.23% — inside the rounding budget of fourteen whole-koz addends, so recorded not flagged).

  ── (6) THE FLAT 90% RECOVERY DOES NOT HOLD YEAR BY YEAR, ONLY IN AGGREGATE ──
  Applying Table 22-1's flat 90% gold recovery to each year's own tonnes and grade:
      Y1  6,000 kt x 0.79 g/t x 0.90 / 31.1035 = 137.2 koz   printed 137   agrees
      Y2  7,300 x 0.84 x 0.90 / 31.1035        = 177.4       printed 179   1.0% low
      Y3  7,300 x 0.93 x 0.90                  = 196.4       printed 201   2.3% low
      Y6  7,300 x 0.97 x 0.90                  = 204.9       printed 211   2.9% low
      Y7  7,300 x 0.65 x 0.90                  = 137.3       printed 134   2.5% HIGH
      Y13 7,300 x 0.50 x 0.90                  = 105.6       printed  99   6.7% HIGH
      LOM sum of the fourteen                  = 2,105.4     printed 2,100 0.26% high
  The aggregate lands within a quarter of a percent while individual years miss by up to 6.7%, and
  the sign of the miss tracks the grade: HIGH-grade years produce MORE than a flat 90% predicts,
  low-grade years produce LESS. That is a grade-dependent recovery curve, and the report has one —
  Figure 13-18 "Overall Gold Recovery as a Function of Head Grade" (p.178). Table 22-1 nevertheless
  prints a single "Gold Process Recovery 90%" with no qualifier. The implied annual recoveries run
  from ~87.8% (Y7/Y10, 0.65 g/t) to ~92.7% (Y6, 0.97 g/t). A model fed the printed 90% will match
  the life-of-mine total and mis-time the cash flows.

  ── (7) THE CASH FLOW TABLE RECONCILES ALMOST EVERYWHERE ────────────────────
    Net revenue column   sums to 4,357  -> printed 4,357  EXACT
    Capital costs column sums to 1,027  -> printed 1,027  EXACT
      and 1,027 = 607 (initial) + 290 (sustaining) + 130 (closure net of salvage). Cross-checks
      against Table 1-3 (607,203 + 290,490 = 897,693 C$'000) and Table 1-5 (closure 159,602 less
      the stated 30,000 salvage = 129,602 -> 130). EXACT.
      Y-2 304 + Y-1 303 = 607 -> exactly the printed Initial Capital. EXACT.
    Operating costs column sums to 1,858 -> printed 1,859 (1 unit)
    Pre-tax cash flow, every year, = net revenue - operating costs - capital:
      Y1 285-124-54 = 107 (printed 107); Y5 366-137-15 = 214 (214); Y7 278-176-17 = 85 (85);
      Y12 361-111-12 = 238 (238); Y14 42-25-36 = -19 (-19). Only Y3 misses (242 vs printed 243).
      LOM 4,357 - 1,859 - 1,027 = 1,471 -> printed 1,471  EXACT
    Post-tax = pre-tax less taxes, every year: eleven of fifteen exact, four off by one unit
      (Y2, Y8, Y11, and the LOM total 1,471-313 = 1,158 against a printed 1,159).
    Taxes column sums to 310 against a printed 313 (3 units, 1.0% — the largest column miss).

  ── (8) BOTH NPVs AND BOTH IRRs REPRODUCE, ONCE THE DISCOUNTING CONVENTION IS FOUND
  Discounting the seventeen printed cash flows at 5% with Y-2 at t=1 (i.e. end-of-first-period, not
  t=0):
      pre-tax  NPV = C$848.21M  -> printed 848   post-tax NPV = C$655.10M -> printed 655
  Both land within C$0.21M of the printed figures. Placing Y-2 at t=0 instead gives 890.6 and 687.9
  — 5% too high in both cases, which is exactly the one-period factor. So the study discounts from
  the END of the first pre-production year, and that single convention choice is worth C$43M of NPV
  on this project. The report never states it. IRRs: pre-tax 24.6% -> printed 25%; post-tax 21.9%
  -> printed 22%. Payback 3.2 / 3.3 years is consistent with cumulative pre-tax cash flow crossing
  zero during Y3 (107+212 = 319 against 607 of initial capital; +243 in Y3 clears it).

  ── (9) THE CURRENCY IS CANADIAN AND THE PER-OUNCE METRICS ARE AMERICAN ─────
  Table 22-3 carries no currency symbol beyond "$M", and Table 22-2 mixes "$M" rows with "US$/oz"
  rows. The exchange rate settles it. Total Costs (LOM) as the report defines it — cash costs plus
  sustaining plus initial plus closure:
      (1,859 opex + ~66 royalty + 290 sustaining + 607 initial + 130 closure) C$M
        = C$2,952M x 0.76 = US$2,244M / 2,100 koz = US$1,068/oz  -> printed 1,068  EXACT
      AISC:  (1,859 + 66 + 290) x 0.76 / 2.1 = US$802/oz         -> printed 801
      Cash:  (1,859 + 66)       x 0.76 / 2.1 = US$697/oz         -> printed 696
  All three land, so the cost stack is C$ and the per-ounce metrics are US$ at 0.76. (The ~C$66M
  royalty is my own 1.5% of gross value, since the cash-flow table prints revenue already net of it;
  it moves the answers by US$24/oz and all three still land.)

  ── (10) THE REVENUE CHAIN RECONCILES FROM FIRST PRINCIPLES ─────────────────
  Year 2, built from Table 22-1's own terms:
      gold   179 koz x US$1,600 x 99.8% payable            = US$285,928k
      silver  67 koz x US$24    x 90.0% payable            = US$  1,447k
      at 0.76                                              = C$377,862k
      less refining+transport (179 x $2 + 67 x $1.60 = US$465k)  = C$   612k
      less doré insurance 0.15% of net value                     = C$   566k
      less 1.5% royalty                                          = C$ 5,652k
      net receipts                                               = C$371,032k -> printed C$371M
  RECONCILES to the printed million. Every one of the seven terms in that chain is a separately
  printed input, which is precisely the property the harvest brief asks for.

  ── (11) OPERATING COST RECONCILES BOTH WAYS ────────────────────────────────
      Table 1-4:  10.80 + 7.67 + 0.47 + 0.17 + 0.27 = 19.38 C$/t milled  -> printed 19.38  EXACT
      Table 22-1: 10.80 + 6.58 + 1.36 + 0.17 + 0.47 = 19.38              -> printed 19.38  EXACT
      and the two splits agree once Owner's G&A is separated: 6.58 + 1.36 = 7.94 = 7.67 + 0.27.
      LOM: 19.38 C$/t x 95,927 kt = C$1,859.1M -> printed operating costs C$1,859M  EXACT.
  Mining cost cross-check: C$2.22/t mined x 478,834 kt = C$1,063M, but C$10.80/t milled x 95,927 kt
  = C$1,036M. The two printed mining rates differ by C$27M (2.6%) on the same schedule; the
  cash-flow table is consistent with neither in isolation because mining cost is stated as varying
  annually ("LOM average of $2.22/t"). Recorded as a soft inconsistency, not a hard one.

  ── WHAT THIS SOURCE DOES NOT GIVE ─────────────────────────────────────────
  No annual availability or utilisation series: mill availability is a single flat 91.3% for all
  fourteen operating years, with no ramp in Year 1 even though mill FEED ramps (6.0 Mt against the
  7.3 Mt steady state). No maintenance schedule, no planned/unplanned outage split — nothing like
  the PCLF/UCLF/OCLF decomposition that energy_eskom_csir_south_africa_2024.yaml carries for a power
  fleet. The mining industry's technical reports state availability as a design constant; the power
  industry's regulators state it as a measured, moving series. Both are in this harvest and the
  contrast is the finding.

# ── THE PHYSICS READING (5c, 2026-08-12) ─────────────────────────────────────
# Structure only: every driver names one of THIS GOLD'S OWN input locations
# ({from:}/{path:}) or derives from other drivers ({expr:}). No number below
# is authored — 31.1035 g/ozt is the troy-ounce definition (a unit
# conversion, like mapping's `scale`), and /100 turns printed percents into
# fractions.
#
# ADDRESSING, DECLARED AHEAD OF THE ADAPTER: this gold's `inputs:` are
# nested by source table (plant_design_criteria / mine_schedule /
# economic_inputs / ...), and `engine/golds.py:_from_physics` resolves
# {from:}/{path:} against TOP-LEVEL keys only — so every reference below
# uses the natural dotted/indexed extension ("economic_inputs.<key>",
# "mine_schedule.rows[<i>][<col>]", columns per mine_schedule.schema:
# [4]=total_to_mill_kt, [5]=au_g_t, [6]=ag_g_t; rows[0..15]=Y-2..Y14,
# rows[16]=the printed LOM total row). Under today's adapter this reading
# does not resolve; the structure is verified against compile.py by a
# resolver-equipped harness (see the drafting session's report).
#
# The 17-period grid is Table 22-3's own: Y-2, Y-1, Y1..Y14, lumped Y15-20.
# Dead periods (Y-2, Y-1, Y15-20) point their mill feed at the table's own
# printed zeros (rows[0][4], rows[1][4]) and their grades at the printed
# LOM-total-row grades (rows[16][5]/[6]) — both multiply a zero feed, so no
# invented tonnage or grade ever reaches the ledger.
#
# WHAT THIS READING REACHES: the operating chain only — milled tonnes ->
# recovered Au/Ag (flat Table 22-1 recoveries; note (6) records that the
# true recovery is grade-dependent, so annual metal will sit ~1-7% off the
# printed years while LOM lands) -> payable -> refining/transport ->
# insurance -> royalty -> net receipts (note (10)'s chain), and the
# C$19.38/t milled operating cost stack. NOT reached, honestly: the annual
# capital profile (Table 22-3's capital column is published in `expected`
# only — inputs hold just the three LOM capital totals), taxes, NPV and IRR.
physics:
  stocks:
    ore:    {unit: kt}
    gold:   {unit: koz}
    silver: {unit: koz}
  drivers:
    milled_kt:
      unit: kt
      path: ["mine_schedule.rows.0.4",  "mine_schedule.rows.1.4",
             "mine_schedule.rows.2.4",  "mine_schedule.rows.3.4",
             "mine_schedule.rows.4.4",  "mine_schedule.rows.5.4",
             "mine_schedule.rows.6.4",  "mine_schedule.rows.7.4",
             "mine_schedule.rows.8.4",  "mine_schedule.rows.9.4",
             "mine_schedule.rows.10.4", "mine_schedule.rows.11.4",
             "mine_schedule.rows.12.4", "mine_schedule.rows.13.4",
             "mine_schedule.rows.14.4", "mine_schedule.rows.15.4",
             "mine_schedule.rows.0.4"]   # Y15-20: closure, zero feed —
             #                               the table's own printed 0
    au_gt:
      unit: g/t
      path: ["mine_schedule.rows.16.5", "mine_schedule.rows.16.5",
             "mine_schedule.rows.2.5",  "mine_schedule.rows.3.5",
             "mine_schedule.rows.4.5",  "mine_schedule.rows.5.5",
             "mine_schedule.rows.6.5",  "mine_schedule.rows.7.5",
             "mine_schedule.rows.8.5",  "mine_schedule.rows.9.5",
             "mine_schedule.rows.10.5", "mine_schedule.rows.11.5",
             "mine_schedule.rows.12.5", "mine_schedule.rows.13.5",
             "mine_schedule.rows.14.5", "mine_schedule.rows.15.5",
             "mine_schedule.rows.16.5"]  # dead periods: LOM grade x 0 feed
    ag_gt:
      unit: g/t
      path: ["mine_schedule.rows.16.6", "mine_schedule.rows.16.6",
             "mine_schedule.rows.2.6",  "mine_schedule.rows.3.6",
             "mine_schedule.rows.4.6",  "mine_schedule.rows.5.6",
             "mine_schedule.rows.6.6",  "mine_schedule.rows.7.6",
             "mine_schedule.rows.8.6",  "mine_schedule.rows.9.6",
             "mine_schedule.rows.10.6", "mine_schedule.rows.11.6",
             "mine_schedule.rows.12.6", "mine_schedule.rows.13.6",
             "mine_schedule.rows.14.6", "mine_schedule.rows.15.6",
             "mine_schedule.rows.16.6"]
    au_rec_pct:       {from: "economic_inputs.gold_process_recovery_pct"}
    ag_rec_pct:       {from: "economic_inputs.silver_process_recovery_pct"}
    au_price_usd:     {from: "economic_inputs.gold_price_usd_per_oz", unit: USD/oz}
    ag_price_usd:     {from: "economic_inputs.silver_price_usd_per_oz", unit: USD/oz}
    fx_cad_usd:       {from: "economic_inputs.exchange_rate_cad_to_usd"}
    au_payable_pct:   {from: "economic_inputs.gold_payable_pct"}
    ag_payable_pct:   {from: "economic_inputs.silver_payable_pct"}
    au_refine_usd_oz: {from: "economic_inputs.gold_refining_terms_usd_per_oz", unit: USD/oz}
    ag_refine_usd_oz: {from: "economic_inputs.silver_refining_terms_usd_per_oz", unit: USD/oz}
    transport_usd_oz: {from: "economic_inputs.dore_transport_costs_usd_per_oz", unit: USD/oz}
    insurance_pct:    {from: "economic_inputs.dore_insurance_costs_pct_of_net_value"}
    royalty_pct:      {from: "economic_inputs.royalty_pct"}
    # the two C$/t-milled rates stay UNTYPED (no unit:), deliberately: the
    # unit algebra (engine/ledger/units.py) carries no scalar conversion, so
    # kt x 1000 still types as kt and a typed CAD/t rate would refuse the
    # size expressions below. UNKNOWN propagates and never refuses — the
    # same state every FAO oil-mill rate is in.
    mining_cad_t:     {from: "economic_inputs.mining_cost_cad_per_t_milled"}
    opex_cad_t:       {from: "economic_inputs.total_operating_costs_cad_per_t_milled"}
    milled_t: {expr: "milled_kt * 1000"}   # kt -> t for the C$/t rates
    # kt x g/t = kg of metal; /31.1035 g/ozt -> koz directly
    au_koz:   {expr: "milled_kt * au_gt / 31.1035 * au_rec_pct / 100", unit: koz}
    ag_koz:   {expr: "milled_kt * ag_gt / 31.1035 * ag_rec_pct / 100", unit: koz}
    au_gross_usd: {expr: "au_koz * 1000 * au_price_usd * au_payable_pct / 100"}
    ag_gross_usd: {expr: "ag_koz * 1000 * ag_price_usd * ag_payable_pct / 100"}
    refine_usd:   {expr: "au_koz * 1000 * (au_refine_usd_oz + transport_usd_oz) + ag_koz * 1000 * (ag_refine_usd_oz + transport_usd_oz)"}
    net1_usd:         {expr: "au_gross_usd + ag_gross_usd - refine_usd"}
    insurance_usd:    {expr: "net1_usd * insurance_pct / 100"}
    royalty_usd:      {expr: "(net1_usd - insurance_usd) * royalty_pct / 100"}
    # notes (10): the whole chain reproduces Y2's printed C$371M to the million
    net_receipts_cad: {expr: "(net1_usd - insurance_usd - royalty_usd) / fx_cad_usd"}
    ore_per_au: {expr: "milled_kt / max(au_koz, 1)"}
    au_share:   {expr: "au_gross_usd / max(au_gross_usd + ag_gross_usd, 1)"}
    ag_share:   {expr: "1 - au_share"}
    producing:  {expr: "min(milled_kt, 1)"}
  recipes:
    gold:
      consumes: {ore: ore_per_au}
      produces:
        gold:   {qty: au_koz, use: co_product}
        silver: {qty: ag_koz, use: co_product}
      allocation:
        basis: sales_value
        source: >
          Table 22-1 prices each metal at its own price and payability and
          the study's net-receipts chain (reproduced in notes (10)) values
          the dore by those prices — relative sales value, the example
          IAS 2.14 gives and step 3 of ISO 14044's hierarchy.
        shares: {gold: au_share, silver: ag_share}
  exchanges:
    # mining cost enters the ore stock at Table 22-1's C$10.80/t-milled rate;
    # the study itself prints a second rate (C$2.22/t mined) and notes (11)
    # records that the two disagree by C$27M over the LOM — 10.80 is the one
    # the C$19.38/t stack is built from, so it is the one used here.
    - {name: mine_ore, from: cash, to: ore, when: producing,
       size: "milled_t * mining_cad_t", qty: {ore: milled_kt},
       counterparty: mine_operations}
    - {name: mill_to_gold, from: ore, to: gold, when: producing,
       size: "milled_t * mining_cad_t * au_share",
       qty: {ore: "-(milled_kt)", gold: au_koz}}
    - {name: mill_to_silver, from: ore, to: silver, when: producing,
       size: "milled_t * mining_cad_t * ag_share",
       qty: {silver: ag_koz}}
    # net receipts as one line, because Table 22-3's "Net Revenue" column is
    # net of payability, refining, transport, insurance and royalty — booking
    # gross and expensing the deductions would compare a different construct
    - {name: sell_dore, from: INCOME, to: cash, when: producing,
       size: "net_receipts_cad", counterparty: refinery,
       element_name: Revenue}
    # sold in full each period: release the whole carrying value with the
    # ounces (the periodic convention, IAS 2.25)
    - {name: gold_delivered, from: gold, to: EXPENSE, when: producing,
       release: 1.0, qty: {gold: "-(au_koz)"}}
    - {name: silver_delivered, from: silver, to: EXPENSE, when: producing,
       release: 1.0, qty: {silver: "-(ag_koz)"}}
    # the rest of the C$19.38/t stack (processing 6.58 + G&A 1.36 + TMF 0.17
    # + water treatment 0.47), stated as total-less-mining so both printed
    # rates stay the single source
    - {name: process_opex, from: cash, to: EXPENSE, when: producing,
       size: "milled_t * (opex_cad_t - mining_cad_t)",
       counterparty: suppliers}

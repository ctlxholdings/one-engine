  kind: trade_case
  mechanism: extract
  # ── HAND-LABELLED 2026-08-12 ────────────────────────────────────────────────
  # HARVESTED FOR ONE SPECIFIC REASON: this report states its plant availability
  # THREE TIMES, in three places, and the three statements are not consistent
  # with each other. The executive summary and Section 17 both say the plant
  # will "treat 20,000 tonnes/day or 913 tonnes/hour based on an availability of
  # 8,059 hours per annum or 92%", while Table 17-1 two pages later prints Mill
  # Availability 91.3% and Crushing Plant Availability 70%. 8,059 h is 92.0% of
  # a year and produces 905.8 t/h, not 913; 913 t/h is what 91.3% produces. The
  # sentence pairs a throughput derived from ONE availability with an
  # availability figure taken from ANOTHER. This is exactly the shape the
  # harvest brief calls valuable — a source that prints its factors separately
  # AND fails to re-add — and it is only detectable because the factors are
  # printed separately at all.
  resolution: L4   # same rung as mining_mt_todd_2024_fs and
  #                  mining_block14_sudan_2020_fs: a multi-stage chain
  #                  (reserve -> mined -> milled -> recovered -> payable ->
  #                  net receipts -> operating profit -> tax -> NPV) with both
  #                  ends of every stage printed, over seventeen periods.
  basis: "whole project, life of mine, unlevered (the study reports pre-tax and post-tax results for the project; no debt structure is modelled)"
  periods: 17   # Table 22-3's own columns: Y-2, Y-1, Y1..Y14, and a lumped
  #               Y15-20 closure column
  jurisdiction: CA   # British Columbia, Canada. Relevant because the currency
  #                    is Canadian dollars while the per-ounce cost metrics are
  #                    quoted in US dollars at a stated 0.76 exchange rate —
  #                    see the arithmetic in notes, finding (9).
  currency: CAD   # Table 22-3 and Tables 1-3/1-4/1-5 are in C$ (proved in
  #                 notes, finding (9), by reproducing the printed US$/oz Total
  #                 Cost from the C$ cost stack at the stated 0.76 rate). The
  #                 metal prices and the three per-ounce cost metrics are US$.


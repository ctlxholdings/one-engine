# Transcribed EXACTLY as published, INCLUDING the source's own arithmetic
# errors. Verified by hand against the primary PDF (curl + pdftotext,
# machine-readable text, no OCR). Two independent, confirmed discrepancies
# in this one CEP (Compte d'Exploitation Previsionnel) -- see notes. This is
# the strongest error-flagging case found in this research pass.

meta:
  source: >
    GIZ / PARSE (Programme d'Appui a la Reinsertion Socio-economique,
    EUTF Sahel Cameroon), "Etude sur les Metiers Rentables - Region du Nord"
    (2017), enterprise 7 "Oignon" (onion), pp.29-30: narrative p.29, "COMPTE
    D'EXPLOITATION PREVISIONNEL ET SOMMAIRE POUR UN HECTARE D'OIGNON" table
    p.30.
    https://trust-fund-for-africa.europa.eu/system/files/2019-05/t05-eutf-sah-cm-02-01_giz_parse_nord.pdf
  accessed: "2026-08-11"
  licence: >
    GIZ/BMZ development-cooperation publication, EU Emergency Trust Fund for
    Africa. "Le contenu de la presente publication releve de la
    responsabilite de la GIZ." No explicit open licence (CC or otherwise)
    found in the document; publicly hosted by the EU Trust Fund for Africa.
    Transcribed here, with full citation, for engine-verification/research
    use only.
  kind: trade_case
  # ── HAND-LABELLED 2026-08-12 ────────────────────────────────────────────
  # L3: valeurs_des_produits is 125 sacs x 15,000 FCFA/sac, both printed.
  # Same underlying source/CEP as atlas_growsell_onion_errors.yaml, but
  # transcribed here at the source's full 14-line granularity (each with
  # its own qte x cout_unitaire) rather than the atlas file's 7 pre-summed
  # movements — a richer, independent cross-check of the same entry.
  resolution: L3
  basis: "per hectare, one production cycle"
  periods: 1
  jurisdiction: CM   # GIZ PARSE Nord region = Cameroon (currency alone does not identify the country — XAF is 6 states)
  currency: XAF

inputs:
  currency: FCFA
  basis: "per hectare, one production cycle"

  # valeurs_des_produits_qte_sacs x valeurs_des_produits_cout_unitaire_fcfa_par_sac, both printed
  sale: {quantity: 125, unit: sac, price: 15000}
  # the 14 individual qte x cout_unitaire products below, pre-multiplied
  # (each product is independently verified in notes point 1, and sums to
  # 560,400). Nothing else from `inputs` belongs here: the produits fields
  # are the sale above, and the three prose_* figures are a rolled-up
  # investment/net-yield/margin total, a duplicate of the net yield, and a
  # margin figure respectively — none are individual cost lines.
  costs:
    location_terrain: 40000          # 1 x 40,000
    defrichage: 6000                 # 1 x 6,000
    labour: 24000                    # 4 x 6,000
    semis: 12000                     # 4 x 3,000
    sarclage_manuel: 64000           # 4 x 16,000
    carburant_arrosage: 224000       # 1 x 224,000
    engrais_npk_22_10_15: 80000      # 4 x 20,000
    uree_46pct: 54000                # 3 x 18,000
    fongicides_insecticide_semence: 16000   # 1 x 16,000
    main_doeuvre_epandage_engrais: 2000     # 1 x 2,000
    herbicide_roundup_durion: 6400          # 1 x 6,400
    main_doeuvre_traitement: 2000           # 1 x 2,000
    main_doeuvre_recolte: 20000             # 4 x 5,000
    transport: 10000                        # 1 x 10,000

  # ── "Activites agricoles" (field operations), p.30 table ────────────────
  location_terrain_qte: 1
  location_terrain_cout_unitaire_fcfa: 40000
  defrichage_qte: 1
  defrichage_cout_unitaire_fcfa: 6000
  labour_qte: 4
  labour_cout_unitaire_fcfa: 6000
  semis_qte: 4
  semis_cout_unitaire_fcfa: 3000
  sarclage_manuel_qte: 4
  sarclage_manuel_cout_unitaire_fcfa: 16000
  carburant_arrosage_qte: 1
  carburant_arrosage_cout_unitaire_fcfa: 224000

  # ── "Fumure" (fertilizer) ─────────────────────────────────────────────────
  engrais_npk_22_10_15_qte: 4
  engrais_npk_22_10_15_cout_unitaire_fcfa: 20000
  uree_46pct_qte: 3
  uree_46pct_cout_unitaire_fcfa: 18000
  fongicides_insecticide_semence_qte: 1
  fongicides_insecticide_semence_cout_unitaire_fcfa: 16000
  main_doeuvre_epandage_engrais_qte: 1
  main_doeuvre_epandage_engrais_cout_unitaire_fcfa: 2000

  # ── "Traitement" (treatment) ─────────────────────────────────────────────
  herbicide_roundup_durion_qte: 1
  herbicide_roundup_durion_cout_unitaire_fcfa: 6400
  main_doeuvre_traitement_qte: 1
  main_doeuvre_traitement_cout_unitaire_fcfa: 2000

  # ── "Recolte" (harvest) ───────────────────────────────────────────────────
  main_doeuvre_recolte_qte: 4
  main_doeuvre_recolte_cout_unitaire_fcfa: 5000
  transport_qte: 1
  transport_cout_unitaire_fcfa: 10000

  # ── produits (output) ─────────────────────────────────────────────────────
  valeurs_des_produits_qte_sacs: 125
  valeurs_des_produits_cout_unitaire_fcfa_par_sac: 15000

  # ── prose figures, p.29 (stated independently of the table) ─────────────
  prose_investissement_de_depart_fcfa: 709000
  prose_rendement_net_fcfa: 1875000
  prose_marge_beneficiaire_fcfa: 1166000

notes: |
  THREE distinct, independently confirmed discrepancies in this one CEP --
  all transcribed as printed, none corrected:

  1. TABLE-INTERNAL: the 14 itemised "Qte x Cout Unitaire" line items on
     p.30 (location terrain 40,000 + defrichage 6,000 + labour 24,000 +
     semis 12,000 + sarclage manuel 64,000 + carburant arrosage 224,000 +
     engrais NPK 80,000 + uree 54,000 + fongicides/insecticide 16,000 + main
     d'oeuvre epandage 2,000 + herbicide 6,400 + main d'oeuvre traitement
     2,000 + main d'oeuvre recolte 20,000 + transport 10,000) sum by hand to
     560,400 FCFA. The table's own printed "TOTAL DES CHARGES" is 709,000
     FCFA -- a gap of 148,600 FCFA (~26%) that we could not reconcile to any
     visible missing line item (e.g. no seed/bulb cost line appears anywhere
     in the table, which is a plausible candidate for the missing ~148,600,
     but this is speculation, not something the source states).

  2. TABLE vs PROSE (marge): the table's own "MARGE BENEFICIAIRE" line prints
     1,116,000 FCFA. But 1,875,000 (Valeurs des produits: 125 sacs x 15,000)
     minus 709,000 (Total des charges, as printed) = 1,166,000 -- and the
     prose on the PRECEDING page (p.29) independently states "un rendement
     net de 1.875.000 FCFA, soit une marge beneficiaire de 1.166.000 FCFA".
     So the table's marge line (1,116,000) is very likely a transcription
     typo for 1,166,000 (a digit transposition: 1.116 vs 1.166) -- the prose
     and the correct arithmetic on the table's own two other printed numbers
     agree with each other and disagree with the table's own marge cell.

  3. Consequently there are TWO different "correct" charges figures floating
     around this one enterprise: 560,400 (sum of the itemised lines) and
     709,000 (the table's own subtotal AND the prose's "investissement de
     depart", which agree with each other). We recorded the itemised lines
     as given (`inputs`) and both totals as given (`expected` /
     `prose_investissement_de_depart_fcfa`), rather than silently picking
     one -- an engine that sums the itemised lines will land on 560,400 and
     a margin of 1,875,000-560,400=1,314,600, none of which matches ANY
     printed total in the source. This is the source's own internal mess,
     transcribed whole.

# all three map — revenue MATCHES exactly (125 x 15,000); cost_of_sales
# and gross_margin are both EXPECTED to diverge, per notes 1 and 2: the 14
# lines genuinely sum to 560,400, not the printed 709,000, and that
# propagates into a computed margin (1,875,000-560,400=1,314,600) that
# matches neither the table's printed 1,116,000 nor the prose's 1,166,000.
# Transcribing the divergence, not a padded line that hides it, is the
# point of this gold.
mapping:
  valeurs_des_produits_fcfa: revenue
  total_des_charges_fcfa: cost_of_sales
  marge_beneficiaire_fcfa: gross_margin

# ONE FRANC — the source prints whole francs and the 14 line items are
# round thousands/hundreds, so any gap is the source's own arithmetic
tolerance:
  abs: 1.0
  why: >
    every figure is printed in whole francs with no display rounding to
    absorb; a gap of any size is the source's own arithmetic (see notes,
    two independently confirmed discrepancies)

expected:
  total_des_charges_fcfa: 709000          # printed subtotal; see notes (hand-sum of line items = 560,400)
  valeurs_des_produits_fcfa: 1875000      # = 125 x 15,000, exact
  marge_beneficiaire_fcfa: 1116000        # printed on the table; see notes (prose + arithmetic on the
                                           # table's own two other numbers both give 1,166,000 instead)

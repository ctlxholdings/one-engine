id: energy_epra_kenya_2023h2
title: "EPRA Kenya Bi-Annual Energy & Petroleum Statistics, Jul-Dec 2023 — installed vs EFFECTIVE capacity by technology, monthly generation, and the 23.2% system-loss series"

meta:
  source:
    - >
      Energy and Petroleum Regulatory Authority (EPRA), Republic of Kenya, "Bi-Annual Energy &
      Petroleum Statistics Report, Financial Year 2023/2024" (covering 1 July - 31 December 2023),
      published April 2024.
      Primary: https://www.epra.go.ke/sites/default/files/2025-02/EPRA%20Statistics%20Report%20-%20January%20-%20December%202023.pdf
      Retrieved 2026-08-12 via mirror (the epra.go.ke host timed out repeatedly):
      https://mwangocapital.com/wp-content/uploads/2024/04/epra-statistics-report-january-december-2023.pdf
    - >
      Page and table numbers below are the report's OWN printed ones. Sections used: 1.1.1
      Installed capacity, Table 1.1 (p.10); 1.1.2 Energy generated, Table 1.2 (p.11); 1.3 System
      losses, Table 1.8 (p.18); 1.4 reliability indices, Table 1.9 (p.18); 1.5.1 Market share,
      Table 1.10 (p.19); Chapter 2 Renewable Energy, Table 2.1 (p.21) and Figures 2.2-2.11
      (pp.21-25).
  accessed: "2026-08-12"
  licence: >
    Publication of a Kenyan statutory regulator (EPRA), published free on the Authority's own
    website. No explicit reuse licence is stated in the document.
  kind: trade_case
  # ── HAND-LABELLED 2026-08-12 ────────────────────────────────────────────────
  # WHY THIS ONE, given the corpus already holds a Kenyan regulator gold
  # (svc_water_utility_wasreb_kenya.yaml, WATER). Two things this source has
  # that no other gold in the corpus does:
  #   (a) an INSTALLED vs EFFECTIVE capacity pair, printed side by side, per
  #       technology. That IS an availability derating published as two
  #       separate numbers rather than as a percentage — geothermal 940.0 MW
  #       installed against 841.1 MW effective is an 89.5% derating the
  #       regulator never expresses as a rate, so a model must form it.
  #   (b) SIX MONTHLY generation observations per technology, plus a six-month
  #       system-loss series where every monthly loss percentage is computed
  #       by the source from a printed purchased/sold pair. That is a
  #       thirteen-point reconciliation on one page.
  resolution: L3   # capacity -> effective capacity -> monthly energy ->
  #                  half-year total -> share of mix -> purchased vs sold ->
  #                  loss rate. Each stage's output is the next stage's input
  #                  and the source prints both ends of every stage.
  basis: "the whole Kenyan electricity supply industry — interconnected, captive and off-grid — for the six months 1 July to 31 December 2023 (184 days = 4,416 hours)"
  periods: 6      # six calendar months, for generation and for system losses
  # MECHANISM — capacity_service, on the same offtake-relationship argument as
  # energy_esmap_africa_minigrid_2019.yaml: the money side of this document is
  # Kenya Power's single-buyer purchase-and-resale (energy purchased from
  # producers, energy sold to consumers, losses in between), a metered service
  # to a captive national customer base, not a wholesale commodity market.
  mechanism: capacity_service
  jurisdiction: KE
  currency: KES   # the only money figures used are the Time-of-Use customer
  #                 savings in Ksh millions; all electricity figures are MW,
  #                 GWh and percentages.


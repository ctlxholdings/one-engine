mapping: {}
# No CANON binding, same reason as svc_water_utility_wasreb_kenya.yaml: this is
# a national regulator's SECTOR aggregate spanning dozens of separately-owned
# producers plus a single-buyer utility, not one enterprise's accounts. No
# tariff per kWh, no revenue and no cost line is printed in the sections used —
# the only money in the document is Ksh 947.3m of Time-of-Use customer savings
# (Table 1.7), which is a discount total, not a revenue.

tolerance:
  abs: 0.01
  rel: 0.005
  why: >
    EPRA prints generation to 2-3 decimal places (494.812 GWh; 6,805.28 GWh), capacity to 1 dp
    (940.0 MW; 841.1 MW) and shares to 2 dp (44.55%), so 0.01 absolute is the last printed digit on
    the figures this gold actually checks. The 0.5% relative band exists for the four half-on-half
    change rates, where the source compares a 2-dp figure against a prior-period figure printed only
    as a chart label; two of those four do NOT reproduce at all (see notes) and are recorded as
    findings rather than absorbed — the band is deliberately far too tight to hide a 2.8-percentage-
    point miss.

notes: |
  RE-DERIVED BY HAND. Nineteen checks. Fourteen reconcile exactly; five do not, and two of the five
  are outright contradictions inside the same document.

  RECONCILES — the monthly series sum to their own half-year totals, to the last printed digit:
    geothermal  494.812+522.915+511.882+509.543+495.190+497.690 = 3,032.032  -> printed 3,032.03
    hydro       279.484+258.715+247.199+205.281+269.689+273.642 = 1,534.010  -> printed 1,534.01
    wind        198.461+186.661+141.301+183.360+177.530+ 85.504 =   972.817  -> printed   972.82
    solar        37.896+ 40.847+ 39.250+ 42.866+ 35.691+ 44.443 =   240.993  -> printed   240.99

  RECONCILES — Table 1.2's seven technology rows sum to its printed total EXACTLY:
    1,534.01+606.09+972.82+3,032.03+0.21+419.13+240.99 = 6,805.28  -> printed 6,805.28
  and every share divides out: 3,032.03/6,805.28 = 44.55%; 1,534.01/6,805.28 = 22.54%;
  972.82/6,805.28 = 14.30%; 240.99/6,805.28 = 3.54%; 606.09/6,805.28 = 8.91%;
  419.13/6,805.28 = 6.16%. The renewable aggregate 44.55+22.54+14.30+3.54 = 84.93% -> printed
  84.93%, and 84.93+8.91+6.16 = 100.00%.

  RECONCILES — Table 1.8, all seven loss percentages, from the printed purchased/sold pair:
    Jul (1,159-883.92)/1,159 = 23.73%   printed 23.7%
    Aug (1,154-889.62)/1,154 = 22.91%   printed 22.9%
    Sep (1,120-879.27)/1,120 = 21.49%   printed 21.5%
    Oct (1,149-879.53)/1,149 = 23.45%   printed 23.5%
    Nov (1,114-862.23)/1,114 = 22.60%   printed 22.6%
    Dec (1,110-832.35)/1,110 = 25.01%   printed 25.0%
    Total (6,805.8-5,226.9)/6,805.8 = 23.20%  printed 23.2%
  and the sales column sums to its own total: 5,226.92 -> printed 5,226.9.

  RECONCILES — Table 1.1's column totals:
    interconnected installed 839.3+940.0+572.8+435.5+210.3+2.0+200.0 = 3,199.9  -> printed 3,199.9
    interconnected effective 810.4+841.1+562.4+425.5+210.3+2.0+200.0 = 3,051.7  -> printed 3,051.7
    captive 33.0+3.7+21.3+0+196.2+111.8+83.5 = 449.5  -> printed 449.5
    and 3,199.9 + 449.5 + 40.1 = 3,689.5  -> printed 3,689.5
  RECONCILES — captive share: 449.5/3,689.5 = 12.18%  -> printed 12.18%.
  RECONCILES — captive solar growth: 46.722/27.579 - 1 = +69.41%  -> printed 69.41%.
  RECONCILES — geothermal half-on-half: 3,032.03/3,034.95 - 1 = -0.096%  -> printed -0.10%.

  DOES NOT RECONCILE (1) — TABLE 1.1's PERCENTAGE COLUMN IS COMPUTED ON A DIFFERENT DENOMINATOR
  THAN ITS OWN TOTAL ROW. The table's total installed capacity is 3,689.5 MW and the % column's
  total row reads 100.00%. But hydro 872.4/3,689.5 = 23.65%, not the printed 25.00%. Divide instead
  by 3,489.5 (= 3,689.5 minus the 200.0 MW import interconnector) and every row lands exactly:
  872.4/3,489.5 = 25.00%; 943.7 = 27.04%; 629.7 = 18.05%; 436.1 = 12.50%; 410.4 = 11.76%;
  113.8 = 3.26%; 83.5 = 2.39% — summing to 100.00%. The imports row is the only one with a BLANK in
  the % column, which is the tell. So the column is internally consistent and its printed 100.00%
  total is attached to the wrong base. The same choice explains Chapter 2's renewable share:
  2,776.3/3,489.5 = 79.56% (printed 79.56%), whereas 2,776.3/3,689.5 = 75.25%. A model fed the
  printed total and the printed shares will disagree with the source by 4.3 percentage points, and
  nothing in either table says why.

  DOES NOT RECONCILE (2) — TWO OF THE FOUR PRINTED HALF-ON-HALF CHANGES:
    hydro: printed "a notable increase of 5.19% in hydro energy generation, from 1,454.4 GWh"
           1,534.01/1,454.40 - 1 = +5.47%.  MISSES by 0.28pp.
    wind:  printed "decreased by 18.07% from 1,148.63 GWh in the second half of 2022"
           972.82/1,148.63 - 1 = -15.31%.   MISSES by 2.76pp.
  The wind miss is large and cannot be rounding: to produce -18.07% the base would have to be
  1,187.4 GWh, a figure that appears nowhere in the report (the H2 2022 chart label is 1,148.63).
  Both printed figures are kept; neither is corrected.

  DOES NOT RECONCILE (3) — THE NARRATIVE CONTRADICTS ITS OWN CHART ON THE GEOTHERMAL PEAK MONTH.
  Page 21 states "the highest geothermal energy generation occurred in August 2023, reaching
  529.915 GWh". Figure 2.2 on the same page labels August 522.915 GWh. The chart value is the
  correct one: only 522.915 makes the six monthly figures sum to the printed half-year total of
  3,032.03 GWh (with 529.915 the sum is 3,039.03, seven GWh too high). This is a transposed digit
  in the narrative, and it is provable from the source's own total — the cleanest kind of
  self-contradiction, because the document contains its own disproof.

  DOES NOT RECONCILE (4) — TWO TOTALS FOR THE SAME SIX MONTHS. Table 1.2 (energy generated) totals
  6,805.28 GWh; Table 1.8 (energy purchased by Kenya Power) totals 6,805.8 GWh. A 0.52 GWh gap
  between two tables eight pages apart. Plausibly generated-vs-purchased (own-use, or the biomass
  0.21 GWh), but the report never reconciles them and no note appears on either table.

  DOES NOT RECONCILE (5) — CAPTIVE SOLAR SHARE. Printed "196.2 MW, which constitutes 43.77% of the
  total captive capacity"; 196.2/449.5 = 43.65%. To give 43.77% the captive base would be 448.25 MW.
  MISSES by 0.12pp.

  THE AVAILABILITY CONTENT — WHAT MAKES THIS A CAPACITY-FACTOR GOLD AND NOT A STATISTICS DUMP.
  EPRA publishes INSTALLED and EFFECTIVE capacity as two columns and never divides them. The
  derating is the availability number a plant model needs, and it differs sharply by technology:
    geothermal  841.1/940.0 = 89.48%   (the largest derating in the table)
    hydro       810.4/839.3 = 96.56%
    wind        425.5/435.5 = 97.70%
    thermal     562.4/572.8 = 98.18%
    solar       210.3/210.3 = 100.00% (no derating at all)
  And the capacity factors the source never computes, over its own 4,416 hours:
    geothermal  3,032.03 GWh / (940.0 MW x 4,416 h) = 73.04% on installed; 81.63% on EFFECTIVE
    hydro       1,534.01 GWh / (839.3 MW x 4,416 h) = 41.39% on installed; 42.86% on effective
    wind          972.82 GWh / (435.5 MW x 4,416 h) = 50.59% on installed; 51.78% on effective
    solar         240.99 GWh / (210.3 MW x 4,416 h) = 25.96% (installed = effective)
  Wind's 50.6% is exceptionally high for wind and is a real feature of the Lake Turkana site, not a
  transcription error — LTWP alone holds 10.25% of national purchased energy off 310 MW.

  A PHYSICS NOTE THE MODEL MUST NOT LOSE: the December wind collapse (177.53 -> 85.50 GWh, a 52%
  fall in one month on unchanged capacity) is explicitly NOT a resource event. EPRA attributes it to
  "wind curtailment, favoring geothermal generation and electricity imports" (p.24). In the same
  half-year, hydro output tracks two named DAM LEVELS: Turkwel averaged 1,133.56 m.a.s.l against a
  minimum operating level of 1,105 and a full supply level of 1,150; Masinga averaged 1,043.66
  against an MOL of 1,035 and FSL of 1,056.5, bottoming at 1,036.85 in October — 1.85 m above the
  level at which the plant cannot run — before heavy November/December rain took it to 1,054.10
  (pp.22-23). So within ONE table, one technology's monthly output is set by a merit-order dispatch
  decision, another's by a physical stock with a hard floor, and a third's by mechanical
  availability. "Capacity factor" names all three.

  NO COST SIDE: this gold gets no `inputs.costs:` block, because EPRA publishes no cost line for
  any entity anywhere in the sections used. What the source DOES publish is physical and
  ratio-shaped: capacity in MW (installed, effective, captive, off-grid), energy in GWh (monthly
  and half-yearly, by technology), energy purchased and sold in GWh, loss percentages, three
  distribution reliability indices, and each producer's share of energy purchased. What it does
  NOT publish is a tariff per kWh, a revenue figure, a fuel cost, a capacity payment, an O&M
  figure, or any total operating cost — for Kenya Power, for KenGen, or for the sector. The ONLY
  money in the whole document is Ksh 947.3 million of Time-of-Use customer savings (Table 1.7),
  which is a discount granted, not a cost incurred and not a revenue earned; it has no lines
  beneath it and nothing to reconcile against. There is therefore no printed cost total to bind to
  `cost_of_sales` under RULE 4, and no set of lines that could re-add to one under RULE 2.
  Constructing costs from the physical series would mean importing a fuel price or a tariff from
  outside the document — the invented coefficient this corpus refuses. `mapping: {}` is left
  exactly as the original author set it, and this gold stays `unrunnable` as an accurate statement
  about the source rather than a defect in the transcription.

id: phys_hdm4_motorcycle_convey
title: "HDM-4 Road User Costs v5.01 — motorcycle/moto-taxi, per-km physical consumption (VOC generator block)"

meta:
  source:
    - "The World Bank, Transportation Global Practice, HDM-4 Road User Costs Model, Version 5.0 (HDM-4 RUC v5.01), workbook HDM4RUCModelVer501.xlsm, sheets I-Vehicle Fleet & Country Data (row 9), I-Vehicle Fleet Calibration (row 9), O-Resources and Performance (rows 27-33, col C), O-Road User Costs (rows 27-35, col C): https://datacatalog.worldbank.org/search/dataset/0065667/hdm-4-road-user-costs-model-hdm-4-ruc-version-5-0"
    - "Already catalogued in this repo: docs/atlas/registry.yaml, isic_class '4922' entry 'Motorcycle taxi / moto-taxi ... VOC generator block' (this file is a standalone transcription for the golds harvest; registry.yaml was not edited)"
  accessed: "2026-08-11 (registry) / 2026-08-12 (this gold)"
  licence: "World Bank Data Catalog dataset; no explicit reuse licence stated in the workbook or in registry.yaml's source block (same status as the BFAP/Land Bank entries already in this corpus)."
  kind: trade_case
  # L4: per-KM physical consumption is routing physics (a Leontief
  # coefficient against distance, a capacity ceiling on the vehicle), not a
  # quantity x price or itemised cost line -- engine/golds.py's driver
  # ladder has no converter above L3, so this reports `unrunnable` through
  # the flat run_golds.py pipeline BY DESIGN. The FULL-GRAMMAR TEMPLATE
  # (cases/golds/templates/phys_hdm4_motorcycle_convey.yaml) is what
  # actually exercises and verifies this source.
  resolution: L4
  basis: "per vehicle-kilometre, one representative motorcycle, one year (15,000 km, HDM-4's own generic annual utilisation), US$ 2018"
  periods: 1
  mechanism: convey
  jurisdiction: ASK_country   # HDM-4's own resolution: "not country-bound
  #  (engineering default; model labels it 'North Region', US $ 2018)" --
  #  a hole is the honest form, matching fao_broiler.yaml's own
  #  jurisdiction: ASK_country for the identical reason.
  currency: USD

inputs:
  vehicle:
    new_vehicle_price_usd: 2500
    number_of_wheels: 2
    annual_km_driven_default: 15000
  # every coefficient below is stated "per 1000 vehicle-km" in the source
  # (raw, unrounded, matching docs/atlas/registry.yaml's own 'raw' figures)
  physical_coefficients_per_1000vkm:
    fuel_economy_km_per_litre: 20.84122731601303       # inverse of fuel L/1000vkm
    lubricant_litres: 0.4671745300292969
    tyre_wear_fraction_per_wheel: 0.03238054737448692   # fraction of ONE tyre
    maintenance_parts_fraction_of_vehicle_price: 0.0008968058042228222
    maintenance_labour_hours: 1.6611377941444516
    depreciation_fraction_of_vehicle_price: 0.005668582303858385
    interest_fraction_of_vehicle_price: 0.0016345886513590812
  unit_prices_usd:
    fuel_per_litre: 0.7
    lubricating_oil_per_litre: 2.6
    tyre_each: 20
    maintenance_labour_per_hour: 1.0
  # the source's own published $/v-km totals, for cross-checking (O-Road
  # User Costs, col C) -- raw precision
  published_voc_per_vkm_usd:
    fuel: 0.03358727693557739
    lubricants: 0.001214653835631907
    tyre: 0.001295221969485283
    maintenance_parts: 0.0022420145105570555
    maintenance_labour: 0.0016611377941444516
    depreciation: 0.013944712467491627
    interest: 0.004086471628397703
    total: 0.05803149193525314

expected:
  # per-km physical consumption -- the ROUTING/consumes coefficients
  # (litre/km, tyre/km), derived from the source's own two figures each and
  # cross-checked against the source's own $/v-km lines (composition below)
  fuel_litres_per_km:
    value: 0.04798181915283203
    composition: "1 / fuel_economy_km_per_litre (20.84122731601303)"
  tyres_per_km:
    value: 0.00006476109474897384
    composition: "tyre_wear_fraction_per_wheel (0.03238054737448692) x number_of_wheels (2) / 1000"

  # annual physical quantities at 15,000 km/yr
  annual_fuel_litres: 719.7272872924804
  annual_lubricant_litres: 7.007617950439453
  annual_tyres_consumed: 0.9714164212346077

  # annual cost by component, USD -- engine-verified to reproduce the
  # source's own published_voc_per_vkm_usd x 15,000 essentially exactly
  # (see notes: worst single-line gap 5.3e-05 USD, on fuel; every other
  # line within 2e-06 USD)
  annual_cost_usd:
    fuel: 503.8091011047362
    lubricants: 18.219806671142578
    tyre: 19.428328424692154
    maintenance_parts: 33.63021765835583
    maintenance_labour: 24.917066912166774
    depreciation: 209.1706870123744
    interest: 61.29707442596555
    total: 870.4722822094335

  # a DERIVED figure, not itself printed: depreciation reconciled using the
  # vehicle price NET of tyre value -- see notes for why
  depreciation_base_usd: 2460

mapping:
  # the closest CANON slot: this source's total annual VOC (fuel + lube +
  # tyre + parts + labour + depreciation + interest) is an operating cost,
  # not a cost-of-a-sale (there is no sale in this source at all -- see
  # meta.blocks.SELL in the template)
  annual_cost_usd.total: operating_costs

tolerance:
  abs: 0.01
  why: >
    HDM-4's own workbook carries 15+ significant figures internally (the
    registry's 'raw' values); the gap between this gold's engine-reproduced
    totals and the source's own published_voc_per_vkm_usd figures is
    5.3e-05 USD/period on the WORST single line (fuel) and under 2e-06 on
    every other -- both far inside a cent, so 0.01 catches any real
    divergence while absorbing float noise, not source rounding (HDM-4
    does not itself round to whole cents anywhere in this sheet).

notes: |
  A REAL FINDING, discovered reconciling this gold, not assumed: HDM-4's
  DEPRECIATION coefficient does not apply to the gross new_vehicle_price.
  depreciation_fraction_of_vehicle_price (0.005668582303858385) / 1000 x
  2500 = 0.014171 USD/v-km -- a genuine ~1.6% gap against the source's own
  published 0.013944712467491627, not display rounding (contrast fuel/
  lubricant/tyre below, which reproduce their own published figures to
  1e-6 or tighter from the same raw-value discipline). Working the gap
  backwards: 0.005668582303858385/1000 x (2,500 - 2 x 20) =
  0.013944712467491627 -- matching EXACTLY (to 1e-9). HDM-4 depreciates
  the vehicle NET of tyre value (new_vehicle_price - number_of_wheels x
  unit_price_tyre = 2,460): tyre wear already has its own published line,
  so folding tyres into the depreciation base too would double-count them.
  INTEREST, by contrast, verified exactly against the GROSS price with no
  adjustment -- so the net-of-tyres base is specific to depreciation, not
  a blanket HDM-4 convention. `depreciation_base_usd` above encodes this,
  built entirely from numbers the source already publishes (vehicle price,
  wheel count, tyre price) -- nothing invented, only correctly assembled
  after the naive reading failed to reconcile.

  EVERY OTHER LINE CROSS-CHECKED, raw vs raw (source raw value x 15,000 =
  this gold's annual_cost_usd, before the depreciation fix was applied):
  fuel 503.809154 vs 503.809101 (5.3e-05 gap, float precision in the
  registry's own two independently-rounded renderings of the same
  fuel-economy figure -- see fuel_litres_per_km.composition); lubricants
  18.219808 vs 18.219807 (1e-06); tyre 19.428330 vs 19.428328 (2e-06);
  maintenance_parts, maintenance_labour and interest match to the printed
  precision exactly. TOTAL (with the depreciation fix applied): 870.472282
  vs the source's own voc_total_per_vkm x 15,000 = 870.472379 -- a 9.7e-05
  USD gap, i.e. the SAME float-precision noise as fuel alone, propagated
  through the sum. Nothing systematic remains once the depreciation base
  is corrected.

  ENGINE-VERIFIED (not just hand-derived): the full-grammar template
  compiles with contract()==[], every block placed (no silent block),
  compile_template() holes=set(), stock_bounds()==[], measure_consistency()
  ==[], and performance() reports t0 expense=870.47, matching this gold's
  annual_cost_usd.total to the cent. The `consumes` check (fuel -> km) was
  confirmed load-bearing by perturbation: decoupling the fuel_consumed
  exchange's own qty from the recipe's declared coefficient makes compile
  refuse by name ("the recipe declares 0.0479818 fuel per km, but 2159.18
  fuel left for 15000 km"). The capacity ceiling (km's declared 15,000)
  was likewise confirmed load-bearing: raising annual_km_driven_default to
  20,000 without also raising the capacity produces a real stock_bounds
  complaint ("km holds 20000 km against a declared capacity of 15000 km").

  WHY NOT PAIRED WITH cases/golds/atlas_convey_mototaxi.yaml (the ONE
  `convey` gold in this corpus with a revenue side, as the brief invited):
  that entry prices a DIFFERENT vehicle in a DIFFERENT context (a
  Cameroonian owner-driver's real moto, flat annual FCFA, no km/year
  anywhere in it) against HDM-4's GENERIC global motorcycle (15kW, $2,500,
  US$-2018, "North Region" — an engineering default). The registry's own
  gaps list already names this exact mismatch risk ("annual_km_driven_
  default = 15,000/yr is the HDM-4 GENERIC motorcycle default, not a
  moto-taxi utilization... African moto-taxis typically do 100-250 km/
  day"). Blending a Cameroonian revenue figure onto a generic-fleet cost
  base would not be two sources corroborating each other -- it would be
  an invented pairing wearing two citations. No source here publishes both
  sides for the SAME vehicle, so this gold stays cost-only, exactly as
  HDM-4 itself is; the option was read and declined with its reason on
  record, not silently skipped.

  HDM-4's OWN stated gaps (registry.yaml), relevant to this gold: no
  revenue side (by design, see mapping above); a flat 12%/yr interest rate
  applied to vehicle price rather than an amortising loan (no FUND block
  here); crew_wages_per_vkm prints as exactly $0 for the motorcycle
  calibration (zero crew-hours in the underlying sheet) even though the
  unit crew wage is $1/hr -- not modelled here since it contributes
  nothing; road_safety_cost_per_vkm ($0.0363, iRAP fatality-based) is
  reported by HDM-4 as a SEPARATE line, not part of voc_total_per_vkm
  (verified: the seven components above already sum to voc_total_per_vkm
  exactly, with no room for an eighth) -- so it is correctly excluded
  here, not overlooked.

# ── THE PHYSICS READING (5c) — authored 2026-08-13, agent-drafted and
# re-verified centrally (delta 0.0 against the published total). Structure
# only: every driver points at one of THIS GOLD'S OWN nested inputs keys
# (dotted paths reach nested tables since 2026-08-13) or derives from other
# drivers; a literal here refuses. The six per-1000vkm coefficient drivers
# carry NO unit on purpose: the reading grammar has no way to state the
# "per 1000 vehicle-km" basis without a literal 1000-km driver (which would
# refuse), so their unit stays UNKNOWN and the /1000 lives in the exprs —
# the same trade the same-name template documents. The template's ratified
# km-capacity ceiling (15,000) is NOT expressible through the reading
# (physics stocks carry only unit/element_name) — a known reading-grammar
# gap, disclosed here rather than faked.
physics:
  stocks:
    fuel: {unit: litre}
    km:   {unit: km}
  drivers:
    annual_km:     {from: vehicle.annual_km_driven_default, unit: km}
    fuel_economy:  {from: physical_coefficients_per_1000vkm.fuel_economy_km_per_litre,
                    unit: "km/litre"}
    fuel_price:    {from: unit_prices_usd.fuel_per_litre, unit: "USD/litre"}
    lube_per_1000: {from: physical_coefficients_per_1000vkm.lubricant_litres}
    lube_price:    {from: unit_prices_usd.lubricating_oil_per_litre, unit: "USD/litre"}
    tyre_wear_frac: {from: physical_coefficients_per_1000vkm.tyre_wear_fraction_per_wheel}
    wheels:        {from: vehicle.number_of_wheels, unit: tyre}
    tyre_price:    {from: unit_prices_usd.tyre_each, unit: "USD/tyre"}
    parts_frac:    {from: physical_coefficients_per_1000vkm.maintenance_parts_fraction_of_vehicle_price}
    labour_hours_per_1000: {from: physical_coefficients_per_1000vkm.maintenance_labour_hours}
    labour_rate:   {from: unit_prices_usd.maintenance_labour_per_hour, unit: "USD/hour"}
    dep_frac:      {from: physical_coefficients_per_1000vkm.depreciation_fraction_of_vehicle_price}
    int_frac:      {from: physical_coefficients_per_1000vkm.interest_fraction_of_vehicle_price}
    vehicle_price: {from: vehicle.new_vehicle_price_usd, unit: USD}
    fuel_per_km:   {expr: "1 / fuel_economy", unit: "litre/km"}
    fuel_litres:   {expr: "fuel_per_km * annual_km", unit: litre}
    fuel_value:    {expr: "fuel_litres * fuel_price", unit: USD}
    lube_value:    {expr: "lube_per_1000 / 1000 * annual_km * lube_price"}
    tyre_value:    {expr: "tyre_wear_frac * wheels / 1000 * annual_km * tyre_price"}
    parts_value:   {expr: "parts_frac / 1000 * annual_km * vehicle_price"}
    labour_value:  {expr: "labour_hours_per_1000 / 1000 * annual_km * labour_rate"}
    # net-of-tyres depreciation base — the source's own convention, see notes
    dep_base:      {expr: "vehicle_price - wheels * tyre_price", unit: USD}
    dep_value:     {expr: "dep_frac / 1000 * annual_km * dep_base"}
    int_value:     {expr: "int_frac / 1000 * annual_km * vehicle_price"}
  recipes:
    km:
      produces: {km: {qty: annual_km, use: produced}}
      # bare form on a JOINT event: fuel_consumed carries both counts, so
      # the ratio check fires on the same event (F-216's legal bare shape)
      consumes: {fuel: fuel_per_km}
  exchanges:
    - {name: fuel_bought, from: cash, to: fuel, size: fuel_value,
       qty: {fuel: fuel_litres}, counterparty: fuel station}
    - {name: fuel_consumed, from: fuel, to: km, size: fuel_value,
       qty: {fuel: "-fuel_litres", km: annual_km}}
    - {name: lubricant, from: cash, to: EXPENSE, size: lube_value,
       counterparty: fuel station}
    - {name: tyre_wear, from: cash, to: EXPENSE, size: tyre_value,
       counterparty: spare parts dealer}
    - {name: maint_parts, from: cash, to: EXPENSE, size: parts_value,
       counterparty: spare parts dealer}
    - {name: maint_labour, from: cash, to: EXPENSE, size: labour_value,
       counterparty: mechanic}
    - {name: depreciation, from: cash, to: EXPENSE, size: dep_value,
       counterparty: none}
    - {name: interest, from: cash, to: EXPENSE, size: int_value,
       counterparty: lender}
    - {name: km_used, from: km, to: EXPENSE, release: 1.0}

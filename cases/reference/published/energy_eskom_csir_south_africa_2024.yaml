id: energy_eskom_csir_south_africa_2024
title: "CSIR 'Utility-scale power generation statistics in South Africa 2024' — Eskom fleet Energy Availability Factor 2016-2024, installed capacity and energy by technology"

meta:
  source:
    - >
      CSIR Energy Research Centre, "Utility-scale power generation statistics in South Africa 2024
      (1 January 2024 - 31 December 2024)", 17 March 2025, 88 pages. Data sourced by CSIR from
      Eskom and the DoE IPP Office; every chart in the deck is footed "Sources: Eskom; CSIR
      analysis".
      https://www.csir.co.za/sites/default/files/2025-09/Utility%20Statistics%20Report_Jan%202025_Final.pdf
    - >
      This deck has no printed page numbers on most slides. References below name the SLIDE by its
      printed title, which is unique within the document, e.g. "slide 'The EAF trajectory showed a
      positive upturn in 2024'".
  accessed: "2026-08-12"
  licence: >
    CSIR (Council for Scientific and Industrial Research, a South African statutory science
    council) publishes this series free on its own website as a public statistical product. No
    explicit reuse licence is stated in the document.
  kind: trade_case
  # ── HAND-LABELLED 2026-08-12 ────────────────────────────────────────────────
  # THE POINT OF THIS GOLD IS THE NINE-YEAR AVAILABILITY SERIES. The corpus's
  # two existing IRENA golds treat the capacity factor as ONE flat number for a
  # plant's whole 25-year life (energy_irena_solar_pv_2023.yaml records that
  # IRENA never once writes the word "degradation"). This source is the
  # counter-evidence: the same physical fleet, unchanged in installed capacity
  # for two straight years, moved its availability factor from 78.7% to 54.8%
  # and back to 59.81% over nine years. Any model that treats availability as a
  # constant is calibrated on a number that has moved 24 percentage points
  # inside one asset's life.
  resolution: L2   # rate lines (a % availability series, MW by technology, TWh
  #                  by technology) with year-on-year changes the source itself
  #                  computes — the same rung as the IRENA cost-rate golds, and
  #                  NOT L3: the source never chains availability into energy.
  basis: "the whole South African utility-scale generation fleet — Eskom's own plants plus REIPPPP independent power producers plus imports — for calendar year 2024, with 2023 printed alongside and a nine-year (2016-2024) fleet availability series"
  periods: 9    # the EAF series 2016-2024; the capacity/energy tables cover 2
  #               of those years, and the REIPPPP energy series covers 11
  #               (2014-2024). See notes for which figure spans which window.
  # MECHANISM — same reading as energy_irena_solar_pv_2023.yaml: create x
  # physical, a new good whose ownership passes to the offtaker at the meter,
  # with the generator keeping full operational control. That gold's FINDING
  # stands here too and is sharpened by the coal fleet: `make_to_order`
  # (transformation "assemble") is the least-wrong tag, and for the COAL half
  # of this fleet it is actually defensible — coal is a priced, metered,
  # depleting input feeding a real conversion, i.e. a genuine bill-of-materials
  # recipe, unlike the free sunlight in the solar gold. The wind/solar/hydro
  # half of the SAME table has no recipe at all. One document, one table, two
  # incompatible transformation kinds under one column heading.
  mechanism: make_to_order
  jurisdiction: ZA
  currency: ZAR   # the only money figure used below is the national average
  #                 tariff in South African cents per kWh; all other figures
  #                 are MW, TWh and percentages.


    source: "slide 'Renewable energy generation from the REIPPP programme has grown by 723% since 2014 ...' (Annual energy produced [TWh]) and slide 'A decade growth of over 300% of total renewable energy installed capacity under REIPPPP. From 1 January 2014 to 30 June 2024, 3 443 MW of wind, 2 287 MW of large-scale solar PV and 500 MW of CSP became operational'"

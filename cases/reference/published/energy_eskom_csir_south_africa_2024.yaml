mapping: {}
# No CANON binding. This is a NATIONAL STATISTICAL product: an availability
# percentage, a technology capacity split and a technology energy split, with
# one tariff figure that is a proposed regulatory average, not a transacted
# price. No entity's revenue, cost of sales or margin is published, and the
# only money figure (c/kWh 195.93) is a forward NERSA proposal, not a realised
# rate. Multiplying it by generated TWh would manufacture a revenue line the
# source neither prints nor implies.

tolerance:
  abs: 0.1
  rel: 0.02
  why: >
    The availability series is printed to 1 dp for 2016-2023 and to 2 dp for 2024 (59.81%), so 0.1
    is the display rounding on the series itself. The 2% relative band is the one that matters:
    every TWh figure is printed to 1 dp (177.9, 17.8, 4.6) while its year-on-year change is printed
    as a WHOLE percent, and four of the eight printed changes cannot be reproduced from the printed
    TWh pair to better than ~1.5 percentage points (see notes). 2% relative is set to the observed
    size of that gap so an automated comparison flags a modelling error rather than the source's own
    display rounding — it is NOT set wide enough to absorb the two hard contradictions in notes.

notes: |
  RE-DERIVED BY HAND. Where the source computes something, I recomputed it from the same printed
  figures. Fourteen checks; nine close, five do not.

  (1) FLEET CAPACITY ADDS UP. Eskom month-end bars: 40,544 + 1,860 + 3,414 + 600 + 2,724 = 49,142 MW
      -> printed 49 142. RECONCILES EXACTLY, and the deck's claim "no new generation capacity was
      added by Eskom and REIPPs in 2024" is consistent with the bars being flat all twelve months.
      National total: 40,544 + 1,860 + 3,414 + 600 + 2,724 + 3,443 + 2,287 + 500 + 51 = 55,423 MW
      -> printed 55 423. RECONCILES EXACTLY. Share column: 40,544/55,423 = 73.15% (printed 73.2);
      2,287/55,423 = 4.13% (printed 4.1); 500/55,423 = 0.90% (printed 0.9). RECONCILES.

  (2) THE 2023 ENERGY ROW BALANCES; THE 2024 ROW DOES NOT.
        2023 generation: 165.6+8.1+3.6+2.0+4.3+10.8+0.2+11.6+5.0+1.4 = 212.6 TWh
             printed total 212.7 (0.1 rounding on ten 1-dp addends — acceptable)
             system load:  212.6 - 5.7 (pump load) + 16.8 (DSR) = 223.7 -> printed 223.7  EXACT
        2024 generation: 177.9+7.8+1.9+1.1+4.6+9.9+0.2+11.1+5.3+1.3 = 221.1 TWh
             printed total 221.2 (0.1 rounding — acceptable)
             system load:  221.1 - 6.1 + 2.6 = 217.6 -> printed 217.8   OFF BY 0.2 TWh
      The identical arithmetic that closes exactly for 2023 misses by 0.2 TWh for 2024. 0.2 TWh is
      twice the rounding budget of the ten addends and cannot be a display artefact of the
      subtraction alone. Kept as printed, flagged as a self-contradiction rather than reconciled.

  (3) FOUR OF THE EIGHT PRINTED YEAR-ON-YEAR CHANGES DO NOT REPRODUCE:
        coal            177.9/165.6 - 1 = +7.4%   printed +7%    ok (rounds)
        renewables       17.8/18.0  - 1 = -1.1%   printed -1%    ok
        nuclear           7.8/8.1   - 1 = -3.7%   printed -4%    ok
        imports           9.9/10.8  - 1 = -8.3%   printed -8%    ok
        total           221.2/212.7 - 1 = +4.0%   printed +4%    ok
        diesel and gas    1.9/3.6   - 1 = -47.2%  printed -48%   MISSES by 0.8pp
        pumped storage    4.6/4.3   - 1 = +7.0%   printed +8%    MISSES by 1.0pp
        hydro             1.1/2.0   - 1 = -45.0%  printed -46%   MISSES by 1.0pp
      The three that miss are the three SMALLEST rows, where a 1-dp display of a ~2-4 TWh figure
      leaves enough room in the hidden digits to move the ratio by a full percentage point. This is
      the classic shape of a source that computes on unrounded values and prints rounded ones — the
      printed factors do NOT reproduce the printed answer, and any engine fed the printed factors
      will land where I did, not where the deck did. That is the finding, and tolerance is set to
      make it visible rather than to hide it.

  (4) DEMAND CHANGES RECONCILE. Peak 33,485/33,873 - 1 = -1.15% (printed -1%); energy
      219.6/225.9 - 1 = -2.79% (printed -3%). RECONCILES.

  (5) THE LOADSHEDDING 2024 VALUES ARE NOT PRINTED. The slide shows only the 2023 peak (6,830 MW),
      the 2023 energy (10.6 TWh) and the two changes (-39%, -76%). Applying the changes gives
      ~4,166 MW and ~2.5 TWh for 2024, but those are MY products of a printed base and a printed
      rate, not figures the source publishes, so they are recorded here and deliberately kept out
      of `expected`. RULE 4 gap, stated rather than filled.

  (6) THE TWO SLIDES DISAGREE ON 2023's WEEKLY EAF PEAK. The EAF slide says the 2023 high was
      "59.9%"; the opening insights slide says "59.92%" — consistent. But the SAME insights slide
      says 2024 "reached a weekly peak of 70%" while the EAF slide says 2024 "reached ... a weekly
      high of 64.7%", and a third slide says "The weekly EAF hit a high of 70% in 2024 compared to
      60% in 2023." Three slides, three different 2024 weekly maxima (70%, 64.7%, 70%) and three
      different 2023 maxima (59.92%, 59.9%, 60%). Both figures are transcribed above; neither is
      chosen over the other.

  (7) THE CAPACITY FACTORS THE SOURCE NEVER COMPUTES. It prints capacity and it prints energy; it
      never divides. With 8,784 hours (2024 is a leap year):
        coal      177.9 TWh / (40,544 MW x 8,784 h) = 49.95%
        wind       11.1 TWh / ( 3,443 MW x 8,784 h) = 36.71%
        solar PV    5.3 TWh / ( 2,287 MW x 8,784 h) = 26.38%
        CSP         1.3 TWh / (   500 MW x 8,784 h) = 29.61%
        nuclear     7.8 TWh / ( 1,860 MW x 8,784 h) = 47.74%
        Eskom fleet (coal+nuclear+diesel/gas+hydro+pumped storage = 193.3 TWh)
                    193.3 TWh / (49,142 MW x 8,784 h) = 44.78%
      Set against the printed fleet EAF of 59.81%, the fleet's dispatch of what was AVAILABLE was
      44.78 / 59.81 = 74.9% — the South African analogue of NERC's "load factor", and the number
      that separates "the plant was broken" from "the plant was not called". The deck publishes the
      availability half and never the dispatch half.

  (8) THE REIPPPP SERIES IS THE MULTI-PERIOD PRIZE HERE, and it has a stock/flow trap in it. Energy
      2014 -> 2024 grows 2.2 -> 17.8 TWh, and 17.8/2.2 - 1 = +709%, against a printed +723%. Using
      the underlying unrounded values would be needed to hit 723% exactly (17.8/2.2 = 8.09x;
      8.23x is required). MISSES by 14pp. The capacity growth claim "+309.9%" is printed against a
      chart whose earlier-year bar labels are not legible in the extracted text, so it cannot be
      checked at all — recorded as unverifiable, not as verified.
      Note also that wind energy FELL (11.6 -> 11.1 TWh) on UNCHANGED capacity (3,443 MW, no
      additions in 2024), which the footnote explains: "Wind and solar PV energy excludes
      curtailment and is thus lower than actual wind and solar PV generation." Curtailment is
      therefore inside the printed energy figure and invisible — a capacity factor computed from
      these numbers is a DELIVERED-energy factor, not a resource one.

  (9) ANNUAL PRODUCTION SERIES: 241, 239, 238, 240, 241, 239, 227, 234, 233, 231, 224 TWh for
      2014-2024, with printed changes -0.7, -0.5, +0.7, +0.7, -1.1, -4.8, +2.8, -0.3, -0.9, -3.
      From the whole-TWh labels: 239/241-1 = -0.83% (printed -0.7); 238/239-1 = -0.42% (printed
      -0.5); 227/239-1 = -5.02% (printed -4.8); 224/231-1 = -3.03% (printed -3). The changes are
      computed on unrounded values the deck does not print. Same failure mode as (3), on an
      eleven-year series.

  WHY THIS SOURCE, over Eskom's own integrated report. Eskom publishes EAF/UCLF/PCLF in its annual
  results, but on a FINANCIAL year (April-March) and without the technology capacity/energy split in
  the same table. CSIR restates the same underlying Eskom data on CALENDAR years and puts the
  availability series, the capacity split and the energy split in one document — which is what makes
  the capacity-factor cross-check in (7) possible at all. The cost is one degree of separation from
  the primary source: CSIR is an analyst of Eskom's data, not the operator, and every chart says so.

  NO COST SIDE: this gold gets no `inputs.costs:` block. CSIR publishes a fleet AVAILABILITY
  series, a capacity split in MW, an energy split in TWh, a demand series and a loadshedding
  series — all physical or ratio-shaped. It publishes no cost of sales, no coal or diesel fuel
  bill, no O&M, no staff cost, no depreciation and no total operating cost, for Eskom or for any
  IPP; CSIR is an analyst of Eskom's operating data, not of its accounts, and the deck's cost side
  is absent by design rather than by omission.
  Two money-shaped figures exist and NEITHER is a cost line. (a) 195.93 c/kWh is the average
  tariff that would RESULT from NERSA's proposed 12.74% increase — a forward regulatory proposal,
  a price, and a price is not a cost. (b) "Latest variable generation cost: 50-60 c/kWh" is a
  RANGE with no lines beneath it, no stated basis (which plants, which year, which cost
  categories) and no printed total it belongs to; a range cannot be transcribed as a number
  without choosing one end, which would be my choice and not the source's. Multiplying either by
  the printed TWh would manufacture a cost total the deck neither prints nor implies — precisely
  what the original author's `mapping: {}` comment already refuses for the revenue side.
  With no printed cost total there is nothing to bind to `cost_of_sales` under RULE 4 and nothing
  for lines to re-add to under RULE 2. Left unrunnable, deliberately.

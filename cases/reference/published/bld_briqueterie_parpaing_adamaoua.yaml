id: bld_briqueterie_parpaing_adamaoua
title: "Briqueterie / parpaing (hollow concrete block) manufacturing — Adamaoua, Cameroon (GIZ/PARSE)"

meta:
  source:
    - "GIZ / PARSE (EUTF Sahel Cameroon), 'Étude sur les Métiers Rentables — Région de l'Adamaoua', p.60. https://trust-fund-for-africa.europa.eu/document/download/0f7dde62-c3c3-4650-86de-d18aa361058e_en?filename=ETUDES%20SUR%20LES%20METIERS%20RENTABLES%20-%20ADAMAOUA"
    - "Already catalogued in this repo: docs/atlas/registry.yaml, isic_class '2395' entry 'Briqueterie / parpaing (hollow concrete block) manufacturing', and docs/atlas/harvests/giz_parse_adamaoua.yaml — this file is a standalone transcription for the golds harvest; I did not edit registry.yaml or the harvest file."
  licence: "Publicly published PDF (europa.eu / EUTF Sahel Cameroon programme); no explicit reuse licence stated in the document or in registry.yaml's source block."
  kind: trade_case
  # ── HAND-LABELLED 2026-08-12, part of the construction/long-cycle harvest ──
  # CHECKED THE ATLAS FIRST, per the harvest brief's own instruction. What it
  # holds is real and useable (a full cost/profit CEP), but it is NOT a bill
  # of quantities: the source's own line for raw materials reads "A la
  # charge du client" (client-supplied) and is priced at ZERO. See notes for
  # why no per-block cement/sand/water recipe could be recovered from this
  # or any other source found for this trade.
  resolution: L2
  basis: "one representative fabricant (block-maker), Adamaoua Cameroon, annual, 2017, 6-8 months/year active (tied to the BTP/construction season)"
  periods: 1
  mechanism: capacity_service   # rent_use x human (the Contractor cell): the
  #  fabricant sells his MOULDING LABOUR and equipment-time — the client
  #  supplies the raw materials — matching the mechanism already recorded
  #  for this trade in docs/atlas/registry.yaml
  jurisdiction: CM
  currency: XAF

inputs:
  # ONE recurring cost line participates in the printed bénéfice (profit)
  # arithmetic: revenue (1,200,000) - taxes (12,000) = bénéfice (1,188,000),
  # exact. Capex (tools) and the zero-priced materials pass-through are
  # real source lines but do NOT enter this year's printed margin — see
  # notes — so they are recorded separately, not inside `costs:`.
  costs:
    autres_charges_impots_taxes: 12000

  revenue: 1200000   # "fabrication_parpaings", FCFA/an

  # capex, real but NOT part of the printed bénéfice for this period (a
  # one-time tool purchase, not amortised in this source):
  outils_production:
    value: 100000
    composition: "moules, pelles, brouette, seaux (moulds, spades, wheelbarrow, buckets)"

  # THE FINDING: the raw-material line, priced and quantified as ZERO
  materiel_premieres_intrants:
    value: 0
    composition: "sable, ciment, eau fournis par client"
    note: "'A la charge du client' — the sand, cement and water a block
      needs are supplied BY THE CLIENT commissioning the blocks, not
      bought or quantified by the fabricant. This is the source's own
      accounting choice, not a gap in this transcription."

notes: |
  RE-DERIVED THE ARITHMETIC BY HAND:
    - bénéfice = fabrication_parpaings (1,200,000) - autres_charges_impots_
      taxes (12,000) = 1,188,000 -- EXACT match to the printed bénéfice.
      No other cost line participates: outils_production (100,000, capex)
      and matieres_premieres_intrants (0, pass-through) are both excluded
      from this arithmetic BY THE SOURCE ITSELF, not by this transcription
      — the printed bénéfice already checks out without them, so folding
      either into `costs:` would create a self-inflicted mismatch against
      the source's own printed number, not a finding.

  THE MATERIALS-LIST SEARCH, RECORDED AS A REAL FINDING. The harvest brief
  asks specifically for "cement, sand and water per block, output per day,
  wastage" and to check this atlas entry FIRST. It was checked first, and
  it does not carry that data — by the source's OWN design (materials are
  client-supplied and therefore never quantified or priced in this CEP).
  A genuinely different source WAS THEN SEARCHED FOR, at length:
    - Structville (a Nigerian civil-engineering blog) publishes a worked
      cement/sand calculation for 9-inch hollow blocks (1 bag cement ≈ 25-
      35 blocks depending on mix ratio, ~1:10 cement:sand by the article's
      own recommendation over a theoretical 1:14). No date-stamped,
      location-stamped enterprise (who, where, when) sits behind these
      numbers, and no PRICE or output-per-day figure accompanies them — it
      is a technical mixing note, not a costed enterprise budget, and does
      not clear this repo's own bar (every other gold here is a location-
      and-year-dated published study or a real priced document).
    - A cluster of "block-making business guide" marketing sites (okhantu.
      co.za, brick-machine.com, reitmachine.com, cceonlinenews.com) publish
      ranges like "$0.35-0.55 per block production cost, $0.60-1.00 selling
      price, 500-8,000 blocks/day" with no named producer, no location, no
      date, and no citation of their own. These read exactly like the
      "SEO-guide" content this project's own conventions already treat as
      unusable evidence, not a published source with an author who could be
      wrong or right about a specific place and time.
    - The South Africa house BOQ gold in this same harvest batch (bld_boq_
      house_southafrica.yaml) DOES carry a real, dated, professionally-
      priced materials build-up for BRICKWORK (cement bags per 1000 bricks
      LAID) — but that is bricklaying into a wall, not block MANUFACTURING,
      and belongs to that gold rather than being force-fitted here.
  Conclusion: the atlas's own briqueterie entry, checked first as
  instructed, is the best-attested source this harvest found for this
  specific trade in this specific literature, and it genuinely has no
  Leontief bill-of-quantities content — a negative result, recorded rather
  than papered over with an unsourced number.

  TRANSFERABILITY: the mechanism (sell moulding labour and equipment-time,
  client supplies materials) is common across small-scale African block-
  making enterprises per the wider search above, but this specific pricing
  (1,200,000 FCFA/an revenue, 12,000 FCFA/an in taxes) is Adamaoua-
  Cameroon-2017-specific, and the 6-8 months/year seasonality (tied to the
  BTP/construction cycle) is a real, if unquantified-in-cost-terms,
  residence-adjacent fact this gold's `costs:` cannot itself exercise (see
  `meta.periods: 1`, matching the source's own annual, not seasonal,
  presentation).

mapping:
  fabrication_parpaings: revenue
  autres_charges_impots_taxes: cost_of_sales
  benefice: gross_margin

# FCFA is printed as whole numbers throughout this source family (matches
# every other GIZ/PARSE gold in this repo's corpus); the hand re-derivation
# above reconciles EXACTLY (0 gap).
tolerance:
  abs: 0.5
  why: >
    every figure in this CEP is printed as a whole FCFA amount, so 0.5 is
    exactly the display rounding; the hand re-derivation above reconciles
    to zero gap, so anything wider would hide a real divergence

expected:
  fabrication_parpaings:
    value: 1200000
    label_as_printed: "fabrication_parpaings (generator)"
  autres_charges_impots_taxes:
    value: 12000
    label_as_printed: "autres_charges_impots_taxes"
  benefice:
    value: 1188000
    label_as_printed: "bénéfice"
    composition_as_printed: "fabrication_parpaings (1,200,000) - autres_charges_impots_taxes (12,000)"

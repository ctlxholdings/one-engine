id: bld_melia_volkensii_kfs_guide
title: "Melia volkensii (Mukau) woodlot, 5m x 5m spacing, sawn-timber option, 18-year rotation — Kitui/Makueni drylands, Kenya"

meta:
  source:
    - "Kenya Forest Service / Kenya Forestry Research Institute (KEFRI) / JICA, 'A Guide to Melia volkensii Growing in the Dryland Areas of Kenya' (CADEP-SFM), Nairobi, March 2018. Section 5.5 'Spacing' p.13; Chapter 6 'Cost and Benefit Analysis of Growing Melia' pp.24-26 (Table 1, Table 3); Appendix 1(i) p.29 (full 18-year cash flow, 5m x 5m, sawn timber). https://www.kefri.org/cadep/assets/manuals/A%20guide%20to%20on-farm%20Melia%20volkensii%20growing%20in%20the%20dryalnd%20areas%20of%20Kenya.pdf"
    - "Cross-reference only, NOT merged numerically (different rotation and scope — see notes): Wekesa L., Muturi G., Mulatya J., Esilaba A.O., Keya G.A., Ihure S. (2012), 'Economic viability of Melia volkensii (Gurkii) production on smallholdings in drylands of Kenya', International Research Journal of Agricultural Science and Soil Science 2(8):364-369. Table 1: a DIFFERENT (10-year, unspaced, farmer-survey) costing of the same species by the same institute (KEFRI), total investment US$15,585-15,586 (my own sum of its 12 line items: 15,584 -- a $1-2 rounding gap the paper carries in its own two in-text mentions too, exactly the kind of small chained-rounding noise this repo's other golds have already found in BFAP and Land Bank)."
  licence: "KFS/KEFRI/JICA guide: '(c)CADEP-SFM/KFS 2018. This publication may be reproduced in whole or in part in any form for educational purposes or non-profit uses without permission of the copyright holder provided acknowledgement is made.' Transcribed here for engine-verification/research use, with full citation."
  kind: trade_case
  # ── HAND-LABELLED 2026-08-12, part of the construction/long-cycle harvest ──
  # Every figure below is read off Table 1 (p.24), Table 3 (p.25-26) and the
  # full 18-year Appendix 1(i) worksheet (p.29) for the "5m x 5m spacing,
  # sawn timber" column/option -- the source's OWN recommended option (see
  # notes: "For commercial tree growers 5m x5m is recommended").
  resolution: L2   # itemised annual-and-cumulative money lines; some carry
  #                  qty x unit_price (seedlings, cow peas, pesticides,
  #                  fertiliser -- see inputs.composition below) but revenue
  #                  is a 5-line sum, not one qty x price, so the gold as a
  #                  whole is transcribed at L2, matching how landbank_beef's
  #                  gold treats its own itemised-with-subtotals structure.
  basis: "1 hectare, 5m x 5m spacing (400 trees/ha), intercropped with cow peas, timber (sawn) output, 18-year rotation -- the source's own full worksheet, Appendix 1(i)"
  periods: 1   # the whole 18-year rotation as ONE lump, the same convention
  #              bfap uses for "one summer season" -- the source's own year-
  #              by-year detail is in inputs.by_year_ksh below for reference,
  #              but to_template's L1-L3 path has no per-year timing (see
  #              cases/golds/templates/bld_melia_volkensii.yaml for the
  #              year-indexed FULL-GRAMMAR attempt built from these same
  #              numbers)
  mechanism: grow_then_sell
  jurisdiction: KE
  currency: KES

inputs:
  spacing: "5m x 5m"
  density_trees_per_ha: 400   # KFS guide 5.5, p.13: "Melia volkensii should
  #  be planted at a spacing of 5m by 5m thus giving a stock density of 400
  #  trees per hectare"
  rotation_years: 18          # Table 1 header: "Net Income (18 years)"

  # ── (a) Inputs -- cost: qty x unit price, Appendix 1(i) ──────────────────
  # composition, each independently recomputed and matching the printed line:
  #   seedling            480 No  x 50 KSh    = 24,000  (480 = 400 trees/ha
  #                       x 1.20 -- the 20% "beating up" replacement buffer
  #                       Table 3 states as its own separate labour line;
  #                       480 is also the Appendix's own printed Qty)
  #   cow peas seed        30 Kg  x 120 KSh   = 3,600/yr x 3 yrs = 10,800
  #   pesticides             3 Lt x 3,000 KSh = 9,000/yr  x 3 yrs = 27,000
  #   fertilizer (DAP)       3 (50kg bags) x 3,000 KSh = 9,000/yr x 3 yrs
  #                       = 27,000
  costs:
    seedling: 24000
    cow_peas_seed: 10800
    pesticides: 27000
    fertilizer_dap: 27000
    # (b) labour tied to the Melia trees themselves: cutting stakes, staking
    # out, pitting, planting, beating-up, de-budding, pruning (yrs 1-5),
    # slashing (yrs 4-7), 1st thinning (yr 6-7, 800), 2nd thinning (yr 10,
    # 400) -- SECTION TOTAL only; the individual man-day lines are legible in
    # the source's Appendix but this transcription keeps only the printed
    # section total (55,600) plus the two proceeds/thinning figures already
    # broken out below, both cross-checked against the section total's own
    # internal chain (see notes.b_check)
    melia_labour_section_b: 55600
    # (c) labour for the intercropped cow-pea food crop: land prep, planting,
    # weeding (4x), grain harvesting/threshing -- SECTION TOTAL only, same
    # reason as (b): individual cells in this densely-packed appendix table
    # carry more transcription risk than the printed section subtotal, which
    # is cross-checked instead (see notes.expenditure_check)
    cowpeas_labour_section_c: 318200
    # (d) other costs: transport of seedling (2,000) + fencing -- 4 rolls
    # barbed wire, 135 posts, U nails, nails, 2 bags cement, sand (60,000)
    transport_of_seedling: 2000
    fencing: 60000

  # ── revenue lines (section "e) Output/product", Table 1 + Appendix) ──────
  revenue_lines:
    cow_peas_grain_6_seasons: 960000      # 4,000 Kg x 80 KSh x 3 harvests(6
    #                                        seasons per Table's own "Kg 4,000
    #                                        @ 80" line)
    sale_of_offcuts: 10000
    proceeds_1st_thinning_firewood_poles: 100000
    proceeds_2nd_thinning_timber: 280000
    final_crop_proceeds_sawn_timber_200_trees: 2403000

  # ── the two thinning operations, ages and fractions (Ch 5.10, p.21) ──────
  thinning:
    first: "at 6-7 years, removes 25% of the 400/ha planting density, leaving 300/ha"
    second: "3 years after the first (i.e. ~age 10), reduces 300/ha to 200/ha"
  harvest_age_note: >
    Ch 5.11 (p.23) recommends harvest generally from age 12 (poorer sites up
    to 18 years to reach 30cm DBH; 15-20 years for 40-50cm premium diameters).
    This gold transcribes the cost/benefit WORKSHEET's own chosen 18-year
    modelled rotation (Table 1/Appendix), not the general harvesting-age
    guidance -- the two are the same document but different sections, and
    the worksheet's own number is what the checked totals below reconcile
    against.

  # not part of the checked totals (capex/tools, not itemised per-tree):
  fencing_composition_note: "4 rolls barbed wire, 135 posts, U-nails, nails, 2 bags cement, sand"

notes: |
  RE-DERIVED THE FULL CHAIN BY HAND (per this repo's convention of never
  trusting a source's self-report without recomputing):

    - Total cost (a) = 24,000 + 10,800 + 27,000 + 27,000 = 88,800 -- EXACT
      match to the source's own printed "(a) Total cost: 88,800".

    - seedling density cross-check: 480 seedlings bought / 1.20 (the
      source's own separately-stated 20% beating-up rate) = 400 -- EXACTLY
      the planting density Section 5.5 states for 5m x 5m spacing. Two
      unrelated numbers in two different chapters of the same document
      reconcile exactly; this is the strongest confirmation in this gold.

    - Total expenditure (a+b+c+d) = 88,800 + 55,600 + 318,200 + 62,000 (=
      2,000 + 60,000) = 524,600 -- EXACT match to the source's own printed
      "Total expenditure(a+b+c+d): 524,600" for the 5x5m Timber column.

    - Gross Income = 960,000 + 10,000 + 100,000 + 280,000 + 2,403,000 =
      3,753,000 -- EXACT match to the printed "Gross Income: 3,753,000".

    - Net Income (18 years) = Gross Income - Total expenditure = 3,753,000 -
      524,600 = 3,228,400 -- EXACT match to the printed "Net Income (18
      years): 3,228,400". The chain is internally consistent to the shilling.

  expenditure_check (why (b) and (c) are transcribed as section totals only):
  the source's Appendix 1(i) is an 18-column-wide (Y1...Y18) worksheet image;
  individual man-day cells within sections (b) and (c) carry real
  transcription risk at that density. The printed SECTION TOTALS were
  cross-checked against the printed GRAND TOTAL above and match exactly, so
  they are asserted with full confidence even though a few individual
  within-section cells are not separately asserted here.

  A GENUINE OBSERVATION, not a self-consistency error (the source's own
  arithmetic already reconciles, see above): "Cost of sawing timber"
  (54,000 running ft x KSh 10/ft = 540,000, printed inside section (b) as a
  named memo line) is NOT counted inside the printed "(b) Total: 55,600" for
  the Timber columns (confirmed: Round-wood-5x5m and Timber-5x5m both print
  "(b) Total: 55,600" despite only Timber having the extra 540,000 sawing
  line -- so the source's own table structure excludes it from that
  subtotal). "Final crop proceeds" (2,403,000) is the GROSS pre-sawing sawn
  value (200 trees x ~12,015/tree, matching Table 2's own single-tree
  build-up of a 12,000 gross sawn value). Net Income (18 years) as printed
  therefore never nets the 540,000 sawing cost against anything -- a reader
  who wants "cash profit after paying to have the logs sawn" would compute
  3,228,400 - 540,000 = 2,688,400, not the printed 3,228,400. Transcribed as
  printed; the gap is a completeness question about the source's own table,
  not an arithmetic mistake in it.

  TRANSFERABILITY: this is a KEFRI/KFS extension guide for Kenya's eastern
  drylands (Kitui, Makueni, Mbeere, Tharaka -- the same four counties
  Wekesa et al. 2012 surveyed). The core physics (a single planting event,
  multi-year standing growth, one or two thinnings, one clear-fell) transfers
  to any smallholder timber species; the specific prices (KSh 50/seedling,
  KSh 3,000/50kg DAP bag, KSh 10/running-ft sawing) and the 18-year figure
  are Kenya-2018-Melia-specific.

# which of the source's own names we check against which of ours
mapping:
  gross_income_ksh: revenue
  total_expenditure_ksh: cost_of_sales
  net_income_18years_ksh: gross_margin

# ONE SHILLING: every figure in Table 1/3/Appendix is printed as a whole
# KSh (no cents anywhere in this source, unlike the ZAR/USD goldsin this
# harvest); the hand re-derivation above reconciles EXACTLY (0 gap) at every
# step, so a shilling of tolerance is pure display margin, not absorption
# of a real gap.
tolerance:
  abs: 1.0
  why: >
    every figure in Tables 1/3 and Appendix 1(i) is printed as a whole
    Kenya Shilling and the hand re-derivation above reconciles to the
    shilling at every step (0 gap); a wider tolerance would hide a real
    divergence rather than absorb source rounding

expected:
  gross_income_ksh:
    value: 3753000
    label_as_printed: "Gross Income"
    composition_as_printed: "cow_peas_grain (960,000) + sale_of_offcuts (10,000) + 1st_thinning_proceeds (100,000) + 2nd_thinning_proceeds (280,000) + final_crop_proceeds (2,403,000)"
  total_expenditure_ksh:
    value: 524600
    label_as_printed: "Total expenditure(a+b+c+d)"
    composition_as_printed: "(a) 88,800 + (b) 55,600 + (c) 318,200 + (d) 62,000"
  net_income_18years_ksh:
    value: 3228400
    label_as_printed: "Net Income (18 years)"
    composition_as_printed: "Gross Income (3,753,000) - Total expenditure (524,600)"
  # printed for the OTHER 3 columns of the same Table 1, not separately
  # checked here (same source, same page, transcribed for context):
  round_wood_5x5m_net_income_18years_ksh: 2145400
  round_wood_10x5m_net_income_18years_ksh: 2801800
  timber_10x5m_net_income_18years_ksh: 3884800

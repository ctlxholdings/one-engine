id: ext_broiler_maryland
title: "University of Maryland Extension — Farm Broiler Production Enterprise Budget, Two Houses 60'x550' (contract grower paid per 1,000 birds placed by the integrator)"

meta:
  source:
    - "University of Maryland Extension, 'Table 1. Farm Broiler Production Enterprise Budget — Two Houses 60' X 550'' (author Jennifer Timmons per PDF metadata; hosted revision Feb 2021): https://extension.umd.edu/sites/extension.umd.edu/files/2021-02/POULTRY_RevisedBroilerEnterpriseBudget.pdf"
  accessed: 2026-08-11
  licence: public/extension
  kind: trade_case
  unit_of_analysis: "per farm per year (two houses, 33,000 sq ft each, 484,000 birds/year across 5.5 flocks)"
  mechanism: capacity_service
  mechanism_note: "this is CONTRACT growing, not owned-livestock grow_then_sell: the integrator owns the birds and pays the grower a per-1,000-birds placement fee ('GROWER PAYMENTS* ... *Average payment from Integrator'). The grower sells HOUSING + LABOUR CAPACITY, not an animal, so this is the rent_use x human (Contractor) cell, same mechanism family as ext_machinery_rental_iowa2024 rather than the other livestock golds in this batch, which are owned-animal grow_then_sell."
  # ── HAND-LABELLED 2026-08-12 ─────────────────────────────────────────
  resolution: L2          # revenue is TWO separate lines (grower payments +
  #                          litter sales), not one quantity x price sale
  basis: "per farm per year, two houses (484,000 birds, 5.5 flocks)"
  periods: 1
  jurisdiction: US
  currency: USD

inputs:
  house_sqft_each: 33000
  number_of_houses: 2
  bird_density_sqft_per_bird: 0.75
  birds_per_flock: 88000
  flocks_per_year: 5.5
  birds_per_year: 484000
  gross_income:
    grower_payments: {unit: "1000 birds", quantity: 484, price_usd: 280, total_usd: 135520}
    litter_sales: {unit: tons, quantity: 190, price_usd_per_ton: 12, total_usd: 2280}
  variable_costs:
    electricity: {unit: flock, quantity: 5.5, price_usd: 2500, total_usd: 13750}
    telephone_alarm: {quantity: 1, price_usd: 500, total_usd: 500}
    supplies_and_miscellaneous: {unit: house, quantity: 2, price_usd: 1850, total_usd: 3700}
    building_and_equipment_repairs: {unit: house, quantity: 2, price_usd: 5000, total_usd: 10000}
    crust_out_or_windrow: {unit: flock, quantity: 5.5, price_usd: 325, total_usd: 1788}
    partial_house_cleanout_annual: {unit: hours, quantity: 8, price_usd_per_hour: 50, total_usd: 400}
    full_house_cleanout: {unit: hours, quantity: 4.16, price_usd_per_hour: 50, total_usd: 208}
    interest_on_operating_capital: {base_usd: 30346, rate_pct: 4.50, total_usd: 1366}
  fixed_costs:
    owners_labor: {unit: "hours/flock", quantity: 200, price_usd_per_hour: 8, total_usd: 8800, note: "8800 = 200 hrs/flock x 5.5 flocks/yr x $8/hr (the printed 'quantity' column shows only the per-flock 200, not the annualized 1,100 hours; the flocks/year multiplier is applied but not shown as its own column cell)"}
    building_depreciation: {base_usd: 360000, rate_pct: 5, total_usd: 18000}
    equipment_depreciation: {base_usd: 242500, rate_pct: 7, total_usd: 16975}
    interest_on_investment: {base_usd_avg_invest: 301256, rate_pct: 7, total_usd: 21088}
    property_taxes_usd: 1613
    insurance_usd: 3000
    land_charge: {unit: acre, quantity: 6.00, price_usd_per_acre: 125, total_usd: 750}
  fixed_investment:
    tunnel_house: {unit: house, quantity: 2, price_usd: 180000, total_usd: 360000}
    generator_wiring_alarm: {unit: house, quantity: 2, price_usd: 12500, total_usd: 25000}
    equipment: {unit: house, quantity: 2, price_usd: 90000, total_usd: 180000}
    site_preparation: {unit: house, quantity: 2, price_usd: 10000, total_usd: 20000}
    tractor_loader_blade_mower: {unit: farm, quantity: 1, price_usd: 35000, total_usd: 35000}
    manure_storage_composting_shed: {unit: farm, quantity: 1, price_usd: 2500, total_usd: 2500}
    vegetative_shelterbelt: {unit: farm, quantity: 1, price_usd: 1300, total_usd: 1300}
    well_and_water_system: {unit: house, quantity: 2, price_usd: 4500, total_usd: 9000}
    stone: {unit: farm, quantity: 1, price_usd: 5000, total_usd: 5000}
  # ── HAND-LABELLED 2026-08-12 ─────────────────────────────────────────
  # The 15 genuine cost lines (8 variable + 7 fixed), read verbatim from
  # their `total_usd` cells above. EXCLUDED: `fixed_investment` (capex, not
  # a period cost — its depreciation is already the two lines
  # `building_depreciation`/`equipment_depreciation` below).
  costs:
    electricity: 13750
    telephone_alarm: 500
    supplies_and_miscellaneous: 3700
    building_and_equipment_repairs: 10000
    crust_out_or_windrow: 1788
    partial_house_cleanout_annual: 400
    full_house_cleanout: 208
    interest_on_operating_capital: 1366
    owners_labor: 8800
    building_depreciation: 18000
    equipment_depreciation: 16975
    interest_on_investment: 21088
    property_taxes: 1613
    insurance: 3000
    land_charge: 750

expected:
  total_gross_income_usd: {value: 137800, label_as_printed: "TOTAL GROSS INCOME", composition_as_printed: "135520+2280 = 137800", dollars_per_sqft: 2.09}
  total_variable_costs_usd:
    value: 31711
    label_as_printed: "TOTAL VARIABLE COSTS LISTED ABOVE"
    composition_as_printed: "13750+500+3700+10000+1788+400+208+1366 = 31712 by hand; printed 31711 (1-dollar rounding)"
  net_income_over_variable_costs_usd: {value: 106089, label_as_printed: "NET INCOME OVER VARIABLE COSTS LISTED ABOVE", composition_as_printed: "137800 - 31711 = 106089"}
  total_fixed_cost_usd: {value: 70226, label_as_printed: "TOTAL FIXED COST LISTED ABOVE", composition_as_printed: "8800+18000+16975+21088+1613+3000+750 = 70226 exact"}
  total_variable_and_fixed_cost_usd: {value: 101937, label_as_printed: "TOTAL VARIABLE AND FIXED COST LISTED ABOVE", composition_as_printed: "31711 + 70226 = 101937"}
  net_income_over_variable_and_fixed_costs_usd:
    value: 35863
    label_as_printed: "NET INCOME OVER VARIABLE & FIXED COSTS LISTED ABOVE"
    composition_as_printed: "137800 - 101937 = 35863"
    dollars_per_sqft: 0.54
  total_investment_usd: {value: 637800, label_as_printed: "TOTAL INVESTMENT", composition_as_printed: "360000+25000+180000+20000+35000+2500+1300+9000+5000 = 637800 exact"}

mapping:
  total_gross_income_usd: revenue
  total_variable_and_fixed_cost_usd: cost_of_sales
  net_income_over_variable_and_fixed_costs_usd: gross_margin

# HALF A DOLLAR, deliberately tight (every figure here prints as a whole
# dollar). This is expected to surface a real, already-documented 1-dollar
# gap: the 8 variable-cost lines sum to $31,712 by hand but the source's own
# "TOTAL VARIABLE COSTS" prints $31,711 (see notes below) — that 1-dollar
# rounding propagates into the combined var+fixed total this gold checks.
tolerance:
  abs: 0.5
  why: >
    every dollar figure in this table is printed with zero decimal places,
    so 0.5 is exactly the display rounding; the source's own 1-dollar
    subtotal-rounding gap (documented below) is wider than that and must
    surface as a divergence, not be absorbed

notes: |
  Fully re-derived by hand:
    - Bird count reconciles: 33,000 sqft/house / 0.75 sqft-per-bird = 44,000 birds/house x 2 houses
      = 88,000 birds/flock; x 5.5 flocks/yr = 484,000 birds/yr — all exact.
    - Gross income: 484 (thousand-bird units) x $280 = $135,520 exact; 190 tons x $12 = $2,280 exact;
      total $137,800 exact ($137,800/66,000 total sqft = $2.088/sqft -> printed $2.09).
    - Interest on operating capital: the $30,346 base is EXACTLY the sum of the seven variable-cost
      lines printed above it (13750+500+3700+10000+1788+400+208 = 30,346), confirming the base;
      30,346 x 4.5% = $1,365.57 -> $1,366, matches.
    - Total Variable Costs: hand-sum of all eight variable lines (including the $1,366 interest) =
      $31,712, but the table prints $31,711 — a 1-dollar rounding gap. Net Income Over Variable
      Costs ($106,089) is computed FROM the printed $31,711, not from my $31,712 hand-sum
      (137,800-31,711=106,089 exact; 137,800-31,712=106,088, which is NOT what's printed) — so the
      source is internally self-consistent using its own (slightly-off) subtotal.
    - Owner's Labor ($8,800): the printed "Quantity" column shows only "200" (hours/flock), but
      200 x $8/hr = $1,600, not $8,800. The reconciliation requires implicitly multiplying by the
      5.5 flocks/year stated in the header: 200 x 5.5 x $8 = $8,800 exact. This is NOT a transcribed
      error — it is a real feature of the table's layout (the flocks/year multiplier is applied
      but not repeated as an explicit column value on this row), worth flagging since a naive
      "quantity x price = total" check on this one row would fail even though the table's own
      arithmetic is correct.
    - Total Fixed Cost ($70,226) and Total Investment ($637,800) both reproduce EXACTLY from their
      component lines with zero rounding gap — the cleanest section of the whole table.
    - All other fixed-cost lines check out exactly: building depreciation 360,000x5%=18,000; equipment
      depreciation 242,500x7%=16,975; interest on investment 301,256x7%=21,087.92->21,088; land
      charge 6.00x125=750.

  MECHANISM FLAG: this is the one gold in the batch that is NOT owned-livestock grow_then_sell.
  The integrator retains ownership of the birds throughout; the grower is paid a placement fee per
  1,000 birds delivered by the integrator ("GROWER PAYMENTS* ... *Average payment from Integrator")
  in exchange for housing, utilities, and labour. That is a capacity-service / contract-growing
  arrangement (rent_use x human, the Contractor cell), structurally identical in kind to a custom
  combine operator being paid per acre rather than owning the grain — see
  ext_machinery_rental_iowa2024 for the other capacity_service / rent_asset example in this batch.

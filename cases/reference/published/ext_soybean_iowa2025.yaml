id: ext_soybean_iowa2025
title: "Iowa State Ag Decision Maker — Estimated Costs of Crop Production in Iowa 2025, Herbicide-Tolerant Soybeans Following Corn (60 bu/acre trend yield)"

meta:
  source:
    - "Iowa State University Extension and Outreach, 'Estimated Costs of Crop Production in Iowa — 2025', Ag Decision Maker File A1-20 / FM 1712 (Revised January 2025), p.5, table 'Herbicide Tolerant Soybeans Following Corn', middle (60 bu/acre) column: https://www.extension.iastate.edu/agdm/crops/pdf/a1-20.pdf"
    - "Direct URL returns HTTP 403 to automated fetchers (Cloudflare bot check); content verified via the Wayback Machine mirror: https://web.archive.org/web/2025/https://www.extension.iastate.edu/agdm/crops/pdf/a1-20.pdf"
  accessed: 2026-08-11
  licence: public/extension
  kind: trade_case
  unit_of_analysis: "per acre, herbicide-tolerant soybeans following corn, 60 bu/acre (30-year trend yield, Central Iowa)"
  mechanism: grow_then_sell
  # ── HAND-LABELLED 2026-08-12 ─────────────────────────────────────────
  resolution: L2          # this source publishes COSTS ONLY — no price per
  #                          bushel is given anywhere, so no sale is possible
  basis: "per acre, one season (60 bu/acre)"
  periods: 1
  jurisdiction: US
  currency: USD

inputs:
  yield_bu_per_acre: 60
  preharvest_machinery:
    fixed_usd_per_acre: 37.60
    variable_usd_per_acre: 24.20
    operations: "chisel plow, tandem disk, field cultivate, plant, and two sprays"
  seed:
    price_usd_per_140000_kernels: 62.90
    kernels_planted: 140000
    cost_usd_per_acre: 62.90
  phosphate: {price_usd_per_lb: 0.58, lbs_per_acre: 48, cost_usd_per_acre: 27.84}
  potash: {price_usd_per_lb: 0.36, lbs_per_acre: 90, cost_usd_per_acre: 32.40}
  lime_yearly_cost_usd_per_acre: 6.41
  herbicide_usd_per_acre: 65.00
  herbicide_note: "estimate does not include any insecticide or fungicide costs (source footnote)"
  crop_insurance_usd_per_acre: 10.40
  miscellaneous_usd_per_acre: 12.90
  interest_on_preharvest_variable_costs:
    rate_pct_annual: 8.12
    months_financed: 8
    cost_usd_per_acre: 13.10
    note: "base = preharvest-machinery variable ($24.20) + seed/phosphate/potash/lime/herbicide/crop-insurance/misc ($217.85) = $242.05; 242.05 x 8.12% x 8/12 = 13.108 -> 13.10"
  harvest_machinery:
    combine: {fixed_usd_per_acre: 14.70, variable_usd_per_acre: 5.30}
    grain_cart: {fixed_usd_per_acre: 11.10, variable_usd_per_acre: 3.80}
    haul: {fixed_usd_per_acre: 4.62, variable_usd_per_acre: 2.88}
    handle_auger: {fixed_usd_per_acre: 1.90, variable_usd_per_acre: 1.52}
  labor: {hours_per_acre: 2.20, rate_usd_per_hour: 20.15, cost_usd_per_acre: 44.33}
  land_cash_rent_equivalent_usd_per_acre: 286.00
  # ── HAND-LABELLED 2026-08-12 ─────────────────────────────────────────
  # The 20 genuine cost lines, read verbatim from the `cost_usd_per_acre` /
  # `fixed_usd_per_acre` / `variable_usd_per_acre` cells above (preharvest
  # machinery split fixed/variable; harvest machinery split 4 items x
  # fixed/variable). EXCLUDED: every `*_section_total`/`total_*` figure in
  # `expected` below (subtotals, not line items) and the per-bushel rates.
  costs:
    preharvest_machinery_fixed: 37.60
    preharvest_machinery_variable: 24.20
    seed: 62.90
    phosphate: 27.84
    potash: 32.40
    lime: 6.41
    herbicide: 65.00
    crop_insurance: 10.40
    miscellaneous: 12.90
    interest_on_preharvest_variable_costs: 13.10
    harvest_combine_fixed: 14.70
    harvest_combine_variable: 5.30
    harvest_grain_cart_fixed: 11.10
    harvest_grain_cart_variable: 3.80
    harvest_haul_fixed: 4.62
    harvest_haul_variable: 2.88
    harvest_handle_auger_fixed: 1.90
    harvest_handle_auger_variable: 1.52
    labor: 44.33
    land_cash_rent_equivalent: 286.00

expected:
  seed_chemical_section_total_variable_usd_per_acre:
    value: 230.95
    label_as_printed: "Seed, Chemical, etc. — Total"
    composition_as_printed: "62.90 (seed) + 27.84 (P) + 32.40 (K) + 6.41 (lime) + 65.00 (herbicide) + 10.40 (crop insurance) + 12.90 (misc) + 13.10 (interest) = 230.95"
  harvest_machinery_section_total:
    fixed_usd_per_acre: 32.32
    variable_usd_per_acre: 13.50
    label_as_printed: "Harvest Machinery — Total"
  total_fixed_usd_per_acre:
    value: 400.25
    label_as_printed: "Total fixed, variable — Per acre — Fixed"
    composition_as_printed: "37.60 (preharvest) + 32.32 (harvest) + 44.33 (labor) + 286.00 (land) = 400.25"
  total_variable_usd_per_acre:
    value: 268.65
    label_as_printed: "Total fixed, variable — Per acre — Variable"
    composition_as_printed: "24.20 (preharvest) + 230.95 (seed/chemical) + 13.50 (harvest) = 268.65"
  total_cost_per_acre:
    value: 668.90
    label_as_printed: "Total cost per acre"
    composition_as_printed: "400.25 + 268.65 = 668.90"
  total_cost_per_bushel:
    value: 11.15
    label_as_printed: "Total cost per bushel"
    composition_as_printed: "668.90 / 60 bu = 11.148 -> 11.15"
  fixed_cost_per_bushel: 6.67
  variable_cost_per_bushel: 4.48

# no revenue is published in this source (same "costs only" pattern as
# ext_corn_iowa2025), so only the cost build-up is checked
mapping:
  total_cost_per_acre: cost_of_sales

# HALF A CENT, deliberately tight (every cost figure prints to the cent and
# every subtotal reproduces EXACTLY with zero rounding gap per the notes
# below — the cleanest of the two Iowa crop-cost golds in this batch).
tolerance:
  abs: 0.005
  why: >
    every figure is printed to the cent and reconciles exactly with no
    rounding gaps anywhere in the table, so half a cent is exactly the
    display rounding

notes: |
  Companion crop to ext_corn_iowa2025, same publication, same rotation pair (this is the soybean
  half of a corn-soybean rotation; ext_corn_iowa2025 is "Corn Following Corn" rather than "Corn
  Following Soybeans" for that gold, so the two are not literally the same acre-pair, but both
  come from the identical price/cost-methodology page).

  Re-derived every subtotal by hand: ALL of them (Seed/Chemical section, Harvest Machinery section
  fixed and variable, Total fixed, Total variable, Total cost per acre, both per-bushel figures)
  reproduce EXACTLY (to the penny) from the printed line items — no rounding gaps found anywhere in
  this table, unlike the corn table's 1-cent gap in harvest-machinery variable cost.

  Same caveat as the corn gold: this source publishes COSTS ONLY. No revenue, gross margin, or
  net-return line is computed anywhere on the page (page 1 states costs "do not provide a margin
  for profit or a return to management"). `expected` here is therefore a pure cost roll-up, not a
  P&L.

  The "Herbicide" line explicitly excludes insecticide/fungicide (source footnote 2), unlike the
  corn budget which prices insecticide separately — a genuine agronomic difference (soybean pest
  pressure economics), not a transcription gap.

id: ext_freshwater_shrimp_100day_uky
title: "University of Kentucky freshwater shrimp (Macrobrachium rosenbergii) enterprise budget — one 1-acre pond, one 100-day grow-out season, 16,000 prawns stocked to 1,000 lb harvested"

meta:
  source:
    - "Timothy A. Woods, James Murdock and Seth Riggins (University of Kentucky, Department of Agricultural Economics), 'Freshwater Shrimp Enterprise Cost and Return Estimates for Kentucky', Agricultural Economics Extension Series No. 98-05, December 1998. p.5 'Freshwater Shrimp Baseline Assumptions'; pp.6-7 'Estimated Enterprise Costs and Returns' (gross returns, variable costs, short- and long-term fixed costs, the three return lines); pp.3-4 cost-concept text (the interest convention, depreciation lives, the $8.00/hr operator labour allowance); p.7 note ('The budget compiles the estimated costs and returns for a one acre pond for a one-hundred day production season'); pp.9-10 sensitivity tables. https://extension.rwfm.tamu.edu/wp-content/uploads/sites/8/2013/09/Freshwater-Shrimp-Enterprise-Cost-and-Return-Estimates-for-Kentucky.pdf"
  accessed: "2026-08-12"
  licence: >
    US land-grant Cooperative Extension publication (University of Kentucky
    College of Agriculture, Cooperative Extension Service), published free for
    public use; no explicit open licence printed. Transcribed here, with full
    citation, for engine-verification/research use only.
  kind: trade_case
  unit_of_analysis: "one acre of pond, one 100-day production season (one crop per year)"
  mechanism: grow_then_sell
  # ── HAND-HARVESTED 2026-08-12, cycle-time/residence batch ────────────────
  # L3: revenue is one quantity x one price -- 1,000 lb x $6.75 -- both
  # printed as separate cells of the same row.
  resolution: L3
  basis: "per acre of pond, one 100-day season, 1998 growing season prices"
  periods: 1
  jurisdiction: US
  currency: USD

inputs:
  # ── THE CYCLE ITSELF ─────────────────────────────────────────────────────
  cycle:
    production_season_days: 100     # p.7: "for a one acre pond for a
    #                                 one-hundred day production season"
    crops_per_year: 1               # implied throughout (a single seasonal
    #                                 Kentucky grow-out); the source never
    #                                 states a second crop, and never states
    #                                 "1" either -- see notes/GAPS
    # the 100 days appear TWICE more as physical drivers, which is what makes
    # this gold worth having: utilities are charged as 100 days x $1.70, and
    # feeding labour is described as "20 minutes a day for 100 days".
  stock_and_yield:
    prawns_stocked_per_acre: 16000
    cost_per_prawn_usd: 0.10
    total_yield_lb: 1000
    sale_price_usd_per_lb_whole: 6.75
    acres_of_ponds: 1
  investment_assumptions:
    per_acre_pond_excavation_incl_piping_usd: 5000
    long_term_equipment_usd: 721
    years_of_use_long_term: 10
    short_term_equipment_usd: 71
    years_of_use_short_term: 5
  interest_convention: >
    p.4: "The budget assumes four months of interest to be charged for
    production expenses and two months interest on harvesting and marketing
    expenses. A conservative annual interest rate of 10.00% is used."
  variable_costs_usd:
    stocking:      {quantity: 16000, unit: each,   price: 0.10,  cost: 1600}
    feed:          {quantity: 40,    unit: bags_50lb, price: 14.50, cost: 580}
    diesel_and_oil_water_quality: {quantity: 1, unit: mix, price: 5.00, cost: 5}
    utilities:     {quantity: 100,   unit: days,   price: 1.70,  cost: 170}
    aquashade:     {quantity: 1,     unit: gallon, price: 50.00, cost: 50}
    pond_fertilizer: {quantity: 1,   unit: gallon, price: 6.00,  cost: 6}
    chemicals_to_kill_pond: {quantity: 1, unit: unit, price: 5.00, cost: 5}
    miscellaneous: {quantity: 1,     unit: unit,   price: 250.00, cost: 250}
    hired_labor:   {quantity: 32,    unit: hours,  price: 6.00,  cost: 192}
    ice_for_harvest: {quantity: 0,   unit: lb,     price: 0.30,  cost: 0}
    ziplock_and_styrofoam: {quantity: 0, unit: unit, price: 50.00, cost: 0}
    interest_on_variable_cost: {printed_rate: 0.10, printed_base_usd: 2858, cost: 92}
  operator_labour_hours:
    feeding: 35        # printed 35, annotated "(20 minutes a day for 100
    #                    days)" -- see notes, 20 x 100 / 60 = 33.33 hrs
    harvesting: 8
    total: 43
    allowance_usd_per_hour: 8.00
  short_term_fixed_costs_usd:      # 5-year straight line
    paddlewheel_motor: 60
    seine: 5
    castnet: 6
  long_term_fixed_costs_usd:       # 10-year straight line
    excavation_incl_piping: 500    # = $5,000 / 10 yr
    fertilizer_and_seeding_of_pond: 8     # printed 8, priced at 7.50
    electric_paddlewheel: 75
    oxygen_meter: 70
    barrel_to_hold_feed: 1
    five_horse_water_pump_2inch: 30
    holding_tank: 13               # printed 13, priced at 12.50
    scale_for_weighing_shrimp: 25

  # the 12 genuine per-acre-per-season cost lines (11 variable + interest).
  # EXCLUDED: the fixed-cost block (depreciation, listed separately below and
  # in `expected`) and the $344 operator-labour allowance, which the source
  # charges AFTER its "Return to Operator Labor, Land, Capital and Management"
  # line rather than inside cost.
  costs:
    stocking: 1600
    feed: 580
    diesel_and_oil: 5
    utilities: 170
    aquashade: 50
    pond_fertilizer: 6
    chemicals_to_kill_pond: 5
    miscellaneous: 250
    hired_labor: 192
    interest_on_variable_cost: 92
  revenue: 6750

expected:
  gross_returns_usd:
    value: 6750
    label_as_printed: "GROSS RETURNS/ACRE — Prawns 1000 lbs @ $6.75"
    composition_as_printed: "1,000 lb x 6.75 = 6,750 exact"
  total_production_cost_usd:
    value: 2666
    composition_as_printed: "1600+580+5+170+50+6+5+250 = 2,666 exact"
  total_harvesting_and_marketing_cost_usd:
    value: 192
    composition_as_printed: "32 hrs x $6.00 hired labour = 192; operator hours charged at $0.00 here"
  total_variable_cost_usd:
    value: 2858
    composition_as_printed: "2,666 + 192 = 2,858 exact"
  interest_on_variable_cost_usd:
    value: 92
    label_as_printed: "Interest on Variable Cost   0.10 %   $2,858.00   $92"
    composition_as_printed: "NOT 10% of 2,858 ($285.80). It is the p.4 convention: 2,666 x 10% x 4/12 + 192 x 10% x 2/12 = 88.87 + 3.20 = 92.07 -> $92 (see notes)"
  total_variable_costs_usd:
    value: 2950
    composition_as_printed: "2,858 + 92 = 2,950 exact"
  return_above_variable_costs_usd:
    value: 3800
    composition_as_printed: "6,750 - 2,950 = 3,800 exact"
  total_short_term_fixed_cost_usd:
    value: 71
    composition_as_printed: "60 + 5 + 6 = 71 exact"
  total_long_term_fixed_cost_usd:
    value: 721
    composition_as_printed: "500+7.50+75+70+1+30+12.50+25 = 721.00 exact on the unrounded prices; the DISPLAYED lines (8 and 13) sum to 722"
  total_fixed_costs_usd:
    value: 792
    composition_as_printed: "71 + 721 = 792 exact"
  return_to_operator_labor_land_capital_and_management_usd:
    value: 3008
    composition_as_printed: "3,800 - 792 = 3,008 exact"
  operator_labour_allowance_usd:
    value: 344
    composition_as_printed: "43 hrs (35 feeding + 8 harvesting) x $8.00 = 344 exact"
  return_to_land_capital_and_management_usd:
    value: 2664
    composition_as_printed: "3,008 - 344 = 2,664 exact"
  total_variable_cost_in_sensitivity_table_usd: 2950
  total_variable_and_fixed_costs_in_sensitivity_table_usd:
    value: 4086
    composition_as_printed: "2,950 + 792 + 344 (operator labour) = 4,086 exact -- so this second sensitivity table's cost base INCLUDES the operator allowance while its label says only 'Variable and Fixed Costs'"

mapping:
  gross_returns_usd: revenue
  total_variable_costs_usd: cost_of_sales
  return_above_variable_costs_usd: gross_margin

tolerance:
  abs: 0.5
  why: >
    every money figure in the budget is printed as a whole dollar, so 0.5 is
    exactly the display rounding; the source's own chain reconciles EXACTLY at
    every step once the two rounded fixed-cost lines (7.50 -> 8, 12.50 -> 13)
    are taken at their printed prices, so there is no real gap for a wider
    tolerance to absorb.

notes: |
  WHY THIS ONE WAS HARVESTED: the 100-day residence is not decoration here --
  it drives three separate printed cells. Utilities are charged as 100 days x
  $1.70/day; feeding labour is described as 20 minutes a day for 100 days; and
  the interest charge is a 4-month/2-month proration precisely because the
  money is tied up for only part of a year. Stock (16,000 prawns), cycle (100
  days) and output (1,000 lb) are all three printed.

  RE-DERIVED THE WHOLE CHAIN BY HAND AND EVERY STEP TIES:
    - Gross returns 1,000 x 6.75 = 6,750 exact.
    - Production cost: 1,600+580+5+170+50+6+5+250 = 2,666 exact. Each line
      also ties to its own qty x price (16,000 x 0.10 = 1,600; 40 x 14.50 =
      580; 100 x 1.70 = 170).
    - Variable: 2,666 + 192 = 2,858 exact; + 92 interest = 2,950 exact;
      6,750 - 2,950 = 3,800 exact.
    - Fixed: 60+5+6 = 71 exact; the eight long-term lines at their printed
      PRICES (500, 7.50, 75, 70, 1, 30, 12.50, 25) = 721.00 exact; 71 + 721 =
      792 exact.
    - 3,800 - 792 = 3,008 exact; 43 hrs x $8 = 344 exact; 3,008 - 344 = 2,664
      exact.
    - Cross-check into the sensitivity tables: 2,950 appears verbatim, and
      4,086 = 2,950 + 792 + 344 exactly.
    - Excavation depreciation: $5,000 baseline / 10-year life = $500/yr,
      exactly the printed long-term line. Two separate pages agreeing.

  THE INTEREST ROW IS MISLABELLED, NOT MISCALCULATED -- the finding worth
  keeping: the row prints "0.10 %" against a base of "$2,858.00" and an answer
  of "$92". Taken literally that row says 10% of 2,858, which is $285.80. The
  printed $92 is instead the convention stated in the p.4 text: four months of
  interest on production expenses plus two months on harvesting/marketing, at
  10%/yr -- 2,666 x 0.10 x 4/12 = 88.87, plus 192 x 0.10 x 2/12 = 3.20, total
  92.07 -> $92. So the answer is right and the row's own displayed operands
  cannot produce it. An engine that reads the row instead of the text
  overstates the cost by $194/acre.

  A SECOND SMALL INCONSISTENCY: the operator feeding-labour line prints 35
  hours, annotated "(20 minutes a day for 100 days)". 20 x 100 / 60 = 33.33
  hours, not 35. The 35 flows into the 43-hour total and the $344 allowance,
  so the printed $344 is ~$13 above what the annotation implies. Transcribed
  as printed.

  GAPS (not printed, therefore not asserted): NO SURVIVAL RATE -- 16,000
  prawns in and 1,000 lb out implies 0.0625 lb (28 g) of harvested weight per
  prawn STOCKED, but the source never splits that into a survival percentage
  and an individual weight, so neither can be checked. Also absent: any feed
  conversion ratio (40 bags x 50 lb = 2,000 lb of feed against 1,000 lb of
  shrimp would be an FCR of 2.0, but the source never says so and never gives
  a feed-per-shrimp basis); any stocking size; any explicit "crops per year";
  and any land rent (the text flags land as omitted and says returns "should
  exceed the annual equivalent cost of owning the land", without pricing it).

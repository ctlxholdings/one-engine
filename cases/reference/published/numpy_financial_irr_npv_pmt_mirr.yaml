expected:
  irr_cases:
    irr_1: {value: 0.0524, tolerance: "rtol=1e-2"}
    irr_2: {value: -0.0955, tolerance: "rtol=1e-2"}
    irr_3: {value: 0.28095, tolerance: "rtol=1e-2"}
    irr_4: {value: -0.0833, tolerance: "rtol=1e-2"}
    irr_5: {value: 0.06206, tolerance: "rtol=1e-2"}
    irr_6_with_trailing_zeros_variant: {value: 0.0886, tolerance: "rtol=1e-2", extra_check: "appending [0,0,0] to the same cashflows (trailing zero periods) is a separate test and must still give 0.0886"}
    irr_gh44_cross_checked_vs_google_sheets: {value: 1.00426, tolerance: "rtol=1e-4", note: "source comment: \"'true' value as calculated by Google sheets\" -- independently cross-validated by numpy-financial's own maintainers, the strongest single case in this file"}
  npv_case: {value: 122.89, tolerance: "rtol=1e-2"}
  pv_case: {value: -127128.17, tolerance: "rtol=1e-2", full_precision_decimal_variant: -127128.1709461939327295222005}
  rate_case: {value: 0.1107, tolerance: "rtol=1e-4"}
  pmt_cases:
    pmt_1: {value: -304.145914, full_precision_decimal_variant: -304.1459143262052370338701494}
    pmt_zero_rate: {value: -250.0}
  mirr_cases:
    mirr_1: {value: 0.0666, tolerance: "atol=1e-4 (4 published decimal places)"}
    mirr_2: {value: 0.126094, tolerance: "atol=1e-6 (6 published decimal places)"}
    mirr_3: {value: 0.3428, tolerance: "atol=1e-4 (4 published decimal places)"}
    mirr_no_real_solution: {value: null, note: "expected result is NaN -- mathematically undefined, not a missing value. All cashflows share the same sign so no finance/reinvestment split is possible."}

notes: |
  This gold validates the KERNEL arithmetic layer (pure IRR/NPV/PMT/MIRR/PV/Rate primitives), not
  a trade or a full model -- it is the natural complement to the other 4 golds in this batch, which
  are all scenario-level. Per CLAUDE.md's own kernel/library distinction, this is exactly the shape
  of evidence a kernel change would need: a case that cannot be expressed by what's already there,
  backed by a named, versioned, independently-authored reference implementation.

  Every value above is copied verbatim from parametrized pytest cases (`@pytest.mark.parametrize`)
  or single asserts in the source file -- I did not compute any of them myself. Tolerances are
  copied from each test's own `assert_allclose(..., rtol=...)` / `atol=...` call, since the source
  itself is explicit that e.g. the six basic IRR cases are only checked to rtol=1e-2 (2 significant
  digits) while the Google-Sheets-cross-checked case is held to rtol=1e-4.

  mirr_no_real_solution is included deliberately: a gold-checker that only stores "the answer"
  could mistake numpy-financial returning NaN for a bug, when it is the mathematically correct
  response (source docstring: "if there is no solution because all the cashflows have the same
  sign, then npf.mirr returns... NaN"). This is a genuine expected non-answer, not a gap in
  transcription.

  PMT sign convention: a loan of +15000 (present value received) produces a payment of
  -304.145914/month (cash outflow from the borrower) -- Python/numpy-financial's outflow-negative
  convention should be preserved when comparing against our engine, which may use a different sign
  convention internally.

  Did not transcribe numpy-financial's NPER, IPMT, PPMT, or FV test classes, or its broadcast/array
  and Decimal-dtype parametrized variants beyond the two full-precision decimal figures noted above
  -- the file has ~885 lines and dozens more cases; this gold covers the primitives most relevant
  to this project's debt-service and equity-IRR mechanisms (per BENCHMARK_REGISTRY.md's own
  "Engine mapping: S3 debt service primitives, S7 equity IRR, S5 depreciation helpers"), not the
  full test file.

  NO COST SIDE: this gold stays `unrunnable` for want of an `inputs.costs:` block, and it SHOULD.
  What the source publishes is a set of KNOWN-ANSWER TEST VECTORS for six pure functions, taken
  verbatim from numpy-financial's own pytest classes TestIrr / TestNpv / TestPmt / TestMirr /
  TestPV / TestRate: seven bare cashflow arrays with their expected IRRs (0.0524, -0.0955,
  0.28095, -0.0833, 0.06206, 0.0886, 1.00426), one NPV case at 5% expecting 122.89, one PV case
  expecting -127,128.17, one Rate case expecting 0.1107, two PMT cases (-304.145914 and -250.0),
  and four MIRR cases including one whose correct answer is NaN. Each carries the tolerance from
  its own `assert_allclose` call. That is the entire content.
  There is no business, no period, no currency, no revenue and no expense here — this file
  validates ARITHMETIC, not an enterprise. The negative entries in the cashflow arrays
  (-150,000 · -100 · -5 · -8 · -4,500 · -800 · -1,678.87 · -1) are signed elements of a vector
  fed to a root-finder; they are not cost lines, they carry no names, no basis and no dates, and
  several of them are mid-series (irr_4's -7 in the final period, mirr_3's -50 and -200) where a
  "cost" reading is meaningless. Grouping them into a `costs:` block would sum arbitrary vector
  elements across unrelated test cases into a total that exists in no source anywhere, and there
  is no published cost total to bind `cost_of_sales` to because there is no accounting statement
  in the file at all. Unrunnable is the correct state: this gold's job is to hold the kernel's
  primitives to an independently-authored reference implementation, and it does that whether or
  not the L2 money converter can build a template from it.

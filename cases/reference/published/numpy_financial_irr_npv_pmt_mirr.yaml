    - id: irr_2
      cashflows: [-100, 0, 0, 74]
    - id: irr_3
      cashflows: [-100, 39, 59, 55, 20]
    - id: irr_4
      cashflows: [-100, 100, 0, -7]
    - id: irr_5
      cashflows: [-100, 100, 0, 7]
    - id: irr_6_with_trailing_zeros_variant
      cashflows: [-5, 10.5, 1, -8, 1]
    - id: irr_gh44_cross_checked_vs_google_sheets
      cashflows: [-1678.87, 771.96, 1814.05, 3520.30, 3552.95, 3584.99, 4789.91, -1]
  npv_case:
    rate: 0.05
    cashflows: [-15000.0, 1500.0, 2500.0, 3500.0, 4500.0, 6000.0]
  pv_case:
    rate: 0.07
    nper: 20
    pmt: 12000
    fv: 0
  rate_case:
    nper: 10
    pmt: 0
    pv: -3500
    fv: 10000
  pmt_cases:
    - id: pmt_1
      rate_per_period: 0.006666667   # 0.08/12
      n_periods: 60                  # 5*12
      present_value: 15000
    - id: pmt_zero_rate
      rate_per_period: 0.0
      n_periods: 60
      present_value: 15000
  mirr_cases:
    - id: mirr_1
      cashflows: [-4500, -800, 800, 800, 600, 600, 800, 800, 700, 3000]
      finance_rate: 0.08
      reinvest_rate: 0.055
    - id: mirr_2
      cashflows: [-120000, 39000, 30000, 21000, 37000, 46000]
      finance_rate: 0.10
      reinvest_rate: 0.12
    - id: mirr_3
      cashflows: [100, 200, -50, 300, -200]
      finance_rate: 0.05
      reinvest_rate: 0.06
    - id: mirr_no_real_solution
      cashflows: [39000, 30000, 21000, 37000, 46000]   # all positive -> no sign change

# which of the source's own names we check against which of ours. The source's structure is a
# THREE-TIER waterfall, not the flat revenue/cost_of_sales/gross_margin/net_profit the crop golds
# use -- see notes for why net_profit has no clean equivalent here (this is a cash-flow model, not
# an accrual P&L; there is no published depreciation/accounting-profit line distinct from cash capex).
#
# ONLY entries in engine/golds.py's closed CANON vocabulary belong in this dict (run_gold() marks
# the WHOLE gold unrunnable if any mapping value falls outside it — no partial credit). The private
# royalties, the NT Royalty and the Income Tax have NO home in CANON (it has revenue / cost_of_sales
# / gross_margin / operating_costs / operating_profit / depreciation / net_profit / total_assets /
# total_liabilities / total_equity / cash_closing / net_change_in_cash / cash_flow_operating /
# investing / financing / irr / npv — no "royalty" or "tax" slot at all) — a second, independent
# confirmation of the tax-layer gap this gold's notes describe, this time in the GOLD-COMPARISON
# harness rather than the compiler. Documented in inputs.tax / notes instead, in full, rather than
# forced into a mapping key that does not exist.
mapping:
  gold_sales_lifeofmine: revenue
  cash_cost_of_goods_sold: cost_of_sales     # = operating_costs_subtotal + refining; EXCLUDES private royalties (see notes)
  operating_margin: gross_margin              # source's own label is "Operating Margin", not "gross margin" -- same construction (Gross Income from Mining less Operating Costs)
  after_tax_cash_flow_lifeofmine: net_profit  # NOT an accrual net-profit figure -- closest published analogue; see notes
  after_tax_npv_5pct: npv
  after_tax_irr_pct: irr

# Two precision regimes in the source itself, so a top-level default PLUS the two regime-specific
# tolerances below it (tools/run_golds.py's run_gold() only reads the top-level abs/rel/why; the
# nested pair is this file's own more precise record of the source's two actual rounding regimes).
tolerance:
  abs: 3.0
  rel: 0.001
  why: >
    Top-level default for tools/run_golds.py (flat abs/rel/why only). Set to the LOOSER of the two
    regimes below (the annual-schedule one, US$3 million) so an automated comparison against the
    LoM headline totals is not accidentally too strict; see headline_totals/annual_schedule below
    for the precise, regime-specific reasoning tied to how each part of the source actually rounds.
  headline_totals:
    abs: 1.0
    unit: "US$000s (or the LoM headline's own unit, e.g. koz, %, years)"
    why: >
      Tables 1-3 through 1-10, 22-3 through 22-27 print in whole US$000s (or 2dp per-tonne, 2dp
      grade, 1dp NPV/IRR); the source explicitly numbers itself precisely at this level in the
      Reliance-on-Other-Experts disclaimer (p.22/288), so this is exactly the source's own
      resolution -- any larger gap is either a real defect in the trade's arithmetic or the
      report's own internal inconsistency (both real, both worth surfacing).
  annual_schedule:
    abs: 3.0
    unit: "US$ million"
    why: >
      Table 22-28 (p.312) prints annual cash-flow rows to the nearest whole US$ million and the
      report SAYS SO explicitly: "Technical economic tables and figures presented in this volume
      require subsequent calculations to derive subtotals, totals and weighted averages. Such
      calculations inherently involve a degree of rounding, which are not considered to be
      material" (p.22, repeated p.288). Measured directly: independently summing the printed
      Income Taxes column across years 1-17 reproduces the printed LoM total (927) EXACTLY; doing
      the same for the Northern Territory Royalty column gives ~796-829 against a printed total of
      765 -- a 4-8% gap that is the source's OWN disclosed rounding, not a transcription slip (see
      notes). 3.0 absorbs that without absorbing a genuine divergence.

notes: |
  WHY THIS PROJECT. A 411-page NI 43-101 Feasibility Study (not a PEA or PFS -- the highest
  confidence level NI 43-101 recognizes), hosted directly by the issuer (Vista Gold Corp.),
  publishing a full Mineral Reserve statement, a five-stage metallurgical recovery chain, a
  17-year annual production AND tax schedule, and -- unusually -- TWO fully-specified royalty
  regimes (a private gross-revenue royalty and a government PROFIT-based royalty with a stated
  legal formula) on top of a flat corporate income tax. Most technical reports I could find
  (Revival Gold Beartrack-Arnett, i-80 Granite Creek, DPM Coka Rakita) were PEA-level, which is
  explicitly excluded by the task brief ("a resource-only report does not carry the economics").
  Mt Todd is FS-level, gives a sensitivity table on THREE separate axes (price/opex/capex; price/
  discount-rate; price/FX), and its NT Royalty section is the richest tax-STRUCTURE disclosure of
  any public mining document I sampled -- it prints the actual statutory formula, not just a rate.

  ARITHMETIC / INTERNAL-CONSISTENCY FINDINGS (re-derived from the source's own tables, none
  invented, per this project's convention of never trusting a source's self-report without
  recomputing):

  1. MINE LIFE: stated "16 years" as the headline figure (bullet list p.1/p.288; Table 22-1
     p.288) but the annual schedule (Table 22-28, p.312) shows revenue in 17 distinct years
     (years 1-17; year 17 is a small tail, 41 koz payable vs. 261-542 koz in a normal year), and
     the BODY TEXT at p.289 itself says "17-year LoM" when discussing the strip ratio. Genuine,
     unresolved inconsistency between three parts of the same document.

  2. METALLURGICAL RECOVERY: Table 1-6 (Headline Design Criteria, p.13) states Gold Recovery =
     91.9%. Section 22.2 (p.289) and Table 22-3's own LoM-blended figure states 91.6% (built from
     92.61% sulfide / 92.74% mixed / 90.92% oxide / 90.74% heap-leach, less 1% net solution loss
     applied to all). Both are the source's own numbers, in two different sections, and they do
     not match. I have not found a resolution for the gap within the pages I read.

  3. HEAP LEACH PAD PROCESSING WINDOW: Section 1.6.1 (p.8) states in prose that the 13.4 Mt heap
     leach pad "will be processed in years 15 and 16 at the end of project life." Table 22-28
     (p.312) shows non-zero Heap Leach Material feed in years 15, 16, AND 17 (1,454 / 9,289 /
     2,612 Kt respectively) -- a three-year tail, not the two years the prose states.

  4. WHEATON ROYALTY: modelled in the cash-flow build at a flat 1% of gross revenue (Table 22-1,
     p.288 "Wheaton Royalty: 1%"), but the printed LoM total paid ($96,753K, Table 22-20 p.299)
     divided by LoM Gold Sales ($11,364,288K) is 0.851%, not 1.000% -- a ~15% shortfall against
     the stated modelling assumption. Refining costs are too small (0.2% of sales) to explain the
     gap. I could not find a reconciling explanation in the pages available to me (possibly a
     ramp-in before the Royalty Agreement's completion-objective date, or a narrower revenue base
     for Wheaton's calculation than total Gold Sales -- not stated).

  5. NT ROYALTY ANNUAL RECONCILIATION: independently summing the Northern Territory Royalty
     column of Table 22-28 across years 1-17 gives approximately 796 (using the values as
     directly printed) to 829 (if the anomalous positive "+33" entry appearing in the year-20
     column of that row is included as printed) against a stated LoM total of 765. Cross-checking
     via Pre-Tax CF - Income Tax - After-Tax CF per year (which DOES foot exactly for Income
     Taxes, see #6) gives implied per-year NT Royalty values within +/-1 of what I read directly
     for most years, summing to ~799 -- still above 765 by roughly the same margin. The source
     explicitly disclaims that its own subtotals "inherently involve a degree of rounding, which
     are not considered material" (p.22/288); given each of 17 cells is independently rounded to
     the nearest US$ million, a 4-8% drift on a sum of 17 rounded numbers is plausible rounding
     noise rather than a computational error, but I flag the magnitude precisely rather than
     asserting it is immaterial myself.

  6. INCOME TAX cross-check: summing Table 22-28's Income Taxes column across years 1-17
     reproduces the printed LoM total (927) EXACTLY (38+67+101+9+46+98+90+33+0+0+25+57+87+104+
     101+71+0 = 927). Payable Gold likewise sums to 6,313 exactly. Both give high confidence in
     my column alignment for the whole table.

  7. PAYBACK cross-check: After-Tax Cumulative Cash Flow (Table 22-28, p.312) crosses from -US$1
     million (end of year 4) to +US$200 million (end of year 5); interpolating gives payback ~=
     4 + 1/(1+200) = 4.005 years, matching the printed "After-tax Payback (years): 4.0" (p.311).
     This is an internal consistency check that HOLDS -- included so a green result is on record,
     not only red ones (per this project's own "match: report it" convention).

  8. PIT-SHELL DESIGN BASIS: Table 1-5 (p.9-10) highlights two different rows with what looks
     like two different colours across a casual read (the $1,500/oz "Pit 49" row and the
     $1,750/oz "Pit 57" row), which could be misread as ambiguous. It is NOT ambiguous: the prose
     at p.184 states twice, unambiguously, "pit shell 49 ... was used as the basis for the
     ultimate pit design," and Pit 49's processed tonnage (267,434 Kt, 6,757 koz) is within 0.15%
     of the final Batman reserve (267,021 Kt, 6,747 koz per Table 1-3) -- the small residual gap
     is ordinary reserve-level modifying factors (dilution, mining recovery, pit-design
     refinement) layered on top of the raw optimizer shell, not a discrepancy.

  WHAT THE GRAMMAR CAN AND CANNOT EXPRESS (engine/ledger/compile.py, engine/ledger/trade.py, the
  `recipes:` block) -- read in full before answering, per the task brief:

  PHYSICS (the `extract` mechanism) -- EXPRESSIBLE TODAY, no kernel or grammar change needed.
  The reserve (280,375 Kt / 6,979 koz contained gold) is an ordinary counted `resources:` entry
  (unit: oz, opening_qty: 6979, not monetary). Each year's extraction is an ordinary exchange
  with a `qty:` field drawing down that stock -- exactly the shape `count()`/`qty` already
  supports (compile.py's own worked example is "sold = min(demand, count('herd'))"). The
  multi-stage yield chain (mined -> ore-sorted upgrade -> metallurgical recovery -> payable) is
  nothing more than three successive multiplications by cited, provenanced recovery-percentage
  drivers -- ordinary SIZE expressions, no new verb required. Price x payable ounces = revenue is
  the same shape every other gold in this corpus already uses. I see nothing this report needs
  that `resources` + `drivers` + `exchanges` + `qty` cannot already hold.

  TAX -- genuinely thinner than the physics side, but NOT a uniform "cannot express" the way a
  first read of the brief might expect. Three different answers for three different pieces:

  (a) FLAT-RATE PIECES (the 30% Commonwealth income tax on a driver-computable base; the
      escalating-percentage GROSS-REVENUE floor half of the NT Royalty formula, 1%/2%/2.5% by
      royalty year, which is just a PATH driver -- "a path resolves to its value at t",
      compile.py line 43; Wheaton's flat 1%) -- ALL directly expressible today as ordinary
      provenanced exchanges. No gap.

  (b) A SINGLE, NON-EXPIRING, UNCAPPED LOSS-CARRYFORWARD POOL -- which is exactly the shape the
      Australian Commonwealth rule actually is (p.315: "carried forward indefinitely," no annual
      cap percentage, no expiry stated) -- is ALSO mechanically buildable today, without a kernel
      change: declare a `loss_pool` resource, one exchange that adds `-assessable_income` to it
      when assessable_income < 0 (an ordinary `when:` gate), and one exchange that draws down
      `min(close('loss_pool'), max(assessable_income, 0))` against the FOLLOWING period's tax (the
      prior-period-only read `close()` is precisely what makes this legal under L-CAUSALITY). This
      is a trade-authoring PATTERN, not a first-class primitive -- nothing validates it as a loss
      pool the way `recipes.losses` validates a physical decay -- but it is not blocked. The two
      zero-Income-Tax years in this project's own schedule (years 9 and 10, Table 22-28) are
      consistent with exactly this kind of pool being drawn down from the construction years'
      losses (-2/-1 show pre-tax cash flow of -US$328M/-US$686M).

  (c) GENUINELY NOT EXPRESSIBLE without new grammar, or blocked by what THIS SOURCE discloses
      rather than by the grammar:
        - the MAX() of the NT Royalty's two branches is mechanically fine (`max` is a declared
          BUILTIN in both compile.py's `_SAFE` eval environment and trade.py's provenance
          checker) -- but branch (a), 20% x Net Value, needs CRD (capital recognition deduction),
          EEE (eligible exploration expenditure) and AD (additional deduction) as inputs, and this
          REPORT gives the FORMULA but never itemizes CRD/EEE/AD numerically anywhere I found. A
          trade built from this gold could express the royalty's outer STRUCTURE but would have
          to treat those three terms as ASK_ holes or fall back to the already-computed aggregate
          ($765M LoM, cited) rather than deriving it -- a DATA gap in the source, not a grammar
          gap in the engine.
        - a MULTI-VINTAGE, FIFO-by-age, PERCENTAGE-CAPPED, EXPIRING loss pool (the general case
          `spec/KERNEL.md`'s own "TAX ATTRIBUTE" entry names, and which a different jurisdiction's
          statute could easily require) has no home in `recipes:` -- its four members
          (consumes/occupies/losses/residence) are validated by name and anything else REFUSES
          (compile.py: "only `consumes`, `occupies`, `losses` and `residence` are built"); `losses`
          itself is a single-rate decay (constant-flow or proportional dispatched by unit), with no
          notion of competing vintages or an expiry-by-age gate. This project's OWN rule does not
          need that richness (no cap%, no expiry stated) -- but the general shape is a real, still-
          open gap, consistent with F-157's standing note that TAX ATTRIBUTE is named in
          spec/KERNEL.md and not built.
        - an ASSESSMENT WINDOW mismatch (L-WINDOW) is NOT triggered here: both the NT royalty
          year and the Commonwealth tax year are annual, and the model's own natural grid period
          is a year -- so this report never needs the "partial window annualised or refused"
          machinery neither engine currently has robustly built for engine/ledger.
        - the "continuity of ownership" / "same business" test gating the loss carryforward, and
          the various Wheaton Royalty rate-reduction TRIGGER EVENTS (change of control, a 3.47Moz
          delivery to a third party) are QUALITATIVE / LEGAL conditions, not numeric formulas --
          no verb in compile.py models legal-entity continuity or a counterparty's delivered-ounce
          threshold as a gate; a trade would have to state "assume satisfied" as a documented
          assumption rather than compute it.
        - no `bands:`-style closed, VALIDATED rate-table construct exists in engine/ledger (unlike
          the separate, older `engine/layers/tax` + `engine/common/schema/tax.py`, which has a
          full `RateSpec` with `kind: bands`, an enforced "top band must be open and last" check,
          and a proper vintaged `_LossPool` with `carryforward_years` and `cap_fraction`). That
          engine is NOT the one this task's grammar-check targeted (engine/ledger/compile.py +
          trade.py), and the two are architecturally separate (engine/ledger/emit.py only ever
          POSTS an already-computed `tax.cash_tax` figure from the other engine's output as a
          ledger line -- it does not compute tax). Worth flagging because it means the pattern
          needed already exists ELSEWHERE in this repository, as prior art, if a bands/loss-pool
          primitive is ever ported into engine/ledger.

  Net assessment: the brief's expectation ("this engine has no tax layer at all") is directionally
  right -- there is no purpose-built tax primitive in engine/ledger, and this report's royalty
  formula's inner deduction terms and general vintaged-pool shape are genuinely out of reach today
  -- but a FLAT income tax, an ESCALATING-BY-YEAR royalty floor, and even a SIMPLE non-expiring
  loss-carryforward pool are already buildable with the existing five verbs, and this project's
  actual disclosed rule happens to need exactly that simpler shape and no more.

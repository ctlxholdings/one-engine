      source: "Table 22-26, p.310-311 (= Table 1-10, p.18)"
    refining_cost_breakdown_usd_per_oz: {refining_fee: 0.75, gold_retention_pct_of_sales: 0.001, purchase_discount: 0.50, assay_fee: 95.00, environmental_fee: 50.00, freight_insurance: 0.20, all_in: 3.68}
    capex_lom_usd_000:

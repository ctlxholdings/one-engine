      sustaining_capital: 716216
      source: "Table 1-8, p.16 / Table 22-4, p.290 (both identical)"
    cash_costs_usd_per_oz:
      first_7_years: {cash_cost: 845, sustaining: 116, aisc: 961}
      life_of_mine: {cash_cost: 913, sustaining: 120, aisc: 1034}
      source: "Table 22-27, p.311; World Gold Council cash-cost/AISC guidance basis stated explicitly (site-level, excludes corporate G&A and share-based comp — a company-level AISC would add ~US$7/oz per the source's own estimate, p.311)"

  tax:
    # TWO layers, structurally distinct in the source's own cash-flow waterfall (see mapping):
    # private, revenue-based royalties netted BEFORE "Gross Income from Mining"; then a
    # government profit-based royalty and a flat income tax netted AFTER "Pre-Tax Cash Flow".
    private_royalties:
      jaac:
        legal_structure: "1% of gross value of production (min. AUD50,000/yr) to the Jawoyn Association Aboriginal Corporation for surface rights, PLUS a sliding-scale gross-proceeds production royalty of 0.125%-2.000% depending on gold price and FX rate (replaced a 10% participating-interest right in Nov 2020), PLUS AUD5,000/month consulting fee (Section 4.2, p.23-24; Section 22.5.1.2, p.315)"
        modelled_as_flat_pct_of_gross_revenue: 0.02    # Table 22-1 "JAAC Royalty: 2%", p.288
        lom_total_usd_000: 227286                      # Table 22-20, p.299 — 227,286/11,364,288 = 2.000% of Gold Sales exactly, confirming the flat-2% modelling assumption
        source: "Table 22-1 p.288; Table 22-20 p.299; legal description Section 4.2 p.23-24 and Section 22.5.1.2 p.315"
      wheaton:
        legal_structure: "Wheaton Precious Metals (Cayman) Co. is entitled to 1% of gross revenue from Mt Todd if completion objectives are met by 1 Apr 2028; rising up to 0.13%/yr thereafter to a cap of 2% if not met (both the rate and the annual increase can each be reduced by one-third on specified trigger events). Payable on production from the Mt Todd mining and exploration licenses (Section 4.2, p.24; Section 22.5.1.2, p.315)."
        modelled_as_flat_pct_of_gross_revenue: 0.01    # Table 22-1 "Wheaton Royalty: 1%", p.288
        lom_total_usd_000: 96753                       # Table 22-20, p.299
        implied_effective_rate: 0.00851                # 96,753 / 11,364,288 -- LOWER than the modelled 1% assumption; see notes
        source: "Table 22-1 p.288; Table 22-20 p.299"
      denehurst:
        legal_structure: "5% of gross value of any gold/metals commercially extracted from CERTAIN OTHER mineral concessions"
        applies_to_current_reserves: false
        note: "explicitly stated NOT to apply to any presently identified mineral resources or reserves at Mt Todd (Section 4.2, p.24; Section 22.5.1.2, p.315) -- included here only because it is named in the source, has zero effect on this project's numbers"
      combined_lom_total_usd_000: 324038   # JAAC + Wheaton, Table 22-20 p.299 = Table 22-26/1-10 "Royalties" line
      combined_pct_of_gold_sales: 0.02851  # 324,038 / 11,364,288

    nt_royalty:
      statute: "Northern Territory Mineral Royalty Act 1982 (MRA), as in force 21 May 2021"
      formula: "the GREATER OF (a) 20% of Net Value from the production unit in a royalty year, less AUD10,000; or (b) a percentage of gross production revenue that ESCALATES by royalty year: 1% in the payer's first royalty year beginning on/after 1 Jul 2019, 2% the following royalty year, 2.5% every royalty year after that. The royalty payable is NIL if gross production revenue in the royalty year is AUD500,000 or less."
      net_value_formula: "NV = GR - (OC + CRD + EEE + AD)"
      net_value_terms:
        GR: "gross realization from the production unit in the royalty year"
        OC: "operating costs of the production unit for the royalty year"
        CRD: "capital recognition deduction (schedule/rate not itemized in this report)"
        EEE: "eligible exploration expenditure, if any (amount not itemized in this report)"
        AD: "any additional deduction (amount not itemized in this report)"
      rate_profit_based: 0.20
      rate_gross_floor_by_royalty_year: {year_1: 0.01, year_2: 0.02, year_3_onward: 0.025}
      minimum_annual_deduction_aud: 10000
      nil_threshold_gross_revenue_aud: 500000
      deductible_against_commonwealth_income_tax: true   # "The NT Royalty is among deductions permitted in determining taxable income" (p.289/318)
      alternative_ad_valorem_scenarios_not_the_base_case:
        # The NT government's Minerals Development Taskforce (est. Nov 2021) has RECOMMENDED
        # replacing the current MRA formula with a flat ad valorem scheme; not yet legislated.
        # Table 22-29 (p.315) shows what the SAME production would pay under three illustrative
        # flat rates -- useful extra checkable numbers, NOT the base case.
        "2.5pct": 284107
        "4.5pct": 511393
        "6.5pct": 738679
      lom_total_usd_million: 765.0
      source: "Section 22.5.1.1, p.314-315; formula and rate schedule verbatim; alternative scenarios Table 22-29 p.315"

    income_tax:
      jurisdiction: "Australian Commonwealth (federal)"
      rate_flat: 0.30
      base: "taxable income = assessable income less allowable deductions. Assessable income generally includes gross income from the sale of goods, provision of services, capital deductions (i.e. depreciation), dividends, interest, royalties and rent; may also include capital gains net of capital losses. Normal business expenses are generally deductible."
      loss_carryforward: "indefinite (no time limit), usable to offset future assessable income, subject to a 'continuity of ownership' test (>50% of voting, dividend and capital rights) OR a 'same business' test"
      loss_carryforward_note: "no percentage cap on annual relief and no expiry are stated -- a materially simpler shape than a vintaged/expiring pool (contrast with spec/KERNEL.md's TAX ATTRIBUTE description); the continuity/same-business test is a qualitative legal condition with no numeric formula in the source"
      lom_total_usd_million: 927.0
      source: "Section 22.5.1.3, p.315"

  sale:
    quantity_koz: 6313          # PAYABLE gold, life of mine -- the quantity actually multiplied by price (see notes for the recovery chain's other two ounce figures: 6,979 contained, 6,891 post-recovery)
    unit: oz
    price_usd_per_oz: 1800      # Table 22-1, p.288 -- the study's flat, non-escalated base-case price assumption for every production year
    price_basis: "flat US$1,800/oz across the full LoM, no escalation applied to capital or operating costs either ('Costs and economic results are presented in Q4 2021 U.S. dollars... No escalation has been applied to capital or operating costs', p.288)"
    exchange_rate_aud_usd: 0.69   # 1 AUD = US$0.69, used to convert AUD-native cost inputs


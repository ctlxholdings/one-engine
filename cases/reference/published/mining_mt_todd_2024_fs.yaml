id: mining_mt_todd_2024_fs
title: "Mt Todd Gold Project — NI 43-101 Feasibility Study (50,000 tpd), Northern Territory, Australia"

meta:
  source:
    - >
      Tetra Tech (with RESPEC, Resource Development Inc., Pro Solv Consulting, Tetra Tech Proteus)
      for Vista Gold Corp., "NI 43-101 Technical Report, Mt Todd Gold Project, Northern Territory,
      Australia — 50,000 tpd Feasibility Study", April 16, 2024. 411 pages.
      https://www.vistagold.com/images/mttodd/Vista-Mt_Todd_NI_43-101_FS_Technical_Report_-_April_16_2024.pdf
      (hosted directly on the issuer's own investor-relations site; SEDAR+ filing by Vista Gold Corp.)
    - "Page references below are the report's OWN printed page numbers (footer), not PDF page indices."
  accessed: 2026-08-12
  licence: >
    Public NI 43-101 technical report, filed to satisfy Canadian securities disclosure rules
    (Vista Gold Corp. trades on NYSE American / TSX). No explicit reuse licence is stated in the
    document itself; downloaded from the issuer's own public investor-relations URL, not SEDAR+.
  kind: trade_case
  mechanism: extract
  # ── HAND-LABELLED 2026-08-12, same convention as bfap_maize/atlas_extract_freshfish ──────────
  # L4: the deepest resolution level in this corpus. The source does not print one number to
  # check — it prints a five-stage CHAIN (depleting reserve -> mined ore -> ore-sorted plant feed
  # -> metallurgical recovery -> payable metal), each stage with its own cited yield, and on TOP
  # of that a two-stage tax waterfall (private gross-revenue royalties netted against revenue,
  # THEN a profit-based government royalty, THEN a flat income tax with its own deduction rules)
  # applied to the OUTPUT of the physics chain. Every stage is independently verifiable against
  # Table 22-28's per-year figures (see `expected.annual_schedule`), which is what makes this L4
  # rather than L3: multiple compounding derivations, not one multiply.
  resolution: L4
  basis: "whole project, life of mine, 100% equity (unlevered, no debt financing modelled)"
  # Stated "Mine Life: 16 years" as the headline figure (Table 22-1, p.288; bullet list p.1/p.288)
  # but the annual schedule (Table 22-28, p.312) shows revenue-generating production in 17 years
  # (years 1-17) and the body text explicitly says "17-year LoM" (p.289) discussing strip ratio.
  # See notes for the full inconsistency; periods below follows the annual SCHEDULE (17 years of
  # activity) since that is what `expected.annual_schedule` transcribes and can be checked against.
  periods: 17
  jurisdiction: AU   # Commonwealth of Australia; the mine sits in the Northern Territory (NT), a
                     # territory not a state, which matters because it runs its OWN royalty statute
                     # (NT Mineral Royalty Act 1982) separate from the Commonwealth income tax
  currency: USD      # "Costs and economic results are presented in Q4 2021 U.S. dollars" (p.288).
                     # Labour, reagents and some consumables are costed natively in AUD (Tables
                     # 22-22 to 22-25) and converted at the report's own assumed rate, AUD:USD
                     # 0.69:1 (Table 22-1, p.288) — i.e. 1 AUD = US$0.69.

inputs:
  physics:
    # THE DEPLETING STOCK — the reserve, exactly as printed, Table 1-3 (p.8) = Table 22-3 (p.289),
    # cross-checked internally: 267,021 (open pit) + 13,354 (heap leach pad) = 280,375 Kt, and
    # 6,747 + 232 = 6,979 K oz — both totals match the printed combined row exactly.
    reserve_open_pit:
      tonnes_kt: 267021
      grade_g_au_t: 0.79
      contained_oz_koz: 6747
      category: "Proven 81,277 Kt @ 0.84 g/t (2,192 koz) + Probable 185,744 Kt @ 0.76 g/t (4,555 koz)"
      source: "Table 1-3, p.8 / Table 22-3, p.289"
    reserve_heap_leach_pad:
      tonnes_kt: 13354
      grade_g_au_t: 0.54
      contained_oz_koz: 232
      category: "Probable only (existing historical heap-leach pad, no cutoff grade applied — footnote, Table 1-3, p.8)"
      note: "Residual gold left on a pad from PRE-2000s historical mining at Mt Todd, not new open-pit ore. Reclaimed and fed through the new mill at the end of mine life (years 15-17, see notes)."
      source: "Table 1-3, p.8 / Table 22-3, p.289; description Section 1.6.1, p.8"
    reserve_total:
      tonnes_kt: 280375
      grade_g_au_t: 0.77
      contained_oz_koz: 6979
      source: "Table 1-3, p.8 / Table 22-3, p.289"
    cutoff_grade_g_au_t: 0.35
    breakeven_cutoff_grade_g_au_t: {at_1500_usd_oz: 0.31, at_1750_usd_oz: 0.27}
    dilution_basis: "12m x 12m x 6m block model used directly for reserve estimation; RESPEC states this block size is itself the dilution allowance — no separate numeric dilution % published (Section 15.4, p.184)"
    design_pit_shell: "Pit 49 of the WhittleTM optimization, built at a US$1,500/oz gold price: 267,434 Kt @ 0.79 g/t = 6,757 koz, waste 711,493 Kt, strip ratio 2.66 — confirmed twice in prose as the design basis (Table 1-5 footnote p.9; Section 15.1 text p.184: 'pit shell 49 ... was used as the basis for the ultimate pit design'). Close to but not identical to the final Batman P&P reserve (267,021 Kt / 6,747 koz) because further reserve-level modifying factors are applied on top of the raw pit-shell optimization."
    strip_ratio_lom: 2.51            # Table 22-28 Totals row, p.312 (W:O, life-of-mine average)
    strip_ratio_note: "Also stated as '2.5:1 strip ratio over the 17-year LoM' in prose (p.289); the design pit shell (Pit 49) alone shows 2.66 (Table 1-5, p.9); annual strip ratio in Table 22-28 ranges from 0.05 (year 17) to 7.07 (year 8) as pushbacks expose different waste:ore ratios by year."
    throughput_tpd: 50000
    annual_ore_feed_mt: 17.75
    operating_days_per_year: 355
    mine_life_years_headline: 16     # Table 22-1, p.288 — see meta.periods note on the 16-vs-17 inconsistency
    construction_years: 2
    commissioning_rampup_years: 0.5
    closure_years: 4
    flowsheet: "primary gyratory crusher -> 2 cone crushers -> 2 HPGR crushers -> XRT + laser ore sorting (rejects waste, upgrades grade) -> 2 primary ball mills + 10 FLS VXP secondary/regrind mills -> cyclone classification -> pre-leach thickening -> conventional carbon-in-pulp (CIP) cyanide leach and adsorption -> elution, electrowinning, smelting to dore -> carbon regeneration -> cyanide detoxification -> tailings storage facility (Section 1.8, p.10; Section 22.2, p.289; Figure 1-5, p.11)"
    # The chain the reserve is drawn down through, each stage with its own cited yield —
    # see expected.annual_schedule for the full year-by-year working of this chain.
    recovery_chain:
      stage_1_mined_ore: "fresh open-pit ore (+ stockpile/RoM blending) fed to plant, contained gold = 'Gold to Plant', LoM total 6,979 koz at LoM average grade 0.77 g/t"
      stage_2_ore_sorting: "XRT + laser sorters reject waste-grade material before milling, UPGRADING feed grade from 0.77 g/t (Plant Feed) to 0.84 g/t (CIP Plant Feed Post-Sorting, 253,673 Kt LoM) — contained gold after sorting = 'Gold to CIL Plant', LoM total 6,891 koz"
      stage_3_metallurgical_recovery_pct:
        sulfide: 0.9261
        mixed: 0.9274
        oxide: 0.9092
        heap_leach_pad: 0.9074
        net_solution_loss_applied_to_all: 0.01
        lom_blended_average: 0.916
        source: "Section 22.2, p.289"
      stage_3_note: "Table 1-6 (Headline Design Criteria, p.13) separately states Gold Recovery = 91.9% — a different figure from the 91.6% LoM-blended average in Section 22.2/Table 22-3 (p.289). Both are the source's own numbers; see notes."
      stage_4_payable_factor: "99.9% payable gold assumed (Table 1-4, p.9); LoM payable gold = 6,313 koz, i.e. payable/recovered = 6,313/6,891 = 91.6%, which already nets the refining 'Gold Retention' deduction (0.10% of gold sales, Table 22-2/22-21, p.289/299) on top of the 99.9% payable factor."

  costs:
    # Verbatim from Table 1-9 / Table 22-14, LoM average, US$ per tonne MILLED (p.17 / p.296)
    opex_per_tonne_milled_usd:
      open_pit_mine: 7.68
      open_pit_mine_detail: {mine_general_service: 0.10, mine_maintenance: 0.16, engineering: 0.06, geology: 0.04, drilling: 1.12, blasting: 1.20, loading: 0.81, hauling: 3.69, mine_support: 0.50, mine_dewatering: 0.01}
      cip_process_plant: 10.30
      cip_process_plant_detail: {labor: 0.90, crush_screen_stockpile: 0.48, reclaim_hpgr: 0.78, classification_grinding: 4.17, pre_leach_thick_aeration_cip: 0.21, desorption_gold_room: 0.03, detox_tailings_pumping: 0.09, reagents: 3.47, plant_services: 0.04, mining_infra_misc: 0.06, general_consumables: 0.01, plant_mobile_equipment: 0.02, plant_gas: 0.03}
      project_services: 0.30
      ga: 1.05
      total: 19.33

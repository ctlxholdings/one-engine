id: agro_poultry_astral_foods_za_2024
title: "Astral Foods Limited (South Africa) — FY2024 (year ended 30 September 2024): installed processing capacity vs birds slaughtered, feed-mill utilisation, and the full three statements with a two-segment gross-profit bridge"

meta:
  source:
    - "Astral Foods Limited, 'Integrated Report for the year ended 30 September 2024': p.4 'Astral at a glance' (feed tons, broilers under management, birds processed per week, poultry product tons, 8 feed mills, 178 agricultural sites, 4 processing plants, 12 293 employees); p.6 'What we do' (INSTALLED processing capacity 6 230 000 broilers/week, split by plant); p.54 Feed Division operational performance (1 321 964 tons, plant utilisation 65%); p.60-61 Poultry Division operational performance (birds slaughtered live weight, per annum, per week by plant); p.148 Consolidated Statement of Profit or Loss and Other Comprehensive Income; p.149 Consolidated Balance Sheet; p.150 Statement of Changes in Equity; p.151 Consolidated Statement of Cash Flows; p.152-153 note 1 Segment information. https://www.astralfoods.com/wp-content/uploads/2025/04/AstralIntReport24.pdf"
  accessed: "2026-08-12"
  licence: >
    Public regulatory disclosure by a JSE-listed company (JSE: ARL), published on the company's own
    investor-relations site for market dissemination. No explicit reuse licence stated. Figures
    transcribed for verification/testing only.
  kind: trade_case
  # ── HAND-HARVESTED 2026-08-12 FOR THE PHYSICS→STATEMENTS SHAPE ──────────
  # THE RARE THING HERE: the source prints an INSTALLED CAPACITY CEILING and
  # the ACTUAL THROUGHPUT against it, for BOTH divisions, in the same
  # document as the audited statements. Almost no annual report in this
  # corpus publishes the ceiling; Astral publishes it plant by plant.
  resolution: L2
  basis: "Astral Foods Limited GROUP consolidated, one financial year (FY ended 30 September 2024); the FY2023 comparative column is on the same pages and is RESTATED (note 37) for cost of sales and distribution costs"
  periods: 1
  mechanism: grow_then_sell   # create x physical, transformation "grow"
  # THREE LEGS IN ONE COMPANY, DECLARED: Astral is vertically integrated —
  # it ASSEMBLES feed (create x physical, transformation "assemble", the
  # Feed Division), GROWS broilers (grow_then_sell, the Poultry Agriculture
  # leg) and PROCESSES them into meat (create x physical, "assemble" again,
  # the four abattoirs). engine/ledger/mechanisms.py has one tag per case;
  # `grow_then_sell` is chosen because the bird is the value driver and the
  # biological asset sits on the balance sheet (R1 331 399 thousand), but a
  # model that ignores the feed leg will miss 17.4% of external revenue and
  # 48% of PBIT.
  jurisdiction: ZA
  currency: ZAR
  trade: "vertically integrated broiler producer: 8 feed mills, 178 agricultural sites, 4 abattoirs, South Africa (98% of revenue) plus Zambia and Mozambique"


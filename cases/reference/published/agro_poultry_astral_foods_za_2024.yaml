tolerance:
  abs: 1
  why: >
    every money figure is printed to the nearest ZAR thousand and every subtotal in all three
    statements AND the two-segment bridge re-adds EXACTLY to the thousand by hand (see
    arithmetic_check), so a gap beyond R1 thousand is a real divergence, not display rounding. The
    physical figures are printed as whole units (tons, birds, '000 birds) except the printed
    percentage changes, which are one decimal place; the two capacity identities that DO close —
    the 4-plant capacity split and the 4-plant weekly slaughter split — close exactly, so 1 unit is
    the right ruler for those too. The physical identities that DO NOT close (weeks-per-year, live
    weight vs product tonnage) are recorded as gaps in arithmetic_check, not absorbed by loosening
    this threshold.

arithmetic_check:
  every_subtotal_re_added_by_hand: true
  income_statement: "20 479 785 - 16 988 972 = 3 490 813 ✓ | 3 490 813 - 971 158 - 1 326 879 - 342 692 + 272 016 + 2 809 = 1 124 909 ✓ | 1 124 909 + 39 229 - 140 305 = 1 023 833 ✓ | 1 023 833 - 270 929 = 752 904 ✓ | -975 - 54 937 = -55 912 ✓ | -4 073 + 1 100 + 43 820 = 40 847 ✓ | -55 912 + 40 847 = -15 065 ✓ | 752 904 - 15 065 = 737 839 ✓"
  segment_note: "16 908 290 + 3 571 495 = 20 479 785 = group revenue ✓ | 15 755 403 + 1 152 887 = 16 908 290 ✓ | 147 555 + 6 293 163 = 6 440 718 inter-segment ✓ | 17 055 845 + 9 864 658 = 26 920 503 total segment revenue ✓ | 14 404 810 + 2 584 162 = 16 988 972 = group cost of sales ✓ | 2 503 480 + 987 333 = 3 490 813 = group gross profit ✓ | 580 445 + 544 464 = 1 124 909 = group PBIT ✓ | 20 010 971 ZAR-denominated + 468 814 foreign = 20 479 785 ✓"
  balance_sheet: "NCA 3 125 437 + 37 335 + 178 114 + 120 536 = 3 461 422 ✓ | CA 1 331 399 + 1 553 365 + 1 987 404 + 739 188 = 5 611 356; + 25 008 held for sale = 5 636 364 ✓ | total 3 461 422 + 5 636 364 = 9 097 786 ✓ | equity 429 + 89 971 - 87 964 - 269 543 + 5 019 468 = 4 752 361 ✓ | NCL 708 045 + 115 994 + 126 126 = 950 165 ✓ | CL 2 177 932 + 375 071 + 29 940 + 57 378 + 751 589 + 3 350 = 3 395 260 ✓ | liabilities 950 165 + 3 395 260 = 4 345 425 ✓ | 4 752 361 + 4 345 425 = 9 097 786 = total assets ✓"
  cash_flow: "1 124 909 + 321 370 + 6 034 + 1 066 - 4 152 + 805 + 4 399 + 199 676 - 8 040 - 64 963 + 96 500 = 1 677 604 ✓ | 1 677 604 - 221 475 = 1 456 129 ✓ | 1 456 129 - 61 580 = 1 394 549 ✓ | investing -265 560 - 2 643 + 9 992 + 141 575 + 39 229 = -77 407 ✓ | financing 0 - 100 607 - 21 326 - 28 390 - 112 762 - 574 690 + 15 966 = -821 809 ✓ | 1 394 549 - 77 407 - 821 809 = 495 333 ✓ | -430 653 + 495 333 - 51 754 = 12 926 ✓"
  physics_that_closes:
    capacity_split: "1 670 000 + 2 340 000 + 2 000 000 + 220 000 = 6 230 000 broilers/week ✓"
    weekly_slaughter_split: "2 062 + 1 638 + 1 567 + 196 = 5 463 thousand birds/week ✓ (prior year 1 744 + 1 293 + 1 689 + 217 = 4 943 ✓)"
    capacity_utilisation: "5 463 000 birds slaughtered per week / 6 230 000 installed capacity per week = 87.7%. The source does NOT print this percentage for the poultry plants — it is DERIVED here from two figures the source prints separately, and is kept OUT of `expected` for that reason. Contrast the FEED division, where the source DOES print its own utilisation (65%)."
  physics_that_does_not_close:
    weeks_per_year: "5 463 thousand birds/week x 52 weeks = 284 076 thousand, against the printed annual figure of 284 073 thousand — a 3 thousand (0.001%) gap. The weekly figure is explicitly labelled an AVERAGE and is printed to the nearest thousand per plant, so this is rounding, not a defect. Recorded, not repaired."
    live_weight_to_product: "490 757 tons of poultry product against 522 999 tons of birds slaughtered live weight = 93.8%. That is FAR above any plausible dressing yield for a broiler (roughly 70-75% of live weight), so the two tonnages are NOT two ends of one conversion. The source gives no reconciliation and no definition of 'poultry product processed'; the most likely reading is that it includes bought-in and further-processed volumes, but the document does not say so. DO NOT use these two figures as a yield pair. Left as printed, flagged."
    live_weight_per_bird: "522 999 tons / 284 073 thousand birds = 1.841 kg live weight per bird, which is light for a broiler but consistent with an IQF-weighted South African kill. Derived, not printed; recorded for context only."
    feed_conversion: "1 321 964 tons of feed / 522 999 tons live weight = 2.53. This is NOT a feed conversion ratio and must not be used as one: only 58% of Meadow Feeds' volume went to the Group's own birds, and that 58% includes breeder and rearing feed. The source prints the two tonnages but never the pairing."

notes: |
  WHY THIS GOLD IS DISPROPORTIONATELY VALUABLE: it publishes a CAPACITY CEILING. Most annual
  reports publish what was produced; Astral publishes what COULD have been produced — 6 230 000
  broilers per week of installed processing capacity, broken out by all four abattoirs — alongside
  what actually was (5 463 000 per week, also by plant). That makes a genuine utilisation test
  possible from printed figures alone: 87.7% for poultry. And the Feed Division goes one better by
  printing its own utilisation figure (65%) directly, which means this one document contains BOTH
  a utilisation the reader must derive AND a utilisation the source itself computed — a rare chance
  to test whether an engine's derived utilisation agrees with a publisher's own.

  THE INCOME STATEMENT IS THE MANUFACTURER'S SHAPE the comparison layer assumes, and it genuinely
  fits: revenue -> cost of sales -> gross profit, with distribution, administration and marketing
  below the line. No adaptation is needed here. The one trap is in the SEGMENT note: gross profit
  per segment is struck on EXTERNAL customer revenue less EXTERNAL customer cost of sales, NOT on
  total segment revenue. Feed sold R6.29 billion of feed INTERNALLY to Poultry (more than it sold
  externally, R3.57 billion), and that inter-segment revenue is excluded from both sides of the
  segment gross profit. An engine that adds inter-segment revenue into the segment margin will
  produce R2 651 035 thousand for Poultry against the printed R2 503 480 thousand — a R147.6
  million error that is exactly the inter-segment line. This is written into `expected` explicitly
  because it is the sort of thing that looks right and is wrong.

  THE PRIOR YEAR IS RESTATED AND IS A LOSS. FY2023 cost of sales and distribution costs were
  restated under note 37, and the segment note was RE-PRESENTED following an IFRIC agenda decision
  on IFRS 8. FY2023 was a loss year (-R512 200 thousand) driven by load-shedding and the 2023 HPAI
  (avian influenza) outbreak; FY2024 is the recovery. The swing is therefore not a clean
  like-for-like and this gold runs on the FY2024 column only. The HPAI shock is still visible in
  FY2024's cash flow as a -R64 963 thousand reversal of the prior year's biological-asset
  write-down and a +R96 500 thousand insurance receivable movement — two lines that exist only
  because of a disease event, and which any physics model of a flock should be able to name.

  THE CLOSING CASH BALANCE IS NET OF OVERDRAFT. The balance sheet shows R739 188 thousand of cash
  and R751 589 thousand of bank overdraft and borrowings in current liabilities; the cash flow
  statement closes at R12 926 thousand, a net figure. An engine reconciling cash flow to the
  balance sheet's cash line will diverge by the overdraft unless it knows to net. Prior year the
  net figure was NEGATIVE (-R430 653 thousand), which is a closing "cash" balance below zero — a
  legitimate presentation that a naive stock model will refuse.

  WHAT THE SOURCE DOES NOT PUBLISH, recorded as gaps: no cost per bird, per ton of feed, or per
  ton of product; cost of sales arrives as one line per segment with no input breakdown, so unit
  economics cannot be built from this document without inventing a split (the maize and soya meal
  prices printed on p.54 are MARKET prices, not Astral's own cost per ton). No mortality rate, no
  feed conversion ratio, no average grow-out days, no stocking density — none of the flock physics
  an agricultural model would want, despite 34 million birds under management across 178 sites.
  No tonnage ceiling for the feed mills (only the 65% utilisation itself). No headcount split
  between divisions.

mapping:
  turnover: revenue
  gross_profit: gross_margin
  total_assets: total_assets
  total_equity: total_equity
  cash_and_cash_equivalents_at_end_of_year: cash_closing

tolerance:
  abs: 1
  why: >
    every money figure is printed to the nearest ZWL thousand and every subtotal in all three
    statements re-adds EXACTLY to the thousand by hand (see arithmetic_check below), so a gap beyond
    ZWL1 thousand is a real divergence, not display rounding. The physical figures are printed to
    2 decimal places (yields, recoveries, throughput) or whole tons; the physics identities that DO
    close — cane-to-sugar 1 696 342 / 212 004 = 8.00, estate yield 1 008 870 / 9 440 = 106.87,
    overall recovery 96.84% x 90.40% = 87.54% — close to the last printed digit, so 1 unit is the
    right ruler for those too. The ONE physical identity that does NOT close (private-farmer yield)
    is recorded as a gap, not absorbed by a loosened tolerance.

arithmetic_check:
  every_subtotal_re_added_by_hand: true
  income_statement_inflation_adjusted: "3 672 042 + 485 395 = 4 157 437 ✓ | 4 157 437 - 1 230 978 = 2 926 459 ✓ | 2 926 459 - 597 230 - 483 064 - 283 946 = 1 562 219 ✓ | 1 204 - 31 574 = -30 370 ✓ | 1 562 219 - 434 400 - 30 370 = 1 097 449 ✓ | 1 097 449 + 54 543 = 1 151 992 ✓ | 1 151 992 - 393 587 = 758 405 ✓ | -31 405 - 149 434 = -180 839 ✓ | 758 405 - 180 839 = 577 566 ✓"
  balance_sheet_inflation_adjusted: "NCA 1 423 612 + 33 130 + 66 757 + 1 377 + 22 549 = 1 547 425 ✓ | CA 1 204 901 + 160 380 + 277 534 + 140 165 + 163 058 + 119 223 = 2 065 261 ✓ | total 3 612 686 ✓ | equity 195 350 - 39 207 + 2 300 844 = 2 456 987 ✓ | NCL 652 006 + 72 495 + 863 = 725 364 ✓ | CL 346 079 + 3 641 + 531 + 20 000 + 60 084 = 430 335 ✓ | 2 456 987 + 725 364 + 430 335 = 3 612 686 = total assets ✓"
  cash_flow_inflation_adjusted: "594 037 + 28 175 = 622 212 ✓ | -29 992 + 1 181 = -28 811 ✓ | 622 212 - 28 811 - 215 011 = 378 390 ✓ | -5 502 - 39 560 - 1 586 = -46 648 ✓ | -46 648 + 21 625 + 32 496 = 7 473 ✓ | 378 390 + 7 473 = 385 863 ✓ | 141 269 - 560 470 + 1 394 = -417 807 ✓ | 19 470 + 378 390 + 7 473 - 417 807 + 131 697 = 119 223 ✓ | 119 156 + 67 = 119 223 ✓"
  historical_cost_column: "1 682 340 + 1 112 228 = 2 794 568 ✓ | 2 794 568 - 661 744 = 2 132 824 ✓ | 2 132 824 - 270 209 - 252 442 - 36 652 = 1 573 521 ✓ | 1 573 521 - 10 161 + 20 081 = 1 583 441 ✓ | 1 583 441 - 405 154 = 1 178 287 ✓ | NCA 139 490 + 2 704 + 48 741 + 1 377 + 22 549 = 214 861 ✓ | CA 1 204 901 + 134 714 + 250 159 + 140 165 + 111 527 + 119 223 = 1 960 689 ✓ | total 2 175 550 ✓ | equity 15 442 + 78 748 + 1 246 350 = 1 340 540 ✓ | 1 340 540 + 415 532 + 419 478 = 2 175 550 ✓ | 468 394 - 232 475 = 235 919 ✓ | 235 919 - 9 752 - 49 492 = 176 675 ✓ | 19 470 + 176 675 - 33 523 - 43 399 = 119 223 ✓"
  physics_that_closes:
    cane_to_sugar_ratio: "1 696 342 tons cane / 212 004 tons sugar = 8.001 — the CEO's review prints 8.0 (2019: 7.8). Re-derived by hand and matches to the printed precision."
    estate_yield: "1 008 870 tons / 9 440 hectares harvested = 106.87 tons/hectare — EXACTLY the printed figure."
    overall_recovery: "extraction 96.84% x boiling house recovery 90.40% = 87.5434% — the printed overall recovery is 87.54%. The two-stage recovery chain multiplies out exactly. Prior year: 96.49% x 90.48% = 87.30% — also exact."
    industry_sales_split: "324 000 local + 89 000 export = 413 000 total ✓"
    prior_year_cane_to_sugar: "1 862 032 / 238 965 = 7.792 — the review prints 7.8 ✓"
  physics_that_does_not_close:
    private_farmer_yield: "687 472 tons / 10 581 hectares harvested = 64.97 tons/hectare, but the table prints 69.00 for private farmers. A 4.03 t/ha (5.8%) gap. Kept as printed — the figures are NOT reconciled by me and the source gives no note explaining the basis difference. NOTE the source's own typography: this is the ONE cell in the whole five-year table printed with a COMMA thousands separator (`10,581`) where every other cell uses a space (`10 581`) — the anomaly sits precisely on the number that will not reconcile."
    mill_time_utilisation: "1 696 342 tons / 335.76 tons per hour = 5 052.3 crushing HOURS; 225 crushing days x 24 h = 5 400 available hours, so effective mill time utilisation = 93.6%. The source does NOT print this utilisation percentage — it is DERIVED here for the notes only and is deliberately NOT in `expected`."

notes: |
  WHY THIS GOLD EXISTS: it is one document that carries the whole chain — hectares planted, hectares
  harvested, tons of cane cut, tons of cane crushed, the recovery percentages at each mill stage,
  tons of sugar out, and then three audited statements underneath. That is the shape the corpus is
  short of: a physics check and a money check that must agree inside ONE source. The strongest
  single test in it is the recovery chain, because it is a genuine multiplicative physics identity
  the source itself prints all three legs of: 96.84% extraction x 90.40% boiling house recovery =
  87.54% overall recovery, exact to the printed digit, in both years.

  THE AUDIT OPINION IS QUALIFIED, and the reason matters for anyone using this as an oracle. The
  auditors (p.13-17) qualified their opinion on the inflation-adjusted statements because the prior
  year's figures were not IAS 21-compliant, so the FY2019 comparative column is not on the same
  footing as the FY2020 column. This gold therefore runs on the FY2020 column and carries FY2019
  only as descriptive comparatives; do not build a two-period scenario off this file without
  reading the qualification. The HISTORICAL COST column is not audited at all — the report states
  plainly that IAS 29 discourages publishing it and that "the auditors have not expressed an
  opinion on this historical information". It is included in `expected.historical_cost_column`
  because it re-adds exactly and because it is the more useful column for anyone who wants the
  nominal cash arithmetic without the IAS 29 restatement — but its evidential standing is weaker
  and it is boxed off, not mixed into the main `expected`.

  HYPERINFLATION IS THE POINT, NOT A DEFECT. Zimbabwe was declared hyperinflationary effective for
  periods ending on or after 1 July 2019, so IAS 29 restatement runs through every money line. The
  visible consequence: a `monetary_loss` of ZWL434 million sits BELOW operating profit and above
  profit before tax — a line item with no counterpart in any non-hyperinflationary case in this
  corpus, and one that is treated as a permanent difference for tax (the review states the
  effective tax rate on the inflation-adjusted accounts was 34.17%, against 393 587 / 1 151 992 =
  34.17% re-derived by hand — exact). Two further quirks worth knowing before this file is used to
  test a cash-flow engine: (1) the inflation-adjusted cash flow statement OPENS with the historical
  opening cash balance (19 470) and reconciles to closing cash with a separate "inflation effects
  on cash and cash equivalents" line of 131 697 — it does not restate the opening balance; (2)
  closing cash is identical (119 223) in both columns, because it is a monetary balance at the
  measuring-unit date.

  WHAT THE SOURCE DOES NOT PUBLISH, recorded as gaps rather than filled: no installed mill capacity
  (tons cane per season or per hour rated) is printed anywhere, so the throughput figure of 335.76
  t/h cannot be read as a utilisation against a ceiling — the derived 93.6% mill TIME utilisation
  in `arithmetic_check` uses crushing days, which is a different and weaker statement. No cost per
  ton of cane, per hectare, or per ton of sugar is printed; cost of sales arrives as a single
  ZWL1.23 billion line with no breakdown, so no unit economics can be built from this document
  without inventing a split. No headcount. No split of revenue between local and export for the
  COMPANY (only for the industry).

  THE 41% THAT IS NOT ITS OWN CANE: 687 472 of the 1 696 342 tons milled came from private farmers,
  not the estate. The mill is therefore simultaneously a grower and a processor of third-party
  crop, and the sugar produced is shared with the growers under an industry sharing ratio (Hippo
  Valley's share: 48.03%, printed on p.3). Any model that treats total cane milled as "the
  company's production" and total sugar as "the company's sugar" will overstate both. This is
  precisely the case a single-mechanism tag cannot express, which is why the second leg is
  spelled out in `meta.mechanism`'s comment rather than left implied.

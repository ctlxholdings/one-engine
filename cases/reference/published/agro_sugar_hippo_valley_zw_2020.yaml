id: agro_sugar_hippo_valley_zw_2020
title: "Hippo Valley Estates Limited (Zimbabwe) — FY2020 (year ended 31 March 2020): cane milled, cane-to-sugar ratio, mill recovery chain, and the full inflation-adjusted AND historical-cost three statements"

meta:
  source:
    - "Hippo Valley Estates Limited, 'Annual Report 2020' (year ended 31 March 2020), published on the Tongaat Hulett investor site: p.3 'Statistical Summary' (five-year operational table); p.4-5 Chairman's Statement and Chief Executive's Review ('Operations', 'Financial Results'); p.22 Consolidated Statement of Financial Position; p.23 Consolidated Statement of Profit or Loss and Other Comprehensive Income; p.24-25 Consolidated Statement of Changes in Equity; p.26 Consolidated Statement of Cash Flows; p.13-17 Independent Auditor's Report (QUALIFIED opinion — see notes); note 6 / p.63 biological asset assumptions (area under cane, yield). https://www.tongaat.com/wp-content/uploads/2021/02/3.-Hippo-Valley-Annual-Report-31-March-2020.pdf"
  accessed: "2026-08-12"
  licence: >
    Public regulatory disclosure by a Zimbabwe Stock Exchange-listed company (ZSE: HIPO), published
    on the majority shareholder's own investor-relations site for market dissemination. No explicit
    reuse licence is stated in the document. Figures transcribed for verification/testing only.
  kind: trade_case
  # ── HAND-HARVESTED 2026-08-12 FOR THE PHYSICS→STATEMENTS SHAPE ──────────
  # This is the rare shape: ONE document that prints the PHYSICAL FACTORS
  # SEPARATELY (hectares, tons cane, tons sugar, recovery percentages,
  # crushing days, tons cane per hour) AND all three audited statements.
  # It is NOT a revenue-only money check: every operating driver below is
  # printed as its own number on p.3, five years deep.
  resolution: L2
  basis: "Hippo Valley Estates Limited consolidated group, one financial year (FY ended 31 March 2020), with the FY2019 comparative column from the same statements"
  periods: 1
  mechanism: grow_then_sell   # create x physical, transformation "grow" — the ESTATE leg
  # SECOND LEG, DECLARED NOT HIDDEN: this business is vertically integrated —
  # it GROWS cane (grow_then_sell) and MILLS it into sugar, which is
  # create x physical with transformation "assemble". engine/ledger/
  # mechanisms.py has no tag for "grows its own input then processes it",
  # so one tag is chosen for the dominant leg and the other is named here.
  # The mill also crushes THIRD-PARTY cane (687,472 t of 1,696,342 t, 41%),
  # which is a toll/processing relationship the single tag does not carry.
  jurisdiction: ZW
  currency: ZWL
  trade: "integrated sugar estate and mill, Chiredzi, Lowveld, Zimbabwe"

inputs:
  # ══ PHYSICS ══ every figure below is printed as its OWN column entry in
  # the p.3 five-year "Statistical Summary" table (FY2019/20 column), or in
  # the Chief Executive's Review on p.4-5. None is derived by me.
  physical:
    area_under_cane_at_year_end_ha:
      # the FY2019/20 column, which is what this gold runs on. The p.3 table
      # is five years wide; the earliest column (2015/16) is 12 272 / 9 800 /
      # 22 072 ha and is available in the same table if a trend is wanted.
      value_fy2020: {hippo_valley_estates: 10590, private_farmers: 11747, total: 22337,
        unit: hectares, label_as_printed: "Area under cane at year end (hectares)",
        prior_year: {hippo_valley_estates: 10941, private_farmers: 10907, total: 21848},
        check: "10 590 + 11 747 = 22 337 — re-added by hand, exact"}
    area_harvested_for_milling_ha:
      value_fy2020: {hippo_valley_estates: 9440, private_farmers: 10581, total: 20021,
        unit: hectares, label_as_printed: "Area harvested for milling during the year (hectares)",
        check: "9 440 + 10 581 = 20 021 — re-added by hand, exact"}
    cane_harvested_for_milling_tons:
      value_fy2020: {hippo_valley_estates: 1008870, private_farmers: 687472,
        diversions_from_triangle_and_green_fuel: 0, total_cane_milled: 1696342,
        unit: tons, label_as_printed: "Total cane milled at Hippo Valley Estates",
        prior_year_total: 1862032,
        check: "1 008 870 + 687 472 + 0 = 1 696 342 — re-added by hand, exact"}
    sugar_cane_yield_tons_per_ha:
      hippo_valley_estates: {value: 106.87, unit: "tons cane/hectare",
        label_as_printed: "Sugar cane yield per hectare (tons)", prior_year: 108.93}
      private_farmers: {value: 69.00, unit: "tons cane/hectare", prior_year: 67.80,
        note: "DOES NOT RE-DERIVE from the two printed private-farmer figures — see arithmetic_check.yields_that_do_not_reconcile"}
    total_sugar_production_for_the_season_tons:
      value: 212004
      unit: tons
      label_as_printed: "Total sugar production for the season (tons)"
      prior_year: 238965
    molasses_production_tons: {value: 60873, unit: tons, prior_year: 64390,
      label_as_printed: "Molasses production (tons)"}
    mill_performance:
      season_started: "07-May-19"
      season_completed: "18-Dec-19"
      number_of_crushing_days: {value: 225, unit: days, prior_year: 235}
      throughput_tons_cane_per_hour: {value: 335.76, unit: "tons cane/hour", prior_year: 419.22,
        label_as_printed: "Throughput –tons cane per hour"}
      extraction_pct: {value: 96.84, unit: "%", prior_year: 96.49}
      boiling_house_recovery_pct: {value: 90.40, unit: "%", prior_year: 90.48}
      overall_recovery_pct: {value: 87.54, unit: "%", prior_year: 87.30}
    industry_context:
      total_industry_sugar_sales_tons: {value: 413000, local_market: 324000, export_market: 89000,
        unit: tons, check: "324 000 + 89 000 = 413 000 — re-added by hand, exact"}
      hippo_valley_sharing_ratio_pct: {value: 48.03, unit: "%", prior_year: 52.67,
        note: "the Company's share of the Zimbabwe industry's sugar; the CEO's review states the Company contributed 48% (2019: 53%) of total industry sugar production"}
    replanting_ha: {value: 690, unit: hectares, prior_year: 1670,
      label_as_printed: "some 690 hectares (2019: 1 670 hectares) having been replanted"}
    hectares_under_fruit_orchards: {value: 14, unit: hectares, prior_year: 14, note: "note on biological assets"}

  # ══ MONEY ══ the INFLATION-ADJUSTED column (the audited primary record
  # under IAS 29). ZWL'000 throughout. Cost lines, as printed on p.23.
  costs:
    cost_of_sales: 1230978
    marketing_and_selling_expenses: 597230
    administrative_and_other_expenses: 483064
    other_operating_loss: 283946
    monetary_loss: 434400          # the IAS 29 net monetary position loss
    finance_costs: 31574
    income_tax_expense: 393587
  revenue_lines:
    revenue: {value: 3672042, unit: "ZWL'000", label_as_printed: "Revenue", prior_year: 2522540}
    fair_value_gain_on_biological_assets: {value: 485395, unit: "ZWL'000", prior_year: 253622}
    finance_income: {value: 1204, unit: "ZWL'000", prior_year: 10205}
    share_of_associate_companies_profit_after_tax: {value: 54543, unit: "ZWL'000", prior_year: 16189}
    net_impairment_reversal: {value: 0, unit: "ZWL'000", prior_year: 347252}


id: ext_catfish_srac1800
title: "Southern Regional Aquaculture Center (SRAC) Publication 1800 — Costs of Small-Scale Catfish Production for Direct Sales, base scenario: six 2-acre levee ponds"

meta:
  source:
    - "Carole R. Engle and Nathan Stone (University of Arkansas at Pine Bluff), 'Costs of Small-Scale Catfish Production for Direct Sales', Southern Regional Aquaculture Center (SRAC) Publication No. 1800, April 2014 Revision, Table 3 'Annual costs and returns for six 2-acre catfish ponds' (base scenario, levee ponds, full-time permanent aeration): https://srac.msstate.edu/pdfs/Fact%20Sheets/1800%20Costs%20of%20Small-Scale%20Catfish%20Production%20for%20Direct%20Sales.pdf"
  accessed: 2026-08-11
  licence: public/extension
  kind: trade_case
  unit_of_analysis: "per farm per year (six 2-acre levee ponds = 12 water acres, base scenario)"
  mechanism: grow_then_sell
  # ── HAND-LABELLED 2026-08-12 ─────────────────────────────────────────
  resolution: L2          # no farm-gate sale is published (the per-lb prices
  #                          given are market context, explicitly "not part
  #                          of answer key") — this is a cost roll-up only
  basis: "per farm per year, six 2-acre levee ponds (12 water acres)"
  periods: 1
  jurisdiction: US
  currency: USD

inputs:
  farm_scale:
    pond_count: 6
    acres_per_pond: 2
    total_water_acres: 12
  stocking_and_yield:
    stocking_rate_fingerlings_per_acre: 3750
    fingerling_size_inches: 5
    survival_rate_pct: 70
    feed_conversion_ratio: "2.2:1"
    expected_marketable_yield_lbs_per_acre: 4500
    market_fish_size_lbs: 1.75
  operating_costs:
    fingerlings: {unit: fish, quantity: 45000, unit_price_usd: 0.075, cost_usd: 3375}
    feed: {unit: ton, quantity: 59.4, unit_price_usd: 460, cost_usd: 27324}
    labor: {unit: hour, quantity: 1035, unit_price_usd: 7.25, cost_usd: 7504}
    gas_and_diesel: {unit: acre, quantity: 12, unit_price_usd: 91, cost_usd: 1092}
    electricity: {unit: acre, quantity: 12, unit_price_usd: 222, cost_usd: 2664}
    repairs_and_maintenance: {unit: acre, quantity: 12, unit_price_usd: 97, cost_usd: 1164}
    plankton_control: {unit: acre, quantity: 12, unit_price_usd: 14.4, cost_usd: 173}
    depredation: {unit: acre, quantity: 12, unit_price_usd: 6.25, cost_usd: 75}
    telephone: {unit: acre, quantity: 12, unit_price_usd: 10.5, cost_usd: 126}
    office_supplies: {unit: acre, quantity: 12, unit_price_usd: 11, cost_usd: 132}
    insurance: {unit: acre, quantity: 12, unit_price_usd: 25.3, cost_usd: 304}
    interest_9_months: {base_usd: 43933, rate_pct: 7.5, cost_usd: 3295}
  ownership_costs:
    interest_on_investment_land_ponds_well: {base_usd: 75250, rate_pct_apr: 10, cost_usd: 7525}
    interest_on_investment_equipment: {base_usd: 45453, rate_pct_apr: 10, cost_usd: 4545}
    annual_depreciation_ponds_water_supply_usd: 4150
    annual_depreciation_equipment_usd: 7606
    taxes: {unit: acres, quantity: 12, unit_price_usd: 11, cost_usd: 132}
  long_term_investment_table1:
    land: {unit: acres, unit_cost_usd: 2250, quantity: 15, cost_usd: 33750, useful_life_yr: null}
    pond_construction: {unit: acres, unit_cost_usd: 2000, quantity: 12, cost_usd: 24000, useful_life_yr: 10, annual_depreciation_usd: 2400}
    water_supply_250gpm: {unit_cost_usd: 17500, quantity: 1, cost_usd: 17500, useful_life_yr: 10, annual_depreciation_usd: 1750}
  equipment_investment_table2_total_usd: 45453
  equipment_investment_table2_annual_depreciation_usd: 7606
  # ── HAND-LABELLED 2026-08-12 ─────────────────────────────────────────
  # The 17 genuine cost lines (12 operating + 5 ownership), read verbatim
  # from their `cost_usd` cells above. EXCLUDED: `long_term_investment_table1`
  # and `equipment_investment_table2_total_usd` (capex/stock, not a period
  # cost — their depreciation is already the two `annual_depreciation_*`
  # lines below, and their financing cost is already the two
  # `interest_on_investment_*` lines below).
  costs:
    fingerlings: 3375
    feed: 27324
    labor: 7504
    gas_and_diesel: 1092
    electricity: 2664
    repairs_and_maintenance: 1164
    plankton_control: 173
    depredation: 75
    telephone: 126
    office_supplies: 132
    insurance: 304
    interest_9_months: 3295
    interest_on_investment_land_ponds_well: 7525
    interest_on_investment_equipment: 4545
    annual_depreciation_ponds_water_supply: 4150
    annual_depreciation_equipment: 7606
    taxes: 132

expected:
  total_operating_costs_usd:
    value: 47228
    label_as_printed: "Total operating costs"
    composition_as_printed: "3375+27324+7504+1092+2664+1164+173+75+126+132+304+3295 = 47228 exact"
  total_ownership_costs_usd:
    value: 23958
    label_as_printed: "Total ownership costs"
    composition_as_printed: "7525+4545+4150+7606+132 = 23958 exact"
  total_costs_usd:
    value: 71186
    label_as_printed: "Total costs"
    composition_as_printed: "47228 + 23958 = 71186 exact"
  breakeven_price_above_operating_cost_usd_per_lb:
    value: 0.87
    label_as_printed: "Break-even price — Above operating cost"
    composition_as_printed: "47228 / (4500 lb/acre x 12 acres = 54000 lb) = 0.8746 -> 0.87"
  breakeven_price_above_total_cost_usd_per_lb:
    value: 1.32
    label_as_printed: "Break-even price — Above total cost"
    composition_as_printed: "71186 / 54000 lb = 1.3183 -> 1.32"
  long_term_investment_total_usd: {value: 75250, per_water_acre_usd: 6271}
  equipment_total_usd: {value: 45453, per_acre_usd: 3788}
  market_context_not_part_of_answer_key:
    processor_price_5yr_avg_usd_per_lb: 0.90
    live_sale_price_range_usd_per_lb: "1.00-1.50"

expected_alternate_scenarios_table4_not_transcribed_in_detail:
  note: "Table 4 gives 3 more scenarios (extensive/low-density with permanent vs emergency-only aeration, and the same 3 scenarios for watershed ponds instead of levee ponds) with total costs and both break-even prices for each; not transcribed line-by-line here to keep this gold to one scenario, listed for completeness: levee+extensive+permanent-aeration breakeven-above-total-cost=$2.73/lb; levee+extensive+emergency-aeration-only=$2.21/lb; watershed+base=$1.20/lb; watershed+extensive+permanent=$2.37/lb; watershed+extensive+emergency-only=$2.06/lb."

# no farm-gate revenue is published in this source, so only the cost side
# is checked (see meta.resolution note)
mapping:
  total_costs_usd: cost_of_sales

# HALF A DOLLAR, deliberately tight (every cost figure here prints as a
# whole dollar and this source's own arithmetic reconciles EXACTLY end to
# end per the notes below — there is no known gap to absorb).
tolerance:
  abs: 0.5
  why: >
    every cost figure is printed with zero decimal places, so 0.5 is
    exactly the display rounding; this is the cleanest source in the
    harvest (every cross-table check ties to the dollar), so any gap at
    all would be a real divergence worth seeing

notes: |
  Fully re-derived by hand and EVERY figure reconciles exactly, including the least-obvious one:
    - Interest (9 months): the $43,933 base is EXACTLY the sum of the eleven operating-cost lines
      printed above it (3375+27324+7504+1092+2664+1164+173+75+126+132+304 = 43,933), confirming the
      base; 43,933 x 7.5% = $3,294.975 -> $3,295, matches. (The table prints unit price "0.075" for
      this line, i.e. a 7.5% rate applied for the 9-month financing window, not a 9-month-prorated
      annual rate — the source states the rate directly as the already-prorated figure.)
    - Total operating costs: hand-sum of all twelve lines (including interest) = $47,228 EXACT
      match, zero rounding gap — unusually clean for a document this size.
    - Total ownership costs: 7525+4545+4150+7606+132 = 23,958 EXACT.
    - Total costs: 47,228+23,958 = 71,186 EXACT.
    - Both break-even prices: 47228/54000=0.8746->$0.87 and 71186/54000=1.3183->$1.32, both exact.
    - Cross-check against Table 1 (long-term investment): land 33,750 + pond construction 24,000 +
      water supply 17,500 = 75,250 exact, matching the "interest on investment" base used in Table
      3's ownership-cost section. Annual depreciation 2,400+1,750=4,150 exact, matching Table 3's
      "Annual depreciation — Ponds, water supply" line.
    - Cross-check against Table 2 (equipment): the 13 equipment line items sum to $45,453 total
      cost and $7,606 annual depreciation, both matching Table 3's equipment lines exactly.

  This is the single cleanest source found in the entire harvest: a USDA-funded, multi-university
  (SRAC) publication series specifically designed as itemized cost-and-return budgets, and every
  cross-table check ties out to the dollar. No arithmetic errors found anywhere in this document.

  The source explicitly frames this as a worked TEMPLATE ("costs typical of the delta region in
  Mississippi and Arkansas; costs may be different in other regions"), not a single real farm's
  audited books — consistent with how every other extension enterprise budget in this batch is
  also a representative/typical-farm construction rather than one specific operator's actuals.
  This is the normal and expected nature of extension enterprise budgets as a genre, not a defect
  particular to this source.

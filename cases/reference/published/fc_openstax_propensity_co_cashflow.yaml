# Transcribed EXACTLY as published, cross-verified against an INDEPENDENT
# mirror (biz.libretexts.org, a different rendering platform entirely) to
# rule out scraping/rendering artifacts. This case is unusually rich in
# genuine, cross-platform-confirmed source arithmetic errors -- see notes.
# Every subtotal below was independently re-added from its stated
# components; every mismatch is called out explicitly with the arithmetic
# shown, not silently corrected.

meta:
  source: >
    OpenStax, "Principles of Accounting, Volume 1: Financial Accounting":
    Section 16.3 "Prepare the Statement of Cash Flows Using the Indirect
    Method" (comparative balance sheet, income statement, additional
    information, and the complete Indirect Method statement for
    "Propensity Company") AND Section 16.6 "Appendix: Prepare a Completed
    Statement of Cash Flows Using the Direct Method" (same company, same
    year, Direct Method statement).
    https://openstax.org/books/principles-financial-accounting/pages/16-3-prepare-the-statement-of-cash-flows-using-the-indirect-method
    https://openstax.org/books/principles-financial-accounting/pages/16-6-appendix-prepare-a-completed-statement-of-cash-flows-using-the-direct-method
  mirrors_checked: >
    biz.libretexts.org/Bookshelves/Accounting/Financial_Accounting_(OpenStax)/16:_Statement_of_Cash_Flows/16.03
    and .../16.06 -- fetched independently and diffed against openstax.org
    figure-by-figure (see notes). Same underlying numbers, but NOT always
    identical to openstax.org on the disputed lines, which is itself part
    of the finding.
  accessed: "2026-08-11"
  licence: >
    Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International
    (CC BY-NC-SA 4.0) -- confirmed directly via help.openstax.org's
    licensing page and the book's own Preface, same as the rest of this
    title (see fc_openstax_clipem_cliff_barbershop.yaml for the full
    licence-verification note; not repeated here).
  kind: full_cycle
  reaches: cash_flow
  reaches_note: >
    The ONLY gold in this batch that reaches a full, published Statement of
    Cash Flows -- and it does so TWICE for the identical company/year: once
    by the indirect method (16.3) and once by the direct method (16.6),
    which the source states must produce identical operating/investing/
    financing subtotals ("the net cash flows for all sections of the
    statement of cash flows are identical when using the direct method or
    the indirect method"). That claim is itself a testable oracle -- see
    notes for where the two published statements actually disagree.
  mechanism: buy_resell
  mechanism_note: >
    Propensity Company carries Inventory and posts Cost of Goods Sold, so
    it is a merchandiser (buy_resell); no purchases/sales transaction
    detail is given (the case starts one level up, from the comparative
    balance sheet and income statement rather than raw journal entries) --
    flagged so this isn't mistaken for a raw-transactions case.
  # ── HAND-LABELLED 2026-08-12 so the gold runner can execute this file ───
  # T: this source gives a ROLL-FORWARD (2017 opening, 2018 closing, plus
  # narrative "additional information"), not dated transactions — so the
  # 2017 comparative balance sheet becomes `opening:`, and every journal
  # entry below is sized so the account lands EXACTLY on its printed 2018
  # figure. Revenue/COGS/insurance/salaries are each split into an accrual
  # leg (income statement) and a cash leg, using the source's OWN direct-
  # method supporting-calculation boxes for the cash amounts (242,500
  # collected; 157,300 paid for inventory; 12,700 paid for insurance;
  # 42,200 paid for salaries — the ARITHMETICALLY CORRECT one, per this
  # gold's own ERROR 3, not the printed-but-wrong 42,400) — every one of
  # these was hand-verified to bring its account to the exact printed 2018
  # balance (AR 21,500, inventory 48,000, AP 17,200, prepaid insurance
  # 2,500, salaries payable 1,900), and cash lands on 47,500 exactly with
  # no other entry needed.
  #
  # ONE JUDGEMENT CALL, flagged rather than silently resolved: additional
  # info says land was "purchased for $20,000, in exchange for a note
  # payable," and the RECONCILING cash-flow statement separately shows a
  # $10,000 notes-payable ISSUANCE. Both together would take notes payable
  # to 75,000+20,000+10,000=105,000, but the balance sheet prints 85,000
  # (a 10,000 net increase) — and total_liabilities (104,100) is printed
  # consistent with 85,000, not 105,000. I could not resolve this fourth
  # inconsistency (beyond the five this gold's own notes already document)
  # from what this file transcribes, so I booked the land purchase against
  # OWNER instead of notes_payable — this keeps total_assets right (land
  # still lands on 20,000) without inflating total_liabilities past what
  # the source itself prints as consistent. total_equity is unaffected
  # either way, since this engine computes it as assets less liabilities,
  # never as a component roll-up.
  resolution: T
  periods: 1
  currency: USD
  jurisdiction: US


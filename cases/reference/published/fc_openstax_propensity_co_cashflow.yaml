    # identified that the change in long-term assets arose from three
    # transactions") restates this same purchase as "$60,000 cash" -- and
    # EVERY other appearance of this figure on both pages (11 occurrences
    # checked in the raw HTML across 16.3 and 16.6) reads $60,000, which is
    # also the only value consistent with the balance sheet's own Plant

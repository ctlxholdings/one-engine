notes: |
  This case is the richest source-error find in this harvest. Every figure
  below was checked against (a) the arithmetic of its own stated components,
  (b) the comparative balance sheet, and (c) an independent LibreTexts
  mirror fetched separately from openstax.org (different rendering
  platform, same CC-BY-NC-SA content) -- so none of these are scraping
  artifacts of one particular page render; all were confirmed present in
  the raw HTML of at least one, usually both, platforms.

  ERROR 1 -- Plant asset purchase: $50,000 vs $60,000.
  The first "Additional Information" list (item 3) says plant assets were
  purchased for $50,000 cash. Every other mention of this transaction on
  the SAME openstax.org page -- the later "further investigation identified"
  list, the CF statement line itself ("Cost of New Plant Assets (Equipment)
  (60,000)", appearing 8 times across 16.3 and 16.6), and the prose
  ("a simple purchase of new plant assets, in the amount of $60,000") --
  says $60,000. The balance sheet's own Plant Assets change (+$60,000,
  Figure 16.2) settles it: $60,000 is correct; the $50,000 in the first
  list is the error. Transcribed as printed above (both figures, flagged).

  ERROR 2 -- Financing activities: was the $10,000 notes-payable change an
  issuance (source of cash) or a payment (use of cash)?
  The balance sheet says Notes Payable INCREASED $10,000 (75,000 -> 85,000).
  Section 16.3's own "further investigation" list says this was "Borrowed
  an additional $10,000 on notes payable" (an inflow). The COMPLETE Indirect
  Method statement shown early in 16.3 (the "resulting statement," Figure
  16.6 in the book's own numbering) accordingly shows "Issuance of Notes
  Payable (principal) 10,000" and Net Cash Flow: Financing Activities
  = $54,560 (10,000 + 45,000 - 440). This is the ONLY version that makes
  the whole statement reconcile: Operating 13,840 + Investing (45,200) +
  Financing 54,560 = 23,200, which IS the balance sheet's own cash change
  (47,500 - 24,300 = 23,200) -- a three-way tie-out (component math +
  balance sheet + cash roll-forward) that only holds with +10,000/$54,560.
  BUT later on the SAME page, in the line-by-line walkthrough of the
  financing section, the text flips: "One long-term debt transaction
  DECREASED cash... for a total net cash flow from financing of $34,560,"
  and the boxed figure there reads "Payment of Notes Payable (principal)
  (10,000)" -- contradicting its own earlier box, its own "Borrowed"
  language three paragraphs earlier, and the balance sheet.
  Cross-check on LibreTexts (16.03, independently fetched): shows the SAME
  balance sheet ($10,000 increase) but ONLY the "Payment of Notes Payable
  (principal) (10,000)" / non-reconciling treatment throughout -- it does
  not contain "Issuance of Notes Payable," "$54,560," or "Borrowed an
  additional" anywhere on the page (0 occurrences of each, checked
  directly in the raw HTML). So the error is not confined to one row of
  one page: it is the DOMINANT version across both platforms, and the
  reconciling ($54,560) version survives in exactly one place -- the
  "complete statement" box openstax.org shows near the top of 16.3.
  `expected.indirect_method_cash_flow_statement` below transcribes THAT
  box (the reconciling one, as literally printed there); the contradicting
  $34,560/"Payment" version is recorded separately as
  `expected.financing_activities_alternate_as_printed_later_same_page`.

  ERROR 3 -- Direct method salaries paid: $42,200 (summary line) vs $42,400
  (detail box), for the SAME line.
  16.6's summary statement prints "for salaries 42,200" (and this is the
  figure whose inclusion makes "Total 228,660" add up correctly -- see
  ERROR 4). But the page's own worked detail just below it -- "Beginning
  balance, salaries payable $1,500. Plus expense on income statement
  42,600. Equals total obligation to pay salaries 44,100. Less ending
  balance, salaries payable 1,900. Equals cash paid for salaries this
  period $42,400" -- prints $42,400 as the answer to its OWN subtraction,
  even though 44,100 - 1,900 = 42,200, not 42,400. Both figures confirmed
  present (3 occurrences each) in the raw HTML, not a scrape artifact.
  $42,200 is arithmetically correct; $42,400 is the error, and it survives
  in a box whose own displayed inputs contradict its own displayed output.

  ERROR 4 -- Direct method operating cash flow: $13,480 as printed vs
  $13,840 required by the statement's own numbers.
  242,500 (cash collected) - 228,660 (total cash paid, itself correctly
  totaled from 157,300+42,200+12,700+3,500+1,860+11,100) = 13,840, not
  13,480. The Indirect Method statement for the SAME company/year/section
  independently arrives at $13,840 via net income $4,340 + adjustments
  $9,500 (stated in prose: "beginning with net income of $4,340, and
  reflecting adjustments of $9,500, delivers a net cash flow from
  operating activities of $13,840") -- so both the direct method's own
  component arithmetic AND the indirect method's independently-derived
  figure agree on $13,840. $13,480 is a likely digit transposition
  (84 <-> 48), reproduced identically on LibreTexts (confirmed: LibreTexts'
  16.06 page contains "13,480" once and does not contain "13,840" at all).

  ERROR 5 -- Compounding: the Direct Method statement's Financing and Total
  lines do not even match ERROR 2's alternate ($34,560) -- they show a
  THIRD number, $33,560 (verified in raw HTML, not a typo of transcription
  on my part): "Net cash flow: financing activities 33,560." This is $1,000
  off from $34,560 (the "payment" interpretation from ERROR 2), suggesting
  an additional, independent slip on top of the sign error. Consistent
  with this, the statement's printed "Total cash flow increase/(decrease)
  22,200" and "Cash balance, December 31, 2018 $46,500" are both exactly
  $1,000 below the reconciling values ($23,200 and $47,500 respectively --
  the latter also being the balance sheet's own printed 2018 cash balance).
  Internally, the printed Direct Method box IS self-consistent along one
  path (24,300 beginning + printed 22,200 total = printed 46,500 ending),
  it just does not reconcile to the balance sheet or to 16.3's own opening
  box. All five printed figures (13,480 / 33,560 / 22,200 / $46,500, plus
  ERROR 3's $42,400) are transcribed as-printed in `expected`, alongside
  the reconciling values, so an engine can be checked against either the
  literal source text or the internally-consistent "correct" answer.

  Two smaller items, not treated as errors: the balance sheet's
  Accumulated Depreciation change is printed as "(14,400) decrease" even
  though the account becomes MORE negative -- this is the source's own
  sign convention (the signed number -71,100 decreases to -85,500) and is
  consistent with Depreciation Expense of $14,400 on the income statement,
  so it is transcribed as printed, unflagged as an error. Interest Expense
  is shown on the income statement as a bare $3,500 under "Other Revenue
  and Expenses" that combines with the $4,800 gain to net to $1,300 -- the
  source does not show interest expense with an explicit minus sign in the
  original figure (it is a subtraction by position, not by printed sign);
  recorded here with an explicit negative for computability.

# which of the source's own names we check against which of ours. Only
# `cash_closing` and `net_change_in_cash` are implemented on the cash-flow
# side of this engine's T-journal reader (engine/golds.py `_ours()`) —
# `cash_flow_operating`/`investing`/`financing` are declared in the
# canonical vocabulary but never populated, so mapping to them would be
# silently dropped rather than checked; a real gap, not something this
# gold file can fix.
mapping:
  net_income_top: net_profit
  total_assets_2018_top: total_assets
  total_liabilities_2018_top: total_liabilities
  total_equity_2018_top: total_equity
  cash_closing_2018_top: cash_closing
  net_change_in_cash_top: net_change_in_cash

tolerance:
  abs: 1.0
  why: >
    OpenStax prints whole dollars; this gold's own notes already document
    five source arithmetic errors (ERROR 1-5), so this journal was built
    against the RECONCILED figures (60,000 plant assets not 50,000; the
    42,200 direct-method salaries figure not the self-contradicting
    42,400; the +10,000/54,560 financing reading not the -10,000/34,560
    or 33,560 alternates) — any remaining divergence is either the
    engine's or a sixth source inconsistency, not display rounding


id: rte_embouche_bovine_niger_3cycles
title: "Niger PRADEL référentiel technico-économique — embouche bovine (cattle fattening): 3 head per pen, 3 cycles of 3-4 months, 9 head a year, with the one-cycle working-capital table beside the three-cycle expense table"

meta:
  source:
    - "Ministère de l'Agriculture et de l'Élevage (Niger) / Programme d'Appui au Développement de l'Élevage (PRADEL KIYO-ARZIKI), 'Référentiel Technico-Économique sur la filière bétail-viande — Embouche bovine' (PDF authored by Patrick Delmas). Technical text p.3 ('une période d'élevage de 3 à 4 mois'); p.5 infrastructure text (6 m2 per bovine, a 3-head étable, an 18 m2 fenil); Tableau 8 'besoins en infrastructures' (p.8); Tableau 9 'équipements et matériels d'élevage' (p.8); Tableau 10 'besoins en fonds de roulement (3 mois)' (p.8); Tableau 11 'dépenses d'exploitation (3 cycles d'élevage)' (p.9); Tableau 12 'compte d'exploitation' (p.9). https://reca-niger.org/IMG/pdf/rte_betail_embouche_bovine_pradel.pdf"
  accessed: "2026-08-12"
  licence: >
    Public extension/reference document of a Niger government livestock
    programme (PRADEL KIYO-ARZIKI), distributed free by RECA-Niger; no licence
    statement is printed. Transcribed here, with full citation, for
    engine-verification/research use only.
  kind: trade_case
  unit_of_analysis: "one 3-head fattening pen over 3 cycles (one year), i.e. 9 head placed and sold"
  mechanism: buy_hold_then_sell
  # ── HAND-HARVESTED 2026-08-12, cycle-time/residence batch ────────────────
  # L2: the expense table is fully itemised as quantité x PU, but the revenue
  # (3,937,725) is printed as a single unexplained figure in the compte
  # d'exploitation -- there is no quantity x price behind it anywhere in the
  # document, so revenue cannot be re-derived. Tables are page images, read
  # directly off the rendered pages, not from an extractable text layer.
  resolution: L2
  basis: "3 head per cycle, 3 cycles (one year), Niger semi-intensive stall fattening"
  periods: 1     # the compte d'exploitation is one annual account. The
  #                document's real structure -- one cycle costed (Tableau 10)
  #                and the same thing x3 (Tableau 11) -- is what makes the
  #                cycle/throughput relation checkable; see notes.
  jurisdiction: NE
  currency: XOF

inputs:
  # ── THE CYCLE ITSELF: this is the gold's whole point ──────────────────────
  cycle:
    duration_months_min: 3           # p.3: "les objectifs de production soient
    duration_months_max: 4           #  atteints au bout d'une période d'élevage
    #                                   de 3 à 4 mois"
    head_per_cycle: 3                # the étable is built for 3 bovines (p.5),
    #                                  and Tableau 10 buys exactly 3
    cycles_per_year: 3               # Tableau 11 header: "dépenses
    #                                  d'exploitation (3 cycles d'élevage)"
    head_per_year: 9                 # Tableau 11 buys 9 head
    # STOCK ON HAND, CYCLE LENGTH AND THROUGHPUT ARE THEREFORE ALL THREE
    # PRINTED: 3 head standing, ~3-4 months each, 9 head a year. The identity
    # work-in-progress = throughput x cycle time holds exactly on the
    # source's own numbers: 9 head/yr x (1/3 yr) = 3 head standing.
  stall_sizing:
    m2_per_bovine: 6                 # p.5
    etable_dimensions_m: "2 x 3"
    fenil_m2: 18
  infrastructures_xof:               # Tableau 8
    etable: {quantite: 1, pu: 180000, montant: 180000}
    fenil: {quantite: 1, pu: 126000, montant: 126000}
    fosse_fumiere: {quantite: 1, pu: 12500, montant: 12500}
  equipements_xof:                   # Tableau 9 -- SEE NOTES, its printed
    #                                  total is not the sum of these lines

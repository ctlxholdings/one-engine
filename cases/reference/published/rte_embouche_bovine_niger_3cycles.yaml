mapping:
  recettes_dexploitation: revenue
  total_depenses_exploitation_3cycles_xof: cost_of_sales
  resultat_brut_dexploitation_RBE_xof: gross_margin

tolerance:
  abs: 1.0
  why: >
    every figure is printed as a whole franc CFA except the tax line
    (328,897.5), and the whole compte d'exploitation chain reconciles to the
    franc -- including the break-even, which lands within half a franc of the
    printed 416,425 when recomputed on the unrounded margin rate. 1 franc is
    therefore pure display margin. Kept tight deliberately: the two real
    defects here are 236,500 and 630,000 francs wide and must not be absorbed.

notes: |
  WHY THIS ONE WAS HARVESTED: it is the rare source that prints all three legs
  of the work-in-progress identity. Stock on hand: 3 head (the étable is built
  for 3, and the one-cycle working-capital table buys 3). Cycle length: 3 to 4
  months. Throughput: 9 head a year, across "3 cycles d'élevage". Those close
  exactly -- 9 head/year at a third of a year each = 3 head standing at any
  moment -- and the document lets you see the same operation costed BOTH ways,
  one cycle in Tableau 10 and three cycles in Tableau 11, which is what makes
  the scaling checkable.

  RE-DERIVED BY HAND. What ties EXACTLY:
    - Tableau 11, all fifteen lines: every one ties to quantité x PU (9 x
      210,000 = 1,890,000; 1,012.5 x 30 = 30,375; 810 x 25 = 20,250; 1,687.5 x
      50 = 84,375; 2,160 x 75 = 162,000; 1,012.5 x 140 = 141,750; and so on),
      and the fifteen sum to 2,711,750 -- an EXACT match to the printed total.
      This is the one table in the document with no defect at all.
    - THE 3x SCALING between the one-cycle and three-cycle tables holds
      line-for-line on the physical quantities: sorgho 337.5 -> 1,012.5;
      paille 270 -> 810; niébé 562.5 -> 1,687.5; son 720 -> 2,160; tourteau
      337.5 -> 1,012.5; pierre à lécher 2 -> 6; bloc 1 -> 3; sel cuisine 3 ->
      9; antiparasitaire 3 -> 9; vaccination 12 -> 36; multivitamine 9 -> 27;
      traitement 1 -> 3; cattle 3 -> 9. Thirteen independent lines scaling by
      exactly 3 is the strongest confirmation in this gold that "3 cycles"
      means literally three repetitions of the 3-head cycle.
    - Compte d'exploitation: 2,711,750 + 129,650 = 2,841,400 exact; 3,937,725
      - 2,711,750 = 1,225,975 exact; 1,225,975 - 129,650 = 1,096,325 exact;
      x 30% = 328,897.5 exact; 1,096,325 - 328,897.5 = 767,427.5 -> 767,428.
    - Every ratio recomputes: 3,937,725/2,841,400 = 1.386 -> 1,4;
      2,711,750/1,225,975 = 2.21 -> 2; 129,650/1,225,975 = 0.106 -> 0,11;
      1,225,975/3,937,725 = 0.3113 -> 0,31.
    - THE BREAK-EVEN IS THE CLEANEST NUMBER IN THE DOCUMENT: seuil de
      rentabilité = charges fixes / taux de marge sur coûts variables =
      129,650 / 0.3113409 = 416,424.5, and the source prints 416,425. It used
      the UNROUNDED margin rate, not the 0,31 it displays (which would give
      418,226). And the point mort of 1 head follows: 416,425 divided by the
      implied 437,525 of revenue per head = 0.95 -> 1.

  TWO SELF-CONTRADICTIONS, transcribed as printed and NOT corrected:
    1. Tableau 9 (équipements) prints a total of 327,000. Its own nine lines
       are 3,000+1,500+20,000+7,000+7,000+40,000+6,000+3,000+3,000 = 90,500.
       The printed total is 236,500 francs too high -- and the text
       immediately below inherits it: "Le coût global des investissements ...
       est de 645 500 FCFA" is exactly 318,500 + 327,000. On the equipment
       table's own line items the investment would be 409,000. The overstated
       figure is what any reader financing the unit would borrow against.
    2. Tableau 10 (fonds de roulement, 3 mois) prints a total of 243,850. Its
       own fifteen lines sum to 873,850. The gap is exactly 630,000 -- the
       cattle-purchase line, the single largest item in the table, is listed
       in the table and then excluded from its own total. The working capital
       a fattener actually needs for one cycle is 3.6x what this table says.
       (Cross-check that the 873,850 is the right figure: 873,850 x 3 =
       2,621,550, which is 2,711,750 less the 90,200 of labour that Tableau 11
       adds beyond 3x the one-cycle labour -- see contradiction note below.)
    Two smaller scaling breaks in Tableau 11 versus 3x Tableau 10: labour is
    12 months, not 9 (3 cycles x 3 months), which adds 90,000 francs of cost
    for a fourth month the cycle table does not have -- defensible if the pen
    is manned year-round between batches, but unstated; and sel fogha goes 3
    -> 10 kg where 3x would be 9.

  GAPS (not printed, therefore not asserted): the revenue, 3,937,725, appears
  ONLY as an input line in the compte d'exploitation -- there is no sale
  price, no exit weight, no carcass yield and no manure line anywhere in the
  document to build it from. Per head it implies 437,525 francs against a
  210,000-franc purchase, i.e. the animal roughly doubles in value over the
  cycle, but the source never says so. Also absent: entry and exit weights,
  daily gain, mortality, any pen turnaround/idle time between the three cycles
  (the 12 months of labour hints at it without measuring it), and any interest
  on the working capital tied up for each 3-month cycle.

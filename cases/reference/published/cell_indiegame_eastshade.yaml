id: cell_indiegame_eastshade
title: "Eastshade postmortem — Eastshade Studios (indie video-game development cost vs. lifetime revenue)"

meta:
  source:
    - "Danny Weinbaum, 'Postmortem: Eastshade', Game Developer (formerly Gamasutra), 17 August 2020. https://www.gamedeveloper.com/business/postmortem-eastshade"
  licence: >
    Game Developer / Informa (formerly Gamasutra/UBM); publicly published trade-press article,
    freely readable, no paywall encountered. No explicit reuse licence stated on the page; figures
    transcribed for verification/testing purposes only, no article text reproduced beyond short
    quoted fragments.
  kind: trade_case
  # L1: a small set of the author's own headline totals (dev cost, gross revenue, net revenue) —
  # no itemised cost lines and no unit-level price/quantity are published anywhere in the piece.
  resolution: L1
  basis: "cumulative, one game title, first ~1.5 years after launch (PC release Feb 2019, console Oct 2019; article published Aug 2020) — a PROJECT-level total, not an annual P&L"
  periods: 1
  # NO TAG FITS — the studio transforms inputs (years of developer time) into a NEW intangible
  # asset (the game) and sells copies of it outright: Weill & Malone's "Inventor" cell (create x
  # intangible). engine/ledger/mechanisms.py's three "create" tags (grow_then_sell, make_to_order,
  # extract) are all hardcoded to ("create","physical"); none reaches ("create","intangible"). See
  # notes and CELLS_INVENTORY.md.
  mechanism: null
  cell: "create x intangible (Inventor)"
  jurisdiction: US
  currency: USD
  trade: "Eastshade Studios — self-published exploration/painting video game, PC (Steam) + Xbox One + PlayStation 4"

inputs:
  costs:
    initial_development_budget:
      value: 200000
      unit: USD
      label_as_printed: "Initial budget of 200k"
      note: "primarily the developer's own living expenses over ~5 years of development, not a conventional payroll COGS figure — see notes"
    post_launch_porting_and_patching:
      value: 60000
      unit: USD
      label_as_printed: "additional 60k post launch for porting and patching"
  development_period: "~5 years, self-funded from personal savings, family support near the end"
  platforms: "PC (Steam, primary), Xbox One, PlayStation 4"

expected:
  gross_revenue:
    value: 2000000
    unit: USD
    label_as_printed: "Roughly $2M USD gross revenue across all platforms so far (1.5 years since launch)"
  net_revenue_post_platform:
    value: 1100000
    unit: USD
    label_as_printed: "about 1.1M post-platform net"
    composition_as_printed: "author's own stated split of the same $2M gross — implies a combined platform/distribution take of roughly 45%, not itemised by platform"
  total_development_cost:
    value: 260000
    unit: USD
    composition_as_printed: "initial_development_budget (200,000) + post_launch_porting_and_patching (60,000) = 260,000"

# which of the source's own names we check against which of ours
mapping:
  net_revenue_post_platform: revenue
  total_development_cost: cost_of_sales

tolerance:
  abs: 50000
  why: >
    every figure in the source is stated as an order-of-magnitude round number ("roughly $2M",
    "about 1.1M", "200k", "60k") — the author gives no finer precision anywhere in the piece.
    50,000 (2.5% of gross revenue) is set to match the source's own stated precision; there is no
    sharper published figure to check against.

notes: |
  WHY THIS IS "create x intangible" WITH NO TAG: the studio's whole product IS the created asset —
  years of developer time convert into a new intangible good (the game's code, art and design), and
  each unit sold transfers a licence/copy of that same intangible. Structurally this is the same
  "transform inputs into a new asset, sell its ownership" pattern the CREATE row already runs on the
  PHYSICAL column (grow/assemble/extract) — just over an asset with zero marginal replication cost
  instead of a harvested or manufactured good. `engine/ledger/mechanisms.py`'s three "create" tags
  are all hardcoded to `("create", "physical")`; none reaches `("create", "intangible")`.
  `mechanism:` is left null rather than forced, per this brief's own instruction.

  RESOLUTION IS DELIBERATELY LOW (L1): unlike this corpus's usual L3/L4 farm-budget golds, this
  source publishes no unit count (copies sold), no per-copy price, and no itemised cost lines — only
  three headline totals (dev cost, gross revenue, net-of-platform revenue). It is included anyway
  because Priority 2 of the brief that produced this gold explicitly asked for "software or media
  unit economics with published figures," and this is the strongest PUBLIC, NAMED, real-company
  instance found: a real, named studio (Eastshade Studios / Danny Weinbaum), a real, released,
  commercially available title, with both a cost side and a revenue side stated by the same author
  in the same piece — not a benchmark statistic with no worked example, which the brief that
  produced this file explicitly rules out as "not a gold."

  THE $200K/$260K IS NOT A CONVENTIONAL COGS FIGURE, and this gold's `cost_of_sales` mapping should
  be read with that caveat carried forward: the author states explicitly that the nominal budget was
  primarily his own living expenses kept as low as possible, and separately estimates that "the
  actual economical value would have been closer to 700k if converted to a standard hiring budget"
  (i.e. what it would have cost to build the same game paying market salaries). Both figures are the
  author's own; 700,000 is recorded here in the notes rather than `inputs.costs` because it is
  explicitly a HYPOTHETICAL re-costing, not what was actually spent.

  PLATFORM SPLIT, qualitative only (no dollar breakdown published): "Steam dominated sales"; the
  console launch "was described as 'a faceplant'" with early Xbox sales around 10% of expectations,
  improving after a Microsoft storefront feature change; PlayStation sales "remained negligible."
  The ~45% implied gross-to-net take (2.0M -> 1.1M) is therefore a blended figure across a
  Steam-heavy mix, not a flat platform-cut percentage that would generalise to an even split.

  The author separately projects "breaking 3M gross in the coming years" — a forward-looking figure,
  not transcribed into `expected` since it had not yet been realised at the time of writing.

  A second candidate for this cell was considered and set aside: recruitment-industry benchmark
  reports (see CELLS_INVENTORY.md, match x human) repeatedly cite per-unit software/media figures in
  passing but never both a cost side and a revenue side from the same named source in the way this
  postmortem does — Eastshade was the strongest single instance found within this harvest's effort
  budget, not an exhaustive search of the category.

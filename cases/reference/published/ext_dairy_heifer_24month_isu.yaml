id: ext_dairy_heifer_24month_isu
title: "Iowa State University Extension dairy heifer raising budget — one heifer held 24 months from birth to calving, with the 56-day pre-weaning and 674-day weaning-to-calving split and the 40-head-a-year replacement throughput"

meta:
  source:
    - "Larry Tranel (Dairy Field Specialist, Iowa State University Extension and Outreach, NE/SE Iowa), 'Heifer Raising Costs in 2019', ISU Publication LT-18-01. Right-hand panel 'Heifer Raising Budget — 1 Heifer for 24 months' (itemised feed, livestock, facilities & equipment, ownership, labour); left-hand text columns (slide-rule thumb rule, the 56-day birth-to-weaning window, the 674-day weaning-to-calving window, the 23-month and cull-rate sensitivities); bottom-left 'Heifer Costs 2019' price/ration panel. The budget panel is dated *Itemized Costs -- 2017; the text states costs 'did not change much since that time'. https://www.extension.iastate.edu/dairyteam/files/documents/whats_it_cost_to_raise_heifers_2019_0.pdf"
  accessed: "2026-08-12"
  licence: >
    US land-grant Cooperative Extension publication (Iowa State University
    Extension and Outreach), published free for public use; no explicit open
    licence printed. Transcribed here, with full citation, for
    engine-verification/research use only.
  kind: trade_case
  unit_of_analysis: "one dairy replacement heifer, birth to calving, 24 months"
  mechanism: grow_then_sell
  # ── HAND-HARVESTED 2026-08-12, cycle-time/residence batch ────────────────
  # L2: this is a cost roll-up. The only "revenue" the source prints is a
  # BREAK-EVEN SALE VALUE ($2,241), not a market price x a quantity, so there
  # is no qty x price revenue line to check.
  resolution: L2
  basis: "one heifer, 24 months (730 days) from birth to calving; feed prices at 2018-19 levels"
  periods: 1
  jurisdiction: US
  currency: USD

inputs:
  # ── THE RESIDENCE ITSELF: what makes this gold worth having ──────────────
  cycle:
    total_rearing_months: 24
    total_rearing_days: 730            # the $/head/day figures below divide by
    #                                    exactly this (see notes)
    birth_to_weaning_days: 56
    weaning_to_calving_days: 674       # 730 - 56, and the source prints all
    #                                    three numbers independently
    birth_to_weaning_cost_usd: 336     # text: "$5-$6 per calf per day ... A
    #                                    56-day birth-weaning period typically
    #                                    has an estimated $336 of expenses"
    #                                    (= 56 x $6.00)
  # THROUGHPUT, stated in the source's own sensitivity paragraph
  throughput:
    herd_cows: 100
    replacement_heifers_raised_per_year: 40
    replacement_heifers_after_10pct_lower_cull_rate: 36   # "reduce heifers
    #                                    needed by four"
    # NOT PRINTED, therefore not asserted: the resulting stock on hand. With a
    # 24-month residence and 40 head entering a year, a steady-state herd
    # carries 40 x 2 = 80 heifers at any moment. The source never states it.

  feed_costs_usd:                      # panel "Feed Costs (DM = Dry Matter)"
    hay_haylage_dm: {cost: 621.18, quantity: 4.00, unit: ton}
    pasture_forage_dm: {cost: 0.00, quantity: 0.00, unit: ton}   # SEE NOTES --
    #   the text says 1.25 ton of pasture forage IS included; the table says 0
    corn_silage_dm: {cost: 270.83, quantity: 2.50, unit: ton}
    corn_equivalent_us_no2: {cost: 64.35, quantity: 18.00, unit: bu}
    protein_supplement: {cost: 95.29, quantity: 550.00, unit: lb}
    salt_and_minerals: {cost: 2.75, quantity: 50.00, unit: lb}
    fat_supplement: {cost: 0.00, quantity: 0.00, unit: lb}
    milk_replacer_calf_feed: {cost: 112.20, quantity: 120.00, unit: lb}
  livestock_costs_usd:
    dairy_supplies: 10.00
    freight_trucking_hauling: 5.00
    veterinary_and_medicine: 70.00
    breeding_fees: 42.00
    dhia_accounting_legal: 3.00
    marketing: 1.00
    bedding: 100.00                    # 1 ton
    gas_fuel_oil: 10.40                # 4 gal
    electricity: 17.00                 # 170 kWh
    other_operating_interest_phone: 10.00
  facilities_and_equipment_costs_usd:
    manure_storage: 21.60              # $0.03/head/day
    heifer_housing: 163.80             # $0.23/head/day
    machinery_and_equipment: 55.22     # $0.08/head/day
  ownership_and_stock_usd:
    cow_ownership_cost_interest_on_investment: 110.00
    initial_calf_value: 175.00
  labour:
    hours_per_head: 22.00
    cost_usd: 275.00                   # 22 hrs x $12.50/hr implied

  # the separate 2019 price/ration panel (a DIFFERENT, per-day view of the
  # same enterprise, at a 700 lb heifer size)
  ration_panel_2019:
    heifer_size_lb: 700
    dm_intake_lb_per_day_at_2_25pct_bw: 15.75      # 700 x 2.25%
    corn: {lb: 5, price_usd_per_bu: 3.25, cost_usd_per_head_day: 0.29}
    hay: {lb: 10, price_usd_per_ton: 140, cost_usd_per_head_day: 0.56}
    supplement: {lb: 1.5, price_usd_per_lb: 0.18, cost_usd_per_head_day: 0.27}
    ration_total: {lb: 16.5, cost_usd_per_head_day: 1.12}
    feed_cost_usd_per_lb_feed: 0.068

  # the 17 cost lines that make up the printed $/head/day figures (feed,
  # livestock, facilities). EXCLUDED from `costs`: the $110 ownership cost and
  # the $175 initial calf value (both are stock/financing, and the source adds
  # them separately, after the per-day figures), and the $275 labour (the
  # source prints one $/head/day figure WITHOUT it and one WITH it).
  costs:
    hay_haylage_dm: 621.18
    corn_silage_dm: 270.83
    corn_equivalent: 64.35
    protein_supplement: 95.29
    salt_and_minerals: 2.75
    milk_replacer_calf_feed: 112.20
    dairy_supplies: 10.00
    freight_trucking_hauling: 5.00
    veterinary_and_medicine: 70.00
    breeding_fees: 42.00
    dhia_accounting_legal: 3.00
    marketing: 1.00
    bedding: 100.00
    gas_fuel_oil: 10.40
    electricity: 17.00
    other_operating_interest_phone: 10.00
    manure_storage: 21.60
    heifer_housing: 163.80
    machinery_and_equipment: 55.22

expected:
  total_feed_cost_usd:
    value: 1167
    label_as_printed: "$1,167  7.98 DM ton/hd"
    composition_as_printed: "621.18+0.00+270.83+64.35+95.29+2.75+0.00+112.20 = 1,166.60 -> printed 1,167"
  total_feed_dm_ton_per_head: 7.98        # see notes -- NOT reproducible from
  #                                         the printed quantities
  total_livestock_costs_usd:
    value: 268.40
    composition_as_printed: "10+5+70+42+3+1+100+10.40+17+10 = 268.40 exact"
  total_facilities_and_equipment_costs_usd:
    value: 240.62
    composition_as_printed: "21.60+163.80+55.22 = 240.62 exact"
  subtotal_before_ownership_and_labour_usd:
    value: 1672.02
    label_as_printed: "for a total of $1,672.02 before heifer ownership cost or labor is considered"
    composition_as_printed: "1,167 + 268.40 + 240.62 = 1,676.02 by hand -- the printed 1,672.02 is $4 LOW (see notes)"
  cost_per_head_per_day_without_labour_usd: 2.30    # 1,676.02 / 730 = 2.2959
  cost_per_head_per_day_with_labour_usd: 2.67       # (1,676.02+275) / 730 = 2.6726
  labour_cost_usd: 275.00                            # 22.00 hrs/hd
  total_cost_24_months_usd:
    value: 2241
    label_as_printed: "$2,241 Total Cost (24 mon); text: break-even sale value of $2,241 over the 24-month period"
    composition_as_printed: "1,676.02 + 275 + 110 + 175 = 2,236.02 by hand -- $4.98 BELOW the printed 2,241 (see notes)"
  weaning_to_calving_cost_usd:
    value: 1620
    composition_as_printed: "2,241 - 336 (birth-to-weaning) - 110 (ownership) - 175 (initial calf value) = 1,620 EXACT"
  weaning_to_calving_cost_per_day_usd: 2.40          # 1,620 / 674 = 2.4036
  saving_from_23_month_instead_of_24_month_usd: 93   # = 2,241/730 x 30.4 days
  saving_for_100_cow_herd_usd: 3720                  # 93 x 40 replacements
  cost_of_a_23_month_heifer_usd: 2148                # 2,241 - 93
  saving_from_10pct_lower_cull_rate_usd: 7892        # (2,148 - 175) x 4
  #                                                    = 1,973 x 4 = 7,892
  saving_per_head_as_printed_usd: 1991               # PRINTED, and WRONG:
  #                                                    2,148 - 175 = 1,973

mapping:
  total_cost_24_months_usd: cost_of_sales

tolerance:
  abs: 0.01
  why: >
    every money figure in the budget panel is printed to the cent (621.18,
    268.40, 240.62, 10.40, 55.22) and the three section totals reconcile to
    the cent against their own components, so a cent is exactly the display
    precision. Deliberately tight: the two real gaps this gold records ($4.00
    on the pre-ownership subtotal and $4.98 on the 24-month total) must not be
    absorbed by tolerance -- they are the finding.

notes: |
  WHY THIS ONE WAS HARVESTED: a dairy replacement heifer is 24 months of
  work-in-progress before she can produce anything, and this source prints the
  DURATION three ways -- 24 months, 730 days implied by its own $/head/day
  arithmetic, and a 56 + 674 = 730 day split at weaning -- alongside the
  THROUGHPUT (40 replacements a year out of a 100-cow herd). Cycle length and
  throughput both printed; stock on hand (40 x 2 = 80 head standing) is the
  only leg the source leaves to the reader.

  RE-DERIVED BY HAND. What ties EXACTLY:
    - Livestock costs: 10+5+70+42+3+1+100+10.40+17+10 = 268.40, exact match to
      the printed $268.40.
    - Facilities: 21.60+163.80+55.22 = 240.62, exact.
    - Facilities cross-check on a DIFFERENT basis: the same three lines print
      $0.03 + $0.23 + $0.08 = $0.34/head/day, and 240.62/730 = $0.3296/day.
      Each line ties individually (21.60/730 = 0.0296 -> 0.03; 163.80/730 =
      0.2244 -> 0.22 vs 0.23 printed, a rounding-up; 55.22/730 = 0.0756 ->
      0.08). The 730-day divisor is what confirms "24 months" means 730 days
      throughout.
    - Feed: 621.18+270.83+64.35+95.29+2.75+112.20 = 1,166.60 -> printed
      $1,167, ordinary rounding.
    - $/head/day: (1,167 + 268.40 + 240.62)/730 = 2.2959 -> $2.30 printed
      EXACT; adding the $275 labour, (1,676.02+275)/730 = 2.6726 -> $2.67
      printed EXACT. Both per-day figures therefore confirm a subtotal of
      1,676.02, not the 1,672.02 the text prints (see contradiction 1).
    - The weaning-to-calving chain is EXACT and is the cleanest thing in the
      document: 2,241 - 336 - 110 - 175 = 1,620, and 1,620/674 = $2.4036 ->
      the printed $2.40/day. The 674 days is itself 730 - 56, and the 56-day
      window x the stated $6/calf/day = the $336 it subtracts. Four separate
      printed numbers close a loop.
    - The 23-month sensitivity: 2,241/730 = $3.070/day x 30.4 days = $93.3 ->
      the printed "$93 per heifer"; $93 x 40 replacements = $3,720, printed
      exactly; and 2,241 - 93 = 2,148, the very figure the next sentence uses.
    - Corn wastage: the panel prices corn at $3.25/bu and the budget charges
      64.35/18 bu = $3.575/bu, exactly $3.25 x 1.10 -- a 10% feed-wastage
      factor, which the budget's own column header ("Feed Wastage") announces
      but never quantifies.
    - Ration panel: 5+10+1.5 = 16.5 lb; 0.29+0.56+0.27 = $1.12/head/day; and
      1.12/16.5 = $0.0679 -> the printed $0.068/lb of feed. All exact. Corn:
      5 lb / 56 lb per bu x $3.25 = $0.29, exact. Supplement: 1.5 x $0.18 =
      $0.27, exact.

  FOUR SELF-CONTRADICTIONS, transcribed as printed and NOT corrected:
    1. "$240.62 for a total of $1,672.02 before heifer ownership cost or labor
       is considered." Its own three components are 1,167 + 268.40 + 240.62 =
       1,676.02. The printed figure is $4.00 low, and the document's own
       $2.30/head/day figure (which requires 1,676.02) contradicts it. Looks
       like a 6/2 transposition.
    2. The $2,241 total does not bottom-build: 1,676.02 + 275 (labour) + 110
       (ownership) + 175 (calf value) = 2,236.02, $4.98 short of 2,241. Yet
       2,241 is the figure every downstream sentence uses, and it closes the
       674-day chain above exactly. So the ~$5 lives between the section
       totals and the grand total, and cannot be located from what is printed.
    3. "Reducing the cull rate by 10% ... reducing heifer raising costs by
       another $7,892 ($2,148 - $175 calf value = $1,991 x 4)." 2,148 - 175 =
       1,973, not 1,991; and 1,973 x 4 = 7,892, which IS the printed answer.
       So the parenthetical intermediate ($1,991) is wrong while the result it
       supposedly produces is right.
    4. Feed dry matter: the panel prints "7.98 DM ton/hd", the text beside it
       says "around six tons of dry matter is needed per heifer", and the
       printed quantities add to roughly 7.36 tons (4.00 hay + 2.50 silage +
       18 bu corn at 56 lb/bu = 0.504 t + 720 lb of supplement/salt/milk
       replacer = 0.36 t). Three different answers to the same question.
       Separately, the table prints pasture forage at 0.00 ton while the text
       says "this budget has 1.25 ton of pasture forage per heifer included".
       The 7.98 figure is transcribed as printed and flagged, not reconciled.

  GAPS (not printed, therefore not asserted): no market sale price for the
  finished heifer (only the $2,241 break-even), no mortality or non-completion
  rate over the 24 months, no month-by-month or stage-by-stage cost schedule
  (the 56/674-day split is the only within-cycle breakdown), and no
  steady-state count of heifers standing on the farm.

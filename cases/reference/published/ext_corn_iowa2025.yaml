id: ext_corn_iowa2025
title: "Iowa State Ag Decision Maker — Estimated Costs of Crop Production in Iowa 2025, Corn Following Corn (192 bu/acre trend yield)"

meta:
  source:
    - "Iowa State University Extension and Outreach, 'Estimated Costs of Crop Production in Iowa — 2025', Ag Decision Maker File A1-20 / FM 1712 (Revised January 2025), p.2, table 'Corn Following Corn', middle (192 bu/acre) column: https://www.extension.iastate.edu/agdm/crops/pdf/a1-20.pdf"
    - "Direct URL returns HTTP 403 to automated fetchers (Cloudflare bot check); content verified via the Wayback Machine mirror: https://web.archive.org/web/2025/https://www.extension.iastate.edu/agdm/crops/pdf/a1-20.pdf"
  accessed: 2026-08-11
  licence: public/extension
  kind: trade_case
  unit_of_analysis: "per acre, corn following corn, 192 bu/acre (30-year trend yield, Central Iowa)"
  mechanism: grow_then_sell
  # ── HAND-LABELLED 2026-08-12 ─────────────────────────────────────────
  resolution: L2          # this source publishes COSTS ONLY — no price per
  #                          bushel is given anywhere, so no sale is possible
  basis: "per acre, one season (192 bu/acre)"
  periods: 1
  jurisdiction: US
  currency: USD

inputs:
  yield_bu_per_acre: 192
  preharvest_machinery:
    fixed_usd_per_acre: 41.20
    variable_usd_per_acre: 27.40
    operations: "chisel plow, tandem disk, apply nitrogen, field cultivate, plant, and spray"
  seed:
    price_usd_per_1000_kernels: 3.81
    kernels_planted: 30000
    cost_usd_per_acre: 114.30
  nitrogen: {price_usd_per_lb: 0.50, lbs_per_acre: 181, cost_usd_per_acre: 90.50}
  phosphate: {price_usd_per_lb: 0.58, lbs_per_acre: 72, cost_usd_per_acre: 41.76}
  potash: {price_usd_per_lb: 0.36, lbs_per_acre: 58, cost_usd_per_acre: 20.88}
  lime_yearly_cost_usd_per_acre: 6.41
  herbicide_usd_per_acre: 47.00
  insecticide_usd_per_acre: 18.00
  crop_insurance_usd_per_acre: 16.20
  miscellaneous_usd_per_acre: 12.90
  interest_on_preharvest_variable_costs:
    rate_pct_annual: 8.12
    months_financed: 8
    cost_usd_per_acre: 21.40
    note: "base for this interest line = preharvest-machinery variable cost ($27.40) + all Seed/Chemical variable lines above ($367.95), i.e. $395.35 x 8.12% x 8/12 = $21.40 — even though preharvest machinery is printed as a separate line item above this section"
  harvest_machinery:
    combine: {fixed_usd_per_acre: 23.00, variable_usd_per_acre: 8.70}
    grain_cart: {fixed_usd_per_acre: 11.10, variable_usd_per_acre: 3.80}
    haul: {fixed_usd_per_acre: 14.78, variable_usd_per_acre: 9.22}
    dry:
      price_usd_per_gallon_lp_gas: 1.53
      fixed_usd_per_acre: 9.60
      variable_usd_per_acre: 35.25
    handle_auger: {fixed_usd_per_acre: 6.07, variable_usd_per_acre: 4.86}
  labor: {hours_per_acre: 2.80, rate_usd_per_hour: 20.15, cost_usd_per_acre: 56.42}
  land_cash_rent_equivalent_usd_per_acre: 286.00
  # ── HAND-LABELLED 2026-08-12 ─────────────────────────────────────────
  # The 24 genuine cost lines, read verbatim from the `cost_usd_per_acre` /
  # `fixed_usd_per_acre` / `variable_usd_per_acre` cells above (preharvest
  # machinery split fixed/variable; harvest machinery split 5 items x
  # fixed/variable). EXCLUDED: every `*_section_total`/`total_*` figure in
  # `expected` below (subtotals, not line items) and the per-bushel rates.
  costs:
    preharvest_machinery_fixed: 41.20
    preharvest_machinery_variable: 27.40
    seed: 114.30
    nitrogen: 90.50
    phosphate: 41.76
    potash: 20.88
    lime: 6.41
    herbicide: 47.00
    insecticide: 18.00
    crop_insurance: 16.20
    miscellaneous: 12.90
    interest_on_preharvest_variable_costs: 21.40
    harvest_combine_fixed: 23.00
    harvest_combine_variable: 8.70
    harvest_grain_cart_fixed: 11.10
    harvest_grain_cart_variable: 3.80
    harvest_haul_fixed: 14.78
    harvest_haul_variable: 9.22
    harvest_dry_fixed: 9.60
    harvest_dry_variable: 35.25
    harvest_handle_auger_fixed: 6.07
    harvest_handle_auger_variable: 4.86
    labor: 56.42
    land_cash_rent_equivalent: 286.00

expected:
  seed_chemical_section_total_variable_usd_per_acre:
    value: 389.35
    label_as_printed: "Seed, Chemical, etc. — Total"
    composition_as_printed: "114.30 (seed) + 90.50 (N) + 41.76 (P) + 20.88 (K) + 6.41 (lime) + 47.00 (herbicide) + 18.00 (insecticide) + 16.20 (crop insurance) + 12.90 (misc) + 21.40 (interest) = 389.35"
  harvest_machinery_section_total:
    fixed_usd_per_acre: 64.55
    variable_usd_per_acre: 61.82
    label_as_printed: "Harvest Machinery — Total"
  total_fixed_usd_per_acre:
    value: 448.17
    label_as_printed: "Total fixed, variable — Per acre — Fixed"
    composition_as_printed: "41.20 (preharvest) + 64.55 (harvest) + 56.42 (labor) + 286.00 (land) = 448.17"
  total_variable_usd_per_acre:
    value: 478.58
    label_as_printed: "Total fixed, variable — Per acre — Variable"
    composition_as_printed: "27.40 (preharvest) + 389.35 (seed/chemical) + 61.82 (harvest) = 478.57, printed as 478.58 (1-cent rounding)"
  total_cost_per_acre:
    value: 926.75
    label_as_printed: "Total cost per acre"
    composition_as_printed: "448.17 + 478.58 = 926.75"
  total_cost_per_bushel:
    value: 4.83
    label_as_printed: "Total cost per bushel"
    composition_as_printed: "926.75 / 192 bu = 4.8268 -> 4.83"
  fixed_cost_per_bushel: 2.33
  variable_cost_per_bushel: 2.49

# no revenue is published in this source (page 1 states explicitly the
# figures "do not provide a margin for profit"), so only the cost build-up
# is checked
mapping:
  total_cost_per_acre: cost_of_sales

# HALF A CENT, deliberately tight (every cost figure prints to the cent,
# and the total reconciles EXACTLY from the 24 raw line items above, even
# though one intermediate subtotal — harvest-machinery variable — carries
# its own documented 1-cent gap that does not propagate into this total).
tolerance:
  abs: 0.005
  why: >
    every figure is printed to the cent, so half a cent is exactly the
    display rounding; the total re-sums exactly from the raw line items
    (926.75), so a gap beyond that would be real

notes: |
  Re-derived the full ladder by hand to check ISU's internal consistency (never trust a source's
  self-report without recomputing, per project convention). Everything ties out to the penny except
  one place:

    - Harvest Machinery variable total: 8.70+3.80+9.22+35.25+4.86 = 61.83 by my addition, but the
      table prints 61.82 (1-cent rounding, immaterial).
    - Every other subtotal (Seed/Chemical section $389.35, Harvest Machinery fixed $64.55, Total
      fixed $448.17, Total cost per acre $926.75, both per-bushel figures) reproduces EXACTLY from
      the printed line items.
    - The "Interest on preharvest variable costs" line ($21.40) is filed inside the "Seed, Chemical,
      etc." section, but its own base ($395.35) is NOT the sum of that section alone ($367.95) — it
      also folds in the separately-printed "Preharvest Machinery" variable cost ($27.40). This is a
      real bookkeeping quirk in the source (confirmed by reproducing $21.40 = $395.35 x 8.12% x
      8/12 exactly), not an error, but worth flagging because a naive "sum this section's rows"
      check would miss where the interest base actually comes from.

  THIS SOURCE PUBLISHES COSTS ONLY, NOT REVENUE OR MARGIN. Page 1 states explicitly: "The data
  reflect average cost of purchased inputs and a return to land and labor resources, but do not
  provide a margin for profit or a return to management." So `expected` here is a pure cost
  roll-up (line items -> total cost per acre -> cost per bushel), not a P&L; there is no gross
  margin or net-return figure to check because the source itself does not compute one. This gold
  therefore validates COST-BUILD arithmetic only.

  The same publication's page contains two other trend-yield columns (173 and 211 bu/acre) with
  the identical structure — useful for a sensitivity/robustness check against the same engine path
  if wanted later, not transcribed here to keep this gold to one mechanism/one case.

# Valuation, Exhibit 14.1 (ch. 14, pp. 313-314): trading multiples of eight specialty retailers,
# December 2009.
#
# For each retailer: market capitalization, debt and debt equivalents, gross
# enterprise value (the two together), net enterprise value (gross less
# nonoperating assets), and net enterprise value over next year's projected
# revenue, EBITDA and EBITA (p. 313). Under the table, the mean, median and
# deviation (standard deviation over median, the footnote says) of each
# multiple column.
#
# Translated as a calculation. Market capitalization, debt, net enterprise
# value and the three multiples are inputs: the nonoperating assets and the
# forward projections behind them are not printed. Gross enterprise value is
# computed per retailer; the statistics are computed with the pack's mean(),
# median() and stdev() (sample) over the printed multiples.
#
# The book's statistics come from unrounded multiples. The revenue multiples
# print to one decimal around 1, so their deviation computed from the printed
# figures (38.5) sits 0.4 from the printed 38.1. It is compared as computed and
# recorded as a book slip caused by input rounding.

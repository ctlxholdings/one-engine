# Valuation, Exhibit 12.2 (ch. 12, p. 277): Philips's enterprise value in October 2008.
#
# Two panels share the text lines. The left one adds to Philips's core
# operating value the stakes it holds in four associates and its excess cash
# to reach enterprise value. The right one shows where the largest stake, LG
# Display, comes from (pp. 276-277): the listed company's market value in won,
# converted to euros at the exchange rate, times Philips's 19.9% holding.
#
# Translated as a calculation. The LG Display stake is computed from the right
# panel (market value in won, exchange rate, holding) and compared with both
# printings of it (the right panel's ownership stake and the left panel's LG
# Display line); the euro market value is compared; the left panel's holding
# for LG Display is compared with the right panel's percent ownership.
# Enterprise value adds the computed LG Display stake to the other three
# stakes, the core operating value and excess cash as printed. The other three
# stakes come from market values the exhibit does not print, so they and their
# holdings are inputs only (the holdings enter no printed calculation).

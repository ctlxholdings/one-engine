set_aside:
  "EXHIBIT 6.16 Home Depot: Equity Cash Flow Summary": the exhibit's number
  "EXHIBIT 6.17 Home Depot: Cash-Flow-to-Equity Valuation": the exhibit's number
  "2006 2007 2008 2009 2010 2011": the column headings, years
case:
  case: valuation-chapter-6-home-depot-equity-cash-flow
  periods: 13
  phases: [operate]
  currency: USD
  floors: {}
  generators:
    book:
      kind: formulas
      periods: 13
      inputs: exhibit
      values: {}
    m:
      kind: valuation_formulas
      periods: 13
      inputs: exhibit
      values:
        # the cost of equity the continuing-value line discounts at: (1 + ke)^10 = 63,569 / 23,646
        ke: annualized(cv_value__12 / cv_pv__12 - 1, 10)
        year_m: year_1__3 + t - 3
        cfe_6_16: net_income + depreciation + amortization + working_capital + long_term_operating + nonoperating_assets
          + deferred_taxes + short_term_debt + long_term_debt
        # 2009-2011 from 6.16 (2009 less the nonoperating deferred taxes), later years as printed
        cfe_valued_m: "(cfe_6_16 - nonoperating_dtl_2009 if t <= 5 else cfe_4 + cfe_5 + cfe_6 + cfe_7 + cfe_8 + cfe_9 + cfe_10) if t >= 3 else 0"
        factor_m: "(1 + ke) ** (2 - t) if t >= 3 else 0"
        pv_m: cfe_valued_m * factor_m
        # the running total reaches the whole sum in the last year, where the summary lines are read
        pv_total_m: cumsum(pv_m) + cv_pv__12
        # from the printed total, as the book adds: the book's sum is the unrounded flows'
        equity_value_m: pv_total_printed__12 + midyear_amount__12
  contracts: {}
  rulebooks:
    # the 6.16 lines into cash as printed; dividends and repurchases out of cash as printed
    year:
      kind: transfer
      entity: company
      phase: operate
      declare: {cash: asset, net_income: income, depreciation: income, amortization: income, working_capital: asset,
                long_term_operating: asset, nonoperating_assets: asset, deferred_taxes: liability,
                short_term_debt: liability, long_term_debt: liability, dividends: equity, repurchases: equity}
      moves:
        net_income: {debit: cash, credit: net_income, amount: {generator: book, output: net_income}}
        depreciation: {debit: cash, credit: depreciation, amount: {generator: book, output: depreciation}}
        amortization: {debit: cash, credit: amortization, amount: {generator: book, output: amortization}}
        working_capital: {debit: cash, credit: working_capital, amount: {generator: book, output: working_capital}}
        long_term_operating: {debit: cash, credit: long_term_operating,
                              amount: {generator: book, output: long_term_operating}}
        nonoperating_assets: {debit: cash, credit: nonoperating_assets,
                              amount: {generator: book, output: nonoperating_assets}}
        deferred_taxes: {debit: cash, credit: deferred_taxes, amount: {generator: book, output: deferred_taxes}}
        short_term_debt: {debit: cash, credit: short_term_debt, amount: {generator: book, output: short_term_debt}}
        long_term_debt: {debit: cash, credit: long_term_debt, amount: {generator: book, output: long_term_debt}}
        dividends: {debit: dividends, credit: cash, amount: {generator: book, output: dividends}}
        repurchases: {debit: repurchases, credit: cash, amount: {generator: book, output: repurchases}}
  schemes:
    flows:
      net_income: gross_cash_flow
      depreciation: gross_cash_flow
      amortization: gross_cash_flow
      working_capital: to_equity
      long_term_operating: to_equity
      nonoperating_assets: to_equity
      deferred_taxes: to_equity
      short_term_debt: to_equity
      long_term_debt: to_equity
      dividends: equity_holders
      repurchases: equity_holders
  cuts:
    gross_cash_flow: {entity: company, account: cash, scheme: flows, include: [gross_cash_flow]}
    cash_flow_to_equity: {entity: company, account: cash, scheme: flows, include: [gross_cash_flow, to_equity]}
    to_equity_holders: {entity: company, account: cash, scheme: flows, include: [equity_holders]}
  measures: {}
figures:
  gross_cash_flow: {cut: gross_cash_flow}
  cash_flow_to_equity: {cut: cash_flow_to_equity}
  # what leaves the pool for equity holders is printed positive
  cash_flow_to_equity_again: {cut: to_equity_holders, sign: -1}

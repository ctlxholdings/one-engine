# Valuation, Exhibits 6.16-6.17 (ch. 6, pp. 128-129): Home Depot's cash flow to equity, and the
# equity valued by discounting it.
#
# 6.16 builds cash flow to equity for 2006-2011 (case periods 0-5) from net income: depreciation and
# amortization added back give gross cash flow; the investments in working capital, long-term
# operating assets and nonoperating assets, the change in deferred taxes and the new short- and
# long-term debt take it to cash flow to equity, which is reconciled with dividends plus net share
# repurchases (p. 127). The lines are inputs; the case books them as one pool of cash, as 6.6 does
# (each line a transfer into cash, as printed, from an account of its own; dividends and
# repurchases out of cash to equity holders), and compares gross cash flow and both printings of
# cash flow to equity as cuts of the cash account by the class of the other account.
# 6.17 discounts cash flow to equity for 2009-2018 (case periods 3-12) and a continuing value at the
# cost of equity:
#   * 2009-2011 are 6.16's forecast years, compared with them; 2009 leaves out the $111 million
#     change in nonoperating deferred tax liabilities (6.17's footnote, read as an input). 2012-2018
#     are inputs.
#   * The rate. The heading prints the cost of equity rounded (10.4%); as in 6.4 the rate is read,
#     with the pack's annualized, from the continuing-value line (63,569 discounted to 23,646 over
#     ten years), and each factor and present value, the continuing value's factor and their total
#     are computed from it and compared.
#   * The midyear adjustment amount, 2,597, is Exhibit 6.4's (value of operations 65,291 less the
#     62,694 before the adjustment), which the book adds here so the equity values tie; half a year
#     at the cost of equity on 43,436 would be about 2,200. It is an input, and equity value is the
#     printed present value plus it, compared (rebuilt from the rounded flows the present value is
#     43,436.06, which would put the sum 1.06 above the printed 46,032; the book's own two lines add
#     to 46,033).
#   * The years in the first column are compared with the first year plus the period.

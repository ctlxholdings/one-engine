inputs: [revenues, expenses, rental, interest, taxes, lease_value, short_term_assets_today, long_term_assets,
         operating_liabilities, debt, equity_today, lease_depreciation, market_equity, cf_equity, u_fcf_year3,
         u_dcf_year3, a_fcf_year3, a_dcf_year3]
not_compared:
  revenues_today: the prior year's revenues; the exhibits print none of that year's other lines and nothing is computed from it
set_aside:
  "EXHIBIT 27.1 Leasing Example: Financial Statements": the exhibit's number
  "EXHIBIT 27.2 Leasing Example: NOPLAT Calculation": the exhibit's number
  "EXHIBIT 27.3 Leasing Example: Invested Capital Calculation": the exhibit's number
  "EXHIBIT 27.4 Leasing Example: Current Capital Structure": the exhibit's number
  "EXHIBIT 27.6 Leasing Example: Free Cash Flow and Equity Valuation": the exhibit's number
  "Today Year 1 Year 2 Year 3 Today Year 1 Year 2 Year 3": the column headings, years
  "Year 1 Year 2 Year 3 Year 1 Year 2 Year 3": the column headings, years
case:
  case: valuation-leasing-example
  periods: 4
  phases: [operate]
  currency: USD
  floors: {}
  generators:
    m:
      kind: valuation_formulas
      periods: 4
      inputs: exhibit
      values:
        ebt_m: revenues + expenses + rental + interest
        # the effective rate, each year: taxes over earnings before taxes (printed negative)
        tax_rate: "-taxes / ebt_m if t > 0 else 0"
        # the interest inside the rental: the rental less the lease depreciation (both printed negative)
        lease_interest: lease_depreciation - rental
        after_tax_lease_interest: lease_interest * (1 - tax_rate)
        long_term_move: "(long_term_assets - lag(long_term_assets, 1)) if t > 0 else 0"
        liabilities_move: "(operating_liabilities - lag(operating_liabilities, 1)) if t > 0 else 0"
        debt_move: "(debt - lag(debt, 1)) if t > 0 else 0"
        lease_move: "(lease_value - lag(lease_value, 1)) if t > 0 else 0"
        # the rate each side discounts at, as its own year-3 line implies
        u_rate: annualized(u_fcf_year3__3 / u_dcf_year3__3 - 1, 3)
        a_rate: annualized(a_fcf_year3__3 / a_dcf_year3__3 - 1, 3)
        u_factor: (1 + u_rate) ** t
        a_factor: (1 + a_rate) ** t
        one: 1
  opening:
    company:
      short_term_assets: {nature: asset, value: {generator: m, output: short_term_assets_today__0}}
      long_term_assets: {nature: asset, value: {generator: m, output: long_term_assets__0}}
      operating_liabilities: {nature: liability, value: {generator: m, output: operating_liabilities__0}}
      debt: {nature: liability, value: {generator: m, output: debt__0}}
      equity: {nature: equity, value: {generator: m, output: equity_today__0}}
      lease_asset: {nature: asset, value: {generator: m, output: lease_value__0}}
      lease_debt: {nature: liability, value: {generator: m, output: lease_value__0}}
  contracts: {}
  rulebooks:
    # each amount signed: a positive one debits the first account, a negative one is reversed
    year:
      kind: transfer
      entity: company
      phase: operate
      declare: {revenue: income, expenses: expense, rental: expense, interest: expense, tax_expense: expense}
      moves:
        revenues: {debit: short_term_assets, credit: revenue, amount: {generator: m, output: revenues}}
        expenses: {debit: short_term_assets, credit: expenses, amount: {generator: m, output: expenses}}
        rental: {debit: short_term_assets, credit: rental, amount: {generator: m, output: rental}}
        interest: {debit: short_term_assets, credit: interest, amount: {generator: m, output: interest}}
        taxes: {debit: short_term_assets, credit: tax_expense, amount: {generator: m, output: taxes}}
        long_term_assets: {debit: long_term_assets, credit: short_term_assets, amount: {generator: m, output: long_term_move}}
        operating_liabilities: {debit: short_term_assets, credit: operating_liabilities,
                                amount: {generator: m, output: liabilities_move}}
        debt: {debit: short_term_assets, credit: debt, amount: {generator: m, output: debt_move}}
        dividends: {debit: equity, credit: short_term_assets, amount: {generator: m, output: cf_equity}}
        leases: {debit: lease_asset, credit: lease_debt, amount: {generator: m, output: lease_move}}
  schemes:
    reported:
      short_term_assets: operating_current_asset
      long_term_assets: operating_long_term
      operating_liabilities: operating_current_liability
      debt: debt
      equity: equity
      # off the reported balance sheet: the pair cancels among the equity equivalents
      lease_asset: equity_equivalent
      lease_debt: equity_equivalent
      revenue: revenue
      expenses: operating_cost
      rental: operating_cost
      interest: interest
      tax_expense: tax
    adjusted:
      short_term_assets: operating_current_asset
      long_term_assets: operating_long_term
      operating_liabilities: operating_current_liability
      debt: debt
      equity: equity
      lease_asset: operating_long_term
      lease_debt: debt_equivalent
      revenue: revenue
      expenses: operating_cost
      rental: operating_cost
      interest: interest
      tax_expense: tax
  cuts: {}
  lenses:
    u:
      kind: valuation
      entity: company
      scheme: reported
      marginal_tax_rate: {generator: m, output: tax_rate}
      roic_on: opening
    a:
      kind: valuation
      entity: company
      scheme: adjusted
      marginal_tax_rate: {generator: m, output: tax_rate}
      roic_on: opening
      ebita_adjustments:
        lease_interest: {generator: m, output: lease_interest}
  measures:
    u_value: {measure: npv, cut: u.fcf, rate: {generator: m, output: u_rate}}
    a_value: {measure: npv, cut: a.fcf, rate: {generator: m, output: a_rate}}
figures:
  # 27.1
  operating_income: {change: revenue - expenses - rental}
  ebt: {change: revenue - expenses - rental - interest}
  net_income: {cut: u.net_income}
  rental_disclosed: {change: rental}
  short_term_assets: {balance: short_term_assets}
  operating_assets: {balance: short_term_assets + long_term_assets}
  equity: {balance: equity + revenue - expenses - rental - interest - tax_expense}
  liabilities_and_equity: {balance: operating_liabilities + debt + equity + revenue - expenses - rental - interest - tax_expense}
  # 27.2, left
  u_revenues: {cut: u.revenue}
  u_operating_expenses: {change: expenses, sign: -1}
  u_rental: {change: rental, sign: -1}
  u_operating_income: {cut: u.ebita}
  u_operating_taxes: {cut: u.operating_taxes, sign: -1}
  u_noplat: {cut: u.noplat}
  u_net_income: {cut: u.net_income}
  u_after_tax_interest: {cut: u.after_tax_interest}
  u_rec_noplat: {sum: [{cut: u.net_income}, {cut: u.after_tax_interest}]}
  u_roic: {cut: u.roic}
  # 27.2, right
  a_revenues: {cut: a.revenue}
  a_operating_expenses: {change: expenses, sign: -1}
  a_operating_income: {cut: a.adjusted_ebita}
  a_operating_taxes: {cut: a.operating_taxes, sign: -1}
  a_noplat: {cut: a.noplat}
  a_net_income: {cut: a.net_income}
  a_after_tax_interest: {cut: a.after_tax_interest}
  a_after_tax_lease_interest: {driver: m.after_tax_lease_interest}
  a_rec_noplat: {sum: [{cut: a.net_income}, {cut: a.after_tax_interest}, {driver: m.after_tax_lease_interest}]}
  a_roic: {cut: a.roic}
  # 27.3
  u_operating_assets: {balance: short_term_assets + long_term_assets}
  u_operating_liabilities: {balance: operating_liabilities, sign: -1}
  u_invested_capital: {cut: u.invested_capital}
  u_debt: {balance: debt}
  u_equity: {balance: equity + revenue - expenses - rental - interest - tax_expense}
  u_src_invested_capital: {cut: u.total_funds_sources}
  a_operating_assets: {balance: short_term_assets + long_term_assets}
  a_capitalized_leases: {balance: lease_asset}
  a_adjusted_operating_assets: {balance: short_term_assets + long_term_assets + lease_asset}
  a_operating_liabilities: {balance: operating_liabilities, sign: -1}
  a_invested_capital: {cut: a.invested_capital}
  a_debt: {balance: debt}
  a_src_capitalized_leases: {balance: lease_debt}
  a_equity: {balance: equity + revenue - expenses - rental - interest - tax_expense}
  a_src_invested_capital: {cut: a.total_funds_sources}
  # 27.4: debt at book value, equity at market value, today
  u_debt_value: {balance: debt}
  u_debt_weight: {ratio: [{balance: debt, at: 0}, {sum: [{balance: debt}, {driver: m.market_equity}], at: 0}]}
  a_debt_value: {balance: debt}
  a_debt_weight: {ratio: [{balance: debt, at: 0}, {sum: [{balance: debt + lease_debt}, {driver: m.market_equity}], at: 0}]}
  u_equity_weight: {ratio: [{driver: m.market_equity, at: 0}, {sum: [{balance: debt}, {driver: m.market_equity}], at: 0}]}
  a_market_equity: {driver: m.market_equity}
  a_equity_weight: {ratio: [{driver: m.market_equity, at: 0}, {sum: [{balance: debt + lease_debt}, {driver: m.market_equity}], at: 0}]}
  u_enterprise_value: {sum: [{balance: debt}, {driver: m.market_equity}]}
  u_total_weight: {ratio: [{sum: [{balance: debt}, {driver: m.market_equity}], at: 0}, {sum: [{balance: debt}, {driver: m.market_equity}], at: 0}]}
  a_lease_value: {balance: lease_debt}
  a_lease_weight: {ratio: [{balance: lease_debt, at: 0}, {sum: [{balance: debt + lease_debt}, {driver: m.market_equity}], at: 0}]}
  a_enterprise_value: {sum: [{balance: debt + lease_debt}, {driver: m.market_equity}]}
  a_total_weight: {ratio: [{sum: [{balance: debt + lease_debt}, {driver: m.market_equity}], at: 0}, {sum: [{balance: debt + lease_debt}, {driver: m.market_equity}], at: 0}]}
  # 27.5: the rates 27.6 discounts at
  u_wacc: {driver: m.u_rate}
  a_wacc: {driver: m.a_rate}
  # 27.6, left
  u_fcf_noplat: {cut: u.noplat}
  u_net_investment: {cut: u.net_investment, sign: -1}
  u_fcf: {cut: u.fcf}
  u_rec_after_tax_interest: {cut: u.after_tax_interest}
  u_cf_debt: {change: debt, sign: -1}
  u_rec_fcf: {sum: [{cut: u.after_tax_interest}, {change: debt, sign: -1}, {change: equity, sign: -1}]}
  u_discount_factor: {driver: m.u_factor}
  u_dcf: {cut: u.fcf, per: m.u_factor}
  u_value: {ratio: [{measure: u_value}, {driver: m.one}]}
  u_val_debt: {balance: debt, sign: -1}
  u_equity_value: {sum: [{ratio: [{measure: u_value}, {driver: m.one}]}, {balance: debt, sign: -1}]}
  # 27.6, right
  a_fcf_noplat: {cut: a.noplat}
  a_net_investment: {cut: a.net_investment, sign: -1}
  a_fcf: {cut: a.fcf}
  a_rec_after_tax_interest: {cut: a.after_tax_interest}
  a_rec_after_tax_lease_interest: {driver: m.after_tax_lease_interest}
  a_cf_debt: {change: debt, sign: -1}
  a_cf_lease_debt: {change: lease_debt, sign: -1}
  a_cf_equity: {change: equity, sign: -1}
  a_rec_fcf: {sum: [{cut: a.after_tax_interest}, {driver: m.after_tax_lease_interest}, {change: debt, sign: -1},
                    {change: lease_debt, sign: -1}, {change: equity, sign: -1}]}
  a_discount_factor: {driver: m.a_factor}
  a_dcf: {cut: a.fcf, per: m.a_factor}
  a_value: {ratio: [{measure: a_value}, {driver: m.one}]}
  a_val_debt: {balance: debt, sign: -1}
  a_val_leases: {balance: lease_debt, sign: -1}
  a_equity_value: {sum: [{ratio: [{measure: a_value}, {driver: m.one}]}, {balance: debt + lease_debt, sign: -1}]}

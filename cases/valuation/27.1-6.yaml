# Valuation, Exhibits 27.1-27.6 (ch. 27, pp. 578-582): the leasing example, its statements, NOPLAT and
# invested capital with and without capitalized operating leases, its capital structure, WACC and DCF.
#
# The hypothetical company (p. 578) leases most of its assets and liquidates
# in year 3 (periods 0-3: today, years 1-3). Exhibit 27.1 prints its income
# statement, balance sheet and the value of its operating leases; 27.2 and
# 27.3 reorganize NOPLAT and invested capital, left as reported, right with
# the leases capitalized; 27.4 the capital structure today; 27.5 the two
# WACCs; 27.6 free cash flow and the equity valuation, both ways.
# The company is booked:
#   * today's balance sheet is the opening balance sheet, with the leased
#     assets (27.1's supplemental value of operating leases) booked as an
#     asset financed by a lease debt of the same amount;
#   * each year posts the income statement as printed against short-term
#     assets, moves long-term assets, operating liabilities and debt to their
#     printed balances against short-term assets, pays the cash flows to
#     equity that 27.6 prints as dividends, and moves the lease asset and its
#     debt to the year's value. Short-term assets and equity are what the
#     postings leave, compared with the print; in year 3 everything winds up.
#   * Two valuation lenses read the one book: `u` as reported (the lease
#     asset and its debt are an equity equivalent pair that cancels), and `a`
#     with the lease asset operating capital and the lease debt a debt
#     equivalent, the lease interest added back to EBITA. The lease interest
#     is the rental expense less the lease depreciation 27.2 prints (the 5%
#     rate behind it is in the text only, p. 580).
#   * The tax rate is each year's taxes over earnings before taxes. The
#     company has no nonoperating items and books everything at home, so its
#     effective rate is its marginal rate; the 25% the text states (p. 581)
#     is not printed.
#   * 27.6 discounts at the rate its own year-3 line implies (free cash flow
#     over discounted cash flow, annualized over three years): the printed
#     WACCs of 27.5 are rounded, the book discounts unrounded. Those rates
#     are compared with 27.5's 10.1% and 6.3%; the value of operations is the
#     npv measure over each lens's free cash flow.
excerpt: "27.1-6"
periods: [0, 1, 2, 3]
entity: company
plant: revenues
notes: >-
  The text extraction breaks two labels over lines ("Value of operating" / "leases1", "Capitalized" /
  "operating leases", "Adjusted operating" / "assets"); each is read by the line that holds its numbers.
  Exhibit 27.5 prints its weights and rates inside parentheses ("value at 12.0%)"); the reader takes
  those tokens for words, so the weighted averages themselves are not computed here.

# Valuation, Exhibit 6.15 (ch. 6, p. 126): Home Depot's forecast interest tax shields.
#
# Each year's interest is the prior year's net debt (debt plus capitalized operating leases less
# excess cash) times the expected interest rate, and the tax shield is that interest times the
# marginal tax rate (p. 125); the last line is the continuing-value year, 2019. Case periods 1-10 are
# 2009-2018 and period 11 the continuing-value line.
#   * The rate column prints the yield rounded to a tenth (6.8%), while the book multiplies by the
#     unrounded yield (6.8% of 19,732 would be 1,342, not the 1,337 printed). So the interest
#     payments are inputs and each printed rate is compared with interest over prior-year net debt.
#   * The tax shield is the interest times the marginal tax rate, computed and compared on every
#     line; the rate is read from the 2009 line and each later printing is compared with it.
#   * The years in the first column are compared with the first year plus the period.
# Built with the valuation_formulas generator.

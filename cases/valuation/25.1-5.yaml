# Valuation, Exhibits 25.1-25.5 (ch. 25, pp. 544-548): the chapter's global company, its taxes by geography,
# and three ways to estimate its operating taxes.
#
# The five exhibits print one hypothetical company for one year (period 0):
#   * 25.1 its internal income statement by column: a domestic subsidiary, a
#     foreign one, and two columns of tax credits (ongoing R&D credits, one-time
#     credits), beside the company total;
#   * 25.2 its operating taxes and NOPLAT by the same columns;
#   * 25.3 the company income statement as published, with the tax
#     reconciliation table in percent of earnings before taxes;
#   * 25.4 the comprehensive estimate of operating taxes from published data;
#   * 25.5 the two simple estimates (nonoperating items all domestic, or spread
#     like profits).
# Here the company is booked from 25.1 alone. Every cell of 25.1's four
# columns above the tax line is a posting to its own account (a dash posts
# nil), against cash. Each subsidiary's taxes are not taken from the print:
# they are its statutory rate (25.1's rate row) on its earnings before taxes;
# the two credit columns post the credits 25.1 prints (their rate is nil).
# Everything else the five exhibits print is read back and compared: each
# column's subtotals from its accounts, the company column from the valuation
# lens, and the estimates of 25.3-25.5 as the book computes them from the
# booked lines: the reconciliation percentages are tax amounts over the
# company's earnings before taxes; the shields are the line times the rate
# of the place it is booked (amortization and interest domestic, the gain
# foreign, as the text on p. 547 places them).
# The lens taxes EBITA at the domestic rate, and carries the foreign rate
# difference and the R&D credits as other operating taxes (step 3 of ch. 7):
# that is how 25.2 builds the company's operating taxes.
excerpt: "25.1-5"
periods: [0]
entity: company
plant: ebita_d
notes: >-
  Dashes for a rate the book does not print (the company's statutory rate, each column's effective and
  operating tax rate) are read and not compared, with the reason. Every dash for an amount is a nil
  posting or a nil compared.

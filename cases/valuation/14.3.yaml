# Valuation, Exhibit 14.3 (ch. 14, pp. 317-318): how leverage moves the P/E of companies with the same
# EV-to-EBITA multiple.
#
# Four companies with the same EBITA. A and B have the same enterprise value
# (10 times EBITA) and C and D another (25 times); within each pair only the
# financing differs: B and D carry debt and pay interest. Leverage lowers the
# P/E of the pair whose EV/EBITA is below the debt's value-to-interest multiple
# and raises it for the pair above it (pp. 317-318).
#
# Translated as a calculation: EBITA, interest, taxes and the market values of
# debt and equity are inputs (the exhibit prints taxes but no rate). Earnings
# before taxes, net income, enterprise value and both multiples are computed
# and compared.

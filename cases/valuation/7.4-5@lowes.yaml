  nonconsolidated_investments: {label: Nonconsolidated investments, skip: 3}
  tax_loss_carryforwards: {label: Tax loss carry-forwards3, skip: 3}
  total_funds_invested: {label: Total funds invested, skip: 3}
  # 7.5, sources
  src_short_term_debt: {label: Short-term debt, occurrence: 2, skip: 3}
  src_long_term_debt: {label: Long-term debt, occurrence: 2, skip: 3}
  src_operating_leases: {label: Capitalized operating leases1, occurrence: 2, skip: 3}
  debt_and_equivalents: {label: Debt and debt equivalents, skip: 3}

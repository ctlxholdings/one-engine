  repeat_invested_capital: {label: Invested capital, occurrence: 2, skip: 3}
inputs: [cash, receivables, inventories, short_term_dta, other_current_assets, ppe, goodwill, notes_receivable,
         equity_investments, acquired_intangibles, long_term_dta, other_assets, short_term_debt, accounts_payable,
         accrued_salaries, deferred_revenue, short_term_dtl, other_accrued, long_term_debt, deferred_income_taxes,
         other_long_term_liabilities, common_stock, retained_earnings, aoci, treasury_stock,
         operating_leases, cumulative_amortization, operating_deferred_taxes, tax_loss_carryforwards]
set_aside:
  "1 Capitalized operating lease adjustments are detailed in Exhibit 7.14.": a footnote pointing to another exhibit; its number is the exhibit's
  "2 Goodwill and cumulative amortization adjustments are detailed in Exhibit 7.6.": a footnote pointing to another exhibit; its number is the exhibit's
  "3 Deferred tax adjustments are detailed in Exhibit 7.8.": a footnote pointing to another exhibit; its number is the exhibit's
  "EXHIBIT 7.4 Home Depot and Lowe’s: Historical Balance Sheets": the exhibit's number
  "EXHIBIT 7.5 Home Depot and Lowe’s: Invested Capital Calculations": the exhibit's number
  "2006 2007 2008 2006 2007 2008": the column headings, years
case:
  case: valuation-chapter-7-lowes
  periods: 3
  phases: [state]
  currency: USD
  floors: {}

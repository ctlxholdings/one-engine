# Valuation, Exhibits 7.4-7.5 (ch. 7, pp. 140-141), Lowe's: the balance sheets, then invested capital.
#
# The same translation as 7.4-5@home_depot (whose header explains the booking),
# reading Lowe's three columns: every row skips Home Depot's three. Lowe's
# reports no receivables, goodwill, acquired intangibles, equity investments,
# long-term deferred tax assets, short-term deferred tax liabilities or
# treasury stock; the book prints a dash for each, read as nil. Its tax loss
# carry-forwards are printed negative, and read so.
excerpt: "7.4-5"
periods: [0, 1, 2]
entity: company
columns_of: [home_depot]
plant: inventories
notes: >-
  As for Home Depot, the text extraction repeats the two invested-capital totals after the footnotes;
  both repeats are read and compared like the rows they repeat.
rows:
  # 7.4, assets
  cash: {label: Cash and cash equivalents, skip: 3}
  receivables: {label: "Receivables, net", skip: 3}
  inventories: {label: Merchandise inventories, skip: 3}
  short_term_dta: {label: Short-term deferred tax assets, skip: 3}
  other_current_assets: {label: Other current assets, skip: 3}
  total_current_assets: {label: Total current assets, skip: 3}

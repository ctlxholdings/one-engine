  ic_inventories: {label: Merchandise inventories, occurrence: 2, skip: 3}
  ic_other_current_assets: {label: Other current assets, occurrence: 2, skip: 3}
  operating_current_assets: {label: Operating current assets, skip: 3}
  ic_accounts_payable: {label: Accounts payable, occurrence: 2, skip: 3}
  ic_accrued_salaries: {label: Accrued salaries, occurrence: 2, skip: 3}
  ic_deferred_revenue: {label: Deferred revenue, occurrence: 2, skip: 3}
  ic_other_accrued: {label: Other accrued expenses, occurrence: 2, skip: 3}
  operating_current_liabilities: {label: Operating current liabilities, skip: 3}
  operating_working_capital: {label: Operating working capital, skip: 3}
  ic_ppe: {label: Net property and equipment, occurrence: 2, skip: 3}
  operating_leases: {label: Capitalized operating leases1, skip: 3}
  other_long_term_net: {label: "Other long-term assets, net of liabilities", skip: 3}
  invested_capital_ex_goodwill: {label: Invested capital (excluding goodwill and acquired intangibles), skip: 3}
  goodwill_and_intangibles: {label: Goodwill and acquired intangibles, skip: 3}

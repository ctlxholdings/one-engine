# Valuation, Exhibit 13.9 (ch. 13, p. 308): what ConsumerCo publishes by business unit.
#
# The segment disclosure typical of a U.S. listed company (p. 308): revenues,
# intersegment revenues, operating profit, depreciation (inside operating
# profit, the footnote says), capital expenditures and assets for each of the
# three business units and the corporate center, with the consolidated total.
# Here the consolidated column is the plain sum of the four (intersegment
# revenues included: the disclosure adds them up rather than eliminating them).
#
# Translated as a calculation: the four units' cells are inputs and each
# consolidated figure is computed as their sum and compared.

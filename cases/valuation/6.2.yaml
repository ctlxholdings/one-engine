# Valuation, Exhibit 6.2 (ch. 6, p. 105): enterprise value and equity value of a single-business
# company.
#
# The diagram prints five years of free cash flow split into the after-tax flows to debt holders and
# the flows to equity holders, and the values each stream is worth: enterprise value $427.5 million
# (printed twice) is debt $200.0 million plus equity $227.5 million (pp. 104-105). The bars' labels
# come out of the extraction one panel at a time and are paired here by their numbers: the
# debt-holder bars (lines 2-6) and the equity-holder bars (lines 8-9) are read in year order, and each
# year's free cash flow bar (lines 1, 10-12) is their sum. The diagram prints no discount rate, so
# the present values cannot be rebuilt; what it states is the split, and that is what is checked:
# each free cash flow bar is the two flows added, and enterprise value is debt value plus equity
# value. Periods 1-5 are the bars' years; the values sit at period 0. Built with the
# valuation_formulas generator.

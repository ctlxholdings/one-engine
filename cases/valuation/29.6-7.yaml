set_aside:
  "EXHIBIT 29.6 DCF under Inflation: Operational and Financial Assumptions": the exhibit's number
  "Real growth rate (percent) 2– 2222": the extraction glued the row's cells ("2–", "2222"); the real growth is taken from the real revenues and compared through them
  "Lifetime of net PP&E ––––5 . . . –": the extraction glued the row's cells ("––––5"); the lifetime is taken from year-1 depreciation over opening net PP&E and compared through every later year's depreciation
case:
  case: valuation-inflation-real-and-nominal
  periods: 26
  phases: [operate]
  currency: USD
  floors: {}
  generators:
    m:
      kind: valuation_formulas
      periods: 26
      inputs: exhibit
      values:
        nil: 0
        year_m: t
        forecast: "1 if t >= 2 else 0"
        # step 1, real operations
        r1: r_revenues_12__1
        g: r_revenues_12__2 / r_revenues_12__1 - 1
        rev_r: "r1 * (1 + g) ** (t - 1) if t >= 1 else 0"
        ebitda_r: r_ebitda_1__1 / r1 * rev_r
        w: nwc_ratio_1__1
        pr: ppe_ratio_1__1
        ppe0: ppe_beginning_r_1__1
        # depreciation per unit of opening net PP&E: one over the asset lifetime
        d: -depreciation_r_1__1 / ppe0
        ppe_end_r: pr * rev_r
        ppe_beg_r: "(ppe0 if t == 1 else lag(ppe_end_r, 1)) if t >= 1 else 0"
        dep_r: d * ppe_beg_r
        capex_r: ppe_end_r - ppe_beg_r + dep_r
        nwc_r: w * rev_r
        nwc0: w * r1
        # inflation: year 2's rate, then year 3's for every later year
        infl_m: "inflation_2__2 if t == 2 else (inflation_3__3 if t >= 3 else 0)"
        ix: "(1 + inflation_2__2) * (1 + inflation_3__3) ** (t - 2) if t >= 2 else 1"
        # step 2, nominal statements
        rev_n: rev_r * ix
        ebitda_n: ebitda_r * ix
        capex_n: capex_r * ix
        # nominal net PP&E rolls forward as closing = (1 - d) x opening + capex: the closed form of that
        q: 1 - d
        capex_scaled: "capex_n * q ** (-t)"
        ppe_end_n: "q ** t * (ppe0 + cumsum(capex_scaled)) if t >= 1 else ppe0"
        ppe_beg_n: "lag(ppe_end_n, 1) if t >= 1 else 0"
        dep_n: d * ppe_beg_n
        nwc_n: w * rev_n
        nwc_inv_n: "nwc_n - (lag(nwc_n, 1) if t >= 2 else nwc0) if t >= 1 else 0"
        tax_rate: tax_1__1
        ebita_n: ebitda_n - dep_n
        noplat_n: ebita_n * (1 - tax_rate)
        fcf_n: "noplat_n + dep_n - capex_n - nwc_inv_n if t >= 2 else 0"
        ic_n: ppe_end_n + nwc_n
        # step 3, real taxes deflated from nominal ones
        ebita_r: ebitda_r - dep_r
        tax_r: tax_rate * ebita_n / ix
        noplat_r: ebita_r - tax_r
        # step 4, real FCF with the monetary loss on last year's working capital
        nwc_inv_r: "nwc_r - lag(nwc_r, 1) + lag(nwc_r, 1) * (1 - lag(ix, 1) / ix) if t >= 2 else 0"
        fcf_r: "noplat_r + dep_r - capex_r - nwc_inv_r if t >= 2 else 0"
        ic_r: ppe_end_r + nwc_r
        # 29.6's printed assumption rows, and 29.7's ratios
        r_ebitda_share: r_ebitda_1__1 / r1
        nwc_ratio_m: w
        ppe_ratio_m: pr
        ppe_rev_r: "ppe_end_r / rev_r if t >= 2 else 0"
        ppe_rev_n: "ppe_end_n / rev_n if t >= 2 else 0"
        nwc_rev_r: "nwc_r / rev_r if t >= 2 else 0"
        nwc_rev_n: "nwc_n / rev_n if t >= 2 else 0"
        roic_r: "noplat_r / lag(ic_r, 1) if t >= 2 else 0"
        roic_n: "noplat_n / lag(ic_n, 1) if t >= 2 else 0"
        fcf_growth_r: "fcf_r / lag(fcf_r, 1) - 1 if t >= 3 else 0"
        fcf_growth_n: "fcf_n / lag(fcf_n, 1) - 1 if t >= 3 else 0"
        tax_m: tax_rate
        # step 5, discount rates and factors from year 1
        wr: wacc_r_2__2
        wacc_r_m: "wr if t >= 2 else 0"
        wacc_n_m: "(1 + wr) * (1 + infl_m) - 1 if t >= 2 else 0"
        pvf_r: "(1 + wr) ** (1 - t) if t >= 2 else 0"
        pvf_n: pvf_r / ix
        # continuing value at the horizon, perpetuity growth and inflation as from year 3
        i_cv: inflation_3__3
        g_n: (1 + g) * (1 + i_cv) - 1
        last: "1 if t == horizon__25 else 0"
        cv_vd_n: "value_driver(noplat_n * (1 + g_n), g_n, roic_n, wacc_n_m) if t == horizon__25 else 0"
        g_adj: "g + nwc_r / ic_r * i_cv / (1 + i_cv) if t >= 1 else 0"
        cv_vd_r: "noplat_r * (1 + g) * (1 - g_adj / roic_r) / (wr - g) if t == horizon__25 else 0"
        cv_perp_n: "growing_perpetuity(fcf_n * (1 + g_n), wacc_n_m, g_n) if t == horizon__25 else 0"
        cv_perp_r: "growing_perpetuity(fcf_r * (1 + g), wr, g) if t == horizon__25 else 0"
        pv_flow_r: fcf_r * pvf_r + cv_vd_r * pvf_r
        pv_flow_n: fcf_n * pvf_n + cv_vd_n * pvf_n
        dcf_r: cumsum(pv_flow_r)
        dcf_n: cumsum(pv_flow_n)
        # the postings: nothing happens before year 1
        rev_post: "rev_n if t >= 1 else 0"
        costs_post: "rev_n - ebitda_n if t >= 1 else 0"
        capex_post: "capex_n if t >= 1 else 0"
        equity0: ppe0 + nwc0
  opening:
    company:
      net_ppe: {nature: asset, value: {generator: m, output: ppe0}}
      nwc: {nature: asset, value: {generator: m, output: nwc0}}
      equity: {nature: equity, value: {generator: m, output: equity0}}
  contracts: {}
  rulebooks:
    year:
      kind: transfer
      entity: company
      phase: operate
      declare: {cash: asset, revenue: income, operating_costs: expense, depreciation: expense}
      moves:
        sales: {debit: cash, credit: revenue, amount: {generator: m, output: rev_post}}
        costs: {debit: operating_costs, credit: cash, amount: {generator: m, output: costs_post}}
        depreciation: {debit: depreciation, credit: net_ppe, amount: {generator: m, output: dep_n}}
        capex: {debit: net_ppe, credit: cash, amount: {generator: m, output: capex_post}}
        working_capital: {debit: nwc, credit: cash, amount: {generator: m, output: nwc_inv_n}}
  schemes:
    valuation:
      cash: nonoperating_asset
      net_ppe: operating_long_term
      nwc: operating_current_asset
      equity: equity
      revenue: revenue
      operating_costs: operating_cost
      depreciation: depreciation
    cash_flow:
      revenue: operating
      operating_costs: operating
      net_ppe: investing
      nwc: working
  cuts:
    investing: {entity: company, account: cash, scheme: cash_flow, include: [investing]}
    working: {entity: company, account: cash, scheme: cash_flow, include: [working]}
  lenses:
    v:
      kind: valuation
      entity: company
      scheme: valuation
      marginal_tax_rate: {generator: m, output: tax_rate}
      roic_on: opening
  measures: {}

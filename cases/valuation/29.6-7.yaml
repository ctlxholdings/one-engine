# Valuation, Exhibits 29.6 and 29.7 (ch. 29, pp. 613-615): one company valued under high inflation
# twice, in real and in nominal terms, from one set of assumptions (29.6), to the same DCF value (29.7).
#
# The model (pp. 612-617, steps 1-5): real revenues grow at a constant real rate from year 1; real
# EBITDA, net working capital and real net PP&E are constant shares of real revenues; depreciation is a
# fixed share of the year's opening net PP&E (the asset lifetime), and capex is what takes net PP&E
# from its opening to its closing. Year 1 is the base year (the forecast runs from year 2; the
# exhibit prints its FCF, ratios and discount factor as dashes): net PP&E opens year 1 at its printed
# 400 and working capital at its year-1 level. Nominal revenues, EBITDA and capex are the real ones
# times the inflation index; nominal net PP&E rolls forward from the same opening with nominal capex
# and depreciation; nominal working capital is the same share of nominal revenues. Taxes are the tax
# rate on nominal EBITA; real taxes are the nominal ones deflated (step 3), and the real investment in
# working capital adds the monetary loss on last year's working capital, NWC(t-1) x (1 - IX(t-1)/IX(t))
# (step 4). The nominal WACC compounds the real WACC with inflation (step 5); each year's discount
# factor runs from year 1. The continuing value at year 25 uses NOPLAT of year 25 grown one year and
# year 25's ROIC as the return on new capital: the nominal one is the pack's value_driver; the real
# one is the book's adjusted formula (p. 617), whose growth in the numerator adds the monetary loss
# share NWC/IC x i/(1 + i) to real growth (the sign the FCF identity on p. 617 gives, and the only one
# that reproduces 2,891; the text extraction of the formula reads it as a minus); the perpetuity CVs
# are the pack's growing_perpetuity over year 26's FCF. The DCF value is the sum of every discounted
# flow and the discounted continuing value (value driver); the generator holds that sum at the
# horizon, so the printed year-1 DCF value is read at period 25.
#
# The nominal side is booked: case period t is year t, period 0 the balance sheet at the start of
# year 1; each year's nominal sales, cash costs, depreciation, capex and working-capital investment
# are posted with the transfer rulebook, and NOPLAT (at the tax rate), invested capital, FCF and ROIC
# (on opening capital) are read through the valuation lens, capex and working-capital investment from
# the cash they took. The real side is the generator's arithmetic.
#
# Inputs, from 29.6 unless named: year-1 real revenues and year-2 real revenues (the real growth
# rate is their ratio: the extraction glues the printed growth row into "2–" and "2222", which no row
# can read), year-1 real EBITDA, working-capital and net PP&E ratios, tax rate, year-2 real WACC, the
# year-2 and year-3 inflation rates (the extraction moved year 2's 20 to the end of its line; the
# index, 1.20 / 1.00, places it), and from 29.7 the year-1 real depreciation and opening net PP&E (the
# lifetime is their ratio: its row is glued into "––––5" too); the horizon is the "Year 25" heading.
# Every other cell is compared. Three nominal year-25 cells of 29.7 are glued to the next label
# ("30Net", "36FCF", "12DCF") and so are words, not figures. The columns after each ". . ." are read
# with that mark as their label, the k-th such run in the excerpt being occurrence k.
excerpt: "29.6-7"
periods: [1, 2, 3, 4, 5]
entity: company
plant: r_ebitda_1

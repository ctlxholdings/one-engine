# Valuation, Exhibit 11.10 (ch. 11, p. 256): an industry beta for Home Depot and Lowe's, unlevered at
# 2006 capital structures and relevered at 2008 ones.
#
# Both companies are read in one oracle (Home Depot the first column, Lowe's the second) because the
# industry beta is the average of the two companies' unlevered betas: neither column computes alone.
# The four steps, rebuilt with the valuation_formulas generator:
#   1. regression betas, inputs;
#   2. unlevered beta = regression beta at the 2006 market debt-to-equity, by the pack's
#      unlevered_beta with a riskless debt beta (eq. 11.1, p. 255). The debt-to-equity ratio is the
#      net debt of the lower panel (short- and long-term debt and operating leases, less excess cash)
#      over the market value of equity, both inputs from that panel;
#   3. the industry beta, the mean of the two unlevered betas (the footnote to p. 256 says median and
#      mean coincide with two companies);
#   4. relevered beta at each company's 2008 debt-to-equity (an input: the 2008 balances are not in
#      this exhibit), by the pack's levered_beta.
# The share price is printed rounded to the dollar while the market value of equity is printed in
# full, so the market value is the input and the price (market value over shares) is compared.

# Valuation, Exhibits 7.4-7.5 (ch. 7, pp. 140-141), Home Depot: the balance sheets, then invested capital.
#
# Exhibit 7.4 prints Home Depot's and Lowe's balance sheets for 2006-2008
# (periods 0-2); Exhibit 7.5 reorganizes them into invested capital and its
# financing. This oracle reads Home Depot's three columns (Lowe's is
# 7.4-5@lowes, the same translation three columns on).
#   * The books are the balance sheet of Exhibit 7.4, every line its own
#     account, held at the printed balances by the `stated` rulebook. Nothing
#     moves them but the print, so the rulebook's check (the plug never moves)
#     is the test that the printed balance sheet balances, line by line.
#   * Exhibit 7.5 adds four figures it takes from exhibits outside this
#     excerpt, each booked as the book books it: capitalized operating leases
#     (7.14) as an operating asset financed by a debt equivalent; cumulative
#     amortization and unrecorded goodwill (7.6) as goodwill financed by an
#     equity equivalent; operating deferred taxes and tax loss carry-forwards
#     (7.8). The accountant's deferred-tax lines (two assets, two liabilities)
#     are equity equivalents; a reclassification asset of operating deferred
#     taxes less tax loss carry-forwards moves the operating part out of them,
#     so what remains is the nonoperating deferred tax 7.5 prints, compared.
#   * Every other 7.5 figure, uses and sources, is read back: the lines that
#     repeat 7.4 from the balances, the subtotals from the valuation lens.
# The lens's tax rate is nil: these exhibits print no income, and no figure
# read here depends on a rate.
excerpt: "7.4-5"
periods: [0, 1, 2]
entity: company
columns_of: [lowes]
plant: inventories
notes: >-
  The text extraction repeats the two invested-capital totals after the footnotes; both repeats are read
  and compared like the rows they repeat.

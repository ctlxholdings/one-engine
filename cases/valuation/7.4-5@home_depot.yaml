figures:
  total_current_assets: {balance: cash + receivables + inventories + short_term_dta + other_current_assets}
  total_assets: {balance: cash + receivables + inventories + short_term_dta + other_current_assets + ppe + goodwill + notes_receivable + equity_investments + acquired_intangibles + long_term_dta + other_assets}
  total_current_liabilities: {balance: short_term_debt + accounts_payable + accrued_salaries + deferred_revenue + short_term_dtl + other_accrued}
  total_liabilities_and_equity: {balance: short_term_debt + accounts_payable + accrued_salaries + deferred_revenue + short_term_dtl + other_accrued + long_term_debt + deferred_income_taxes + other_long_term_liabilities + common_stock + retained_earnings + aoci + treasury_stock}
  operating_cash: {balance: cash}
  ic_receivables: {balance: receivables}
  ic_inventories: {balance: inventories}
  ic_other_current_assets: {balance: other_current_assets}
  operating_current_assets: {cut: v.operating_current_assets}
  ic_accounts_payable: {balance: accounts_payable, sign: -1}
  ic_accrued_salaries: {balance: accrued_salaries, sign: -1}
  ic_deferred_revenue: {balance: deferred_revenue, sign: -1}
  ic_other_accrued: {balance: other_accrued, sign: -1}
  operating_current_liabilities: {cut: v.operating_current_liabilities}
  operating_working_capital: {cut: v.operating_working_capital}
  ic_ppe: {balance: ppe}
  other_long_term_net: {balance: other_assets - other_long_term_liabilities}
  invested_capital_ex_goodwill: {cut: v.invested_capital_ex_goodwill}
  goodwill_and_intangibles: {balance: goodwill + acquired_intangibles}
  invested_capital: {cut: v.invested_capital}
  # cash beyond what operations need: the nonoperating assets other than the investments and carry-forwards
  excess_cash: {sum: [{cut: v.nonoperating_assets}, {balance: notes_receivable + equity_investments + tax_loss_carryforwards, sign: -1}]}
  nonconsolidated_investments: {balance: notes_receivable + equity_investments}
  total_funds_invested: {cut: v.total_funds_invested}
  src_short_term_debt: {balance: short_term_debt}
  src_long_term_debt: {balance: long_term_debt}
  src_operating_leases: {balance: lease_debt}
  debt_and_equivalents: {cut: v.debt_and_equivalents}
  nonoperating_deferred_taxes: {balance: deferred_income_taxes + short_term_dtl - short_term_dta - long_term_dta - deferred_tax_reclassification}
  src_cumulative_amortization: {balance: amortization_equivalent}
  src_common_stock: {balance: common_stock}
  src_retained_earnings: {balance: retained_earnings}
  src_aoci: {balance: aoci}
  src_treasury_stock: {balance: treasury_stock}
  equity_and_equivalents: {cut: v.equity_and_equivalents}
  src_total_funds_invested: {cut: v.total_funds_sources}
  repeat_invested_capital_ex_goodwill: {cut: v.invested_capital_ex_goodwill}
  repeat_invested_capital: {cut: v.invested_capital}

      values:
        # a monthly premium compounded over the twelve months of a year
        smb_annual_m: (1 + smb_monthly__0) ** 12 - 1
        hml_annual_m: (1 + hml_monthly__0) ** 12 - 1
        market_contribution_m: market_coefficient__0 * market_premium__0
        smb_contribution_m: smb_coefficient__0 * smb_annual_m
        hml_contribution_m: hml_coefficient__0 * hml_annual_m
        premium_m: market_contribution_m + smb_contribution_m + hml_contribution_m
        cost_of_equity_m: capm(risk_free__0, market_coefficient__0, market_premium__0) + smb_contribution_m + hml_contribution_m

notes: |
  Book inconsistencies (each the first failing cell of its row):
  - k_ebitag at t=3: 31.11 prints 14.2% adjusted EBITA growth for 2007; 31.5's own EBITA (1,604 then 1,829) gives 14.0%.
  - k_noplatg at t=3: 31.11 prints 18.0% NOPLAT growth for 2007; 31.5's NOPLAT (1,173 then 1,382) gives 17.8%.
  - a_ii_h at t=7: 31.18 prints 17.7% interest income over excess cash for 2008 pro forma; 91 over the 2007 excess cash (335) is 27.2%, over 2008's (387) 23.5%.
  - a_assoc_h at t=7: 31.18 prints 10.2% for 2008 pro forma, which is the forecast's ratio (117/1,145); 2008's 128 over the 2007 investment (892) is 14.3%.
  - b_dp_h at t=7: 31.19 prints 18.2% dividends payable over dividends for 2008, the forecast's ratio; 76 over 2007's dividends (333 + 117) is 16.9%.
  - b_gwinv at t=1: 31.19 prints 526 of goodwill investment for 2005; 31.10 prints (and the books give) 582 (and 75 vs 95 in 2006).
  - b_odt at t=11: 31.19 prints operating deferred taxes at 2.2% of revenue every forecast year, but 31.21's balance rises by one a year: 353 over 17,399 is 2.0% in 2012.
  - cs_std_b at t=7: 31.30 prints short-term debt of 686 (book and market); 31.34 prints 1,073 (969 plus interest payable 104), which the books hold. 686 is 1,073 less excess cash, so 31.30 deducts excess cash twice; its totals are read as printed (cs_std_in) and checked from there.
  Readings worth knowing:
  - 31.18's interest expense rate in history is over closing debt; the forecast applies it to opening debt (the os rows).
  - Interest payable in the forecast is the mean of 2005-07's ratio to prior-year debt and 2008's to its own debt.
  - 31.10 treats the reversal of the intangibles adjustment as part of goodwill investment; 31.24 shows it as an equity flow.
  - Scottish & Newcastle's months of consolidation are given only in the text, so the pro forma revenue growth is not compared.
  - Medium-term capital continues from 31.23's printed 2013 invested capital (with and without goodwill), held at 2013's ratio to revenue.

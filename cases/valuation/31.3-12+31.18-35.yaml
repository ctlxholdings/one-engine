# Heineken case (chapter 31, exhibits 31.3-31.12 and 31.18-31.35), one company's linked statements in one
# set of books. Translation by worker W8, written from the vendored excerpt; comments are my own words.
#
# Periods: 0-3 are 2004-2007 as reported, 4 is 2007 restated, 5 is 2008 as reported, 6 is 2007 pro forma
# (the restated balance sheet plus the S&N invested capital of 31.12; no income statement), 7 is 2008 pro
# forma (2008 plus 31.12's S&N profit adjustments), 8-12 are the forecast 2009-13 (31.20 and 31.21 booked as
# printed) and 13-22 the medium term 2014-23 (31.27's rules).
#
# Booking: every income-statement line is posted (transfer) against excess cash; every balance-sheet line is
# then held at its printed or derived value (stated) against an equity plug that must never move, so each
# year's balance sheet balances with the equity the income statements build. The valuation lens reads
# NOPLAT, invested capital, free cash flow, ROIC and economic profit from those books; the book's reorganized
# exhibits (31.5, 31.8, 31.10, 31.22-31.27) are compared against the lens, the ratio exhibits against the
# books' own balances and flows, and the DCF, economic-profit, WACC, capital-structure and equity-bridge
# exhibits against the pack's formulas.
#
# The forecast's printed lines are rounded, so where an exhibit prints a total and its parts one part is the
# residual of the printed total (raw materials of adjusted EBITA, income tax of net profit, prepayments of
# operating current assets, other operating liabilities of operating current liabilities, the operating tax
# rate of NOPLAT); each such line is compared, and each forecast line is also checked one step from its
# assumption (the *_os rows). Long-term debt is the balance-sheet residual of the forecast, as in the book;
# excess cash is the residual of the medium term.

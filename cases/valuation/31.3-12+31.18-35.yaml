  a_aai_h: the split of 31.8's goodwill and acquired intangibles before 2008 is printed in no exhibit (31.21 first splits them, for 2008)
  b_dp_2005: needs 2004's dividends to minority holders, which no exhibit prints (31.10 starts in 2005)

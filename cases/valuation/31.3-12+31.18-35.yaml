case:
  case: valuation-heineken-case
  periods: 23
  phases:
  - operate
  - state
  currency: EUR
  floors: {}
  generators:
    m:
      kind: valuation_formulas
      periods: 23
      inputs: exhibit
      values:
        h_raw: is_raw + n_ec + n_loss
        pension_rep: n_pens_a + p_cur + p_past + p_int + p_ret + p_act + p_curt
        service: -n_serv_a + p_cur + p_past
        h_pers: is_pers + pension_rep - service + n_prov
        h_dep: is_dep + n_gain
        h_ec: -n_ec
        h_loss: -n_loss
        h_prov: -n_prov
        h_gain: -n_gain
        h_nci: -n_nc_inc
        h_nci_imp: -n_nc_imp
        h_pens_nonop: service - pension_rep
        h_pens_int: -a_pens_h * (lag(bs_eb, 1) + bs_eb) / 2 - (p_int + p_ret) * (t == 5)
        h_pens_other: h_pens_nonop - h_pens_int
        gidx: (1 + c26_growth_m)*(1 + lag(c26_growth_m, 1))*(1 + lag(c26_growth_m, 2))*(1 + lag(c26_growth_m, 3))*(1 + lag(c26_growth_m, 4))*(1 + lag(c26_growth_m, 5))*(1 + lag(c26_growth_m, 6))*(1 + lag(c26_growth_m, 7))*(1 + lag(c26_growth_m, 8))*(1 + lag(c26_growth_m, 9))
        o_rev_fc_at12: o_rev_fc * (t == 12)
        rev_m: cumsum(o_rev_fc_at12) * gidx * (t >= 13)
        ebita_m: x_ebita_fc__12 / o_rev_fc__12 * rev_m
        p_revenues: is_rev + (lag(is_rev, 2) + s_rev_a) * (t == 7) + o_rev_fc + rev_m
        p_raw_adj: h_raw + (lag(h_raw, 2) + s_rm_a) * (t == 7) + x_ebita_fc - (o_rev_fc + o_pe_fc + o_dep_fc + o_aoi_fc)
        p_pers_adj: h_pers + (lag(h_pers, 2) + s_pe_a) * (t == 7) + o_pe_fc
        p_medium_costs: ebita_m - rev_m
        p_dep_adj: h_dep + (lag(h_dep, 2) + s_dep_a) * (t == 7) + o_dep_fc
        p_amortization_operating: is_aoi + lag(is_aoi, 2) * (t == 7) + o_aoi_fc
        ai7_pf: (lag(bs_intang, 2) - lag(ic_oi, 2) - q_gw_pf) * (t == 7)
        ai_chain: (1 - a_aai_f)*(1 - lag(a_aai_f, 1))*(1 - lag(a_aai_f, 2))*(1 - lag(a_aai_f, 3))*(1 - lag(a_aai_f, 4))
        ai_rule: cumsum(ai7_pf) * ai_chain * (t >= 7) * (t <= 12)
        p_amortization_acquired: is_aai + lag(is_aai, 2) * (t == 7) + o_aai_fc
        ai_run: (cumsum(ai7_pf) + cumsum(o_aai_fc)) * (t >= 7) * (t <= 12)
        ai_path: ai_run + 0 * t
        p_impairment_goodwill: is_imp_gw + lag(is_imp_gw, 2) * (t == 7)
        p_other_income: is_oi + lag(is_oi, 2) * (t == 7) + o_pexc_fc
        p_ec_fine: h_ec + lag(h_ec, 2) * (t == 7)
        p_disposal_loss: h_loss + lag(h_loss, 2) * (t == 7)
        p_pension_other: h_pens_other + lag(h_pens_other, 2) * (t == 7)
        p_pension_interest: h_pens_int + lag(h_pens_int, 2) * (t == 7) + o_pens_fc
        p_nonop_prov: h_prov + lag(h_prov, 2) * (t == 7)
        p_disposal_gain_dep: h_gain + lag(h_gain, 2) * (t == 7)
        p_impairment_ppe: is_imp_ppe + lag(is_imp_ppe, 2) * (t == 7) + o_aexc_fc
        p_interest_income: is_ii + lag(is_ii, 2) * (t == 7) + o_ii_fc
        p_other_finance: is_ofe + lag(is_ofe, 2) * (t == 7) + o_ofe_fc
        p_associates_income: h_nci + o_assoc_pf + o_assoc_fc
        p_associates_impairment: h_nci_imp + lag(h_nci_imp, 2) * (t == 7)
        p_minority_interest_expense: is_mi + lag(is_mi, 2) * (t == 7) + o_mi_fc
        p_interest_expense: is_ie + lag(is_ie, 2) * (t == 7) + o_ie_fc
        adj_sh: p_revenues + p_raw_adj + p_pers_adj + p_medium_costs + p_dep_adj + p_amortization_operating
        adj_sh_at5: adj_sh * (t == 5)
        adj5: cumsum(adj_sh_at5)
        blended: (n_stat__5 + n_foreign__5 / adj5) if t >= 5 else 0
        h_odt: ic_odt_a - (dt_ppe + dt_inv + dt_other)
        odt_base: h_odt + lag(h_odt, 2) * ((t == 6) + (t == 7)) + q_odt_fc
        odt_base_at12: odt_base * (t == 12)
        b_odt_level: odt_base + cumsum(odt_base_at12) * (t >= 13) - n_dtl__5 * (t - 12) * (t >= 13)
        h_drec: -n_dtl
        drec: h_drec - lag(h_drec, 1) * (t == 6) + lag(h_drec, 2) * (t == 7) + (b_odt_level - lag(b_odt_level, 1)) * (t >= 8)
        fc_rate: ((x_ebita_fc - x_noplat_fc + drec) / x_ebita_fc) * (t >= 8) * (t <= 12) if x_ebita_fc != 0 else 0
        rate: n_stat + blended * (t == 7) + fc_rate + blended * (t >= 13)
        optax_sh: rate * adj_sh + n_foreign
        cashtax_sh: optax_sh - drec
        noplat_sh: adj_sh - cashtax_sh
        sn_tax: (cashtax_sh - lag(cashtax_sh, 2)) * (t == 7)
        fc_pretax: (p_revenues + p_raw_adj + p_pers_adj + p_medium_costs + p_dep_adj + p_amortization_operating + p_amortization_acquired + p_impairment_goodwill + p_other_income + p_ec_fine + p_disposal_loss + p_pension_other + p_pension_interest + p_nonop_prov + p_disposal_gain_dep + p_impairment_ppe + p_interest_income + p_other_finance + p_associates_income + p_associates_impairment + p_minority_interest_expense + p_interest_expense) * (t >= 8) * (t <= 12)
        p_income_tax: is_tax + (lag(is_tax, 2) - sn_tax) * (t == 7) + o_np_fc - fc_pretax - blended * ebita_m
        np_sh: p_revenues + p_raw_adj + p_pers_adj + p_medium_costs + p_dep_adj + p_amortization_operating + p_amortization_acquired + p_impairment_goodwill + p_other_income + p_ec_fine + p_disposal_loss + p_pension_other + p_pension_interest + p_nonop_prov + p_disposal_gain_dep + p_impairment_ppe + p_interest_income + p_other_finance + p_associates_income + p_associates_impairment + p_minority_interest_expense + p_interest_expense + p_income_tax
        p_eq_oci: is_oci + lag(is_oci, 2) * (t == 7)
        p_eq_dividends: is_div + lag(is_div, 2) * (t == 7) + o_div_fc
        p_eq_buyback: is_bb + lag(is_bb, 2) * (t == 7)
        p_eq_sbp: is_sbp + lag(is_sbp, 2) * (t == 7)
        mv: np_sh + p_eq_oci + p_eq_dividends + p_eq_buyback + p_eq_sbp
        p_eq_restatement: -lag(mv, 1) * ((t == 4) + (t == 6))
        p_eq_snn: -(np_sh - lag(np_sh, 2)) * (t == 7)
        eqflow: mv + p_eq_restatement + p_eq_snn
        eq_books: is_jan1_0__0 + cumsum(eqflow)
        base_working_cash: ic_wc + lag(ic_wc, 2) * (t == 6) + b_wc_f__8 * p_revenues * (t == 7) + q_wc_fc
        base_working_cash_at12: base_working_cash * (t == 12)
        b_working_cash: base_working_cash + cumsum(base_working_cash_at12) * (t >= 13)
        base_trade_receivables: ic_tr + lag(ic_tr, 2) * ((t == 6) + (t == 7)) + q_tr_fc
        base_trade_receivables_at12: base_trade_receivables * (t == 12)
        b_trade_receivables: base_trade_receivables + cumsum(base_trade_receivables_at12) * (t >= 13)
        base_inventories: bs_inv + lag(bs_inv, 2) * ((t == 6) + (t == 7)) + q_inv_fc
        base_inventories_at12: base_inventories * (t == 12)
        b_inventories: base_inventories + cumsum(base_inventories_at12) * (t >= 13)
        base_prepay_bs: bs_pp + lag(bs_pp, 2) * ((t == 6) + (t == 7)) + (y_oca_fc - q_wc_fc - q_tr_fc - q_inv_fc)
        base_prepay_bs_at12: base_prepay_bs * (t == 12)
        b_prepay_bs: base_prepay_bs + cumsum(base_prepay_bs_at12) * (t >= 13)
        h_prepay_rec: ic_pp - bs_pp
        base_prepay_rec: h_prepay_rec + lag(h_prepay_rec, 2) * ((t == 6) + (t == 7))
        base_prepay_rec_at12: base_prepay_rec * (t == 12)
        b_prepay_rec: base_prepay_rec + cumsum(base_prepay_rec_at12) * (t >= 13)
        b_snn_owc: s_owc_a
        base_ppe: bs_ppe + lag(bs_ppe, 2) * ((t == 6) + (t == 7)) + q_ppe_fc
        base_ppe_at12: base_ppe * (t == 12)
        b_ppe: base_ppe + cumsum(base_ppe_at12) * (t >= 13)

# Valuation, Exhibit 30.8 (ch. 30, p. 634): one foreign subsidiary's year-end balance sheet and income
# statement translated into U.S. dollars three ways: the current method, the temporal method, and the
# inflation-adjusted current method (pp. 632-633).
#
# Every translated line is its local amount times the rate printed beside it (the inflation-adjusted
# method translates the restated local amounts of the "Adjusted" column, which are inputs: their
# restatement rests on the 14% inflation of the prose, p. 633, which the exhibit does not print).
# What the exhibit derives is compared:
#   * the totals of each column;
#   * local and adjusted retained earnings, the balance sheet's residual (assets less liabilities less
#     common stock); the local column's own income statement adds up to the same (nothing was retained
#     before this year, so retained earnings are the year's net income in every column);
#   * the current method: retained earnings are the translated net income, and the foreign-currency
#     adjustment is what then balances the translated balance sheet;
#   * the temporal method: no equity adjustment, so retained earnings are the translated balance
#     sheet's residual, net income equals them, and the foreign-exchange gain is what the income
#     statement needs to reach that net income;
#   * the inflation-adjusted method: the restatement gain (the adjusted column's foreign-exchange line)
#     is what the restated income statement needs to reach the restated retained earnings; the dollar
#     column translates every line at the year-end rate and balances with a foreign-currency adjustment.
# The rate cells of totals and residuals print as dashes, compared as nil. Each line's eight cells
# are local, current rate, current dollars, temporal rate, temporal dollars, adjusted local,
# adjusted rate, adjusted dollars, read by skip; all sit at case period 0.
excerpt: "30.8"
periods: [0]
entity: model
plant: inventory_local
notes: >-
  The adjusted column's foreign-exchange line prints "201": the text extraction glues the cell's 20 to
  the footnote mark 1 ("Gain from restatement"). The restatement gain the column needs is 20
  (72 - (161 - 75 - 23 - 11)), and 20 x 0.85 = 17 is the dollar cell the exhibit prints.

# Valuation, Exhibits 7.9-7.12 (ch. 7, pp. 150-153), Home Depot: income statement, NOPLAT, and its taxes.
#
# Four linked exhibits of one company: the income statement (7.9), its
# reorganization into NOPLAT with the reconciliation back to net income
# (7.10), the tax reconciliation footnote in dollars and as a share of
# earnings before taxes (7.11), and the operating taxes and operating cash
# taxes built from it (7.12). 7.9 and 7.10 print Lowe's beside Home Depot
# (Lowe's is 7.9-12@lowes, three columns on); 7.11 and 7.12 print Home Depot
# only. The case runs 2004-2008 (periods 0-4): 7.12 reaches back two years,
# the other exhibits print 2006-2008 (periods 2-4).
#   * The income statement is booked: each 7.9 line a transfer between cash
#     and its account, as printed. Income taxes are not taken from 7.9: they
#     are the sum of the 7.11 reconciliation lines, and 7.9's line and 7.11's
#     total are both compared with the booked expense.
#   * The marginal rate is the chapter's proxy (p. 152): statutory plus state
#     taxes over earnings before taxes, from 7.11's dollar lines (the printed
#     7.12 rate is that share rounded; the book computes with the unrounded
#     one). The other operating taxes are 7.11's foreign rate differences,
#     the only operating item beyond the marginal rate (p. 153).
#   * The change in operating deferred taxes is posted from 7.12's row, which
#     the book takes from Exhibit 7.8 (as the change in the net operating
#     deferred-tax asset: the operating liability's change negated). The
#     liability carries no level here; only its change enters cash taxes.
#   * Operating lease interest comes from Exhibit 7.14 and is the lens's
#     EBITA adjustment.
# The valuation lens then gives EBITA, adjusted EBITA, operating taxes,
# operating cash taxes, NOPLAT and after-tax interest, compared with 7.10 and
# 7.12; the after-tax nonoperating lines of the reconciliation are each line
# times one less the marginal rate, and nonoperating taxes are reported taxes
# less operating taxes plus the marginal rate's tax on the gap between
# adjusted EBITA and earnings before taxes.
# 7.12's 2004-2005 columns lie outside the income statements. There the book
# prints adjusted EBITA, marginal taxes and other taxes from older filings:
# they are inputs, and the rate (marginal taxes over adjusted EBITA), the
# operating taxes and the cash taxes are compared. The rate is checked in that
# direction because the book prints it rounded to a tenth of a percent: the
# rounded 37.7% times 8,214 is 3,096.7, while the book's 3,098 is the
# unrounded product.
excerpt: "7.9-12"
periods: [2, 3, 4]
entity: company
columns_of: [lowes]
plant: net_sales
rows:
  # 7.9, the income statement
  net_sales: Net sales
  cogs: Cost of merchandise sold
  sga: Selling, general, and administrative
  depreciation: Depreciation
  amortization: Amortization
  ebit: EBIT
  investment_income: Interest and investment income
  interest_expense: Interest expense
  nonrecurring: Nonrecurring charge
  ebt: Earnings before taxes
  income_taxes: Income taxes
  continuing: Earnings from continuing operations
  discontinued: Discontinued operations
  net_income: Net income
  # 7.10, NOPLAT
  n_net_sales: {label: Net sales, occurrence: 2}
  n_cogs: {label: Cost of merchandise sold, occurrence: 2}
  n_sga: {label: "Selling, general, and administrative", occurrence: 2}
  n_depreciation: {label: Depreciation, occurrence: 2}
  ebita: EBITA
  lease_interest: "Add: Operating lease interest3"
  adjusted_ebita: Adjusted EBITA
  noplat_cash_taxes: {label: Operating cash taxes, occurrence: 1}
  noplat: {label: NOPLAT, occurrence: 1}
  operating_taxes: Operating taxes1
  deferred_increase: Increase (decrease) in operating deferred taxes2
  cash_taxes: {label: Operating cash taxes, occurrence: 2}
  # 7.10, the reconciliation with net income
  rec_net_income: {label: Net income, occurrence: 2}
  rec_deferred: Decrease (increase) in operating deferred taxes2
  adjusted_net_income: Adjusted net income
  after_tax_interest: After-tax interest expense
  after_tax_lease_interest: After-tax operating lease interest expense3
  income_to_investors: Total income available to investors
  nonoperating_taxes: Nonoperating taxes
  rec_discontinued: Loss (gain) from discontinued operations
  after_tax_nonrecurring: After-tax nonrecurring charges
  after_tax_amortization: After-tax amortization of intangibles
  after_tax_interest_income: After-tax interest income
  rec_noplat: {label: NOPLAT, occurrence: 2}
  # 7.11, the tax reconciliation in dollars, then as a share of earnings before taxes
  statutory: {label: Income taxes at statutory rate, occurrence: 1}
  state: {label: "State income taxes, net of federal", occurrence: 1}
  foreign: {label: Foreign rate differences, occurrence: 1}
  other_net: {label: "Other, net", occurrence: 1}
  reported_taxes: {label: Reported taxes, occurrence: 1}
  ebt_711: {label: Earnings before taxes, occurrence: 2}
  statutory_pct: {label: Income taxes at statutory rate, occurrence: 2, scale: 0.01}
  state_pct: {label: "State income taxes, net of federal", occurrence: 2, scale: 0.01}
  foreign_pct: {label: Foreign rate differences, occurrence: 2, scale: 0.01}
  other_pct: {label: "Other, net", occurrence: 2, scale: 0.01}
  reported_pct: {label: Reported taxes, occurrence: 2, scale: 0.01}
  # 7.12, 2004-2005 (periods 0-1) and 2006-2008 (periods 2-4)
  rate_early: {label: "Step 2: Marginal tax rate (percent)", periods: [0, 1], scale: 0.01}
  rate: {label: "Step 2: Marginal tax rate (percent)", periods: [2, 3, 4], skip: 2, scale: 0.01}
  adjusted_ebita_early: {label: × Adjusted EBITA, periods: [0, 1]}
  adjusted_ebita_712: {label: × Adjusted EBITA, periods: [2, 3, 4], skip: 2}
  marginal_taxes_early: {label: = Marginal taxes on EBITA, periods: [0, 1]}
  marginal_taxes: {label: = Marginal taxes on EBITA, periods: [2, 3, 4], skip: 2}
  other_taxes_early: {label: "Step 3: Other operating taxes", periods: [0, 1]}
  other_taxes: {label: "Step 3: Other operating taxes", periods: [2, 3, 4], skip: 2}
  operating_taxes_early: {label: Operating taxes, occurrence: 1, periods: [0, 1]}
  operating_taxes_712: {label: Operating taxes, occurrence: 1, periods: [2, 3, 4], skip: 2}
  operating_taxes_early_2: {label: Operating taxes, occurrence: 2, periods: [0, 1]}
  operating_taxes_712_2: {label: Operating taxes, occurrence: 2, periods: [2, 3, 4], skip: 2}
  increase: {label: Increase in operating deferred taxes1, periods: [0, 1, 2, 3, 4]}
  cash_taxes_early: {label: Operating cash taxes, occurrence: 3, periods: [0, 1]}
  cash_taxes_712: {label: Operating cash taxes, occurrence: 3, periods: [2, 3, 4], skip: 2}
inputs: [net_sales, cogs, sga, depreciation, amortization, investment_income, interest_expense, nonrecurring,
         discontinued, lease_interest, statutory, state, foreign, other_net, adjusted_ebita_early,
         marginal_taxes_early, other_taxes_early, increase]
set_aside:
  "EXHIBIT 7.9 Home Depot and Lowe’s: Historical Income Statement": the exhibit's number
  "EXHIBIT 7.10 Home Depot and Lowe’s: NOPLAT Calculation": the exhibit's number
  "EXHIBIT 7.11 Home Depot: Tax Reconciliation Tables": the exhibit's number
  "EXHIBIT 7.12 Home Depot: Operating Taxes and Operating Cash Taxes": the exhibit's number
  "2006 2007 2008 2006 2007 2008": the column headings, years
  "$ million 2006 2007 2008 percent 2006 2007 2008": the column headings, years
  "2004 2005 2006 2007 2008": the column headings, years
  "Source: Home Depot 2008 10-K, note 6.": the source's year
case:
  case: valuation-chapter-7-noplat-home-depot
  periods: 5
  phases: [operate]
  currency: USD
  floors: {}
  generators:
    book:
      kind: formulas
      periods: 5
      inputs: exhibit
      values:
        # earnings before taxes as 7.11 divides by them (the income statement's lines, as printed)
        pretax: net_sales + cogs + sga + depreciation + amortization + investment_income + interest_expense + nonrecurring
        # reported taxes are the reconciliation's lines (posted as an expense, so signed as 7.9 prints them)
        taxes_posted: -(statutory + state + foreign + other_net)
        # the marginal rate: statutory plus state taxes as a share of earnings before taxes (p. 152)
        rate: (statutory + state) / pretax if pretax != 0 else 0
        keep: 1 - rate
        statutory_pct: statutory / pretax if pretax != 0 else 0
        state_pct: state / pretax if pretax != 0 else 0
        foreign_pct: foreign / pretax if pretax != 0 else 0
        other_pct: other_net / pretax if pretax != 0 else 0
        reported_pct: (statutory + state + foreign + other_net) / pretax if pretax != 0 else 0
        # 7.12 prints the change of the net operating deferred-tax asset; the liability moves the other way
        dtl_change: -increase
        # 2004-2005, from the figures 7.12 prints for them
        rate_early: marginal_taxes_early / adjusted_ebita_early if adjusted_ebita_early != 0 else 0
        operating_taxes_early: marginal_taxes_early + other_taxes_early
        cash_taxes_early: operating_taxes_early + increase
  contracts: {}
  rulebooks:
    # each line as printed, signed: a positive amount debits cash, a negative one credits it
    year:
      kind: transfer
      entity: company
      phase: operate
      declare: {cash: asset, net_sales: income, cogs: expense, sga: expense, depreciation: expense,
                amortization: expense, investment_income: income, interest_expense: expense,
                nonrecurring: expense, income_taxes: expense, discontinued: income,
                operating_deferred_tax: liability}
      moves:
        net_sales: {debit: cash, credit: net_sales, amount: {generator: book, output: net_sales}}
        cogs: {debit: cash, credit: cogs, amount: {generator: book, output: cogs}}
        sga: {debit: cash, credit: sga, amount: {generator: book, output: sga}}
        depreciation: {debit: cash, credit: depreciation, amount: {generator: book, output: depreciation}}
        amortization: {debit: cash, credit: amortization, amount: {generator: book, output: amortization}}
        investment_income: {debit: cash, credit: investment_income,
                            amount: {generator: book, output: investment_income}}
        interest_expense: {debit: cash, credit: interest_expense, amount: {generator: book, output: interest_expense}}
        nonrecurring: {debit: cash, credit: nonrecurring, amount: {generator: book, output: nonrecurring}}
        income_taxes: {debit: cash, credit: income_taxes, amount: {generator: book, output: taxes_posted}}
        discontinued: {debit: cash, credit: discontinued, amount: {generator: book, output: discontinued}}
        deferred_taxes: {debit: cash, credit: operating_deferred_tax, amount: {generator: book, output: dtl_change}}
  schemes:
    valuation:
      cash: operating_current_asset
      operating_deferred_tax: operating_deferred_tax
      net_sales: revenue
      cogs: operating_cost
      sga: operating_cost
      depreciation: depreciation
      amortization: amortization
      investment_income: nonoperating
      interest_expense: interest
      nonrecurring: nonoperating
      income_taxes: tax
      discontinued: nonoperating
  cuts: {}
  lenses:
    v:
      kind: valuation
      entity: company
      scheme: valuation
      marginal_tax_rate: {generator: book, output: rate}
      other_operating_taxes: {generator: book, output: foreign}
      ebita_adjustments: {operating_lease_interest: {generator: book, output: lease_interest}}
  measures: {}
figures:
  # 7.9
  ebit: {change: net_sales - cogs - sga - depreciation - amortization}
  ebt: {change: net_sales + investment_income - cogs - sga - depreciation - amortization - interest_expense - nonrecurring}
  income_taxes: {change: income_taxes, sign: -1}
  continuing: {change: net_sales + investment_income - cogs - sga - depreciation - amortization - interest_expense - nonrecurring - income_taxes}
  net_income: {cut: v.net_income}
  # 7.10
  n_net_sales: {cut: v.revenue}
  n_cogs: {change: cogs, sign: -1}
  n_sga: {change: sga, sign: -1}
  n_depreciation: {cut: v.depreciation, sign: -1}
  ebita: {cut: v.ebita}
  adjusted_ebita: {cut: v.adjusted_ebita}
  noplat_cash_taxes: {cut: v.operating_cash_taxes, sign: -1}
  noplat: {cut: v.noplat}
  operating_taxes: {cut: v.operating_taxes}
  deferred_increase: {change: operating_deferred_tax, sign: -1}
  cash_taxes: {cut: v.operating_cash_taxes}
  rec_net_income: {cut: v.net_income}
  rec_deferred: {change: operating_deferred_tax}
  adjusted_net_income: {sum: [{cut: v.net_income}, {change: operating_deferred_tax}]}
  after_tax_interest: {cut: v.after_tax_interest}
  after_tax_lease_interest: {driver: book.lease_interest, times: book.keep}
  income_to_investors: {sum: [{cut: v.net_income}, {change: operating_deferred_tax}, {cut: v.after_tax_interest},
                              {driver: book.lease_interest, times: book.keep}]}
  # reported taxes less operating taxes, plus the marginal tax on what separates adjusted EBITA from pretax income
  nonoperating_taxes: {sum: [{change: income_taxes}, {cut: v.operating_taxes, sign: -1},
                             {driver: book.lease_interest, times: book.rate},
                             {change: amortization + interest_expense + nonrecurring - investment_income, times: book.rate}]}
  rec_discontinued: {change: discontinued, sign: -1}
  after_tax_nonrecurring: {change: nonrecurring, times: book.keep}
  after_tax_amortization: {change: amortization, times: book.keep}
  after_tax_interest_income: {change: investment_income, times: book.keep, sign: -1}
  # the reconciliation closes: its lines added up
  rec_noplat: {sum: [{cut: v.net_income}, {change: operating_deferred_tax}, {cut: v.after_tax_interest},
                     {driver: book.lease_interest, times: book.keep},
                     {change: income_taxes}, {cut: v.operating_taxes, sign: -1},
                     {driver: book.lease_interest, times: book.rate},
                     {change: amortization + interest_expense + nonrecurring - investment_income, times: book.rate},
                     {change: discontinued, sign: -1}, {change: nonrecurring, times: book.keep},
                     {change: amortization, times: book.keep}, {change: investment_income, times: book.keep, sign: -1}]}
  # 7.11
  reported_taxes: {change: income_taxes}
  ebt_711: {change: net_sales + investment_income - cogs - sga - depreciation - amortization - interest_expense - nonrecurring}
  statutory_pct: {driver: book.statutory_pct}
  state_pct: {driver: book.state_pct}
  foreign_pct: {driver: book.foreign_pct}
  other_pct: {driver: book.other_pct}
  reported_pct: {driver: book.reported_pct}
  # 7.12
  rate_early: {driver: book.rate_early}
  rate: {driver: book.rate}
  adjusted_ebita_712: {cut: v.adjusted_ebita}
  marginal_taxes: {cut: v.adjusted_ebita, times: book.rate}
  other_taxes: {sum: [{cut: v.operating_taxes}, {cut: v.adjusted_ebita, times: book.rate, sign: -1}]}
  operating_taxes_early: {driver: book.operating_taxes_early}
  operating_taxes_712: {cut: v.operating_taxes}
  operating_taxes_early_2: {driver: book.operating_taxes_early}
  operating_taxes_712_2: {cut: v.operating_taxes}
  cash_taxes_early: {driver: book.cash_taxes_early}
  cash_taxes_712: {cut: v.operating_cash_taxes}

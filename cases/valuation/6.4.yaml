# Valuation, Exhibit 6.4 (ch. 6, p. 107): Home Depot's enterprise DCF valuation.
#
# Ten years of forecast free cash flow (2009-2018, case periods 1-10) and the continuing value at the
# end of 2018 are discounted at the WACC; their sum is lifted by half a year's discounting (the cash
# arrives through the year, not at its end, p. 106 and footnote 4), and the nonoperating assets,
# debt and capitalized operating leases take value of operations to equity value and value per share.
#   * The rate. The heading prints the WACC rounded to 8.5%, but the book discounts at its unrounded
#     WACC (footnote 3, p. 106, says no figure is adjusted for rounding): at 8.5% the 2018 factor would
#     be 0.442, not the 0.444 printed. The exhibit carries the rate most precisely in its
#     continuing-value line, which discounts 92,239 to 40,966 over ten years; the rate is read from
#     that line with the pack's annualized (the annual rate that compounds to 92,239 / 40,966 in ten
#     years, 8.455%). Every discount factor, every present value of the free cash flows, the
#     continuing value's factor and the midyear factor (the square root of 1 + WACC, again by
#     annualized) are then computed and compared.
#   * The sum. "Present value of cash flow" is compared with the sum of the printed present values
#     (the book's own addition). Rebuilt from the rounded cash flows the explicit present values sum
#     to 1.4 below the book's (the forecast prints its flows rounded), so the chain continues from the
#     printed total: value of operations is it times the midyear factor, and enterprise value, equity
#     value and value per share follow, each compared.
#   * The years in the first column are compared with the first year plus the period.
# Built with the valuation_formulas generator; the summary lines sit at period 0.

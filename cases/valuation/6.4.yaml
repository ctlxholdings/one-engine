case:
  case: valuation-chapter-6-home-depot-dcf
  periods: 11
  phases: [operate]
  currency: USD
  floors: {}
  generators:
    m:
      kind: valuation_formulas
      periods: 11
      inputs: exhibit
      values:
        # the WACC the continuing-value line discounts at: (1 + w)^10 = 92,239 / 40,966
        w: annualized(cv_value__10 / cv_pv__10 - 1, 10)
        year_m: year_1__1 + t - 1
        factor_m: (1 + w) ** (-t)
        fcf_m: fcf_1 + fcf_2 + fcf_3 + fcf_4 + fcf_5 + fcf_6 + fcf_7 + fcf_8 + fcf_9 + fcf_10
        pv_m: fcf_m * factor_m
        # the book's total: its printed present values added, with the continuing value's
        pv_total_m: pv_printed_1__1 + pv_printed_2__2 + pv_printed_3__3 + pv_printed_4__4 + pv_printed_5__5 + pv_printed_6__6 + pv_printed_7__7 + pv_printed_8__8 + pv_printed_9__9 + pv_printed_10__10
          + cv_pv__10
        midyear_m: 1 + annualized(w, 2)
        value_of_operations_m: pv_total_printed__0 * midyear_m
        enterprise_value_m: value_of_operations_m + excess_cash__0 + long_term_investments__0 + tax_loss_carryforwards__0
        # debt and leases print negative, as deductions
        equity_value_m: enterprise_value_m + debt__0 + operating_leases__0
        # equity in $ million, shares in billions, value per share in dollars
        value_per_share_m: equity_value_m / (shares__0 * 1000)

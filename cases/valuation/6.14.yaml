# Valuation, Exhibit 6.14 (ch. 6, p. 123): Home Depot valued by adjusted present value.
#
# The free cash flows of Exhibit 6.4 and the interest tax shields of Exhibit 6.15 (2009-2018, case
# periods 1-10), each with a continuing value, are discounted at the unlevered cost of equity; the
# two present values add to the same 62,694 as 6.4, and the same midyear adjustment and claims lead
# to the same equity value (pp. 121-124).
#   * The rate. The heading prints the unlevered cost of equity rounded to 9.3%; as in 6.4 the rate
#     is read, with the pack's annualized, from the continuing-value line that carries it most
#     precisely (78,175 discounted to 32,256 over ten years: 9.256%). Each discount factor and each
#     present value of free cash flow and of tax shields, and the tax shields' continuing value
#     discounted, are computed from it and compared.
#   * The two continuing values are inputs: the exhibit does not print what they are built from (the
#     key value driver formula at the unlevered rate; the 2019 tax shield).
#   * The sums. Each "Present value" total, and its second printing below, is compared with the sum
#     of its printed column (the book's own addition); rebuilt from the rounded tax shields the
#     present values of the shields sum to 1.1 above the book's, beyond its last digit. The two
#     totals add to the value before the midyear adjustment, compared.
#   * The midyear adjustment. Value of operations is the 6.4 figure, 65,291: the book lifts the APV
#     by the WACC's half year (6.4), not the unlevered rate's (the square root of 1.0926 would give
#     about 65,530), and the WACC is not printed here. So value of operations is an input and the
#     printed factor is compared with it over the value before the adjustment (1.0414). Enterprise
#     value and equity value follow and are compared.
#   * The years in the first column are compared with the first year plus the period.
# Built with the valuation_formulas generator; the summary lines sit at period 0.

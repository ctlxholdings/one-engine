case:
  case: valuation-chapter-6-home-depot-apv
  periods: 11
  phases: [operate]
  currency: USD
  floors: {}
  generators:
    m:
      kind: valuation_formulas
      periods: 11
      inputs: exhibit
      values:
        # the unlevered cost of equity the continuing-value line discounts at: (1 + ku)^10 = 78,175 / 32,256
        ku: annualized(cv_fcf__10 / cv_pv_fcf__10 - 1, 10)
        year_m: year_1__1 + t - 1
        factor_m: (1 + ku) ** (-t)
        fcf_m: fcf_1 + fcf_2 + fcf_3 + fcf_4 + fcf_5 + fcf_6 + fcf_7 + fcf_8 + fcf_9 + fcf_10
        its_m: its_1 + its_2 + its_3 + its_4 + its_5 + its_6 + its_7 + its_8 + its_9 + its_10
        pv_fcf_m: fcf_m * factor_m
        pv_its_m: its_m * factor_m
        # the book's totals: its printed present values added
        pv_fcf_total_m: pv_fcf_printed_1__1 + pv_fcf_printed_2__2 + pv_fcf_printed_3__3 + pv_fcf_printed_4__4 + pv_fcf_printed_5__5 + pv_fcf_printed_6__6 + pv_fcf_printed_7__7 + pv_fcf_printed_8__8 + pv_fcf_printed_9__9 + pv_fcf_printed_10__10
          + cv_pv_fcf__10
        pv_its_total_m: pv_its_printed_1__1 + pv_its_printed_2__2 + pv_its_printed_3__3 + pv_its_printed_4__4 + pv_its_printed_5__5 + pv_its_printed_6__6 + pv_its_printed_7__7 + pv_its_printed_8__8 + pv_its_printed_9__9 + pv_its_printed_10__10
          + cv_pv_its_printed__10
        value_before_midyear_m: pv_fcf_total_m + pv_its_total_m
        midyear_m: value_of_operations__0 / value_before_midyear_m
        enterprise_value_m: value_of_operations__0 + excess_cash__0 + long_term_investments__0 + tax_loss_carryforwards__0
        # debt and leases print negative, as deductions
        equity_value_m: enterprise_value_m + debt__0 + operating_leases__0
        cv_pv_its_m: cv_its__10 * (1 + ku) ** (-10)

# Valuation, Exhibit 25.9 (ch. 25, p. 556, the review questions): ToyCo's tax reconciliation table, years 1-3.
#
# The table reconciles ToyCo's statutory rate with its effective rate, line by
# line, in percent of earnings before taxes (periods 0-2 are years 1-3).
# Translated as the table's own arithmetic: the statutory rate and each
# reconciling item are inputs, and the effective rate is their sum, computed
# and compared. The two profit lines beneath the table are data for review
# questions 1 and 2 (p. 555); the exhibit prints nothing computed from them,
# so they are set aside (the answers are not printed).
excerpt: "25.9"
periods: [0, 1, 2]
entity: company
plant: statutory_rate
rows:
  statutory_rate: {label: Statutory income tax rate, scale: 0.01}
  state_and_local: {label: "State and local income taxes, net", scale: 0.01}
  repatriation: {label: Repatriation of foreign earnings, scale: 0.01}
  settleable_in_stock: {label: Liabilities settleable in common stock, scale: 0.01}
  international: {label: Tax on international earnings, scale: 0.01}
  exam_settlements: {label: Exam settlements, scale: 0.01}
  other_net: {label: "Other, net", scale: 0.01}
  effective_rate: {label: Effective tax rate, scale: 0.01}
inputs: [statutory_rate, state_and_local, repatriation, settleable_in_stock, international, exam_settlements,
         other_net]
set_aside:
  "EXHIBIT 25.9 ToyCo: Tax Reconciliation Table": the exhibit's number
  "Year 1 Year 2 Year 3": the column headings, years
  "Operating profit (EBITA) 587.1 572.6 673.6": data for review questions 1-2 (p. 555); nothing printed is computed from it
  "Earnings before taxes 462.3 441.1 529.7": data for review questions 1-2 (p. 555); nothing printed is computed from it
case:
  case: valuation-toyco-tax-reconciliation
  periods: 3
  phases: [operate]
  currency: USD
  floors: {}
  generators:
    m:
      kind: valuation_formulas
      periods: 3
      inputs: exhibit
      values:
        effective: statutory_rate + state_and_local + repatriation + settleable_in_stock + international + exam_settlements + other_net
  opening: {}
  contracts: {}
  rulebooks: {}
  schemes: {}
  cuts: {}
  lenses: {}
  measures: {}
figures:
  effective_rate: {driver: m.effective}

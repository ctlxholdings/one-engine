# Valuation, Exhibit 6.13 (ch. 6, p. 120): Home Depot valued by economic profit.
#
# Ten years of economic profit (2009-2018, case periods 1-10) and an economic-profit continuing value
# are discounted at the WACC; their sum plus the invested capital at the start (2008) is the same
# 62,694 as Exhibit 6.4's discounted free cash flow, and the same midyear adjustment and claims lead
# to the same equity value (pp. 118-120).
#   * The rate. As in 6.4, the heading's 8.5% is the WACC rounded; the book discounts at the
#     unrounded rate, carried most precisely by the continuing-value line (41,922 discounted to 18,619
#     over ten years). The rate is read from that line with the pack's annualized, and each year's
#     WACC cell, discount factor and present value, the continuing value's factor and the midyear
#     factor (the square root of 1 + WACC) are computed from it and compared.
#   * ROIC. The exhibit prints ROIC rounded to a tenth, too coarse to rebuild economic profit from it
#     (37,075 x (8.0% - 8.5%) would be -185, not the -164 printed). Economic profit is therefore the
#     input, and the ROIC it implies, the WACC plus economic profit over the year's opening capital
#     (the footnote: capital at the start of the year), is compared with each printed ROIC.
#   * The sum of the present values of economic profit is computed from the cash flows and the rate;
#     "Invested capital in 2008" is compared with the 2009 row's opening capital, which it is;
#     value of operations, enterprise value and equity value follow and are compared.
#   * The years in the first column are compared with the first year plus the period.
# Built with the valuation_formulas generator; the summary lines sit at period 0.

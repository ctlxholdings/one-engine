case:
  case: valuation-chapter-6-home-depot-ep-valuation
  periods: 11
  phases: [operate]
  currency: USD
  floors: {}
  generators:
    m:
      kind: valuation_formulas
      periods: 11
      inputs: exhibit
      values:
        # the WACC the continuing-value line discounts at: (1 + w)^10 = 41,922 / 18,619
        w: annualized(cv_value__10 / cv_pv__10 - 1, 10)
        year_m: year_1__1 + t - 1
        wacc_m: w
        factor_m: (1 + w) ** (-t)
        capital_m: capital_1 + capital_2 + capital_3 + capital_4 + capital_5 + capital_6 + capital_7 + capital_8 + capital_9 + capital_10
        economic_profit_m: economic_profit_1 + economic_profit_2 + economic_profit_3 + economic_profit_4 + economic_profit_5 + economic_profit_6 + economic_profit_7 + economic_profit_8 + economic_profit_9 + economic_profit_10
        # the return the economic profit implies on the year's opening capital
        roic_m: "w + economic_profit_m / capital_m if t >= 1 else 0"
        pv_m: economic_profit_m * factor_m
        pv_total_m: economic_profit_1__1 * (1 + w) ** (-1) + economic_profit_2__2 * (1 + w) ** (-2) + economic_profit_3__3 * (1 + w) ** (-3) + economic_profit_4__4 * (1 + w) ** (-4) + economic_profit_5__5 * (1 + w) ** (-5) + economic_profit_6__6 * (1 + w) ** (-6) + economic_profit_7__7 * (1 + w) ** (-7) + economic_profit_8__8 * (1 + w) ** (-8) + economic_profit_9__9 * (1 + w) ** (-9) + economic_profit_10__10 * (1 + w) ** (-10)
          + cv_pv__10
        capital_open_m: capital_1__1
        value_before_midyear_m: capital_1__1 + pv_total_m
        midyear_m: 1 + annualized(w, 2)
        value_of_operations_m: value_before_midyear_m * midyear_m
        enterprise_value_m: value_of_operations_m + excess_cash__0 + long_term_investments__0 + tax_loss_carryforwards__0
        # debt and leases print negative, as deductions
        equity_value_m: enterprise_value_m + debt__0 + operating_leases__0

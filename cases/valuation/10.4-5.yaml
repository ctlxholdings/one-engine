  noplat_b: {driver: m.noplat_m}
  depreciation_b: {driver: m.depreciation_m}
  gross_cash_flow_b: {driver: m.gross_cash_flow_m}
  gross_investment_b: {driver: m.gross_investment_m}
  fcf_b: {driver: m.fcf_m}

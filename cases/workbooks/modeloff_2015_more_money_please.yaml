# Workbook "modeloff_2015_more_money_please": the data workbook of ModelOff 2015 Round 2 "More Money
# Please", a project-finance company before its refinancing (golds one-place,
# oracles/external/excel_models/corpus/downloads/MO15-More-Money-Please-Data.xlsx;
# cases/reference/workbooks/modeloff_2015_more_money_please.xlsx). Sheets "Formats" (a legend, no
# figure), "Inputs", "Workings" and "Financial Statements"; the refinancing inputs (Inputs L43:L53) are
# stated for the competition's questions and used by no formula.
#
# Period t is the calendar year 2015 + t: columns M (2015) to AK (2039); column L is the balance sheet
# at the end of 2014, the books' opening (the 26-cell rows L..AK are read cell by cell, L from it).
# A typed date is its Excel serial: the periods end on EOMONTH(Inputs L7, 12 (t + 1)) and start the day
# after the previous end (Inputs rows 6-7).
#   * the books open on Inputs L26 (fixed assets), L28 (cash), L30 (senior debt) and L32 (retained
#     earnings);
#   * the days in each period (Workings row 15) and the days operated in it, to the project end date
#     Inputs L12, 30 June 2038 (row 16); revenue Inputs L18 and operating costs L20 a year, real, are
#     indexed (row 21: M21, growing Inputs L16) and apportioned by the share of the year operated
#     (rows 17, 25, 29); lifecycle costs (Inputs row 22, real) are indexed, not apportioned, and
#     capitalised (rows 33, 45);
#   * fixed assets (the opening plus each year's lifecycle) depreciate each year by the days operated
#     over the days of operation left (rows 39-46). Row 40 sums the days operated from the year to the
#     grid's end; the periods are contiguous, so that is the days from the year's start to the project
#     end date. The recursion close = (open + additions) x (1 - share) is taken in its closed form: the
#     share's complement is left(t + 1) / left(t), so close(t) = left(t + 1) x (L26 / left(0) + the sum of
#     each year's additions over its left), exactly the workbook's arithmetic;
#   * the senior debt repays Inputs row 38 and pays Inputs L36 on its opening balance (rows 53-59);
#   * no tax; all the cash is paid out as dividends each year (FS row 24, =-MAX(cash flows + cash
#     carried in, 0)): the waterfall's residual, which pays the cash available above nil.
# Set aside: Workings L20, L24, L28, links that only repeat an input (see not_compared). The workbook's
# formulas agree with the books throughout (no slip found).
workbook: modeloff_2015_more_money_please
entity: company
plant: Inputs__L36
case:
  case: workbook-modeloff-more-money-please
  periods: 25
  phases: [operate, invest, pay, distribute]
  currency: USD
  floors: {}
  generators:
    src:
      kind: formulas
      periods: 25
      inputs: workbook
      values:
        # section numbers: the largest number above in column A, plus the formula's 0.01
        inputs_1: Inputs__A3 + Inputs__A10__n1
        inputs_2: max(Inputs__A3, inputs_1) + Inputs__A14__n1
        inputs_3: max(inputs_2, inputs_1) + Inputs__A24__n1
        inputs_4: max(inputs_3, inputs_2) + Inputs__A34__n1
        inputs_5: max(inputs_4, inputs_3) + Inputs__A41__n1
        workings_1: Workings__A3 + Workings__A11__n1
        workings_2: max(Workings__A3, workings_1) + Workings__A36__n1
        workings_3: max(workings_2, workings_1) + Workings__A50__n1
        statements_1: Financial_Statements__A3 + Financial_Statements__A11__n1
        statements_2: max(Financial_Statements__A3, statements_1) + Financial_Statements__A31__n1
        statements_3: max(statements_2, statements_1) + Financial_Statements__A50__n1
        # the calendar (Inputs rows 6-7; Workings rows 15-17, 39-41)
        period_end: EOMONTH(Inputs__L7, Inputs__M7__n1 * (t + 1))
        period_start: EOMONTH(Inputs__L7, Inputs__M7__n1 * t) + Inputs__M6__n1
        days: period_end - period_start + Workings__M15__n1
        days_operated: max(min(period_end, Inputs__L12) - period_start + Workings__M16__n1, Workings__M16__n2)
        operated: days_operated / days
        days_left: max(Inputs__L12 - period_start + Workings__M16__n1, Workings__M16__n2)
        days_left_first: max(Inputs__L12 - (Inputs__L7 + Inputs__M6__n1) + Workings__M16__n1, Workings__M16__n2)
        depreciation_share: days_operated / days_left if days_left > Workings__M41__n1 else Workings__M41__n2
        # money
        index: Workings__M21 * (Workings__N21__n1 + Inputs__L16) ** t
        revenue: Inputs__L18 * index * operated
        opex: Inputs__L20 * index * operated
        lifecycle: Inputs__M22_AK22 * index
        days_left_after: days_left - days_operated
        added_per_day_left: lifecycle / days_left if days_left > Workings__M41__n1 else Workings__M41__n1
        fa_close: days_left_after * (Inputs__L26 / days_left_first + cumsum(added_per_day_left))
        fa_open: lag(fa_close, 1) + (t == 0) * Inputs__L26
        depreciation: fa_open + lifecycle - fa_close
        repayment: Inputs__M38_AK38 + 0
        repaid: cumsum(repayment)
        debt_open: Inputs__L30 - lag(repaid, 1)
        interest: debt_open * Inputs__L36
        opening_debt: Inputs__L30 + 0
  opening:
    company:
      fixed_assets: {nature: asset, value: {generator: src, output: Inputs__L26}}
      cash: {nature: asset, value: {generator: src, output: Inputs__L28}}
      debt: {nature: liability, value: {generator: src, output: Inputs__L30}}
      retained_earnings: {nature: equity, value: {generator: src, output: Inputs__L32}}
  contracts:
    owner:
      type: sponsor_equity
      parties: {issuer: company}
      terms: {}
  rulebooks:
    trading:
      kind: transfer
      entity: company
      phase: operate
      declare: {revenue: income, opex: expense}
      moves:
        revenue: {debit: cash, credit: revenue, amount: {generator: src, output: revenue}}
        opex: {debit: opex, credit: cash, amount: {generator: src, output: opex}}
    assets:
      kind: transfer
      entity: company
      phase: invest
      declare: {depreciation: expense}
      moves:
        lifecycle: {debit: fixed_assets, credit: cash, amount: {generator: src, output: lifecycle}}
        depreciation: {debit: depreciation, credit: fixed_assets, amount: {generator: src, output: depreciation}}
    senior_debt:
      kind: transfer
      entity: company
      phase: pay
      declare: {interest: expense}
      moves:
        principal: {debit: debt, credit: cash, amount: {generator: src, output: repayment}}
        interest: {debit: interest, credit: cash, amount: {generator: src, output: interest}}
    dividends:
      kind: waterfall
      entity: company
      phase: distribute
      cash: cash
      tiers: []
      residual: owner.distribute
      cfads: {scheme: cash_flow, classes: [project], less: []}
      service: []
      tests: []
  schemes:
    cash_flow:
      revenue: project
      opex: project
      fixed_assets: lifecycle
      debt: principal
      interest: interest
      owner.capital: dividends
      owner.distributions: dividends
    pnl:
      revenue: revenue
      opex: opex
      depreciation: depreciation
      interest: interest
  cuts:
    revenue: {kind: pnl, entity: company, scheme: pnl, include: [revenue]}
    opex: {kind: pnl, entity: company, scheme: pnl, include: [opex]}
    depreciation: {kind: pnl, entity: company, scheme: pnl, include: [depreciation]}
    ebit: {kind: pnl, entity: company, scheme: pnl, include: [revenue, opex, depreciation]}
    interest: {kind: pnl, entity: company, scheme: pnl, include: [interest]}
    net_profit: {kind: pnl, entity: company, scheme: pnl, include: [revenue, opex, depreciation, interest]}
    lifecycle: {entity: company, account: cash, scheme: cash_flow, include: [lifecycle]}
    project: {entity: company, account: cash, scheme: cash_flow, include: [project, lifecycle]}
    principal: {entity: company, account: cash, scheme: cash_flow, include: [principal]}
    interest_paid: {entity: company, account: cash, scheme: cash_flow, include: [interest]}
    dividends: {entity: company, account: cash, scheme: cash_flow, include: [dividends]}
    financing: {entity: company, account: cash, scheme: cash_flow, include: [principal, interest, dividends]}
    net_cash: {entity: company, account: cash, scheme: cash_flow, include: [project, lifecycle, principal, interest, dividends]}
  measures: {}

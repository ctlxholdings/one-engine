# Workbook "bodmer_solar_case_study": Edward Bodmer's solar project-finance case study, a 6,000 kW merchant
# solar plant in euro with a sculpted senior loan, saved on the Base Case (Scenario E3 = 1) with Excel's
# iterative calculation converged (cases/reference/workbooks/bodmer_solar_case_study.xlsm). Origin: this
# repository, generic_engine/tests/fixtures/oracles/bodmer_solar/Solar-Case-Study-Complete.xlsm (the generic
# engine's fixture); vendored unmodified 2026-10-13. Licence: Edward Bodmer (edbodmer.com),
# Solar-Case-Study-Complete.xlsm. The macros are never run; only the saved values are read.
#
# Every amount is a workbook input by name (a typed cell, a number typed inside a formula, a typed row), or
# a formula over them (generator `src`). Period t is column K + t of the Operating and Financing Model
# sheets (111 columns, K to DQ): t = 0-3 the development months (Sep-Dec 2015), t = 4-8 the construction
# months (Jan-May 2016, financial close at t = 4), t = 9-108 the operating quarters (Jun 2016 to May 2041,
# COD at t = 9), t = 109-110 after decommissioning. Repayment runs t = 9-88 (20 years, Assumptions G140).
# Rows on other sheets map their columns to t as each figure's `periods` says (Assumptions F:AT by price
# year, E:J by crisis year).
#   * generation: Assumptions F20 kW at a P50 net yield (Scenario G16 x H16 / 100 kWh/kWp; F28 is NORMINV at
#     E28 = 0.5, the mean) spread by month on F36:F47, degraded at F21 a year compounded monthly (row 15);
#     each calendar month falls in the period that contains it (rows 18-43);
#   * price: the Scenario L16 price row (Scenario 24-28) times the merchant multiplier K16 / 100, by
#     calendar year (Operating Model row 108); revenue is each month's MWh at that price (row 109). The
#     crisis prices (Assumptions 112-124, Scenario E33 = 3) are computed but not applied (G139 = Assumptions
#     F107 is FALSE): the case books them in a memo book, `crisis`, beside the plant;
#   * capex: four development lines (euro/kW x kW) spread evenly over the development months, seven EPC lines
#     (Scenario E16 and F16 set two of the rates) over the construction months; each line is its own
#     account, capitalised to CWIP, in service at COD and depreciated straight-line over F127 years
#     (row 149-154), for the books and for tax;
#   * opex: the O&M fee (Scenario M16 / 10 euro/kW-year), battery O&M, administration and insurance per kW,
#     indexed by inflation from COD compounded monthly (rows 68-74), and rent, property tax, utility and
#     own consumption per year; inverter replacements at F82 and F83 years after COD (2096: never);
#   * tax: F128 of EBITDA less depreciation, losses carried forward without limit (Financing Model 150-160);
#     interest and fees are not deductible (row 153 leaves the interest of row 152 out);
#   * senior loan, sculpted: in each repayment quarter the debt service is CFADS (EBITDA less tax, row 16)
#     over the DSCR F132 (row 22); the size is that service discounted at the loan's own index (row 29),
#     G31 = H34; interest is the opening balance x (base F146 + the spread of the five-year band from COD,
#     row 25) x months / 12. The up-front fee F151 x the size is paid at financial close, the commitment fee
#     F152 on the undrawn commitment during construction. The principal is the sizing ledger's (rows 33-37,
#     row 104; G110 is FALSE so the typed schedule of row 107 is not used), capped by the balance (row 115);
#     a quarter whose service is below its interest adds the difference to the debt;
#   * funding: equity first, F136 of (budget less debt) (G65), the budget being the capex and the financing
#     costs typed in the "Fixed" column I55:I57; then each month's uses (capex, IDC, up-front and commitment
#     fees, computed) pro rata, debt H67 and equity H66. The computed costs fall below the typed ones
#     (J58 = 2,728.43), so the loan drawn (I114, 3,407,446.18) stays below its commitment (3,409,676.29);
#   * waterfall from COD: tax, interest, principal, then the sweep (row 176: F157 of what remains, nil here,
#     paid down the senior debt) and the rest to equity (row 177); after maturity tax, the sweep and equity;
#   * the circular blocks: the sculpted size is the loop `debt_size` (rule sculpt). The waterfall's CFADS
#     (row 16) carries the share repayment flag / F132, so the CFADS it records is row 22's debt service
#     capacity and the rule sculpts on it at a DSCR of 1. The memo book `memo` draws the sized ledger of rows
#     33-37 (loan `sizer`) at the last construction month and settles its interest and principal as due;
#     the loop closes in two runs (the capacity does not depend on the debt, interest not being deductible)
#     with tolerance 0. The funding needs no loop:
#     the budget is typed, the commitment comes from the loop, and each month's IDC and fees are computed on
#     the balance drawn so far, as the workbook's converged iteration has them;
#   * physical rows, prices, rates, indices and flags are drivers.
#
# Where the books disagree with the workbook (the workbook wins; these are its own formula slips):
#   * Operating Model K96:DQ96 "Total O&M" is SUM(K87:K95): it adds row 87, the capacity in kW (6,000), to
#     the euro costs of every operating quarter: T96 is 31,986.39 against 25,986.39 for the cost lines
#     (I96 3,399,665.83 against 2,799,665.83). EBITDA (row 142) is 6,000 lower in each operating quarter
#     (T142 99,503.15 against 105,503.15), and with it everything after: K104, K144, K156-K164; Financing
#     Model K13-K22 (T22 68,622.86 against 72,760.79), the sculpted size G31 = H34 = G61 (3,409,676.29
#     against 3,587,932.54), the sources and uses and funding rows 55-97 (equity up front G81 507,935.02
#     against 436,632.52) and the up-front equity to date K82, K83, K87, K89, the loan rows 113-131, the tax
#     rows 150-161, the waterfall 166-184, the DSCR T185:CU185 (1.4504 against 1.45 at T), the PLCR G193 =
#     G189 / G191 (1.7840 against 1.7782) with T199:CU199 and T213:CU213 (T199 1.7852 against 1.7782), the
#     lender flows L201 and rows 206-207; Summary F7, F9, F30, F31.
#     Put back in a scratch copy (opex + row 87), every one of those figures agrees, the sculpt and the
#     funding included;
#   * the generation totals stop at column BR (period 59) where every other I-column total runs to DQ:
#     Operating Model I31:I42 (the third cell of G31:I31 ... G42:I42; I31 8,960.38 against 16,731.38 over
#     the 100 quarters) and I43 = SUM(K43:BR43), 162,481.89 MWh against 310,071.86; Operating Model I10
#     and Financing Model I10 = SUM(K10:BR10) count 51 operating quarters, not 100;
#   * Financing Model K196:AA196 and K197:AA197 (the PLCR's present values, array formulas) lack the
#     "* previous index" that AB196 onwards apply, so U199:AA199 (= U196 / U198) discount to the wrong date;
#     T213:CU213 repeats row 199. With the K96 slip put back, every other PLCR cell agrees, and U199 is
#     1.7769 against 1.7920 in the books, AA199 1.7125 against 1.8170;
#   * not compared, for the record: Financing Model G146 = I131 + I124 leaves out the IDC I121 (57,402.82
#     against 74,785.40), an amortisation memo nothing reads; Assumptions F14 = EDATE(F9, F10) adds
#     construction periods as months, the same here as F3 = 1. And latent: the lender flows L201 =
#     -L93 + L75 + L76 + L77 + L152 + L171 + L174 - L173 leave out the sweep L176, nil here, so the row
#     agrees.
workbook: bodmer_solar_case_study
entity: spv
plant: Assumptions__F20
case:
  case: workbook-bodmer-solar-case-study
  periods: 111
  phases: ["accrue", "fund", "operate", "tax", "pay", "close"]
  currency: EUR
  floors: {"spv.cash": 0}
  generators:
    src:
      kind: formulas
      periods: 111
      inputs: workbook
      values:
        # the step every truncated root and index is rounded down to (1e-30)
        trunc_unit: "(1 / 1000) ** 10"
        # periods before COD (Assumptions F12 = F10 + F7, F10 = Scenario I16)
        pre_periods: "Assumptions__F7 + Scenario__I16"
        # row 4: the period number (row 3, typed 1, 2, ... from column K) is within the pre-COD periods
        precod: "t + 1 <= pre_periods"
        # row 5: months in each period
        months: "Assumptions__F3 if precod else Assumptions__F4"
        # row 8
        dev_flag: "(t + 1 <= Assumptions__F7) * 1"
        months_to_date: "cumsum(months)"
        # Assumptions F6 = Scenario H98 = INDEX(F95:F106, J96): month J96 of the typed calendar from F95
        start0: "EOMONTH(Scenario__F95, Scenario__J96 - 2) + 1"
        # row 6, the day count of each period's first day
        pstart: "EOMONTH(start0, months_to_date - months - 1) + 1"
        # row 7
        pend: "EOMONTH(start0, months_to_date - 1)"
        # Assumptions F8
        dev_months: "Assumptions__F7 * Assumptions__F3"
        # Assumptions F9, financial close = EDATE(F6, F8)
        fc: "EOMONTH(start0, dev_months - 1) + 1"
        # Assumptions F11
        constr_months: "Scenario__I16 * Assumptions__F3"
        # Assumptions F14 (the workbook adds F10, the periods, as months: the same with F3 = 1)
        cod: "EOMONTH(fc, constr_months - 1) + 1"
        # Assumptions F16 = F15 * 12, F15 = Scenario J16
        op_months: "Scenario__J16 * 12"
        # Assumptions F17
        decom: "EOMONTH(cod, op_months - 1) + 1"
        # row 9
        constr_flag: "(pstart >= fc) * (pstart < cod)"
        not_constr: "1 - constr_flag"
        # row 10
        op_flag: "(pstart >= cod) * (pstart < decom)"
        # the loan is drawn before COD only
        pre_flag: "(pstart < cod) * 1"
        # Assumptions F142 = EDATE(F14, F140 * 12), F140 = G140
        maturity: "EOMONTH(cod, Assumptions__G140 * 12 - 1) + 1"
        # Financing Model row 21
        repay_flag: "(pstart >= cod) * (pstart < maturity)"
        # Financing Model G34 = EDATE(F141, -1): the sizing draw
        draw_flag: "(pstart == EOMONTH(cod, 0 - 2) + 1) * 1"
        # row 67: inflation applies from Assumptions H72 = F14
        infl_flag: "(pstart >= cod) * 1"
        # Assumptions F85, F86: inverter replacements
        inv1: "EOMONTH(cod, Assumptions__F82 * 12 - 1) + 1"
        inv2: "EOMONTH(cod, Assumptions__F83 * 12 - 1) + 1"
        inv1_flag: "(pstart == inv1) * 1"
        inv2_flag: "(pstart == inv2) * 1"
        start_month: "MONTH(pstart)"
        # row 107
        year_end: "YEAR(pend)"
        # the last pre-COD period (the loan is available until then)
        last_pre: "pre_periods - 1"
        # the first period after operations
        dispose_period: "pre_periods + op_months / Assumptions__F4"
        # Operating Model I8: the development flags (row 8) number F7
        dev_count: "Assumptions__F7 + 0"
        # I9: construction periods
        constr_count: "constr_months / Assumptions__F3"
        # H47:H50 = 1 / I8
        dev_share: "1 / dev_count"
        # H54:H61 = 1 / I9
        constr_share: "1 / constr_count"
        one: "1"
        # the twelfth root of 1 + F21 (Operating Model K14 = (1 + G14) ^ (K5 / 12) - 1)
        deg_x0: "1"
        deg_n1: "deg_x0 - (deg_x0 ** 12 - (1 + Assumptions__F21)) / (12 * deg_x0 ** 11)"
        deg_x1: "deg_n1 - deg_n1 % trunc_unit"
        deg_n2: "deg_x1 - (deg_x1 ** 12 - (1 + Assumptions__F21)) / (12 * deg_x1 ** 11)"
        deg_x2: "deg_n2 - deg_n2 % trunc_unit"
        deg_n3: "deg_x2 - (deg_x2 ** 12 - (1 + Assumptions__F21)) / (12 * deg_x2 ** 11)"
        deg_x3: "deg_n3 - deg_n3 % trunc_unit"
        deg_n4: "deg_x3 - (deg_x3 ** 12 - (1 + Assumptions__F21)) / (12 * deg_x3 ** 11)"
        deg_x4: "deg_n4 - deg_n4 % trunc_unit"
        deg_n5: "deg_x4 - (deg_x4 ** 12 - (1 + Assumptions__F21)) / (12 * deg_x4 ** 11)"
        deg_x5: "deg_n5 - deg_n5 % trunc_unit"
        # row 14
        deg_rate: "deg_x5 ** months - 1"
        op_months_t: "months * op_flag"
        deg_count: "cumsum(op_months_t)"
        deg_idx_raw: "deg_x5 ** deg_count"
        # row 15, the degradation index
        deg_idx: "deg_idx_raw - deg_idx_raw % trunc_unit"
        # row 13 (and row 87)
        capacity: "Assumptions__F20 * op_flag"
        # row 16
        cap_deg: "capacity / deg_idx"
        # F23
        pr: "Scenario__H16 / Assumptions__F23__n1"
        # F24
        net_yield: "Scenario__G16 * pr"
        # F27
        yield_sd: "net_yield * Assumptions__F26"
        # F28 = NORMINV(E28, F24, F27): the mean at E28 = 0.5; another probability needs NORM.INV, which the formulas lack
        p50: "net_yield if 2 * Assumptions__E28 == 1 else net_yield / 0"
        # F32 = INDEX(F28:F30, E32): P50 (E32 = 1)
        applied_yield: "p50 if Assumptions__E32 == 1 else p50 / 0"
        # F33
        net_cf: "applied_yield / Assumptions__F33__n1"
        # rows 36-47: kWh/kWp by month (G), hours (I), capacity factor (J)
        mg_jan: "applied_yield * Assumptions__F36"
        mh_jan: "Assumptions__H36 * Assumptions__I36__n1"
        mcf_jan: "mg_jan / mh_jan"
        mg_feb: "applied_yield * Assumptions__F37"
        mh_feb: "Assumptions__H37 * Assumptions__I37__n1"
        mcf_feb: "mg_feb / mh_feb"
        mg_mar: "applied_yield * Assumptions__F38"
        mh_mar: "Assumptions__H38 * Assumptions__I38__n1"
        mcf_mar: "mg_mar / mh_mar"
        mg_apr: "applied_yield * Assumptions__F39"
        mh_apr: "Assumptions__H39 * Assumptions__I39__n1"
        mcf_apr: "mg_apr / mh_apr"
        mg_may: "applied_yield * Assumptions__F40"
        mh_may: "Assumptions__H40 * Assumptions__I40__n1"
        mcf_may: "mg_may / mh_may"
        mg_jun: "applied_yield * Assumptions__F41"
        mh_jun: "Assumptions__H41 * Assumptions__I41__n1"
        mcf_jun: "mg_jun / mh_jun"
        mg_jul: "applied_yield * Assumptions__F42"
        mh_jul: "Assumptions__H42 * Assumptions__I42__n1"
        mcf_jul: "mg_jul / mh_jul"
        mg_aug: "applied_yield * Assumptions__F43"
        mh_aug: "Assumptions__H43 * Assumptions__I43__n1"
        mcf_aug: "mg_aug / mh_aug"
        mg_sep: "applied_yield * Assumptions__F44"
        mh_sep: "Assumptions__H44 * Assumptions__I44__n1"
        mcf_sep: "mg_sep / mh_sep"
        mg_oct: "applied_yield * Assumptions__F45"
        mh_oct: "Assumptions__H45 * Assumptions__I45__n1"
        mcf_oct: "mg_oct / mh_oct"
        mg_nov: "applied_yield * Assumptions__F46"
        mh_nov: "Assumptions__H46 * Assumptions__I46__n1"
        mcf_nov: "mg_nov / mh_nov"
        mg_dec: "applied_yield * Assumptions__F47"
        mh_dec: "Assumptions__H47 * Assumptions__I47__n1"
        mcf_dec: "mg_dec / mh_dec"
        # row 48
        mg_total: "mg_jan + mg_feb + mg_mar + mg_apr + mg_may + mg_jun + mg_jul + mg_aug + mg_sep + mg_oct + mg_nov + mg_dec"
        days_total: "Assumptions__H36 + Assumptions__H37 + Assumptions__H38 + Assumptions__H39 + Assumptions__H40 + Assumptions__H41 + Assumptions__H42 + Assumptions__H43 + Assumptions__H44 + Assumptions__H45 + Assumptions__H46 + Assumptions__H47"
        mh_total: "mh_jan + mh_feb + mh_mar + mh_apr + mh_may + mh_jun + mh_jul + mh_aug + mh_sep + mh_oct + mh_nov + mh_dec"
        mcf_total: "mg_total / mh_total"
        # rows 18-29 (find_month): 1 when the calendar month falls in the period
        flag_jan: "((Assumptions__E36 - start_month) % 12 < months) * 1"
        gen_jan: "mcf_jan * mh_jan * flag_jan * cap_deg / Operating_Model__K31__n1"
        flag_feb: "((Assumptions__E37 - start_month) % 12 < months) * 1"
        gen_feb: "mcf_feb * mh_feb * flag_feb * cap_deg / Operating_Model__K31__n1"
        flag_mar: "((Assumptions__E38 - start_month) % 12 < months) * 1"
        gen_mar: "mcf_mar * mh_mar * flag_mar * cap_deg / Operating_Model__K31__n1"
        flag_apr: "((Assumptions__E39 - start_month) % 12 < months) * 1"
        gen_apr: "mcf_apr * mh_apr * flag_apr * cap_deg / Operating_Model__K31__n1"
        flag_may: "((Assumptions__E40 - start_month) % 12 < months) * 1"
        gen_may: "mcf_may * mh_may * flag_may * cap_deg / Operating_Model__K31__n1"
        flag_jun: "((Assumptions__E41 - start_month) % 12 < months) * 1"
        gen_jun: "mcf_jun * mh_jun * flag_jun * cap_deg / Operating_Model__K31__n1"
        flag_jul: "((Assumptions__E42 - start_month) % 12 < months) * 1"
        gen_jul: "mcf_jul * mh_jul * flag_jul * cap_deg / Operating_Model__K31__n1"
        flag_aug: "((Assumptions__E43 - start_month) % 12 < months) * 1"
        gen_aug: "mcf_aug * mh_aug * flag_aug * cap_deg / Operating_Model__K31__n1"
        flag_sep: "((Assumptions__E44 - start_month) % 12 < months) * 1"
        gen_sep: "mcf_sep * mh_sep * flag_sep * cap_deg / Operating_Model__K31__n1"
        flag_oct: "((Assumptions__E45 - start_month) % 12 < months) * 1"
        gen_oct: "mcf_oct * mh_oct * flag_oct * cap_deg / Operating_Model__K31__n1"
        flag_nov: "((Assumptions__E46 - start_month) % 12 < months) * 1"
        gen_nov: "mcf_nov * mh_nov * flag_nov * cap_deg / Operating_Model__K31__n1"
        flag_dec: "((Assumptions__E47 - start_month) % 12 < months) * 1"
        gen_dec: "mcf_dec * mh_dec * flag_dec * cap_deg / Operating_Model__K31__n1"
        # row 43, MWh
        gen_total: "gen_jan + gen_feb + gen_mar + gen_apr + gen_may + gen_jun + gen_jul + gen_aug + gen_sep + gen_oct + gen_nov + gen_dec"
        # Assumptions H54:H67, euro/kW times kW
        dev_legal_total: "Assumptions__F64 * Assumptions__F20"
        dev_legal_spend: "dev_legal_total * dev_share * dev_flag"
        dev_accounting_total: "Assumptions__F65 * Assumptions__F20"
        dev_accounting_spend: "dev_accounting_total * dev_share * dev_flag"
        dev_engineer_total: "Assumptions__F66 * Assumptions__F20"
        dev_engineer_spend: "dev_engineer_total * dev_share * dev_flag"
        dev_misc_total: "Assumptions__F67 * Assumptions__F20"
        dev_misc_spend: "dev_misc_total * dev_share * dev_flag"
        epc_panel_total: "Scenario__E16 * Assumptions__F20"
        epc_panel_spend: "epc_panel_total * constr_share * constr_flag"
        epc_racking_total: "Assumptions__F55 * Assumptions__F20"
        epc_racking_spend: "epc_racking_total * constr_share * constr_flag"
        epc_bos_total: "Scenario__F16 * Assumptions__F20"
        epc_bos_spend: "epc_bos_total * constr_share * constr_flag"
        epc_site_total: "Assumptions__F57 * Assumptions__F20"
        epc_site_spend: "epc_site_total * constr_share * constr_flag"
        epc_special_total: "Assumptions__F58 * Assumptions__F20"
        epc_special_spend: "epc_special_total * constr_share * constr_flag"
        epc_battery_total: "Assumptions__F59 * Assumptions__F20"
        epc_battery_spend: "epc_battery_total * constr_share * constr_flag"
        epc_misc_total: "Assumptions__F60 * Assumptions__F20"
        epc_misc_spend: "epc_misc_total * constr_share * constr_flag"
        dev_total: "dev_legal_total + dev_accounting_total + dev_engineer_total + dev_misc_total"
        epc_total: "epc_panel_total + epc_racking_total + epc_bos_total + epc_site_total + epc_special_total + epc_battery_total + epc_misc_total"
        # Operating Model I63 = G153
        capex_total: "dev_total + epc_total"
        # Assumptions F61
        epc_per_kw: "Scenario__E16 + Assumptions__F55 + Scenario__F16 + Assumptions__F57 + Assumptions__F58 + Assumptions__F59 + Assumptions__F60"
        # Assumptions F68
        dev_per_kw: "Assumptions__F64 + Assumptions__F65 + Assumptions__F66 + Assumptions__F67"
        # Summary F19
        cost_per_kw: "epc_per_kw + dev_per_kw"
        # inflation of O&M (row 68, G72), of administration (row 69, G74) and other (row 70, G75)
        omi_x0: "1"
        omi_n1: "omi_x0 - (omi_x0 ** 12 - (1 + Assumptions__G72)) / (12 * omi_x0 ** 11)"
        omi_x1: "omi_n1 - omi_n1 % trunc_unit"
        omi_n2: "omi_x1 - (omi_x1 ** 12 - (1 + Assumptions__G72)) / (12 * omi_x1 ** 11)"
        omi_x2: "omi_n2 - omi_n2 % trunc_unit"
        omi_n3: "omi_x2 - (omi_x2 ** 12 - (1 + Assumptions__G72)) / (12 * omi_x2 ** 11)"
        omi_x3: "omi_n3 - omi_n3 % trunc_unit"
        omi_n4: "omi_x3 - (omi_x3 ** 12 - (1 + Assumptions__G72)) / (12 * omi_x3 ** 11)"
        omi_x4: "omi_n4 - omi_n4 % trunc_unit"
        omi_n5: "omi_x4 - (omi_x4 ** 12 - (1 + Assumptions__G72)) / (12 * omi_x4 ** 11)"
        omi_x5: "omi_n5 - omi_n5 % trunc_unit"
        adi_x0: "1"
        adi_n1: "adi_x0 - (adi_x0 ** 12 - (1 + Assumptions__G74)) / (12 * adi_x0 ** 11)"
        adi_x1: "adi_n1 - adi_n1 % trunc_unit"
        adi_n2: "adi_x1 - (adi_x1 ** 12 - (1 + Assumptions__G74)) / (12 * adi_x1 ** 11)"
        adi_x2: "adi_n2 - adi_n2 % trunc_unit"
        adi_n3: "adi_x2 - (adi_x2 ** 12 - (1 + Assumptions__G74)) / (12 * adi_x2 ** 11)"
        adi_x3: "adi_n3 - adi_n3 % trunc_unit"
        adi_n4: "adi_x3 - (adi_x3 ** 12 - (1 + Assumptions__G74)) / (12 * adi_x3 ** 11)"
        adi_x4: "adi_n4 - adi_n4 % trunc_unit"
        adi_n5: "adi_x4 - (adi_x4 ** 12 - (1 + Assumptions__G74)) / (12 * adi_x4 ** 11)"
        adi_x5: "adi_n5 - adi_n5 % trunc_unit"
        oti_x0: "1"
        oti_n1: "oti_x0 - (oti_x0 ** 12 - (1 + Assumptions__G75)) / (12 * oti_x0 ** 11)"
        oti_x1: "oti_n1 - oti_n1 % trunc_unit"
        oti_n2: "oti_x1 - (oti_x1 ** 12 - (1 + Assumptions__G75)) / (12 * oti_x1 ** 11)"
        oti_x2: "oti_n2 - oti_n2 % trunc_unit"
        oti_n3: "oti_x2 - (oti_x2 ** 12 - (1 + Assumptions__G75)) / (12 * oti_x2 ** 11)"
        oti_x3: "oti_n3 - oti_n3 % trunc_unit"
        oti_n4: "oti_x3 - (oti_x3 ** 12 - (1 + Assumptions__G75)) / (12 * oti_x3 ** 11)"
        oti_x4: "oti_n4 - oti_n4 % trunc_unit"
        oti_n5: "oti_x4 - (oti_x4 ** 12 - (1 + Assumptions__G75)) / (12 * oti_x4 ** 11)"
        oti_x5: "oti_n5 - oti_n5 % trunc_unit"
        # rows 68-70
        infl_om: "omi_x5 ** months - 1"
        infl_admin: "adi_x5 ** months - 1"
        infl_other: "oti_x5 ** months - 1"
        infl_months_t: "months * infl_flag"
        infl_count: "cumsum(infl_months_t)"
        idx_om_raw: "omi_x5 ** infl_count"
        # rows 72-74
        idx_om: "idx_om_raw - idx_om_raw % trunc_unit"
        idx_admin_raw: "adi_x5 ** infl_count"
        idx_admin: "idx_admin_raw - idx_admin_raw % trunc_unit"
        idx_other_raw: "oti_x5 ** infl_count"
        idx_other: "idx_other_raw - idx_other_raw % trunc_unit"
        # Assumptions F72 = Scenario M16 / 10, euro/kW-yr
        om_fee_rate: "Scenario__M16 / Assumptions__F72__n1"
        # rows 77-84: per kW (or per year) in each period
        om_fee_unit: "om_fee_rate * months / 12 * idx_om"
        # H77:H84 = G / 12 * H76 (H76 = H5 = F4)
        om_fee_qrate: "om_fee_rate / 12 * Assumptions__F4"
        om_fee_base: "capacity * months / 12 * idx_om"
        om_fee_cost: "capacity * om_fee_unit"
        battery_om_unit: "Assumptions__F73 * months / 12 * idx_om"
        battery_om_qrate: "Assumptions__F73 / 12 * Assumptions__F4"
        battery_om_base: "capacity * months / 12 * idx_om"
        battery_om_cost: "capacity * battery_om_unit"
        admin_unit: "Assumptions__F74 * months / 12 * idx_admin"
        admin_qrate: "Assumptions__F74 / 12 * Assumptions__F4"
        admin_base: "capacity * months / 12 * idx_admin"
        admin_cost: "capacity * admin_unit"
        insurance_unit: "Assumptions__F75 * months / 12 * idx_other"
        insurance_qrate: "Assumptions__F75 / 12 * Assumptions__F4"
        insurance_base: "capacity * months / 12 * idx_other"
        insurance_cost: "capacity * insurance_unit"
        rent_unit: "Assumptions__F76 * months / 12"
        rent_qrate: "Assumptions__F76 / 12 * Assumptions__F4"
        rent_base: "op_flag * months / 12"
        # rows 92-95: a cost per year in operation (K94 and K95 leave out the flag; both are nil)
        rent_cost: "rent_unit * op_flag"
        property_tax_unit: "Assumptions__F77 * months / 12 * idx_om"
        property_tax_qrate: "Assumptions__F77 / 12 * Assumptions__F4"
        property_tax_base: "op_flag * months / 12 * idx_om"
        property_tax_cost: "property_tax_unit * op_flag"
        utility_unit: "Assumptions__F78 * months / 12 * idx_om"
        utility_qrate: "Assumptions__F78 / 12 * Assumptions__F4"
        utility_base: "op_flag * months / 12 * idx_om"
        utility_cost: "utility_unit * op_flag"
        consumption_unit: "Assumptions__F79 * months / 12 * idx_om"
        consumption_qrate: "Assumptions__F79 / 12 * Assumptions__F4"
        consumption_base: "op_flag * months / 12 * idx_om"
        consumption_cost: "consumption_unit * op_flag"
        # rows 99-102
        inverter1_cost: "Assumptions__F88 * inv1_flag * capacity"
        inverter2_cost: "Assumptions__F89 * inv2_flag * capacity"
        # Scenario F20 = L16, the revenue scenario
        price_code: "Scenario__L16 + 0"
        # Scenario row 30 = INDEX(F24:F28, F20) = Assumptions row 100, by column F.. AT (t = 0..40)
        price_col: "(Scenario__F24_AT24 if price_code == 1 else Scenario__F25_AT25 if price_code == 2 else Scenario__F26_AT26 if price_code == 3 else Scenario__F27_AT27 if price_code == 4 else Scenario__F28_AT28) if t <= Scenario__AT23 - Scenario__G23 + 1 else 0"
        # Assumptions F97
        merchant: "Scenario__K16 / Assumptions__F97__n1"
        # Assumptions row 101
        merchant_col: "merchant * price_col"
        # LOOKUP(year, row 99, row 101): column F (the start year) until G23, then one column a year
        price_index: "(year_end >= Scenario__G23) * (year_end - Scenario__G23 + 1)"
        # row 108, euro/MWh
        price: "lag(merchant_col, t - price_index)"
        crisis_code: "Scenario__E33 + 0"
        # Assumptions E113:J124 = CHOOSE(Scenario E33, the three crisis tables), by column E..J (t = 0..5)
        crisis_jan: "(Scenario__E37_J37 if crisis_code == 1 else Scenario__E53_J53 if crisis_code == 2 else Scenario__E69_J69) if t <= 5 else 0"
        crisis_feb: "(Scenario__E38_J38 if crisis_code == 1 else Scenario__E54_J54 if crisis_code == 2 else Scenario__E70_J70) if t <= 5 else 0"
        crisis_mar: "(Scenario__E39_J39 if crisis_code == 1 else Scenario__E55_J55 if crisis_code == 2 else Scenario__E71_J71) if t <= 5 else 0"
        crisis_apr: "(Scenario__E40_J40 if crisis_code == 1 else Scenario__E56_J56 if crisis_code == 2 else Scenario__E72_J72) if t <= 5 else 0"
        crisis_may: "(Scenario__E41_J41 if crisis_code == 1 else Scenario__E57_J57 if crisis_code == 2 else Scenario__E73_J73) if t <= 5 else 0"
        crisis_jun: "(Scenario__E42_J42 if crisis_code == 1 else Scenario__E58_J58 if crisis_code == 2 else Scenario__E74_J74) if t <= 5 else 0"
        crisis_jul: "(Scenario__E43_J43 if crisis_code == 1 else Scenario__E59_J59 if crisis_code == 2 else Scenario__E75_J75) if t <= 5 else 0"
        crisis_aug: "(Scenario__E44_J44 if crisis_code == 1 else Scenario__E60_J60 if crisis_code == 2 else Scenario__E76_J76) if t <= 5 else 0"
        crisis_sep: "(Scenario__E45_J45 if crisis_code == 1 else Scenario__E61_J61 if crisis_code == 2 else Scenario__E77_J77) if t <= 5 else 0"
        crisis_oct: "(Scenario__E46_J46 if crisis_code == 1 else Scenario__E62_J62 if crisis_code == 2 else Scenario__E78_J78) if t <= 5 else 0"
        crisis_nov: "(Scenario__E47_J47 if crisis_code == 1 else Scenario__E63_J63 if crisis_code == 2 else Scenario__E79_J79) if t <= 5 else 0"
        crisis_dec: "(Scenario__E48_J48 if crisis_code == 1 else Scenario__E64_J64 if crisis_code == 2 else Scenario__E80_J80) if t <= 5 else 0"
        # LOOKUP(year, Assumptions row 112): E112 is the start year, F112 typed, G112 and H112 the next two, I112 and J112 typed
        crisis_index: "(year_end >= Assumptions__F112) + (year_end >= Assumptions__F112 + 1) + (year_end >= Assumptions__F112 + 2) + (year_end >= Assumptions__I112) + (year_end >= Assumptions__J112)"
        # rows 111-122
        crisis_price_jan: "lag(crisis_jan, t - crisis_index) * price"
        # revenue by month (row 109 is their sum)
        rev_jan: "gen_jan * price"
        # revenue by month at the crisis prices (rows 125-136), booked in a memo: Operating Model G139 (Assumptions F107, 'Apply Crisis Assumptions') is FALSE
        crev_jan: "gen_jan * crisis_price_jan"
        crisis_price_feb: "lag(crisis_feb, t - crisis_index) * price"
        rev_feb: "gen_feb * price"
        crev_feb: "gen_feb * crisis_price_feb"
        crisis_price_mar: "lag(crisis_mar, t - crisis_index) * price"
        rev_mar: "gen_mar * price"
        crev_mar: "gen_mar * crisis_price_mar"
        crisis_price_apr: "lag(crisis_apr, t - crisis_index) * price"
        rev_apr: "gen_apr * price"
        crev_apr: "gen_apr * crisis_price_apr"
        crisis_price_may: "lag(crisis_may, t - crisis_index) * price"
        rev_may: "gen_may * price"
        crev_may: "gen_may * crisis_price_may"
        crisis_price_jun: "lag(crisis_jun, t - crisis_index) * price"
        rev_jun: "gen_jun * price"
        crev_jun: "gen_jun * crisis_price_jun"
        crisis_price_jul: "lag(crisis_jul, t - crisis_index) * price"
        rev_jul: "gen_jul * price"
        crev_jul: "gen_jul * crisis_price_jul"
        crisis_price_aug: "lag(crisis_aug, t - crisis_index) * price"
        rev_aug: "gen_aug * price"
        crev_aug: "gen_aug * crisis_price_aug"
        crisis_price_sep: "lag(crisis_sep, t - crisis_index) * price"
        rev_sep: "gen_sep * price"
        crev_sep: "gen_sep * crisis_price_sep"
        crisis_price_oct: "lag(crisis_oct, t - crisis_index) * price"
        rev_oct: "gen_oct * price"
        crev_oct: "gen_oct * crisis_price_oct"
        crisis_price_nov: "lag(crisis_nov, t - crisis_index) * price"
        rev_nov: "gen_nov * price"
        crev_nov: "gen_nov * crisis_price_nov"
        crisis_price_dec: "lag(crisis_dec, t - crisis_index) * price"
        rev_dec: "gen_dec * price"
        crev_dec: "gen_dec * crisis_price_dec"
        # tax depreciation over F127 years of quarters from COD
        dep_life: "Assumptions__F127 * 12 / Assumptions__F4"
        # H149
        dep_rate_year: "1 / Assumptions__F127"
        # row 149
        dep_rate_q: "dep_rate_year * op_flag / 12 * months"
        # row 150
        dep_left: "1 - cumsum(dep_rate_q) + dep_rate_q"
        # row 151
        dep_adj: "max(min(dep_rate_q, dep_left), 0)"
        annual_dep: "capex_total / Assumptions__F127"
        # Assumptions F132
        dscr: "Assumptions__G132 / 100"
        # the repayment quarters
        tenor_periods: "Assumptions__G140 * 12 / Assumptions__F4"
        # Assumptions H147:J147, five-year bands from COD
        cod60: "EOMONTH(cod, Assumptions__H147__n1 - 1) + 1"
        cod120: "EOMONTH(cod60, Assumptions__I147__n1 - 1) + 1"
        cod180: "EOMONTH(cod120, Assumptions__J147__n1 - 1) + 1"
        # row 25 = LOOKUP(start, Assumptions row 147, row 148)
        spread: "Assumptions__J148 if pstart >= cod180 else Assumptions__I148 if pstart >= cod120 else Assumptions__H148 if pstart >= cod60 else Assumptions__G148 if pstart >= cod else Assumptions__F148"
        # row 26
        rate: "Assumptions__F146 + spread"
        # row 28
        period_rate: "rate / 12 * months"
        band2: "op_flag * (pstart >= cod) * (pstart < cod60)"
        band3: "op_flag * (pstart >= cod60) * (pstart < cod120)"
        band4: "op_flag * (pstart >= cod120) * (pstart < cod180)"
        band5: "op_flag * (pstart >= cod180)"
        # row 29, the interest index compounded over the operating quarters
        rate_index: "(1 + (Assumptions__F146 + Assumptions__G148) / 12 * Assumptions__F4) ** cumsum(band2) * (1 + (Assumptions__F146 + Assumptions__H148) / 12 * Assumptions__F4) ** cumsum(band3) * (1 + (Assumptions__F146 + Assumptions__I148) / 12 * Assumptions__F4) ** cumsum(band4) * (1 + (Assumptions__F146 + Assumptions__J148) / 12 * Assumptions__F4) ** cumsum(band5)"
        # the commitment fee is charged during construction (row 129 times K9)
        cfee_rate: "Assumptions__F152 * constr_flag"
        # row 130
        cfee_periodic: "Assumptions__F152 * months / 12"
        # the financing costs typed in the 'Fixed' column, I55:I57 (Summary F27)
        fixed_fin: "Financing_Model__I55 + Financing_Model__I56 + Financing_Model__I57"
        fixed_fin_t0: "fixed_fin * (t == 0)"
        fixed_idc_t0: "Financing_Model__I55 * (t == 0)"
        fixed_upfront_t0: "Financing_Model__I56 * (t == 0)"
        fixed_cfee_t0: "Financing_Model__I57 * (t == 0)"
        # G58, the sources and uses total
        budget: "capex_total + fixed_fin"
        # Assumptions F157
        sweep: "Assumptions__G157 / 100"
        # row 176: the sweep share from Assumptions F156 = F14
        sweep_flagged: "sweep * (pstart >= cod)"
        # row 101
        repay_counter: "Financing_Model__K101 + cumsum(op_flag)"
        # row 108 = LOOKUP(row 101, row 106, row 107): the key's own column, and in the closing run of 50s the last column
        fixed_rep: "Financing_Model__K107_DQ107 if (Financing_Model__K106_DQ106 == repay_counter) * (repay_counter < Financing_Model__DQ106) else Financing_Model__DQ107"
        # I107
        fixed_typed_cum: "cumsum(Financing_Model__K107_DQ107)"
        fixed_rep_cum: "cumsum(fixed_rep)"
        # the LCOE discount rate (G169) and inflation (G170)
        nom_x0: "1"
        nom_n1: "nom_x0 - (nom_x0 ** 12 - (1 + Assumptions__F103)) / (12 * nom_x0 ** 11)"
        nom_x1: "nom_n1 - nom_n1 % trunc_unit"
        nom_n2: "nom_x1 - (nom_x1 ** 12 - (1 + Assumptions__F103)) / (12 * nom_x1 ** 11)"
        nom_x2: "nom_n2 - nom_n2 % trunc_unit"
        nom_n3: "nom_x2 - (nom_x2 ** 12 - (1 + Assumptions__F103)) / (12 * nom_x2 ** 11)"
        nom_x3: "nom_n3 - nom_n3 % trunc_unit"
        nom_n4: "nom_x3 - (nom_x3 ** 12 - (1 + Assumptions__F103)) / (12 * nom_x3 ** 11)"
        nom_x4: "nom_n4 - nom_n4 % trunc_unit"
        nom_n5: "nom_x4 - (nom_x4 ** 12 - (1 + Assumptions__F103)) / (12 * nom_x4 ** 11)"
        nom_x5: "nom_n5 - nom_n5 % trunc_unit"
        inf_x0: "1"
        inf_n1: "inf_x0 - (inf_x0 ** 12 - (1 + Assumptions__F104)) / (12 * inf_x0 ** 11)"
        inf_x1: "inf_n1 - inf_n1 % trunc_unit"
        inf_n2: "inf_x1 - (inf_x1 ** 12 - (1 + Assumptions__F104)) / (12 * inf_x1 ** 11)"
        inf_x2: "inf_n2 - inf_n2 % trunc_unit"
        inf_n3: "inf_x2 - (inf_x2 ** 12 - (1 + Assumptions__F104)) / (12 * inf_x2 ** 11)"
        inf_x3: "inf_n3 - inf_n3 % trunc_unit"
        inf_n4: "inf_x3 - (inf_x3 ** 12 - (1 + Assumptions__F104)) / (12 * inf_x3 ** 11)"
        inf_x4: "inf_n4 - inf_n4 % trunc_unit"
        inf_n5: "inf_x4 - (inf_x4 ** 12 - (1 + Assumptions__F104)) / (12 * inf_x4 ** 11)"
        inf_x5: "inf_n5 - inf_n5 % trunc_unit"
        # G171
        real_rate: "(1 + Assumptions__F103) / (1 + Assumptions__F104) - 1"
        # row 169
        disc_nom: "nom_x5 ** months - 1"
        # row 170
        disc_infl: "inf_x5 ** months - 1"
        # row 171 (the twelfth root of the ratio is the ratio of the roots)
        disc_real: "(nom_x5 / inf_x5) ** months - 1"
        nom_factor_raw: "nom_x5 ** months_to_date"
        # row 173
        nom_factor: "nom_factor_raw - nom_factor_raw % trunc_unit"
        real_factor_raw: "(nom_x5 / inf_x5) ** months_to_date"
        # row 174
        real_factor: "real_factor_raw - real_factor_raw % trunc_unit"
        # Scenario E30 = K14 = INDEX(K7:K12, E3)
        scen_merchant: "Scenario__K7 if Scenario__E3 == 1 else Scenario__K8 if Scenario__E3 == 2 else Scenario__K9 if Scenario__E3 == 3 else Scenario__K10 if Scenario__E3 == 4 else Scenario__K11 if Scenario__E3 == 5 else Scenario__K12"
        # Assumptions F137
        eq_prorata_share: "1 - Assumptions__F136"
        # Operating Data J5:J8, cost per kW
        od_J5: "Operating_Data__I5 / Operating_Data__K5"
        od_J6: "Operating_Data__I6 / Operating_Data__K6"
        od_J7: "Operating_Data__I7 / Operating_Data__K7"
        od_J8: "Operating_Data__I8 / Operating_Data__K8"
        # row 10 = INDEX(rows 5-8, E2)
        od_E10: "Operating_Data__E5 if Operating_Data__E2 == 1 else Operating_Data__E6 if Operating_Data__E2 == 2 else Operating_Data__E7 if Operating_Data__E2 == 3 else Operating_Data__E8"
        od_F10: "Operating_Data__F5 if Operating_Data__E2 == 1 else Operating_Data__F6 if Operating_Data__E2 == 2 else Operating_Data__F7 if Operating_Data__E2 == 3 else Operating_Data__F8"
        od_G10: "Operating_Data__G5 if Operating_Data__E2 == 1 else Operating_Data__G6 if Operating_Data__E2 == 2 else Operating_Data__G7 if Operating_Data__E2 == 3 else Operating_Data__G8"
        od_H10: "Operating_Data__H5 if Operating_Data__E2 == 1 else Operating_Data__H6 if Operating_Data__E2 == 2 else Operating_Data__H7 if Operating_Data__E2 == 3 else Operating_Data__H8"
        od_I10: "Operating_Data__I5 if Operating_Data__E2 == 1 else Operating_Data__I6 if Operating_Data__E2 == 2 else Operating_Data__I7 if Operating_Data__E2 == 3 else Operating_Data__I8"
        od_J10: "od_J5 if Operating_Data__E2 == 1 else od_J6 if Operating_Data__E2 == 2 else od_J7 if Operating_Data__E2 == 3 else od_J8"
        od_K10: "Operating_Data__K5 if Operating_Data__E2 == 1 else Operating_Data__K6 if Operating_Data__E2 == 2 else Operating_Data__K7 if Operating_Data__E2 == 3 else Operating_Data__K8"
        od_L10: "Operating_Data__L5 if Operating_Data__E2 == 1 else Operating_Data__L6 if Operating_Data__E2 == 2 else Operating_Data__L7 if Operating_Data__E2 == 3 else Operating_Data__L8"
        od_M10: "Operating_Data__M5 if Operating_Data__E2 == 1 else Operating_Data__M6 if Operating_Data__E2 == 2 else Operating_Data__M7 if Operating_Data__E2 == 3 else Operating_Data__M8"
        # N10 = INDEX(N5:N8, E2) of an empty column
        od_N10: "0"
        od_O10: "Operating_Data__O5 if Operating_Data__E2 == 1 else Operating_Data__O6 if Operating_Data__E2 == 2 else Operating_Data__O7 if Operating_Data__E2 == 3 else Operating_Data__O8"
        od_P10: "Operating_Data__P5 if Operating_Data__E2 == 1 else Operating_Data__P6 if Operating_Data__E2 == 2 else Operating_Data__P7 if Operating_Data__E2 == 3 else Operating_Data__P8"
        od_Q10: "Operating_Data__Q5 if Operating_Data__E2 == 1 else Operating_Data__Q6 if Operating_Data__E2 == 2 else Operating_Data__Q7 if Operating_Data__E2 == 3 else Operating_Data__Q8"
        od_R10: "Operating_Data__R5 if Operating_Data__E2 == 1 else Operating_Data__R6 if Operating_Data__E2 == 2 else Operating_Data__R7 if Operating_Data__E2 == 3 else Operating_Data__R8"
        od_E11: "od_E10 / od_J10"
        od_F11: "od_F10 / od_J10"
        od_G11: "od_G10 / od_J10"
        od_H11: "od_H10 / od_J10"
        od_I11: "od_I10 / od_J10"
        od_O11: "od_O10 / od_K10"
        od_P11: "od_P10 / od_K10"
        od_Q11: "od_Q10 / od_K10"
        od_R11: "od_R10 / od_K10"
        # row 26, the PPP exchange rate, column by column
        fx_F: "Operating_Data__E26 * (1 + Operating_Data__F25) / (1 + Operating_Data__F24)"

notes: >
  The figures in the header's "where the books disagree" list are the workbook's own formula slips, kept
  read so the receipt shows them. Figures left unreported wait on the engine (none is set aside for it):
  XIRR over the period-end dates (Operating Model G146, G166; Financing Model G181, G202; Summary F2-F5;
  Scenario R6): the xirr measure takes typed ISO dates, which the traced gate refuses, and cannot take the
  generator's day counts. NORM.INV (Assumptions F29, F30): the formulas have no inverse normal. A minimum
  over periods (Financing Model G185, Summary F8): no reading takes the least of a series. The default line
  (K134-K137, K139, K173, K174, K208, K209): a standby loan that lends the debt-service shortfall MAX(-K172,
  0) at the senior rate and is repaid from later surplus; the waterfall leaves a shortfall as arrears and
  deficit_funding refills only cash below its floor. It never draws here, so K152, K170, K172 and K175 are
  read without its (nil) interest and repayment.
  Readings worth knowing: the kW cells that repeat F20 inside a row of costs (Assumptions G54:G67) are read
  as the operating capacity at COD; the typed euro/kW and euro/kW-year rates there and in Operating Model
  G78:G84 are read back from the books as each line's booked cost over its kW (or kW-years, years); G149
  (F127 years) is the cost placed in service over a year's depreciation. Summary F27 is the sum of the typed
  financing costs I55:I57 (a budget the books fund against, not a flow). The sizing ledger and the crisis
  revenue are memo books (`memo`, `crisis`); a memo balance is read as the running total of its cut. The
  LCOE (Operating Model G178 = G176 / G177, Summary F22) is the revenue over the nominal discount factor
  over the MWh over the real one, both summed; the PLCR at COD (G193, Summary F9) the CFADS over the loan's
  index, summed, over the sculpted debt; the forward PLCR (T199:CU199, T213:CU213) the CFADS still to come
  over the index, over the opening debt over the previous index, plus `plcr_pad`, one outside the repayment
  quarters where the debt is nil (those periods are not compared). The up-front equity to date (K82, K83,
  K87, K89) is a running total of the funding record's paid.up_front, and the sweep (K116, K176, K210) the
  waterfall record's paid.sweep. Twelfth roots (monthly degradation, inflation, discounting) are Newton
  steps truncated at 1e-30, and the indices compounded from them are truncated the same way; the LOOKUPs
  over typed year rows are exact column choices.

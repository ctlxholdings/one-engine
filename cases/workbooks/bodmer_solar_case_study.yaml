        fxr_P: "fx_P * Operating_Data__P27"
        fx_Q: "fx_P * (1 + Operating_Data__Q25) / (1 + Operating_Data__Q24)"
        fxr_Q: "fx_Q * Operating_Data__Q27"
        fx_R: "fx_Q * (1 + Operating_Data__R25) / (1 + Operating_Data__R24)"
        fxr_R: "fx_R * Operating_Data__R27"
        fx_S: "fx_R * (1 + Operating_Data__S25) / (1 + Operating_Data__S24)"
        fxr_S: "fx_S * Operating_Data__S27"
        fx_T: "fx_S * (1 + Operating_Data__T25) / (1 + Operating_Data__T24)"

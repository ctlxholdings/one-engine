        fx_AE: "fx_AD * (1 + Operating_Data__AE25) / (1 + Operating_Data__AE24)"
        fxr_AE: "fx_AE * Operating_Data__AE27"
        fx_AF: "fx_AE * (1 + Operating_Data__AF25) / (1 + Operating_Data__AF24)"
        fxr_AF: "fx_AF * Operating_Data__AF27"
        fx_AG: "fx_AF * (1 + Operating_Data__AG25) / (1 + Operating_Data__AG24)"
        fxr_AG: "fx_AG * Operating_Data__AG27"
        fx_AH: "fx_AG * (1 + Operating_Data__AH25) / (1 + Operating_Data__AH24)"
        fxr_AH: "fx_AH * Operating_Data__AH27"
        fx_AI: "fx_AH * (1 + Operating_Data__AI25) / (1 + Operating_Data__AI24)"
        fxr_AI: "fx_AI * Operating_Data__AI27"
        fx_AJ: "fx_AI * (1 + Operating_Data__AJ25) / (1 + Operating_Data__AJ24)"
        fxr_AJ: "fx_AJ * Operating_Data__AJ27"
        fx_AK: "fx_AJ * (1 + Operating_Data__AK25) / (1 + Operating_Data__AK24)"
        fxr_AK: "fx_AK * Operating_Data__AK27"
        fx_AL: "fx_AK * (1 + Operating_Data__AL25) / (1 + Operating_Data__AL24)"
        fxr_AL: "fx_AL * Operating_Data__AL27"
        fx_AM: "fx_AL * (1 + Operating_Data__AM25) / (1 + Operating_Data__AM24)"
        fxr_AM: "fx_AM * Operating_Data__AM27"
        fx_AN: "fx_AM * (1 + Operating_Data__AN25) / (1 + Operating_Data__AN24)"
        fxr_AN: "fx_AN * Operating_Data__AN27"
        fx_AO: "fx_AN * (1 + Operating_Data__AO25) / (1 + Operating_Data__AO24)"
        fxr_AO: "fx_AO * Operating_Data__AO27"
        fx_AP: "fx_AO * (1 + Operating_Data__AP25) / (1 + Operating_Data__AP24)"
        fxr_AP: "fx_AP * Operating_Data__AP27"
        fx_AQ: "fx_AP * (1 + Operating_Data__AQ25) / (1 + Operating_Data__AQ24)"
        fxr_AQ: "fx_AQ * Operating_Data__AQ27"
        fx_AR: "fx_AQ * (1 + Operating_Data__AR25) / (1 + Operating_Data__AR24)"
        fxr_AR: "fx_AR * Operating_Data__AR27"
        fx_AS: "fx_AR * (1 + Operating_Data__AS25) / (1 + Operating_Data__AS24)"
        fxr_AS: "fx_AS * Operating_Data__AS27"
        # the sources and uses total, once (for readings summed over the periods)
        budget_t0: "budget * (t == 0)"
        # the period of financial close (Assumptions F9; Financing Model H124)
        fc_period: "dev_months / Assumptions__F3"
        # the last repayment quarter (Assumptions F142)
        last_repay: "pre_periods + tenor_periods - 1"
        tail_from: "last_repay + 1"
        # each opex line's base (kW-years, or years), one outside operations
        om_fee_div: "om_fee_base + 1 - op_flag"
        battery_om_div: "battery_om_base + 1 - op_flag"
        admin_div: "admin_base + 1 - op_flag"
        insurance_div: "insurance_base + 1 - op_flag"
        rent_div: "rent_base + 1 - op_flag"
        property_tax_div: "property_tax_base + 1 - op_flag"
        utility_div: "utility_base + 1 - op_flag"
        consumption_div: "consumption_base + 1 - op_flag"
        # Financing Model row 22 = CFADS / F132 in the repayment quarters: the share of the CFADS the sculpted service takes
        sizing_share: "repay_flag / dscr"
        # the discount index one period back (Financing Model row 197's previous column; one at the start)
        rate_index_prev: "lag(rate_index, 1) + (t == 0)"
        # one outside the repayment span, so the forward PLCR's denominator is never nil where the workbook shows nothing
        plcr_pad: "(t <= fc_period) + (t > last_repay)"

# Workbook "cattle_integration_financial_model": the Baghara cattle-integration project in Chad (field crops, a
# feed centre, a dairy farm and dairy processing, a beef farm and beef processing, HQ and land), built in years
# 0-4 and run for 20 years, financed by one CAPEX loan per construction year and by working-capital loans
# (Baghara repository, 02-Financial-Models/Cattle-Integration/"00-Baghara cattle integration financial
# model.xlsx", vendored unmodified 2026-10-13 with Ali's agreement; cases/reference/workbooks/
# cattle_integration_financial_model.xlsx).
#
# Every amount is a workbook input by name (a typed cell, or a number typed inside a formula) or a formula over
# them (generator `src`; `herd` for the monthly beef herd, `qtr` for the quarterly loan table).
# Periods: t is the workbook's year t. t = 0 is construction year 0 (Fin.Statements C, CAPEX Financing C,
# Dashboard E, CAPEX E), t = 1-20 are the operating years (Fin.Statements D:W, Data Input D:W, WC Financing D:W,
# Dashboard F:Y; OPEX H:S hold years 1-12, flat after), t = 21 is the terminal-value column (Fin.Statements X).
# The thousand-euro mirrors (Fin.Statements AA:AU, Dashboard AC:AI, OPEX C120:J124, CAPEX's presentation table)
# are read with scale 1000. Beef Herd Movement C:AL are months 1-36 (generator `herd`, t = month - 1); CAPEX
# Financing C35:AP40 are quarters (generator `qtr`, t = quarter - 1).
#   * revenue (real, year-1 prices): field crops and heifer sales typed by year (Revenues rows 7 and 15); dairy
#     products are the raw-milk volume (Dairy Product Composition C11) split by the product shares C13:C18, priced
#     at G13:G18 and ramped by the dairy ramp H12:S12; beef is calves and cows slaughtered (Beef Product
#     Composition D6:D7) times live weight, dressing and cut shares, priced at Revenues A18:A21. Nominal revenue
#     is real revenue x (1 + Data Input D38)^(year - 1) x the price factor Dashboard C100 (the uplift is its own
#     income line);
#   * OPEX (OPEX sheet, by business line): fixed lines and lines at a rate of a base, ramped by the dairy ramp
#     (row 46) or the beef ramp (row 64), classed COGS or SG&A as Data Input rows 6-7 sum them; nominal as revenue,
#     with the OPEX factor C101;
#   * CAPEX by category and year 0-4 (CAPEX rows 52 ... 243, pasted values) x the CAPEX factor C102; each year's
#     capex is a vintage depreciated straight-line over Data Input C12 + Depreciation C9 years (reinvested at the
#     end of its life when Data Input I12 = 1, which it is not here);
#   * each vintage is funded by a CAPEX loan for the loan share (1 - the equity share Dashboard C103) of capex,
#     arrangement fees (D26 of capex), a DSRA of one quarterly instalment (if O5) and IDC on the monthly draw
#     schedule (rows 48 of each block, if N5): loan = share x (capex + fees) / (1 - share x (instalment rate +
#     IDC rate)), the fixed point the workbook reaches through its data tables D54:X55 etc.; the loan is a
#     quarterly annuity at D19 over D20 years after D21 - 1 grace years (interest only), its DSRA released in the
#     loan's last year; the draw goes through a clearing account to cash and to the DSRA, the rest is equity;
#   * working capital: inventory and payables at a rate of COGS, receivables at a rate of revenue (Data Input
#     rows 45-47, by year then flat); each year's cash shortfall below the minimum cash D37 (Fin.Statements
#     D99:M99) is funded by a working-capital loan for 1 - D32 of it (the rest equity), grossed up for its own
#     first-year interest net of tax, repaid as an annual annuity at D29 over D30 years after D31 grace years;
#   * tax at D35 on cumulative profit (losses carried forward) once the D34-year holiday is over;
#   * valuation: free cash flow to the firm and to equity, discounted at the WACC (D39 x equity share + D19 x
#     (1 - D35) x loan share), with a terminal value on year 20's flow growing at D41 (a valuation book, so NPV
#     and IRR are cuts and measures); simple and discounted paybacks to the tenth of a year; DSCR, margins, ROI,
#     ROCE, current ratio and debt/equity as drivers;
#   * the sensitivity tables (Dashboard rows 107-136) are variants: price factor, OPEX factor, CAPEX factor and
#     equity share at D:H;
#   * physical quantities (heads of the beef herd, litres of milk, kilograms, ramp shares) and ratios are drivers.
# Set aside: the Dairy Herd Movement sheet (its herd size C2 is #REF!; nothing reads it and it holds no money),
# copies of typed inputs (parameter rows of the loan blocks, ramp and price copies), and an empty check row.
#
# Where the books disagree with the workbook (the workbook wins; these are its own slips, kept read):
#   (a) CAPEX Financing C35:AP35: each loan's quarterly table stops at quarter 40 (typed 1-40), but the loan is
#       K5 x M5 = 52 instalments after (L5 - 1) x M5 = 8 grace quarters; rows 43-44 (SUMIF over the table) pay
#       nothing after year 10, so loan 1 still owes W59 = 17,611,400.18 at year 20 (books: repaid, 0) and its
#       year-11 interest N43 is 0 (books 987,450.37); C59 at year 10: 17,611,400.18 against 14,495,694.70, total
#       CAPEX interest N23 (year 11) 128,949.85 against 1,116,400.22. Its DSRA is still released in year 15.
#   (b) Fin.Statements W5 ='Data Input'!W5*(1+'Data Input'!$D$38)^(W$4-1)*Dashboard!$C$100 (and W6, W8): the
#       Data Input grid stops at column V (year 19), so year 20's revenue, COGS and SG&A are 0 (books W5
#       65,064,020.05, W6 -25,780,761.94); year 20's working capital unwinds (W25 2,502,986.60 against -75,089.60)
#       and its tax turns into a refund, so FCFF W54 is 986,094.16 (books 24,176,373.15) and the terminal value
#       X54, 25,571,594.20, is built on it (books 626,946,625.87).
#   (c) OPEX H89:S89 =$F89*H$46: beef-processing maintenance ramps with the dairy ramp (row 46, 12.26% in year 1)
#       instead of the beef ramp (row 64, 50%) that the block's other lines use: H89 3,386.91 against 13,816.30,
#       year-1 SG&A (OPEX H111, Data Input D7) 2,294,976.78 against 2,306,449.11, and on through tax, working
#       capital, the working-capital loans and every return.
#   (d) Beef Herd Movement O25:O28 =SUM(O7,O13,O19): column O is month 13, but O7:O10 hold the year-1 totals
#       (=SUM(C7:N7)), so month 13 shows 8,185.99 imported calves against 629.69 (O26 487.5 against 37.5, O27
#       266.825 against 20.525, O28 8,406.67 against 646.67). Nothing reads rows 25-28.
#   (e) The sensitivity tables Dashboard D108:H111 (data tables on C100:C103) were computed while the inner data
#       tables that break the model's circularities stayed at their base values (Excel does not recompute a data
#       table inside another one's substitution): Fin.Statements D101:M101 (the cash each year's working-capital
#       loan covers) and CAPEX Financing D54:X55 ... D170:X171 (IDC and DSRA by loan share). So no sensitivity
#       re-sizes the working-capital loans, nor, for CAPEX, the IDC and DSRA. Holding those values at base
#       reproduces every cached cell of the price and OPEX tables to the digit (a development check). The payback
#       rows read here (D112:H112, D120:H120, D128:H128, D136:H136 =IF(D110=21,"Over 20 Years",D110)) are
#       therefore, workbook against books (every slip corrected), D:H: price 10.2, 8.4, 7.3, 6.3, 5.4 against
#       12.3, 8.9, 7.3, 6.1, 5.3; OPEX 5.8, 6.7, 7.3, 8, 8.7 against 5.6, 6.4, 7.3, 8.3, 9.5; CAPEX 6.6, 7, 7.3,
#       7.6, 7.9 against 6.5, 7, 7.3, 7.7, 8; equity share 6.9, 7.5, 7.9, 8.3, 8.6 against 7, 7.5, 7.8, 8.2, 8.4.
#       With (a)-(d) kept and only the working capital re-sized, the price row would read 11.9, 8.8, 7.3, 6, 5.3.
# With (a)-(c) corrected, Dashboard C6 (equity NPV, thousand euro) is 299,139.74 against 112,100.80 and C7 (equity
# IRR) 28.18% against 26.20%.
# Formula oddities without effect on any number here: Fin.Statements I90 and V90 subtract SUM(Dashboard!$E$27:Z27)
# (the range drifts; row 27, the loan fees, is blank after year 4); WC Financing C15 totals loans 1-5 only (6-10 are nil); WC
# Financing's blocks for years 11-20 (rows 208 on) repeat loans 1-5 and feed nothing; FCFF leaves out
# reinvestment (nil: Data Input I12 = 0).
workbook: cattle_integration_financial_model
entity: farm
plant: Dairy_Product_Composition__C11
case:
  case: workbook-cattle
  periods: 32
  phases: [operate]
  currency: EUR
  floors: {}
  generators:
    src:
      kind: formulas
      periods: 32
      inputs: workbook
      values: {price_factor: Dashboard__C100 + 0, opex_factor: Dashboard__C101 + 0, capex_factor: Dashboard__C102 + 0, equity_share: Dashboard__C103__n1
          / Dashboard__C103__n2, loan_share: 1 - equity_share, infl: (1 + Data_Input__D38) ** (t - 1), live: (t >= 1) * (t <= 20), horizon: (t <= 20), ramp_dairy: (t
          == 1) * Dairy_Product_Composition__H12 + (t == 2) * Dairy_Product_Composition__I12 + (t == 3) * Dairy_Product_Composition__J12 + (t == 4) * Dairy_Product_Composition__K12
          + (t == 5) * Dairy_Product_Composition__L12 + (t == 6) * Dairy_Product_Composition__M12 + (t == 7) * Dairy_Product_Composition__N12 + (t == 8)
          * Dairy_Product_Composition__O12 + (t == 9) * Dairy_Product_Composition__P12 + (t == 10) * Dairy_Product_Composition__Q12 + (t == 11) * Dairy_Product_Composition__R12
          + (t == 12) * Dairy_Product_Composition__S12 + (t >= 13) * (t <= 20) * Dairy_Product_Composition__S12, qty_past: Dairy_Product_Composition__C11
          * Dairy_Product_Composition__C15, qty_uht: Dairy_Product_Composition__C11 * Dairy_Product_Composition__C16, qty_fuht: Dairy_Product_Composition__C11
          * Dairy_Product_Composition__C17, qty_yog: Dairy_Product_Composition__C11 * Dairy_Product_Composition__C18, qty_fyog: Dairy_Product_Composition__C11
          * Dairy_Product_Composition__C19, qty_ice: Dairy_Product_Composition__C11 * Dairy_Product_Composition__C20, qty_total: qty_past + qty_uht + qty_fuht
          + qty_yog + qty_fyog + qty_ice, share_total: Dairy_Product_Composition__C15 + Dairy_Product_Composition__C16 + Dairy_Product_Composition__C17
          + Dairy_Product_Composition__C18 + Dairy_Product_Composition__C19 + Dairy_Product_Composition__C20, rev_past: qty_past * Dairy_Product_Composition__G15
          * ramp_dairy, rev_uht: qty_uht * Dairy_Product_Composition__G16 * ramp_dairy, rev_fuht: qty_fuht * Dairy_Product_Composition__G17 * ramp_dairy,
        rev_yog: qty_yog * Dairy_Product_Composition__G18 * ramp_dairy, rev_fyog: qty_fyog * Dairy_Product_Composition__G19 * ramp_dairy, rev_ice: qty_ice
          * Dairy_Product_Composition__G20 * ramp_dairy, rev_heifer: (t == 1) * Revenues__C15 + (t == 2) * Revenues__D15 + (t == 3) * Revenues__E15 + (t
          == 4) * Revenues__F15 + (t == 5) * Revenues__G15 + (t == 6) * Revenues__H15 + (t == 7) * Revenues__I15 + (t == 8) * Revenues__J15 + (t == 9) *
          Revenues__K15 + (t == 10) * Revenues__L15 + (t == 11) * Revenues__M15 + (t == 12) * Revenues__N15 + (t >= 13) * (t <= 20) * Revenues__N15, rev_crops: (t
          == 1) * Revenues__C7 + (t == 2) * Revenues__D7 + (t == 3) * Revenues__E7 + (t == 4) * Revenues__F7 + (t == 5) * Revenues__G7 + (t == 6) * Revenues__H7
          + (t == 7) * Revenues__I7 + (t == 8) * Revenues__J7 + (t == 9) * Revenues__K7 + (t == 10) * Revenues__L7 + (t == 11) * Revenues__M7 + (t == 12)
          * Revenues__N7 + (t >= 13) * (t <= 20) * Revenues__N7, calves: (t == 1) * Beef_Product_Composition__D6 + (t == 2) * Beef_Product_Composition__E6
          + (t == 3) * Beef_Product_Composition__F6 + (t == 4) * Beef_Product_Composition__G6 + (t == 5) * Beef_Product_Composition__H6 + (t == 6) * Beef_Product_Composition__I6
          + (t == 7) * Beef_Product_Composition__J6 + (t == 8) * Beef_Product_Composition__K6 + (t == 9) * Beef_Product_Composition__L6 + (t == 10) * Beef_Product_Composition__M6
          + (t == 11) * Beef_Product_Composition__N6 + (t == 12) * Beef_Product_Composition__O6 + (t >= 13) * (t <= 20) * Beef_Product_Composition__O6,
        cows: (t == 1) * Beef_Product_Composition__D7 + (t == 2) * Beef_Product_Composition__E7 + (t == 3) * Beef_Product_Composition__F7 + (t == 4) * Beef_Product_Composition__G7
          + (t == 5) * Beef_Product_Composition__H7 + (t == 6) * Beef_Product_Composition__I7 + (t == 7) * Beef_Product_Composition__J7 + (t == 8) * Beef_Product_Composition__K7
          + (t == 9) * Beef_Product_Composition__L7 + (t == 10) * Beef_Product_Composition__M7 + (t == 11) * Beef_Product_Composition__N7 + (t == 12) *
          Beef_Product_Composition__O7 + (t >= 13) * (t <= 20) * Beef_Product_Composition__O7, live_kg: calves * Beef_Product_Composition__E20 + cows *
          Beef_Product_Composition__E21, carcass_kg: live_kg * Beef_Product_Composition__E22 * Beef_Product_Composition__A9, meat_share: Beef_Product_Composition__A10__n1
          - Beef_Product_Composition__A9, meat_kg: live_kg * Beef_Product_Composition__E22 * Beef_Product_Composition__E23 * meat_share, offal_kg: live_kg
          * Beef_Product_Composition__A11, skins: calves + cows, rev_carcass: Revenues__A18 * carcass_kg, rev_meat: Revenues__A19 * meat_kg, rev_offal: Revenues__A20
          * offal_kg, rev_skin: Revenues__A21 * skins, rev_dairy: rev_past + rev_uht + rev_fuht + rev_yog + rev_fyog + rev_ice + rev_heifer, rev_beef: rev_carcass
          + rev_meat + rev_offal + rev_skin, rev_real: rev_crops + rev_dairy + rev_beef, rev_uplift: rev_real * (infl * price_factor - 1), revenue: rev_real
          + rev_uplift, rev_per_litre: (qty_past * Dairy_Product_Composition__G15 + qty_uht * Dairy_Product_Composition__G16 + qty_fuht * Dairy_Product_Composition__G17
          + qty_yog * Dairy_Product_Composition__G18 + qty_fyog * Dairy_Product_Composition__G19 + qty_ice * Dairy_Product_Composition__G20) / Dairy_Product_Composition__C11,
        rawval_past: Dairy_Product_Composition__C11 * Dairy_Product_Composition__C15 * Dairy_Product_Composition__A25, added_past: (rev_past - rawval_past)
          / rawval_past if rawval_past != 0 else 0, qshare_past: qty_past / qty_total, rawval_uht: Dairy_Product_Composition__C11 * Dairy_Product_Composition__C16
          * Dairy_Product_Composition__A25, added_uht: (rev_uht - rawval_uht) / rawval_uht if rawval_uht != 0 else 0, qshare_uht: qty_uht / qty_total, rawval_fuht: Dairy_Product_Composition__C11
          * Dairy_Product_Composition__C17 * Dairy_Product_Composition__A25, added_fuht: (rev_fuht - rawval_fuht) / rawval_fuht if rawval_fuht != 0 else
          0, qshare_fuht: qty_fuht / qty_total, rawval_yog: Dairy_Product_Composition__C11 * Dairy_Product_Composition__C18 * Dairy_Product_Composition__A25,
        added_yog: (rev_yog - rawval_yog) / rawval_yog if rawval_yog != 0 else 0, qshare_yog: qty_yog / qty_total, rawval_fyog: Dairy_Product_Composition__C11
          * Dairy_Product_Composition__C19 * Dairy_Product_Composition__A25, added_fyog: (rev_fyog - rawval_fyog) / rawval_fyog if rawval_fyog != 0 else
          0, qshare_fyog: qty_fyog / qty_total, rawval_ice: Dairy_Product_Composition__C11 * Dairy_Product_Composition__C20 * Dairy_Product_Composition__A25,
        added_ice: (rev_ice - rawval_ice) / rawval_ice if rawval_ice != 0 else 0, qshare_ice: qty_ice / qty_total, rawval_total: rawval_past + rawval_uht
          + rawval_fuht + rawval_yog + rawval_fyog + rawval_ice, rev_dairy_products: rev_past + rev_uht + rev_fuht + rev_yog + rev_fyog + rev_ice, added_total: (rev_dairy_products
          - rawval_total) / rawval_total, ishare_past: rev_past / rev_dairy_products if rev_dairy_products != 0 else 0, ishare_uht: rev_uht / rev_dairy_products
          if rev_dairy_products != 0 else 0, ishare_fuht: rev_fuht / rev_dairy_products if rev_dairy_products != 0 else 0, ishare_yog: rev_yog / rev_dairy_products
          if rev_dairy_products != 0 else 0, ishare_fyog: rev_fyog / rev_dairy_products if rev_dairy_products != 0 else 0, ishare_ice: rev_ice / rev_dairy_products
          if rev_dairy_products != 0 else 0, ishare_total: ishare_past + ishare_uht + ishare_fuht + ishare_yog + ishare_fyog + ishare_ice, ramp_beef: (t
          == 1) * OPEX__H64 + (t == 2) * OPEX__I64 + (t == 3) * OPEX__J64 + (t == 4) * OPEX__K64 + (t == 5) * OPEX__L64 + (t == 6) * OPEX__M64 + (t == 7)
          * OPEX__N64 + (t == 8) * OPEX__O64 + (t == 9) * OPEX__P64 + (t == 10) * OPEX__Q64 + (t == 11) * OPEX__R64 + (t == 12) * OPEX__S64 + (t >= 13)
          * (t <= 20) * OPEX__S64, f7: OPEX__D7 * OPEX__E7, f8: OPEX__D8 * OPEX__E8, f9: OPEX__D9 * OPEX__E9, f10: OPEX__D10 * OPEX__E10, f11: OPEX__D11

# Workbook "macabacus_lbo_short": Macabacus's short-form ("Simple") LBO model, sheets "Cover Page" and "LBO",
# a leveraged buyout of a listed company in its active financing case, "LBO C" (F39 = 6), with a ten-year
# forecast and the holders' returns at an exit in year K18.
# Origin (cases/reference/workbooks/macabacus_lbo_short.xlsx, per MANIFEST.json):
# this repository, generic_engine/tests/fixtures/oracles/macabacus_lbo/macabacus-lbo-short.xlsx (the generic engine's fixture); vendored unmodified 2026-10-13
#
# Every amount is a workbook input by name (a typed cell, or a number typed inside a formula: LBO__P10,
# LBO__G46__n1), or a formula over them (generator `src`). Fifteen periods, read from the "LBO" sheet's columns:
#   t = 0..3   the most recent quarter (MRQ) and the three quarters after it: columns E, F, G, H;
#   t = 4      the close: column J is the balance sheet at close, column I its change (the deal's adjustments);
#              the dashboard (rows 9-52), the sources and uses (rows 825-899) and the transaction balance
#              sheet (rows 903-960) are read at t = 4, their pre-deal column E at t = 3;
#   t = 5..14  the fiscal years 1..10: columns K to T.
# The books (entity `company`):
#   * opening balances are the MRQ balance sheet (E221:E266; PP&E gross from E229 and the literals of E228,
#     cash and PP&E before the MRQ's own capex, which is posted in period 0); retained earnings balance it
#     (E244 is typed 59.132999999999996, so the typed sheet is out by 4e-15);
#   * the quarters: the MRQ's income statement against retained earnings (it is already in E266), the three
#     rollforward quarters against cash: sales, COGS, SG&A as typed; depreciation and amortisation typed;
#     stock-based compensation as F150 - F151 - F153; the legacy debt's interest at its rate (O879, or LIBOR +
#     P879) on its opening balance over the literal 4 of F468; tax at the blended rate F704 x (1 - F705) +
#     F705 on income before tax less equity income, and the dividends-received deduction's taxes (rows
#     379-385) in accounts of their own; the common dividend E185 per share; working capital held at the
#     MRQ's ratios (E351:E359, the literal 4 annualising) to the quarter's sales or COGS (selector D351:D359);
#     capex typed (row 184); asset-sale proceeds (row 300) typed nil, posted against an account of disposals;
#   * the pre-deal income statement is closed into retained earnings at the close;
#   * the deal (rulebook `acquisition`, at t = 4): the offer is P10 x (1 + P11) for the basic shares E814,
#     plus the shares the legacy debt converts into when its price T879 is at or below the offer (row 899:
#     the converted face becomes paid-in capital, as Q899), plus in-the-money options (rows 740-749, their
#     strike proceeds deducted); book equity (par, APIC, retained earnings) is eliminated, the old goodwill
#     written off, PP&E marked up by the literal 15 of G46 and intangibles by G42 of the excess purchase
#     price, a DTL at K24 on the marks, goodwill the rest; the legacy debt is refinanced (O870); the minimum
#     cash K23 stays; transaction costs (advisory D857 and sponsor D858 of the equity price, legal,
#     accounting, printing and other of the active case) are expensed with their tax benefit as cash;
#     financing fees (K880:K888 x the amounts, the revolver's on its commitment) are capitalised with their
#     tax as a DTL; preferred issue costs (J889 = 1: netted) reduce paid-in capital net of tax; the sources
#     are the term loan A, senior note, subordinated note, preferred A and management equity of case 6
#     (column N of rows 834-846), the sponsor's equity the residual (N845); the refinancing's typed tax
#     adjustment M948 (nil) is posted against the DTL;
#   * the years: sales grow at K144 / LTM sales - 1 (K189); COGS, SG&A, standalone depreciation and
#     amortisation, stock-based compensation and capex stay at year 1's ratios to sales (rows 192-197);
#     capex is depreciated straight-line by vintage (rows 639-654: life K640, salvage K641), the existing
#     assets take the rest of standalone depreciation; the PP&E write-up is depreciated over K46 years and
#     the intangibles write-up amortised over K47 years from year 1 (rows 658-694); working capital at
#     the close's ratios to LTM sales or COGS (J351:J359); interest on cash at K571 of the opening cash;
#     no common dividend once the deal closes (K185);
#   * the financing: loans (contract `loan`) at their fixed coupon O, else LIBOR (K570:T570) + spread P, on
#     the opening balance (the "average interest?" switch K25 is 0, so there is no circular interest and the
#     saved values are not an iteration); the revolver's undrawn commitment fee K572; scheduled amortisation
#     at Q a year with the rest at the bullet year R (rows 397-408); capitalised fees amortised over L years
#     (rows 616-627); preferred A's dividend at O889 in cash; a waterfall pays tax, fees, interest,
#     dividends and scheduled principal, keeps K23 of cash, then sweeps the remaining cash into the loans
#     in order at their sweep shares S (rows 431-442);
#   * not modelled because the active case never needs them: a revolver draw on a cash shortfall after the close
#     (the cash never falls short), and a legacy debt kept after the close (O870 = 1 refinances it);
#   * tax (rulebook `income_tax`) at the blended rate on the book income before tax, the fee amortisation,
#     equity income and the deal's costs and benefit left out (as row 717 does); the fees' tax basis is nil,
#     so their amortisation releases the DTL (row 720);
#   * the exit (lens `exit_returns`) in year K18 at K19 x EBITDA less net debt (debt, preferred, minority
#     interest and leases less cash); each holder's stream is what it was paid to the exit, its claim then
#     and its share of the equity: the sponsor and management pro rata to what they paid, diluted by the
#     equity kickers G974:G983 and management's performance equity H984; IRRs are XIRRs on the period dates
#     (MRQ K11, quarter ends, close K13, then year ends), as rows 1019-1072.
# Rates, counts, shares and flags are drivers: the scheduled amortisation shares, interest rates, the
# write-ups' schedules, tax rates, option counts and proceeds, share counts, the working-capital ratios and
# days, growth and the year-1 ratios held flat, the copies of K19, K20, K640, K641, K46, K47, P10.
#
# Where the books disagree with the workbook (the workbook wins; this is its own slip):
#   * the income statement's year 1 types depreciation K149 = 15.8 and amortisation K151 = 14.9, the
#     standalone figures (K669, K692), where every later year takes the pro forma schedules (L149 = L671,
#     L151 = L694). The schedules depreciate the PP&E write-up and amortise the intangibles write-up from
#     year 1 (K670 = 2.142857, K693 = 21.891070; K671 = 17.942857, K694 = 36.791070), so the statements
#     leave 24.033927 of write-up D&A out of year 1 and their balance sheet never writes the write-ups off
#     (PP&E and intangibles stay 2.142857 and 21.891070 above the schedules' nil after years 7 and 5). The
#     case books year 1 with the write-ups' D&A: EBITA K150 122.9 -> 120.757143, EBIT K153 100 ->
#     75.966073, income before tax K170 81.224286 -> 57.190358, tax K171 28.428744 -> 20.016797, net income
#     K172 52.795542 -> 37.173561 and K176 51.595542 -> 35.973561; the cash taxes saved (8.411947) leave
#     year 1's cash at 124.513 against K221 116.101 (T221 910.900 -> 919.817), and the later cash, interest
#     on cash, retained earnings, the exit's net debt and equity value, and the holders' streams and
#     returns follow (sponsor C1062 18.2038% -> 18.4458%, management C1071 25.4076% -> 25.6642%,
#     subordinated note C1019 18.1770% -> 18.2355%, preferred A C1042 17.0322% -> 17.0708%), and so do the
#     ratios on them from year 1: ROIC K205 9.69% -> 7.71%, ROE K206 9.09% -> 6.52%, ROA K207 5.81% -> 4.13%
#     (and K116:K118), the current and quick ratios K121 2.5701 -> 2.6497 and K122 2.4837 -> 2.5633, the asset
#     turnovers K125 0.5275 -> 0.5322 and K126 8.1971 -> 8.3552, and basic and if-converted EPS K797
#     1.6208 -> 1.1301 (K785:K795). The depreciation and amortisation schedules (rows 661-671, 686-694)
#     agree.
#
# What the engine cannot read yet (figures not reported; see the report): growth of net income (a reading
# lagged a period); the conversion tests on EPS after the deal (a comparison of two ratios) and the
# convertible shares and FDSO counted on them; a preferred's scheduled redemption and sweep (no redemption
# claim; nil here); the legacy debt's repayments after the close (not modelled kept: the case refinances it,
# O870 = 1); the revolver's draws and
# repayments while available; a mark-down's DTA and liability marks (rows 46-52, P38-P40) and a bargain
# purchase (P41); the preferred's capitalised issue fee (rows 625-626); the no-deal, refinancing-only and
# other LBO cases of the sources-and-uses table; the IRR of a nil stream (C1031, C1053).
# A loan's scheduled repayment and its sweep are read from the waterfall's record of what it paid each
# tier (waterfall.paid.<loan>.principal, .prepay). Ratios (covers, returns, liquidity, turnover, EPS, the holders' shares of the equity) are ratio readings; where
# a denominator is nil outside the periods a figure compares, it carries a driver that is 1 only in those
# periods (pad_pre4, pad_pre5, pad_not4).
# Set aside: the year and case counters of the section headers (K59:T59, L141:T141 and the like, J825:O825).
workbook: macabacus_lbo_short
entity: company
plant: LBO__K144
case:
  case: workbook-macabacus-lbo-short
  periods: 15
  phases:
  - history
  - deal
  - operate
  - accrue
  - tax
  - pay
  currency: USDm
  floors:
    company.cash: 0
  generators:
    src:
      kind: formulas
      periods: 15
      inputs: workbook
      values:
        scenario: LBO__F39 + 0
        lbo: (scenario == 1) * LBO__I827 + (scenario == 2) * LBO__J827 + (scenario == 3) * LBO__K827 + (scenario == 4) * LBO__L827 + (scenario == 5) * LBO__M827 + (scenario == 6) * LBO__N827
        revolver_line: (scenario == 1) * LBO__I828 + (scenario == 2) * LBO__J828 + (scenario == 3) * LBO__K828 + (scenario == 4) * LBO__L828 + (scenario == 5) * LBO__M828 + (scenario == 6) * LBO__N828
        legacy_flag: (scenario == 1) * LBO__I870 + (scenario == 2) * LBO__J870 + (scenario == 3) * LBO__K870 + (scenario == 4) * LBO__L870 + (scenario == 5) * LBO__M870 + (scenario == 6) * LBO__N870
        tax_deal: LBO__K24 + 0
        offer: LBO__P10 * (LBO__P12__n1 + LBO__P11)
        itm740: (LBO__F740 <= offer) * LBO__E740
        itm741: (LBO__F741 <= offer) * LBO__E741
        itm742: (LBO__F742 <= offer) * LBO__E742
        itm743: (LBO__F743 <= offer) * LBO__E743
        itm744: (LBO__F744 <= offer) * LBO__E744
        itm745: (LBO__F745 <= offer) * LBO__E745
        itm746: (LBO__F746 <= offer) * LBO__E746
        itm747: (LBO__F747 <= offer) * LBO__E747
        itm748: (LBO__F748 <= offer) * LBO__E748
        itm749: (LBO__F749 <= offer) * LBO__E749
        options_itm: itm740 + itm741 + itm742 + itm743 + itm744 + itm745 + itm746 + itm747 + itm748 + itm749
        option_proceeds: LBO__F740 * itm740 + LBO__F741 * itm741 + LBO__F742 * itm742 + LBO__F743 * itm743 + LBO__F744 * itm744 + LBO__F745 * itm745 + LBO__F746 * itm746 + LBO__F747 * itm747 + LBO__F748 * itm748 + LBO__F749 * itm749
        conv_itm: (LBO__T879 <= offer) * LBO__J899
        converted: LBO__J899 * conv_itm * LBO__N899
        conv_shares: LBO__I899 / LBO__T879 * converted
        legacy_after_conv: LBO__I899 * (1 - converted)
        legacy_refinanced: legacy_after_conv * legacy_flag
        fdso_deal: LBO__E814 + options_itm + conv_shares
        equity_price: offer * fdso_deal
        purchase_price: equity_price - option_proceeds
        sales_q: (t == 0) * LBO__E144 + (t == 1) * LBO__F144 + (t == 2) * LBO__G144 + (t == 3) * LBO__H144
        cogs_q: (t == 0) * LBO__E145 + (t == 1) * LBO__F145 + (t == 2) * LBO__G145 + (t == 3) * LBO__H145
        sga_q: (t == 0) * LBO__E147 + (t == 1) * LBO__F147 + (t == 2) * LBO__G147 + (t == 3) * LBO__H147
        dep_q: (t == 0) * LBO__E149 + (t == 1) * LBO__F149 + (t == 2) * LBO__G149 + (t == 3) * LBO__H149
        amort_q: (t == 0) * LBO__E151 + (t == 1) * LBO__F151 + (t == 2) * LBO__G151 + (t == 3) * LBO__H151
        capex_q: (t == 0) * LBO__E184 + (t == 1) * LBO__F184 + (t == 2) * LBO__G184 + (t == 3) * LBO__H184
        ebit_typed_q: (t == 1) * LBO__F153 + (t == 2) * LBO__G153 + (t == 3) * LBO__H153
        ebitda_q: sales_q - cogs_q - sga_q
        sbc_q: (t == 0) * LBO__E152 + (t >= 1) * (t <= 3) * (ebitda_q - dep_q - amort_q - ebit_typed_q)
        ebit_q: ebitda_q - dep_q - amort_q - sbc_q
        libor_q: (t == 1) * LBO__F570 + (t == 2) * LBO__G570 + (t == 3) * LBO__H570
        legacy_rate_q: (t >= 1) * (t <= 3) * (LBO__O879 + (libor_q + LBO__P879) * (LBO__O879 == 0))
        legacy_repaid_q: (t == 1) * LBO__F464 + (t == 2) * LBO__G464 + (t == 3) * LBO__H464 + (t == 1) * LBO__F465 + (t == 2) * LBO__G465 + (t == 3) * LBO__H465
        legacy_close_q: LBO__E247 + cumsum(legacy_repaid_q)
        legacy_open_q: LBO__E247 + cumsum(legacy_repaid_q) - legacy_repaid_q
        legacy_basis_q: (LBO__K25 == 0) * legacy_open_q + (LBO__K25 != 0) * (legacy_open_q + legacy_close_q) / 2
        legacy_int_q: (t == 0) * LBO__E156 + (t == 1) * legacy_rate_q * legacy_basis_q / LBO__F468__n1 + (t == 2) * legacy_rate_q * legacy_basis_q / LBO__G468__n1 + (t == 3) * legacy_rate_q * legacy_basis_q / LBO__H468__n1
        cash_int_q: (t <= 3) * LBO__E155
        rev_int_q: (t <= 3) * LBO__E157
        tla_int_q: (t <= 3) * LBO__E158
        tlb_int_q: (t <= 3) * LBO__E159
        sen_int_q: (t <= 3) * LBO__E160
        sub_int_q: (t <= 3) * LBO__E161
        mez_int_q: (t <= 3) * LBO__E162
        sel_int_q: (t <= 3) * LBO__E163
        cvb_int_q: (t <= 3) * LBO__E164
        d8_int_q: (t <= 3) * LBO__E165
        amfin_q: (t <= 3) * LBO__E167
        other_q: (t <= 3) * LBO__E169
        prefa_div_q: (t <= 3) * LBO__E173
        prefb_div_q: (t <= 3) * LBO__E174
        nci_q: (t <= 3) * LBO__E175
        cash_inc_q: 0 - cash_int_q
        eqinc_q: (t == 0) * LBO__E168 + (t == 1) * LBO__F375 + (t == 2) * LBO__G375 + (t == 3) * LBO__H375
        eqdiv_q: (t == 1) * LBO__F376 + (t == 2) * LBO__G376 + (t == 3) * LBO__H376
        other_int_q: rev_int_q + tla_int_q + tlb_int_q + sen_int_q + sub_int_q + mez_int_q + sel_int_q + cvb_int_q + d8_int_q
        int_total_q: cash_int_q + legacy_int_q + other_int_q
        pretax_q: ebit_q - int_total_q - amfin_q + eqinc_q - other_q
        blend: LBO__F704 * (1 - LBO__F705) + LBO__F705
        drd_cur_q: (t >= 1) * (t <= 3) * (0 - eqdiv_q) * (1 - LBO__E379) * blend
        drd_def_q: (t >= 1) * (t <= 3) * (eqinc_q + eqdiv_q) * (1 - LBO__E379 * LBO__E382) * blend
        drd_benefit_q: (t >= 1) * (t <= 3) * eqinc_q * blend - drd_cur_q - drd_def_q
        tax_q: (t == 0) * LBO__E171 + (t >= 1) * (t <= 3) * (pretax_q * blend - drd_benefit_q)
        tax_main_q: (t == 0) * LBO__E171 + (t >= 1) * (t <= 3) * (pretax_q - eqinc_q) * blend
        ni_q: pretax_q - tax_q
        ni_common_q: ni_q - prefa_div_q - prefb_div_q - nci_q
        div_q: (t >= 1) * (t <= 3) * LBO__E185 * LBO__E814
        ltm_sales: LBO__E144 + LBO__F144 + LBO__G144 + LBO__H144
        ltm_cogs: LBO__E145 + LBO__F145 + LBO__G145 + LBO__H145
        growth: LBO__K144 / ltm_sales - LBO__K189__n1
        sales_y: (t >= 5) * LBO__K144 * (1 + growth) ** (t - 5)
        cogs_y: LBO__K145 / LBO__K144 * sales_y
        sga_y: LBO__K147 / LBO__K144 * sales_y
        dep_std_y: LBO__K149 / LBO__K144 * sales_y
        amort_std_y: LBO__K151 / LBO__K144 * sales_y
        sbc_y: LBO__K152 / LBO__K144 * sales_y
        capex_y: LBO__K184 / LBO__K144 * sales_y
        ebitda_y: sales_y - cogs_y - sga_y
        life: LBO__K640 + 0
        cost_v5: LBO__K184 * (1 + growth) ** 0
        sln_v5: (cost_v5 - LBO__K641) / life
        dep_v5: (t >= 5) * max(0, min(sln_v5, cost_v5 - (t - 5) * sln_v5))
        cost_v6: LBO__K184 * (1 + growth) ** 1
        sln_v6: (cost_v6 - LBO__K641) / life
        dep_v6: (t >= 6) * max(0, min(sln_v6, cost_v6 - (t - 6) * sln_v6))
        cost_v7: LBO__K184 * (1 + growth) ** 2
        sln_v7: (cost_v7 - LBO__K641) / life
        dep_v7: (t >= 7) * max(0, min(sln_v7, cost_v7 - (t - 7) * sln_v7))
        cost_v8: LBO__K184 * (1 + growth) ** 3
        sln_v8: (cost_v8 - LBO__K641) / life
        dep_v8: (t >= 8) * max(0, min(sln_v8, cost_v8 - (t - 8) * sln_v8))
        cost_v9: LBO__K184 * (1 + growth) ** 4
        sln_v9: (cost_v9 - LBO__K641) / life
        dep_v9: (t >= 9) * max(0, min(sln_v9, cost_v9 - (t - 9) * sln_v9))
        cost_v10: LBO__K184 * (1 + growth) ** 5
        sln_v10: (cost_v10 - LBO__K641) / life
        dep_v10: (t >= 10) * max(0, min(sln_v10, cost_v10 - (t - 10) * sln_v10))
        cost_v11: LBO__K184 * (1 + growth) ** 6
        sln_v11: (cost_v11 - LBO__K641) / life
        dep_v11: (t >= 11) * max(0, min(sln_v11, cost_v11 - (t - 11) * sln_v11))
        cost_v12: LBO__K184 * (1 + growth) ** 7
        sln_v12: (cost_v12 - LBO__K641) / life
        dep_v12: (t >= 12) * max(0, min(sln_v12, cost_v12 - (t - 12) * sln_v12))
        cost_v13: LBO__K184 * (1 + growth) ** 8
        sln_v13: (cost_v13 - LBO__K641) / life
        dep_v13: (t >= 13) * max(0, min(sln_v13, cost_v13 - (t - 13) * sln_v13))
        cost_v14: LBO__K184 * (1 + growth) ** 9
        sln_v14: (cost_v14 - LBO__K641) / life
        dep_v14: (t >= 14) * max(0, min(sln_v14, cost_v14 - (t - 14) * sln_v14))
        dep_new_y: dep_v5 + dep_v6 + dep_v7 + dep_v8 + dep_v9 + dep_v10 + dep_v11 + dep_v12 + dep_v13 + dep_v14
        mark_ppe: LBO__G46__n1 * lbo
        intang_share: LBO__G42 * lbo
        sbc_pre: sbc_q * (t >= 1) * (t <= 3)
        apic_H: LBO__E265 + cumsum(sbc_pre)
        re_flow_q: (t >= 1) * (t <= 3) * (ni_common_q - div_q)
        re_H: LBO__E266 + cumsum(re_flow_q)
        equity_q: LBO__E261 + LBO__E262 + LBO__E263 + LBO__E264 + apic_H + re_H
        be3: (t == 3) * equity_q
        equity_H: cumsum(be3)
        excess: purchase_price + LBO__E261 - lbo * equity_H
        mark_int: intang_share * excess
        share_ppe: (t >= 5) * min(1 / LBO__K46, 1 - min(1, (t - 5) / LBO__K46))
        share_int: (t >= 5) * min(1 / LBO__K47, 1 - min(1, (t - 5) / LBO__K47))
        dep_mark_sched: mark_ppe * share_ppe
        amort_mark_sched: mark_int * share_int
        dep_mark: dep_mark_sched + 0
        amort_mark: amort_mark_sched + 0
        dep_exist: (t >= 5) * (dep_std_y - dep_new_y)
        amort_exist: (t >= 5) * amort_std_y
        eqinc_y: (t == 5) * LBO__K375 + (t == 6) * LBO__L375 + (t == 7) * LBO__M375 + (t == 8) * LBO__N375 + (t == 9) * LBO__O375 + (t == 10) * LBO__P375 + (t == 11) * LBO__Q375 + (t == 12) * LBO__R375 + (t == 13) * LBO__S375 + (t == 14) * LBO__T375
        eqdiv_y: (t == 5) * LBO__K376 + (t == 6) * LBO__L376 + (t == 7) * LBO__M376 + (t == 8) * LBO__N376 + (t == 9) * LBO__O376 + (t == 10) * LBO__P376 + (t == 11) * LBO__Q376 + (t == 12) * LBO__R376 + (t == 13) * LBO__S376 + (t == 14) * LBO__T376
        other_y: (t >= 5) * LBO__K169
        nci_y: (t >= 5) * LBO__K175
        blend_y: (t >= 5) * blend
        drd_cur_y: (t >= 5) * (0 - eqdiv_y) * (1 - LBO__E379) * blend
        drd_def_y: (t >= 5) * (eqinc_y + eqdiv_y) * (1 - LBO__E379 * LBO__E382) * blend
        cash_rate: (t >= 5) * LBO__K571
        fee_rate_rev: (t >= 5) * LBO__K572
        libor: (t == 5) * LBO__K570 + (t == 6) * LBO__L570 + (t == 7) * LBO__M570 + (t == 8) * LBO__N570 + (t == 9) * LBO__O570 + (t == 10) * LBO__P570 + (t == 11) * LBO__Q570 + (t == 12) * LBO__R570 + (t == 13) * LBO__S570 + (t == 14) * LBO__T570
        div_y: (t >= 5) * (1 - lbo) * LBO__E185 * LBO__E814
        rate_revolver: (t >= 5) * (LBO__O880 + (libor + LBO__P880) * (LBO__O880 == 0))

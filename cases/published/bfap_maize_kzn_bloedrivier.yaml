# Published case "bfap_maize_kzn_bloedrivier": dryland maize at Bloedrivier, KwaZulu-Natal, one
# hectare for one summer season at 2025 prices (BFAP; cases/reference/published/bfap_maize_kzn_bloedrivier.yaml).
#
# Every amount is a published input by name (generator `src`):
#   * the crop: yield_deterministic_t_per_ha tonnes on one hectare (the source's own basis), sold
#     for cash at harvest at the net farm-gate price built from the source's own lines: the SAFEX
#     simulated price, less its four deductions (transport differential, grade differential,
#     handling and commission, seed breeding and technology levy), plus its price premiums. The
#     printed deductions subtotal (total_deductions_R_per_ton) is the source's own rollup and is not
#     used again;
#   * the variable costs: the source's thirteen printed lines (variable_expenditure_*_R_per_ha),
#     paid and expensed in the season, posted as one variable-cost line;
#   * overheads, land, depreciation, financing and tax are excluded by the source's own design.
# gross_income (mapped to revenue), total_variable_expenditure (cost_of_sales) and gross_margin
# (gross_margin) are the season's sales, costs and profit. Every per-tonne figure is money read from
# the books divided by a driver: the net farm-gate price and the two R/ton rows divide by the
# tonnes harvested, the break-even price is the costs per tonne, and the break-even yield is the
# costs divided by the net farm-gate price.
#
# The source's display rounding leaves its R/ha totals 1 to 2 rand off its own lines (the books read
# 22,736, 15,399 and 7,337 against the printed 22,738, 15,401 and 7,338); the oracle's tolerance
# (R2, its own measured gap) covers them.
published: bfap_maize_kzn_bloedrivier
entity: farm
plant: safex_simulated_price_R_per_ton
case:
  case: published-bfap-maize-kzn-bloedrivier
  periods: 1
  phases: [operate]
  currency: ZAR
  floors: {}
  generators:
    src:
      kind: formulas
      periods: 1
      inputs: published
      values:
        hectares: 1                              # the source's basis: rand per hectare
        tonnes: yield_deterministic_t_per_ha * hectares
        net_price: >-
          safex_simulated_price_R_per_ton - deduction_transport_differential_R_per_ton
          - deduction_grade_differential_R_per_ton - deduction_handling_and_commission_R_per_ton
          - deduction_seed_breeding_technology_levy_R_per_ton + price_premiums_R_per_ton
        variable_costs: >-
          (variable_expenditure_contracting_R_per_ha + variable_expenditure_crop_insurance_R_per_ha
          + variable_expenditure_fertilizer_R_per_ha + variable_expenditure_lime_R_per_ha
          + variable_expenditure_seed_R_per_ha + variable_expenditure_fuel_R_per_ha
          + variable_expenditure_herbicide_R_per_ha + variable_expenditure_insecticide_fungicide_R_per_ha
          + variable_expenditure_marketing_costs_R_per_ha + variable_expenditure_repairs_maintenance_R_per_ha
          + variable_expenditure_casual_labour_R_per_ha + variable_expenditure_aerial_spray_R_per_ha
          + variable_expenditure_other_R_per_ha) * hectares
  opening:
    farm:
      cash: {nature: asset, value: 0}
      equity: {nature: equity, value: 0}
  contracts:
    maize:
      type: offtake
      parties: {seller: farm}
      terms: {volume: {generator: src, output: tonnes}, price: {generator: src, output: net_price},
              payment_days: 0, days_per_year: 12, periods_per_year: 1, end: 0}
    inputs:
      type: operating_cost
      parties: {payer: farm}
      terms: {annual: {generator: src, output: variable_costs}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 0, vat_rate: 0, vat_refund_lag: 0, payment_days: 0, days_per_year: 12}
  rulebooks: {}
  schemes:
    pnl:
      maize.revenue: revenue
      inputs.expense: variable_cost
  cuts:
    revenue: {kind: pnl, entity: farm, scheme: pnl, include: [revenue]}
    variable_costs: {kind: pnl, entity: farm, scheme: pnl, include: [variable_cost]}
    gross_margin: {kind: pnl, entity: farm, scheme: pnl, include: [revenue, variable_cost]}
  measures: {}
figures:
  net_farm_gate_price_R_per_ton: {cut: revenue, per: src.tonnes}
  gross_income_R_per_ha: {cut: revenue}
  total_variable_expenditure_R_per_ha: {cut: variable_costs, sign: -1}
  total_variable_expenditure_R_per_ton: {cut: variable_costs, sign: -1, per: src.tonnes}
  gross_margin_R_per_ha: {cut: gross_margin}
  gross_margin_R_per_ton: {cut: gross_margin, per: src.tonnes}
  break_even_yield_t_per_ha: {cut: variable_costs, sign: -1, per: src.net_price}
  break_even_price_R_per_ton: {cut: variable_costs, sign: -1, per: src.tonnes}

# Published case "atlas_buyresell_smokedfish": a smoked-fish wholesaler at Lagdo, Nord region,
# Cameroon, one annual cycle (GIZ / PARSE, Métiers Rentables Nord, p.52;
# cases/reference/published/atlas_buyresell_smokedfish.yaml).
#
# Every amount is a published input by name (generator `src`):
#   * the sale: sale.quantity cartons a year at sale.price a carton, sold for cash;
#   * the fish bought (movements.achat_poisson, the source's annual total), paid and expensed in
#     the year; the 48 cartons are bought and sold within it, so nothing is held at year end;
#   * transport and the taxes and dues (movements.transports, movements.impots_et_taxes), paid in
#     the year as operating charges; they are local dues, not a tax on profit;
#   * the source's "Total des charges" (charges_annuelles) is its own rollup of these three lines,
#     so it is not posted again; the source prints no equipment, so none is modelled.
# The source's single figure, marge_beneficiaire_annuelle (the library maps it to gross_margin), is
# the year's profit: sales less the three charges.
published: atlas_buyresell_smokedfish
entity: trader
plant: price
case:
  case: published-atlas-buyresell-smokedfish
  periods: 1
  phases: [operate]
  currency: XAF
  floors: {}
  generators:
    src:
      kind: formulas
      periods: 1
      inputs: published
      values: {}
  opening:
    trader:
      cash: {nature: asset, value: 0}
      equity: {nature: equity, value: 0}
  contracts:
    sales:
      type: offtake
      parties: {seller: trader}
      terms: {volume: {generator: src, output: quantity}, price: {generator: src, output: price},
              payment_days: 0, days_per_year: 12, periods_per_year: 1, end: 0}
    fish:
      type: operating_cost
      parties: {payer: trader}
      terms: {annual: {generator: src, output: movements__achat_poisson}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 0, vat_rate: 0, vat_refund_lag: 0,
              payment_days: 0, days_per_year: 12}
    transport:
      type: operating_cost
      parties: {payer: trader}
      terms: {annual: {generator: src, output: movements__transports}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 0, vat_rate: 0, vat_refund_lag: 0,
              payment_days: 0, days_per_year: 12}
    dues:
      type: operating_cost
      parties: {payer: trader}
      terms: {annual: {generator: src, output: movements__impots_et_taxes}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 0, vat_rate: 0, vat_refund_lag: 0,
              payment_days: 0, days_per_year: 12}
  rulebooks: {}
  schemes:
    pnl:
      sales.revenue: revenue
      fish.expense: cogs
      transport.expense: opex
      dues.expense: opex
  cuts:
    profit: {kind: pnl, entity: trader, scheme: pnl, include: [revenue, cogs, opex]}
  measures: {}
figures:
  marge_beneficiaire_annuelle: {cut: profit}

    post_exit_overhead.expense: operating_cost
    pipeline.expense: operating_cost
    tax_expense: tax
rulebooks:
  tax:
    kind: income_tax
    entity: devco
    phase: tax
    expense: tax_expense
    payable: tax_payable
    rate: 0.25
    carry_forward_periods: 1             # a loss lives only in its own quarter: none is carried
    scheme:
      dev_fees.revenue: taxable
      am_fees.revenue: taxable
      am_costs.expense: taxable
      overhead.expense: taxable
      post_exit_overhead.expense: taxable
      pipeline.expense: taxable
      tax_expense: non_deductible
  waterfall:                         # the tax is paid in its quarter, out of that quarter's profit
    kind: waterfall
    entity: devco
    phase: pay
    cash: cash
    flow_only: {from: 0, until: 100}
    tiers:
      - {name: tax, account: tax_payable}
    residual: null
    cfads: {scheme: cash_flow, classes: [operating], less: [tax]}
    service: []
    tests: []
cuts:
  net_income: {kind: pnl, entity: devco, scheme: income, include: [income]}
lenses:
  valuation:
    kind: valuation
    entity: devco
    scheme: valuation
    roic_on: opening
    marginal_tax_rate: 0.25      # the income_tax rulebook's rate
    # no wacc: the case holds no discount rate (no npv measure, no stated WACC), so no economic profit
measures: {}
wind_down:
  devco: [tax_payable, dev_fees.receivable, am_fees.receivable, am_costs.payable, overhead.payable, post_exit_overhead.payable, pipeline.payable]

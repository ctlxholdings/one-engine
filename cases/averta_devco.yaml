#     cohort is online from its COD quarter, all 1,260 projects from the exit on;
#   * overhead 150000 a year in the hold, 200000 from the exit quarter, escalated alike;
#   * pipeline costs: 7000 per project (development spend grossed up for dead
#     deals), spread over each cohort's COD quarter and the 3 before it;
#   * tax at 0.25 on each quarter's positive profit, no loss carried (as live),
#     paid in the quarter;
#   * nothing is paid out: the cash is the running profit after tax.
#
# Declared, as the live model has them (findings in the LOG):
#   * cash is unfloored: the DevCo runs an overdraft through the hold that
#     nothing funds (the live seed equity is never paid in);
#   * the pipeline costs of the first three cohorts are clamped at period 0:
#     the quarters before it are dropped, not paid;
#   * losses are not carried forward.

# Pilot gold "juice_nondeductible_v25": the Bouaké mango-juice unit, nine campaign years, taxed
# under the regime its turnover assigns it (cases/reference/golds_pilot/juice_nondeductible_v25.yaml).
#
# Every amount is a gold input by name, or a formula over gold inputs (generator `gold`).
#   * mango_tonnes_per_season x kg_per_tonne kg bought each campaign at mango_price_per_kg, paid
#     in cash (the farmers' own terms); mango_usable_share of it pressed, the rest spoiled; no
#     raw stock carried. kg, bottles (pressed kg / yield_kg_per_litre / litres_per_bottle) and
#     the finished-goods stock (finished_goods_carryover_bottles) are physical drivers;
#   * bottles sold at price_per_bottle, collected on receivable_days (nil). The gold states no
#     day-count year: with nil days the year length (12) is a placeholder, as in grain;
#   * packaging and sugar/acid on bottles produced, paid on payable_days_inputs (nil); three
#     workers, the shed and power/water a month (x months_per_year), paid in the month;
#   * the line is carried in at opening_nbv and depreciated straight-line over the life left
#     (line_life_years - line_age_years) to nil; maintenance_capex_annual (nil) spent each year;
#   * base tax: the taxe d'État de l'entreprenant, tee_rate x (1 - cga_member_reduction) on
#     turnover (income_tax with revenue the only taxable line), paid within the year;
#   * variant commerce: the same tax at tee_rate_commerce;
#   * variant reel (the founder's own world): no TEE; profits tax at is_rate on profit with the
#     mango reintegrated (non_deductible), and the higher of that and the IMF
#     (imf_rate x turnover between imf_floor and imf_ceiling). income_tax has no minimum-tax
#     floor, so the top-up max(0, IMF - profits tax) is posted to tax by a transfer, the profits
#     tax recomputed in formulas from the same inputs (nil here: the profits tax is above the
#     floor). imf_reel, the floor itself, is a memo amount no ledger holds: read as a driver.
gold: juice_nondeductible_v25
entity: unit
plant: price_per_bottle
variants:
  commerce:
    values:
      tee_choice: tee_rate_commerce
  reel:
    values:
      tee_on: 0
      reel_on: 1
case:
  case: gold-pilot-juice-nondeductible-v25
  periods: 9
  phases: [fund, operate, close, tax, settle]
  currency: XOF
  floors: {}
  generators:
    gold:
      kind: formulas
      periods: 9
      inputs: gold
      values:
        purchased: {each_period: mango_tonnes_per_season * kg_per_tonne}
        processed: purchased * mango_usable_share
        spoiled: purchased - processed
        mango_close: cumsum(purchased) - cumsum(processed) - cumsum(spoiled)
        bottles_produced: processed / yield_kg_per_litre / litres_per_bottle
        fg_close: {each_period: finished_goods_carryover_bottles}
        bottles_sold: bottles_produced - fg_close + lag(fg_close, 1)
        labour_annual: workers * wage_per_worker_month * months_per_year
        rent_annual: shed_rent_month * months_per_year
        utilities_annual: utilities_month * months_per_year
        life_left: line_life_years - line_age_years
        capex: {each_period: maintenance_capex_annual}
        # the regime switches (variants)
        tee_choice: tee_rate
        tee_on: 1
        reel_on: 0
        tee: tee_choice * (1 - cga_member_reduction) * tee_on
        is_used: is_rate * reel_on
        # the reel column's profits tax, recomputed for the IMF top-up
        revenue_f: bottles_sold * price_per_bottle
        cash_opex_f: >-
          purchased * mango_price_per_kg + bottles_produced * (packaging_per_bottle + ingredients_per_bottle)
          + labour_annual + rent_annual + utilities_annual
        taxable_f: revenue_f - cash_opex_f - opening_nbv / life_left + purchased * mango_price_per_kg
        imf: min(imf_ceiling, max(imf_rate * revenue_f, imf_floor))
        imf_topup: max(0, imf - is_rate * max(0, taxable_f)) * reel_on
  opening:
    unit:
      cash: {nature: asset, value: 0}
      cwip: {nature: asset, value: 0}
      fixed_assets: {nature: asset, value: {generator: gold, output: opening_nbv}}
      equity: {nature: equity, value: balancing}
  contracts:                     # end: 9 is past the horizon (a going concern)
    juice:
      type: offtake
      parties: {seller: unit}
      terms: {volume: {generator: gold, output: bottles_sold}, price: {generator: gold, output: price_per_bottle},
              payment_days: {generator: gold, output: receivable_days}, days_per_year: 12, periods_per_year: 1,
              end: 9}
    mango:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: 0, unit_rate: {generator: gold, output: mango_price_per_kg},
              volume: {generator: gold, output: purchased}, index: 1, periods_per_year: 1, start: 0, end: 9,
              vat_rate: 0, vat_refund_lag: 0, payment_days: 0, days_per_year: 12}
    packaging:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: 0, unit_rate: {generator: gold, output: packaging_per_bottle},
              volume: {generator: gold, output: bottles_produced}, index: 1, periods_per_year: 1, start: 0, end: 9,
              vat_rate: 0, vat_refund_lag: 0, payment_days: {generator: gold, output: payable_days_inputs},
              days_per_year: 12}
    ingredients:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: 0, unit_rate: {generator: gold, output: ingredients_per_bottle},
              volume: {generator: gold, output: bottles_produced}, index: 1, periods_per_year: 1, start: 0, end: 9,
              vat_rate: 0, vat_refund_lag: 0, payment_days: {generator: gold, output: payable_days_inputs},
              days_per_year: 12}
    labour:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: {generator: gold, output: labour_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: 12}
    rent:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: {generator: gold, output: rent_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: 12}
    utilities:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: {generator: gold, output: utilities_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: 12}
    line_capex:
      type: capex
      parties: {owner: unit}
      terms: {schedule: {generator: gold, output: capex}, vat_rate: 0, vat_refund_lag: 0, end: 8}
  rulebooks:
    line:
      kind: asset_register
      entity: unit
      phase: close
      from: cwip
      to: fixed_assets
      expense: depreciation
      disposal: disposal_loss
      in_service: 0
      dispose_at: 8
      life_periods: {generator: gold, output: life_left}
      first_charge: in_service
    tee:
      kind: income_tax                 # a turnover tax: revenue is the only line in its base
      entity: unit
      phase: tax
      expense: tee_expense
      payable: tax_payable
      rate: {generator: gold, output: tee}
      carry_forward_periods: null
      scheme:
        juice.revenue: taxable
        mango.expense: non_deductible
        packaging.expense: non_deductible
        ingredients.expense: non_deductible
        labour.expense: non_deductible
        rent.expense: non_deductible
        utilities.expense: non_deductible
        depreciation: non_deductible
        disposal_loss: non_deductible
        tee_expense: non_deductible
        is_expense: non_deductible
        imf_topup: non_deductible
    reel:
      kind: income_tax
      entity: unit
      phase: tax
      expense: is_expense
      payable: tax_payable
      rate: {generator: gold, output: is_used}
      carry_forward_periods: null
      scheme:
        juice.revenue: taxable
        mango.expense: non_deductible          # no invoice: reintegrated
        packaging.expense: taxable
        ingredients.expense: taxable
        labour.expense: taxable
        rent.expense: taxable
        utilities.expense: taxable
        depreciation: taxable
        disposal_loss: taxable
        tee_expense: non_deductible
        is_expense: non_deductible
        imf_topup: non_deductible
    minimum_tax:
      kind: transfer
      entity: unit
      phase: tax
      declare:
        imf_topup: expense
      moves:
        topup: {debit: imf_topup, credit: tax_payable, amount: {generator: gold, output: imf_topup}}
    pay_tax:
      kind: settle
      entity: unit
      cash: cash
      phase: settle
      accounts: [tax_payable]
  schemes:
    pnl:
      juice.revenue: revenue
      mango.expense: mango
      packaging.expense: packaging
      ingredients.expense: ingredients
      labour.expense: labour
      rent.expense: rent
      utilities.expense: utilities
      depreciation: depreciation
      disposal_loss: depreciation
      tee_expense: tax
      is_expense: tax
      imf_topup: tax
    cash_flow:
      juice.receivable: operating
      mango.payable: operating
      packaging.payable: operating
      ingredients.payable: operating
      labour.payable: operating
      rent.payable: operating
      utilities.payable: operating
      vat_receivable: operating
      tax_payable: operating
      cwip: investing
  cuts:
    revenue: {kind: pnl, entity: unit, scheme: pnl, include: [revenue]}
    mango: {kind: pnl, entity: unit, scheme: pnl, include: [mango]}
    packaging: {kind: pnl, entity: unit, scheme: pnl, include: [packaging]}
    ingredients: {kind: pnl, entity: unit, scheme: pnl, include: [ingredients]}
    labour: {kind: pnl, entity: unit, scheme: pnl, include: [labour]}
    rent: {kind: pnl, entity: unit, scheme: pnl, include: [rent]}
    utilities: {kind: pnl, entity: unit, scheme: pnl, include: [utilities]}
    cash_opex: {kind: pnl, entity: unit, scheme: pnl,
                include: [mango, packaging, ingredients, labour, rent, utilities]}
    ebitda: {kind: pnl, entity: unit, scheme: pnl,
             include: [revenue, mango, packaging, ingredients, labour, rent, utilities]}
    depreciation: {kind: pnl, entity: unit, scheme: pnl, include: [depreciation]}
    ebit: {kind: pnl, entity: unit, scheme: pnl,
           include: [revenue, mango, packaging, ingredients, labour, rent, utilities, depreciation]}
    tax: {kind: pnl, entity: unit, scheme: pnl, include: [tax]}
    nopat: {kind: pnl, entity: unit, scheme: pnl,
            include: [revenue, mango, packaging, ingredients, labour, rent, utilities, depreciation, tax]}
    cfo: {entity: unit, account: cash, scheme: cash_flow, include: [operating]}
    cfi: {entity: unit, account: cash, scheme: cash_flow, include: [investing]}
    fcff: {entity: unit, account: cash, scheme: cash_flow, include: [operating, investing]}
  measures: {}
trace:
  mango_purchased_kg: {driver: gold.purchased}
  mango_processed_kg: {driver: gold.processed}
  mango_spoiled_kg: {driver: gold.spoiled}
  mango_close_kg: {driver: gold.mango_close}
  bottles_produced: {driver: gold.bottles_produced}
  bottles_sold: {driver: gold.bottles_sold}
  fg_close_bottles: {driver: gold.fg_close}
  revenue: {cut: revenue}
  mango_cost: {cut: mango, sign: -1}
  packaging_cost: {cut: packaging, sign: -1}
  ingredients_cost: {cut: ingredients, sign: -1}
  labour_cost: {cut: labour, sign: -1}
  rent_cost: {cut: rent, sign: -1}
  utilities_cost: {cut: utilities, sign: -1}
  cash_opex: {cut: cash_opex, sign: -1}
  ebitda: {cut: ebitda}
  depreciation: {cut: depreciation, sign: -1}
  ebit: {cut: ebit}
  nbv_open: {opening: fixed_assets}
  nbv_close: {balance: fixed_assets}
  nwc: {balance: juice.receivable - mango.payable - packaging.payable - ingredients.payable - labour.payable - rent.payable - utilities.payable}
  delta_nwc: {change: juice.receivable - mango.payable - packaging.payable - ingredients.payable - labour.payable - rent.payable - utilities.payable}
  capex: {cut: cfi, sign: -1}
  tax_tee: {cut: tax, sign: -1}
  nopat: {cut: nopat}
  fcff: {cut: fcff}
  tax_tee_commerce: {cut: tax, sign: -1, variant: commerce}
  fcff_tee_commerce: {cut: fcff, variant: commerce}
  taxable_profit_reel: {record: reel.base, variant: reel}
  is_reel: {record: reel.tax, variant: reel}
  imf_reel: {driver: gold.imf}
  tax_reel: {cut: tax, sign: -1, variant: reel}
  nopat_reel: {cut: nopat, variant: reel}
  fcff_reel: {cut: fcff, variant: reel}

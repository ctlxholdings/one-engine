# Pilot gold "rice_mintax": an Adjamé rice wholesaler, five years to the end of its truck's life,
# paying the higher of the profit tax and the turnover minimum (cases/reference/golds_pilot/rice_mintax.yaml).
#
# Every amount is a gold input by name, or a formula over gold inputs (generator `gold`).
#   * bags_per_month x months_per_year bags sold a year at sale_price_per_bag, collected on
#     days_receivable of a days_per_year_convention year; shrinkage_rate of the bags sold is lost
#     in handling, so that many more are bought. Bags, the stock in bags and truck trips
#     (bags bought / truck_payload_bags) are physical drivers;
#   * the rice is bought at purchase_price_per_bag, paid on days_payable (the importer invoices
#     every bag lifted), and trucked in at transport_per_bag, paid in the period; that landed
#     cost is the inventory's cost (IAS 2.11). Purchases are expensed when bought and the stock
#     held (days_inventory of cost of sales) taken back out of that expense; the bags lost are
#     written off at landed cost (shrinkage, its own line), so cost of sales is the bags sold;
#   * store rent and handlers' wages a month (x months_per_year), paid in the period;
#   * the business is a going concern: the receivable, the stock and the payable are carried in
#     at the levels their terms hold, so nothing moves in the horizon;
#   * the truck is carried in at cost less truck_age_years_at_t0 of its truck_useful_life_years
#     and depreciated straight-line over the life left, to nil; its like-for-like replacement
#     (truck_replacement_cost) is bought at capex_replacement_period_index and depreciated from
#     the period after (its own register), so it is carried at cost at the horizon's end;
#   * tax at bic_rate on profit, or the IMF (imf_rate x turnover, between imf_floor and imf_cap)
#     when higher. income_tax has no minimum-tax floor, so the top-up max(0, IMF - profit tax) is
#     posted to tax by a transfer, the profit tax recomputed in formulas from the same inputs (it
#     binds every period); tax paid within the year;
#   * memo amounts no ledger holds, read as drivers: the IMF on turnover and the IMF due, and the
#     maintenance capex of the normalised view (truck_replacement_cost / truck_useful_life_years);
#     the indifference EBIT is the IMF due per bic_rate;
#   * volume_growth and price_growth are nil and there is no debt (interest_bearing_debt nil).
gold: rice_mintax
entity: wholesaler
plant: sale_price_per_bag
case:
  case: gold-pilot-rice-mintax
  periods: 5
  phases: [fund, operate, close, tax, settle]
  currency: XOF
  floors: {}
  generators:
    gold:
      kind: formulas
      periods: 5
      inputs: gold
      values:
        annual_bags: bags_per_month * months_per_year
        sold: {each_period: annual_bags}
        shrunk: shrinkage_rate * sold
        purchased: sold + shrunk
        stock_level: annual_bags * days_inventory / days_per_year_convention
        stock_bags: {each_period: stock_level}
        trips: purchased / truck_payload_bags
        landed: purchase_price_per_bag + transport_per_bag
        inventory: landed * stock_level
        shrinkage: landed * shrunk
        rent_annual: store_rent_per_month * months_per_year
        wages_annual: handlers_count * wage_per_handler_per_month * months_per_year
        life_left: truck_useful_life_years - truck_age_years_at_t0
        nbv_carried: truck_cost * life_left / truck_useful_life_years
        capex: truck_replacement_cost * (t == capex_replacement_period_index)
        receivable_carried: sale_price_per_bag * annual_bags * days_receivable / days_per_year_convention
        payable_carried: >-
          purchase_price_per_bag * annual_bags * (1 + shrinkage_rate) * days_payable / days_per_year_convention
        # the profit tax the books charge, recomputed for the IMF top-up
        revenue_f: sale_price_per_bag * sold
        ebit_f: revenue_f - landed * sold - shrinkage - rent_annual - wages_annual - nbv_carried / life_left
        imf_turnover: imf_rate * revenue_f
        imf: min(max(imf_turnover, imf_floor), imf_cap)
        imf_topup: max(0, imf - bic_rate * max(0, ebit_f))
        normal_capex: {each_period: truck_replacement_cost / truck_useful_life_years}
  opening:
    wholesaler:
      cash: {nature: asset, value: 0}
      cwip: {nature: asset, value: 0}
      fixed_assets: {nature: asset, value: {generator: gold, output: nbv_carried}}
      inventory: {nature: asset, value: {generator: gold, output: inventory}}
      rice.receivable: {nature: asset, value: {generator: gold, output: receivable_carried}}
      purchases.payable: {nature: liability, value: {generator: gold, output: payable_carried}}
      equity: {nature: equity, value: balancing}
  contracts:                     # end: 5 is past the horizon (a going concern)
    rice:
      type: offtake
      parties: {seller: wholesaler}
      terms: {volume: {generator: gold, output: sold}, price: {generator: gold, output: sale_price_per_bag},
              payment_days: {generator: gold, output: days_receivable},
              days_per_year: {generator: gold, output: days_per_year_convention}, periods_per_year: 1, end: 5}
    purchases:
      type: operating_cost
      parties: {payer: wholesaler}
      terms: {annual: 0, unit_rate: {generator: gold, output: purchase_price_per_bag},
              volume: {generator: gold, output: purchased}, index: 1, periods_per_year: 1, start: 0, end: 5,
              vat_rate: 0, vat_refund_lag: 0, payment_days: {generator: gold, output: days_payable},
              days_per_year: {generator: gold, output: days_per_year_convention}}
    transport:
      type: operating_cost
      parties: {payer: wholesaler}
      terms: {annual: 0, unit_rate: {generator: gold, output: transport_per_bag},
              volume: {generator: gold, output: purchased}, index: 1, periods_per_year: 1, start: 0, end: 5,
              vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: days_per_year_convention}}
    store:
      type: operating_cost
      parties: {payer: wholesaler}
      terms: {annual: {generator: gold, output: rent_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 5, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: days_per_year_convention}}
    handlers:
      type: operating_cost
      parties: {payer: wholesaler}
      terms: {annual: {generator: gold, output: wages_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 5, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: days_per_year_convention}}
    truck_replacement:
      type: capex
      parties: {owner: wholesaler}
      terms: {schedule: {generator: gold, output: capex}, vat_rate: 0, vat_refund_lag: 0, end: 4}
  rulebooks:
    lost_in_handling:
      kind: write_down
      entity: wholesaler
      phase: fund
      account: inventory
      expense: shrinkage_loss
      amount: {generator: gold, output: shrinkage}
    stock:
      kind: held_balance
      entity: wholesaler
      cash: cash
      phase: operate
      accounts:
        inventory: {side: asset, target: {generator: gold, output: inventory}, against: purchases.expense}
    truck:
      kind: asset_register
      entity: wholesaler
      phase: close
      from: cwip
      to: fixed_assets
      expense: depreciation
      disposal: disposal_loss
      in_service: 0
      dispose_at: 4
      life_periods: {generator: gold, output: life_left}
      first_charge: in_service
    new_truck:
      kind: asset_register
      entity: wholesaler
      phase: close
      from: cwip
      to: fixed_assets_new
      expense: depreciation
      disposal: disposal_loss
      in_service: {generator: gold, output: capex_replacement_period_index}
      dispose_at: 24                     # never inside the horizon
      life_periods: {generator: gold, output: truck_useful_life_years}
      first_charge: next_period
    tax:
      kind: income_tax
      entity: wholesaler
      phase: tax
      expense: tax_expense
      payable: tax_payable
      rate: {generator: gold, output: bic_rate}
      carry_forward_periods: null
      scheme:
        rice.revenue: taxable
        purchases.expense: taxable
        transport.expense: taxable
        shrinkage_loss: taxable
        store.expense: taxable
        handlers.expense: taxable
        depreciation: taxable
        disposal_loss: taxable
        tax_expense: non_deductible
        imf_topup: non_deductible
    minimum_tax:
      kind: transfer
      entity: wholesaler
      phase: tax
      declare:
        imf_topup: expense
      moves:
        topup: {debit: imf_topup, credit: tax_payable, amount: {generator: gold, output: imf_topup}}
    pay_tax:
      kind: settle
      entity: wholesaler
      cash: cash
      phase: settle
      accounts: [tax_payable]
  schemes:
    pnl:
      rice.revenue: revenue
      purchases.expense: cogs
      transport.expense: cogs
      shrinkage_loss: shrinkage
      store.expense: rent
      handlers.expense: wages
      depreciation: depreciation
      disposal_loss: depreciation
      tax_expense: tax
      imf_topup: tax
    cash_flow:
      rice.receivable: operating
      purchases.payable: operating
      transport.payable: operating
      store.payable: operating
      handlers.payable: operating
      inventory: operating
      vat_receivable: operating
      tax_payable: operating
      cwip: investing
  cuts:
    revenue: {kind: pnl, entity: wholesaler, scheme: pnl, include: [revenue]}
    cogs: {kind: pnl, entity: wholesaler, scheme: pnl, include: [cogs]}
    shrinkage: {kind: pnl, entity: wholesaler, scheme: pnl, include: [shrinkage]}
    gross_profit: {kind: pnl, entity: wholesaler, scheme: pnl, include: [revenue, cogs]}
    rent: {kind: pnl, entity: wholesaler, scheme: pnl, include: [rent]}
    wages: {kind: pnl, entity: wholesaler, scheme: pnl, include: [wages]}
    opex: {kind: pnl, entity: wholesaler, scheme: pnl, include: [rent, wages]}
    ebitda: {kind: pnl, entity: wholesaler, scheme: pnl, include: [revenue, cogs, shrinkage, rent, wages]}
    depreciation: {kind: pnl, entity: wholesaler, scheme: pnl, include: [depreciation]}
    ebit: {kind: pnl, entity: wholesaler, scheme: pnl, include: [revenue, cogs, shrinkage, rent, wages, depreciation]}
    tax: {kind: pnl, entity: wholesaler, scheme: pnl, include: [tax]}
    nopat: {kind: pnl, entity: wholesaler, scheme: pnl,
            include: [revenue, cogs, shrinkage, rent, wages, depreciation, tax]}
    cfo: {entity: wholesaler, account: cash, scheme: cash_flow, include: [operating]}
    cfi: {entity: wholesaler, account: cash, scheme: cash_flow, include: [investing]}
    fcff: {entity: wholesaler, account: cash, scheme: cash_flow, include: [operating, investing]}
  measures: {}
trace:
  bags_purchased: {driver: gold.purchased}
  bags_sold: {driver: gold.sold}
  bags_shrinkage: {driver: gold.shrunk}
  bags_stock_open: {driver: gold.stock_bags}
  bags_stock_close: {driver: gold.stock_bags}
  truck_trips: {driver: gold.trips}
  revenue: {cut: revenue}
  cogs: {cut: cogs, sign: -1}
  shrinkage_loss: {cut: shrinkage, sign: -1}
  gross_profit: {cut: gross_profit}
  opex_store_rent: {cut: rent, sign: -1}
  opex_handling_wages: {cut: wages, sign: -1}
  opex: {cut: opex, sign: -1}
  ebitda: {cut: ebitda}
  ebitda_per_bag: {cut: ebitda, per: gold.sold}
  depreciation: {cut: depreciation, sign: -1}
  nbv_open: {opening: fixed_assets + fixed_assets_new}
  nbv_close: {balance: fixed_assets + fixed_assets_new}
  ebit: {cut: ebit}
  tax_bic_normal: {record: tax.tax}
  imf_on_turnover: {driver: gold.imf_turnover}
  imf_due: {driver: gold.imf}
  tax_due: {cut: tax, sign: -1}
  ebit_imf_indifference: {driver: gold.imf, per: gold.bic_rate}
  imf_headroom: {sum: [{cut: ebit}, {driver: gold.imf, per: gold.bic_rate, sign: -1}]}
  nopat: {cut: nopat}
  inventory: {balance: inventory}
  receivables: {balance: rice.receivable}
  payables: {balance: purchases.payable + transport.payable + store.payable + handlers.payable}
  receivable_day_value: {cut: revenue, per: gold.days_per_year_convention}
  nwc_open: {opening: inventory + rice.receivable - purchases.payable - transport.payable - store.payable - handlers.payable}
  nwc_close: {balance: inventory + rice.receivable - purchases.payable - transport.payable - store.payable - handlers.payable}
  delta_nwc: {change: inventory + rice.receivable - purchases.payable - transport.payable - store.payable - handlers.payable}
  capex: {cut: cfi, sign: -1}
  cfo: {cut: cfo}
  cfi: {cut: cfi}
  fcff: {cut: fcff}
  fcff_per_bag: {cut: fcff, per: gold.sold}
  fcff_normalised: {sum: [{cut: cfo}, {driver: gold.normal_capex, sign: -1}]}

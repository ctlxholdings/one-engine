# Pilot gold "printer_cashbasis": a Ouagadougou jobbing printer taxed on what it collects less what
# it disburses, seven years to the offset press's end of life
# (cases/reference/golds_pilot/printer_cashbasis.yaml).
#
# Every amount is a gold input by name, or a formula over gold inputs (generator `gold`).
#   * billings: revenue_billed_annual a year (no volume unit: one billing of that amount), collected
#     on client_days of a day_count_basis year; the receivable is carried in at opening_ar;
#   * paper and ink at paper_ink_share of billings, no stock, paid on supplier_days (carried in at
#     opening_ap); labour (employees x wage x 12), rent, electricity and other_overheads_annual paid
#     in the year;
#   * the offset press and the digital press carried in at cost less their age's share of their
#     life, depreciated over the years they have left; the digital press is replaced at
#     digital_replacement_index for replacement_cost_digital and charged over a full life from
#     that period, in its own account; nothing is left at the horizon, nothing to dispose of;
#   * tax at tax_rate, paid in the year. The gold taxes the cash operating surplus less
#     depreciation; the engine's income_tax taxes the accrual profit. With the receivable and the
#     payable level the two bases are equal in every period (the gold's own audit note: its
#     cash-basis mechanism is inert on this grid), so the base is read from the tax record;
#   * variant `cash_expensing`: the literal cash reading, presses expensed when paid. Those paid
#     before the grid already were (carried at nil, so never deducted inside it) and the
#     replacement is charged in full when bought (a one-period life); the variant's tax base, tax
#     and FCFF are the gold's cash-expensing column (its book EBIT is not read).
gold: printer_cashbasis
entity: printer
plant: revenue_billed_annual
variants:
  cash_expensing:
    values:
      offset_carried: 0 * offset_cost
      digital_carried: 0 * digital_cost
      digital_new_life: 1
case:
  case: gold-printer-cashbasis
  periods: 7
  phases: [fund, operate, close, tax, settle]
  currency: XOF
  floors: {}
  generators:
    gold:
      kind: formulas
      periods: 7
      inputs: gold
      values:
        materials: revenue_billed_annual * paper_ink_share
        labour_annual: employees * wage_per_employee_month * months_per_year
        rent_annual: rent_month * months_per_year
        electricity_annual: electricity_month * months_per_year
        offset_carried: offset_cost * (offset_life - offset_age_at_t0) / offset_life
        offset_life_left: offset_life - offset_age_at_t0
        digital_carried: digital_cost * (digital_life - digital_age_at_t0) / digital_life
        digital_life_left: digital_life - digital_age_at_t0
        digital_new_life: digital_life
        digital_spend: replacement_cost_digital * (t == digital_replacement_index)
  opening:
    printer:
      offset: {nature: asset, value: {generator: gold, output: offset_carried}}
      digital_old: {nature: asset, value: {generator: gold, output: digital_carried}}
      cwip: {nature: asset, value: 0}       # no offset press is bought in the horizon
      billings.receivable: {nature: asset, value: {generator: gold, output: opening_ar}}
      paper_ink.payable: {nature: liability, value: {generator: gold, output: opening_ap}}
      equity: {nature: equity, value: balancing}
  contracts:
    billings:
      type: offtake
      parties: {seller: printer}
      terms: {volume: 1, price: {generator: gold, output: revenue_billed_annual},
              payment_days: {generator: gold, output: client_days},
              days_per_year: {generator: gold, output: day_count_basis}, periods_per_year: 1,
              end: 7}                 # past the horizon: clients still owe at its end (going concern)
    paper_ink:
      type: operating_cost
      parties: {payer: printer}
      terms: {annual: {generator: gold, output: materials}, unit_rate: 0, volume: 0, index: 1, periods_per_year: 1,
              start: 0, end: 7, vat_rate: 0, vat_refund_lag: 0, payment_days: {generator: gold, output: supplier_days},
              days_per_year: {generator: gold, output: day_count_basis}}
    labour:
      type: operating_cost
      parties: {payer: printer}
      terms: {annual: {generator: gold, output: labour_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 7, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: day_count_basis}}
    rent:
      type: operating_cost
      parties: {payer: printer}
      terms: {annual: {generator: gold, output: rent_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 7, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: day_count_basis}}
    electricity:
      type: operating_cost
      parties: {payer: printer}
      terms: {annual: {generator: gold, output: electricity_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 7, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: day_count_basis}}
    other_overheads:
      type: operating_cost
      parties: {payer: printer}
      terms: {annual: {generator: gold, output: other_overheads_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 7, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: day_count_basis}}
    digital:
      type: capex_class
      parties: {owner: printer}
      terms: {schedule: {generator: gold, output: digital_spend}, vat_rate: 0, vat_refund_lag: 0, end: 7}
  rulebooks:
    offset_press:                     # carried in: the years it has left (to nil at the horizon)
      kind: asset_register
      entity: printer
      phase: close
      from: cwip
      to: offset
      expense: dep_offset
      disposal: disposal_loss
      in_service: 0
      dispose_at: 7                   # after the horizon
      life_periods: {generator: gold, output: offset_life_left}
      first_charge: in_service
    digital_carried:
      kind: asset_register
      entity: printer
      phase: close
      from: digital
      to: digital_old
      expense: dep_digital
      disposal: disposal_loss
      in_service: 0
      dispose_at: 7
      life_periods: {generator: gold, output: digital_life_left}
      first_charge: in_service
    digital_replaced:                 # the replacement: a full life from the period it is bought
      kind: asset_register
      entity: printer
      phase: close
      from: digital
      to: digital_new
      expense: dep_digital
      disposal: disposal_loss
      in_service: {generator: gold, output: digital_replacement_index}
      dispose_at: 7
      life_periods: {generator: gold, output: digital_new_life}
      first_charge: in_service
    tax:
      kind: income_tax
      entity: printer
      phase: tax
      expense: tax_expense
      payable: tax_payable
      rate: {generator: gold, output: tax_rate}
      carry_forward_periods: null
      scheme:
        billings.revenue: taxable
        paper_ink.expense: taxable
        labour.expense: taxable
        rent.expense: taxable
        electricity.expense: taxable
        other_overheads.expense: taxable
        dep_offset: taxable
        dep_digital: taxable
        disposal_loss: taxable
        tax_expense: non_deductible
    pay_tax:
      kind: settle
      entity: printer
      cash: cash
      phase: settle
      accounts: [tax_payable]
  schemes:
    pnl:
      billings.revenue: revenue
      paper_ink.expense: paper_ink
      labour.expense: labour
      rent.expense: rent
      electricity.expense: electricity
      other_overheads.expense: other_overheads
      dep_offset: dep_offset
      dep_digital: dep_digital
      disposal_loss: dep_digital
      tax_expense: tax
    cash_flow:
      billings.receivable: receipts
      paper_ink.payable: suppliers
      labour.payable: other_paid
      rent.payable: other_paid
      electricity.payable: other_paid
      other_overheads.payable: other_paid
      vat_receivable: other_paid
      tax_payable: tax
      digital: investing
  cuts:
    revenue: {kind: pnl, entity: printer, scheme: pnl, include: [revenue]}
    paper_ink: {kind: pnl, entity: printer, scheme: pnl, include: [paper_ink]}
    labour: {kind: pnl, entity: printer, scheme: pnl, include: [labour]}
    rent: {kind: pnl, entity: printer, scheme: pnl, include: [rent]}
    electricity: {kind: pnl, entity: printer, scheme: pnl, include: [electricity]}
    other_overheads: {kind: pnl, entity: printer, scheme: pnl, include: [other_overheads]}
    cash_opex: {kind: pnl, entity: printer, scheme: pnl, include: [paper_ink, labour, rent, electricity, other_overheads]}
    ebitda: {kind: pnl, entity: printer, scheme: pnl, include: [revenue, paper_ink, labour, rent, electricity, other_overheads]}
    dep_offset: {kind: pnl, entity: printer, scheme: pnl, include: [dep_offset]}
    dep_digital: {kind: pnl, entity: printer, scheme: pnl, include: [dep_digital]}
    da: {kind: pnl, entity: printer, scheme: pnl, include: [dep_offset, dep_digital]}
    ebit: {kind: pnl, entity: printer, scheme: pnl,
           include: [revenue, paper_ink, labour, rent, electricity, other_overheads, dep_offset, dep_digital]}
    tax: {kind: pnl, entity: printer, scheme: pnl, include: [tax]}
    nopat: {kind: pnl, entity: printer, scheme: pnl,
            include: [revenue, paper_ink, labour, rent, electricity, other_overheads, dep_offset, dep_digital, tax]}
    receipts: {entity: printer, account: cash, scheme: cash_flow, include: [receipts]}
    suppliers: {entity: printer, account: cash, scheme: cash_flow, include: [suppliers]}
    other_paid: {entity: printer, account: cash, scheme: cash_flow, include: [other_paid]}
    disbursed: {entity: printer, account: cash, scheme: cash_flow, include: [suppliers, other_paid]}
    surplus: {entity: printer, account: cash, scheme: cash_flow, include: [receipts, suppliers, other_paid]}
    cfo: {entity: printer, account: cash, scheme: cash_flow, include: [receipts, suppliers, other_paid, tax]}
    cfi: {entity: printer, account: cash, scheme: cash_flow, include: [investing]}
    fcff: {entity: printer, account: cash, scheme: cash_flow, include: [receipts, suppliers, other_paid, tax, investing]}
  measures: {}
trace:
  revenue: {cut: revenue}
  paper_ink: {cut: paper_ink, sign: -1}
  labour: {cut: labour, sign: -1}
  rent: {cut: rent, sign: -1}
  electricity: {cut: electricity, sign: -1}
  other_overheads: {cut: other_overheads, sign: -1}
  cash_opex: {cut: cash_opex, sign: -1}
  ebitda: {cut: ebitda}
  dep_offset: {cut: dep_offset, sign: -1}
  dep_digital: {cut: dep_digital, sign: -1}
  da: {cut: da, sign: -1}
  ebit: {cut: ebit}
  capex: {cut: cfi, sign: -1}
  nbv_open: {opening: offset + digital_old + digital_new}
  nbv_close: {balance: offset + digital_old + digital_new}
  ar_open: {opening: billings.receivable}
  ar_close: {balance: billings.receivable}
  cash_receipts: {cut: receipts}
  ap_open: {opening: paper_ink.payable}
  ap_close: {balance: paper_ink.payable}
  cash_paid_suppliers: {cut: suppliers, sign: -1}
  cash_paid_other: {cut: other_paid, sign: -1}
  cash_opex_disbursed: {cut: disbursed, sign: -1}
  nwc_open: {opening: billings.receivable - paper_ink.payable - labour.payable - rent.payable - electricity.payable - other_overheads.payable}
  nwc_close: {balance: billings.receivable - paper_ink.payable - labour.payable - rent.payable - electricity.payable - other_overheads.payable}
  delta_nwc: {change: billings.receivable - paper_ink.payable - labour.payable - rent.payable - electricity.payable - other_overheads.payable}
  cash_operating_surplus: {cut: surplus}
  taxable_income: {record: tax.base}
  tax: {cut: tax, sign: -1}
  nopat: {cut: nopat}
  cfo: {cut: cfo}
  cfi: {cut: cfi}
  fcff: {cut: fcff}
  taxable_income_cash_expensing: {record: tax.base, variant: cash_expensing}
  tax_cash_expensing: {cut: tax, sign: -1, variant: cash_expensing}
  fcff_cash_expensing: {cut: fcff, variant: cash_expensing}

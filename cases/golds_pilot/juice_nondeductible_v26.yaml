# Pilot gold "juice_nondeductible_v26": the Bouaké mango-juice unit, nine campaign years, with the
# fruit's mass balance, the statutory charges, the IMF floor and the TEE regime alongside
# (cases/reference/golds_pilot/juice_nondeductible_v26.yaml).
#
# Every amount is a gold input by name, or a formula over gold inputs (generator `gold`).
#   * physical drivers (no ledger holds kg, bottles or hours): fruit_purchased_kg_per_season
#     bought; bottles_produced_per_season filled (the whole bottles), each taking
#     mango_kg_per_litre kg, the rest unconverted; reject, peel, stone, finisher and line-loss
#     fractions split the mass; sugar, acid and the fill by dose; finished bottles average
#     production x (1 - campaign_days / days_per_year) / 2 in store and lose fg_loss_rate_pa of
#     that average; pulper, filler and crew hours at their rates; running totals by cumsum;
#   * bottles sold (production less the loss) at bottle_price_xof x price_net_factor plus VAT at
#     vat_rate, collected on receivable_days of a days_per_year year: the sale is booked gross
#     and the VAT moved to a payable settled in the period, so revenue is net and the receivable
#     gross (the gold's receivables are on turnover TTC); byproduct_kg sold at
#     byproduct_price_xof_per_kg (nil), for cash;
#   * fruit at mango_price_xof_per_kg on the kg bought, paid in cash; packaging and sugar/acid on
#     bottles produced, utilities and maintenance (maintenance_rate of the line's cost) paid on
#     payable_days; wages, employer charges (CNPS on the gross and on the capped base, payroll
#     tax), rent, the patente (the CA duty at its floor, plus the rental-value duty) and freight
#     (nil) paid in the period; bad debt (bad_debt_rate of revenue, nil) written off the
#     receivable;
#   * the working-capital position is already funded: the receivable, the finished-goods stock
#     (the average bottles at direct materials, the gold's own measure), the packaging stock
#     (packaging_stock_days of campaign-rate usage) and the payables are carried in at the levels
#     their terms hold, so nothing moves in the horizon and nothing unwinds at its end;
#   * the line is carried in at nbv_opening_xof and depreciated straight-line over the life left
#     (line_life_years - line_age_years) to nil; no capex is stated (cfi has no line);
#   * tax (régime réel): is_rate on profit with the fruit reintegrated (the reintegration_basis
#     share of the mango is non_deductible); the company pays the higher of that and the IMF
#     (imf_rate x turnover TTC, between imf_floor and imf_ceiling). income_tax has no
#     minimum-tax floor, so the top-up max(0, IMF - profits tax) is posted to tax by a transfer,
#     the profits tax recomputed in formulas from the same inputs; tax paid within the year. The
#     IMF itself is a memo amount no ledger holds: read as a driver;
#   * variant deductible: the whole fruit invoiced and deductible (the IMF floor then binds);
#   * variant tee (the regime de l'entreprenant): no VAT charged, no patente, the input VAT on
#     packaging, ingredients, utilities and maintenance an irrecoverable cost paid with them, and
#     tee_rate on (net) turnover in place of the profits tax and the IMF.
# Gold finding (inventory_packaging, nwc, nwc_prior differ, every period, by 35.71): the gold's own
# check is inventory_packaging == (packaging_cost + ingredient_cost) x packaging_stock_days /
# campaign_days, on its own packaging and ingredient rows of 6,666,600 + 3,333,300 (the 33,333
# whole bottles): 9,999,900 x 30 / 84 = 3,571,392.86, which the books carry. Its trace row is
# 3,571,428.57 = 10,000,000 x 30 / 84, the unrounded 33,333.33 bottles. nwc and nwc_prior inherit
# the 35.71 (16,822,291.69 against 16,822,327.41); delta_nwc and fcff do not.
gold: juice_nondeductible_v26
entity: unit
plant: bottle_price_xof
variants:
  deductible:
    values:
      invoiced_share: 1
  tee:
    values:
      reel_on: 0
case:
  case: gold-pilot-juice-nondeductible-v26
  periods: 9
  phases: [fund, operate, close, tax, settle]
  currency: XOF
  floors: {}
  generators:
    gold:
      kind: formulas
      periods: 9
      inputs: gold
      values:
        # the regime (variants): 1 the réel, 0 the entreprenant
        reel_on: 1
        tee_on: 1 - reel_on
        # the mass balance (kg)
        purchased: fruit_purchased_kg_per_season
        bottles: bottles_produced_per_season
        converted: bottles * mango_kg_per_litre
        unconverted: purchased - converted
        reject: reject_rate * converted
        to_line: converted - reject
        peel: peel_fraction * to_line
        stone: stone_fraction * to_line
        pulp: to_line - peel - stone
        finisher_juice: finisher_recovery * pulp
        pomace: pulp - finisher_juice
        line_loss: line_loss_rate * finisher_juice
        bottled_juice: finisher_juice - line_loss
        sugar: sugar_dose_kg_per_bottle * bottles
        citric: citric_dose_kg_per_bottle * bottles
        contents: bottles * bottle_net_mass_kg
        waste: reject + peel + stone + pomace + line_loss
        byproduct: peel + stone + pomace
        # finished bottles
        avg_fg: bottles * (1 - campaign_days / days_per_year) / 2
        lost: fg_loss_rate_pa * avg_fg
        sold: bottles - lost
        fg_close: {each_period: bottles - sold - lost}
        # the plant's hours
        pulper_hours: to_line / pulper_rate_kg_per_hour
        filler_hours: bottles * bottle_size_l / filler_rate_l_per_hour
        crew_hours: purchased / (workers * sort_rate_kg_per_hour_per_worker)
        available_hours: campaign_days * working_day_fraction * hours_per_working_day * availability
        purchased_s: {each_period: purchased}
        bottles_s: {each_period: bottles}
        pulper_s: {each_period: pulper_hours}
        waste_s: {each_period: waste}
        cum_fruit: cumsum(purchased_s)
        cum_bottles: cumsum(bottles_s)
        cum_pulper: cumsum(pulper_s)
        cum_waste: cumsum(waste_s)
        # prices and costs
        price: bottle_price_xof * price_net_factor
        price_gross: price * (1 + vat_rate * reel_on)
        revenue_f: sold * price
        revenue_ttc_f: sold * price_gross
        output_vat: revenue_ttc_f - revenue_f
        invoiced_share: 1 - reintegration_basis / (purchased * mango_price_xof_per_kg)
        mango_invoiced: purchased * invoiced_share
        mango_uninvoiced: purchased - mango_invoiced
        packaging: packaging_cost_per_bottle_xof * bottles
        ingredients: ingredient_cost_per_bottle_xof * bottles
        wages: workers * wage_per_worker_month_xof * months_per_year
        social: >-
          workers_declared_flag * workers * months_per_year * (cnps_pension_rate_employer * wage_per_worker_month_xof
          + (cnps_family_rate_employer + cnps_maternity_rate_employer + cnps_at_rate_employer) * cnps_capped_base_monthly
          + employer_payroll_tax_rate * wage_per_worker_month_xof)
        rent: shed_rent_per_month_xof * months_per_year
        utilities: utilities_per_month_xof * months_per_year
        maintenance: maintenance_rate * line_cost_xof
        patente: (max(patente_ca_rate * revenue_f, patente_ca_floor) + patente_vl_rate * rent) * reel_on
        irrecoverable_vat: vat_rate * (packaging + ingredients + utilities + maintenance) * tee_on
        freight: freight_per_bottle_xof * sold
        bad_debt: bad_debt_rate * revenue_f
        byproduct_revenue_f: byproduct_price_xof_per_kg * byproduct
        life_left: line_life_years - line_age_years
        # the working-capital position carried in (already funded)
        receivable_carried: revenue_ttc_f * receivable_days / days_per_year
        fg_carried: avg_fg * (mango_price_xof_per_kg * mango_kg_per_litre + packaging_cost_per_bottle_xof + ingredient_cost_per_bottle_xof)
        pack_stock: (packaging + ingredients) * packaging_stock_days / campaign_days
        packaging_owed: packaging * payable_days / days_per_year
        ingredients_owed: ingredients * payable_days / days_per_year
        utilities_owed: utilities * payable_days / days_per_year
        maintenance_owed: maintenance * payable_days / days_per_year
        # the profits tax the books charge, recomputed for the IMF top-up
        opex_f: >-
          purchased * mango_price_xof_per_kg + packaging + ingredients + wages + social + rent + utilities
          + maintenance + patente + irrecoverable_vat + freight + bad_debt
        taxable_f: >-
          revenue_f + byproduct_revenue_f - opex_f - nbv_opening_xof / life_left
          + mango_uninvoiced * mango_price_xof_per_kg
        imf: min(max(imf_rate * revenue_ttc_f, imf_floor), imf_ceiling)
        imf_topup: max(0, imf - is_rate * max(0, taxable_f)) * reel_on
        is_used: is_rate * reel_on
        tee: tee_rate * tee_on
        imf_s: {each_period: imf}
  opening:
    unit:
      cash: {nature: asset, value: 0}
      cwip: {nature: asset, value: 0}
      fixed_assets: {nature: asset, value: {generator: gold, output: nbv_opening_xof}}
      juice.receivable: {nature: asset, value: {generator: gold, output: receivable_carried}}
      inventory_fg: {nature: asset, value: {generator: gold, output: fg_carried}}
      inventory_packaging: {nature: asset, value: {generator: gold, output: pack_stock}}
      packaging.payable: {nature: liability, value: {generator: gold, output: packaging_owed}}
      ingredients.payable: {nature: liability, value: {generator: gold, output: ingredients_owed}}
      utilities.payable: {nature: liability, value: {generator: gold, output: utilities_owed}}
      maintenance.payable: {nature: liability, value: {generator: gold, output: maintenance_owed}}
      equity: {nature: equity, value: balancing}
  contracts:                     # end: 9 is past the horizon (a going concern)
    juice:
      type: offtake
      parties: {seller: unit}
      terms: {volume: {generator: gold, output: sold}, price: {generator: gold, output: price_gross},
              payment_days: {generator: gold, output: receivable_days},
              days_per_year: {generator: gold, output: days_per_year}, periods_per_year: 1, end: 9}
    byproduct:
      type: offtake
      parties: {seller: unit}
      terms: {volume: {generator: gold, output: byproduct}, price: {generator: gold, output: byproduct_price_xof_per_kg},
              payment_days: 0, days_per_year: {generator: gold, output: days_per_year}, periods_per_year: 1, end: 9}
    mango:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: 0, unit_rate: {generator: gold, output: mango_price_xof_per_kg},
              volume: {generator: gold, output: mango_uninvoiced}, index: 1, periods_per_year: 1, start: 0, end: 9,
              vat_rate: 0, vat_refund_lag: 0, payment_days: 0, days_per_year: {generator: gold, output: days_per_year}}
    mango_invoiced:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: 0, unit_rate: {generator: gold, output: mango_price_xof_per_kg},
              volume: {generator: gold, output: mango_invoiced}, index: 1, periods_per_year: 1, start: 0, end: 9,
              vat_rate: 0, vat_refund_lag: 0, payment_days: 0, days_per_year: {generator: gold, output: days_per_year}}
    packaging:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: {generator: gold, output: packaging}, unit_rate: 0, volume: 0, index: 1, periods_per_year: 1,
              start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0, payment_days: {generator: gold, output: payable_days},
              days_per_year: {generator: gold, output: days_per_year}}
    ingredients:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: {generator: gold, output: ingredients}, unit_rate: 0, volume: 0, index: 1, periods_per_year: 1,
              start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0, payment_days: {generator: gold, output: payable_days},
              days_per_year: {generator: gold, output: days_per_year}}
    wages:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: {generator: gold, output: wages}, unit_rate: 0, volume: 0, index: 1, periods_per_year: 1,
              start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: days_per_year}}
    social:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: {generator: gold, output: social}, unit_rate: 0, volume: 0, index: 1, periods_per_year: 1,
              start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: days_per_year}}
    rent:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: {generator: gold, output: rent}, unit_rate: 0, volume: 0, index: 1, periods_per_year: 1,
              start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: days_per_year}}
    utilities:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: {generator: gold, output: utilities}, unit_rate: 0, volume: 0, index: 1, periods_per_year: 1,
              start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0, payment_days: {generator: gold, output: payable_days},
              days_per_year: {generator: gold, output: days_per_year}}
    maintenance:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: {generator: gold, output: maintenance}, unit_rate: 0, volume: 0, index: 1, periods_per_year: 1,
              start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0, payment_days: {generator: gold, output: payable_days},
              days_per_year: {generator: gold, output: days_per_year}}
    patente:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: 0, unit_rate: 1, volume: {generator: gold, output: patente}, index: 1, periods_per_year: 1,
              start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: days_per_year}}
    input_vat:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: 0, unit_rate: 1, volume: {generator: gold, output: irrecoverable_vat}, index: 1,
              periods_per_year: 1, start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: days_per_year}}
    freight:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: 0, unit_rate: 1, volume: {generator: gold, output: freight}, index: 1, periods_per_year: 1,
              start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: days_per_year}}
  rulebooks:
    sales_vat:
      kind: transfer
      entity: unit
      phase: operate
      declare:
        vat_output: income
        vat_payable: liability
      moves:
        vat: {debit: vat_output, credit: vat_payable, amount: {generator: gold, output: output_vat}}
    stocks:
      kind: held_balance
      entity: unit
      cash: cash
      phase: operate
      accounts:
        inventory_fg: {side: asset, target: {generator: gold, output: fg_carried}}
        inventory_packaging: {side: asset, target: {generator: gold, output: pack_stock}}
    bad_debts:
      kind: write_down
      entity: unit
      phase: close
      account: juice.receivable
      expense: bad_debt
      amount: {generator: gold, output: bad_debt}
    line:
      kind: asset_register
      entity: unit
      phase: close
      from: cwip
      to: fixed_assets
      expense: depreciation
      disposal: disposal_loss
      in_service: 0
      dispose_at: 8
      life_periods: {generator: gold, output: life_left}
      first_charge: in_service
    reel:
      kind: income_tax
      entity: unit
      phase: tax
      expense: is_expense
      payable: tax_payable
      rate: {generator: gold, output: is_used}
      carry_forward_periods: null
      scheme:
        juice.revenue: taxable
        vat_output: taxable
        byproduct.revenue: taxable
        mango.expense: non_deductible          # no invoice: reintegrated
        mango_invoiced.expense: taxable
        packaging.expense: taxable
        ingredients.expense: taxable
        wages.expense: taxable
        social.expense: taxable
        rent.expense: taxable
        utilities.expense: taxable
        maintenance.expense: taxable
        patente.expense: taxable
        input_vat.expense: taxable
        freight.expense: taxable
        bad_debt: taxable
        depreciation: taxable
        disposal_loss: taxable
        is_expense: non_deductible
        tee_expense: non_deductible
        imf_topup: non_deductible
    tee:
      kind: income_tax                 # a turnover tax: (net) revenue is the only line in its base
      entity: unit
      phase: tax
      expense: tee_expense
      payable: tax_payable
      rate: {generator: gold, output: tee}
      carry_forward_periods: null
      scheme:
        juice.revenue: taxable
        vat_output: taxable
        byproduct.revenue: non_deductible
        mango.expense: non_deductible
        mango_invoiced.expense: non_deductible
        packaging.expense: non_deductible
        ingredients.expense: non_deductible
        wages.expense: non_deductible
        social.expense: non_deductible
        rent.expense: non_deductible
        utilities.expense: non_deductible
        maintenance.expense: non_deductible
        patente.expense: non_deductible
        input_vat.expense: non_deductible
        freight.expense: non_deductible
        bad_debt: non_deductible
        depreciation: non_deductible
        disposal_loss: non_deductible
        is_expense: non_deductible
        tee_expense: non_deductible
        imf_topup: non_deductible
    minimum_tax:
      kind: transfer
      entity: unit
      phase: tax
      declare:
        imf_topup: expense
      moves:
        topup: {debit: imf_topup, credit: tax_payable, amount: {generator: gold, output: imf_topup}}
    pay_tax:
      kind: settle
      entity: unit
      cash: cash
      phase: settle
      accounts: [tax_payable, vat_payable]
  schemes:
    pnl:
      juice.revenue: sales_gross
      vat_output: sales_vat
      byproduct.revenue: byproduct
      mango.expense: mango_uninvoiced
      mango_invoiced.expense: mango_invoiced
      packaging.expense: packaging
      ingredients.expense: ingredients
      wages.expense: wages
      social.expense: social
      rent.expense: rent
      utilities.expense: utilities
      maintenance.expense: maintenance
      patente.expense: patente
      input_vat.expense: input_vat
      freight.expense: freight
      bad_debt: bad_debt
      depreciation: depreciation
      disposal_loss: depreciation
      is_expense: tax
      tee_expense: tax
      imf_topup: tax
    cash_flow:
      juice.receivable: operating
      byproduct.receivable: operating
      mango.payable: operating
      mango_invoiced.payable: operating
      packaging.payable: operating
      ingredients.payable: operating
      wages.payable: operating
      social.payable: operating
      rent.payable: operating
      utilities.payable: operating
      maintenance.payable: operating
      patente.payable: operating
      input_vat.payable: operating
      freight.payable: operating
      inventory_fg: operating
      inventory_packaging: operating
      vat_receivable: operating
      vat_payable: operating
      tax_payable: operating
      cwip: investing
  cuts:
    revenue: {kind: pnl, entity: unit, scheme: pnl, include: [sales_gross, sales_vat]}
    revenue_ttc: {kind: pnl, entity: unit, scheme: pnl, include: [sales_gross]}
    byproduct: {kind: pnl, entity: unit, scheme: pnl, include: [byproduct]}
    mango: {kind: pnl, entity: unit, scheme: pnl, include: [mango_uninvoiced, mango_invoiced]}
    mango_uninvoiced: {kind: pnl, entity: unit, scheme: pnl, include: [mango_uninvoiced]}
    packaging: {kind: pnl, entity: unit, scheme: pnl, include: [packaging]}
    ingredients: {kind: pnl, entity: unit, scheme: pnl, include: [ingredients]}
    wages: {kind: pnl, entity: unit, scheme: pnl, include: [wages]}
    social: {kind: pnl, entity: unit, scheme: pnl, include: [social]}
    rent: {kind: pnl, entity: unit, scheme: pnl, include: [rent]}
    utilities: {kind: pnl, entity: unit, scheme: pnl, include: [utilities]}
    maintenance: {kind: pnl, entity: unit, scheme: pnl, include: [maintenance]}
    patente: {kind: pnl, entity: unit, scheme: pnl, include: [patente]}
    input_vat: {kind: pnl, entity: unit, scheme: pnl, include: [input_vat]}
    freight: {kind: pnl, entity: unit, scheme: pnl, include: [freight]}
    bad_debt: {kind: pnl, entity: unit, scheme: pnl, include: [bad_debt]}
    payable_base: {kind: pnl, entity: unit, scheme: pnl, include: [packaging, ingredients, utilities, maintenance]}
    opex: {kind: pnl, entity: unit, scheme: pnl,
           include: [mango_uninvoiced, mango_invoiced, packaging, ingredients, wages, social, rent, utilities,
                     maintenance, patente, input_vat, freight, bad_debt]}
    ebitda: {kind: pnl, entity: unit, scheme: pnl,
             include: [sales_gross, sales_vat, byproduct, mango_uninvoiced, mango_invoiced, packaging, ingredients,
                       wages, social, rent, utilities, maintenance, patente, input_vat, freight, bad_debt]}
    depreciation: {kind: pnl, entity: unit, scheme: pnl, include: [depreciation]}
    ebit: {kind: pnl, entity: unit, scheme: pnl,
           include: [sales_gross, sales_vat, byproduct, mango_uninvoiced, mango_invoiced, packaging, ingredients,
                     wages, social, rent, utilities, maintenance, patente, input_vat, freight, bad_debt, depreciation]}
    tax: {kind: pnl, entity: unit, scheme: pnl, include: [tax]}
    nopat: {kind: pnl, entity: unit, scheme: pnl,
            include: [sales_gross, sales_vat, byproduct, mango_uninvoiced, mango_invoiced, packaging, ingredients,
                      wages, social, rent, utilities, maintenance, patente, input_vat, freight, bad_debt, depreciation,
                      tax]}
    cfo: {entity: unit, account: cash, scheme: cash_flow, include: [operating]}
    cfi: {entity: unit, account: cash, scheme: cash_flow, include: [investing]}
    fcff: {entity: unit, account: cash, scheme: cash_flow, include: [operating, investing]}
  measures: {}
trace:
  fruit_purchased_kg: {driver: gold.purchased}
  fruit_unconverted_kg: {driver: gold.unconverted}
  fruit_converted_kg: {driver: gold.converted}
  reject_kg: {driver: gold.reject}
  fruit_to_line_kg: {driver: gold.to_line}
  peel_kg: {driver: gold.peel}
  stone_kg: {driver: gold.stone}

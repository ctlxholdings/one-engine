# Pilot gold "juice_nondeductible": a mango-juice unit in Bouaké, nine campaign years over the
# residual life of its production line, its mango purchases never deductible
# (cases/reference/golds_pilot/juice_nondeductible.yaml).
#
# Every amount is a gold input by name, or a formula over gold inputs (generator `gold`).
#   * mango_tonnes_per_season x kg_per_tonne kg bought each campaign at mango_price_per_kg, paid
#     on payables_days (nil: the farmers want cash), all pressed in the year (no stock carried);
#     the kg used, the stock and the bottles (kg / mango_kg_per_litre) are physical drivers;
#   * bottles x bottle_litres sold at price_per_bottle, collected on dso_days of a days_per_year
#     year; the receivable is carried in at nwc_opening (the unit has traded a year), and the
#     terms run past the horizon, so nothing unwinds at its end;
#   * packaging and sugar/acid a bottle, three workers, the shed and power/water a month (x
#     months_per_year), all paid on payables_days; inventory held at inventory_days of cash opex
#     (nil), the gold's own definition;
#   * the line is carried in at nbv_opening and depreciated straight-line over
#     remaining_life_years to nil; capex_per_year (nil) is spent each year;
#   * tax at tax_rate on profit, mango_deductible_fraction of the mango deductible (the rest a
#     permanent difference, classified non_deductible); the company pays the higher of that and
#     minimum_tax_per_year. income_tax has no minimum-tax floor, so the top-up
#     max(0, minimum - profits tax) is posted to tax by a transfer, the profits tax recomputed in
#     formulas from the same inputs (nil in every period of the base: the floor never binds);
#     tax paid within the year;
#   * tax_min is the floor itself, a memo amount no ledger holds: read as a driver;
#   * the "if deductible" rows are the variant with the whole mango deductible.
# Gold finding (the variant rows differ, t=0..8): the gold's counterfactual takes the tax as
# tax_rate x EBIT = 1,190,000, ignoring the minimum tax its own §8 imposes ("the company pays the
# higher of the profits tax and the forfaitary minimum ... 3,000,000"). With the mango deductible
# the floor binds: the books charge 3,000,000, so tax_if_deductible is 3,000,000 (gold 1,190,000),
# tax_leakage 1,315,000 (gold 3,125,000) and fcff_if_deductible 5,260,000 (gold 7,070,000).
gold: juice_nondeductible
entity: unit
plant: price_per_bottle
variants:
  deductible:
    values:
      deductible: 1                      # the whole mango invoiced and deductible
case:
  case: gold-pilot-juice-nondeductible
  periods: 9
  phases: [fund, operate, close, tax, settle]
  currency: XOF
  floors: {}
  generators:
    gold:
      kind: formulas
      periods: 9
      inputs: gold
      values:
        mango_kg: mango_tonnes_per_season * kg_per_tonne
        purchased: {each_period: mango_kg}
        used: purchased                                  # nothing carried across a year-end
        stock: cumsum(purchased) - cumsum(used)
        bottles: used / mango_kg_per_litre
        litres_sold: bottles * bottle_litres
        deductible: mango_deductible_fraction
        mango_invoiced: purchased * deductible
        mango_cash: purchased - mango_invoiced
        labour_annual: workers * wage_per_worker_month * months_per_year
        rent_annual: rent_per_month * months_per_year
        utilities_annual: utilities_per_month * months_per_year
        capex: {each_period: capex_per_year}
        tax_min: {each_period: minimum_tax_per_year}
        # the profits tax the books charge, recomputed for the minimum-tax top-up
        revenue_f: litres_sold * price_per_bottle
        cash_opex_f: >-
          purchased * mango_price_per_kg + bottles * (packaging_cost_per_bottle + ingredient_cost_per_bottle)
          + labour_annual + rent_annual + utilities_annual
        depreciation_f: nbv_opening / remaining_life_years
        taxable_f: revenue_f - cash_opex_f - depreciation_f + mango_cash * mango_price_per_kg
        imf_topup: max(0, tax_min - tax_rate * max(0, taxable_f))
        inventory: cash_opex_f * inventory_days / days_per_year
  opening:
    unit:
      cash: {nature: asset, value: 0}
      cwip: {nature: asset, value: 0}
      fixed_assets: {nature: asset, value: {generator: gold, output: nbv_opening}}
      juice.receivable: {nature: asset, value: {generator: gold, output: nwc_opening}}
      equity: {nature: equity, value: balancing}
  contracts:                     # end: 9 is past the horizon (a going concern)
    juice:
      type: offtake
      parties: {seller: unit}
      terms: {volume: {generator: gold, output: litres_sold}, price: {generator: gold, output: price_per_bottle},
              payment_days: {generator: gold, output: dso_days},
              days_per_year: {generator: gold, output: days_per_year}, periods_per_year: 1, end: 9}
    mango:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: 0, unit_rate: {generator: gold, output: mango_price_per_kg},
              volume: {generator: gold, output: mango_cash}, index: 1, periods_per_year: 1, start: 0, end: 9,
              vat_rate: 0, vat_refund_lag: 0, payment_days: {generator: gold, output: payables_days},
              days_per_year: {generator: gold, output: days_per_year}}
    mango_invoiced:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: 0, unit_rate: {generator: gold, output: mango_price_per_kg},
              volume: {generator: gold, output: mango_invoiced}, index: 1, periods_per_year: 1, start: 0, end: 9,
              vat_rate: 0, vat_refund_lag: 0, payment_days: {generator: gold, output: payables_days},
              days_per_year: {generator: gold, output: days_per_year}}
    packaging:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: 0, unit_rate: {generator: gold, output: packaging_cost_per_bottle},
              volume: {generator: gold, output: bottles}, index: 1, periods_per_year: 1, start: 0, end: 9,
              vat_rate: 0, vat_refund_lag: 0, payment_days: {generator: gold, output: payables_days},
              days_per_year: {generator: gold, output: days_per_year}}
    ingredients:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: 0, unit_rate: {generator: gold, output: ingredient_cost_per_bottle},
              volume: {generator: gold, output: bottles}, index: 1, periods_per_year: 1, start: 0, end: 9,
              vat_rate: 0, vat_refund_lag: 0, payment_days: {generator: gold, output: payables_days},
              days_per_year: {generator: gold, output: days_per_year}}
    labour:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: {generator: gold, output: labour_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0,
              payment_days: {generator: gold, output: payables_days},
              days_per_year: {generator: gold, output: days_per_year}}
    rent:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: {generator: gold, output: rent_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0,
              payment_days: {generator: gold, output: payables_days},
              days_per_year: {generator: gold, output: days_per_year}}
    utilities:
      type: operating_cost
      parties: {payer: unit}
      terms: {annual: {generator: gold, output: utilities_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: 1, start: 0, end: 9, vat_rate: 0, vat_refund_lag: 0,
              payment_days: {generator: gold, output: payables_days},
              days_per_year: {generator: gold, output: days_per_year}}
    line_capex:
      type: capex
      parties: {owner: unit}
      terms: {schedule: {generator: gold, output: capex}, vat_rate: 0, vat_refund_lag: 0, end: 8}
  rulebooks:
    stock:
      kind: held_balance
      entity: unit
      cash: cash
      phase: operate
      accounts:
        inventory: {side: asset, target: {generator: gold, output: inventory}}
    line:
      kind: asset_register
      entity: unit
      phase: close
      from: cwip
      to: fixed_assets
      expense: depreciation
      disposal: disposal_loss
      in_service: 0
      dispose_at: 8
      life_periods: {generator: gold, output: remaining_life_years}
      first_charge: in_service
    tax:
      kind: income_tax
      entity: unit
      phase: tax
      expense: tax_expense
      payable: tax_payable
      rate: {generator: gold, output: tax_rate}
      carry_forward_periods: null
      scheme:
        juice.revenue: taxable
        mango.expense: non_deductible          # no invoice: never deducted (a permanent difference)
        mango_invoiced.expense: taxable
        packaging.expense: taxable
        ingredients.expense: taxable
        labour.expense: taxable
        rent.expense: taxable
        utilities.expense: taxable
        depreciation: taxable
        disposal_loss: taxable
        tax_expense: non_deductible
        imf_topup: non_deductible
    minimum_tax:
      kind: transfer
      entity: unit
      phase: tax
      declare:
        imf_topup: expense
      moves:
        topup: {debit: imf_topup, credit: tax_payable, amount: {generator: gold, output: imf_topup}}
    pay_tax:
      kind: settle
      entity: unit
      cash: cash
      phase: settle
      accounts: [tax_payable]
  schemes:
    pnl:
      juice.revenue: revenue
      mango.expense: mango_uninvoiced
      mango_invoiced.expense: mango_invoiced
      packaging.expense: packaging
      ingredients.expense: ingredients
      labour.expense: labour
      rent.expense: rent
      utilities.expense: utilities
      depreciation: depreciation
      disposal_loss: depreciation
      tax_expense: tax
      imf_topup: tax
    cash_flow:
      juice.receivable: operating
      mango.payable: operating
      mango_invoiced.payable: operating
      packaging.payable: operating
      ingredients.payable: operating
      labour.payable: operating
      rent.payable: operating
      utilities.payable: operating
      inventory: operating
      vat_receivable: operating
      tax_payable: operating
      cwip: investing
  cuts:
    revenue: {kind: pnl, entity: unit, scheme: pnl, include: [revenue]}
    mango: {kind: pnl, entity: unit, scheme: pnl, include: [mango_uninvoiced, mango_invoiced]}
    mango_uninvoiced: {kind: pnl, entity: unit, scheme: pnl, include: [mango_uninvoiced]}
    packaging: {kind: pnl, entity: unit, scheme: pnl, include: [packaging]}
    ingredients: {kind: pnl, entity: unit, scheme: pnl, include: [ingredients]}
    contribution: {kind: pnl, entity: unit, scheme: pnl,
                   include: [revenue, mango_uninvoiced, mango_invoiced, packaging, ingredients]}
    labour: {kind: pnl, entity: unit, scheme: pnl, include: [labour]}
    rent: {kind: pnl, entity: unit, scheme: pnl, include: [rent]}
    utilities: {kind: pnl, entity: unit, scheme: pnl, include: [utilities]}
    fixed: {kind: pnl, entity: unit, scheme: pnl, include: [labour, rent, utilities]}
    cash_opex: {kind: pnl, entity: unit, scheme: pnl,
                include: [mango_uninvoiced, mango_invoiced, packaging, ingredients, labour, rent, utilities]}
    ebitda: {kind: pnl, entity: unit, scheme: pnl,
             include: [revenue, mango_uninvoiced, mango_invoiced, packaging, ingredients, labour, rent, utilities]}
    depreciation: {kind: pnl, entity: unit, scheme: pnl, include: [depreciation]}
    ebit: {kind: pnl, entity: unit, scheme: pnl,
           include: [revenue, mango_uninvoiced, mango_invoiced, packaging, ingredients, labour, rent, utilities,
                     depreciation]}
    tax: {kind: pnl, entity: unit, scheme: pnl, include: [tax]}
    nopat: {kind: pnl, entity: unit, scheme: pnl,
            include: [revenue, mango_uninvoiced, mango_invoiced, packaging, ingredients, labour, rent, utilities,
                      depreciation, tax]}
    cfo: {entity: unit, account: cash, scheme: cash_flow, include: [operating]}
    cfi: {entity: unit, account: cash, scheme: cash_flow, include: [investing]}
    fcff: {entity: unit, account: cash, scheme: cash_flow, include: [operating, investing]}
  measures: {}
trace:
  mango_purchased_kg: {driver: gold.purchased}
  mango_kg_used: {driver: gold.used}
  mango_stock_close: {driver: gold.stock}
  bottles: {driver: gold.bottles}
  revenue: {cut: revenue}
  mango_cost: {cut: mango, sign: -1}
  packaging_cost: {cut: packaging, sign: -1}
  ingredient_cost: {cut: ingredients, sign: -1}
  contribution_margin: {cut: contribution}
  labour_cost: {cut: labour, sign: -1}
  rent_cost: {cut: rent, sign: -1}
  utilities_cost: {cut: utilities, sign: -1}
  fixed_cash_costs: {cut: fixed, sign: -1}
  cash_opex: {cut: cash_opex, sign: -1}
  ebitda: {cut: ebitda}
  capex: {cut: cfi, sign: -1}
  depreciation: {cut: depreciation, sign: -1}
  nbv_open: {opening: fixed_assets}
  nbv_close: {balance: fixed_assets}
  ebit: {cut: ebit}
  non_deductible_mango: {cut: mango_uninvoiced, sign: -1}
  taxable_profit: {record: tax.base}
  tax_min: {driver: gold.tax_min}
  tax: {cut: tax, sign: -1}
  nopat: {cut: nopat}
  receivables: {balance: juice.receivable}
  inventory: {balance: inventory}
  payables: {balance: mango.payable + mango_invoiced.payable + packaging.payable + ingredients.payable + labour.payable + rent.payable + utilities.payable}
  nwc: {balance: juice.receivable + inventory - mango.payable - mango_invoiced.payable - packaging.payable - ingredients.payable - labour.payable - rent.payable - utilities.payable}
  delta_nwc: {change: juice.receivable + inventory - mango.payable - mango_invoiced.payable - packaging.payable - ingredients.payable - labour.payable - rent.payable - utilities.payable}
  cfo: {cut: cfo}
  cfi: {cut: cfi}
  fcff: {cut: fcff}
  tax_if_deductible: {cut: tax, sign: -1, variant: deductible}
  tax_leakage: {sum: [{cut: tax, sign: -1}, {cut: tax, variant: deductible}]}
  fcff_if_deductible: {cut: fcff, variant: deductible}

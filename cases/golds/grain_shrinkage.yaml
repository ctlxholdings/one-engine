# Gold "grain_shrinkage": the Bamako sorghum trader with storage losses and fumigation, one
# campaign by month from the November harvest (cases/reference/golds/grain_shrinkage.yaml).
#
# Every amount is a gold input by name, or a formula over gold inputs (generator `gold`).
#   * bags_purchased_at_harvest bought in period 0 at purchase_price_per_bag plus
#     transport_cost_per_bag, paid on delivery; that landed cost is the inventory's cost;
#   * only outturn_ratio of them come back out: the rest are lost evenly over the storage_months
#     the store holds grain, each lost bag written off at cost (shrinkage, its own line);
#   * the sellable bags are sold evenly over selling_months from first_selling_period_index at
#     sale_price_per_bag, for cash; purchases are expensed when bought and the stock held is
#     taken back out of that expense, so cost of sales is what was sold;
#   * rent every month, and a fumigation of fumigation_cost_per_treatment at
#     fumigation_1_period_index and fumigation_2_period_index;
#   * tax at tax_rate on each month's operating profit, a loss month giving a credit
#     (tax_symmetry_on_losses), settled in the month; no owned asset, no credit given or taken
#     (days_per_year is a placeholder).
gold: grain_shrinkage
entity: trader
plant: sale_price_per_bag
case:
  case: gold-grain-shrinkage
  periods: 12
  phases: [fund, operate, close, tax, settle]
  currency: XOF
  floors: {}
  generators:
    gold:
      kind: formulas
      periods: 12
      inputs: gold
      values:
        landed: purchase_price_per_bag + transport_cost_per_bag
        purchased: bags_purchased_at_harvest * (t == 0)
        shrunk_each: bags_purchased_at_harvest * (1 - outturn_ratio) / storage_months
        shrunk: shrunk_each * (t < storage_months)
        sold_each: bags_purchased_at_harvest * outturn_ratio / selling_months
        sold: sold_each * (t >= first_selling_period_index) * (t < first_selling_period_index + selling_months)
        in_store: >-
          bags_purchased_at_harvest - shrunk_each * min(t + 1, storage_months)
          - sold_each * max(0, min(selling_months, t + 1 - first_selling_period_index))
        inventory: landed * in_store
        shrinkage: landed * shrunk
        fumigation: >-
          fumigation_cost_per_treatment * ((t == fumigation_1_period_index) + (t == fumigation_2_period_index))
        rent_annual: warehouse_rent_per_month * rent_months_per_cycle
  opening:
    trader:
      cash: {nature: asset, value: 0}
      inventory: {nature: asset, value: 0}
      equity: {nature: equity, value: 0}
  contracts:
    sales:
      type: offtake
      parties: {seller: trader}
      terms: {volume: {generator: gold, output: sold}, price: {generator: gold, output: sale_price_per_bag},
              payment_days: {generator: gold, output: receivable_days}, days_per_year: 12, periods_per_year: 12,
              end: 11}
    sorghum:
      type: operating_cost
      parties: {payer: trader}
      terms: {annual: 0, unit_rate: {generator: gold, output: landed}, volume: {generator: gold, output: purchased},
              index: 1, periods_per_year: 12, start: 0, end: 11, vat_rate: 0, vat_refund_lag: 0,
              payment_days: {generator: gold, output: payable_days}, days_per_year: 12}
    store:
      type: operating_cost
      parties: {payer: trader}
      terms: {annual: {generator: gold, output: rent_annual}, unit_rate: 0, volume: 0, index: 1,
              periods_per_year: {generator: gold, output: rent_months_per_cycle}, start: 0, end: 11, vat_rate: 0,
              vat_refund_lag: 0, payment_days: {generator: gold, output: payable_days}, days_per_year: 12}
    fumigation:
      type: operating_cost
      parties: {payer: trader}
      terms: {annual: 0, unit_rate: 1, volume: {generator: gold, output: fumigation}, index: 1, periods_per_year: 12,
              start: 0, end: 11, vat_rate: 0, vat_refund_lag: 0,
              payment_days: {generator: gold, output: payable_days}, days_per_year: 12}
  rulebooks:
    lost_in_store:
      kind: write_down
      entity: trader
      phase: fund
      account: inventory
      expense: shrinkage_loss
      amount: {generator: gold, output: shrinkage}
    stock:
      kind: held_balance
      entity: trader
      cash: cash
      phase: operate
      accounts:
        inventory: {side: asset, target: {generator: gold, output: inventory}, against: sorghum.expense}
    tax:
      kind: income_tax
      entity: trader
      phase: tax
      expense: tax_expense
      payable: tax_payable
      rate: {generator: gold, output: tax_rate}
      carry_forward_periods: null
      loss_relief: refund
      scheme:
        sales.revenue: taxable
        sorghum.expense: taxable
        shrinkage_loss: taxable
        store.expense: taxable
        fumigation.expense: taxable
        tax_expense: non_deductible
    pay_tax:
      kind: settle
      entity: trader
      cash: cash
      phase: settle
      accounts: [tax_payable]
  schemes:
    pnl:
      sales.revenue: revenue
      sorghum.expense: cogs
      shrinkage_loss: shrinkage
      store.expense: rent
      fumigation.expense: fumigation
      tax_expense: tax
    cash_flow:
      sales.receivable: operating
      sorghum.payable: purchases
      store.payable: operating
      fumigation.payable: operating
      vat_receivable: operating
      tax_payable: operating
  cuts:
    revenue: {kind: pnl, entity: trader, scheme: pnl, include: [revenue]}
    cogs: {kind: pnl, entity: trader, scheme: pnl, include: [cogs]}
    shrinkage: {kind: pnl, entity: trader, scheme: pnl, include: [shrinkage]}
    gross_profit: {kind: pnl, entity: trader, scheme: pnl, include: [revenue, cogs]}
    rent: {kind: pnl, entity: trader, scheme: pnl, include: [rent]}
    fumigation: {kind: pnl, entity: trader, scheme: pnl, include: [fumigation]}
    storage_opex: {kind: pnl, entity: trader, scheme: pnl, include: [rent, fumigation]}
    ebitda: {kind: pnl, entity: trader, scheme: pnl, include: [revenue, cogs, shrinkage, rent, fumigation]}
    depreciation: {kind: pnl, entity: trader, scheme: pnl, include: []}       # no owned asset
    ebit: {kind: pnl, entity: trader, scheme: pnl, include: [revenue, cogs, shrinkage, rent, fumigation]}
    tax: {kind: pnl, entity: trader, scheme: pnl, include: [tax]}
    nopat: {kind: pnl, entity: trader, scheme: pnl, include: [revenue, cogs, shrinkage, rent, fumigation, tax]}
    purchases: {entity: trader, account: cash, scheme: cash_flow, include: [purchases]}
    cfo: {entity: trader, account: cash, scheme: cash_flow, include: [operating, purchases]}
    cfi: {entity: trader, account: cash, scheme: cash_flow, include: []}        # no owned asset
    fcff: {entity: trader, account: cash, scheme: cash_flow, include: [operating, purchases]}
  measures: {}
trace:
  bags_purchased: {driver: gold.purchased}
  bags_shrunk: {driver: gold.shrunk}
  bags_sold: {driver: gold.sold}
  bags_in_store: {driver: gold.in_store}
  purchases_at_cost: {cut: purchases, sign: -1}
  cogs: {cut: cogs, sign: -1}
  shrinkage_loss: {cut: shrinkage, sign: -1}
  inventory_value: {balance: inventory}
  accounts_receivable: {balance: sales.receivable}
  accounts_payable: {balance: sorghum.payable + store.payable + fumigation.payable}
  nwc: {balance: inventory + sales.receivable - sorghum.payable - store.payable - fumigation.payable}
  delta_nwc: {change: inventory + sales.receivable - sorghum.payable - store.payable - fumigation.payable}
  revenue: {cut: revenue}
  gross_profit: {cut: gross_profit}
  rent_expense: {cut: rent, sign: -1}
  fumigation_expense: {cut: fumigation, sign: -1}
  storage_opex: {cut: storage_opex, sign: -1}
  ebitda: {cut: ebitda}
  depreciation: {cut: depreciation, sign: -1}
  ebit: {cut: ebit}
  tax_on_ebit: {cut: tax, sign: -1}
  nopat: {cut: nopat}
  capex: {cut: cfi, sign: -1}
  cfo: {cut: cfo}
  cfi: {cut: cfi}
  fcff: {cut: fcff}
  fcff_no_tax: {sum: [{cut: fcff}, {cut: tax, sign: -1}]}
  cum_fcff: {cumulative: fcff}

# Gold "arise_degradation": the Arise 234 MW solar portfolio with its output declining half a
# percent a year, twenty PPA years (cases/reference/golds/arise_degradation.yaml).
#
# Every amount is a gold input by name, or a formula over gold inputs (generator `gold`).
#   * capex_total spent in period capex_period_index, and the plants run from that same first
#     year (the gold collapses construction into period 0);
#   * generation_year1_mwh in the first year, each later year degradation_rate below the one
#     before (compounding); sold at the tariff (tariff_usd_cents_per_kwh, 100 cents a dollar,
#     1000 kWh a MWh), all settled in the year (nwc_level_usd is nil, so no day basis is used);
#   * operating cost opex_pct_of_capex of capex a year;
#   * straight-line depreciation over useful_life_years from the first year, down to the salvage
#     (salvage_pct_of_capex of capex, its residual value); the plant is sold for that salvage in
#     salvage_period_index, so the gain is nil;
#   * tax at tax_rate on profit including any gain, losses carried for nol_carryforward_years.
gold: arise_degradation
entity: ipp
plant: tariff_usd_cents_per_kwh
case:
  case: gold-arise-degradation
  periods: 20
  phases: [fund, operate, close, tax, settle]
  currency: USD
  floors: {}
  generators:
    gold:
      kind: formulas
      periods: 20
      inputs: gold
      values:
        tariff: tariff_usd_cents_per_kwh * 1000 / 100
        generation: generation_year1_mwh * (1 - degradation_rate) ** t
        opex: {each_period: opex_pct_of_capex * capex_total}
        capex: capex_total * (t == capex_period_index)
        salvage: salvage_pct_of_capex * capex_total
        sold: t == salvage_period_index
  opening:
    ipp:
      cash: {nature: asset, value: 0}
      cwip: {nature: asset, value: 0}
      equity: {nature: equity, value: 0}
  contracts:
    power:
      type: offtake
      parties: {seller: ipp}
      terms: {volume: {generator: gold, output: generation}, price: {generator: gold, output: tariff},
              payment_days: 0, days_per_year: 12, periods_per_year: 1,
              end: {generator: gold, output: salvage_period_index}}
    om:
      type: operating_cost
      parties: {payer: ipp}
      terms: {annual: 0, unit_rate: 1, volume: {generator: gold, output: opex}, index: 1, periods_per_year: 1,
              start: 0, end: {generator: gold, output: salvage_period_index}, vat_rate: 0, vat_refund_lag: 0,
              payment_days: 0, days_per_year: 12}
    salvage_sale:
      type: offtake
      parties: {seller: ipp}
      terms: {volume: {generator: gold, output: sold}, price: {generator: gold, output: salvage},
              payment_days: 0, days_per_year: 12, periods_per_year: 1,
              end: {generator: gold, output: salvage_period_index}}
    build:
      type: capex
      parties: {owner: ipp}
      terms: {schedule: {generator: gold, output: capex}, vat_rate: 0, vat_refund_lag: 0,
              end: {generator: gold, output: salvage_period_index}}
  rulebooks:
    plant:
      kind: asset_register
      entity: ipp
      phase: close
      from: cwip
      to: fixed_assets
      expense: depreciation
      disposal: written_off
      in_service: {generator: gold, output: capex_period_index}
      dispose_at: {generator: gold, output: salvage_period_index}
      life_periods: {generator: gold, output: useful_life_years}
      first_charge: in_service
      residual: {generator: gold, output: residual_value_for_depreciation}
    tax:
      kind: income_tax
      entity: ipp
      phase: tax
      expense: tax_expense
      payable: tax_payable
      rate: {generator: gold, output: tax_rate}
      carry_forward_periods: {generator: gold, output: nol_carryforward_years}
      scheme:
        power.revenue: taxable
        om.expense: taxable
        salvage_sale.revenue: taxable
        depreciation: taxable
        written_off: taxable
        tax_expense: non_deductible
    pay_tax:
      kind: settle
      entity: ipp
      cash: cash
      phase: settle
      accounts: [tax_payable]
  schemes:
    pnl:
      power.revenue: revenue
      om.expense: opex
      depreciation: depreciation
      salvage_sale.revenue: disposal
      written_off: disposal
      tax_expense: tax
    cash_flow:
      power.receivable: operating
      om.payable: operating
      vat_receivable: operating
      tax_payable: operating
      salvage_sale.receivable: sale
      cwip: capex
  cuts:
    revenue: {kind: pnl, entity: ipp, scheme: pnl, include: [revenue]}
    opex: {kind: pnl, entity: ipp, scheme: pnl, include: [opex]}
    ebitda: {kind: pnl, entity: ipp, scheme: pnl, include: [revenue, opex]}
    depreciation: {kind: pnl, entity: ipp, scheme: pnl, include: [depreciation]}
    ebit: {kind: pnl, entity: ipp, scheme: pnl, include: [revenue, opex, depreciation]}
    gain: {kind: pnl, entity: ipp, scheme: pnl, include: [disposal]}
    tax: {kind: pnl, entity: ipp, scheme: pnl, include: [tax]}
    nopat: {kind: pnl, entity: ipp, scheme: pnl, include: [revenue, opex, depreciation, disposal, tax]}
    capex: {entity: ipp, account: cash, scheme: cash_flow, include: [capex]}
    salvage: {entity: ipp, account: cash, scheme: cash_flow, include: [sale]}
    cfo: {entity: ipp, account: cash, scheme: cash_flow, include: [operating]}
    cfi: {entity: ipp, account: cash, scheme: cash_flow, include: [capex, sale]}
    fcff: {entity: ipp, account: cash, scheme: cash_flow, include: [operating, capex, sale]}
  measures: {}
trace:
  generation_mwh: {driver: gold.generation}
  revenue: {cut: revenue}
  opex: {cut: opex, sign: -1}
  ebitda: {cut: ebitda}
  depreciation: {cut: depreciation, sign: -1}
  ebit: {cut: ebit}
  gain_on_disposal: {cut: gain}
  taxable_income_pre_nol: {record: tax.base}
  nol_opening: {record: tax.losses_opening}
  nol_addition: {record: tax.loss_added}
  nol_utilised: {record: tax.loss_used}
  nol_closing: {record: tax.losses}
  taxable_income: {record: tax.taxable}
  tax: {cut: tax, sign: -1}
  nopat: {cut: nopat}
  capex: {cut: capex, sign: -1}
  cost_disposed: {record: plant.disposed_cost}
  accum_dep_disposed: {record: plant.disposed_accumulated}
  nbv_disposed: {record: plant.disposed_nbv}
  salvage_proceeds: {cut: salvage}
  ppe_gross: {record: plant.cost}
  accum_dep: {record: plant.accumulated}
  ppe_nbv: {balance: cwip + fixed_assets}
  receivables: {balance: power.receivable}
  payables: {balance: om.payable}
  nwc: {balance: power.receivable - om.payable}
  delta_nwc: {change: power.receivable - om.payable}
  cfo: {cut: cfo}
  cfi: {cut: cfi}
  fcff: {cut: fcff}
  cum_fcff: {cumulative: fcff}
  fcff_ex_initial_capex: {sum: [{cut: fcff}, {cut: capex, sign: -1}]}

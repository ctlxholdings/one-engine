# Gold "cold_storage": a solar cold room in Kaolack let by the kilo-month, ten trading years
# after the build year (cases/reference/golds/cold_storage.yaml).
#
# Every amount is a gold input by name, or a formula over gold inputs (generator `gold`).
#   * the room (capex_amount) is built in period 0 and trades from first_operating_period;
#   * kilo-months let: capacity_tonnes x 1000 kg x months_per_year x utilisation, utilisation
#     utilization_year1 in the first trading year and utilization_mature after; each at
#     price_per_kg_month, settled in the month (no working capital: nwc_level is nil);
#   * the guard (guard_monthly a month), maintenance, small expenses and the stated nil
#     electricity, from the first trading year;
#   * depreciation straight-line over useful_life_years from the period after the build, to the
#     stated nil salvage;
#   * tax at tax_rate on profit, losses carried forward without limit, paid in the year.
gold: cold_storage
entity: room
plant: price_per_kg_month
case:
  case: gold-cold-storage
  periods: 11
  phases: [fund, operate, close, tax, settle]
  currency: XOF
  floors: {}
  generators:
    gold:
      kind: formulas
      periods: 11
      inputs: gold
      values:
        utilisation: >-
          utilization_year1 if t == first_operating_period
          else utilization_mature * (t > first_operating_period)
        kg_months: capacity_tonnes * 1000 * months_per_year * utilisation
        trading: t >= first_operating_period
        guard: guard_monthly * months_per_year * trading
        maintenance: maintenance_annual * trading
        small_expenses: small_expenses_annual * trading
        electricity: electricity_cost_annual * trading
        capex: capex_amount * (t == 0)
  opening:
    room:
      cash: {nature: asset, value: 0}
      equity: {nature: equity, value: 0}
  contracts:
    storage:
      type: offtake
      parties: {seller: room}
      terms: {volume: {generator: gold, output: kg_months}, price: {generator: gold, output: price_per_kg_month},
              payment_days: 0, days_per_year: {generator: gold, output: months_per_year}, periods_per_year: 1, end: 10}
    guard:
      type: operating_cost
      parties: {payer: room}
      terms: {annual: 0, unit_rate: 1, volume: {generator: gold, output: guard}, index: 1, periods_per_year: 1,
              start: 0, end: 10, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: months_per_year}}
    maintenance:
      type: operating_cost
      parties: {payer: room}
      terms: {annual: 0, unit_rate: 1, volume: {generator: gold, output: maintenance}, index: 1, periods_per_year: 1,
              start: 0, end: 10, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: months_per_year}}
    small_expenses:
      type: operating_cost
      parties: {payer: room}
      terms: {annual: 0, unit_rate: 1, volume: {generator: gold, output: small_expenses}, index: 1,
              periods_per_year: 1, start: 0, end: 10, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: months_per_year}}
    electricity:
      type: operating_cost
      parties: {payer: room}
      terms: {annual: 0, unit_rate: 1, volume: {generator: gold, output: electricity}, index: 1,
              periods_per_year: 1, start: 0, end: 10, vat_rate: 0, vat_refund_lag: 0, payment_days: 0,
              days_per_year: {generator: gold, output: months_per_year}}
    build:
      type: capex
      parties: {owner: room}
      terms: {schedule: {generator: gold, output: capex}, vat_rate: 0, vat_refund_lag: 0, end: 10}
  rulebooks:
    assets:
      kind: asset_register
      entity: room
      phase: close
      from: cwip
      to: fixed_assets
      expense: depreciation
      disposal: disposal_loss
      in_service: 0
      dispose_at: 11
      life_periods: {generator: gold, output: useful_life_years}
      first_charge: next_period
    tax:
      kind: income_tax
      entity: room
      phase: tax
      expense: tax_expense
      payable: tax_payable
      rate: {generator: gold, output: tax_rate}
      carry_forward_periods: null
      scheme:
        storage.revenue: taxable
        guard.expense: taxable
        maintenance.expense: taxable
        small_expenses.expense: taxable
        electricity.expense: taxable
        depreciation: taxable
        disposal_loss: taxable
        tax_expense: non_deductible
    pay_tax:
      kind: settle
      entity: room
      cash: cash
      phase: settle
      accounts: [tax_payable]
  schemes:
    pnl:
      storage.revenue: revenue
      guard.expense: opex
      maintenance.expense: opex
      small_expenses.expense: opex
      electricity.expense: opex
      depreciation: depreciation
      disposal_loss: depreciation
      tax_expense: tax
    cash_flow:
      storage.receivable: operating
      guard.payable: operating
      maintenance.payable: operating
      small_expenses.payable: operating
      electricity.payable: operating
      vat_receivable: operating
      tax_payable: operating
      cwip: investing
  cuts:
    revenue: {kind: pnl, entity: room, scheme: pnl, include: [revenue]}
    opex: {kind: pnl, entity: room, scheme: pnl, include: [opex]}
    ebitda: {kind: pnl, entity: room, scheme: pnl, include: [revenue, opex]}
    depreciation: {kind: pnl, entity: room, scheme: pnl, include: [depreciation]}
    ebit: {kind: pnl, entity: room, scheme: pnl, include: [revenue, opex, depreciation]}
    tax: {kind: pnl, entity: room, scheme: pnl, include: [tax]}
    nopat: {kind: pnl, entity: room, scheme: pnl, include: [revenue, opex, depreciation, tax]}
    cfi: {entity: room, account: cash, scheme: cash_flow, include: [investing]}
    fcff: {entity: room, account: cash, scheme: cash_flow, include: [operating, investing]}
  measures: {}
trace:
  utilization: {driver: gold.utilisation}
  kg_months: {driver: gold.kg_months}
  revenue: {cut: revenue}
  opex: {cut: opex, sign: -1}
  ebitda: {cut: ebitda}
  dep: {cut: depreciation, sign: -1}
  ebit: {cut: ebit}
  nol_added: {record: tax.loss_added}
  nol_used: {record: tax.loss_used}
  nol_end: {record: tax.losses}
  taxable_income: {record: tax.taxable}
  tax: {cut: tax, sign: -1}
  nopat: {cut: nopat}
  delta_nwc: {change: storage.receivable - guard.payable - maintenance.payable - small_expenses.payable - electricity.payable}
  nwc: {balance: storage.receivable - guard.payable - maintenance.payable - small_expenses.payable - electricity.payable}
  capex: {cut: cfi, sign: -1}
  book_value: {balance: fixed_assets}
  fcff: {cut: fcff}

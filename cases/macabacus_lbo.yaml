# Macabacus short-form LBO: a listed company bought with debt, run for ten years (plan step 7f).
#
# Source: Macabacus, macabacus-lbo-short.xlsx (a free published model), cached
# values as saved by Excel; financing case 6, "LBO C". Copied to
# cases/reference/macabacus_lbo.json by consolidation/experiments/
# make_reference_macabacus.py, and to this file by make_case_macabacus.py.
# tests/test_case_macabacus.py re-checks every copied value against the reference.
#
# Grid: 11 periods. Period 0 is the close (2023-12-31); periods 1..10 are the
# fiscal years 2024..2033. The workbook's unit is $ millions.
#
# What the workbook does, and how it is assembled here:
#   * the books open on the company's balance sheet before the deal (column
#     H). Retained earnings balance it: the copied floats are out by 4e-14;
#   * the close (rulebook deal): the offer is the share price plus a 25%
#     premium for the basic shares and the in-the-money options (whose
#     strikes are paid in); the old book equity and goodwill go, PP&E is
#     marked up 15 and intangibles by 25% of the excess price, with a
#     deferred tax liability at 35% on the marks; goodwill is the rest of
#     the price. The legacy debt is refinanced; transaction costs are
#     expensed and the financing fees capitalised, and both are deducted
#     for tax at the close (the refund is a source). Sources are three
#     loans, preferred stock (its 3% fee netted, after tax, from paid-in
#     capital), management equity and the cash above 100; the sponsor's
#     equity is what closes the gap;
#   * operations (rulebook operations): the first forecast year is typed in
#     the workbook (sales 464.3 etc.); sales then grow at 464.3 over the last
#     four quarters, and each other line keeps its first-year ratio to
#     sales. Depreciation adds the PP&E mark over 7 years and amortisation
#     the intangibles mark over 5, after the first year: the first year is
#     typed without them, as in the workbook. Working capital is held at its
#     ratio, at the close, to the last four quarters of sales (receivables)
#     or COGS (the rest). Cash earns 1% on its opening balance;
#   * financing: interest on opening balances at LIBOR plus a spread (the
#     subordinated note at a fixed 10.25%); term loan A amortises 20% a year
#     and the rest is swept from cash above 100; the notes are bullets
#     (years 8 and 6); the undrawn revolver pays 0.5% on its 100 commitment.
#     Each facility's fee is amortised over its own term from the close.
#     The preferred stock pays 12% in cash. No common dividends: the cash
#     left after the sweep is retained (waterfall residual null);
#   * tax at 35.0003% (32.99% federal, 3% state net of federal; the deal
#     uses a flat 35%) on EBITDA less depreciation, amortisation, stock
#     compensation and net interest; the financing fees' amortisation is
#     not deductible (their cost was deducted at the close, creating a
#     deferred tax liability), so that liability falls by the rate times
#     the amortisation (income_tax nil_tax_base);
#   * the exit (lens exit): year 4 at 5x that year's EBITDA, less net debt
#     (debt and preferred stock less cash). Holders' returns are XIRRs on
#     the year-end dates.
#
# The revolver is never drawn: cash available for the sweep is positive
# every year (tested), so its draw-on-deficit rule is not built.

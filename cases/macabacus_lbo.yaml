      amortisation: {kind: depreciation, account: amortisation, against: intangibles,
                     first: 14.9, ratio_of: sales, plus: [{mark: deal.intangibles, periods: 5}]}
      capex: {kind: investment, account: ppe_gross, first: 21.8, ratio_of: sales}
      interest_income: {kind: income, account: interest_income, on_balance: cash, rate: [0, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01]}
    working_capital:            # held at the close balance over the last four quarters of the driver
      receivables: {side: asset, of: sales, base: *ltm_sales}
      prepaid: {side: asset, of: cogs, base: &ltm_cogs [54.7, 56.1, 56.8, 57.5]}
      payables: {side: liability, of: cogs, base: *ltm_cogs}
      accrued: {side: liability, of: cogs, base: *ltm_cogs}
      other_current_liabilities: {side: liability, of: cogs, base: *ltm_cogs}
  tax:
    kind: income_tax
    entity: company
    phase: tax
    from: 1                     # the close's tax is the deal's
    expense: tax_expense
    payable: tax_payable
    # the forecast's blended rate (K706): 0.3299 federal x (1 - 0.03) + 0.03 state,
    # not the 35% the deal uses (K24)
    rate: 0.350003
    carry_forward_periods: null
    scheme:
      sales: taxable
      cogs: taxable
      sga: taxable
      depreciation: taxable
      amortisation: taxable
      sbc: taxable
      interest_income: taxable
      revolver.interest: taxable
      revolver.fees: taxable
      term_loan_a.interest: taxable
      term_loan_a.fees: taxable
      senior_note.interest: taxable
      senior_note.fees: taxable
      subordinated_note.interest: taxable
      subordinated_note.fees: taxable
      revolver_fee.amortisation: non_deductible       # deducted at the close
      term_loan_a_fee.amortisation: non_deductible       # deducted at the close
      senior_note_fee.amortisation: non_deductible       # deducted at the close
      subordinated_note_fee.amortisation: non_deductible       # deducted at the close
      transaction_costs: non_deductible      # deducted at the close, by the deal
      deal_tax_benefit: non_deductible
      tax_expense: non_deductible
      deferred_tax_expense: non_deductible

rulebooks:
  deal:
    kind: acquisition
    entity: company
    cash: cash
    phase: deal
    at: 0
    tax_rate: 0.35
    offer:
      share_price: 12.81
      premium: 0.25
      basic_shares: 34.922
      options:                  # exercised when the strike is at or below the offer price
        - {number: 0.402, strike: 9.13}
        - {number: 0.12, strike: 9.93}
        - {number: 0.466, strike: 11.6}
        - {number: 0.3, strike: 12.64}
        - {number: 0.52, strike: 19.48}
        - {number: 0.422, strike: 27.03}
        - {number: 0.375, strike: 45.78}
    book_equity: [common_par, apic, retained_earnings]
    goodwill: goodwill
    marks:
      - {account: ppe_gross, amount: 15}
      - {account: intangibles, share_of_excess: 0.25}
    deferred_tax: net_dtl
    refinance: [legacy_debt]
    min_cash: 100
    transaction_costs:
      expense: transaction_costs
      items:
        advisory: {rate: 0.01}      # of the equity purchase price
        sponsor: {rate: 0.0065}
        legal: 3
        accounting: 2.5
        printing: 1
        other: 2
    tax_benefit: deal_tax_benefit
    financing_fees: [revolver_fee.fee, term_loan_a_fee.fee, senior_note_fee.fee, subordinated_note_fee.fee]
    sources:
      - {claim: term_loan_a.draw}
      - {claim: senior_note.draw}
      - {claim: subordinated_note.draw}
      - {leg: preferred_a.issue, amount: 10, issue_cost: {rate: 0.03, account: preferred_issue_costs}}
      - {leg: management.contribute, amount: 10}
    residual: sponsor.contribute
  operations:
    kind: operating_plan
    entity: company
    cash: cash
    phase: operate
    from: 1
    until: 10
    lines:
      sales: {kind: income, account: sales, first: 464.3, growth_from: &ltm_sales [106.7, 108.405, 110.7, 112.2]}
      cogs: {kind: expense, account: cogs, first: 237.9, ratio_of: sales}
      sga: {kind: expense, account: sga, first: 87.7, ratio_of: sales}
      sbc: {kind: share_compensation, account: sbc, against: apic, first: 8, ratio_of: sales}
      depreciation: {kind: depreciation, account: depreciation, against: accumulated_depreciation,

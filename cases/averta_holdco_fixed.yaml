    - {flow: spvs.spend}
    sources:
    - {claim: warehouse.draw, share: 0.65}
    - {claim: shl.draw, share: 0.09518478262434758855}
    residual:
    - {leg: lp.contribute, share: 708043478216149747/728043478216149747}
    - {leg: gp.contribute, share: 20000000000000000/728043478216149747}
  assets: {kind: asset_register, entity: holdco, phase: accrue, from: cwip, to: fixed_assets, expense: depreciation,
    disposal: disposal_loss, in_service: 20, life_periods: 100, first_charge: next_period, dispose_at: 20}
  interest:
    kind: pay_as_due
    phase: pay
    claims: [warehouse.interest]
  promote: {kind: promote, lp: lp, gp: gp, accrue_phase: accrue, pref_rate: 0, periods_per_year: 4, pref_compounds: false,
    carry_rate: 0.1, catchup_pct: 0}
  waterfall:

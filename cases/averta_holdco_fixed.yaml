    type: loan
    parties: {borrower: holdco}
    terms: {commitment: 71729985.6, draw_schedule: 71729985.6, available_until: 20, rate: 0.059507773325182886,
      rate_from: 1, days_per_period: 1, day_count_basis: 4, commitment_fee_rate: 0, capitalise_from: 1, capitalise_until: 0,
      repay_from: 20, repay_periods: 1, sculpt_dscr: null, principal_schedule: null, arrangement_fee: 0, fee_at: 0}
  shl:
    type: loan
    parties: {borrower: holdco}
    terms: {commitment: 15756007.1238082678525066728, draw_schedule: 15756007.1238082678525066728, available_until: 20,
      rate: 0.09081677264211666, rate_from: 1, days_per_period: 1, day_count_basis: 4, commitment_fee_rate: 0, capitalise_from: 0,
      capitalise_until: 20, repay_from: 20, repay_periods: 1, sculpt_dscr: null, principal_schedule: null, arrangement_fee: 0,
      fee_at: 0}

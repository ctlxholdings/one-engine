      vat_refund_lag: 0, payment_days: 0, days_per_year: 365}
  spvs:
    type: capex
    parties: {owner: holdco}
    terms:
      schedule: {generator: capex, output: series}
      vat_rate: 0
      vat_refund_lag: 0
      end: 20

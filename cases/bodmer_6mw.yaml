    entity: spv
    phase: accrue
    from: cwip
    to: fixed_assets
    expense: depreciation
    disposal: disposal_loss
    in_service: 9
    life_periods: 40
    first_charge: in_service
    dispose_at: 108
  tax:
    kind: income_tax
    entity: spv
    phase: tax
    expense: tax_expense
    payable: tax_payable
    rate: 0.3
    carry_forward_periods: null
    scheme:
      operations.revenue: taxable
      depreciation: taxable
      disposal_loss: taxable
      senior.interest: non_deductible
      senior.fees: non_deductible

      - {flow: epc.spend}
      - {claim: senior.arrangement_fee}
      - {claim: senior.interest}
      - {claim: senior.fee}
    loan: senior
    equity: equity.contribute
    equity_first: 0.4
    budget:                     # the sources and uses table (G42:G57)
      development: 162000
      epc: 4440000
      idc: 18218.734425531227                  # typed (I55), not computed
      up_front_fee: 52877.86599605164          # typed (I56)
      commitment_fee: 6417.227247351902       # typed (I57)
  assets:

# Bodmer 6MW solar: the Financing Model rebuilt from the Operating Model's outputs (plan step 7e).
#
# Source: Edward Bodmer, Solar-Case-Study-Complete.xlsm (edbodmer.com, a free
# published model), cached values as saved by Excel; copied to
# cases/reference/bodmer_solar.json by consolidation/experiments/
# make_reference_bodmer.py, and to this file by make_case_bodmer.py.
# tests/test_case_bodmer.py re-checks every copied value against the reference.
#
# Grid: 109 periods. Four months of development (Sep-Dec 2015) and five of
# construction (Jan-May 2016), then 100 quarters from June 2016 (COD).
# The workbook names no currency; CU is a currency unit.
#
# What the Financing Model does, and how it is assembled here:
#   * the Operating Model's EBITDA enters as one income line (operations);
#     development and EPC costs are capex into CWIP;
#   * the loan is sized by sculpting (loop debt_size): debt service in each
#     of the 80 repayment quarters is CFADS / 1.45, and the debt is that
#     service discounted at the loan's own rate, compounded quarter by
#     quarter from COD. CFADS is EBITDA less a tax that ignores interest,
#     so the size does not depend on the debt: two runs close the loop
#     exactly. The principal schedule is the sizing's (service less
#     interest on the sizing balance), capped by what is owed; where it is
#     negative, that much interest is capitalised (debt service below
#     interest, in six winter quarters);
#   * the up-front fee is 1.5% of the sized debt, paid at the start of
#     construction; the commitment fee is 0.7% a year on the undrawn
#     commitment during construction; interest during construction is
#     funded as a use;
#   * funding: equity is the budget less the sized debt; 40% of it is paid
#     in first, then each period's uses are split between debt and equity
#     in the ratio of what is left of each (pro_rata_funding);
#   * tax at 30% on EBITDA less tax depreciation (the 4,602,000 of
#     development and EPC over 40 quarters from COD), losses carried
#     forward without limit. Interest and fees are not deducted: the
#     workbook's EBT (row 153) excludes them;
#   * cash after tax and debt service is distributed every quarter. Equity
#     and debt returns are XIRRs on the period end dates.
#
# The budget is the workbook's sources and uses total (G58). Its IDC and
# fees are the "Fixed" column, values typed into I55:I57 (a paste of an
# earlier run's computed figures, from a debt of about 3,525,191), not the
# figures this run computes. They are reproduced as typed so that the
# workbook's funding split is reproduced; tests/test_case_bodmer.py closes
# that loop too and reports what changes.
#
# Not carried: the default-draw facility (row 173 is zero in every
# period), the DSRA (assumed in Assumptions, no rows in the model), cash
# sweep (0) and the maximum gearing of 80% (the sized debt is 72.9% of
# capital, so the cap does not bind).

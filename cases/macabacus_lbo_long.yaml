# Macabacus long-form LBO: the short form's buyout with a stub year, projections, OIDs and a PIK preferred (plan step 7g).
#
# Source: Macabacus, macabacus-lbo-long.xlsx (the "complex" LBO, a free
# published model), cached values as saved by Excel; financing case 6,
# "LBO C". Copied to cases/reference/macabacus_lbo_long.json by
# consolidation/experiments/make_reference_macabacus_long.py, and to this
# file by make_case_macabacus_long.py. tests/test_case_macabacus_long.py
# re-checks every copied value against the reference.
#
# Grid: 11 periods. Period 0 is the close (2023-12-31); period 1 the stub
# to the first fiscal year end (three quarters, to 2024-09-30); periods
# 2..10 the fiscal years to 30 September 2025..2033. Each carries its
# fraction of a year (0.75, then 1): interest, fees, the preferred coupon,
# the amortisation of fees, discounts and marks all take it. The unit is
# $ millions.
#
# What the workbook does, and how it is assembled here (as the short form,
# cases/macabacus_lbo.yaml, except where said):
#   * the books open on the company's balance sheet at the close before the
#     deal (column J, "Standalone at Close"); retained earnings balance it;
#   * the close (rulebook deal), as the short form, plus: the senior and
#     subordinated notes and the preferred stock are issued at a 5% original
#     issue discount (withheld from the proceeds: ``discounts``); the legacy
#     debt is refinanced with a 2% prepayment penalty, expensed and deducted
#     for tax at the close with the transaction costs and the fees;
#   * operations (rulebook operations): the analyst projections for the stub
#     and the next two years (M..O) are followed; then sales grow at the last
#     growth they show (annualised) and each other line keeps its last ratio
#     to sales. The year-4 projection (column P) is typed but not used: the
#     workbook holds the year-3 growth and ratios from year 4. Cost savings
#     (10 of COGS, 20 of SG&A, phased in from year 2) come off. The marks
#     are charged from the stub (PP&E over 7 years, intangibles over 5, by
#     year fraction). Working capital is held at its ratio to the driver
#     annualised from the last quarter (base over 0.25);
#   * financing: interest on opening balances times the year fraction, at
#     LIBOR plus a spread (the subordinated note fixed); term loan A
#     amortises 20% a year by year fraction and the rest is swept; the notes
#     are bullets (years 8 and 6). The notes' discounts amortise over 4
#     years into interest (deductible); the fees over their terms (not
#     deductible after the close). The preferred stock's 12% coupon, plus
#     its discount's amortisation, is paid in kind in the first three
#     periods and a quarter of it in the fourth;
#   * tax at the blended 35.0003% from the stub, as the short form;
#   * the exit (lens exit): year 4 at 5x that year's EBITDA (annualised),
#     less net debt at book value (debt and preferred stock, net of their
#     unamortised discounts, less cash). The subordinated note is repaid
#     at face plus its 1% year-4 prepayment premium, the preferred at its
#     face (PIK accreted). The holders' interim flows of the stub are left
#     out (interim_from: 2), as the workbook's returns rows do. Returns are
#     XIRRs on the period-end dates and cash-on-cash multiples.
#
# The revolver is never drawn: cash available for the sweep is positive
# every period (tested).

      nil_tax_base: [revolver_fee.deferred, term_loan_a_fee.deferred, senior_note_fee.deferred, subordinated_note_fee.deferred]
  waterfall:
    kind: waterfall
    entity: company
    phase: pay
    cash: cash
    tiers:
      - {name: tax, account: tax_payable}
      - {claim: revolver.fee}
      - {claim: revolver.interest}
      - {claim: term_loan_a.interest}
      - {claim: senior_note.interest}
      - {claim: subordinated_note.interest}
      - {claim: preferred_a.dividend}
      - {claim: term_loan_a.principal}
      - {claim: senior_note.principal}
      - {claim: subordinated_note.principal}
      - {name: minimum_cash, keep: 100, from: 1, until: 10}
      - {claim: term_loan_a.prepay}      # the sweep: what is left above the minimum
    residual: null                           # no common dividends: the rest is retained
    cfads: {scheme: cash_flow, classes: [operating], less: [tax]}
    service: [term_loan_a.interest, senior_note.interest, subordinated_note.interest, term_loan_a.principal,
              senior_note.principal, subordinated_note.principal]
    tests: []
cuts:
  operating: {entity: company, account: cash, scheme: cash_flow, include: [operating, tax]}
  investing: {entity: company, account: cash, scheme: cash_flow, include: [investing]}
  financing: {entity: company, account: cash, scheme: cash_flow, include: [financing]}
lenses:
  exit:
    kind: exit_returns
    entity: company
    cash: cash
    period: 4
    multiple: 5
    fractions: [0, 0.75, 1, 1, 1, 1, 1, 1, 1, 1, 1]
    ebitda: {scheme: income_statement, include: [sales, cogs, sga]}
    net_debt: {scheme: balance_sheet, include: [revolver, term_loan_a, senior_note, subordinated_note, preferred_a, cash]}
    flows: holders
    claims_scheme: claims
    interim_from: 2             # the stub's interim flows are not in the workbook's returns rows
    holders:
      subordinated_note: {classes: [subordinated_note], claim: [subordinated_note], premium: [0, 0.05, 0.03, 0.02, 0.01, 0, 0, 0, 0, 0, 0]}
      preferred_a: {classes: [preferred_a], claim: [preferred_a]}
      sponsor: {classes: [sponsor], claim: []}
      management: {classes: [management], claim: []}
    ownership:
      paid: [sponsor, management]
      at: 0
      layers:                   # kickers, then the management performance pool, which dilutes them too
        - {subordinated_note: 0.02, preferred_a: 0.0025}
        - {management: 0.005}
measures:
  subordinated_note_irr: {measure: xirr, cut: exit.subordinated_note, dates: ['2023-12-31', '2024-09-30', '2025-09-30', '2026-09-30', '2027-09-30', '2028-09-30', '2029-09-30', '2030-09-30', '2031-09-30', '2032-09-30', '2033-09-30']}
  subordinated_note_cash_on_cash: {measure: cash_on_cash, cut: exit.subordinated_note}
  preferred_a_irr: {measure: xirr, cut: exit.preferred_a, dates: ['2023-12-31', '2024-09-30', '2025-09-30', '2026-09-30', '2027-09-30', '2028-09-30', '2029-09-30', '2030-09-30', '2031-09-30', '2032-09-30', '2033-09-30']}
  preferred_a_cash_on_cash: {measure: cash_on_cash, cut: exit.preferred_a}
  sponsor_irr: {measure: xirr, cut: exit.sponsor, dates: ['2023-12-31', '2024-09-30', '2025-09-30', '2026-09-30', '2027-09-30', '2028-09-30', '2029-09-30', '2030-09-30', '2031-09-30', '2032-09-30', '2033-09-30']}
  sponsor_cash_on_cash: {measure: cash_on_cash, cut: exit.sponsor}
  management_irr: {measure: xirr, cut: exit.management, dates: ['2023-12-31', '2024-09-30', '2025-09-30', '2026-09-30', '2027-09-30', '2028-09-30', '2029-09-30', '2030-09-30', '2031-09-30', '2032-09-30', '2033-09-30']}

# ModelOff 2017 "Collect the Cash": a daily cash forecast of eight customers (plan step 7q).
#
# Source: ModelOff 2017 Round 2 Section 1 (competition paper, not in this
# repository); the customers' payment rules and ten answers as transcribed
# in generic_engine/tests/test_benchmark_round3_collect_the_cash.py, copied
# to cases/reference/modeloff_2017_collect_the_cash.json by
# consolidation/experiments/make_reference_modeloff_collect_the_cash.py,
# and to this file by make_case_modeloff_collect_the_cash.py.
#
# Grid: 365 days, 1 January 2018 (period 0) to 31 December 2018. US$ millions.
# Business days are Monday to Friday; the paper states no holidays.
#
# What the case does, and how it is assembled here:
#   * the payment days are derived by the generator with one_engine.dates
#     and written as periods (who pays on which day is the case's data);
#   * A and D are invoiced on the 1st and paid on a profile of days after
#     it (offtake, payment_days a profile);
#   * B and C accrue every day and pay everything owed on their payment
#     days (offtake_on_dates): the third Thursday, each weekday. What
#     they had accrued since their last payment in 2017 is owed on the
#     opening balance sheet: B from 22 to 31 December, C the weekend of
#     30 and 31 December;
#   * E, F, G and H are paid on the day the amount is due (payment_days 0);
#     E's daily amount is the month's Tuesdays x 1.96 over its weekdays.

# Averta DevCo, with the live model's bugs fixed (plan step 8).
#
# Written by make_case_averta_fixed.py: averta_devco.yaml (the live DevCo,
# reproduced) with these changes, in this order; nothing else differs.
#
# devco_funded_by_topco:
#   DevCo findings 1 and 4: TopCo covers the DevCo's shortfalls and receives its surplus, every quarter.
#
#   The live DevCo runs an overdraft to -1,372,768.75 that nothing funds
#   (its 100,000 seed equity is never paid in), retains everything, and
#   TopCo is credited its hold net income and the NPV of the post-exit
#   years, which leaves out the exit quarter (55,723.01). Here TopCo pays in
#   what keeps the DevCo's cash at nil (deficit_funding) and each quarter's
#   cash after tax goes to TopCo, its capital first (capital_first): every
#   quarter, the exit quarter included, reaches TopCo once, when it is cash.
# devco_losses_carried_forward:
#   DevCo finding 3: losses are carried forward without limit (the live taxes each quarter's profit alone).

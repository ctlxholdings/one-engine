# esco deal "dongying_shengdong_waste_gas": Dongying Shengdong EMC's 1.9 MW waste-gas power station at a
# coking plant, China c. 2004, sold to the client below the grid tariff on a shared-savings basis
# (World Bank 2008, "Financing Energy Efficiency", case study 11; cases/reference/esco/ontology/
# miniature/cases/dongying_shengdong_waste_gas-lod0.yaml; answer key cases/reference/esco/tests/
# test_lod0_numbers.py).
#
# Every amount is a number of the case by name, or a formula over them (generator `src`), in CNY m:
#   * the EMC buys and installs the station (investment_cny_m) in period 0 (one_off_purchase),
#     funded by the bank loan (loan_cny_m, drawn in period 0) and, for the rest, its own funds:
#     the equity is what keeps the EMC's cash from falling below nil once the loan is in
#     (deficit_funding), so "the remainder" comes out of the books, not out of a subtraction;
#   * the station's electricity replaces grid power worth annual_revenue_cny_m a year at the grid
#     tariff (price_cny_per_kwh); the replaced kWh are that worth over the tariff (a physical
#     quantity, million kWh); the client books it as avoided energy cost and pays the EMC its share
#     (split_and_term, the 65%) each year from period 1 (shared_savings);
#   * the 10-year term is the second number of the split_and_term text, which the harness does not
#     hand over: it is typed as the horizon's period count (periods 0..10, term 10), structural;
#   * the loan's repayment (a one-year term, repaid "a good percentage" from project cash flow) and
#     its interest are not printed as amounts, so they are not booked; no tax.
# Readings: the EMC's share and the client's net from the P&L; own funds from the equity cash
# flow; the 65% price per kWh is the EMC's revenue per replaced kWh; the paybacks are the
# `payback` measure of the EMC's project cash flow (investment and revenue).
# Set aside: the guaranteed and unguaranteed parts of the loan, which rest on its 90% guarantee, the
# third number of the loan_cny_m text, carried by no input.
esco: dongying_shengdong_waste_gas
entity: emc
plant: annual_revenue_cny_m
case:
  case: esco-dongying-shengdong-waste-gas
  periods: 11
  phases: [accrue, settle]
  currency: CNY
  floors: {emc.cash: 0}
  generators:
    src:
      kind: formulas
      periods: 11
      inputs: esco
      values:
        kwh_m: annual_revenue_cny_m / price_cny_per_kwh
        split: split_and_term / 100
        loan: loan_cny_m * (t == 0)
  contracts:
    station:
      type: one_off_purchase
      parties: {buyer: emc}
      terms: {amount: {generator: src, output: investment_cny_m}, period: 0}
    owners:
      type: sponsor_equity
      parties: {issuer: emc}
      terms: {}
    savings:
      type: shared_savings
      parties: {provider: emc, client: coking_plant}
      terms: {kwh: {generator: src, output: kwh_m}, tariff: {generator: src, output: price_cny_per_kwh},
              performance: 1, split: {generator: src, output: split}, start: 1, terms: 10}
  rulebooks:
    bank_loan:
      kind: transfer
      entity: emc
      phase: accrue
      declare: {bank_loan: liability}
      moves:
        draw: {debit: cash, credit: bank_loan, amount: {generator: src, output: loan}}
    own_funds:
      kind: deficit_funding
      entity: emc
      cash: cash
      phase: accrue
      until: 0
      residual: owners.contribute
  schemes:
    pnl:
      avoided_energy_cost: savings
      shared_savings_fee: fee
      shared_savings_revenue: revenue
    cash_flow:
      owners.capital: equity
      owners.distributions: equity
      bank_loan: debt
      equipment: investing
      shared_savings_revenue: operating
      avoided_energy_cost: operating
      shared_savings_fee: operating
  cuts:
    emc_revenue: {kind: pnl, entity: emc, scheme: pnl, include: [revenue]}
    client_net: {kind: pnl, entity: coking_plant, scheme: pnl, include: [savings, fee]}
    own_funds: {entity: emc, account: cash, scheme: cash_flow, include: [equity]}
    emc_project: {entity: emc, account: cash, scheme: cash_flow, include: [operating, investing]}
  measures:
    payback: {measure: payback, cut: emc_project}
figures:
  dy.revenue_split: {cut: emc_revenue, at: 1}
  dy.own_funds: {cut: own_funds, at: 0}
  dy.own_funds_pct: {cut: own_funds, at: 0, per: src.investment_cny_m, scale: 0.01}
  dy.client_share: {cut: client_net, at: 1}
  dy.price_at_65pct: {cut: emc_revenue, at: 1, per: src.kwh_m}
  dy.revenue_vs_loan_pct: {cut: emc_revenue, at: 1, per: src.loan_cny_m, scale: 0.01}
  dy.payback: {measure: payback}
  dy.payback_about_two: {measure: payback}
not_compared:
  dy.guaranteed: "rests on the loan's 90% guarantee, the third number of the loan_cny_m text; no input carries it"
  dy.unguaranteed: "rests on the loan's 90% guarantee, the third number of the loan_cny_m text; no input carries it"

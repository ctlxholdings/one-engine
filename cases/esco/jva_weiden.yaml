# esco deal "jva_weiden": a guaranteed-savings energy-saving contract (Energiespar-Contracting)
# between the JVA Weiden (a Bavarian prison) and WISAG Energiemanagement, signed 21.01.2010, main
# phase 05/2011 to 04/2021 (dena project page; cases/reference/esco/ontology/miniature/cases/
# jva_weiden-lod0.yaml; answer key cases/reference/esco/tests/test_lod0_numbers.py).
#
# Every amount is a number of the deal by name (generator `src`):
#   * WISAG (the partner) pays the investment (investment_eur) in period 0, the works period,
#     funded by its own equity (the financing route is not printed; the Baukostenzuschuss is a
#     flag without an amount, so nothing is booked for it);
#   * the performance phase runs from _from__year/_from__month to to__year/to__month; its length
#     in months and years is a driver over those printed months (a time quantity, rule 4), as is
#     the gap from signature (contract_signed__year/__month/day) to the phase's first month, the
#     day of signature counted as a fraction of a month of 52 x 7 / 12 days. Periods are years:
#     0 is the works year, 1..10 the phase;
#   * the prison's guaranteed saving on its energy bill (guaranteed_savings_eur_per_year) each
#     phase year is booked as its avoided energy cost; the budget relief (budget_relief_eur_per_year,
#     'Haushaltsentlastung', undefined on the page) is read as the prison's retained share of it,
#     so the contracting rate paid to WISAG is the guarantee less the relief (the case file's own
#     reading, numbers.derived budget_relief_vs_guarantee; the rate formula is not printed);
#   * the guarantee as a share of the base energy costs is the guaranteed saving read from the
#     books per base_energy_costs_eur_per_year; the simple payback is the equipment WISAG holds per
#     the annual guarantee; the guarantee over the phase per the investment likewise.
# The printed 42.6% is the guarantee over a base printed to the thousand (97,000 / 228,000 =
# 42.54%), inside the answer key's band. No tax, no financing, no indexation (none printed).
esco: jva_weiden
entity: wisag
plant: guaranteed_savings_eur_per_year
case:
  case: esco-jva-weiden
  periods: 11
  phases: [accrue, settle]
  currency: EUR
  floors: {}
  generators:
    src:
      kind: formulas
      periods: 11
      inputs: esco
      values:
        phase_months: (to__year - _from__year) * 12 + to__month - _from__month + 1
        phase_years: phase_months / 12
        signing_to_phase: >-
          (_from__year - contract_signed__year) * 12 + _from__month - contract_signed__month
          - (day - 1) * 12 / (52 * 7)
        works: {each_period: (t == 0)}
        in_phase: {each_period: (t >= 1) * (t <= phase_years)}
        invested: works * investment_eur
        guaranteed: in_phase * guaranteed_savings_eur_per_year
        rate: in_phase * (guaranteed_savings_eur_per_year - budget_relief_eur_per_year)
  opening:
    wisag:
      cash: {nature: asset, value: 0}
    jva:
      cash: {nature: asset, value: 0}
      equity: {nature: equity, value: 0}
  contracts: {}
  rulebooks:
    partner:
      kind: transfer
      entity: wisag
      phase: accrue
      declare:
        share_capital: equity
        equipment: asset
        contracting_revenue: income
      moves:
        fund: {debit: cash, credit: share_capital, amount: {generator: src, output: invested}}
        build: {debit: equipment, credit: cash, amount: {generator: src, output: invested}}
        rate: {debit: cash, credit: contracting_revenue, amount: {generator: src, output: rate}}
    client:
      kind: transfer
      entity: jva
      phase: settle
      declare:
        guaranteed_saving: income
        contracting_rate: expense
      moves:
        guaranteed: {debit: cash, credit: guaranteed_saving, amount: {generator: src, output: guaranteed}}
        rate: {debit: contracting_rate, credit: cash, amount: {generator: src, output: rate}}
  schemes:
    pnl:
      guaranteed_saving: guaranteed
      contracting_rate: rate
      contracting_revenue: revenue
  cuts:
    guaranteed: {kind: pnl, entity: jva, scheme: pnl, include: [guaranteed]}
    relief: {kind: pnl, entity: jva, scheme: pnl, include: [guaranteed, rate]}
    partner_revenue: {kind: pnl, entity: wisag, scheme: pnl, include: [revenue]}
  measures: {}
figures:
  weiden.pct_band: {cut: guaranteed, at: 1, per: src.base_energy_costs_eur_per_year, scale: 0.01}
  weiden.phase_months: {driver: src.phase_months, at: 0}
  weiden.guarantee_over_phase: {cut: guaranteed, total: true}
  weiden.simple_payback: {balance: equipment, at: 0, per: src.guaranteed_savings_eur_per_year}
  weiden.signing_to_phase: {driver: src.signing_to_phase, at: 0}
  weiden.guarantee_over_investment: {cut: guaranteed, total: true, per: src.investment_eur}
  weiden.relief_over_guarantee_pct: {cut: relief, at: 1, per: src.guaranteed_savings_eur_per_year, scale: 0.01}
  weiden.guarantee_less_relief: {cut: partner_revenue, at: 1}

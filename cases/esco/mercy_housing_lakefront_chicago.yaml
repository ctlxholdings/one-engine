# esco deal "mercy_housing_lakefront_chicago": the energy retrofit of Mercy Housing Lakefront's
# 314-unit affordable housing in Chicago, contracted November 2008, financed under the Chicago
# multifamily pilot fund (five capital providers and a first-loss reserve) (ECEEE paper as cited by
# the case file; cases/reference/esco/ontology/miniature/cases/mercy_housing_lakefront_chicago-
# lod0.yaml; answer key cases/reference/esco/tests/test_lod0_numbers.py). Amounts in US$ thousand.
#
# Periods are years: 0 is the retrofit year, 1 a year of savings. Every amount is a number of the
# case by name (generator `src`):
#   * Mercy Housing pays the project cost (project_cost_usd_thousand) in period 0, capitalised as
#     the retrofit. Its loan from the pilot fund is not published (amount, rate, tenor), so the
#     funding is not booked and Mercy's cash goes below nil by the cost (cash is not floored);
#   * the annual savings (annual_savings_usd_thousand) are Mercy's avoided energy cost, in cash, in
#     each year after the retrofit;
#   * the pilot fund's capital: five providers each pay in pilot_fund (US$ million, x 1000 to the
#     case's thousands). The five are five moves of the fund's book (the deal's structure, not a
#     number), so the fund's size is read from its books;
#   * the fund's first-loss reserve (pilot_fund__2, the pilot-fund text's second number, US$ 2.5
#     million, x 1000) is held by the fund as a reserve asset against its obligation to the reserve's
#     guarantors (City of Chicago, MacArthur; who puts the cash up is not published, so it is a
#     reserve and its funding liability in the fund's book, not a cash move).
# Readings: the payback is the retrofit held per the annual savings; cost and savings per unit are
# the retrofit and the year's savings per unit (units), in dollars (scale 0.001 of a thousand);
# the fund size is the capital the providers paid into the fund, in US$ million (scale 1000); the
# reserve ratio is the reserve held per the fund's size (fund_size: the five providers' commitment,
# five being the deal's count of providers, as in the five moves).
#
# Set aside: the completion month (contract November 2008, completion May 2009). The harness now
# hands both years (contracted_completed, __2) but the months are names, so no input carries them.
esco: mercy_housing_lakefront_chicago
entity: mercy
plant: annual_savings_usd_thousand
case:
  case: esco-mercy-housing-lakefront-chicago
  periods: 2
  phases: [accrue, settle]
  currency: USD
  floors: {}
  generators:
    src:
      kind: formulas
      periods: 2
      inputs: esco
      values:
        retrofit: {each_period: (t == 0) * project_cost_usd_thousand}
        savings: {each_period: (t >= 1) * annual_savings_usd_thousand}
        provider_commitment: {each_period: (t == 0) * pilot_fund * 1000}
        fund_size: 5 * pilot_fund * 1000
        first_loss: {each_period: (t == 0) * pilot_fund__2 * 1000}
  contracts: {}
  rulebooks:
    retrofit:
      kind: transfer
      entity: mercy
      phase: accrue
      declare: {cash: asset, retrofit: asset, avoided_energy_cost: income}
      moves:
        works: {debit: retrofit, credit: cash, amount: {generator: src, output: retrofit}}
        savings: {debit: cash, credit: avoided_energy_cost, amount: {generator: src, output: savings}}
    pilot_fund:
      kind: transfer
      entity: fund
      phase: accrue
      declare: {cash: asset, provider_capital: equity, first_loss_reserve: asset, reserve_funding: liability}
      moves:
        reserve: {debit: first_loss_reserve, credit: reserve_funding, amount: {generator: src, output: first_loss}}
        provider_a: {debit: cash, credit: provider_capital, amount: {generator: src, output: provider_commitment}}
        provider_b: {debit: cash, credit: provider_capital, amount: {generator: src, output: provider_commitment}}
        provider_c: {debit: cash, credit: provider_capital, amount: {generator: src, output: provider_commitment}}
        provider_d: {debit: cash, credit: provider_capital, amount: {generator: src, output: provider_commitment}}
        provider_e: {debit: cash, credit: provider_capital, amount: {generator: src, output: provider_commitment}}
  schemes:
    pnl:
      avoided_energy_cost: savings
    cash_flow:
      provider_capital: capital
      reserve_funding: reserve
  cuts:
    fund_reserve: {entity: fund, account: first_loss_reserve, scheme: cash_flow, include: [reserve]}
    savings: {kind: pnl, entity: mercy, scheme: pnl, include: [savings]}
    fund_capital: {entity: fund, account: cash, scheme: cash_flow, include: [capital]}
  measures: {}
figures:
  me.pilot_fund_size: {cut: fund_capital, at: 0, scale: 1000}
  me.simple_payback: {balance: retrofit, per: src.annual_savings_usd_thousand, at: 0}
  me.cost_per_unit: {balance: retrofit, per: src.units, at: 0, scale: 0.001}
  me.savings_per_unit: {cut: savings, per: src.units, at: 1, scale: 0.001}
  me.reserve_ratio_pct: {cut: fund_reserve, per: src.fund_size, at: 0, scale: 0.01}
not_compared:
  me.contract_to_completion_months: "needs the contract and completion months (November 2008, May 2009): the harness now hands the text's two years (contracted_completed, __2), but the months are printed as names, so no input carries them"

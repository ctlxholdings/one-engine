# esco deal "hawaii_gems_on_bill": the Hawaii Green Infrastructure Authority's GEM$ on-bill financing
# programme, capitalised by the Green Energy Market Securitization bond (HGIA quarterly report to the
# legislature, 2022; cases/reference/esco/ontology/miniature/cases/hawaii_gems_on_bill-lod0.yaml;
# answer key cases/reference/esco/tests/test_lod0_numbers.py).
#
# The figures compared are the case file's capital check, the use of the bond's capital since
# inception, booked as one period at the report date (30 Sep 2022). Every amount is a number of the
# deal by name (generator `src`), printed in USD or USD million:
#   * the bond's net proceeds (bond_net_proceeds_usd, USD million) are paid into the Authority's loan
#     fund: cash in, held as the fund's capital (a liability: the ratepayers' Green Infrastructure Fee,
#     not the Authority, services the bond); the face amount and its issue costs sit outside the fund;
#   * the Authority lends the GEMS loans funded since inception (gems_loans_funded_since_inception_usd)
#     out of that cash: loans receivable;
#   * the capital the report says is left to lend (gems_loan_capital_left_usd, USD million) is set
#     apart as loan capital to lend;
#   * what is left in cash is the capital the report does not account for (transfers to the PUC, direct
#     and non-GEM$ uses: the case file's capital check, "not reconciled").
# Revenues and costs since inception are not booked: the report does not split revenue into interest
# and principal repaid, and the capital check leaves both out. No tax.
#
# The counts of on-bill obligations and projects are physical statistics no ledger holds: they are
# drivers over the printed list's numbers (residential_obo_counts: PV loans 226, owner-occupied __2
# 225, renter __3 1, PV leases __4 34, solar water heating __5 17, the printed total __6 277, the
# quarter's __7 25 + __8 1 + __9 0; projects_financed_all_products: the seven products' counts, the
# first to __7). The totals are the parts added; the PV and solar-water-heating shares are counts per
# the printed total of 277 (scale 0.01).
#
# Set aside: the counts of customers by income band, printed only in the derived block (not inputs).
esco: hawaii_gems_on_bill
entity: hgia
plant: gems_loans_funded_since_inception_usd
case:
  case: esco-hawaii-gems-on-bill
  periods: 1
  phases: [accrue, settle]
  currency: USD
  floors: {}
  generators:
    src:
      kind: formulas
      periods: 1
      inputs: esco
      values:
        proceeds: bond_net_proceeds_usd * 1000 * 1000
        capital_left: gems_loan_capital_left_usd * 1000 * 1000
        obo_total: residential_obo_counts + residential_obo_counts__4 + residential_obo_counts__5
        obo_quarter: residential_obo_counts__7 + residential_obo_counts__8 + residential_obo_counts__9
        obo_pv_loans: residential_obo_counts__2 + residential_obo_counts__3
        pv_share: (residential_obo_counts + residential_obo_counts__4) / residential_obo_counts__6
        swh_share: residential_obo_counts__5 / residential_obo_counts__6
        projects_total: projects_financed_all_products + projects_financed_all_products__2 + projects_financed_all_products__3 + projects_financed_all_products__4 + projects_financed_all_products__5 + projects_financed_all_products__6 + projects_financed_all_products__7
  contracts: {}
  rulebooks:
    loan_fund:
      kind: transfer
      entity: hgia
      phase: accrue
      declare: {cash: asset, bond_fund_capital: liability, gems_loans: asset, loan_capital_to_lend: asset}
      moves:
        bond_proceeds: {debit: cash, credit: bond_fund_capital, amount: {generator: src, output: proceeds}}
        loans_funded: {debit: gems_loans, credit: cash, amount: {generator: src, output: gems_loans_funded_since_inception_usd}}
        capital_left: {debit: loan_capital_to_lend, credit: cash, amount: {generator: src, output: capital_left}}
  schemes:
    cash_flow:
      bond_fund_capital: financing
      gems_loans: investing
      loan_capital_to_lend: investing
  cuts: {}
  measures: {}
figures:
  hi.capital_accounted_usd_m: {balance: gems_loans + loan_capital_to_lend, scale: 1000000}
  hi.capital_unaccounted_usd_m: {balance: cash, scale: 1000000}
  hi.obo_total: {driver: src.obo_total}
  hi.obo_quarter: {driver: src.obo_quarter}
  hi.obo_owner_renter_split: {driver: src.obo_pv_loans}
  hi.pv_share_pct: {driver: src.pv_share, scale: 0.01}
  hi.swh_share_pct: {driver: src.swh_share, scale: 0.01}
  hi.projects_total: {driver: src.projects_total}
not_compared:
  hi.income_tables_agree: "counts of customers by income band, printed only in the derived block (not inputs)"
  hi.income_quarter_matches_obo: "counts of the quarter's customers by income band, printed only in the derived block (not inputs)"

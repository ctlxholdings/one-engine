# esco deal "hude_pool": Gemeinde Hude and Johnson Controls Systems & Service GmbH, a German guaranteed-
# savings energy-saving contract (Einspar-Contracting) over nine properties, signed 30 Apr 2010 (dena
# project data sheet; cases/reference/esco/ontology/miniature/cases/hude_pool-lod0.yaml; answer key
# cases/reference/esco/tests/test_lod0_numbers.py).
#
# Every amount is a number of the case by name, or a formula over them (generator `src`), in EUR:
#   * the contractor invests investment_eur in period 0 (the signing year, 2010), out of its own
#     capital;
#   * the main performance phase runs from its first to its last printed month; its length in
#     months is a driver over those date inputs (a time quantity, both end months counted), and its
#     years (months / 12) are periods 1.. of the case;
#   * in each year of the phase the municipality books the guaranteed saving
#     (guaranteed_savings_eur_per_year) as avoided energy cost, keeps the printed budget relief
#     (budget_relief_eur_per_year) and pays the rest to the contractor: the record's own reading
#     ("if the budget relief is what the client keeps"), the remuneration itself is not published;
#   * no tax; the construction subsidy has no amount and is not booked.
# Readings: the savings share is the avoided energy cost per the base energy cost; the guarantee over
# the phase is the avoided energy cost summed; the simple payback is the contractor's investment per
# the annual guarantee (scale only, as the record says); the months from signing to the phase are a
# driver over the date inputs (whole months from the signing day to the first day of the phase).
esco: hude_pool
entity: municipality
plant: guaranteed_savings_eur_per_year
case:
  case: esco-hude-pool
  periods: 13
  phases: [accrue]
  currency: EUR
  floors: {}
  generators:
    src:
      kind: formulas
      periods: 13
      inputs: esco
      values:
        phase_months: (to__year - _from__year) * 12 + to__month - _from__month + 1
        signing_to_phase: (_from__year - contract_signed__year) * 12 + _from__month - contract_signed__month - (day > 1)
        live: (t >= 1) * (t <= phase_months / 12)
        savings: live * guaranteed_savings_eur_per_year
        relief: live * budget_relief_eur_per_year
        fee: savings - relief
        works: investment_eur * (t == 0)
  contracts: {}
  rulebooks:
    municipality:
      kind: transfer
      entity: municipality
      phase: accrue
      declare: {cash: asset, avoided_energy_cost: income, contracting_fee: expense}
      moves:
        savings: {debit: cash, credit: avoided_energy_cost, amount: {generator: src, output: savings}}
        fee: {debit: contracting_fee, credit: cash, amount: {generator: src, output: fee}}
    contractor:
      kind: transfer
      entity: contractor
      phase: accrue
      declare: {cash: asset, share_capital: equity, equipment: asset, contracting_revenue: income}
      moves:
        capital: {debit: cash, credit: share_capital, amount: {generator: src, output: works}}
        works: {debit: equipment, credit: cash, amount: {generator: src, output: works}}
        fee: {debit: cash, credit: contracting_revenue, amount: {generator: src, output: fee}}
  schemes:
    pnl:
      avoided_energy_cost: savings
      contracting_fee: fee
      contracting_revenue: revenue
    cash_flow:
      avoided_energy_cost: operating
      contracting_fee: operating
      contracting_revenue: operating
      share_capital: financing
      equipment: investing
  cuts:
    savings: {kind: pnl, entity: municipality, scheme: pnl, include: [savings]}
    contractor_revenue: {kind: pnl, entity: contractor, scheme: pnl, include: [revenue]}
    investing: {entity: contractor, account: cash, scheme: cash_flow, include: [investing]}
  measures: {}
figures:
  hude.pct_band: {cut: savings, at: 1, per: src.base_energy_cost_eur_per_year, scale: 0.01}
  hude.phase_months: {driver: src.phase_months, at: 0}
  hude.guarantee_over_phase: {cut: savings, total: true}
  hude.simple_payback: {cut: investing, at: 0, sign: -1, per: src.guaranteed_savings_eur_per_year}
  hude.signing_to_phase: {driver: src.signing_to_phase, at: 0}
  hude.guarantee_less_relief: {cut: contractor_revenue, at: 1}

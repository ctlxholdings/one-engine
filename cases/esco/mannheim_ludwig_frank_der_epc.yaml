# esco deal "mannheim_ludwig_frank_der_epc": Studierendenwerk Mannheim's deep-energy-retrofit EPC for the
# Ludwig Frank quartier, at award stage (IEA EBC Annex 61 business guide, 2017, Appendix A.4;
# cases/reference/esco/ontology/miniature/cases/mannheim_ludwig_frank_der_epc-lod0.yaml; answer key
# cases/reference/esco/tests/test_lod0_numbers.py).
#
# Every amount is a number of the deal by name (generator `src`), printed in kEUR and booked in EUR:
#   * the awarded ESCO, responsible for the total investment, buys the measures (the deep retrofit of
#     one building, the CHP supply solution and seven other measures; total_investment_keur) in
#     period 0, funded by its own equity (no financing is described; the text stops at the award);
#   * the energy cost savings (total_energy_cost_savings_keur_per_yr) accrue to the owner as avoided
#     energy cost from period 1; the savings partition the ESCO won in its bid is not published, so its
#     remuneration is not booked, nor the 44 kEUR/yr avoided-maintenance annuity (the source does not
#     say whether it sits inside the 185.8);
#   * the static payback is the case file's investment / annual savings: the measures read from the
#     books per the annual saving; the savings' share is the owner's saving per its global cost
#     baseline (global_cost_baseline_eur_per_yr, printed "446k": energy, water and sewage);
#   * the floor areas (thousand m2, physical) are money read from the books per the EUR per m2 rate
#     the source prints after it: the measures per the 93.1 EUR/m2 (total_investment_keur__2), the
#     owner's annual saving per the 7.2 EUR/m2 yr (total_energy_cost_savings_keur_per_yr__2);
#   * the award weights (Table A-4's DER EPC column: 50, 40 and 10, award_weights_der_epc_pct and its
#     __2, __3) are a tender scoring rule, not money: their sum is a `driver` (a rate no ledger holds).
# Periods are years; 0 is the investment, 1 one year of savings (the contract period is not published).
#
# Set aside: Table A-5's rows (seven of the nine investments, eight of the nine savings), Table A-3's
# eight heating costs and building 42's kWh, kW and tariff columns, and the CHP's 28 EUR/m2 are printed
# only in the case file's derived block, not as inputs: the CHP's own savings (113,
# chp_supply_solution_investment_keur__2) and the heating table's lowest and highest cost
# (heating_baseline_cost_eur_per_yr__3, __4) are now inputs, but not the other rows the sums need.
esco: mannheim_ludwig_frank_der_epc
entity: esco
plant: total_energy_cost_savings_keur_per_yr
case:
  case: esco-mannheim-ludwig-frank-der-epc
  periods: 2
  phases: [accrue, settle]
  currency: EUR
  floors: {}
  generators:
    src:
      kind: formulas
      periods: 2
      inputs: esco
      values:
        investment: total_investment_keur * 1000
        annual_savings: total_energy_cost_savings_keur_per_yr * 1000
        baseline: global_cost_baseline_eur_per_yr * 1000
        savings: {each_period: annual_savings * (t >= 1)}
        award_weights: award_weights_der_epc_pct + award_weights_der_epc_pct__2 + award_weights_der_epc_pct__3
  contracts:
    funding:
      type: equity_funding
      parties: {issuer: esco}
      terms: {amount: {generator: src, output: investment}, period: 0}
    measures:
      type: one_off_purchase
      parties: {buyer: esco}
      terms: {amount: {generator: src, output: investment}, period: 0}
  rulebooks:
    owner_books:
      kind: transfer
      entity: owner
      phase: accrue
      declare: {cash: asset, avoided_energy_cost: income}
      moves:
        energy_cost_saving: {debit: cash, credit: avoided_energy_cost, amount: {generator: src, output: savings}}
  schemes:
    pnl:
      avoided_energy_cost: savings
    cash_flow:
      share_capital: financing
      equipment: investing
      avoided_energy_cost: operating
  cuts:
    owner_savings: {kind: pnl, entity: owner, scheme: pnl, include: [savings]}
  measures: {}
figures:
  mh.static_payback: {balance: equipment, at: 0, per: src.annual_savings}
  mh.savings_share_of_baseline: {cut: owner_savings, at: 1, per: src.baseline, scale: 0.01}
  mh.floor_area_from_investment: {balance: equipment, at: 0, per: src.total_investment_keur__2, scale: 1000}
  mh.floor_area_from_savings: {cut: owner_savings, at: 1, per: src.total_energy_cost_savings_keur_per_yr__2, scale: 1000}
  mh.award_weights_sum: {driver: src.award_weights, at: 0}
not_compared:
  mh.investment_sum: "the sum of Table A-5's nine investment rows: seven of them (118, 118, 115, 105, 119, 120,
    115) are printed only in the case file's derived block, not as inputs (the deep retrofit's 982 and the CHP's
    749 are), and the total is the input total_investment_keur"
  mh.investment_sum_matches_input: "the same nine rows less the input total: seven of the rows are not inputs"
  mh.savings_sum: "the sum of Table A-5's nine savings rows: only the CHP's 113 is an input
    (chp_supply_solution_investment_keur__2); the other eight are printed only in the derived block, and the
    total is the input total_energy_cost_savings_keur_per_yr"
  mh.heating_cost_sum: "the eight heating costs of Table A-3: the inputs carry only the range the text prints, its
    lowest and highest (heating_baseline_cost_eur_per_yr__3, __4); the six others are printed only in the
    derived block"
  mh.table_a3_building_42: "building 42's kWh, EUR/kWh, kW, EUR/kW and fixed charge are printed only in the derived
    block, not as inputs"
  mh.dynamic_payback_label: "the dynamic payback needs a discount rate and savings path the inputs do not carry; the
    figure is the input dynamic_payback_years rounded"
  mh.floor_area_from_chp: "a physical floor area from the CHP's 28 EUR/m2, printed only in the derived block (the
    CHP's text carries 749 and its 113 savings, no rate per m2)"

  gp:
    type: sponsor_equity
    parties: {issuer: spv}
    terms: {}
schemes:
  cash_flow:
    solar.receivable: operating
    battery.receivable: operating
    grid_services.receivable: operating
    om_fixed.payable: operating
    insurance.payable: operating
    land_lease.payable: operating
    grid_charges.payable: operating
    am_fee.payable: operating
    regulatory_levy.payable: operating
    om_variable.payable: operating
    decommissioning: operating
    cwip: investing
    tax_payable: tax
    wht_payable: withholding
    dsra: reserve
    mmr: reserve
    decom_reserve: reserve
    senior_a.debt: senior
    senior_a.interest_payable: senior
    senior_a.fee_payable: senior
    senior_b.debt: senior
    senior_b.interest_payable: senior
    senior_b.fee_payable: senior
    senior_b.capitalised_interest: senior
    senior_b.deferred_fees: senior
    mezzanine.debt: mezzanine
    mezzanine.interest_payable: mezzanine
    mezzanine.fee_payable: mezzanine
    mezzanine.capitalised_interest: mezzanine
    mezzanine.deferred_fees: mezzanine
    shl.debt: shareholder
    shl.interest_payable: shareholder
    shl.capitalised_interest: shareholder
    lp.capital: lp
    lp.distributions: lp
    gp.capital: gp
    gp.distributions: gp
rulebooks:
  construction:
    kind: funding_plan
    entity: spv
    cash: cash
    phase: fund
    from: 0
    until: 7
    uses:
      - {flow: epc.spend}
      - {flow: development.spend}
      - {flow: fees.spend}
      - {claim: senior_a.fee}
      - {claim: senior_b.fee}
      - {claim: senior_b.interest}
      - {claim: senior_b.arrangement_fee}
      - {claim: mezzanine.arrangement_fee}
    sources:
      - {claim: senior_a.draw, share: 0.4, of: [epc.spend]}
      - {claim: senior_b.draw, share: 1, of: [epc.spend]}       # capped by its draw schedule
      - {claim: mezzanine.draw, share: 1, of: [epc.spend]}      # capped by its draw schedule
      - {claim: shl.draw, share: "2/15", of: [epc.spend]}       # 7.5M a quarter
    residual:
      - {leg: lp.contribute, share: "11/14"}                    # funding_share 0.7857142857142857
      - {leg: gp.contribute, share: "3/14"}                     # funding_share 0.21428571428571427
  reserve_funding:
    kind: funding_plan
    entity: spv
    cash: cash
    phase: fund
    from: 8
    until: 8
    uses: [{claim: dsra.top_up}]
    sources: []
    residual: gp.contribute
  assets:
    kind: asset_register
    entity: spv
    phase: accrue
    from: cwip
    to: fixed_assets
    expense: depreciation
    disposal: disposal_loss
    in_service: [8, 48]
    life_periods: 80
    first_charge: in_service
    dispose_at: 120
    tax: {life_periods: 40, first_charge: in_service}
  decommissioning:
    kind: provision
    entity: spv
    cash: decom_reserve
    phase: accrue
    pay_phase: operate
    expense: decommissioning_expense
    liability: decommissioning
    amount: 25000000
    start: 8
    periods: 80
    settle_at: 120
  tax:
    kind: income_tax
    entity: spv
    phase: tax
    expense: tax_expense
    payable: tax_payable
    rate: 0.25
    carry_forward_periods: null
    timing: assets
    deferred: {account: deferred_tax, expense: deferred_tax_expense}
    scheme:
      solar.revenue: taxable
      battery.revenue: taxable
      grid_services.revenue: taxable
      om_fixed.expense: taxable
      insurance.expense: taxable
      land_lease.expense: taxable
      grid_charges.expense: taxable
      am_fee.expense: taxable
      regulatory_levy.expense: taxable
      om_variable.expense: taxable
      decommissioning_expense: taxable
      depreciation: timing
      disposal_loss: timing
      senior_a.interest: taxable
      senior_a.fees: taxable
      senior_b.interest: taxable
      senior_b.fees: taxable
      senior_b.fx_loss: taxable
      mezzanine.interest: taxable
      mezzanine.fees: taxable
      shl.interest: taxable
      shl.fees: taxable
      shl_forgiven: exempt
      tax_expense: non_deductible
      deferred_tax_expense: non_deductible
  promote:
    kind: promote
    lp: lp
    gp: gp
    accrue_phase: accrue
    pref_rate: 0.08
    periods_per_year: 4
    pref_compounds: false
    carry_rate: 0.2
    catchup_pct: 1.0
  waterfall:
    kind: waterfall
    entity: spv
    phase: pay
    cash: cash
    sources: [dsra.release]
    tiers:
      - {name: tax, account: tax_payable}
      - {claim: senior_a.interest}
      - {claim: senior_a.fee}
      - {claim: senior_b.interest}
      - {claim: senior_b.fee}
      - {claim: senior_a.principal}
      - {claim: senior_b.capitalised}
      - {claim: senior_b.principal}
      - {claim: dsra.top_up}
      - {claim: mmr.contribute}
      - {claim: decom_reserve.contribute}
      - {claim: mezzanine.interest}
      - {claim: mezzanine.fee}
      - {claim: mezzanine.capitalised}
      - {claim: mezzanine.principal}
      - {claim: mezzanine.prepay, share_of_remaining: 0.25}     # sweep_pct
      - {claim: shl.interest}
      - {claim: shl.fee}
      - {claim: shl.capitalised}
      - {claim: shl.principal}
      - {name: minimum_cash, keep: 2000000, from: 8, until: 119}     # min_cash_balance
    residual: promote
    cfads: {scheme: cash_flow, classes: [operating], less: [tax]}
    service: [senior_a.interest, senior_a.principal, senior_b.interest, senior_b.capitalised, senior_b.principal]
    tests:
      - {name: dscr_default, op: ">=", level: 1.05, if_missing: pass, consequence: report}
      - {name: dscr_lockup, op: ">=", level: 1.35, if_missing: pass, consequence: block,
         blocks: [mezzanine.prepay, shl.interest, shl.fee, shl.capitalised, shl.principal, promote]}
      - {name: dscr_distribution, op: ">=", level: 1.35, if_missing: pass, consequence: block,
         blocks: [promote]}
  shl_forgiveness:
    kind: forgiveness
    entity: spv
    phase: close
    at: 120
    accounts: [shl.capitalised_interest, shl.debt]
    gain: shl_forgiven
  withholding:
    kind: withholding
    entity: spv
    cash: cash
    payable: wht_payable
    phases: [fund, pay]
    rates:
      senior_a.interest: 0.1
      senior_b.interest: 0.1
      senior_b.capitalised: 0.1
      mezzanine.interest: 0.1
      mezzanine.capitalised: 0.1
      shl.interest: 0.1
      shl.capitalised: 0.1
      lp.distribute: 0.15
      gp.distribute: 0.15
cuts:
  lp_flows: {entity: spv, account: cash, scheme: cash_flow, include: [lp]}
  gp_flows: {entity: spv, account: cash, scheme: cash_flow, include: [gp]}
  equity_flows: {entity: spv, account: cash, scheme: cash_flow, include: [lp, gp]}
  sponsor_flows: {entity: spv, account: cash, scheme: cash_flow, include: [lp, gp, shareholder]}
  project_flows: {entity: spv, account: cash, scheme: cash_flow, include: [operating, investing, tax]}
measures:

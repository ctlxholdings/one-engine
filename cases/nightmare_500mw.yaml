# 500MW hybrid nightmare (plan step 7, third reproduction).
#
# Source: generic-framework generic_engine/tests/fixtures/500mw_nightmare.yaml
# (121 quarters, COD Q8, EUR; 450M EPC; three revenue lines; seven escalated
# cost lines; four lenders: a scheduled euro senior, a sculpted dollar
# senior with a grace PIK, a mezzanine with a grace PIK and a 25% sweep, a
# shareholder loan; DSRA, MMR, decommissioning; tax with a 10-year tax life
# against a 20-year book life; withholding on interest and dividends; an
# LP and a GP sharing distributions through a promote). Every number is
# copied from the fixture; tests/test_case_nightmare.py re-reads it and
# checks the copy.
#
# Declared choices (the fixture leaves them open, or the old engine reads
# them in a way the case does not follow; LOG.md step 7):
#   * day count 91.25/360 for every loan (the old engine's);
#   * construction funding: senior_a 40% of the EPC spend, senior_b and the
#     mezzanine their draw schedules, the SHL 2/15 (7.5M a quarter); every
#     other cost, construction interest and fees included, is a use; the
#     equity residual is called 11/14 from the LP and 3/14 from the GP (the
#     fixture's funding shares). At COD the GP alone funds the DSRA's
#     initial requirement (the fixture's reserve_funding_schedule names the
#     GP; the amount is the requirement, not the fixture's fixed 11.95M);
#   * construction interest and fees are expensed (as the old engine does);
#   * arrangement fees: paid at financial close, amortised straight-line
#     from the next quarter to maturity;
#   * senior_b: sculpted per quarter to CFADS / 5.0 (the fixture's target,
#     the old engine's formula), anything left due at maturity (Q55);
#   * the DSRA covers both seniors; senior_b's expected service is its
#     current quarter's (it has no schedule);
#   * the MMR builds 15M to Q48, when a 15M major maintenance is spent and
#     capitalised (the old engine releases the reserve and spends nothing);
#   * decommissioning (25M) accrues over the 80-quarter book life from COD
#     and is paid at Q120 from a reserve built over the last five years
#     (Q100-Q119; the fixture names no reserve, and without one the Q120
#     payment exceeds the cash on hand); deductible when accrued;
#   * lock-up at DSCR 1.35 blocks the mezzanine sweep, the SHL and
#     distributions; the default level 1.05 reports; llcr_lockup and
#     plcr_threshold are not carried (see the 100MW case);
#   * WHT: 10% on every interest payment (capitalised interest repaid
#     included), 15% on distributions of profit (not on return of capital),
#     remitted in the phase it is withheld;
#   * deferred tax on the asset registers' difference and on losses carried
#     forward, one net account;
#   * unpaid SHL at Q120 is forgiven (a gain, exempt), as in the 50MW case.

        regulatory_levy.payable, om_variable.payable, decommissioning, tax_payable, wht_payable, deferred_tax,
        dsra, mmr, decom_reserve, lp.capital, gp.capital,
        senior_a.debt, senior_a.interest_payable, senior_a.fee_payable,
        senior_b.debt, senior_b.capitalised_interest, senior_b.interest_payable, senior_b.fee_payable,
        senior_b.deferred_fees, senior_b.debt_fc, senior_b.capitalised_interest_fc,
        mezzanine.debt, mezzanine.capitalised_interest, mezzanine.interest_payable, mezzanine.fee_payable,

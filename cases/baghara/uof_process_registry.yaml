  phase: DISTRIBUTION
  logic: supply_driven
  template: production_split
  basis: WET

  seasonal_profile:
    # Session 1B FIX 4: Weighted average of upstream cold chain profiles.
    # Peak Feb (0.16) — driven by perishable veg (57%), dairy (30%), meat (5%), fruit (8%).
    weights: [0.1226, 0.1625, 0.1625, 0.0869, 0.0568, 0.0527, 0.0421, 0.0705, 0.0876, 0.0673, 0.0445, 0.0440]
    confidence: low
    note: "Weighted from upstream: veg_cold(57%), dairy(30%), abattoir(5%), fruit(8%). Peak Feb."

  params:
    cold_loss_pct: hub.storage.cold_loss_pct

  # Session 1B: Replaced F2_veg_handling with F2_veg_cold (perishable only)
  driver: "B3_dairy_plant.pasteurized_milk + B3_dairy_plant.yogurt + A3_abattoir.carcass_cuts + A3_abattoir.offal + F2_veg_cold.sorted_veg_cold + G2_fruit_handling.sorted_fruit"

  inputs:
    - name: cold_products_in
      source_node: HUB_PROCESSING
      source_type: INTERNAL

  outputs:
    - name: dispatched
      type: PRODUCT
      destination_node: TR_cold
      ratio: "1 - cold_loss_pct"

    - name: spoilage
      type: LOSS
      destination_node: X3_Disposal
      ratio: "cold_loss_pct"



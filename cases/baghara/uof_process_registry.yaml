E1_gum_arabic:
  name: Gum Arabic Collection
  chain: E
  process_id: E1
  location: UOF
  phase: BIOLOGICAL
  logic: supply_driven
  template: production_split
  basis: WET

  seasonal_profile:
    # Promoter harvest_months: [11, 12, 1, 2, 3]. Dry season tapping.
    # Peak Jan (maximum tree water stress). Nov 15%, Dec 25%, Jan 30%, Feb 20%, Mar 10%.
    weights: [0.30, 0.20, 0.10, 0, 0, 0, 0, 0, 0, 0, 0.15, 0.25]
    confidence: high
    note: "Gum tapping Nov-Mar (dry season). Peak Dec-Jan. Standard Acacia senegal calendar, Sahel."

  params:
    area_ha: gum.crops.gum_arabic.area_ha
    trees_per_ha: gum.crops.gum_arabic.trees_per_ha
    yield_kg_per_tree_mature: gum.crops.gum_arabic.yield_kg_per_tree_mature
    loss_pct: gum.crops.gum_arabic.loss_pct

  derived:
    yield_t_per_ha: "trees_per_ha * yield_kg_per_tree_mature / 1000"

  driver: "area_ha * yield_t_per_ha"

  inputs:
    - name: harvested_gum
      source_node: X1_Supply
      source_type: EXTERNAL

  outputs:
    - name: net_product
      type: PRODUCT
      destination_node: E2
      ratio: "1 - loss_pct"

    - name: collection_loss
      type: LOSS
      destination_node: X3_Disposal
      ratio: "loss_pct"



# =============================================================================
# FEED RECONCILIATION — Updated to hub scope with byproducts
# =============================================================================
# Updated in Session 1: scaled to hub scope (× uof_count), hub byproducts added.
# D-009: Feed reconciliation is hub-scope.

A1_B1_feed:
  name: Feed Reconciliation (Hub Scope)
  chain: [A, B]
  process_id: [A1, B1]
  location: HUB
  phase: BIOLOGICAL
  logic: demand_driven
  template: reconciliation
  basis: DM

  seasonal_profile:
    # Forage supply: irrigated, 6 cuts/year, year-round but rainy season boosts growth.
    # Jun-Sep (rainy): 10% each = 40%. Other months: 7.5% each = 60%.
    weights: [0.075, 0.075, 0.075, 0.075, 0.075, 0.10, 0.10, 0.10, 0.10, 0.075, 0.075, 0.075]
    confidence: high
    note: "6 cuts/yr bimonthly (D-021). Hub scope: forage × uof_count + hub byproducts."

  params:
    forage_area_ha: feed.forage_zone.crops.alfalfa.area_ha
    forage_yield_dm: feed.forage_zone.crops.alfalfa.yield_t_dm_per_ha_per_year
    oilcake_dm_content: hub.processing.oil_press.oilcake_dm_content
    bran_dm_content: hub.processing.mill.bran_dm_content

  own_production:
    - name: forage_zone
      source_node: X1_Supply
      source_type: EXTERNAL
      formula: "forage_area_ha * forage_yield_dm * uof_count"

    - name: hub_oilcake_feed
      source_node: C2
      source_type: INTERNAL
      formula: "C2_oil_press.oilcake_feed * oilcake_dm_content"
      note: "Session 1B: WET→DM conversion (×0.90). Already at hub scope."

    - name: hub_bran
      source_node: D2
      source_type: INTERNAL
      formula: "D2_mill.bran * bran_dm_content"
      note: "Session 1B: WET→DM conversion (×0.88). Already at hub scope."

  gap_handling:
    method: purchase
    source: X1_Supply
    source_type: EXTERNAL
    note: "A-013: deficit filled by purchased feed from X1_Supply. Cost flows to E1 OpEx (feed purchases)."

  outputs:
    - name: feed_to_beef
      type: PRODUCT
      destination_node: A2

    - name: feed_to_dairy
      type: PRODUCT
      destination_node: B2

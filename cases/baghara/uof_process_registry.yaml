# =============================================================================
# UOF PROCESS REGISTRY — Level 1 Generic Process Definitions (v2)
# =============================================================================
# Version: 2.0
# Date: 2026-02-09
# Purpose: Data-driven process definitions for the generic mass balance engine.
#          Redesigned with centralized params, formula strings, product_handoff.
#
# CONVENTIONS (from MASS_BALANCE_GOVERNING_SCHEMA.yaml):
#   - Output types: PRODUCT | CO-PRODUCT | BY-PRODUCT | WASTE | LOSS
#   - Input sources: INTERNAL | EXTERNAL
#   - Boundary nodes: X1_Supply, X1_Sales, X2_Atmosphere, X3_Disposal, Z1_Fertility
#   - Validation: sum(output.ratio) == 1.0, sum(input.mass_fraction) == 1.0
#   - Basis: DM for biological livestock, WET for crop harvest quantities
#   - Logic: supply_driven (A-006: linear_transform) | demand_driven (A-006: pull_transform)
#
# STRUCTURE PER PROCESS:
#   params:    — all YAML path references in one place
#   derived:   — computed intermediates (ordered, may reference earlier derived)
#   driver:    — formula string → gross input quantity
#   seasonal_profile: — 12 monthly weights (Jan=idx 0, Dec=idx 11), must sum to 1.0
#                       Source: promoter harvest_months + agronomic calendar.
#                       All streams within a process follow the same profile.
#                       Engine multiplies annual driver × weight[m] for monthly breakdown.
#   inputs:    — what enters the process boundary
#   outputs:   — mass balance splits (ratio formulas, must sum to 1.0)
#   residue:   — optional sub-balance for crop residues
#   product_handoff: — optional, for livestock where DM balance ≠ physical product
#   head_count:      — optional, physical inventory (formula strings evaluated against namespace)
#
# FORMULA STRINGS:
#   All formulas are Python arithmetic evaluated against a namespace of
#   resolved param values + derived values. E.g., "1 - loss_pct" or
#   "target_finished_per_year * cycle_days / 365"
#
# PARAMETER REFERENCES:
#   Dotted paths resolved from uof_promoter_v2.yaml at runtime.
#   val() extracts base-case values (checks 'base', then 'value', then raw number).
# =============================================================================


# =============================================================================
# CHAIN C: OILSEEDS — UOF biological phase
# =============================================================================

C1_peanut:
  name: Peanut Production
  chain: C
  process_id: C1
  location: UOF
  phase: BIOLOGICAL
  logic: supply_driven
  template: production_split
  basis: WET

  seasonal_profile:
    # Promoter harvest_months: [9, 10]. Peanut is early-maturing rainfed.
    # Sep 35% (early harvest begins), Oct 65% (main harvest).
    # Source: Sahel agronomic calendar, Chad 13°N. Weights are analyst estimate.
    weights: [0, 0, 0, 0, 0, 0, 0, 0, 0.35, 0.65, 0, 0]
    confidence: high
    note: "Rainfed. Harvest Sep-Oct. Sep 35% / Oct 65% split is analyst estimate based on early-maturing variety."

  params:
    area_ha: oilseeds.crops.peanut.area_ha
    yield_t_per_ha: oilseeds.crops.peanut.yield_t_per_ha
    loss_pct: oilseeds.crops.peanut.loss_pct
    residue_ratio: feed.residues.peanut_hay.ratio_to_main
    dm_availability: feed.residue_dm_availability

  driver: "area_ha * yield_t_per_ha"

  inputs:
    - name: harvested_peanut
      source_node: X1_Supply
      source_type: EXTERNAL

  outputs:
    - name: net_grain
      type: PRODUCT
      destination_node: C2
      ratio: "1 - loss_pct"

    - name: grain_loss
      type: LOSS
      destination_node: X3_Disposal
      ratio: "loss_pct"

  residue:
    driver: "area_ha * yield_t_per_ha * residue_ratio"
    feed_value: high
    outputs:
      - name: residue_collected
        type: BY-PRODUCT
        destination_node: Z1_Fertility
        ratio: "dm_availability"

      - name: residue_field
        type: LOSS
        destination_node: Z1_Fertility
        ratio: "1 - dm_availability"



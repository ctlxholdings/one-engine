  logic: demand_driven
  template: partition
  basis: DM

  seasonal_profile:
    # Continuous year-round operation. Flat 1/12 per month.
    weights: [0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0837]
    confidence: high
    note: "Continuous throughput — cattle delivered year-round. Uniform monthly profile."

  params:
    target_finished_per_year: beef.target_finished_per_year
    cycle_days: beef.cycle_days
    fcr: beef.fcr
    dmd_pct: beef.dmd_pct
    mortality_pct: beef.mortality_pct
    entry_weight_kg: beef.entry_weight_kg
    adg_kg: beef.adg_kg

  derived:
    exit_weight_kg: "entry_weight_kg + adg_kg * cycle_days"
    capacity_head: "target_finished_per_year * cycle_days / 365"
    turnover: "365 / cycle_days"
    dmi_kg_per_head_per_day: "adg_kg * fcr"
    added_mass_kg: "exit_weight_kg - entry_weight_kg"
    steady_state_head: "target_finished_per_year * cycle_days / 365"
    total_input_t: "steady_state_head * dmi_kg_per_head_per_day * 365 / 1000"
    finished_net_mortality: "target_finished_per_year * (1 - mortality_pct)"
    live_weight_out_t: "finished_net_mortality * exit_weight_kg / 1000"
    calves_purchased_t: "target_finished_per_year * entry_weight_kg / 1000"
    added_mass_annual_t: "finished_net_mortality * added_mass_kg / 1000"

  driver: "total_input_t"

  inputs:
    - name: feed_dm
      source_node: A1
      source_type: INTERNAL

  outputs:
    - name: manure_dm
      type: BY-PRODUCT
      destination_node: Z1_Fertility
      ratio: "1 - dmd_pct"
      note: "Indigestible fraction of feed DM → fecal output. manure_dm = feed × (1 - dmd_pct)."

    - name: gas_losses_dm
      type: LOSS
      destination_node: X2_Atmosphere
      ratio: "dmd_pct"
      note: "Digestible DM oxidized to CO₂/CH₄/H₂O. Includes tiny body DM accrual (~2.4%). WET product (finished_cattle) tracked separately in product_handoff via ADG."

  product_handoff:
    basis: WET
    note: "Physical product ≠ DM balance output. Calf enters at 300kg, exits at 402kg (= 300 + 0.85 adg × 120 days). retained_dm ≈ WET weight gain proxy (FCR basis), not DM body accrual."
    inputs:
      - name: calves_purchased
        source_node: X1_Supply
        source_type: EXTERNAL
        mass: "calves_purchased_t"
    outputs:
      - name: finished_cattle
        type: PRODUCT
        destination_node: A3
        mass: "live_weight_out_t"

  head_count:
    target_finished_per_year: "target_finished_per_year"
    capacity_head: "capacity_head"
    turnover: "turnover"
    cycle_days: "cycle_days"
    finished_net_mortality: "finished_net_mortality"
    exit_weight_kg: "exit_weight_kg"
    fcr: "fcr"
    added_mass_kg: "added_mass_kg"
    added_mass_annual_t: "added_mass_annual_t"
    live_weight_out_t: "live_weight_out_t"
    calves_purchased_head: "target_finished_per_year"
    calves_purchased_t: "calves_purchased_t"


# =============================================================================
# CHAIN B: DAIRY — UOF biological phase (partition template)
# =============================================================================

B2_dairy:
  name: Dairy Herd
  chain: B
  process_id: B2
  location: UOF
  phase: BIOLOGICAL
  logic: demand_driven
  template: partition
  basis: DM

  seasonal_profile:
    # Continuous year-round operation. Flat 1/12 per month.
    weights: [0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0833, 0.0837]
    confidence: high
    note: "Continuous milking — dairy cows produce year-round. Uniform monthly profile."

  params:
    milking_cows: dairy.milking_cows
    dmi_kg_per_cow_per_day_lactating: dairy.dmi_kg_per_cow_per_day_lactating
    dmi_kg_per_cow_per_day_dry: dairy.dmi_kg_per_cow_per_day_dry
    lactation_days: dairy.lactation_days
    feed_to_milk_pct: dairy.feed_to_milk_pct
    feed_to_manure_pct: dairy.feed_to_manure_pct
    feed_to_metabolic_pct: dairy.feed_to_metabolic_pct
    milk_yield_L_per_day: dairy.milk_yield_L_per_day
    milk_density_kg_L: dairy.milk_density_kg_L
    calving_rate: dairy.calving_rate
    calf_survival_rate: dairy.calf_survival_rate
    calf_weaning_weight_kg: dairy.calf_weaning_weight_kg
    annual_cull_rate: dairy.annual_cull_rate
    cull_cow_weight_kg: dairy.cull_cow_weight_kg

  derived:
    dry_period_days: "365 - lactation_days"
    total_input_t: "milking_cows * (dmi_kg_per_cow_per_day_lactating * lactation_days + dmi_kg_per_cow_per_day_dry * dry_period_days) / 1000"
    raw_milk_t: "milking_cows * milk_yield_L_per_day * lactation_days * milk_density_kg_L / 1000"
    raw_milk_L: "milking_cows * milk_yield_L_per_day * lactation_days"
    calves_weaned: "milking_cows * calving_rate * calf_survival_rate"
    calves_mass_t: "calves_weaned * calf_weaning_weight_kg / 1000"
    cull_cows: "milking_cows * annual_cull_rate"
    cull_mass_t: "cull_cows * cull_cow_weight_kg / 1000"

  driver: "total_input_t"

  inputs:
    - name: feed_dm
      source_node: B1
      source_type: INTERNAL

  outputs:
    - name: milk_pathway_dm
      type: PRODUCT
      destination_node: B3
      ratio: "feed_to_milk_pct"
      note: "DM allocated to milk synthesis. Physical milk in product_handoff."

    - name: manure_dm
      type: BY-PRODUCT
      destination_node: Z1_Fertility
      ratio: "feed_to_manure_pct"

    - name: metabolic_loss_dm
      type: LOSS
      destination_node: X2_Atmosphere
      ratio: "feed_to_metabolic_pct"
      note: "CO2 + CH4 respiration"

  product_handoff:
    basis: WET
    note: "Physical products ≠ DM balance. Milk is 87% water. Calves and cull cows are co-products."
    outputs:
      - name: raw_milk
        type: PRODUCT
        destination_node: B3
        mass: "raw_milk_t"
      - name: calves_weaned
        type: CO-PRODUCT
        destination_node: X1_Sales
        mass: "calves_mass_t"
        note: "Routing TBD — could go to A2 feedlot or market"
      - name: cull_cows
        type: CO-PRODUCT
        destination_node: X1_Sales
        mass: "cull_mass_t"
        note: "Routing TBD — could go to A3 slaughter or market"

  head_count:
    milking_cows: "milking_cows"
    raw_milk_t: "raw_milk_t"
    raw_milk_L: "raw_milk_L"
    calves_weaned: "calves_weaned"
    calves_mass_t: "calves_mass_t"
    cull_cows: "cull_cows"
    cull_mass_t: "cull_mass_t"



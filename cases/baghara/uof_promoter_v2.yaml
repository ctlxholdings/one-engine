    confidence: high
    validation: validated
    note: "Feed pool split proportional to demand (beef vs dairy)."

  # --- Feed balance (mature year, base case) ---
  # Supply:
  #   Forage zone:  10 ha × 12 t DM/ha               = 120.0 t DM
  #   Peanut hay:   20 × 1.5 × 1.0 × 0.85 × 0.85    =  21.7 t DM
  #   Cowpea straw: 10 × 0.8 × 1.0 × 0.85 × 0.85    =   5.8 t DM
  #   Sorghum stover: 20 × 1.5 × 1.2 × 0.85 × 0.85  =  26.0 t DM

  #   Sesame straw: 10 × 0.6 × 0.8 × 0.85 × 0.85    =   3.5 t DM
  #   TOTAL SUPPLY:                                   = 203 t DM
  # Demand:
  #   Beef:  12.3 head × 10 kg/d × 365                =  45 t DM
  #   Dairy: 30 cows × (14×270 + 10×95) / 1000        = 142 t DM
  #   TOTAL DEMAND:                                    = 187 t DM
  # Balance: +16 t DM surplus (8.6%)



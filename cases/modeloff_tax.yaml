# ModelOff 2015 "Tax": monthly tax at changing rates, a loss pool, tax paid in instalments (plan step 7k).
#
# Source: ModelOff 2015 Round 1 Section 3 (data workbook MO15-Tax-Data and
# its solution, not in this repository); the rate table, the 132 monthly
# taxable profits and the ten verified answers (Q32-Q41) as transcribed in
# generic_engine/tests/test_benchmark_round3_tax_loss_pools.py, copied to
# cases/reference/modeloff_2015_tax.json by
# consolidation/experiments/make_reference_modeloff_tax.py, and to this file
# by make_case_modeloff_tax.py. tests/test_case_modeloff_tax.py re-checks
# the copy and re-derives the rates.
#
# Grid: 132 months, January 2015 (period 0) to December 2025.
#
# What the case does, and how it is assembled here:
#   * each month's taxable profit is stated; positive months are income
#     (offtake: price = the profit), negative months an expense
#     (operating_cost: unit_rate 1 x volume = the loss);
#   * the tax rate changes 12 times, some mid-month: a month's rate is the
#     average of the rates in force on its days (rate: one per month);
#   * a month's tax charge is its profit times its rate. A negative charge
#     goes to a loss pool held as tax, not as profit, so a loss saves tax
#     at the rate of the month it arose in (income_tax: losses_in: tax).
#     Losses do not expire (the test's variant: they do after two years);
#   * each calendar year's tax is paid the next year, 60% in April, 25% in
#     August and 15% in December (tax_instalments; the test's variant pays
#     70% in March, 10% in August and 20% in November). 2025's tax falls
#     due after the grid and stays payable.

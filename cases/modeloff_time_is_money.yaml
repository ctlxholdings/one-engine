# ModelOff 2014 "Time is Money": a US$ business valued for a euro buyer (plan step 7p).
#
# Source: ModelOff 2014 Round 2 Section 2 (the competition's data workbook,
# not in this repository); the forecast, indices, rates and seven answers as
# transcribed in generic_engine/tests/test_benchmark_round1_time_is_money.py,
# copied to cases/reference/modeloff_2014_time_is_money.json by
# consolidation/experiments/make_reference_modeloff_time_is_money.py, and to
# this file by make_case_modeloff_time_is_money.py.
#
# Grid: 24 years, 2014 (period 0, the valuation year end: the opening
# balance sheet only) to 2037. US$ millions, nominal.
#
# What the case does, and how it is assembled here:
#   * the forecast is stated in real US$; the generator inflates revenue,
#     operating cost and both classes of capex by the US$ index (inputs
#     layer). The books are kept in nominal US$, the business's currency;
#     the paper's euro figures are each year's US$ lines at that year's
#     nominal US$/EUR rate (a view, computed in the test: no line is
#     measured in euro, and the asset registers stay in US$);
#   * class A (700 at the start, then each year's capex) is depreciated at
#     40% of the declining balance with no cut-off, class B (450, then
#     capex) straight-line over 4 years, both from the year after they are
#     bought: one asset register per class, each on its own capex account
#     (capex_class). The case states no disposal: both registers are
#     written off in 2037, the last period, which no answer reads
#     (the write-off makes that year the only loss);
#   * tax is 40% of profit before tax, paid the same year (the waterfall's
#     tax tier); the rest of each year's cash goes to the owner;
#   * the NPV and the XNPV value the post-tax cash flows of years 1-10 at
#     10% (npv, xnpv through period 10). The test converts them to euro at
#     the spot rate.
case: modeloff-time-is-money
periods: 24
phases: [operate, fund, close, tax, pay]
currency: USD
floors:
  division.cash: 0
opening:
  division:
    class_a_assets: {nature: asset, value: 700}
    class_b_assets: {nature: asset, value: 450}
    retained_earnings: {nature: equity, value: balancing}

  tax:
    kind: income_tax
    entity: division
    phase: tax
    expense: tax_expense
    payable: tax_payable
    rate: 0.4
    carry_forward_periods: null       # years 1-22 make no loss (tested): the paper's "nothing on a loss" never applies to them
    scheme:
      sales.revenue: taxable
      costs.expense: taxable
      class_a_depreciation: taxable
      class_a_disposal: taxable
      class_b_depreciation: taxable
      class_b_disposal: taxable
